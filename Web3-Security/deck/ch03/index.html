<style>

@media (prefers-color-scheme: dark) {

    --gold: #f0b90b; --gold-soft: #3a3010; --accent: #6cc7e0; --accent-soft: #15303a; color-scheme: dark; }

:root[data-theme="dark"] { --ground: #131311; --paper: #1a1a17; --ink: #ebe9e2; --ink-2: #a5a298; --rule: #2f2e29; --tint: #23221e;
  --gold: #f0b90b; --gold-soft: #3a3010; --accent: #6cc7e0; --accent-soft: #15303a; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--ground); }
.top { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--rule); background: var(--paper); min-width: 0; }

.btn:hover { border-color: var(--gold); }
.btn[aria-pressed="true"] { background: var(--gold-soft); border-color: var(--gold); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn:disabled { opacity: .4; cursor: default; }

.body { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; }
.stagewrap { min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 14px; }
.screen { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 100%; overflow: hidden; border-radius: 12px; background: #efebe3;
  box-shadow: 0 1px 0 var(--rule), 0 8px 28px rgba(60, 50, 30, .14); cursor: pointer; touch-action: pan-y; user-select: none; }

.screen iframe.on { visibility: visible; }
.screen .still { position: absolute; inset: 0; background-repeat: no-repeat; background-color: #efebe3; }

.side { min-height: 0; overflow-y: auto; border-left: 1px solid var(--rule); background: var(--paper); padding: 18px 20px 24px; }
.sec { font-size: 12px; color: var(--accent); font-weight: 600; letter-spacing: .04em; }
.side h2 { margin: 4px 0 12px; font-family: var(--f-display); font-size: 22px; font-weight: 800; line-height: 1.4; text-wrap: balance; }

.notes { margin-top: 18px; border: 1px solid var(--rule); border-radius: 8px; }

.notes > summary::-webkit-details-marker { display: none; }
.notes > summary::before { content: "▸ "; }
.notes[open] > summary::before { content: "▾ "; }
.notes ol { margin: 0; padding: 4px 14px 10px 32px; font-size: 14px; color: var(--ink-2); }
.notes li { border: 0; padding: 2px 0; }
.notes li::before { display: none; }

.ctrl { display: flex; align-items: center; gap: 8px; padding: 8px 14px calc(8px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--rule); background: var(--paper); flex-wrap: wrap; }
.count { font-family: var(--f-mono); font-size: 13px; color: var(--ink-2); min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
.prog { flex: 1 1 240px; display: flex; gap: 3px; align-items: center; height: 30px; min-width: 160px; }
.prog .grp { display: flex; gap: 2px; flex: var(--n) 1 0; }
.prog .grp + .grp { margin-left: 6px; }
.prog button { flex: 1; height: 8px; padding: 0; border: 0; border-radius: 3px; background: var(--tint); cursor: pointer; }
.prog button.seen { background: var(--gold-soft); }
.prog button.cur { background: var(--gold); }
.prog button:hover { outline: 1px solid var(--gold); }
.speed { height: 34px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); padding: 0 6px; font-size: 13px; }

/* fullscreen: picture fills, text sits on the right */
.app:fullscreen .body { grid-template-columns: minmax(0, 1fr) 380px; }
.app:fullscreen .top { display: none; }

@media (max-width: 960px), (max-aspect-ratio: 4/3) {
  .body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }

  .screen { max-height: none; }
  .side { border-left: 0; border-top: 0; background: var(--ground); padding: 12px 14px 20px; }
  .side h2 { font-size: 19px; margin-bottom: 8px; }
  .hide-narrow { display: none; }
  .app:fullscreen .body { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .top { padding: 6px 10px; }
  .top h1 { font-size: 14px; }
  .ctrl { gap: 6px; padding-inline: 10px; }
  .prog { order: -1; flex-basis: 100%; }
  .btn { padding: 0 10px; }
}

(function () {
  var D = {"chapter": "s03", "title": "EVM 与 Solidity 安全基础：先看懂这台机器", "segs": 6, "slides": [{"seg": "1", "t0": 0.0, "t1": 21.13, "title": "管理员打开了钓鱼页面", "points": ["示例场景：管理员以为在领空投，实际调用了攻击者合约", "攻击者合约紧接着调用你的金库", "金库只检查一句：交易发起人必须是管理员"], "notes": ["先看一个示例场景。", "管理员的钱包，打开了一个钓鱼页面。", "他以为自己在领空投，实际调用了攻击者的合约。", "攻击者的合约，紧接着去调用你的金库。", "金库的权限检查只有一句：交易的发起人，必须是管理员。"], "section": "借来的身份", "k": 15.55}, {"seg": "1", "t0": 21.13, "t1": 23.47, "title": "先猜一道题", "points": ["这次调用，能通过吗？"], "notes": ["这次调用，能通过吗？"], "section": "借来的身份", "k": 23.47}, {"seg": "1", "t0": 23.47, "t1": 43.23, "title": "答案：能", "points": ["检查读的是 tx.origin：发起整笔交易的外部账户", "就是被骗的管理员，中间经过多少合约都不变", "攻击者没偷私钥，借用了管理员的身份"], "notes": ["能。", "这句检查读的是 tx.origin，也就是发起整笔交易的那个外部账户。", "在这里，就是被骗的管理员。中间经过多少个合约，它都不变。", "攻击者没有偷私钥。他借用了管理员的身份。"], "section": "借来的身份", "k": 43.23}, {"seg": "1", "t0": 43.23, "t1": 55.96, "title": "先看懂这台机器", "points": ["要看懂这一步，先要看懂 EVM", "本集三件事：谁在调用、数据存在哪、语言里的坑"], "notes": ["要看懂这一步，先要看懂这台机器，EVM。", "这一集讲三件事：谁在调用，数据存在哪，语言里有哪些坑。"], "section": "借来的身份", "k": 55.96}, {"seg": "2", "t0": 0.0, "t1": 13.59, "title": "EVM：单线程栈式计算机", "points": ["每个合约有自己的代码和存储", "合约之间靠消息调用通信", "每一次调用，都可能把控制权交给别人"], "notes": ["EVM 是一台单线程的栈式计算机。每个合约，有自己的代码和存储。", "合约之间，靠消息调用来通信。每一次调用，都可能把控制权交给别人。"], "section": "调用上下文", "k": 13.59}, {"seg": "2", "t0": 13.59, "t1": 25.77, "title": "两类账户", "points": ["外部账户 EOA：由私钥控制，能主动发起交易", "合约账户：由代码控制，只能被调用"], "notes": ["链上有两类账户。", "外部账户叫 EOA，由私钥控制，能主动发起交易。", "合约账户由代码控制，不能主动发起，只能被调用。"], "section": "调用上下文", "k": 25.77}, {"seg": "2", "t0": 25.77, "t1": 47.09, "title": "EIP-7702 模糊了界线", "points": ["2025 年 5 月 Pectra 升级，EOA 可委托执行合约代码", "查对方有没有代码，已不能判断是不是普通用户", "比较 msg.sender 和 tx.origin 也不行"], "notes": ["但这条界线在变。2025 年 5 月，以太坊 Pectra 升级上线了 EIP-7702，EOA 可以委托执行一段合约代码。", "所以，查对方有没有代码，已经不能判断它是不是普通用户。比较 msg.sender 和 tx.origin，也不行。"], "section": "调用上下文", "k": 33.32}, {"seg": "2", "t0": 47.09, "t1": 56.25, "title": "调用上下文", "points": ["用户调用 A，A 调用 B，B 再调用 C", "站在 C 的位置，看四个变量"], "notes": ["再看调用上下文。假设用户调用合约 A，A 调用 B，B 再调用 C。", "站在 C 的位置，看四个变量。"], "section": "调用上下文", "k": 56.25}, {"seg": "2", "t0": 56.25, "t1": 81.91, "title": "站在 C 看四个变量", "points": ["tx.origin 是发起交易的用户；msg.sender 是直接调用者 B", "msg.value 是附带的原生币；address(this) 是 C", "开头的金库该看 msg.sender，不是 tx.origin"], "notes": ["tx.origin，是发起整笔交易的用户。", "msg.sender，是直接调用 C 的那一个，也就是 B。", "msg.value，是这次调用附带的原生币，也就是 B 转给 C 的数量。", "address(this)，是当前执行代码的合约，也就是 C 自己。", "开头那个金库，该看的是 msg.sender，不是 tx.origin。"], "section": "调用上下文", "k": 81.91}, {"seg": "2", "t0": 81.91, "t1": 103.67, "title": "三种调用：前两种", "points": ["call：执行 B 的代码，改 B 的存储", "delegatecall：执行 B 的代码，改 A 的存储", "msg.sender、msg.value 不变，代理和库合约依赖它"], "notes": ["合约之间怎么调用？有三种方式。", "第一种 call，最常见。执行 B 的代码，改的是 B 的存储。", "第二种 delegatecall。执行的还是 B 的代码，改的却是 A 的存储。", "而且 msg.sender 和 msg.value 保持不变。代理合约和库合约，都依赖它。"], "section": "调用上下文", "k": 103.67}, {"seg": "2", "t0": 103.67, "t1": 125.51, "title": "一个窗口的政务大厅", "points": ["每个合约是一个科室", "call：派人带材料去 B 的窗口办事", "delegatecall：借 B 的手册在 A 的档案柜上照办"], "notes": ["打个比方。EVM 像一个只有一个窗口的政务大厅，每个合约是一个科室。", "call，是派人带着材料，去 B 的窗口办事。", "delegatecall，是把 B 的规程手册借过来，在 A 自己的档案柜上照着办。", "如果手册写着，清空 0 号抽屉，被清空的是 A 的抽屉。"], "section": "调用上下文", "k": 125.51}, {"seg": "2", "t0": 125.51, "t1": 140.51, "title": "比方不成立：可以插队", "points": ["真实大厅里，离开窗口就不能插队回来", "EVM 里 B 办到一半可以反过来再找 A", "A 的上一件事还没办完，这就是重入"], "notes": ["这个比方有一处不成立。真实的大厅里，你离开窗口，就不能插队回来。", "EVM 里，B 办到一半，可以反过来再找 A。这时 A 的上一件事，还没办完。这就是重入。"], "section": "调用上下文", "k": 132.06}, {"seg": "2", "t0": 140.51, "t1": 155.48, "title": "只读调用与低级调用", "points": ["staticcall 只读，写存储或发事件都会回滚", "低级 call 失败不会让调用者回滚，只返回 false"], "notes": ["第三种 staticcall，是只读调用。任何写存储或发事件的操作，都会回滚。", "还有一个坑。低级 call 失败时，不会自动让调用者回滚，只返回 false。"], "section": "调用上下文", "k": 154.56}, {"seg": "3", "t0": 0.0, "t1": 18.93, "title": "存储：一排抽屉柜", "points": ["每个合约有一张巨大的键值表，键和值都是 32 字节", "键叫槽位，从 0 号开始编号"], "notes": ["接下来，看数据存在哪里。", "每个合约都有一张巨大的键值表，叫存储。键和值都是 32 字节，键叫做槽位。", "可以把它想成一排抽屉柜。每个抽屉 32 字节，从 0 号开始编号。"], "section": "存储槽", "k": 2.05}, {"seg": "3", "t0": 18.93, "t1": 31.05, "title": "按顺序放，能打包就打包", "points": ["状态变量按声明顺序从 0 号槽开始放", "相邻变量合计不超过 32 字节，就打包进同一个槽"], "notes": ["规则一，状态变量按声明顺序，从 0 号槽开始放。", "规则二，相邻的变量加起来不超过 32 字节，编译器就把它们打包进同一个槽。"], "section": "存储槽", "k": 31.05}, {"seg": "3", "t0": 31.05, "t1": 54.49, "title": "打包示例：放不下就顺延", "points": ["owner 20 字节、paused 1 字节，都进 0 号槽", "fee 12 字节，合计 33 放不下，去了 1 号槽", "total 顺延到 2 号槽"], "notes": ["看一个例子。owner 是地址，占 20 字节，放进 0 号槽。", "paused 是布尔值，占 1 字节，也挤进 0 号槽。", "fee 是 96 位整数，占 12 字节。20 加 1 加 12 是 33，放不下了。", "所以 fee 去了 1 号槽，total 顺延到 2 号槽。"], "section": "存储槽", "k": 42.6}, {"seg": "3", "t0": 54.49, "t1": 71.09, "title": "改一个类型，全部错位", "points": ["fee 改成 88 位，三个变量正好 32 字节挤进 0 号槽", "total 从 2 号槽挪到 1 号槽", "代理升级时，后面的变量会全部错位"], "notes": ["如果把 fee 改成 88 位，也就是 11 字节，三个变量正好 32 字节，全部挤进 0 号槽。", "total 就从 2 号槽，挪到了 1 号槽。代理升级时，这种挪动会让后面的变量全部错位。"], "section": "存储槽", "k": 66.79}, {"seg": "3", "t0": 71.09, "t1": 90.71, "title": "mapping、数组与常量", "points": ["mapping 自己占一个空槽，元素在键和槽号的哈希处", "动态数组的槽存长度，元素从槽号的哈希往后排", "常量和不可变量不占存储槽"], "notes": ["规则三，mapping 自己占一个槽，这个槽是空的。元素放在键和槽号一起哈希出来的位置。", "规则四，动态数组的槽里存长度。元素从槽号的哈希开始，依次往后排。", "规则五，常量和不可变量，不占存储槽。"], "section": "存储槽", "k": 74.39}, {"seg": "3", "t0": 90.71, "t1": 112.09, "title": "存储错位：代理与升级", "points": ["代理和实现变量顺序不一致，写 owner 改了实现地址", "升级时中间插入新变量，余额可能被当成地址读"], "notes": ["为什么这是安全问题？看四个场景。", "第一，代理合约和实现合约的变量顺序不一致。实现合约以为在写 owner，实际改写了代理的实现地址。", "第二，升级时在中间插入新变量。后面的变量全部错位，余额可能被当成地址来读。"], "section": "存储槽", "k": 94.01}, {"seg": "3", "t0": 112.09, "t1": 139.36, "title": "读存储与改写槽位", "points": ["private 存密码或种子，RPC 读存储就能看到", "delegatecall 不受信任合约，可改写任意槽甚至自毁", "EIP-1967 用哈希算出固定槽位，避免冲突"], "notes": ["第三，用 private 变量存密码或种子。任何人通过 RPC 读一下存储，就能看到。", "第四，用 delegatecall 去调用不受信任的合约。对方的代码可以改写你的任何槽位，甚至让合约自毁。", "所以 EIP-1967 给代理定了固定的槽位。用哈希算出一个看起来随机的位置，避免和实现合约冲突。"], "section": "存储槽", "k": 139.36}, {"seg": "4", "t0": 0.0, "t1": 19.73, "title": "一、private 不是秘密", "points": ["最易误解的 8 个特性：误解、事实、影响", "private 只限制其他合约调用，存储完全公开", "所以不能存秘密"], "notes": ["下面是最容易误解的 8 个语言特性。每个都看三件事：误解，事实，影响。", "一，private。误解是别人看不到。",     $('prev').disabled = cur === 0;
    $('next').textContent = cur === N - 1 ? '回到正文 ›' : '下一页 ›';
    $('replay').textContent = playing ? '⟳ 从头播放' : (screen.classList.contains('live') ? '⟳ 再看一遍' : '▶ 看过程');
    S.forEach(function (x, i) { x.dot.className = i === cur ? 'cur' : (seen[i] ? 'seen' : ''); });
  }
  function show(i) {
    if (i < 0 || i >= N) return;
    cur = i; seen[i] = 1; store.set(KEY, i); store.set(KEY + '-seen', JSON.stringify(seen));
    playing = false; pending = {};
    tile(i); still.setAttribute('aria-label', S[i].title);
    screen.classList.remove('live'); $('wait').textContent = sheetReady ? '载入动画…' : '载入画面…'; $('wait').hidden = sheetReady;
    for (var k in frames) frames[k].classList.remove('on');
    paint();
  }
  function next() { if (cur === N - 1) { back(); return; } show(cur + 1); }
  function prev() { show(cur - 1); }
  function back() {
    if (parent !== window) parent.postMessage({ cexNav: D.chapter }, '*');
    else location.href = '../../index.html#' + D.chapter;
  }
  function fullscreen() {
    var a = $('app');
    if (document.fullscreenElement) document.exitFullscreen(); else if (a.requestFullscreen) a.requestFullscreen().catch(function () {});
  }
  if (!document.fullscreenEnabled) $('fs').hidden = true;

  $('next').onclick = next; $('prev').onclick = prev; $('replay').onclick = process;
  $('back').onclick = back; $('fs').onclick = fullscreen;
  addEventListener('keydown', function (e) {
    if (e.target.tagName === 'SELECT' || e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { e.preventDefault(); next(); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); prev(); }
    else if (k === 'p' || k === 'P' || k === 'r' || k === 'R') process();
    else if (k === 'f' || k === 'F') fullscreen();
    else if (k === 'n' || k === 'N') $('notes').open = !$('notes').open;
    else if (k === 'Home') show(0);
    else if (k === 'End') show(N - 1);
  });
  // tap = next; horizontal swipe = next / previous
  var x0 = null, y0 = null;
  screen.addEventListener('pointerdown', function (e) { x0 = e.clientX; y0 = e.clientY; });
  screen.addEventListener('pointerup', function (e) {
    if (x0 === null) return;
    var dx = e.clientX - x0, dy = e.clientY - y0; x0 = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { dx < 0 ? next() : prev(); }
    else if (Math.abs(dx) < 8 && Math.abs(dy) < 8) next();
  });

  var start = +store.get(KEY); if (!(start >= 0 && start < N)) start = 0;
  show(start);
})();
</script>
</body>
