<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>审计、测试与开发流程：把安全写进流水线</title>
<style>
:root {
  --ground: #f6f5f1; --paper: #fffefb; --ink: #1d1c19; --ink-2: #5d5a52; --rule: #e4e1d8; --tint: #efece4;
  --gold: #b38300; --gold-soft: #f8edcc; --accent: #1d93ba; --accent-soft: #e1f1f7;
  --f-display: "Noto Serif SC", "Songti SC", "STSong", serif;
  --f-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --ground: #131311; --paper: #1a1a17; --ink: #ebe9e2; --ink-2: #a5a298; --rule: #2f2e29; --tint: #23221e;
    --gold: #f0b90b; --gold-soft: #3a3010; --accent: #6cc7e0; --accent-soft: #15303a; color-scheme: dark; }
}
:root[data-theme="dark"] { --ground: #131311; --paper: #1a1a17; --ink: #ebe9e2; --ink-2: #a5a298; --rule: #2f2e29; --tint: #23221e;
  --gold: #f0b90b; --gold-soft: #3a3010; --accent: #6cc7e0; --accent-soft: #15303a; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 6px; }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--ground); }
.top { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--rule); background: var(--paper); min-width: 0; }
.top .t { flex: 1; min-width: 0; }
.top .eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; color: var(--gold); }
.top h1 { margin: 0; font-family: var(--f-display); font-size: 16px; font-weight: 800; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn { height: 34px; padding: 0 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); cursor: pointer; white-space: nowrap; font-size: 14px; }
.btn:hover { border-color: var(--gold); }
.btn[aria-pressed="true"] { background: var(--gold-soft); border-color: var(--gold); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn:disabled { opacity: .4; cursor: default; }

.body { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; }
.stagewrap { min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 14px; }
.screen { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 100%; overflow: hidden; border-radius: 12px; background: #efebe3;
  box-shadow: 0 1px 0 var(--rule), 0 8px 28px rgba(60, 50, 30, .14); cursor: pointer; touch-action: pan-y; user-select: none; }
.screen iframe { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; transform-origin: 0 0; visibility: hidden; pointer-events: none; }
.screen iframe.on { visibility: visible; }
.screen .wait { position: absolute; inset: 0; display: grid; place-items: center; color: #8a826f; font-size: 14px; background: #efebe3; }
.screen .wait[hidden] { display: none; }

.side { min-height: 0; overflow-y: auto; border-left: 1px solid var(--rule); background: var(--paper); padding: 18px 20px 24px; }
.sec { font-size: 12px; color: var(--accent); font-weight: 600; letter-spacing: .04em; }
.side h2 { margin: 4px 0 12px; font-family: var(--f-display); font-size: 22px; font-weight: 800; line-height: 1.4; text-wrap: balance; }
.side ul { margin: 0; padding: 0; list-style: none; }
.side li { position: relative; padding: 6px 0 6px 18px; border-top: 1px solid var(--rule); }
.side li:first-child { border-top: 0; }
.side li::before { content: ""; position: absolute; left: 2px; top: 16px; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
.notes { margin-top: 18px; border: 1px solid var(--rule); border-radius: 8px; }
.notes > summary { cursor: pointer; padding: 8px 12px; font-size: 13px; font-weight: 600; color: var(--ink-2); list-style: none; }
.notes > summary::-webkit-details-marker { display: none; }
.notes > summary::before { content: "▸ "; }
.notes[open] > summary::before { content: "▾ "; }
.notes ol { margin: 0; padding: 4px 14px 10px 32px; font-size: 14px; color: var(--ink-2); }
.notes li { border: 0; padding: 2px 0; }
.notes li::before { display: none; }

.ctrl { display: flex; align-items: center; gap: 8px; padding: 8px 14px calc(8px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--rule); background: var(--paper); flex-wrap: wrap; }
.count { font-family: var(--f-mono); font-size: 13px; color: var(--ink-2); min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
.prog { flex: 1 1 240px; display: flex; gap: 3px; align-items: center; height: 30px; min-width: 160px; }
.prog .grp { display: flex; gap: 2px; flex: var(--n) 1 0; }
.prog .grp + .grp { margin-left: 6px; }
.prog button { flex: 1; height: 8px; padding: 0; border: 0; border-radius: 3px; background: var(--tint); cursor: pointer; }
.prog button.seen { background: var(--gold-soft); }
.prog button.cur { background: var(--gold); }
.prog button:hover { outline: 1px solid var(--gold); }
.speed { height: 34px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); padding: 0 6px; font-size: 13px; }

/* fullscreen: picture fills, text sits on the right */
.app:fullscreen .body { grid-template-columns: minmax(0, 1fr) 380px; }
.app:fullscreen .top { display: none; }

@media (max-width: 960px), (max-aspect-ratio: 4/3) {
  .body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .stagewrap { padding: 10px 10px 0; }
  .screen { max-height: none; }
  .side { border-left: 0; border-top: 0; background: var(--ground); padding: 12px 14px 20px; }
  .side h2 { font-size: 19px; margin-bottom: 8px; }
  .hide-narrow { display: none; }
  .app:fullscreen .body { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .top { padding: 6px 10px; }
  .top h1 { font-size: 14px; }
  .ctrl { gap: 6px; padding-inline: 10px; }
  .prog { order: -1; flex-basis: 100%; }
  .btn { padding: 0 10px; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="t"><div class="eyebrow" id="eyebrow">拟物化知识讲解</div><h1 id="title"></h1></div>
    <button class="btn" id="back" title="回到文字章节">正文 ↗</button>
    <button class="btn hide-narrow" id="fs" title="全屏（F）">⛶ 全屏</button>
  </header>
  <div class="body">
    <div class="stagewrap"><div class="screen" id="screen" role="img" aria-live="polite"><div class="wait" id="wait">载入动画…</div></div></div>
    <aside class="side" aria-live="polite">
      <div class="sec" id="sec"></div>
      <h2 id="stitle"></h2>
      <ul id="points"></ul>
      <details class="notes" id="notes"><summary>讲稿（N）</summary><ol id="lines"></ol></details>
    </aside>
  </div>
  <nav class="ctrl" aria-label="翻页">
    <button class="btn" id="prev" aria-label="上一页（←）">‹ 上一页</button>
    <button class="btn" id="replay" aria-label="重播本页动画（R）">⟳ 重播</button>
    <button class="btn primary" id="next" aria-label="下一页（→ 或空格）">下一页 ›</button>
    <span class="count" id="count"></span>
    <div class="prog" id="prog"></div>
    <select class="speed" id="speed" aria-label="动画速度">
      <option value="1">1×</option><option value="1.5" selected>1.5×</option><option value="2">2×</option><option value="4">4×</option>
    </select>
  </nav>
</div>

(function () {
  var D = {"chapter": "s27", "title": "审计、测试与开发流程：把安全写进流水线", "segs": 6, "slides": [{"seg": "1", "t0": 0.0, "t1": 15.25, "title": "PancakeBunny：审计过", "points": ["2021 年 5 月，PancakeBunny 被攻击，损失约 4500 万美元", "这个项目，做过审计", "审计方称：被利用的代码，是审计之后才上线的版本"], "notes": ["2021 年 5 月，PancakeBunny 被攻击，损失约 4500 万美元。", "这个项目，做过审计。", "可审计方事后说明，被利用的那份代码，是审计之后才上线的版本。"], "section": "审计过也被打穿"}, {"seg": "1", "t0": 15.25, "t1": 33.65, "title": "审的和跑的不是一份", "points": ["审计看的是一份代码，链上跑的是另一份", "审计本身没有失败，出问题的是审计和上线之间那一段", "项目上线时常说：我们通过了审计"], "notes": ["审计看的是一份代码，链上跑的是另一份。", "攻击，就发生在那个没被审过的版本上。", "审计本身没有失败，出问题的，是审计和上线之间的那一段。", "项目上线时，常常会说一句，我们通过了审计。"], "section": "审计过也被打穿"}, {"seg": "1", "t0": 33.65, "t1": 56.16, "title": "先猜一道题", "points": ["「我们通过了审计」，能证明线上代码安全吗？", "审计报告证明的，到底是哪一份代码？", "审计之后改过的代码，谁来看？"], "notes": ["先猜一道题。", "项目方能不能用，我们通过了审计，来证明线上的代码是安全的？", "想一想，审计报告证明的，到底是哪一份代码。", "还有，审计之后改过的代码，谁来看？", "带着这两个问题，我们看看，安全怎样写进开发的每一步。"], "section": "审计过也被打穿"}, {"seg": "2", "t0": 0.0, "t1": 14.43, "title": "审计是一个关口", "points": ["审计不是安全的起点，也不是终点", "它是流水线上的一个关口", "之前要有设计和测试，之后要有监控和应急"], "notes": ["先给一句准确的说法。", "审计不是安全的起点，也不是终点。", "它是流水线上的一个关口。", "它之前要有设计和测试，之后要有监控和应急。"], "section": "八道关口"}, {"seg": "2", "t0": 14.43, "t1": 39.21, "title": "比喻：造一架飞机", "points": ["画图纸：写下任何情况下机翼都不能断；零件出厂前测，再进风洞", "适航认证不查每一颗螺丝，只抽查关键系统", "上天以后有黑匣子和地面雷达，出事有应急程序"], "notes": ["打个比方，合约开发像造一架飞机。", "设计时画图纸，写下任何情况下机翼都不能断。", "每个零件出厂前都要测，还要放进风洞，用各种极端风向去吹。", "外部机构做适航认证，它不查每一颗螺丝，只抽查关键系统。", "飞上天以后，有黑匣子和地面雷达，出了事有应急程序。"], "section": "八道关口"}, {"seg": "2", "t0": 39.21, "t1": 50.97, "title": "比方不成立：无法召回", "points": ["飞机出厂后，还能召回维修", "不可升级的合约，部署之后就再也不能修改", "所以前面的关口，必须更严"], "notes": ["这个比方有一处不成立。", "飞机出厂后，还能召回维修。", "不可升级的合约，部署之后，就再也不能修改。", "所以前面的关口，必须更严。"], "section": "八道关口"}, {"seg": "2", "t0": 50.97, "t1": 73.67, "title": "八个关口", "points": ["规格与威胁模型、安全编码规范、静态分析", "单元/模糊/不变量测试、关键模块形式化验证", "外部审计或竞赛、安全部署与权限移交、监控赏金应急保险"], "notes": ["把这条流水线展开，一共八个关口。", "规格与威胁模型，安全编码规范，静态分析。", "单元、模糊和不变量测试，关键模块的形式化验证。", "外部审计或竞赛，安全部署与权限移交。", "最后是监控、漏洞赏金、应急响应和保险。"], "section": "八道关口"}, {"seg": "2", "t0": 73.67, "t1": 107.44, "title": "越靠左越便宜，但有前提", "points": ["规格阶段发现的问题只要改文档；自动检查每次提交都跑", "静态分析每个告警都有结论；审计发现要反过来补成测试", "前提是你想到了要查什么；经济与组合风险常要专门经济审计"], "notes": ["越靠左的关口，修复越便宜，规格阶段发现的问题，只要改文档。", "静态分析、测试和形式化验证是自动的，每次提交代码都该跑一遍。", "静态分析误报多，不求零告警，要求每个告警都有结论。", "审计发现的问题，要反过来补成测试，防止以后再犯。", "但所有关口都有一个前提，你想到了要检查什么。", "经济攻击和跨协议的组合风险，常常要专门的经济审计。"], "section": "八道关口"}, {"seg": "3", "t0": 0.0, "t1": 19.87, "title": "先写清楚测什么", "points": ["每个函数调用前要满足什么，调用后保证什么", "系统的不变量：任何时候都必须成立的性质", "每个特权角色，最多能造成多大破坏"], "notes": ["测试之前，先要写清楚测什么。", "规格里，写出每个函数调用前要满足什么，调用后保证什么。", "再写出系统的不变量，也就是任何时候都必须成立的性质。", "还要列出每个特权角色，最多能造成多大破坏。"], "section": "测试三层"}, {"seg": "3", "t0": 19.87, "t1": 26.71, "title": "第一层：单元测试", "points": ["测试分三层", "单元测试，验证你想到的情况"], "notes": ["有了这些，测试分三层。", "第一层，单元测试，验证你想到的情况。"], "section": "测试三层"}, {"seg": "3", "t0": 26.71, "t1": 48.77, "title": "第二层：模糊测试", "points": ["工具生成大量随机输入，比如金库存进去马上取出来", "只要有一个金额让取回的比存入的多，测试就失败", "背后的规则：舍入必须偏向金库"], "notes": ["第二层，模糊测试，让工具生成大量随机输入。", "比如一个金库，存进去，马上取出来，用户不能多拿。", "工具会换着各种随机金额，一遍遍去试。", "只要有一个金额，让取回的比存入的多，测试就失败。", "这条性质背后的规则是，舍入必须偏向金库。"], "section": "测试三层"}, {"seg": "3", "t0": 48.77, "t1": 65.67, "title": "第三层：不变量测试", "points": ["随机的不是参数，是调用的顺序", "存款、取款、转账被随机组合着连续调用", "每一步后检查：银行余额不少于所有存款之和"], "notes": ["第三层，不变量测试，随机的不是参数，是调用的顺序。", "比如一个银行合约，存款、取款、转账，被随机组合着连续调用。", "每一步之后都检查一次，银行的余额，不少于所有存款加起来。"], "section": "测试三层"}, {"seg": "3", "t0": 65.67, "t1": 76.29, "title": "先猜一道题", "points": ["重入漏洞：先调用存款，再在回调里调用转账才触发", "只随机参数的模糊测试，能发现它吗？"], "notes": ["先猜一道题。", "一个重入漏洞，要先调用存款，再在回调里调用转账，才会触发。", "只随机参数的模糊测试，能发现它吗？"], "section": "测试三层"}, {"seg": "3", "t0": 76.29, "t1": 86.17, "title": "通常不能", "points": ["模糊测试不会打乱调用顺序", "不变量测试生成随机调用序列，配上能触发回调的封装合约，才有机会"], "notes": ["通常不能，因为它不会打乱调用顺序。", "不变量测试生成随机调用序列，再配上能触发回调的封装合约，才有机会发现。"], "section": "测试三层"}, {"seg": "3", "t0": 86.17, "t1": 101.31, "title": "只查你写下的不变量", "points": ["Euler 那一条：健康因子不低于 1 或能被清算，且清算后协议不亏", "如果它没写进测试，工具也不会发现"], "notes": ["但要注意，不变量测试只检查你写下的不变量。", "Euler 事故里那一条，每个账户健康因子不低于 1，或者能被清算，而且清算后协议不亏。", "如果它没写进测试，工具也不会发现。"], "section": "测试三层"}, {"seg": "3", "t0": 101.31, "t1": 118.1, "title": "形式化验证", "points": ["核心数学库、清算逻辑、跨链桥的证明验证", "用数学方法证明，代码在所有输入和状态下都满足规格", "代价：规格难写，需要专门的人才"], "notes": ["核心数学库、清算逻辑、跨链桥的证明验证，还可以再做形式化验证。", "它用数学方法证明，代码在所有输入和状态下都满足规格。", "代价是规格难写，需要专门的人才。"], "section": "测试三层"}, {"seg": "4", "t0": 0.0, "t1": 19.23, "title": "外部审计：冻结与交接", "points": ["审计期间冻结代码，审计对象是某一个提交哈希", "把规格、威胁模型、已知风险和测试覆盖率交给审计方", "关键协议请两家以上审计，各有侧重"], "notes": ["测试做足了，才轮到外部审计。", "审计期间冻结代码，审计的对象，是某一个提交哈希。", "把规格、威胁模型、已知风险和测试覆盖率，一起交给审计方。", "关键协议，请两家以上审计，各有侧重。"], "section": "审计与上线"}, {"seg": "4", "t0": 19.23, "t1": 43.23, "title": "竞赛、复审与编译器", "points": ["可在 Code4rena、Sherlock、Cantina 办审计竞赛，覆盖面更广", "修复也可能带来新漏洞，修完要复审；记下编译器版本查已知 bug", "审计之后，范围内的代码一个字都不能再改"], "notes": ["也可以在 Code4rena、Sherlock、Cantina 这类平台办审计竞赛，覆盖面更广。", "修复本身也可能带来新漏洞，所以修完要复审。", "编译器版本也要记下来，查它有没有已知 bug，2023 年的 Vyper 事故，就出在编译器上。", "审计之后，审计范围内的代码，一个字都不能再改。"], "section": "审计与上线"}, {"seg": "4", "t0": 43.23, "t1": 68.65, "title": "部署与权限移交", "points": ["用脚本部署，脚本也要评审；部署和初始化放在同一笔交易", "区块浏览器验证源码，再用脚本读出关键参数和预期对比", "权限移交给多签和时间锁，撤销部署账户的所有角色"], "notes": ["接着是部署。", "用脚本部署，不手动操作，脚本本身也要评审。", "部署和初始化，放在同一笔交易里完成。", "部署后在区块浏览器上验证源码，再跑一个验证脚本，把关键参数逐个读出来，和预期对比。", "最后，把权限从部署账户移交给多签和时间锁，撤销部署账户的所有角色。"], "section": "审计与上线"}, {"seg": "4", "t0": 68.65, "t1": 86.89, "title": "在目标链上测", "points": ["在以太坊上测过，不代表在目标链上能跑", "BNB Chain：BSC-USD 精度 18 位", "出块间隔 0.45 秒，相邻区块的秒级时间戳可能一样"], "notes": ["还有一件常被跳过的事，在目标链上测。", "在以太坊上测过，不代表在目标链上能跑。", "在 BNB Chain 上，BSC-USD 的精度是 18 位。", "出块间隔是 0.45 秒，相邻两个区块的秒级时间戳，可能一样。"], "section": "审计与上线"}, {"seg": "4", "t0": 86.89, "t1": 111.04, "title": "TRON 与 Mantle", "points": ["TRON：实测 USDT 转账返回值，去 Nile 或 Shasta 测试网跑", "Mantle：附带的原生币是 MNT，ETH 只是 ERC-20 代币", "部署前在目标链测试网或主网分叉上跑完整测试"], "notes": ["在 TRON 上，要实测 USDT 转账的返回值，去 Nile 或 Shasta 测试网跑，不要只用本地 EVM。", "在 Mantle 上，随交易附带的原生币是 MNT，ETH 只是一个 ERC-20 代币。", "部署前，在目标链的测试网或者主网分叉上，把完整测试跑一遍。"], "section": "审计与上线"}, {"seg": "5", "t0": 0.0, "t1": 11.49, "title": "上线后：盯着与赏金", "points": ["上线不是终点，合约上线后要有人一直盯着", "开漏洞赏金，让白帽有动力先来报告"], "notes": ["上线不是终点。", "合约上线以后，要有人一直盯着。", "同时开一个漏洞赏金，让发现问题的白帽，有动力先来报告。"], "section": "监控与应急"}, {"seg": "5", "t0": 11.49, "t1": 38.11, "title": "盯什么", "points": ["锁仓总量突然下跌；同一笔交易里大额闪电贷加本协议调用", "管理员函数被调用、实现地址变了、时间锁队列多了新操作", "预言机偏离或超时未更新；跨链锁定量和铸造量对不上"], "notes": ["盯什么？锁仓总量突然下跌，比如 10 分钟内跌了超过 10%。", "同一笔交易里，出现大额闪电贷和本协议的调用。", "任何管理员函数被调用，实现地址变了，时间锁队列里多了新操作。", "预言机价格偏离其他来源，或者超过心跳时间没有更新。", "跨链两侧，锁定量和铸造量对不上。"], "section": "监控与应急"}, {"seg": "5", "t0": 38.11, "t1": 56.11, "title": "应急：确认、暂停、作战室", "points": ["值班人员先确认异常", "确认后触发暂停，守护者的暂停权限没有延迟", "组建作战室：开发、审计方、安全响应团队（如 SEAL 911）"], "notes": ["告警响起，接下来是应急流程。", "值班人员先确认异常。", "确认后触发暂停，守护者的暂停权限没有延迟。", "然后组建作战室，里面有开发和审计方，还有安全响应团队，比如 SEAL 911 这类社区应急组织。"], "section": "监控与应急"}, {"seg": "5", "t0": 56.11, "t1": 67.97, "title": "应急：救援、冻结、复盘", "points": ["评估白帽救援，抢先把剩余资金转到安全的地方", "联系交易所和稳定币发行方，冻结被盗资金", "最后发布公告和复盘"], "notes": ["评估能不能白帽救援，抢先把剩余资金转到安全的地方。", "联系交易所和稳定币发行方，冻结被盗资金。", "最后发布公告和复盘。"], "section": "监控与应急"}, {"seg": "5", "t0": 67.97, "t1": 91.2, "title": "mETH 追回 cmETH", "points": ["Bybit 事故里，mETH 协议追回了 cmETH", "靠提款延迟、暂停权限、外部安全社区快速牵线", "没有一样是出事当天才能加上的，应急能力要事先设计进合约"], "notes": ["看一个例子。", "在 Bybit 事故里，mETH 协议追回了 cmETH。", "靠的是三样东西，协议本身有提款延迟，团队有暂停权限，外部安全社区快速牵线。", "这三样，没有一样是出事当天才能加上的。", "应急能力，要事先设计进合约。"], "section": "监控与应急"}, {"seg": "6", "t0": 0.0, "t1": 27.69, "title": "按角色各做一件事", "points": ["开发者：给核心合约写下一条不变量，让测试去检查它", "审计与评审：核对审计版本的提交哈希和线上字节码是否同一份", "负责人：今晚出事，谁有权按暂停，他自己知道吗？"], "notes": ["最后，按角色各做一件事。", "先对照八个关口问一句，哪一个是你们跳过的？", "开发者，今天就给你的核心合约，写下一条不变量，让测试去检查它。", "做审计和评审的人，核对审计版本的提交哈希，和线上字节码是不是同一份。", "项目负责人，回答一个问题，如果今晚出事，谁有权按下暂停，他自己知道吗？"], "section": "写进流水线"}, {"seg": "6", "t0": 27.69, "t1": 33.69, "title": "回到开头的问题", "points": ["「我们通过了审计」，能证明线上代码安全吗？"], "notes": ["回到开头的问题。", "项目方能用我们通过了审计，证明线上代码安全吗？"], "section": "写进流水线"}, {"seg": "6", "t0": 33.69, "t1": 50.81, "title": "不能：只对那个提交成立", "points": ["审计结论，只对审计时的那个提交哈希成立", "还要证明线上字节码等于审计版本，上线后每次改动都经过审查", "审计是一个关口，不是一张免检证书"], "notes": ["不能。", "审计结论，只对审计时的那个提交哈希成立。", "还要证明线上字节码等于审计版本，并且上线后的每一次改动，都经过审查。", "审计是流水线上的一个关口，不是一张免检证书。"], "section": "写进流水线"}]};

  function frame(seg) {
    if (frames[seg]) return frames[seg];
    var f = document.createElement('iframe'); f.src = 's' + seg + '.html'; f.title = '第 ' + seg + ' 节动画'; f.tabIndex = -1;
    f.setAttribute('aria-hidden', 'true'); screen.appendChild(f); frames[seg] = f; scale(); return f;
  }
  function send(seg, msg) {
    msg.deck = 'cmd';
    if (ready[seg]) frames[seg].contentWindow.postMessage(msg, '*'); else pending[seg] = msg;
  }
  addEventListener('message', function (e) {
    var m = e.data || {};
    if (!m.deck || !frames[m.seg] || e.source !== frames[m.seg].contentWindow) return;
    if (m.deck === 'ready') {
      ready[m.seg] = true;
      if (pending[m.seg]) { var p = pending[m.seg]; delete pending[m.seg]; send(m.seg, p); }
      if (cur >= 0 && S[cur].seg === m.seg) $('wait').hidden = true;
    } else if (m.deck === 'done' && cur >= 0 && S[cur].seg === m.seg) { playing = false; paint(); }
  });

  function paint() {
    var s = S[cur];
    $('sec').textContent = s.section;
    $('stitle').textContent = s.title;
    $('points').innerHTML = ''; s.points.forEach(function (p) { var li = document.createElement('li'); li.textContent = p; $('points').appendChild(li); });
    $('lines').innerHTML = ''; s.notes.forEach(function (p) { var li = document.createElement('li'); li.textContent = p; $('lines').appendChild(li); });
    $('count').textContent = (cur + 1) + ' / ' + N;
    $('prev').disabled = cur === 0;
    $('next').textContent = playing ? '跳到本页结尾 ›' : (cur === N - 1 ? '回到正文 ›' : '下一页 ›');
    S.forEach(function (x, i) { x.dot.className = i === cur ? 'cur' : (seen[i] ? 'seen' : ''); });
  }
  function go(i, mode) {
    if (i < 0 || i >= N) return;
    var s = S[i]; cur = i; seen[i] = 1; store.set(KEY, i); store.set(KEY + '-seen', JSON.stringify(seen));
    var f = frame(s.seg);
    for (var k in frames) frames[k].classList.toggle('on', k === s.seg);
    $('wait').hidden = !!ready[s.seg];
    playing = mode === 'play';
    send(s.seg, playing ? { play: [s.t0, s.t1], rate: +$('speed').value } : { seek: s.t1 });
    // warm the next segment while this one is on screen
    if (i + 1 < N && S[i + 1].seg !== s.seg) frame(S[i + 1].seg);
    paint();
  }
  function next() {
    if (playing) { go(cur, 'seek'); return; }
    if (cur === N - 1) { back(); return; }
    go(cur + 1, 'play');
  }
  function prev() { go(cur - 1, 'seek'); }
  function back() {
    if (parent !== window) parent.postMessage({ cexNav: D.chapter }, '*');
    else location.href = '../../index.html#' + D.chapter;
  }
  function fullscreen() {
    var a = $('app');
    if (document.fullscreenElement) document.exitFullscreen(); else if (a.requestFullscreen) a.requestFullscreen().catch(function () {});
  }
  if (!document.fullscreenEnabled) $('fs').hidden = true;

  $('next').onclick = next; $('prev').onclick = prev; $('replay').onclick = function () { go(cur, 'play'); };
  $('back').onclick = back; $('fs').onclick = fullscreen;
  addEventListener('keydown', function (e) {
    if (e.target.tagName === 'SELECT' || e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { e.preventDefault(); next(); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); prev(); }
    else if (k === 'r' || k === 'R') go(cur, 'play');
    else if (k === 'f' || k === 'F') fullscreen();
    else if (k === 'n' || k === 'N') $('notes').open = !$('notes').open;
    else if (k === 'Home') go(0, 'seek');
    else if (k === 'End') go(N - 1, 'seek');
  });
  // tap = next; horizontal swipe = next / previous
  var x0 = null, y0 = null;
  screen.addEventListener('pointerdown', function (e) { x0 = e.clientX; y0 = e.clientY; });
  screen.addEventListener('pointerup', function (e) {
    if (x0 === null) return;
    var dx = e.clientX - x0, dy = e.clientY - y0; x0 = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { dx < 0 ? next() : prev(); }
    else if (Math.abs(dx) < 8 && Math.abs(dy) < 8) next();
  });

  var start = +store.get(KEY); if (!(start >= 0 && start < N)) start = 0;
  go(start, start === 0 ? 'play' : 'seek');
})();
</script>
</body>
</html>
