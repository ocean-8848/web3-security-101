<style>

}
@media (prefers-color-scheme: dark) {

:root[data-theme="dark"] { --ground: #131311; --paper: #1a1a17; --ink: #ebe9e2; --ink-2: #a5a298; --rule: #2f2e29; --tint: #23221e;

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }

.body { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; }

.notes > summary::before { content: "▸ "; }

.notes li { border: 0; padding: 2px 0; }

.ctrl { display: flex; align-items: center; gap: 8px; padding: 8px 14px calc(8px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--rule); background: var(--paper); flex-wrap: wrap; }
.count { font-family: var(--f-mono); font-size: 13px; color: var(--ink-2); min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
.prog { flex: 1 1 240px; display: flex; gap: 3px; align-items: center; height: 30px; min-width: 160px; }
.prog .grp { display: flex; gap: 2px; flex: var(--n) 1 0; }
.prog .grp + .grp { margin-left: 6px; }
.prog button { flex: 1; height: 8px; padding: 0; border: 0; border-radius: 3px; background: var(--tint); cursor: pointer; }

.prog button.cur { background: var(--gold); }

.speed { height: 34px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); padding: 0 6px; font-size: 13px; }

.app:fullscreen .body { grid-template-columns: minmax(0, 1fr) 380px; }
.app:fullscreen .top { display: none; }

@media (max-width: 960px), (max-aspect-ratio: 4/3) {

@media (max-width: 560px) {

  .ctrl { gap: 6px; padding-inline: 10px; }
  .prog { order: -1; flex-basis: 100%; }
  .btn { padding: 0 10px; }

  var D = {"chapter": "s11", "title": "DeFi 经济安全：代码没错，规则错了", "segs": 6, "slides": [{"seg": "1", "t0": 0.0, "t1": 9.77, "title": "一个捐赠函数，约 1.97 亿美元", "points": ["2023 年 3 月 13 日，借贷协议 Euler Finance", "损失约 1.97 亿美元（事发时估值）"], "notes": ["2023 年 3 月 13 日，借贷协议 Euler Finance，损失约 1.97 亿美元，按事发时估值。"], "section": "一个捐赠函数"}, {"seg": "1", "t0": 9.77, "t1": 24.01, "title": "入口：捐赠函数", "points": ["用户把自己的存款捐给协议储备", "捐出去，账户的抵押品就少了", "这个函数不检查账户是否仍然健康"], "notes": ["入口，是一个捐赠函数。", "它让用户把自己的存款，捐给协议的储备。", "捐出去，账户的抵押品就少了。", "但这个函数，不检查账户是否仍然健康。"], "section": "一个捐赠函数"}, {"seg": "1", "t0": 24.01, "t1": 40.39, "title": "先猜一道题", "points": ["账户有 100 美元抵押品，借了 90 美元", "捐出 30 美元抵押品，没人检查，也没人偿还", "协议的缺口是多少？"], "notes": ["先猜一道题。", "举个例子。一个账户有 100 美元抵押品，借了 90 美元。", "它捐出 30 美元抵押品，没人检查，也没人偿还。协议的缺口是多少？"], "section": "一个捐赠函数"}, {"seg": "1", "t0": 40.39, "t1": 57.85, "title": "答案：缺口 20 美元", "points": ["只剩 70 美元抵押品，却欠着 90 美元", "这 20 美元成了坏账", "最后由存款人或保险基金承担"], "notes": ["缺口是 20 美元。", "账户只剩 70 美元抵押品，却欠着 90 美元。", "这 20 美元成了坏账，最后由存款人或保险基金承担。"], "section": "一个捐赠函数"}, {"seg": "1", "t0": 57.85, "t1": 72.16, "title": "规则没错，组合错了", "points": ["每个函数单独看，都没有错", "攻击者没有利用代码 bug，只是换了一种没想到的组合", "规则本身，怎么会让协议亏钱？"], "notes": ["每个函数单独看，都没有错。", "攻击者也没有利用代码 bug。他只是按规则操作，换了一种设计者没想到的组合。", "规则本身，怎么会让协议亏钱？"], "section": "一个捐赠函数"}, {"seg": "2", "t0": 0.0, "t1": 23.13, "title": "偿付不变量与健康因子", "points": ["抵押品打折以后，要盖得住借款；打折比例叫清算阈值", "健康因子 = 抵押品价值 × 清算阈值 ÷ 借款", "大于 1 安全；小于 1，任何人都可以清算"], "notes": ["先给准确的说法。", "借贷协议靠一条不变量运转：每个账户的抵押品，打折以后，要盖得住借款。", "打折的比例，叫清算阈值。", "抵押品价值乘以清算阈值，再除以借款，就是健康因子。", "健康因子大于 1，账户安全。小于 1，任何人都可以清算它。"], "section": "偿付不变量"}, {"seg": "2", "t0": 23.13, "t1": 31.57, "title": "清算", "points": ["第三方替账户偿还债务", "再以折扣拿走抵押品", "折扣是给清算人的报酬"], "notes": ["清算，是第三方替账户偿还债务，再以折扣拿走抵押品。", "折扣，是给清算人的报酬。"], "section": "偿付不变量"}, {"seg": "2", "t0": 31.57, "t1": 52.29, "title": "回到 Euler：坏账变成利润", "points": ["捐赠以后，账户已经资不抵债（Omniscia、BlockSec 复盘）", "清算折扣会随资不抵债的程度变大", "攻击者用另一个账户清算它：缺口越大，折扣越大"], "notes": ["回到 Euler。按 Omniscia 和 BlockSec 的复盘，捐赠以后，账户已经资不抵债。", "而 Euler 的清算折扣，会随资不抵债的程度变大。", "攻击者用另一个账户来清算它，以很大的折扣拿走抵押品。", "缺口越大，折扣越大。坏账，变成了利润。"], "section": "偿付不变量"}, {"seg": "2", "t0": 52.29, "t1": 60.25, "title": "协议级的不变量", "points": ["所有资产，要盖得住所有存款人的债权", "盖不住的部分，就是坏账"], "notes": ["整个协议也有一条不变量：所有资产，要盖得住所有存款人的债权。", "盖不住的部分，就是坏账。"], "section": "偿付不变量"}, {"seg": "2", "t0": 60.25, "t1": 77.85, "title": "坏账不一定来自攻击", "points": ["价格暴跌、预言机延迟、清算来不及", "清算奖励覆盖不了 gas 和滑点，就没人清算", "抵押品流动性不足，清算人也卖不出好价钱"], "notes": ["坏账不一定来自攻击。", "价格暴跌，预言机延迟，清算来不及，都会留下坏账。", "清算人是逐利的。奖励覆盖不了 gas 和滑点，就没人清算。", "抵押品流动性不足，清算人拿到手，也卖不出好价钱。"], "section": "偿付不变量"}, {"seg": "2", "t0": 77.85, "t1": 109.91, "title": "Venus：自家代币做抵押", "points": ["2021 年 5 月，BNB Chain 上的 Venus 允许用 XVS 做抵押", "XVS 从约 76 美元涨到约 144 美元，有人借走大量 BTC 和 ETH（The Block）", "回落后清算约 2 亿美元以上，仍留下约 9500 万美元以上坏账；项目方称价格可能被操纵"], "notes": ["再看一个例子。2021 年 5 月，BNB Chain 上的 Venus，允许用户拿自己的治理代币 XVS 做抵押。", "按 The Block 报道，XVS 短时间里，从约 76 美元涨到约 144 美元。", "抵押能力跟着上涨，有人借走了大量 BTC 和 ETH。", "XVS 回落以后，清算金额约 2 亿美元以上，仍然留下约 9500 万美元以上的坏账。", "项目方称，价格可能被操纵。"], "section": "偿付不变量"}, {"seg": "2", "t0": 109.91, "t1": 124.4, "title": "反身性", "points": ["价格上涨 → 借款增加 → 卖压增加 → 价格下跌 → 坏账出现", "低流动性抵押品：要有供应上限和更低的抵押率"], "notes": ["这叫反身性。价格上涨，借款增加，卖压增加，价格下跌，坏账出现。", "所以，低流动性的抵押品，要有供应上限和更低的抵押率。"], "section": "偿付不变量"}, {"seg": "3", "t0": 0.0, "t1": 27.11, "title": "治理攻击：Beanstalk", "points": ["拿到足够投票权，用恶意提案合法地转走协议资产", "2022 年 4 月，以太坊上的 Beanstalk：投票权按当前存款计算", "紧急通道：提案满 1 天、拿到三分之二的票就能立刻执行（CertiK 分析）"], "notes": ["规则被组合利用，不只发生在借贷里。", "治理攻击，是攻击者拿到足够的投票权，通过恶意提案，合法地转走协议资产。", "2022 年 4 月，以太坊上的 Beanstalk。", "它的投票权，按当前的存款计算。", "它另有一条紧急通道。", "按 CertiK 的分析，提案满 1 天，拿到三分之二的票，就能立刻执行。"], "section": "借来的投票"}, {"seg": "3", "t0": 27.11, "t1": 34.15, "title": "先猜一道题", "points": ["闪电贷必须在同一笔交易里归还", "用借来的代币，能通过提案吗？"], "notes": ["先猜一道题。", "闪电贷必须在同一笔交易里归还。用借来的代币，能通过提案吗？"], "section": "借来的投票"}, {"seg": "3", "t0": 34.15, "t1": 56.55, "title": "能：一笔交易里全部完成", "points": ["借款、存入、投票、执行、还款，全在同一笔交易里", "攻击者提前一天就提交了提案", "获利口径：CertiK 约 7600 万、Beanstalk 约 7700 万、PeckShield 约 8000 万美元"], "notes": ["能。借款，存入，投票，执行，还款，全在同一笔交易里。", "闪电贷的归还限制，一步也没有挡住。", "攻击者提前一天，就提交了提案。", "获利口径各方不同。CertiK 称约 7600 万美元，Beanstalk 称约 7700 万美元，PeckShield 估约 8000 万美元。"], "section": "借来的投票"}, {"seg": "3", "t0": 56.55, "t1": 77.11, "title": "修复：快照 + 时间锁", "points": ["投票权用提案创建前那个区块的快照", "通过以后先过时间锁，留出守护者否决的机会", "加上法定人数，并锁定提案内容：内容一改，重新计时"], "notes": ["修复有两步。", "投票权用提案创建之前那个区块的快照。借来的代币，那时并不在你手里。", "提案通过以后，先过时间锁，再执行。中间留出守护者否决的机会。", "再加上法定人数，并锁定提案内容。内容一改，重新计时。"], "section": "借来的投票"}, {"seg": "3", "t0": 77.11, "t1": 91.77, "title": "奖励分发：同样的问题", "points": ["奖励按存入那一刻的余额算：闪电贷存入、领奖、取出", "修复：奖励随时间累积，存入以后有最短锁定期"], "notes": ["奖励分发，也有同样的问题。", "如果奖励按存入那一刻的余额计算，就能用闪电贷存入，领奖，取出。", "修复是让奖励随时间累积，存入以后有最短锁定期。"], "section": "借来的投票"}, {"seg": "3", "t0": 91.77, "t1": 106.74, "title": "借来的是规模，利用的是时间", "points": ["奖励不能读一笔交易里就能改变的数据", "例如本区块的成交量，或者池子的价格"], "notes": ["奖励的计算，不能读一笔交易里就能改变的数据，比如本区块的成交量，或者池子的价格。", "这几件事有个共同点。攻击者借来的，是规模。利用的，是时间。"], "section": "借来的投票"}, {"seg": "4", "t0": 0.0, "t1": 15.25, "title": "发行方风险：不在合约里", "points": ["稳定币和代币化现实资产，把链下资产带上了链", "它们值多少，看链下的储备、赎回和发行方权限"], "notes": ["另有一类风险，根本不在合约里。", "稳定币和代币化的现实资产，把链下资产带上了链。", "它们值多少，不看合约代码，看链下的储备，赎回，和发行方的权限。"], "section": "发行方风险"}, {"seg": "4", "t0": 15.25, "t1": 41.73, "title": "比喻：银行开的提货单", "points": ["仓库货不够、仓库被封、或者被作废，它就不值一美元", "不成立处：冻结或销毁代币，通常只要一笔交易", "DeFi 拿它做抵押品，就继承了这些链下风险"], "notes": ["打个比方。稳定币像一张银行开的提货单。", "提货单印得再精美，只要仓库里的货不够，仓库被封，或者银行能随时作废它，它就不值一美元。", "比喻在这里不成立：作废提货单，要走法律程序。冻结或销毁一个地址上的代币，通常只要一笔交易。", "DeFi 协议拿它做抵押品，就继承了这些链下风险。"], "section": "发行方风险"}, {"seg": "4", "t0": 41.73, "t1": 63.11, "title": "① 储备与托管", "points": ["2023 年 3 月，约 33 亿美元储备存在倒闭的硅谷银行（Circle 声明）", "USDC 最低跌到约 0.87 美元，DAI 也跌到约 0.90 美元（The Block）"], "notes": ["风险分五类。第一类，储备与托管。", "2023 年 3 月，按 Circle 的声明，约 33 亿美元储备存在倒闭的硅谷银行。", "按 The Block 报道，USDC 最低跌到约 0.87 美元。以它为主要抵押的 DAI，也跌到约 0.90 美元。"], "section": "发行方风险"}, {"seg": "4", "t0": 63.11, "t1": 73.41, "title": "② 设计缺陷", "points": ["2022 年 5 月，算法稳定币 Terra UST 挤兑", "进入死亡螺旋，约 400 亿美元市值蒸发"], "notes": ["第二类，设计缺陷。2022 年 5 月，算法稳定币 Terra UST 挤兑，进入死亡螺旋，约 400 亿美元市值蒸发。"], "section": "发行方风险"}, {"seg": "4", "t0": 73.41, "t1": 97.97, "title": "③ 铸币权限", "points": ["2026 年 3 月，Resolv 被凭空铸出约 8000 万枚 USR", "攻击者拿到铸币密钥，合约也不核对铸币量与存入资产（QuillAudits、CertiK）", "StablR：三个签名人里任意一人就能批准铸币"], "notes": ["第三类，铸币权限。", "2026 年 3 月，Resolv 被凭空铸出约 8000 万枚 USR。", "按 QuillAudits 和 CertiK 的分析，攻击者拿到了铸币密钥，合约也不核对铸币量和存入资产的比例。", "2026 年 5 月的 StablR，三个签名人里任意一人，就能批准铸币。拿下一个人，就拿下了全部。"], "section": "发行方风险"}, {"seg": "4", "t0": 97.97, "t1": 108.67, "title": "④ 链下策略", "points": ["2025 年 11 月，Stream Finance 的外部基金管理人", "亏掉约 9300 万美元，提款随即冻结"], "notes": ["第四类，链下策略。2025 年 11 月，Stream Finance 的一名外部基金管理人，亏掉约 9300 万美元，提款随即冻结。"], "section": "发行方风险"}, {"seg": "4", "t0": 108.67, "t1": 130.61, "title": "⑤ 定价来源", "points": ["2025 年 10 月 10 日，USDe 只在 Binance 现货跌到约 0.65 美元", "链上和其他交易所基本保持在约 0.90 美元以上", "Binance 用自家订单簿估值触发清算，之后赔付约 2.83 亿美元"], "notes": ["第五类，定价来源。2025 年 10 月 10 日，USDe 只在 Binance 现货，跌到约 0.65 美元。", "链上和其他交易所，基本保持在约 0.90 美元以上。", "Binance 用自家订单簿给抵押品估值，触发了用户清算，之后赔付约 2.83 亿美元。"], "section": "发行方风险"}, {"seg": "4", "t0": 130.61, "t1": 140.4, "title": "风险沿抵押关系往下传", "points": ["储备一出问题", "所有拿它做抵押品的协议，同时受影响"], "notes": ["风险会沿着抵押关系往下传。储备一出问题，所有拿它做抵押品的协议，同时受影响。"], "section": "发行方风险"}, {"seg": "5", "t0": 0.0, "t1": 12.61, "title": "三样东西：顺序、规模、时间", "points": ["攻击者大多没有找到代码 bug", "他们改变的，是顺序、规模、时间", "防御也按这三样来设计"], "notes": ["回头看这些事故，攻击者大多没有找到代码 bug。", "他们改变的，是三样东西：顺序，规模，时间。", "防御也按这三样来设计。"], "section": "顺序规模时间"}, {"seg": "5", "t0": 12.61, "t1": 26.01, "title": "顺序", "points": ["减少抵押品或增加债务的路径，结束时都检查健康因子", "新增函数，要确认它走了这道检查", "Euler 缺的，就是这一步"], "notes": ["先说顺序。任何会减少抵押品，或者增加债务的路径，都必须在结束时检查健康因子。", "新增一个函数，就要确认它走了这道检查。Euler 缺的，就是这一步。"], "section": "顺序规模时间"}, {"seg": "5", "t0": 26.01, "t1": 38.37, "title": "规模（一）：抵押与清算", "points": ["低流动性抵押品要有供应上限", "自家代币做抵押，要有额外限制", "清算奖励在极端行情下也要有吸引力，清算折扣要有上限"], "notes": ["再说规模。低流动性抵押品要有供应上限，自家代币做抵押，要有额外限制。", "清算奖励在极端行情下也要有吸引力，清算折扣要有上限。"], "section": "顺序规模时间"}, {"seg": "5", "t0": 38.37, "t1": 52.63, "title": "规模（二）：铸币与估值", "points": ["铸币：单笔和每日累计限额、多人审批、异常熔断", "三个签名人里一人就够，等于只有一个签名人", "抵押品估值，不能只看一家交易所的订单簿"], "notes": ["铸币要有单笔和每日的累计限额，多人审批，异常时熔断。", "三个签名人里一人就够，等于只有一个签名人。", "抵押品估值，不能只看一家交易所的订单簿。"], "section": "顺序规模时间"}, {"seg": "5", "t0": 52.63, "t1": 61.39, "title": "时间", "points": ["投票权用历史快照", "提案执行要过时间锁", "提款和赎回，也可以设延迟"], "notes": ["最后是时间。投票权用历史快照，提案执行要过时间锁。", "提款和赎回，也可以设延迟。"], "section": "顺序规模时间"}, {"seg": "5", "t0": 61.39, "t1": 80.69, "title": "mETH 的 8 小时", "points": ["2025 年 2 月 Bybit 被盗后，攻击者尝试赎回 cmETH", "mETH 协议有 8 小时提款延迟（The Block）", "团队暂停合约，追回 15000 枚 cmETH，约 4300 万美元"], "notes": ["2025 年 2 月 Bybit 被盗以后，攻击者尝试赎回 cmETH。", "按 The Block 报道，mETH 协议有 8 小时的提款延迟。", "团队趁这段时间暂停了合约，追回 15000 枚 cmETH，约 4300 万美元。"], "section": "顺序规模时间"}, {"seg": "5", "t0": 80.69, "t1": 98.12, "title": "延迟是一种安全参数", "points": ["把攻击从一笔交易拉长到几个小时", "监控和人工响应有机会介入", "代价是正常用户也要等"], "notes": ["延迟把攻击者完成攻击的时间，从一笔交易拉长到几个小时，让监控和人工响应有机会介入。", "代价是，正常用户也要等。", "所以延迟是一种安全参数，不只是体验问题。"], "section": "顺序规模时间"}, {"seg": "6", "t0": 0.0, "t1": 28.09, "title": "今天就能做的事", "points": ["写协议：把偿付不变量写成公式，用不变量测试验证", "审计：列出每个改变抵押品和债务的入口，逐个核对健康检查", "用户：收益来源说不清的产品不投大额；查稳定币的储备、赎回规则和冻结权限"], "notes": ["最后，每个人今天就能做一件事。", "写协议的人，把偿付不变量写成一条公式，再用不变量测试去验证它。", "审计的人，列出每一个改变抵押品和债务的入口，逐个核对有没有健康检查。", "普通用户，收益来源说不清楚的产品，不要投入大额。", "稳定币也不是无风险资产。先查它的储备，赎回规则，和发行方的冻结权限。"], "section": "今天能做什么"}, {"seg": "6", "t0": 28.09, "t1": 47.35, "title": "回到开头", "points": ["每个函数都没有错，协议为什么损失约 1.97 亿美元？", "因为规则允许一条路径：减少抵押品，却不检查健康因子", "前提：清算折扣会随缺口变大，缺口才能变成利润"], "notes": ["回到开头。每个函数都没有错，协议为什么损失约 1.97 亿美元？", "因为规则允许一条路径，减少抵押品，却不检查健康因子。", "这个答案成立的前提是，清算折扣会随缺口变大，缺口才能变成利润。"], "section": "今天能做什么"}, {"seg": "6", "t0": 47.35, "t1": 53.25, "title": "代码没错，规则错了", "points": ["规则的每一种组合，都要守住偿付不变量"], "notes": ["代码没错，规则错了。规则的每一种组合，都要守住偿付不变量。"], "section": "今天能做什么"}]};
  var S = D.slides, N = S.length, KEY = 'deck-' + D.chapter;
  var $ = function (id) { return document.getElementById(id); };
  var screen = $('screen'), frames = {}, ready = {}, pending = {}, cur = -1, playing = false, seen = {};
  var store = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  try { var pt = parent !== window && parent.document.documentElement.getAttribute('data-theme'); if (pt) document.documentElement.setAttribute('data-theme', pt); } catch (e) {}
  try { seen = JSON.parse(store.get(KEY + '-seen') || '{}') || {}; } catch (e) { seen = {}; }

  $('title').textContent = D.title;
  $('eyebrow').textContent = '拟物化知识讲解 · 第 ' + D.chapter.replace(/\D/g, '') + ' 章';

  // progress: one group per section
  var prog = $('prog'), groups = [];
  S.forEach(function (s, i) {
    var g = groups[groups.length - 1];
    if (!g || g.seg !== s.seg) { g = { seg: s.seg, el: document.createElement('div') }; g.el.className = 'grp'; groups.push(g); prog.appendChild(g.el); g.n = 0; }
    var b = document.createElement('button'); b.title = (i + 1) + ' · ' + s.title; b.setAttribute('aria-label', '第 ' + (i + 1) + ' 页：' + s.title);
    b.onclick = function () { go(i, 'seek'); }; g.el.appendChild(b); g.n++; s.dot = b;
  });
  groups.forEach(function (g) { g.el.style.setProperty('--n', g.n); });

  function scale() { var k = screen.clientWidth / 1920; for (var s in frames) frames[s].style.transform = 'scale(' + k + ')'; }
  if (window.ResizeObserver) new ResizeObserver(scale).observe(screen); else addEventListener('resize', scale);

  function frame(seg) {
    if (frames[seg]) return frames[seg];
    var f = document.createElement('iframe'); f.src = 's' + seg + '.html'; f.title = '第 ' + seg + ' 节动画'; f.tabIndex = -1;
    f.setAttribute('aria-hidden', 'true'); screen.appendChild(f); frames[seg] = f; scale(); return f;
  }
  function send(seg, msg) {
    msg.deck = 'cmd';
    if (ready[seg]) frames[seg].contentWindow.postMessage(msg, '*'); else pending[seg] = msg;
  }
  addEventListener('message', function (e) {
    var m = e.data || {};
    if (!m.deck || !frames[m.seg] || e.source !== frames[m.seg].contentWindow) return;
    if (m.deck === 'ready') {
      ready[m.seg] = true;
      if (pending[m.seg]) { var p = pending[m.seg]; delete pending[m.seg]; send(m.seg, p); }
      if (cur >= 0 && S[cur].seg === m.seg) $('wait').hidden = true;
    } else if (m.deck === 'done' && cur >= 0 && S[cur].seg === m.seg) { playing = false; paint(); }
  });

  function paint() {
    var s = S[cur];
    $('sec').textContent = s.section;
    $('stitle').textContent = s.title;
    $('points').innerHTML = ''; s.points.forEach(function (p) { var li = document.createElement('li'); li.textContent = p; $('points').appendChild(li); });
    $('lines').innerHTML = ''; s.notes.forEach(function (p) { var li = document.createElement('li'); li.textContent = p; $('lines').appendChild(li); });
    $('count').textContent = (cur + 1) + ' / ' + N;
    $('prev').disabled = cur === 0;
    $('next').textContent = playing ? '跳到本页结尾 ›' : (cur === N - 1 ? '回到正文 ›' : '下一页 ›');
    S.forEach(function (x, i) { x.dot.className = i === cur ? 'cur' : (seen[i] ? 'seen' : ''); });
  }
  function go(i, mode) {
    if (i < 0 || i >= N) return;
    var s = S[i]; cur = i; seen[i] = 1; store.set(KEY, i); store.set(KEY + '-seen', JSON.stringify(seen));
    var f = frame(s.seg);
    for (var k in frames) frames[k].classList.toggle('on', k === s.seg);
    $('wait').hidden = !!ready[s.seg];
    playing = mode === 'play';
    send(s.seg, playing ? { play: [s.t0, s.t1], rate: +$('speed').value } : { seek: s.t1 });
    // warm the next segment while this one is on screen
    if (i + 1 < N && S[i + 1].seg !== s.seg) frame(S[i + 1].seg);
    paint();
  }
  function next() {
    if (playing) { go(cur, 'seek'); return; }
    if (cur === N - 1) { back(); return; }
    go(cur + 1, 'play');
  }
  function prev() { go(cur - 1, 'seek'); }
  function back() {
    if (parent !== window) parent.postMessage({ cexNav: D.chapter }, '*');
    else location.href = '../../index.html#' + D.chapter;
  }
  function fullscreen() {
    var a = $('app');
    if (document.fullscreenElement) document.exitFullscreen(); else if (a.requestFullscreen) a.requestFullscreen().catch(function () {});
  }
  if (!document.fullscreenEnabled) $('fs').hidden = true;

  $('next').onclick = next; $('prev').onclick = prev; $('replay').onclick = function () { go(cur, 'play'); };
  $('back').onclick = back; $('fs').onclick = fullscreen;
  addEventListener('keydown', function (e) {
    if (e.target.tagName === 'SELECT' || e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { e.preventDefault(); next(); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); prev(); }
    else if (k === 'r' || k === 'R') go(cur, 'play');
    else if (k === 'f' || k === 'F') fullscreen();
    else if (k === 'n' || k === 'N') $('notes').open = !$('notes').open;
    else if (k === 'Home') go(0, 'seek');
    else if (k === 'End') go(N - 1, 'seek');
  });
  // tap = next; horizontal swipe = next / previous
  var x0 = null, y0 = null;
  screen.addEventListener('pointerdown', function (e) { x0 = e.clientX; y0 = e.clientY; });
  screen.addEventListener('pointerup', function (e) {
    if (x0 === null) return;
    var dx = e.clientX - x0, dy = e.clientY - y0; x0 = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { dx < 0 ? next() : prev(); }
    else if (Math.abs(dx) < 8 && Math.abs(dy) < 8) next();
  });

  var start = +store.get(KEY); if (!(start >= 0 && start < N)) start = 0;
  go(start, start === 0 ? 'play' : 'seek');
})();
