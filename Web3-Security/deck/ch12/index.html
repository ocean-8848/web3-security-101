  var D = {"chapter": "s12", "title": "跨链桥安全：两条链之间的那条缝", "segs": 6, "slides": [{"seg": "1", "t0": 0.0, "t1": 13.83, "title": "Ronin：两笔交易被提空", "points": ["2022 年 3 月 23 日，Ronin 跨链桥被攻击", "约 17.36 万枚 ETH 和约 2550 万枚 USDC 被提走", "只用了两笔交易"], "notes": ["2022 年 3 月 23 日，Ronin 跨链桥被提走约 17.36 万枚 ETH，和约 2550 万枚 USDC。", "只用了两笔交易。"], "section": "九个验证者"}, {"seg": "1", "t0": 13.83, "t1": 23.29, "title": "9 个验证者，5 签放行", "points": ["这座桥有 9 个验证者", "一笔提款只要其中 5 个签名就会放行", "听上去，要攻破过半数的人"], "notes": ["这座桥有 9 个验证者。", "一笔提款，只要其中 5 个签名，就会放行。", "听上去，要攻破过半数的人。"], "section": "九个验证者"}, {"seg": "1", "t0": 23.29, "t1": 40.05, "title": "先猜一道题", "points": ["9 个验证者里，4 个由 Sky Mavis 运营", "第 5 个签名可通过 Axie DAO 一项本应撤销的授权拿到", "攻击者最少要攻破几个组织？"], "notes": ["先猜一道题。", "9 个验证者里，有 4 个由同一家公司 Sky Mavis 运营。", "第 5 个签名，可以通过 Axie DAO 的一项授权拿到。这项授权，本应早就撤销。", "攻击者最少要攻破几个组织？"], "section": "九个验证者"}, {"seg": "1", "t0": 40.05, "t1": 62.72, "title": "答案：两个组织", "points": ["门限是 9 个里要 5 个，独立防线只有两道", "攻击者控制了这 5 个验证者的签名（Ronin 复盘、Elliptic）", "公开报道的损失约 6.2 亿美元"], "notes": ["答案是两个。", "门限写的是 9 个里要 5 个，独立的防线却只有两道。", "按 Ronin 复盘和 Elliptic 的分析，攻击者控制了这 5 个验证者的签名。", "公开报道的损失，约 6.2 亿美元。", "一座桥，凭什么相信另一条链上发生的事？"], "section": "九个验证者"}, {"seg": "2", "t0": 0.0, "t1": 16.19, "title": "B 链只能相信证明", "points": ["跨链桥：在两条链之间转移资产或消息的系统", "B 链上的合约要相信 A 链上发生了某件事", "B 链看不到 A 链，只能相信某种证明"], "notes": ["先给准确的说法。", "跨链桥，是在两条链之间转移资产或消息的系统。", "B 链上的合约，要相信 A 链上发生了某件事。", "可 B 链看不到 A 链。它只能相信某种证明。"], "section": "一条消息过河"}, {"seg": "2", "t0": 16.19, "t1": 31.73, "title": "锁定和铸造：先锁定", "points": ["用户在 A 链把 100 USDT 存进桥合约锁起来", "桥合约发出存款事件：用户、金额和一个序号"], "notes": ["最常见的做法，叫锁定和铸造。", "举个例子。用户在 A 链，把 100 USDT 存进桥合约，锁起来。", "桥合约发出一条存款事件，写着用户、金额和一个序号。"], "section": "一条消息过河"}, {"seg": "2", "t0": 31.73, "t1": 45.91, "title": "中继者送来消息和证明", "points": ["中继者等 A 链交易足够确定、不会被回滚", "再把消息和证明一起送到 B 链", "证明可以是签名、Merkle 证明或零知识证明"], "notes": ["中继者观察 A 链，等这笔交易足够确定，不会再被回滚。", "然后把消息和证明，一起送到 B 链。", "证明可以是一组签名，一条 Merkle 证明，或者一份零知识证明。"], "section": "一条消息过河"}, {"seg": "2", "t0": 45.91, "t1": 54.91, "title": "验证通过才铸造", "points": ["B 链桥合约验证证明，检查序号没有用过", "都通过了，才铸造 100 枚映射 USDT"], "notes": ["B 链的桥合约验证证明，再检查这个序号没有用过。", "都通过了，才给用户铸造 100 枚映射 USDT。"], "section": "一条消息过河"}, {"seg": "2", "t0": 54.91, "t1": 71.39, "title": "信任边界：验证三件事", "points": ["A 链到 B 链是信任边界，真假只靠这一步验证", "证明有效；消息没有被处理过", "消息来自正确的源链和源合约"], "notes": ["注意中间这一段。", "从 A 链到 B 链，是信任边界。B 链判断真假，只能靠这一步验证。", "验证要同时查三件事。", "证明是有效的。消息没有被处理过。消息来自正确的源链和源合约。"], "section": "一条消息过河"}, {"seg": "2", "t0": 71.39, "t1": 91.47, "title": "比喻：提货单和签章", "points": ["A 城银行收下金条开提货单，到 B 城换金券", "B 城银行看不到 A 城账本，只能看签章", "印章被偷或核对有漏洞，就会兑出不存在的金子"], "notes": ["打个比方。", "A 城的银行收下你的金条，开一张提货单。你拿着它，到 B 城银行兑换等值的金券。", "B 城银行看不到 A 城的账本，只能看提货单上的签章。", "印章被偷，或者核对方法有漏洞，B 城银行就会兑出不存在的金子。"], "section": "一条消息过河"}, {"seg": "2", "t0": 91.47, "t1": 113.36, "title": "桥是攻击者的首选目标", "points": ["两座金库加起来，往往是系统里最大的一笔钱", "反向销毁、解锁，风险一样，金额往往更大", "B 链到底该相信谁？"], "notes": ["比喻不成立的地方是，两座银行的金库加起来，往往是整个系统里最大的一笔钱。", "所以跨链桥，是攻击者的首选目标。", "反过来走，销毁映射代币、解锁原来的资产，风险一样，金额往往更大。", "那么，B 链到底该相信谁？"], "section": "一条消息过河"}, {"seg": "3", "t0": 0.0, "t1": 21.93, "title": "第一种：外部多签或 MPC", "points": ["验证方式大致四种，差别在于你信任谁", "凑够门限个签名就放行，信任的是签名人", "风险：私钥泄露、验证者共谋、门限太低；Ronin 属于此类"], "notes": ["验证的方式，大致有四种。差别在于，你信任谁。", "第一种，外部多签，或者 MPC。", "一组验证者，凑够门限个签名，就放行。", "你信任的是这些签名人。风险是私钥泄露，验证者共谋，或者门限太低。", "Ronin 就是这一种。"], "section": "四种验证方式"}, {"seg": "3", "t0": 21.93, "t1": 40.97, "title": "第二种：轻客户端", "points": ["B 链合约自己验证 A 链的区块头和证明", "信任 A 链共识，加上证明验证代码", "代码有漏洞，证明就能伪造，如 BNB Chain Token Hub"], "notes": ["第二种，轻客户端，也叫原生证明。", "B 链上的合约，自己验证 A 链的区块头和证明。", "你信任的是 A 链的共识，加上这段证明验证代码。", "代码有漏洞，证明就能伪造。2022 年的 BNB Chain Token Hub，属于这一种。"], "section": "四种验证方式"}, {"seg": "3", "t0": 40.97, "t1": 61.13, "title": "第三种：乐观证明", "points": ["消息默认有效，挑战期内任何人可提交欺诈证明", "只需要一个诚实的挑战者", "风险：挑战期没人盯，或挑战者被审查"], "notes": ["第三种，乐观证明。", "消息默认有效，但留出一段挑战期。这期间，任何人都可以提交欺诈证明推翻它。", "你只需要一个诚实的挑战者。风险是挑战期里没人盯着，或者挑战者被审查。", "多数乐观 Rollup 的原生桥，用的是这一种。"], "section": "四种验证方式"}, {"seg": "3", "t0": 61.13, "t1": 76.43, "title": "第四种：零知识证明", "points": ["用数学证明 A 链状态变化正确，不逐条核对账本", "信任数学，加上证明系统实现和可信设置", "电路或验证器写错，一样会出事"], "notes": ["第四种，零知识证明。", "用数学证明 A 链的状态变化是正确的，不用逐条核对账本。", "你信任的是数学，加上证明系统的实现和可信设置。电路或验证器写错，一样会出事。"], "section": "四种验证方式"}, {"seg": "3", "t0": 76.43, "t1": 86.99, "title": "再猜一道题", "points": ["ZK 桥的证明系统完全正确", "但桥合约可以被一个多签无延迟升级", "用户只需要信任数学吗？"], "notes": ["再猜一道题。一座 ZK 桥，证明系统完全正确，但桥合约可以被一个多签无延迟升级。", "用户只需要信任数学吗？"], "section": "四种验证方式"}, {"seg": "3", "t0": 86.99, "t1": 96.47, "title": "答案：还要信任升级权", "points": ["多签可以把桥合约换成新实现，绕过证明系统", "用户同时信任证明系统和升级权限的持有人"], "notes": ["不是。多签可以把桥合约换成新实现，绕过证明系统。", "用户同时信任证明系统，和升级权限的持有人。"], "section": "四种验证方式"}, {"seg": "3", "t0": 96.47, "t1": 120.14, "title": "L2 原生桥也是跨链桥", "points": ["Mantle 用 OP Succinct 有效性证明（L2BEAT）", "工程多签可切到乐观模式；安全多签可无延迟升级", "安全取决于证明系统和升级权限两样"], "notes": ["按 L2BEAT 截至 2026 年的页面，Mantle 用的是 OP Succinct 有效性证明。", "但它的输出预言机，可以由工程多签切换到乐观模式。桥合约可以由安全多签无延迟升级。", "L2 的原生桥，也是一座跨链桥。它的安全，取决于证明系统和升级权限两样。"], "section": "四种验证方式"}, {"seg": "4", "t0": 0.0, "t1": 29.45, "title": "第一类：私钥与运营", "points": ["根因四类：私钥、验证逻辑、初始化、存款伪造", "Ronin 5 把私钥：4 把属同一机构，1 把来自本应撤销的授权", "公开报道称私钥通过社会工程拿到；4 把放一处等于 1 把"], "notes": ["跨链桥事故的根因，大致分四类。私钥，验证逻辑，初始化，存款伪造。", "第一类，私钥与运营。", "Ronin 那 5 把私钥里，4 把属于同一机构，1 把来自一项本应撤销的授权。", "公开报道称，私钥是通过社会工程拿到的。", "门限的意义，取决于签名人是否独立。4 把钥匙放在同一个地方，等于 1 把。"], "section": "根因与案例"}, {"seg": "4", "t0": 29.45, "t1": 59.03, "title": "第二类：验证逻辑被骗", "points": ["2022 年 10 月，BNB Token Hub 被伪造的 IAVL 证明骗过", "凭空铸出 200 万枚 BNB，约 5.7 亿美元，约 1 亿以上转到他链", "没有私钥被偷；验证者约 3 小时后暂停全链并硬分叉修复"], "notes": ["第二类，验证逻辑。", "2022 年 10 月，BNB Chain 的 Token Hub，被一份伪造的 IAVL Merkle 证明骗过了校验。", "凭空铸出 200 万枚 BNB，约 5.7 亿美元。其中约 1 亿美元以上，被转到其他链。", "没有私钥被偷。被利用的，是证明验证代码。", "BSC 验证者约 3 小时后暂停了全链，再用 Moran 硬分叉修复了校验。"], "section": "根因与案例"}, {"seg": "4", "t0": 59.03, "t1": 74.83, "title": "Wormhole：账户没核对", "points": ["2022 年 2 月，Solana 侧合约没核对传入的系统账户", "伪造账户绕过守护者签名验证", "铸出约 12 万枚 wETH，约 3.2 亿美元"], "notes": ["2022 年 2 月的 Wormhole，Solana 一侧的合约，没有核对传进来的系统账户是不是真的。", "伪造的账户绕过了守护者的签名验证，铸出约 12 万枚 wETH，约 3.2 亿美元。"], "section": "根因与案例"}, {"seg": "4", "t0": 74.83, "t1": 100.99, "title": "Poly：特权函数被调用", "points": ["2021 年 8 月，跨链消息可调用任意合约函数", "包括替换验证者公钥的特权函数，损失约 6.1 亿美元", "执行器不能调特权合约，目标地址和函数列白名单"], "notes": ["2021 年 8 月的 Poly Network，跨链消息可以调用任意合约的函数。", "其中包括一个替换验证者公钥的特权函数。公钥被换掉，伪造的提款就能签出来。", "损失约 6.1 亿美元，后来攻击者归还了资产。", "所以，跨链消息的执行器，不能调用持有特权的合约。目标地址和函数，都要列白名单。"], "section": "根因与案例"}, {"seg": "4", "t0": 100.99, "t1": 111.91, "title": "第三类：初始化", "points": ["2022 年 8 月，Nomad 升级时把可信根设成零值", "任何消息都被当作已经证明过"], "notes": ["第三类，初始化。2022 年 8 月，Nomad 升级时，把可信根设成了零值。", "结果任何消息，都被当作已经证明过。"], "section": "根因与案例"}, {"seg": "4", "t0": 111.91, "t1": 124.37, "title": "第四类：存款伪造", "points": ["2022 年 1 月的 Qubit，对零地址调用转账函数返回成功", "桥记下了一笔不存在的 ETH 存款"], "notes": ["第四类，存款伪造。2022 年 1 月的 Qubit，对零地址调用转账函数，返回了成功，桥就记下了一笔不存在的 ETH 存款。"], "section": "根因与案例"}, {"seg": "4", "t0": 124.37, "t1": 156.37, "title": "合约正确，桥也会被掏空", "points": ["2026 年 4 月，一条伪造消息放出约 11.65 万枚 rsETH", "约 2.92 亿美元；路径只有一个验证者", "LayerZero 称攻击者控制了两个 RPC 节点，没有独立来源比对"], "notes": ["另有一种情况，合约代码完全正确。", "2026 年 4 月 18 日，一条伪造的 LayerZero 消息，让 Ethereum 上的适配器放出约 11.65 万枚 rsETH，约 2.92 亿美元。", "这条路径只有一个验证者。LayerZero 称，攻击者控制了它依赖的两个 RPC 节点，让验证者看到假数据。", "桥只相信验证者，验证者只相信 RPC。没有第二个独立来源可以比对。"], "section": "根因与案例"}, {"seg": "4", "t0": 156.37, "t1": 190.82, "title": "责任之争与教训", "points": ["LayerZero 称限于 KelpDAO 配置，KelpDAO 称来自默认设置", "KelpDAO 暂停合约，拦下第二次约 4 万枚（Chainalysis）", "验证者数量和数据来源都要有冗余"], "notes": ["责任仍有争议。LayerZero 称问题限于 KelpDAO 的配置，KelpDAO 称单个验证者来自默认设置。", "按 Chainalysis 的分析，KelpDAO 暂停合约，拦下了第二次约 4 万枚 rsETH 的伪造消息。", "按 The Block 报道，LayerZero 后来道歉，承认不应允许它的验证者单独验证高价值交易。", "合约没有错，桥一样会被掏空。验证者的数量和数据来源，都要有冗余。"], "section": "根因与案例"}, {"seg": "5", "t0": 0.0, "t1": 15.73, "title": "防御：验证者", "points": ["把根因倒过来，就是防御", "门限要高于三分之二", "签名人在组织、地域、基础设施上独立，定期核对清单"], "notes": ["把这些根因倒过来，就是防御。", "先看验证者。门限要高于三分之二。", "签名人在组织、地域和基础设施上都要独立，并且定期核对签名权清单。"], "section": "防御清单"}, {"seg": "5", "t0": 15.73, "t1": 28.17, "title": "防御：消息逐项核对", "points": ["写明源链、源合约、目标链、目标合约和序号", "目标侧逐项核对", "处理过的消息打上标记，防止重放"], "notes": ["再看消息。消息里要写明源链、源合约、目标链、目标合约和序号，目标侧逐项核对。", "处理过的消息要打上标记，防止重放。"], "section": "防御清单"}, {"seg": "5", "t0": 28.17, "t1": 46.59, "title": "防御：证明与执行", "points": ["证明验证代码要有独立审计和测试向量", "零值、空数组、未初始化的根不能当有效证明", "叶子与中间节点用不同哈希前缀；执行走白名单"], "notes": ["证明验证代码要有独立审计和测试向量。零值、空数组、没初始化的根，都不能当作有效证明。", "Merkle 树的叶子和中间节点，要用不同的哈希前缀。", "执行消息时，目标地址和函数走白名单，不许碰特权合约。"], "section": "防御清单"}, {"seg": "5", "t0": 46.59, "t1": 65.81, "title": "防御：限额、监控、升级", "points": ["单笔和单位时间提款有上限，超过进延迟队列", "A 链锁定不少于 B 链铸造，对不上自动暂停", "升级必须经过时间锁，初始化参数必须审计"], "notes": ["然后是限额。单笔和单位时间的提款都有上限，超过就进延迟队列。", "监控两侧的总量。A 链锁定的，要不少于 B 链铸造的。对不上，就自动暂停。", "最后是升级。桥合约升级必须经过时间锁，初始化参数必须审计。"], "section": "防御清单"}, {"seg": "5", "t0": 65.81, "t1": 83.59, "title": "交易所充值也是一座桥", "points": ["交易所相信链上有转账，再在内部账本记账", "假币合约会发出同名的转账事件", "要核对代币合约地址，不看名称和符号"], "notes": ["同样的问题，也出现在交易所的充值系统里。", "交易所相信链上发生了一笔转账，然后在内部账本上记账。这也是一座桥。", "假币合约会发出同名的转账事件。所以要核对代币合约地址，不看名称和符号。"], "section": "防御清单"}, {"seg": "5", "t0": 83.59, "t1": 109.24, "title": "防假充值", "points": ["TRON 上转账失败的交易仍会上链、有交易哈希", "先确认回执状态成功，再看事件", "交易哈希加日志序号做幂等键；等够确认数"], "notes": ["在 TRON 上，转账失败的交易，比如能量不足，仍然会上链，也有交易哈希。", "只看交易存在就入账，就会出现假充值。要先确认回执状态是成功，再看事件。", "同一笔交易，用交易哈希加日志序号做幂等键，防止重复入账。", "入账前等够确认数，防止源链重组把这笔交易抹掉。"], "section": "防御清单"}, {"seg": "6", "t0": 0.0, "t1": 32.57, "title": "今天能做的一件事", "points": ["写桥：源链、目标链、两侧合约和序号写进消息哈希", "审计：算一算攻破几个独立组织就能放行伪造消息", "用户：看桥靠什么验证（L2BEAT），只用官方入口"], "notes": ["每个人，今天能做一件事。", "写桥的人，把源链、目标链、两侧合约和序号，全部写进消息哈希。", "审计的人，列出签名人和运营商，算一算攻破几个独立组织，就能放行一条伪造消息。", "普通用户，跨链前先看这座桥靠什么验证。L2BEAT 会列出风险。", "只用官方入口。跨链后核对收到的代币合约地址，不要长期拿着映射代币。"], "section": "今天能做什么"}, {"seg": "6", "t0": 32.57, "t1": 55.73, "title": "回到开头：两个", "points": ["门限是 9 个里要 5 个，可签名人并不独立", "前提是那项本应撤销的授权仍在生效", "证明机制被骗，桥上的钱就会被骗走"], "notes": ["回到开头的问题。9 个验证者，最少要攻破几个组织？", "两个。门限是 9 个里要 5 个，可签名人并不独立。", "这个答案成立的前提，是那项本应撤销的授权仍在生效。", "跨链桥的安全，就看 B 链凭什么相信。证明机制被骗，桥上的钱就会被骗走。"], "section": "今天能做什么"}]};
  var S = D.slides, N = S.length, KEY = 'deck-' + D.chapter;
  var $ = function (id) { return document.getElementById(id); };
  var screen = $('screen'), frames = {}, ready = {}, pending = {}, cur = -1, playing = false, seen = {};
  var store = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  try { var pt = parent !== window && parent.document.documentElement.getAttribute('data-theme'); if (pt) document.documentElement.setAttribute('data-theme', pt); } catch (e) {}
  try { seen = JSON.parse(store.get(KEY + '-seen') || '{}') || {}; } catch (e) { seen = {}; }

  $('title').textContent = D.title;
  $('eyebrow').textContent = '拟物化知识讲解 · 第 ' + D.chapter.replace(/\D/g, '') + ' 章';

  // progress: one group per section
  var prog = $('prog'), groups = [];
  S.forEach(function (s, i) {
    var g = groups[groups.length - 1];
    if (!g || g.seg !== s.seg) { g = { seg: s.seg, el: document.createElement('div') }; g.el.className = 'grp'; groups.push(g); prog.appendChild(g.el); g.n = 0; }
    var b = document.createElement('button'); b.title = (i + 1) + ' · ' + s.title; b.setAttribute('aria-label', '第 ' + (i + 1) + ' 页：' + s.title);
    b.onclick = function () { go(i, 'seek'); }; g.el.appendChild(b); g.n++; s.dot = b;
  });
  groups.forEach(function (g) { g.el.style.setProperty('--n', g.n); });

  function scale() { var k = screen.clientWidth / 1920; for (var s in frames) frames[s].style.transform = 'scale(' + k + ')'; }
  if (window.ResizeObserver) new ResizeObserver(scale).observe(screen); else addEventListener('resize', scale);

  function frame(seg) {
    if (frames[seg]) return frames[seg];
    var f = document.createElement('iframe'); f.src = 's' + seg + '.html'; f.title = '第 ' + seg + ' 节动画'; f.tabIndex = -1;
    f.setAttribute('aria-hidden', 'true'); screen.appendChild(f); frames[seg] = f; scale(); return f;
  }
  function send(seg, msg) {
    msg.deck = 'cmd';
    if (ready[seg]) frames[seg].contentWindow.postMessage(msg, '*'); else pending[seg] = msg;
  }
  addEventListener('message', function (e) {
    var m = e.data || {};
    if (!m.deck || !frames[m.seg] || e.source !== frames[m.seg].contentWindow) return;
    if (m.deck === 'ready') {
      ready[m.seg] = true;
      if (pending[m.seg]) { var p = pending[m.seg]; delete pending[m.seg]; send(m.seg, p); }
      if (cur >= 0 && S[cur].seg === m.seg) $('wait').hidden = true;
    } else if (m.deck === 'done' && cur >= 0 && S[cur].seg === m.seg) { playing = false; paint(); }
  });

  function paint() {
    var s = S[cur];
    $('sec').textContent = s.section;
    $('stitle').textContent = s.title;
    $('points').innerHTML = ''; s.points.forEach(function (p) { var li = document.createElement('li'); li.textContent = p; $('points').appendChild(li); });
    $('lines').innerHTML = ''; s.notes.forEach(function (p) { var li = document.createElement('li'); li.textContent = p; $('lines').appendChild(li); });
    $('count').textContent = (cur + 1) + ' / ' + N;
    $('prev').disabled = cur === 0;
    $('next').textContent = playing ? '跳到本页结尾 ›' : (cur === N - 1 ? '回到正文 ›' : '下一页 ›');
    S.forEach(function (x, i) { x.dot.className = i === cur ? 'cur' : (seen[i] ? 'seen' : ''); });
  }
  function go(i, mode) {
    if (i < 0 || i >= N) return;
    var s = S[i]; cur = i; seen[i] = 1; store.set(KEY, i); store.set(KEY + '-seen', JSON.stringify(seen));
    var f = frame(s.seg);
    for (var k in frames) frames[k].classList.toggle('on', k === s.seg);
    $('wait').hidden = !!ready[s.seg];
    playing = mode === 'play';
    send(s.seg, playing ? { play: [s.t0, s.t1], rate: +$('speed').value } : { seek: s.t1 });
    // warm the next segment while this one is on screen
    if (i + 1 < N && S[i + 1].seg !== s.seg) frame(S[i + 1].seg);
    paint();
  }
  function next() {
    if (playing) { go(cur, 'seek'); return; }
    if (cur === N - 1) { back(); return; }
    go(cur + 1, 'play');
  }
  function prev() { go(cur - 1, 'seek'); }
  function back() {
    if (parent !== window) parent.postMessage({ cexNav: D.chapter }, '*');
    else location.href = '../../index.html#' + D.chapter;
  }
  function fullscreen() {
    var a = $('app');
    if (document.fullscreenElement) document.exitFullscreen(); else if (a.requestFullscreen) a.requestFullscreen().catch(function () {});
  }
  if (!document.fullscreenEnabled) $('fs').hidden = true;

  $('next').onclick = next; $('prev').onclick = prev; $('replay').onclick = function () { go(cur, 'play'); };
  $('back').onclick = back; $('fs').onclick = fullscreen;
  addEventListener('keydown', function (e) {
    if (e.target.tagName === 'SELECT' || e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { e.preventDefault(); next(); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); prev(); }
    else if (k === 'r' || k === 'R') go(cur, 'play');
    else if (k === 'f' || k === 'F') fullscreen();
    else if (k === 'n' || k === 'N') $('notes').open = !$('notes').open;
    else if (k === 'Home') go(0, 'seek');
    else if (k === 'End') go(N - 1, 'seek');
  });
  // tap = next; horizontal swipe = next / previous
  var x0 = null, y0 = null;
  screen.addEventListener('pointerdown', function (e) { x0 = e.clientX; y0 = e.clientY; });
  screen.addEventListener('pointerup', function (e) {
    if (x0 === null) return;
    var dx = e.clientX - x0, dy = e.clientY - y0; x0 = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { dx < 0 ? next() : prev(); }
    else if (Math.abs(dx) < 8 && Math.abs(dy) < 8) next();
  });

  var start = +store.get(KEY); if (!(start >= 0 && start < N)) start = 0;
  go(start, start === 0 ? 'play' : 'seek');
})();
