  <script>
    (function () {

      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.35) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAWA = (s, t, d = 0.5) => tl.fromTo(s, { strokeDashoffset: 1, opacity: 0 }, { strokeDashoffset: 0, opacity: 1, duration: d, ease: "power2.inOut" }, t);
      const NS = "http://www.w3.org/2000/svg";
      // 任何地址：8 个灰点
      const any = document.querySelector("#c-anyone"), P = [];
      for (let i = 0; i < 8; i++) {
        const c = document.createElementNS(NS, "circle");
        const x = 180 + (i % 4) * 100, y = 230 + Math.floor(i / 4) * 120;
        c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", 22); c.setAttribute("fill", "#8a8f99"); c.setAttribute("opacity", "0");
        any.appendChild(c); P.push({ c, x, y });
      }
      const coins = document.querySelector("#c-coins"), K = [];
      for (let i = 0; i < 8; i++) {
        const c = document.createElementNS(NS, "circle");
        c.setAttribute("cx", 760); c.setAttribute("cy", 285); c.setAttribute("r", 14); c.setAttribute("fill", "#F0B90B"); c.setAttribute("opacity", "0");
        coins.appendChild(c); K.push(c);
      }

      // L0 ① 标题
      IN("#c-t1", at(0, 0.05), 0.5, { x: -20 }, { x: 0 });
      // L1 公开增发，任何人都能调用
      IN("#c-code", at(1, 0.0), 0.6);
      P.forEach((p, i) => IN(p.c, at(1, 0.25) + i * 0.05, 0.3));
      IN("#c-anyt", at(1, 0.3), 0.4);
      K.forEach((c, i) => { const t = at(1, 0.55) + i * 0.08; IN(c, t, 0.1); tl.to(c, { attr: { cx: P[i].x, cy: P[i].y - 30 }, duration: 0.6, ease: "power2.out" }, t); });
      IN("#c-print", at(1, 0.75), 0.4);
      // L2 加上角色检查
      tl.to("#c-l2a", { opacity: 0, duration: 0.2 }, at(2, 0.05));
      IN("#c-l2b", at(2, 0.08), 0.4);
      K.forEach((c) => tl.to(c, { opacity: 0, duration: 0.3 }, at(2, 0.3)));
      OUT("#c-print", at(2, 0.3), 0.3);
      tl.to(P.map((p) => p.c), { opacity: 0.25, duration: 0.4 }, at(2, 0.35));
      IN("#c-block", at(2, 0.4), 0.3);
      IN("#c-minter", at(2, 0.55), 0.4, { scale: 0.5, svgOrigin: "560 290" }, { scale: 1 });
      // L3 ② tx.origin

      IN("#c-t2", at(3, 0.05), 0.5, { x: -20 }, { x: 0 });

      DRAWA("#c-e2", at(4, 0.15)); IN("#c-you", at(4, 0.2), 0.4);
      IN("#c-to", at(4, 0.3), 0.4);
      IN("#c-ms", at(4, 0.65), 0.5);

      tl.to("#c-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["check"] = tl;
    })();
