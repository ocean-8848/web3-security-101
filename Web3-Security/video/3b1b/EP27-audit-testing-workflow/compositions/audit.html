<template>
  <style>

  </style>
  <div id="root" data-composition-id="audit" data-duration="38.08" data-width="1920" data-height="1080">
    <svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
      <g id="a-all">
        <line id="a-line" class="h" x1="200" y1="340" x2="1720" y2="340" stroke="#2a2f3a" stroke-width="5" />
        <g id="a-commits" font-family="JetBrains Mono"></g>
        <text id="a-note" class="h" x="1720" y="440" font-size="28" fill="#6b6f7a" text-anchor="end">提交哈希为示意</text>

        <!-- 审计对象 -->
        <g id="a-st" class="h">
          <rect x="580" y="170" width="300" height="80" rx="10" fill="#0f1117" stroke="#83C167" stroke-width="4" />
          <text x="730" y="222" font-size="32" fill="#83C167" text-anchor="middle" font-weight="700">审计对象</text>
        </g>
        <g id="a-lock" class="h">
          <rect x="705" y="376" width="50" height="40" rx="6" fill="#58C4DD" />
          <path d="M715 376 v-14 a15 15 0 0 1 30 0 v14" fill="none" stroke="#58C4DD" stroke-width="5" />
          <text x="730" y="460" font-size="28" fill="#58C4DD" text-anchor="middle">冻结</text>
        </g>
        <text id="a-two" class="h" x="400" y="215" font-size="30" fill="#83C167" text-anchor="middle">两家以上审计</text>
        <g id="a-fix" class="h">
          <rect x="880" y="470" width="240" height="70" rx="10" fill="#0f1117" stroke="#FF9F43" stroke-width="3" />
          <text x="1000" y="516" font-size="30" fill="#FF9F43" text-anchor="middle">修复 → 复审</text>
        </g>

        <!-- 编译器 -->
        <g id="a-comp" class="h">
          <rect x="200" y="560" width="620" height="110" rx="14" fill="#161a22" stroke="#FF9F43" stroke-width="3" />
          <text x="510" y="606" font-size="30" fill="#e8e6df" text-anchor="middle">编译器版本：记录并审查已知 bug</text>
          <text x="510" y="648" font-size="28" fill="#FF9F43" text-anchor="middle">Vyper 2023：问题出在编译器</text>
        </g>

        <!-- 审计范围 -->
        <g id="a-scope" class="h">
          <rect x="1000" y="600" width="480" height="300" rx="18" fill="none" stroke="#83C167" stroke-width="3" stroke-dasharray="12 8" />
          <text x="1240" y="645" font-size="30" fill="#83C167" text-anchor="middle">审计范围内</text>
          <g fill="#121a22" stroke="#58C4DD" stroke-width="3"><rect x="1040" y="680" width="120" height="80" rx="10" /><rect x="1180" y="680" width="120" height="80" rx="10" /><rect x="1320" y="680" width="120" height="80" rx="10" /><rect x="1110" y="780" width="120" height="80" rx="10" /><rect x="1250" y="780" width="120" height="80" rx="10" /></g>
          <g fill="#161a22" stroke="#6b6f7a" stroke-width="3"><rect x="1560" y="680" width="120" height="80" rx="10" /><rect x="1560" y="780" width="120" height="80" rx="10" /></g>
          <text x="1620" y="645" font-size="28" fill="#8a8f99" text-anchor="middle">范围外：标明</text>

        <!-- 之后的提交 -->
        <text id="a-live" class="h" x="1660" y="250" font-size="36" fill="#FC6255" text-anchor="middle" font-weight="800">线上？</text>

          <text x="960" y="760" font-size="56" fill="#e8e6df" text-anchor="middle" font-weight="800">「审计过」只对<tspan fill="#83C167">这个版本</tspan>成立</text>
          <text x="960" y="840" font-size="34" fill="#8a8f99" text-anchor="middle">代码每改一行，结论就要重新问一遍</text>
        </g>
      </g>
    </svg>
  </div>
  <script>
    (function () {
      const C = /*CUES*/{"d": 38.08, "L": [[0.6, 5.95], [6.4, 14.06], [14.51, 20.41], [20.86, 28.06], [28.51, 36.98]]}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.35) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const NS = "http://www.w3.org/2000/svg";

      // 提交链（哈希为示意）
      const H = ["a1c0", "77de", "3f9a", "b204", "e51f", "0c93", "9d4e"];
      const host = document.querySelector("#a-commits"), CM = [];
      H.forEach((h, i) => {
        const x = 260 + i * 233;
        const g = document.createElementNS(NS, "g"); g.setAttribute("opacity", "0");
        g.innerHTML = `<circle cx="${x}" cy="340" r="22" fill="#121a22" stroke="#58C4DD" stroke-width="4" /><text x="${x}" y="300" font-size="28" fill="#8a8f99" text-anchor="middle">${h}…</text>`;
        host.appendChild(g); CM.push({ g, x });
      });
      const AUD = 2, FIX = 3;

      // L0 提交链；审计对象 = 一个提交哈希
      IN("#a-line", at(0, 0.0), 0.5, { scaleX: 0, svgOrigin: "200 340" }, { scaleX: 1 });
      [0, 1, 2].forEach((i) => IN(CM[i].g, at(0, 0.1) + i * 0.25, 0.3, { scale: 0.85, svgOrigin: `${CM[i].x} 340` }, { scale: 1 }));
      IN("#a-note", at(0, 0.3), 0.4);
      tl.to(CM[AUD].g.querySelector("circle"), { fill: "#83C167", stroke: "#83C167", duration: 0.3 }, at(0, 0.6));
      IN("#a-st", at(0, 0.6), 0.4, { scale: 1.5, svgOrigin: "730 210" }, { scale: 1, ease: "back.out(2)" });

      // L1 冻结、多家审计、修复复审
      IN("#a-lock", at(1, 0.0), 0.4);
      IN("#a-two", at(1, 0.3), 0.4);
      IN(CM[FIX].g, at(1, 0.6), 0.3, { scale: 0.85, svgOrigin: `${CM[FIX].x} 340` }, { scale: 1 });
      IN("#a-fix", at(1, 0.68), 0.4);
      tl.to(CM[FIX].g.querySelector("circle"), { fill: "#83C167", stroke: "#83C167", duration: 0.3 }, at(1, 0.9));

      // L2 编译器
      IN("#a-comp", at(2, 0.05), 0.5, { y: 20 }, { y: 0 });

      // L3 审计范围
      IN("#a-scope", at(3, 0.0), 0.6);
      IN("#a-nomod", at(3, 0.6), 0.4);

      // L4 之后的提交不在结论里
      tl.to(["#a-comp", "#a-scope", "#a-nomod", "#a-fix", "#a-two", "#a-lock"], { opacity: 0, duration: 0.4 }, at(4, 0.0));
      [4, 5, 6].forEach((i, k) => IN(CM[i].g, at(4, 0.08) + k * 0.25, 0.3, { scale: 0.85, svgOrigin: `${CM[i].x} 340` }, { scale: 1 }));
      tl.to(CM[6].g.querySelector("circle"), { stroke: "#FC6255", duration: 0.3 }, at(4, 0.3));
      IN("#a-live", at(4, 0.32), 0.4);
      IN("#a-end", at(4, 0.45), 0.6, { filter: "blur(6px)" }, { filter: "blur(0px)" });

      tl.to("#a-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["audit"] = tl;
    })();
  </script>
