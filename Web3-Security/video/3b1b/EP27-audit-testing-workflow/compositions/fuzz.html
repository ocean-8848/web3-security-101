      const tl = gsap.timeline({ paused: true });

      const OUT = (s, t, d = 0.35) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const NS = "http://www.w3.org/2000/svg";
      let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      const dot = (host, x, y, r) => { const c = document.createElementNS(NS, "circle"); c.setAttribute("cx", x.toFixed(1)); c.setAttribute("cy", y); c.setAttribute("r", r); c.setAttribute("opacity", "0"); host.appendChild(c); return c; };

      const R2 = []; for (let i = 0; i < 70; i++) R2.push(dot(document.querySelector("#f-rain"), 210 + rnd() * 1500, 760, 7));
      const HL = (k, t) => tl.to(`#f-k${k}`, { stroke: "#58C4DD", strokeWidth: 4, duration: 0.3 }, t);

      IN("#f-axis", at(0, 0.25), 0.5, { scaleX: 0, svgOrigin: "520 460" }, { scaleX: 1 });
      IN("#f-axist", at(0, 0.35), 0.4);
      IN("#f-u", at(0, 0.5), 0.4);
      IN("#f-ut", at(0, 0.6), 0.4);

      // L1 模糊测试：大量随机点 + 性质

      tl.to(["#f-u", "#f-ut"], { opacity: 0.3, duration: 0.3 }, at(1, 0.05));
      R1.forEach((c, i) => tl.fromTo(c, { opacity: 0, y: -60 }, { opacity: 0.9, y: 0, duration: 0.35, ease: "power2.in" }, at(1, 0.1) + i * 0.05));

      IN("#f-c3x", at(4, 0.75), 0.4, { scale: 1.3, svgOrigin: "1600 860" }, { scale: 1 });

      IN("#f-nl", at(5, 0.05), 0.4);

      R2.forEach((c, i) => tl.fromTo(c, { opacity: 0, y: -120 }, { opacity: 0.85, y: 0, duration: 0.3, ease: "power2.in" }, at(5, 0.12) + i * 0.035));
