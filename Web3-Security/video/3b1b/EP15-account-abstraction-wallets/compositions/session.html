  <script>
    (function () {
      const C = /*CUES*/{"d": 48.13, "L": [[0.6, 7.32], [7.77, 14.03], [14.48, 24.9], [25.35, 32.91], [33.36, 38.14], [38.59, 47.03]]}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.35) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      // 线条画出；带箭头的路径同时 class="h"，opacity 0→1，箭头头部随线出现
      const DRAW = (s, t, d = 0.6) => tl.fromTo(s, { strokeDashoffset: 1, opacity: 0 }, { strokeDashoffset: 0, opacity: 1, duration: d, ease: "power2.inOut" }, t);
      const NODE = (s, t, d = 0.5) => IN(s, t, d, { scale: 0.85, transformOrigin: "50% 50%" }, { scale: 1, ease: "expo.out" });
      const POP = (s, t, d = 0.4) => IN(s, t, d, { scale: 1.6, transformOrigin: "50% 50%" }, { scale: 1, ease: "back.out(2)" });
      const NS = "http://www.w3.org/2000/svg";
      // 用户点阵（示意，不代表数量）
      const uh = document.querySelector("#s-users"), U = [];
      for (let r = 0; r < 6; r++) for (let c = 0; c < 16; c++) {
        if (r >= 2 && r <= 3 && c >= 5 && c <= 10) continue;
        const e = document.createElementNS(NS, "circle");
        e.setAttribute("cx", 360 + c * 80); e.setAttribute("cy", 250 + r * 100); e.setAttribute("r", 12); e.setAttribute("fill", "#8a8f99"); e.setAttribute("opacity", 0);
        uh.appendChild(e); U.push(e);
      }

      NODE("#s-main", at(0, 0.0));
      DRAW("#s-a1", at(0, 0.3), 0.5);
      NODE("#s-sk", at(0, 0.45));
      IN("#s-skt", at(0, 0.5), 0.4);
      // L1 四个维度
      gsap.utils.toArray("#root .s-dim").forEach((g, i) => IN(g, at(1, 0.15) + i * 0.18, 0.4, { x: 20 }, { x: 0 }));
      // L2 累计：一步步算
      tl.to("#s-capr", { stroke: "#FF9F43", strokeWidth: 6, duration: 0.3 }, at(2, 0.0));
      IN("#s-rule", at(2, 0.1), 0.4);
      IN(["#s-track", "#s-fill"], at(2, 0.25), 0.3);
      tl.fromTo("#s-fill", { attr: { width: 0 } }, { attr: { width: 160 } , duration: 0.8, ease: "power1.inOut" }, at(2, 0.3));

      OUT(["#s-intro", "#s-calc"], at(3, 0.0), 0.35);
      IN("#s-cxt", at(3, 0.05), 0.5);
      U.forEach((e, i) => tl.to(e, { opacity: 1, duration: 0.2 }, at(3, 0.15) + i * 0.012));
      NODE("#s-fe", at(3, 0.5));
      // L4 数字
      U.forEach((e, i) => tl.to(e, { attr: { fill: "#FC6255" }, duration: 0.2 }, at(4, 0.05) + i * 0.008));
      IN("#s-n1", at(4, 0.1), 0.5);
      IN("#s-n2", at(4, 0.5), 0.5);
      // L5 范围起了作用

      IN("#s-game", at(5, 0.1), 0.5);
      IN("#s-safe", at(5, 0.3), 0.5);
      tl.fromTo("#s-fence", { opacity: 0, scale: 1.15, svgOrigin: "520 510" }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, at(5, 0.6));
      IN("#s-ok", at(5, 0.7), 0.5);
      tl.to("#s-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["session"] = tl;
    })();
  </script>
