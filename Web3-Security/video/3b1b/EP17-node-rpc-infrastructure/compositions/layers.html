<template>

  </style>
  <div id="root" data-composition-id="layers" data-duration="48.96" data-width="1920" data-height="1080">
    <svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="y-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8a8f99" /></marker>

      <g id="y-all">

          <path class="y-ar dr h" pathLength="1" d="M1460 300 L 1500 300" />
        </g>

        <path id="y-netl" class="dr" pathLength="1" d="M950 465 L 950 360" fill="none" stroke="#6b6f7a" stroke-width="3" stroke-dasharray="1" />
        <!-- 失败点 -->
        <g font-weight="800" font-size="40" fill="#FC6255" text-anchor="middle">
          <text id="y-x1" class="h" x="605" y="225">✕</text>
          <text id="y-x2" class="h" x="955" y="225">✕</text>

        </g>
        <g id="y-c1" class="h">
          <text x="160" y="680" font-size="32" fill="#e8e6df" font-weight="700">2020-11 · Infura</text>

          <text x="1260" y="730" font-size="30" fill="#8a8f99">2018 MyEtherWallet ≈ 15 万美元</text>

        <text id="y-one" class="h" x="960" y="980" font-size="38" fill="#FF9F43" text-anchor="middle" font-weight="700">每一层都可能出错；充值扫描却常常只连一个 RPC</text>

  </div>
  <script>
    (function () {
      const C = /*CUES*/{"d": 48.96, "L": [[0.6, 9.91], [10.36, 21.81], [22.26, 29.56], [30.01, 40.45], [40.9, 47.86]]}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.35) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      // 线条画出；带箭头的路径同时 class="h"，opacity 0→1，箭头头部随线出现
      const DRAW = (s, t, d = 0.6) => tl.fromTo(s, { strokeDashoffset: 1, opacity: 0 }, { strokeDashoffset: 0, opacity: 1, duration: d, ease: "power2.inOut" }, t);
      const NODE = (s, t, d = 0.5) => IN(s, t, d, { scale: 0.85, transformOrigin: "50% 50%" }, { scale: 1, ease: "expo.out" });
      const POP = (s, t, d = 0.4) => IN(s, t, d, { scale: 1.6, transformOrigin: "50% 50%" }, { scale: 1, ease: "back.out(2)" });
      const NS = "http://www.w3.org/2000/svg";
      const NAMES = [["P2P 网络", "#58C4DD"], ["节点", "#B48EF0"], ["RPC 服务", "#B48EF0"], ["索引器", "#B48EF0"], ["你的系统", "#F0B90B"]];
      const nh = document.querySelector("#y-nodes"), N = [];
      NAMES.forEach(([t, c], i) => {
        const x = 110 + i * 350;
        const g = document.createElementNS(NS, "g"); g.setAttribute("opacity", 0);
        g.innerHTML = `<rect class="bx" x="${x}" y="250" width="300" height="100" rx="16" fill="#161a22" stroke="${c}" stroke-width="3" /><text x="${x + 150}" y="312" font-size="32" fill="#e8e6df" text-anchor="middle">${t}</text>`;
        nh.appendChild(g); N.push(g);
      });
      const AR = gsap.utils.toArray("#root .y-ar");
      // L0 一层层
      N.forEach((g, i) => { NODE(g, at(0, 0.05 + i * 0.15)); if (i) DRAW(AR[i - 1], at(0, i * 0.15), 0.3); });
      IN("#y-net", at(0, 0.8), 0.4);
      tl.fromTo("#y-netl", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.4 }, at(0, 0.85));
      // L1 节点
      POP("#y-x1", at(1, 0.05)); IN("#y-c1", at(1, 0.15), 0.5);
      // L2 RPC
      POP("#y-x2", at(2, 0.05)); IN("#y-c2", at(2, 0.15), 0.5);
      const C2 = document.querySelectorAll("#y-c2 text"), C3 = document.querySelectorAll("#y-c3 text"), C1 = document.querySelectorAll("#y-c1 text");
      [0.45, 0.75].forEach((f, i) => tl.fromTo(C2[i + 1], { opacity: 0 }, { opacity: 1, duration: 0.4 }, at(2, f)));
      [0.35, 0.55, 0.75].forEach((f, i) => tl.fromTo(C3[i + 1], { opacity: 0 }, { opacity: 1, duration: 0.4 }, at(3, f)));
      [0.45, 0.75].forEach((f, i) => tl.fromTo(C1[i + 1], { opacity: 0 }, { opacity: 1, duration: 0.4 }, at(1, f)));
      // L3 路由
      POP("#y-x3", at(3, 0.05)); IN("#y-c3", at(3, 0.15), 0.5);
      // L4 只连一个 RPC
      tl.to(["#y-c1", "#y-c2", "#y-c3"], { opacity: 0.3, duration: 0.4 }, at(4, 0.0));
      tl.to(N[4].querySelector(".bx"), { strokeWidth: 7, duration: 0.3, yoyo: true, repeat: 3 }, at(4, 0.5));
      IN("#y-one", at(4, 0.4), 0.5);
      tl.to("#y-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["layers"] = tl;
    })();
  </script>
