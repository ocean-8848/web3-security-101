  <script>
    (function () {
      const C = /*CUES*/{"d": 52.51, "L": [[0.6, 8.33], [8.78, 19.22], [19.67, 30.59], [31.04, 44.41], [44.86, 51.41]]}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.35) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.6) => tl.fromTo(s, { strokeDashoffset: 1, opacity: 0 }, { strokeDashoffset: 0, opacity: 1, duration: d, ease: "power2.inOut" }, t);

      // 粉丝：确定性网格 + 固定种子抖动
      let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      const host = document.querySelector("#o-dots"), dots = [];
      for (let r = 0; r < 6; r++) for (let c = 0; c < 8; c++) {
        const x = 980 + c * 90 + rnd() * 30, y = 270 + r * 100 + rnd() * 30;
        const e = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        e.setAttribute("cx", x.toFixed(1)); e.setAttribute("cy", y.toFixed(1)); e.setAttribute("r", "16");
        e.setAttribute("fill", "#8a8f99"); e.setAttribute("opacity", "0");
        host.appendChild(e); dots.push({ e, hit: rnd() < 0.3 });
      }

      // L0 官方账号与粉丝
      IN("#o-acct", at(0, 0.0), 0.6);
      dots.forEach((d, i) => tl.fromTo(d.e, { opacity: 0 }, { opacity: 1, duration: 0.3 }, at(0, 0.15) + i * 0.02));
      IN("#o-trust", at(0, 0.55), 0.5);
      tl.fromTo("#o-wave", { opacity: 1, attr: { r: 120 } }, { opacity: 0, attr: { r: 1300 }, duration: 1.6, ease: "power1.out", immediateRender: false }, at(0, 0.7));

      // L1 Vitalik：假 NFT 链接，签名的粉丝被清空
      IN(["#o-case1", "#o-case1b"], at(1, 0.0), 0.5);
      tl.to("#o-acct circle", { stroke: "#FC6255", duration: 0.4 }, at(1, 0.15));
      tl.fromTo("#o-wave2", { opacity: 1, attr: { r: 120 } }, { opacity: 0, attr: { r: 1300 }, duration: 1.6, ease: "power1.out", immediateRender: false }, at(1, 0.3));
      const hit = dots.filter((d) => d.hit);
      hit.forEach((d, i) => tl.to(d.e, { fill: "#FC6255", duration: 0.25 }, at(1, 0.45) + i * 0.08));
      IN(["#o-amt", "#o-amtn"], at(1, 0.6), 0.5);
      const n = { v: 0 }, num = document.querySelector("#o-num");
      tl.fromTo(n, { v: 0 }, { v: 69.1, duration: 1.8, ease: "power2.out", onUpdate: () => { num.textContent = n.v.toFixed(1); } }, at(1, 0.6));

      // L2 Mandiant 改名冒充
      OUT("#o-fan", at(2, 0), 0.4);
      IN("#o-mand", at(2, 0.05), 0.6);
      IN("#o-n1", at(2, 0.1), 0.5);
      tl.to("#o-n1", { opacity: 0, y: -30, duration: 0.4 }, at(2, 0.3));
      IN("#o-n2", at(2, 0.3) + 0.2, 0.4, { y: 30 }, { y: 0 });
      tl.to("#o-mr", { stroke: "#FC6255", duration: 0.4 }, at(2, 0.35));
      IN("#o-dr", at(2, 0.45), 0.4);
      IN("#o-2fa", at(2, 0.7), 0.5);

      // L3 FTX
      OUT(["#o-mand", "#o-n2", "#o-dr", "#o-2fa"], at(3, 0), 0.4);
      IN("#o-src", at(3, 0.05), 0.5);
      IN("#o-phone", at(3, 0.12), 0.5);
      IN("#o-ex", at(3, 0.2), 0.5);
      DRAW("#o-arr", at(3, 0.32), 0.6); IN("#o-arrt", at(3, 0.35), 0.4);
      tl.to("#o-phone rect:first-child", { stroke: "#FC6255", duration: 0.3 }, at(3, 0.32));
      gsap.utils.toArray("#root .o-c").forEach((c, i) => tl.to(c, { x: 400, fill: "#FC6255", opacity: 0, duration: 0.8, ease: "power3.in" }, at(3, 0.5) + i * 0.08));
      IN("#o-4", at(3, 0.55), 0.5);

      // L4 手机号 = 特权凭证
      tl.to(["#o-arr", "#o-arrt", "#o-ex", "#o-4", "#o-src"], { opacity: 0.2, duration: 0.4 }, at(4, 0.0));
      tl.to("#o-phone rect:first-child", { stroke: "#B48EF0", strokeWidth: 8, duration: 0.4 }, at(4, 0.2));
      IN("#o-priv", at(4, 0.35), 0.6, { filter: "blur(6px)" }, { filter: "blur(0px)" });

      tl.to("#o-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["social"] = tl;
    })();
