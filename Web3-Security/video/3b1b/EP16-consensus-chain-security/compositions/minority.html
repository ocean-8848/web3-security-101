        const h = document.querySelector(host), out = [];

        }
        return out;
      };
      const HON = MK("#n-hon", 9, 230, "#8a8f99", "#161a22", 140, false);
      const HOLD = MK("#n-hold", 6, 360, "#FC6255", "#2a1416", 140 + 4 * 120, true);

      const m18 = document.querySelector("#n-18"), M = [];
