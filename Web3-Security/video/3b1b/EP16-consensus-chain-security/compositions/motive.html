    (function () {

      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.35) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      // 线条画出；带箭头的路径同时 class="h"，opacity 0→1，箭头头部随线出现

      const NODE = (s, t, d = 0.5) => IN(s, t, d, { scale: 0.85, transformOrigin: "50% 50%" }, { scale: 1, ease: "expo.out" });
      const POP = (s, t, d = 0.4) => IN(s, t, d, { scale: 1.6, transformOrigin: "50% 50%" }, { scale: 1, ease: "back.out(2)" });
      const NS = "http://www.w3.org/2000/svg";
      // 投票人：8 个灰点
      const vh = document.querySelector("#v-voters"), V = [];

        const x = 700 + (i % 4) * 160, y = 220 + Math.floor(i / 4) * 140;

          `<text x="${x}" y="${y + 10}" font-size="28" fill="#8a8f99" text-anchor="middle">票</text>`;
        vh.appendChild(g); V.push(g);
      }
      // 三家交易所，金币 = 托管的客户 STEEM
      const eh = document.querySelector("#v-ex"), E = [];
      ["交易所 A", "交易所 B", "交易所 C"].forEach((t, i) => {
        const y = 230 + i * 190;
        const g = document.createElementNS(NS, "g"); g.setAttribute("opacity", 0);
        g.innerHTML = `<rect x="200" y="${y}" width="420" height="150" rx="16" fill="#1a1708" stroke="#F0B90B" stroke-width="3" />` +
          `<text x="240" y="${y + 60}" font-size="32" fill="#e8e6df">${t}</text>` +

          `<path class="vv" d="M630 ${y + 75} C 900 ${y + 75}, 1000 ${450 + i * 80}, 1250 ${450 + i * 80}" fill="none" stroke="#F0B90B" stroke-width="4" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" />`;
        eh.appendChild(g); E.push(g);
      });
      const sg = document.querySelector("#v-seatg"), SEAT = [];
      for (let i = 0; i < 10; i++) {
        const c = document.createElementNS(NS, "circle");
        c.setAttribute("cx", 1330 + (i % 5) * 80); c.setAttribute("cy", 480 + Math.floor(i / 5) * 140); c.setAttribute("r", 28);
        c.setAttribute("fill", "#161a22"); c.setAttribute("stroke", "#58C4DD"); c.setAttribute("stroke-width", 3); c.setAttribute("opacity", 0);
        sg.appendChild(c); SEAT.push(c);

      // L0 攻击者什么都不持有
      NODE("#v-atk", at(0, 0.05));
      V.forEach((g, i) => IN(g, at(0, 0.35) + i * 0.06, 0.3));
      // L1 P+ε
      IN("#v-tab", at(1, 0.1), 0.5);
      tl.to(V.map((g) => g.querySelector(".dot")), { stroke: "#F0B90B", fill: "#1a1708", duration: 0.3, stagger: 0.08 }, at(1, 0.55));
      IN("#v-dom", at(1, 0.6), 0.5);
      // L2 Steem
      OUT("#v-pe", at(2, 0.0), 0.35);
      IN("#v-stt", at(2, 0.05), 0.4);
      E.forEach((g, i) => IN(g, at(2, 0.15) + i * 0.1, 0.4, { x: -20 }, { x: 0 }));
      IN("#v-seats", at(2, 0.3), 0.4);
      SEAT.forEach((c, i) => tl.to(c, { opacity: 1, duration: 0.15 }, at(2, 0.35) + i * 0.03));
