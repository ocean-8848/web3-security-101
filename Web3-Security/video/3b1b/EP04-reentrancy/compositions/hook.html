<template>
  <style>
    @font-face { font-family: "NotoSC"; src: url("assets/fonts/noto-sc.woff2") format("woff2"); font-weight: 100 900; }
    #root { position: absolute; inset: 0; background: #0f1117; overflow: hidden; }
    #root svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    #root text { font-family: "NotoSC", sans-serif; }
    #root .mono { font-family: "JetBrains Mono", monospace; }
    #root .h { opacity: 0; }
    #root .dr { stroke-dasharray: 1; stroke-dashoffset: 1; }
  </style>
  <div id="root" data-composition-id="hook" data-duration="24.91" data-width="1920" data-height="1080">
    <svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
      <g id="h-all">
        <text id="h-date" class="h" x="120" y="140" font-size="34" fill="#6b6f7a" letter-spacing="2">2016 年 6 月 · The DAO</text>
        <g id="h-vault" class="h">
          <rect x="1300" y="220" width="480" height="400" rx="22" fill="#121a22" stroke="#58C4DD" stroke-width="4" />
          <text x="1540" y="290" font-size="38" fill="#58C4DD" text-anchor="middle" font-weight="700">The DAO 合约</text>
          <g fill="#F0B90B">
            <circle class="h-coin" cx="1420" cy="380" r="24" /><circle class="h-coin" cx="1500" cy="380" r="24" /><circle class="h-coin" cx="1580" cy="380" r="24" /><circle class="h-coin" cx="1660" cy="380" r="24" />
            <circle class="h-coin" cx="1420" cy="460" r="24" /><circle class="h-coin" cx="1500" cy="460" r="24" /><circle class="h-coin" cx="1580" cy="460" r="24" /><circle class="h-coin" cx="1660" cy="460" r="24" />
            <circle class="h-coin" cx="1420" cy="540" r="24" /><circle class="h-coin" cx="1500" cy="540" r="24" /><circle class="h-coin" cx="1580" cy="540" r="24" /><circle class="h-coin" cx="1660" cy="540" r="24" />
          </g>
        </g>
        <text id="h-amount" class="h" x="1540" y="730" font-size="72" fill="#F0B90B" text-anchor="middle" font-weight="800">≈ <tspan id="h-num">0</tspan> 万 ETH</text>
        <text id="h-usd" class="h" x="1540" y="790" font-size="32" fill="#8a8f99" text-anchor="middle">事发时约 6,000 万美元</text>

        <!-- 两行代码 -->
        <g id="h-code" class="h">
          <rect x="120" y="300" width="1080" height="320" rx="20" fill="#0b0e14" stroke="#58C4DD" stroke-opacity=".5" stroke-width="3" />
          <text x="160" y="360" font-size="30" fill="#6b6f7a">提款函数里的两行（示意）</text>
        </g>
        <text id="h-l1" class="h mono" x="160" y="450" font-size="36" fill="#e8e6df">msg.sender.call{value: amt}("");</text>
        <text id="h-l2" class="h mono" x="160" y="550" font-size="36" fill="#e8e6df">balances[msg.sender] = 0;</text>
        <g id="h-t1" class="h"><rect x="930" y="412" width="220" height="54" rx="27" fill="#2a2208" stroke="#F0B90B" stroke-width="2" /><text x="1040" y="449" font-size="30" fill="#F0B90B" text-anchor="middle">① 转钱</text></g>
        <g id="h-t2" class="h"><rect x="930" y="512" width="220" height="54" rx="27" fill="#121a12" stroke="#83C167" stroke-width="2" /><text x="1040" y="549" font-size="30" fill="#83C167" text-anchor="middle">② 清零记账</text></g>
        <text id="h-rev" class="h" x="660" y="690" font-size="40" fill="#FC6255" text-anchor="middle" font-weight="700">顺序写反了</text>

        <text id="h-q" class="h" x="960" y="950" font-size="64" fill="#e8e6df" text-anchor="middle" font-weight="700">为什么要<tspan fill="#83C167">先记账</tspan>，再<tspan fill="#F0B90B">转钱</tspan>？</text>
      </g>
      <g id="h-pin" class="h">
        <rect x="80" y="70" width="560" height="84" rx="14" fill="none" stroke="#FF9F43" stroke-width="3" stroke-dasharray="10 8" />
        <text x="360" y="125" font-size="34" fill="#e8e6df" text-anchor="middle">为什么要先记账，再转钱？</text>
      </g>
    </svg>
  </div>
  <script>
    (function () {
      const C = /*CUES*/{"d": 24.91, "L": [[0.6, 8.02], [8.47, 14.11], [14.56, 19.19], [19.64, 23.81]]}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.35) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);

      // L0 The DAO 被提走
      IN("#h-date", at(0, 0), 0.5);
      IN("#h-vault", at(0, 0.05), 0.8, { y: 20 }, { y: 0 });
      gsap.utils.toArray("#root .h-coin").forEach((c, i) => {
        tl.to(c, { x: 360 + (i % 4) * 30, y: (i % 3 - 1) * 70, fill: "#FC6255", opacity: 0, duration: 0.9, ease: "power3.in" }, at(0, 0.3) + i * 0.1);
      });
      IN("#h-amount", at(0, 0.35), 0.5);
      const n = { v: 0 }, num = document.querySelector("#h-num");
      tl.fromTo(n, { v: 0 }, { v: 360, duration: 1.8, ease: "power2.out", onUpdate: () => { num.textContent = Math.round(n.v); } }, at(0, 0.35));
      IN("#h-usd", at(0, 0.75), 0.4);
      // L1 两行顺序写反
      IN("#h-code", at(1, 0.0), 0.6);
      IN("#h-l1", at(1, 0.15), 0.4);
      IN("#h-l2", at(1, 0.25), 0.4);
      IN("#h-rev", at(1, 0.65), 0.4);
      tl.to("#h-l1", { y: 100, duration: 0.5, ease: "power2.inOut", yoyo: true, repeat: 1 }, at(1, 0.7));
      tl.to("#h-l2", { y: -100, duration: 0.5, ease: "power2.inOut", yoyo: true, repeat: 1 }, at(1, 0.7));
      // L2 一行转钱，一行清零
      IN("#h-t1", at(2, 0.05), 0.4, { x: 20 }, { x: 0 });
      tl.to("#h-l1", { fill: "#F0B90B", duration: 0.3 }, at(2, 0.05));
      IN("#h-t2", at(2, 0.5), 0.4, { x: 20 }, { x: 0 });
      tl.to("#h-l2", { fill: "#83C167", duration: 0.3 }, at(2, 0.5));
      // L3 问题
      tl.to(["#h-date", "#h-vault", "#h-amount", "#h-usd", "#h-rev"], { opacity: 0.2, duration: 0.5 }, at(3, 0.0));
      IN("#h-q", at(3, 0.1), 0.6, { filter: "blur(8px)" }, { filter: "blur(0px)" });
      tl.to("#h-all", { opacity: 0, filter: "blur(6px)", duration: 0.6, ease: "power2.in" }, at(3, 0.5));
      IN("#h-pin", at(3, 0.55), 0.6, { scale: 1.5, svgOrigin: "360 112" }, { scale: 1 });
      OUT("#h-pin", C.d - 0.4, 0.3);
      window.__timelines["hook"] = tl;
    })();
  </script>
</template>
