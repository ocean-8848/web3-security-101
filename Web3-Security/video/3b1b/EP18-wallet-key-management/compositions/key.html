  <script>
    (function () {
      const C = /*CUES*/{"d": 37.75, "L": [[0.6, 4.92], [5.37, 12.62], [13.07, 20.51], [20.96, 25.97], [26.42, 36.65]]}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.35) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      const DRAWA = (s, t, d = 0.6) => tl.fromTo(s, { strokeDashoffset: 1, opacity: 0 }, { strokeDashoffset: 0, opacity: 1, duration: d, ease: "power2.inOut" }, t);

      // 64 个十六进制字符（固定种子，示意）
      let seed = 18; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      let hex = ""; for (let i = 0; i < 64; i++) hex += "0123456789abcdef"[Math.floor(rnd() * 16)];
      document.querySelector("#k-hex").textContent = hex.slice(0, 32) + "…";

      // 助记词格子：12 个编号空格
      const NS = "http://www.w3.org/2000/svg", mn = document.querySelector("#k-mn"), pills = [];
      for (let i = 0; i < 12; i++) {
        const x = 420 + (i % 6) * 185, y = 270 + Math.floor(i / 6) * 80;
        const g = document.createElementNS(NS, "g"); g.setAttribute("opacity", "0");
        g.innerHTML = `<rect x="${x}" y="${y}" width="160" height="58" rx="29" fill="#1a1524" stroke="#B48EF0" stroke-width="2" />` +
          `<text x="${x + 30}" y="${y + 40}" font-size="28" fill="#B48EF0" text-anchor="middle">${i + 1}</text>` +
          `<line x1="${x + 60}" y1="${y + 36}" x2="${x + 140}" y2="${y + 36}" stroke="#6b6f7a" stroke-width="3" />`;
        mn.appendChild(g); pills.push(g);
      }

      // L0 私钥 = 256 位随机数
      tl.fromTo("#k-main", { scale: 1, svgOrigin: "966 540" }, { scale: 2, duration: 0.8, ease: "expo.out" }, at(0, 0));
      IN("#k-bits", at(0, 0.25), 0.6, { filter: "blur(6px)" }, { filter: "blur(0px)" });
      const hx = { v: 0 }, hexEl = document.querySelector("#k-hex");
      tl.fromTo(hx, { v: 0 }, { v: 32, duration: 1.4, ease: "none", onUpdate: () => { hexEl.textContent = hex.slice(0, Math.round(hx.v)) + (hx.v >= 31.5 ? "…" : ""); } }, at(0, 0.25));

      // L1 链上只认签名；谁拿到私钥，谁签
      tl.to("#k-main", { x: -40, duration: 0.6, ease: "power2.inOut" }, at(1, 0));
      IN("#k-you", at(1, 0.02), 0.4);
      IN("#k-tx", at(1, 0.08), 0.5);
      DRAWA("#k-a1", at(1, 0.15), 0.5);
      DRAW("#k-sig", at(1, 0.22), 0.7);
      IN("#k-chain", at(1, 0.32), 0.4);
      // 私钥换到攻击者手里，再签一次
      IN("#k-atk", at(1, 0.5), 0.4);
      tl.to("#k-main", { y: 220, duration: 0.7, ease: "power2.inOut" }, at(1, 0.55));
      tl.to("#k-a1", { attr: { d: "M1040 760 L 1300 620" }, duration: 0.7, ease: "power2.inOut" }, at(1, 0.55));
      IN("#k-atkt", at(1, 0.62), 0.4);
      IN("#k-coins", at(1, 0.78), 0.3);
      tl.to("#k-coins", { x: -780, y: -40, fill: "#FC6255", duration: 0.9, ease: "power2.in" }, at(1, 0.8));
      OUT("#k-coins", at(1, 0.8) + 0.8, 0.3);

      // L2 助记词 → 推导出一组私钥
      OUT(["#k-tx", "#k-a1", "#k-chain", "#k-you", "#k-atk", "#k-atkt", "#k-bits"], at(2, 0), 0.35);
      tl.to("#k-main", { x: 0, y: -70, scale: 1.3, duration: 0.7, ease: "power2.inOut" }, at(2, 0.05));
      tl.to("#k-main", { opacity: 0, duration: 0.3 }, at(2, 0.25));
      pills.forEach((p, i) => IN(p, at(2, 0.1) + i * 0.06, 0.3, { y: 10 }, { y: 0 }));
      IN("#k-mnt", at(2, 0.12), 0.5);
      gsap.utils.toArray("#root .k-br").forEach((p, i) => DRAW(p, at(2, 0.55) + i * 0.1, 0.5));
      gsap.utils.toArray("#root .k-kid").forEach((p, i) => IN(p, at(2, 0.62) + i * 0.1, 0.4, { scale: 0.5, transformOrigin: "50% 50%" }, { scale: 1 }));
      IN("#k-kidt", at(2, 0.75), 0.4);

      // L3 保险柜钥匙，可无限复制
      tl.to("#k-all", { opacity: 0, duration: 0.4 }, at(3, 0));
      IN("#k-safe", at(3, 0.05), 0.5);
      IN("#k-big", at(3, 0.1), 0.5, { scale: 0.6, svgOrigin: "706 520" }, { scale: 1.6 });
      gsap.utils.toArray("#root .k-cl").forEach((g, i) => IN(g, at(3, 0.55) + i * 0.12, 0.35, { x: (i % 2 ? -150 : 150), y: (i < 2 ? 160 : -160) }, { x: 0, y: 0 }));
      IN("#k-copy", at(3, 0.6), 0.4);

      // L4 比方不成立：真钥匙复制留痕，私钥复制无痕
      OUT(["#k-safe", "#k-copy"], at(4, 0), 0.3);
      tl.to("#k-big", { x: -220, y: -60, duration: 0.6, ease: "power2.inOut" }, at(4, 0));
      tl.to("#root .k-cl", { opacity: 0, duration: 0.3 }, at(4, 0));
      IN("#k-div", at(4, 0.05), 0.4);
      IN("#k-lh", at(4, 0.05), 0.4);
      IN("#k-rh", at(4, 0.3), 0.4);
      IN("#k-trace", at(4, 0.12), 0.5);
      IN("#k-none", at(4, 0.35), 0.5);
      IN("#k-rcoins", at(4, 0.32), 0.3);
      tl.to("#k-rcoins circle", { x: 420, fill: "#FC6255", opacity: 0, duration: 0.8, stagger: 0.1, ease: "power2.in" }, at(4, 0.68));
      IN("#k-late", at(4, 0.72), 0.4);

      tl.to(["#k-all", "#k-meta"], { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["key"] = tl;
    })();
  </script>
