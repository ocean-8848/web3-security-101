    (function () {
      const C = /*CUES*/{"d": 59.79, "L": [[0.6, 7.75], [8.2, 14.03], [14.48, 22.28], [22.73, 29.29], [29.74, 41.21], [41.66, 51.52], [51.97, 58.69]]}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.35) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      const DRAWA = (s, t, d = 0.5) => tl.fromTo(s, { strokeDashoffset: 1, opacity: 0 }, { strokeDashoffset: 0, opacity: 1, duration: d, ease: "power2.inOut" }, t);

      // L0 发起人提交：冷钱包向热钱包转 1,000 ETH
      IN("#g-p", at(0, 0.05), 0.5);
      IN("#g-tx", at(0, 0.4), 0.5, { y: 20 }, { y: 0 });

      // L1 前端算哈希 → 硬件钱包
      DRAWA("#g-a1", at(1, 0.0), 0.4);
      IN("#g-fe", at(1, 0.05), 0.5);
      tl.to("#g-tx", { x: 460, y: 0, scale: 0.6, svgOrigin: "250 170", opacity: 0.0, duration: 0.7, ease: "power2.in" }, at(1, 0.15));
      DRAWA("#g-a2", at(1, 0.45), 0.4);
      IN("#g-hash", at(1, 0.5), 0.4);
      IN("#g-hw", at(1, 0.6), 0.5);
      IN("#g-tb", at(1, 0.8), 0.5);

      // L2 多签只数同意了哪个哈希
      DRAWA("#g-a3", at(2, 0.0), 0.4);
      IN("#g-c", at(2, 0.05), 0.5);
      gsap.utils.toArray("#root .g-ck").forEach((c, i) => tl.to(c, { opacity: 1, duration: 0.2 }, at(2, 0.3) + i * 0.25));
      IN("#g-only", at(2, 0.45), 0.4);
      IN("#g-what", at(2, 0.78), 0.4);

      // L3 前端被篡改
      tl.to("#g-fer", { stroke: "#FC6255", strokeOpacity: 1, duration: 0.3 }, at(3, 0.05));
      IN("#g-swap", at(3, 0.25), 0.5);
      tl.fromTo("#g-real", { opacity: 0 }, { opacity: 1, duration: 0.4 }, at(3, 0.6));

      // L4 独立重算哈希，两边一致再签
      gsap.utils.toArray("#root .g-f").forEach((f, i) => IN(f, at(4, 0.12) + i * 0.1, 0.35, { x: -20 }, { x: 0 }));
      IN("#g-tool", at(4, 0.3), 0.5);
      gsap.utils.toArray("#root .g-fl").forEach((p, i) => DRAWA(p, at(4, 0.4) + i * 0.06, 0.5));
      DRAWA("#g-ta", at(4, 0.62), 0.4);
      IN("#g-cmp", at(4, 0.68), 0.5);
      IN("#g-cmpn", at(4, 0.8), 0.4);

      // L5 operation：0 普通调用，1 DELEGATECALL
      tl.to("#g-opr", { stroke: "#FF9F43", strokeWidth: 4, duration: 0.3 }, at(5, 0.0));
      IN("#g-op0", at(5, 0.12), 0.5);
      IN("#g-op1", at(5, 0.4), 0.5);
      IN("#g-opn", at(5, 0.75), 0.5);
      tl.to("#g-op1", { opacity: 0.3, duration: 0.2, yoyo: true, repeat: 3 }, at(5, 0.85));

      // L6 局限：共用同一个工具
      OUT(["#g-cmp", "#g-cmpn", "#g-ta", "#g-op0", "#g-op1", "#g-opn"], at(6, 0), 0.3);
      gsap.utils.toArray("#root .g-sh").forEach((s, i) => IN(s, at(6, 0.15) + i * 0.1, 0.4));
      gsap.utils.toArray("#root .g-shl").forEach((p, i) => DRAW(p, at(6, 0.3) + i * 0.1, 0.5));
      tl.to("#g-tool rect", { stroke: "#FF9F43", duration: 0.3 }, at(6, 0.6));
      IN("#g-spof", at(6, 0.62), 0.5);

      tl.to("#g-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["sign"] = tl;
    })();
