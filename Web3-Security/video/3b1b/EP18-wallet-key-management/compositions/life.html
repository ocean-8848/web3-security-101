  <script>
    (function () {
      const C = /*CUES*/{"d": 60.73, "L": [[0.6, 9.77], [10.22, 17.03], [17.48, 24.8], [25.25, 37.61], [38.06, 49.01], [49.46, 59.63]]}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.35) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      const DRAWA = (s, t, d = 0.5) => tl.fromTo(s, { strokeDashoffset: 1, opacity: 0 }, { strokeDashoffset: 0, opacity: 1, duration: d, ease: "power2.inOut" }, t);
      const NS = "http://www.w3.org/2000/svg";

      // 32 位种子：32 个小格
      const bits = document.querySelector("#l-bits"), bitEls = [];
      for (let i = 0; i < 32; i++) {
        const r = document.createElementNS(NS, "rect");
        r.setAttribute("x", (560 + i * 25).toString()); r.setAttribute("y", "340"); r.setAttribute("width", "19"); r.setAttribute("height", "40"); r.setAttribute("rx", "3");
        r.setAttribute("fill", "#FF9F43"); r.setAttribute("opacity", "0");
        bits.appendChild(r); bitEls.push(r);
      }
      // 助记词格子（不写词）
      const pl = document.querySelector("#l-pills"), pills = [];
      for (let i = 0; i < 4; i++) {
        const r = document.createElementNS(NS, "rect");
        r.setAttribute("x", "430"); r.setAttribute("y", (440 + i * 50).toString()); r.setAttribute("width", "70"); r.setAttribute("height", "30"); r.setAttribute("rx", "15");
        r.setAttribute("fill", "#B48EF0"); r.setAttribute("opacity", "0");
        pl.appendChild(r); pills.push(r);
      }

      // L0 生命周期五步，每步一个事故点
      IN("#l-line", at(0, 0.05), 0.6);
      gsap.utils.toArray("#root .l-n").forEach((n, i) => IN(n, at(0, 0.1) + i * 0.4, 0.4, { scale: 0.5, transformOrigin: "50% 30%" }, { scale: 1, ease: "back.out(2)" }));
      gsap.utils.toArray("#root .l-x").forEach((n, i) => IN(n, at(0, 0.7) + i * 0.15, 0.3, { scale: 2, transformOrigin: "50% 50%" }, { scale: 1 }));

      // L1 生成：Profanity 32 位种子
      IN("#l-focus", at(1, 0), 0.4);
      IN("#l-prof", at(1, 0.15), 0.5);
      bitEls.forEach((b, i) => IN(b, at(1, 0.45) + i * 0.03, 0.2));

      // L2 2^32 一步步算
      IN("#l-c1", at(2, 0.0), 0.4);
      OUT("#l-c1", at(2, 0.18), 0.2);
      IN("#l-c2", at(2, 0.2), 0.4);
      IN("#l-c3", at(2, 0.35), 0.5, { scale: 0.7, svgOrigin: "960 595" }, { scale: 1 });
      IN("#l-gpu", at(2, 0.55), 0.3);
      tl.fromTo("#l-gpuf", { attr: { width: 0 } }, { attr: { width: 796 }, duration: 1.0, ease: "power1.in" }, at(2, 0.6));
      IN("#l-gpur", at(2, 0.6) + 1.0, 0.3);
      IN("#l-full", at(2, 0.62), 0.5);

      // L3 Wintermute：转走 ETH，没撤销权限，约 5 天后被盗
      OUT("#l-gen", at(3, 0), 0.4);
      IN("#l-focus2", at(3, 0.02), 0.4);
      IN("#l-adm", at(3, 0.05), 0.5);
      IN("#l-eth", at(3, 0.1), 0.3);
      IN("#l-vault", at(3, 0.12), 0.5);
      DRAW("#l-perm", at(3, 0.15), 0.6);
      tl.to("#l-eth", { y: -200, opacity: 0, duration: 0.8, ease: "power2.in" }, at(3, 0.36));
      IN("#l-ethm", at(3, 0.4), 0.4);
      IN("#l-permt", at(3, 0.55), 0.4);
      tl.to("#l-perm", { strokeWidth: 9, duration: 0.25, yoyo: true, repeat: 1 }, at(3, 0.58));
      IN("#l-days", at(3, 0.72), 0.4);
      tl.to("#l-perm", { stroke: "#FC6255", duration: 0.3 }, at(3, 0.8));
      gsap.utils.toArray("#root .l-vc").forEach((c, i) => tl.to(c, { x: 360, y: -60 + (i % 3) * 40, fill: "#FC6255", opacity: 0, duration: 0.7, ease: "power3.in" }, at(3, 0.82) + i * 0.06));
      IN("#l-wml", at(3, 0.85), 0.4);
      IN("#l-wmr", at(3, 0.86), 0.4);

      // L4 存储：Slope 助记词进了日志
      OUT("#l-wm", at(4, 0), 0.4);
      OUT(["#l-focus2"], at(4, 0), 0.3);
      tl.to("#l-focus", { attr: { x: 600 }, duration: 0.5, ease: "power2.inOut" }, at(4, 0.0));
      IN("#l-phone", at(4, 0.05), 0.5);
      IN("#l-log", at(4, 0.12), 0.5);
      DRAWA("#l-sla", at(4, 0.2), 0.5);
      IN("#l-plain", at(4, 0.3), 0.4);
      pills.forEach((p, i) => {
        tl.fromTo(p, { opacity: 0, x: 0, y: 0 }, { opacity: 1, duration: 0.15 }, at(4, 0.28) + i * 0.25);
        tl.to(p, { x: 900, y: 75 - i * 50, duration: 0.8, ease: "power2.inOut" }, at(4, 0.28) + i * 0.25 + 0.15);
      });
      IN("#l-sln", at(4, 0.62), 0.5);

      // L5 存储：恶意版本
      OUT("#l-sl", at(5, 0), 0.4);
      IN("#l-store", at(5, 0.12), 0.5);
      DRAWA("#l-twa", at(5, 0.3), 0.4);
      IN("#l-ext", at(5, 0.33), 0.5);
      DRAWA("#l-twb", at(5, 0.55), 0.5);
      IN("#l-twx", at(5, 0.6), 0.4);
      IN("#l-twn", at(5, 0.78), 0.5);

      tl.to("#l-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["life"] = tl;
    })();
  </script>
