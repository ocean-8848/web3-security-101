        <!-- ① 助记词软件钱包：手机里 -->
        <g id="s-p1" class="h">

        <!-- ② 硬件钱包：芯片内，只往外盖章 -->
        <g id="s-p2" class="h">
          <rect x="490" y="330" width="250" height="240" rx="20" fill="#161a22" stroke="#e8e6df" stroke-opacity=".6" stroke-width="3" />
          <rect x="520" y="355" width="190" height="70" rx="6" fill="#0f1117" stroke="#6b6f7a" stroke-width="2" />
          <rect x="575" y="455" width="80" height="80" rx="8" fill="#1a1524" stroke="#B48EF0" stroke-width="3" />
          <text x="615" y="505" font-size="28" fill="#B48EF0" text-anchor="middle">芯片</text>
          <text x="615" y="820" font-size="32" fill="#e8e6df" text-anchor="middle" font-weight="700">硬件钱包</text>
          <text x="615" y="865" font-size="28" fill="#8a8f99" text-anchor="middle">私钥不出设备</text>

        <!-- ③ 多签：几把独立私钥 + 链上合约 -->
        <g id="s-p3" class="h">
          <use href="#s-keyshape" x="890" y="330" /><use href="#s-keyshape" x="1030" y="330" /><use href="#s-keyshape" x="960" y="400" />
          <rect x="870" y="470" width="180" height="120" rx="14" fill="#121a22" stroke="#58C4DD" stroke-width="4" />

          <path class="dr s-p3d" pathLength="1" d="M890 350 L 920 465" /><path class="dr s-p3d" pathLength="1" d="M1030 350 L 1000 465" /><path class="dr s-p3d" pathLength="1" d="M960 420 L 960 465" />
        </g>
        <text id="s-p3ok" class="h" x="960" y="680" font-size="30" fill="#83C167" text-anchor="middle">凑够才执行</text>

        <!-- ④ MPC：分片各自计算，合成一个签名 -->
        <g id="s-p4">
          <path class="s-sh h" d="M1300 440 L 1300 340 A 100 100 0 0 1 1386.6 490 Z" fill="#1a1524" stroke="#B48EF0" stroke-width="3" />
          <path class="s-sh h" d="M1300 440 L 1386.6 490 A 100 100 0 0 1 1213.4 490 Z" fill="#1a1524" stroke="#B48EF0" stroke-width="3" />
          <path class="s-sh h" d="M1300 440 L 1213.4 490 A 100 100 0 0 1 1300 340 Z" fill="#1a1524" stroke="#B48EF0" stroke-width="3" />
        </g>
        <g id="s-p4l" fill="none" stroke="#B48EF0" stroke-opacity=".7" stroke-width="3">
          <path class="dr s-p4d" pathLength="1" d="M1385 420 C 1390 520, 1330 610, 1300 640" /><path class="dr s-p4d" pathLength="1" d="M1300 600 L 1300 640" /><path class="dr s-p4d" pathLength="1" d="M1215 420 C 1210 520, 1270 610, 1300 640" />
        </g>
        <circle id="s-p4sig" class="h" cx="1300" cy="660" r="20" fill="#e8e6df" />

          <text x="1300" y="865" font-size="28" fill="#8a8f99" text-anchor="middle">完整私钥从不出现</text>
        </g>

        <!-- ⑤ HSM：按指令盖章 -->
        <g id="s-p5" class="h">
          <rect x="1560" y="340" width="220" height="230" rx="12" fill="#14171e" stroke="#8a8f99" stroke-width="4" />
          <rect x="1580" y="360" width="180" height="190" rx="6" fill="none" stroke="#8a8f99" stroke-width="2" stroke-dasharray="6 6" />
          <use href="#s-keyshape" x="1676" y="455" />
          <text x="1670" y="820" font-size="32" fill="#e8e6df" text-anchor="middle" font-weight="700">HSM</text>
          <text x="1670" y="865" font-size="28" fill="#8a8f99" text-anchor="middle">私钥不可导出</text>
        </g>
        <g id="s-p5i" class="h"><rect x="1600" y="230" width="140" height="56" rx="10" fill="#161a22" stroke="#e8e6df" stroke-opacity=".6" stroke-width="2" /><text x="1670" y="268" font-size="28" fill="#e8e6df" text-anchor="middle">指令</text></g>
        <path id="s-p5a" class="dr h" pathLength="1" d="M1670 290 L 1670 335" stroke="#8a8f99" stroke-width="3" fill="none" marker-end="url(#s-ah)" />

        <text id="s-p5x" class="h" x="1670" y="200" font-size="30" fill="#FF9F43" text-anchor="middle">不判断对错</text>

  <script>
    (function () {
      const C = /*CUES*/{"d": 49.0, "L": [[0.6, 5.21], [5.66, 13.7], [14.15, 23.44], [23.89, 30.25], [30.7, 38.69], [39.14, 47.9]]}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.35) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      const DRAWA = (s, t, d = 0.5) => tl.fromTo(s, { strokeDashoffset: 1, opacity: 0 }, { strokeDashoffset: 0, opacity: 1, duration: d, ease: "power2.inOut" }, t);
      const DIM = (s, t) => tl.to(s, { opacity: 0.35, duration: 0.4 }, t);

      // L0 标题；中央一把钥匙
      IN("#s-key0", at(0, 0), 0.5, { scale: 0.5, svgOrigin: "966 440" }, { scale: 1.4 });
      IN("#s-title", at(0, 0.2), 0.5);
      IN("#s-base", at(0, 0.5), 0.5);

      // L1 软件钱包：钥匙飞进手机；红点（恶意软件）钻进去
      tl.to("#s-key0", { x: -715, scale: 1, duration: 0.7, ease: "power2.inOut" }, at(1, 0.0));
      IN("#s-p1", at(1, 0.05), 0.6);
      tl.to("#s-key0", { opacity: 0, duration: 0.2 }, at(1, 0.0) + 0.7);
      IN("#s-mal", at(1, 0.6), 0.3);
      tl.to("#s-mal", { attr: { cx: 250, cy: 440 }, duration: 0.6, ease: "power2.in" }, at(1, 0.65));
      tl.to("#s-p1 use", { opacity: 0.25, duration: 0.3 }, at(1, 0.8));
      IN("#s-p1x", at(1, 0.8), 0.4);

      // L2 硬件钱包：只往外盖章；看清盖的是什么
      DIM(["#s-p1", "#s-mal", "#s-p1x"], at(2, 0));
      IN("#s-p2", at(2, 0.05), 0.6, { y: 20 }, { y: 0 });
      DRAWA("#s-p2a", at(2, 0.4), 0.5);
      IN("#s-p2s", at(2, 0.45), 0.4);
      IN("#s-p2q", at(2, 0.7), 0.4);
      tl.to("#s-p2q", { opacity: 0, duration: 0.2 }, at(2, 0.7) + 2.0);
      tl.to("#s-p2q", { opacity: 1, duration: 0.2 }, at(2, 0.7) + 2.2);

      // L3 多签
      DIM(["#s-p2", "#s-p2a", "#s-p2s", "#s-p2q"], at(3, 0));
      IN("#s-p3", at(3, 0.05), 0.6, { y: 20 }, { y: 0 });
      gsap.utils.toArray("#root .s-p3d").forEach((p, i) => DRAW(p, at(3, 0.35) + i * 0.1, 0.4));
      IN("#s-p3ok", at(3, 0.75), 0.4);

      // L4 MPC：分片分开 → 各自计算 → 合成一个签名
      DIM(["#s-p3", "#s-p3l", "#s-p3ok"], at(4, 0));
      const sh = gsap.utils.toArray("#root .s-sh");
      sh.forEach((s) => IN(s, at(4, 0.05), 0.4));
      tl.to(sh[0], { x: 40, y: -40, duration: 0.6, ease: "power2.out" }, at(4, 0.3));
      tl.to(sh[1], { y: 50, duration: 0.6, ease: "power2.out" }, at(4, 0.3));
      tl.to(sh[2], { x: -40, y: -40, duration: 0.6, ease: "power2.out" }, at(4, 0.3));
      gsap.utils.toArray("#root .s-p4d").forEach((p, i) => DRAW(p, at(4, 0.55) + i * 0.08, 0.5));
      IN("#s-p4sig", at(4, 0.7), 0.3, { scale: 0.3, svgOrigin: "1300 660" }, { scale: 1 });
      IN("#s-p4t", at(4, 0.2), 0.5);

      // L5 HSM：指令进，签名出，不判断
      DIM(["#s-p4", "#s-p4l", "#s-p4sig", "#s-p4t"], at(5, 0));
      IN("#s-p5", at(5, 0.05), 0.6, { y: 20 }, { y: 0 });
      IN("#s-p5i", at(5, 0.4), 0.4);
      DRAWA("#s-p5a", at(5, 0.45), 0.4);
      DRAWA("#s-p5b", at(5, 0.55), 0.4);
      IN("#s-p5s", at(5, 0.6), 0.3);
      IN("#s-p5x", at(5, 0.75), 0.4);
      // 末尾五种方案同时亮起
      tl.to(["#s-p1", "#s-p2", "#s-p3", "#s-p4", "#s-p3l", "#s-p4l", "#s-p4sig", "#s-p4t"], { opacity: 1, duration: 0.5 }, at(5, 1) + 0.2);

      tl.to("#s-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["schemes"] = tl;
    })();
  </script>
