    (function () {
      const C = /*CUES*/{"d": 54.4, "L": [[0.6, 5.06], [5.51, 12.86], [13.31, 24.44], [24.89, 31.35], [31.8, 39.84], [40.29, 53.3]]}/*END*/;

      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.35) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);

      // 流出的 COMP（位置固定）
      const NS = "http://www.w3.org/2000/svg", lh = document.querySelector("#t-leak"), coins = [];
      for (let i = 0; i < 28; i++) {
        const c = document.createElementNS(NS, "circle");
        c.setAttribute("cx", "720"); c.setAttribute("cy", String(330 + (i % 4) * 50)); c.setAttribute("r", "13"); c.setAttribute("opacity", "0");
        lh.appendChild(c); coins.push(c);
      }

      // L0 时间锁？
      IN("#t-door", at(0, 0.0), 0.6);
      IN("#t-clock", at(0, 0.3), 0.5, { scale: 0.5, svgOrigin: "1250 380" }, { scale: 1, ease: "back.out(2)" });
      IN("#t-q", at(0, 0.4), 0.5, { filter: "blur(6px)" }, { filter: "blur(0px)" });
      // L1 排队与公开
      OUT(["#t-door", "#t-clock", "#t-q"], at(1, 0), 0.35);
      IN("#t-queue", at(1, 0.05), 0.5);
      IN("#t-card", at(1, 0.1), 0.5);
      tl.fromTo("#t-fill", { opacity: 0, attr: { width: 0 } }, { opacity: 1, attr: { width: 1320 }, duration: 3.2, ease: "none" }, at(1, 0.2));
      tl.to("#t-card", { x: 1240, duration: 3.2, ease: "none" }, at(1, 0.2));
      IN("#t-eyes", at(1, 0.4), 0.5);
      IN("#t-public", at(1, 0.45), 0.5);
      // L2 Compound 提案 62
      OUT(["#t-queue", "#t-fill", "#t-card", "#t-eyes", "#t-public"], at(2, 0), 0.35);
      IN("#t-cdate", at(2, 0.03), 0.5);
      IN("#t-dist", at(2, 0.08), 0.6);
      coins.forEach((c, i) => {
        const t0 = at(2, 0.25) + i * ((at(3, 1) - at(2, 0.25)) / coins.length);
        tl.fromTo(c, { opacity: 0, x: 0 }, { opacity: 1, duration: 0.15 }, t0);
        tl.to(c, { x: 420 + (i % 3) * 40, fill: "#FC6255", opacity: 0, duration: 1.2, ease: "power1.in" }, t0 + 0.15);
      });
      IN("#t-num", at(2, 0.45), 0.5);
      const n = { v: 0 }, el = document.querySelector("#t-n");
      tl.fromTo(n, { v: 0 }, { v: 28, duration: 1.6, ease: "power2.out", onUpdate: () => { el.textContent = Math.round(n.v); } }, at(2, 0.5));
      // L3 没有紧急开关，修复要 7 天
      IN("#t-noswitch", at(3, 0.05), 0.5);
      IN("#t-gov", at(3, 0.4), 0.5);
      tl.fromTo("#t-gfill", { opacity: 0, attr: { width: 0 } }, { opacity: 1, attr: { width: 900 }, duration: 3.5, ease: "none" }, at(3, 0.45));
      // L4 两种权限分开
      OUT(["#t-cdate", "#t-dist", "#t-leak", "#t-num", "#t-noswitch", "#t-gov", "#t-gfill"], at(4, 0), 0.4);
      IN("#t-both", at(4, 0.05), 0.5);
      IN("#t-k1", at(4, 0.5), 0.5, { y: 20 }, { y: 0 });
      IN("#t-k2", at(4, 0.6), 0.5, { y: 20 }, { y: 0 });
      IN("#t-split", at(4, 0.75), 0.5);
      // L5 L2 的升级权限
      OUT(["#t-both", "#t-k1", "#t-k2", "#t-split"], at(5, 0), 0.4);
      IN("#t-proto", at(5, 0.05), 0.5);
      IN("#t-l2", at(5, 0.12), 0.5);
      IN("#t-l1", at(5, 0.2), 0.5);
      IN("#t-br", at(5, 0.25), 0.5);
      IN("#t-cap", at(5, 0.3), 0.5);
      IN("#t-ms", at(5, 0.65), 0.5, { x: 30 }, { x: 0 });

      tl.to("#t-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
