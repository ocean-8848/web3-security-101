  <script>
    (function () {
      const C = /*CUES*/{"d": 36.52, "L": [[0.6, 3.48], [3.93, 12.04], [12.49, 19.91], [20.36, 26.74], [27.19, 35.42]]}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.35) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.6) => tl.fromTo(s, { strokeDashoffset: 1, opacity: 0 }, { strokeDashoffset: 0, opacity: 1, duration: d, ease: "power2.inOut" }, t);

      // L0
      IN("#c-title", at(0, 0.05), 0.5);
      IN("#c-sep", at(0, 0.4), 0.5);

      // L1 ① 只查格式，不查业务
      IN("#c-1h", at(1, 0.0), 0.5);
      IN("#c-1req", at(1, 0.12), 0.5, { x: -30 }, { x: 0 });
      IN("#c-1gate", at(1, 0.25), 0.4);
      DRAW("#c-1a", at(1, 0.35), 0.5);
      IN("#c-1link", at(1, 0.6), 0.4);
      IN("#c-1biz", at(1, 0.65), 0.5);

      // L2 ② 单一来源：标签依次换过
      IN("#c-2h", at(2, 0.0), 0.5);
      IN("#c-2src", at(2, 0.08), 0.4, { scale: 0.6, svgOrigin: "960 420" }, { scale: 1, ease: "back.out(2)" });

      DRAW("#c-2a", at(2, 0.15), 0.4);
      const ss = gsap.utils.toArray("#root .c-2s");
      ss.forEach((s, i) => {
        IN(s, at(2, 0.28 + i * 0.15), 0.25);
        if (i < 3) OUT(s, at(2, 0.28 + (i + 1) * 0.15) - 0.15, 0.15);
      });
      tl.to("#c-2src", { stroke: "#FC6255", strokeOpacity: 1, strokeWidth: 6, duration: 0.4 }, at(2, 0.9));

      // L3 ③ 关掉服务，链上授权还在
      IN("#c-3h", at(3, 0.0), 0.5);
      IN("#c-3lab", at(3, 0.08), 0.4);
      IN("#c-3svc", at(3, 0.15), 0.4);
      IN("#c-3auth", at(3, 0.25), 0.4);

      IN("#c-3off", at(3, 0.5), 0.3);
      IN("#c-3on", at(3, 0.75), 0.4);

      // L4 对应三类防御
      gsap.utils.toArray("#root .c-fix").forEach((s, i) => IN(s, at(4, 0.08) + i * 0.5, 0.5, { y: 15 }, { y: 0 }));
      IN("#c-note", at(4, 0.55), 0.5);

      tl.to("#c-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["common"] = tl;
    })();
