      DRAW("#t-up", at(0, 0.45), 1.6);

      DRAWA("#t-buy", at(1, 0.5), 0.5); IN("#t-buyt", at(1, 0.5), 0.4);
      IN("#t-pot", at(1, 0.55), 0.4); IN("#t-hpt", at(1, 0.55), 0.4);

      gsap.utils.toArray("#root .t-in").forEach((g, i) => IN(g, at(2, 0.6) + i * 0.2, 0.4));
      tl.to("#root .t-in circle", { x: 300, opacity: 0, duration: 0.7, stagger: 0.1, ease: "power2.in" }, at(2, 0.85));

      const n = { v: 0 }, gn = document.querySelector("#t-gn");
