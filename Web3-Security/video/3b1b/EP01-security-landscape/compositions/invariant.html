  <script>
    (function () {
      const C = /*CUES*/{"d": 43.43, "L": [[0.6, 4.42], [4.87, 11.15], [11.6, 18.13], [18.58, 24.77], [25.22, 34.25], [34.7, 42.33]]}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.35) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.6) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      const DOT = (s, t) => IN(s, t, 0.4, { scale: 0.4, transformOrigin: "50% 30%" }, { scale: 1, ease: "back.out(2)" });

      // 模糊测试输入：固定种子的线性同余序列
      let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      const fz = document.querySelector("#i-fuzz"), dots = [];
      for (let i = 0; i < 46; i++) {
        const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        const x = 300 + rnd() * 1320, y = 260 + rnd() * 120;
        c.setAttribute("cx", x.toFixed(1)); c.setAttribute("cy", y.toFixed(1)); c.setAttribute("r", "7"); c.setAttribute("opacity", "0");
        fz.appendChild(c); dots.push({ c, dx: (960 - x) * 0.8, dy: 300 + rnd() * 60 });
      }

      // L0
      IN("#i-strip", at(0, 0.2), 0.6);
      IN("#i-title", at(0, 0.5), 0.6, { filter: "blur(8px)" }, { filter: "blur(0px)" });
      OUT("#i-title", at(2, 0.3), 0.3);
      // L1 资产、函数
      DOT("#i-s1", at(1, 0.05));
      DOT("#i-s2", at(1, 0.5));
      // L2 不变量
      DOT("#i-s3", at(2, 0.1));
      IN("#i-def", at(2, 0.45), 0.6, { filter: "blur(6px)" }, { filter: "blur(0px)" });
      // L3 例子
      tl.fromTo("#i-left", { opacity: 0, scaleY: 0, svgOrigin: "660 800" }, { opacity: 1, scaleY: 1, duration: 0.8, ease: "expo.out" }, at(3, 0.1));
      gsap.utils.toArray("#root .i-dep").forEach((r, i) => IN(r, at(3, 0.3) + i * 0.18, 0.35, { y: -60 }, { y: 0, ease: "power3.out" }));
      IN("#i-rt", at(3, 0.45), 0.4);
      IN("#i-ge", at(3, 0.72), 0.5, { scale: 0.5, svgOrigin: "960 600" }, { scale: 1, ease: "back.out(1.8)" });
      OUT("#i-def", at(3, 0.9), 0.3);

      // L4 四类追问
      DOT("#i-s4", at(4, 0.0));
      const pa = gsap.utils.toArray("#root .i-pa"), pt = gsap.utils.toArray("#root .i-pt");
      [0.12, 0.3, 0.48, 0.66].forEach((f, i) => { DRAW(pa[i], at(4, f), 0.5); IN(pt[i], at(4, f), 0.4); });
      tl.to("#i-ge", { fill: "#FF9F43", duration: 0.2, yoyo: true, repeat: 3 }, at(4, 0.8));

      // L5 测试验证
      DOT("#i-s5", at(5, 0.0));
      OUT([...pa, ...pt], at(5, 0.0), 0.3);
      dots.forEach((d, i) => {
        const t0 = at(5, 0.08) + i * 0.035;
        tl.fromTo(d.c, { opacity: 0, x: 0, y: 0 }, { opacity: 0.9, duration: 0.15 }, t0);
        tl.to(d.c, { x: d.dx, y: d.dy, opacity: 0, duration: 0.7, ease: "power2.in" }, t0 + 0.1);
      });
      IN("#i-ok", at(5, 0.45), 0.4);
      IN("#i-anchor", at(5, 0.62), 0.6, { filter: "blur(8px)" }, { filter: "blur(0px)" });

      tl.to(["#i-all", "#i-anchor"], { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["invariant"] = tl;
    })();
