  <script>
    (function () {
      const C = /*CUES*/{"d": 51.45, "L": [[0.6, 6.55], [7.0, 15.23], [15.68, 21.2], [21.65, 29.79], [30.24, 39.12], [39.57, 50.35]]}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.35) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.7) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);

      // 七条能力路径：静态几何，按序号生成
      const NS = "http://www.w3.org/2000/svg";
      const labels = ["任意参数调用公开函数", "部署恶意合约让你调用", "闪电贷借到巨款", "看到内存池并插队", "绕过函数直接转钱", "读取全部存储", "跨链重放签过的消息"];
      const caps = document.querySelector("#a-caps"), capt = document.querySelector("#a-capt");
      const paths = [], texts = [];
      labels.forEach((s, i) => {
        const Y = 200 + i * 110, yi = 380 + i * 55;
        const p = document.createElementNS(NS, "path");
        p.setAttribute("d", `M312 540 C 560 540, 640 ${Y + 14}, 830 ${Y + 14} C 1020 ${Y + 14}, 1120 ${yi}, 1345 ${yi}`);
        p.setAttribute("pathLength", "1");
        p.setAttribute("class", "dr");
        caps.appendChild(p); paths.push(p);
        const t = document.createElementNS(NS, "text");
        t.setAttribute("x", "830"); t.setAttribute("y", String(Y)); t.setAttribute("font-size", "30");
        t.setAttribute("fill", "#e8e6df"); t.setAttribute("text-anchor", "middle"); t.setAttribute("opacity", "0");
        t.textContent = s;
        capt.appendChild(t); texts.push(t);
      });
      const CAP = (i, t) => { DRAW(paths[i], t, 0.7); IN(texts[i], t + 0.25, 0.4); };

      // L0
      IN("#a-q", at(0, 0.45), 0.6, { filter: "blur(8px)" }, { filter: "blur(0px)" });
      IN("#a-atk", at(0, 0.1), 0.5, { scale: 0.6, svgOrigin: "250 540" }, { scale: 1, ease: "back.out(1.6)" });
      IN("#a-con", at(0, 0.2), 0.5);
      // L1–L3 七项能力
      CAP(0, at(1, 0.25)); CAP(1, at(1, 0.6));
      CAP(2, at(2, 0.05)); CAP(3, at(2, 0.5));
      CAP(4, at(3, 0.05)); CAP(5, at(3, 0.42)); CAP(6, at(3, 0.65));

      // L4 private
      tl.to([...paths, ...texts], { opacity: 0.15, duration: 0.4 }, at(4, 0));
      tl.to("#a-con", { opacity: 0, duration: 0.3 }, at(4, 0));
      IN("#a-priv", at(4, 0.1), 0.5, { scale: 0.9, svgOrigin: "1510 540" }, { scale: 1 });
      tl.fromTo("#a-scan", { opacity: 0, x: 0 }, { opacity: 0.9, x: 650, duration: 0.9, ease: "power1.inOut" }, at(4, 0.3));
      tl.to("#a-scan", { opacity: 0, duration: 0.2 }, at(4, 0.3) + 0.9);
      OUT("#a-dots", at(4, 0.3) + 0.45, 0.2);
      IN("#a-val", at(4, 0.3) + 0.45, 0.3);
      IN("#a-privt", at(4, 0.6), 0.5);

      // L5 通常做不到
      OUT(["#a-priv", "#a-privt", ...paths, ...texts], at(5, 0), 0.35);
      tl.to("#a-con", { opacity: 0.35, duration: 0.4 }, at(5, 0.05));
      IN("#a-wall", at(5, 0.05), 0.4);
      gsap.utils.toArray("#root .a-cn").forEach((p, i) => DRAW(p, at(5, 0.1) + i * 0.17 * (L[5][1] - L[5][0]) / 3, 0.6));
      gsap.utils.toArray("#root .a-ct").forEach((t, i) => IN(t, at(5, 0.12) + i * 0.17 * (L[5][1] - L[5][0]) / 3, 0.4));
      gsap.utils.toArray("#root .a-x").forEach((t, i) => IN(t, at(5, 0.1) + i * 0.17 * (L[5][1] - L[5][0]) / 3 + 0.55, 0.2, { scale: 1.8, transformOrigin: "50% 50%" }, { scale: 1 }));
      IN("#a-cond", at(5, 0.68), 0.5);

      tl.to("#a-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["attacker"] = tl;
    })();
  </script>
