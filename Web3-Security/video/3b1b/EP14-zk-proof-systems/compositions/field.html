<template>
  <style>
    @font-face { font-family: "NotoSC"; src: url("assets/fonts/noto-sc.woff2") format("woff2"); font-weight: 100 900; }
    #root { position: absolute; inset: 0; background: #0f1117; overflow: hidden; }
    #root svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    #root text { font-family: "NotoSC", sans-serif; }
    #root .mono { font-family: "JetBrains Mono", monospace; font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
    #root .h { opacity: 0; }
    #root .dr { stroke-dasharray: 1; stroke-dashoffset: 1; }
  </style>
  <div id="root" data-composition-id="field" data-duration="37.29" data-width="1920" data-height="1080">
    <svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="d-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FC6255" /></marker>
      </defs>
      <g id="d-all">
        <!-- 有限域：一个圆，数到 r 绕回 0 -->
        <path id="d-ring" class="dr" pathLength="1" d="M600 260 A 300 300 0 1 1 599.9 260" fill="none" stroke="#58C4DD" stroke-width="5" />
        <g id="d-ticks"></g>
        <text id="d-zero" class="h mono" x="600" y="235" font-size="34" fill="#e8e6df" text-anchor="middle">0 ≡ r</text>
        <text id="d-note" class="h" x="600" y="960" font-size="30" fill="#6b6f7a" text-anchor="middle">示意图：真实的 r 非常大</text>
        <circle id="d-walk" class="h" cx="600" cy="260" r="14" fill="#58C4DD" />

        <!-- x 与 x + r -->
        <circle id="d-x" class="h" cx="0" cy="0" r="20" fill="#58C4DD" />
        <text id="d-xt" class="h mono" x="0" y="0" font-size="40" fill="#58C4DD" font-weight="700">x</text>
        <text id="d-xrt" class="h mono" x="0" y="0" font-size="40" fill="#FF9F43" font-weight="700">x + r</text>
        <text id="d-same" class="h" x="600" y="575" font-size="38" fill="#e8e6df" text-anchor="middle">域里是同一个数</text>
        <text id="d-proof" class="h" x="600" y="635" font-size="32" fill="#83C167" text-anchor="middle">同一个证明：都 ✓</text>

        <!-- 合约账本：按整数记 -->
        <g id="d-led" class="h">
          <rect x="1120" y="250" width="640" height="560" rx="20" fill="#121a22" stroke="#58C4DD" stroke-width="4" />
          <text x="1440" y="320" font-size="36" fill="#58C4DD" text-anchor="middle" font-weight="700">合约：已用过的凭证</text>
          <text x="1440" y="365" font-size="28" fill="#8a8f99" text-anchor="middle">按整数记</text>
          <line x1="1160" y1="395" x2="1720" y2="395" stroke="#2a2f3a" stroke-width="3" />
        </g>
        <g id="d-row1" class="h"><text class="mono" x="1200" y="465" font-size="38" fill="#e8e6df">x</text><text x="1700" y="465" font-size="32" fill="#8a8f99" text-anchor="end">已用</text></g>
        <g id="d-row2" class="h"><text class="mono" x="1200" y="545" font-size="38" fill="#FF9F43">x + r</text><text x="1700" y="545" font-size="32" fill="#FC6255" text-anchor="end">“新值”，可用</text></g>
        <text id="d-again" class="h" x="1440" y="650" font-size="40" fill="#FC6255" text-anchor="middle" font-weight="800">同一个凭证，用了两次</text>
        <path id="d-arr" class="dr h" pathLength="1" d="M900 500 C 1000 470, 1080 500, 1180 530" fill="none" stroke="#FC6255" stroke-width="4" marker-end="url(#d-ah)" />

        <!-- 修复 -->
        <g id="d-fix" class="h">
          <rect x="1120" y="860" width="640" height="110" rx="18" fill="#12200f" stroke="#83C167" stroke-width="4" />
          <text x="1440" y="928" font-size="38" fill="#83C167" text-anchor="middle" font-weight="700">每个公开输入 <tspan class="mono">&lt; r</tspan></text>
        </g>
        <text id="d-snark" class="h" x="1440" y="220" font-size="28" fill="#8a8f99" text-anchor="middle">snarkjs 生成的验证器曾同时接受 x 与 x + r</text>
        <line id="d-strike" class="h" x1="1190" y1="532" x2="1330" y2="532" stroke="#83C167" stroke-width="5" />
        <text id="d-rej" class="h" x="1700" y="545" font-size="32" fill="#83C167" text-anchor="end" font-weight="700">≥ r：拒绝</text>
      </g>
    </svg>
  </div>
  <script>
    (function () {
      const C = /*CUES*/{"d": 37.29, "L": [[0.6, 7.49], [7.94, 15.07], [15.52, 19.62], [20.07, 25.97], [26.42, 36.19]]}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.35) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.6) => tl.fromTo(s, { strokeDashoffset: 1, opacity: 0 }, { strokeDashoffset: 0, opacity: 1, duration: d, ease: "power2.inOut" }, t);
      const NS = "http://www.w3.org/2000/svg", CX = 600, CY = 560, R = 300;
      const P = (a, r = R) => [CX + Math.sin(a) * r, CY - Math.cos(a) * r];

      // 刻度：12 个
      const tk = document.querySelector("#d-ticks");
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2, [x1, y1] = P(a, R - 14), [x2, y2] = P(a, R + 14);
        const l = document.createElementNS(NS, "line");
        l.setAttribute("x1", x1); l.setAttribute("y1", y1); l.setAttribute("x2", x2); l.setAttribute("y2", y2);
        l.setAttribute("stroke", "#58C4DD"); l.setAttribute("stroke-width", 3); l.setAttribute("opacity", 0);
        tk.appendChild(l);
      }
      // x 的位置（示意角度）
      const ax = 0.42 * Math.PI, [xx, xy] = P(ax);
      const xEl = document.querySelector("#d-x"); xEl.setAttribute("cx", xx); xEl.setAttribute("cy", xy);
      const xt = document.querySelector("#d-xt"); xt.setAttribute("x", xx + 30); xt.setAttribute("y", xy - 20);
      const xrt = document.querySelector("#d-xrt"); xrt.setAttribute("x", xx + 30); xrt.setAttribute("y", xy + 50);

      // L0 圆 + 绕一圈
      tl.fromTo("#d-ring", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 1.2, ease: "power2.inOut" }, at(0, 0.05));
      tl.to(gsap.utils.toArray("#d-ticks line"), { opacity: 0.8, duration: 0.3, stagger: 0.04 }, at(0, 0.25));
      IN("#d-zero", at(0, 0.3), 0.4);
      IN("#d-note", at(0, 0.4), 0.4);
      IN("#d-walk", at(0, 0.5), 0.2);
      const w = { a: 0 }, walk = document.querySelector("#d-walk");
      tl.fromTo(w, { a: 0 }, { a: Math.PI * 2, duration: 2.4, ease: "power1.inOut", onUpdate: () => { const [x, y] = P(w.a); walk.setAttribute("cx", x); walk.setAttribute("cy", y); } }, at(0, 0.55));
      OUT("#d-walk", at(0, 0.55) + 2.4, 0.2);

      // L1 x 与 x + r：从 x 出发再绕一整圈，落回同一点
      IN("#d-x", at(1, 0.0), 0.4, { scale: 0.3, svgOrigin: `${xx} ${xy}` }, { scale: 1, ease: "back.out(2)" });
      IN("#d-xt", at(1, 0.05), 0.4);
      const w2 = { a: ax }, ghost = document.querySelector("#d-walk");
      tl.set(ghost, { attr: { fill: "#FF9F43" } }, at(1, 0.2));
      tl.to(ghost, { opacity: 1, duration: 0.1 }, at(1, 0.2));
      tl.fromTo(w2, { a: ax }, { a: ax + Math.PI * 2, duration: 1.8, ease: "power1.inOut", immediateRender: false, onUpdate: () => { const [x, y] = P(w2.a); ghost.setAttribute("cx", x); ghost.setAttribute("cy", y); } }, at(1, 0.2));
      tl.to(ghost, { opacity: 0, duration: 0.2 }, at(1, 0.2) + 1.8);
      IN("#d-xrt", at(1, 0.5), 0.4);
      IN("#d-same", at(1, 0.55), 0.5);
      IN("#d-proof", at(1, 0.78), 0.5);

      // L2 合约账本
      IN("#d-led", at(2, 0.0), 0.6, { x: 30 }, { x: 0 });
      IN("#d-row1", at(2, 0.5), 0.4);
      // L3 x + r 当成新值
      DRAW("#d-arr", at(3, 0.0), 0.6);
      IN("#d-row2", at(3, 0.2), 0.4, { x: -20 }, { x: 0 });
      IN("#d-again", at(3, 0.6), 0.5, { scale: 1.2, svgOrigin: "1440 640" }, { scale: 1 });
      // L4 snarkjs + 修复
      IN("#d-snark", at(4, 0.05), 0.5);
      OUT(["#d-again", "#d-arr"], at(4, 0.45), 0.3);
      IN("#d-fix", at(4, 0.6), 0.6, { y: 20 }, { y: 0 });
      tl.fromTo("#d-strike", { opacity: 0, attr: { x2: 1190 } }, { opacity: 1, attr: { x2: 1330 }, duration: 0.5, ease: "power2.out" }, at(4, 0.8));
      tl.to("#d-row2 text:last-child", { opacity: 0, duration: 0.25 }, at(4, 0.8));
      IN("#d-rej", at(4, 0.85), 0.4);

      tl.to("#d-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["field"] = tl;
    })();
  </script>
</template>
