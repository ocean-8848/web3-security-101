<template>
  <style>
    @font-face { font-family: "NotoSC"; src: url("assets/fonts/noto-sc.woff2") format("woff2"); font-weight: 100 900; }
    #root { position: absolute; inset: 0; background: #0f1117; overflow: hidden; }
    #root svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    #root text { font-family: "NotoSC", sans-serif; }
    #root .mono { font-family: "JetBrains Mono", monospace; font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
    #root .h { opacity: 0; }
    #root .dr { stroke-dasharray: 1; stroke-dashoffset: 1; }
  </style>
  <div id="root" data-composition-id="bind" data-duration="42.45" data-width="1920" data-height="1080">
    <svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
      <g id="b-all">
        <text id="b-title" class="h" x="960" y="110" font-size="42" fill="#e8e6df" text-anchor="middle" font-weight="700">Aztec Connect：一组 32 笔交易</text>

        <!-- 证明覆盖的范围 -->
        <g id="b-cover" class="h">
          <rect x="268" y="300" width="1384" height="230" rx="18" fill="none" stroke="#83C167" stroke-width="4" />
          <text x="290" y="285" font-size="32" fill="#83C167" font-weight="700">证明覆盖：32 笔 ✓</text>
        </g>
        <g id="b-slots"></g>

        <!-- L1 结算游标 -->
        <g id="b-cur" class="h">
          <path d="M0 0 L -16 -26 L 16 -26 z" fill="#58C4DD" />
        </g>
        <text id="b-curt" class="h" x="290" y="600" font-size="32" fill="#58C4DD">L1 结算：处理到 numRealTxs 为止</text>

        <!-- numRealTxs：不在证明里 -->
        <g id="b-field" class="h">
          <rect x="268" y="660" width="560" height="110" rx="16" fill="#1f1608" stroke="#FF9F43" stroke-width="4" stroke-dasharray="12 8" />
          <text class="mono" x="300" y="730" font-size="40" fill="#e8e6df">numRealTxs =</text>
          <text id="b-n32" class="mono" x="640" y="730" font-size="40" fill="#FF9F43" font-weight="700">32</text>
          <text id="b-n1" class="mono" x="640" y="730" font-size="40" fill="#FF9F43" font-weight="700" opacity="0">1</text>
        </g>
        <text id="b-unb" class="h" x="870" y="700" font-size="32" fill="#FF9F43">由提交方控制</text>
        <text id="b-unb2" class="h" x="870" y="745" font-size="32" fill="#FF9F43">没有和证明绑定</text>
        <text id="b-skip" class="h" x="1100" y="600" font-size="32" fill="#FC6255">其余交易：绕过记账</text>
        <text id="b-still" class="h" x="1650" y="285" font-size="32" fill="#83C167" text-anchor="end">证明仍然有效</text>

        <!-- 金额 -->
        <g id="b-sum" class="h mono" font-size="44" text-anchor="end">
          <text x="1640" y="700" fill="#F0B90B">约 219 万</text>
          <text x="1640" y="760" fill="#F0B90B">+ 约 8.8 万</text>
          <line x1="1340" y1="785" x2="1660" y2="785" stroke="#6b6f7a" stroke-width="3" />
          <text x="1640" y="850" fill="#F0B90B" font-weight="800">≈ 228 万美元</text>
        </g>
        <text id="b-who" class="h" x="1250" y="730" font-size="28" fill="#8a8f99" text-anchor="end">两名攻击者</text>

        <!-- 弃用的合约 -->
        <g id="b-dep" class="h">
          <rect x="560" y="300" width="800" height="440" rx="24" fill="#1a1708" stroke="#F0B90B" stroke-width="4" stroke-dasharray="16 10" />
          <text x="960" y="380" font-size="40" fill="#F0B90B" text-anchor="middle" font-weight="700">已弃用的合约</text>
          <text x="960" y="440" font-size="30" fill="#8a8f99" text-anchor="middle">管理员密钥已放弃</text>
          <g fill="#F0B90B"><circle cx="840" cy="560" r="26" /><circle cx="910" cy="560" r="26" /><circle cx="980" cy="560" r="26" /><circle cx="1050" cy="560" r="26" /><circle cx="875" cy="625" r="26" /><circle cx="945" cy="625" r="26" /><circle cx="1015" cy="625" r="26" /></g>
        </g>
        <text id="b-surf" class="h" x="960" y="850" font-size="48" fill="#FF9F43" text-anchor="middle" font-weight="800">弃用的合约，仍是攻击面</text>
      </g>
    </svg>
  </div>
  <script>
    (function () {
      const C = /*CUES*/{"d": 42.45, "L": [[0.6, 6.77], [7.22, 12.59], [13.04, 17.1], [17.55, 25.13], [25.58, 33.14], [33.59, 41.35]]}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.35) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const NS = "http://www.w3.org/2000/svg";

      // 32 个格子：2 行 × 16
      const host = document.querySelector("#b-slots"), S = [];
      for (let i = 0; i < 32; i++) {
        const x = 290 + (i % 16) * 84, y = 330 + Math.floor(i / 16) * 100;
        const r = document.createElementNS(NS, "rect");
        r.setAttribute("x", x); r.setAttribute("y", y); r.setAttribute("width", 66); r.setAttribute("height", 70); r.setAttribute("rx", 8);
        r.setAttribute("fill", "#F0B90B"); r.setAttribute("fill-opacity", "0.25"); r.setAttribute("stroke", "#F0B90B"); r.setAttribute("stroke-width", 3); r.setAttribute("opacity", 0);
        host.appendChild(r); S.push({ r, x: x + 33, y });
      }
      const cur = document.querySelector("#b-cur");
      const curAt = (i) => ({ x: S[i].x, y: S[i].y - 4 });

      // L0 32 笔 + 证明覆盖
      IN("#b-title", at(0, 0.0), 0.5);
      S.forEach((s, i) => IN(s.r, at(0, 0.25) + i * 0.025, 0.3));
      IN("#b-cover", at(0, 0.7), 0.5, { scale: 1.04, svgOrigin: "960 415" }, { scale: 1 });
      // L1 结算游标走过前几格
      tl.set(cur, { x: curAt(0).x, y: curAt(0).y }, at(1, 0.0));
      IN(cur, at(1, 0.05), 0.3);
      IN("#b-curt", at(1, 0.1), 0.4);
      [0, 1, 2, 3, 4, 5].forEach((k, j) => tl.to(cur, { x: curAt(k).x, duration: 0.25, ease: "power2.inOut" }, at(1, 0.3) + j * 0.3));
      // L2 numRealTxs 未绑定
      IN("#b-field", at(2, 0.0), 0.5, { y: 20 }, { y: 0 });
      IN("#b-unb", at(2, 0.3), 0.4);
      IN("#b-unb2", at(2, 0.55), 0.4);
      // L3 设得很小：其余绕过记账
      tl.to("#b-n32", { opacity: 0, duration: 0.15 }, at(3, 0.05));
      tl.to("#b-n1", { opacity: 1, duration: 0.2 }, at(3, 0.15));
      tl.to(cur, { x: curAt(0).x, duration: 0.4, ease: "power2.inOut" }, at(3, 0.25));
      S.slice(1).forEach((s, i) => tl.to(s.r, { attr: { stroke: "#FC6255", "fill-opacity": 0.06 }, duration: 0.2 }, at(3, 0.35) + i * 0.02));
      IN("#b-skip", at(3, 0.45), 0.4);
      IN("#b-still", at(3, 0.7), 0.4);
      // L4 金额，一步步加
      OUT(["#b-curt", "#b-unb", "#b-unb2", "#b-skip"], at(4, 0.0), 0.3);
      tl.fromTo("#b-sum text:nth-of-type(1)", { opacity: 0 }, { opacity: 1, duration: 0.4 }, at(4, 0.1));
      tl.fromTo("#b-sum text:nth-of-type(2)", { opacity: 0 }, { opacity: 1, duration: 0.4 }, at(4, 0.4));
      tl.fromTo("#b-sum line", { opacity: 0 }, { opacity: 1, duration: 0.3 }, at(4, 0.6));
      tl.fromTo("#b-sum text:nth-of-type(3)", { opacity: 0 }, { opacity: 1, duration: 0.4 }, at(4, 0.7));
      tl.set("#b-sum", { opacity: 1 }, at(4, 0.1));
      IN("#b-who", at(4, 0.2), 0.4);
      // L5 弃用的合约
      OUT(["#b-cover", "#b-slots", "#b-cur", "#b-field", "#b-still", "#b-sum", "#b-who", "#b-title"], at(5, 0.0), 0.4);
      IN("#b-dep", at(5, 0.1), 0.6, { y: 20 }, { y: 0 });
      IN("#b-surf", at(5, 0.6), 0.6, { filter: "blur(8px)" }, { filter: "blur(0px)" });

      tl.to("#b-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["bind"] = tl;
    })();
  </script>
</template>
