<template>
  <style>
    @font-face { font-family: "NotoSC"; src: url("assets/fonts/noto-sc.woff2") format("woff2"); font-weight: 100 900; }
    #root { position: absolute; inset: 0; background: #0f1117; overflow: hidden; }
    #root svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    #root text { font-family: "NotoSC", sans-serif; }
    #root .h { opacity: 0; }
    #root .dr { stroke-dasharray: 1; stroke-dashoffset: 1; }
  </style>
  <div id="root" data-composition-id="hook" data-duration="27.74" data-width="1920" data-height="1080">
    <svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
      <g id="h-all">
        <text id="h-date" class="h" x="200" y="190" font-size="34" fill="#6b6f7a" letter-spacing="2">2026 年 6 月 · Aztec Connect（已弃用）</text>

        <!-- 已弃用的合约（资金 = 金） -->
        <g id="h-vault" class="h">
          <rect x="1160" y="300" width="560" height="420" rx="22" fill="#1a1708" stroke="#F0B90B" stroke-width="4" />
          <text x="1440" y="370" font-size="38" fill="#F0B90B" text-anchor="middle" font-weight="700">弃用的合约</text>
          <g id="h-coins" fill="#F0B90B"></g>
        </g>
        <g id="h-atk">
          <circle class="h-a h" cx="1820" cy="420" r="22" fill="#2a1416" stroke="#FC6255" stroke-width="4" />
          <circle class="h-a h" cx="1820" cy="610" r="22" fill="#2a1416" stroke="#FC6255" stroke-width="4" />
        </g>
        <text id="h-amount" class="h" x="1440" y="830" font-size="88" fill="#F0B90B" text-anchor="middle" font-weight="800">≈ <tspan id="h-num">0</tspan> 万美元</text>

        <!-- 证明：一张张通过验证 -->
        <g id="h-proofs"></g>
        <text id="h-pt" class="h" x="480" y="800" font-size="34" fill="#e8e6df" text-anchor="middle">每一个证明：<tspan fill="#83C167" font-weight="700">验证通过</tspan></text>
        <text id="h-crypto" class="h" x="480" y="870" font-size="32" fill="#83C167" text-anchor="middle">✓ 密码学没有失效</text>

        <g id="h-q" class="h">
          <text x="960" y="980" font-size="60" fill="#e8e6df" text-anchor="middle" font-weight="700"><tspan fill="#83C167">证明全对</tspan>，<tspan fill="#F0B90B">钱</tspan>是怎么丢的？</text>
        </g>
      </g>
      <circle id="h-seed" class="h" cx="960" cy="540" r="10" fill="#58C4DD" />
      <text id="h-seedt" class="h" x="960" y="620" font-size="34" fill="#6b6f7a" text-anchor="middle">证明系统到底检查了什么</text>
      <g id="h-pin" class="h">
        <rect x="80" y="70" width="560" height="84" rx="14" fill="none" stroke="#FF9F43" stroke-width="3" stroke-dasharray="10 8" />
        <text x="360" y="125" font-size="34" fill="#e8e6df" text-anchor="middle"><tspan fill="#83C167">证明全对</tspan>，<tspan fill="#F0B90B">钱</tspan>怎么丢的？</text>
      </g>
    </svg>
  </div>
  <script>
    (function () {
      const C = /*CUES*/{"d": 27.74, "L": [[0.6, 8.35], [8.8, 13.79], [14.24, 16.4], [16.85, 21.37], [21.82, 26.64]]}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.35) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const NS = "http://www.w3.org/2000/svg";

      // 金币
      const coinHost = document.querySelector("#h-coins"), coins = [];
      for (let r = 0; r < 3; r++) for (let c = 0; c < 5; c++) {
        const e = document.createElementNS(NS, "circle");
        e.setAttribute("cx", 1300 + c * 70); e.setAttribute("cy", 470 + r * 75); e.setAttribute("r", 24);
        coinHost.appendChild(e); coins.push(e);
      }
      // 证明卡片：2 行 × 4 张
      const pHost = document.querySelector("#h-proofs"), cards = [];
      for (let i = 0; i < 8; i++) {
        const x = 220 + (i % 4) * 135, y = 330 + Math.floor(i / 4) * 190;
        const g = document.createElementNS(NS, "g"); g.setAttribute("opacity", "0");
        g.innerHTML = `<rect x="${x}" y="${y}" width="110" height="150" rx="12" fill="#161a22" stroke="#e8e6df" stroke-opacity=".6" stroke-width="3" />` +
          `<line x1="${x + 20}" y1="${y + 35}" x2="${x + 90}" y2="${y + 35}" stroke="#8a8f99" stroke-width="5" stroke-linecap="round" />` +
          `<line x1="${x + 20}" y1="${y + 60}" x2="${x + 75}" y2="${y + 60}" stroke="#8a8f99" stroke-width="5" stroke-linecap="round" />` +
          `<text class="ok" x="${x + 55}" y="${y + 125}" font-size="48" fill="#83C167" text-anchor="middle" font-weight="800" opacity="0">✓</text>`;
        pHost.appendChild(g); cards.push(g);
      }

      // L0 合约 + 资金流出
      IN("#h-date", at(0, 0), 0.5);
      IN("#h-vault", at(0, 0.08), 0.8, { y: 20 }, { y: 0 });
      gsap.utils.toArray("#root .h-a").forEach((a, i) => IN(a, at(0, 0.45) + i * 0.1, 0.4));
      coins.forEach((c, i) => tl.to(c, { x: 1820 - (1300 + (i % 5) * 70), y: (i % 2 ? 610 : 420) - (470 + Math.floor(i / 5) * 75), fill: "#FC6255", opacity: 0, duration: 0.8, ease: "power3.in" }, at(0, 0.5) + i * 0.09));
      IN("#h-amount", at(0, 0.55), 0.5);
      const n = { v: 0 }, num = document.querySelector("#h-num");
      tl.fromTo(n, { v: 0 }, { v: 228, duration: 2.0, ease: "power2.out", onUpdate: () => { num.textContent = Math.round(n.v); } }, at(0, 0.55));

      // L1 每一个证明都通过
      cards.forEach((g, i) => {
        IN(g, at(1, 0.0) + i * 0.12, 0.35, { y: 16 }, { y: 0 });
        tl.fromTo(g.querySelector(".ok"), { opacity: 0, scale: 1.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, at(1, 0.3) + i * 0.12);
      });
      IN("#h-pt", at(1, 0.4), 0.5);
      // L2 密码学没失效
      IN("#h-crypto", at(2, 0.1), 0.5);
      // L3 问题
      tl.to(["#h-date", "#h-amount", "#h-pt", "#h-crypto", "#h-vault"], { opacity: 0.22, duration: 0.5 }, at(3, 0));
      tl.to(gsap.utils.toArray("#root .h-a"), { opacity: 0.22, duration: 0.5 }, at(3, 0));
      IN("#h-q", at(3, 0.2), 0.6, { filter: "blur(8px)" }, { filter: "blur(0px)" });
      // L4 钉住问题
      tl.to("#h-all", { opacity: 0, filter: "blur(6px)", duration: 0.6, ease: "power2.in" }, at(4, 0.1));
      IN("#h-pin", at(4, 0.2), 0.6, { scale: 1.6, svgOrigin: "360 112" }, { scale: 1 });
      IN("#h-seed", at(4, 0.4), 0.5, { scale: 0, svgOrigin: "960 540" }, { scale: 1, ease: "back.out(1.6)" });
      IN("#h-seedt", at(4, 0.45), 0.5);
      OUT("#h-seedt", C.d - 0.7, 0.3);
      tl.to("#h-seed", { scale: 3, opacity: 0, svgOrigin: "960 540", duration: 0.4, ease: "power3.in" }, C.d - 0.45);
      OUT("#h-pin", C.d - 0.45);
      window.__timelines["hook"] = tl;
    })();
  </script>
</template>
