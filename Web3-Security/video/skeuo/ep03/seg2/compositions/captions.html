    <div id="cap-c15" class="cap-g"><span class="cap-t">2025 年 5 月</span></div>
    <div id="cap-c16" class="cap-g"><span class="cap-t">以太坊 Pectra 升级上线了 EIP-7702</span></div>
    <div id="cap-c17" class="cap-g"><span class="cap-t">EOA 可以委托执行一段合约代码</span></div>

    <div id="cap-c19" class="cap-g"><span class="cap-t">已经不能判断它是不是普通用户</span></div>
    <div id="cap-c20" class="cap-g"><span class="cap-t">比较 msg.sender 和 tx.origin</span></div>

    <div id="cap-c24" class="cap-g"><span class="cap-t">A 调用 B</span></div>
    <div id="cap-c25" class="cap-g"><span class="cap-t">B 再调用 C</span></div>
    <div id="cap-c26" class="cap-g"><span class="cap-t">站在 C 的位置</span></div>
    <div id="cap-c27" class="cap-g"><span class="cap-t">看四个变量</span></div>
    <div id="cap-c28" class="cap-g"><span class="cap-t">tx.origin</span></div>
    <div id="cap-c29" class="cap-g"><span class="cap-t">是发起整笔交易的用户</span></div>
    <div id="cap-c30" class="cap-g"><span class="cap-t">msg.sender</span></div>

    <div id="cap-c32" class="cap-g"><span class="cap-t">也就是 B</span></div>
    <div id="cap-c33" class="cap-g"><span class="cap-t">msg.value</span></div>

    <div id="cap-c35" class="cap-g"><span class="cap-t">也就是 B 转给 C 的数量</span></div>
    <div id="cap-c36" class="cap-g"><span class="cap-t">address(this)</span></div>
    <div id="cap-c37" class="cap-g"><span class="cap-t">是当前执行代码的合约</span></div>
    <div id="cap-c38" class="cap-g"><span class="cap-t">也就是 C 自己</span></div>

    <div id="cap-c47" class="cap-g"><span class="cap-t">第二种 delegatecall</span></div>
    <div id="cap-c48" class="cap-g"><span class="cap-t">执行的还是 B 的代码</span></div>

    <div id="cap-c53" class="cap-g"><span class="cap-t">都依赖它</span></div>
    <div id="cap-c54" class="cap-g"><span class="cap-t">打个比方</span></div>
    <div id="cap-c55" class="cap-g"><span class="cap-t">EVM 像一个只有一个窗口的政务大厅</span></div>
    <div id="cap-c56" class="cap-g"><span class="cap-t">每个合约是一个科室</span></div>
    <div id="cap-c57" class="cap-g"><span class="cap-t">call</span></div>
    <div id="cap-c58" class="cap-g"><span class="cap-t">是派人带着材料</span></div>
    <div id="cap-c59" class="cap-g"><span class="cap-t">去 B 的窗口办事</span></div>
    <div id="cap-c60" class="cap-g"><span class="cap-t">delegatecall</span></div>
    <div id="cap-c61" class="cap-g"><span class="cap-t">是把 B 的规程手册借过来</span></div>
    <div id="cap-c62" class="cap-g"><span class="cap-t">在 A 自己的档案柜上照着办</span></div>
    <div id="cap-c63" class="cap-g"><span class="cap-t">如果手册写着</span></div>
    <div id="cap-c64" class="cap-g"><span class="cap-t">清空 0 号抽屉</span></div>
    <div id="cap-c65" class="cap-g"><span class="cap-t">被清空的是 A 的抽屉</span></div>
    <div id="cap-c66" class="cap-g"><span class="cap-t">这个比方有一处不成立</span></div>
    <div id="cap-c67" class="cap-g"><span class="cap-t">真实的大厅里</span></div>

    <div id="cap-c70" class="cap-g"><span class="cap-t">EVM 里</span></div>
    <div id="cap-c71" class="cap-g"><span class="cap-t">B 办到一半</span></div>
