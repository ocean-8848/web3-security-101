向盗币页面。", "研究者认为，这和迁移期间多因素认证失效有关，官方没有公布根因。", "Celer 靠域名监控，拦下了劫持尝试。", "所以域名这一环，要开注册商锁和注册局锁。", "注册商账号用硬件密钥登录，只给少数人权限。", "开启 DNSSEC，监控解析记录、委派和证书的变化。", "换服务商的当天，重新核查账号和多因素认证。", "再提前公布一个备用域名。"]}, {"t": "投毒与边缘", "at": 241.366, "lines": ["往里一环，是依赖包。", "一个前端会引用很多别人写的代码包，大多来自 npm 仓库。", "攻击者先钓鱼包的维护者，拿到账号或者会话。", "再发布一个带恶意代码的新版本。", "如果 DApp 不锁版本，下次构建就会拉进这个新版本。", "恶意代码挂到钱包接口上，替换收款地址，或者弹出授权。", "2023 年 12 月，Ledger 的一名前员工被钓鱼。", "Ledger 回收了他的其他权限，唯独漏了 npm。", "攻击者用他的会话，先后发布 3 个恶意版本的 Connect Kit。", "很多 DApp 直接从 CDN 加载最新版，恶意代码直接进了它们的页面。", "Ledger 约 40 分钟内发布了修复版本。", "但 CDN 的缓存，让恶意文件约 5 小时后才完全清除，损失约 60 万美元。", "2025 年 9 月，chalk 和 debug 等 18 个包被投毒，周下载量合计超过 20 亿。", "已确认的加密损失很小，但一个包能进入的页面，多到无法统计。", "再往里，是 CDN。", "CDN 把文件缓存到各地的边缘节点，就近发给用户。", "边缘节点上也能运行脚本，改写发出去的页面。", "2021 年，攻击者利用 Cloudflare 注册流程的一个漏洞。", "拿到 BadgerDAO 账号下，一把未经授权的 API Key。", "从 11 月起，他通过边缘脚本，定期往页面里注入代码，只对部分用户弹出授权。", "12 月 2 日，攻击者用这些授权，转走约 1 亿 2000 万美元。", "这两环的防线，先锁定全部依赖版本，不从 CDN 加载最新版的库。", "外部脚本加上子资源完整性校验，哈希不对就不执行。", "发布凭证用短期的，有人离职，当天回收所有发布渠道。", "CDN 的密钥最小权限，定期轮换，一有变更就告警。"]}, {"t": "只对一人", "at": 378.866, "lines": ["最难发现的篡改，只对一个目标生效。", "2025 年 2 月，Bybit 的冷钱包多签被盗，损失约 15 亿美元。", "FBI 公告把它归因于朝鲜。", "Safe 的初步报告称，2 月 4 日，一名开发者的电脑失陷。", "起因是运行了一个受污染的 Docker 项目。", "攻击者没能注册自己的验证设备，就劫持了活跃的 AWS 会话令牌。", "然后，篡改了 S3 上 Safe 网页前端的脚本。", "脚本先判断，发起交易的是不是 Bybit 的多签地址。", "不是，就一切正常。", "是，界面照样显示一笔正常转账，实际构造的是一次 DELEGATECALL。", "签名人在硬件钱包上签名，只看到一串哈希。", "签名凑够门槛，交易执行，多签的实现合约被替换。", "约 40 万枚 ETH 类资产被转走，约 2 分钟后，脚本被换回干净版本。", "外部研究者打开页面，看到的一切正常。", "Verichains 称，恶意代码只在特定条件下激活。", "Sygnia 认为，Safe 的云存储账号或密钥很可能泄露。", "在 Bybit 自己的系统里，没有发现入侵证据，Safe 称合约不受影响。", "关键在这里。", "所有签名人都用同一个网页前端，前端就是这个多签的单点。", "增加签名人，无法解决这个问题。", "防线在签名这一步，签名人用独立工具，重新计算交易哈希，在硬件钱包上核对。", "例行转账只允许普通调用，委托调用进单独的审批流程。", "发布方用独立系统，比对线上文件和构建产物的哈希。", "但比对只覆盖那一刻、那个位置，要在多个位置反复比对，并保留每个版本的哈希和访问日志。"]}, {"t": "页面之外", "at": 505.733, "lines": ["如果你是普通用户，先记住几条。", "收藏官方网址，从收藏夹进入，不点搜索广告和私信链接。", "即使域名正确，签名前也要解码，看清你在签什么。", "项目方公告前端异常，立刻停止交互，撤销近期的授权。", "熟悉的网站突然要你重新授权、迁移资产、验证钱包，先停下来核实。", "如果你负责前端，今天就问一个问题。", "今晚有人替换了一个脚本文件，谁会在多久之后发现？", "如果你是多签签名人，确认自己有一条不经过这个前端的核对路径。", "回到开头的问题。", "域名是对的，锁也在，不能证明页面是真的。", "它只说明你连上了域名此刻指向的服务器，而那台服务器，可能已经换了主人。", "审计管得住合约，管不住页面，签名之前，独立核对你在签什么。", "下一集讲社会工程与内部人。"]}]}, {"n": 21, "title": "社会工程与内部人：攻击者先攻破人", "dur": null, "segs": [{"t": "一份面试作业", "at": 0.0, "lines": ["2026 年 9 月，一名 Binance 工程师接到面试邀约。", "邀约来自正规的招聘平台，他也参加了视频面试，看上去一切正常。", "面试结束前，对方给了他一份作业。", "一个代码仓库，要他下载下来完成。", "他把仓库下载到了工作电脑上。", "他没有输入密码，也没有点任何钓鱼链接。", "到了 10 月，攻击者从工程师的电脑出发，控制了更多同事的电脑。", "最后，他们找到了部署令牌。", "这次事件里，受影响的资产约 63.4 亿美元。", "先猜一道题。", "没有密码，没有链接，这份作业，是靠什么进入他电脑的？", "先记住这个问题。"]}, {"t": "先攻破人", "at": 54.466, "lines": ["先给准确的说法。", "社会工程，就是靠欺骗或利用信任，让人自己动手，做攻击者需要的事。", "内部人风险，是有合法权限的人，有意或无意地造成损失。", "最贵的漏洞，常常不在合约里，而在员工的电脑上。", "攻击者不去破解多签合约，他让一个签名人，在自己电脑上打开一个文件。", "之后，这台电脑上显示的一切，都可能是假的。", "打个比方，金库有三道门，三个人各管一把钥匙。", "窃贼不撬门，他给三个掌钥人，各寄了一封老同事的来信。", "信纸上涂了药，读过信的人，第二天会记错自己开的是哪道门。", "比喻在这里不成立，真实的攻击者，不需要同时骗三个人。", "签名人的电脑都运行同一个前端，攻破其中几台，再配合篡改前端，就可能凑够门槛。", "攻击者能控制的，通常是这五样东西。", "一个假身份，冒充招聘者、前同事、合作方或者记者。", "一个任务，比如测试题、代码作业、一份复盘 PDF。", "一个会议，比如假会议软件，或者远程控制请求。", "一笔钱，用来收买客服或外包人员。", "还有一个被雇用的身份，冒名应聘远程岗位。", "公开通报显示，朝鲜相关组织在这类攻击中最活跃。", "但手法本身被各类犯罪团伙复用，防御不该只盯着一个组织。"]}, {"t": "测试题与文件", "at": 157.733, "lines": ["先看最常见的一种，假招聘和假面试。", "假招聘者在 LinkedIn 或 Telegram 上找到你，说有个高薪岗位，先做个测试。", "然后发来一个 GitHub 项目，或者一个 Python 脚本。", "关键在下一步，员工在工作电脑上，运行了外部代码。", "后门回连，偷走浏览器的会话 cookie、SSH 密钥和钱包。", "注意，偷的是会话 cookie，不是密码。", "会话 cookie 是登录之后的凭证，拿到它，就能绕过多因素认证。", "就算账号用了硬件密钥，通常也挡不住，硬件密钥只保护登录这一步。", "2024 年 3 月，钱包软件供应商 Ginco 的一名员工，就这样运行了一个测试脚本。", "5 月，攻击者用偷来的会话，进入 Ginco 的系统，篡改了 DMM Bitcoin 的一笔交易。", "被盗的 BTC 约 3.05 亿美元。", "FBI 和日本警察厅等机构，联合归因于朝鲜的 TraderTraitor。", "供应商的员工，也是你的攻击面。", "这类假面试已经成了规模化的活动。", "多国机构联合告警，从 2025 年 12 月到 2026 年 7 月，至少 3 万台设备被感染。", "而且不一定要你手动运行，打开项目时，配置文件就可能自动执行代码。", "文件也能做同样的事。", "2024 年，Radiant Capital 的开发者，在 Telegram 上收到一个 zip，发件人冒充前承包商。", "里面是伪装成复盘 PDF 的 macOS 后门，3 名开发者的设备被感染。", "恶意软件改写了多签前端的显示。", "签名人用了硬件钱包，也做了交易模拟，但界面上的模拟结果，也是假的。", "多签所有权被转走，损失约 5000 万美元。"]}, {"t": "会议与身份", "at": 281.133, "lines": ["第二种手法，是一个会议。", "攻击者冒充媒体或投资机构，邀请你参加访谈或路演。", "然后要你下载一个专用会议软件，或者在会议里申请远程控制。", "2025 年 4 月，Trail of Bits 公开了一种做法。", "攻击者在 Zoom 通话里，把自己的显示名改成 Zoom。", "弹窗写着 Zoom 请求控制你的屏幕，看起来像系统提示。", "但这里的 Zoom，只是一个参会者的名字。", "点了同意，对方就能控制电脑，打开钱包或密码管理器。", "同年 2 月，还有人发布假的 Web3 职位。", "引导求职者安装 GrassCall 会议软件，里面是窃密木马。", "第三种手法，是把人直接送进公司。", "攻击者用盗用或伪造的身份，应聘远程开发岗位。", "美国检方在 2025 年 6 月，起诉了 4 名朝鲜人。", "他们冒名受雇于区块链公司，其中一人修改了雇主两个智能合约的源码。", "把约 74 万美元转到自己的地址，全案约 91.5 万美元。", "最后一种，是一笔钱。", "2025 年 5 月，攻击者用现金，收买了 Coinbase 的海外外包客服。", "导出约 7 万名用户的数据，再冒充 Coinbase 行骗。", "Coinbase 估算，成本约 1.8 亿到 4 亿美元。", "同年 7 月，CoinDCX 的一名员工被兼职工作吸引，在公司电脑上装了恶意软件。", "运营钱包被盗走约 4400 万美元，当地警方称，这名员工并不知情，只是被利用了。"]}, {"t": "设备与流程", "at": 391.433, "lines": ["防御不能指望员工永远不被骗，要让一个人被骗，也不够造成损失。", "第一条，设备分离。", "签名专用设备，只用来签名和独立解码，不收邮件，不上 Telegram，不打开外部文件。", "日常办公电脑，用来沟通和写文档，不存生产凭证和私钥。", "开发电脑要运行外部项目，就放进隔离的虚拟机，或者一次性环境。", "第二条，流程控制。", "资金操作、合约发布、权限变更，至少两人独立确认，这叫双人原则。", "大额交易和权限变更，用预先登记的电话或当面确认，这叫带外确认。", "要点是，不用发起请求的那个渠道。", "发起人、审批人、执行人、审计人，不能是同一个人，这叫职责分离。", "关键系统用硬件密钥，会话短期有效，异地登录要告警。", "第三条，管好人员的进出。", "招聘时，视频面试本人出镜，核验证件和履历，远程岗位核验设备所在地。", "离职当天，回收全部权限。", "不只是代码仓库和云，还有 npm、域名注册商、官方社交账号、多签签名人身份。", "漏掉一个边缘权限，前员工的账号，就是一扇没锁的门。", "第四条，留意内部人风险的早期信号。", "访问和岗位无关的数据，短时间大量导出，借口紧急，要求绕过审批。", "还有坚持独自处理某类操作，拒绝休假或轮岗。", "最后，要有匿名报告渠道，员工报告可疑接触，不受惩罚。"]}, {"t": "回到作业", "at": 505.6, "lines": ["普通用户也会遇到同样的手法。", "招聘者让你下载项目、运行脚本、安装会议软件，先停下来。", "不在存放钱包的电脑上，运行陌生项目，打开陌生文件。", "会议里，拒绝任何远程控制请求。", "客服主动联系你，说账户有风险，要你转移资产，一律挂断，再从官方 App 里联系客服。", "如果你是签名人，今天就把聊天软件，从签名设备上删掉。", "如果你是开发者，陌生项目一律先在隔离环境里打开。", "如果你负责团队，查一遍离职清单，看它有没有覆盖边缘权限。", "回到开头的题。", "作业仓库靠的是安装脚本，安装步骤运行了混淆的命令，把合法的 pyenv 组件换成了恶意版本。", "当时的终端防护没有发现，在工作电脑上运行外部代码，这一步就够了。", "而在 6 月，另一名工程师下载过被篡改的 Homebrew，Binance 当时就发现并清理了这台设备。", "但报告称，攻击者由此了解了工程师的角色和同事。", "一次清理完成，不代表威胁结束。", "攻击者先攻破人，防线就要设计成，一个人被攻破，也转不走钱。", "下一集讲人身与账号安全。"]}]}, {"n": 22, "title": "人身与账号安全：从链上走到线下", "dur": null, "segs": [{"t": "一张 SIM 卡", "at": 0.0, "lines": ["2024 年 1 月，美国 SEC 的官方 X 账号，发了一条消息。", "比特币 ETF 获批了。", "这条消息是假的。", "可它是从监管机构的官方账号发出来的，很多人信了。", "BTC 的价格，短时间里大幅波动。", "攻击者没有破解 SEC 的任何系统。", "他们只是让一张新的 SIM 卡，接管了一个手机号。", "靠这个号码，就拿到了官方账号的控制权。", "一张小小的卡，就让整个市场跟着晃了一下。", "先猜一道题。", "SEC 是监管机构，当时这个账号，开了多因素认证吗？", "先记住这个问题，我们从链上，一路走到线下。"]}, {"t": "挡不住扳手", "at": 50.833, "lines": ["先给准确的说法。", "扳手攻击，就是用暴力或威胁，逼持币的人交出私钥，或者转账。", "这个名字来自一幅漫画。", "花大价钱买算力，破解不了加密，买一把便宜的扳手，就够了。", "密码学挡不住扳手。", "攻击者知道你是谁，住在哪，有多少资产，最便宜的办法，就是找到你本人。", "打个比方，你给家门装了一把银行级的锁。", "可你的门牌号、作息时间、保险柜里有多少钱，都印在一张贴在网上的海报上。", "锁越好，劫匪越不会去撬锁，而是等你回家。", "比喻在这里不成立，劫匪要先知道你有钱。", "而链上资产的特点是，地址一旦和身份连上，余额对全世界公开。", "所以攻击的第一步，是关联。", "把一个链上地址，连到一个真实的人，一个真实的住址。", "线索有三类。", "公开信息，比如社交媒体、采访、会议照片。", "数据泄露，比如 KYC 资料、电商订单、客服工单。", "还有链上数据，地址的余额和交易历史。", "三类线索拼在一起，就能筛出余额高、住址已知的目标。", "接下来有两条路，一条找上门，一条攻账号。", "数据泄露直接交出了住址，所以保护数据，也是在保护人身安全。"]}, {"t": "号码被转走", "at": 149.866, "lines": ["先看账号这条路，SIM 卡劫持。", "攻击者让运营商，把受害者的手机号，转到自己的 SIM 卡上。", "常见的手法，是出示伪造证件，或者贿赂、欺骗客服。", "号码到手，他在交易所、邮箱、社交账号上，点忘记密码。", "短信验证码，发到了他的新卡上。", "这一步能成功，是因为账号允许短信验证码，作为唯一的恢复方式。", "再想一种情况，账号开了验证器 App，但忘记密码时，仍然可以用短信。", "只要短信能单独完成恢复，验证器就被绕过了。", "第二因素有多强，取决于恢复流程里最弱的一环。", "社交账号被劫持，入口不止换卡。", "还有弱密码被暴力破解，团队交接时，多因素认证被关掉。", "冒充平台官方，发版权侵权、账号违规的钓鱼邮件。", "官方账号发出的链接，粉丝几乎没有理由怀疑。", "2023 年 9 月，Vitalik Buterin 的 X 账号被盗，发出了假的纪念 NFT 链接。", "粉丝签名后，钱包被清空，ZachXBT 统计，约 69.1 万美元。", "2024 年 1 月，安全公司 Mandiant 的 X 账号，被改名冒充 Phantom 钱包。", "Mandiant 自查认为，很可能是被暴力破解，交接期间，多因素认证没有起到保护。", "后来，有人冒充 X 官方，发版权侵权通知。", "接管了 15 个加密类账号，推广假代币，约 50 万美元。", "交易所的员工也一样。", "美国联邦起诉书称，一个团伙对一名员工，做了 SIM 卡劫持。", "转走的加密资产，超过 4 亿美元。", "媒体援引消息源，确认受害公司是 FTX，时间是它申请破产的当天。", "员工的手机号，就是交易所的特权凭证。"]}, {"t": "找上门来", "at": 281.033, "lines": ["再看另一条路，找上门。", "这部分涉及人身伤害，我们只讲公开报道的事实，不讲受害人的个人细节。", "研究者 Jameson Lopp，在 GitHub 上维护一份公开清单。", "专门记录针对持币人的实体攻击。", "按这份清单，2023 年 74 起，2024 年 106 起，2025 年 170 起。", "2026 年截至 10 月底，已有 147 起，其中法国 52 起。", "各机构的统计口径不同，数字不能直接比较。", "Lopp 本人认为，真实数量被低估了。", "2025 年 1 月，Ledger 的一位联合创始人，和伴侣在家中被劫持。", "绑匪向 Ledger 方面索要加密货币赎金，法国宪兵特种部队救出了两人。", "涉嫌主谋 6 月在摩洛哥落网，2026 年 5 月被当地法院判处 25 年。", "同年 5 月初，一名加密企业家的父亲，在巴黎街头被绑走。", "警方突袭解救，没有支付赎金。", "5 月 13 日，交易所 Paymium 的 CEO，女儿和外孙在巴黎街头，遭遇绑架未遂。", "检方之后起诉了 25 人，认为和 5 月初的绑架有关联。", "法国内政部长会见业界，宣布了安全简报、紧急呼叫优先响应、住宅安防检查等措施。", "这几起案件里，目标不只是持币人本人，还有家属。", "公开报道还显示，部分团伙把执行环节，外包给临时招募的人。", "同在 2025 年 5 月，纽约检方指控两名加密投资者，把一名男子诱到曼哈顿的一处住宅。", "囚禁 17 天，逼他交出比特币密码。", "两名被告不认罪，公开报道里，还没有查到判决。", "施暴者，也可能是熟人，或者同一个圈子里的人。"]}, {"t": "拉开距离", "at": 407.366, "lines": ["防御分两头，一头降低暴露，一头降低胁迫的收益。", "降低暴露，先管住嘴，不公开谈持仓，不晒资产截图。", "链上身份和真实身份分开，公开收款地址和个人大额地址，不用同一个。", "硬件钱包这类订单，用代收地址或者公司地址收货。", "照片里不要拍到住址、车牌和日常路线。", "定期搜一搜自己的姓名和住址，去数据经纪网站申请删除。", "降低胁迫的收益，靠的是让本人确实转不出去。", "大额资产放进多签或者时间锁，转出要异地的另一个人，或者另一台设备。", "随身的设备，只放少量资产。", "和家人约定胁迫暗号，还有紧急联系的流程。", "要说清楚，多签和时间锁，降低的是立即转出的可能，不能保证人身安全。", "劫匪对转不出的反应，难以预测，人身安全第一，资产第二。", "账号这边，邮箱、交易所、社交账号、域名注册商，都用硬件安全密钥，做多因素认证。", "不用短信做多因素认证，也不用它恢复密码。", "向运营商申请号码转移锁，或者 SIM 更换 PIN。", "关键账号，用不公开的专用邮箱注册。", "项目方还要多做几件事。", "列出关键人员，创始人、多签签名人、运维负责人、官方账号管理员。", "签名人名单不公开，必要时只公开机构。", "官方账号交接时，不关闭多因素认证，发帖权限和恢复权限分开。", "再备好被盗预案，备用公告渠道、平台联系人、写好的辟谣声明。"]}, {"t": "回到那张卡", "at": 524.966, "lines": ["普通用户，可以从这几件事做起。", "交易所和邮箱，用硬件密钥或验证器 App，关掉短信验证。", "向运营商申请号码转移锁。", "关注的项目方账号，突然发限时空投、紧急迁移，先去别的官方渠道核实。", "和陌生网友线下见面，选公共场所，让别人知道你的行程。", "遭遇胁迫时，人身安全第一，事后立即报警。", "如果你是多签签名人，今天就查一遍，你的手机号能不能单独重置哪个账号。", "如果你管理官方账号，今天就把它的多因素认证，换成硬件密钥。", "如果你负责团队，列一份关键人员名单，给每个人配上号码锁和硬件密钥。", "回到开头的题。", "答案是没有，SEC 承认，此前曾请 X 关闭这个账号的多因素认证。", "攻击者对绑定的手机号做了 SIM 卡劫持，再用重置码登录。", "负责换卡的人，2025 年被判 14 个月。", "监管机构的账号也会失守，只要一条短信，就能单独完成恢复。", "攻击从链上走到线下，防线就要让一张卡、一次胁迫，都不够拿走一切。", "下一集讲托管、充提与合规安全。"]}]}, {"n": 23, "title": "托管、充提与合规安全：保管者与检查站", "dur": null, "segs": [{"t": "暂停之后", "at": 0.0, "lines": ["2026 年 10 月 29 日，Binance 的热钱包，开始大额转出。", "先是 XRP，再是比特币，然后是以太坊。", "一条链接着一条链，资产往外流。", "交易所发现之后，暂停了提现。", "可按项目方的初步报告，暂停提现，没有挡住全部的未授权转账。", "最后一笔，到世界协调时 23 点 56 分，才转完。", "项目方的口径是，约 63.4 亿美元。", "这是有记录以来，最大的一起加密资产盗窃案。", "更反常的是，Binance 称，没有发现私钥泄露的证据。", "没有私钥，钱是怎么签出去的？", "先猜一道题。", "提现已经暂停，热钱包服务也关掉了。", "以太坊热钱包上，还留着一个恶意的 EIP-7702 委托。", "这时候，新转进这个地址的钱，安全吗？", "带着这个问题，我们看看交易所的两张面孔。"]}, {"t": "两张面孔", "at": 69.866, "lines": ["先给准确的说法。", "交易所同时扮演两个角色。", "一个是保管者，替用户保管私钥和资产，这叫托管。", "另一个是检查站，链上的资金，从这里进出法币世界。", "保管者失误，用户丢钱。", "检查站失误，赃款被洗白，交易所自己也要承担法律责任。", "打个比方，交易所像一座机场。", "金库是冷钱包，要防盗。", "登机口是提币，要验票，入境口是充值，要验真伪。", "安检是反洗钱，边检是制裁筛查，拦住名单上的人。", "比喻在这里不成立，机场的旅客，走了就走了。", "链上的资金流向永久公开，执法机构几年以后，还能回头追查每一笔。", "先看保管者这一面，钱在交易所里怎么流动。", "每个用户有自己的充值地址，钱到了，被归集到热钱包。", "热钱包负责日常提币，余额超出水位，多出来的转回冷钱包。", "冷钱包补充温钱包，温钱包再补充热钱包。", "链下还有一条流水线。", "充值扫描服务读取链上数据，记进内部账本。", "提币请求从账本出发，经过风控引擎，再到签名服务，最后从热钱包发出。", "攻击打在四个点上。", "充值扫描，被假充值骗过。", "账本，被盗来的用户账号拿去提币。", "签名服务，被伪造的上游请求驱动。", "热钱包，私钥泄露。", "图里没画的还有内部人，他可以同时出现在这四个点上。"]}, {"t": "假充值", "at": 184.233, "lines": ["先看充值这一头。", "假充值，是交易所把一笔不该算数的转账，记成了用户的充值。", "失败的、伪造的、到账金额不对的，都算。", "第一种，交易失败了，却已经上链。", "扫描服务只看交易存不存在，不看执行状态。", "2019 年 3 月，SlowMist 披露了 EOS 上的这类手法，TRON 和以太坊也要防。", "第二种，无效交易被入账。", "2018 年 6 月，SlowMist 预警，部分交易所没有校验 Omni-USDT 交易的 valid 字段。", "第三种，部分支付，这是 XRP 的一个特性。", "一笔支付写的请求金额，可以远大于实际到账的金额。", "2024 年 1 月，有人向 Bitfinex 发起了一笔部分支付。", "名义金额约 150 亿美元，实际到账约 0.001 美元。", "Bitfinex 按实际到账金额入账，攻击没有成功。", "第四种，假代币，名字和符号都能照抄。", "第五种，伪造的转账事件，系统只看 Transfer 事件，不看它来自哪个合约。", "第六种，确认数不够就入账，之后区块回滚，这笔充值也跟着消失。", "这些形态，可以归成一条原则。", "以链上执行结果和实际到账金额为准。", "入账之前，过四道检查。", "执行成功了吗。", "代币合约地址，在白名单里吗。", "实际到账多少。", "确认数够了吗。", "最后，用第二个独立节点再复核一遍。", "只靠一个节点，节点被篡改或者不同步，也会记错账。", "每接入一条新链，都要按这条链的交易模型，从头设计入账校验，不能照搬以太坊的逻辑。"]}, {"t": "签名被驱动", "at": 308.566, "lines": ["再看提币这一头，最要紧的是签名服务。", "签名服务只认请求的格式对不对。", "攻击者如果能伪造上游数据，它就会按正常流程，签出攻击交易。", "2026 年 9 月，Bitget 被盗约 3.875 亿美元。", "公开报道称，攻击者利用第三方安全产品的零日漏洞，拿到了内部高权限凭证。", "再向钱包后台，插入伪造的提现指令。", "项目方称，已经排除了私钥泄露。", "一个月后，Binance 出事，按它的初步报告，路径是这样的。", "6 月，一名工程师下载了被篡改的 Homebrew。", "那一次已被发现并处置，报告没有确认之后一直有访问。", "9 月，另一名工程师运行了一份假的面试作业。", "10 月 20 日，攻击者经过这台电脑和内部 AI 工具，又控制了另外两台电脑。", "其中一台上，存着容器部署令牌。", "10 月 29 日，攻击者用它部署容器，运行恶意脚本，访问内部签名服务。", "攻击者不需要私钥，它让签名服务替它签。", "以太坊上，签出的是 EIP-7702 委托，把热钱包账户的代码，指向攻击者的合约。", "其他链上，就是普通的签名转账。", "决定性的一环，是开发终端上的长期部署令牌。", "它把一台电脑失陷，变成了生产环境失陷。", "签名流程本身被驱动了，冷热隔离和私钥保护，都挡不住。", "防线有三条。", "签名服务独立核对，目标地址和金额，必须对得上账本里的提现订单。", "部署令牌要短期有效、绑定设备，还要第二个人批准。", "风控引擎和签名服务，由不同的团队维护。", "两起事件，都还没有最终的第三方调查报告。"]}, {"t": "检查站", "at": 437.4, "lines": ["再看交易所的另一张面孔，检查站。", "这里的攻击者，不需要攻破交易所的系统，只需要规则有漏洞。", "盗来的资金，想充进交易所，再提走或者换掉。", "名单上的人，换个新地址、新账户，绕过筛查。", "洗钱者把金额拆开，快进快出。", "TRM 记录到，Binance 事件前一天，攻击者的操作钱包，收到 3 笔 Tornado Cash 提款。", "一笔充值或者提币，要过四道关。", "第一道，制裁筛查，比如美国财政部 OFAC 的名单，命中就拦。", "第二道，链上风险评分，看资金在几跳以内，是不是来自被盗资金或者混币器。", "第三道，Travel Rule，服务商之间转账，要传递发起人和受益人的信息。", "第四道，反洗钱交易监控，盯住拆分和快进快出。", "门槛要按辖区来定。", "FATF 建议的门槛，是 1000 美元或欧元。", "欧盟规定，服务商之间转账，不设最低门槛。", "系统如果按 1000 欧元设计，小额转账就缺了发起人和受益人的信息。", "被盗资金进入交易所，往往是冻结追回的最后机会。", "Binance 事件当晚，Tether 冻结了约 9.711 亿 USDT，Circle 冻结了约 8.23 亿 USDC。", "比特币、XRP 这类原生资产，发行方没办法冻结。", "检查站失守，代价最后会回到交易所身上。", "2023 年 11 月，Binance 认罪，支付约 43 亿美元。", "2025 年，KuCoin 和 OKX，也认罪无牌汇款。", "反过来，评分也会误报，没有人工复核和申诉通道，正常用户的钱就会被错冻。", "2025 年 3 月，Tornado Cash 被移出制裁名单，可风险没有跟着消失。", "混币器来的钱，照样要按评分和规则走一遍。"]}, {"t": "撤销委托", "at": 571.233, "lines": ["回到开头的题。", "答案是不安全。", "委托写在账户的链上代码里，独立于链下的提现系统。", "在新的授权覆盖或者清零它之前，委托合约照样可以被调用。", "Binance 在 10 月 30 日 0 点 10 分，才把委托清零。", "恶意委托在链上，存活了约 3 小时 50 分。", "暂停提现，不等于撤销权限。", "交易所今天就能做三件事。", "提前写好紧急撤销流程并且演练，把链上授权也算进去。", "热钱包设余额上限，每条链单独熔断。", "签名策略覆盖全部交易类型，包括 EIP-7702 授权。", "普通用户也有几件事。", "充值前，确认交易所支持的代币合约地址和网络。", "开启提币白名单和新地址冷却期，提币地址从地址簿里选。", "来源不明的资金不要充进去，交易所要你补资料，只在官方 App 里处理。", "保管者要让签名只为真实的订单服务，检查站要拦住赃款，也别误伤普通人。", "下一集讲数据与隐私安全。"]}]}, {"n": 24, "title": "数据与隐私：泄露的数据会变成攻击", "dur": null, "segs": [{"t": "不含密码", "at": 0.0, "lines": ["2025 年 5 月，一个犯罪团伙，找上了 Coinbase 的外包客服。", "他们没去撬钱包，只是花钱，收买了客服。", "被收买的人，从客服工具里，导出了 69461 名用户的数据。", "姓名、联系方式、证件图像、余额、交易记录。", "可这份数据里，没有密码，也没有私钥。", "没有钥匙，照理说，打不开任何一个账户。", "可 Coinbase 在提交给 SEC 的文件里估算，这次事件，要花掉约 1.8 亿到 4 亿美元。", "其中一项，是赔偿被冒充客服骗走资金的用户。", "先猜一道题。", "一天，你接到电话，对方自称交易所客服。", "他叫得出你的名字，说得出你的余额，还知道你上周提过的工单。", "他说你的账户有风险，请你把资产，转到一个安全钱包。", "他是真客服吗？", "带着这个问题，我们看看，泄露的数据怎样变成攻击。"]}, {"t": "诈骗的原料", "at": 72.433, "lines": ["先给准确的说法。", "数据泄露，是下一次诈骗的名单。", "攻击者知道了谁持有多少资产，住在哪里，用哪家交易所。", "他就能冒充客服精准下手，甚至找上门。", "打个比方，一份泄露的客户名单，就是一本肥羊通讯录。", "上面有姓名、电话、存款金额，还注明他上周刚联系过客服。", "比喻在这里不成立，银行流水是私密的，链上交易是公开的。", "名单里只要有一个地址，攻击者就能查到这个人全部的链上历史，和当前的余额。", "一次泄露，会同时引出三类攻击。", "第一类，精准钓鱼，冒充客服，说出真实的细节。", "第二类，账号接管，拿证件信息骗过运营商，劫持手机号。", "第三类，人身风险，知道住址，又知道资产。", "泄露的数据还会长期流通，几年前的名单，今天还在被用来诈骗。", "名单从哪里流出来？先看最集中的出口，客服后台。", "攻击者在社交平台上，招募交易所的客服或者外包人员，开价收买。", "被收买的人，在客服后台查询用户，截屏或者导出。", "Coinbase 这一次，泄露的还有社保号后四位，和部分遮蔽的银行账号。", "攻击者随后索要 2000 万美元。", "Coinbase 拒付，拿出同等金额设立悬赏，并承诺赔偿被骗的用户。", "外包商解雇了涉事员工，2025 年 12 月，印度警方逮捕了一名前客服。"]}, {"t": "最弱的一家", "at": 181.466, "lines": ["交易所的数据，不只留在交易所里。", "KYC 服务商、工单系统、邮件营销、物流、破产服务，每一家都是一个泄露点。", "2020 年 6 月，攻击者用一把第三方的 API 密钥，进了 Ledger 的电商和营销数据库。", "约 100 万个邮箱泄露，约 27.2 万条记录带着姓名、住址和电话。", "Ledger 后来修正为，约 29.2 万名客户。", "同年 12 月，完整的数据库，被公开在黑客论坛上。", "之后是大量钓鱼邮件和短信，还有针对客户的威胁电话。", "硬件钱包本身没有被攻破。", "可谁买了硬件钱包，寄到了哪里，本身就是高价值的数据。", "2023 年 8 月，Kroll 一名员工的手机号，被 SIM 卡劫持。", "攻击者借此看到了 FTX、BlockFi、Genesis 三个破产案的债权人文件。", "姓名、地址、邮箱，还有账户余额。", "外包商员工的手机号，也成了你的攻击面。", "2024 年 1 月，Trezor 的第三方工单平台，遭到未授权访问。", "最多约 6.6 万名联系过客服的用户，邮箱和姓名泄露。", "冒充者随后联系了约 40 名用户，索要助记词。", "2022 年 12 月，Gemini 的一家供应商被入侵。", "约 570 万行客户邮箱，和部分遮蔽的电话号码泄露。", "Gemini 称，账户和系统没有受到影响。", "你的数据有多安全，取决于数据流向的，最弱的那一家第三方。"]}, {"t": "地址变成人", "at": 290.233, "lines": ["数据之外，还有一种暴露，来自链本身。", "去匿名化，就是把匿名的链上地址，关联到真实的身份。", "链上分析先把地址聚成一个个实体，再把实体对上真人。", "第一种方法，共同输入。", "一笔比特币交易的多个输入，大概率属于同一个所有者。", "第二种，找零地址，认出交易里找零给自己的那个输出。", "第三种，交易所出入金。", "地址跟交易所的充值地址有往来，而交易所掌握 KYC。", "第四种，跨链、跨混币器的时间和金额模式。", "第五种，链下关联，ENS 名称、社交媒体上贴出的地址、NFT 头像。", "这些都是启发式规则，会误判。", "比如一笔交易，有 4 个输入，4 个金额相等的输出。", "共同输入规则，会把 4 个输入，归给同一个人。", "可这是典型的 CoinJoin，可能是 4 个人各出一个输入。", "聚到一起，一个人的 KYC 身份，就扩散到了另外 3 个人身上。", "这套方法，已经走进了法庭。", "Bitcoin Fog 是一个混币器，经手 120 万余枚比特币。", "2024 年 3 月，陪审团裁定，运营者 Roman Sterlingov 四项罪名成立。", "法官经过专门听证，认定 Chainalysis Reactor 的分析可以作为证据。", "同时，还有卧底交易等其他证据印证。", "2026 年 9 月，上诉法院维持定罪，没有要求公开工具的源代码。", "混币和换地址，不等于匿名。", "交易所的出入金记录，往往是把地址落到真人身上的关键一环。", "执法和交易所用它追踪被盗资金，攻击者用它筛选目标。"]}, {"t": "收窄出口", "at": 413.133, "lines": ["防守从源头开始，数据最小化。", "只收集业务和合规必需的数据，写清每类数据保存多久。", "客服后台默认遮蔽敏感字段，证件号、完整住址、完整余额。", "需要看，就逐条申请，写明原因。", "客服只能查当前工单对应的用户，不能任意搜索。", "导出默认关闭，开启要审批，还要带水印。", "每一次敏感查询都留痕，记下查询人、时间、对象和理由。", "单人查询量突增、查询和工单无关的用户、非工作时间查询，自动告警。", "客服终端禁止截屏和外接存储，外包客服用公司管理的设备。", "第三方签约前做安全尽调，合同写明用途、保存期限、泄露通知时限和审计权。", "能给脱敏数据的，不给原始数据，业务结束，确认数据已经删除。", "万一泄露，先确认范围，按法规时限通知监管和用户。", "告诉用户，攻击者可能怎么联系他们，交易所永远不会做什么。", "受影响的用户，加上提币冷却和异常登录拦截，再盯住暗网上的数据售卖。", "还有一类数据，写上链就很难删掉。", "比如合约里不存邮箱原文，只存邮箱的哈希。", "可邮箱的取值范围有限，攻击者拿常见邮箱逐个算哈希，一比对就能对上。", "欧洲数据保护委员会 EDPB 认为，不加盐、不带密钥的哈希，放在公链上通常不够。", "哈希本身，也算个人数据。", "更稳的做法，是先拼上一段 32 字节的随机盐，再算哈希，链上只存这个承诺。", "盐和原文存在链下可以删除的系统里，删掉盐，链上的承诺就关联不到这个人。", "加密上链再销毁密钥，也不等于数据消失，密文还留在每个节点里。"]}, {"t": "真客服吗", "at": 545.033, "lines": ["交易所今天就能做一件事。", "查一查，客服后台有多少人，能查到一条完整的用户记录。", "普通用户也有几件事。", "买硬件钱包用代收地址，交易所和电商用不同的邮箱。", "不在社交媒体上，把自己的地址或 ENS 名称，和真实身份连在一起。", "收到交易所的泄露通知，开启提币白名单，至少几个月保持警惕。", "回到开头的题。", "对方说得出你的名字、余额和工单，不代表他是真客服。", "这些数据，可能早就泄露了。", "交易所和钱包厂商，永远不会让你把资产转到安全地址，也不会索要助记词。", "主动打来的电话、短信、邮件，说你的账户有风险，一律挂断，再从官方 App 里联系客服。", "数据里没有密码，可它告诉骗子，该骗谁，该怎么说。", "下一集讲资金追踪与事后处置。"]}]}, {"n": 25, "title": "资金追踪与冻结：钱被转走之后", "dur": null, "segs": [{"t": "37 分钟", "at": 0.0, "lines": ["2026 年 10 月，Binance 遭遇了一次大规模盗窃。", "被盗资金，经过主要的清扫交易，转了出去。", "37 分钟后，Tether 冻结了 9.711 亿 USDT。", "又过了 3 分钟，Circle 冻结了 8.23 亿 USDC。", "听起来很快，可还是慢了一步。", "Elliptic 估计，冻结生效之前，约 7.86 亿美元的稳定币，已经被换成了 ETH 和 TRX。", "换成这两种币，发行方就管不到了。", "TRM 统计，事发后约 4 小时，各方累计冻结约 27 亿美元。", "就算这样，冻结也只覆盖了约 44% 的损失。", "先猜一道题。", "被盗的资产里，有 USDT 和 USDC，也有 BTC、XRP 和 SOL。", "发行方冻结，能管到其中哪几种？", "带着这个问题，我们看看，钱被转走之后，到底能拦住多少。"]}, {"t": "以小时计", "at": 68.199, "lines": ["先给一句准确的说法。", "追回的窗口，以小时计。", "头几个小时里，被盗的钱，还是可冻结的稳定币，是交易所里的充值，或者是链上可以暂停的合约份额。", "几个小时之后，它会变成跨链后的原生币，混币器里的存款，或者场外交易的现金。", "这里有两个动作。", "资金追踪，是沿着链上交易，跟踪钱的去向。", "冻结，是由发行方、交易所或链上机制，阻止某个地址转出资产。", "打个比方，抢劫发生后，警方在城市的每个出口设卡。", "出口就是稳定币发行方、交易所、跨链桥和混币器。", "设卡越早，拦住的车越多。", "劫匪一旦开上国道，换了车牌，再拦就很难了。", "这个比方有一处不成立。", "链上的出口，大多不归任何警察管。", "去中心化的跨链桥、混币器和交易所，没有义务配合。", "能拦住的，主要是有中心化运营方的那部分出口。", "攻击者也清楚这一点，所以路线很固定。", "第一步，把稳定币换掉，躲开发行方冻结。", "第二步，分散到大量地址，抬高追踪成本。", "第三步，跨链，或者进混币器，切断链上的关联。", "最后，通过场外交易，或者小额分批进交易所，换成现金。", "实在走不掉，他就等，等关注度下降。", "2025 年 Bybit 被盗之后，约 72% 的资金经 THORChain 换成了 BTC，约 16% 经兑换服务 eXch 兑换。", "拦截点越靠前，成功率越高。"]}, {"t": "前排拦截", "at": 186.266, "lines": ["从早到晚，能拦钱的地方排成一列。", "最靠前的，是协议自己的暂停和延迟提款。", "条件是合约里事先设计了暂停或延迟机制，而且有人值守。", "Bybit 被盗后，mETH Protocol 靠 8 小时的提款延迟，暂停了合约，追回约 4300 万美元的 cmETH。", "这是那次事件里，追回最多的单项。", "第二道，是稳定币发行方冻结。", "Tether、Circle 这类发行方，可以在合约层面冻结一个地址。", "2024 年 9 月，Tether、TRON 和 TRM 联合成立了 T3 金融犯罪部门。", "2026 年 5 月，T3 自报累计冻结 4.5 亿美元以上。", "可这条路，有门槛，有时延，也可能被撤销。", "门槛是，通常要有执法请求或法院命令。", "撤销的例子，是 2025 年 5 月的 LIBRA 案。", "Circle 依据纽约南区法院的临时限制令，冻结了约 5760 万美元 USDC。", "8 月，法官解除了冻结，理由是原告没有证明不可弥补的损害。", "时延的例子，是 2026 年 4 月的 Drift 被盗事件。", "链上调查者 ZachXBT，公开批评 Circle 延迟了约 6 小时，期间约 2.32 亿美元经跨链协议转走。", "这是个人指控，未见 Circle 回应。", "美国 GENIUS 法案在 2025 年 7 月成为法律，要求支付型稳定币发行方，有能力执行冻结、扣押、阻止转账这类合法命令。", "第三道，是交易所冻结。", "条件是交易所收到可信的地址清单，或者风控名单命中，时效在小时级。", "局限也很明显，攻击者会避开合规交易所。"]}, {"t": "最后手段", "at": 310.066, "lines": ["前排拦不住，后面还有三条更重的路。", "一条是链级冻结。", "2025 年 5 月，Sui 上的 Cetus 被盗约 2.23 亿美元，根因是集中流动性合约的算术溢出。", "约 6300 万美元，在冻结前跨链到了以太坊。", "Sui 验证者在链上冻结了约 1.62 亿美元。", "治理投票以约 90.9% 的质押权通过，用协议升级，把冻结的钱转进三方共管的多签，用于赔付。", "钱保住了，争议也来了。", "部分验证者公开表达了保留意见。", "能冻结并改写特定地址，也就说明，这条链的验证者可以干预任意地址。", "Binance 事件里，Arbitrum 安全委员会也强制转走了，攻击者钱包里的 8426 ETH 和 7460 万 ARB。", "一条是谈判与白帽赎回。", "2021 年 8 月，Poly Network 被盗约 6.1 亿美元，攻击者自称白帽，约 15 天内归还。", "2023 年 3 月，Euler Finance 被闪电贷攻击，损失约 1.97 亿美元。", "Euler 提出 10% 的赏金，同时另设 100 万美元悬赏，征集攻击者的线索。", "4 月初，Euler 宣布，全部可追回的资金已经归还。", "可攻击者为什么归还，通常不公开，谈判不能当作预案的主线。", "最后一条，是执法与司法。", "2022 年 2 月，美国司法部逮捕两名嫌疑人，调查人员解密了云存储里的私钥文件。", "没收约 94636 BTC，当时约 36 亿美元，这批币是 2016 年从 Bitfinex 被盗的。", "2025 年 1 月，检方申请把币以实物返还，法官对返还方式提出了质疑，最终处置至今仍有争议。", "从执法追回到真正返还，可能要拖好几年。"]}, {"t": "前 6 小时", "at": 437.333, "lines": ["这些路走不走得通，要看事发后的前 6 小时。", "发现异常，先暂停，协议暂停，交易所暂停这条链的提币。", "接着整理地址清单，被盗地址，攻击者地址，已知的下一跳。", "清单是所有通知的前提，清单不准，冻结请求就会被拒绝或延误。", "然后并行通知，不是排队通知。", "稳定币发行方、交易所风控、跨链桥和兑换服务、SEAL 911 这样的应急网络、链上分析公司，同时发出去。", "先发清单，不要等完整报告，冻结只需要准确的地址和交易哈希。", "同时做证据保全，交易哈希、日志、服务器镜像。", "保全要在清理和恢复系统之前完成，恢复会覆盖证据。", "然后报警，按辖区通知监管。", "一小时之后，可以在链上喊话，提出赏金和安全港条件，并且每小时更新地址清单。", "安全港要事先写好。", "SEAL 的白帽安全港框架，让协议通过治理事先授权白帽，在攻击正在发生时抢救资金。", "默认条款是 72 小时内把资金返回指定地址，赏金 10%，上限 100 万美元。", "事发时再讨论，白帽不敢动手。", "平时也要准备。", "实时监控大额流出和权限变更，风控名单每日更新，每季度演练一次，确认联系人是否有效。", "聚类这类启发式追踪结论，要标注规则和置信度，不能单独作为冻结的依据。"]}, {"t": "能冻结哪些", "at": 545.533, "lines": ["如果被盗的是你自己的钱，顺序也差不多。", "先撤销所有授权，把剩下的资产转到全新的地址，用新助记词、新设备。", "记下被盗地址、攻击者地址、交易哈希、时间，和你点过的链接。", "被盗的是 USDT 或 USDC，马上联系发行方，附上交易哈希。", "钱流进了某个交易所，就通过它的官方渠道提交冻结请求。", "报警，拿到报案回执，交易所和发行方通常需要执法请求才能冻结。", "当心追回诈骗，说能帮你追回资金、要你先付费的人，几乎都是诈骗。", "回到开头的问题。", "发行方冻结，只能管到 USDT、USDC 这类有发行方的代币。", "BTC、XRP、SOL 是原生资产，没有发行方，这条路管不到它们。", "所以第一批通知发给发行方，但不能把它当成全部方案。", "最有效的，是事先设计好的暂停和延迟，加上提前备好的地址清单和联系人。", "钱被转走之后能追回多少，大半在出事之前就定了。", "下一集讲 AI 与 Web3 安全。"]}]}]}, {"name": "第七篇 · AI 与前沿", "eps": [{"n": 26, "title": "AI 与 Web3 安全：新攻击者，新防御者", "dur": null, "segs": [{"t": "说服机器人", "at": 0.0, "lines": ["2024 年 11 月，一个叫 Freysa 的 AI 智能体，守着一笔奖池。", "它只有一条规则，绝不转账。", "这是一场对抗游戏，玩家的目标，就是让它破例。", "一名玩家伪造了一个新会话。", "让它相信，转账函数是用来收款的。", "它照做了，约 4.7 万美元的奖池被转走。", "没有人破解代码，也没有人偷私钥。", "钱是被说服走的。", "先猜一道题。", "如果绝不转账这条规则，写在提示词里，同时也写在合约里。", "玩家说服了模型，钱还会被转走吗？", "带着这个问题，我们看看，AI 给 Web3 安全带来了什么。"]}, {"t": "放大器", "at": 51.8, "lines": ["先给一句准确的说法。", "AI 不是一类新漏洞，它是一个放大器。", "它让攻击者写钓鱼更快，伪造视频更像，找合约漏洞更便宜。", "它也让防御者审计得更广，监控得更快。", "真正新的部分，只有一个。", "当 AI 智能体自己拿着钱包，说服它，就成了转走资产的方法。", "AI 智能体，是能调用工具、执行操作的大语言模型程序。", "比如自动交易的机器人，或者自动回复并打赏的机器人。", "攻击它最直接的办法，叫提示注入。", "把指令藏在模型会读到的内容里，让模型去执行攻击者的意图。", "打个比方，你雇了一个能干、但极其听话的新助理，还把公司的支付卡交给了他。", "任何人走进办公室，塞给他一张纸条，写着老板说把钱转给我，他都可能照做。", "问题不在助理不够聪明，而在你把支付卡，交给了一个会被纸条说服的人。", "这个比方有一处不成立。", "真实的助理，会记得谁是老板。", "智能体的记忆，本身也可能被人写进假内容。", "按 AI 站在哪一边，可以分成五个方向。", "AI 是目标，比如持有钱包的智能体。", "AI 是攻击工具，一边对着人，一边对着代码。", "AI 是开发工具，写合约，写配置，装插件。", "AI 也是防御工具，做审计初筛和监控告警。", "先看最新的那一个，持有钱包的智能体。"]}, {"t": "四个入口", "at": 159.733, "lines": ["一个持有钱包的智能体，大致是这样工作的。", "用户消息、网页、长期记忆、工具说明，都会送进模型。", "模型决定调用哪个工具，比如钱包的转账和授权。", "模型读到的每一种内容，都是输入。", "任何一种输入能影响它调用钱包，就是一条攻击路径。", "第一条，提示注入。", "2026 年 5 月，攻击者先往一个钱包里送了一枚会员 NFT，借此提升了权限。", "再诱导 Grok 回复一条转账指令，Bankr 照着执行了。", "一道屏蔽模型之间指令的防护，在代码重写时被删掉了。", "约 15 万到 20 万美元被转走，约 80% 已经归还。", "第二条，记忆注入。", "攻击者在智能体能读到的地方，写进一段伪造的历史记录。", "智能体把它存进长期记忆，之后的会话里，当成事实来用。", "没有任何新的恶意提示，它也会执行未授权的转账。", "普林斯顿和 Sentient 的研究者，在 ElizaOS 智能体上证明了这一点。", "第三条，工具和插件。", "MCP 让模型连接外部工具，工具说明，用户看不到，模型看得到。", "2025 年 4 月，Invariant Labs 演示，恶意工具说明能诱导编程助手，读取并外传 SSH 私钥。", "PyPI 上还出现过一个钱包 MCP 包，在多个版本里外传 Solana 私钥。", "第四条，运维面板。", "2025 年 3 月，攻击者进入 AIXBT 的运维面板，排进恶意回复，触发打赏功能，转走 55.5 ETH。", "维护者称，这不是在操纵 AI。", "还有一种，根本没人攻击。", "2026 年 2 月，交易智能体 Lobstar Wilde 重建钱包状态出错，把全部代币持仓转了出去。", "约 25 万到 44 万美元的代币，据转述，是故障，不是注入。"]}, {"t": "冲着人来", "at": 294.9, "lines": ["AI 也被用来骗人。", "深度伪造，是用 AI 生成的伪造视频、图像或语音。", "2024 年 10 月，香港警方拘捕了一个诈骗集团的 27 人。", "他们在视频通话里用换脸技术假扮女性，引导受害者在假平台上投资，涉案超过 3.6 亿港元。", "2025 年 6 月，一家加密基金会的员工，在假 Zoom 会议里，看到了公司高管的伪造形象。", "对方说麦克风有问题，让他安装一个扩展，实际是恶意脚本。", "Huntress 高置信度归因于朝鲜相关组织。", "开户审核也被盯上了。", "虚拟摄像头注入和换脸，被用来绕过 KYC 的活体检测。", "iProov 和 Sumsub 的厂商报告都显示，这类欺诈在增长。", "钓鱼文案也变了，更自然，语言更多，迭代更快。", "靠读文案判断真假，已经不可靠。", "Chainalysis 统计，2025 年诈骗损失已确认约 140 亿美元，估算约 170 亿美元。", "和 AI 服务供应商有链上关联的诈骗团伙，平均获利约是无关联团伙的 4.5 倍。", "AI 抬高的，是单起诈骗的获利能力。", "所以防御要回到流程。", "视频里看到真人脸，不能证明对方是真人。", "会议里要求安装任何东西，一律拒绝，大额指令换一个渠道确认。", "FBI 的公告还建议，家人之间约定一个暗语。"]}, {"t": "代码两边", "at": 398.099, "lines": ["再看代码这一边。", "2025 年 12 月，Anthropic 发布 SCONE-bench，收录 405 个历史上被利用过的真实合约。", "对模型知识截止之后才出事的那批合约，智能体在模拟环境里能盗取的金额，合计约 460 万美元。", "扫描新部署的 BSC 合约时，它发现了 2 个此前未知的漏洞，其中一个后来被攻击者真实利用。", "这些测试全部在模拟器里进行。", "另一些基准给出的数字更冷静。", "EVMbench 和后续复评里，最佳检测率约 46%。", "在 22 起真实事件上，没有一组智能体完成端到端的利用。", "AI 在降低利用漏洞的成本，但在真实的复杂系统上，仍明显弱于基准表现。", "对防守方来说，最确定的影响是，修复要更快。", "AI 写的代码，同样会出错。", "2026 年 2 月，Moonwell 上线新的价格包装器，cbETH 只取了它对 ETH 的汇率，漏乘 ETH 的美元价格。", "cbETH 被定价成约 1.12 美元，引发大量清算，留下约 178 万美元坏账。", "相关提交里，有 AI 编程助手署名的共同作者。", "项目方没有把事故归因于 AI，人类同样会犯这个错。", "2025 年 7 月，一个假的 Solidity 扩展上架插件市场，一名区块链开发者被盗约 50 万美元。", "模型还会编出不存在的包名，攻击者抢先注册，这叫幻觉包名。", "2026 年 10 月，Binance 报告称，攻击者借助一个内部 AI 工具，控制了另外两名钱包工程师的电脑。", "工具名称和机制，Binance 没有公开。", "AI 也能帮防守方，做大范围初筛，起草测试，给告警分诊。", "但业务逻辑审查、判断发现能不能真正利用、对结论负责，仍然要靠人。"]}, {"t": "放在模型外", "at": 530.0, "lines": ["回到持有钱包的智能体。", "防线不能放在模型里，模型理解指令的方式不可靠。", "要在钱包这一层，用代码限制它。", "第一，额度，单笔和单日上限写在钱包工具或合约里，超额要人工确认。", "第二，白名单，只允许向预设的地址和合约转账或授权。", "第三，权限隔离，智能体用独立的低额度钱包，主资产不交给它。", "第四，人工确认，新地址、授权、大额操作走人工审批，界面显示解码后的交易。", "第五，输入隔离，一个模型的输出，不能直接成为另一个智能体的指令。", "记忆写入要校验来源，转账前从链上读取余额，运维面板按特权系统加固。", "给外部内容打上不可信标记，有用，但不够，模型仍可能照做。", "团队里，AI 写的代码和配置，和人写的一样，走审查、测试和审计。", "作为用户，不要把主钱包交给任何 AI 机器人，要用，就给它一个只放少量资金的独立钱包。", "回到开头的问题。", "写在提示词里的规则，会被说服绕过。", "写在合约里的规则不会，合约按代码拒绝这笔转账，模型说什么都没用。", "安全边界，要放在模型之外。", "下一集讲审计、测试与开发流程。"]}]}]}, {"name": "第八篇 · 工程与复盘", "eps": [{"n": 27, "title": "审计、测试与开发流程：把安全写进流水线", "dur": null, "segs": [{"t": "审计过也被打穿", "at": 0.0, "lines": ["2021 年 5 月，PancakeBunny 被攻击，损失约 4500 万美元。", "这个项目，做过审计。", "可审计方事后说明，被利用的那份代码，是审计之后才上线的版本。", "审计看的是一份代码，链上跑的是另一份。", "攻击，就发生在那个没被审过的版本上。", "审计本身没有失败，出问题的，是审计和上线之间的那一段。", "项目上线时，常常会说一句，我们通过了审计。", "先猜一道题。", "项目方能不能用，我们通过了审计，来证明线上的代码是安全的？", "想一想，审计报告证明的，到底是哪一份代码。", "还有，审计之后改过的代码，谁来看？", "带着这两个问题，我们看看，安全怎样写进开发的每一步。"]}, {"t": "八道关口", "at": 58.166, "lines": ["先给一句准确的说法。", "审计不是安全的起点，也不是终点。", "它是流水线上的一个关口。", "它之前要有设计和测试，之后要有监控和应急。", "打个比方，合约开发像造一架飞机。", "设计时画图纸，写下任何情况下机翼都不能断。", "每个零件出厂前都要测，还要放进风洞，用各种极端风向去吹。", "外部机构做适航认证，它不查每一颗螺丝，只抽查关键系统。", "飞上天以后，有黑匣子和地面雷达，出了事有应急程序。", "这个比方有一处不成立。", "飞机出厂后，还能召回维修。", "不可升级的合约，部署之后，就再也不能修改。", "所以前面的关口，必须更严。", "把这条流水线展开，一共八个关口。", "规格与威胁模型，安全编码规范，静态分析。", "单元、模糊和不变量测试，关键模块的形式化验证。", "外部审计或竞赛，安全部署与权限移交。", "最后是监控、漏洞赏金、应急响应和保险。", "越靠左的关口，修复越便宜，规格阶段发现的问题，只要改文档。", "静态分析、测试和形式化验证是自动的，每次提交代码都该跑一遍。", "静态分析误报多，不求零告警，要求每个告警都有结论。", "审计发现的问题，要反过来补成测试，防止以后再犯。", "但所有关口都有一个前提，你想到了要检查什么。", "经济攻击和跨协议的组合风险，常常要专门的经济审计。"]}, {"t": "测试三层", "at": 174.766, "lines": ["测试之前，先要写清楚测什么。", "规格里，写出每个函数调用前要满足什么，调用后保证什么。", "再写出系统的不变量，也就是任何时候都必须成立的性质。", "还要列出每个特权角色，最多能造成多大破坏。", "有了这些，测试分三层。", "第一层，单元测试，验证你想到的情况。", "第二层，模糊测试，让工具生成大量随机输入。", "比如一个金库，存进去，马上取出来，用户不能多拿。", "工具会换着各种随机金额，一遍遍去试。", "只要有一个金额，让取回的比存入的多，测试就失败。", "这条性质背后的规则是，舍入必须偏向金库。", "第三层，不变量测试，随机的不是参数，是调用的顺序。", "比如一个银行合约，存款、取款、转账，被随机组合着连续调用。", "每一步之后都检查一次，银行的余额，不少于所有存款加起来。", "先猜一道题。", "一个重入漏洞，要先调用存款，再在回调里调用转账，才会触发。", "只随机参数的模糊测试，能发现它吗？", "通常不能，因为它不会打乱调用顺序。", "不变量测试生成随机调用序列，再配上能触发回调的封装合约，才有机会发现。", "但要注意，不变量测试只检查你写下的不变量。", "Euler 事故里那一条，每个账户健康因子不低于 1，或者能被清算，而且清算后协议不亏。", "如果它没写进测试，工具也不会发现。", "核心数学库、清算逻辑、跨链桥的证明验证，还可以再做形式化验证。", "它用数学方法证明，代码在所有输入和状态下都满足规格。", "代价是规格难写，需要专门的人才。"]}, {"t": "审计与上线", "at": 304.833, "lines": ["测试做足了，才轮到外部审计。", "审计期间冻结代码，审计的对象，是某一个提交哈希。", "把规格、威胁模型、已知风险和测试覆盖率，一起交给审计方。", "关键协议，请两家以上审计，各有侧重。", "也可以在 Code4rena、Sherlock、Cantina 这类平台办审计竞赛，覆盖面更广。", "修复本身也可能带来新漏洞，所以修完要复审。", "编译器版本也要记下来，查它有没有已知 bug，2023 年的 Vyper 事故，就出在编译器上。", "审计之后，审计范围内的代码，一个字都不能再改。", "接着是部署。", "用脚本部署，不手动操作，脚本本身也要评审。", "部署和初始化，放在同一笔交易里完成。", "部署后在区块浏览器上验证源码，再跑一个验证脚本，把关键参数逐个读出来，和预期对比。", "最后，把权限从部署账户移交给多签和时间锁，撤销部署账户的所有角色。", "还有一件常被跳过的事，在目标链上测。", "在以太坊上测过，不代表在目标链上能跑。", "在 BNB Chain 上，BSC-USD 的精度是 18 位。", "出块间隔是 0.45 秒，相邻两个区块的秒级时间戳，可能一样。", "在 TRON 上，要实测 USDT 转账的返回值，去 Nile 或 Shasta 测试网跑，不要只用本地 EVM。", "在 Mantle 上，随交易附带的原生币是 MNT，ETH 只是一个 ERC-20 代币。", "部署前，在目标链的测试网或者主网分叉上，把完整测试跑一遍。"]}, {"t": "监控与应急", "at": 420.3, "lines": ["上线不是终点。", "合约上线以后，要有人一直盯着。", "同时开一个漏洞赏金，让发现问题的白帽，有动力先来报告。", "盯什么？锁仓总量突然下跌，比如 10 分钟内跌了超过 10%。", "同一笔交易里，出现大额闪电贷和本协议的调用。", "任何管理员函数被调用，实现地址变了，时间锁队列里多了新操作。", "预言机价格偏离其他来源，或者超过心跳时间没有更新。", "跨链两侧，锁定量和铸造量对不上。", "告警响起，接下来是应急流程。", "值班人员先确认异常。", "确认后触发暂停，守护者的暂停权限没有延迟。", "然后组建作战室，里面有开发和审计方，还有安全响应团队，比如 SEAL 911 这类社区应急组织。", "评估能不能白帽救援，抢先把剩余资金转到安全的地方。", "联系交易所和稳定币发行方，冻结被盗资金。", "最后发布公告和复盘。", "看一个例子。", "在 Bybit 事故里，mETH 协议追回了 cmETH。", "靠的是三样东西，协议本身有提款延迟，团队有暂停权限，外部安全社区快速牵线。", "这三样，没有一样是出事当天才能加上的。", "应急能力，要事先设计进合约。"]}, {"t": "写进流水线", "at": 518.9, "lines": ["最后，按角色各做一件事。", "先对照八个关口问一句，哪一个是你们跳过的？", "开发者，今天就给你的核心合约，写下一条不变量，让测试去检查它。", "做审计和评审的人，核对审计版本的提交哈希，和线上字节码是不是同一份。", "项目负责人，回答一个问题，如果今晚出事，谁有权按下暂停，他自己知道吗？", "回到开头的问题。", "项目方能用我们通过了审计，证明线上代码安全吗？", "不能。", "审计结论，只对审计时的那个提交哈希成立。", "还要证明线上字节码等于审计版本，并且上线后的每一次改动，都经过审查。", "审计是流水线上的一个关口，不是一张免检证书。", "下一集讲事故案例库。"]}]}, {"n": 28, "title": "事故案例库：同样的错误，换个名字再来", "dur": null, "segs": [{"t": "换个名字再来", "at": 0.0, "lines": ["2016 年 6 月，以太坊上的 The DAO 被攻击，损失约 6000 万美元。", "根因只有一句，先转账，后更新余额。", "钱已经转出去，账上的余额还没减。", "对方合约在收款的回调里，马上回来，再取一次。", "七年后，2023 年 7 月，Curve 被攻击，损失约 7000 万美元。", "这一次，合约里写了重入锁。", "可是 Vyper 编译器，把这把锁实现错了。", "又过了一年多，2024 年 9 月，Penpie 损失约 2700 万美元。", "它的领奖函数，没有加锁。", "三个名字，三种写法，其实是同一个错误，先交互，后记账。", "一个早就修过的漏洞，为什么会换个名字，一再回来？", "读旧事故，能不能让我们提前认出下一起？", "带着这两个问题，我们走进一座事故档案馆。"]}, {"t": "事故档案馆", "at": 66.8, "lines": ["先给一句准确的说法。", "大多数事故不是新漏洞，而是旧漏洞在新环境里复发。", "新环境可以是一条新链，一个分叉，一个新版本，或者一种新的组合方式。", "打个比方，航空业把每一起事故，都写成公开报告。", "所以今天的飞行员，不会再犯 1970 年代的错误。", "链上安全也有自己的事故报告，项目复盘，安全公司分析，还有链上数据。", "读事故报告，是成本最低的安全训练。", "这个比方有一处不成立。", "航空事故由独立机构调查，结论有权威性。", "链上事故的复盘，多数由项目方或安全公司发布。", "细节可能不完整，归因也可能有争议。", "所以读复盘时，只采信多方公开资料一致的事实。", "在这座档案馆里，每一起事故按两个标签归档，根因类别和链。", "以太坊和多链，BNB Chain，TRON，Mantle，各有一面展墙。", "还有两面，一面放代码之外的事故，一面放 NFT 与 GameFi。", "金额都是事发时的美元估值，只能看作约数。", "没有摆上展墙的，不代表没有发生。", "六十多起事故摆在一起，反复出现的，其实只有八种模式。", "前五种藏在代码和版本里，后三种，出在签名、密钥和人身上。"]}, {"t": "代码里的旧病", "at": 163.933, "lines": ["第一种，先交互，后记账。", "识别信号是，外部调用之后，还有状态写入。", "The DAO 是它，Curve 也是它。", "2022 年 4 月的 Fei Rari，先发送 ETH，后记账，损失约 8000 万美元。", "其中一个退出函数，没被重入锁覆盖。", "防御是先检查，再改状态，最后才和外部交互，再加一把所有函数共享的重入锁。", "第二种，零值或默认值有含义。", "2022 年 8 月，Nomad 跨链桥的可信根，被设成了全零，损失约 1.9 亿美元。", "零本该表示什么都没有，在这里却成了合法的值。", "同年 1 月，BNB Chain 上的 Qubit 跨链桥，对零地址发起的转账，也返回了成功。", "这一次，损失约 8000 万美元。", "识别信号是，等于零，零地址，没初始化的映射，被当成了合法值。", "防御是零值一律视为无效，存在与否，用单独的标记来记。", "第三种，一笔交易里能被改变的数据，被当成了事实。", "2020 年 2 月的 bZx，只看一个 DEX 的价格。", "2021 年 5 月的 PancakeBunny，按池子储备给 LP 定价。", "同年 10 月的 Cream Finance，份额价格可以被捐赠抬高，损失约 1.3 亿美元。", "池子储备，合约余额，份额价格，在同一笔交易里，都能先推高再拉回。", "防御是用抗操纵的预言机，资产用内部记账，不直接读合约余额。"]}, {"t": "改动与盲签", "at": 271.333, "lines": ["第四种，新增的函数，绕过了原有的检查。", "2023 年 3 月，Euler Finance 损失约 1.97 亿美元，大部分后来归还。", "根因是新加的捐赠函数，没有做健康检查。", "别的入口都检查了，偏偏新入口漏掉了。", "识别信号是，新增了一个能改余额或债务的入口。", "防御是统一的操作后检查，所有入口都要经过，再用不变量测试兜底。", "第五种，改动过的分叉和新版本，没有重新审计。", "2021 年 4 月的 Uranium Finance，分叉了 Uniswap V2。", "改手续费时，漏改了一个常数，恒定乘积的检查就此失效，损失约 5000 万美元。", "识别信号只有一句话，只改了一行。", "防御是改动即重审，对差异做审计。", "第六种，签名人看不懂自己签的是什么。", "2024 年 7 月的 WazirX，签名人看到的，和签下的不一致，损失约 2.3 亿美元。", "2025 年 2 月的 Bybit，多签前端的脚本被精准篡改，只对目标地址生效。", "签名人盲签了一笔 delegatecall，按 FBI 口径，损失约 15 亿美元。", "TRON 上的权限诈骗也是这一种，用户签下的，是交出自己账户的权限。", "识别信号是，签名界面只显示哈希或摘要。", "防御是独立解码，在硬件钱包上核对，delegatecall 只许指向白名单里的合约。"]}, {"t": "钥匙与人", "at": 374.033, "lines": ["第七种，少数几把钥匙，控制了全部资产。", "2022 年 3 月的 Ronin，9 个验证者里，5 个被控制，损失约 6.2 亿美元。", "2023 年 7 月的 Multichain，MPC 节点全部放在 CEO 的个人云账户里。", "这一次，损失约 1.26 亿美元。", "2026 年 4 月的 Drift，五个人里两人签名就能放行，没有时间锁，损失约 2.85 亿美元。", "识别信号是，签名人少，没有时间锁。", "防御是提高门槛，让签名人真正彼此独立，再加时间锁和速率限制。", "延迟有多大用，看一个反例。", "2025 年 2 月，Mantle 上的 mETH 协议，靠 8 小时提款延迟和暂停权限，追回了 15000 个 cmETH，约 4300 万美元。", "第八种，人是入口。", "2024 年 5 月的 DMM Bitcoin，一道假招聘测试题，控制了供应商员工的终端。", "这一次，损失约 3.05 亿美元。", "同年 10 月的 Radiant Capital，一个伪装成 PDF 的后门，控制了 3 名开发者的设备。", "2025 年 5 月，Coinbase 的外包客服被收买，导出了用户数据。", "识别信号是，招聘测试题，外部文件，会议软件，被收买的员工。", "防御是签名设备和开发设备分开，关键操作两人确认，离职立刻收回权限，数据只留必要的。", "NFT 和 GameFi 的展墙也一样，大额损失多来自社交账号和前端，管理员的铸币权限，还有内部人。"]}, {"t": "写一份复盘", "at": 481.233, "lines": ["认出模式之后，还要会写复盘。", "先写一句话摘要，损失多少，是否追回。", "再写时间线，漏洞在哪个版本引入，攻击交易，发现与响应。", "根因分两层，直接原因是代码哪一行，根本原因是流程哪一环缺失。", "最后写，哪个关口本可以拦住它，被打破的不变量，还有防御清单。", "练习时，每周选一起，只看交易哈希，用调用树找根因，再对照复盘，找出自己漏掉的步骤。", "事件库只是线索，金额和根因要回到一手资料核对，复现只在本地或分叉环境里做。", "今天就能做一件事。", "写代码的人，拿八个识别信号，查一遍自己最近的改动。", "管资产的人，数一数控制资金的钥匙有几把，有没有时间锁。", "回到开头的问题。", "修过的漏洞会回来，是因为环境变了，新链，新分叉，新版本，新组合，检查却没跟上。", "读旧事故，能帮我们提前认出下一起，前提是记住模式和信号，而不是名字。", "也要说清边界，档案馆只认得出旧模式，真正的新漏洞，这里还没有展品。", "同样的错误，会换个名字再来，认出它，靠的是模式。", "下一集讲 2026 年的签名路径安全。"]}]}, {"n": 29, "title": "攻击者不再偷私钥，而是控制签名路径", "dur": null, "segs": [{"t": "钥匙还在，钱没了", "at": 0.0, "lines": ["2025年2月21日，Bybit 的以太坊冷钱包，被转走了大约15亿美元。", "私钥，没有泄露。签名人按照流程，一个一个，按下了确认。", "屏幕上显示的，是一笔普通的转账。", "而真正签下去的交易，多了一个参数：operation，等于 1。", "就这一个数字，让钱包去执行了攻击者的代码，把自己的实现合约，换成了攻击者的。", "钥匙，一直锁得好好的。攻击者控制的，是钥匙盖在什么文件上。", "这一集，我们跟着一笔交易，走完它从提出、到上链的七道关。"]}, {"t": "七道关", "at": 44.12, "lines": ["先把这条路画出来。", "假设一位用户，要从交易所提走 2 万 USDT。这是示例。", "第一关，业务意图。用户点下提现，账本里多了一张提现单。", "第二关，请求构造。钱包后台把这张单子，翻译成一笔待签名的交易。", "第三关，风控与审批。规则检查金额和地址，大额还要有人批准。", "第四关，显示与解码。审批的人看不懂原始字节，他看到的，是翻译出来的文字。", "第五关，签名。可能是 MPC 节点，可能是硬件加密机，也可能是多签的签名人。", "第六关，广播。签好的交易，发到链上。", "第七关，链上状态。余额变了。有时候，账户的代码和权限，也会跟着变。", "还有一条支线。有些系统要先读链上数据，再决定签不签。这些数据，来自 RPC 节点。", "注意每一个箭头。下游都默认，上游已经检查过了。", "从意图到链上，这整条链路，叫做签名路径。", "私钥，只待在第五关。攻击者要的，只是让第五关，签出他想要的东西。"]}, {"t": "断在哪一关", "at": 131.153, "lines": ["2024 年以来的六起大额事件，我们一个一个，放到这条路上。", "先看第二关。2026 年 9 月，Bitget 被转走约 3.9 亿美元。", "项目方说，一款第三方安全产品的零日漏洞，泄露了内部凭证。", "攻击者用定制工具，伪造了提现指令。", "项目方说，私钥和冷钱包没有受影响。那款产品的名字，至今没有公开。", "再看第四关。2024 年 7 月，WazirX 损失约 2.3 亿美元。", "WazirX 说，托管方 Liminal 界面上显示的，和实际签的不一样。", "Liminal 说，自己没有被攻破。双方说法冲突，还没有最终的独立报告。", "同样断在第四关的，是开头讲的 Bybit。", "Safe 说，一名开发者的电脑先被攻破，攻击者劫持了他的 AWS 会话令牌，", "改掉了托管在 S3 上的前端代码。", "篡改的代码，只对 Bybit 的冷钱包生效。交易完成大约 2 分钟后，代码又被换了回来。", "签名人看到的屏幕，来自同一个被篡改的前端。他们没有第二个地方可以核对。", "第五关，签名人自己。2026 年 4 月，Solana 上的 Drift，损失约 2.85 亿美元。", "第三方分析说，安全委员会五个人里两人签名就能生效，迁移后没有时间锁。", "成员预先签了，自己没完全看懂的交易。", "Solana 的持久 nonce，让这些签名不会自然过期。攻击者可以等，等到时机合适再提交。", "再看那条支线，数据源。同在 2026 年 4 月，KelpDAO 损失约 2.92 亿美元。", "这座跨链桥只用了一个验证者。", "LayerZero 说，攻击者替换了它依赖的两个 RPC 节点，再用 DDoS 打掉其他节点，逼它切换过去。", "恶意节点只对这个验证者撒谎。验证者本身没被攻破，它诚实地，对假数据签了名。", "责任怎么划分，双方有争议，已经进入诉讼。"]}, {"t": "断在哪一关 · Binance", "at": 273.02, "lines": ["最后一起，也是最大的一起。", "2026 年 10 月 29 日，Binance 多条链的热钱包，被转走约 63.4 亿美元。这是项目方的口径。", "按项目方的初步报告，攻击者先用一份假的面试作业，控制了一名工程师的电脑。", "另一名工程师的电脑上，放着容器部署的令牌。", "攻击者用它部署了自己的容器，接触到了内部签名服务。", "这是第五关。攻击者没有偷钥匙，他让签名服务替他签。", "签出来的，是 50 笔操纵 nonce、设置 EIP-7702 委托的交易。", "以太坊热钱包的地址，从此会执行攻击者指定的代码。", "然后是第七关。Binance 暂停了提现，关掉了热钱包服务。", "但委托是链上状态，不受这些开关控制。", "按公开的时间，这个委托在链上存活了大约 3 小时 50 分钟。", "告警时间、内部 AI 工具怎么被利用，报告里还没有说清。完整报告还在等。"]}, {"t": "三个共同点", "at": 344.02, "lines": ["六起事件，打在六个不同的位置。结果却一样：签名系统正常运行，签出了攻击者想要的东西。", "把它们叠在一起，能看到三个共同点。", "第一，校验放错了位置。下游只检查请求的格式，不检查请求背后，有没有真实的业务。", "第二，关键输入只有一个来源。一块屏幕，一组 RPC，一个发布包，一条审批路径。", "第三，响应只管链下。关掉服务，也无法改变已经写在链上的状态。", "回到开头那句话。私钥保护，回答的是谁拿着钥匙。", "签名路径，回答的是谁决定，钥匙盖在什么文件上。", "所以防御也是三条。第一，每一层都重新检查，不继承上一层的结论。", "第二，关键输入要有多个独立来源，对不上就拒签，不自动切换。", "第三，响应要覆盖链上状态。暂停提现，不等于撤销权限。"]}, {"t": "怎么守", "at": 412.953, "lines": ["下面是一套示例架构。它综合了公开事件的教训，不是哪家交易所公布的方案。", "账本，意图签发，策略引擎，审批，签名集群，广播，链上，再加一套独立监控。", "开发电脑到签名集群，这条线是禁止的。网络上根本不该有这条路由。", "我们挑四个重点。第一，账本绑定签名。", "签名服务只为账本里存在、状态正确、金额一致的提现单签名。同一张单，只能签一次。", "目标和金额，要从原始交易里解析出来，不读上游写的描述。伪造的提现指令，在这里对不上账。", "第二，策略读的是原始待签字节，而且默认拒绝。没有明确规则的交易类型，一律不签。", "比如 Safe 多签，operation 只允许等于 0。", "要用 1，只能指向官方的批量调用合约，链上还有 Guard 合约再拦一次。", "Bybit 那笔 operation 等于 1 的交易，在这里会被拒绝。", "再比如热钱包，EIP-7702 授权一律拒签。策略如果覆盖了这一条，Binance 那批委托就签不出来。", "第三，分链熔断。某条链流出异常，就停这条链的广播。", "发现账本里没有对应订单的流出，所有链一起停。熔断的开关，不能依赖已经被攻击的系统。", "第四，紧急撤销。7702 委托，要用一笔新的授权，把委托地址设成零地址，才能清掉。", "MPC 钱包没有一把单独的私钥能立刻做这件事。所以要有一条独立的撤销路径，预先批准，每季度演练，记下用时。", "最后查一下账户代码，结果为空，才算完成。", "也要说清局限。架构挡不住所有内部人作恶。它做的，是把一个人作恶，变成需要多人共谋。"]}, {"t": "你今天能做什么", "at": 543.453, "lines": ["最后，按角色，每个人今天就能做一件事。", "签名工程师，列出所有能到达签名节点的调用路径，找出没经过策略引擎的那一条。", "多签签名人，换一台设备，独立重新计算下一笔交易的哈希，别和前端用同一个来源。", "运维，扫描开发电脑上的生产令牌，看看一台失陷的电脑，能部署到哪里。", "安全工程师，在测试网发一笔 7702 授权请求，看策略拒没拒，告警响没响。", "事故指挥官，主持一次撤销演练。暂停提现之后，你怎么确认链上授权已经清掉？", "回到开头的问题。钥匙还在，钱为什么没了？", "因为攻击者控制的不是钥匙，是钥匙要盖的那份文件。", "守住签名路径，靠的不是哪一关特别强，而是每一关都重新检查。", "六起事件，一条路径，每一关都要重新检查。下一集讲企业链的安全。"]}]}]}]}, DECK="../../../web3-security-handbook/Web3-Security/deck/ch";

 document.querySelectorAll(".it").forEach(a=>a.classList.toggle("on",+a.dataset.n===n));
 const on=document.querySelector(".it.on");on&&on.scrollIntoView({block:"nearest"});show(panel)}
function show(p){panel=p;const P=$("panel"),F=$("deck"),S=$("script");P.classList.toggle("show",!!p);F.hidden=p!=="deck";S.hidden=p!=="script";
