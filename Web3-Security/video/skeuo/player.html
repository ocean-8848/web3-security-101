<script>
const D={"groups": [{"name": "第一篇 · 全景与基础", "eps": [{"n": 1, "title": "合约安全全景：为什么代码就是金库", "dur": null, "segs": [{"t": "一笔日常签名", "at": 0.0, "lines": ["2025 年 2 月，Bybit 的多签签名人，签了一笔看起来很正常的交易。", "可他们用的 Safe 钱包网页前端，已经被人篡改了。", "签下去的这笔交易，替换了多签的实现合约。", "约 15 亿美元，就这样被转走。", "先请你猜一猜。Safe 多签合约的代码，有没有被利用的漏洞？", "如果没有，钱又是从哪里漏出去的？", "这一集是整个系列的入口。我们要回答三个问题。", "合约安全和传统安全，到底哪里不一样？", "攻击会从哪些地方进来？", "怎么站在攻击者的角度，给一个系统建模？", "开头那个问题的答案，留到最后揭晓。"]}, {"t": "代码就是金库", "at": 51.366, "lines": ["先给一个准确的定义。", "智能合约，是部署在区块链上、按代码自动执行的程序。它可以持有资产，也可以转出资产。", "压成一句话就是：一段公开的、不可撤回的、直接控制资金的代码。", "任何人，都可以用任意参数、任意顺序调用它。", "打个比方。它像一台放在广场中央的自动售货机。", "机器里装着真金白银，这就是合约余额。", "电路图贴在外壳上，谁都能看。合约的字节码一定公开，源码通常也公开。", "全世界的人，可以全天候来投币、按按钮、拍打机器。", "机器装好以后，就不能打开维修。", "如果留了维修门，也就是升级代理，这把钥匙本身就成了攻击目标。", "机器吐错了钱，没有客服能帮你追回。交易是不可逆的。", "但这个比方有个地方不成立。真实的售货机，一次只服务一个人。", "合约在一笔交易里，可以被同一个人反复调用、嵌套调用。", "它还能和几十台别的售货机，拼在一起用。这叫可组合性。很多漏洞，正是从这里来的。", "拿它和 Web2 后端、中心化交易所比一比，最关键的区别有三个。", "第一，谁能调用。Web2 要先鉴权，交易所要先过 KYC。", "合约面前，任何地址、任何合约都能来。public 函数，就是对全世界开放的 API。", "第二，出错能不能回滚。Web2 可以改数据库，交易所可以改内部账本。", "合约的交易不可逆，只能靠升级，或者社会共识。没有升级权限，就修不了。", "第三，攻击成本。在别处，要绕过防火墙，或者攻破内部系统。", "在合约这里，只需要一笔交易的 gas。闪电贷还能在一笔交易里，借到上亿美元的本金。", "能升级，是修复能力，也是攻击面。升级密钥，可能被盗。", "交易所也躲不开合约安全。它的冷钱包，可能就是一个多签合约，比如开头的 Safe。"]}, {"t": "攻击面地图", "at": 199.0, "lines": ["知道了合约是什么，我们跟着一笔交易，看攻击从哪里进来。", "用户或者攻击者的账户，先经过钱包和前端的签名界面。", "交易进入内存池，在那里公开排队。", "区块构建者或者排序器，决定它和别的交易谁先谁后。", "然后它到达目标合约，执行业务逻辑。", "目标合约会去调用外部合约，比如代币、DEX、预言机。它背后还连着代理和实现，也就是升级权限。", "有的交易，还要经过跨链桥，去到另一条链上的合约。", "这条路上，有五个地方最危险：签名界面、内存池、外部合约、升级权限、跨链桥。", "它们叫信任边界。数据和控制权在这里跨过去，漏洞也最集中。", "注意一个往回走的箭头。外部合约可以在你的函数执行到一半时，调回你的合约。重入就发生在这里。", "内存池和构建者决定交易的顺序。顺序本身，也可以被利用。", "这张图也有局限。它没画链本身的共识和节点。", "链被攻破，或者节点数据有误，合约写得再对也没用。", "沿着这张图，可以把漏洞归成六大类。", "第一类，控制流。外部调用让攻击者插队执行，比如重入。", "第二类，权限。不该调用的人调用了，比如缺少修饰器、合约未初始化、私钥泄露。", "第三类，数学。数字算错了，比如溢出、精度损失、舍入方向。", "第四类，数据可信度。合约相信了可以被操纵的数据，比如现货价格预言机、签名重放。", "第五类，经济设计。代码按规格执行，但规格本身可以被套利。", "第六类，系统与运营。代码之外的环节失守，比如跨链验证、多签私钥、前端篡改、社会工程。", "真实事故往往是几类叠加。2023 年的 Euler，就是业务逻辑缺陷，加上闪电贷放大。", "第六类，又可以拆成两块。一块是链本身，和你读链的方式。另一块是人、设备和流程。", "社工常常是入口，私钥或者前端是落点。AI 不是独立的攻击面，而是攻防两边的放大器。"]}, {"t": "损失往哪走", "at": 359.566, "lines": ["六大类里，钱到底丢在哪儿？我们看损失的变化。", "先说口径。下面的数字来自公开报道和安全公司的年度统计，按事发时的美元估值，都是约数。", "2016 年，The DAO 因为重入，损失约 6000 万美元。", "那几年多是重入、溢出这类代码漏洞。编译器和库成熟以后，这类漏洞少了。", "2022 年，Ronin 跨链桥损失约 6.2 亿美元，原因是验证者私钥。", "2024 年，DMM Bitcoin 损失约 3.05 亿美元。入口是假招聘，落点是供应商的终端。", "2025 年，就是开头的 Bybit，约 15 亿美元，出在前端和签名界面。", "2026 年 10 月，Binance 热钱包损失约 63.4 亿美元。这是项目方的口径。", "按这个口径，它超过此前任何单起事故的 4 倍。", "趋势很清楚。最大的损失，从代码漏洞，转向了跨链桥和运营安全。", "私钥、多签、前端、社工、内部人。代码审计，覆盖不到这些环节。", "但数学类漏洞并没有消失。2025 年的 Balancer V2，在舍入方向上出了错。", "项目方口径约 9480 万美元，早期报道约 1.28 亿。成熟的协议，也会在这里出错。"]}, {"t": "攻击者能做什么", "at": 454.933, "lines": ["入口这么多，怎么系统地去想？办法是威胁建模。", "威胁建模，就是在写代码之前，列出攻击者能控制的输入、能触发的路径、想得到的结果。", "核心只有一个问题：攻击者能控制什么？", "对任何合约，都先默认攻击者能做到这些事。", "用任意参数，调用任意一个公开函数。", "部署自己的合约，让你的合约去调用它，比如恶意代币、恶意回调。", "在一笔交易里，借到巨额资金。", "看到内存池里还没确认的交易，在它前后插入自己的交易。", "不经过你的函数，直接往你的合约里转入代币。", "读取你合约的全部存储，包括标成 private 的变量。", "在另一条链或另一个合约上，重放你签过的消息。", "举个例子。管理员密码存在 private 变量里，攻击者读得到吗？", "读得到。private 只限制别的合约来调用这个变量，不隐藏链上数据。", "反过来，攻击者通常做不到三件事。", "伪造别人的签名，除非私钥泄露，或者验签写错了。", "修改已经确认的区块，除非链的共识被攻破。", "让合约以为调用者是别人，除非你的代码用错了身份判断的方式。", "有了这张能力清单，建模分六步。", "第一，列出合约持有的资产，比如用户存进来的 USDT、协议手续费。", "第二，列出每个会改变资产的函数，标上谁能调用。", "第三，写出不变量，也就是任何操作之后，都必须成立的式子。", "比如，合约里的 USDT 余额，不少于所有用户存款之和。", "第四，对每个函数问：攻击者控制哪些输入？有哪些外部调用？调用之前，状态更新了没有？", "第五，对每个外部数据问：价格、余额、签名从哪里来？一笔交易里能不能被操纵？", "第六，对每个特权角色问：私钥在谁手里？被盗了最多损失多少？有没有时间锁？", "不变量是整个安全工作的锚点。所有测试，最后都在验证它。", "这个方法也有局限。威胁建模靠人的想象力。", "经济攻击常常超出单个合约，要把整个协议和外部市场放在一起建模。"]}, {"t": "今天做一件事", "at": 618.3, "lines": ["最后，按角色，每个人今天都能做一件事。", "写合约的人，给你的合约写下一条不变量，再找出每一个可能打破它的函数。", "做审计的人，别只照清单打勾。问一问，这个问题是不是几类叠加。", "管钱包和运营的人，问自己：最大的一笔资产，私钥在谁手里？被盗了最多损失多少？", "普通用户，记住开头那一幕。签名时看到的屏幕，也可能被篡改。", "回到开头的问题。Safe 合约的代码，有没有被利用的漏洞？", "公开分析没有指向合约代码的漏洞。合约忠实地，执行了签名人签下的交易。", "它属于第六类，系统与运营。失守的，是前端和签名界面。", "这个答案依据的，是公开分析。它说明一件事：代码写对了，钱照样可能丢。", "这也是为什么，这个系列不只讲合约代码。", "六大类、攻击面地图和能力清单，就是后面每一集的地图。下一集讲私钥从哪里来。"]}]}, {"n": 2, "title": "私钥从哪里来：256 位的私钥，为什么只值 32 位", "dur": null, "segs": [{"t": "种子只有32位", "at": 0.0, "lines": ["2022 年 9 月，Wintermute 的金库被盗，约 1.6 亿美元。", "这个金库的地址，是用一个叫 Profanity 的靶号工具生成的。", "靶号地址，就是首尾字符符合指定模式的地址。比如开头是一串 0。", "私钥有 256 位，按理说，没人猜得出来。", "可这个工具的随机数，只用了一个 32 位的种子。", "32 位种子，只有约 43 亿种可能。", "做个示例计算。如果每秒试 10 亿个种子，全部试完，最多约 4.3 秒。", "真实攻击还要从种子算出地址，会慢一些。但一张 GPU，几分钟就够。", "那么问题来了。一把 256 位的私钥，为什么只值 32 位？", "这一集，我们讲私钥从哪里来，又是怎么被算出来的。"]}, {"t": "各管什么", "at": 58.433, "lines": ["这一集的核心，是一句话。密码学算法几乎从不被破解，被攻破的，是实现。", "随机数不够随机，nonce 能被算出，门限签名的库省掉一步证明。", "私钥的安全上限，由它的生成和使用过程决定。", "先给准确的定义。熵，是随机性的度量，单位是位。", "256 位熵，攻击者要试大约 2 的 256 次方次。只有 32 位熵，约 43 亿次就够了。", "打个比方。保险柜的密码有 77 位数字，理论上没人猜得出。", "但如果设密码的人，总用自己的生日加一串固定数字，小偷只要试几万个生日。", "这个比方有一处不成立。小偷试生日，必须站在保险柜前面。", "链上的公钥和地址全部公开。攻击者可以离线、并行、无限次地试，不会触发任何告警。", "再看几种原语，各自保护什么，不保护什么。", "ECDSA 和 EdDSA 用来签名。它们保证，没有私钥的人无法伪造签名。", "但它们不管私钥和 nonce 的质量，也不管用户看没看懂签的内容。", "哈希保证数据没被改动，但不保证数据本身是对的。", "助记词让人能抄写和恢复钱包，但不管生成它时熵够不够。", "分层派生，从一个种子派生出一组地址。一份备份恢复全部，一个种子泄露，也全部泄露。", "整条链路是这样的。随机数源，到助记词，到种子，再派生出私钥和地址。", "签名时，私钥、消息，再加一个 nonce，一起算出签名。", "这条链路上，有两处需要随机性。生成私钥时的熵，签名时的 nonce。任何一处出错，私钥都能被算出来。", "图上没画的，是签名的内容。算法完全正确，用户也可能签下攻击者的交易。所以签之前，要看清签的是什么。"]}, {"t": "熵不够", "at": 194.466, "lines": ["先看第一处，熵不足。攻击路径有四步。", "第一，生成器用了状态很小的伪随机数生成器，比如只用 32 位种子初始化的 mt19937。", "第二，种子只有约 43 亿种，私钥也就只有约 43 亿种。", "第三，攻击者在 GPU 上枚举全部种子，算出对应的地址。", "第四，和链上有余额的地址比对。命中，就转走资产。", "看起来随机，不等于安全。私钥必须来自 CSPRNG，也就是密码学安全随机数生成器，满 256 位熵。", "三个案例，走的都是这条路。", "第一个是 Profanity。1.60 及以前的版本只用 32 位种子。", "2022 年 9 月 15 日，1inch 公开披露。5 天后，Wintermute 被盗。同期还有多个受害者。", "第二个，Trust Wallet 浏览器扩展。Wallet Core 的 WASM 版本生成助记词，用的是 mt19937，熵从 256 位降到 32 位。", "受影响的，是 2022 年 11 月 14 日到 23 日新建的扩展钱包。Ledger 的安全团队报告后，几天内就修复了。", "但部分弱钱包后来还是被盗，损失约 17 万美元，Trust Wallet 承诺补偿。", "第三个，Libbitcoin Explorer 的 Milk Sad 漏洞。它生成种子的命令，用的是一个 32 位的时间值。", "2023 年 7 月 12 日发生集中盗取，损失至少约 90 万美元。", "厂商认为，文档早有警告。", "教训有三条。在 WASM 或 JS 里替换随机源，要单独审计。", "文档里的警告挡不住误用，生成密钥的接口必须默认安全。", "最容易漏掉的一条是，修好代码，修不好已经生成的弱私钥。用户必须迁移到新地址。"]}, {"t": "nonce泄密", "at": 327.233, "lines": ["第二处随机性，在签名里。", "ECDSA 每次签名，都需要一个一次性的数，叫 k，也就是 nonce。", "k 出错有三种情况。第一种，两次签名用了同一个 k。", "攻击者还需要别的东西吗？", "不需要。两个签名和两个消息哈希都是公开的，直接解方程，就得到私钥。", "打个比方。nonce 像一块每次都换的遮布，盖在私钥上面。", "同一块布用了两次，两次结果一对比，布就被消掉，私钥就显出来了。", "比方的局限是，真实过程是解方程。而且下面两种情况，一次对比无法解决。", "第二种，k 有偏置，比如高几位总是 0。收集足够多签名，用格方法就能恢复私钥。", "第三种最糟。k 可以由公开数据算出，那么单个签名就能反推私钥。", "标准早有解法，叫 RFC 6979。它用私钥和消息，确定性地派生 k，可以消除前两种风险。", "EdDSA 标准也要求，nonce 由私钥的秘密部分派生。风险来自偏离标准的实现。", "三个案例。2013 年 8 月，Android 的随机数缺陷，让不同签名用了相同的 nonce，多款比特币钱包受影响。", "2019 年，一项研究用格方法，恢复出数百个比特币私钥，和数十个以太坊私钥。", "2026 年 6 月，Cardano 钱包 SecondFi 的 Android 版，用公开交易数据派生 nonce，漏掉了秘密部分。", "nonce 人人可算，单个签名就能反推私钥。", "374 个钱包被盗，约 1600 万 ADA，约 240 万美元。这是官方口径，SlowMist 的估计更高。", "硬件钱包签名走另一条路径，不受影响。", "教训是，nonce 必须确定性派生，并包含私钥的秘密材料。封装层要做已知答案测试，不能只信任底层库。"]}, {"t": "门限与量子", "at": 464.033, "lines": ["第三类风险，在门限签名里，也叫 TSS 或 MPC。", "准确地说，它是多方各持一份密钥分片，合作产生签名。安全性依赖协议里的每一步零知识证明。", "打个比方。几个人各拿一块拼图，合作盖章。每一步都要出示证明，证明自己守规矩，但不亮出自己那块。", "比方不准的地方是，分片不是拼图，风险也不在有人偷拼图。", "而在省掉一步证明后，恶意参与方能在多次签名中，逐步提取别人的分片。", "2023 年 8 月，Fireblocks 披露 BitForge。GG18 和 GG20 的实现缺少参数证明，恶意参与方可以提取完整私钥。", "Lindell17 的实现偏离论文，约 200 次签名请求就能提取私钥。影响 15 家以上钱包服务商。", "Verichains 的 TSSHOCK 披露了三类攻击。比如证明的重复次数从 128 降到 1，可以直接猜中。", "受影响的有 BNB 的 tss-lib、Multichain、THORChain、Axelar 等多个开源库。两项披露都没有报告实际资金损失。", "教训是，MPC 库不能按论文简化。选供应商时，要问它是否修复了这两类漏洞，并要审计报告。", "最后看后量子。足够大的量子计算机，可以从公钥算出 ECDSA 和 EdDSA 私钥。哈希函数受影响较小。", "比特币 P2PKH 这类地址，公钥在第一次签名后才暴露。所以从未签过名的地址更安全。", "截至 2026 年 11 月，NIST 已发布后量子标准。比特币的 BIP-360 仍是草案。", "以太坊基金会的目标，是约 2029 年完成核心基础设施。这是规划，不是承诺。", "迁移周期以年计。现在能做的，是盘点资产，避免地址重复使用，跟踪各链的迁移计划。"]}, {"t": "怎么守", "at": 595.4, "lines": ["防御按层来。", "生成层，用 CSPRNG 或硬件随机源，满 256 位熵。不在 WASM 和浏览器 JS 里自己替换随机源。", "签名层，用标准 EdDSA 或 RFC 6979。再用已知答案测试和差分测试，验证封装层。", "监控层，扫描自家地址的签名，检测重复的 r 值。", "靶号工具，不用来生成管理员或金库地址。MPC 库，逐项审计证明，及时升级。", "生成缺陷修复后，强制用户迁移到新地址。", "按角色，今天就能做一件事。", "钱包开发者，搜一遍密钥生成代码，确认没有时间戳种子、Math.random 和 mt19937。", "审计和安全团队，查一遍金库和管理员地址，是不是靶号工具生成的。", "普通用户，只用主流钱包生成助记词。厂商一公告随机数缺陷，立刻把资产转到新钱包生成的新地址。", "回到开头的问题。一把 256 位的私钥，为什么只值 32 位？", "因为私钥的强度，取决于生成它的熵。熵只有 32 位，位数再多，也只有 32 位。", "256 位的强度要成立，有三个条件。熵满 256 位，nonce 不可预测，实现不偏离标准。", "私钥只有它的种子那么强。下一集讲 EVM 与 Solidity。"]}]}, {"n": 3, "title": "EVM 与 Solidity 安全基础：先看懂这台机器", "dur": null, "segs": [{"t": "借来的身份", "at": 0.0, "lines": ["先看一个示例场景。", "管理员的钱包，打开了一个钓鱼页面。", "他以为自己在领空投，实际调用了攻击者的合约。", "攻击者的合约，紧接着去调用你的金库。", "金库的权限检查只有一句：交易的发起人，必须是管理员。", "这次调用，能通过吗？", "能。", "这句检查读的是 tx.origin，也就是发起整笔交易的那个外部账户。", "在这里，就是被骗的管理员。中间经过多少个合约，它都不变。", "攻击者没有偷私钥。他借用了管理员的身份。", "要看懂这一步，先要看懂这台机器，EVM。", "这一集讲三件事：谁在调用，数据存在哪，语言里有哪些坑。"]}, {"t": "调用上下文", "at": 55.833, "lines": ["EVM 是一台单线程的栈式计算机。每个合约，有自己的代码和存储。", "合约之间，靠消息调用来通信。每一次调用，都可能把控制权交给别人。", "链上有两类账户。", "外部账户叫 EOA，由私钥控制，能主动发起交易。", "合约账户由代码控制，不能主动发起，只能被调用。", "但这条界线在变。2025 年 5 月，以太坊 Pectra 升级上线了 EIP-7702，EOA 可以委托执行一段合约代码。", "所以，查对方有没有代码，已经不能判断它是不是普通用户。比较 msg.sender 和 tx.origin，也不行。", "再看调用上下文。假设用户调用合约 A，A 调用 B，B 再调用 C。", "站在 C 的位置，看四个变量。", "tx.origin，是发起整笔交易的用户。", "msg.sender，是直接调用 C 的那一个，也就是 B。", "msg.value，是这次调用附带的原生币，也就是 B 转给 C 的数量。", "address(this)，是当前执行代码的合约，也就是 C 自己。", "开头那个金库，该看的是 msg.sender，不是 tx.origin。", "合约之间怎么调用？有三种方式。", "第一种 call，最常见。执行 B 的代码，改的是 B 的存储。", "第二种 delegatecall。执行的还是 B 的代码，改的却是 A 的存储。", "而且 msg.sender 和 msg.value 保持不变。代理合约和库合约，都依赖它。", "打个比方。EVM 像一个只有一个窗口的政务大厅，每个合约是一个科室。", "call，是派人带着材料，去 B 的窗口办事。", "delegatecall，是把 B 的规程手册借过来，在 A 自己的档案柜上照着办。", "如果手册写着，清空 0 号抽屉，被清空的是 A 的抽屉。", "这个比方有一处不成立。真实的大厅里，你离开窗口，就不能插队回来。", "EVM 里，B 办到一半，可以反过来再找 A。这时 A 的上一件事，还没办完。这就是重入。", "第三种 staticcall，是只读调用。任何写存储或发事件的操作，都会回滚。", "还有一个坑。低级 call 失败时，不会自动让调用者回滚，只返回 false。"]}, {"t": "存储槽", "at": 222.033, "lines": ["接下来，看数据存在哪里。", "每个合约都有一张巨大的键值表，叫存储。键和值都是 32 字节，键叫做槽位。", "可以把它想成一排抽屉柜。每个抽屉 32 字节，从 0 号开始编号。", "规则一，状态变量按声明顺序，从 0 号槽开始放。", "规则二，相邻的变量加起来不超过 32 字节，编译器就把它们打包进同一个槽。", "看一个例子。owner 是地址，占 20 字节，放进 0 号槽。", "paused 是布尔值，占 1 字节，也挤进 0 号槽。", "fee 是 96 位整数，占 12 字节。20 加 1 加 12 是 33，放不下了。", "所以 fee 去了 1 号槽，total 顺延到 2 号槽。", "如果把 fee 改成 88 位，也就是 11 字节，三个变量正好 32 字节，全部挤进 0 号槽。", "total 就从 2 号槽，挪到了 1 号槽。代理升级时，这种挪动会让后面的变量全部错位。", "规则三，mapping 自己占一个槽，这个槽是空的。元素放在键和槽号一起哈希出来的位置。", "规则四，动态数组的槽里存长度。元素从槽号的哈希开始，依次往后排。", "规则五，常量和不可变量，不占存储槽。", "为什么这是安全问题？看四个场景。", "第一，代理合约和实现合约的变量顺序不一致。实现合约以为在写 owner，实际改写了代理的实现地址。", "第二，升级时在中间插入新变量。后面的变量全部错位，余额可能被当成地址来读。", "第三，用 private 变量存密码或种子。任何人通过 RPC 读一下存储，就能看到。", "第四，用 delegatecall 去调用不受信任的合约。对方的代码可以改写你的任何槽位，甚至让合约自毁。", "所以 EIP-1967 给代理定了固定的槽位。用哈希算出一个看起来随机的位置，避免和实现合约冲突。"]}, {"t": "八个误解", "at": 364.4, "lines": ["下面是最容易误解的 8 个语言特性。每个都看三件事：误解，事实，影响。", "一，private。误解是别人看不到。", "事实是，它只限制其他合约来调用，存储完全公开。所以不能存秘密。", "二，receive 和 fallback。误解是，转账只是改个余额。", "事实是，向合约转 ETH，会执行它的代码。这就是重入的入口。", "三，selfdestruct。误解是它能删掉合约。", "2024 年 Cancun 升级引入了 EIP-6780。之后，只有同一笔交易里创建的合约，才会被删除。其他情况，只转走余额。", "四，合约余额。误解是，只能通过我的函数增加。", "事实是，任何人都能强制转入。比如 selfdestruct，比如出块奖励地址。", "所以，拿合约自己的余额来记账，会被一笔捐赠打乱。", "五，检查型算术。0.8 版以后，溢出会回滚。", "但 unchecked 块，类型转换，除法截断，都不会报错。", "六，block.timestamp。它不是精确时间。", "出块者可以在小范围内改动它，L2 上由排序器决定。不能拿它做随机数，也不能做秒级判断。", "七，block.number。误解是，每个块的时间固定。", "BSC 在 2026 年 1 月的 Fermi 升级后，出块时间从 3 秒缩到了 0.45 秒。L2 上的含义，因链而异。", "用区块数来算利息或锁定期，就会出错。", "八，函数选择器。误解是，函数名就是唯一的身份。", "事实是，选择器只取哈希的前 4 字节，不同的函数签名，可能撞在一起。", "2021 年 8 月的 Poly Network 事故，关键一步就在这里，损失约 6.1 亿美元。", "按公开复盘，一个构造出来的函数名，撞上了替换验证者公钥的那个函数。", "审计时还要盯住一对词：storage 和 memory。", "storage 是引用，改了会写回。memory 是副本，改了不写回。", "写错一个词，余额或标志位没更新，资金就可能被反复领取。"]}, {"t": "回滚与Gas", "at": 524.599, "lines": ["最后一块基础，是 gas 和回滚。", "每条指令都消耗 gas。gas 用完，当前调用帧回滚。", "require 和自定义错误，会回滚当前调用，并向上冒泡。", "低级 call 失败却不冒泡，只返回 false 和返回数据。", "try catch 只能接住外部调用的失败，接不住本合约内部的失败。", "外部调用，最多转发剩余 gas 的 64 分之 63。被调用方耗尽 gas，调用方还剩 64 分之 1 来收尾。", "这里有一个过时的习惯。transfer 和 send 只转发 2300 gas，曾经被当成防重入的手段。", "后来 gas 价格改过几次。接收方是合约钱包时，这种转账会直接失败。", "现在推荐的做法，是用 call 转账，再用 CEI 或重入锁来防重入。", "gas 规则还在变。Fusaka 和尚未上线的 Glamsterdam，都会打破固定 gas 够用的假设。", "编译器也在变。0.8 以前，算术默认不检查溢出，必须用 SafeMath。", "0.8.24 起，支持瞬态存储，可以做低成本的重入锁。跨链部署前，要确认目标链支持。", "把这一集放在一起看，就是一句话：每一次调用，都可能把控制权交给别人。", "交给了谁，用的是谁的存储，失败时谁回滚，都要自己看清楚。"]}, {"t": "今天能做什么", "at": 620.333, "lines": ["最后，每个人今天就能做一件事。", "写合约的人，搜一遍代码里的 tx.origin，确认没有一处拿它做权限判断。", "审计的人，找出每一处 delegatecall，问一句：目标地址由谁决定？", "做升级的人，不看工具，写出合约前三个存储槽的内容，再和工具对一遍。", "回到开头的问题。管理员没丢私钥，金库为什么认了攻击者？", "因为金库问错了问题。它问的是，这笔交易是谁发起的。它该问的是，谁在直接调用我。", "这个答案的前提，是权限只认直接调用者。至于对方是人还是合约，EIP-7702 之后，已经没法靠简单比较来判断。", "下一集讲重入，最古老、也最常复发的合约漏洞。"]}]}]}, {"name": "第二篇 · 合约代码层", "eps": [{"n": 4, "title": "重入攻击：在你记账之前再取一次钱", "dur": null, "segs": [{"t": "顺序写反了", "at": 0.0, "lines": ["2016 年 6 月，以太坊上的 The DAO，被提走了约 360 万 ETH。", "按事发时的价格，约 6000 万美元。", "合约没有被破解。", "它只是把两行代码的顺序，写反了。", "先猜一道题。", "一个银行合约，金库里有 10 个 ETH。你在里面的余额，是 1 个。", "你只调用一次取款函数，最多能取走多少？", "答案是，全部 10 个。", "前提有两个：银行先转账、后清零。而你，是一个合约。", "你每收到一笔钱，就在收款的那一刻，再调用一次取款。", "账本清零，要等到所有嵌套调用都返回之后。", "这就是重入。最古老，也最常复发的合约漏洞。", "这一集讲三件事：控制权在哪里交出去，重入有哪几种，怎样把顺序写对。"]}, {"t": "交出控制权", "at": 62.566, "lines": ["先给一句话的定义。", "合约在更新自己的账本之前，把控制权交给了外部地址。", "外部地址趁账本还是旧的，再次调用合约。", "严格来说，重入是一个函数还没执行完，就被外部调用再次进入。", "打个比方。你去银行取 100 元。", "柜员先把现金递给你，然后才去改账本。", "你接过现金的瞬间，同伴在旁边说：他要再取 100 元。", "柜员一查，账本上还是 100，于是又给了一次。", "只要柜员一直先给钱、后改账，你们就能一直取，直到金库见底。", "这个比方有一处不成立。现实里，柜员可以同时接待两个人。", "EVM 是单线程的。重入不是并发，而是嵌套。", "第二次取款，整个发生在第一次取款的中间。", "所以，重入的前提只有两个。", "第一，合约在函数中途发起外部调用，而被调用的一方，受攻击者控制。", "第二，外部调用发生的时候，合约的状态，还没有更新到最终值。", "哪些操作会交出控制权？一共有六类。", "用 call 转 ETH。接收方是合约时，会执行它的 receive，或者 fallback。", "调用代币的 transfer。代币如果是攻击者部署的，里面的代码可以是任意的。", "ERC-777 代币转账，会触发接收方的钩子。", "NFT 的安全转账和安全铸造，会回调接收方。", "闪电贷的回调，设计上就是把控制权交给借款人。", "还有，调用任何用户提供的地址，包括路由器、钩子和预言机。", "再补一个细节。同一份代码，换一条链，回调入口就不一样。", "在 TRON 上，用系统交易转 TRX，不会执行接收合约的 fallback。", "附带 callValue 去调用合约，才会执行。", "在 Mantle 上，ETH 以 ERC-20 的形式存在，转它不触发 receive。转原生币 MNT，才会触发。"]}, {"t": "四种重入", "at": 207.566, "lines": ["接下来，按调用栈，一种一种看。", "第一种，单函数重入。", "漏洞版的取款函数，分三步：读余额，转账，清零。", "攻击者调用取款。银行读到余额 1 个 ETH，用 call 把钱转过去。", "攻击合约的 receive 被触发。银行还有钱，它就再调用一次取款。", "第二层读到的余额，还是 1 个。因为第一层的清零，还没执行。", "一层套一层，直到金库余额不够，递归才停下来。", "然后各层依次返回，依次清零。这时钱已经没了。", "递归有上限。gas 和调用深度 1024，都会限制它。所以攻击者会每次取尽量大的金额，减少层数。", "第二种，跨函数重入。", "攻击者不回到取款函数，而是进入另一个共享同一份余额的函数，比如转账。", "取款加了重入锁，转账没加。攻击者还能利用回调吗？", "能。锁只拦截进入被锁函数的调用。", "在回调里，攻击者把还没清零的余额，转给同伙。外层返回之后，才清零。", "同一笔钱，既被提走了，又被转走了。", "2022 年 4 月的 Fei Rari，就是它的真实版本，损失约 8000 万美元。", "借款函数先用 call 发送 ETH，后写借款记录。", "攻击者在回调里，调用了没有被锁覆盖的退出市场函数，取回了全部抵押品。", "第三种，跨合约重入。", "协议由多个合约组成，比如金库合约和份额代币合约，它们共享状态。", "合约 A 的锁，挡不住对合约 B 的调用。B 此刻读到的，是 A 还没更新的状态。", "第四种，只读重入，最隐蔽。", "攻击者在回调里不修改目标合约，而是让第三方协议去读它。", "比如一个 AMM 池，移除流动性时，先转出代币，后更新总量。", "在回调的那一刻，储备已经减少，总量还没减少。", "这时借贷协议来读池子的价格函数，读到一个被扭曲的价格，再按它放贷或清算。", "池子自己的状态，最终是对的。出错的，是在中间时刻读数据的第三方。", "池子的 view 函数通常不加锁，所以重入锁挡不住。", "2023 年 2 月的 dForce，就是这样，损失约 360 万美元。", "它用 Curve 池在回调期间返回的虚拟价格，给抵押品定价。"]}, {"t": "CEI与锁", "at": 383.633, "lines": ["怎么防？首选，是 CEI 模式。", "CEI 是三个词：检查，修改状态，外部交互。函数按这个顺序写。", "取款函数只改一处：把清零，挪到转账之前。", "这样重入进来时，读到的余额是 0，require 直接回滚。", "交出控制权放在最后，此时账本已经一致。", "第二道防线，是重入锁。", "执行期间，再次进入任何一个加锁的函数，都会回滚。", "但锁有边界。它只保护加了锁的函数，不防只读重入，跨合约还要共享同一把锁。", "0.8.24 起，可以用瞬态存储做锁，gas 更低。", "但目标链必须支持 EIP-1153，部署前要确认。", "还有一种思路，叫拉取式支付。合约只记账，由收款人自己来取。", "合约不主动推送，代价是用户要多走一步。", "CEI 也有局限。复杂函数里，很难做到所有交互都在最后。", "所以要做纵深防御，分四条。", "一，把 CEI 当作默认写法。", "二，所有修改共享状态的外部入口，加同一把锁。", "三，不在 view 函数里给出中间状态的关键价格。必须给出，就提供锁状态查询。", "四，用不变量测试守住一件事：任何调用序列之后，合约余额都不少于用户余额之和。", "修复还要用代码验证。同一个攻击测试，在漏洞版上要能提走资金，在修复版上要回滚。", "只跑通修复版，无法证明测试真的覆盖了漏洞。", "最后，锁写对了，也不一定生效。", "2023 年 7 月，Curve 的一些池子，源码里写了重入锁。", "但 Vyper 编译器的三个版本，生成的锁不正确，不同函数用了不同的锁槽。", "攻击者对使用原生 ETH 的池子，发起跨函数重入。", "按多方公开复盘，损失约 7000 万美元。", "教训是，源码正确，不等于字节码正确。审计范围要包括编译器版本。"]}, {"t": "回调入口", "at": 533.333, "lines": ["重入的入口，不只是转 ETH。", "2020 年 4 月的 imBTC，是一种 ERC-777 代币。转账时，会回调持有人注册的钩子。", "借贷协议 Lendf.Me 的存款函数，返回时用旧值写回余额，抵押记录因此虚高。", "攻击者借走约 2500 万美元的资产，按事发时估值。据 The Block 报道，资金后来已归还。", "在 BNB Chain 上，很多项目分叉自以太坊协议。", "原协议只接受白名单代币。分叉项目放开成任意代币都能上架，却没给存款函数加锁。", "攻击者上架一个自己部署的代币，在转账函数里回调存款，同一笔资产被记了两次。", "允许任意代币，就等于允许任意回调。上架流程本身，就是安全边界。", "2024 年 9 月的 Penpie 也类似，损失约 2700 万美元。", "攻击者无许可创建市场，市场用了恶意代币。", "批量领取奖励的函数没有锁，攻击者在回调里存入资产，把存款变成了奖励。", "所以审计的第一步，是列出所有外部调用。代币转账、NFT 安全转账、回调、低级 call，一个都不漏。", "然后对每一处问两句。", "调用之前，相关状态都更新到最终值了吗？", "读写同一状态的入口，共用同一把锁吗？"]}, {"t": "今天能做什么", "at": 629.833, "lines": ["最后，每个人今天就能做一件事。", "写合约的人，找到第一个把控制权交出去的位置，问一句：那一刻，哪些状态还没更新？", "审计的人，查一下编译器版本有没有已知的锁 bug，再查部署链上转原生币，会不会触发 fallback。", "普通用户，存款前看协议有没有审计报告，范围是否覆盖你要用的合约。", "没有审计的新金库，只放能承受损失的金额。", "回到开头的问题。只调用一次取款，为什么能取走全部 10 个 ETH？", "因为银行先给钱、后记账。每一层嵌套调用，读到的都是同一个旧余额。", "这个答案的前提，是收款方能执行代码，而状态在交出控制权之前还没更新。", "把顺序写对，第二层读到的就是 0。", "下一集讲访问控制与权限：谁有权按这个按钮。"]}]}, {"n": 5, "title": "访问控制与权限：谁有权按这个按钮", "dur": null, "segs": [{"t": "没人初始化", "at": 0.0, "lines": ["2017 年 11 月，以太坊上发生了一件怪事。", "有个用户，调用了一个库合约的初始化函数。", "这个库，是 Parity 多签钱包共用的代码。", "部署之后，从来没有人初始化过它。", "于是，他成了这个库的 owner。", "接着，他调用了 kill，把库合约销毁了。", "依赖这个库的钱包，一下子失去了代码逻辑。", "约 51 万 ETH，就此冻结。", "他没有破解任何密码，也没有偷任何私钥。", "他只是调用了一个，没有权限检查的函数。", "这一集讲访问控制。", "每个按钮背后，都有同一个问题：谁有权按它？"]}, {"t": "门没装锁", "at": 50.133, "lines": ["合约里每一个修改状态的函数，都要回答一个问题：谁可以调用我？", "如果答案是任何人，就必须证明，任何人调用都安全。", "打个比方。合约像一栋写字楼。", "public 函数是大堂的门，谁都能进。", "onlyOwner 函数是机房的门，要刷卡。", "这个比方有一处不成立。写字楼可以换锁。", "合约如果不能升级，锁一旦装错，就永远是错的。", "谁会来试这些门？大致有五类。", "任意外部地址，恶意合约，被钓鱼的特权用户，拿到私钥的攻击者。", "还有内部人员，他们本来就合法持有权限。", "下面看六种常见缺陷。先看前三种。", "第一种，缺少权限检查。", "一个增发函数，对外公开，却没有修饰器。任何地址，都能给自己印币。", "修复是加上 onlyRole，只认持有 MINTER 角色的地址。", "老合约还有一个坑。Solidity 0.5 之前，函数默认是 public。", "忘写可见性，内部函数就暴露给了所有人。", "第二种，用 tx.origin 做鉴权。", "tx.origin，是最初签名的那个外部账户。", "管理员去领空投，调用了攻击者的合约。攻击者的合约，再来调用你的。", "这时 tx.origin 仍然是管理员。检查通过了。", "修复是改看 msg.sender，也就是直接调用者。中间的合约，冒充不了它。", "第三种，未保护的初始化函数。", "可升级合约和克隆合约，用 initialize 代替构造函数。", "如果它没人调用，或者能被重复调用，谁先调用，谁就是 owner。", "修复有两步。第一步，加上 initializer 修饰器，只允许执行一次。", "第二步，在实现合约的构造函数里，调用 disableInitializers，把实现合约本身锁死。", "开头的 Parity 库合约，缺的正是这一步。"]}, {"t": "借出的权限", "at": 192.133, "lines": ["其实，Parity 在同一年出过两次事。", "2017 年 7 月那次，钱包合约把不认识的调用，用 delegatecall 转给了库合约。", "库里的 initWallet 没有保护。攻击者通过钱包调用它，把自己设成了 owner。", "约 15.3 万 ETH 被转走，约合 3000 万美元。", "11 月那次不同。被接管的是库合约自己，然后它被销毁了。", "两次的教训相同：实现合约本身，也要初始化或者锁死。", "这就引出第四种缺陷：任意外部调用，和任意 delegatecall。", "一个合约公开了 execute 函数。目标地址和调用数据，全由调用者决定。", "假设这个合约，持有受害者对某个代币的授权。", "攻击者不需要受害者的私钥。", "他让这个合约去调用代币的 transferFrom，把受害者的币转给自己。", "代币合约看到的调用方，是被授权的合约。额度检查，通过。", "如果这里用的是 delegatecall，攻击者的代码，会直接改写这个合约的存储。", "权限没有被偷，是被借走了。", "第五种，单步所有权转移。", "owner 填入新地址，一步就生效。地址输错，权限就永久丢失。", "修复是两步转移。新 owner 必须自己调用 acceptOwnership，证明这个地址真的能用。", "第六种，签名鉴权写错。", "用签名代替 msg.sender 时，ecrecover 遇到无效签名，会返回零地址。", "如果被比较的签名人变量没有设置，它的默认值也是零。两边相等，检查就通过了。", "所以比对前，先排除零地址。", "最后，还有三个容易漏掉的判断。", "一，代码长度是零，不能证明对方是外部账户。构造函数里发起调用的合约，代码长度也是零。", "二，renounceOwnership 之后，owner 权限无法恢复。先确认没有函数还依赖它。", "三，Solidity 0.4 时期，构造函数和合约同名。合约一改名，旧构造函数就成了公共函数。"]}, {"t": "账户层权限", "at": 341.866, "lines": ["前面讲的，都是合约层的权限。账户本身，也有权限。", "以太坊的外部账户，只有一把私钥。", "TRON 不一样。按 TRON 官方文档和安全公司的公开资料，它的账户原生支持多重权限。", "Owner 权限最高，能修改其他权限，包括增删签名人。", "Active 管日常操作，比如转账、质押、调用合约。它可以有多个，每个可以限定操作类型。", "Witness 只管超级代表，也就是出块节点的相关操作。", "每个权限有一组地址，每个地址有权重。", "权重加起来达到阈值，操作才执行。", "这套设计，被骗子用来做多签诈骗。", "第一步，受害者在假钱包或钓鱼页上，泄露了私钥。", "第二步，攻击者修改账户权限，把 Owner 和 Active 都改成自己。", "第三步，受害者还能看到余额，但已经转不出来。", "转入不需要签名。新的 USDT，还会继续转进来。", "攻击者不急。账户看起来正常，他择机再全部转走。", "这种骗局，也常见于场外交易。", "骗子给你一个有余额、却转不出来的账户私钥，诱导你付手续费。", "对合约开发者，这里有一个含义。", "在 TRON 上，一个地址等于一把私钥，这个假设不成立。", "收到一个地址，不能假设它由单一私钥控制。设成 owner 之前，先查它的权限配置。"]}, {"t": "慢升级快暂停", "at": 446.999, "lines": ["知道了门怎么坏，再看钥匙怎么分。", "第一个原则，最小权限。把一个 owner 拆成几个角色，每个角色只做一件事。", "升级者，负责升级实现合约。建议多签加时间锁，延迟 48 小时以上。", "参数管理员，修改费率和抵押率。建议多签加时间锁，延迟 24 小时。", "这两个数字只是示例，不是标准。", "暂停者，负责紧急暂停。小型多签或监控机器人就够了，不加延迟。", "增发者，只授予特定的合约。", "为什么暂停要快，升级要慢？", "暂停只能止损，转不走资金。升级可以做任何事。", "第二个原则，多签加时间锁。", "提案者是一个多签，比如五个人里三人签名，才能把操作交给时间锁。", "时间锁让操作公开排队，比如 48 小时。到期之后，才能执行。", "排队期间，大家都看得到。用户不同意，可以在延迟期内撤出。", "守护者发现恶意操作，可以取消，但不能发起。权限是不对称的。", "这套设计也有局限。", "多签防的是单个私钥被盗。如果所有签名人看到的，是同一个被篡改的界面，多签就挡不住。", "阈值还要和私钥的独立性相匹配。", "2022 年 3 月的 Ronin 跨链桥，9 个验证者里，5 个签名就能放行。", "攻击者控制了 5 把私钥。按公开复盘，其中 4 把属于同一家机构。", "还有一把，来自一个早就不需要、却一直没撤销的授权。损失约 6.2 亿美元。", "同年 10 月，BNB Chain 的 Token Hub 出事。", "攻击者付了 100 BNB，注册成跨链中继者，再利用证明验证的缺陷，凭空铸造了 200 万 BNB。", "Moran 硬分叉把中继者改成了白名单。", "只要付押金就能当中继者，这本身就是一个权限决策。", "最后看 L2。谁能升级桥合约，谁就决定用户跨链资产的去向。", "根据 L2BEAT 截至 2026 年 11 月的页面，Mantle 的安全多签，14 人里 6 人签名，就能无延迟升级 L1 上的桥。", "这是信任假设，不是代码漏洞。但存钱之前，你应该知道它。"]}, {"t": "今天能做什么", "at": 606.899, "lines": ["最后，每个人今天就能做一件事。", "写合约的人，列出每个修改状态的外部函数，逐个写下：谁能调用，凭什么安全。", "审计的人，搜一遍 initialize 和 delegatecall。确认实现合约已锁死，目标地址不由用户决定。", "管私钥的人，列出所有特权私钥：谁持有，放在哪，阈值多少，上次撤销是什么时候。", "普通用户，存款前看一眼协议的管理员权限。管理员是单个地址，就是高风险信号。", "在 TRON 上，不导入别人给的私钥，也不签修改账户权限的交易。", "回到开头的问题。那个用户没破解任何东西，为什么能冻结约 51 万 ETH？", "因为库合约上有一个按钮，从来没有人回答过：谁有权按它？", "修复是部署时就在构造函数里锁死初始化。", "但这个答案的前提是，合约里别的按钮，也都回答过同一个问题。少一个，就还是一扇没装锁的门。", "下一集讲算术与精度：数字算错了。"]}]}, {"n": 6, "title": "算术与精度：差一个 wei，丢一个金库", "dur": null, "segs": [{"t": "一次只错一点点", "at": 0.0, "lines": ["2025 年 11 月，Balancer V2 的稳定池，被人取走了资金。", "官方复盘估算，用户资金被盗约 9480 万美元。", "根因，被定位在一处取整错误。", "单次交换的误差很小。", "攻击者把大量小额交换，串进一笔批量交换。", "每一步的误差，都朝对自己有利的方向累积。", "先猜一道题。金库里，每份额值 1.5 个最小资产单位。", "铸造 1 份额时，合约把应收的 1.5 向下取整，只收 1 个单位。", "重复 1000 次，调用者多拿了多少？", "大约 500 个单位。这些差额，来自其他持有人。", "EVM 只有整数。每一次除法，都会丢掉余数。", "丢掉的余数归谁，决定了谁能从协议里，慢慢抠出钱。", "这一集讲三件事：数学缺陷，舍入方向，金库通胀。"]}, {"t": "五类缺陷", "at": 66.066, "lines": ["合约里的数学缺陷，可以分成五类。", "溢出，截断，先除后乘，舍入方向，单位不一致。", "第一类，溢出。整数有上限，超过上限，结果会回绕。", "2018 年 4 月，以太坊上的 BEC 代币，栽在批量转账上。", "合约用 0.4 版的 Solidity 写成，没有溢出检查。", "函数先算总额：接收人数，乘以每人的金额。", "攻击者填了 2 个接收地址，每人 2 的 255 次方。", "2 乘以 2 的 255 次方，是 2 的 256 次方。", "它刚好超出 256 位整数的上限，回绕成了 0。", "余额检查比较的是 0，直接通过。发送者被扣掉的，也是 0。", "两个接收者，却各自收到 2 的 255 次方。", "代币凭空出现。按公开报道，多家交易所暂停了 BEC 充提。", "到了 0.8 版以后，算术默认检查溢出。", "但有三处，仍会静默回绕：unchecked 块，内联汇编，类型转换。", "移位运算也不检查溢出。", "第二类，截断。大类型转成小类型，高位被丢掉，不报错。", "第三类，先除后乘。看一组小数字：7 乘 3，除以 5。", "先除，7 除以 5 等于 1，余数丢掉。再乘 3，结果是 3。", "先乘，7 乘 3 等于 21，再除以 5，结果是 4。", "先除的结果少了 1。丢掉的误差，被后面的乘法放大了。", "所以要先乘后除。更好的做法，是用 mulDiv。", "它的中间结果有 512 位，不会溢出，并且能指定舍入方向。", "第四类舍入方向，下一段讲。先看第五类，单位不一致。", "同样叫 USDT，以太坊上是 6 位小数，TRON 上也是 6 位。", "BNB Chain 上的 BSC-USD，却是 18 位。", "把以太坊的代码原样搬过去，又写死了 6 位精度。", "USDT 金额，就会被放大 10 的 12 次方倍。", "规则只有一句：永远从合约读取 decimals，不要写死。", "跨链桥两端精度不同时，要显式换算，并处理换算后的余数。"]}, {"t": "舍入方向", "at": 225.146, "lines": ["整数除法会丢掉余数。问题是，余数归谁。", "规则只有一条：余数归协议，不归调用者。", "拿 ERC-4626 金库来看，四个函数，四个方向。", "deposit，用户给资产，拿份额。份额向下取整，少给。", "mint，用户指定份额，算要付多少资产。资产向上取整，多收。", "withdraw，用户指定资产，算要扣多少份额。份额向上取整，多扣。", "redeem，用户交出份额，拿资产。资产向下取整，少给。", "记成一句话：给出去的，向下；收进来的，向上。", "方向反了会怎样？攻击者可以做往返套利。", "反复 mint 1 份额，再 redeem，每次净赚 1 个单位的舍入误差。", "单次很小。但在没有手续费的场景下，可以循环上千次。", "打个比方。披萨店按块卖，一张披萨切 8 块。", "你付三分之一张的钱，店员要决定，给你 2 块还是 3 块。", "如果店员总往多了给，聪明的顾客，就反复买三分之一张。", "比方在这里不成立：披萨店会被投诉。", "合约里，多拿 1 wei 的操作，可以在一笔交易里重复几千次。", "回到 Balancer。按公开分析，问题出在稳定池的批量交换里。", "攻击者串联大量小额交换，让每一步的舍入，都朝自己累积。", "池子的不变量和份额价格，因此被操纵。", "官方估算的约 9480 万美元，按事发时估值，只算 Balancer 部署的池子。", "早期第三方分析的数字是约 1.28 亿美元。引用时要写明口径。", "再往前，2023 年 11 月，KyberSwap Elastic 也栽在方向上。", "一个本该向上取整的值，被写成了向下取整。", "池子误判价格没有跨过 tick，同一段流动性，被计算了两次。", "官方复盘称，受影响资产约 5620 万美元。", "教训是：单步测试里，误差可以忽略。", "在能批量，能循环的路径里，它会被放大。", "所以，要对同一操作重复 N 次，做模糊测试。"]}, {"t": "金库通胀", "at": 384.026, "lines": ["方向都写对了，金库就安全了吗？不一定。", "ERC-4626 的份额公式是：存入资产，乘以总份额，除以总资产。", "结果向下取整。这一步方向没错。", "麻烦在总资产。它通常直接读金库的代币余额。", "而余额，任何人都能通过直接转账来增加。", "看攻击怎么走。金库是空的。", "第一步，攻击者存入 1 wei，拿到 1 份额。", "第二步，攻击者不走存款函数，直接往金库转入 1 万 USDC。", "现在总份额只有 1，总资产是 1 万 USDC，再加 1 个最小单位。", "第三步，受害者存入 9999 USDC。", "他的份额，是 9999 USDC 乘以 1，除以略多于 1 万 USDC。", "结果小于 1，向下取整，是 0。", "受害者的资产进了金库，却一份也没拿到。", "第四步，攻击者赎回那 1 份额，取回约 19999 USDC。", "这 1 份额，代表了金库的全部资产。受害者的存款，等于捐给了它。", "攻击者通常会抢跑受害者的第一笔存款交易。", "攻击成本，就是捐赠额。受害者的存款接近捐赠额，攻击就有利可图。", "成立条件也要说清：金库必须几乎是空的。", "金库规模越大，攻击成本越高。", "换成披萨店：第一个顾客买下整张披萨，只切成 1 块。", "然后往盒子里偷偷塞进 100 张披萨。", "下一个顾客付了 99 张的钱，因为 1 块披萨值 101 张，他一块也分不到。"]}, {"t": "守住余数", "at": 501.26, "lines": ["怎么防？有四种做法。", "第一，虚拟份额加偏移。OpenZeppelin 从 4.9 版起提供。", "计算份额时，总份额加上 10 的偏移次方，总资产加上 1。", "攻击者想造成同样的损失，需要捐赠 10 的偏移次方倍的资金。", "第二，初始存款销毁。部署时先存入一笔，把份额发给死地址。", "这样金库永远不会是空的。", "Uniswap V2 也是这个思路：首次添加流动性时，永久锁定 1000 份 LP 代币。", "第三，内部记账。用状态变量记录总资产，不读余额。", "捐赠多少，都无法改变份额价格。", "第四，最小份额检查。份额是 0 就回滚，用户也可以设最少到账份额。", "这样受害者的交易会回滚，而不是换回 0 份额。", "修好了，怎么证明？要两个结果。", "漏洞版上，受害者损失资产。修复版上，攻击无利可图。", "最后一个案例，是另一种失误。", "2021 年 4 月，BNB Chain 上的 Uranium Finance，分叉自 Uniswap V2。", "按公开分析，开发者把手续费从百分之 0.3，改成了百分之 0.16。", "余额检查左边的放大系数，从 1000 改成了 1 万。", "右边那一处，仍是 1000 的平方，漏改了。", "左边被放大了 100 倍，右边没有。", "不变量 x 乘 y 不小于 k，退化成了不小于 k 的百分之一。", "攻击者只投入极少量代币，就换出了池子约百分之 99 的储备。", "按公开报道，损失约 5000 万美元。", "教训是：修改过的分叉代码，等于新代码。", "改过的常数，每一个使用位置，都要同步。"]}, {"t": "今天能做什么", "at": 627.66, "lines": ["最后，每个人今天就能做一件事。", "写合约的人，找出每一处除法，写下余数归谁。", "审计的人，逐个检查 unchecked 块，类型转换，内联汇编和移位。", "做测试的人，把同一操作重复 1000 次，看误差流向谁。", "普通用户，别当新金库的第一个存款人。", "存入后马上核对份额。是 0 或明显偏少，立刻停下。", "跨链转账时，核对同一代币在两条链上的精度。", "回到开头的问题。只错一点点的取整，怎么变成约 9480 万美元的损失？", "因为余数给错了人，而且这一步，能在一笔交易里重复很多次。", "反过来，只要余数始终归协议，重复多少次，也抠不出钱。", "下一集讲外部调用与代币兼容性。"]}]}, {"n": 7, "title": "外部调用与代币兼容性：对方未必按标准出牌", "dur": null, "segs": [{"t": "没收到的钱", "at": 0.0, "lines": ["2022 年 1 月，Qubit 跨链桥出了事。", "以太坊这一侧，没有收到对应的 ETH。", "BNB Chain 那一侧，却铸造出了代表 ETH 的 qXETH。", "公开报道的损失，约 8000 万美元。", "桥相信了一次外部调用的结果。", "先猜一道题。", "合约用低级 call，去调用一个没有代码的地址。", "call 返回 true，还是 false？", "答案是 true，而且返回数据是空的。", "EVM 不会因为目标没有代码，就让 call 失败。", "如果代码把成功加空返回，当成转账成功，", "它就会记下一笔，根本没有发生的转账。", "记住一句话：每一个外部调用，都是把命运交给别人。", "对方可能失败，可能撒谎，可能拖延，也可能根本不存在。"]}, {"t": "四个陷阱", "at": 60.233, "lines": ["低级调用，指 call，delegatecall 和 staticcall。", "它们失败时，不会自动回滚，只返回一个 false。", "打个比方。你让快递员送包裹，然后在登记簿上写：已送达。", "陷阱一，不检查返回值。快递员没回话，你就当作送到了。", "修复是接住返回的布尔值，不成功就回滚。", "陷阱二，目标没有代码。地址是一块荒地。", "快递员说送到了，因为荒地不会拒收。", "对无代码地址的 call，返回成功，返回数据是空的。", "修复是调用之前，检查目标地址的代码长度大于 0。", "陷阱三，返回数据炸弹。对方返回超大的数据。", "复制进内存，耗光 gas。修复是限制复制长度。", "陷阱四，gas 不足型失败。", "调用方故意给刚好不够的 gas，", "内部调用失败，外层却继续往下走。", "修复是检查剩余 gas。关键调用失败时，整体回滚。", "比喻在这里不成立：快递员一次只会出一种错。", "外部合约可以同时撒谎，回调，耗尽 gas。", "现在回到 Qubit。按 SlowMist 的公开分析，根因分五步。", "第一步，桥给原生 ETH 配的代币地址，是零地址。", "ETH 存款本该走 depositETH，它会核对随交易附带的 ETH。", "第二步，攻击者调用普通的 deposit，传入 ETH 的资源 ID。", "白名单检查通过。", "第三步，deposit 对零地址，执行 safeTransferFrom。", "第四步，零地址没有代码。低级调用返回成功，返回数据是空的。", "旧版的安全转账库，把空返回当作成功。", "这是为了兼容不返回值的 USDT。", "第五步，桥记下一笔 ETH 存款。BNB Chain 一侧，铸出大量 qXETH。", "攻击者拿它做抵押，借空了借贷池。", "每一步单独看，都说得通。", "漏洞来自组合：零地址，兼容性妥协，缺少原生币检查。", "白名单只告诉你，这个 ID 被允许。", "没告诉你，它对应什么资产。", "现在的 SafeERC20 遇到空返回，会检查目标有没有代码。"]}, {"t": "怪代币", "at": 223.899, "lines": ["第二类风险，来自代币本身。", "ERC-20 只规定了接口，没有规定行为。", "常见的非标准行为，有八种。", "一，transfer 不返回值，比如以太坊上的 USDT。用 SafeERC20 兼容。", "二，transfer 成功了，却返回 false。这是 TRON 上的 USDT。", "三，转账收税。到账的钱，比转出的少。", "四，余额自动变化，比如 stETH。缓存的余额会失效，要用份额记账。", "五，黑名单和冻结。", "六，可暂停。", "七，转账钩子，比如 ERC-777，会带来重入。", "八，可升级。行为以后可能改变。", "细看第二种。OpenZeppelin 在 2026 年，审计了 Across 协议的 TRON 部署。", "TRON 上的 USDT，转账成功时，也返回 false。", "于是，用 safeTransfer 推送 USDT 的代码，在 TRON 上一律回滚。", "存款走拉取方向的 transferFrom，不受影响。", "症状就是：存款正常，提款全部失败。", "修复是不读返回值，只看接收方的余额涨了多少。", "涨的正好等于金额，才算到账。", "这个方案假设不收手续费。而 Tether 保留了开启它的能力。", "再看第三种，收税代币。", "协议按参数记账：用户说存 100，账上就记 100。", "可代币扣了税，金库实际只收到 98。", "账面比实收多出 2 枚。这个差额，由其他用户承担。", "所有用户都这样存取，协议就会资不抵债。", "修复是按实收记账：转账前后，各读一次余额，只记增量。", "这一步要配合重入锁，防止回调干扰前后两次读数。", "没有一个库，能防住所有怪代币。", "审计时，先问项目方：你们支持哪些代币？", "不支持的类型，比如收税和变基，要显式拒绝。"]}, {"t": "一个卡住全部", "at": 371.766, "lines": ["外部调用的第三种后果，是拒绝服务。", "攻击者不偷钱，而是让合约的某个功能，长期用不了。", "再猜一道题。拍卖合约收到新出价时，把钱直接退给上一位出价者。", "上一位出价者是一个合约，它的 receive 函数总是回滚。", "新出价能成功吗？", "不能。退款失败，让整笔新出价回滚。", "它会一直占着最高出价者的位置。", "换成快递：100 个包裹，要按顺序送完。", "第 1 个被拒收，后面 99 个都送不出去。", "修复是拉取式支付。合约只记账，收款人自己来取。", "一个人拒收，只影响他自己。", "类似的毛病，还有几种。", "遍历所有用户发奖励。用户一多，就超过区块 gas 上限。", "改成分页，或者用累计奖励因子。", "批量分发 USDT，其中一个地址被冻结，整批失败。", "改成逐个捕获失败，记账，等对方来领。", "要求余额严格等于记录值。被人强制转入 1 wei，就再也对不上。", "改用大于等于。", "TRON 上，每次执行有 80 毫秒的 CPU 时间上限。", "以太坊上够用的循环，在 TRON 上可能超时。", "真实案例。2022 年 4 月，以太坊上的 Akutars NFT。", "它的推送退款，可以被一个拒收合约卡死。", "项目方提款的条件，又比较了错误的变量，永远不成立。", "超过 11539 个 ETH，被永久锁定。", "按 BlockSec 的分析，直接锁死资金的，是第二个缺陷。", "但第一个，同样是一个现成的 DoS 入口。"]}, {"t": "授权风险", "at": 495.033, "lines": ["最后一类风险，是授权。", "approve 允许另一个地址，代你转出代币。", "最后一道题。Alice 授权了 Bob 100 枚，现在想改成 50 枚。", "Bob 能抢先打包自己的交易。他最多能拿走多少？", "150 枚。他先花掉旧的 100 枚。", "等新额度生效，再花 50 枚。", "这叫 approve 竞态。", "缓解办法之一：先设成 0，看旧额度有没有被花掉，再设新值。", "之二：用 safeDecreaseAllowance 相对减少。额度已被抢先花掉，交易就回滚。", "forceApprove 只解决兼容问题，不解决竞态。", "比竞态更大的风险，是无限授权。", "协议一旦被攻破，攻击者能转走你钱包里全部的这种代币。", "即使你从没把它存进协议。", "钓鱼网站也盯着授权，诱导你签 approve，或者链下签名的 permit。", "最危险的组合，是任意调用加授权。", "路由合约持有用户的授权，", "又允许用户指定任意目标，和任意 calldata。", "攻击者就能让它，调用代币的 transferFrom，从受害者转给自己。", "2023 年 4 月，Sushi 的 RouteProcessor2。", "路由里的池子地址，由用户填写。", "攻击者填入自己的池子，在回调里，把任意授权过的用户设成付款人。", "回调校验只问：是不是刚才调用的地址？", "没有问：它是不是真实的池子？", "按公开分析，约 330 万美元被盗。", "规则是：持有授权的合约，必须禁止任意调用目标和任意 calldata。"]}, {"t": "今天能做什么", "at": 613.766, "lines": ["最后，每个人今天就能做一件事。", "写合约的人，检查每一个低级 call 的返回值，并确认目标有代码。", "接代币的人，按实收记账。部署到 TRON，单独处理 USDT 推送。", "审计的人，找出每个推送资金的循环，问：有人拒收会怎样？", "普通用户，只授权需要的数额，用完就撤销。", "收到陌生代币，不要去卖，也不要去领。", "在 TRON 上转 USDT，确认状态是成功，不只是已广播。", "回到开头。没有收到钱，桥为什么记下了一笔存款？", "因为它把成功加空返回，当成了到账，又没有问对方存不存在。", "外部调用的返回，只是对方的说法。", "要证明钱到了，就看余额的变化。前提是，你清楚这个代币会不会收税。", "对方未必按标准出牌，你的合约要自己核对。", "下一集讲预言机与闪电贷。"]}]}]}, {"name": "第三篇 · DeFi 与协议层", "eps": [{"n": 8, "title": "预言机与闪电贷：一笔交易就能改写的价格", "dur": null, "segs": [{"t": "新鲜的错价", "at": 0.0, "lines": ["2026 年 2 月 15 日，Base 链上的借贷协议 Moonwell，执行了一份治理提案。", "提案生效后，cbETH 的美元价格，只用了 cbETH 对 ETH 的汇率。", "它把一个汇率，当成了美元价格。", "一枚约 2200 美元的 cbETH，在合约眼里，只值约 1.12 美元。", "清算机器人立刻动手，清算了约 1096 枚 cbETH。", "按 The Block 的报道，协议留下约 178 万美元坏账。", "先猜一道题。", "这个价格大于 0，而且刚刚更新过。", "只检查正值和时效，能拦住它吗？", "不能。两项检查，都会通过。", "价格是新的，也是错的。", "合约读到的价格，可能被推高，可能停住，也可能配错。", "问题是，错的时候，哪一行代码来拦住它。"]}, {"t": "借来的本金", "at": 63.4, "lines": ["先说两个词。", "预言机，是把链外或别的合约里的数据，交给合约使用的机制。", "它交出的，通常是价格。", "闪电贷，是借款、使用、还款，都在同一笔交易里完成的贷款。", "交易结束时没有归还，整笔交易回滚，就像什么都没发生。", "所以出借方没有风险，也不需要抵押。", "这意味着，本金不再是门槛。", "任何人都能在一笔交易里，借到闪电贷池的全部流动性。", "打个比方。一家当铺，按隔壁菜市场的最新成交价，给黄金估价。", "你从朋友那里，借来 1 亿。", "在菜市场用离谱的高价，买下全部黄金。", "再拿 1 克黄金去当铺。", "当铺按刚才的成交价，估值 100 万，借给你 75 万。", "你把黄金卖回菜市场，把 1 亿还给朋友。", "你赚到 75 万，减去买卖的损耗。", "当铺手里，只剩 1 克普通价格的黄金。", "比喻在这里不成立：现实中，这几步要好几天。", "链上，它们发生在同一个区块的同一笔交易里。没有人来得及反应。", "那么，一笔交易里，攻击者能改变什么？", "他能把任何 AMM 池子的现货价，推到想要的位置，只要付得起滑点。", "他能直接往合约里转入资产，改变余额读数。", "他能把这些操作，和对目标协议的调用，任意组合。", "于是有一条规则：一笔交易内可变的读数，都是攻击者的输入参数。", "池子的储备比例，可变。按储备算出的 LP 代币价格，可变。", "合约的余额，可变。读余额算出的金库份额价格，可以被捐赠改变。", "时间加权平均价，当前区块很难撼动。链下聚合的价格，一笔交易改不动。", "但它们会过时，也会撞上上下限。"]}, {"t": "推高现货价", "at": 198.266, "lines": ["最常见的错误，是用 AMM 的现货价定价。", "恒定乘积池里，两种资产的数量相乘，保持不变。", "现货价，就是两边储备的比值。", "再猜一道题。这是示例，忽略手续费。", "池子里有 1000 个 ETH，和 200 万 USDC。现货价是 2000。", "有人用 400 万 USDC，买入 ETH。", "现货价会变成多少？", "大约 18000。USDC 储备变成 600 万，ETH 只剩约 333 个。", "价格涨到原来的 9 倍。只用了一笔交换。", "现在看一个借贷合约。", "它读取池子的储备，用两边的比值当价格。", "抵押品价值，等于数量乘这个价格。最多借出价值的百分之 75。这也是示例。", "把这几步串起来，是一笔交易里的五个动作。", "第一，借出闪电贷，在池子里买入代币，把现货价推高。", "第二，存入少量代币，作为抵押。", "第三，协议读取储备，按虚高的价格，借出大笔资金。", "第四，卖回代币。", "第五，归还闪电贷和手续费。", "交易结束，抵押品的真实价值，远低于借款。协议留下坏账。", "利润，是借出的金额，减去两次交换的滑点、手续费，和闪电贷费用。", "池子越浅，推高价格越便宜。长尾资产和低流动性代币，风险最高。", "这类事件，在公开报道里反复出现。", "2020 年 2 月的 bZx，是最早被广泛报道的闪电贷价格操纵之一，两次合计约 95 万美元。", "2021 年 5 月，BNB Chain 上的 PancakeBunny，按池子储备计算 LP 代币价值，损失约 4500 万美元。", "2021 年 10 月，Cream Finance 用金库份额价格，给抵押品估值。", "攻击者向金库捐赠，抬高份额价格。损失约 1.3 亿美元。", "三起事件，根因一样：价格来自一笔交易就能改写的数据。"]}, {"t": "三类价格源", "at": 345.7, "lines": ["换掉现货价，有三类选择。", "第一类，AMM 的时间加权平均价，简称 TWAP。", "它把一段时间里的价格，按时间加权求平均。", "一笔交易推高的价格，在平均里只占一小段，几乎不起作用。", "代价是，窗口越长，价格越滞后。", "而低流动性的池子，仍然可以被连续多个区块持续操纵。", "在 PoS 下，同一个提议者连续出块时，这种操纵会更便宜。", "2022 年 4 月的 Inverse Finance，就是这样。", "攻击者没有用闪电贷。他投入自有资金，持续推高浅池里的 INV 价格。", "同时用垃圾交易抑制套利，让 TWAP 输出虚高的价格。", "按公开报道，借走约 1560 万美元。", "TWAP 挡得住一笔交易，挡不住有资本的多区块操纵。", "第二类，链下聚合预言机，比如 Chainlink。", "价格在链下聚合，再写上链。一笔交易改不动它。", "它按心跳和偏离阈值更新。", "心跳，是价格不变时，也必须更新的最长间隔。", "它的风险换了方向：价格可能过时，可能撞上上下限，节点和喂价方也可能失效。", "第三类，多源组合。几个价格源互相比较，偏离超过阈值就暂停。", "它更稳，但实现复杂。几个源意见不一时听谁的，要提前想好。", "顺带一句，LP 代币也不能按储备乘现货价来定价。", "要用外部预言机的价格和不变量，反推出公平储备，再算 LP 的价值。", "没有完美的预言机。", "工程上要回答两个问题。", "价格错了，会怎样？价格停了，会怎样？"]}, {"t": "安全读价", "at": 471.766, "lines": ["选了链下预言机，读取时还要做四项检查。", "一，价格大于 0。", "二，时效：现在的时间减去更新时间，不超过这个喂价的心跳。", "三，上下限：价格落在合理的区间里。", "四，精度：从喂价读取小数位数，不要写死 8。", "为什么要查上下限？看一个案例。", "2022 年 5 月，LUNA 崩盘。", "公开报道称，Chainlink 的 LUNA 喂价，设了一个最低价：0.10 美元。", "市场价跌到远低于 0.10 美元，喂价停在下限附近。", "假设市场价是 0.01 美元。这是示例。", "喂价仍然返回约 0.10 美元。抵押品被高估约 10 倍。", "价格是正的，时间戳也可能是新的。前两项检查，全部通过。", "BNB Chain 上的 Venus，仍按约 0.1 美元给 LUNA 抵押品估值。", "有人在市场上低价买入 LUNA，存进去，借出别的资产。", "按公开报道，协议损失约 1100 万美元。", "还有四个读取陷阱。", "第一，不要用 latestAnswer 判断价格新不新鲜。", "Chainlink 的 API 文档写明，它不含时间戳。改用 latestRoundData。", "第二，每个喂价的心跳不同。不要给所有资产，用同一个延迟上限。", "第三，喂价失效时，要有降级路径。", "用 try catch 包住读取，切到备用价格源，或者暂停。不要让清算全部回滚。", "第四，拉取式预言机，由用户在交易里提交签名价格。", "提交者可以挑一个对自己有利的更新。", "按 Pyth 文档，合约要自己检查价格的时间戳和置信区间。", "在 L2 上，要多查一项：排序器是否在线。", "排序器宕机时，喂价交易上不了链，价格停在宕机前。", "恢复后的第一批区块里，清算机器人和普通用户同时涌入。", "能通过 L1 强制提交交易的少数人，占了先机。", "按 L2BEAT 截至 2026 年 11 月的页面，Mantle 排序器宕机时，从 L1 强制提交，最长要等 12 小时。", "做法是读取 Chainlink 提供的排序器在线状态喂价。", "恢复后设一段宽限期，比如 1 小时，这是示例。", "宽限期内，暂停清算和新借款。"]}, {"t": "今天能做什么", "at": 642.8, "lines": ["最后，每个人今天就能做一件事。", "写合约的人，列出所有价格来源，标出哪些在一笔交易内可变。", "用储备、余额、份额价格来定价的地方，全部换掉。", "审计的人，逐个检查预言机读取：正值、时效、上下限、精度。L2 上，加上排序器状态。", "再看低流动性抵押品，有没有供应上限，和更低的抵押率。", "普通用户，先看协议用什么价格源。依赖单一 DEX 现货价的，风险更高。", "用低流动性代币做抵押，保持更高的健康度。极端行情里，先降杠杆，不要等清算。", "回到开头。一个大于 0、刚刚更新的价格，为什么还会错？", "因为正值和时效，只证明价格存在，而且是新的。不证明它对。", "要拦住它，需要合理的上下限，或者和第二个价格源比较。", "预言机配置的变更，要和合约代码一样测试。上线前，用真实喂价核对美元价格。", "价格是合约看世界的窗口。先确认，窗外是真的，再按它放贷。", "下一集讲 MEV 与签名安全。"]}]}, {"n": 9, "title": "MEV 与签名安全：顺序可以被买，签名可以被重放", "dur": null, "segs": [{"t": "宽松的滑点", "at": 0.0, "lines": ["你在一个去中心化交易所，用 10 个 ETH 换 USDC。", "池子现价，1 个 ETH 换 2000 USDC。这是示例。", "你把滑点设成 5%。", "意思是，最少拿到 19000 USDC。少于这个数，交易就回滚。", "交易发出去，先进入公开的内存池，排队等着打包。", "有人在打包之前，读到了它。", "他把你的交易，夹在自己的两笔交易中间。", "先猜一道题。", "你最少收到多少？他能让你收到更少吗？", "你最少收到 19000。他不能让你更少。", "低于这个数，你的交易回滚，他也赚不到钱。", "所以，他会把价格推到刚好够 19000 的位置。", "你的交易没有失败。它只是按你允许的最差价格，成交了。", "滑点设 5%，就可能真的付 5%。", "交易在打包之前是公开的，顺序由别人决定。", "签名在用过之后仍然存在。能不能再用，取决于你签了什么。"]}, {"t": "被买走的顺序", "at": 77.3, "lines": ["先说一个词：MEV，最大可提取价值。", "它指的是，区块生产者或者搜索者，通过安排交易顺序、插入或排除交易，拿到的额外收益。", "搜索者，是专门寻找这类机会，把交易捆成一组提交的人或程序。", "搜索者把捆绑包交给区块构建者，构建者再把整个区块，卖给提议者。", "这叫提议者与构建者分离。结果是，排序权可以被购买。", "MEV 有三种形态。", "第一种，抢跑：攻击者排在你前面。", "比如一道谜题，第一个提交答案的人领奖。机器人复制你的答案，出更高的小费，先成交。", "第二种，三明治：攻击者先买，你再买，攻击者最后卖。", "他利用的，是你设定的滑点容忍度。", "第三种，尾随：攻击者排在你后面，吃掉你的交易留下的套利或清算机会。", "尾随通常没有直接的受害者。", "回到三明治，拆开看。", "你的交易进入公开内存池。", "搜索者发现它，捆成一包：自己买入，你的交易，自己卖出。", "构建者按这个顺序打包。", "搜索者先买，把价格推高。", "你按更坏的价格成交，刚好满足最小输出。", "搜索者再卖回去，赚走中间的利润。", "他最多能赚多少，由你的最小输出决定。滑点设得越宽，被夹得越狠。", "打个比方。你在拍卖会上举牌之前，大声说出了自己的最高出价。", "旁边的人抢先用低一点的价格买下，再加价转卖给你。", "比喻在这里不成立：拍卖会上，你能看到谁插了队。", "链上的三明治，和你的交易在同一个区块里。普通用户往往只看到，成交价比预期低。"]}, {"t": "防夹与排序", "at": 205.5, "lines": ["怎么防？分四层。", "用户这一层，把滑点设得合理。大额交易，走私有交易通道，比如 Flashbots Protect 一类的服务。", "交易不进公开内存池，搜索者在打包之前，就看不到它。", "前端这一层，默认滑点要保守，按池子的深度来计算。", "合约这一层，所有交换函数，都要接受最小输出和截止时间两个参数。", "常见的错误，是在合约内部，用现货价算出最小输出。", "那个现货价，在同一个区块里就能被推高。按它算出的保护，等于没有保护。", "更糟的写法，是把最小输出直接写成 0。", "这等于告诉所有人：我接受任何价格。金库、自动复投合约、清算合约，常犯这个错误。", "协议设计这一层，有两种做法。", "一是提交揭示：先提交答案的哈希，下一阶段再公开答案。", "这个承诺，必须绑定发送者的地址。不然，机器人复制你的承诺，也能完成揭示。", "二是批量拍卖：同一批订单，按统一价格清算。", "顺序由谁决定，每条链也不一样。", "BNB Chain，验证者轮流出块。2026 年 1 月，出块间隔缩短到 0.45 秒。", "抢跑的窗口更短，但它有公开内存池和构建者市场，三明治依然存在。", "TRON，27 个超级代表轮流出块。", "按 TRON 官方文档，它没有优先费，不能靠出更高的价格插队。", "但出块的人，仍然可以决定顺序。", "Mantle，只有一个中心化排序器。", "L2BEAT 列出的风险是：运营者可以抢跑用户交易，提取 MEV。", "没有公开内存池，不等于没有 MEV。", "它只是把排序权，从市场集中到一个运营者手里。"]}, {"t": "签名五字段", "at": 336.4, "lines": ["再看另一半：签名。", "很多操作不在链上发起，而是在链下签名，再交给合约验证。", "免 gas 授权 permit、元交易、订单簿挂单、跨链桥验证者签名、空投领取凭证，都是这样。", "问题是，一份签名，能被用几次？", "打个比方。你签了一张支付 100 元的支票。", "没写日期，没写收款银行，没写支票编号。", "拿到它的人，可以复印很多份，去每一家银行各兑一次。", "比喻在这里不完全成立：银行会自己记下兑过的支票。合约不会，除非代码让它记。", "一份安全的签名，要绑定五个字段。", "第一，nonce，一次性编号。缺了它，同一份签名可以在同一个合约反复提交。", "第二，链 ID。缺了它，签名在分叉链和多链部署上同样有效。", "第三，合约地址。缺了它，同一份代码部署两次，签名在两个合约都有效。", "第四，截止时间。缺了它，签名永久有效。你改主意以后，它照样能被使用。", "第五，函数意图，也就是类型哈希。缺了它，给 A 函数签的数据，会被拿去调用 B 函数。", "先猜一道题。", "一张领取凭证，绑定了 nonce，没有绑定链 ID。", "同一份合约，用相同的地址，部署在以太坊和 BNB Chain。", "凭证在以太坊用过之后，还能在 BNB Chain 领取吗？", "能。两条链上的 nonce 各自计数，BNB Chain 上还是 0。", "摘要里没有链 ID，两条链算出的摘要完全相同。", "解决办法是 EIP-712。", "它把名称、版本、链 ID、合约地址，合成一个域分隔符。", "再把消息的结构，合成类型哈希。", "用对 EIP-712，后四个字段一次解决。nonce 还要合约自己维护，每用一次，加一。"]}, {"t": "签名的陷阱", "at": 478.699, "lines": ["字段齐了，验签的代码，还有三个经典陷阱。", "第一，ecrecover 遇到无效签名，不会报错，而是返回零地址。", "如果管理员地址没有初始化，它默认就是零。任何一个无效签名，都能通过。", "第二，签名可塑性：同一条消息，存在两份都有效的签名。", "如果合约拿签名本身，标记已使用，翻转签名里的一个数值，就成了一份新签名。", "修复是，用 nonce 或消息哈希做标记，再用拒绝这种翻转的库，比如 OpenZeppelin 的 ECDSA。", "第三，编码碰撞。紧凑编码会把相邻的动态数据，直接拼在一起。", "ab 加 c，和 a 加 bc，结果完全相同。签多个动态类型时，用标准编码。", "还有一点。合约钱包没有私钥，要用 ERC-1271 的接口校验，不能只靠 ecrecover。", "再看 permit 的两面。", "一面是抢跑型的拒绝服务。你提交的交易里，带着 permit 签名。", "别人从内存池复制这份签名，抢先单独提交。你的交易因为 nonce 已用，回滚。", "修复是，把 permit 包在 try catch 里。失败后，检查授权额度是否已经足够。", "另一面是钓鱼。permit 在链下签，不花 gas，钱包常常只显示一串十六进制。", "签下之后，对方可以随时拿去执行。", "签名再安全，签名人也可能签错东西。", "2025 年 2 月，交易所 Bybit 的冷钱包多签被盗。", "按 Sygnia、Verichains 等公开分析，攻击者篡改了 Safe Wallet 的前端，只对 Bybit 的多签地址生效。", "签名人看到的，是一笔普通转账。", "实际签下的，是一次 delegatecall，把钱包的实现，换成恶意合约。", "多签合约只校验签名对不对、数量够不够。签名是真的，内容不是签名人以为的内容。", "按事发时估值，损失约 15 亿美元。", "多签防的是一把私钥被盗，防不了所有签名人，看到同一个假界面。", "2024 年 7 月，印度交易所 WazirX 的多签冷钱包，也是这样。", "界面上是日常交易，硬件钱包签下的，却是升级多签的恶意数据。按公开分析，损失约 2.3 亿美元。", "防御有三条。用硬件钱包逐个字段核对。用独立工具解码交易数据。", "对 delegatecall 和修改实现地址的操作，设白名单或额外审批。"]}, {"t": "今天能做什么", "at": 655.666, "lines": ["最后，每个人今天就能做一件事。", "写合约的人，检查每个交换函数：最小输出和截止时间，是不是由调用者传进来。", "所有签名，用 EIP-712，带上 nonce 和截止时间。", "审计的人，拿同一份签名提交第二次。第二次也成功，就是漏洞。", "修复要两个结果：修复前，重放成功；修复后，被拦下。", "普通用户，大额兑换设合理的滑点，不用自动的高滑点，可以走私有交易通道。", "签名前看清链 ID、合约地址、数额和期限。钱包只显示哈希，或者提示盲签，就不签。", "回到开头。滑点设 5%，为什么可能真的付 5%？", "因为交易在打包之前是公开的，滑点就是你公开的最差报价。", "这在交易走公开内存池时成立。走私有通道，搜索者在打包前看不到它。", "顺序可以被买，签名可以被重放。", "签之前看清内容，发之前想好，谁会先看到它。", "下一集讲可升级合约与代理。"]}]}, {"n": 10, "title": "可升级合约与代理：谁能换实现，谁就拥有全部资金", "dur": null, "segs": [{"t": "一次初始化", "at": 0.0, "lines": ["2022 年 8 月 1 日，跨链桥 Nomad 被提走约 1.9 亿美元，按事发时估值。", "起因，是此前的一次升级。", "这次升级调用了初始化函数，把可信的消息根，设成了全零。", "桥合约收到一条消息，先查它对应的根，再看这个根是否可信。", "先猜一道题。", "一条从没被证明过的消息，查到的根是什么？它能通过吗？", "它查到的是默认值，全零。", "而全零，刚刚被这次升级，标记成了可信。", "所以，任何消息都被视为已经证明。", "按 Immunefi 的复盘和 The Block 的报道，第一笔提款成功后，数百个地址复制了这笔交易，只换掉收款地址。", "升级的代码，可以没有错。", "错的，是升级时传进去的参数。", "能升级的合约，是怎么搭起来的？谁能换掉它的代码？"]}, {"t": "代理与实现", "at": 65.566, "lines": ["先给准确的说法。", "一个可升级合约，其实是两个合约。", "代理合约，保存数据和资金。用户的每次调用，都先到它这里。", "实现合约，只提供代码。", "代理用 delegatecall 把调用转给实现：借用实现的代码，读写的却是代理自己的存储。", "升级，就是让代理指向一个新的实现。", "数据和资金原地不动，只换代码。", "所以，谁能换实现，谁就拥有代理里的全部资金。", "打个比方。代理是一台售货机的机身，货和钱都在里面。", "实现是维修门后面的机芯，决定按下按钮以后，机器怎么动。", "升级，就是打开维修门，换一块新机芯。", "比喻在这里不成立：真实的机器换机芯要花时间。链上如果没有时间锁，换实现只要一笔交易。", "常见的代理有三种，区别在于，升级的开关放在哪里。", "第一种，透明代理。升级函数在代理里，由管理员调用。", "管理员调用代理时不转发，其他人的调用只转发，两边的函数就不会混淆。", "第二种，UUPS。代理只做转发，升级函数写在实现合约里。", "风险是，新实现如果忘了带上升级函数，这个合约就再也不能升级。", "第三种，信标代理。很多代理共用一个信标，信标里存着实现的地址。", "它适合大量相同的合约，比如每个用户一个金库。改一次信标，所有代理一起换。", "三种模式都依赖 delegatecall，所以都有同一个风险：存储冲突。"]}, {"t": "存储冲突", "at": 179.299, "lines": ["代理的存储，是一排编了号的格子，叫槽位。", "代码不认变量名，只认格子的编号。", "第一种冲突：代理自己的变量，和实现的变量，撞进同一个格子。", "一个朴素的代理，把实现地址放在 0 号槽位。", "实现合约的第一个变量是管理员，也在 0 号槽位。", "于是，写管理员，就是改写实现地址。", "修复是 EIP-1967。它用一个哈希算出的固定槽位，存放实现地址和管理员地址。", "这个位置远离普通变量。算法里还减去 1，让映射和数组的派生位置，碰不到它。", "第二种冲突：升级前后，变量的顺序变了。", "先猜一道题。", "旧版本里，0 号槽位是管理员，1 号是存款总额。", "新版本在最前面，插入了一个手续费变量。升级以后读管理员，读到的是什么？", "读到的是旧的存款总额，截掉一部分，被解释成一个地址。", "因为新代码把管理员挪到了 1 号，而 1 号里还是旧数据。", "后面每一格都错开一位。映射的基址变了，所有余额看上去都消失了。", "规则有四条。", "只在末尾追加变量。", "不删除，不重新排序，不改类型。", "父合约预留一段空槽位，或者用 ERC-7201 的命名空间存储。", "用工具比对新旧布局，比如 OpenZeppelin 的升级插件，或者 forge inspect。不要靠肉眼核对。", "还有一种撞车，不在存储里，而在函数选择器上。", "选择器是函数签名哈希的前 4 个字节。两个名字完全不同的函数，可能算出同一个选择器。", "代理自己有这个函数时，调用会被代理截下，不会转给实现。", "编译器只检查同一个合约内部的冲突。代理和实现之间，要在部署前用工具比对。", "透明代理靠管理员不转发、其他人只转发，绕开了这个问题。"]}, {"t": "初始化缺失", "at": 321.599, "lines": ["普通合约用构造函数设置主人。代理合约不行。", "构造函数只在实现合约自己的存储里运行，写不进代理。", "所以可升级合约用一个初始化函数代替，部署以后再调用一次。", "这一次调用，就是风险所在。", "第一种情况：部署代理和初始化，分成了两笔交易。", "中间有空隙，别人可以抢先初始化，成为主人。修复是在同一笔交易里完成。", "第二种：初始化函数可以重复调用，任何人都能重置主人。修复是加上只能调用一次的修饰器。", "第三种：代理初始化了，实现合约本身没有。", "代理的初始化，写在代理的存储里。实现合约自己的存储，还是空的。", "先猜一道题。别人能直接调用实现合约的初始化函数吗？", "能。他会成为实现合约的主人。", "如果实现合约里有 delegatecall 或者自毁的路径，所有指向它的代理，都可能失效。", "2021 年 9 月，OpenZeppelin 发布安全公告：它的 UUPS 实现，有几个版本存在这个问题，随后发布了修复版本。", "修复是在实现合约的构造函数里，禁用初始化。这样谁都不能再初始化它。", "回到开头的 Nomad。它的问题，出在升级时的初始化参数。", "合约用一张表，记录每个根什么时候被确认。升级把全零这个根，标记成了已确认。", "而没被证明过的消息，查到的根，默认也是全零。", "默认值和合法值，撞在了一起。", "教训有三条。初始化参数，和代码一样需要审计。", "零值不能带有业务含义，默认值必须和合法值区分开。", "升级以后要跑回归测试，覆盖这一条：未授权的消息必须被拒绝。"]}, {"t": "谁能换实现", "at": 451.766, "lines": ["谁能换实现，谁就拥有全部资金。", "所以升级权限，要按最高等级来保护。", "透明代理的权限，在代理的管理员槽位。UUPS 在实现合约的授权函数里。信标在信标的拥有者手里。", "无论在哪，都应该经过多签和时间锁。", "时间锁让升级先排队、再公开，给社区留出复核的时间。", "但时间锁有另一面。", "2021 年 9 月，Compound 第 62 号提案升级了奖励逻辑，里面有错误，部分用户可以超额领取 COMP。", "按 The Block 报道，最坏情况约 28 万枚，约 8000 万美元。", "协议没有能停止分发的紧急开关。任何修复，都要走约 7 天的治理流程。", "时间锁挡住了恶意升级，也挡住了紧急修复。", "所以暂停权和升级权要分开设计：暂停可以快，升级必须慢。", "再往下一层，链本身也可能被升级。", "比如 Mantle。按 L2BEAT 的页面，一个 14 人里 6 人签名的多签，无需延迟就能升级 L1 上的桥和门户合约。", "部署在 L2 上的协议，安全上限就是这条 L2 的升级权限。", "合约写得再好，资产也可能在 L1 那一端被转走。", "一次安全的升级，按这个顺序走。", "写新实现，只追加变量。用工具比对存储布局。", "在主网分叉环境里执行升级，跑全部回归测试。", "审计新实现，也审计升级交易本身，包括初始化参数。", "通过时间锁排队，公开升级内容。执行以后，立刻跑部署后验证。", "最后，留好回滚方案：新实现有问题时，能不能升级回旧实现？"]}, {"t": "今天能做什么", "at": 575.3, "lines": ["最后，每个人今天就能做一件事。", "写合约的人，在实现合约的构造函数里禁用初始化，把部署和初始化放进同一笔交易。", "审计的人，把新旧存储布局交给工具比对，再解码升级交易的初始化参数，看有没有零值。", "普通用户，存款前查一查：这个协议能不能升级，由谁升级，有没有时间锁。", "能无延迟升级的协议，等于你把资金交给了升级权限的持有人。", "同一个协议在不同的链上，升级权限要分别核对。", "回到开头。升级的代码没有错，为什么钱还是被提走了？", "因为升级换掉的不只是代码。初始化参数写进了存储，把全零变成了可信。", "这在默认值和合法值无法区分时成立。零值没有业务含义，这一步就拦得住。", "代理存着钱，实现给出规则。谁能换规则，谁就拥有这笔钱。", "下一集讲 DeFi 经济安全。"]}]}, {"n": 11, "title": "DeFi 经济安全：代码没错，规则错了", "dur": null, "segs": [{"t": "一个捐赠函数", "at": 0.0, "lines": ["2023 年 3 月 13 日，借贷协议 Euler Finance，损失约 1.97 亿美元，按事发时估值。", "入口，是一个捐赠函数。", "它让用户把自己的存款，捐给协议的储备。", "捐出去，账户的抵押品就少了。", "但这个函数，不检查账户是否仍然健康。", "先猜一道题。", "举个例子。一个账户有 100 美元抵押品，借了 90 美元。", "它捐出 30 美元抵押品，没人检查，也没人偿还。协议的缺口是多少？", "缺口是 20 美元。", "账户只剩 70 美元抵押品，却欠着 90 美元。", "这 20 美元成了坏账，最后由存款人或保险基金承担。", "每个函数单独看，都没有错。", "攻击者也没有利用代码 bug。他只是按规则操作，换了一种设计者没想到的组合。", "规则本身，怎么会让协议亏钱？"]}, {"t": "偿付不变量", "at": 68.533, "lines": ["先给准确的说法。", "借贷协议靠一条不变量运转：每个账户的抵押品，打折以后，要盖得住借款。", "打折的比例，叫清算阈值。", "抵押品价值乘以清算阈值，再除以借款，就是健康因子。", "健康因子大于 1，账户安全。小于 1，任何人都可以清算它。", "清算，是第三方替账户偿还债务，再以折扣拿走抵押品。", "折扣，是给清算人的报酬。", "回到 Euler。按 Omniscia 和 BlockSec 的复盘，捐赠以后，账户已经资不抵债。", "而 Euler 的清算折扣，会随资不抵债的程度变大。", "攻击者用另一个账户来清算它，以很大的折扣拿走抵押品。", "缺口越大，折扣越大。坏账，变成了利润。", "整个协议也有一条不变量：所有资产，要盖得住所有存款人的债权。", "盖不住的部分，就是坏账。", "坏账不一定来自攻击。", "价格暴跌，预言机延迟，清算来不及，都会留下坏账。", "清算人是逐利的。奖励覆盖不了 gas 和滑点，就没人清算。", "抵押品流动性不足，清算人拿到手，也卖不出好价钱。", "再看一个例子。2021 年 5 月，BNB Chain 上的 Venus，允许用户拿自己的治理代币 XVS 做抵押。", "按 The Block 报道，XVS 短时间里，从约 76 美元涨到约 144 美元。", "抵押能力跟着上涨，有人借走了大量 BTC 和 ETH。", "XVS 回落以后，清算金额约 2 亿美元以上，仍然留下约 9500 万美元以上的坏账。", "项目方称，价格可能被操纵。", "这叫反身性。价格上涨，借款增加，卖压增加，价格下跌，坏账出现。", "所以，低流动性的抵押品，要有供应上限和更低的抵押率。"]}, {"t": "借来的投票", "at": 203.2, "lines": ["规则被组合利用，不只发生在借贷里。", "治理攻击，是攻击者拿到足够的投票权，通过恶意提案，合法地转走协议资产。", "2022 年 4 月，以太坊上的 Beanstalk。", "它的投票权，按当前的存款计算。", "它另有一条紧急通道。", "按 CertiK 的分析，提案满 1 天，拿到三分之二的票，就能立刻执行。", "先猜一道题。", "闪电贷必须在同一笔交易里归还。用借来的代币，能通过提案吗？", "能。借款，存入，投票，执行，还款，全在同一笔交易里。", "闪电贷的归还限制，一步也没有挡住。", "攻击者提前一天，就提交了提案。", "获利口径各方不同。CertiK 称约 7600 万美元，Beanstalk 称约 7700 万美元，PeckShield 估约 8000 万美元。", "修复有两步。", "投票权用提案创建之前那个区块的快照。借来的代币，那时并不在你手里。", "提案通过以后，先过时间锁，再执行。中间留出守护者否决的机会。", "再加上法定人数，并锁定提案内容。内容一改，重新计时。", "奖励分发，也有同样的问题。", "如果奖励按存入那一刻的余额计算，就能用闪电贷存入，领奖，取出。", "修复是让奖励随时间累积，存入以后有最短锁定期。", "奖励的计算，不能读一笔交易里就能改变的数据，比如本区块的成交量，或者池子的价格。", "这几件事有个共同点。攻击者借来的，是规模。利用的，是时间。"]}, {"t": "发行方风险", "at": 321.666, "lines": ["另有一类风险，根本不在合约里。", "稳定币和代币化的现实资产，把链下资产带上了链。", "它们值多少，不看合约代码，看链下的储备，赎回，和发行方的权限。", "打个比方。稳定币像一张银行开的提货单。", "提货单印得再精美，只要仓库里的货不够，仓库被封，或者银行能随时作废它，它就不值一美元。", "比喻在这里不成立：作废提货单，要走法律程序。冻结或销毁一个地址上的代币，通常只要一笔交易。", "DeFi 协议拿它做抵押品，就继承了这些链下风险。", "风险分五类。第一类，储备与托管。", "2023 年 3 月，按 Circle 的声明，约 33 亿美元储备存在倒闭的硅谷银行。", "按 The Block 报道，USDC 最低跌到约 0.87 美元。以它为主要抵押的 DAI，也跌到约 0.90 美元。", "第二类，设计缺陷。2022 年 5 月，算法稳定币 Terra UST 挤兑，进入死亡螺旋，约 400 亿美元市值蒸发。", "第三类，铸币权限。", "2026 年 3 月，Resolv 被凭空铸出约 8000 万枚 USR。", "按 QuillAudits 和 CertiK 的分析，攻击者拿到了铸币密钥，合约也不核对铸币量和存入资产的比例。", "2026 年 5 月的 StablR，三个签名人里任意一人，就能批准铸币。拿下一个人，就拿下了全部。", "第四类，链下策略。2025 年 11 月，Stream Finance 的一名外部基金管理人，亏掉约 9300 万美元，提款随即冻结。", "第五类，定价来源。2025 年 10 月 10 日，USDe 只在 Binance 现货，跌到约 0.65 美元。", "链上和其他交易所，基本保持在约 0.90 美元以上。", "Binance 用自家订单簿给抵押品估值，触发了用户清算，之后赔付约 2.83 亿美元。", "风险会沿着抵押关系往下传。储备一出问题，所有拿它做抵押品的协议，同时受影响。"]}, {"t": "顺序规模时间", "at": 462.566, "lines": ["回头看这些事故，攻击者大多没有找到代码 bug。", "他们改变的，是三样东西：顺序，规模，时间。", "防御也按这三样来设计。", "先说顺序。任何会减少抵押品，或者增加债务的路径，都必须在结束时检查健康因子。", "新增一个函数，就要确认它走了这道检查。Euler 缺的，就是这一步。", "再说规模。低流动性抵押品要有供应上限，自家代币做抵押，要有额外限制。", "清算奖励在极端行情下也要有吸引力，清算折扣要有上限。", "铸币要有单笔和每日的累计限额，多人审批，异常时熔断。", "三个签名人里一人就够，等于只有一个签名人。", "抵押品估值，不能只看一家交易所的订单簿。", "最后是时间。投票权用历史快照，提案执行要过时间锁。", "提款和赎回，也可以设延迟。", "2025 年 2 月 Bybit 被盗以后，攻击者尝试赎回 cmETH。", "按 The Block 报道，mETH 协议有 8 小时的提款延迟。", "团队趁这段时间暂停了合约，追回 15000 枚 cmETH，约 4300 万美元。", "延迟把攻击者完成攻击的时间，从一笔交易拉长到几个小时，让监控和人工响应有机会介入。", "代价是，正常用户也要等。", "所以延迟是一种安全参数，不只是体验问题。"]}, {"t": "今天能做什么", "at": 565.866, "lines": ["最后，每个人今天就能做一件事。", "写协议的人，把偿付不变量写成一条公式，再用不变量测试去验证它。", "审计的人，列出每一个改变抵押品和债务的入口，逐个核对有没有健康检查。", "普通用户，收益来源说不清楚的产品，不要投入大额。", "稳定币也不是无风险资产。先查它的储备，赎回规则，和发行方的冻结权限。", "回到开头。每个函数都没有错，协议为什么损失约 1.97 亿美元？", "因为规则允许一条路径，减少抵押品，却不检查健康因子。", "这个答案成立的前提是，清算折扣会随缺口变大，缺口才能变成利润。", "代码没错，规则错了。规则的每一种组合，都要守住偿付不变量。", "下一集讲跨链桥安全。"]}]}, {"n": 12, "title": "跨链桥安全：两条链之间的那条缝", "dur": null, "segs": [{"t": "九个验证者", "at": 0.0, "lines": ["2022 年 3 月 23 日，Ronin 跨链桥被提走约 17.36 万枚 ETH，和约 2550 万枚 USDC。", "只用了两笔交易。", "这座桥有 9 个验证者。", "一笔提款，只要其中 5 个签名，就会放行。", "听上去，要攻破过半数的人。", "先猜一道题。", "9 个验证者里，有 4 个由同一家公司 Sky Mavis 运营。", "第 5 个签名，可以通过 Axie DAO 的一项授权拿到。这项授权，本应早就撤销。", "攻击者最少要攻破几个组织？", "答案是两个。", "门限写的是 9 个里要 5 个，独立的防线却只有两道。", "按 Ronin 复盘和 Elliptic 的分析，攻击者控制了这 5 个验证者的签名。", "公开报道的损失，约 6.2 亿美元。", "一座桥，凭什么相信另一条链上发生的事？"]}, {"t": "一条消息过河", "at": 65.533, "lines": ["先给准确的说法。", "跨链桥，是在两条链之间转移资产或消息的系统。", "B 链上的合约，要相信 A 链上发生了某件事。", "可 B 链看不到 A 链。它只能相信某种证明。", "最常见的做法，叫锁定和铸造。", "举个例子。用户在 A 链，把 100 USDT 存进桥合约，锁起来。", "桥合约发出一条存款事件，写着用户、金额和一个序号。", "中继者观察 A 链，等这笔交易足够确定，不会再被回滚。", "然后把消息和证明，一起送到 B 链。", "证明可以是一组签名，一条 Merkle 证明，或者一份零知识证明。", "B 链的桥合约验证证明，再检查这个序号没有用过。", "都通过了，才给用户铸造 100 枚映射 USDT。", "注意中间这一段。", "从 A 链到 B 链，是信任边界。B 链判断真假，只能靠这一步验证。", "验证要同时查三件事。", "证明是有效的。消息没有被处理过。消息来自正确的源链和源合约。", "打个比方。", "A 城的银行收下你的金条，开一张提货单。你拿着它，到 B 城银行兑换等值的金券。", "B 城银行看不到 A 城的账本，只能看提货单上的签章。", "印章被偷，或者核对方法有漏洞，B 城银行就会兑出不存在的金子。", "比喻不成立的地方是，两座银行的金库加起来，往往是整个系统里最大的一笔钱。", "所以跨链桥，是攻击者的首选目标。", "反过来走，销毁映射代币、解锁原来的资产，风险一样，金额往往更大。", "那么，B 链到底该相信谁？"]}, {"t": "四种验证方式", "at": 187.866, "lines": ["验证的方式，大致有四种。差别在于，你信任谁。", "第一种，外部多签，或者 MPC。", "一组验证者，凑够门限个签名，就放行。", "你信任的是这些签名人。风险是私钥泄露，验证者共谋，或者门限太低。", "Ronin 就是这一种。", "第二种，轻客户端，也叫原生证明。", "B 链上的合约，自己验证 A 链的区块头和证明。", "你信任的是 A 链的共识，加上这段证明验证代码。", "代码有漏洞，证明就能伪造。2022 年的 BNB Chain Token Hub，属于这一种。", "第三种，乐观证明。", "消息默认有效，但留出一段挑战期。这期间，任何人都可以提交欺诈证明推翻它。", "你只需要一个诚实的挑战者。风险是挑战期里没人盯着，或者挑战者被审查。", "多数乐观 Rollup 的原生桥，用的是这一种。", "第四种，零知识证明。", "用数学证明 A 链的状态变化是正确的，不用逐条核对账本。", "你信任的是数学，加上证明系统的实现和可信设置。电路或验证器写错，一样会出事。", "再猜一道题。一座 ZK 桥，证明系统完全正确，但桥合约可以被一个多签无延迟升级。", "用户只需要信任数学吗？", "不是。多签可以把桥合约换成新实现，绕过证明系统。", "用户同时信任证明系统，和升级权限的持有人。", "按 L2BEAT 截至 2026 年的页面，Mantle 用的是 OP Succinct 有效性证明。", "但它的输出预言机，可以由工程多签切换到乐观模式。桥合约可以由安全多签无延迟升级。", "L2 的原生桥，也是一座跨链桥。它的安全，取决于证明系统和升级权限两样。"]}, {"t": "根因与案例", "at": 320.766, "lines": ["跨链桥事故的根因，大致分四类。私钥，验证逻辑，初始化，存款伪造。", "第一类，私钥与运营。", "Ronin 那 5 把私钥里，4 把属于同一机构，1 把来自一项本应撤销的授权。", "公开报道称，私钥是通过社会工程拿到的。", "门限的意义，取决于签名人是否独立。4 把钥匙放在同一个地方，等于 1 把。", "第二类，验证逻辑。", "2022 年 10 月，BNB Chain 的 Token Hub，被一份伪造的 IAVL Merkle 证明骗过了校验。", "凭空铸出 200 万枚 BNB，约 5.7 亿美元。其中约 1 亿美元以上，被转到其他链。", "没有私钥被偷。被利用的，是证明验证代码。", "BSC 验证者约 3 小时后暂停了全链，再用 Moran 硬分叉修复了校验。", "2022 年 2 月的 Wormhole，Solana 一侧的合约，没有核对传进来的系统账户是不是真的。", "伪造的账户绕过了守护者的签名验证，铸出约 12 万枚 wETH，约 3.2 亿美元。", "2021 年 8 月的 Poly Network，跨链消息可以调用任意合约的函数。", "其中包括一个替换验证者公钥的特权函数。公钥被换掉，伪造的提款就能签出来。", "损失约 6.1 亿美元，后来攻击者归还了资产。", "所以，跨链消息的执行器，不能调用持有特权的合约。目标地址和函数，都要列白名单。", "第三类，初始化。2022 年 8 月，Nomad 升级时，把可信根设成了零值。", "结果任何消息，都被当作已经证明过。", "第四类，存款伪造。2022 年 1 月的 Qubit，对零地址调用转账函数，返回了成功，桥就记下了一笔不存在的 ETH 存款。", "另有一种情况，合约代码完全正确。", "2026 年 4 月 18 日，一条伪造的 LayerZero 消息，让 Ethereum 上的适配器放出约 11.65 万枚 rsETH，约 2.92 亿美元。", "这条路径只有一个验证者。LayerZero 称，攻击者控制了它依赖的两个 RPC 节点，让验证者看到假数据。", "桥只相信验证者，验证者只相信 RPC。没有第二个独立来源可以比对。", "责任仍有争议。LayerZero 称问题限于 KelpDAO 的配置，KelpDAO 称单个验证者来自默认设置。", "按 Chainalysis 的分析，KelpDAO 暂停合约，拦下了第二次约 4 万枚 rsETH 的伪造消息。", "按 The Block 报道，LayerZero 后来道歉，承认不应允许它的验证者单独验证高价值交易。", "合约没有错，桥一样会被掏空。验证者的数量和数据来源，都要有冗余。"]}, {"t": "防御清单", "at": 508.066, "lines": ["把这些根因倒过来，就是防御。", "先看验证者。门限要高于三分之二。", "签名人在组织、地域和基础设施上都要独立，并且定期核对签名权清单。", "再看消息。消息里要写明源链、源合约、目标链、目标合约和序号，目标侧逐项核对。", "处理过的消息要打上标记，防止重放。", "证明验证代码要有独立审计和测试向量。零值、空数组、没初始化的根，都不能当作有效证明。", "Merkle 树的叶子和中间节点，要用不同的哈希前缀。", "执行消息时，目标地址和函数走白名单，不许碰特权合约。", "然后是限额。单笔和单位时间的提款都有上限，超过就进延迟队列。", "监控两侧的总量。A 链锁定的，要不少于 B 链铸造的。对不上，就自动暂停。", "最后是升级。桥合约升级必须经过时间锁，初始化参数必须审计。", "同样的问题，也出现在交易所的充值系统里。", "交易所相信链上发生了一笔转账，然后在内部账本上记账。这也是一座桥。", "假币合约会发出同名的转账事件。所以要核对代币合约地址，不看名称和符号。", "在 TRON 上，转账失败的交易，比如能量不足，仍然会上链，也有交易哈希。", "只看交易存在就入账，就会出现假充值。要先确认回执状态是成功，再看事件。", "同一笔交易，用交易哈希加日志序号做幂等键，防止重复入账。", "入账前等够确认数，防止源链重组把这笔交易抹掉。"]}, {"t": "今天能做什么", "at": 627.866, "lines": ["每个人，今天能做一件事。", "写桥的人，把源链、目标链、两侧合约和序号，全部写进消息哈希。", "审计的人，列出签名人和运营商，算一算攻破几个独立组织，就能放行一条伪造消息。", "普通用户，跨链前先看这座桥靠什么验证。L2BEAT 会列出风险。", "只用官方入口。跨链后核对收到的代币合约地址，不要长期拿着映射代币。", "回到开头的问题。9 个验证者，最少要攻破几个组织？", "两个。门限是 9 个里要 5 个，可签名人并不独立。", "这个答案成立的前提，是那项本应撤销的授权仍在生效。", "跨链桥的安全，就看 B 链凭什么相信。证明机制被骗，桥上的钱就会被骗走。", "下一集讲非 EVM 生态的安全。"]}]}]}, {"name": "第四篇 · 非 EVM 与新范式", "eps": [{"n": 13, "title": "非 EVM 生态：换一种账户模型，换一组漏洞", "dur": null, "segs": [{"t": "没校验的账户", "at": 0.0, "lines": ["2022 年 2 月，Wormhole 跨链桥在 Solana 一侧，被铸出约 12 万枚 wETH。", "按事发时的价格，约 3.2 亿美元。", "攻击者往程序里，传了一个伪造的系统账户。", "程序读了这个账户，没有核对它是不是真的。", "守护者的签名验证，就这样被绕开。", "先猜一道题。", "在以太坊上，合约要读另一个合约，地址写在代码或存储里。", "在 Solana 上，程序要读的账户，由谁提供？", "先记住这个问题。", "按 Kudelski 和 Halborn 的分析，问题出在一个已经弃用的读取函数。", "它不检查传进来的系统账户，是不是真的系统账户。", "修复的办法，是改用带校验的函数。Jump Crypto 补足了全部 ETH。", "同样的错误，换一条链，就换了一副样子。", "每种链上的程序，到底在相信什么？"]}, {"t": "五个海关", "at": 67.199, "lines": ["先给准确的说法。", "执行模型，是一条链怎么存状态，怎么调用程序，怎么决定谁能改什么。", "漏洞的本质，在哪条链上都一样。", "程序相信了一个不该相信的输入。", "变的，是输入的样子。", "在 EVM 上，合约拥有自己的存储，攻击者换不掉它。输入是参数和外部调用。", "在 Solana 上，程序本身不存状态。账户全部由调用者传进来。", "在 Move 上，状态是带类型的对象。输入是对象，风险常在数学库和权限。", "在 Bitcoin 上，链只记录交易。铭文这类资产的余额，由链下的索引器解释。", "在 Cosmos 上，各条应用链用 IBC，验证对方链上的状态。", "打个比方。", "五个国家的海关，都要防走私。", "EVM 查行李，Solana 查护照，Move 给每件货物贴防伪芯片。", "Bitcoin 只查集装箱的封条，不管里面装什么。Cosmos 和邻国互认海关章。", "走私者在每个国家，都找最薄弱的那一环。", "比喻不成立的地方是，真实的跨生态集成里，同一笔资产会经过好几个国家。", "每多一种模型，就多一组需要专门知识的检查项。", "先看护照这一关，Solana。"]}, {"t": "账户就是输入", "at": 160.266, "lines": ["Solana 程序拿到的每一个账户，都是用户输入。", "第一件要查的，是 owner。这个账户，是不是归本程序所有。", "第二件，是签名。管理员操作，必须检查管理员账户签了名。", "第三件，是类型。两种账户结构相同，攻击者就能拿一种冒充另一种。要靠判别字段区分。", "第四件，是跨程序调用的目标。program id 由调用者传进来，就必须核对。", "第五件，是系统账户。要用带校验的读取方式。Wormhole 缺的就是这一件。", "更隐蔽的一种，是信任链没有终点。", "2022 年 3 月的 Cashio，存抵押品时，只检查了各个账户互相一致。", "铸币检查没有把 mint 字段，锚定到一个可信的根。", "攻击者伪造了整条账户链，用没有价值的代币，铸出约 20 亿枚 CASH。", "损失的估计，rekt.news 约 4800 万美元，CertiK 约 5280 万美元。", "账户之间再一致，也要有一端，落在硬编码的地址，或本程序的 PDA 上。", "PDA 要用规范的 bump。跨程序调用之后，要再次加载账户，不用内存里的旧数据。", "Anchor 框架的账户约束，能自动做完大部分检查。但约束是开发者写的，漏写一个，就等于没有。", "签名的有效期，也是一种输入。", "2026 年 4 月，按 Chainalysis 的分析，Drift 损失约 2.85 亿美元。", "它的安全委员会，五个人里两人签名就能放行。迁移到新配置后，时间锁为零。", "至少两名成员，签了自己没有完全理解的审批。", "Solana 的签名，本来约 1 分钟就会过期。持久 nonce 让这些签名长期有效。", "Chainalysis 也说明，这些描述来自 Drift 自己的调查，未经独立验证。", "管理操作要加时间锁，执行前再确认一次。"]}, {"t": "资源不等于安全", "at": 295.366, "lines": ["Move 的类型系统，保证代币对象不能被复制，也不能凭空丢掉。", "但它不保证数学正确，不保证权限正确，也不保证升级正确。", "2025 年 5 月 22 日，Sui 上的 Cetus 被攻击。", "按 Dedaub 和 Cyfrin 的分析，漏洞不在 Cetus 自己的业务代码，在它依赖的开源数学库。", "加流动性时，要把一个数左移 64 位。数学库先判断，这一步会不会溢出。", "判断用的比较常量写错了。本该拦住的值，被放了过去。", "在 Move 上，位移溢出，交易会中止吗？", "不会。位移溢出直接截断，交易照常执行。", "攻击者存入约 1 个代币，拿到巨量的流动性份额，提走池子资产，约 2.23 亿美元。", "Sui 验证者冻结了约 1.62 亿美元，治理投票后，转入共管多签，用于赔付。", "所以审计范围，必须覆盖数学依赖库。位移和乘法溢出，要有显式检查。", "语言的保证，也依赖验证器本身没写错。", "2023 年，Zellic 发现，Move 字节码验证器在处理超长函数时，漏掉了控制流边，两道安全检查被绕过。", "这个漏洞已修复，没有损失。", "协议层的风险，仍然在升级权限和部署流程。", "2025 年 9 月，Sui 上的 Nemo，开发者在审计后，私自部署了未审计的代码。", "一个内部的闪电贷函数被设成公开，升级权限只有单签。损失约 240 万到约 260 万美元。", "升级权限要用多签，加时间锁。部署的版本，必须等于审计的版本。"]}, {"t": "链下与跨链", "at": 412.533, "lines": ["Bitcoin 这一关，链只记录，链下软件来解释。", "铭文和 BRC-20 的余额，不由比特币共识决定，由链下索引器解释同一批交易。", "先猜一道题。同一个铭文代币，两家平台显示的余额不同。比特币共识能裁决谁对吗？", "不能。共识只验证交易本身，不解释铭文内容。", "按 Cointelegraph 报道，2023 到 2024 年，各平台的索引器版本不一致。Magic Eden 暂停交易，UniSat 警告存在双花风险。", "闪电网络的资金安全，依赖用户在截止时间前，把交易打包上链。", "2023 年 10 月披露的替换循环攻击，利用 mempool 的替换规则，把受害者的超时交易反复挤出去。", "四家主要实现在披露前已发布缓解，未见在野利用。", "BTC 跨链桥多靠多签或联盟。", "2026 年 9 月 6 日，Liquid 侧链上，被凭空铸出约 4000 枚 L-BTC，再通过正常提现换成真实 BTC，约 3.19 亿美元。", "Blockstream 称签名密钥没有泄露。联盟按软件给出的链状态，正常签了名。", "第三方重建的根因，是范围证明的验证缓存，可能把无效输出当作已验证。官方完整复盘尚未确认。", "门限签名只保证多数人同意，不保证被同意的状态是对的。储备要由独立的对账程序实时核对。", "Cosmos 这一关，各条链用轻客户端和 Merkle 证明，互认对方的状态。", "2022 年 10 月的 Dragonberry，ICS-23 接受了伪造的不存在证明，可以伪造 IBC 超时，掏空托管账户。这个漏洞协调修复，没有损失。", "状态机也必须是确定性的。", "2021 年 10 月的 Jackfruit，授权模块用节点本地时钟判断过期。不同节点算出不同结果，任何人都能让链停机。", "BeginBlock 和 EndBlock 里的 panic 或无界循环，也会让整条链停止出块。"]}, {"t": "接入一条新链", "at": 553.766, "lines": ["放到一个具体场景里。交易所要接入一条新链。", "照搬以太坊的接入逻辑，是假充值、错账和资金丢失的主要来源。", "接入的人，先问这几件事。", "失败的交易会不会上链，实际到账金额怎么读。", "代币由什么唯一标识，合约地址、mint 地址、对象类型，还是 denom。有没有同名假币。", "多少个区块之后不可回滚，历史上有没有停链。", "有没有两个独立运营的节点。现有的 HSM 和 MPC，支不支持这条链的签名算法。", "资产是否依赖链下索引器，用哪个版本，多个索引器的结果是否一致。", "链官方的 SDK 也是供应链。签名服务不要和业务代码共用依赖。", "普通用户，跨链前确认代币的唯一标识，不只看名称。在 Solana 上签名时，看到陌生程序，不签。", "回到开头的问题。Solana 程序要读的账户，由谁提供？", "由调用者在交易里传进来。所以程序必须自己核对每个账户的 owner、类型和地址。", "这个答案只对 Solana 成立。换一条链，输入换了样子。", "要问的仍是同一个问题，谁决定这个输入可信。", "换一种账户模型，就换一组漏洞。", "下一集讲 ZK 与证明系统的安全。"]}]}, {"n": 14, "title": "ZK 与证明系统：证明对了，电路错了", "dur": null, "segs": [{"t": "证明全都有效", "at": 0.0, "lines": ["2026 年 6 月，一个已经弃用的合约，Aztec Connect，被取走约 228 万美元。", "这是两名攻击者的合计，按事发时的估值。", "奇怪的是，每一个证明，都通过了验证。", "密码学没有失效。", "攻击者没有破解任何一道数学题。", "证明是一张数学凭据，它说，这一批交易算对了。", "合约检查了凭据，钱还是被取走。", "先猜一道题。", "证明全部有效，结算却少处理了一部分交易。", "只修验证器合约，能堵住这个洞吗？", "先记住这个问题。", "一套证明系统，有哪几个环节，每个环节会怎么坏？"]}, {"t": "阅卷机", "at": 51.766, "lines": ["先给准确的说法。", "零知识证明，是让验证者相信一个计算结果正确，不用自己重算，也看不到计算的秘密输入。", "要证明的计算，先写成一组数学约束，叫电路。", "满足全部约束的输入，才算正确。", "证明器在链下，按电路生成证明。", "验证器在链上，检查证明是不是满足这个电路。", "有些方案，开工前要先做一次可信设置，生成证明用的参数。", "最后，业务合约按证明里的公开输入，去结算。", "电路、设置、证明器、验证器、结算，任何一环都可能出错。", "打个比方。", "考试的阅卷机，只核对答题卡上的格子，是不是按规则涂满。", "如果出题人漏写了一条，第 5 题只能涂一个格子。", "考生把第 5 题的 4 个格子全涂上，阅卷机照样判对。", "阅卷机没坏，是规则漏了一条。", "比喻不成立的地方是，真实的电路有成千上万条约束。", "漏写一条，从外面看不出任何异常，只能靠审计、形式化验证和测试去找。", "所以记住一句话。", "验证器只检查证明是否满足电路，不检查电路是否写对。", "先看出题这一关，电路。"]}, {"t": "漏写一条", "at": 144.733, "lines": ["电路最常见的漏洞，叫约束不足。", "某个值被算出来了，却没有被约束。", "在 Circom 语言里，有一种写法只赋值，不约束。另一种写法，赋值的同时加上约束。", "只用了前一种写法的信号，恶意证明者可以填任何值。", "看一个玩具例子。账户余额是 20，有人要提款 25。", "电路要求，新余额拆成 5 个二进制位，每一位只能是 0 或 1。", "只去掉最高位的这一条，恶意证明者就把最高位填成 30。", "电路里的数，算到一个上限就绕回去。填 30 之后，等式照样成立。", "余额检查被绕过，提款 25 通过了验证。", "反过来，约束写得太严，叫过度约束。", "合法的输入也无法生成证明，结果是拒绝服务，资金可能被锁住。", "真实的例子在 2019 年。", "按 Trail of Bits 的介绍，Tornado Cash 用的一个哈希实现里，有一个输出只被赋值，没有被约束。", "攻击者本可以伪造 Merkle 根，取走别人的资金。", "团队发现后，抢先利用这个漏洞，把资金转走保护起来，再修复。", "没有资金被盗。", "同类问题很多。0xPARC 维护的公开漏洞清单里，收录了大量这样的例子。", "防御有三条。", "用静态分析工具，找出没有约束的信号。", "关键电路，做形式化验证。", "每条约束写正反两种测试，恶意的输入也要测。"]}, {"t": "规则之外", "at": 253.1, "lines": ["电路写对之后，仍有三个地方会坏。", "第一个，是可信设置。", "Groth16 这类方案，要先做一次设置，生成证明密钥和验证密钥。", "设置过程会产生秘密，俗称有毒废料。谁留着它，谁就能伪造任意证明。", "所以设置用多方仪式。每人贡献一部分，只要有一人诚实销毁自己那份，秘密就拼不回来。", "按 ECC 的公告，Zcash 早期方案的设置产物里，多出了一些证明者用不到的元素。", "拿到它们，就能把一个证明，改造成另一个陈述的有效证明，凭空增发 ZEC。", "团队在 2018 年内部发现，升级换掉参数，2019 年才公开。团队称没有发现被利用的证据。", "第二个，是证明器和 zkVM 本身。", "2025 年 1 月，Plonky2 的查找表用 0 填充，恶意证明者总能证明一个固定的等式。", "2025 年 7 月，ZKsync 的一个承诺漏掉了部分内部状态，无效的输入能伪装成有效。", "安全委员会紧急升级，暂停证明生产，没有损失。", "第三个，是验证器。", "证明里的数，都在一个有限域里，到了阶 r 就绕回 0。", "就像钟面，13 点和 1 点，指在同一个位置。", "验证器不检查公开输入小于 r，攻击者把 x 换成 x 加 r，证明照样有效。", "合约却把它当成一个新数。只能用一次的记录，就能再用一次。", "比喻不成立的地方是，钟面只有 12 格，有限域的阶是一个极大的数。", "snarkjs 生成的验证器，过去同时接受这两个值。", "所以验证器要校验全部公开输入都在域内，并跟踪上游的安全公告。"]}, {"t": "证明与结算", "at": 374.633, "lines": ["回到开头的 Aztec Connect。", "它已经弃用，管理员密钥已经放弃，合约里却仍然有钱。", "证明按 32 笔交易一组校验。", "L1 上的结算，只处理到一个字段写的笔数。", "这个字段，没有和证明绑定，由攻击者填写。", "攻击者把它设成 1。伪造的存款不被记账，证明仍然有效。", "按 rekt.news、SlowMist 和 Halborn 的分析，第一名攻击者取走约 219 万美元，第二名又取走约 8.8 万美元。", "安全研究者的结论是，问题在证明和结算之间的绑定。", "所以结算要用证明里的全部公开输入。数量、索引、长度，也必须被证明覆盖。", "已经弃用的合约，要么彻底停用，要么继续放在监控和赏金范围里。", "同样的问题，放大到整条 L2。", "欺诈证明的 Rollup，假设挑战期里至少有一个诚实的挑战者，提款要等几天。", "有效性证明的 Rollup，假设证明系统可靠、电路正确，提款通常几小时。", "两种证明系统，都能被运营方切换或暂停，链也能回滚。", "2024 年 8 月，OP Mainnet 的故障证明在审计中发现漏洞，守护者把它切回许可模式。", "2025 年 9 月，Starknet 的证明层发现状态不一致，拒绝出证明，链回滚约 1.5 小时。", "L2BEAT 的 Stages 框架，按去掉运营方之后剩下多少保障，给 L2 分级。", "Stage 越低，安全越依赖运营方和多签。"]}, {"t": "先查这几件", "at": 485.6, "lines": ["具体到每个角色，今天就能做的一件事。", "写电路的人，给每条约束，写一个恶意输入的测试。", "写结算合约的人，列出证明里的每个公开输入，看有没有字段只被读取，没有被证明。", "运营 L2 或桥的人，验证器和电路的升级要走时间锁，紧急权限要公开。", "普通用户，在 L2 上放大额资产前，先在 L2BEAT 上查它的 Stage。协议宣布弃用，及时取回资产。", "使用隐私或 ZK 协议前，确认它有公开的电路审计和赏金计划。", "回到开头的问题。只修验证器合约，能堵住这个洞吗？", "不能。验证器确认的，是证明对这些公开输入成立。", "漏洞在业务合约。结算几笔交易的边界，没有和证明绑定。", "这个答案的前提，是电路、设置和验证器都没有出错。任何一环出错，有效的证明也会说谎。", "证明对了，不等于电路对了，也不等于钱算对了。", "下一集讲账户抽象与新钱包的安全。"]}]}, {"n": 15, "title": "账户抽象与新钱包：账户变成了合约", "dur": null, "segs": [{"t": "服务关了", "at": 0.0, "lines": ["2026 年 10 月，一个以太坊热钱包出了事。", "攻击者控制了 Binance 的内部签名服务。", "他通过这个服务，给热钱包设置了一份 EIP-7702 委托。", "委托的目标，是攻击者自己的合约。", "随后，Binance 关闭了提现服务。", "先猜一道题。", "服务关了，这份委托会自动失效吗？", "先记住这个问题。", "在旧的模型里，签名的意思是，转这笔钱。", "现在，签名的意思变成，允许这段代码替我做事。", "签名的含义变大，签错一次的后果，也跟着变大。"]}, {"t": "授权书", "at": 47.733, "lines": ["先给准确的说法。", "账户抽象，是让合约代码来决定，账户怎么验证、怎么执行。", "协议不再写死，一把私钥签一笔交易。", "打个比方。", "以前去银行，每笔转账都要本人签字。", "现在你可以签一份授权书，允许助理每天替你付 100 元以内的账单。", "授权书让生活方便很多。", "可如果签的是，允许持有人处理我全部财产，后果比签错一笔转账严重得多。", "比喻不成立的地方是，纸质授权书要公证，也能去银行撤销。", "链上的委托签名立刻生效，有时在多条链上同时生效。", "新流程里有哪些角色？先看 ERC-4337。", "用户不直接发交易，而是提交一个用户操作，UserOperation。", "Bundler 是打包者，把很多个用户操作，打包成一笔链上交易。", "EntryPoint 是统一的入口合约，它先验证，再执行。", "第一步，问智能账户，签名对不对。", "第二步，问 Paymaster，愿不愿意替用户付 Gas。", "两步都通过，才执行用户要做的调用，最后结算 Gas。", "验证和执行，被拆成了两步。", "每一步的边界，都可能出错。"]}, {"t": "签名盖住什么", "at": 137.8, "lines": ["第一个边界，是用户的签名。", "用户签的，是用户操作的哈希。", "哈希怎么编码，决定了哪些字段受签名保护。", "2023 年 3 月，Alchemy 披露过一个打包漏洞。", "EntryPoint 的打包函数，直接读取动态字段的偏移量，没有检查。", "结果，同一个用户操作，能算出不同的哈希。", "不同的用户操作，也能算出同一个哈希。", "示例 Paymaster 的签名，签完以后，内容仍能被改。", "EntryPoint 已经修复，没有已知损失。", "第二个边界，是 Paymaster 自己的签名。", "这是另一套签名，也要覆盖链 ID、nonce 和有效期。", "少了任何一项，就可能被重放或抢跑。", "第三个边界，是账户自己的验证逻辑。", "验证只检查签名。", "验证写错了，执行的就是攻击者的调用。", "2024 年 3 月，Code4rena 审计了 Coinbase Smart Wallet。", "删除 owner 的操作，可以跨链重放。", "各条链上，同一个位置的 owner 可能不同。", "重放过去，可能删错人，甚至把账户永久锁死。", "修复后，改成传入 owner 地址，再核对。", "Biconomy 的审计里，智能账户的实现合约可以被销毁。", "它的会话密钥模块，只限制单笔额度，不限制累计。", "所以，哈希和签名要覆盖规范的编码和链 ID。", "多链账户的管理操作，要防重放。"]}, {"t": "地址上的委托", "at": 245.566, "lines": ["再看 EIP-7702，它在 2025 年 5 月，随 Pectra 升级上线。", "普通地址可以签一份授权，里面写三样东西。", "链 ID、委托合约的地址、nonce。", "签完，这个地址的代码，变成一个指针，指向那个合约。", "从此，这个地址执行的，是那个合约的代码。", "这就是委托，它是写在地址上的链上状态。", "风险有三层。", "第一层，委托给恶意合约，它的代码可以转走全部资产。", "第二层，链 ID 填 0，授权在所有支持它的 EVM 链上都有效。", "前提只是，那条链上这个地址的 nonce 对得上。", "链 ID 是 0 的授权，钱包应该默认拒绝。", "第三层最常见，委托合约是合法的，用户却签了一个批量执行。", "批量里的内容，是转走资产。", "2025 年 5 月，一名用户这样损失了约 14.6 万美元。", "2025 年 8 月，ScamSniffer 记录到两起同类钓鱼，约 100 万和 154 万美元。", "Wintermute 的统计显示，绝大部分委托，指向同一类复制来的扫币合约。", "它们专门扫走，私钥已经泄露的地址收到的 ETH。", "主要风险，不在恶意合约，而在对合法合约发出的恶意批量。", "钱包必须把批量里的每一步，逐项解码给用户看。", "开发者也有三个坑。", "委托时不运行初始化代码，攻击者可以抢先初始化。", "所以初始化数据，要由这个地址的私钥签名。", "换委托合约时，旧存储仍在，新合约会读到错的数据。", "要用命名空间存储，把两份数据隔开。", "交易发起者等于调用者，这个老检查，不再能证明对方是普通地址。", "EIP-7702 原文写明，应用不应该请求用户签署委托授权。", "网站请你升级成智能账户，默认拒绝。"]}, {"t": "范围与边界", "at": 383.7, "lines": ["账户变成合约，登录和授权的方式也变了。", "Passkey 用设备的安全芯片保存私钥，用指纹或面容解锁。", "它能挡住钓鱼网站偷密码，挡不住恶意前端和恶意浏览器扩展。", "你解锁以后，它们照样能请你签攻击者构造的操作。", "社交恢复，由几位守护人一起恢复账户。", "守护人不独立，或者账号被盗，恢复就成了入口。", "Session Key 是会话密钥，主密钥授权的一把临时密钥。", "它的范围要限定四件事：哪个合约、哪个函数、累计额度、有效期。", "2025 年 2 月，链游 Cardex 让所有用户，共用同一把会话密钥。", "这把密钥的私钥，就写在前端代码里。", "约 9000 个钱包受影响，损失约 40 万美元。", "权限只限于游戏合约，用户的代币和 NFT 没有受影响。", "范围限制起了作用。", "意图，是用户只说目标，由 Solver 去找成交路径。", "比如，用 1 ETH 换至少 3000 USDC。", "用户的风险，是条件写得太宽，最低成交量太低，期限拖得太久。", "协议的风险，在 Solver 和结算合约之间的信任。", "2023 年 2 月，CoW Swap 新加入了一个 Solver。", "它把结算合约里的 DAI，无限授权给一个有漏洞的合约。", "结算合约里约一周的手续费被取走，约 16.6 万美元。", "CoW DAO 罚没了这个 Solver 的保证金来赔偿。", "2025 年 3 月，一些第三方 Resolver，仍在用 1inch 已经弃用的 Fusion v1 结算合约。", "它们只凭调用者是结算合约，就信任转发来的数据。", "攻击者借此伪造订单，约 500 万美元，大部分经谈判退回。", "Permit2 是 Uniswap 部署的统一授权合约。", "只要你把某个代币无限授权给它，之后一个链下签名，就能转走这个代币。", "2024 年 10 月，一名 PEPE 持有者签了 Permit2 钓鱼签名，损失约 140 万美元。", "没有发现 Permit2 合约本身被攻破，风险来自无限授权加上链下签名。"]}, {"t": "先做这几件", "at": 535.6, "lines": ["按角色，各做一件事。", "写智能账户的，签名覆盖链 ID 和入口合约地址，管理操作防跨链重放。", "做钱包的，只委托给自己审计过的实现，批量逐项解码。", "写合约的，别再用交易发起者，判断对方是普通地址。", "托管方，不需要委托的热钱包，一律拒签这类授权，自有地址的代码一变，立刻告警。", "普通用户，网站请你升级成智能账户，拒绝，看不懂批量里的任何一步，不签。", "用完的会话密钥和 Permit2 旧授权，记得撤销。", "回到开头的问题，服务关了，委托不会自动失效。", "委托是写在地址上的链上状态，要靠一笔新的授权清零。", "那次事件里，约 3 小时 50 分后，委托才被清零。", "停掉链下服务，无法撤销链上的委托。", "账户变成了合约，签名就是在授权代码，签之前，先看清它允许什么。", "下一集讲共识层与链本身的安全。"]}]}]}, {"name": "第五篇 · 链与基础设施", "eps": [{"n": 16, "title": "共识层与链级安全：先问攻击者控制了什么", "dur": null, "segs": [{"t": "升级后第二天", "at": 0.0, "lines": ["2025 年 12 月 4 日，以太坊主网刚完成 Fusaka 升级。", "上线约 5 小时后，Prysm 客户端的一个 bug 在主网触发。", "全网投票参与率，跌到约 75%。", "18.5% 的 slot 没有出块。", "验证者少拿约 382 ETH 奖励。", "链一直在出块，参与率也仍然高于三分之二。", "先猜一道题。", "如果同样的 bug，出在占比超过三分之一的客户端上。", "只按 N 个区块入账的交易所，会看到什么？", "先记住这个问题。", "链本身出问题时，第一步不是看区块数。", "而是先问，攻击者或者故障，控制了什么。"]}, {"t": "先问控制了什么", "at": 52.133, "lines": ["先给准确的说法。", "共识，是网络里的节点，就哪条链是正确的，达成一致的机制。", "重组，是节点放弃已经接受的几个区块，改为接受另一条链。", "已经确认的交易，会在重组里消失。", "所以交易所说的已确认，只是对这条链安全假设的一个赌注。", "打个比方。", "一个城市的公证处，靠多数公证员签字，确认房产交易。", "如果有人临时雇来半数以上的公证员。", "他可以让一份盖过章的合同作废，再把同一套房卖给另一个人。", "这就是双花，同一笔资产被花两次。", "比喻不成立的地方是，现实里雇公证员要花很多年。", "在小算力的 PoW 链上，算力可以按小时租。", "很多人把所有共识攻击，都叫 51% 攻击。", "这会选错防线。", "更好的问法是，攻击者控制了什么。", "身份和连接、算力、单个区块的时机。", "权益或旧私钥、别人的动机，以及让链停下的份额。", "控制的资源不同，防线就不同。"]}, {"t": "算力与重组", "at": 132.433, "lines": ["先看算力。", "51% 攻击分四步。", "攻击者在交易所充值一大笔币，同时私下挖一条不包含这笔充值的链。", "交易所等够确认数入账，他把币卖掉，提走别的资产。", "然后他公开私下那条更长的链，网络发生重组。", "充值交易消失，币回到他手里，交易所账上多出一笔不存在的充值。", "再猜一道题。", "攻击者有 60% 算力，确认数从 6 提高到 600，成功概率降多少？", "答案是不降。", "算力超过一半，攻击者最终一定能追上。", "加确认数，只增加他租算力的时间和成本。", "所以小算力链的确认数，是一个经济问题。", "租算力的成本，必须高于能双花的金额。", "2019 年 1 月，Ethereum Classic 被深度重组和双花，约 110 万美元。", "Coinbase 发现后，暂停了 ETC 的收付。", "2020 年 8 月，它一个月内被攻击三次，第一次双花约 560 万美元。", "之后，Coinbase 把 ETC 的充值确认时间，提高到约两周。", "多数算力，也不一定要持续拥有。", "自私挖矿，是把挖到的块先扣住，再择机一次性释放。", "2025 年 9 月，Monero 出现史上最深的 18 块重组。", "矿池 Qubic 公开说用了自私挖矿。", "研究者认为，它的日均算力没有达到 51%。", "交易所要按租算力的成本和充值金额，定确认数，设单笔和单日上限。", "重组深度超过阈值，自动暂停这条链的充提。"]}, {"t": "检查点与客户端", "at": 247.9, "lines": ["再看以太坊这样的 PoS 链。", "它要求三分之二的质押投票，才能让一个检查点最终确定。", "最终确定以后，区块不能回滚，除非三分之一的质押被罚没。", "bug 让大量验证者掉线，链继续出块，但检查点不再最终确定。", "某个客户端占比超过三分之一，它的 bug 就能让最终性停下。", "超过三分之二，它的 bug 可能把错误的链最终确定。", "所以客户端多样性，也是共识安全的一部分。", "2023 年 5 月，Prysm 和 Teku 处理旧投票时负载过高。", "主网先后约 25 分钟和约 1 小时，没有最终确定。", "Lighthouse 没受影响，这次没有资金损失。", "按攻击者的质押份额看，有四条线。", "约 33%，能阻止最终性，代价是不活跃惩罚，逐步削减他的质押。", "约 34%，在能控制消息时序时，造成双重最终性，会被最大比例罚没。", "约 51%，能主导分叉选择，审查交易，做短程重组。", "约 66%，能在没有诚实方配合时，最终确定自己的链，只能靠社会层恢复。", "另一种攻击，用的是旧私钥。", "已经退出的验证者，取回了质押，不会再被罚没。", "攻击者买下他们的旧私钥，从很久以前分叉，改写一段历史。", "一直在线的节点不会接受，它不回滚已经最终确定的区块。", "刚安装的新节点，要从一个可信的近期检查点开始同步。", "这叫弱主观性，检查点的来源，就是新节点的信任入口。", "所以检查点要取自至少两个独立来源，再做比对。"]}, {"t": "停链与回滚", "at": 368.333, "lines": ["链也可能整条停下。", "活性，是链能继续处理新交易。", "安全性，是已经确认的结果不被推翻。", "2021 年 9 月，一次代币发行引来机器人交易洪泛。", "Solana 验证者内存溢出，全网停止出块约 17 小时。", "2022 年 10 月，BSC 上的跨链桥被伪造证明攻击。", "BNB Chain 要求验证者暂停出块，新版本冻结了攻击者地址。", "验证者少的链，可以在几小时内协调停链、冻结，甚至回滚。", "这能救急，也说明这条链的不可篡改，是有前提的。", "L2 的排序器，通常由一个运营方负责出块。", "它刚出的 unsafe 头，只是排序器的承诺，可以被回滚。", "2025 年 9 月，Starknet 升级后停链，并两次回滚。", "第二次回滚掉约 20 分钟的交易。", "如果交易所按 unsafe 头入账，用户随即提走，块又被回滚。", "这笔损失，由交易所承担。", "所以大额要等 L1 上最终确定的批次。", "排序器宕机时，用户可以通过 L1 合约，强制提交交易。", "最后一种资源，是别人的动机。", "2020 年 3 月的 Steem 事件，报道称 Huobi、Binance 和 Poloniex，用托管的客户 STEEM 投票。", "帮助 Justin Sun 控制了见证人席位，Huobi 承认动用了客户资金。", "交易所的托管资产，本身就是共识权力。", "客户资产默认不参与投票，例外要有书面授权。"]}, {"t": "按链定确认", "at": 479.0, "lines": ["按角色，各做一件事。", "交易所，每条链单独定入账条件。", "以太坊看 finalized 标签，PoW 小链按租算力的成本定确认数。", "区分两种状态，继续出块但不最终确定，和完全停止。", "最终性延迟或出块间隔超过阈值，自动暂停充提，恢复后逐笔对账。", "运营节点的，至少运行两种客户端，交叉核对。", "普通用户，交易所显示等待确认时，耐心等。", "链停摆时，不要反复提交交易，恢复后先查状态。", "回到开头的问题。", "同样的 bug 出在超过三分之一的客户端上，检查点不再最终确定。", "链照样出块，N 个区块的条件照样满足，系统继续入账。", "只有看 finalized 标签、监控最终性延迟的系统，才会停下。", "已确认只是一个赌注，先问攻击者控制了什么，再定防线。", "下一集讲节点、RPC 与验证者基础设施的安全。"]}]}, {"n": 17, "title": "节点、RPC 与验证者基础设施：你读到的是谁的链", "dur": null, "segs": [{"t": "只对你说谎", "at": 0.0, "lines": ["2026 年 4 月，LayerZero 给 KelpDAO 确认跨链消息的验证者，放行了一条消息。", "这条消息，在源链上根本不存在。", "验证者读链，靠的是两个 RPC 节点。", "攻击者控制了这两个节点，替换了节点程序。", "被替换的节点，只对验证者返回伪造数据。", "对别的 IP 来的查询，它返回真实数据。", "攻击者再用 DDoS，打掉没被攻破的外部 RPC。", "系统自动切换，切到了被污染的节点上。", "LayerZero 的声明写，损失约 2.9 亿美元。", "先猜一道题。", "监控系统也查询了这两个节点，结果一切正常。", "它能发现这次攻击吗？", "先记住这个问题。"]}, {"t": "你读的是谁的链", "at": 55.9, "lines": ["先给准确的说法。", "你的系统，从来没有直接读过链。", "它读的是某个节点、某个 RPC 服务、某个索引器，告诉它的链。", "数据从 P2P 网络进入节点，经过 RPC，再到索引器和你的系统。", "每一层，都可能给出错误的数据。", "第一层是节点客户端。", "2020 年 11 月，Infura 的节点运行旧版 Geth。", "它遇到一个上游已经修复的共识 bug，停在一条少数派分叉上。", "依赖它的 MetaMask 等服务，受到影响。", "Binance、Bithumb 等交易所，暂停了 ETH 和 ERC-20 提币。", "第二层是 RPC 服务，它会宕机、限流、返回过期数据。", "第三层是索引器，它会延迟，也会解释错。", "第四层是网络路由。", "BGP 劫持，是用错误的路由宣告，把别人的流量引到自己的服务器。", "2018 年，MyEtherWallet 的 DNS 被这样指向钓鱼站，损失约 15 万美元。", "2022 年，KLAYswap 的 SDK 下载域名被劫持，下发恶意脚本，损失约 190 万美元。", "同年，Celer cBridge 提供合约地址的子域被劫持，损失约 24 万美元。", "打个比方。", "你隔着一扇窗看车流，决定什么时候过马路。", "这扇窗可能是一块屏幕，屏幕可能延迟，也可能有人在播录像。", "比喻不成立的地方是，真实的马路，你可以换一扇窗再看一眼。", "很多系统只接了一个 RPC，从来没有第二扇窗。"]}, {"t": "节点被蒙住眼", "at": 167.5, "lines": ["前面是你问节点，节点答错。", "另一种情况，是节点自己看到的网络，被人操纵。", "节点之间直接交换区块和交易，这叫 P2P 网络。", "日蚀攻击，是攻击者占满受害节点的全部对等连接。", "节点只看到攻击者给的区块和交易。", "最关键的一步，在节点重启。", "重启时，节点会从地址表里挑选对等节点。", "地址表如果已经被攻击者填满，它连上的就全是攻击者。", "2018 年的一篇论文显示，两台主机、各一个 IP，就能日蚀一个以太坊节点。", "Geth 1.8.0 随后限制了同一网段的节点数。", "比特币加了锚点连接，重启时优先恢复上次的出站连接。", "被日蚀的节点，同步状态看起来正常。", "它有连接，也有新块，只是落后，或者在错误的分支上。", "对等节点数只说明有连接，不说明连接来自独立的运营方。", "节点崩溃，也可能是攻击的第一步。", "切换逻辑如果把流量转到不可信的备用节点，DoS 就成了数据污染的前置步骤。", "开头的事件正是这样。", "另一类事故，来自节点自己的配置。", "2018 年，一个团伙扫描暴露 JSON-RPC 的以太坊节点，盗走约 3.8 万个 ETH。", "Geth 默认只监听本机，接口是运营者自己打开的。", "RPC 接口只绑内网或本机，对外必须经过认证网关。", "给执行客户端下指令的 Engine API，只对共识客户端开放，并用 JWT 认证。"]}, {"t": "签名之前", "at": 282.066, "lines": ["验证者这一端，风险出在签名上。", "罚没，是 PoS 验证者违反协议，被扣除部分质押并强制退出。", "最常见的原因是双签。", "同一把密钥，对同一个位置，签了两个不同的消息。", "凌晨，运维看到主机 A 失去响应，就在备用机 B 上启动同一把密钥。", "其实 A 没有停，两台机器对同一个 slot 各签一票。", "网络检测到双签，验证者被罚没。", "公开的罚没事件，几乎都发生在故障切换或迁移时。", "2021 年 2 月，一家质押服务商重启出错，75 个验证者被罚没，约 18 ETH。", "2023 年 10 月和 2025 年 9 月，Lido 和 SSV 网络上，也各有一批验证者被罚没。", "防线在流程，迁移前导出防罚没数据，确认旧实例已经停止。", "再等待至少 2 个 epoch，并开启分身检测，作为最后一道防线。", "签名的另一个风险，是看不见就签。", "在 MEV-Boost 里，relay 托管构建者组装的完整区块，只给提议者区块头。", "提议者签名区块头，相信 relay 会发布完整区块并付款。", "2023 年 4 月，一个恶意提议者，签了一个无效的区块头。", "旧代码照样返回区块体，他拆开三明治机器人的交易包，获利约 2000 万美元。", "修复后，relay 先广播区块，再把区块交给提议者。", "relay 是可信中间人，验证者要评估自己用的 relay 和它的运营方。", "这个市场也很集中，2026 年 11 月的一个单日快照里，前两大构建者约占 74% 的区块。"]}, {"t": "多源不降级", "at": 398.033, "lines": ["回到开头的节点。", "它的关键，是按来源区别对待。", "你从别的 IP 去查，它就给你真数据。", "所以防线不是多看几次同一个节点，而是比对不同运营方的数据源。", "第一条，多源校验。", "充值扫描和跨链放行，至少用两个独立来源，比如自建节点加一家第三方 RPC。", "独立要按运营方算，同一家服务商的两个节点，只算一个。", "第二条，不降级。", "节点超时后，法定数不自动下降。", "达不到法定数就暂停，人工确认。", "开头的事件里，干净的 RPC 被打掉，系统自动切到剩下的节点，这就是降级。", "第三条，结果冲突就暂停入账，不挑一个先用。", "第四条，节点本身也要比对。", "链头要和不同网络、不同运营方的来源持续比对，对等连接也要来自不同网络。", "自建节点可以选少数派客户端，或者两种客户端互相比对，硬分叉前完成升级。", "这几条，对被替换的节点、被日蚀的节点、停在错误分叉上的节点，都有效。", "局限是，如果所有来源都接在同一个上游，数量再多也没用。"]}, {"t": "今天做一件事", "at": 485.933, "lines": ["按角色，各做一件事。", "交易所和跨链桥，列出每个资金决策读取的数据源，去掉重复的运营方，看剩下几个。", "节点运维，确认 RPC 和 Engine API 没有暴露在公网。", "验证者团队，把故障切换改成人工确认，原实例停止之后，才启动备用。", "普通用户，余额显示异常时，换一个 RPC 或区块浏览器交叉确认。", "自定义 RPC，只添加官方文档列出的地址。", "回到开头的问题。", "监控查询的是同一个节点，看到的是真实数据，它无法发现这次攻击。", "要发现它，需要拿验证者实际收到的结果，和不同运营方的数据源比对。", "这只在来源真正独立时成立。", "你读到的链，只是某个节点告诉你的链，先问几家独立的节点，再签名，再入账。", "下一集讲钱包与密钥管理的安全。"]}]}, {"n": 30, "title": "许可链安全：门禁挡住的只是外人", "dur": null, "segs": [{"t": "同一个哈希", "at": 0.0, "lines": ["一个联盟链网络，所有节点都由成员机构运营。", "每个参与者，都持有一张有效的证书。", "没有匿名的陌生人，也没有人能靠算力闯进来。", "可就在这样的网络里，账本分叉了。", "Hyperledger Fabric 公布过这样一个漏洞。", "攻击者能把一个区块里的交易，重新组合。", "区块哈希没有变。", "可是不同的节点，从同一个区块里，解析出了不同的交易。", "收到不同版本的节点，各自写入世界状态，两份账本从此对不上。", "修复的方向是，让哈希的编码没有歧义，同一串字节，只能读出同一组交易。", "这里没有人偷到私钥，也没有人攻破共识。", "门禁再严，挡住的也只是外人。", "那么，一个只让熟人进门的区块链，风险到底在哪里？", "谁能写，谁能看，谁能改规则？", "我们从一栋刷卡进门的写字楼说起。"]}, {"t": "刷卡写字楼", "at": 68.933, "lines": ["先给一句准确的说法。", "许可链，只让获得授权的参与者，读写或出块。", "由多家组织共同治理的许可链，叫联盟链。", "它把谁能参与，从密码学和经济的问题，变成了身份和治理的问题。", "攻击者不再需要多数算力。", "一张有效证书，一把管理员密钥，或者几家成员共谋，就够了。", "打个比方，公链像公共广场，谁都能进，靠规则和押金维持秩序。", "许可链像一栋写字楼，进门要刷工牌。", "陌生人大多进不来，可发工牌的前台，拿着万能钥匙的物业，成了最值得攻击的人。", "这个比方有一处不成立。", "写字楼失窃，可以调监控，可以报警。", "联盟链里，多数成员可以合法地重写业务状态。", "账本本身，看不出这是作恶。", "按攻击者控制的资源，排一排入口。", "一张普通成员证书，能读通道数据，发送畸形请求。", "组织管理员的证书，能改本组织的配置，批准链码。", "根 CA 的私钥，能签发任意身份。", "足够多的背书组织，能写入符合策略的任意状态。", "所以不要把成员都是持牌机构，当成安全假设。", "Ronin 桥有 9 个验证者，5 个签名就能放行，攻击者控制了验证者，提走了资金。", "许可的集合小，攻破的门槛也低。"]}, {"t": "背书与排序", "at": 171.366, "lines": ["先看 Hyperledger Fabric。", "它的一笔交易，要过三道关，执行，排序，验证。", "第一关，几家组织的背书节点，模拟执行链码，签下读写集。", "第二关，排序服务只决定顺序，不判断业务对不对。", "第三关，记账节点不重新执行，只核对背书策略和读集的版本。", "被拒绝的交易仍然留在区块里，只是标成无效。", "背书策略规定，一笔交易需要哪些组织签名。", "默认要求通道成员的多数。", "要是写成任一组织都行，就等于让一家成员单独决定写入。", "排序服务也要按威胁来选。", "Raft 是崩溃容错，5 个节点能容忍 2 个宕机，却不防恶意节点。", "一家运营方的排序节点被攻破，它伪造不了背书，却能决定顺序，延迟或丢弃交易。", "成员之间互不信任，就选 BFT，并把节点分给不同的运营方。", "再看隐私。", "私有数据集合，只把原文发给部分组织，账本上只留哈希。", "假设集合里存着客户等级，一共只有三档。", "圈外的组织，算出三个哈希一比，就知道了。", "所以低熵的数据要加随机盐，输入走 transient 字段，不放进普通参数。", "链码本身也必须确定。", "读本地时间或随机数，各个节点算出的结果不同，交易就过不了背书。"]}, {"t": "治理与密钥", "at": 275.033, "lines": ["许可链最大的风险，常常在流程里。", "第一处，根 CA。", "根私钥放在在线服务器上，一旦被攻破，攻击者就能签发任意身份。", "控制是根 CA 离线，私钥放进 HSM，日常签发交给中间 CA。", "节点和管理员的私钥，也放进 HSM 或 KMS。", "身份 CA 和 TLS CA，也要分开。", "第二处，管理员集中。", "一家技术服务商，替好几家组织拿着管理员证书。", "它一出事，好几家就同时失守。", "控制是各家自持密钥，服务商只拿受限的运维权限。", "第三处，配置更新和成员退出。", "改通道策略或成员名单，要多家组织签名，变更留痕。", "成员退出时，要吊销证书，修改策略，再评估它手里已经拿到的数据。", "Fabric 文档提醒，成员身份不会自动过期，只能吊销。", "所以吊销流程，要提前演练。", "第四处，成员共谋。", "达到背书门槛的几家成员，可以写入虚假的业务状态。", "对策是外部锚定，定期把账本摘要写到公链，或者交给第三方保存。", "它能证明历史没被改写，却不能证明数据本身是真的。", "最后，所有节点放在同一个云账户里，也是单点，要分账户，分地域，分运营方。"]}, {"t": "公证人与验证者", "at": 377.366, "lines": ["换两种框架，单点换了位置。", "Corda 不广播交易，数据只发给需要知道的参与方。", "防止同一个状态被花两次，靠的是公证人。", "非验证型公证人只看输入引用，看不到完整交易，隐私更好。", "可如果整个网络只有一个公证人，运营方作恶，就能给同一个状态签两次，造成双花。", "防御是改成集群，分给不同的运营方。", "节点之间协商时，对方发来的数据，要先校验，再使用。", "合约代码作为附件随交易分发，always-accept 这种约束只用于测试，生产环境不能用。", "再看 Besu。", "2026 年 9 月，Besu 公布了一项 QBFT 漏洞。", "启用 Shanghai 及之后的分叉，一名拜占庭验证者，能注入未经授权的提款。", "诚实的验证者照常执行，照常确定，原生币凭空多了出来。", "4 个验证者，按规范只容忍 1 个作恶。", "可这一次，诚实节点的验证规则本身缺了一项，一名验证者就够了。", "合同能让你事后追责，却拦不住状态被写错。", "同一时期的另一项公告里，能连上足够多验证者端口的节点，用大体积提案，就能阻止网络最终确定。", "所以 P2P 监听也是攻击面，要在网络层限制谁能连到验证者。", "Besu 的本地准入规则只管本节点，每个成员都要配置，并且核对一致。", "还有一种风险，没有漏洞也会发生。", "GoQuorum 的仓库已经归档，Tessera 已经弃用。", "还在用它们的网络，从此没有上游的安全修复。", "依赖这些功能的网络，只能自己维护，或者尽快迁移。"]}, {"t": "三个问题", "at": 496.866, "lines": ["最后，今天就能做的事。", "运营联盟链的人，写下每项安全假设依赖哪几家组织，不要只写成员可信。", "写链码的人，查一遍本地时间和随机数，再给低熵的私有数据加盐。", "选框架的人，先核对它还有没有人维护。", "作为用户，听到上链了，不可篡改，先问三个问题。", "谁能写，谁能看，谁能改规则。", "你的个人数据写进联盟链之前，问清怎么删除，怎么更正。", "业务伙伴的联盟链，不等于公开可查，请对方拿出公链锚定或审计报告。", "回到开头的问题。", "只让熟人进门的区块链，风险在门里面。", "在发证书的人，拿管理员密钥的人，达到门槛的几家成员，还有没人维护的软件上。", "门禁只回答了谁能进来，安全还取决于进来的人能做什么，规则本身有没有写对。", "这个答案成立的前提，是把每一个单点写下来，分给不同的组织，并且定期演练。", "许可链没有消灭信任，只是把信任交给了具体的机构和人。", "这个系列就到这里。"]}]}]}, {"name": "第六篇 · 钱包、用户与运营", "eps": [{"n": 18, "title": "钱包与密钥管理：钥匙放在哪里", "dur": null, "segs": [{"t": "钥匙都在", "at": 0.0, "lines": ["2024 年 7 月，交易所 WazirX 的多签冷钱包，损失约 2.3 亿美元。", "冷钱包放的是大部分资产，多签就是为了不让一把钥匙说了算。", "这个钱包有六把钥匙，转账要其中四把签名。", "公开材料没有说，任何一把私钥被导出。", "签名人按流程，一个一个签了名。", "攻击者没有偷走钥匙，却让这些钥匙替他签了字。", "钥匙都在，钱没了。", "多数大额事故，都不是私钥被数学破解。", "先猜一道题。", "六把私钥都存在硬件钱包里，一把也没有泄露。", "攻击者能转走多签里的资金吗？", "先记住这个问题。"]}, {"t": "五种放法", "at": 51.0, "lines": ["先给准确的说法。", "私钥是一个 256 位的随机数，用来给交易签名。", "谁能让私钥签一笔交易，谁就拥有这笔资产。", "助记词是 12 或 24 个单词，可以推导出一组私钥。", "放私钥的方法，常见的有五种。", "第一种，助记词软件钱包，私钥在手机、电脑或浏览器扩展里。", "设备被攻破，钱就没了。", "第二种，硬件钱包，私钥在一块独立芯片里，不离开设备。", "它只负责签名，签之前，人要看清签的是什么。", "第三种，多签，比如 Safe，几个独立私钥加一个链上合约。", "签名数达到门槛，交易才执行。", "第四种，MPC 门限签名，私钥被切成几个分片。", "几方各自计算，合成一个普通签名，完整私钥从不出现。", "第五种，HSM，私钥锁在专用硬件里，不能导出。", "它只按指令签名，不判断指令对不对。", "签名人看不懂签的内容就签，叫盲签。", "软件钱包和 HSM，盲签风险最高。", "多签的门槛写在链上，谁都能查，MPC 在链上只是一个普通地址。", "打个比方，私钥是保险柜的钥匙。", "多签像一个柜子三把锁，要两把一起开。", "可如果锁的主人看同一块屏幕，三把锁就退化成一把。", "比喻不成立的地方是，真实的钥匙被复制，会留下痕迹。", "私钥被复制，不留任何痕迹，直到资产被转走，你才知道。", "所以方案的强度，取决于最容易被攻破的那个环节。", "一台设备，一行日志，一个签名人的眼睛。"]}, {"t": "钥匙的一生", "at": 173.1, "lines": ["一把密钥，要经过生成、存储、使用、备份、轮换和销毁。", "每一步，都出过真实事故。", "先看生成。", "Profanity 是一个靶号地址生成器。", "它的随机种子只有 32 位，约 43 亿种，私钥可以被 GPU 反推。", "2022 年 9 月，1inch 公开了这个问题。", "Wintermute 把这样一个地址，用作金库的管理员。", "披露后，它转走了地址里的 ETH，却没有撤销管理员权限。", "约 5 天后，金库被盗约 1.6 亿美元。", "转走余额，不等于消除风险，权限也要撤销。", "资金地址要在可信硬件里生成，不用靶号工具。", "再看存储。", "2022 年 8 月，Slope 钱包把助记词以明文发到自己的日志服务器。", "Solana 官方通报，约 9231 个钱包受影响，损失约 410 万美元。", "日志、崩溃上报、遥测，都是密钥的泄露通道。", "客户端要在采集这一端，就把密钥材料屏蔽掉。", "钱包的发布链路，也是一把钥匙。", "2025 年 12 月，Trust Wallet 的浏览器扩展，有一个恶意版本出现在 Chrome 商店。", "它导出扩展里所有钱包的助记词，约 850 万美元被盗。", "项目方称，攻击者用泄露的 GitHub secrets，拿到商店的 API Key。", "发布凭证和 CI 密钥，本身就是资金级的资产。", "最后看备份和分片。", "2023 年 7 月，Multichain 的 MPC 地址出现异常转出，约 1.26 亿美元。", "项目方声明，全部 MPC 节点服务器，都在 CEO 的个人云账户上。", "CEO 被警方带走后，团队无法登录。", "外部攻击或内部转移，外界有争议，没有官方定性。", "MPC 的前提是分片独立，分片都在一个人手里，门限只是名义上的。", "分片要放在不同组织、不同地域、不同云账户。"]}, {"t": "看清再签", "at": 314.866, "lines": ["回到开头的冷钱包。", "六把钥匙里，WazirX 持五把，Liminal 持一把。", "签名人在 Liminal 界面上看到的交易，和实际签下的不一样。", "实际签下的，是一次合约升级，钱包控制权被转走。", "接手的是一个恶意合约，它提前 8 天就部署好。", "WazirX 称，问题出在 Liminal 界面显示的数据。", "Liminal 称，自己的基础设施没有被攻破，是受害方的 3 台机器被注入恶意载荷。", "这一争议，没有见到最终的独立报告。", "多签只保证，足够多的人同意某个哈希。", "它不管这个哈希，代表的是哪一笔交易。", "签名人看到的和实际签的不一样，每把钥匙都会正常工作。", "防线在签名人自己这一侧。", "每个签名人，在自己的设备上，用另一套代码，独立算一遍交易哈希。", "再在硬件钱包屏幕上，核对收款地址、金额、数据和操作类型。", "设备把交易解析成人能读懂的字段再签，这叫清晰签名。", "例行转账，操作类型应该是 CALL。", "如果是 DELEGATECALL，就是让多签合约执行外部代码，不签。", "大额交易，再用电话或当面，确认发起人身份。", "签名人不能共用一台电脑、一个浏览器、一个前端，共用就是单点。", "局限是，如果所有人用同一个解码工具，这个工具就是新的单点。"]}, {"t": "三层钱包", "at": 419.833, "lines": ["交易所每天都要给用户提币，不能每一笔都等人工签名。", "常见做法，是分成热、温、冷三层钱包。", "冷钱包放大部分资产，用多签或 MPC，每个签名人用硬件钱包。", "温钱包负责中转，靠审批加时间窗口。", "热钱包自动给用户提币，用 HSM 或 MPC。", "热钱包只放一小部分，按每天的提币需求设水位。", "热钱包失守，损失有上限。", "冷到温，温到热，每一跳都要限额和审批。", "再猜一道题。", "HSM 的私钥不能导出。", "攻击者控制了能给 HSM 发指令的服务器，HSM 会拒绝吗？", "不会。", "HSM 只保证私钥不出设备，它按收到的指令签名。", "所以热钱包的安全，在签名请求进入 HSM 之前。", "那里要有一个独立的风控引擎，检查白名单、限额、速率和异常。", "检查要按待签的原始字节判断，不看界面怎么写。", "一笔大额转出，审批也要按顺序走。", "发起人提交交易，写明用途。", "系统自动检查白名单、限额，以及操作类型是不是 CALL。", "签名人各自解码核对，大额再用电话或当面确认。", "执行之后，监控系统把链上结果和审批记录比对。"]}, {"t": "今天做一件事", "at": 521.966, "lines": ["按角色，各做一件事。", "项目方和交易所，列出每个签名人的设备和云账户，看有没有两个人共用。", "钱包开发者，确认日志和崩溃上报屏蔽密钥材料，发布凭证开启多因素认证。", "运维负责人，人员离职或漏洞披露后，轮换密钥，并撤销链上权限。", "备份要和主密钥分开放，每年至少演练一次恢复，恢复要多人参与。", "普通用户，大额放硬件钱包，小额放另一个钱包，两个钱包用不同的助记词。", "助记词只写在纸或金属板上，不拍照，不存云笔记。", "任何客服、网站、表单让你输入助记词，都是诈骗。", "硬件钱包屏幕只显示哈希，或者无法解析，就不签。", "回到开头的问题。", "六把私钥都没泄露，攻击者也能转走资金。", "只要签名人看到的和实际签下的不一样，每把钥匙都会照常签名。", "能挡住它的，是每个签名人在自己的设备上独立解码，核对屏幕上的字段。", "这只在签名人真正独立时成立。", "钥匙放在哪里很重要，签下的是什么，同样重要。", "下一集讲用户侧诈骗。"]}]}, {"n": 19, "title": "用户侧诈骗：不偷钥匙，骗你签名", "dur": null, "segs": [{"t": "测试之后", "at": 0.0, "lines": ["2025 年 12 月，一名用户要转出一大笔 USDT。", "他很谨慎，先转 50 USDT，测试收款地址。", "测试到账，地址没错。", "几分钟后，他的交易记录里，多出一笔 0.005 USDT 的转账。", "约 26 分钟后，他从记录里复制地址，转出约 5000 万美元。", "这一笔，到了攻击者的地址。", "私钥没被偷，钱包也没被攻破。", "每一步，都是他自己点的确认。", "这类骗局不偷钥匙，它骗你自己动手。", "先猜一道题。", "测试转账已经到账，从记录里复制同一个地址，转大额，安全吗？", "先记住这个问题。"]}, {"t": "五类签名", "at": 53.233, "lines": ["先给准确的说法。", "钓鱼签名，是诱导你签下一个授权，把资产的控制权交给攻击者。", "你签的是真名，私钥也一直在你手里。", "打个比方，骗子拿来一张快递签收单，请你签个字。", "签收单背面印着，同意把房门钥匙交给持单人。", "比喻在这里不成立，签收单可以翻过来看。", "钱包里的签名请求，常常只显示一串十六进制数据。", "最容易被滥用的签名，有五类。", "第一类，approve，允许对方转走你某个代币，最多到一个额度。", "它要上链，要花 Gas。", "第二类，permit，效果和 approve 一样，但只是一个链下签名。", "签好的消息，由别人提交上链。", "第三类，setApprovalForAll，对方能转走你在一个 NFT 系列里的全部 NFT。", "第四类，Permit2 批量授权，一次签名，交出多种代币。", "第五类，EIP-7702 委托，你的地址去执行一份委托合约的代码。", "那份代码，可以直接转走全部资产。", "最危险的是链下签名，不花 Gas，钱包里也没有交易记录。", "你以为只是登录，其实签下一张支票。", "2024 年 9 月，有人签了一个 permit，被转走约 3243 万美元的 spWETH。", "同年 8 月，另一名用户的签名，把金库合约的 owner 改成攻击者。", "约 20 分钟后，攻击者铸出约 5547 万美元的 DAI。", "这一例不是 permit，是改 owner。", "链下签名不上链，也能转移资产。", "2025 年 8 月，又有两起 7702 委托钓鱼，分别约 154 万和 100 万美元。", "也有研究者认为，这两起的根因仍是私钥泄露，委托只是让转账更快。", "大额地址的签名，要在可信设备上逐字段解码。"]}, {"t": "钓鱼套件", "at": 187.566, "lines": ["这些钓鱼网站，很多出自同一类工具。", "它叫 Drainer 即服务。", "开发者维护钓鱼套件、合约和后台，把它当作产品出租。", "分发者负责引流，搭仿冒网站，买广告，盗社交账号。", "链接投到被盗的 X 和 Discord 账号、搜索广告、假空投和私信里。", "受害者一签名，转走的资产自动分账。", "公开分析显示，开发者抽成约 20%，分发者拿约 80%。", "各家套件的比例不同，也会变。", "套件会先读你钱包里的余额，按价值排序，先请求最值钱的那个授权。", "所以同一个钓鱼站，对不同的人，弹出的签名请求不一样。", "Inferno Drainer 在 2023 年 11 月宣布关停，此前约 7000 万美元。", "2025 年 5 月，Check Point 发现它仍在运行，半年内盗走约 900 万美元以上。", "这次它在 Discord 冒充 Collab.Land 引流，受害者有 3 万多名。", "Pink Drainer 在 2024 年 5 月宣布退休，约 2.1 万名受害者，约 8500 万美元。", "Angel Drainer 到 2024 年 2 月，约 2500 万美元，同年 7 月停止服务。", "关停不等于消失，套件代码和分发网络，会换个名字回来。", "整体看，2024 年的钓鱼损失约 4.94 亿美元。", "其中百万美元以上的大案里，permit 类占损失的 56.7%。", "2025 年降到约 8385 万美元，下降约 83%。", "报告说，攻击转向小额和高频。", "这个统计只算 EVM 链上的 Drainer 钓鱼，不含私钥泄露和交易所被盗。"]}, {"t": "投毒与假币", "at": 306.866, "lines": ["回到开头那笔转账。", "这叫地址投毒。", "攻击者监控链上的转账，看到你的测试转账。", "他生成一个首尾和收款地址相同、中间不同的地址。", "首尾加起来 8 个十六进制字符，平均只要试约 43 亿次。", "然后，他往你的记录里塞一笔 0 额或者粉尘转账。", "这一步不需要你的任何授权。", "转 0 个代币，或者用他自己部署的同名假代币，都能在你的记录里留下一条。", "钱包只显示地址的前后几位，两个地址看起来一样。", "所以测试转账防不住投毒，投毒常在测试之后几分钟内出现。", "2024 年 5 月，另一名受害者复制投毒地址，转出 1155 枚 WBTC，约 6800 万美元。", "经过链上喊话谈判，攻击者在约一周内退回绝大部分资金。", "骗你转错是一种，骗你买错是另一种。", "卷款，是团队撤走流动性，或者把手里的币集中卖掉。", "貔貅盘，是合约只允许买，不允许卖，或者卖出税 100%。", "隐藏增发，是 owner 能无限铸币。", "2021 年 11 月的 SQUID 代币，限制持币者卖出，开发者撤走流动性，约 338 万美元。", "2025 年 2 月的 LIBRA 代币，阿根廷总统发推推广后暴涨，随后崩盘。", "Nansen 统计，亏损的钱包合计亏约 2.51 亿美元，案件结果尚无定论。", "CertiK 追踪到一个地址，在 2023 年 8 到 10 月部署 979 个貔貅盘代币，约每 30 分钟一个。", "名人推广和涨幅，都不是安全信号。"]}, {"t": "拦在每一步", "at": 424.599, "lines": ["这些骗局有一个共同点。", "攻击者控制不了你的私钥，也控制不了链上合约的逻辑。", "每一步都要你的一个动作，点击、签名、复制、粘贴。", "每一个动作，都是一个可以拦截的点。", "钱包这一层，先把签名请求解码成看得懂的字段。", "授权给谁，额度多少，期限到哪天，委托哪个合约。", "无法解码，就明确显示无法解析。", "无限授权、批量授权、7702 委托，默认强警告。", "7702 委托，只允许指向钱包自己审计过的实现合约，拒绝网站发起的委托请求。", "交易模拟，在签名之前，显示签完以后余额怎么变。", "新注册的域名、仿冒的域名，直接拦下。", "DApp 只请求精确额度的授权，用完就停。", "交易所这一层，提币地址用白名单，新地址有冷却期。", "新地址和历史地址首尾相同、中间不同，就强提示。", "交易记录默认折叠零额转账和陌生代币。", "充值只认白名单里的代币合约，假 USDT 不入账。", "上币前，检查卖出限制、持仓集中度和增发权限。", "已知的 Drainer 收款地址和投毒地址，进风控名单。", "提币页和空投活动页，提示官方从不要求签名领取。"]}, {"t": "签名之前", "at": 524.833, "lines": ["如果你是普通用户，先记住几条。", "官方从不要求你签名领取空投，或者签名验证钱包。", "签名前看三样，授权给谁，授权多少，到什么时候。", "看不懂就不签，不花 Gas，不等于没有风险。", "大额资产和日常交互，用不同的钱包。", "每个月撤销不用的授权，买新币前，先确认它能卖出去。", "已经签下钓鱼签名，就立刻撤销授权，把剩余资产转到新地址。", "如果你做钱包产品，今天就查一件事，签名请求能不能解码成可读字段。", "如果你在交易所，查一查提币时有没有比对首尾相同的历史地址。", "回到开头的问题。", "测试转账已经到账，从记录里复制地址，并不安全。", "测试只证明那一刻的地址是对的，证明不了你之后复制的是同一个。", "地址要从地址簿，或者收款方的安全渠道取，再核对完整地址，不只看首尾。", "私钥完好无损，资产也可能没了，每次确认之前，先看清你在签什么。", "下一集讲前端、DNS 与供应链安全。"]}]}, {"n": 20, "title": "前端、DNS 与供应链：合约没变，页面变了", "dur": null, "segs": [{"t": "地址栏是对的", "at": 0.0, "lines": ["2022 年 8 月，一名用户打开 Curve 的官网。", "他输入的域名，一个字母都没错。", "地址栏旁边，HTTPS 的锁标志也在，浏览器没有任何警告。", "页面请他授权，他签了名。", "签完之后，他的代币被转走。", "这一次，用户合计损失约 57 万美元。", "Curve 的合约没有任何变化，审计过的代码也没出错，链上的一切都和昨天一样。", "变的是页面。", "那天，这个域名被解析到一个克隆的前端，攻击者没碰合约，他换掉的是页面。", "先猜一道题。", "域名是对的，锁标志也在，这能证明，你看到的页面是真的吗？", "先记住这个问题。"]}, {"t": "页面链路", "at": 55.1, "lines": ["先给准确的说法。", "用户不读合约，用户读页面。", "页面告诉你，这笔交易是什么。", "钱包再把页面构造好的交易，交给你签名。", "攻击者改掉页面，你就会对着一个审计过的合约，签下攻击交易。", "前端，就是浏览器里的网页，和它加载的全部脚本。", "打个比方，银行柜台的玻璃上，贴着收款账号。", "金库、账本、保安都没问题，但有人夜里换了这张贴纸。", "第二天，客户都把钱汇进新账号。", "比喻在这里不成立，换贴纸要进银行大厅。", "改前端可以在千里之外完成，而且能只对某一个客户显示假贴纸。", "页面从源码到你的浏览器，要经过一整串环节。", "开发者的电脑、代码仓库、依赖包、构建、托管、CDN，最后是域名。", "这一整串，叫供应链。", "任何一环被攻破，结果都一样，你的浏览器运行着攻击者的代码。", "合约审计，覆盖不到其中任何一环。"]}, {"t": "域名劫持", "at": 131.233, "lines": ["先看链路最外面的一环，域名。", "浏览器先问 DNS，这个域名指向哪台服务器。", "攻击者控制域名注册商的账号，或者攻破注册商本身。", "再把解析记录，指向自己的服务器。", "你访问正确的域名，打开的却是克隆页面。", "回到开头的题，不能证明。", "控制了解析的人，可以用常见的域名验证方式，申请到有效证书。", "锁标志只说明，浏览器连上了域名此刻指向的服务器。", "地址栏这一层的检查，在这里全部失效。", "2025 年 5 月，攻击者进入同一家注册商的系统。", "又一次把 Curve 的域名委派，改到自己的服务器。", "Curve 把用户引导到新域名，并公开批评注册商响应迟缓。", "同一家注册商出两次事，说明换个强密码不够，注册商本身就是风险。", "2024 年 7 月，Google Domains 的域名业务，迁到 Squarespace。", "之后，Compound 等多个 DeFi 项目的域名被劫持，指
