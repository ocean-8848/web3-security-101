<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Noto Sans SC"; src: url("assets/fonts/NotoSansSC.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "Noto Serif SC"; src: url("assets/fonts/NotoSerifSC.woff2") format("woff2"); font-weight: 200 900; }
      @font-face { font-family: "LXGW WenKai"; src: url("assets/fonts/LXGWWenKai-Medium.woff2") format("woff2"); font-weight: 500; }
      @font-face { font-family: "Smiley Sans"; src: url("assets/fonts/SmileySans.woff2") format("woff2"); font-weight: 400; }
      :root {
        --ground: #efebe3;
        --ink: #141414;
        --cap-ink: #1c1c1c; --cap-bg: #fffdf8; --cap-pad: 10px 28px; --cap-radius: 14px; --cap-size: 46px; --cap-weight: 900;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { width: 100%; height: 100%; position: relative; }
      #bg { position: absolute; inset: 0; background: var(--ground); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="56.66" data-width="1920" data-height="1080">
      <div id="bg"></div>
      <div id="story" data-composition-id="story" data-composition-src="compositions/story.html"
        data-start="0" data-duration="56.66" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 2"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="56.66" data-track-index="2" data-track-kind="captions"
        data-width="1920" data-height="1080" style="z-index: 10"></div>
      <audio id="narration" class="clip" src="assets/narration.wav" data-start="0" data-duration="56.66" data-track-index="3" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
