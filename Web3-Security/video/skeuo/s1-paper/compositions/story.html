    (function () {
      const INK = "#161616", RED = "#c8321e", PENCIL = "#8b857b", NOTE = "#6f685d";
      const tl = gsap.timeline({ paused: true });

      // initial transforms / states (set inside the timeline so every seek agrees)
      gsap.set("#op1", { rotationX: -90, opacity: 0 });
      gsap.set("#op0", { opacity: 0, color: "#c9c1b2" });
      gsap.set(["#tb .rule", "#store .rule"], { scaleX: 0 });
      gsap.set(".strike", { scaleX: 0 });
      gsap.set(".cell", { color: "#c9c1b2", borderColor: "#c9c1b2" });

      // ink: appear as ink soaking in — pencil grey to colour, no translation
      function ink(sel, t, c, d) {
        c = c || INK; d = d || 0.6;
        tl.to(sel, { opacity: 1, filter: "blur(0px)", duration: d * 0.5, ease: "power2.out" }, t);
        tl.to(sel, { color: c, duration: d, ease: "power2.out" }, t);
      }
      function draw(sel, t, d, c) {
        tl.to(sel, { strokeDashoffset: 0, duration: d || 0.7, ease: "power2.inOut" }, t);
        if (c) tl.to(sel, { stroke: c, duration: 0.01 }, t);
      }
      function out(sel, t, d) {
        tl.to(sel, { opacity: 0, filter: "blur(6px)", duration: d || 0.3, ease: "power2.in" }, t);
      }
      function strike(sel, t) {
        tl.to(sel, { scaleX: 1, duration: 0.35, ease: "power2.in" }, t);
      }
      const MOVE = "power3.inOut";

      // ---------- l1: date / Bybit / 15 亿 ----------
      tl.to("#o-date", { color: INK, duration: 0.6, ease: "power2.out" }, 0.70);
      ink("#o-bybit", 2.46);
      ink("#o-cold", 3.60);
      ink("#o-amt", 5.23);
      draw("#o-ulp", 5.55, 0.6);
      ink("#o-note", 5.9, NOTE);

      // ---------- l2: key, locked ----------
      draw("#k-shk", 7.53, 0.6);
      draw("#k-body", 7.63, 0.6);
      draw("#k-hole", 7.85, 0.4);
      draw("#k-ring", 7.95, 0.5);
      draw("#k-shaft", 8.15, 0.7);
      ink("#k-lab", 7.75);
      ink("#k-ok", 8.68);
      ink("#k-sign", 9.56);
      ink("#k-conf", 12.40);

      // ---------- l3: page reorganises, field table grows ----------
      out(["#o-note", "#o-cold", "#k-lab", "#k-ok", "#k-sign", "#k-conf"], 13.40, 0.25);
      tl.to("#open", { x: -40, y: 150, scale: 0.4, transformOrigin: "0 0", duration: 0.9, ease: MOVE }, 13.50);
      tl.to("#key", { x: -960, y: 400, scale: 0.4, transformOrigin: "0 0", duration: 0.9, ease: MOVE }, 13.60);
      ink("#t1", 14.40);
      tl.to(["#ru0", "#ru5"], { scaleX: 1, duration: 0.7, ease: "power2.inOut" }, 14.55);
      tl.to(["#ru1", "#ru2", "#ru3", "#ru4"], { scaleX: 1, duration: 0.6, ease: "power2.inOut", stagger: 0.06 }, 14.75);
      [["#r0f", "#r0v"], ["#r1f", "#r1v"], ["#r2f", "#r2v"], ["#r3f", "#op0", "#r3n"], ["#r4f", "#r4v"]].forEach(function (r, i) {
        ink(r, 15.0 + i * 0.12);
      });
      tl.to("#r3n", { color: NOTE, duration: 0.3 }, 15.7);
      ink("#cap1", 15.5, NOTE);
      ink("#n-plain", 16.09);

      // ---------- l4: what was really signed; operation 0 -> 1 ----------
      out(["#t1", "#n-plain", "#cap1"], 18.10, 0.25);
      ink("#t2", 18.30);
      ink("#cap2", 18.45, NOTE);
      tl.to(["#r0f", "#r0v", "#r1f", "#r1v", "#r2f", "#r2v", "#r4f", "#r4v"], { color: PENCIL, duration: 0.5, ease: "power2.out" }, 20.08);
      draw("#ar-opp", 20.10, 0.5);
      // 20.6 – 20.82: still
      tl.to("#op0", { rotationX: 90, duration: 0.22, ease: "power3.in" }, 20.82);
      tl.to("#op1", { opacity: 1, duration: 0.01 }, 21.04);
      tl.to("#op1", { rotationX: 0, duration: 0.35, ease: "power3.out" }, 21.04);
      tl.to("#op0", { opacity: 0, duration: 0.01 }, 21.04);
      draw("#op-cp", 21.10, 0.55);
      out("#r3n", 21.20, 0.2);
      ink("#r3d", 21.35, RED);
      ink("#r3e", 21.85, NOTE);

      // ---------- l5: attacker's code rewrites slot 0 ----------
      tl.to(["#r0f", "#r0v", "#r2f", "#r2v"], { color: INK, duration: 0.5, ease: "power2.out" }, 23.95);
      out("#r3e", 23.95, 0.3);
      strike("#r0s", 26.07);
      ink("#r0w", 26.30);
      strike("#r2s", 26.55);
      ink("#r2w", 26.75);
      out(["#open", "#key", "#ar-op", "#t2"], 27.55, 0.3);
      tl.to("#tb", { x: -440, y: 70, scale: 0.75, transformOrigin: "0 0", duration: 0.9, ease: MOVE }, 27.70);
      ink("#t3", 27.95);
      ink("#s-h", 28.10);
      tl.to(["#su0", "#su1", "#su2"], { scaleX: 1, duration: 0.6, ease: "power2.inOut", stagger: 0.06 }, 28.10);
      ink(["#s0k", "#s0n", "#s0v"], 28.25);
      ink("#s1k", 28.40, PENCIL);
      draw("#ar-stp", 28.35, 0.5);
      strike("#s0s", 28.63);
      ink("#s0w", 28.90);

      // ---------- l6: the key is fine; the document changed ----------
      out(["#t3", "#ar-stp"], 31.20, 0.25);
      tl.to(["#tb", "#store"], { x: "+=200", y: "+=20", scale: 0.45, transformOrigin: "0 0", duration: 0.8, ease: MOVE }, 31.30);
      tl.to(["#tb", "#store"], { opacity: 0, filter: "blur(5px)", duration: 0.35, ease: "power2.in" }, 31.30);
      tl.fromTo("#doc", { opacity: 0, filter: "blur(4px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "power2.out", immediateRender: false }, 31.85);
