<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>合约安全讲解视频</title>
<style>
  :root { --bg: #0d0e10; --panel: #16181c; --line: #2c3038; --text: #eceae4; --text-2: #9ea3ad; --gold: #f0b90b; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif; }
  .page { max-width: 1240px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-family: "Songti SC", serif; font-size: 30px; margin: 0 0 6px; }
  .lead { color: var(--text-2); margin: 0 0 24px; max-width: 760px; }
  .player { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
  video { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; }
  .now h2 { font-size: 20px; margin: 12px 0 4px; }
  .now .meta { color: var(--text-2); font-size: 13px; }
  .now a { color: var(--gold); }
  ol.list { list-style: none; margin: 0; padding: 0; max-height: 72vh; overflow: auto; border: 1px solid var(--line); border-radius: 10px; }
  ol.list li { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  ol.list li:last-child { border-bottom: 0; }
  ol.list li.grp { display: block; cursor: default; padding: 8px 12px; font-size: 12px; letter-spacing: .08em; color: var(--gold); background: var(--panel); }
  ol.list li:hover { background: var(--panel); }
  ol.list li[aria-current] { background: rgba(240, 185, 11, .12); }
  ol.list .ep { font-family: Menlo, monospace; color: var(--gold); font-size: 13px; padding-top: 2px; }
  ol.list .t { font-size: 14px; }
  ol.list .d { color: var(--text-2); font-size: 12px; }
  @media (max-width: 860px) { .player { grid-template-columns: minmax(0, 1fr); } ol.list { max-height: none; } }
</style>
</head>
<body>
<div class="page">
  <h1>合约安全讲解视频</h1>
  <p class="lead">配套《智能合约安全学习手册》。主线 13 集、链专题 4 集（以太坊 · BNB Chain · TRON · Mantle）、评估篇 10 集，每集约 9–15 分钟，配音和画面字幕已合成。右侧选集。<a href="https://claude.ai/artifact/AuMf2iv5HSYVzvQiBEE6pA" target="_blank" rel="noopener" style="color:var(--gold)">返回手册</a></p>
  <div class="player">
    <div>
      <video id="v" controls preload="metadata"></video>
      <div class="now">
        <h2 id="title"></h2>
        <div class="meta" id="meta"></div>
      </div>
    </div>
    <ol class="list" id="list"></ol>
  </div>
</div>
<script>
const EPISODES = [
  ['EP01', 'security-landscape', '合约安全全景：为什么代码就是金库'],
  ['EP02', 'evm-solidity-basics', 'EVM 与 Solidity 安全基础：先看懂这台机器'],
  ['EP03', 'reentrancy', '重入攻击：在你记账之前再取一次钱'],
  ['EP04', 'access-control', '访问控制与权限：谁有权按这个按钮'],
  ['EP05', 'arithmetic-precision', '算术与精度：差一个 wei，丢一个金库'],
  ['EP06', 'external-calls-tokens', '外部调用与代币兼容性：对方未必按标准出牌'],
  ['EP07', 'oracle-flashloan', '预言机与闪电贷：一笔交易就能改写的价格'],
  ['EP08', 'mev-signatures', 'MEV 与签名安全：顺序可以被买，签名可以被重放'],
  ['EP09', 'upgradeable-proxy', '可升级合约与代理：维修门的两面'],
  ['EP10', 'defi-economic-security', 'DeFi 经济安全：代码没错，规则错了'],
  ['EP11', 'cross-chain-bridges', '跨链桥安全：两条链之间的那条缝'],
  ['EP12', 'audit-testing-workflow', '审计、测试与开发流程：把安全写进流水线'],
  ['EP13', 'incident-casebook', '事故案例库：同样的错误，换个名字再来一次'],
  ['C00', 'ethereum', '以太坊专题：合约案例深潜'],
  ['C01', 'bnb-chain', 'BNB Chain 专题：我以为一样的地方'],
  ['C02', 'tron', 'TRON 专题：能跑 Solidity，但 TVM 不是 EVM'],
  ['C03', 'mantle', 'Mantle 专题：以太坊 L2 视角'],
  ['A01', 'methodology', '安全评估方法论：从接单到签字'],
  ['A02', 'risk-rating-reporting', '风险评级与报告：把发现变成决策依据'],
  ['A03', 'exchange-contracts-wallets', '交易所自有合约与钱包评估'],
  ['A04', 'defi-protocol-review', 'DeFi 协议评估：按协议类型下手'],
  ['A05', 'listing-due-diligence', '上币与合作项目尽调'],
  ['A06', 'operational-key-security', '运营与密钥安全：代码之外的战场'],
  ['A07', 'external-audit-bounty', '外部审计与漏洞赏金管理'],
  ['A08', 'reproduce-attacks', '事故分析与防御性验证'],
  ['A09', 'incident-response', '应急响应：评估之后，出事了怎么办'],
  ['A10', 'case-binance-alpha-audit', '实例分析：钱包里的 Audit 页是怎么来的'],
];
const v = document.getElementById('v'), list = document.getElementById('list');
const GROUP = { A: '评估篇 · 交易所 / DeFi / 上币尽调', E: '主线 · 漏洞机制与防御', C: '链专题 · ETH / BNB / TRON / Mantle' };
list.innerHTML = EPISODES.map(([ep, slug, t], i) => (i === 0 || EPISODES[i - 1][0][0] !== ep[0] ? `<li class="grp">${GROUP[ep[0]]}</li>` : '') + `<li data-i="${i}"><span class="ep">${ep}</span><span><span class="t">${t}</span><br><span class="d" id="d${i}"></span></span></li>`).join('');
function fmt(s) { s = Math.round(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function play(i) {
  const [ep, slug, t] = EPISODES[i], base = ep + '-' + slug;
  v.src = 'output/' + base + '.mp4';
  document.getElementById('title').textContent = ep + ' ' + t;
  document.getElementById('meta').innerHTML = `<a href="scripts/${base}.md">口播稿</a> · <a href="slides/${base}.html">动画讲解页</a> · <a href="output/${base}.srt">字幕 SRT</a>`;
  list.querySelectorAll('li[data-i]').forEach(li => li.toggleAttribute('aria-current', +li.dataset.i === i));
  try { localStorage.setItem('contract-ep-id', EPISODES[i][0]); } catch (e) {}
}
v.addEventListener('loadedmetadata', () => {
  const i = +list.querySelector('li[aria-current]').dataset.i;
  document.getElementById('d' + i).textContent = fmt(v.duration);
});
list.addEventListener('click', e => { const li = e.target.closest('li[data-i]'); if (li) { play(+li.dataset.i); v.play().catch(() => {}); } });
let start = 0;
try { start = Math.max(0, EPISODES.findIndex(e => e[0] === localStorage.getItem('contract-ep-id'))); } catch (e) {}
play(start);
</script>
</body>
</html>
