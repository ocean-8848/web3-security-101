<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>{{title}}</title>
<style>
  @page { size: A4; margin: 18mm 16mm; }
  body { font-family: -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif; color: #1c2430; font-size: 11pt; line-height: 1.6; }
  h1 { font-size: 22pt; border-bottom: 3px solid #1c2430; padding-bottom: 6px; }
  h2 { font-size: 15pt; margin-top: 22px; border-bottom: 1px solid #c8d0da; padding-bottom: 3px; }
  h3 { font-size: 12.5pt; margin-top: 20px; break-after: avoid; }
  h4 { font-size: 11pt; margin-bottom: 2px; break-after: avoid; }
  table { border-collapse: collapse; width: 100%; font-size: 10pt; }
  th, td { border: 1px solid #c8d0da; padding: 4px 7px; text-align: left; vertical-align: top; }
  th { background: #eef2f6; }
  code { font-family: Menlo, Consolas, monospace; font-size: 9.5pt; background: #f2f4f7; padding: 0 3px; }
  pre { background: #f2f4f7; padding: 8px 10px; font-size: 9pt; white-space: pre-wrap; break-inside: avoid; }
  pre code { background: none; padding: 0; }
  .footer-note { color: #5a6675; font-size: 9pt; margin-top: 24px; }
</style>
</head>
<body>
{{body}}
<p class="footer-note">本报告是《Web3 安全学习手册》的教学示例，目标是本地玩具合约。</p>
</body>
</html>
