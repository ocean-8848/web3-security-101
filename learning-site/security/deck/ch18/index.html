<!doctype html>
<html lang="zh-CN">
<head>

<title>钱包与密钥管理：钥匙放在哪里</title>
<style>
:root {
  --ground: #f6f5f1; --paper: #fffefb; --ink: #1d1c19; --ink-2: #5d5a52; --rule: #e4e1d8; --tint: #efece4;
  --gold: #b38300; --gold-soft: #f8edcc; --accent: #1d93ba; --accent-soft: #e1f1f7;
  --f-display: "Noto Serif SC", "Songti SC", "STSong", serif;
  --f-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --ground: #131311; --paper: #1a1a17; --ink: #ebe9e2; --ink-2: #a5a298; --rule: #2f2e29; --tint: #23221e;
    --gold: #f0b90b; --gold-soft: #3a3010; --accent: #6cc7e0; --accent-soft: #15303a; color-scheme: dark; }
}
:root[data-theme="dark"] { --ground: #131311; --paper: #1a1a17; --ink: #ebe9e2; --ink-2: #a5a298; --rule: #2f2e29; --tint: #23221e;
  --gold: #f0b90b; --gold-soft: #3a3010; --accent: #6cc7e0; --accent-soft: #15303a; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 6px; }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--ground); }
.top { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--rule); background: var(--paper); min-width: 0; }
.top .t { flex: 1; min-width: 0; }
.top .eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; color: var(--gold); }
.top h1 { margin: 0; font-family: var(--f-display); font-size: 16px; font-weight: 800; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn { height: 34px; padding: 0 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); cursor: pointer; white-space: nowrap; font-size: 14px; }
.btn:hover { border-color: var(--gold); }
.btn[aria-pressed="true"] { background: var(--gold-soft); border-color: var(--gold); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn:disabled { opacity: .4; cursor: default; }

.body { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; }
.stagewrap { min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 14px; }
.screen { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 100%; overflow: hidden; border-radius: 12px; background: #efebe3;
  box-shadow: 0 1px 0 var(--rule), 0 8px 28px rgba(60, 50, 30, .14); cursor: pointer; touch-action: pan-y; user-select: none; }
.screen iframe { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; transform-origin: 0 0; visibility: hidden; pointer-events: none; }
.screen iframe.on { visibility: visible; }
.screen .still { position: absolute; inset: 0; background-repeat: no-repeat; background-color: #efebe3; }
.screen.live .still { visibility: hidden; }
.screen .wait { position: absolute; left: 12px; bottom: 12px; padding: 4px 12px; border-radius: 999px; color: #fff; font-size: 13px; background: rgba(28, 28, 28, .72); }
.btn.play { border-color: var(--accent); color: var(--accent); }
.screen .wait[hidden] { display: none; }

.side { min-height: 0; overflow-y: auto; border-left: 1px solid var(--rule); background: var(--paper); padding: 18px 20px 24px; }
.sec { font-size: 12px; color: var(--accent); font-weight: 600; letter-spacing: .04em; }
.side h2 { margin: 4px 0 12px; font-family: var(--f-display); font-size: 22px; font-weight: 800; line-height: 1.4; text-wrap: balance; }
.side ul { margin: 0; padding: 0; list-style: none; }
.side li { position: relative; padding: 6px 0 6px 18px; border-top: 1px solid var(--rule); }
.side li:first-child { border-top: 0; }
.side li::before { content: ""; position: absolute; left: 2px; top: 16px; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
.notes { margin-top: 18px; border: 1px solid var(--rule); border-radius: 8px; }
.notes > summary { cursor: pointer; padding: 8px 12px; font-size: 13px; font-weight: 600; color: var(--ink-2); list-style: none; }
.notes > summary::-webkit-details-marker { display: none; }
.notes > summary::before { content: "▸ "; }
.notes[open] > summary::before { content: "▾ "; }
.notes ol { margin: 0; padding: 4px 14px 10px 32px; font-size: 14px; color: var(--ink-2); }
.notes li { border: 0; padding: 2px 0; }
.notes li::before { display: none; }

.ctrl { display: flex; align-items: center; gap: 8px; padding: 8px 14px calc(8px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--rule); background: var(--paper); flex-wrap: wrap; }
.count { font-family: var(--f-mono); font-size: 13px; color: var(--ink-2); min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
.prog { flex: 1 1 240px; display: flex; gap: 3px; align-items: center; height: 30px; min-width: 160px; }
.prog .grp { display: flex; gap: 2px; flex: var(--n) 1 0; }
.prog .grp + .grp { margin-left: 6px; }
.prog button { flex: 1; height: 8px; padding: 0; border: 0; border-radius: 3px; background: var(--tint); cursor: pointer; }
.prog button.seen { background: var(--gold-soft); }
.prog button.cur { background: var(--gold); }
.prog button:hover { outline: 1px solid var(--gold); }
.speed { height: 34px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); padding: 0 6px; font-size: 13px; }

/* fullscreen: picture fills, text sits on the right */
.app:fullscreen .body { grid-template-columns: minmax(0, 1fr) 380px; }
.app:fullscreen .top { display: none; }

@media (max-width: 960px), (max-aspect-ratio: 4/3) {
  .body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .stagewrap { padding: 10px 10px 0; }
  .screen { max-height: none; }
  .side { border-left: 0; border-top: 0; background: var(--ground); padding: 12px 14px 20px; }
  .side h2 { font-size: 19px; margin-bottom: 8px; }
  .hide-narrow { display: none; }
  .app:fullscreen .body { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .top { padding: 6px 10px; }
  .top h1 { font-size: 14px; }
  .ctrl { gap: 6px; padding-inline: 10px; }
  .prog { order: -1; flex-basis: 100%; }
  .btn { padding: 0 10px; }
}
</style>
</head>

  var D = {"chapter": "s18", "title": "钱包与密钥管理：钥匙放在哪里", "segs": 6, "slides": [{"seg": "1", "t0": 0.0, "t1": 13.51, "title": "冷钱包损失约 2.3 亿美元", "points": ["2024 年 7 月，交易所 WazirX 的多签冷钱包", "冷钱包放大部分资产，多签不让一把钥匙说了算"], "notes": ["2024 年 7 月，交易所 WazirX 的多签冷钱包，损失约 2.3 亿美元。", "冷钱包放的是大部分资产，多签就是为了不让一把钥匙说了算。"], "section": "钥匙都在", "k": 8.05}, {"seg": "1", "t0": 13.51, "t1": 28.71, "title": "钥匙替攻击者签了字", "points": ["六把钥匙，转账要其中四把签名", "公开材料没有说任何一把私钥被导出", "签名人按流程一个一个签了名"], "notes": ["这个钱包有六把钥匙，转账要其中四把签名。", "公开材料没有说，任何一把私钥被导出。", "签名人按流程，一个一个签了名。", "攻击者没有偷走钥匙，却让这些钥匙替他签了字。"], "section": "钥匙都在", "k": 28.71}, {"seg": "1", "t0": 28.71, "t1": 34.91, "title": "钥匙都在，钱没了", "points": ["多数大额事故，都不是私钥被数学破解"], "notes": ["钥匙都在，钱没了。", "多数大额事故，都不是私钥被数学破解。"], "section": "钥匙都在", "k": 34.91}, {"seg": "1", "t0": 34.91, "t1": 46.44, "title": "先猜一道题", "points": ["六把私钥都存在硬件钱包里，一把也没有泄露", "攻击者能转走多签里的资金吗？", "先记住这个问题"], "notes": ["先猜一道题。", "六把私钥都存在硬件钱包里，一把也没有泄露。", "攻击者能转走多签里的资金吗？", "先记住这个问题。"], "section": "钥匙都在", "k": 41.46}, {"seg": "2", "t0": 0.0, "t1": 17.23, "title": "私钥与助记词", "points": ["私钥是一个 256 位的随机数，用来给交易签名", "谁能让私钥签一笔交易，谁就拥有这笔资产", "助记词是 12 或 24 个单词，可以推导出一组私钥"], "notes": ["先给准确的说法。", "私钥是一个 256 位的随机数，用来给交易签名。", "谁能让私钥签一笔交易，谁就拥有这笔资产。", "助记词是 12 或 24 个单词，可以推导出一组私钥。"], "section": "五种放法", "k": 12.05}, {"seg": "2", "t0": 17.23, "t1": 28.77, "title": "第一种：软件钱包", "points": ["私钥在手机、电脑或浏览器扩展里", "设备被攻破，钱就没了"], "notes": ["放私钥的方法，常见的有五种。", "第一种，助记词软件钱包，私钥在手机、电脑或浏览器扩展里。", "设备被攻破，钱就没了。"], "section": "五种放法", "k": 28.53}, {"seg": "2", "t0": 28.77, "t1": 38.81, "title": "第二种：硬件钱包", "points": ["私钥在一块独立芯片里，不离开设备", "它只负责签名，签之前人要看清签的是什么"], "notes": ["第二种，硬件钱包，私钥在一块独立芯片里，不离开设备。", "它只负责签名，签之前，人要看清签的是什么。"], "section": "五种放法", "k": 38.81}, {"seg": "2", "t0": 38.81, "t1": 47.65, "title": "第三种：多签", "points": ["比如 Safe：几个独立私钥加一个链上合约", "签名数达到门槛，交易才执行"], "notes": ["第三种，多签，比如 Safe，几个独立私钥加一个链上合约。", "签名数达到门槛，交易才执行。"], "section": "五种放法", "k": 44.61}, {"seg": "2", "t0": 47.65, "t1": 58.41, "title": "第四种：MPC 门限签名", "points": ["私钥被切成几个分片", " s": ["再看存储。", "2022 年 8 月，Slope 钱包把助记词以明文发到自己的日志服务器。", "Solana 官方通报，约 9231 个钱包受影响，损失约 410 万美元。", "日志、崩溃上报、遥测，都是密钥的泄露通道。", "客户端要在采集这一端，就把密钥材料屏蔽掉。"], "section": "钥匙的一生", "k": 67.06}, {"seg": "3", "t0": 70.03, "t1": 94.89, "title": "发布链路也是一把钥匙", "points": ["2025 年 12 月，Trust Wallet 恶意扩展上了商店", "导出所有钱包的助记词，约 850 万美元被盗", "项目方称：泄露的 GitHub secrets 拿到商店 API Key"], "notes": ["钱包的发布链路，也是一把钥匙。", "2025 年 12 月，Trust Wallet 的浏览器扩展，有一个恶意版本出现在 Chrome 商店。", "它导出扩展里所有钱包的助记词，约 850 万美元被盗。", "项目方称，攻击者用泄露的 GitHub secrets，拿到商店的 API Key。", "发布凭证和 CI 密钥，本身就是资金级的资产。"], "section": "钥匙的一生", "k": 90.83}, {"seg": "3", "t0": 94.89, "t1": 117.75, "title": "备份与分片", "points": ["2023 年 7 月，MPC 地址异常转出约 1.26 亿美元", "项目方称全部 MPC 节点都在 CEO 的个人云账户上", "CEO 被警方带走后团队无法登录，没有官方定性"], "notes": ["最后看备份和分片。", "2023 年 7 月，Multichain 的 MPC 地址出现异常转出，约 1.26 亿美元。", "项目方声明，全部 MPC 节点服务器，都在 CEO 的个人云账户上。", "CEO 被警方带走后，团队无法登录。", "外部攻击或内部转移，外界有争议，没有官方定性。"], "section": "钥匙的一生", "k": 103.69}, {"seg": "3", "t0": 117.75, "t1": 129.44, "title": "分片要真正独立", "points": ["分片都在一个人手里，门限只是名义上的", "分片放在不同组织、不同地域、不同云账户"], "notes": ["MPC 的前提是分片独立，分片都在一个人手里，门限只是名义上的。", "分片要放在不同组织、不同地域、不同云账户。"], "section": "钥匙的一生", "k": 124.05}, {"seg": "4", "t0": 0.0, "t1": 21.93, "title": "看到的和签下的不一样", "points": ["六把钥匙里，WazirX 持五把，Liminal 持一把", "签名人在 Liminal 界面看到的交易和实际签下的不一样", "实际签下合约升级，控制权转给提前 8 天部署的恶意合约"], "notes": ["回到开头的冷钱包。", "六把钥匙里，WazirX 持五把，Liminal 持一把。", "签名人在 Liminal 界面上看到的交易，和实际签下的不一样。", "实际签下的，是一次合约升级，钱包控制权被转走。", "接手的是一个恶意合约，它提前 8 天就部署好。"], "section": "看清再签", "k": 18.3}, {"seg": "4", "t0": 21.93, "t1": 36.51, "title": "双方各执一词", "points": ["WazirX 称：问题出在 Liminal 界面显示的数据", "Liminal 称：受害方的 3 台机器被注入恶意载荷", "没有见到最终的独立报告"], "notes": ["WazirX 称，问题出在 Liminal 界面显示的数据。", "Liminal 称，自己的基础设施没有被攻破，是受害方的 3 台机器被注入恶意载荷。", "这一争议，没有见到最终的独立报告。"], "section": "看清再签", "k": 36.51}, {"seg": "4", "t0": 36.51, "t1": 49.01, "title": "多签只认哈希", "points": ["多签只保证，足够多的人同意某个哈希", "它不管这个哈希代表的是哪一笔交易", "看到的和签的不一样，每把钥匙都会正常工作"], "notes": ["多签只保证，足够多的人同意某个哈希。", "它不管这个哈希，代表的是哪一笔交易。", "签名人看到的和实际签的不一样，每把钥匙都会正常工作。"], "section": "看清再签", "k": 49.01}, {"seg": "4", "t0": 49.01, "t1": 69.01, "title": "防线在签名人这一侧", "points": ["在自己的设备上，用另一套代码独立算交易哈希", "在硬件钱包屏幕上核对地址、金额、数据和操作类型", "清晰签名：解析成人能读懂的字段再签"], "notes": ["防线在签名人自己这一侧。", "每个签名人，在自己的设备上，用另一套代码，独立算一遍交易哈希。", "再在硬件钱包屏幕上，核对收款地址、金额、数据和操作类型。", "设备把交易解析成人能读懂的字段再签，这叫清晰签名。"], "section": "看清再签", "k": 69.01}, {"seg": "4", "t0": 69.01, "t1": 81.67, "title": "看清操作类型", "points": ["例行转账，操作类型应该是 CALL", "DELEGATECALL 是让多签执行外部代码，不签", "大额交易，再用电话或当面确认发起人身份"], "notes": ["例行转账，操作类型应该是 CALL。", "如果是 DELEGATECALL，就是让多签合约执行外部代码，不签。", "大额交易，再用电话或当面，确认发起人身份。"], "section": "看清再签", "k": 81.67}, {"seg": "4", "t0": 81.67, "t1": 95.36, "title": "共用就是单点", "points": ["签名人不能共用电脑、浏览器、前端", "局限：所有人用同一个解码工具，它就是新的单点"], "notes": ["签名人不能共用一台电脑、一个浏览器、一个前端，共用就是单点。", "局限是，如果所有人用同一个解码工具，这个工具就是新的单点。"], "section": "看清再签", "k": 95.36}, {"seg": "5", "t0": 0.0, "t1": 17.81, "title": "热、温、冷三层钱包", "points": ["交易所不能每笔提币都等人工签名", "冷钱包放大部分资产，多签或 MPC，签名人用硬件钱包"], "notes": ["交易所每天都要给用户提币，不能每一笔都等人工签名。", "常见做法，是分成热、温、冷三层钱包。", "冷钱包放大部分资产，用多签或 MPC，每个签名人用硬件钱包。"], "section": "三层钱包", "k": 17.81}, {"seg": "5", "t0": 17.81, "t1": 39.15, "title": "热钱包设水位", "points": ["温钱包负责中转，靠审批加时间窗口", "热钱包用 HSM 或 MPC 自动提币，按每天需求设水位", "热钱包失守损失有上限，每一跳都要限额和审批"], "notes": ["温钱包负责中转，靠审批加时间窗口。", "热钱包自动给用户提币，用 HSM 或 MPC。", "热钱包只放一小部分，按每天的提币需求设水位。", "热钱包失守，损失有上限。", "冷到温，温到热，每一跳都要限额和审批。"], "section": "三层钱包", "k": 31.61}, {"seg": "5", "t0": 39.15, "t1": 48.73, "title": "再猜一道题", "points": ["HSM 的私钥不能导出", "攻击者控制了能给 HSM 发指令的服务器", "HSM 会拒绝吗？"], "notes": ["再猜一道题。", "HSM 的私钥不能导出。", "攻击者控制了能给 HSM 发指令的服务器，HSM 会拒绝吗？"], "section": "三层钱包", "k": 48.73}, {"seg": "5", "t0": 48.73, "t1": 71.11, "title": "不会：安全在 HSM 之前", "points": ["HSM 只保证私钥不出设备，它按收到的指令签名", "签名请求进入 HSM 前，要有独立的风控引擎", "按待签的原始字节判断，不看界面怎么写"], "notes": ["不会。", "HSM 只保证私钥不出设备，它按收到的指令签名。", "所以热钱包的安全，在签名请求进入 HSM 之前。", "那里要有一个独立的风控引擎，检查白名单、限额、速率和异常。", "检查要按待签的原始字节判断，不看界面怎么写。"], "section": "三层钱包", "k": 71.11}, {"seg": "5", "t0": 71.11, "t1": 93.22, "title": "大额转   var S = D.slides, N = S.length, KEY = 'deck-' + D.chapter;
