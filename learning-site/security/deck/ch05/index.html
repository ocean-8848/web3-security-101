<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>访问控制与权限：谁有权按这个按钮</title>
<style>
:root {
  --ground: #f6f5f1; --paper: #fffefb; --ink: #1d1c19; --ink-2: #5d5a52; --rule: #e4e1d8; --tint: #efece4;
  --gold: #b38300; --gold-soft: #f8edcc; --accent: #1d93ba; --accent-soft: #e1f1f7;
  --f-display: "Noto Serif SC", "Songti SC", "STSong", serif;
  --f-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --ground: #131311; --paper: #1a1a17; --ink: #ebe9e2; --ink-2: #a5a298; --rule: #2f2e29; --tint: #23221e;
    --gold: #f0b90b; --gold-soft: #3a3010; --accent: #6cc7e0; --accent-soft: #15303a; color-scheme: dark; }
}
:root[data-theme="dark"] { --ground: #131311; --paper: #1a1a17; --ink: #ebe9e2; --ink-2: #a5a298; --rule: #2f2e29; --tint: #23221e;
  --gold: #f0b90b; --gold-soft: #3a3010; --accent: #6cc7e0; --accent-soft: #15303a; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 6px; }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--ground); }
.top { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--rule); background: var(--paper); min-width: 0; }
.top .t { flex: 1; min-width: 0; }
.top .eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; color: var(--gold); }
.top h1 { margin: 0; font-family: var(--f-display); font-size: 16px; font-weight: 800; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn { height: 34px; padding: 0 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); cursor: pointer; white-space: nowrap; font-size: 14px; }
.btn:hover { border-color: var(--gold); }
.btn[aria-pressed="true"] { background: var(--gold-soft); border-color: var(--gold); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn:disabled { opacity: .4; cursor: default; }

.body { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; }
.stagewrap { min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 14px; }
.screen { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 100%; overflow: hidden; border-radius: 12px; background: #efebe3;
  box-shadow: 0 1px 0 var(--rule), 0 8px 28px rgba(60, 50, 30, .14); cursor: pointer; touch-action: pan-y; user-select: none; }
.screen iframe { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; transform-origin: 0 0; visibility: hidden; pointer-events: none; }
.screen iframe.on { visibility: visible; }
.screen .wait { position: absolute; inset: 0; display: grid; place-items: center; color: #8a826f; font-size: 14px; background: #efebe3; }
.screen .wait[hidden] { display: none; }

.side { min-height: 0; overflow-y: auto; border-left: 1px solid var(--rule); background: var(--paper); padding: 18px 20px 24px; }
.sec { font-size: 12px; color: var(--accent); font-weight: 600; letter-spacing: .04em; }
.side h2 { margin: 4px 0 12px; font-family: var(--f-display); font-size: 22px; font-weight: 800; line-height: 1.4; text-wrap: balance; }
.side ul { margin: 0; padding: 0; list-style: none; }
.side li { position: relative; padding: 6px 0 6px 18px; border-top: 1px solid var(--rule); }
.side li:first-child { border-top: 0; }
.side li::before { content: ""; position: absolute; left: 2px; top: 16px; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
.notes { margin-top: 18px; border: 1px solid var(--rule); border-radius: 8px; }
.notes > summary { cursor: pointer; padding: 8px 12px; font-size: 13px; font-weight: 600; color: var(--ink-2); list-style: none; }
.notes > summary::-webkit-details-marker { display: none; }
.notes > summary::before { content: "▸ "; }
.notes[open] > summary::before { content: "▾ "; }
.notes ol { margin: 0; padding: 4px 14px 10px 32px; font-size: 14px; color: var(--ink-2); }
.notes li { border: 0; padding: 2px 0; }
.notes li::before { display: none; }

.ctrl { display: flex; align-items: center; gap: 8px; padding: 8px 14px calc(8px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--rule); background: var(--paper); flex-wrap: wrap; }
.count { font-family: var(--f-mono); font-size: 13px; color: var(--ink-2); min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
.prog { flex: 1 1 240px; display: flex; gap: 3px; align-items: center; height: 30px; min-width: 160px; }
.prog .grp { display: flex; gap: 2px; flex: var(--n) 1 0; }
.prog .grp + .grp { margin-left: 6px; }
.prog button { flex: 1; height: 8px; padding: 0; border: 0; border-radius: 3px; background: var(--tint); cursor: pointer; }
.prog button.seen { background: var(--gold-soft); }
.prog button.cur { background: var(--gold); }
.prog button:hover { outline: 1px solid var(--gold); }
.speed { height: 34px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); padding: 0 6px; font-size: 13px; }

/* fullscreen: picture fills, text sits on the right */
.app:fullscreen .body { grid-template-columns: minmax(0, 1fr) 380px; }
.app:fullscreen .top { display: none; }

@media (max-width: 960px), (max-aspect-ratio: 4/3) {
  .body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .stagewrap { padding: 10px 10px 0; }
  .screen { max-height: none; }
  .side { border-left: 0; border-top: 0; background: var(--ground); padding: 12px 14px 20px; }
  .side h2 { font-size: 19px; margin-bottom: 8px; }
  .hide-narrow { display: none; }
  .app:fullscreen .body { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .top { padding: 6px 10px; }
  .top h1 { font-size: 14px; }
  .ctrl { gap: 6px; padding-inline: 10px; }
  .prog { order: -1; flex-basis: 100%; }
  .btn { padding: 0 10px; }
}
</style>
</head>

<div class="app" id="app">
  <header class="top">
    <div class="t"><div class="eyebrow" id="eyebrow">拟物化知识讲解</div><h1 id="title"></h1></div>
    <button class="btn" id="back" title="回到文字章节">正文 ↗</button>

  <div class="body">

    <span class="count" id="count"></span>
    <div class="prog" id="prog"></div>
    <select class="speed" id="speed" aria-label="动画速度">
      <option value="1">1×</option><option value="1.5" selected>1.5×</option><option value="2">2×</option><option value="4">4×</option>
    </select>
  </nav>
</div>
<script>
(function () {
  var D = {"chapter": "s05", "title": "访问控制与权限：谁有权按这个按钮", "segs": 6, "slides": [{"seg": "1", "t0": 0.0, "t1": 18.41, "title": "有人成了库合约的 owner", "points": ["2017 年 11 月，用户调用了一个库合约的初始化函数", "这是 Parity 多签钱包共用的库，部署后没人初始化过", "于是他成了这个库的 owner"], "notes": ["2017 年 11 月，以太坊上发生了一件怪事。", "有个用户，调用了一个库合约的初始化函数。", "这个库，是 Parity 多签钱包共用的代码。", "部署之后，从来没有人初始化过它。", "于是，他成了这个库的 owner。"], "section": "没人初始化"}, {"seg": "1", "t0": 18.41, "t1": 36.79, "title": "约 51 万 ETH 被冻结", "points": ["他调用 kill，把库合约销毁了", "依赖这个库的钱包一下子失去了代码逻辑", "没破解密码、没偷私钥，只调用了没有权限检查的函数"], "notes": ["接着，他调用了 kill，把库合约销毁了。", "依赖这个库的钱包，一下子失去了代码逻辑。", "约 51 万 ETH，就此冻结。", "他没有破解任何密码，也没有偷任何私钥。", "他只是调用了一个，没有权限检查的函数。"], "section": "没人初始化"}, {"seg": "1", "t0": 36.79, "t1": 45.44, "title": "谁有权按这个按钮", "points": ["这一集讲访问控制", "每个按钮背后都有同一个问题：谁有权按它？"], "notes": ["这一集讲访问控制。", "每个按钮背后，都有同一个问题：谁有权按它？"], "section": "没人初始化"}, {"seg": "2", "t0": 0.0, "t1": 12.67, "title": "谁可以调用我", "points": ["每个修改状态的函数都要回答这个问题", "答案是任何人，就必须证明任何人调用都安全"], "notes": ["合约里每一个修改状态的函数，都要回答一个问题：谁可以调用我？", "如果答案是任何人，就必须证明，任何人调用都安全。"], "section": "门没装锁"}, {"seg": "2", "t0": 12.67, "t1": 31.29, "title": "合约像一栋写字楼", "points": ["public 函数是大堂的门，谁都能进", "onlyOwner 函数是机房的门，要刷卡", "比方不成立：合约不能升级，锁装错就永远是错的"], "notes": ["打个比方。合约像一栋写字楼。", "public 函数是大堂的门，谁都能进。", "onlyOwner 函数是机房的门，要刷卡。", "这个比方有一处不成立。写字楼可以换锁。", "合约如果不能升级，锁一旦装错，就永远是错的。"], "section": "门没装锁"}, {"seg": "2", "t0": 31.29, "t1": 44.51, "title": "谁会来试这些门", "points": ["任意外部地址、恶意合约", "被钓鱼的特权用户、拿到私钥的攻击者", "合法持有权限的内部人员"], "notes": ["谁会来试这些门？大致有五类。", "任意外部地址，恶意合约，被钓鱼的特权用户，拿到私钥的攻击者。", "还有内部人员，他们本来就合法持有权限。"], "section": "门没装锁"}, {"seg": "2", "t0": 44.51, "t1": 71.03, "title": "一、缺少权限检查", "points": ["增发函数公开却没有修饰器，任何地址都能给自己印币", "修复：加上 onlyRole，只认 MINTER 角色", "Solidity 0.5 之前函数默认 public，忘写可见性就暴露"], "notes": ["下面看六种常见缺陷。先看前三种。", "第一种，缺少权限检查。", "一个增发函数，对外公开，却没有修饰器。任何地址，都能给自己印币。", "修复是加上 onlyRole，只认持有 MINTER 角色的地址。", "老合约还有一个坑。Solidity 0.5 之前，函数默认是 public。", "忘写可见性，内部函数就暴露给了所有人。"], "section": "门没装锁"}, {"seg": "2", "t0": 71.03, "t1": 97.81, "title": "二、用发起人鉴权", "points": ["tx.origin 是最初签名的外部账户", "管理员领空投调用攻击者合约，攻击者合约再调你的", "检查通过了；修复：改看直接调用者 msg.sender"], "notes": ["第二种，用 tx.origin 做鉴权。", "tx.origin，是最初签名的那个外部账户。", "管理员去领空投，调用了攻击者的合约。攻击者的合约，再来调用你的。", "这时 tx.origin 仍然是管理员。检查通过了。", "修复是改看 msg.sender，也就是直接调用者。中间的合约，冒充不了它。"], "section": "门没装锁"}, {"seg": "2", "t0": 97.81, "t1": 111.11, "title": "三、未保护的初始化", "points": ["可升级合约和克隆合约用 initialize 代替构造函数", "没人调用或能被重复调用，谁先调用谁就是 owner"], "notes": ["第三种，未保护的初始化函数。", "可升级合约和克隆合约，用 initialize 代替构造函数。", "如果它没人调用，或者能被重复调用，谁先调用，谁就是 owner。"], "section": "门没装锁"}, {"seg": "2", "t0": 111.11, "t1": 130.86, "title": "初始化的两步修复", "points": ["加上 initializer 修饰器，只允许执行一次", "实现合约构造函数里调用 disableInitializers 锁死", "开头的 Parity 库合约缺的正是这一步"], "notes": ["修复有两步。第一步，加上 initializer 修饰器，只允许执行一次。", "第二步，在实现合约的构造函数里，调用 disableInitializers，把实现合约本身锁死。", "开头的 Parity 库合约，缺的正是这一步。"], "section": "门没装锁"}, {"seg": "3", "t0": 0.0, "t1": 22.91, "title": "Parity 第一次", "points": ["钱包把不认识的调用用 delegatecall 转给库合约", "库里的 initWallet 没有保护，攻击者设自己为 owner", "2017 年 7 月，约 15.3 万 ETH 被转走，约合 3000 万美元"], "notes": ["其实，Parity 在同一年出过两次事。", "2017 年 7 月那次，钱包合约把不认识的调用，用 delegatecall 转给了库合约。", "库里的 initWallet 没有保护。攻击者通过钱包调用它，把自己设成了 owner。", "约 15.3 万 ETH 被转走，约合 3000 万美元。"], "section": "借出的权限"}, {"seg": "3", "t0": 22.91, "t1": 33.75, "title": "Parity 第二次", "points": ["11 月那次，被接管的是库合约自己，然后它被销毁了", "两次教训相同：实现合约本身也要初始化或锁死"], "notes": ["11 月那次不同。被接管的是库合约自己，然后它被销毁了。", "两次的教训相同：实现合约本身，也要初始化或者锁死。"], "section": "借出的权限"}, {"seg": "3", "t0": 33.75, "t1": 49.69, "title": "四、任意外部调用", "points": ["合约公开 execute，目标地址和调用数据由调用者决定", "假设这个合约持有受害者对某代币的授权"], "notes": ["这就引出第四种缺陷：任意外部调用，和任意 delegatecall。", "一个合约公开了 execute 函数。目标地址和调用数据，全由调用者决定。", "假设这个合约，持有受害者对某个代币的授权。"], "section": "借出的权限"}, {"seg": "3", "t0": 49.69, "t1": 63.15, "title": "借合约之手转走代币", "points": ["攻击者不需要受害者的私钥", "让合约调用 transferFrom，把受害者的币转给自己", "代币看到的调用方是被授权的合约，额度检查通过"], "notes": ["攻击者不需要受害者的私钥。", "他让这个合约去调用代币的 transferFrom，把受害者的币转给自己。", "代币合约看到的调用方，是被授权的合约。额度检查，通过。"], "section": "借出的权限"}, {"seg": "3", "t0": 63.15, "t1": 72.23, "title": "权限不是被偷，是被借走", "points": ["若用的是 delegatecall", "攻击者的代码会直接改写这个合约的存储"], "notes": ["如果这里用的是 delegatecall，攻击者的代码，会直接改写这个合约的存储。", "权限没有被偷，是被借走了。"], "section": "借出的权限"}, {"seg": "3", "t0": 72.23, "t1": 88.81, "title": "五、单步所有权转移", "points": ["填入新地址一步生效，输错就永久丢失权限", "修复：两步转移，新 owner 自己调用 acceptOwnership"], "notes": ["第五种，单步所有权转移。", "owner 填入新地址，一步就生效。地址输错，权限就永久丢失。", "修复是两步转移。新 owner 必须自己调用 acceptOwnership，证明这个地址真的能用。"], "section": "借出的权限"}, {"seg": "3", "t0": 88.81, "t1": 109.29, "title": "六、签名鉴权写错", "points": ["ecrecover 遇到无效签名会返回零地址", "签名人变量未设置，默认值也是零，检查就通过了", "比对前先排除零地址"], "notes": ["第六种，签名鉴权写错。", "用签名代替 msg.sender 时，ecrecover 遇到无效签名，会返回零地址。", "如果被比较的签名人变量没有设置，它的默认值也是零。两边相等，检查就通过了。", "所以比对前，先排除零地址。"], "section": "借出的权限"}, {"seg": "3", "t0": 109.29, "t1": 138.3, "title": "三个容易漏掉的判断", "points": ["代码长度为零不能证明是外部账户（构造函数中的合约）", "renounceOwnership 后无法恢复，先确认没函数依赖它", "0.4 时期构造函数同名，合约改名它就成了公共函数"], "notes": ["最后，还有三个容易漏掉的判断。", "一，代码长度是零，不能证明对方是外部账户。构造函数里发起调用的合约，代码长度也是零。", "二，renounceOwnership 之后，owner 权限无法恢复。先确认没有函数还依赖它。", "三，Solidity 0.4 时期，构造函数和合约同名。合约一改名，旧构造函数就成了公共函数。"], "section": "借出的权限"}, {"seg": "4", "t0": 0.0, "t1": 17.09, "title": "账户本身也有权限", "points": ["以太坊外部账户只有一把私钥", "按 TRON 官方文档和安全公司资料，TRON 账户原生支持多重权限"], "notes": ["前面讲的，都是合约层的权限。账户本身，也有权限。", "以太坊的外部账户，只有一把私钥。", "TRON 不一样。按 TRON 官方文档和安全公司的公开资料，它的账户原生支持多重权限。"], "section": "账户层权限"}, {"seg": "4", "t0": 17.09, "t1": 42.91, "title": "三种权限与阈值", "points": ["Owner 最高，能改其他权限；Active 管日常操作", "Witness 只管超级代表（出块节点）相关操作", "每个地址有权重，加起来达到阈值，操作才执行"], "notes": ["Owner 权限最高，能修改其他权限，包括增删签名人。", "Active 管日常操作，比如转账、质押、调用合约。它可以有多个，每个可以限定操作类型。", "Witness 只管超级代表，也就是出块节点的相关操作。", "每个权限有一组地址，每个地址有权重。", "权重加起来达到阈值，操作才执行。"], "section": "账户层权限"}, {"seg": "4", "t0": 42.91, "t1": 61.87, "title": "多签诈骗三步", "points": ["受害者在假钱包或钓鱼页上泄露私钥", "攻击者把 Owner 和 Active 都改成自己", "受害者能看到余额，但转不出来"], "notes": ["这套设计，被骗子用来做多签诈骗。", "第一步，受害者在假钱包或钓鱼页上，泄露了私钥。", "第二步，攻击者修改账户权限，把 Owner 和 Active 都改成自己。", "第三步，受害者还能看到余额，但已经转不出来。"], "section": "账户层权限"}, {"seg": "4", "t0": 61.87, "t1": 80.03, "title": "看得见、转不走的账户", "points": ["转入不需要签名，新的 USDT 还会继续转进来", "攻击者不急，择机再全部转走", "场外交易中，骗子给出转不走的账户私钥诱导付手续费"], "notes": ["转入不需要签名。新的 USDT，还会继续转进来。", "攻击者不急。账户看起来正常，他择机再全部转走。", "这种骗局，也常见于场外交易。", "骗子给你一个有余额、却转不出来的账户私钥，诱导你付手续费。"], "section": "账户层权限"}, {"seg": "4", "t0": 80.03, "t1": 97.06, "title": "一个地址不等于一把私钥", "points": ["在 TRON 上，这个假设不成立", "不能假设地址由单一私钥控制", "设成 owner 之前，先查它的权限配置"], "notes": ["对合约开发者，这里有一个含义。", "在 TRON 上，一个地址等于一把私钥，这个假设不成立。", "收到一个地址，不能假设它由单一私钥控制。设成 owner 之前，先查它的权限配置。"], "section": "账户层权限"}, {"seg": "5a", "t0": 0.0, "t1": 28.89, "title": "最小权限：拆分角色", "points": ["把一个 owner 拆成几个角色，每个只做一件事", "升级者：多签加时间锁，延迟 48 小时以上", "参数管理员：多签加 24 小时时间锁（示例，非标准）"], "notes": ["知道了门怎么坏，再看钥匙怎么分。", "第一个原则，最小权限。把一个 owner 拆成几个角色，每个角色只做一件事。", "升级者，负责升级实现合约。建议多签加时间锁，延迟 48 小时以上。", "参数管理员，修改费率和抵押率。建议多签加时间锁，延迟 24 小时。", "这两个数字只是示例，不是标准。"], "section": "慢升级快暂停"}, {"seg": "5a", "t0": 28.89, "t1": 37.89, "title": "暂停者与增发者", "points": ["暂停者：小型多签或监控机器人，不加延迟", "增发者：只授予特定的合约"], "notes": ["暂停者，负责紧急暂停。小型多签或监控机器人就够了，不加延迟。", "增发者，只授予特定的合约。"], "section": "慢升级快暂停"}, {"seg": "5a", "t0": 37.89, "t1": 40.95, "title": "先猜一道题", "points": ["为什么暂停要快，升级要慢？"], "notes": ["为什么暂停要快，升级要慢？"], "section": "慢升级快暂停"}, {"seg": "5a", "t0": 40.95, "t1": 46.13, "title": "暂停止损，升级万能", "points": ["暂停只能止损，转不走资金", "升级可以做任何事"], "notes": ["暂停只能止损，转不走资金。升级可以做任何事。"], "section": "慢升级快暂停"}, {"seg": "5a", "t0": 46.13, "t1": 72.67, "title": "多签加时间锁", "points": ["提案者是多签，比如五人中三人签名才能交给时间锁", "操作公开排队如 48 小时，用户可在延迟期内撤出", "守护者能取消但不能发起，权限不对称"], "notes": ["第二个原则，多签加时间锁。", "提案者是一个多签，比如五个人里三人签名，才能把操作交给时间锁。", "时间锁让操作公开排队，比如 48 小时。到期之后，才能执行。", "排队期间，大家都看得到。用户不同意，可以在延迟期内撤出。", "守护者发现恶意操作，可以取消，但不能发起。权限是不对称的。"], "section": "慢升级快暂停"}, {"seg": "5a", "t0": 72.67, "t1": 86.77, "title": "多签的局限", "points": ["多签防的是单个私钥被盗", "签名人看到同一个被篡改的界面，多签挡不住", "阈值要和私钥的独立性相匹配"], "notes": ["这套设计也有局限。", "多签防的是单个私钥被盗。如果所有签名人看到的，是同一个被篡改的界面，多签就挡不住。", "阈值还要和私钥的独立性相匹配。"], "section": "慢升级快暂停"}, {"seg": "5a", "t0": 86.77, "t1": 106.63, "title": "Ronin：9 选 5", "points": ["2022 年 3 月，5 个签名就能放行跨链桥", "攻击者控制 5 把私钥，按公开复盘 4 把属同一机构", "一把来自没撤销的旧授权，损失约 6.2 亿美元"], "notes": ["2022 年 3 月的 Ronin 跨链桥，9 个验证者里，5 个签名就能放行。", "攻击者控制了 5 把私钥。按公开复盘，其中 4 把属于同一家机构。", "还有一把，来自一个早就不需要、却一直没撤销的授权。损失约 6.2 亿美元。"], "section": "慢升级快暂停"}, {"seg": "5a", "t0": 106.63, "t1": 127.19, "title": "付押金当中继者", "points": ["2022 年 10 月 BNB Chain Token Hub", "付 100 BNB 注册中继者，利用证明验证缺陷铸造 200 万 BNB", "Moran 硬分叉把中继者改成白名单"], "notes": ["同年 10 月，BNB Chain 的 Token Hub 出事。", "攻击者付了 100 BNB，注册成跨链中继者，再利用证明验证的缺陷，凭空铸造了 200 万 BNB。", "Moran 硬分叉把中继者改成了白名单。", "只要付押金就能当中继者，这本身就是一个权限决策。"], "section": "慢升级快暂停"}, {"seg": "5a", "t0": 127.19, "t1": 150.3, "title": "谁能升级 L2 的桥", "points": ["谁能升级桥合约，谁就决定跨链资产去向", "L2BEAT 称：Mantle 安全多签 14 人中 6 人可无延迟升级", "这是信任假设，不是代码漏洞，存钱前应知道"], "notes": ["最后看 L2。谁能升级桥合约，谁就决定用户跨链资产的去向。", "根据 L2BEAT 截至 2026 年 11 月的页面，Mantle 的安全多签，14 人里 6 人签名，就能无延迟升级 L1 上的桥。", "这是信任假设，不是代码漏洞。但存钱之前，你应该知道它。"], "section": "慢升级快暂停"}, {"seg": "5b", "t0": 0.0, "t1": 40.15, "title": "每个角色今天做一件事", "points": ["写合约：每个改状态的外部函数，写下谁能调、凭什么安全", "审计：搜 initialize、delegatecall；管私钥：列全特权私钥", "用户：管理员是单个地址即高风险；TRON 不导入他人私钥"], "notes": ["最后，每个人今天就能做一件事。", "写合约的人，列出每个修改状态的外部函数，逐个写下：谁能调用，凭什么安全。", "审计的人，搜一遍 initialize 和 delegatecall。确认实现合约已锁死，目标地址不由用户决定。", "管私钥的人，列出所有特权私钥：谁持有，放在哪，阈值多少，上次撤销是什么时候。", "普通用户，存款前看一眼协议的管理员权限。管理员是单个地址，就是高风险信号。", "在 TRON 上，不导入别人给的私钥，也不签修改账户权限的交易。"], "section": "今天能做什么"}, {"seg": "5b", "t0": 40.15, "t1": 65.19, "title": "一个没人回答过的按钮", "points": ["库合约上的按钮，从来没人回答过谁有权按它", "修复：部署时在构造函数里锁死初始化", "别的按钮也要回答，少一个就是没装锁的门"], "notes": ["回到开头的问题。那个用户没破解任何东西，为什么能冻结约 51 万 ETH？", "因为库合约上有一个按钮，从来没有人回答过：谁有权按它？", "修复是部署时就在构造函数里锁死初始化。", "但这个答案的前提是，合约里别的按钮，也都回答过同一个问题。少一个，就还是一扇没装锁的门。"], "section": "今天能做什么"}]};

  function next() {
    if (playing) { go(cur, 'seek'); return; }
    if (cur === N - 1) { back(); return; }
    go(cur + 1, 'play');
  }
  function prev() { go(cur - 1, 'seek'); }
  function back() {
    if (parent !== window) parent.postMessage({ cexNav: D.chapter }, '*');
    else location.href = '../../index.html#' + D.chapter;
  }
  function fullscreen() {
    var a = $('app');
    if (document.fullscreenElement) document.exitFullscreen(); else if (a.requestFullscreen) a.requestFullscreen().catch(function () {});
  }
  if (!document.fullscreenEnabled) $('fs').hidden = true;

  $('next').onclick = next; $('prev').onclick = prev; $('replay').onclick = function () { go(cur, 'play'); };
  $('back').onclick = back; $('fs').onclick = fullscreen;
  addEventListener('keydown', function (e) {
    if (e.target.tagName === 'SELECT' || e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { e.preventDefault(); next(); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); prev(); }
    else if (k === 'r' || k === 'R') go(cur, 'play');
    else if (k === 'f' || k === 'F') fullscreen();
    else if (k === 'n' || k === 'N') $('notes').open = !$('notes').open;
    else if (k === 'Home') go(0, 'seek');
    else if (k === 'End') go(N - 1, 'seek');
  });
  // tap = next; horizontal swipe = next / previous
  var x0 = null, y0 = null;
  screen.addEventListener('pointerdown', function (e) { x0 = e.clientX; y0 = e.clientY; });
  screen.addEventListener('pointerup', function (e) {
    if (x0 === null) return;
    var dx = e.clientX - x0, dy = e.clientY - y0; x0 = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { dx < 0 ? next() : prev(); }
    else if (Math.abs(dx) < 8 && Math.abs(dy) < 8) next();
  });

  var start = +store.get(KEY); if (!(start >= 0 && start < N)) start = 0;
  go(start, start === 0 ? 'play' : 'seek');
})();
</script>
</body>
