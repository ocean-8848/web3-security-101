<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>上币尽调评分卡</title>
<link rel="stylesheet" href="assets/common.css">
<style>
  .redl { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; padding: 6px 0; border-bottom: 1px dashed var(--border); cursor: pointer; color: var(--text); margin: 0; }
  .redl:last-child { border-bottom: 0; }
  .redl input { margin-top: 4px; accent-color: var(--sell); }
  .redl .d { display: block; font-size: 12.5px; color: var(--text-2); }
  .dim { margin-bottom: 14px; }
  .dim .hd { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .dim .w { font-family: var(--mono); font-size: 12px; color: var(--text-2); }
  .item { padding: 8px 0; border-bottom: 1px dashed var(--border); }
  .item:last-child { border-bottom: 0; }
  .item .nm { font-size: 14px; font-weight: 600; }
  .item .anchor { font-size: 12.5px; color: var(--text-2); min-height: 18px; }
  .verdict { font-size: 26px; font-weight: 750; padding: 6px 18px; border-radius: 10px; display: inline-block; }
  .verdict.ok { background: var(--buy-soft); color: var(--buy); }
  .verdict.cond { background: var(--warn-soft); color: var(--warn); }
  .verdict.hold { background: var(--accent-soft); color: var(--accent); }
  .verdict.no { background: var(--sell-soft); color: var(--sell); }
  .bar { height: 8px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  textarea { font: inherit; width: 100%; min-height: 170px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: var(--mono); font-size: 12px; }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <a class="back" href="index.html">← 交互实验目录</a>
    <h1>上币尽调评分卡</h1>
  </header>
  <p class="lead">先过红线，再给四个维度打分（0–4），得到综合分与建议结论。权重和锚点是示例，请按自己的上币层级固定下来。配套章节：<a href="../assessment/A05-listing-due-diligence.md">A05 上币与合作项目尽调</a> ｜ 模板：<a href="../templates/T05-listing-dd-questionnaire.md">T05 问卷</a>。</p>

  <h2>1. 红线检查</h2>
  <div class="card" id="reds"></div>

  <h2>2. 四维打分</h2>
  <div class="card" id="dims"></div>

  <h2>3. 结论</h2>
  <div class="grid cols-2">
    <div class="card">
      <div><span class="verdict" id="verdict">—</span></div>
      <p class="small muted" id="why">完成红线检查与打分后给出建议。</p>
      <div class="stat"><span class="k">综合分（满分 100）</span><span class="v" id="total">—</span></div>
      <div class="bar"><i id="barfill" style="width:0"></i></div>
      <div id="dimscore" class="small" style="margin-top:10px"></div>
    </div>
    <div class="card">
      <label for="proj">项目名称</label>
      <input type="text" id="proj" placeholder="例如：XYZ Token">
      <textarea id="out" readonly></textarea>
      <div class="btn-row"><button id="copy">复制 Markdown</button></div>
    </div>
  </div>

  <footer class="note">本页仅用于学习，评分规则为示例。红线优先于分数；任何结论都需要链上证据支持。</footer>
</div>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const REDS = [
    ['可无限增发且无时间锁', '读 mint 权限；检查 owner / minter'],
    ['貔貅盘（能买不能卖）', '分叉环境模拟买卖；检查转账税、黑名单、暂停'],
    ['owner 可暂停/冻结任意地址', '包括交易所热钱包'],
    ['隐藏的所有权转移或升级后门', '审代理、delegatecall、未初始化'],
    ['升级权为单签 EOA 且无延迟', '读实现槽、admin 槽、权限'],
    ['锁仓/流动性锁是假的', '核验锁仓合约、解锁时间、LP 是否真锁'],
    ['合约地址与官网/审计报告不一致', '逐一核对地址'],
    ['链上字节码与已验证源码不一致', '浏览器验证状态；比对字节码']
  ];
  const DIMS = [
    ['合约权限', 30, [
      ['升级权限持有方', ['单签 EOA，可无延迟升级', '单签多方，或时间锁 <24h', '多签无时间锁，或时间锁较短', '多签 + 时间锁 ≥48h', '不可升级，或升级权已放弃']],
      ['增发 / 暂停 / 冻结权限', ['存在且为单签 EOA', '存在，权限集中', '存在，多签', '存在，多签 + 时间锁 + 上限', '不存在']]
    ]],
    ['链上数据', 25, [
      ['部署时长与历史', ['刚部署几天', '数周', '数月', '半年以上', '长期运行且无异常']],
      ['持仓集中度', ['前 10 地址占比极高', '较高', '中等', '较分散', '分散且多为真实用户']],
      ['流动性深度与锁定', ['极浅或未锁', '较浅', '中等', '较深且部分锁定', '深且锁定可验证']]
    ]],
    ['团队与运营', 25, [
      ['团队身份与可追责性', ['匿名且无历史', '匿名有历史', '部分公开', '公开可验证', '公开且有信誉背书']],
      ['审计质量', ['无审计', '审计版本不符或范围小', '单家审计', '多家或含复审', '多家 + 复审 + 赏金计划']],
      ['密钥与运营安全（问卷）', ['答不上来/无措施', '单点管理', '多签但流程不明', '多签 + 独立解码 + 终端隔离', '另有带外确认与演练']]
    ]],
    ['经济模型', 20, [
      ['代币分配与解锁', ['团队占比极高且即时解锁', '较高', '合理', '合理且长线性解锁', '合理、公开、锁仓可验证']],
      ['收益来源可持续性', ['依赖新资金/庞氏结构', '高度反身性', '部分可持续', '主要来自真实收入', '真实收入且有风险缓冲']]
    ]]
  ];
  $('reds').innerHTML = REDS.map((r, i) => '<label class="redl"><input type="checkbox" class="red" data-i="' + i + '"><span><strong>' + r[0] + '</strong><span class="d">' + r[1] + '</span></span></label>').join('');
  $('dims').innerHTML = DIMS.map((d, di) => '<div class="dim"><div class="hd"><h3 style="margin:0">' + d[0] + '</h3><span class="w">权重 ' + d[1] + '%</span></div>' + d[2].map((it, ii) =>
    '<div class="item"><div class="nm">' + it[0] + '</div><input type="range" min="0" max="4" step="1" value="2" data-d="' + di + '" data-i="' + ii + '" class="sc"> <div class="anchor"></div></div>').join('') + '</div>').join('');
  function compute() {
    const reds = [...document.querySelectorAll('.red:checked')].map(x => REDS[+x.dataset.i][0]);
    const dimScores = DIMS.map((d, di) => {
      const sl = [...document.querySelectorAll('.sc[data-d="' + di + '"]')];
      sl.forEach(s => { s.parentElement.querySelector('.anchor').textContent = s.value + ' 分：' + DIMS[di][2][+s.dataset.i][1][+s.value]; });
      return sl.reduce((a, s) => a + +s.value, 0) / (sl.length * 4);
    });
    const total = Math.round(DIMS.reduce((a, d, i) => a + d[1] * dimScores[i], 0));
    let cls, label, why;
    if (reds.length) { cls = 'no'; label = '否决'; why = '命中红线：' + reds.join('、') + '。红线优先于分数。'; }
    else if (total >= 75) { cls = 'ok'; label = '可上线'; why = '高分且无红线。仍建议持续监控权限变更。'; }
    else if (total >= 55) { cls = 'cond'; label = '附条件'; why = '中分：限额、观察区、加强监控，要求补审计或锁仓。'; }
    else { cls = 'hold'; label = '暂缓'; why = '低分：列出需补充的材料与整改项后再评估。'; }
    $('verdict').textContent = label; $('verdict').className = 'verdict ' + cls; $('why').textContent = why;
    $('total').textContent = total; $('barfill').style.width = total + '%';
    $('dimscore').innerHTML = DIMS.map((d, i) => d[0] + '：' + Math.round(dimScores[i] * 100) + '%').join(' ｜ ');
    const p = $('proj').value.trim() || '（项目名称）';
    $('out').value = '## 上币尽调：' + p + '\n\n- 结论：' + label + '\n- 综合分：' + total + ' / 100\n- 红线：' + (reds.length ? reds.join('；') : '未命中') + '\n' +
      DIMS.map((d, i) => '- ' + d[0] + '（' + d[1] + '%）：' + Math.round(dimScores[i] * 4 * 10) / 10 + ' / 4').join('\n') + '\n- 理由：' + why + '\n- 上线条件：\n- 证据附录：链上地址、权限读数、持仓、问卷\n';
  }
  document.addEventListener('input', compute); document.addEventListener('change', compute);
  $('copy').addEventListener('click', () => { $('out').select(); try { navigator.clipboard.writeText($('out').value); } catch (e) { document.execCommand('copy'); } });
  compute();
})();
</script>
<script>
/* 在单文件阅读版（handbook.html）的 iframe 中打开时，把章节链接交给外层阅读器处理 */
(function () {
  if (window.parent === window) return;
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href]');
    if (!a) return;
    var h = a.getAttribute('href');
    if (/\.md(#|$)/.test(h)) { e.preventDefault(); window.parent.postMessage({ cexNavMd: h }, '*'); }
  });
})();
</script>
</body>
</html>
