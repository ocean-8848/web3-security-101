    bank.withdraw();\n    }\n\n    receive() external payable {\n        // 只要银行还有钱，就再进入一次 withdraw()\n        if (address(bank).balance &gt;= msg.value &amp;&amp; msg.value &gt; 0) {\n            bank.withdraw();\n        }\n    }\n\n    function collect() external {\n        require(msg.sender == owner, &quot;owner only&quot;);\n        (bool ok, ) = owner.call{value: address(this).balance}(&quot;&quot;);\n        require(ok, &quot;collect failed&quot;);\n    }\n}\n\n/// @notice 最小重入锁（与 OpenZeppelin ReentrancyGuard 原理相同）\nabstract contract SimpleReentrancyGuard {\n    uint256 private _status = 1; // 1 = 未进入，2 = 已进入\n\n    modifier nonReentrant() {\n        require(_status == 1, &quot;reentrant call&quot;);\n        _status = 2;\n        _;\n        _status = 1;\n    }\n}\n\n/// @notice ✅ 修复版：CEI + 所有共享状态的入口共用同一把锁\ncontract SafeBank is SimpleReentrancyGuard {\n    mapping(address =&gt; uint256) public balances;\n\n    function deposit() external payable nonReentrant {\n        balances[msg.sender] += msg.value;\n    }\n\n    // ✅ 修复：Checks → Effects → Interactions\n    function withdraw() external nonReentrant {\n        uint256 amt = balances[msg.sender];          // Checks\n        require(amt &gt; 0, &quot;no balance&quot;);\n        balances[msg.sender] = 0;                    // Effects\n        (bool ok, ) = msg.sender.call{value: amt}(&quot;&quot;); // Interactions\n        require(ok, &quot;send failed&quot;);\n    }\n\n    // ✅ 修复：transfer 也加同一把锁，防止跨函数重入\n    function transfer(address to, uint256 amt) external nonReentrant {\n        require(balances[msg.sender] &gt;= amt, &quot;insufficient&quot;);\n        balances[msg.sender] -= amt;\n        balances[to] += amt;\n    }\n}\n<\/code><\/pre><\/div>\n<h3>02-AccessControl.sol<\/h3>\n<div class=\"code-wrap\"><pre><code class=\"language-solidity\">// SPDX-License-Identifier: MIT\n// 配套章节：04 访问控制与权限\n// 仅用于学习。不要部署到主网。\npragma solidity ^0.8.20;\n\n/// @notice ❌ 漏洞版：集中展示四种常见权限缺陷\ncontract VulnerableWallet {\n    address public owner;\n    bool private initialized;\n\n    // ❌ 漏洞 1：初始化函数没有保护，部署后任何人都能抢先调用；且可重复调用\n    function initWallet(address _owner) external {\n        owner = _owner;\n        initialized = true;\n    }\n\n    // ❌ 漏洞 2：用 tx.origin 鉴权。owner 调用恶意合约时，恶意合约可以冒充 owner\n    function withdrawAll(address payable to) external {\n        require(tx.origin == owner, &quot;not owner&quot;);\n        to.transfer(address(this).balance);\n    }\n\n    // ❌ 漏洞 3：任意外部调用。若本合约持有代币授权，攻击者可构造 transferFrom\n    function execute(address target, bytes calldata data) external returns (bytes memory) {\n        (bool ok, bytes memory ret) = target.call(data);\n        require(ok, &quot;call failed&quot;);\n        return ret;\n    }\n\n    // ❌ 漏洞 4：单步转移所有权。输错地址则权限永久丢失\n    function transferOwnership(address newOwner) external {\n        require(msg.sender == owner, &quot;not owner&quot;);\n        owner = newOwner;\n    }\n\n    receive() external payable {}\n}\n\n/// @notice 极简的一次性初始化修饰器（与 OpenZeppelin Initializable 原理相同）\nabstract contract SimpleInitializable {\n    bool private _initialized;\n\n    modifier initializer() {\n        require(!_initialized, &quot;already initialized&quot;);\n        _initialized = true;\n        _;\n    }\n\n    /// @dev 实现合约在构造函数里调用，锁死实现合约本身\n    function _disableInitializers() internal {\n        _initialized = true;\n    }\n}\n\n/// @notice ✅ 修复版\ncontract SafeWallet is SimpleInitializable {\n    address public owner;\n    address public pendingOwner;\n    mapping(address =&gt; bool) public allowedTargets; // ✅ 调用目标白名单\n\n    event OwnershipTransferStarted(address indexed from, address indexed to);\n    event OwnershipTransferred(address indexed from, address indexed to);\n\n    modifier onlyOwner() {\n        require(msg.sender == owner, &quot;not owner&quot;); // ✅ 使用 msg.sender\n        _;\n    }\n\n    constructor() {\n        _disableInitializers(); // ✅ 作为实现合约时，自身不可被初始化\n    }\n\n    // ✅ 只能调用一次；代理部署时应在同一笔交易里调用\n    function initialize(address _owner) external initializer {\n        require(_owner != address(0), &quot;zero owner&quot;);\n        owner = _owner;\n    }\n\n    function withdrawAll(address payable to) external onlyOwner {\n        (bool ok, ) = to.call{value: address(this).balance}(&quot;&quot;);\n        require(ok, &quot;send failed&quot;);\n    }\n\n    function setAllowedTarget(address target, bool allowed) external onlyOwner {\n        allowedTargets[target] = allowed;\n    }\n\n    // ✅ 只有 owner 能调用，且目标必须在白名单中\n    function execute(address target, bytes calldata data) external onlyOwner returns (bytes memory) {\n        require(allowedTargets[target], &quot;target not allowed&quot;);\n        (bool ok, bytes memory ret) = target.call(data);\n        require(ok, &quot;call failed&quot;);\n        return ret;\n    }\n\n    // ✅ 两步转移所有权\n    function transferOwnership(address newOwner) external onlyOwner {\n        pendingOwner = newOwner;\n        emit OwnershipTransferStarted(owner, newOwner);\n    }\n\n    function acceptOwnership() external {\n        require(msg.sender == pendingOwner, &quot;not pending owner&quot;);\n        emit OwnershipTransferred(owner, pendingOwner);\n        owner = pendingOwner;\n        pendingOwner = address(0);\n    }\n\n    receive() external payable {}\n}\n<\/code><\/pre><\/div>\n<h3>03-VaultInflation.sol<\/h3>\n<div class=\"code-wrap\"><pre><code class=\"language-solidity\">// SPDX-License-Identifier: MIT\n// 配套章节：05 算术与精度 ｜ 交互实验：interactive/vault-inflation-lab.html\n// 仅用于学习。不要部署到主网。\npragma solidity ^0.8.20;\n\ninterface IERC20Min {\n    function transfer(address to, uint256 amt) external returns (bool);\n    function transferFrom(address from, address to, uint256 amt) external returns (bool);\n    function balanceOf(address who) external view returns (uint256);\n}\n\n/// @notice ❌ 漏洞版：份额价格读取 balanceOf，空金库可被&quot;捐赠&quot;抬价\ncontract NaiveVault {\n    IERC20Min public immutable asset;\n    uint256 public totalSupply;\n    mapping(address =&gt; uint256) public sharesOf;\n\n    constructor(IERC20Min _asset) { asset = _asset; }\n\n    // ❌ 漏洞：totalAssets 可被任何人直接转账改变\n    function totalAssets() public view returns (uint256) {\n        return asset.balanceOf(address(this));\n    }\n\n    function deposit(uint256 assets) external returns (uint256 shares) {\n        uint256 ta = totalAssets();\n        // ❌ 空金库时 1:1；之后按比例向下取整，可能得到 0 份额，且没有检查\n        shares = totalSupply == 0 ? assets : assets * totalSupply / ta;\n        require(asset.transferFrom(msg.sender, address(this), assets), &quot;transferFrom&quot;);\n        totalSupply += shares;\n        sharesOf[msg.sender] += shares;\n    }\n\n    function redeem(uint256 shares) external returns (uint256 assets) {\n        assets = shares * totalAssets() / totalSupply; // 向下取整：对协议有利\n        sharesOf[msg.sender] -= shares;\n        totalSupply -= shares;\n        require(asset.transfer(msg.sender, assets), &quot;transfer&quot;);\n    }\n}\n\n/// @notice ✅ 修复版：虚拟份额 + 偏移（OpenZeppelin ERC4626 ≥ 4.9 的思路）+ 最小输出检查\ncontract OffsetVault {\n    IERC20Min public immutable asset;\n    uint8 public immutable decimalsOffset; // 例如 3 或 6\n    uint256 public totalSupply;\n    mapping(address =&gt; uint256) public sharesOf;\n\n    constructor(IERC20Min _asset, uint8 _offset) {\n        asset = _asset;\n        decimalsOffset = _offset;\n    }\n\n    function totalAssets() public view returns (uint256) {\n        return asset.balanceOf(address(this));\n    }\n\n    // ✅ shares = assets × (supply + 10^offset) / (assets_total + 1)，向下取整\n    function previewDeposit(uint256 assets) public view returns (uint256) {\n        return mulDivDown(assets, totalSupply + 10 ** decimalsOffset, totalAssets() + 1);\n    }\n\n    // ✅ assets = shares × (assets_total + 1) / (supply + 10^offset)，向下取整\n    function previewRedeem(uint256 shares) public view returns (uint256) {\n        return mulDivDown(shares, totalAssets() + 1, totalSupply + 10 ** decimalsOffset);\n    }\n\n    // ✅ 用户提供最小份额，防止被抢跑后得到 0 份额\n    function deposit(uint256 assets, uint256 minShares) external returns (uint256 shares) {\n        shares = previewDeposit(assets);\n        require(shares &gt; 0 &amp;&amp; shares &gt;= minShares, &quot;slippage: shares too low&quot;);\n        require(asset.transferFrom(msg.sender, address(this), assets), &quot;transferFrom&quot;);\n        totalSupply += shares;\n        sharesOf[msg.sender] += shares;\n    }\n\n    function redeem(uint256 shares, uint256 minAssets) external returns (uint256 assets) {\n        assets = previewRedeem(shares);\n        require(assets &gt;= minAssets, &quot;slippage: assets too low&quot;);\n        sharesOf[msg.sender] -= shares;\n        totalSupply -= shares;\n        require(asset.transfer(msg.sender, assets), &quot;transfer&quot;);\n    }\n\n    /// @dev 简化版 mulDiv：示例中假设 a*b 不溢出；生产环境请用 OpenZeppelin Math.mulDiv\n    function mulDivDown(uint256 a, uint256 b, uint256 d) internal pure returns (uint256) {\n        return a * b / d;\n    }\n}\n<\/code><\/pre><\/div>\n<h3>04-SpotOracle.sol<\/h3>\n<div class=\"code-wrap\"><pre><code class=\"language-solidity\">// SPDX-License-Identifier: MIT\n// 配套章节：07 预言机与闪电贷 ｜ 交互实验：interactive/oracle-manipulation-lab.html\n// 仅用于学习。不要部署到主网。\npragma solidity ^0.8.20;\n\ninterface IPairLike {\n    function getReserves() external view returns (uint112 r0, uint112 r1, uint32 ts);\n}\n\n/// @dev Chainlink 风格聚合器接口（仅列出示例需要的函数）\ninterface IAggregatorLike {\n    function decimals() external view returns (uint8);\n    function latestRoundData()\n        external\n        view\n        returns (uint80 roundId, int256 answer, uint256 startedAt, uint256 updatedAt, uint80 answeredInRound);\n}\n\n/// @notice ❌ 漏洞版：用 AMM 储备比例作为抵押品价格\ncontract SpotPriceLending {\n    IPairLike public immutable pair; // token0 = 抵押代币，token1 = 稳定币（均 18 位，示例）\n    uint256 public constant LTV_BPS = 7_500; // 75%（示例）\n\n    constructor(IPairLike _pair) { pair = _pair; }\n\n    // ❌ 漏洞：一笔交易内可被闪电贷任意改写\n    function collateralPrice() public view returns (uint256) {\n        (uint112 r0, uint112 r1, ) = pair.getReserves();\n        return uint256(r1) * 1e18 / uint256(r0);\n    }\n\n    function maxBorrow(uint256 collateralAmt) public view returns (uint256) {\n        return collateralAmt * collateralPrice() / 1e18 * LTV_BPS / 10_000;\n    }\n}\n\n/// @notice ✅ 修复版：链下聚合喂价 + 完整检查；L2 上额外检查排序器状态\ncontract FeedPriceLending {\n    IAggregatorLike public immutable priceFeed;\n    IAggregatorLike public immutable sequencerUptimeFeed; // L1 上部署时传 address(0)\n    uint256 public immutable maxDelay;      // 按喂价心跳设置，例如 3600 秒（示例）\n    uint256 public immutable minPrice;      // 熔断下限（与喂价精度一致）\n    uint256 public immutable maxPrice;      // 熔断上限\n    uint256 public constant GRACE_PERIOD = 3600; // 排序器恢复后的宽限期（示例）\n    uint256 public constant LTV_BPS = 7_500;\n\n    constructor(\n        IAggregatorLike _feed,\n        IAggregatorLike _uptime,\n        uint256 _maxDelay,\n        uint256 _minPrice,\n        uint256 _maxPrice\n    ) {\n        priceFeed = _feed;\n        sequencerUptimeFeed = _uptime;\n        maxDelay = _maxDelay;\n        minPrice = _minPrice;\n        maxPrice = _maxPrice;\n    }\n\n    /// @return price 18 位精度的价格\n    function collateralPrice() public view returns (uint256 price) {\n        // ✅ L2：排序器宕机或刚恢复时拒绝使用价格（Mantle 等 L2 部署时启用）\n        if (address(sequencerUptimeFeed) != address(0)) {\n            (, int256 status, uint256 startedAt, , ) = sequencerUptimeFeed.latestRoundData();\n            require(status == 0, &quot;sequencer down&quot;);              // 0 = 在线\n            require(block.timestamp - startedAt &gt; GRACE_PERIOD, &quot;grace period&quot;);\n        }\n\n        (, int256 answer, , uint256 updatedAt, ) = priceFeed.latestRoundData();\n        require(answer &gt; 0, &quot;invalid price&quot;);                               // ✅ 正值\n        require(block.timestamp - updatedAt &lt;= maxDelay, &quot;stale price&quot;);    // ✅ 时效\n        uint256 p = uint256(answer);\n        require(p &gt; minPrice &amp;&amp; p &lt; maxPrice, &quot;price at circuit bound&quot;);    // ✅ 未触及熔断上下限\n        uint8 dec = priceFeed.decimals();                                   // ✅ 不写死 8\n        price = dec &lt;= 18 ? p * 10 ** (18 - dec) : p / 10 ** (dec - 18);\n    }\n\n    function maxBorrow(uint256 collateralAmt) public view returns (uint256) {\n        return collateralAmt * collateralPrice() / 1e18 * LTV_BPS / 10_000;\n    }\n}\n<\/code><\/pre><\/div>\n<h3>05-SafeTokenOps.sol<\/h3>\n<div class=\"code-wrap\"><pre><code class=\"language-solidity\">// SPDX-License-Identifier: MIT\n// 配套章节：06 外部调用与代币兼容性、chains/C02 TRON\n// 仅用于学习。不要部署到主网。\npragma solidity ^0.8.20;\n\ninterface IERC20Min {\n    function transfer(address to, uint256 amt) external returns (bool);\n    function transferFrom(address from, address to, uint256 amt) external returns (bool);\n    function balanceOf(address who) external view returns (uint256);\n}\n\n/// @notice 安全代币操作库：覆盖&quot;无返回值&quot;&quot;返回 false 但成功（TRON USDT）&quot;&quot;目标无代码&quot;三种情况\nlibrary SafeTokenOps {\n    error CallFailed();\n    error NoCode();\n    error ReturnedFalse();\n    error NotCredited(uint256 expected, uint256 actual);\n\n    /// @dev 以太坊风格：兼容&quot;不返回值&quot;的代币（如以太坊 USDT），并拒绝无代码地址（Qubit 教训）\n    function safeTransferFrom(IERC20Min token, address from, address to, uint256 amt) internal {\n        _callOptionalReturn(token, abi.encodeCall(IERC20Min.transferFrom, (from, to, amt)));\n    }\n\n    function safeTransfer(IERC20Min token, address to, uint256 amt) internal {\n        _callOptionalReturn(token, abi.encodeCall(IERC20Min.transfer, (to, amt)));\n    }\n\n    function _callOptionalReturn(IERC20Min token, bytes memory data) private {\n        // ✅ 无代码地址的低级调用会&quot;成功&quot;，必须显式检查\n        if (address(token).code.length == 0) revert NoCode();\n        (bool ok, bytes memory ret) = address(token).call(data);\n        if (!ok) revert CallFailed();\n        // ✅ 有返回值时必须为 true；无返回值视为成功（兼容非标准代币）\n        if (ret.length &gt; 0 &amp;&amp; !abi.decode(ret, (bool))) revert ReturnedFalse();\n    }\n\n    /// @dev TRON USDT 推送：成功时也可能返回 false，因此忽略返回值，改用接收方余额差判断\n    ///      假设：代币未开启转账手续费。若开启，本函数会回滚（选择&quot;失败即回滚&quot;策略）。\n    function balanceCheckedTransfer(IERC20Min token, address to, uint256 amt) internal {\n        if (address(token).code.length == 0) revert NoCode();\n        uint256 before = token.balanceOf(to);\n        (bool ok, ) = address(token).call(abi.encodeCall(IERC20Min.transfer, (to, amt)));\n        if (!ok) revert CallFailed();\n        uint256 credited = token.balanceOf(to) - before;\n        if (credited != amt) revert NotCredited(amt, credited);\n    }\n\n    /// @dev 拉取并按实收金额记账：兼容收税代币。调用方必须加重入锁。\n    function pullReceived(IERC20Min token, address from, uint256 amt) internal returns (uint256 received) {\n        uint256 before = token.balanceOf(address(this));\n        safeTransferFrom(token, from, address(this), amt);\n        received = token.balanceOf(address(this)) - before;\n    }\n}\n\n/// @notice 演示：一个可以在以太坊和 TRON 上使用不同推送策略的金库\ncontract MultiChainVault {\n    using SafeTokenOps for IERC20Min;\n\n    IERC20Min public immutable token;\n    bool public immutable useBalanceCheckForPush; // TRON USDT 部署时设为 true\n    mapping(address =&gt; uint256) public deposits;\n    uint256 private _lock = 1;\n\n    modifier nonReentrant() {\n        require(_lock == 1, &quot;reentrant&quot;);\n        _lock = 2;\n        _;\n        _lock = 1;\n    }\n\n    constructor(IERC20Min _token, bool _useBalanceCheckForPush) {\n        token = _token;\n        useBalanceCheckForPush = _useBalanceCheckForPush;\n    }\n\n    function deposit(uint256 amt) external nonReentrant {\n        uint256 received = token.pullReceived(msg.sender, amt); // ✅ 按实收记账\n        deposits[msg.sender] += received;\n    }\n\n    function withdraw(uint256 amt) external nonReentrant {\n        deposits[msg.sender] -= amt; // ✅ 先改状态（0.8 下不足会回滚）\n        if (useBalanceCheckForPush) {\n            token.balanceCheckedTransfer(msg.sender, amt); // ✅ TRON USDT\n        } else {\n            token.safeTransfer(msg.sender, amt);           // ✅ EVM 链\n        }\n    }\n}\n<\/code><\/pre><\/div>\n<h3>06-SignatureReplay.sol<\/h3>\n<div class=\"code-wrap\"><pre><code class=\"language-solidity\">// SPDX-License-Identifier: MIT\n// 配套章节：08 MEV 与签名安全 ｜ 交互实验：interactive/signature-replay-lab.html\n// 仅用于学习。不要部署到主网。\npragma solidity ^0.8.20;\n\n/// @notice ❌ 漏洞版：签名只绑定 (to, amount)\ncontract VulnerableClaim {\n    address public signer; // ❌ 若忘记初始化则为 address(0)\n    mapping(bytes32 =&gt; bool) public usedSig;\n\n    constructor(address _signer) { signer = _signer; }\n\n    function claim(address to, uint256 amount, uint8 v, bytes32 r, bytes32 s) external {\n        // ❌ 无 nonce、无 chainId、无合约地址、无 deadline、无函数意图\n        bytes32 h = keccak256(abi.encodePacked(to, amount));\n        bytes32 digest = keccak256(abi.encodePacked(&quot;\\x19Ethereum Signed Message:\\n32&quot;, h));\n        // ❌ 以签名字节作为已使用标记：翻转 s 值即可得到&quot;新&quot;签名（可塑性）\n        bytes32 sigId = keccak256(abi.encodePacked(v, r, s));\n        require(!usedSig[sigId], &quot;used&quot;);\n        usedSig[sigId] = true;\n        // ❌ 无效签名时 ecrecover 返回 address(0)；若 signer 也为 0 则通过\n        require(ecrecover(digest, v, r, s) == signer, &quot;bad sig&quot;);\n        payable(to).transfer(amount);\n    }\n\n    receive() external payable {}\n}\n\n/// @notice ✅ 修复版：EIP-712 域分隔符 + typehash + nonce + deadline + 低 s 检查\ncontract SafeClaim {\n    bytes32 private constant DOMAIN_TYPEHASH =\n        keccak256(&quot;EIP712Domain(string name,string version,uint256 chainId,address verifyingContract)&quot;);\n    bytes32 public constant CLAIM_TYPEHASH =\n        keccak256(&quot;Claim(address to,uint256 amount,uint256 nonce,uint256 deadline)&quot;);\n    // secp256k1 曲线阶 n 的一半：s 必须 ≤ 该值（拒绝高 s，消除可塑性）\n    uint256 private constant HALF_N =\n        0x7FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF5D576E7357A4501DDFE92F46681B20A0;\n\n    address public immutable signer;\n    uint256 private immutable cachedChainId;\n    bytes32 private immutable cachedDomainSeparator;\n    mapping(address =&gt; uint256) public nonces;\n\n    constructor(address _signer) {\n        require(_signer != address(0), &quot;zero signer&quot;); // ✅\n        signer = _signer;\n        cachedChainId = block.chainid;\n        cachedDomainSeparator = _buildDomainSeparator();\n    }\n\n    function _buildDomainSeparator() private view returns (bytes32) {\n        return keccak256(abi.encode(\n            DOMAIN_TYPEHASH, keccak256(&quot;SafeClaim&quot;), keccak256(&quot;1&quot;), block.chainid, address(this)));\n    }\n\n    /// @dev ✅ 链分叉后 chainid 变化时重新计算，防止分叉链重放\n    function domainSeparator() public view returns (bytes32) {\n        return block.chainid == cachedChainId ? cachedDomainSeparator : _buildDomainSeparator();\n    }\n\n    function claim(address to, uint256 amount, uint256 deadline, uint8 v, bytes32 r, bytes32 s) external {\n        require(block.timestamp &lt;= deadline, &quot;expired&quot;);                           // ✅ deadline\n        bytes32 structHash = keccak256(abi.encode(CLAIM_TYPEHASH, to, amount, nonces[to], deadline));\n        bytes32 digest = keccak256(abi.encodePacked(&quot;\\x19\\x01&quot;, domainSeparator(), structHash));\n        require(uint256(s) &lt;= HALF_N, &quot;high s&quot;);                                   // ✅ 可塑性\n        require(v == 27 || v == 28, &quot;bad v&quot;);\n        address recovered = ecrecover(digest, v, r, s);\n        require(recovered != address(0) &amp;&amp; recovered == signer, &quot;bad sig&quot;);        // ✅ 零地址\n        nonces[to]++;                                                              // ✅ nonce（先改状态）\n        (bool ok, ) = payable(to).call{value: amount}(&quot;&quot;);\n        require(ok, &quot;send failed&quot;);\n    }\n\n    receive() external payable {}\n}\n<\/code><\/pre><\/div>\n<h3>07-ProxyStorage.sol<\/h3>\n<div class=\"code-wrap\"><pre><code class=\"language-solidity\">// SPDX-License-Identifier: MIT\n// 配套章节：02 EVM 基础、09 可升级合约与代理 ｜ 交互实验：interactive/storage-proxy-lab.html\n// 仅用于学习。不要部署到主网。\npragma solidity ^0.8.20;\n\n/// @notice ❌ 朴素代理：implementation 放在 slot 0，与实现合约的第一个变量冲突\ncontract NaiveProxy {\n    address public implementation; // slot 0 ❌\n\n    constructor(address impl) { implementation = impl; }\n\n    fallback() external payable {\n        address impl = implementation;\n        assembly {\n            calldatacopy(0, 0, calldatasize())\n            let ok := delegatecall(gas(), impl, 0, calldatasize(), 0, 0)\n            returndatacopy(0, 0, returndatasize())\n            switch ok case 0 { revert(0, returndatasize()) } default { return(0, returndatasize()) }\n        }\n    }\n}\n\n/// @notice ✅ EIP-1967 代理：实现地址存放在伪随机槽位\ncontract EIP1967Proxy {\n    // bytes32(uint256(keccak256(&quot;eip1967.proxy.implementation&quot;)) - 1)\n    bytes32 internal constant IMPLEMENTATION_SLOT =\n        0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc;\n    // bytes32(uint256(keccak256(&quot;eip1967.proxy.admin&quot;)) - 1)\n    bytes32 internal constant ADMIN_SLOT =\n        0xb53127684a568b3173ae13b9f8a6016e243e63b6e8ee1178d6a717850b5d6103;\n\n    /// @param initData 部署时同一笔交易内调用 initialize，防止被抢跑\n    constructor(address impl, address admin, bytes memory initData) {\n        assembly {\n            sstore(IMPLEMENTATION_SLOT, impl)\n            sstore(ADMIN_SLOT, admin)\n        }\n        if (initData.length &gt; 0) {\n            (bool ok, ) = impl.delegatecall(initData);\n            require(ok, &quot;init failed&quot;);\n        }\n    }\n\n    function _admin() internal view returns (address a) {\n        assembly { a := sload(ADMIN_SLOT) }\n    }\n\n    function _impl() internal view returns (address i) {\n        assembly { i := sload(IMPLEMENTATION_SLOT) }\n    }\n\n    /// @dev 透明代理的简化：只有 admin 能升级，且 admin 的调用不转发\n    function upgradeTo(address newImpl) external {\n        require(msg.sender == _admin(), &quot;not admin&quot;);\n        require(newImpl.code.length &gt; 0, &quot;not a contract&quot;);\n        assembly { sstore(IMPLEMENTATION_SLOT, newImpl) }\n    }\n\n    fallback() external payable {\n        require(msg.sender != _admin(), &quot;admin cannot fallback&quot;);\n        address impl = _impl();\n        assembly {\n            calldatacopy(0, 0, calldatasize())\n            let ok := delegatecall(gas(), impl, 0, calldatasize(), 0, 0)\n            returndatacopy(0, 0, returndatasize())\n            switch ok case 0 { revert(0, returndatasize()) } default { return(0, returndatasize()) }\n        }\n    }\n}\n\n/// @notice 实现 V1\ncontract BankV1 {\n    address public owner;                        // slot 0\n    uint256 public totalDeposits;                // slot 1\n    mapping(address =&gt; uint256) public balances; // slot 2\n    bool private initialized;                    // slot 3\n\n    function initialize(address _owner) external {\n        require(!initialized, &quot;initialized&quot;);\n        initialized = true;\n        owner = _owner;\n    }\n\n    function deposit() external payable {\n        balances[msg.sender] += msg.value;\n        totalDeposits += msg.value;\n    }\n}\n\n/// @notice ❌ V2 错误升级：在最前面插入一个 uint256，全部槽位错位\n/// @dev 注意：如果插入的是 bool，它会和 owner 打包进 slot 0，错位方式不同（owner 的字节被平移）。\n///      用 `forge inspect` 或 solc 的 storageLayout 输出确认，而不是靠肉眼数。\ncontract BankV2Broken {\n    uint256 public feeBps;                       // slot 0 ❌ 读到的是旧 owner 地址（被当作整数）\n    address public owner;                        // slot 1 ❌ 读到的是 totalDeposits 的低 20 字节\n    uint256 public totalDeposits;                // slot 2 ❌ 读到的是 mapping 占位槽（恒为 0）\n    mapping(address =&gt; uint256) public balances; // slot 3 ❌ 映射基址变化，所有余额&quot;消失&quot;\n}\n\n/// @notice ✅ V2 正确升级：只在末尾追加\ncontract BankV2Good {\n    address public owner;                        // slot 0\n    uint256 public totalDeposits;                // slot 1\n    mapping(address =&gt; uint256) public balances; // slot 2\n    bool private initialized;                    // slot 3\n    bool public paused;                          // slot 3（与 initialized 打包，二者都是 1 字节）✅ 追加\n    uint256[49] private __gap;                   // ✅ 为未来升级预留槽位\n}\n<\/code><\/pre><\/div>\n<h3>08-RouterCallback.sol<\/h3>\n<div class=\"code-wrap\"><pre><code class=\"language-solidity\">// SPDX-License-Identifier: MIT\n// 配套章节：chains/C00 以太坊 4.7 节（Sushi RouteProcessor2）、04 访问控制、06 外部调用\n// 仅用于学习。不要部署到主网。\npragma solidity ^0.8.20;\n\ninterface IERC20Min {\n    function transferFrom(address from, address to, uint256 amt) external returns (bool);\n}\n\ninterface IPoolLike {\n    /// @dev 池子在 swap 中回调 router.swapCallback(amountToPay, data)\n    function swap(address recipient, bool zeroForOne, uint256 amountIn, bytes calldata data) external;\n}\n\n/// @notice ❌ 漏洞版：池子地址来自用户输入；回调只检查&quot;是不是刚才调用的那个地址&quot;；付款人来自回调数据\ncontract VulnerableRouter {\n    address private lastCalledPool;\n\n    function swapVia(address pool, address tokenIn, uint256 amountIn) external {\n        lastCalledPool = pool;                                      // ❌ pool 由用户任意指定\n        IPoolLike(pool).swap(msg.sender, true, amountIn, abi.encode(tokenIn, msg.sender));\n        lastCalledPool = address(0);\n    }\n\n    function swapCallback(uint256 amountToPay, bytes calldata data) external {\n        require(msg.sender == lastCalledPool, &quot;unknown pool&quot;);     // ❌ 恶意池子就是 lastCalledPool\n        (address tokenIn, address payer) = abi.decode(data, (address, address));\n        // ❌ 恶意池子可以伪造 data，把 payer 换成任何授权过本合约的用户\n        require(IERC20Min(tokenIn).transferFrom(payer, msg.sender, amountToPay), &quot;pay failed&quot;);\n    }\n}\n\n/// @notice ✅ 修复版：\n///   1. 池子地址由工厂 + 代币对 + 费率&quot;计算&quot;得出（CREATE2），不接受用户直接给出的地址；\n///   2. 付款人保存在本合约自己的状态里，不从回调数据中读取；\n///   3. 回调期间加锁，且只允许一次支付。\ncontract SafeRouter {\n    address public immutable factory;\n    bytes32 public immutable poolInitCodeHash;\n\n    // 本次交换的上下文（也可以用 0.8.24+ 的 transient 存储）\n    address private expectedPool;\n    address private payer;\n    address private tokenInCtx;\n    bool private paid;\n\n    constructor(address _factory, bytes32 _poolInitCodeHash) {\n        factory = _factory;\n        poolInitCodeHash = _poolInitCodeHash;\n    }\n\n    /// @dev Uniswap V3 风格的池子地址计算：只有工厂用 CREATE2 部署的真实池子才会落在这个地址\n    function computePool(address tokenA, address tokenB, uint24 fee) public view returns (address) {\n        (address t0, address t1) = tokenA &lt; tokenB ? (tokenA, tokenB) : (tokenB, tokenA);\n        bytes32 salt = keccak256(abi.encode(t0, t1, fee));\n        return address(uint160(uint256(keccak256(abi.encodePacked(hex&quot;ff&quot;, factory, salt, poolInitCodeHash)))));\n    }\n\n    function swapExact(address tokenIn, address tokenOut, uint24 fee, uint256 amountIn) external {\n        require(expectedPool == address(0), &quot;reentrant&quot;);\n        address pool = computePool(tokenIn, tokenOut, fee);        // ✅ 地址由规则计算\n        expectedPool = pool;\n        payer = msg.sender;                                         // ✅ 付款人就是发起交换的人\n        tokenInCtx = tokenIn;\n        paid = false;\n        IPoolLike(pool).swap(msg.sender, tokenIn &lt; tokenOut, amountIn, &quot;&quot;);\n        require(paid, &quot;pool did not request payment&quot;);\n        expectedPool = address(0);\n        payer = address(0);\n        tokenInCtx = address(0);\n    }\n\n    function swapCallback(uint256 amountToPay, bytes calldata) external {\n        require(msg.sender == expectedPool &amp;&amp; expectedPool != address(0), &quot;unknown pool&quot;); // ✅\n        require(!paid, &quot;already paid&quot;);                                                    // ✅\n        paid = true;\n        require(IERC20Min(tokenInCtx).transferFrom(payer, msg.sender, amountToPay), &quot;pay failed&quot;);\n    }\n}\n<\/code><\/pre><\/div>\n"}}, "nav": [{"key": "start", "name": "开始", "items": ["home", "guide"]}, {"key": "g1", "name": "第一层     fontFamily: '-apple-system, "PingFang SC", "Microsoft YaHei", sans-serif',
    themeVariables: {
      darkMode: dark, background: v('--paper'), fontSize: '14px',
      primaryColor: v('--gold-soft'), primaryBorderColor: v('--gold'), primaryTextColor: v('--ink'),
      secondaryColor: v('--info-soft'), tertiaryColor: v('--tint'),
      lineColor: v('--ink-2'), textColor: v('--ink'), mainBkg: v('--gold-soft'),
      clusterBkg: v('--tint'), clusterBorder: v('--rule'), titleColor: v('--ink'),
      edgeLabelBackground: v('--paper'), noteBkgColor: v('--info-soft'), noteTextColor: v('--ink'), noteBorderColor: v('--info'),
      actorBkg: v('--gold-soft'), actorBorder: v('--gold'), actorTextColor: v('--ink'), signalColor: v('--ink-2'), signalTextColor: v('--ink'),
      labelBoxBkgColor: v('--tint'), labelTextColor: v('--ink'), loopTextColor: v('--ink'), activationBkgColor: v('--tint'),
    },
  });
}
async function renderMermaid(root) {
  if (!window.mermaid) return;
  initMermaid();
  for (const pre of root.querySelectorAll('pre.mmd')) {
    const wrap = pre.parentElement;
    const src = pre.dataset.src || pre.textContent;
    pre.dataset.src = src;
    try {
      const { svg } = await mermaid.render('m' + (++mmdSeq), src);
      const holder = document.createElement('div');
      holder.innerHTML = svg;
      const el = holder.firstElementChild;
      wrap.querySelectorAll('svg').forEach(s => s.remove());
      pre.hidden = true;
      wrap.appendChild(el);
      const w = parseFloat(el.style.maxWidth) || 0;
      wrap.classList.toggle('wide', w > 900);
      if (!wrap.classList.contains('ready')) {
        wrap.classList.add('ready');
        wrap.tabIndex = 0;
        wrap.setAttribute('role', 'button');
        wrap.setAttribute('aria-label', '放大查看流程图');
        const chip = document.createElement('span');
        chip.className = 'zoom-chip';
        chip.textContent = '⤢ 点击放大';
        wrap.prepend(chip);
      }
    } catch (e) { pre.hidden = false; }

}
function rerenderForTheme() { if (mmdTheme !== null && mmdTheme !== isDark()) { viewer.close(); mmdTheme = null; renderMermaid(view); } }

// ---------- diagram viewer: click a diagram to open it full screen, then pan and zoom ----------
const viewer = (() => {
  const box = document.getElementById('viewer'), port = document.getElementById('viewerPort'), stage = document.getElementById('viewerStage');
  const zoomLabel = document.getElementById('vZoom'), titleEl = document.getElementById('viewerTitle');
  let svg = null, home = null, opener = null, w = 0, h = 0, s = 1, x = 0, y = 0;
  const MIN = 0.1, MAX = 8;
  const apply = () => { stage.style.transform = `translate(${x}px, ${y}px) scale(${s})`; zoomLabel.textContent = Math.round(s * 100) + '%'; };
  const rect = () => port.getBoundingClientRect();
  function zoomAt(f, cx, cy) {
    const ns = Math.min(MAX, Math.max(MIN, s * f));
    x = cx - (cx - x) * ns / s; y = cy - (cy - y) * ns / s; s = ns; apply();
  }
  const zoomCenter = f => { const r = rect(); zoomAt(f, r.width / 2, r.height / 2); };
  function fit() {
    const r = rect(), pad = 24;
    s = Math.min(MAX, Math.max(MIN, Math.min((r.width - pad * 2) / w, (r.height - pad * 2) / h)));
    x = (r.width - w * s) / 2; y = (r.height - h * s) / 2; apply();
  }
  // First view: fit the whole diagram, unless that makes it too small to read (wide diagrams on phones).
  // Then start at a readable size from the left edge and let the reader pan.
  function initial() {
    fit();
    if (s >= 0.45) return;
    const r = rect();
    s = 0.6;
    x = 16; y = Math.max(16, (r.height - h * s) / 2); apply();
  }
  function actual() { const r = rect(); s = 1; x = (r.width - w) / 2; y = Math.max(24, (r.height - h) / 2); apply(); }
  function titleFor(wrap) {
    let n = wrap.previousElementSibling;
    while (n && !/^H[1-4]$/.test(n.tagName)) n = n.previousElementSibling;
    const doc = view.querySelector('h1');
    return [doc && doc.textContent, n && n.textContent].filter(Boolean).join(' · ') || '流程图';
  }
  function open(wrap) {
    const el = wrap.querySelector('svg');
    if (!el) return;
    const vb = (el.getAttribute('viewBox') || '').split(/[\s,]+/).map(Number);
    const bb = el.getBoundingClientRect();
    w = vb[2] || bb.width; h = vb[3] || bb.height;
    svg = el; opener = wrap; home = { parent: el.parentNode, next: el.nextSibling, style: el.getAttribute('style'), width: el.getAttribute('width'), height: el.getAttribute('height') };
    el.setAttribute('width', w); el.setAttribute('height', h); el.style.maxWidth = 'none';
    stage.appendChild(el);
    titleEl.textContent = titleFor(wrap);
    box.hidden = false;
    document.documentElement.style.overflow = 'hidden';
    initial();
    document.getElementById('vClose').focus();
  }
  function close() {
    if (box.hidden) return;
    if (svg && home) {
      home.style === null ? svg.removeAttribute('style') : svg.setAttribute('style', home.style);
      home.width === null ? svg.removeAttribute('width') : svg.setAttribute('width', home.width);
      home.height === null ? svg.removeAttribute('height') : svg.setAttribute('height', home.height);
      home.parent.insertBefore(svg, home.next);
    }
    box.hidden = true; svg = null;
    document.documentElement.style.overflow = '';
    if (opener && document.contains(opener)) opener.focus({ preventScroll: true });
  }

  // wheel: pan by default (scrolling), zoom with Ctrl/⌘ or a trackpad pinch (which arrives as ctrl+wheel)
  port.addEventListener('wheel', e => {
    e.preventDefault();
    const r = rect();
    if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-Math.max(-25, Math.min(25, e.deltaY)) * 0.01), e.clientX - r.left, e.clientY - r.top); // a mouse notch ≈ ×1.28; trackpad pinch stays smooth
    else { x -= e.shiftKey && !e.deltaX ? e.deltaY : e.deltaX; y -= e.shiftKey && !e.deltaX ? 0 : e.deltaY; apply(); }
  }, { passive: false });

  // pointer: one pointer drags, two pointers pinch
  const pts = new Map();
  let last = null;
  port.addEventListener('pointerdown', e => {
    port.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    port.classList.add('dragging');
    last = null;
  });
  port.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) { x += e.clientX - prev.x; y += e.clientY - prev.y; apply(); return; }
    const [a, b] = [...pts.values()], r = rect();
    const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2 - r.left, my = (a.y + b.y) / 2 - r.top;
    if (last) { x += mx - last.mx; y += my - last.my; zoomAt(d / last.d, mx, my); }
    last = { d, mx, my };
  });
  const up = e => { pts.delete(e.pointerId); last = null; if (!pts.size) port.classList.remove('dragging'); };
  port.addEventListener('pointerup', up);
  port.addEventListener('pointercancel', up);
  port.addEventListener('dblclick', e => { const r = rect(); zoomAt(2, e.clientX - r.left, e.clientY - r.top); });

  document.getElementById('vIn').addEventListener('click', () => zoomCenter(1.25));
  document.getElementById('vOut').addEventListener('click', () => zoomCenter(0.8));
  document.getElementById('vFit').addEventListener('click', fit);
  document.getElementById('v100').addEventListener('click', actual);
  document.getElementById('vClose').addEventListener('click', close);
  addEventListener('resize', () => { if (!box.hidden) fit(); });
  document.addEventListener('keydown', e => {
    if (box.hidden) {
      const wrap = e.target.closest && e.target.closest('.mmd-wrap.ready');
      if (wrap && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); open(wrap); }
      return;
    }
    const k = e.key, step = 60;
    if (k === 'Escape') close();
    else if (k === '+' || k === '=') zoomCenter(1.25);
    else if (k === '-' || k === '_') zoomCenter(0.8);
    else if (k === '0') fit();
    else if (k === 'ArrowLeft') { x += step; apply(); }
    else if (k === 'ArrowRight') { x -= step; apply(); }
    else if (k === 'ArrowUp') { y += step; apply(); }
    else if (k === 'ArrowDown') { y -= step; apply(); }
    else if (k === 'Tab') { // keep focus inside the dialog
      const f = [...box.querySelectorAll('button')]; const i = f.indexOf(document.activeElement);
      e.preventDefault(); f[(i + (e.shiftKey ? f.length - 1 : 1)) % f.length].focus();
      return;
    } else return;
    e.preventDefault();
  });
  document.addEventListener('click', e => {
    const wrap = e.target.closest && e.target.closest('.mmd-wrap.ready');
    if (wrap && !box.contains(wrap) && !getSelection().toString()) open(wrap);
  });
  return { open, close };
})();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', rerenderForTheme);
new MutationObserver(rerenderForTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

// ---------- routing ----------
const view = document.getElementById('view');
function setCurrent(id) {
  document.querySelectorAll('.navlink').forEach(a => {
    if (a.dataset.nav === id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
}
function showDoc(id) {
  const d = docs[id];
  const i = order.indexOf(id);
  const prev = order[i - 1], next = order[i + 1];
  view.className = 'doc';
  view.innerHTML = `<div class="eyebrow">${groupName[d.group]}</div>${d.html}
    <nav class="pager">${prev ? `<a href="#${prev}" data-nav="${prev}"><span class="k">← 上一篇</span><span class="t">${shortTitle(docs[prev].title)}</span></a>` : ''}
    ${next ? `<a class="next" href="#${next}" data-nav="${next}"><span class="k">下一篇 →</span><span class="t">${shortTitle(docs[next].title)}</span></a>` : ''}</nav>`;
  renderMermaid(view);
}
function showLabs() {
  view.className = 'doc';
  view.innerHTML = `<div class="eyebrow">交互实验</div><h1>亲手验证，而不是只读结论</h1>
    <p>每个实验对应一章。拖动滑块、点击按钮，观察系统在不同参数和状态下怎样运行。所有参数都是示例值。实验页里的章节链接会带你回到对应章节。</p>
    <div class="labs-grid">${labs.map(l => `<a class="lab-card" href="#${l.id}" data-nav="${l.id}"><span class="from">LAB</span><span class="t">${l.title}</span></a>`).join('')}</div>`;
}
function showLab(id) {
  const l = labs.find(x => x.id === id);
  view.className = 'labview';
  view.innerHTML = `<div class="labhead"><h1>${l.title}</h1><span class="muted">交互实验 · 页面内的链接会带你回到对应章节</span></div>
    <iframe class="labframe" src="interactive/${l.file}" title="${l.title}"></iframe>`;
}
function route() {
  viewer.close();
  const id = (location.hash || '#home').slice(1);
  document.body.classList.remove('menu-open');
  if (docs[id]) showDoc(id);
  else if (id === 'labs') showLabs();
  else if (labs.some(l => l.id === id)) showLab(id);
  else { showDoc('home'); }
  setCurrent(id);
  if (!id.startsWith('lab')) window.scrollTo(0, 0);
}
function go(id) { if (location.hash === '#' + id) route(); else location.hash = id; }
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-nav]');
  if (a) { e.preventDefault(); go(a.dataset.nav); }
});
window.addEventListener('hashchange', route);
window.addEventListener('message', e => {
  const m = e.data || {};
  if (m.cexNav) go(m.cexNav);
  else if (m.cexNavMd) { const id = mdMap['../' + m.cexNavMd.split('#')[0].replace(/^(\.\.\/)+/, '')]; if (id) go(id); }
});
document.getElementById('menuBtn').addEventListener('click', () => document.body.classList.toggle('menu-open'));

// ---------- search ----------
const plain = Object.fromEntries(Object.values(docs).map(d => [d.id, d.html.replace(/<[^>]+>/g, ' ').replace(/&[a-z]+;/g, ' ').replace(/\s+/g, ' ')]));
const q = document.getElementById('q'), results = document.getElementById('results');
const escHtml = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
q.addEventListener('input', () => {
  const term = q.value.trim();
  if (!term) { results.hidden = true; navEl.hidden = false; return; }
  const low = term.toLowerCase();
  const hits = [];
  for (const id of order) {
    const text = plain[id]; const idx = text.toLowerCase().indexOf(low);
    const inTitle = docs[id].title.toLowerCase().includes(low);
    if (idx < 0 && !inTitle) continue;
    const count = text.toLowerCase().split(low).length - 1;
    const s = Math.max(0, idx - 24);
    const snip = idx < 0 ? '' : escHtml(text.slice(s, idx)) + '<mark>' + escHtml(text.slice(idx, idx + term.length)) + '</mark>' + escHtml(text.slice(idx + term.length, idx + term.length + 40));
    hits.push({ id, score: (inTitle ? 1000 : 0) + count, snip, count });
  }
  hits.sort((a, b) => b.score - a.score);
  results.hidden = false; navEl.hidden = true;
  results.innerHTML = hits.length ? hits.slice(0, 30).map(h => `<a class="result" href="#${h.id}" data-nav="${h.id}"><b>${codeOf(h.id)} · ${shortTitle(docs[h.id].title)} <span>(${h.count})</span></b><span>${h.snip}</span></a>`).join('')
    : '<p class="result"><span>没有找到。换一个词试试，例如"重入"。</span></p>';
});

route();
</script>
<script>
window.LL_ANSWERS = {"a01": ["不要口头放行，也不要悄悄并入当前评估。本章要求冻结提交哈希，之后的改动走差异评估（Diff Review），并且范围变更要回到阶段 ① 重新书面确认。<br>手续费从 0.3% 改到 0.25% 看起来只是一个参数，但费率常量会参与核心计算，改错就会出严重漏洞（提示的 Uranium Finance 就是这类教训）。所以应对这个改动做差异评估，重跑相关测试，并更新交付时间和结论所依据的版本。", "我会把尽调重点放在链上证据上：用浏览器看部署时间和创建者，读 owner、minter、pause、blacklist 等权限地址，看它是 EOA 还是多签，查持仓集中度、流动性深度与锁仓真实性，并在分叉环境模拟买入再卖出，排查貔貅盘。另外核对官网与审计报告的地址是否一致。<br>结论要写成「源码未验证，无法确认代码行为，属于红线类信号（代码与已验证源码不一致 / 未验证）」，建议暂缓，并列出需补充的材料：验证源码、审计报告、权限说明。", "因为不写覆盖范围，决策者会误以为全部都查过了。结论必须写明依据的版本、未覆盖的范围和剩余风险。<br>反面场景示例（我自己构造的）：评估范围只含合约，明确排除了部署脚本，结果上线时初始化参数配置错误导致被盗。如果结论里写明了「不含部署脚本」，责任归属清楚；没写，别人就会认为你评估过，被视为评估失职。本章也提醒部署脚本和初始化参数默认应纳入范围。"], "a02": ["矩阵给出中危（影响严重 × 可能性低）。但矩阵只是起点。还要了解这 5 把私钥的管理情况：是否由不同人、不同设备（如硬件钱包）保管，是否有人同时持有多把，签名流程是否会被钓鱼或签名界面篡改，增发有没有时间锁、额度上限和监控。如果私钥管理薄弱，可能性就不低，应按实际情况上调；如果有这些缓解措施，通常保持中危。定级时必须写明攻击者能力假设。", "建议定为高危甚至严重，需要写明依据。可能性：任何人、一笔交易、无特殊前提就能触发，所以为「高」。影响：Immunefi 把盗取未领取收益列为「高」，矩阵查表是「高」。但这个合约已部署，奖池 100 万美元可被任意人领走；如果这笔钱属于用户或协议资金，影响可按「严重」，对应「严重」级。该发现必须附可运行的 PoC，并立即排到修复队列最前。", "因为风险接受是业务决策，要由有权承担后果的人决定。评估负责人的职责是把风险说清楚并给出建议，不是替业务承担后果。两者分开，责任才清晰，也要记录缓解措施和复查日期。如果是同一个人，他既出报告又批准不修，就会缺少制衡，容易为赶上线而低估或淡化风险。评估报告也就可能为了通过而隐瞒问题，给决策者虚假的安全感。"], "a03": ["至少有这些环节：<br>1. 终端安全：签名人的电脑不是专机，能收文件、装软件，被木马入侵（Radiant 就是收到伪装成前承包商的文件）。<br>2. 盲签：硬件钱包不解析 Safe 交易，签名人看不懂所签内容，却签了 <code>transferOwnership<\/code>。<br>3. 独立性与阈值：7 人是否实际由少数人控制，4/7 能否被同时钓鱼；还有缺少带外确认、高危操作审批、时间锁与限额。", "做法是用独立于构造系统的工具，自己解码 calldata，逐字段核对，再签名。要核对：目标合约地址、调用的函数、金额与收款地址，以及是不是 <code>delegatecall<\/code>。<br>出现 <code>delegatecall<\/code>、升级实现、换签名人、<code>transferOwnership<\/code> 这类高危操作时，应当立即高度警惕，并走带外确认（电话、线下确认交易哈希）。", "因为三起事故的合约本身都没有新漏洞，失守的是「人签了什么」。Bybit：Safe 前端被篡改，签名数据是恶意的，用 <code>delegatecall<\/code> 替换了实现。WazirX：界面与实际签名数据不一致。Radiant：终端被木马入侵，盲签 <code>transferOwnership<\/code>。<br>这三起即使阈值很高、合约很标准也挡不住，所以本章建议把 60% 精力放在签名流程上。"], "a04": ["重点查 3.1 清单里的四项：<br>1. 健康检查：循环中每一步增加债务、减少抵押的路径，最后都必须检查健康因子。<br>2. 清算：杠杆放大后头寸贴近清算线，极端行情下清算是否仍有利可图、坏账由谁承担。<br>3. 预言机：抵押品估值用什么价格，能否被操纵。<br>4. 利率模型：循环借款会让利用率跳变，是否可被闪电贷诱发。<br>循环杠杆之所以高风险，是因为它在一笔交易内把头寸放大，小幅价格波动就能触发清算或造成坏账，也给攻击者提供放大的操纵杠杆（推理）。", "按第 6 节，接入第三方协议时你不能改代码，所以结论应是“接入风险评估 + 限额 + 退出预案”，而不是“代码没问题”。具体包含：集成点（回调、价格、暂停、升级）以及对方的信任假设；对方被攻破、暂停、跑路时，交易所资金和用户受什么影响；设置接入额度上限；监控指标；出事时如何撤出资金的退出预案。评估要假设对方某天会出事，而不是因为它“看起来很大、很成熟”就放心。", "你还需要验证：<br>1. 内部变量与真实代币余额始终对得上：收税代币、变基代币、策略收益、奖励入账后，内部记账是否正确更新。<br>2. 份额计算的舍入方向：存入向下取整，取出向上取整，首存时是否仍有虚拟份额或死份额保护。<br>3. 策略切换和策略合约的权限，防止份额价格被策略合约间接影响。<br>4. 用 vault-inflation-lab 和不变量测试实测“捐赠 + 首存”序列，确认份额价格不可被操纵。"], "a05": ["结论是否决（或至少不上线），不看评分。本章规定「代理可升级且升级权是单签 EOA」是红线，任一红线都会一票否决。<br>原因是红线检查在打分之前：单点被盗就会让代币合约全盘失控，用户和交易所都可能遭受不可接受的损失，其他维度再好也抵消不了。评分卡只用来比较通过红线之后的项目。", "三件事：<br>1. 核验审计方是否可信。<br>2. 核验审计的是不是这个版本，对照部署的字节码与已验证源码。<br>3. 看报告里的「已确认风险」和未修复问题是什么。<br>章节强调一份审计报告不等于安全，例如 PancakeBunny 被利用的是审计后上线的新版本。我还会在对方给出的部署地址上读权限，而不是只看 GitHub。", "因为刚部署几天的项目没有历史可查，没有经过时间和资金的检验，行为和团队信誉都难以判断。<br>交易所要上新项目时，可以用上线条件缓解：放进观察区、限额上线、加强监控、要求补审计或锁仓。这些都写在「中分：附条件」的建议里。"], "a06": ["盲区是：MPC 只保证私钥不以完整形态落地，不管谁授权签名、签的是什么。Bybit、WazirX、Radiant 的问题都不是私钥被直接偷走，而是合法签名人被骗着授权了恶意交易。Radiant 的开发者终端中了木马，签名终端被入侵后，签名人看到的内容和实际签的内容不一致，阈值再高也挡不住。所以还要评估签名人独立性、专机专用的签名终端、独立工具解码核对，以及高危操作的带外确认。", "至少三个措施：①依赖锁定到具体版本，不直接引用浮动版本，尤其不要通过第三方 CDN 镜像随意加载（Ledger Connect Kit 1.1.5–1.1.7 被投毒）；②对关键外部脚本启用子资源完整性（SRI）校验，哈希不对就不加载；③严格控制前端托管和 CDN 账户的访问权限与 API key（BadgerDAO 就是 Cloudflare 的 API key 被利用）。再补充：离职人员的 npm 等权限及时撤销，并对前端代码完整性和异常授权激增做监控。", "因为假招聘冒充的是团队日常就要面对的正常场景：招聘、承包、合作。对方让你“笔试”“看报告”，你很容易在开发或签名的终端上运行外部代码或文件。DMM 的案例就是冒充招聘者让 Ginco 员工运行“入职测试”代码；Radiant 是冒充前承包商发伪装成报告的恶意文件。评估时我会问：是否有不在签名/部署终端打开外部文件、运行外部代码的硬性规定？招聘、承包、合作是否核验身份？开发和签名人员是否受过反社会工程培训？高危操作是否要求多人、带外确认，使单人被攻破也不致损失？"], "a07": ["至少核对五件事：①范围与版本：审计的提交哈希是否就是要上线的版本，哪些文件没审；②方法与工时：人工审查加哪些工具，投入多少人天，是否走过场；③发现与修复状态：每条发现的等级、是否已修复、有没有复审；④已确认风险：审计方指出但项目方选择不修的风险，我能否接受；⑤假设与免责、范围外提示：报告假设了什么（如预言机可信、owner 不作恶），这些就是我的剩余风险。审计后上线前若有改动，还要做差异审计。", "因为“已修复发现”已经被处理，而“已确认风险”是审计方指出、但项目方选择不修的风险，没有人替你解决，只能由你独立判断是否可接受。外部审计是输入，不是决策，主责始终在内部。这部分最容易被忽略，却最重要；如果不看，就等于默认接受了这些风险。", "答案是：要与攻击者利用它的收益比较，严重级通常按可能损失的一定比例封顶。奖金太低时，白帽的合法收入远低于利用漏洞的收益，更可能选择利用或卖给别人，而不是上报。奖金过高则项目付不起、不可持续，也会让赏金计划成为负担。设定时要让严重级赏金对白帽有足够吸引力，同时保持计划长期可运行，并配合安全港和快速响应。本章未给出具体比例，上述两端的后果是按一般逻辑的推断。"], "a08": ["因为这是证明“修复真的针对该问题”的标准证据。修复前失败，说明测试确实能触发那个漏洞；修复后通过，说明补丁让它不再成立。只有“修复后通过”的测试缺了前半句，它可能根本没测到那个问题，在修复前也会通过，等于没有证据。", "示例：选 Ronin（2022）。<br>事故：Ronin，2022。<br>漏洞类别：密钥与运营。<br>被打破的假设：9 选 5 的签名来自彼此独立的验证人。<br>触发条件：攻击者控制了足够多的签名。<br>事前信号：多把验证人密钥由同一机构控制，一份临时授权未撤销，即签名人独立性不足。<br>对应不变量：重要操作需要至少 M 个独立主体同意。<br>好答案要点：事前信号必须是公开可见、事前就能发现的迹象，不是事后结论。", "标注为“未验证”，写明依据只是项目方口头声明，没有补丁差异、回归测试或分叉验证等证据。门禁里把它视为未关闭，不能放行。要关闭它，需要补丁、修复前失败/修复后通过的测试，或在分叉环境确认的结果，并把验证等级写进报告的“修复状态”。"], "a09": ["两者目的和速度要求不同，必须分开：暂停是应急止血，要几分钟内完成；升级可以做任何事，要慢。暂停权限给少数可信角色（能 24 小时响应，不是要多日凑齐的大多签），不加延迟；升级权限由多签持有并走时间锁（如 48 小时以上，示例）。混在一起，要么暂停太慢，要么升级太容易。", "预案里缺了联系人清单和备用响应路径。本章要求联系人清单覆盖内部值班、外部审计方、安全公司等，并有预案手册写明角色和权限。至少应补充：签名人的多种联系方式与备份人员、无法联系时由谁用暂停权限先止血、break-glass 密钥的启用流程。告警还要有负责人和响应时限。", "以冷钱包向陌生地址大额转出为例（示范，你可换别的事故）：<br>0–15 分钟：确认告警，核对签名人是否真的操作；无法排除就按真实事件处理，同时通知管理层。<br>15 分钟内：能暂停就暂停；不能就撤池、撤授权、下架充提，降低暴露。<br>15–30 分钟：评估范围；资金仍在转出就联系交易所和发行方请求冻结；向用户发出只含已确认事实的首次通报，并约定下次更新时间。好的答案应按决策树逐步写清动作、负责人和理由。"], "a10": ["结论是高风险，不能因为 Audit 页是 LOW 就放行。可升级代理加单签 EOA admin，对应 A05 的“升级权为单签 EOA”红线：一把私钥泄露或管理员作恶就能替换实现、盗走资金。Audit 页没拦住，因为扫描只看当前版本的快照，只能读到 admin 地址类型，无法判断升级后会怎样，且文档明确说“LOW 不等于安全”。", "写“未评估”，不能写成通过或无风险。hasResult 或 isSupported 为假时没有任何审计结论。需要补的工作是走完 A05 全流程的人工评估：读源码并核对已验证字节码，查 owner/admin 权限和是否可升级，分叉环境小额买卖核对税率，查部署者历史、持仓集中度与流动性锁定，并把查询时间和链上读数存入证据附录。", "范围：扫描只按规则查已知模式，人工审计会读业务逻辑和整个系统。深度：扫描查不出新型后门和经济攻击等复杂漏洞，审计能推演攻击路径。责任：扫描是用户提示，不代表背书，审计报告由审计方署名并对结论负责。简言之，扫描是广度的分诊，审计是深度的覆盖。", "第一，Audit 页是自动扫描的快照，只发现已知模式，不是人工审计。第二，可升级合约、业务逻辑漏洞和运营安全它看不到，“LOW”或绿勾不等于安全，“无结果”更不等于通过。第三，上币的责任在我们，所以把它当第 0 步分诊，再按评分卡完整尽调，才能签字。"], "c01": ["不能。<code>private<\/code> 只限制其他合约在 Solidity 里直接访问该变量，不让数据保密。区块链上的存储全部公开，攻击者能读取你合约的全部存储，包括 private 变量，例如用 <code>eth_getStorageAt<\/code> 或 <code>cast storage<\/code> 直接按存储槽读出。所以密码、种子之类的秘密绝不能明文放在链上。", "以借贷协议为例，三个不变量：①协议持有的某资产余额 ≥ 所有存款人可取出的总额减去已借出的部分（资产不凭空少）；②任何仍未被清算的账户，其债务价值 ≤ 抵押价值 × 清算阈值，健康账户不应被清算；③存款份额总量与资产总量的换算保持一致，任意一次存取后每份额价格不应异常下降。好答案要写成“任何操作后都必须成立的式子”，能直接转成不变量测试。", "按本章 5 节的表格，损失最大的是 2025 年 Bybit（约 15 亿美元），属于“系统与运营”类（前端与签名界面）。这是代码之外的问题：攻击者篡改了 Safe{Wallet} 前端，让签名人签下替换多签实现合约的交易。本章结论是，近年最大损失转向跨链桥和运营安全（私钥、多签、前端），代码审计覆盖不到。具体统计请以 incident-explorer.html 的分类口径为准。"], "c02": ["被改的是 A 合约（调用方）的存储，不是 L 的。delegatecall 执行 L 的代码，但读写 A 的存储。<code>owner = msg.sender<\/code> 写的是 A 里与 L 中 owner 变量相同序号的那个槽位（如果 L 的 owner 是第一个变量，就是 slot 0，具体看布局）。msg.sender 是调用 A 的那个地址（用户），而不是 A，因为 delegatecall 保持 msg.sender 和 msg.value 不变。如果槽位对应 A 的 owner 或 implementation，就等于被接管。", "能，让它永久失败。余额检查用的是 <code>==<\/code>。攻击者可以强制向合约转入 ETH，例如通过 selfdestruct（EIP-6780 之后不删除其他合约，但仍会转走余额），或者把它设为出块奖励地址。这些转账不会执行合约的 receive 或 fallback，也不会增加 <code>totalDeposits<\/code>。从此 <code>balance &gt; totalDeposits<\/code>，等式永远不成立，函数永久失败。正确做法是用内部变量记账，不要依赖 <code>address(this).balance<\/code>。", "你应该看到：新变量插到最前面后，后面所有变量的槽位都向后错位。新变量占用了原来第一个变量的 slot 0，所以原来 slot 0 的值（例如 owner）被新变量按自己的类型解释；后面每个变量读到的是前一个变量的旧值，章节举例的后果是余额被当成地址读取。具体哪个变量被覆盖，以页面里所选布局为准。根因是存储槽按声明顺序分配，升级只能在末尾追加变量。"], "c03": ["结果取决于锁的范围。你应该看到：如果锁只加在 withdraw 上，跨函数重入仍然成功，因为攻击者在 receive() 里调用的 transfer 没有锁，此时 balances 还没清零。只有所有读写同一状态的函数共用同一把锁，或者全部遵循 CEI，攻击才会失败，重入的调用会被拒绝。具体以实验页中锁的覆盖范围为准。", "能多铸造。_safeMint 会回调接收方的 onERC721Received，此时 totalMinted 还没加一。攻击者在回调里再次调用 mint()，供应上限检查读到的仍是旧值，所以可以重复通过，铸出超过最大供应量的 NFT。修复办法是先执行 totalMinted++，再调用 _safeMint（CEI），或给 mint 加重入锁。", "仍然会受影响。nonReentrant 只拦截加了锁的函数的再次进入，view 函数通常没有锁，回调期间依然可读，读到的是中间状态。受影响的是第三方协议，例如读取该合约 view 函数（如 getVirtualPrice）作为价格的借贷协议，而不是该合约自己的账本。防御要在第三方做：读取前检查对方的锁状态，或改用不受单笔交易影响的价格源。"], "c04": ["不够合理，但“暂停快”这个方向对。PAUSER 不能转走资金，所以可以不加时间锁；但应由小型多签或监控机器人持有，不要单私钥。私钥被盗的最坏情况：攻击者能随意暂停提款，让用户资金取不出，甚至以此勒索，但不能直接盗走资金。因此要配套由更高权限（多签加时间锁）恢复的机制。", "一般不会再冻结。本章的事故是新库合约自己没初始化，有人成为 owner 后调用 kill 自毁库，依赖它的钱包失去代码逻辑。EIP-6780 之后，selfdestruct 只有在合约与创建在同一交易内才会删除代码，已部署的库不会被删除，所以钱包仍能 delegatecall。这是通用知识，不是本章内容。但库仍应初始化或在构造函数里锁死。", "要额外确认该地址是否由单一私钥控制。TRON 账户原生支持多重权限：Owner 可以修改其他权限，包括增删签名人，权重之和达到阈值才执行。所以要检查它的 Owner 和 Active 权限配置、签名人、权重和阈值，确认没有第三方能夺走控制权，再设为 owner。"], "c05": ["偏移为 0 时，至少捐赠约 5,000 USDC。公式 <code>shares = assets × totalSupply / totalAssets<\/code>，攻击者先存 1 wei，totalSupply = 1，受害者得到 <code>5000e6 / (D + 1)<\/code> 份，捐赠 D ≥ 5000e6（5,000 USDC）时向下取整为 0。偏移为 3 时需要约 10^3 倍，约 500 万 USDC（推算值），攻击不再划算。", "攻击者可以反复做很小额的借还，让每次应还金额向下取整少还 1 单位，或让小额利息被取整成 0。这样余数被借款人拿走，而不是归协议。单次只差 1 单位，但可以在一笔交易里重复几千次，慢慢抠走资金。正确做法是：用户付出的向上取整，余数归协议。", "第一，不要写死精度。以太坊上的 USDT 是 6 位，BNB Chain 上的 Binance-Peg BSC-USD 是 18 位，写死 <code>1e6<\/code> 会让金额偏差 10^12 倍，应改为读取 <code>decimals()<\/code>。第二，凡涉及跨链桥的两端换算，要显式处理精度换算和换算后的余数。"], "c06": ["最可能是 TRON 上的 USDT 转账成功也返回 false。提款是协议向用户「推送」USDT，协议若用 <code>SafeERC20.safeTransfer<\/code>，会把 false 判为失败并整笔回滚，所以提款全失败。存款走 <code>transferFrom<\/code>，该审计认为它在 TRON USDT 上行为正常，所以存款没问题。修复是为推送方向单独写逻辑：转账后检查接收方余额是否增加了 amt，不读返回值。", "存入 100 枚时协议只收到 98 枚，却记账 100。取出 100 枚时，合约只能拿别人存的钱来补那 2 枚，或者余额不足而失败。如果所有用户都这样做，协议会资不抵债：账面欠 100，实际只有 98，最后取款的人取不出来。修复是按余额差记账：<code>received = after - before<\/code>，并配合重入锁；不支持的收税代币应显式拒绝。", "你应该看到：在 TRON 上用 SafeERC20 推送 USDT，实验页会提示推送转账一律回滚，也就是所有提款或支付都失败。因为 TRON USDT 转账成功时也返回 false，SafeERC20 把它当成失败。提示的改法是用余额差判断（转账后检查接收方余额增加 amt），同时也提醒：若 Tether 开启转账手续费，<code>== amt<\/code> 的检查会失败，要在「失败即回滚」和「按实收记账」之间明确选择。"], "c07": ["利润最高的金额在页面曲线的峰值处，具体数值以实验显示为准。原因：攻击者利润 = 借出金额 − 两次交换的滑点和手续费 − 闪电贷费用。金额增大，价格被推得越高，借出额越大；但恒定乘积 AMM 里买入 Δy = y × Δx / (x − Δx)，越往后推价格越陡，滑点和手续费涨得更快。借出额还受协议 LTV（如 75%）和可借池子的限制。超过峰值后，成本增长快于收益，利润反而下降。", "可以，TWAP 抗的是单笔交易操纵，抗不了多区块持续操纵。攻击者连续多个区块买入，把平均价格慢慢拖高。代价是：要投入真实资金（不再是闪电贷，因为闪电贷必须同一笔交易还款），承担价格回落的亏损，还要承受套利者在期间反向交易的风险。窗口越长，攻击越贵但价格越滞后。Inverse Finance（2022 年 4 月）就是用自有资金持续推高浅池价格，再用垃圾交易抑制套利，借走约 1,560 万美元。", "还需要读取 L2 的排序器在线状态喂价（Chainlink 的 Sequencer Uptime Feed）。排序器宕机时，喂价无法上链，价格停留在宕机前；恢复后的第一批区块里，能通过 L1 强制提交交易的少数人占优。所以要在排序器恢复后设一段宽限期（示例 1 小时），期间暂停清算或新借款。部署前要先确认 Mantle 上确实有这个喂价。"], "c08": ["最典型的两种是跨链重放和跨合约重放。只有 nonce 和 deadline 时，签名没有绑定 chainId 和 verifyingContract：同一代码部署在另一条链或另一个合约地址上，那边的 nonce 状态独立，签名在那里仍然有效。如果签名也没带函数意图（typehash），跨函数重放同样会成功。EIP-712 的域分隔符加类型哈希可以一次解决这三类问题。", "无效。<code>amountOutMin<\/code> 用池子当前现货价乘 99% 计算，而现货价正是搜索者可以在同一区块里用自己的买入先推高或拉偏的价格。章节说「不要在合约内部用现货价计算 minOut，那等于没有保护」。攻击者先把价格推偏，合约算出的最小输出就跟着变差，三明治照样成立。minOut 应来自链下报价或可信的外部价格。", "仍然可能。「没有公开内存池」只是把排序权从市场集中到了一个运营者手里。Mantle 是单一中心化排序器，L2BEAT 列出的风险是「运营者可以抢跑用户交易提取 MEV」。所以有能力发起的是排序器运营者（或与其合作的一方），用户只能依赖它的诚实。"], "c09": ["任何人都能升级，等于任何人都能夺走全部资金。UUPS 的升级权限就在实现合约的 <code>_authorizeUpgrade<\/code> 里；写成空函数就没有任何权限检查。攻击者调用升级函数，把实现换成自己的合约，用 delegatecall 的逻辑转走代理里的资金。<code>_authorizeUpgrade<\/code> 必须有 <code>onlyOwner<\/code> 之类的权限校验，并配合多签和时间锁。", "不能正常工作，代理会坏掉。朴素代理把 <code>implementation<\/code> 放在 slot 0，而实现合约里的 <code>owner<\/code> 也在 slot 0。你调用 <code>setOwner<\/code> 写 owner，实际是写代理的 implementation 地址，实现地址被改成一个任意地址（通常没有代码），之后所有 delegatecall 都转发到错误的目标，代理失效。修复是用 EIP-1967 的固定伪随机槽位存实现地址。", "因为升级的风险不只在代码，还在升级时的参数和操作。例子：Nomad 在升级时调用初始化函数，把可信消息根设成了 0x00，而未经证明的消息默认也对应 0x00，于是任何消息都被当作已证明，损失约 1.9 亿美元。代码逻辑本身可以没问题，出错的是升级交易里的初始化参数。所以流程要求审计新实现和升级交易（含初始化参数），并在升级后跑回归测试。"], "c10": ["攻击就不能成功了，因为捐赠后账户资不抵债，这一行会让 <code>donateToReserves()<\/code> 直接 revert。但这还不够，还要检查所有会减少抵押品或增加债务的路径，结束时都校验健康因子。另外清算折扣要设上限，并用不变量测试覆盖所有入口：任何操作后健康因子 ≥ 1。", "可以。快照在提案创建时，攻击者只要提前一天借入并持有，到提案创建时仓位已被计入。这就不是闪电贷了，攻击者要实际持有这笔仓位一段时间。成本是借款利息、抵押占用资金和价格波动风险。所以快照只是防住了“同一交易”借票，还要配合法定人数、执行时间锁和守护者否决。", "本章正文里可以确认至少 2 起：Euler 用闪电贷借入 DAI，Beanstalk 用闪电贷借入约 10 亿美元获得投票权。Venus XVS 是价格上涨后的抵押与坏账，正文没有说用了闪电贷。具体数字以你在 incident-explorer.html 里筛选的结果为准，正文无法给出完整计数。"], "c11": ["实际安全阈值只有 2。这 3 个地址由同一家云服务商托管，一旦该服务商被攻破或共谋，等于 1 个故障点同时拿到 3 把钥匙。攻击者只需再拿到另外 4 个地址中的 1 个，就凑够阈值 4（3 + 1）。这和 Ronin 的教训一致：阈值的意义取决于签名人的独立性，4 把钥匙放在同一个地方等于 1 把。", "对用户短期是好事，对去中心化是坏事。停链在约 3 小时内冻结了大部分被盗资金，减少了损失，这是验证者集合小、响应快的好处。但这也说明少数验证者就能协调停掉整条链，存在审查和中心化风险。本章把它称为中心化程度的两面：响应快，同时权力集中。", "你应该能看到按根因分组后的结果，以实验页面显示为准。按本章案例金额估算：私钥与运营类以 Ronin 约 6.2 亿美元为单起最大；验证与签名逻辑类有 Token Hub 约 5.7 亿、Poly Network 约 6.1 亿、Wormhole 约 3.2 亿，合计最大。这说明验证逻辑缺陷和私钥问题造成的损失最多，而桥上集中的资产让单次攻击收益极高。"], "c12": ["Handler 要包含存款、取款，以及会触发回调的动作，才能随机生成跨函数重入序列。具体是：<code>deposit<\/code>、<code>withdraw<\/code>、<code>transfer<\/code>（若 Bank 有的话），再加一个带 <code>receive()<\/code> 回调的攻击者角色，在回调里随机调用其他入口。用 ghost 变量记录 <code>sumOfBalances<\/code>，不变量写成 <code>address(bank).balance &gt;= handler.sumOfBalances()<\/code>，重入造成少记账时即会被发现。", "不能直接上线，要当作新代码重新走流程。0.3% 改 0.25% 看似小，但审计只对审计时的版本成立。Uranium Finance 正是分叉时改手续费常数，却漏改了比较式右侧的 <code>1000**2<\/code>，损失约 5,000 万美元。应集中定义常数，补跑单元、模糊和不变量测试（x × y ≥ k），请审计方对这处改动做差异审计并复审，再部署。", "三项例子：一是 USDT 推送转账的返回值，二是能量与 80 ms CPU 时间上限，三是 CREATE2 地址前缀和 CHAINID。本地 EVM 覆盖不到，因为这些是 TRON 链自己的资源计费、虚拟机和代币实现差异，以太坊本地环境不会模拟。应在 Nile / Shasta 测试网实测，本章明确说不要只用本地 EVM。"], "c13": ["示例：选 Uranium Finance（2021-04，BNB Chain）。<br>摘要：分叉 Uniswap V2 改手续费，漏改一处常数。<br>损失：约 5,000 万美元。<br>直接原因：<code>10000<\/code> 与 <code>1000**2<\/code> 不一致，k 检查退化成 x×y ≥ k/100。<br>根本原因：改动过的分叉代码没有重新审计。<br>被打破的不变量：x×y ≥ k。<br>好答案要写出时间线、直接/根本原因两层，以及本可拦住它的关口（审计或测试）。", "你应该看到阶段在变化，依据总表：2016–2019 年以重入、初始化/权限和算术为主（The DAO、Parity、BEC）。2020–2022 年以预言机操纵、跨链验证、私钥运营和治理攻击为主（bZx、Cream、Wormhole、Ronin、Beanstalk）。2023 年之后出现更多算术精度、前端与签名、编译器问题（KyberSwap、Bybit、Curve/Vyper）。", "我认为是⑥“签名人看不懂所签内容”（盲签）。Bybit 事件中 Safe 合约没有漏洞，签名人看到的界面被篡改。工具看到的是一笔合法签名的交易，没有可匹配的代码模式，问题出在流程和人上。④“新函数绕过检查”也很难，因为需要理解业务意图，工具不知道哪些路径本该检查健康因子。"], "k00": ["因为那把锁没有覆盖所有读写借贷状态的入口，<code>exitMarket()<\/code> 就在锁外。攻击者在 <code>borrow<\/code> 发出 ETH 的回调中调用 <code>exitMarket(fUSDC)<\/code>，此时借款记录还没写入，Comptroller 读到的借款为 0，于是允许退出并取回抵押品。这是跨函数重入。<br>实验中只给 <code>withdraw<\/code> 加锁，然后从回调里去调用另一个未加锁、读同一状态的函数，你应该看到重入仍然成功，因为锁只保护了一个入口。", "写一个端到端测试：让若干出价者参与拍卖，处理完所有退款后，断言项目方能调用 <code>claimProjectFunds<\/code> 并提走余额。章节指出这个测试会立刻失败，因为 <code>refundProgress<\/code> 最多等于出价笔数 <code>_bidIndex<\/code>，而条件却要求它 ≥ <code>totalBids<\/code>（NFT 数量之和）。<br>另外对资金出口做不变量测试：「所有退款完成后合约资金必须能被提取」，也能发现。", "更强的校验是不信任「上一次调用的地址」，而是用工厂地址、两个代币和费率计算出合法池子地址，再与 <code>msg.sender<\/code> 比较（Uniswap V3 的 CallbackValidation 思路，见 <code>examples/08-RouterCallback.sol<\/code>）。<br>原因：攻击者自己部署的恶意池子不是工厂创建的，算出的地址对不上，回调就会被拒绝。原代码只证明了回调来自刚才调用的地址，而这个地址正是攻击者填的。", "不能。EIP-7702（Pectra）之后，EOA 可以签名委托一段合约代码，委托后的 EOA 可以执行任意代码，也可以回调，所以 <code>msg.sender == tx.origin<\/code> 不再代表调用者是普通钱包。攻击者可以用委托的 EOA 绕过这个检查。<br>应该改用真正的防护，比如重入锁、CEI 顺序和对价格的多区块抵抗，而不是靠判断是不是 EOA。"], "k01": ["变成原来的 4 倍。设计时若按约 3 秒一个块，Maxwell 后出块间隔为 0.75 秒，每天的区块数是原来的 3 ÷ 0.75 = 4 倍。每区块利率不变而区块数变多，实际年化利率就乘以 4。解决办法是用 <code>block.timestamp<\/code> 计时，或把每区块参数做成可治理调整。", "借贷协议代码没错也会被波及，所以要在资产接入层加防线。做法有：对新抵押品设供应上限和借款上限；限制抵押品范围，对跨链映射资产单独评估；对价格设上下限并监控，市场异常时能快速暂停该市场（Venus 的教训）；跨链协议的风险评估要覆盖两侧。本章只点明系统层漏洞会传导到应用层，以上是对应的通用缓解思路。", "你应该看到攻击利润明显变大或所需闪电贷明显变小。因为池子储备缩小到 1/10，同样金额对价格的冲击大约放大一个数量级，预言机更容易被扭曲，如果协议直接用池子即时价格估值，PancakeBunny 那样的攻击就更容易发生。对 BSC 上深度浅的长尾资产，意味着不能依赖单一池子的现货价，要用抗操纵的价格来源并限制其作抵押品的额度。"], "k02": ["先查交易回执，再定位失败调用。1) 看提款交易的执行结果：REVERT、OUT_OF_ENERGY、OUT_OF_TIME 还是 ILLEGAL_OPERATION（PUSH0、TSTORE 等功能开关没开）。2) 如果是 REVERT，看是不是 <code>SafeERC20.safeTransfer<\/code> 推送 USDT：TRON 上的 USDT 成功也返回 false，SafeERC20 判定失败而回滚，而存款走 transferFrom 行为标准，所以存款正常。修复：推送改为转账后检查接收方余额增加了对应金额（TronTransferLib），拉取方向保留 SafeERC20；用 TRON 专用构建配置部署，并在 Nile/Shasta 测试网用真实 USDT 跑完整存取。", "余额增加量会小于转账金额，余额差校验会判定失败，提款又会回滚。因为 TronTransferLib 假设 USDT 没有开启转账手续费。调整：别要求「收到 == 金额」，而是记录转账前后的余额差作为实收额，再按实收额记账；并且明确产品行为：是回滚，还是由用户承担手续费、按实收额结算。还要对黑名单和暂停有处理，这也是迁移清单里的一项。", "因为不带 chainId，签名对所有链都是同一条消息，没有任何链上标识能区分。分叉链复制了原链的合约地址和 nonce 状态，同一个签名在两条链上都能通过验证，所以能重放。TRON 账户没有 nonce，交易层靠 TAPOS 和 60 秒过期防重放，但这只保护交易本身，不保护合约层的签名，所以仍然要在 EIP-712 域里放 chainId（TRON 主网是 728126428），并自己维护 nonce。你应该在实验里看到去掉 chainId 后「分叉链」的重放成功。"], "k03": ["用户实际支付的是 0.01 MNT，不是 0.01 ETH。Mantle 的原生币是 MNT，msg.value 的单位就是 MNT，而 ETH 在 Mantle 上是 ERC-20 形式。所以铸造费的价值是 0.01 个 MNT 的市价，与预期的 0.01 ETH 差了一个 ETH/MNT 汇率倍数（具体金额取决于两者价格，章节未给出数值）。修复办法是明确 payable 入口收什么，并用 MNT/USD 喂价换算。", "我希望这个权限有这些限制：<br>1. 比“暂停”门槛更高：需要更多签名、时间锁和公开公告（本章 5 节指出恢复路径最敏感）。<br>2. 只能针对被标记的可疑地址，且只在提款延迟期内、资产仍在协议控制下使用。<br>3. 权限持有人和流程要向用户披露，滥用时用户能察觉，比如链上事件和公告。<br>4. 不能用来转走普通用户的代币。因为团队能转走攻击者的代币，也就意味着有能力转走任何人的代币，这是必须披露的中心化权限。", "信任假设从“证明系统的密码学正确”变成“有挑战者在终结期内盯着并挑战错误状态根”。乐观模式下不需要证明，如果无人检查状态，就可能被盗；切换权在 3/7 工程多签手里。文档可以这样写：“本协议基于 Mantle 的当前架构（截至某时点，ZK 有效性证明）；工程多签可切换到乐观模式，届时安全依赖挑战者和终结期；提款可能被暂停；以 L2BEAT 最新页面为准。”"]};
/* ---------- 学习层：学习状态、笔记、高亮、思考题作答、复习队列、学习台 ----------
 * 用法：LearnLayer.init({ key, name, root(), current(), chapters(), watch, onDoneClick? , legacyDone? })
 * 存储：优先使用 artifact db（data/users/<id>/…，仅本人可见、跨设备同步）；不可用时只存浏览器。
 */
(() => {
const L = {};
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const today = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const addDays = (n, from) => { const d = from ? new Date(from + 'T00:00:00') : new Date(); d.setDate(d.getDate() + n); return today(d); };
const IVL = [1, 2, 4, 7, 15, 30, 60];
const STATUS = { 0: '未开始', 1: '在读', 3: '已读', 2: '已掌握' };
const ORDER = [0, 1, 3, 2]; // 3 = 读完但还没掌握；不进入复习队列
const SITES = [
  ['w3hb', 'Web3 从 0 到 1', 'https://claude.ai/artifact/PBJN64zKKK7eQEdvntySLE'],
  ['sca', '合约审计 101', 'https://claude.ai/artifact/NqWHfGnuG6Rr5VqWyaNThF'],
  ['w3chb', 'Web3 合约', 'https://claude.ai/artifact/N9JeR3FGfxaUEbaaMZhUXm'],
  ['cshb', 'Web3 安全', 'https://claude.ai/artifact/SYLKgrVxjJsVs1xhaJ2fZH'],
  ['scsb', 'Web3 智能合约安全', 'https://claude.ai/artifact/4De32TJHKpSUA1n5gbVaXi'],
  ['cexhb', 'CEX 交易所', 'https://claude.ai/artifact/CZQ2YzWa9SFvivd4MhZgFv']
];

let C, S, N, mode = 'local', db = null, uid = null, curId = null, lastTick = Date.now(), lastAct = Date.now();

/* ---------- storage ---------- */
const lsKey = () => 'll:' + C.key;
function blank() { return { v: 1, ch: {}, days: {}, last: null, up: 0 }; }
function loadLocal() {
  try { const o = JSON.parse(localStorage.getItem(lsKey()) || 'null'); if (o && o.S) { S = o.S; N = o.N || {}; return; } } catch (e) {}
  S = blank(); N = {};
}
function saveLocal() { try { localStorage.setItem(lsKey(), JSON.stringify({ S, N })); } catch (e) {} }
const docIdFor = id => 'n_' + String(id).replace(/[^A-Za-z0-9_\-.~:@+]/g, '_');
const pending = new Set(); let flushT = null, busy = false;
function touch(what) {
  S.up = Date.now(); saveLocal();
  if (mode !== 'cloud') return;
  pending.add(what); clearTimeout(flushT); flushT = setTimeout(flush, 1500);
}
async function flush() {
  if (busy || mode !== 'cloud' || !pending.size) return;
  busy = true;
  for (const what of [...pending]) {
    pending.delete(what);
    const isState = what === 'state';
    const body = isState ? S : N[what];
    if (!body) continue;
    try { await db.doc(`data/users/${uid}/${isState ? 'state' : docIdFor(what)}`).set(JSON.parse(JSON.stringify(body))); }
    catch (e) {
      if (e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'not_granted')) { mode = 'readonly'; break; }
      if (e && e.code === 'quota_exceeded') { mode = 'readonly'; toast('云端空间已满，新的更改只保存在本浏览器。'); break; }
      pending.add(what);
    }
  }
  busy = false;
  chip();
  if (mode === 'cloud' && pending.size) flushT = setTimeout(flush, 4000);
}
function mergeState(a, b) { // per-chapter newest wins
  const out = blank();
  const ids = new Set([...Object.keys(a.ch || {}), ...Object.keys(b.ch || {})]);
  ids.forEach(id => { const x = (a.ch || {})[id], y = (b.ch || {})[id]; out.ch[id] = !x ? y : !y ? x : ((x.u || 0) >= (y.u || 0) ? x : y); });
  const days = new Set([...Object.keys(a.days || {}), ...Object.keys(b.days || {})]);
  days.forEach(d => { out.days[d] = Math.max((a.days || {})[d] || 0, (b.days || {})[d] || 0); });
  out.last = (a.up || 0) >= (b.up || 0) ? a.last : b.last;
  out.up = Math.max(a.up || 0, b.up || 0);
  return out;
}
async function connect() {
  if (!window.claude || !window.claude.use) { chip(); return; }
  try {
    const [d, u] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    const id = u && await u.id();
    if (!d || !id) { chip(); return; }
    db = d; uid = id;
    const snap = await db.collection(`data/users/${uid}`).get();
    let remoteS = null; const remoteN = {};
    snap.docs.forEach(doc => { const v = doc.data(); if (!v) return; if (doc.id === 'state') remoteS = v; else if (v.ch) remoteN[v.ch] = v; });
    const localS = S;
    S = remoteS ? mergeState(localS, remoteS) : localS;
    const pushState = !remoteS || JSON.stringify(S.ch) !== JSON.stringify(remoteS.ch);
    const pushNotes = [];
    new Set([...Object.keys(N), ...Object.keys(remoteN)]).forEach(k => {
      const x = N[k], y = remoteN[k];
      if (!y) { N[k] = x; pushNotes.push(k); } else if (!x || (y.up || 0) >= (x.up || 0)) N[k] = y; else pushNotes.push(k);
    });
    mode = 'cloud';
    remapIds();
    saveLocal();
    if (pushState) pending.add('state');
    pushNotes.forEach(k => pending.add(k));
    if (pending.size) flushT = setTimeout(flush, 800);
    refreshAll();
  } catch (e) { console.warn('learn-layer db', e); mode = 'local'; }
  chip();
}

// Renamed chapter ids (cfg.aliases: old -> new): move progress and notes once; newest wins.
function remapIds() {
  const A = C.aliases || {}; let changed = false;
  Object.entries(A).forEach(([o, n]) => {
    const x = S.ch[o];
    if (x) { const y = S.ch[n]; if (!y || (x.u || 0) > (y.u || 0)) S.ch[n] = x; delete S.ch[o]; changed = true; }
    const m = N[o];

.call.warn,.call.risk,blockquote.warn{--lv-m:url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>${I.alert}</svg>`)}");--lv-ic:var(--ll-warn)}
.call.deep,blockquote.deep{--lv-m:url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>${I.search}</svg>`)}")}
.call.try{--lv-m:url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>${I.gear}</svg>`)}")}
/* diagrams: softer node corners and a caption for added figures */
.mmd-wrap svg .node rect,figure.mmd svg .node rect,.mmd-wrap svg rect.actor,figure.mmd svg rect.actor{rx:8px;ry:8px}
.lv-figcap{display:flex;align-items:center;gap:8px;margin:22px 0 -10px;font-size:13px;font-weight:700;color:var(--ink-2)}
.lv-figcap .new{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--ll-acc-soft);color:var(--ll-acc)}
/* route map in the 学习台 */
.lv-route{display:grid;gap:0;margin:0;padding:0;list-style:none}
.lv-route li{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;position:relative;padding:6px 0;max-width:none}
.lv-route li::before{content:"";position:absolute;left:19px;top:-50%;bottom:50%;width:2px;background:var(--rule)}
.lv-route li:first-child::before{display:none}
.lv-route li.done::before{background:var(--ll-ok)}
.lv-route .st{position:relative;width:40px;height:40px;display:grid;place-items:center;color:var(--ink-2)}
.lv-route .st svg.ring{position:absolute;inset:0}
.lv-route li.cur .st{color:var(--ll-acc)}
.lv-route .nm{font-size:13.5px;line-height:1.4;min-width:0}
.lv-route li.cur .nm{font-weight:700}
.lv-route .ct{font-family:var(--f-mono,monospace);font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
`;

/* ---------- cover illustration ---------- */
function art(seed) {
  // a faint chain of blocks drifting across the banner, seeded so each chapter differs slightly
  let r = seed; const rnd = () => (r = (r * 1103515245 + 12345) >>> 0) / 4294967296;
  let g = '';
  const n = 7, y0 = 40 + rnd() * 40;
  let px = null, py = null;
  for (let i = 0; i < n; i++) {
    const x = 330 + i * 70 + rnd() * 16, y = y0 + Math.sin(i * 0.9 + rnd()) * 26, s = 22 + rnd() * 10;
    if (px !== null) g += `<path d="M${px + 12} ${py}L${x - s / 2} ${y}" stroke="currentColor" stroke-opacity=".28" stroke-width="1.5" stroke-dasharray="4 5"/>`;
    g += `<g transform="translate(${x} ${y})" opacity="${0.12 + i * 0.03}"><path d="M0 ${-s / 2} ${s / 2} ${-s / 4}v${s / 2}L0 ${s / 2} ${-s / 2} ${s / 4}v${-s / 2}z" fill="currentColor" fill-opacity=".18" stroke="currentColor" stroke-width="1.4"/><path d="M${-s / 2} ${-s / 4} 0 0 ${s / 2} ${-s / 4}M0 0v${s / 2}" stroke="currentColor" stroke-width="1.2" fill="none"/></g>`;
    px = x; py = y;
  }
  let dots = '';
  for (let i = 0; i < 26; i++) dots += `<circle cx="${(rnd() * 820).toFixed(0)}" cy="${(rnd() * 170).toFixed(0)}" r="${(1 + rnd() * 1.6).toFixed(1)}" fill="currentColor" fill-opacity="${(0.08 + rnd() * 0.12).toFixed(2)}"/>`;
  return `<svg viewBox="0 0 820 170" preserveAspectRatio="xMaxYMid slice" aria-hidden="true"><defs><linearGradient id="lvg${seed % 997}" x1="0" x2="1"><stop offset="0" stop-color="currentColor" stop-opacity="0"/><stop offset="1" stop-color="currentColor" stop-opacity=".10"/></linearGradient></defs><rect width="820" height="170" fill="url(#lvg${seed % 997})"/>${dots}${g}</svg>`;
}
function facts(root) {
  const text = (root.textContent || '').replace(/\s+/g, '').length;
  const mins = Math.max(3, Math.round(text / 450));
  const figs = $$('.mmd-wrap, figure.mmd', root).length;
  const labs = $$('.lab, .lab-slot, a.lab-link, [data-lab]', root).length;
  const qs = $$('.quiz', root).length + $$('.ll-ans', root).length;
  return [['clock', `约 ${mins} 分钟`], figs && ['map', `${figs} 张图`], labs && ['gear', `${labs} 个实验`], qs && ['target', `${qs} 道题`]].filter(Boolean);
}
function cover(root, ch) {
  if ($('.lv-cover', root)) return;
  const h1 = $('h1', root); if (!h1) return;
  const key = ch.group || ch.title, hue = HUES[hash(key) % HUES.length];
  const icons = pickIcons(ch.title, ch.group);
  const el = document.createElement('div'); el.className = 'lv-cover'; el.setAttribute('role', 'img'); el.setAttribute('aria-label', `章节题图：${ch.title}`);
  el.style.setProperty('--lv-c', `var(${hue})`); el.style.setProperty('--lv-soft', `var(${hue}-soft, var(--tint))`);
  el.innerHTML = `<div class="lv-art">${art(hash(ch.id))}</div>
    <div class="lv-txt"><div class="lv-eye">${esc(ch.group || '')}</div>
      <div class="lv-facts">${facts(root).map(([k, t]) => `<span>${svgIcon(k, 14, 2)}${t}</span>`).join('')}</div></div>
    <div class="lv-hero"><div class="lv-tile">${svgIcon(icons[0], 46, 1.5)}</div><div class="lv-sat a">${svgIcon(icons[1], 22)}</div><div class="lv-sat b">${svgIcon(icons[2], 22)}</div></div>`;
  h1.before(el);
}

/* ---------- section map + reading progress ---------- */
let autoDone = null, spy = null, heads = [], seen = new Set(), tocFor = null;
function slug(h, i) { if (!h.id) h.id = 'lv-s' + i + '-' + hash(h.textContent).toString(36); return h.id; }
function sectionMap(root, ch) {
  heads = $$(':scope > h2, :scope > section > h2, h2', root).filter((h, i, a) => a.indexOf(h) === i && !h.closest('.ll-card, .lab, .quiz') && h.textContent.trim());
  if (tocFor !== ch.id) { seen = new Set(); tocFor = ch.id; }
  let toc = $('.lv-toc');
  if (!toc) { toc = document.createElement('nav'); toc.className = 'lv-toc'; toc.setAttribute('aria-label', '本章地图'); document.body.appendChild(toc); }
  toc.hidden = heads.length < 2;
  toc.innerHTML = `<div class="k">本章地图</div><ol>${heads.map((h, i) => `<li data-i="${i}"><a href="#${esc(ch.id)}" data-lv-go="${slug(h, i)}">${esc(h.textContent.replace(/^\d+[.、]\s*/, ''))}</a></li>`).join('')}</ol>`;
  const strip = $('.ll-strip', root);
  if (strip && heads.length >= 2 && !$('.lv-tocbtn', strip)) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'll-btn lv-tocbtn'; b.innerHTML = `${svgIcon('layersDeep', 15, 2)}本章 ${heads.length} 节`;
    b.addEventListener('click', () => {
      let p = $('.lv-tocpop', root);
      if (p) { p.remove(); return; }
      p = document.createElement('div'); p.className = 'lv-tocpop';
      p.innerHTML = heads.map((h, i) => `<a href="#${esc(ch.id)}" data-lv-go="${h.id}" class="${seen.has(i) ? 'seen' : ''}">${esc(h.textContent)}</a>`).join('');
      strip.after(p);
    });
    strip.insertBefore(b, $('.ll-sp', strip));
  }
  fitToc(); onScroll();
}
function fitToc() {
  const r = curRoot && curRoot.getBoundingClientRect();
  document.body.classList.toggle('lv-wide', !!(r && r.width && window.innerWidth - r.right >= 228));
}
function onScroll() {
  const bar = $('.lv-prog i');
  const root = curRoot; if (!root || !bar) return;
  const r = root.getBoundingClientRect(), vh = window.innerHeight;
  const p = Math.min(1, Math.max(0, (vh * 0.35 - r.top) / Math.max(1, r.height - vh * 0.5)));
  bar.style.width = (curId ? p * 100 : 0) + '%';
  if (curId && p >= 0.97 && autoDone !== curId && r.height > vh * 1.2) { autoDone = curId; window.LearnLayer && LearnLayer.autoRead && LearnLayer.autoRead(curId); }
  let on = -1; heads.forEach((h, i) => { if (h.getBoundingClientRect().top < vh * 0.35) { on = i; seen.add(i); } });
  $$('.lv-toc li').forEach((li, i) => { li.classList.toggle('on', i === on); li.classList.toggle('seen', seen.has(i) && i !== on); });
}

/* ---------- route map (rendered into the 学习台 overview) ---------- */
function ringSvg(p, cls) {
  const r = 17, c = 2 * Math.PI * r;
  return `<svg class="ring" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="${r}" fill="var(--paper)" stroke="var(--tint)" stroke-width="3.5"/><circle cx="20" cy="20" r="${r}" fill="none" stroke="var(${cls})" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="${(c * p).toFixed(2)} ${c.toFixed(2)}" transform="rotate(-90 20 20)"/></svg>`;
}
function routeHtml(chs, S, curGroup) {
  const groups = [];
  chs.forEach(c => { let g = groups.find(x => x.name === (c.group || '全部')); if (!g) groups.push(g = { name: c.group || '全部', list: [] }); g.list.push(c); });
  return `<div class="ll-sec"><h4>学习路线</h4><ol class="lv-route">${groups.map(g => {
    const m = g.list.filter(c => (S.ch[c.id] || {}).s === 2).length, rd = g.list.filter(c => (S.ch[c.id] || {}).s === 1).length, rd3 = g.list.filter(c => (S.ch[c.id] || {}).s === 3).length;
    const p = m / g.list.length, done = m === g.list.length;
    const icon = pickIcons(g.name, '')[0];
    return `<li class="${done ? 'done' : ''} ${g.name === curGroup ? 'cur' : ''}"><span class="st">${ringSvg(p, done ? '--ll-ok' : '--ll-acc')}<span style="position:relative">${svgIcon(icon, 16, 2)}</span></span><span class="nm">${esc(g.name)}${rd3 ? `<span class="ll-meta"> · 已读 ${rd3}</span>` : ''}${rd ? `<span class="ll-meta"> · 在读 ${rd}</span>` : ''}</span><span class="ct">${m}/${g.list.length}</span></li>`;
  }).join('')}</ol></div>`;
}

/* ---------- wiring ---------- */
let curRoot = null, curId = null;
function apply() {
  const api = window.LearnLayer && LearnLayer.ctx && LearnLayer.ctx(); if (!api) return;
  const { root, cur, chapters } = api;
  curRoot = root; curId = cur ? cur.id : null;
  const toc = $('.lv-toc');
  if (!root || !cur) { if (toc) toc.hidden = true; onScroll(); return; }
  const meta = chapters.find(c => c.id === cur.id) || {};
  cover(root, { id: cur.id, title: cur.title, group: meta.group });
  sectionMap(root, cur);
}
function init() {
  const st = document.createElement('style'); st.textContent = CSS; document.head.appendChild(st);
  const pb = document.createElement('div'); pb.className = 'lv-prog'; pb.innerHTML = '<i></i>'; const hb = $('.bar'); if (hb) { if (getComputedStyle(hb).position === 'static') hb.style.position = 'relative'; hb.appendChild(pb); }
  document.addEventListener('click', e => {
    const a = e.target.closest('[data-lv-go]'); if (!a) return;
    e.preventDefault(); const h = document.getElementById(a.dataset.lvGo);
    if (h) { const y = h.getBoundingClientRect().top + window.scrollY - 70; window.scrollTo({ top: y, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
  });
  window.addEventListener('resize', () => { fitToc(); onScroll(); }, { passive: true });
  window.addEventListener('scroll', () => { if (!spy) spy = requestAnimationFrame(() => { spy = null; onScroll(); }); }, { passive: true });
  if (window.LearnLayer && LearnLayer.onSync) LearnLayer.onSync(apply);
  if (window.LearnLayer && LearnLayer.addHome) LearnLayer.addHome((chs, S, cur) => routeHtml(chs, S, cur));
  apply();
}
window.LearnVisual = { icons: I, svgIcon };
init();
})();

</script>
