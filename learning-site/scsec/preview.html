户数增长后超过区块 gas 上限<\/td>\n<td>分页处理；累计奖励因子（如 MasterChef 的 accRewardPerShare）<\/td>\n<\/tr>\n<tr>\n<td>黑名单地址卡住批量操作<\/td>\n<td>批量分发 USDT，其中一个地址被冻结<\/td>\n<td>逐个 <code>try/catch<\/code>，失败记账待领取<\/td>\n<\/tr>\n<tr>\n<td>依赖强制余额等式<\/td>\n<td><code>require(balance == recorded)<\/code>，被人强制转入 1 wei<\/td>\n<td>用 <code>&gt;=<\/code>，或不依赖实际余额<\/td>\n<\/tr>\n<tr>\n<td>TRON：能量 / CPU 时间耗尽<\/td>\n<td>单笔 TVM 执行超过 80 毫秒 CPU 时间，返回 <code>OUT_OF_TIME<\/code><\/td>\n<td>控制单笔计算量；不在一笔交易里遍历大数组<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<blockquote class=\"warn\"><p>⚠️ 警告：以太坊上的 Akutars NFT（2022 年 4 月）同时有两个出口缺陷：推送退款可被一个拒收合约卡死；项目方提款的条件比较了错误的变量，永远不成立。11,539.5 ETH 被永久锁定。见 <a href=\"#k00\" data-nav=\"k00\">C00<\/a> 4.3 节。<\/p>\n<\/blockquote>\n<blockquote class=\"info\"><p>💡 注意：TRON 的执行限制不只是&quot;能量（Energy）&quot;。TRON 官方文档说明，每次 TVM 执行有 80 毫秒 CPU 时间上限。在以太坊上 gas 足够的循环，在 TRON 上可能因超时失败。详见 <a href=\"#k02\" data-nav=\"k02\">C02<\/a>。<\/p>\n<\/blockquote>\n<hr>\n<h2>5. 授权（Approve）相关风险<\/h2>\n<ol>\n<li><strong>无限授权<\/strong>：用户给协议 <code>approve(type(uint256).max)<\/code>。协议被攻破后，攻击者可以转走用户钱包里的全部该代币——即使用户没有存进协议。<\/li>\n<li><strong>授权钓鱼<\/strong>：钓鱼网站诱导用户签 <code>approve<\/code> 或 <code>permit<\/code>（链下签名授权）。TRON 上的 USDT 授权钓鱼和以太坊上的 <code>permit<\/code> 钓鱼原理相同。<\/li>\n<li><strong>任意调用 + 授权<\/strong>：路由合约持有用户授权，又允许用户指定任意调用目标（<a href=\"#c04\" data-nav=\"c04\">04 章<\/a> 3.4 节）。攻击者让路由合约调用 <code>token.transferFrom(受害者, 攻击者, 金额)<\/code>。<\/li>\n<\/ol>\n<blockquote class=\"warn\"><p>⚠️ 警告：持有用户授权的合约（路由器、聚合器）必须<strong>禁止<\/strong>用户指定任意调用目标和任意 calldata。这是聚合器被盗的最常见根因之一。<\/p>\n<\/blockquote>\n<p>案例：Sushi RouteProcessor2（2023 年 4 月，约 330 万美元）。路由里的池子地址由用户填写；攻击者填入自己的&quot;池子&quot;，在回调中把任意授权用户设为付款人。回调校验只检查&quot;是不是刚才调用的地址&quot;，没有检查&quot;是不是真实池子&quot;。见 <a href=\"#k00\" data-nav=\"k00\">C00<\/a> 4.7 节与 <a href=\"#examples\" data-nav=\"examples\">examples/08-RouterCallback.sol<\/a>。<\/p>\n<hr>\n<h2>6. 审计检查点<\/h2>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> 所有低级 <code>call<\/code> 都检查了返回值。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 调用目标可能是零地址或无代码地址时，已显式检查。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 代币操作使用 <code>SafeERC20<\/code>；部署到 TRON 时，USDT 推送单独处理。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 支持任意代币时，按实收金额记账；不支持的类型（收税、变基）显式拒绝。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 批量转账和退款使用拉取模式，或单笔失败不影响整体。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 没有依赖用户规模增长的无界循环。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 持有授权的合约不允许任意 calldata。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 代币精度从合约读取（<a href=\"#c05\" data-nav=\"c05\">05 章<\/a>）。<\/li>\n<\/ul>\n<hr>\n<h2>7. 用户侧防护<\/h2>\n<p>普通用户看不到合约代码，但可以通过几个公开信号降低风险。<\/p>\n<ol>\n<li>只授权你需要的数额，不给无限授权；用完后撤销。<\/li>\n<li>定期在授权管理工具中检查并撤销不再使用的授权。<\/li>\n<li>收到陌生代币不要交互：不要尝试卖出或&quot;领取&quot;，它可能是钓鱼合约。<\/li>\n<li>转入有转账税、可变基（rebase）或黑名单功能的代币前，确认目标协议支持这类代币。<\/li>\n<li>在 TRON 上转 USDT 时，确认交易状态是&quot;成功&quot;，不只是&quot;已广播&quot;。<\/li>\n<\/ol>\n<hr>\n<h2>8. 术语表<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>术语<\/th>\n<th>英文<\/th>\n<th>定义<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>低级调用<\/td>\n<td>Low-level call<\/td>\n<td><code>address.call<\/code> / <code>delegatecall<\/code> / <code>staticcall<\/code>，失败不自动回滚<\/td>\n<\/tr>\n<tr>\n<td>收税代币<\/td>\n<td>Fee-on-transfer Token<\/td>\n<td>转账时扣除一部分作为手续费的代币<\/td>\n<\/tr>\n<tr>\n<td>变基代币<\/td>\n<td>Rebasing Token<\/td>\n<td>持有者余额按规则自动增减的代币<\/td>\n<\/tr>\n<tr>\n<td>拒绝服务<\/td>\n<td>DoS<\/td>\n<td>让合约功能无法使用的攻击<\/td>\n<\/tr>\n<tr>\n<td>拉取式支付<\/td>\n<td>Pull Payment<\/td>\n<td>只记账，由收款人主动提取<\/td>\n<\/tr>\n<tr>\n<td>授权<\/td>\n<td>Allowance / Approve<\/td>\n<td>允许另一个地址代为转出自己代币的额度<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2>9. 思考题<\/h2>\n<ol>\n<li>一个收益协议在以太坊上运行良好，部署到 TRON 后所有提款都失败了，但存款正常。最可能的原因是什么？<\/li>\n<li>一个协议按 <code>amount<\/code> 参数记账，并接受一个 2% 转账税的代币。存入 100 枚、再取出 100 枚，会发生什么？如果所有用户都这样做呢？<\/li>\n<li>打开 <a href=\"#lab-chain-porting-lab\" data-nav=\"lab-chain-porting-lab\" class=\"lab-link\">chain-porting-lab.html<\/a>，选择&quot;TRON&quot;并勾选&quot;使用 SafeERC20 推送 USDT&quot;。实验页给出了什么风险？<\/li>\n<\/ol>\n<p>下一章：<a href=\"#c07\" data-nav=\"c07\">07 预言机与闪电贷<\/a> —— 合约相信了一个一笔交易就能改写的价格。<\/p>\n"}, "c07": {"id": "c07", "file": "07-oracle-flashloan.md", "title": "07 预言机与闪电贷：一笔交易就能改写的价格", "group": "g3", "html": "<h1>07 预言机与闪电贷：一笔交易就能改写的价格<\/h1>\n<blockquote class=\"\"><p>学习目标：读完本章，你能——<\/p>\n<ol>\n<li>解释闪电贷为什么让&quot;本金&quot;不再是攻击门槛。<\/li>\n<li>比较 AMM 现货价、TWAP、链下聚合预言机三类价格源的抗操纵能力。<\/li>\n<li>写出安全读取 Chainlink 类预言机的检查清单，包括 L2 排序器状态检查。<\/li>\n<\/ol>\n<p>前置章节：<a href=\"#c05\" data-nav=\"c05\">05 算术与精度<\/a><br>交互实验：<a href=\"#lab-oracle-manipulation-lab\" data-nav=\"lab-oracle-manipulation-lab\" class=\"lab-link\">oracle-manipulation-lab.html<\/a> ｜ 示例合约：<a href=\"#examples\" data-nav=\"examples\">examples/04-SpotOracle.sol<\/a><\/p>\n<\/blockquote>\n<hr>\n<h2>1. 一句话理解<\/h2>\n<p><strong>如果合约用&quot;同一笔交易里可以被改变的数据&quot;来定价，攻击者就会先借一大笔钱改变它，再按错误的价格和合约做交易，最后把钱还回去。<\/strong><\/p>\n<p>预言机（Oracle）：把链外或其他合约中的数据（通常是价格）提供给合约使用的机制。<\/p>\n<p>闪电贷（Flash Loan）：借款、使用、还款都在同一笔交易里完成的贷款。如果交易结束时没有还款，整笔交易回滚，所以出借方没有风险，也不需要抵押。<\/p>\n<blockquote class=\"analogy\"><p>🎯 打个比方：一家当铺按&quot;隔壁菜市场的最新成交价&quot;给黄金估价。<\/p>\n<ol>\n<li>你从朋友那里借来 1 亿（闪电贷）。<\/li>\n<li>你在菜市场以离谱的高价买下全部黄金（推高现货价）。<\/li>\n<li>你拿 1 克黄金去当铺，当铺按刚才的成交价估值 100 万，借给你 75 万。<\/li>\n<li>你把黄金卖回菜市场，还给朋友 1 亿。<\/li>\n<li>你净赚 75 万减去交易损耗。当铺手里只剩 1 克普通价格的黄金。<\/li>\n<\/ol>\n<p>比喻的局限：现实中这些步骤需要几天。链上它们发生在<strong>同一个区块的同一笔交易里<\/strong>，没有人来得及反应。<\/p>\n<\/blockquote>\n<hr>\n<h2>2. 威胁模型<\/h2>\n<p>攻击者在一笔交易内能做到：<\/p>\n<ol>\n<li>借到几乎无限的资金（闪电贷池的全部流动性）。<\/li>\n<li>把任何 AMM 池子的现货价格推到任意位置（只要付得起滑点）。<\/li>\n<li>直接向合约转入资产，改变 <code>balanceOf<\/code> 类读数。<\/li>\n<li>把以上操作和对目标协议的调用任意组合。<\/li>\n<\/ol>\n<p>因此，<strong>任何在一笔交易内可变的读数都是攻击者的输入参数<\/strong>：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>读数<\/th>\n<th>一笔交易内可变？<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>AMM 池子储备比例 <code>reserve1 / reserve0<\/code><\/td>\n<td>是<\/td>\n<\/tr>\n<tr>\n<td>LP 代币价格（按储备直接计算）<\/td>\n<td>是<\/td>\n<\/tr>\n<tr>\n<td>金库份额价格 <code>totalAssets / totalSupply<\/code>（<code>totalAssets<\/code> 读余额）<\/td>\n<td>是（捐赠）<\/td>\n<\/tr>\n<tr>\n<td>代币的 <code>balanceOf(合约)<\/code><\/td>\n<td>是<\/td>\n<\/tr>\n<tr>\n<td>Uniswap V2/V3 TWAP（时间加权平均价）<\/td>\n<td>当前区块影响很小；多区块持续操纵可以<\/td>\n<\/tr>\n<tr>\n<td>Chainlink 类链下聚合价格<\/td>\n<td>否（但可能过时或触及上下限）<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2>3. 漏洞机制：AMM 现货价<\/h2>\n<p>恒定乘积 AMM（x × y = k）中：<\/p>\n<div class=\"code-wrap\"><pre><code>现货价 P = y / x\n买入 Δx 需要支付 Δy = y × Δx / (x − Δx)   （忽略手续费）\n<\/code><\/pre><\/div>\n<div class=\"code-wrap\"><pre><code class=\"language-solidity\">// ❌ 漏洞：用 AMM 储备直接计算价格\nfunction getPrice() public view returns (uint256) {\n    (uint112 r0, uint112 r1, ) = pair.getReserves();\n    return uint256(r1) * 1e18 / r0;\n}\nfunction borrow(uint256 collateralAmt) external {\n    uint256 value = collateralAmt * getPrice() / 1e18;\n    uint256 maxBorrow = value * 75 / 100;   // LTV 75%（示例）\n    ...\n}\n<\/code><\/pre><\/div>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">sequenceDiagram\n  autonumber\n  participant A as 攻击合约\n  participant F as 闪电贷池\n  participant D as AMM 池（TOKEN/USDC）\n  participant L as 借贷协议\n  A-&gt;&gt;F: 借 1,000 万 USDC\n  A-&gt;&gt;D: 用 USDC 买入 TOKEN\n  Note over D: TOKEN 现货价上涨 N 倍\n  A-&gt;&gt;L: 存入少量 TOKEN 作为抵押\n  L-&gt;&gt;D: getReserves()\n  D--&gt;&gt;L: 被操纵的储备\n  L--&gt;&gt;A: 按虚高价格借出 USDC\n  A-&gt;&gt;D: 卖回 TOKEN\n  A-&gt;&gt;F: 还款 + 手续费\n  Note over L: 抵押品真实价值 &lt;&lt; 借款，产生坏账<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul>\n<li>攻击者的利润 = 借出金额 − 两次交换的滑点和手续费 − 闪电贷费用。<\/li>\n<li>池子越浅，推高价格越便宜。所以长尾资产和低流动性代币风险最高。<\/li>\n<li>局限：如果借贷协议使用 TWAP 或链下聚合价格，第 5 步读到的价格几乎不变，攻击失败。<\/li>\n<\/ul>\n<p>去 <a href=\"#lab-oracle-manipulation-lab\" data-nav=\"lab-oracle-manipulation-lab\" class=\"lab-link\">oracle-manipulation-lab.html<\/a>，调节闪电贷金额，观察利润和协议坏账，再把预言机切换成 TWAP。<\/p>\n<hr>\n<h2>4. 三类价格源对比<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>价格源<\/th>\n<th>抗单笔操纵<\/th>\n<th>抗多区块操纵<\/th>\n<th>延迟<\/th>\n<th>主要风险<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>AMM 现货价<\/td>\n<td>✗<\/td>\n<td>✗<\/td>\n<td>无<\/td>\n<td>闪电贷操纵<\/td>\n<\/tr>\n<tr>\n<td>AMM TWAP<\/td>\n<td>✓<\/td>\n<td>取决于窗口和流动性<\/td>\n<td>窗口长度<\/td>\n<td>低流动性池仍可被持续操纵；窗口越长价格越滞后<\/td>\n<\/tr>\n<tr>\n<td>链下聚合（Chainlink 类）<\/td>\n<td>✓<\/td>\n<td>✓<\/td>\n<td>心跳 / 偏离阈值<\/td>\n<td>价格过时、上下限熔断、预言机节点或喂价方失效<\/td>\n<\/tr>\n<tr>\n<td>多源组合 + 偏离检查<\/td>\n<td>✓<\/td>\n<td>✓<\/td>\n<td>取决于组成<\/td>\n<td>实现复杂；源之间分歧时如何处理<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<blockquote class=\"info\"><p>💡 注意：没有完美的预言机。工程上要回答两个问题：价格错了会怎样？价格停了会怎样？<\/p>\n<\/blockquote>\n<hr>\n<h2>5. 安全读取链下预言机<\/h2>\n<div class=\"code-wrap\"><pre><code class=\"language-solidity\">// ✅ 读取 Chainlink 类聚合器的检查清单\n(uint80 roundId, int256 answer, , uint256 updatedAt, ) = feed.latestRoundData();\nrequire(answer &gt; 0, &quot;invalid price&quot;);\nrequire(block.timestamp - updatedAt &lt;= MAX_DELAY, &quot;stale price&quot;);   // 按喂价心跳设置\nrequire(uint256(answer) &gt; MIN_BOUND &amp;&amp; uint256(answer) &lt; MAX_BOUND, &quot;out of bounds&quot;);\nuint8 dec = feed.decimals();                                        // 不要写死 8\n<\/code><\/pre><\/div>\n<div class=\"lv-figcap\"><span>图 · 读取预言机价格的检查顺序<\/span><span class=\"new\">新增图解<\/span><\/div><div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart TB\n  A[\"latestRoundData() 读价格\"] --&gt; B{\"answer &gt; 0？\"}\n  B --&gt;|\"否\"| X1[\"回滚：invalid price\"]\n  B --&gt;|\"是\"| C{\"距 updatedAt ≤ MAX_DELAY？\"}\n  C --&gt;|\"否\"| X2[\"回滚：stale price\"]\n  C --&gt;|\"是\"| D{\"在 MIN_BOUND 和 MAX_BOUND 之间？\"}\n  D --&gt;|\"否\"| X3[\"回滚：out of bounds\"]\n  D --&gt;|\"是\"| E[\"读取 decimals()&lt;br/&gt;不写死 8\"]\n  E --&gt; F{\"L2：排序器在线&lt;br/&gt;且已过宽限期？\"}\n  F --&gt;|\"否\"| X4[\"暂停清算和新借款\"]\n  F --&gt;|\"是\"| G[\"使用价格\"]<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul><li><strong>关键：<\/strong>四项基本检查：正值、时效、上下限、精度。<\/li><li><strong>出错点：<\/strong>排序器宕机时喂价无法上链，价格停留在宕机前。<\/li><li><strong>风险：<\/strong>恢复后的第一批区块里，能从 L1 强制提交交易的少数人占优。<\/li><li><strong>局限：<\/strong>部署前要确认目标 L2 上确实有排序器在线状态喂价。<\/li><\/ul>\n\n<h3>5.1 L2 上的额外检查：排序器是否在线<\/h3>\n<p>在 Mantle 这样的 L2 上，交易由排序器（Sequencer）打包。排序器宕机时：<\/p>\n<ol>\n<li>喂价交易无法上链，价格停留在宕机前。<\/li>\n<li>恢复后的第一批区块里，普通用户和清算机器人同时涌入。能通过 L1 强制提交交易的少数人占优。<\/li>\n<\/ol>\n<p>业界通用做法：读取&quot;排序器在线状态&quot;喂价（Chainlink 在多条 L2 上提供 Sequencer Uptime Feed）。排序器恢复后设置一段宽限期（例如 1 小时，示例），宽限期内暂停清算或新借款。部署前要确认目标 L2 上是否有此喂价。<\/p>\n<blockquote class=\"info\"><p>💡 注意：根据 L2BEAT 截至 2026 年的页面，Mantle 排序器宕机时，用户可以通过 L1 强制提交交易，延迟最长 12 小时。见 <a href=\"#k03\" data-nav=\"k03\">C03<\/a>。<\/p>\n<\/blockquote>\n<h3>5.2 熔断上下限：Venus 与 LUNA（2022 年 5 月，BNB Chain）<\/h3>\n<ul>\n<li>公开报道：Chainlink 的 LUNA/USD 喂价设置了最低价（minAnswer）0.10 美元。<\/li>\n<li>LUNA 崩盘到远低于 0.10 美元时，喂价停在下限附近。<\/li>\n<li>BNB Chain 上的 Venus 协议仍按约 0.1 美元给 LUNA 抵押品估值。有人在市场上低价买入 LUNA，存入 Venus 借出其他资产，协议损失约 1,100 万美元（公开报道）。<\/li>\n<li>教训：读取价格时，检查是否触碰上下限；为抵押资产设置供应上限和紧急下架流程。<\/li>\n<\/ul>\n<div class=\"lv-figcap\"><span>图 · 喂价触底后的损失链<\/span><span class=\"new\">新增图解<\/span><\/div><div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart TB\n  A[\"LUNA/USD 喂价&lt;br/&gt;minAnswer 0.10 美元\"] --&gt; B[\"LUNA 崩到远低于 0.10\"]\n  B --&gt; C[\"喂价停在下限附近\"]\n  C --&gt; D[\"Venus 仍按约 0.1 美元估值\"]\n  E[\"市场上低价买入 LUNA\"] --&gt; F[\"存入 Venus 作抵押\"]\n  D --&gt; G[\"按虚高估值借出其他资产\"]\n  F --&gt; G\n  G --&gt; H[\"协议损失约 1,100 万美元\"]<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul><li><strong>数据流：<\/strong>攻击者在市场低价买入，在协议里按下限价被高估。<\/li><li><strong>出错点：<\/strong>价格没有过时，也是正值，但已经触碰下限。<\/li><li><strong>关键：<\/strong>读价格时要检查是否触碰上下限。<\/li><li><strong>局限：<\/strong>只靠检查不够，还要给抵押资产设供应上限和紧急下架流程。<\/li><\/ul>\n\n<hr>\n<h2>6. 真实案例：BNB Chain 上的价格操纵<\/h2>\n<p>BNB Chain 早期 DeFi 生态快速扩张，大量协议使用 PancakeSwap 池子价格。以下案例按机制分类，详见 <a href=\"#k01\" data-nav=\"k01\">C01<\/a>。<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>时间<\/th>\n<th>协议<\/th>\n<th>约损失<\/th>\n<th>被操纵的读数<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>2021-05<\/td>\n<td>PancakeBunny<\/td>\n<td>约 4,500 万美元<\/td>\n<td>按 PancakeSwap 池储备计算 LP 代币价值，并据此铸造 BUNNY 奖励<\/td>\n<\/tr>\n<tr>\n<td>2021-05<\/td>\n<td>Venus（XVS 事件）<\/td>\n<td>清算超过 2 亿美元，坏账超过 9,500 万美元<\/td>\n<td>低流动性治理代币 XVS 作为抵押品，价格被快速拉升后回落（项目方称&quot;可能&quot;操纵）<\/td>\n<\/tr>\n<tr>\n<td>2022-05<\/td>\n<td>Venus（LUNA）<\/td>\n<td>约 1,100 万美元<\/td>\n<td>预言机下限熔断<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>以太坊上的对照案例：<\/p>\n<ul>\n<li><strong>bZx（2020 年 2 月）<\/strong>：最早被广泛报道的闪电贷价格操纵之一，两次合计约 95 万美元。<\/li>\n<li><strong>Cream Finance（2021 年 10 月）<\/strong>：攻击者通过向 yUSD 金库&quot;捐赠&quot;抬高份额价格，而 Cream 用份额价格给抵押品估值，损失约 1.3 亿美元。<\/li>\n<li><strong>Harvest Finance（2020 年 10 月）<\/strong>：金库份额价格依赖 Curve Y 池中的稳定币价格。攻击者用闪电贷反复&quot;压价存入、抬价赎回&quot;，取走约 3,380 万美元。<\/li>\n<li><strong>Inverse Finance（2022 年 4 月）<\/strong>：攻击者<strong>没有使用闪电贷<\/strong>，而是投入自有资金持续推高浅池中的 INV 价格，并用垃圾交易抑制套利，使 TWAP 预言机输出虚高价格，借走约 1,560 万美元。TWAP 挡不住有资本的多区块操纵。<\/li>\n<\/ul>\n<p>以上以太坊案例的完整路径见 <a href=\"#k00\" data-nav=\"k00\">C00 以太坊专题<\/a> 4.5、4.6 节。<\/p>\n<blockquote class=\"warn\"><p>⚠️ 警告：LP 代币不能用 <code>储备 × 现货价 / 总供应<\/code> 定价。应使用&quot;公平储备&quot;法：用外部预言机价格和不变量 k 反推出公平储备，再计算 LP 价值。<\/p>\n<\/blockquote>\n<hr>\n<h2>7. 防御清单<\/h2>\n<ol>\n<li>不用 AMM 现货价、<code>balanceOf<\/code> 或可被捐赠改变的份额价格作为关键定价依据。<\/li>\n<li>如果必须用 AMM 价格，使用足够长窗口的 TWAP，并评估池子深度。<\/li>\n<li>读取链下预言机时，检查正值、时效、上下限、精度；L2 上检查排序器状态。<\/li>\n<li>关键资产使用多源价格，源之间偏离超过阈值时暂停。<\/li>\n<li>对低流动性抵押品设置供应上限（Supply Cap）和更低的抵押率。<\/li>\n<li>把&quot;一笔交易内借款 + 还款&quot;的模式纳入监控告警（<a href=\"#c12\" data-nav=\"c12\">12 章<\/a>）。<\/li>\n<\/ol>\n<hr>\n<h2>8. 审计检查点<\/h2>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> 列出协议使用的全部价格来源，标注&quot;一笔交易内是否可变&quot;。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 所有 <code>getReserves()<\/code>、<code>balanceOf(address(this))<\/code>、<code>totalAssets()<\/code> 的读取，是否用于定价？<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> LP 代币和金库份额的估值方法是否抗操纵？<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 预言机读取是否检查了时效、正值、上下限、精度？<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> L2 部署是否检查排序器在线状态？<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 低流动性抵押品是否有供应上限？<\/li>\n<\/ul>\n<hr>\n<h2>9. 用户侧防护<\/h2>\n<p>普通用户看不到合约代码，但可以通过几个公开信号降低风险。<\/p>\n<ol>\n<li>使用借贷协议前，查看它用什么价格源。依赖单一 DEX 现货价的协议风险更高。<\/li>\n<li>低流动性代币做抵押时，价格可能被操纵，清算也可能来得很突然。保持更高的健康度。<\/li>\n<li>极端行情时（大幅暴跌、预言机暂停、L2 排序器宕机），先降低杠杆，不要等清算。<\/li>\n<li>关注协议是否有价格偏差保护和暂停机制。<\/li>\n<li>不要在价格异常波动的几分钟内进行大额兑换；设置合理的滑点。<\/li>\n<\/ol>\n<hr>\n<h2>10. 术语表<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>术语<\/th>\n<th>英文<\/th>\n<th>定义<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>预言机<\/td>\n<td>Oracle<\/td>\n<td>向合约提供外部数据的机制<\/td>\n<\/tr>\n<tr>\n<td>闪电贷<\/td>\n<td>Flash Loan<\/td>\n<td>同一笔交易内借出并归还的无抵押贷款<\/td>\n<\/tr>\n<tr>\n<td>现货价<\/td>\n<td>Spot Price<\/td>\n<td>AMM 池当前储备比例决定的瞬时价格<\/td>\n<\/tr>\n<tr>\n<td>时间加权平均价<\/td>\n<td>TWAP<\/td>\n<td>一段时间内价格按时间加权的平均值<\/td>\n<\/tr>\n<tr>\n<td>心跳<\/td>\n<td>Heartbeat<\/td>\n<td>预言机在价格不变时也强制更新的最长间隔<\/td>\n<\/tr>\n<tr>\n<td>抵押率<\/td>\n<td>LTV, Loan-to-Value<\/td>\n<td>借款额与抵押品价值的最大比例<\/td>\n<\/tr>\n<tr>\n<td>坏账<\/td>\n<td>Bad Debt<\/td>\n<td>抵押品价值低于借款、无法通过清算收回的部分<\/td>\n<\/tr>\n<tr>\n<td>排序器<\/td>\n<td>Sequencer<\/td>\n<td>L2 上负责排序和打包交易的节点<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2>11. 思考题<\/h2>\n<ol>\n<li>打开 <a href=\"#lab-oracle-manipulation-lab\" data-nav=\"lab-oracle-manipulation-lab\" class=\"lab-link\">oracle-manipulation-lab.html<\/a>。在&quot;AMM 现货价&quot;模式下，闪电贷金额多大时攻击利润最高？为什么金额再大利润反而下降？<\/li>\n<li>一个协议用 30 分钟 TWAP。攻击者能否通过连续多个区块买入来操纵它？需要承担什么成本和风险？<\/li>\n<li>你要在 Mantle 上部署一个借贷协议。除了价格本身，还需要读取哪个&quot;状态&quot;喂价？<\/li>\n<\/ol>\n<p>下一章：<a href=\"#c08\" data-nav=\"c08\">08 MEV 与签名安全<\/a> —— 交易顺序和签名，都可以被别人利用。<\/p>\n"}, "c08": {"id": "c08", "file": "08-mev-signatures.md", "title": "08 MEV 与签名安全：顺序可以被买，签名可以被重放", "group": "g3", "html": "<h1>08 MEV 与签名安全：顺序可以被买，签名可以被重放<\/h1>\n<blockquote class=\"\"><p>学习目标：读完本章，你能——<\/p>\n<ol>\n<li>解释抢跑、三明治、尾随三种 MEV，并说出用户侧和协议侧的防御。<\/li>\n<li>列出一份安全签名消息必须包含的 5 个字段，并解释缺少每个字段会被怎样重放。<\/li>\n<li>比较 BNB Chain、TRON、Mantle 三条链的交易排序机制对 MEV 的影响。<\/li>\n<\/ol>\n<p>前置章节：<a href=\"#c07\" data-nav=\"c07\">07 预言机与闪电贷<\/a><br>交互实验：<a href=\"#lab-signature-replay-lab\" data-nav=\"lab-signature-replay-lab\" class=\"lab-link\">signature-replay-lab.html<\/a> ｜ 示例合约：<a href=\"#examples\" data-nav=\"examples\">examples/06-SignatureReplay.sol<\/a><\/p>\n<\/blockquote>\n<hr>\n<h2>1. 一句话理解<\/h2>\n<p><strong>交易在被打包之前是公开的，打包顺序由别人决定；签名在被使用之后仍然存在，能否再次使用取决于你签了什么。<\/strong><\/p>\n<p>MEV（Maximal Extractable Value，最大可提取价值）：区块生产者或搜索者通过调整、插入、排除交易所能获得的额外收益。<\/p>\n<blockquote class=\"analogy\"><p>🎯 打个比方：<\/p>\n<ul>\n<li><strong>MEV<\/strong>：你在拍卖会上举牌前，大声说出了你的最高出价。旁边的人抢先用低一点的价格买下，再加价转卖给你（三明治）。<\/li>\n<li><strong>签名重放<\/strong>：你签了一张&quot;支付 100 元&quot;的支票，没写日期、没写收款银行、没写支票编号。拿到支票的人可以复印它，去每一家银行各兑一次。<\/li>\n<\/ul>\n<p>比喻的局限：拍卖会上你能看到谁插了队。链上的三明治交易和你的交易在同一个区块里，普通用户往往只看到&quot;成交价比预期差&quot;。<\/p>\n<\/blockquote>\n<hr>\n<h2>2. MEV 的三种形态<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>类型<\/th>\n<th>顺序<\/th>\n<th>攻击者利用什么<\/th>\n<th>受害者<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>抢跑（Front-running）<\/td>\n<td>攻击者 → 受害者<\/td>\n<td>受害者交易的信息（例如&quot;先到先得&quot;的奖励）<\/td>\n<td>原交易者<\/td>\n<\/tr>\n<tr>\n<td>三明治（Sandwich）<\/td>\n<td>攻击者买 → 受害者买 → 攻击者卖<\/td>\n<td>受害者设置的滑点容忍度<\/td>\n<td>交易者<\/td>\n<\/tr>\n<tr>\n<td>尾随（Back-running）<\/td>\n<td>受害者 → 攻击者<\/td>\n<td>受害者交易制造的价差或清算机会<\/td>\n<td>通常无直接受害者<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h3>2.1 三明治攻击<\/h3>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">sequenceDiagram\n  autonumber\n  participant V as 受害者\n  participant M as 公开内存池\n  participant S as 搜索者\n  participant B as 区块构建者\n  participant P as AMM 池\n  V-&gt;&gt;M: swap 10 ETH → USDC，最少得到 19,000 USDC（滑点 5%，示例）\n  S-&gt;&gt;M: 发现这笔交易\n  S-&gt;&gt;B: 捆绑：[S 买入, V 的交易, S 卖出]\n  B-&gt;&gt;P: ① S 买入 USDC，推高价格\n  B-&gt;&gt;P: ② V 以更差价格成交，刚好满足最小输出\n  B-&gt;&gt;P: ③ S 卖回，赚取差价<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul>\n<li>搜索者的最大利润由受害者的 <code>amountOutMin<\/code> 决定。滑点设得越宽，被夹得越狠。<\/li>\n<li>受害者的交易<strong>没有失败<\/strong>。它只是以允许范围内最差的价格成交。<\/li>\n<li>局限：如果受害者通过私有通道提交交易，搜索者在打包前看不到它。<\/li>\n<\/ul>\n<h3>2.2 防御<\/h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>层级<\/th>\n<th>措施<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>用户<\/td>\n<td>设置合理滑点；使用私有交易通道（如 Flashbots Protect 一类服务）<\/td>\n<\/tr>\n<tr>\n<td>前端<\/td>\n<td>默认滑点保守；按池子深度动态计算<\/td>\n<\/tr>\n<tr>\n<td>合约<\/td>\n<td>所有交换函数必须接受 <code>minOut<\/code> 和 <code>deadline<\/code> 参数；<strong>不要在合约内部用现货价计算 <code>minOut<\/code><\/strong>（那等于没有保护）<\/td>\n<\/tr>\n<tr>\n<td>协议设计<\/td>\n<td>提交-揭示（Commit-Reveal）；批量拍卖（同一批订单统一价格清算）<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<blockquote class=\"warn\"><p>⚠️ 警告：合约内部调用 DEX 时写 <code>amountOutMin = 0<\/code>，等于告诉全世界&quot;我接受任何价格&quot;。金库、自动复投合约、清算合约常犯这个错误。<\/p>\n<\/blockquote>\n<h3>2.3 三条链的排序机制<\/h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>链<\/th>\n<th>谁决定顺序<\/th>\n<th>对 MEV 的影响（截至 2026 年公开资料）<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>BNB Chain<\/td>\n<td>验证者轮流出块（PoSA）；出块间隔经 Lorentz、Maxwell、Fermi 硬分叉缩短到 0.45 秒（2026 年 1 月）<\/td>\n<td>有公开内存池和区块构建者市场；出块更快，抢跑窗口更短，但三明治依然存在<\/td>\n<\/tr>\n<tr>\n<td>TRON<\/td>\n<td>27 个超级代表轮流出块<\/td>\n<td>能量价格是固定的网络参数，没有 EIP-1559 优先费（TRON 官方文档），所以不能靠&quot;出更高 gas 价&quot;插队；但出块者本身仍可以决定顺序<\/td>\n<\/tr>\n<tr>\n<td>Mantle<\/td>\n<td>单一中心化排序器<\/td>\n<td>排序器按自己的规则排序。L2BEAT 列出风险：&quot;运营者可以抢跑用户交易提取 MEV&quot;。用户依赖运营者的诚实<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<blockquote class=\"info\"><p>💡 注意：&quot;没有公开内存池&quot;不等于&quot;没有 MEV&quot;。它只是把排序权从市场集中到了一个运营者手里。<\/p>\n<\/blockquote>\n<hr>\n<h2>3. 签名安全：一份签名能被用几次<\/h2>\n<p>链下签名在 DeFi 中很常见：<code>permit<\/code>（免 gas 授权）、元交易（Meta-transaction）、订单簿签名订单、跨链桥验证者签名、空投领取凭证。<\/p>\n<h3>3.1 签名必须绑定的五个字段<\/h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>字段<\/th>\n<th>缺少它会怎样<\/th>\n<th>被重放的方式<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>nonce<\/code><\/td>\n<td>同一签名可以反复提交<\/td>\n<td>同一合约重放<\/td>\n<\/tr>\n<tr>\n<td><code>chainId<\/code><\/td>\n<td>签名在分叉链或多链部署上同样有效<\/td>\n<td>跨链重放<\/td>\n<\/tr>\n<tr>\n<td><code>verifyingContract<\/code><\/td>\n<td>同一代码部署两次，签名在两个合约都有效<\/td>\n<td>跨合约重放<\/td>\n<\/tr>\n<tr>\n<td><code>deadline<\/code><\/td>\n<td>签名永久有效<\/td>\n<td>用户撤销意图后仍被使用<\/td>\n<\/tr>\n<tr>\n<td>函数意图（typehash）<\/td>\n<td>为 A 函数签的数据被拿去调用 B 函数<\/td>\n<td>跨函数重放<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>EIP-712 把 <code>name<\/code>、<code>version<\/code>、<code>chainId<\/code>、<code>verifyingContract<\/code> 合成&quot;域分隔符&quot;（Domain Separator），把消息结构合成&quot;类型哈希&quot;（typehash）。正确使用 EIP-712 可以一次解决后四个字段。<\/p>\n<div class=\"code-wrap\"><pre><code class=\"language-solidity\">// ❌ 漏洞：只签了 to 和 amount\nbytes32 h = keccak256(abi.encodePacked(to, amount));\naddress signer = ecrecover(toEthSigned(h), v, r, s);\nrequire(signer == admin);\n\n// ✅ 修复：EIP-712 + nonce + deadline + OpenZeppelin ECDSA\nbytes32 structHash = keccak256(abi.encode(\n    CLAIM_TYPEHASH, to, amount, nonces[to]++, deadline));\nbytes32 digest = _hashTypedDataV4(structHash);   // 含 chainId 与合约地址\naddress signer = ECDSA.recover(digest, sig);       // 拒绝高 s 值与零地址\nrequire(signer == admin &amp;&amp; block.timestamp &lt;= deadline);\n<\/code><\/pre><\/div>\n<p>去 <a href=\"#lab-signature-replay-lab\" data-nav=\"lab-signature-replay-lab\" class=\"lab-link\">signature-replay-lab.html<\/a>，逐个勾掉字段，看哪种重放会成功。<\/p>\n<h3>3.2 三个经典陷阱<\/h3>\n<ol>\n<li><strong><code>ecrecover<\/code> 返回零地址<\/strong>：签名无效时 <code>ecrecover<\/code> 返回 <code>address(0)<\/code>，不会回滚。如果 <code>admin<\/code> 未初始化（默认为 0），任何无效签名都能通过。<\/li>\n<li><strong>签名可塑性（Malleability）<\/strong>：对同一消息，<code>(r, s)<\/code> 和 <code>(r, n − s)<\/code> 都是有效签名。如果用&quot;签名本身&quot;作为已使用标记，攻击者翻转 s 就得到一个&quot;新&quot;签名。修复：用 nonce 或消息哈希做标记，并使用拒绝高 s 值的库。<\/li>\n<li><strong><code>abi.encodePacked<\/code> 碰撞<\/strong>：<code>encodePacked(&quot;ab&quot;, &quot;c&quot;)<\/code> 和 <code>encodePacked(&quot;a&quot;, &quot;bc&quot;)<\/code> 结果相同。签名多个动态类型时使用 <code>abi.encode<\/code>。<\/li>\n<\/ol>\n<h3>3.3 <code>permit<\/code> 的两面<\/h3>\n<ul>\n<li><strong>抢跑型 DoS<\/strong>：用户提交 <code>permitAndDeposit(签名)<\/code>。攻击者从内存池复制签名，先单独调用 <code>token.permit(...)<\/code>。用户的交易因 nonce 已使用而回滚。修复：把 <code>permit<\/code> 包在 <code>try/catch<\/code> 里，失败后检查授权额度是否已经足够。<\/li>\n<li><strong>钓鱼<\/strong>：<code>permit<\/code> 是链下签名，不花 gas，钱包界面常常只显示一段十六进制数据。用户签下后，攻击者可以随时拿去执行。<\/li>\n<\/ul>\n<h3>3.4 TRON 上的签名差异<\/h3>\n<p>TRON 官方开发文档列出了几个和签名相关的 TVM 差异：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>差异<\/th>\n<th>影响<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>CHAINID<\/code> 返回创世区块 ID 的后 4 字节（主网 <code>728126428<\/code>），而不是一个小整数<\/td>\n<td>EIP-712 域分隔符仍然能区分链，但不要在代码里写死以太坊风格的链 ID<\/td>\n<\/tr>\n<tr>\n<td>账户没有 nonce；交易用 TAPOS 防重放，默认 60 秒过期<\/td>\n<td>交易层的防重放机制不同；<strong>合约层<\/strong>的签名防重放仍然要自己实现 nonce<\/td>\n<\/tr>\n<tr>\n<td>地址在链边界带 <code>0x41<\/code> 前缀，VM 内部是 20 字节<\/td>\n<td>链下签名工具和合约对地址的编码必须一致<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<blockquote class=\"info\"><p>💡 注意：账户多权限（<a href=\"#c04\" data-nav=\"c04\">04 章<\/a>）意味着一个 TRON 地址可能需要多个签名人。合约里用 <code>ecrecover<\/code> 只能验证<strong>单个<\/strong>私钥签名；TRON 提供了 <code>ValidateMultiSign<\/code> 预编译合约用于验证账户多签（TRON 官方文档）。<\/p>\n<\/blockquote>\n<hr>\n<h2>4. 签名界面的安全：Bybit（2025 年 2 月）<\/h2>\n<p>签名再安全，签名人也可能签错东西。公开分析报告（Sygnia、Verichains 等）指出：<\/p>\n<ol>\n<li>攻击者篡改了 Safe{Wallet} 的前端代码，只针对 Bybit 的冷钱包多签地址生效。<\/li>\n<li>签名人看到的是一笔正常的转账。实际签名的交易是 <code>delegatecall<\/code> 到攻击者合约，把多签钱包的实现合约替换成恶意合约。<\/li>\n<li>多签阈值满足后，攻击者转走约 40 万 ETH 及其他资产，总计约 15 亿美元。公开报道归因于朝鲜 Lazarus 组织。<\/li>\n<\/ol>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart LR\n  A[&quot;前端被篡改&quot;] --&gt; B[&quot;签名人看到：普通转账&quot;]\n  A --&gt; C[&quot;实际签名：delegatecall → 恶意合约&quot;]\n  B &amp; C --&gt; D[&quot;多签阈值满足&quot;]\n  D --&gt; E[&quot;钱包实现被替换&quot;]\n  E --&gt; F[&quot;攻击者转走全部资产&quot;]<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul>\n<li>多签防的是&quot;单把私钥被盗&quot;。它防不了&quot;所有签名人看到同一个假界面&quot;。<\/li>\n<li><code>operation = delegatecall<\/code> 是高危信号。正常转账不需要 delegatecall。<\/li>\n<li>防御：用硬件钱包逐字段核对交易；独立工具解码 calldata；对 delegatecall 和修改实现地址的操作设白名单或额外审批。<\/li>\n<\/ul>\n<p>同类事故并不罕见。2024 年 7 月，印度交易所 WazirX 的 4/6 多签冷钱包被盗约 2.3 亿美元：签名人在界面上看到的是日常交易，硬件钱包签下的却是升级多签的恶意数据（公开分析）。2025 年 EIP-7702 上线后，又出现了诱导用户签署&quot;委托授权&quot;的钓鱼方式。两者见 <a href=\"#k00\" data-nav=\"k00\">C00 以太坊专题<\/a> 4.9、4.10 节。<\/p>\n<blockquote class=\"info\"><p>💡 注意：这起事故的后续有一个 Mantle 生态的防御案例。攻击者把部分资产换成 Mantle 上 mETH 协议的 cmETH 并尝试提取。mETH 协议有 8 小时提款延迟，团队在延迟期内暂停合约，追回 15,000 cmETH（约 4,300 万美元）（The Block 报道）。见 <a href=\"#k03\" data-nav=\"k03\">C03<\/a>。<\/p>\n<\/blockquote>\n<hr>\n<h2>5. 审计检查点<\/h2>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> 所有交换函数都有 <code>minOut<\/code> 和 <code>deadline<\/code> 参数，且不是在合约内部用现货价计算的。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 所有签名验证使用 EIP-712，包含 nonce、chainId、合约地址、deadline、typehash。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 使用 OpenZeppelin <code>ECDSA<\/code>，拒绝零地址和高 s 值。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 已使用标记基于 nonce 或消息哈希，不基于签名字节。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> <code>permit<\/code> 调用有抢跑容错。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 动态类型签名使用 <code>abi.encode<\/code>，不使用 <code>encodePacked<\/code>。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 部署到 TRON 时，签名工具链和合约对 chainId、地址格式的处理一致。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 特权操作的签名流程有独立的交易解码与核对步骤。<\/li>\n<\/ul>\n<hr>\n<h2>6. 用户侧防护<\/h2>\n<p>普通用户看不到合约代码，但可以通过几个公开信号降低风险。<\/p>\n<ol>\n<li>大额兑换设置合理的滑点，不要用默认的高滑点或&quot;自动&quot;。<\/li>\n<li>大额交易可以使用私有交易通道（Private RPC），减少被三明治攻击。<\/li>\n<li>签名前看清签名内容：链 ID、合约地址、数额、期限。看不懂的签名不签。<\/li>\n<li>钱包提示&quot;盲签&quot;或只显示哈希时，不签。<\/li>\n<li>练习：打开 <a href=\"#lab-signature-replay-lab\" data-nav=\"lab-signature-replay-lab\" class=\"lab-link\">signature-replay-lab.html<\/a>，观察签名绑定的字段如何决定它能被用几次。<\/li>\n<\/ol>\n<hr>\n<h2>7. 术语表<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>术语<\/th>\n<th>英文<\/th>\n<th>定义<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>最大可提取价值<\/td>\n<td>MEV<\/td>\n<td>通过控制交易顺序获得的额外收益<\/td>\n<\/tr>\n<tr>\n<td>搜索者<\/td>\n<td>Searcher<\/td>\n<td>寻找 MEV 机会并提交交易捆绑的人或程序<\/td>\n<\/tr>\n<tr>\n<td>三明治攻击<\/td>\n<td>Sandwich Attack<\/td>\n<td>在受害者交易前后各插入一笔交易获利<\/td>\n<\/tr>\n<tr>\n<td>滑点容忍度<\/td>\n<td>Slippage Tolerance<\/td>\n<td>用户愿意接受的最差成交价偏离<\/td>\n<\/tr>\n<tr>\n<td>签名重放<\/td>\n<td>Signature Replay<\/td>\n<td>把已使用的签名再次提交<\/td>\n<\/tr>\n<tr>\n<td>域分隔符<\/td>\n<td>Domain Separator<\/td>\n<td>EIP-712 中绑定链 ID 和合约地址的哈希<\/td>\n<\/tr>\n<tr>\n<td>签名可塑性<\/td>\n<td>Signature Malleability<\/td>\n<td>同一消息存在多个有效签名<\/td>\n<\/tr>\n<tr>\n<td>盲签<\/td>\n<td>Blind Signing<\/td>\n<td>签名人无法看懂自己所签内容<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2>8. 思考题<\/h2>\n<ol>\n<li>打开 <a href=\"#lab-signature-replay-lab\" data-nav=\"lab-signature-replay-lab\" class=\"lab-link\">signature-replay-lab.html<\/a>，只保留 nonce 和 deadline。哪两种重放仍然成功？<\/li>\n<li>一个自动复投金库每小时把奖励代币换成本金，<code>amountOutMin<\/code> 用池子当前价格乘以 99% 计算。这个保护有效吗？<\/li>\n<li>在 Mantle 上，用户交易不进入公开内存池。三明治攻击还可能发生吗？谁有能力发起？<\/li>\n<\/ol>\n<p>下一章：<a href=\"#c09\" data-nav=\"c09\">09 可升级合约与代理<\/a> —— 留给自己的维修门，也是留给攻击者的门。<\/p>\n"}, "c09": {"id": "c09", "file": "09-upgradeable-proxy.md", "title": "09 可升级合约与代理：维修门的两面", "group": "g4", "html": "<h1>09 可升级合约与代理：维修门的两面<\/h1>\n<blockquote class=\"\"><p>学习目标：读完本章，你能——<\/p>\n<ol>\n<li>画出透明代理、UUPS、信标代理的调用关系，说出各自的权限位置。<\/li>\n<li>识别存储冲突、初始化缺失、选择器冲突三类代理漏洞。<\/li>\n<li>制定一份安全升级的操作流程。<\/li>\n<\/ol>\n<p>前置章节：<a href=\"#c02\" data-nav=\"c02\">02 EVM 与 Solidity 安全基础<\/a>、<a href=\"#c04\" data-nav=\"c04\">04 访问控制与权限<\/a><br>交互实验：<a href=\"#lab-storage-proxy-lab\" data-nav=\"lab-storage-proxy-lab\" class=\"lab-link\">storage-proxy-lab.html<\/a> ｜ 示例合约：<a href=\"#examples\" data-nav=\"examples\">examples/07-ProxyStorage.sol<\/a><\/p>\n<\/blockquote>\n<hr>\n<h2>1. 一句话理解<\/h2>\n<p><strong>代理合约保存数据和资金，实现合约提供代码。升级 = 换掉代理指向的实现。谁能换实现，谁就拥有全部资金。<\/strong><\/p>\n<p>代理合约（Proxy）：把所有调用通过 <code>delegatecall<\/code> 转发给实现合约的合约。<\/p>\n<blockquote class=\"analogy\"><p>🎯 打个比方：代理合约是一个<strong>保险柜<\/strong>，实现合约是保险柜的<strong>操作手册<\/strong>。<\/p>\n<ul>\n<li>柜员每次都按手册操作柜子（delegatecall：用手册，改柜子）。<\/li>\n<li>升级 = 换一本新手册。<\/li>\n<li>如果新手册把&quot;第 3 格放现金&quot;改成了&quot;第 3 格放钥匙&quot;，柜员会把现金当钥匙用（存储冲突）。<\/li>\n<li>如果新手册的第一页写着&quot;第一个读到这页的人是柜子主人&quot;，而没人先读过它（未初始化），路人就能成为主人。<\/li>\n<li>如果有人偷换了手册（升级权限被盗），柜子里的东西就归他了。<\/li>\n<\/ul>\n<p>比喻的局限：真实保险柜换手册需要时间。如果没有时间锁，链上换实现只需一笔交易。<\/p>\n<\/blockquote>\n<hr>\n<h2>2. 三种代理模式<\/h2>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart TB\n  subgraph T[&quot;透明代理 Transparent&quot;]\n    U1[&quot;用户&quot;] --&gt; P1[&quot;Proxy&lt;br/&gt;升级逻辑在代理里&lt;br/&gt;admin 调用不转发&quot;]\n    P1 -. delegatecall .-&gt; I1[&quot;Implementation&quot;]\n    A1[&quot;ProxyAdmin&quot;] --&gt; P1\n  end\n  subgraph U[&quot;UUPS&quot;]\n    U2[&quot;用户&quot;] --&gt; P2[&quot;Proxy&lt;br/&gt;只做转发&quot;]\n    P2 -. delegatecall .-&gt; I2[&quot;Implementation&lt;br/&gt;含 upgradeTo()&quot;]\n  end\n  subgraph B[&quot;信标 Beacon&quot;]\n    U3[&quot;用户&quot;] --&gt; P3a[&quot;Proxy A&quot;]\n    U3 --&gt; P3b[&quot;Proxy B&quot;]\n    P3a --&gt; BC[&quot;Beacon&lt;br/&gt;保存实现地址&quot;]\n    P3b --&gt; BC\n    P3a -. delegatecall .-&gt; I3[&quot;Implementation&quot;]\n    P3b -. delegatecall .-&gt; I3\n  end<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul>\n<li>透明代理：升级函数在代理里。管理员调用代理时不转发，避免和实现合约函数冲突。<\/li>\n<li>UUPS：升级函数在实现合约里。如果新实现忘了包含 <code>upgradeTo<\/code>，合约就再也不能升级。<\/li>\n<li>信标代理：一次升级影响所有代理。适合大量相同合约（例如每个用户一个金库）。<\/li>\n<li>局限：三种模式都依赖 <code>delegatecall<\/code>，都有存储冲突风险。<\/li>\n<\/ul>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>模式<\/th>\n<th>升级权限在哪<\/th>\n<th>主要风险<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>透明代理<\/td>\n<td>代理的 admin 槽<\/td>\n<td>admin 私钥<\/td>\n<\/tr>\n<tr>\n<td>UUPS<\/td>\n<td>实现合约的 <code>_authorizeUpgrade<\/code><\/td>\n<td>新实现遗漏升级函数；实现合约未初始化<\/td>\n<\/tr>\n<tr>\n<td>信标<\/td>\n<td>信标合约的 owner<\/td>\n<td>一次升级影响全部实例<\/td>\n<\/tr>\n<tr>\n<td>钻石（EIP-2535）<\/td>\n<td><code>diamondCut<\/code> 的权限<\/td>\n<td>多个 facet 共享存储，冲突面最大<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2>3. 三类代理漏洞<\/h2>\n<h3>3.1 存储冲突<\/h3>\n<p><strong>类型 A：代理自己的变量和实现的变量撞槽。<\/strong><\/p>\n<div class=\"code-wrap\"><pre><code class=\"language-solidity\">// ❌ 朴素代理：把 implementation 放在 slot 0\ncontract NaiveProxy {\n    address implementation;   // slot 0\n    fallback() external payable { /* delegatecall implementation */ }\n}\ncontract Impl {\n    address owner;            // slot 0 —— 写 owner 就是写 implementation\n}\n<\/code><\/pre><\/div>\n<p>修复：使用 EIP-1967 定义的固定伪随机槽位存放实现地址和管理员地址。<\/p>\n<p><strong>类型 B：升级前后的布局不一致。<\/strong><\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>V1<\/th>\n<th>V2（❌ 在前面插入 <code>uint256 feeBps<\/code>）<\/th>\n<th>V2（✅ 末尾追加）<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>slot 0: <code>owner<\/code><\/td>\n<td>slot 0: <code>feeBps<\/code> ← 读到的是旧 owner 地址，被当作一个巨大的整数<\/td>\n<td>slot 0: <code>owner<\/code><\/td>\n<\/tr>\n<tr>\n<td>slot 1: <code>totalDeposits<\/code><\/td>\n<td>slot 1: <code>owner<\/code> ← 读到的是旧 totalDeposits 的低 20 字节<\/td>\n<td>slot 1: <code>totalDeposits<\/code><\/td>\n<\/tr>\n<tr>\n<td>slot 2: <code>balances<\/code><\/td>\n<td>slot 2: <code>totalDeposits<\/code> ← 读到映射占位槽，恒为 0<\/td>\n<td>slot 2: <code>balances<\/code><\/td>\n<\/tr>\n<tr>\n<td>slot 3: <code>initialized<\/code><\/td>\n<td>slot 3: <code>balances<\/code> ← 映射基址改变，所有余额&quot;消失&quot;<\/td>\n<td>slot 3: <code>initialized<\/code> + <code>paused<\/code>（打包）<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<blockquote class=\"info\"><p>💡 注意：如果插入的是一个 <code>bool<\/code>，它会和后面的 <code>address owner<\/code> 打包进同一个槽，错位方式完全不同（owner 的字节被平移 1 字节）。不要靠肉眼数槽位，用 <code>forge inspect<\/code> 或 solc 的 <code>storageLayout<\/code> 输出确认。<\/p>\n<\/blockquote>\n<p>修复规则：<\/p>\n<ol>\n<li>只在末尾追加变量。<\/li>\n<li>不删除、不重排、不改类型。<\/li>\n<li>父合约预留 <code>uint256[50] __gap;<\/code>，或使用 ERC-7201 命名空间存储（OpenZeppelin 5.x）。<\/li>\n<li>用工具比对新旧布局（例如 OpenZeppelin Upgrades 插件的 <code>validateUpgrade<\/code>、<code>forge inspect ... storage-layout<\/code>）。<\/li>\n<\/ol>\n<p>去 <a href=\"#lab-storage-proxy-lab\" data-nav=\"lab-storage-proxy-lab\" class=\"lab-link\">storage-proxy-lab.html<\/a> 选择&quot;在前面插入变量&quot;，观察哪个槽被错误解释。<\/p>\n<h3>3.2 初始化缺失<\/h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>情况<\/th>\n<th>后果<\/th>\n<th>修复<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>部署代理后没有在同一笔交易里调用 <code>initialize<\/code><\/td>\n<td>攻击者抢跑调用，成为 owner<\/td>\n<td>部署与初始化原子化（构造函数传入初始化 calldata）<\/td>\n<\/tr>\n<tr>\n<td><code>initialize<\/code> 可以重复调用<\/td>\n<td>任何人重置 owner<\/td>\n<td><code>initializer<\/code> 修饰器<\/td>\n<\/tr>\n<tr>\n<td>实现合约本身没有初始化<\/td>\n<td>攻击者成为实现合约的 owner；如果实现有 <code>delegatecall<\/code> 或自毁逻辑，可以破坏所有代理<\/td>\n<td>实现合约构造函数调用 <code>_disableInitializers()<\/code><\/td>\n<\/tr>\n<tr>\n<td>V2 新增的初始化逻辑用了 <code>initializer<\/code><\/td>\n<td>已初始化过，V2 初始化永远不能执行<\/td>\n<td>使用 <code>reinitializer(2)<\/code><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<blockquote class=\"info\"><p>💡 注意：2021 年 9 月，OpenZeppelin 披露其 UUPS 实现（4.1.0–4.3.1）存在问题：未初始化的实现合约可被任何人接管，并通过升级函数中的 <code>delegatecall<\/code> 执行 <code>selfdestruct<\/code>，使所有指向它的代理失效。修复版本为 4.3.2（OpenZeppelin 安全公告）。这和 2017 年 Parity 第二次事故是同一类问题。<\/p>\n<\/blockquote>\n<h3>3.3 选择器冲突<\/h3>\n<p>代理自己的函数和实现的函数如果有相同的 4 字节选择器，调用会被代理截获，不会转发。透明代理通过&quot;管理员不转发、其他人只转发&quot;来避免这个问题。钻石代理需要在 <code>diamondCut<\/code> 时检查冲突。<\/p>\n<hr>\n<h2>4. 案例：Nomad Bridge（2022 年 8 月）<\/h2>\n<ul>\n<li>Nomad 在一次升级中调用初始化函数，把&quot;可信消息根&quot;设成了 <code>0x00<\/code>（公开复盘）。<\/li>\n<li>合约逻辑中，未经证明的消息默认对应的根也是 <code>0x00<\/code>。于是<strong>任何<\/strong>消息都被视为&quot;已证明&quot;。<\/li>\n<li>第一个攻击者成功后，其他人只需复制他的交易、替换收款地址，就能提款。数百个地址参与哄抢，损失约 1.9 亿美元。<\/li>\n<li>教训：<ol>\n<li>升级时的初始化参数和代码一样需要审计。<\/li>\n<li>&quot;零值&quot;不能有业务含义。默认值和合法值必须可区分。<\/li>\n<li>升级后要跑回归测试，覆盖&quot;未授权消息必须被拒绝&quot;这一条。<\/li>\n<\/ol>\n<\/li>\n<\/ul>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart LR\n  A[&quot;升级：initialize(root = 0x00)&quot;] --&gt; B[&quot;confirmAt[0x00] = 1&quot;]\n  C[&quot;任意伪造消息&quot;] --&gt; D[&quot;messages[hash] 默认为 0x00&quot;]\n  B &amp; D --&gt; E[&quot;acceptableRoot(0x00) == true&quot;]\n  E --&gt; F[&quot;process() 放行 → 提走资金&quot;]\n  F --&gt; G[&quot;交易被复制 → 数百人哄抢&quot;]<\/pre><\/div>\n<h3>4.1 对照案例：Compound 提案 62（2021 年 9 月）<\/h3>\n<p>升级后的奖励逻辑有误，部分用户可超额领取 COMP（最坏情况约 28 万枚，约 8,000 万美元）。协议没有可以停止 COMP 分发的紧急开关，任何修复都要走约 7 天的治理流程（The Block 报道）。教训：<strong>时间锁挡住恶意升级，也挡住了紧急修复<\/strong>。暂停权和升级权要分开设计。见 <a href=\"#k00\" data-nav=\"k00\">C00<\/a> 4.8 节。<\/p>\n<hr>\n<h2>5. 链视角：谁能升级&quot;链本身&quot;<\/h2>\n<p>可升级的不只是 DeFi 合约。<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>链<\/th>\n<th>可升级的关键组件<\/th>\n<th>由谁升级（截至 2026 年公开资料）<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>BNB Chain<\/td>\n<td>系统合约（跨链、质押、治理）和共识规则<\/td>\n<td>硬分叉。2022 年 Token Hub 事故后，Moran 硬分叉修复了验证缺陷并把中继者改为白名单（<a href=\"#k01\" data-nav=\"k01\">C01<\/a>）<\/td>\n<\/tr>\n<tr>\n<td>TRON<\/td>\n<td>网络参数和 TVM 功能开关（如 EIP 兼容操作码）<\/td>\n<td>超级代表投票通过提案（<a href=\"#k02\" data-nav=\"k02\">C02<\/a>）<\/td>\n<\/tr>\n<tr>\n<td>Mantle<\/td>\n<td>L1 上的桥、输出预言机、门户合约<\/td>\n<td>L2BEAT 页面：<code>MantleSecurityMultisig<\/code>（6/14）可无延迟升级；<code>MantleEngineeringMultisig<\/code>（3/7）可暂停提款（<a href=\"#k03\" data-nav=\"k03\">C03<\/a>）<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<blockquote class=\"warn\"><p>⚠️ 警告：在 L2 上部署的协议，其安全上限是 L2 本身的升级权限。如果 L2 的桥可以被无延迟升级，协议再安全，资产也可能在 L1 端被转走。<\/p>\n<\/blockquote>\n<hr>\n<h2>6. 安全升级流程<\/h2>\n<ol>\n<li>编写新实现。只追加变量。<\/li>\n<li>用工具比对存储布局，输出差异报告。<\/li>\n<li>在主网分叉环境中执行升级，跑全部回归测试和不变量测试。<\/li>\n<li>审计新实现和<strong>升级交易本身<\/strong>（包括初始化参数）。<\/li>\n<li>通过时间锁排队。公开升级内容。<\/li>\n<li>在延迟期内，监控和社区复核。<\/li>\n<li>执行升级。立刻跑部署后验证脚本（读关键变量、做小额端到端操作）。<\/li>\n<li>保留回滚方案：如果新实现有问题，能否升级回旧实现？旧实现与新布局是否兼容？<\/li>\n<\/ol>\n<hr>\n<h2>7. 审计检查点<\/h2>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> 代理使用 EIP-1967 槽位；没有自定义变量放在低位槽。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 新旧实现存储布局已用工具比对。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 实现合约构造函数调用 <code>_disableInitializers()<\/code>。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 代理部署与初始化在同一笔交易完成。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> UUPS 新实现包含升级函数，且权限正确。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 升级权限经过多签和时间锁。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 初始化参数中没有&quot;零值具有业务含义&quot;的情况。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 对部署所在 L2 的升级信任假设做了披露。<\/li>\n<\/ul>\n<hr>\n<h2>8. 用户侧防护<\/h2>\n<p>普通用户看不到合约代码，但可以通过几个公开信号降低风险。<\/p>\n<ol>\n<li>存款前查看协议是否可升级、由谁升级、是否有时间锁。<\/li>\n<li>可以无延迟升级的协议，等于你把资金交给了升级权限的持有人。<\/li>\n<li>协议公布升级时，阅读升级说明；看不懂或说明含糊时，可以先撤出。<\/li>\n<li>关注升级后的异常公告；Nomad 一类事故中，越早撤出损失越小。<\/li>\n<li>对同一协议在不同链上的部署，分别核对它们的升级权限。<\/li>\n<\/ol>\n<hr>\n<h2>9. 术语表<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>术语<\/th>\n<th>英文<\/th>\n<th>定义<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>代理合约<\/td>\n<td>Proxy<\/td>\n<td>保存状态并把调用委托给实现合约的合约<\/td>\n<\/tr>\n<tr>\n<td>实现合约<\/td>\n<td>Implementation / Logic<\/td>\n<td>提供代码逻辑的合约<\/td>\n<\/tr>\n<tr>\n<td>透明代理<\/td>\n<td>Transparent Proxy<\/td>\n<td>升级逻辑在代理中，按调用者区分是否转发<\/td>\n<\/tr>\n<tr>\n<td>UUPS<\/td>\n<td>Universal Upgradeable Proxy Standard<\/td>\n<td>升级逻辑在实现合约中的代理模式<\/td>\n<\/tr>\n<tr>\n<td>信标代理<\/td>\n<td>Beacon Proxy<\/td>\n<td>多个代理共享一个保存实现地址的信标<\/td>\n<\/tr>\n<tr>\n<td>存储冲突<\/td>\n<td>Storage Collision<\/td>\n<td>两份代码对同一槽位有不同解释<\/td>\n<\/tr>\n<tr>\n<td>存储间隙<\/td>\n<td>Storage Gap<\/td>\n<td>预留的空槽位，供父合约未来追加变量<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2>10. 思考题<\/h2>\n<ol>\n<li>一个 UUPS 合约升级到 V2 后，V2 的 <code>_authorizeUpgrade<\/code> 被写成了空函数。会发生什么？<\/li>\n<li>打开 <a href=\"#lab-storage-proxy-lab\" data-nav=\"lab-storage-proxy-lab\" class=\"lab-link\">storage-proxy-lab.html<\/a>，选择&quot;朴素代理&quot;。调用 <code>setOwner<\/code> 后，代理还能正常工作吗？<\/li>\n<li>为什么说&quot;升级交易本身需要审计&quot;？举一个只有代码正确、但升级交易出错的例子。<\/li>\n<\/ol>\n<p>下一章：<a href=\"#c10\" data-nav=\"c10\">10 DeFi 经济安全<\/a> —— 代码按规格执行，规格本身却可以被套利。<\/p>\n"}, "c10": {"id": "c10", "file": "10-defi-economic-security.md", "title": "10 DeFi 经济安全：代码没错，规则错了", "group": "g4", "html": "<h1>10 DeFi 经济安全：代码没错，规则错了<\/h1>\n<blockquote class=\"\"><p>学习目标：读完本章，你能——<\/p>\n<ol>\n<li>区分&quot;实现漏洞&quot;和&quot;机制漏洞&quot;，并用不变量描述一个借贷协议的偿付能力。<\/li>\n<li>解释 Euler 和 Beanstalk 两类经济攻击的完整路径。<\/li>\n<li>为治理、清算、奖励分发三个模块写出风险参数清单。<\/li>\n<\/ol>\n<p>前置章节：<a href=\"#c05\" data-nav=\"c05\">05 算术与精度<\/a>、<a href=\"#c07\" data-nav=\"c07\">07 预言机与闪电贷<\/a><br>交互实验：<a href=\"#lab-oracle-manipulation-lab\" data-nav=\"lab-oracle-manipulation-lab\" class=\"lab-link\">oracle-manipulation-lab.html<\/a>、<a href=\"#lab-incident-explorer\" data-nav=\"lab-incident-explorer\" class=\"lab-link\">incident-explorer.html<\/a><\/p>\n<\/blockquote>\n<hr>\n<h2>1. 一句话理解<\/h2>\n<p><strong>经济攻击不依赖代码 bug。攻击者严格按照协议规则操作，只是组合了设计者没想到的顺序、规模或时间。<\/strong><\/p>\n<blockquote class=\"analogy\"><p>🎯 打个比方：一家超市规定&quot;任何商品可以 7 天无理由退货，退货时按<strong>当前<\/strong>标价退款&quot;。<\/p>\n<p>规则没有 bug。但如果有人能在退货前让标价翻倍（操纵价格），或者在同一天买入、改价、退货（闪电贷），超市就会亏钱。<\/p>\n<p>比喻的局限：超市可以修改规则并拒绝可疑退货。合约规则一旦部署，只能靠升级或治理修改——而治理本身也可以被攻击。<\/p>\n<\/blockquote>\n<hr>\n<h2>2. 借贷协议：偿付能力不变量<\/h2>\n<p>借贷协议的核心不变量：<\/p>\n<div class=\"code-wrap\"><pre><code>对每个账户：  Σ(抵押品价值 × 清算阈值) ≥ Σ(借款价值)       （否则可被清算）\n对整个协议：  Σ(所有资产) ≥ Σ(所有存款人的债权)             （否则资不抵债）\n<\/code><\/pre><\/div>\n<p>健康因子（Health Factor）：<code>Σ(抵押品价值 × 清算阈值) / Σ(借款价值)<\/code>。小于 1 时账户可被清算。<\/p>\n<h3>2.1 坏账从哪里来<\/h3>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart LR\n  A[&quot;抵押品价格快速下跌&quot;] --&gt; D[&quot;健康因子 &lt; 1&quot;]\n  B[&quot;预言机延迟 / 熔断&quot;] --&gt; D\n  C[&quot;抵押品流动性不足&quot;] --&gt; E[&quot;清算人无法以合理价格卖出&quot;]\n  D --&gt; F{&quot;清算是否及时?&quot;}\n  F -- 是 --&gt; G[&quot;协议安全&quot;]\n  F -- &quot;否 / 清算无利可图&quot; --&gt; H[&quot;抵押品价值 &lt; 借款&quot;]\n  E --&gt; H\n  H --&gt; I[&quot;坏账：由存款人或保险基金承担&quot;]<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul>\n<li>坏账不一定来自攻击。市场暴跌和流动性枯竭也会产生坏账。<\/li>\n<li>清算人是逐利的。如果清算奖励覆盖不了 gas 和滑点，就没人清算。<\/li>\n<li>局限：这张图只画了单一抵押品。多抵押品、跨资产相关性会让风险评估复杂得多。<\/li>\n<\/ul>\n<h3>2.2 案例：Venus XVS（2021 年 5 月，BNB Chain）<\/h3>\n<ul>\n<li>Venus 允许用户以自己的治理代币 XVS 作为抵押品。<\/li>\n<li>XVS 价格在短时间内从约 76 美元涨到约 144 美元，抵押能力随之上升，有人借出大量 BTC 和 ETH。<\/li>\n<li>XVS 回落后，清算超过 2 亿美元，仍留下超过 9,500 万美元坏账（The Block 报道）。项目方称价格&quot;可能&quot;被操纵。<\/li>\n<li>教训：<strong>协议自己的治理代币作为抵押品，是反身性风险<\/strong>。价格上涨 → 借款增加 → 卖压增加 → 价格下跌 → 坏账。低流动性抵押品必须有供应上限和更低的抵押率。<\/li>\n<\/ul>\n<h3>2.3 案例：Euler Finance（2023 年 3 月，以太坊）<\/h3>\n<p>Euler 的 <code>donateToReserves()<\/code> 允许用户把自己的存款（eToken）捐给协议储备，但<strong>没有检查捐赠后账户的健康因子<\/strong>（公开复盘）。<\/p>\n<ol>\n<li>攻击者用闪电贷借入 DAI，存入 Euler，并用 Euler 的杠杆铸造功能放大头寸。<\/li>\n<li>攻击者调用 <code>donateToReserves()<\/code> 捐出大量 eToken。账户的抵押品减少，债务（dToken）不变。账户变得严重资不抵债。<\/li>\n<li>攻击者用另一个账户清算这个资不抵债的账户。Euler 的清算折扣随资不抵债程度增大，清算人以极大折扣拿走抵押品。<\/li>\n<li>攻击者归还闪电贷，获利约 1.97 亿美元。后来攻击者归还了大部分资金。<\/li>\n<\/ol>\n<blockquote class=\"info\"><p>💡 注意：每个函数单独审计都&quot;正确&quot;。漏洞在于一个新增函数（donate）改变了账户状态，却没有走所有其他函数都会走的健康检查。<strong>任何会减少抵押品或增加债务的路径，都必须在结束时检查健康因子。<\/strong><\/p>\n<\/blockquote>\n<hr>\n<h2>3. 治理攻击<\/h2>\n<p>治理攻击（Governance Attack）：攻击者获得足够投票权，通过恶意提案，合法地转走协议资产。<\/p>\n<h3>3.1 案例：Beanstalk（2022 年 4 月，以太坊）<\/h3>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">sequenceDiagram\n  autonumber\n  participant A as 攻击者\n  participant F as 闪电贷（Aave 等）\n  participant G as Beanstalk 治理\n  A-&gt;&gt;G: 提前 1 天提交恶意提案（BIP-18）\n  A-&gt;&gt;F: 借入约 10 亿美元资产\n  A-&gt;&gt;G: 存入，获得多数投票权\n  A-&gt;&gt;G: emergencyCommit()：同一笔交易内通过并执行\n  G--&gt;&gt;A: 转出国库资产\n  A-&gt;&gt;F: 还款\n  Note over A: 获利约 8,000 万美元；协议损失约 1.8 亿美元<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul>\n<li>关键缺陷：投票权按<strong>当前<\/strong>存款计算，并且存在可在同一交易内执行的紧急提案通道。<\/li>\n<li>攻击者提前一天提交提案，因为紧急执行有 1 天的最短等待期——但投票权没有快照。<\/li>\n<li>修复：投票权使用过去区块的快照（例如 ERC20Votes 的 <code>getPastVotes<\/code>）；提案通过后经过时间锁才能执行。<\/li>\n<\/ul>\n<h3>3.2 治理防御清单<\/h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>风险<\/th>\n<th>防御<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>闪电贷借票<\/td>\n<td>投票权快照在提案创建之前的区块<\/td>\n<\/tr>\n<tr>\n<td>低投票率下被少数人通过<\/td>\n<td>法定人数（Quorum）要求<\/td>\n<\/tr>\n<tr>\n<td>恶意提案通过后立即执行<\/td>\n<td>执行时间锁 + 守护者否决<\/td>\n<\/tr>\n<tr>\n<td>提案内容难以理解<\/td>\n<td>提案必须附带可读的 calldata 解码<\/td>\n<\/tr>\n<tr>\n<td>治理代币集中在交易所<\/td>\n<td>监控大额转入和委托变化<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2>4. 奖励分发与&quot;无风险套利&quot;<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>缺陷<\/th>\n<th>说明<\/th>\n<th>修复<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>存入即领奖<\/td>\n<td>奖励按存款时点余额计算，闪电贷存入、领奖、取出<\/td>\n<td>奖励随时间累积；存入后最短锁定期<\/td>\n<\/tr>\n<tr>\n<td>奖励代币与质押代币相同<\/td>\n<td>合约的 <code>balanceOf<\/code> 同时包含奖励和质押，计算份额出错<\/td>\n<td>质押量用内部变量记录<\/td>\n<\/tr>\n<tr>\n<td>奖励速率可被调用者影响<\/td>\n<td>按&quot;本区块成交量&quot;或&quot;池子价格&quot;计算奖励<\/td>\n<td>奖励参数由治理设定，不读一笔交易可变的数据<\/td>\n<\/tr>\n<tr>\n<td>按 LP 价值铸币<\/td>\n<td>见 <a href=\"#c07\" data-nav=\"c07\">07 章<\/a> PancakeBunny<\/td>\n<td>公平储备定价<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2>5. 流动性质押与提款延迟：Mantle 的 mETH<\/h2>\n<p>流动性质押（Liquid Staking）：用户质押 ETH，获得可交易的凭证代币（例如 mETH）。重质押凭证（例如 cmETH）进一步叠加收益和风险。<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>设计要素<\/th>\n<th>风险<\/th>\n<th>好处<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>凭证可在 DEX 交易<\/td>\n<td>凭证与 ETH 脱锚<\/td>\n<td>用户无需等待即可退出<\/td>\n<\/tr>\n<tr>\n<td>赎回有延迟队列<\/td>\n<td>用户体验差<\/td>\n<td>给协议留出反应时间<\/td>\n<\/tr>\n<tr>\n<td>多层叠加（质押 → 重质押 → 再抵押）<\/td>\n<td>风险层层传导<\/td>\n<td>收益叠加<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>2025 年 2 月 Bybit 被盗后，攻击者尝试赎回 cmETH。mETH 协议的 8 小时提款延迟让团队有时间暂停合约，追回 15,000 cmETH（约 4,300 万美元）（The Block 报道）。<\/p>\n<blockquote class=\"info\"><p>💡 注意：<strong>延迟是一种安全参数<\/strong>，不只是体验问题。它把&quot;攻击者完成攻击的时间&quot;从一笔交易拉长到若干小时，让监控和人工响应有机会介入。代价是正常用户也要等待。详见 <a href=\"#k03\" data-nav=\"k03\">C03<\/a>。<\/p>\n<\/blockquote>\n<hr>\n<h2>6. 审计检查点<\/h2>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> 写出协议级偿付不变量，并用不变量测试验证（<a href=\"#c12\" data-nav=\"c12\">12 章<\/a>）。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 所有减少抵押品或增加债务的路径，最后都检查健康因子。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 清算奖励在极端行情下仍有吸引力；清算折扣有上限。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 低流动性抵押品有供应上限；协议自有代币作为抵押品时有额外限制。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 投票权使用历史快照；提案执行经过时间锁。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 奖励计算不依赖一笔交易内可变的数据。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 提款/赎回是否需要延迟？延迟期内谁能暂停？<\/li>\n<\/ul>\n<hr>\n<h2>7. 用户侧防护<\/h2>\n<p>普通用户看不到合约代码，但可以通过几个公开信号降低风险。<\/p>\n<ol>\n<li>高收益通常对应高风险。收益来源说不清楚的产品，不要投入大额。<\/li>\n<li>查看协议的清算机制和坏账历史；坏账多的协议，存款人可能承担损失。<\/li>\n<li>治理代币集中在少数地址的协议，可能被治理攻击。关注异常的治理提案。<\/li>\n<li>流动性质押代币（如 mETH、stETH）在极端行情下可能折价，提款也可能有延迟。<\/li>\n<li>稳定币不是无风险资产：了解它的储备、赎回规则和发行方的冻结权限。<\/li>\n<\/ol>\n<hr>\n<h2>8. 术语表<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>术语<\/th>\n<th>英文<\/th>\n<th>定义<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>健康因子<\/td>\n<td>Health Factor<\/td>\n<td>加权抵押品价值与借款价值的比值<\/td>\n<\/tr>\n<tr>\n<td>清算<\/td>\n<td>Liquidation<\/td>\n<td>第三方偿还不健康账户的债务，并以折扣获得抵押品<\/td>\n<\/tr>\n<tr>\n<td>坏账<\/td>\n<td>Bad Debt<\/td>\n<td>无法通过清算收回的借款<\/td>\n<\/tr>\n<tr>\n<td>治理攻击<\/td>\n<td>Governance Attack<\/td>\n<td>通过获得投票权合法地通过恶意提案<\/td>\n<\/tr>\n<tr>\n<td>投票快照<\/td>\n<td>Vote Snapshot<\/td>\n<td>按历史区块的余额计算投票权<\/td>\n<\/tr>\n<tr>\n<td>反身性<\/td>\n<td>Reflexivity<\/td>\n<td>价格变化通过协议机制反过来强化价格变化<\/td>\n<\/tr>\n<tr>\n<td>流动性质押<\/td>\n<td>Liquid Staking<\/td>\n<td>质押资产并获得可交易凭证<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2>9. 思考题<\/h2>\n<ol>\n<li>Euler 的 <code>donateToReserves()<\/code> 如果在最后加一行 <code>require(healthFactor(msg.sender) &gt;= 1)<\/code>，攻击还能成功吗？还需要检查什么？<\/li>\n<li>一个治理合约使用&quot;提案创建时的余额快照&quot;计算投票权。攻击者能否提前一天借入代币并保持仓位来通过提案？成本是什么？<\/li>\n<li>打开 <a href=\"#lab-incident-explorer\" data-nav=\"lab-incident-explorer\" class=\"lab-link\">incident-explorer.html<\/a>，筛选&quot;业务逻辑&quot;和&quot;治理攻击&quot;。这些事故中，有几起使用了闪电贷？<\/li>\n<\/ol>\n<p>下一章：<a href=\"#c11\" data-nav=\"c11\">11 跨链桥安全<\/a> —— 损失最大的一类事故。<\/p>\n"}, "c11": {"id": "c11", "file": "11-cross-chain-bridges.md", "title": "11 跨链桥安全：两条链之间的那条缝", "group": "g4", "html": "<h1>11 跨链桥安全：两条链之间的那条缝<\/h1>\n<blockquote class=\"\"><p>学习目标：读完本章，你能——<\/p>\n<ol>\n<li>画出&quot;锁定-铸造&quot;跨链桥的消息流，标出验证发生在哪里。<\/li>\n<li>比较多签、轻客户端、乐观证明、零知识证明四种验证方式的信任假设。<\/li>\n<li>把跨链桥事故归入&quot;私钥、验证逻辑、初始化、存款伪造&quot;四类根因。<\/li>\n<\/ol>\n<p>前置章节：<a href=\"#c04\" data-nav=\"c04\">04 访问控制与权限<\/a>、<a href=\"#c08\" data-nav=\"c08\">08 MEV 与签名安全<\/a>、<a href=\"#c09\" data-nav=\"c09\">09 可升级合约与代理<\/a><br>交互实验：<a href=\"#lab-signature-replay-lab\" data-nav=\"lab-signature-replay-lab\" class=\"lab-link\">signature-replay-lab.html<\/a>、<a href=\"#lab-incident-explorer\" data-nav=\"lab-incident-explorer\" class=\"lab-link\">incident-explorer.html<\/a><\/p>\n<\/blockquote>\n<hr>\n<h2>1. 一句话理解<\/h2>\n<p><strong>跨链桥让 B 链上的合约相信&quot;A 链上发生了某件事&quot;。B 链看不到 A 链，所以它只能相信某种证明。证明机制被骗，桥上的全部资产就被骗走。<\/strong><\/p>\n<p>跨链桥（Bridge）：在两条链之间转移资产或消息的系统。<\/p>\n<blockquote class=\"analogy\"><p>🎯 打个比方：两座城市之间没有电话。A 城的银行收下你的金条，给你开一张&quot;提货单&quot;，你拿到 B 城银行兑换等值金券。<\/p>\n<ul>\n<li>B 城银行怎么知道提货单是真的？<ul>\n<li>看 5 个公证人的签章（多签 / MPC）。<\/li>\n<li>自己派人常驻 A 城核对账本（轻客户端）。<\/li>\n<li>先兑付，但留 7 天让任何人举报造假（乐观证明）。<\/li>\n<li>用一种数学方法，不看账本也能确认账本内容（零知识证明）。<\/li>\n<\/ul>\n<\/li>\n<li>公证人的印章被偷，或者核对方法有漏洞，B 城银行就会兑出不存在的金子。<\/li>\n<\/ul>\n<p>比喻的局限：两座城的银行金库加起来，往往是整个系统里最大的一笔钱。所以跨链桥是攻击者的首选目标。<\/p>\n<\/blockquote>\n<hr>\n<h2>2. 跨链桥的基本流程<\/h2>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">sequenceDiagram\n  autonumber\n  participant U as 用户\n  participant SA as A 链：桥合约\n  participant R as 中继者 / 验证者\n  participant SB as B 链：桥合约\n  participant T as B 链：映射代币\n  U-&gt;&gt;SA: 存入 100 USDT（锁定）\n  SA--&gt;&gt;R: 事件 Deposit(user, 100, nonce)\n  R-&gt;&gt;R: 观察 A 链，等待最终性\n  R-&gt;&gt;SB: 提交消息 + 证明（签名 / Merkle 证明 / ZK 证明）\n  SB-&gt;&gt;SB: 验证证明；检查 nonce 未使用\n  SB-&gt;&gt;T: 铸造 100 映射 USDT 给用户<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul>\n<li>第 2 → 4 步是信任边界。B 链只能通过第 5 步的&quot;验证&quot;来判断真伪。<\/li>\n<li>第 5 步要同时检查：证明有效、消息未被处理过（防重放）、消息来自正确的源链和源合约。<\/li>\n<li>局限：这张图没有画反向流程（销毁 → 解锁）。反向流程有同样的风险，金额往往更大。<\/li>\n<\/ul>\n<hr>\n<h2>3. 四种验证方式<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>验证方式<\/th>\n<th>信任谁<\/th>\n<th>典型风险<\/th>\n<th>例子<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>外部多签 / MPC<\/td>\n<td>M-of-N 个验证者<\/td>\n<td>私钥泄露、验证者共谋、阈值过低<\/td>\n<td>Ronin（2022）<\/td>\n<\/tr>\n<tr>\n<td>轻客户端 / 原生证明<\/td>\n<td>源链共识 + 证明验证代码<\/td>\n<td>证明验证代码有漏洞<\/td>\n<td>BNB Chain Token Hub（2022）<\/td>\n<\/tr>\n<tr>\n<td>乐观证明<\/td>\n<td>至少一个诚实的挑战者<\/td>\n<td>挑战期内无人监控；挑战者被审查<\/td>\n<td>多数乐观 Rollup 的原生桥<\/td>\n<\/tr>\n<tr>\n<td>零知识证明<\/td>\n<td>数学 + 证明系统实现 + 可信设置<\/td>\n<td>电路或验证器实现错误；验证器路由被替换<\/td>\n<td>部分 ZK Rollup 原生桥（包括 Mantle 当前的 OP Succinct 方案）<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<blockquote class=\"info\"><p>💡 注意：L2 的&quot;原生桥&quot;也是一种跨链桥。它的安全性取决于证明系统<strong>和<\/strong>升级权限。根据 L2BEAT 截至 2026 年的页面，Mantle 使用 OP Succinct（SP1）有效性证明，但输出预言机可由工程多签切换到&quot;乐观模式&quot;，桥合约可由安全多签无延迟升级。详见 <a href=\"#k03\" data-nav=\"k03\">C03<\/a>。<\/p>\n<\/blockquote>\n<hr>\n<h2>4. 四类根因与案例<\/h2>\n<h3>4.1 私钥与运营：Ronin（2022 年 3 月）<\/h3>\n<ul>\n<li>9 个验证者中 5 个签名即可放行。攻击者控制了 5 把私钥，伪造两笔提款，损失约 6.2 亿美元。<\/li>\n<li>其中 4 把属于同一机构，1 把来自一个本应撤销的授权（公开复盘）。<\/li>\n<li>教训：阈值的意义取决于签名人的<strong>独立性<\/strong>。4 把钥匙放在同一个地方，等于 1 把。<\/li>\n<\/ul>\n<h3>4.2 验证逻辑：BNB Chain Token Hub（2022 年 10 月）<\/h3>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart LR\n  A[&quot;支付 100 BNB&lt;br/&gt;注册为中继者&quot;] --&gt; B[&quot;构造伪造的跨链包&lt;br/&gt;与 IAVL Merkle 证明&quot;]\n  B --&gt; C[&quot;Token Hub 预编译合约&lt;br/&gt;证明验证存在缺陷&quot;]\n  C --&gt; D[&quot;伪造消息被接受&quot;]\n  D --&gt; E[&quot;两次各铸造 100 万 BNB&lt;br/&gt;共 200 万 BNB（约 5.7 亿美元）&quot;]\n  E --&gt; F[&quot;约 1 亿多美元被转到其他链&quot;]\n  F --&gt; G[&quot;验证者暂停 BSC&lt;br/&gt;硬分叉修复&quot;]<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul>\n<li>攻击者没有偷任何私钥。他利用的是<strong>证明验证代码<\/strong>的缺陷（安全公司分析指向 IAVL 证明校验）。<\/li>\n<li>BSC 的验证者集合较小，能在约 3 小时内协调暂停整条链，冻结了大部分资金（Nansen 等分析）。这是中心化程度的两面：响应快，也说明少数验证者可以停链。<\/li>\n<li>Moran 硬分叉（2022 年 10 月）修复了 IAVL 校验，把中继者改为白名单，并增加区块头顺序检查。<\/li>\n<li>详细分析见 <a href=\"#k01\" data-nav=\"k01\">C01<\/a>。<\/li>\n<\/ul>\n<h3>4.3 签名验证：Wormhole（2022 年 2 月）与 Poly Network（2021 年 8 月）<\/h3>\n<ul>\n<li><strong>Wormhole<\/strong>：Solana 一侧的合约使用了一个已弃用的系统指令加载函数，没有校验传入的&quot;系统账户&quot;是否真实。攻击者传入伪造账户，绕过守护者签名验证，铸造约 12 万 wETH（约 3.2 亿美元）。<\/li>\n<li><strong>Poly Network<\/strong>：跨链管理合约允许跨链消息调用任意目标合约的函数。攻击者构造一个函数名，使其 4 字节选择器与 <code>putCurEpochConPubKeyBytes<\/code>（替换验证者公钥）相同，通过跨链消息把验证者公钥换成自己的，然后签发任意提款。损失约 6.1 亿美元，后来攻击者归还。<\/li>\n<\/ul>\n<blockquote class=\"warn\"><p>⚠️ 警告：跨链消息执行器<strong>不能<\/strong>调用持有特权的合约。消息的目标地址和函数选择器都要白名单化。<\/p>\n<\/blockquote>\n<h3>4.4 初始化：Nomad（2022 年 8 月）<\/h3>\n<p>升级时把可信根设为 <code>0x00<\/code>，导致任何消息都被视为已证明。见 <a href=\"#c09\" data-nav=\"c09\">09 章<\/a> 第 4 节。<\/p>\n<h3>4.5 存款伪造：Qubit（2022 年 1 月）<\/h3>\n<p>对 <code>address(0)<\/code> 调用 <code>safeTransferFrom<\/code> 返回成功，桥记录了不存在的 ETH 存款。见 <a href=\"#c06\" data-nav=\"c06\">06 章<\/a> 第 2.1 节。<\/p>\n<hr>\n<h2>5. 交易所充值也是一座&quot;桥&quot;<\/h2>\n<p>CEX 的充值系统做的事情和跨链桥一样：<strong>相信链上发生了一笔转账，然后在内部账本上记账<\/strong>（见《CEX 交易所学习手册》04 章）。同类风险：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>跨链桥风险<\/th>\n<th>CEX 充值对应的风险<\/th>\n<th>防御<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>伪造存款事件<\/td>\n<td>假币合约发出同名 <code>Transfer<\/code> 事件<\/td>\n<td>校验代币合约地址，而不是代币名称或符号<\/td>\n<\/tr>\n<tr>\n<td>消息未检查执行状态<\/td>\n<td>交易执行失败（例如 TRON 上能量不足导致 REVERT），但日志或回执被误读为成功<\/td>\n<td>检查交易回执状态为成功，再检查事件<\/td>\n<\/tr>\n<tr>\n<td>重放<\/td>\n<td>同一笔交易被重复入账<\/td>\n<td>以 (txHash, logIndex) 为幂等键<\/td>\n<\/tr>\n<tr>\n<td>源链重组<\/td>\n<td>入账后区块被回滚<\/td>\n<td>等待足够确认数或最终性<\/td>\n<\/tr>\n<tr>\n<td>收税/变基代币<\/td>\n<td>入账金额 ≠ 实收<\/td>\n<td>以余额变化为准<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<blockquote class=\"info\"><p>💡 注意：TRON 上 TRC-20 转账失败（例如&quot;FAILED – TRANSACTION REVERT&quot;、能量不足）的交易仍然会上链，并有交易哈希。只看&quot;交易存在&quot;就入账，就会产生&quot;假充值&quot;。必须检查交易结果字段。详见 <a href=\"#k02\" data-nav=\"k02\">C02<\/a>。<\/p>\n<\/blockquote>\n<hr>\n<h2>6. 防御清单<\/h2>\n<ol>\n<li>验证者集合：阈值高于 2/3；签名人在组织、地域、基础设施上独立；定期审计签名权清单。<\/li>\n<li>消息格式：包含源链 ID、源合约、目标链 ID、目标合约、nonce；目标侧逐项校验。<\/li>\n<li>消息执行：目标地址和函数白名单；不允许调用特权合约。<\/li>\n<li>限额：单笔、单位时间提款上限；超过上限进入延迟队列。<\/li>\n<li>监控：两侧总供应量对账（锁定量 ≥ 铸造量）；异常时自动暂停。<\/li>\n<li>升级：桥合约升级必须有时间锁；初始化参数必须审计。<\/li>\n<\/ol>\n<hr>\n<h2>7. 审计检查点<\/h2>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> 消息哈希包含源链、源合约、目标链、目标合约、nonce。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 已处理消息有防重放标记。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 证明验证代码（Merkle、签名、ZK 验证器）有独立审计和测试向量。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 零值、空数组、未初始化根不会被当作有效证明。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 原生币和 ERC-20 走不同路径，且彼此不能混用。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 有速率限制和全局供应量对账。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 签名人清单、阈值、私钥存放方式已披露。<\/li>\n<\/ul>\n<hr>\n<h2>8. 用户侧防护<\/h2>\n<p>普通用户看不到合约代码，但可以通过几个公开信号降低风险。<\/p>\n<ol>\n<li>跨链前确认桥的验证方式：多签、轻客户端、乐观证明还是零知识证明。L2BEAT 会列出风险。<\/li>\n<li>不要把资产长期放在桥的映射代币上；用完尽快换回原生资产。<\/li>\n<li>只用官方入口跨链。搜索结果和社交媒体里的&quot;官方桥&quot;可能是钓鱼站。<\/li>\n<li>跨链后检查目标链上收到的代币合约地址是否正确。<\/li>\n<li>桥出事时，映射代币可能大幅折价，见 Ronin、Wormhole 等案例。<\/li>\n<\/ol>\n<hr>\n<h2>9. 术语表<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>术语<\/th>\n<th>英文<\/th>\n<th>定义<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>跨链桥<\/td>\n<td>Bridge<\/td>\n<td>在两条链之间转移资产或消息的系统<\/td>\n<\/tr>\n<tr>\n<td>锁定-铸造<\/td>\n<td>Lock-and-Mint<\/td>\n<td>源链锁定资产，目标链铸造映射资产<\/td>\n<\/tr>\n<tr>\n<td>中继者<\/td>\n<td>Relayer<\/td>\n<td>把消息和证明从一条链搬到另一条链的角色<\/td>\n<\/tr>\n<tr>\n<td>轻客户端<\/td>\n<td>Light Client<\/td>\n<td>在链上验证另一条链区块头和证明的合约<\/td>\n<\/tr>\n<tr>\n<td>乐观证明<\/td>\n<td>Optimistic Proof<\/td>\n<td>默认有效，挑战期内可被欺诈证明推翻<\/td>\n<\/tr>\n<tr>\n<td>有效性证明<\/td>\n<td>Validity Proof<\/td>\n<td>用零知识证明直接证明状态转换正确<\/td>\n<\/tr>\n<tr>\n<td>速率限制<\/td>\n<td>Rate Limit<\/td>\n<td>单位时间内允许的最大流出量<\/td>\n<\/tr>\n<tr>\n<td>假充值<\/td>\n<td>Fake Deposit<\/td>\n<td>交易所把失败或伪造的转账误记为充值<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2>10. 思考题<\/h2>\n<ol>\n<li>一个桥的验证者是 7 个地址，阈值 4。这 7 个地址中有 3 个由同一家云服务商托管。实际的安全阈值是多少？<\/li>\n<li>BSC 在 Token Hub 事故后暂停了整条链。从用户角度，这是好事还是坏事？从&quot;去中心化&quot;角度呢？<\/li>\n<li>打开 <a href=\"#lab-incident-explorer\" data-nav=\"lab-incident-explorer\" class=\"lab-link\">incident-explorer.html<\/a>，筛选&quot;跨链&quot;。按根因分组，哪一类损失最多？<\/li>\n<\/ol>\n<p>下一章：<a href=\"#c12\" data-nav=\"c12\">12 审计、测试与开发流程<\/a> —— 把前面所有知识变成一套可执行的流程。<\/p>\n"}, "c12": {"id": "c12", "file": "12-audit-testing-workflow.md", "title": "12 审计、测试与开发流程：把安全写进流水线", "group": "g5", "html": "<h1>12 审计、测试与开发流程：把安全写进流水线<\/h1>\n<blockquote class=\"\"><p>学习目标：读完本章，你能——<\/p>\n<ol>\n<li>画出合约从设计到上线后监控的 8 个安全关口。<\/li>\n<li>用 Foundry 写出一个模糊测试和一个不变量测试。<\/li>\n<li>为部署到 BNB Chain、TRON、Mantle 的合约分别准备链特定的测试项。<\/li>\n<\/ol>\n<p>前置章节：01–11 章<br>交互实验：<a href=\"#lab-chain-porting-lab\" data-nav=\"lab-chain-porting-lab\" class=\"lab-link\">chain-porting-lab.html<\/a>、<a href=\"#lab-incident-explorer\" data-nav=\"lab-incident-explorer\" class=\"lab-link\">incident-explorer.html<\/a><\/p>\n<\/blockquote>\n<hr>\n<h2>1. 一句话理解<\/h2>\n<p><strong>审计不是安全的起点，也不是终点。审计是流水线上的一个关口；它之前要有设计和测试，它之后要有监控和应急。<\/strong><\/p>\n<blockquote class=\"analogy\"><p>🎯 打个比方：合约开发像造一架飞机。<\/p>\n<ul>\n<li>设计阶段：画图纸，并写出&quot;任何情况下机翼不能断&quot;（不变量）。<\/li>\n<li>制造阶段：每个零件出厂前都测（单元测试），并把零件放进风洞里用各种极端风向吹（模糊测试）。<\/li>\n<li>适航认证：外部机构检查（审计）。认证不检查每一颗螺丝，只抽查关键系统。<\/li>\n<li>投入运营：飞行中有黑匣子和地面雷达（监控），出了问题有应急程序（暂停、响应）。<\/li>\n<\/ul>\n<p>比喻的局限：飞机出厂后可以召回维修。不可升级的合约出厂后就不能改了，所以前面的关口必须更严。<\/p>\n<\/blockquote>\n<hr>\n<h2>2. 八个安全关口<\/h2>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart LR\n  A[&quot;① 规格与威胁模型&quot;] --&gt; B[&quot;② 安全编码规范&quot;]\n  B --&gt; C[&quot;③ 静态分析&quot;]\n  C --&gt; D[&quot;④ 单元 + 模糊 + 不变量测试&quot;]\n  D --&gt; E[&quot;⑤ 形式化验证（关键模块）&quot;]\n  E --&gt; F[&quot;⑥ 外部审计 / 竞赛&quot;]\n  F --&gt; G[&quot;⑦ 安全部署与权限移交&quot;]\n  G --&gt; H[&quot;⑧ 监控、漏洞赏金、应急响应&quot;]\n  H -. &quot;发现问题&quot; .-&gt; A<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul>\n<li>越靠左的关口，修复成本越低。规格阶段发现的问题，只需要改文档。<\/li>\n<li>③④⑤ 是自动化关口，每次提交代码都应运行。<\/li>\n<li>⑥ 审计发现的问题，应该反向补充到 ④ 的测试中，防止回归。<\/li>\n<li>局限：所有关口都依赖&quot;你想到了要检查什么&quot;。经济攻击和跨协议组合风险，常常需要专门的经济审计。<\/li>\n<\/ul>\n<hr>\n<h2>3. 各关口要做什么<\/h2>\n<h3>3.1 规格与威胁模型<\/h3>\n<ol>\n<li>写出每个函数的前置条件、后置条件。<\/li>\n<li>写出系统不变量（<a href=\"#c01\" data-nav=\"c01\">01 章<\/a> 4.2 节）。<\/li>\n<li>列出外部依赖：代币、预言机、DEX、跨链桥、目标链特性。<\/li>\n<li>列出特权角色和每个角色的最大破坏力。<\/li>\n<\/ol>\n<h3>3.2 静态分析<\/h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>工具<\/th>\n<th>类型<\/th>\n<th>能发现什么<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Slither<\/td>\n<td>Solidity 静态分析<\/td>\n<td>重入模式、未检查返回值、未初始化变量、可见性问题<\/td>\n<\/tr>\n<tr>\n<td>Aderyn 等<\/td>\n<td>Solidity 静态分析<\/td>\n<td>常见模式检查，输出 Markdown 报告<\/td>\n<\/tr>\n<tr>\n<td>Solidity SMTChecker<\/td>\n<td>编译器内置形式化检查<\/td>\n<td>断言违背、溢出（需要启用）<\/td>\n<\/tr>\n<tr>\n<td><code>forge inspect &lt;合约&gt; storage-layout<\/code><\/td>\n<td>布局导出<\/td>\n<td>升级前后存储布局对比<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<blockquote class=\"info\"><p>💡 注意：静态分析的误报率高。不要追求&quot;零告警&quot;，要追求&quot;每个告警都有结论&quot;。<\/p>\n<\/blockquote>\n<h3>3.3 测试三层<\/h3>\n<p><strong>单元测试<\/strong>：验证&quot;我想到的情况&quot;。<\/p>\n<div class=\"lv-figcap\"><span>图 · 测试三层各管什么<\/span><span class=\"new\">新增图解<\/span><\/div><div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart TB\n  subgraph L1[\"单元测试\"]\n    U1[\"验证「我想到的情况」\"]\n  end\n  subgraph L2[\"模糊测试\"]\n    F1[\"工具生成大量随机输入\"] --&gt; F2[\"例：存款后立即取款不能获利\"]\n  end\n  subgraph L3[\"不变量测试\"]\n    I1[\"工具生成随机调用序列\"] --&gt; I2[\"每一步后检查不变量\"]\n    I2 --&gt; I3[\"例：银行 ETH ≥ 所有存款之和\"]\n  end\n  L1 --&gt; L2\n  L2 --&gt; L3\n  L3 --&gt; W[\"只检查你写下的不变量\"]<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul><li><strong>数据流：<\/strong>从固定场景到随机输入，再到随机调用序列，覆盖面逐层扩大。<\/li><li><strong>关键：<\/strong>不变量测试靠 Handler 封装 deposit、withdraw、transfer 并随机调用。<\/li><li><strong>局限：<\/strong>没写进测试的不变量，模糊工具也不会发现。<\/li><\/ul>\n\n<p><strong>模糊测试（Fuzzing）<\/strong>：让工具生成大量随机输入，验证性质在所有输入下成立。<\/p>\n<div class=\"code-wrap\"><pre><code class=\"language-solidity\">// Foundry 模糊测试：存款后立即取款，用户不能获利\nfunction testFuzz_DepositRedeemNoProfit(uint96 assets) public {\n    vm.assume(assets &gt; 0);\n    deal(address(usdc), alice, assets);\n    vm.startPrank(alice);\n    usdc.approve(address(vault), assets);\n    uint256 shares = vault.deposit(assets, alice);\n    uint256 back   = vault.redeem(shares, alice, alice);\n    vm.stopPrank();\n    assertLe(back, assets, &quot;round-trip must not profit&quot;);\n}\n<\/code><\/pre><\/div>\n<p><strong>不变量测试（Invariant Testing）<\/strong>：让工具生成随机的<strong>调用序列<\/strong>，每一步之后检查不变量。<\/p>\n<div class=\"code-wrap\"><pre><code class=\"language-solidity\">// Foundry 不变量测试：银行永远有足够的 ETH 偿付所有存款\ncontract BankInvariant is Test {\n    Bank bank; Handler handler;\n    function setUp() public {\n        bank = new Bank();\n        handler = new Handler(bank);      // Handler 封装 deposit / withdraw / transfer，随机调用\n        targetContract(address(handler));\n    }\n    function invariant_solvent() public view {\n        assertGe(address(bank).balance, handler.sumOfBalances());\n    }\n}\n<\/code><\/pre><\/div>\n<blockquote class=\"warn\"><p>⚠️ 警告：不变量测试只检查你写下的不变量。Euler 事故（<a href=\"#c10\" data-nav=\"c10\">10 章<\/a>）的不变量&quot;每个账户健康因子 ≥ 1，或可被清算且清算后协议不亏损&quot;——如果没写进测试，模糊工具也不会发现。<\/p>\n<\/blockquote>\n<h3>3.4 形式化验证<\/h3>\n<p>形式化验证（Formal Verification）：用数学方法证明代码在<strong>所有<\/strong>输入和状态下满足规格。工具包括 Certora Prover、Halmos（符号执行）、K Framework 等。<\/p>\n<p>适用场景：核心数学库、清算逻辑、代币会计、桥的证明验证。代价是规格编写成本高，需要专门人才。<\/p>\n<h3>3.5 外部审计<\/h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>做法<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>冻结代码<\/td>\n<td>审计期间不改代码；审计对象是某个提交哈希<\/td>\n<\/tr>\n<tr>\n<td>提供文档<\/td>\n<td>规格、威胁模型、已知风险、测试覆盖率<\/td>\n<\/tr>\n<tr>\n<td>多家审计<\/td>\n<td>关键协议请 2 家以上，侧重不同<\/td>\n<\/tr>\n<tr>\n<td>审计竞赛<\/td>\n<td>Code4rena、Sherlock、Cantina 等平台；覆盖面广<\/td>\n<\/tr>\n<tr>\n<td>修复复审<\/td>\n<td>修复本身可能引入新漏洞，必须复审<\/td>\n<\/tr>\n<tr>\n<td>编译器版本<\/td>\n<td>记录并审查编译器版本的已知 bug（Vyper 2023 事故）<\/td>\n<\/tr>\n<tr>\n<td>审计范围外的代码<\/td>\n<td>明确标出；部署前不得修改审计范围内代码<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<blockquote class=\"info\"><p>💡 注意：PancakeBunny 事故后，其审计方公开表示：被利用的是审计之后新上线、未经审计的合约版本（REKT 文章引述）。<strong>&quot;审计过&quot;只对审计时的那个版本成立。<\/strong><\/p>\n<\/blockquote>\n<h3>3.6 安全部署<\/h3>\n<ol>\n<li>用脚本部署，不手动操作。脚本本身要评审。<\/li>\n<li>部署和初始化在同一笔交易完成（<a href=\"#c09\" data-nav=\"c09\">09 章<\/a>）。<\/li>\n<li>部署后在浏览器验证源码（Etherscan 类浏览器、BscScan、Mantlescan、Tronscan）。<\/li>\n<li>部署后运行验证脚本：读取所有关键参数，与预期对比。<\/li>\n<li>把权限从部署账户移交给多签和时间锁。撤销部署账户的所有角色。<\/li>\n<\/ol>\n<h3>3.7 监控与应急<\/h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>监控项<\/th>\n<th>告警条件（示例）<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>合约 TVL 变化<\/td>\n<td>10 分钟内下降 &gt; 10%<\/td>\n<\/tr>\n<tr>\n<td>闪电贷 + 本协议交互<\/td>\n<td>同一交易出现大额闪电贷与本协议调用<\/td>\n<\/tr>\n<tr>\n<td>特权调用<\/td>\n<td>任何 owner / admin 函数被调用<\/td>\n<\/tr>\n<tr>\n<td>预言机<\/td>\n<td>价格偏离其他来源 &gt; 5%；超过心跳未更新<\/td>\n<\/tr>\n<tr>\n<td>升级<\/td>\n<td>实现地址变化；时间锁队列新增操作<\/td>\n<\/tr>\n<tr>\n<td>跨链<\/td>\n<td>两侧锁定量与铸造量不一致<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"lv-figcap\"><span>图 · 发现异常后的应急流程<\/span><span class=\"new\">新增图解<\/span><\/div><div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart TB\n  A[\"监控告警&lt;br/&gt;TVL 骤降、特权调用、预言机偏离等\"] --&gt; B[\"值班人员确认\"]\n  B --&gt; C[\"触发暂停&lt;br/&gt;守护者权限，无延迟\"]\n  C --&gt; D[\"组建作战室&lt;br/&gt;开发、审计方、安全响应团队\"]\n  D --&gt; E{\"能否白帽救援？\"}\n  E --&gt;|\"能\"| F[\"抢先转移剩余资金\"]\n  E --&gt;|\"不能\"| G\n  F --&gt; G[\"联系交易所、稳定币发行方冻结\"]\n  G --&gt; H[\"发布公告和复盘\"]<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul><li><strong>关键：<\/strong>暂停必须是无延迟的守护者权限，否则来不及。<\/li><li><strong>数据流：<\/strong>先止损（暂停、救援），再追回（冻结），最后复盘。<\/li><li><strong>局限：<\/strong>应急能力要事先设计进合约，事发后才加已经晚了。<\/li><\/ul>\n\n<p>应急流程：<\/p>\n<ol>\n<li>发现异常 → 值班人员确认。<\/li>\n<li>触发暂停（守护者权限，无延迟）。<\/li>\n<li>组建作战室：开发、审计方、安全响应团队（例如 SEAL 911 一类社区应急组织）。<\/li>\n<li>评估是否可以白帽救援（抢先转移剩余资金）。<\/li>\n<li>联系交易所、稳定币发行方冻结被盗资金。<\/li>\n<li>发布公告和复盘。<\/li>\n<\/ol>\n<blockquote class=\"info\"><p>💡 注意：mETH 协议在 Bybit 事故中追回 cmETH，靠的是三样东西：协议本身有提款延迟、团队有暂停权限、外部安全社区快速牵线（The Block 报道）。应急能力需要<strong>事先<\/strong>设计进合约。<\/p>\n<\/blockquote>\n<hr>\n<h2>4. 链特定测试项<\/h2>\n<p>&quot;在以太坊上测过&quot;不代表&quot;在目标链上能跑&quot;。部署前在目标链的测试网或主网分叉上跑一遍完整测试。<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>链<\/th>\n<th>必测项<\/th>\n<th>工具提示<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>BNB Chain<\/td>\n<td>代币精度（BSC-USD 为 18 位）；基于区块数的时间计算（出块间隔已缩短到 0.45 秒，2026 年 1 月 Fermi）；分叉代码的改动点<\/td>\n<td>Foundry/Hardhat 直接支持；主网分叉测试<\/td>\n<\/tr>\n<tr>\n<td>TRON<\/td>\n<td>USDT 推送转账返回值；能量与 80 ms CPU 时间上限；<code>CHAINID<\/code>、<code>CREATE2<\/code> 地址前缀；目标操作码的硬分叉开关是否已开启；<code>TransferContract<\/code> 绕过 fallback<\/td>\n<td>TronBox、TRON IDE；在 Nile / Shasta 测试网实测，不要只用本地 EVM<\/td>\n<\/tr>\n<tr>\n<td>Mantle<\/td>\n<td><code>msg.value<\/code> 和 <code>address(this).balance<\/code> 是 MNT；ETH 是 ERC-20（BVM_ETH）；L1 数据费随 <code>tokenRatio<\/code> 变化；排序器宕机场景；跨链消息延迟<\/td>\n<td>Foundry 主网分叉；L1↔L2 消息用官方 SDK 测试<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>去 <a href=\"#lab-chain-porting-lab\" data-nav=\"lab-chain-porting-lab\" class=\"lab-link\">chain-porting-lab.html<\/a>，选择目标链和你的代码假设，生成一份迁移风险清单。<\/p>\n<hr>\n<h2>5. 一页审计速查表<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>类别<\/th>\n<th>关键问题<\/th>\n<th>章节<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>重入<\/td>\n<td>外部调用前状态是否已更新？共享状态是否共享锁？<\/td>\n<td><a href=\"#c03\" data-nav=\"c03\">03<\/a><\/td>\n<\/tr>\n<tr>\n<td>权限<\/td>\n<td>每个状态修改函数谁能调用？初始化是否受保护？<\/td>\n<td><a href=\"#c04\" data-nav=\"c04\">04<\/a><\/td>\n<\/tr>\n<tr>\n<td>算术<\/td>\n<td>舍入方向对协议有利？精度从合约读取？<\/td>\n<td><a href=\"#c05\" data-nav=\"c05\">05<\/a><\/td>\n<\/tr>\n<tr>\n<td>外部调用<\/td>\n<td>返回值检查？无代码地址？非标准代币？DoS？<\/td>\n<td><a href=\"#c06\" data-nav=\"c06\">06<\/a><\/td>\n<\/tr>\n<tr>\n<td>预言机<\/td>\n<td>价格一笔交易内可变吗？时效和上下限检查？<\/td>\n<td><a href=\"#c07\" data-nav=\"c07\">07<\/a><\/td>\n<\/tr>\n<tr>\n<td>MEV / 签名<\/td>\n<td><code>minOut<\/code>、<code>deadline<\/code>？EIP-712 + nonce？<\/td>\n<td><a href=\"#c08\" data-nav=\"c08\">08<\/a><\/td>\n<\/tr>\n<tr>\n<td>升级<\/td>\n<td>存储布局？实现合约已锁死？时间锁？<\/td>\n<td><a href=\"#c09\" data-nav=\"c09\">09<\/a><\/td>\n<\/tr>\n<tr>\n<td>经济<\/td>\n<td>偿付不变量？治理快照？清算激励？<\/td>\n<td><a href=\"#c10\" data-nav=\"c10\">10<\/a><\/td>\n<\/tr>\n<tr>\n<td>跨链<\/td>\n<td>消息字段完整？防重放？限额？<\/td>\n<td><a href=\"#c11\" data-nav=\"c11\">11<\/a><\/td>\n<\/tr>\n<tr>\n<td>链差异<\/td>\n<td>目标链和以太坊有哪些行为差异？<\/td>\n<td><a href=\"#k01\" data-nav=\"k01\">C01<\/a>、<a href=\"#k02\" data-nav=\"k02\">C02<\/a>、<a href=\"#k03\" data-nav=\"k03\">C03<\/a><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2>6. 术语表<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>术语<\/th>\n<th>英文<\/th>\n<th>定义<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>静态分析<\/td>\n<td>Static Analysis<\/td>\n<td>不运行代码，通过分析源码发现问题<\/td>\n<\/tr>\n<tr>\n<td>模糊测试<\/td>\n<td>Fuzzing<\/td>\n<td>用大量随机输入测试性质是否成立<\/td>\n<\/tr>\n<tr>\n<td>不变量测试<\/td>\n<td>Invariant Testing<\/td>\n<td>随机调用序列后检查不变量<\/td>\n<\/tr>\n<tr>\n<td>形式化验证<\/td>\n<td>Formal Verification<\/td>\n<td>用数学方法证明代码满足规格<\/td>\n<\/tr>\n<tr>\n<td>主网分叉<\/td>\n<td>Mainnet Fork<\/td>\n<td>在本地复制主网状态进行测试<\/td>\n<\/tr>\n<tr>\n<td>漏洞赏金<\/td>\n<td>Bug Bounty<\/td>\n<td>向报告漏洞的白帽支付奖励<\/td>\n<\/tr>\n<tr>\n<td>作战室<\/td>\n<td>War Room<\/td>\n<td>事故发生时的临时应急协作小组<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2>7. 思考题<\/h2>\n<ol>\n<li>为 <a href=\"#c03\" data-nav=\"c03\">03 章<\/a> 的 Bank 合约写一个 Handler，让不变量测试能发现跨函数重入。Handler 需要包含哪些动作？<\/li>\n<li>你的协议通过了两家审计。上线前一周，产品要求把手续费从 0.3% 改成 0.25%。应该怎样处理这个改动？（提示：Uranium Finance）<\/li>\n<li>列出你的协议在 TRON 上需要额外测试的 3 项，并说明为什么本地 EVM 测试覆盖不到。<\/li>\n<\/ol>\n<p>下一章：<a href=\"#c13\" data-nav=\"c13\">13 事故案例库<\/a> —— 用真实事故串起全部知识。<\/p>\n"}, "c13": {"id": "c13", "file": "13-incident-casebook.md", "title": "13 事故案例库：同样的错误，换个名字再来一次", "group": "g5", "html": "<h1>13 事故案例库：同样的错误，换个名字再来一次<\/h1>\n<blockquote class=\"\"><p>学习目标：读完本章，你能——<\/p>\n<ol>\n<li>按&quot;根因类别 + 链&quot;检索 30 余起代表性事故，并说出每起事故对应的防御章节。<\/li>\n<li>识别反复出现的 7 种事故模式。<\/li>\n<li>用统一模板写一份事故复盘。<\/li>\n<\/ol>\n<p>前置章节：01–12 章<br>交互实验：<a href=\"#lab-incident-explorer\" data-nav=\"lab-incident-explorer\" class=\"lab-link\">incident-explorer.html<\/a><\/p>\n<\/blockquote>\n<hr>\n<h2>1. 一句话理解<\/h2>\n<p><strong>大多数事故不是新漏洞，而是旧漏洞在新环境里复发：新链、新分叉、新版本、新的组合方式。<\/strong><\/p>\n<div class=\"lv-figcap\"><span>图 · 旧漏洞如何在新环境复发<\/span><span class=\"new\">新增图解<\/span><\/div><div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart LR\n  O[\"旧漏洞\"] --&gt; E1[\"新链\"]\n  O --&gt; E2[\"新分叉\"]\n  O --&gt; E3[\"新版本\"]\n  O --&gt; E4[\"新的组合方式\"]\n  E1 --&gt; R[\"事故复发\"]\n  E2 --&gt; R\n  E3 --&gt; R\n  E4 --&gt; R\n  R --&gt; L[\"读事故报告&lt;br/&gt;成本最低的安全训练\"]<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul><li><strong>关键：<\/strong>大多数事故不是新漏洞，而是旧漏洞换了环境。<\/li><li><strong>数据流：<\/strong>例如 Uniswap V2 被分叉成 Uranium，DAO 式重入在 Curve/Vyper 上复发。<\/li><li><strong>局限：<\/strong>合约事故复盘多由项目方或安全公司发布，细节和归因可能有争议。<\/li><\/ul>\n\n<blockquote class=\"analogy\"><p>🎯 打个比方：航空业把每一起事故都写成公开报告，所以今天的飞行员不会再犯 1970 年代的错误。<br>合约安全也有自己的&quot;事故报告&quot;——项目复盘、安全公司分析、链上数据。读事故报告，是成本最低的安全训练。<\/p>\n<p>比喻的局限：航空事故调查由独立机构完成，结论有权威性。合约事故的复盘多数由项目方或安全公司发布，细节可能不完整，归因可能存在争议。本章只采用多方公开资料一致的事实。<\/p>\n<\/blockquote>\n<hr>\n<h2>2. 事故总表<\/h2>\n<p>金额为事发时美元估值约数；来源类型为项目方复盘、安全公司分析和主流媒体报道。<\/p>\n<h3>2.1 以太坊与多链<\/h3>\n<p>以太坊案例的根因代码与攻击路径深潜见 <a href=\"#k00\" data-nav=\"k00\">C00 以太坊专题<\/a>。<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>时间<\/th>\n<th>事故<\/th>\n<th>链<\/th>\n<th>约损失<\/th>\n<th>根因类别<\/th>\n<th>一句话根因<\/th>\n<th>章节<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>2016-06<\/td>\n<td>The DAO<\/td>\n<td>以太坊<\/td>\n<td>6,000 万美元<\/td>\n<td>重入<\/td>\n<td>先转账后更新余额<\/td>\n<td><a href=\"#c03\" data-nav=\"c03\">03<\/a><\/td>\n<\/tr>\n<tr>\n<td>2017-07<\/td>\n<td>Parity 多签（一）<\/td>\n<td>以太坊<\/td>\n<td>3,000 万美元<\/td>\n<td>初始化 / 权限<\/td>\n<td><code>initWallet<\/code> 可经 delegatecall 被任何人调用<\/td>\n<td><a href=\"#c04\" data-nav=\"c04\">04<\/a><\/td>\n<\/tr>\n<tr>\n<td>2017-11<\/td>\n<td>Parity 多签（二）<\/td>\n<td>以太坊<\/td>\n<td>约 51 万 ETH 冻结<\/td>\n<td>初始化 / 权限<\/td>\n<td>未初始化的库被接管并自毁<\/td>\n<td><a href=\"#c04\" data-nav=\"c04\">04<\/a>、<a href=\"#c09\" data-nav=\"c09\">09<\/a><\/td>\n<\/tr>\n<tr>\n<td>2018-04<\/td>\n<td>BEC batchOverflow<\/td>\n<td>以太坊<\/td>\n<td>代币价值归零<\/td>\n<td>算术<\/td>\n<td><code>cnt * _value<\/code> 溢出<\/td>\n<td><a href=\"#c05\" data-nav=\"c05\">05<\/a><\/td>\n<\/tr>\n<tr>\n<td>2020-02<\/td>\n<td>bZx<\/td>\n<td>以太坊<\/td>\n<td>约 95 万美元（两次）<\/td>\n<td>预言机操纵<\/td>\n<td>单一 DEX 价格<\/td>\n<t <\/h3>\n<p>本手册收集的 TRON 案例集中在<strong>账户层、集成层<\/strong>，而不是单个协议的合约漏洞：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>类型<\/th>\n<th>事实来源<\/th>\n<th>根因<\/th>\n<th>章节<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>账户权限篡改（&quot;多签诈骗&quot;）<\/td>\n<td>慢雾、imToken、SafePal 等公开安全提示<\/td>\n<td>TRON 原生账户权限可被私钥持有者修改<\/td>\n<td><a href=\"#c04\" data-nav=\"c04\">04<\/a>、<a href=\"#k02\" data-nav=\"k02\">C02<\/a><\/td>\n<\/tr>\n<tr>\n<td>USDT 推送转账回滚<\/td>\n<td>OpenZeppelin 2026 年 TRON 部署审计<\/td>\n<td>TRON USDT <code>transfer<\/code> 成功也返回 false<\/td>\n<td><a href=\"#c06\" data-nav=\"c06\">06<\/a>、<a href=\"#k02\" data-nav=\"k02\">C02<\/a><\/td>\n<\/tr>\n<tr>\n<td>失败交易被误认为到账<\/td>\n<td>用户与交易所案例报道<\/td>\n<td>只检查交易存在，不检查执行结果<\/td>\n<td><a href=\"#c11\" data-nav=\"c11\">11<\/a>、<a href=\"#k02\" data-nav=\"k02\">C02<\/a><\/td>\n<\/tr>\n<tr>\n<td>授权钓鱼 / 地址投毒<\/td>\n<td>多家钱包安全月报<\/td>\n<td>诱导签名授权；伪造相似地址的转账记录<\/td>\n<td><a href=\"#c06\" data-nav=\"c06\">06<\/a>、<a href=\"#k02\" data-nav=\"k02\">C02<\/a><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h3>2.4 Mantle<\/h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>时间<\/th>\n<th>事件<\/th>\n<th>性质<\/th>\n<th>要点<\/th>\n<th>章节<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>2024-04<\/td>\n<td>Mantle op-geth 审计（OpenZeppelin）<\/td>\n<td>审计发现<\/td>\n<td>3 个严重问题均已修复，包括一个可无限铸造 BVM_ETH 的余额检查缺陷<\/td>\n<td><a href=\"#k03\" data-nav=\"k03\">C03<\/a><\/td>\n<\/tr>\n<tr>\n<td>2025-02<\/td>\n<td>mETH 协议追回 cmETH<\/td>\n<td>防御成功<\/td>\n<td>8 小时提款延迟 + 暂停 → 追回 15,000 cmETH（约 4,300 万美元）<\/td>\n<td><a href=\"#c10\" data-nav=\"c10\">10<\/a>、<a href=\"#k03\" data-nav=\"k03\">C03<\/a><\/td>\n<\/tr>\n<tr>\n<td>持续<\/td>\n<td>L2BEAT 风险评估<\/td>\n<td>信任假设<\/td>\n<td>无延迟升级、中心化排序器、可切换乐观模式<\/td>\n<td><a href=\"#c09\" data-nav=\"c09\">09<\/a>、<a href=\"#k03\" data-nav=\"k03\">C03<\/a><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<blockquote class=\"info\"><p>💡 注意：没有出现在表里，不代表没有发生。本表只收录本手册能用公开资料核实的事件。<\/p>\n<\/blockquote>\n<hr>\n<h2>3. 七种反复出现的模式<\/h2>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart TB\n  P1[&quot;① 先交互后记账&lt;br/&gt;DAO → Curve/Vyper&quot;]\n  P2[&quot;② 零值或默认值有含义&lt;br/&gt;Nomad、Qubit、ecrecover&quot;]\n  P3[&quot;③ 一笔交易内可变的数据被当作事实&lt;br/&gt;bZx → Cream → PancakeBunny&quot;]\n  P4[&quot;④ 新增函数绕过既有检查&lt;br/&gt;Euler&quot;]\n  P5[&quot;⑤ 改动过的分叉 / 新版本未审计&lt;br/&gt;Uranium、PancakeBunny&quot;]\n  P6[&quot;⑥ 签名人看不懂所签内容&lt;br/&gt;Bybit、TRON 权限诈骗&quot;]\n  P7[&quot;⑦ 少数密钥控制全部资产&lt;br/&gt;Ronin、无延迟升级&quot;]<\/pre><\/div>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>模式<\/th>\n<th>识别信号<\/th>\n<th>防御<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>① 先交互后记账<\/td>\n<td>外部调用之后还有状态写入<\/td>\n<td>CEI + 共享重入锁<\/td>\n<\/tr>\n<tr>\n<td>② 零值有含义<\/td>\n<td><code>== 0<\/code>、<code>address(0)<\/code>、未初始化映射被当作合法值<\/td>\n<td>零值一律视为无效；显式存在标记<\/td>\n<\/tr>\n<tr>\n<td>③ 可变数据作事实<\/td>\n<td><code>getReserves<\/code>、<code>balanceOf(this)<\/code>、份额价格用于定价<\/td>\n<td>抗操纵预言机；内部记账<\/td>\n<\/tr>\n<tr>\n<td>④ 新函数绕过检查<\/td>\n<td>新增修改余额 / 债务的入口<\/td>\n<td>统一的&quot;操作后检查&quot;钩子；不变量测试<\/td>\n<\/tr>\n<tr>\n<td>⑤ 未审计的改动<\/td>\n<td>&quot;只改了一行&quot;<\/td>\n<td>改动即重审；差异审计<\/td>\n<\/tr>\n<tr>\n<td>⑥ 盲签<\/td>\n<td>签名界面只显示哈希或摘要<\/td>\n<td>独立解码；硬件钱包核对；delegatecall 白名单<\/td>\n<\/tr>\n<tr>\n<td>⑦ 密钥集中<\/td>\n<td>少数签名人、无时间锁<\/td>\n<td>提高阈值和独立性；时间锁；速率限制<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2>4. 复盘模板<\/h2>\n<p>每次学习一起事故，按以下模板填写。模板也适用于你自己的项目事故。<\/p>\n<div class=\"lv-figcap\"><span>图 · 复盘模板的分析链条<\/span><span class=\"new\">新增图解<\/span><\/div><div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart TB\n  T0[\"T0 漏洞引入&lt;br/&gt;哪个版本或哪次升级\"] --&gt; T1[\"T1 攻击交易\"]\n  T1 --&gt; T2[\"T2 发现与响应\"]\n  T1 --&gt; P[\"攻击路径\"]\n  P --&gt; R1[\"直接原因&lt;br/&gt;代码哪一行\"]\n  R1 --&gt; R2[\"根本原因&lt;br/&gt;流程哪一环缺失\"]\n  R2 --&gt; G[\"哪个关口本可拦住\"]\n  R2 --&gt; V[\"被打破的不变量\"]\n  G --&gt; D[\"防御清单\"]\n  V --&gt; D<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul><li><strong>数据流：<\/strong>先还原时间线和攻击路径，再从代码追到流程。<\/li><li><strong>关键：<\/strong>直接原因是代码哪一行，根本原因是流程哪一环缺失，两者要分开写。<\/li><li><strong>出错点：<\/strong>把根本原因对应到规格、测试、审计、部署或监控中的某个关口。<\/li><\/ul>\n\n<div class=\"code-wrap\"><pre><code class=\"language-markdown\">## 事故名称（年-月，链）\n\n1. 一句话摘要：\n2. 损失：金额（约，事发时估值）；是否追回\n3. 时间线：\n   - T0 漏洞引入（哪个版本 / 哪次升级）\n   - T1 攻击交易\n   - T2 发现与响应\n4. 攻击路径：（sequenceDiagram）\n5. 根因：\n   - 直接原因（代码哪一行）\n   - 根本原因（流程哪一环缺失）\n6. 哪个关口本可以拦住它：（规格 / 静态分析 / 测试 / 审计 / 部署 / 监控）\n7. 对应的不变量：（写出被打破的那个式子）\n8. 防御清单：\n9. 资料来源：\n<\/code><\/pre><\/div>\n<hr>\n<h2>5. 术语表<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>术语<\/th>\n<th>英文<\/th>\n<th>定义<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>复盘<\/td>\n<td>Post-mortem<\/td>\n<td>事故后对原因、过程、改进措施的书面分析<\/td>\n<\/tr>\n<tr>\n<td>根本原因<\/td>\n<td>Root Cause<\/td>\n<td>去掉它事故就不会发生的最深层原因<\/td>\n<\/tr>\n<tr>\n<td>白帽救援<\/td>\n<td>Whitehat Rescue<\/td>\n<td>在攻击者之前把易受攻击的资金转移到安全地址<\/td>\n<\/tr>\n<tr>\n<td>地址投毒<\/td>\n<td>Address Poisoning<\/td>\n<td>向受害者发送来自相似地址的小额转账，诱导其复制错误地址<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2>6. 思考题<\/h2>\n<ol>\n<li>从总表中选一起你不熟悉的事故，用第 4 节模板写一份复盘。<\/li>\n<li>打开 <a href=\"#lab-incident-explorer\" data-nav=\"lab-incident-explorer\" class=\"lab-link\">incident-explorer.html<\/a>，按年份排序。2016–2019、2020–2022、2023 年之后三个阶段，主导的根因类别有什么变化？<\/li>\n<li>七种模式中，哪一种最难被自动化工具发现？为什么？<\/li>\n<\/ol>\n<p>继续阅读链专题：<a href=\"#k00\" data-nav=\"k00\">C00 以太坊<\/a> ｜ <a href=\"#k01\" data-nav=\"k01\">C01 BNB Chain<\/a> ｜ <a href=\"#k02\" data-nav=\"k02\">C02 TRON<\/a> ｜ <a href=\"#k03\" data-nav=\"k03\">C03 Mantle<\/a><\/p>\n"}, "k00": {"id": "k00", "file": "chains/C00-ethereum.md", "title": "C00 以太坊：合约案例深潜", "group": "chain", "html": "<h1>C00 以太坊：合约案例深潜<\/h1>\n<blockquote class=\"\"><p>学习目标：读完本章，你能——<\/p>\n<ol>\n<li>说出以太坊主网作为&quot;参照环境&quot;的 5 项安全相关特性，包括 EIP-6780、EIP-1153、EIP-7702 和 PBS。<\/li>\n<li>复盘 10 起以太坊主网事故的攻击路径和根因代码，并把每一起归入主线章节的漏洞类别。<\/li>\n<li>用&quot;同一模式、不同外衣&quot;的视角，把新事故快速对应到已知模式。<\/li>\n<\/ol>\n<p>前置章节：<a href=\"#c03\" data-nav=\"c03\">03 重入<\/a>、<a href=\"#c05\" data-nav=\"c05\">05 算术与精度<\/a>、<a href=\"#c06\" data-nav=\"c06\">06 外部调用<\/a>、<a href=\"#c07\" data-nav=\"c07\">07 预言机<\/a>、<a href=\"#c09\" data-nav=\"c09\">09 代理升级<\/a><br>交互实验：<a href=\"#lab-reentrancy-lab\" data-nav=\"lab-reentrancy-lab\" class=\"lab-link\">reentrancy-lab.html<\/a>、<a href=\"#lab-oracle-manipulation-lab\" data-nav=\"lab-oracle-manipulation-lab\" class=\"lab-link\">oracle-manipulation-lab.html<\/a>、<a href=\"#lab-incident-explorer\" data-nav=\"lab-incident-explorer\" class=\"lab-link\">incident-explorer.html<\/a> ｜ 示例合约：<a href=\"#examples\" data-nav=\"examples\">examples/08-RouterCallback.sol<\/a><\/p>\n<\/blockquote>\n<hr>\n<h2>1. 一句话理解<\/h2>\n<p><strong>以太坊是所有 EVM 链的&quot;原件&quot;。绝大多数合约漏洞模式最早在以太坊主网上出现、被复盘、被修复；其他链上的事故，多数是这些模式换了参数后复发。<\/strong><\/p>\n<blockquote class=\"analogy\"><p>🎯 打个比方：以太坊像一座<strong>有百年病历档案的大医院<\/strong>。<\/p>\n<ul>\n<li>这里的病例最多、记录最全（事故复盘、审计报告、链上数据都公开）。<\/li>\n<li>别的医院（BNB Chain、Mantle 等 EVM 链）用的是同一套医学教材，所以病人得的病大同小异。<\/li>\n<li>读懂这里的病历，你在任何一家医院都能更快认出症状。<\/li>\n<\/ul>\n<p>比喻的局限：病历只记录被发现的病。很多以太坊漏洞在被利用之前已经存在了数月甚至数年，期间没有人察觉。<\/p>\n<\/blockquote>\n<hr>\n<h2>2. 以太坊作为参照环境<\/h2>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart LR\n  U[&quot;用户 / 合约钱包&lt;br/&gt;EIP-7702 委托的 EOA&quot;] --&gt; MP[&quot;公开内存池&quot;]\n  U -. &quot;私有通道&quot; .-&gt; BLD\n  MP --&gt; SR[&quot;搜索者 Searcher&quot;]\n  SR --&gt; BLD[&quot;区块构建者 Builder&quot;]\n  MP --&gt; BLD\n  BLD --&gt; RL[&quot;中继 Relay（MEV-Boost）&quot;]\n  RL --&gt; PR[&quot;提议者 Proposer&lt;br/&gt;（PoS 验证者，12 秒一个槽位）&quot;]\n  PR --&gt; FIN[&quot;最终性&lt;br/&gt;约 2 个 epoch（约 12.8 分钟）&quot;]<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul>\n<li>以太坊的出块权和排序权已经分离（PBS，Proposer-Builder Separation，业界通过 MEV-Boost 实现）。排序由构建者竞价决定，这是三明治攻击的土壤（<a href=\"#c08\" data-nav=\"c08\">08 章<\/a>）。<\/li>\n<li>区块&quot;最终确定&quot;需要约两个 epoch。跨链桥和交易所在以太坊上通常等待最终性或足够确认数（<a href=\"#c11\" data-nav=\"c11\">11 章<\/a>）。<\/li>\n<li>局限：此图省略了 blob 交易和 L2 结算。L2 的安全依赖以太坊的这部分机制（<a href=\"#k03\" data-nav=\"k03\">C03 Mantle<\/a>）。<\/li>\n<\/ul>\n<h3>2.1 影响合约安全的协议升级<\/h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>升级<\/th>\n<th>时间（主网）<\/th>\n<th>改变了什么<\/th>\n<th>对合约安全的影响<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>EIP-150<\/td>\n<td>2016<\/td>\n<td>外部调用最多转发 63/64 的剩余 gas<\/td>\n<td>gas 不足型失败；调用方总能保留一点 gas 收尾<\/td>\n<\/tr>\n<tr>\n<td>EIP-1884 / EIP-2929<\/td>\n<td>2019 / 2021<\/td>\n<td>提高 SLOAD 等操作的 gas<\/td>\n<td>依赖 2300 gas 的 <code>transfer<\/code> 可能失败<\/td>\n<\/tr>\n<tr>\n<td>EIP-1153（Cancun）<\/td>\n<td>2024 年 3 月<\/td>\n<td>瞬态存储 TSTORE / TLOAD<\/td>\n<td>低成本重入锁；新的&quot;交易内状态&quot;语义<\/td>\n<\/tr>\n<tr>\n<td>EIP-6780（Cancun）<\/td>\n<td>2024 年 3 月<\/td>\n<td><code>SELFDESTRUCT<\/code> 只在同一交易内创建的合约上删除代码<\/td>\n<td>Parity 式&quot;自毁库合约&quot;不再能删除代码；强制转入 ETH 仍然可行<\/td>\n<\/tr>\n<tr>\n<td>EIP-7702（Pectra）<\/td>\n<td>2025 年 5 月<\/td>\n<td>EOA 可以签名委托一段合约代码<\/td>\n<td><code>tx.origin == msg.sender<\/code> 不再代表&quot;调用者是普通钱包&quot;；出现新的钓鱼方式（4.10 节）<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2>3. 案例总览<\/h2>\n<p>本章深潜 10 起以太坊主网事故。它们大多不在主线章节的&quot;代表案例&quot;中，但模式完全一致：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>时间<\/th>\n<th>事故<\/th>\n<th>约损失（事发时估值）<\/th>\n<th>模式<\/th>\n<th>主线章节<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>4.1<\/td>\n<td>2022-04<\/td>\n<td>Fei Rari（Fuse 池）<\/td>\n<td>约 8,000 万美元<\/td>\n<td>重入：先转 ETH 后记账；锁没有覆盖全部函数<\/td>\n<td><a href=\"#c03\" data-nav=\"c03\">03<\/a><\/td>\n<\/tr>\n<tr>\n<td>4.2<\/td>\n<td>2024-09<\/td>\n<td>Penpie<\/td>\n<td>约 2,700 万美元<\/td>\n<td>重入 + 无许可市场注册<\/td>\n<td><a href=\"#c03\" data-nav=\"c03\">03<\/a>、<a href=\"#c06\" data-nav=\"c06\">06<\/a><\/td>\n<\/tr>\n<tr>\n<td>4.3<\/td>\n<td>2022-04<\/td>\n<td>Akutars NFT<\/td>\n<td>11,539.5 ETH 永久锁定（超过 3,400 万美元）<\/td>\n<td>逻辑错误 + 推送退款 DoS<\/td>\n<td><a href=\"#c06\" data-nav=\"c06\">06<\/a><\/td>\n<\/tr>\n<tr>\n<td>4.4<\/td>\n<td>2023-11<\/td>\n<td>KyberSwap Elastic<\/td>\n<td>超过 4,800 万美元（多链合计）<\/td>\n<td>舍入方向错误<\/td>\n<td><a href=\"#c05\" data-nav=\"c05\">05<\/a><\/td>\n<\/tr>\n<tr>\n<td>4.5<\/td>\n<td>2020-10<\/td>\n<td>Harvest Finance<\/td>\n<td>约 3,380 万美元（后归还 250 万美元）<\/td>\n<td>金库份额价格被 Curve 池价格操纵<\/td>\n<td><a href=\"#c07\" data-nav=\"c07\">07<\/a><\/td>\n<\/tr>\n<tr>\n<td>4.6<\/td>\n<td>2022-04<\/td>\n<td>Inverse Finance<\/td>\n<td>约 1,560 万美元<\/td>\n<td>低流动性池的 TWAP 被持续操纵（非闪电贷）<\/td>\n<td><a href=\"#c07\" data-nav=\"c07\">07<\/a><\/td>\n<\/tr>\n<tr>\n<td>4.7<\/td>\n<td>2023-04<\/td>\n<td>Sushi RouteProcessor2<\/td>\n<td>约 330 万美元<\/td>\n<td>用户可控的回调地址 + 授权<\/td>\n<td><a href=\"#c04\" data-nav=\"c04\">04<\/a>、<a href=\"#c06\" data-nav=\"c06\">06<\/a><\/td>\n<\/tr>\n<tr>\n<td>4.8<\/td>\n<td>2021-09<\/td>\n<td>Compound 提案 62<\/td>\n<td>最多约 28 万 COMP（约 8,000 万美元）面临错误发放<\/td>\n<td>升级引入 bug + 无紧急开关<\/td>\n<td><a href=\"#c09\" data-nav=\"c09\">09<\/a>、<a href=\"#c10\" data-nav=\"c10\">10<\/a><\/td>\n<\/tr>\n<tr>\n<td>4.9<\/td>\n<td>2024-07<\/td>\n<td>WazirX 多签<\/td>\n<td>约 2.3 亿美元<\/td>\n<td>签名界面与实际交易不一致<\/td>\n<td><a href=\"#c08\" data-nav=\"c08\">08<\/a><\/td>\n<\/tr>\n<tr>\n<td>4.10<\/td>\n<td>2025<\/td>\n<td>EIP-7702 委托钓鱼<\/td>\n<td>单个钱包损失近 15 万美元（Scam Sniffer 案例）<\/td>\n<td>签名委托代码<\/td>\n<td><a href=\"#c02\" data-nav=\"c02\">02<\/a>、<a href=\"#c08\" data-nav=\"c08\">08<\/a><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<blockquote class=\"info\"><p>💡 注意：以下代码片段是<strong>根据公开复盘整理的简化示意<\/strong>，用于说明根因，不是原始合约的逐行复制。<\/p>\n<\/blockquote>\n<hr>\n<h2>4. 案例深潜<\/h2>\n<h3>4.1 Fei Rari：分叉 Compound 的重入（2022 年 4 月）<\/h3>\n<p><strong>背景<\/strong>：Rari Capital 的 Fuse 是基于 Compound 分叉的借贷池。Fei Protocol 与 Rari 合并后，Fuse 池在 2022 年 4 月 30 日被攻击（CertiK 公开分析）。<\/p>\n<div class=\"code-wrap\"><pre><code class=\"language-solidity\">// 简化示意 —— ❌ borrow 先转出 ETH，后更新借款记录\nfunction borrowFresh(address payable borrower, uint borrowAmount) internal {\n    require(comptroller.borrowAllowed(address(this), borrower, borrowAmount) == 0);\n    doTransferOut(borrower, borrowAmount);           // ① 对 ETH 市场：borrower.call{value: …}\n    accountBorrows[borrower].principal = newDebt;    // ② 太晚\n    totalBorrows = newTota
