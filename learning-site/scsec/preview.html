lBorrows;\n}\n<\/code><\/pre><\/div>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">sequenceDiagram\n  autonumber\n  participant A as 攻击合约\n  participant FL as 闪电贷\n  participant C as fUSDC（抵押市场）\n  participant E as fETH（借款市场）\n  participant T as Comptroller\n  A-&gt;&gt;FL: 借 1.5 亿 USDC\n  A-&gt;&gt;C: 存入 1.5 亿 USDC 作抵押\n  A-&gt;&gt;E: borrow(1,977 ETH)\n  E-&gt;&gt;A: call{value: 1,977 ETH}（借款记录尚未写入）\n  A-&gt;&gt;T: 回调中 exitMarket(fUSDC)\n  Note over T: 账本显示无借款 → 允许退出\n  A-&gt;&gt;C: 取回 1.5 亿 USDC 抵押品\n  E--&gt;&gt;E: 返回后才写入借款记录\n  A-&gt;&gt;FL: 还款，带走 ETH<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul>\n<li>攻击者在回调里退出抵押市场并取回抵押品。此时 Comptroller 读到的借款记录还是 0。<\/li>\n<li>Rari 在同年 4 月 1 日加强了重入保护，但 CertiK 分析指出，<code>exitMarket()<\/code> 没有被那把锁覆盖。这正是 <a href=\"#c03\" data-nav=\"c03\">03 章<\/a> 3.2 节&quot;跨函数重入&quot;的真实版本。<\/li>\n<li>Compound 原版的 ETH 市场用 <code>transfer<\/code>（只转发 2300 gas）发送 ETH，这在当时恰好挡住了回调重入。公开分析指出，被攻击的 Fuse 版本用低级 <code>call<\/code> 发送 ETH，把足够的 gas 和控制权交给了接收方，而状态更新顺序没有同步调整。<\/li>\n<li>损失约 8,000 万美元。<\/li>\n<\/ul>\n<p><strong>教训<\/strong>：修改&quot;转账方式&quot;会改变重入面。从 <code>transfer<\/code> 改成 <code>call<\/code> 时，必须同时改成 CEI，并让所有读写借贷状态的入口共用一把锁。<\/p>\n<h3>4.2 Penpie：无许可注册 + 重入（2024 年 9 月）<\/h3>\n<p><strong>背景<\/strong>：Penpie 是建在 Pendle 之上的收益协议，为 Pendle 市场的 LP 代币提供额外奖励。<\/p>\n<p><strong>攻击路径<\/strong>（Halborn、Verichains 等公开分析）：<\/p>\n<ol>\n<li>攻击者在 Pendle 上创建一个新市场。市场创建无需许可。<\/li>\n<li>新市场使用攻击者自己部署的&quot;SY 代币&quot;（Pendle 的标准化收益代币）。<\/li>\n<li>Penpie 允许新市场注册进奖励系统，并相信市场合约的行为是良性的。<\/li>\n<li>攻击者调用 Penpie 批量领取奖励的函数。该函数在领取过程中调用市场合约，而市场合约由攻击者控制。<\/li>\n<li>领取函数没有重入保护。攻击者在回调中存入真实资产，使 Penpie 把这部分资产误算为&quot;奖励&quot;。<\/li>\n<li>损失约 2,700 万美元。<\/li>\n<\/ol>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart LR\n  A[&quot;无许可创建市场&lt;br/&gt;（恶意 SY 代币）&quot;] --&gt; B[&quot;市场被 Penpie 接纳&quot;]\n  B --&gt; C[&quot;批量领取奖励&lt;br/&gt;调用恶意市场&quot;]\n  C --&gt; D[&quot;回调中重入存款&quot;]\n  D --&gt; E[&quot;余额差被算成奖励&quot;]\n  E --&gt; F[&quot;提走真实资产&quot;]<\/pre><\/div>\n<p><strong>教训<\/strong>：<\/p>\n<ul>\n<li>&quot;无许可上架&quot;和&quot;信任上架对象的代码&quot;不能同时成立。参见 <a href=\"#c03\" data-nav=\"c03\">03 章<\/a> 5.3 节&quot;允许任意代币就等于允许任意回调&quot;。<\/li>\n<li>用&quot;调用前后余额差&quot;计算奖励或存款时，必须加重入锁，否则回调中的转账会污染差值（<a href=\"#c06\" data-nav=\"c06\">06 章<\/a> 3.2 节）。<\/li>\n<\/ul>\n<h3>4.3 Akutars：一个变量名锁死 11,539 ETH（2022 年 4 月）<\/h3>\n<p><strong>背景<\/strong>：Akutars 是一个荷兰式拍卖发行的 NFT 项目。拍卖结束后，合约先向出价者退还差价，再允许项目方提取收入（BlockSec 公开分析）。<\/p>\n<div class=\"code-wrap\"><pre><code class=\"language-solidity\">// 简化示意 —— 两个缺陷\nfunction processRefunds() external {\n    for (uint256 i = refundProgress; i &lt; _bidIndex; i++) {\n        // ❌ 缺陷 1：推送退款。任何一个出价者合约拒收，整笔回滚，所有人都退不了款\n        (bool ok, ) = bids[i].bidder.call{value: refundAmount(i)}(&quot;&quot;);\n        require(ok, &quot;refund failed&quot;);\n        refundProgress++;\n    }\n}\nfunction claimProjectFunds() external onlyOwner {\n    // ❌ 缺陷 2：比较对象写错。totalBids 是 NFT 数量之和，大于出价笔数 _bidIndex，\n    //    refundProgress 最多等于 _bidIndex，条件永远不成立\n    require(refundProgress &gt;= totalBids, &quot;Refunds not yet processed&quot;);\n    payable(owner).transfer(address(this).balance);\n}\n<\/code><\/pre><\/div>\n<p><strong>结果<\/strong>：11,539.5 ETH（当时超过 3,400 万美元）被永久锁在合约中。合约不可升级，无法修复。缺陷 1 是潜在的 DoS 入口；缺陷 2 才是锁死资金的直接原因（BlockSec 分析）。<\/p>\n<p><strong>教训<\/strong>：<\/p>\n<ol>\n<li>推送式退款是 DoS 入口，改为拉取式（<a href=\"#c06\" data-nav=\"c06\">06 章<\/a> 第 4 节）。<\/li>\n<li>资金出口的条件必须有测试覆盖：写一个测试&quot;所有退款处理完后，项目方能提取&quot;——它会立刻失败。<\/li>\n<li>不可升级合约的上线门槛要更高。没有维修门，就只能一次做对。<\/li>\n<\/ol>\n<h3>4.4 KyberSwap Elastic：舍入方向导致&quot;跳过 tick&quot;（2023 年 11 月）<\/h3>\n<p><strong>背景<\/strong>：KyberSwap Elastic 是集中流动性 AMM，类似 Uniswap V3，并带有手续费自动再投资。<\/p>\n<p><strong>根因<\/strong>（BlockSec 公开分析）：<\/p>\n<ul>\n<li><code>SwapMath.estimateIncrementalLiquidity<\/code> 中，<code>deltaL<\/code> 用 <code>mulDivFloor<\/code> 向下取整，而代码注释表明它应该向上取整。<\/li>\n<li>结果是计算出的下一个价格 <code>nextSqrtP<\/code> 偏大。攻击者精心构造交换数量，使价格实际已经越过某个 tick 边界，池子却认为&quot;没有跨越&quot;，于是没有更新该 tick 的流动性。<\/li>\n<li>反向交换时，同一段流动性被计算了两次。攻击者用&quot;重复计算的流动性&quot;换出了池子资产。<\/li>\n<li>攻击者先从 Aave 借 2,000 WETH 闪电贷，完成操纵后还款。多条链上的池子合计损失超过 4,800 万美元。<\/li>\n<\/ul>\n<p><strong>教训<\/strong>：这是 <a href=\"#c05\" data-nav=\"c05\">05 章<\/a> 第 3 节&quot;舍入方向对协议有利&quot;的教科书案例。注释写对了、代码写错了——<strong>代码与注释不一致时，审计要把它当作漏洞线索<\/strong>。集中流动性 AMM 的边界条件（恰好落在 tick 上、跨越 tick 的一瞬间）必须用模糊测试覆盖。<\/p>\n<h3>4.5 Harvest Finance：金库份额价格被操纵（2020 年 10 月）<\/h3>\n<p><strong>背景<\/strong>：Harvest 的 fUSDC、fUSDT 金库把资金投入 Curve 的 Y 池。金库在计算份额价格时，依赖 Curve 池中稳定币之间的价格。<\/p>\n<p><strong>攻击路径<\/strong>（The Block 报道、项目方说明）：<\/p>\n<ol>\n<li>闪电贷借入大量 USDT。<\/li>\n<li>在 Curve Y 池中把 USDT 换成 USDC，压低 USDC 相对价格。金库持仓的估值随之下降。<\/li>\n<li>以&quot;偏低的份额价格&quot;存入 USDC，获得更多份额。<\/li>\n<li>在 Curve 中反向交换，价格恢复。<\/li>\n<li>以&quot;恢复后的份额价格&quot;赎回，取回更多 USDC。<\/li>\n<li>重复多轮。攻击者共取走约 3,380 万美元，后来退还约 250 万美元。<\/li>\n<\/ol>\n<p><strong>教训<\/strong>：<\/p>\n<ul>\n<li>金库份额价格 = 持仓估值 ÷ 份额总数。只要持仓估值依赖一笔交易内可变的价格，份额价格就可以被操纵（<a href=\"#c07\" data-nav=\"c07\">07 章<\/a>）。<\/li>\n<li>Harvest 事后提出&quot;提交-揭示&quot;式存款，阻止在同一笔交易内存入并取出。这是&quot;把攻击从一笔交易拉长到多个区块&quot;的防御思路，和 Mantle mETH 的提款延迟同源（<a href=\"#k03\" data-nav=\"k03\">C03<\/a>）。<\/li>\n<\/ul>\n<h3>4.6 Inverse Finance：不用闪电贷的 TWAP 操纵（2022 年 4 月）<\/h3>\n<p><strong>背景<\/strong>：Inverse Finance 的借贷市场 Anchor 用 INV 作为抵押品，INV 价格来自基于 SushiSwap 池的 TWAP 预言机。<\/p>\n<p><strong>攻击路径<\/strong>（项目方事故报告）：<\/p>\n<ol>\n<li>攻击者投入大量自有资金，在流动性很浅的 INV 交易池中买入 INV，把价格推高到约 20,926 美元。<\/li>\n<li>攻击者同时发送大量垃圾交易，抑制套利机器人把价格拉回。<\/li>\n<li>TWAP 窗口内的价格被持续抬高，预言机输出的 INV 价格随之上升（报告还提到 TWAP 窗口设置存在问题）。<\/li>\n<li>攻击者以 INV 抵押，借出约 1,560 万美元的 DOLA、ETH、WBTC、YFI。<\/li>\n<li>价格回落后，INV 抵押品被清算，协议留下坏账。<\/li>\n<\/ol>\n<p><strong>教训<\/strong>：<\/p>\n<ul>\n<li>项目方强调这是&quot;资本密集型、非闪电贷&quot;攻击。<strong>TWAP 能挡住单笔交易的闪电贷操纵，挡不住有资本、能持续数个区块的操纵<\/strong>——尤其是浅池（<a href=\"#c07\" data-nav=\"c07\">07 章<\/a> 第 4 节）。<\/li>\n<li>低流动性的治理代币作抵押品，是 Venus XVS 事件（<a href=\"#k01\" data-nav=\"k01\">C01<\/a>）在以太坊上的翻版。<\/li>\n<li>在 <a href=\"#lab-oracle-manipulation-lab\" data-nav=\"lab-oracle-manipulation-lab\" class=\"lab-link\">oracle-manipulation-lab.html<\/a> 中切换到 TWAP，把&quot;被操纵的区块数&quot;调大，可以复现这个思路。<\/li>\n<\/ul>\n<h3>4.7 Sushi RouteProcessor2：回调地址由用户指定（2023 年 4 月）<\/h3>\n<p><strong>背景<\/strong>：RouteProcessor2 是 Sushi 的路由合约，上线仅 4 天。用户需要先给它授权（approve），它才能代用户交换代币。<\/p>\n<div class=\"code-wrap\"><pre><code class=\"language-solidity\">// 简化示意 —— ❌ 池子地址来自用户输入的路由，没有校验它是否为真实池子\nfunction swapUniV3(bytes calldata route) internal {\n    address pool = readAddress(route);            // 攻击者填入自己部署的&quot;池子&quot;\n    lastCalledPool = pool;\n    IUniswapV3Pool(pool).swap(...);               // 恶意池子立即回调 uniswapV3SwapCallback\n}\nfunction uniswapV3SwapCallback(int256 a0, int256 a1, bytes calldata data) external {\n    require(msg.sender == lastCalledPool, &quot;RP2: callback from unknown source&quot;); // 检查通过：就是攻击者的池子\n    (address tokenIn, address from) = abi.decode(data, (address, address));   // from 可以是任意授权过的用户\n    IERC20(tokenIn).safeTransferFrom(from, msg.sender, uint256(a0 &gt; 0 ? a0 : a1));\n}\n<\/code><\/pre><\/div>\n<p><strong>结果<\/strong>（Hacken、The Block 等公开分析）：攻击者把任意一个授权过 RouteProcessor2 的用户填为 <code>from<\/code>，把对方的代币转给自己。约 330 万美元被盗，其中一位用户损失 1,800 ETH。风险波及 14 条链上的部署。白帽当天抢先救出了 1,000 多 ETH。<\/p>\n<p><strong>教训<\/strong>：<\/p>\n<ul>\n<li>&quot;回调来自 <code>lastCalledPool<\/code>&quot;只证明了&quot;回调来自我刚才调用的地址&quot;，没有证明&quot;那是一个真实的池子&quot;。正确做法是用工厂地址和代币对<strong>计算<\/strong>出池子地址再比较（Uniswap V3 的 <code>CallbackValidation<\/code> 思路），见 <a href=\"#examples\" data-nav=\"examples\">examples/08-RouterCallback.sol<\/a>。<\/li>\n<li>持有用户授权的合约，等于持有用户钱包的钥匙。它的任何&quot;用户可控地址&quot;都必须视为攻击入口（<a href=\"#c04\" data-nav=\"c04\">04 章<\/a> 3.4 节、<a href=\"#c06\" data-nav=\"c06\">06 章<\/a> 第 5 节）。<\/li>\n<li>用户侧：只授权需要的额度；不用的授权及时撤销。<\/li>\n<\/ul>\n<h3>4.8 Compound 提案 62：升级 bug 遇上&quot;没有刹车&quot;（2021 年 9 月）<\/h3>\n<p><strong>背景<\/strong>：Compound 通过治理提案 62 升级了 Comptroller 合约中的 COMP 奖励分发逻辑。<\/p>\n<p><strong>事件<\/strong>（The Block 报道）：<\/p>\n<ol>\n<li>升级生效后，部分用户可以从 Comptroller 领取远超应得的 COMP。可领取量约 16.8 万 COMP；创始人估计最坏情况约 28 万 COMP（约 8,000 万美元）。<\/li>\n<li>创始人公开表示：协议<strong>没有管理员开关或社区工具可以停止 COMP 分发<\/strong>。<\/li>\n<li>任何修复都必须走治理流程，到生产环境需要约 7 天。在此期间，被错误发放的 COMP 只能被动等待用户领取或&quot;自愿归还&quot;。<\/li>\n<\/ol>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart LR\n  A[&quot;治理提案升级奖励逻辑&quot;] --&gt; B[&quot;奖励索引计算有误&quot;]\n  B --&gt; C[&quot;部分用户可超额领取&quot;]\n  C --&gt; D{&quot;能否紧急暂停?&quot;}\n  D -- &quot;否：只有治理权限&quot; --&gt; E[&quot;修复需约 7 天治理流程&quot;]\n  E --&gt; F[&quot;窗口期内持续流失&quot;]<\/pre><\/div>\n<p><strong>教训<\/strong>：<\/p>\n<ul>\n<li>时间锁保护用户免受<strong>恶意<\/strong>升级；但当升级本身有 bug 时，同一把时间锁也阻止了<strong>快速修复<\/strong>。<\/li>\n<li>设计上要把两类权限分开：可以快速执行、只能&quot;停&quot;的守护者权限；必须经过时间锁、可以&quot;改&quot;的升级权限（<a href=\"#c04\" data-nav=\"c04\">04 章<\/a> 4.1 节）。<\/li>\n<li>升级前应在主网分叉环境中跑奖励分发的不变量测试：&quot;每个用户累计领取 ≤ 按份额应得&quot;（<a href=\"#c12\" data-nav=\"c12\">12 章<\/a>）。<\/li>\n<\/ul>\n<h3>4.9 WazirX：又一起多签签名界面事故（2024 年 7 月）<\/h3>\n<p><strong>背景<\/strong>：印度交易所 WazirX 的以太坊冷钱包是一个 4/6 多签：5 个签名人来自 WazirX，1 个来自托管服务商 Liminal。交易需要 3 个 WazirX 签名，再由 Liminal 做策略检查后签署（Mudit Gupta 公开分析）。<\/p>\n<p><strong>事件<\/strong>：签名人以为在签一笔日常交易，界面显示的也是正常内容，但发送到硬件钱包签名的数据是恶意的。这笔交易把多签升级为攻击者控制的版本。约 2.3 亿美元被盗。WazirX 与 Liminal 都否认自己的系统被攻破，公开分析认为至少一方的签名环境被入侵。<\/p>\n<p><strong>与 Bybit（2025 年 2 月）的对照<\/strong>：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>WazirX 2024<\/th>\n<th>Bybit 2025<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>钱包<\/td>\n<td>4/6 多签 + 托管服务商<\/td>\n<td>Safe 多签<\/td>\n<\/tr>\n<tr>\n<td>被篡改的环节<\/td>\n<td>签名界面（具体位置有争议）<\/td>\n<td>Safe{Wallet} 前端<\/td>\n<\/tr>\n<tr>\n<td>恶意交易做了什么<\/td>\n<td>升级多签，去掉签名要求<\/td>\n<td>delegatecall 替换多签实现<\/td>\n<\/tr>\n<tr>\n<td>约损失<\/td>\n<td>2.3 亿美元<\/td>\n<td>15 亿美元<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>教训<\/strong>：同一种攻击在 7 个月内两次命中大型交易所。签名流程的防御见 <a href=\"#c08\" data-nav=\"c08\">08 章<\/a> 第 4 节：独立解码 calldata、硬件钱包逐字段核对、对&quot;升级 / delegatecall&quot;类操作设置额外审批。这也是《CEX 交易所学习手册》中冷钱包管理的现实背景。<\/p>\n<h3>4.10 EIP-7702 委托钓鱼（2025 年）<\/h3>\n<p><strong>背景<\/strong>：Pectra 升级（2025 年 5 月）引入 EIP-7702。EOA 签署一份&quot;授权&quot;，就能让自己的地址执行某个合约的代码。<\/p>\n<p><strong>现象<\/strong>（The Block 报道 Wintermute 的链上统计）：<\/p>\n<ul>\n<li>Wintermute 发现，主网上超过 80% 的 EIP-7702 委托指向同一类复制粘贴的&quot;清扫合约&quot;。这类合约会把私钥已泄露的钱包里的资产自动转给攻击者。<\/li>\n<li>Scam Sniffer 发现一个钱包通过一笔恶意批量交易损失近 15 万美元，与 Inferno Drainer 钓鱼服务有关。<\/li>\n<li>安全研究者指出，根本问题仍是私钥泄露；EIP-7702 让清扫更便宜、更自动化。<\/li>\n<\/ul>\n<p><strong>对合约开发者的含义<\/strong>：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>旧假设<\/th>\n<th>EIP-7702 之后<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>msg.sender == tx.origin<\/code> 说明调用者是普通钱包<\/td>\n<td>委托后的 EOA 可以执行任意代码，也可以回调<\/td>\n<\/tr>\n<tr>\n<td><code>addr.code.length == 0<\/code> 说明对方没有代码<\/td>\n<td>委托后的 EOA 带有委托指示代码<\/td>\n<\/tr>\n<tr>\n<td>只有合约才会在收到 ETH 时执行逻辑<\/td>\n<td>委托后的 EOA 也会<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<blockquote class=\"warn\"><p>⚠️ 警告：任何用&quot;是不是 EOA&quot;来防重入、防闪电贷或限制调用者的代码，在 EIP-7702 之后都需要重新审视。用户侧：钱包必须清楚显示委托目标合约；不要签署看不懂的授权。<\/p>\n<\/blockquote>\n<hr>\n<h2>5. 模式归纳：以太坊案例与其他链的同类事故<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>模式<\/th>\n<th>以太坊案例<\/th>\n<th>其他链上的同类<\/th>\n<th>主线章节<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>先交互后记账<\/td>\n<td>The DAO、Fei Rari、Penpie、Curve/Vyper<\/td>\n<td>BNB Chain 分叉项目回调重入<\/td>\n<td><a href=\"#c03\" data-nav=\"c03\">03<\/a><\/td>\n<\/tr>\n<tr>\n<td>舍入与精度<\/td>\n<td>KyberSwap、Balancer V2<\/td>\n<td>Uranium（BNB Chain，常数不一致）<\/td>\n<td><a href=\"#c05\" data-nav=\"c05\">05<\/a><\/td>\n<\/tr>\n<tr>\n<td>可变价格被当作事实<\/td>\n<td>Harvest、Cream、Inverse<\/td>\n<td>PancakeBunny、Venus（BNB Chain）<\/td>\n<td><a href=\"#c07\" data-nav=\"c07\">07<\/a><\/td>\n<\/tr>\n<tr>\n<td>用户可控地址 + 授权<\/td>\n<td>Sushi RouteProcessor2<\/td>\n<td>Qubit（零地址存款，以太坊 → BNB Chain）<\/td>\n<td><a href=\"#c06\" data-nav=\"c06\">06<\/a><\/td>\n<\/tr>\n<tr>\n<td>资金出口条件错误 / DoS<\/td>\n<td>Akutars<\/td>\n<td>TRON 上依赖 <code>receive()<\/code> 的等式检查<\/td>\n<td><a href=\"#c06\" data-nav=\"c06\">06<\/a>、<a href=\"#k02\" data-nav=\"k02\">C02<\/a><\/td>\n<\/tr>\n<tr>\n<td>升级与应急权限设计<\/td>\n<td>Compound 62、Nomad、Parity<\/td>\n<td>Mantle 无延迟升级（信任假设）<\/td>\n<td><a href=\"#c09\" data-nav=\"c09\">09<\/a>、<a href=\"#k03\" data-nav=\"k03\">C03<\/a><\/td>\n<\/tr>\n<tr>\n<td>签名界面<\/td>\n<td>Bybit、WazirX<\/td>\n<td>TRON 账户权限诈骗<\/td>\n<td><a href=\"#c08\" data-nav=\"c08\">08<\/a>、<a href=\"#k02\" data-nav=\"k02\">C02<\/a><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2>6. 在以太坊主网开发的检查清单<\/h2>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> 重入分析覆盖所有回调来源：原生 ETH、ERC-777/721/1155 钩子、闪电贷回调、用户指定的池子与路由、<strong>EIP-7702 委托的 EOA<\/strong>。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 不用 <code>tx.origin == msg.sender<\/code> 或 <code>code.length == 0<\/code> 判断&quot;调用者是普通用户&quot;。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 使用瞬态存储锁时确认编译器版本，并对锁做跨函数测试。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 价格来源区分&quot;单笔交易可操纵&quot;与&quot;多区块可操纵&quot;；浅池资产不作为高抵押率抵押品。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 回调校验基于&quot;计算出的合法地址&quot;，不基于&quot;上一次调用的地址&quot;。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 资金出口（提款、项目方领取、退款）都有端到端测试；不可升级合约尤其如此。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 守护者暂停权与升级权分离；奖励、铸币类功能有独立的紧急开关。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 所有交换有 <code>minOut<\/code> 与 <code>deadline<\/code>；关键交易考虑私有通道。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 多签操作有独立的 calldata 解码与核对流程。<\/li>\n<\/ul>\n<hr>\n<h2>7. 术语表<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>术语<\/th>\n<th>英文<\/th>\n<th>定义<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>提议者-构建者分离<\/td>\n<td>PBS<\/td>\n<td>出块的验证者与构造区块内容的构建者分离<\/td>\n<\/tr>\n<tr>\n<td>最终性<\/td>\n<td>Finality<\/td>\n<td>区块不可被回滚的状态；以太坊约需 2 个 epoch<\/td>\n<\/tr>\n<tr>\n<td>瞬态存储<\/td>\n<td>Transient Storage<\/td>\n<td>EIP-1153 引入，交易结束自动清零的存储<\/td>\n<\/tr>\n<tr>\n<td>委托<\/td>\n<td>Delegation (EIP-7702)<\/td>\n<td>EOA 签名授权执行某个合约代码<\/td>\n<\/tr>\n<tr>\n<td>集中流动性<\/td>\n<td>Concentrated Liquidity<\/td>\n<td>流动性只在指定价格区间内生效的 AMM 设计<\/td>\n<\/tr>\n<tr>\n<td>tick<\/td>\n<td>tick<\/td>\n<td>集中流动性 AMM 中离散的价格刻度<\/td>\n<\/tr>\n<tr>\n<td>回调校验<\/td>\n<td>Callback Validation<\/td>\n<td>确认回调来自合法合约的检查<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2>8. 思考题<\/h2>\n<ol>\n<li>Fei Rari 的 Fuse 池在 4 月 1 日已经加了重入锁，为什么 4 月 30 日仍被重入？用 <a href=\"#lab-reentrancy-lab\" data-nav=\"lab-reentrancy-lab\" class=\"lab-link\">reentrancy-lab.html<\/a> 的&quot;只给 withdraw 加锁 + 跨函数重入&quot;组合复现这个思路。<\/li>\n<li>Akutars 的 <code>claimProjectFunds<\/code> 只需要改一个变量名就能修复。如果你是审计者，用什么测试能在上线前发现它？<\/li>\n<li>Sushi RouteProcessor2 的回调校验&quot;看起来&quot;做了。请写出一个更强的校验方式，并说明它为什么能挡住恶意池子。<\/li>\n<li>你的协议使用 <code>require(msg.sender == tx.origin)<\/code> 来阻止合约调用。EIP-7702 之后，这个检查还能达到目的吗？<\/li>\n<\/ol>\n<p>下一专题：<a href=\"#k01\" data-nav=\"k01\">C01 BNB Chain<\/a><\/p>\n"}, "k01": {"id": "k01", "file": "chains/C01-bnb-chain.md", "title": "C01 BNB Chain：合约安全专题", "group": "chain", "html": "<h1>C01 BNB Chain：合约安全专题<\/h1>\n<blockquote class=\"\"><p>学习目标：读完本章，你能——<\/p>\n<ol>\n<li>说出 BNB Smart Chain（BSC）与以太坊在共识、出块、代币精度上的 4 项差异，以及它们对合约的影响。<\/li>\n<li>复盘 5 起 BSC 代表性事故的攻击路径和根因代码。<\/li>\n<li>用&quot;迁移检查清单&quot;评估一个以太坊合约能否直接部署到 BSC。<\/li>\n<\/ol>\n<p>前置章节：<a href=\"#c05\" data-nav=\"c05\">05 算术与精度<\/a>、<a href=\"#c06\" data-nav=\"c06\">06 外部调用与代币兼容性<\/a>、<a href=\"#c07\" data-nav=\"c07\">07 预言机与闪电贷<\/a>、<a href=\"#c11\" data-nav=\"c11\">11 跨链桥安全<\/a><br>交互实验：<a href=\"#lab-chain-porting-lab\" data-nav=\"lab-chain-porting-lab\" class=\"lab-link\">chain-porting-lab.html<\/a>、<a href=\"#lab-oracle-manipulation-lab\" data-nav=\"lab-oracle-manipulation-lab\" class=\"lab-link\">oracle-manipulation-lab.html<\/a><\/p>\n<\/blockquote>\n<hr>\n<h2>1. 一句话理解<\/h2>\n<p><strong>BSC 的字节码和以太坊兼容，但&quot;参数&quot;不同：出块更快、代币精度不同、验证者更少、分叉项目更多。漏洞往往藏在&quot;我以为一样&quot;的地方。<\/strong><\/p>\n<blockquote class=\"analogy\"><p>🎯 打个比方：BSC 像一座按照以太坊城市<strong>同一套图纸<\/strong>建造的新城。<\/p>\n<ul>\n<li>街道布局一样（EVM 字节码兼容），所以以太坊的&quot;车&quot;（合约）可以直接开进来。<\/li>\n<li>但红绿灯的节奏快了约 27 倍（出块从 12 秒级到 0.45 秒），按&quot;每个路口等多久&quot;计时的司机会算错时间。<\/li>\n<li>同名的商店卖的东西规格不同（BSC-USD 是 18 位精度，以太坊 USDT 是 6 位）。<\/li>\n<li>城里有很多&quot;山寨店&quot;——照抄名店的装修，却改了几处细节（分叉项目）。<\/li>\n<li>交通管理局人少，出了事能很快封路（验证者可协调暂停链），但封路的权力也集中。<\/li>\n<\/ul>\n<p>比喻的局限：城市可以慢慢改规则。BSC 的参数通过硬分叉一次性改变，所有依赖旧参数的合约同时受到影响。<\/p>\n<\/blockquote>\n<hr>\n<h2>2. 链的安全模型<\/h2>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart TB\n  subgraph Consensus[&quot;共识层：PoSA&quot;]\n    V[&quot;活跃验证者集合&lt;br/&gt;（质押 BNB 选出，轮流出块）&quot;]\n    FF[&quot;快速最终性 Fast Finality&lt;br/&gt;（投票确认）&quot;]\n  end\n  subgraph Exec[&quot;执行层：EVM 兼容&quot;]\n    SC[&quot;系统合约&lt;br/&gt;质押、治理、跨链&quot;]\n    APP[&quot;DeFi 应用&lt;br/&gt;大量分叉自以太坊&quot;]\n  end\n  subgraph Assets[&quot;资产层&quot;]\n    BP[&quot;Binance-Peg 代币&lt;br/&gt;（由币安托管发行的映射资产）&quot;]\n    NAT[&quot;原生 BNB / 原生 BEP-20&quot;]\n  end\n  V --&gt; FF\n  V --&gt; Exec\n  SC --&gt; APP\n  BP --&gt; APP\n  NAT --&gt; APP<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul>\n<li>PoSA（Proof of Staked Authority）：质押权益 + 授权验证者的混合共识。验证者数量远少于以太坊，所以协调速度快。<\/li>\n<li>系统合约由硬分叉升级。2022 年 Token Hub 事故的修复就通过 Moran 硬分叉完成。<\/li>\n<li>Binance-Peg 代币（例如 BSC-USD、BTCB 等）是<strong>托管型映射资产<\/strong>。它们的安全依赖发行方的托管和铸造权限，而不只是合约代码。<\/li>\n<li>局限：图中没有画 opBNB（BSC 的 L2）和 BNB Greenfield。它们有各自的信任假设。<\/li>\n<\/ul>\n<h3>2.1 出块参数的变化（截至 2026 年公开资料）<\/h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>阶段<\/th>\n<th>出块间隔<\/th>\n<th>来源<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>早期<\/td>\n<td>约 3 秒<\/td>\n<td>BNB Chain 官方博客<\/td>\n<\/tr>\n<tr>\n<td>Lorentz 硬分叉（2025 年 4 月）<\/td>\n<td>1.5 秒<\/td>\n<td>BNB Chain 官方文档<\/td>\n<\/tr>\n<tr>\n<td>Maxwell 硬分叉（2025 年 6 月 30 日主网）<\/td>\n<td>0.75 秒；快速最终性约 1.875 秒<\/td>\n<td>BNB Chain 官方博客<\/td>\n<\/tr>\n<tr>\n<td>Fermi 硬分叉（2026 年 1 月 14 日主网）<\/td>\n<td>0.45 秒；快速最终性约 1.125 秒<\/td>\n<td>BNB Chain 官方博客<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>Maxwell 公告明确提醒开发者：&quot;必须更新基于时间的逻辑，以避免竞态或同步问题&quot;。Fermi 硬分叉再次缩短出块间隔，同样的提醒依然适用。<\/p>\n<hr>\n<h2>3. 与以太坊的差异<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>差异<\/th>\n<th>以太坊<\/th>\n<th>BSC<\/th>\n<th>合约风险<\/th>\n<th>对策<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>出块间隔<\/td>\n<td>12 秒<\/td>\n<td>0.45 秒（2026 年 1 月 Fermi 后；历史上多次变化）<\/td>\n<td>用区块数计算的奖励、利息、锁定期，每次硬分叉后速度变为原来的 2 倍到约 6.7 倍<\/td>\n<td>用 <code>block.timestamp<\/code> 计时；或把&quot;每区块&quot;参数做成可治理调整<\/td>\n<\/tr>\n<tr>\n<td>稳定币精度<\/td>\n<td>USDT / USDC 为 6 位<\/td>\n<td>BSC-USD、Binance-Peg USDC 为 18 位<\/td>\n<td>写死 <code>1e6<\/code> 导致金额偏差 10^12 倍<\/td>\n<td>读取 <code>decimals()<\/code><\/td>\n<\/tr>\n<tr>\n<td>资产性质<\/td>\n<td>多数稳定币由发行方原生发行<\/td>\n<td>大量 Binance-Peg 映射资产<\/td>\n<td>映射资产可能被冻结、脱锚或暂停<\/td>\n<td>风险披露；不把映射资产等同于原生资产<\/td>\n<\/tr>\n<tr>\n<td>验证者规模<\/td>\n<td>约百万级验证者<\/td>\n<td>少量活跃验证者<\/td>\n<td>链可被协调暂停；审查风险<\/td>\n<td>重大资产的最终性和审查风险要单独评估<\/td>\n<\/tr>\n<tr>\n<td>生态构成<\/td>\n<td>原创协议多<\/td>\n<td>分叉协议多<\/td>\n<td>分叉时修改的代码未审计<\/td>\n<td>差异审计（diff audit）<\/td>\n<\/tr>\n<tr>\n<td>gas 成本<\/td>\n<td>高<\/td>\n<td>低<\/td>\n<td>攻击者试错成本低；粉尘攻击、垃圾代币多<\/td>\n<td>不依赖&quot;攻击成本高&quot;做防御<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h3>3.1 区块数计时：一个真实的风险<\/h3>\n<p>许多 BSC 农场合约分叉自 SushiSwap 的 MasterChef，按&quot;每区块奖励&quot;发放代币：<\/p>\n<div class=\"code-wrap\"><pre><code class=\"language-solidity\">uint256 public rewardPerBlock = 10e18;   // 设计时假设 3 秒一个块：每天约 28.8 万枚\nfunction pendingReward(address user) public view returns (uint256) {\n    uint256 blocks = block.number - lastRewardBlock;\n    return blocks * rewardPerBlock * userShare / totalShare;\n}\n<\/code><\/pre><\/div>\n<p>出块间隔从 3 秒降到 0.75 秒后，同样的参数每天发放约 115 万枚——<strong>排放速度变为 4 倍<\/strong>。2026 年 1 月 Fermi 硬分叉把间隔再降到 0.45 秒，每天发放约 192 万枚，<strong>排放速度变为约 6.7 倍<\/strong>。如果奖励来自固定预算的国库，国库会提前耗尽；如果奖励是增发，代币通胀率同比例上升。借贷协议中&quot;每区块利率&quot;也有同样问题。<\/p>\n<blockquote class=\"warn\"><p>⚠️ 警告：硬分叉改变出块间隔时，所有依赖 <code>block.number<\/code> 的经济参数都需要同步调整。这不是攻击，但造成的经济损失可能和攻击一样大。<\/p>\n<\/blockquote>\n<hr>\n<h2>4. 案例深潜<\/h2>\n<h3>4.1 Uranium Finance（2021 年 4 月）：分叉改常数<\/h3>\n<ul>\n<li><strong>背景<\/strong>：Uranium 分叉自 Uniswap V2，计划把手续费从 0.3% 改为 0.16%（公开分析报告）。<\/li>\n<li><strong>攻击路径<\/strong>：攻击者在每个交易对中投入极少量代币，调用 <code>swap()<\/code> 取走约 99% 的储备。<\/li>\n<li><strong>根因代码<\/strong>：<\/li>\n<\/ul>\n<div class=\"code-wrap\"><pre><code class=\"language-solidity\">// ❌ 余额调整项放大到 10000，右侧 k 仍按 1000**2 比较\nuint balance0Adjusted = balance0.mul(10000).sub(amount0In.mul(16));\nuint balance1Adjusted = balance1.mul(10000).sub(amount1In.mul(16));\nrequire(balance0Adjusted.mul(balance1Adjusted) &gt;= uint(_reserve0).mul(_reserve1).mul(1000**2), &#39;UraniumSwap: K&#39;);\n// ✅ 右侧应为 .mul(10000**2)\n<\/code><\/pre><\/div>\n<ul>\n<li><strong>损失<\/strong>：约 5,000 万美元。<\/li>\n<li><strong>教训<\/strong>：常数必须集中定义（<code>uint constant FEE_DENOMINATOR = 10000;<\/code>），不能散落在多处。分叉代码的每一处改动都要做差异审计和不变量测试（<code>x × y ≥ k<\/code> 在每次 swap 后成立）。<\/li>\n<\/ul>\n<h3>4.2 PancakeBunny（2021 年 5 月）：LP 定价被操纵<\/h3>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">sequenceDiagram\n  autonumber\n  participant A as 攻击者\n  participant FL as 多个闪电贷来源\n  participant P as PancakeSwap WBNB-USDT 池\n  participant V as Bunny VaultFlipToFlip\n  participant M as BUNNY 铸造器\n  A-&gt;&gt;FL: 借入大量 WBNB 和 USDT\n  A-&gt;&gt;P: 添加少量流动性，获得 LP\n  A-&gt;&gt;P: 用巨额 WBNB 换 USDT，扭曲池子储备\n  A-&gt;&gt;V: getReward()\n  V-&gt;&gt;M: 按（被扭曲的）LP 价值计算奖励\n  M--&gt;&gt;A: 铸造大量 BUNNY\n  A-&gt;&gt;P: 卖出 BUNNY，换回资产\n  A-&gt;&gt;FL: 还款<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul>\n<li>铸造器按池子储备给 LP 和收益估值。储备在同一交易里被改写。<\/li>\n<li>攻击者铸造的 BUNNY 被抛售，BUNNY 价格从约 146 美元跌到约 6 美元（REKT 报道），损失约 4,500 万美元。<\/li>\n<li>审计方事后表示，被利用的是其审计之后上线的新版本。<\/li>\n<li>教训：奖励铸造是&quot;无中生有&quot;的操作，它的输入必须完全抗操纵（<a href=\"#c07\" data-nav=\"c07\">07 章<\/a>）。<\/li>\n<\/ul>\n<h3>4.3 Venus（2021 年 5 月 XVS 事件；2022 年 5 月 LUNA 事件）：抵押品风险<\/h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>XVS 事件<\/th>\n<th>LUNA 事件<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>抵押品<\/td>\n<td>协议自有治理代币 XVS<\/td>\n<td>崩盘中的 LUNA<\/td>\n<\/tr>\n<tr>\n<td>机制<\/td>\n<td>XVS 价格短时间内从约 76 美元涨到约 144 美元，用户借出大量 BTC、ETH；回落后清算不及<\/td>\n<td>喂价触及下限后停在约 0.1 美元，市场价远低于此，有人低价买入 LUNA 抵押借款<\/td>\n<\/tr>\n<tr>\n<td>结果<\/td>\n<td>清算超过 2 亿美元，坏账超过 9,500 万美元<\/td>\n<td>损失约 1,100 万美元<\/td>\n<\/tr>\n<tr>\n<td>教训<\/td>\n<td>低流动性 / 自有代币作抵押要设供应上限<\/td>\n<td>检查预言机上下限；危机时快速暂停该市场<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h3>4.4 Qubit Bridge（2022 年 1 月）：零地址存款<\/h3>\n<p>完整分析见 <a href=\"#c06\" data-nav=\"c06\">06 章<\/a> 2.1 节。BSC 视角的要点：<\/p>\n<ul>\n<li>被利用的漏洞在<strong>以太坊一侧<\/strong>的存款合约，资金损失却发生在<strong>BSC 一侧<\/strong>的借贷池（凭空铸造的 qXETH 被用作抵押）。<\/li>\n<li>跨链协议的风险评估必须覆盖两侧。只审计 BSC 侧代码，看不到这个漏洞。<\/li>\n<\/ul>\n<h3>4.5 BSC Token Hub（2022 年 10 月）：系统级跨链桥<\/h3>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart LR\n  A[&quot;攻击者支付 100 BNB&lt;br/&gt;注册为中继者&quot;] --&gt; B[&quot;伪造跨链包&lt;br/&gt;（区块高度 110217401 的证明）&quot;]\n  B --&gt; C[&quot;IAVL 证明校验缺陷&lt;br/&gt;伪造证明被接受&quot;]\n  C --&gt; D[&quot;铸造 2 × 100 万 BNB&quot;]\n  D --&gt; E[&quot;存入借贷协议作抵押&lt;br/&gt;借出稳定币等资产&quot;]\n  E --&gt; F[&quot;跨链转出约 1 亿多美元&quot;]\n  C --&gt; G[&quot;约 3 小时后验证者暂停 BSC&quot;]\n  G --&gt; H[&quot;Moran 硬分叉：&lt;br/&gt;修复 IAVL 校验、中继者白名单、&lt;br/&gt;区块头顺序检查&quot;]<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul>\n<li>被攻击的不是某个 DeFi 协议，而是<strong>链的系统合约<\/strong>（BSC 与 BNB Beacon Chain 之间的跨链 Token Hub）。<\/li>\n<li>攻击者把凭空铸造的 BNB 存入 BSC 上的借贷协议作抵押，借出其他资产再跨链转走。<strong>系统层的漏洞会传导到应用层<\/strong>：借贷协议代码正确，却接收了&quot;凭空铸造&quot;的抵押品。<\/li>\n<li>停链是一种只有小规模验证者集合才能执行的应急手段。它冻结了大部分资金，也引发了关于去中心化的讨论。<\/li>\n<li>公开资料显示，2024 年完成 BC Fusion 后，BNB Beacon Chain 已退役，Token Hub 这条跨链路径也随之成为历史。但&quot;注册即可成为中继者&quot;和&quot;证明校验缺陷&quot;两类教训仍然适用于所有跨链桥。<\/li>\n<\/ul>\n<hr>\n<h2>5. 分叉项目的权限风险<\/h2>\n<p>BSC 上大量农场和 DEX 分叉自 SushiSwap / PancakeSwap，常见的高危权限：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>函数 / 设计<\/th>\n<th>风险<\/th>\n<th>审计时要问<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>setMigrator()<\/code>（MasterChef 早期版本）<\/td>\n<td>owner 可以把所有用户的 LP 迁移到任意合约<\/td>\n<td>是否删除？是否经过时间锁？<\/td>\n<\/tr>\n<tr>\n<td><code>mint()<\/code> 由 owner 直接调用<\/td>\n<td>无限增发<\/td>\n<td>增发权是否只授予农场合约？<\/td>\n<\/tr>\n<tr>\n<td><code>setRewardPerBlock()<\/code><\/td>\n<td>参数可被瞬间改到极端值<\/td>\n<td>是否有上限和时间锁？<\/td>\n<\/tr>\n<tr>\n<td>可升级 + 单签 owner<\/td>\n<td>随时替换实现<\/td>\n<td>升级权限归属？<\/td>\n<\/tr>\n<tr>\n<td>代币合约带黑名单 / 交易税开关<\/td>\n<td>owner 可阻止卖出（貔貅盘）<\/td>\n<td>税率上限？黑名单是否存在？<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<blockquote class=\"warn\"><p>⚠️ 警告：低 gas 成本让 BSC 上的&quot;垃圾代币&quot;和&quot;貔貅盘&quot;（只能买不能卖的代币）数量很多。协议如果允许任意代币上架或作为抵押品，就要把这类代币当作攻击工具来建模（<a href=\"#c03\" data-nav=\"c03\">03 章<\/a> 5.3 节、<a href=\"#c06\" data-nav=\"c06\">06 章<\/a>）。<\/p>\n<\/blockquote>\n<hr>\n<h2>6. 迁移检查清单：以太坊 → BSC<\/h2>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> 所有代币精度从合约读取；稳定币相关的常数已检查（BSC-USD 为 18 位）。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 所有基于 <code>block.number<\/code> 的时间、奖励、利息计算已改为基于时间戳，或参数可治理调整。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 价格来源：BSC 上的 DEX 池深度是否足够？是否有可用的链下聚合喂价？<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 映射资产（Binance-Peg）的冻结、暂停、脱锚风险已披露。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 分叉代码的所有改动点已做差异审计；修改过的常数已集中定义。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 高危 owner 函数（migrator、mint、参数设置）已删除或置于时间锁之后。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 跨链组件的两侧代码都在审计范围内。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 主网分叉测试已在 BSC 上运行。<\/li>\n<\/ul>\n<p>去 <a href=\"#lab-chain-porting-lab\" data-nav=\"lab-chain-porting-lab\" class=\"lab-link\">chain-porting-lab.html<\/a> 选择 &quot;BNB Chain&quot;，勾选你的代码假设，生成迁移风险清单。<\/p>\n<hr>\n<h2>7. 术语表<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>术语<\/th>\n<th>英文<\/th>\n<th>定义<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>PoSA<\/td>\n<td>Proof of Staked Authority<\/td>\n<td>BSC 使用的质押 + 授权验证者共识<\/td>\n<\/tr>\n<tr>\n<td>快速最终性<\/td>\n<td>Fast Finality<\/td>\n<td>验证者投票使区块在数秒内不可逆<\/td>\n<\/tr>\n<tr>\n<td>映射资产<\/td>\n<td>Pegged Token<\/td>\n<td>由托管方锁定原资产后在本链发行的等值代币<\/td>\n<\/tr>\n<tr>\n<td>硬分叉<\/td>\n<td>Hard Fork<\/td>\n<td>不向后兼容的协议升级，所有节点必须升级<\/td>\n<\/tr>\n<tr>\n<td>差异审计<\/td>\n<td>Diff Audit<\/td>\n<td>只针对相对已审计版本的改动进行审计<\/td>\n<\/tr>\n<tr>\n<td>貔貅盘<\/td>\n<td>Honeypot Token<\/td>\n<td>合约限制卖出、只能买入的代币<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2>8. 思考题<\/h2>\n<ol>\n<li>一个 BSC 借贷协议用&quot;每区块利率&quot;计息，参数在 2024 年设定（当时出块约 3 秒）。Maxwell 和 Fermi 两次硬分叉之后，借款人的实际年化利率变成了原来的几倍？<\/li>\n<li>Token Hub 事故中，借贷协议接收了凭空铸造的 BNB 作为抵押。借贷协议能做什么来降低这类&quot;系统层风险&quot;的传导？<\/li>\n<li>打开 <a href=\"#lab-oracle-manipulation-lab\" data-nav=\"lab-oracle-manipulation-lab\" class=\"lab-link\">oracle-manipulation-lab.html<\/a>，把池子储备调小到 1/10。同样的闪电贷金额，攻击利润如何变化？这对 BSC 上的长尾资产意味着什么？<\/li>\n<\/ol>\n<p>下一专题：<a href=\"#k02\" data-nav=\"k02\">C02 TRON<\/a><\/p>\n"}, "k02": {"id": "k02", "file": "chains/C02-tron.md", "title": "C02 TRON：合约安全专题", "group": "chain", "html": "<h1>C02 TRON：合约安全专题<\/h1>\n<blockquote class=\"\"><p>学习目标：读完本章，你能——<\/p>\n<ol>\n<li>列出 TVM 与 EVM 的 8 项行为差异，并说出每项差异会让哪类以太坊代码出错。<\/li>\n<li>解释 TRON USDT&quot;成功也返回 false&quot;、能量与 CPU 时间限制、TRX 系统转账绕过 fallback 三个高频集成问题。<\/li>\n<li>识别 TRON 账户层的三类常见骗局：权限篡改、授权钓鱼、地址投毒。<\/li>\n<\/ol>\n<p>前置章节：<a href=\"#c02\" data-nav=\"c02\">02 EVM 与 Solidity 安全基础<\/a>、<a href=\"#c04\" data-nav=\"c04\">04 访问控制与权限<\/a>、<a href=\"#c06\" data-nav=\"c06\">06 外部调用与代币兼容性<\/a>、<a href=\"#c08\" data-nav=\"c08\">08 MEV 与签名安全<\/a><br>交互实验：<a href=\"#lab-chain-porting-lab\" data-nav=\"lab-chain-porting-lab\" class=\"lab-link\">chain-porting-lab.html<\/a>、<a href=\"#lab-signature-replay-lab\" data-nav=\"lab-signature-replay-lab\" class=\"lab-link\">signature-replay-lab.html<\/a><\/p>\n<\/blockquote>\n<hr>\n<h2>1. 一句话理解<\/h2>\n<p><strong>TRON 能跑 Solidity，但 TVM 不是 EVM：资源模型、地址、链 ID、部分操作码和最重要的代币（USDT）的行为都不同。把以太坊合约原样搬过来，编译能过，运行会错。<\/strong><\/p>\n<p>TVM（TRON Virtual Machine）：TRON 的合约虚拟机。它兼容大部分 EVM 指令，并增加了 TRON 特有的指令（TRC-10、质押、投票）。<\/p>\n<blockquote class=\"analogy\"><p>🎯 打个比方：TVM 像一台<strong>改装过的同型号汽车<\/strong>。<\/p>\n<ul>\n<li>方向盘、油门、刹车的位置一样（大部分操作码兼容），你上车就能开。<\/li>\n<li>但它不烧汽油，烧&quot;能量&quot;（Energy）。油箱有两个：质押获得的能量和直接燃烧的 TRX。<\/li>\n<li>仪表盘有几块表永远显示 0（<code>DIFFICULTY<\/code>、<code>GASLIMIT<\/code> 返回 0）。<\/li>\n<li>车牌格式不同（地址以 <code>T<\/code> 开头的 Base58，链上带 <code>0x41<\/code> 前缀）。<\/li>\n<li>路上最常见的乘客（USDT）有个怪习惯：下车时明明到了，却说&quot;没到&quot;（<code>transfer<\/code> 返回 <code>false<\/code>）。<\/li>\n<\/ul>\n<p>比喻的局限：改装车的差异写在说明书里。TRON 的部分差异由&quot;硬分叉开关&quot;控制，会随网络提案变化。部署前要查当前状态。<\/p>\n<\/blockquote>\n<hr>\n<h2>2. 链的安全模型<\/h2>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart TB\n  subgraph Consensus[&quot;共识层：DPoS&quot;]\n    SR[&quot;27 个超级代表（Super Representative）&lt;br/&gt;由 TRX 质押投票选出，轮流出块&quot;]\n    PROP[&quot;网络参数提案&lt;br/&gt;（能量价格、TVM 功能开关等）&quot;]\n  end\n  subgraph Resource[&quot;资源层&quot;]\n    BW[&quot;带宽 Bandwidth&lt;br/&gt;交易字节数&quot;]\n    EN[&quot;能量 Energy&lt;br/&gt;合约执行&quot;]\n    STK[&quot;质押 TRX 获得资源&lt;br/&gt;或直接燃烧 TRX&quot;]\n  end\n  subgraph Account[&quot;账户层&quot;]\n    PERM[&quot;多权限：Owner / Active / Witness&lt;br/&gt;阈值 + 权重&quot;]\n  end\n  subgraph Exec[&quot;执行层：TVM&quot;]\n    TVM[&quot;EVM 兼容指令 + TRON 专有指令&lt;br/&gt;单次执行 CPU 时间上限 80 ms&quot;]\n  end\n  SR --&gt; PROP --&gt; TVM\n  STK --&gt; BW &amp; EN\n  EN --&gt; TVM\n  PERM --&gt; Exec<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul>\n<li>出块者是 27 个超级代表。TVM 的很多行为由超级代表投票的&quot;网络参数&quot;决定，而不是写死在代码里。<\/li>\n<li>资源模型决定交易是否能执行完。能量不足或超出 CPU 时间，交易失败但仍上链。<\/li>\n<li>账户层原生支持多权限。&quot;一个地址 = 一把私钥&quot;在 TRON 上不成立。<\/li>\n<li>局限：此图省略了 TRC-10（系统级代币）与 TRC-20（合约代币）的区别，两者在合约中的处理方式完全不同。<\/li>\n<\/ul>\n<hr>\n<h2>3. 与以太坊的差异<\/h2>\n<p>以下内容来自 TRON 官方开发文档&quot;TVM vs EVM&quot;页面（截至 2026 年）。<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>差异<\/th>\n<th>以太坊<\/th>\n<th>TRON<\/th>\n<th>会让什么代码出错<\/th>\n<th>对策<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>计费<\/td>\n<td>gas，EIP-1559 动态费<\/td>\n<td>能量；<code>energyPrice<\/code> 是网络参数（主网 100 sun）；无优先费<\/td>\n<td>依赖 <code>tx.gasprice<\/code> 或 <code>block.basefee<\/code> 的逻辑<\/td>\n<td>不依赖这两个值<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>执行时限<\/td>\n<td>只有 gas 上限<\/td>\n<td>每次执行 80 ms CPU 时间，超时返回 <code>OUT_OF_TIME<\/code><\/td>\n<td>在以太坊 gas 足够的大循环<\/td>\n<td>分批处理；控制单笔计算量<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><code>CHAINID<\/code><\/td>\n<td>小整数（主网 1）<\/td>\n<td>创世区块 ID 后 4 字节（主网 <code>728126428<\/code>）<\/td>\n<td>写死链 ID 的代码；链下签名工具<\/td>\n<td>运行时读取 <code>block.chainid<\/code><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td><code>CREATE2<\/code> 地址<\/td>\n<td><code>keccak256(0xff ++ ...)<\/code><\/td>\n<td><code>keccak256(0x41 ++ ...)<\/code><\/td>\n<td>链下预计算地址、跨链&quot;同地址部署&quot;假设<\/td>\n<td>用 TRON 公式计算<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td><code>CREATE<\/code> 地址<\/td>\n<td>创建者地址 + nonce<\/td>\n<td>创建者地址 + TVM 内部计数器（账户无 nonce）<\/td>\n<td>依据 nonce 预测合约地址<\/td>\n<td>不预测，或改用 CREATE2<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>原生币转账<\/td>\n<td>转给合约一定执行 <code>receive<\/code>/<code>fallback<\/code><\/td>\n<td><code>TransferContract<\/code> 系统转账<strong>不执行<\/strong>合约代码；<code>TriggerSmartContract<\/code> 带 <code>callValue<\/code> 才执行<\/td>\n<td>依赖 <code>receive()<\/code> 记账或拒收<\/td>\n<td>不依赖 <code>receive<\/code> 记账；用内部变量记账<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>返回 0 的操作码<\/td>\n<td>有意义<\/td>\n<td><code>DIFFICULTY<\/code>、<code>GASLIMIT<\/code>、<code>BLOBHASH<\/code>、<code>BLOBBASEFEE<\/code> 返回 0<\/td>\n<td>用它们做随机数或参数<\/td>\n<td>不用<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>功能开关<\/td>\n<td>硬分叉后全网可用<\/td>\n<td><code>CREATE2<\/code>、<code>CHAINID<\/code>、<code>PUSH0<\/code>、<code>TSTORE<\/code> 等由网络参数开关控制，未开启时返回 <code>ILLEGAL_OPERATION<\/code><\/td>\n<td>新版编译器默认生成 <code>PUSH0<\/code> 等新指令<\/td>\n<td>用 TRON 适配的编译器，并设置与网络一致的 <code>evmVersion<\/code><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<blockquote class=\"info\"><p>💡 注意：差异 6 与以太坊上的&quot;强制转入 ETH&quot;（<a href=\"#c02\" data-nav=\"c02\">02 章<\/a> 第 4 节）是同一类问题：合约余额可以在合约代码不知情的情况下增加。任何 <code>require(address(this).balance == 记账值)<\/code> 都会被打破。<\/p>\n<\/blockquote>\n<hr>\n<h2>4. 案例深潜<\/h2>\n<h3>4.1 USDT：成功却返回 false<\/h3>\n<p>OpenZeppelin 在 2026 年对 Across 协议 TRON 部署的审计报告中写明：<\/p>\n<ol>\n<li>TRON 上的 USDT 合约，<code>transfer<\/code> 在成功时<strong>也返回 <code>false<\/code><\/strong>。<\/li>\n<li>使用 <code>SafeERC20.safeTransfer<\/code> 推送 USDT 的代码，在 TRON 上会全部回滚。<\/li>\n<li>修复方案 <code>TronTransferLib<\/code>：调用 <code>transfer<\/code> 后，检查接收方余额是否增加了对应金额。<\/li>\n<li><code>transferFrom<\/code> 和 <code>approve<\/code> 行为标准，拉取方向不需要改。<\/li>\n<li>修复方案假设 USDT 没有开启转账手续费。Tether 在 TRON 上保留了开启手续费、黑名单和暂停的能力。<\/li>\n<li>TRON 专用合约要用单独的构建配置部署。<strong>合约本身不检查自己部署在哪条链上<\/strong>，部署工具选错产物，问题就会回来。<\/li>\n<\/ol>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart LR\n  A[&quot;以太坊审计过的金库&quot;] --&gt; B[&quot;原样部署到 TRON&quot;]\n  B --&gt; C[&quot;存款：transferFrom ✅&quot;]\n  B --&gt; D[&quot;提款：safeTransfer&quot;]\n  D --&gt; E[&quot;USDT 转账成功&lt;br/&gt;返回 false&quot;]\n  E --&gt; F[&quot;SafeERC20 判定失败 → 回滚&quot;]\n  F --&gt; G[&quot;用户资金只进不出&quot;]<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul>\n<li>这个问题不会让资金被盗，但会让资金<strong>被锁<\/strong>。如果合约不可升级，资金可能永久无法取出。<\/li>\n<li>单元测试用的是模拟 USDT，测不出这个问题。必须在 TRON 测试网上用真实的 USDT 合约测试。<\/li>\n<li>示例代码见 <a href=\"#examples\" data-nav=\"examples\">examples/05-SafeTokenOps.sol<\/a>。<\/li>\n<\/ul>\n<h3>4.2 能量、CPU 时间与&quot;失败但上链&quot;的交易<\/h3>\n<p>TRON 交易执行失败时，交易<strong>仍然上链<\/strong>，有交易哈希，扣除已消耗的资源。常见失败原因：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>结果<\/th>\n<th>原因<\/th>\n<th>对用户 / 集成方的影响<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>OUT_OF_ENERGY<\/code><\/td>\n<td>能量和 <code>fee_limit<\/code> 不足以支付执行<\/td>\n<td>转账未发生；资源已扣<\/td>\n<\/tr>\n<tr>\n<td><code>OUT_OF_TIME<\/code><\/td>\n<td>超过 80 ms CPU 时间<\/td>\n<td>同上<\/td>\n<\/tr>\n<tr>\n<td><code>REVERT<\/code><\/td>\n<td>合约 <code>require<\/code> 失败（例如余额不足、地址被 Tether 冻结）<\/td>\n<td>同上<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<blockquote class=\"warn\"><p>⚠️ 警告：交易所、支付网关、跨链桥在 TRON 上确认充值时，必须检查交易回执的执行结果为成功，并检查 <code>Transfer<\/code> 事件来自<strong>正确的代币合约地址<\/strong>。只检查&quot;交易存在&quot;或&quot;交易里有转账调用&quot;，就会把失败的交易记为到账（&quot;假充值&quot;）。公开报道中有用户遇到&quot;FAILED – TRANSACTION REVERT&quot;的 USDT 转账，被交易所错误标记为成功的情况，专家建议交易所核对链上结果（MEXC 新闻引述）。<\/p>\n<\/blockquote>\n<h3>4.3 TRX 系统转账绕过合约代码<\/h3>\n<div class=\"code-wrap\"><pre><code class=\"language-solidity\">// ❌ 在 TRON 上不可靠：以为所有入账都会经过 receive()\nuint256 public totalReceived;\nreceive() external payable { totalReceived += msg.value; }\nfunction check() external view { require(address(this).balance == totalReceived); }\n<\/code><\/pre><\/div>\n<p>任何人用 <code>TransferContract<\/code>（普通 TRX 转账）向这个合约转 1 sun，<code>receive()<\/code> 不执行，<code>check()<\/code> 从此永远失败。如果某个关键函数依赖这个等式，就构成 DoS（<a href=\"#c06\" data-nav=\"c06\">06 章<\/a> 第 4 节）。<\/p>\n<h3>4.4 账户权限篡改（&quot;多签诈骗&quot;）<\/h3>\n<p>完整机制见 <a href=\"#c04\" data-nav=\"c04\">04 章<\/a> 第 5 节。要点：<\/p>\n<ol>\n<li>攻击者拿到私钥后，<strong>不立即转走资产<\/strong>，而是把账户的 Owner / Active 权限改成自己控制的地址。<\/li>\n<li>受害者仍然能看到余额，但转账需要攻击者签名。<\/li>\n<li>新转入的 USDT 不需要签名就能到账。攻击者等余额变大后一次转走。<\/li>\n<li>变种：&quot;OTC 骗局&quot;——骗子提供一个&quot;有大额 USDT 但转不出来&quot;的私钥，诱导对方打 TRX &quot;解锁&quot;。<\/li>\n<\/ol>\n<p>对开发者的启示：<\/p>\n<ul>\n<li>钱包和交易所应在 UI 中显示账户权限配置；权限变化时告警。<\/li>\n<li>收到一个 TRON 地址作为合约特权角色时，确认它的权限配置。<\/li>\n<\/ul>\n<h3>4.5 授权钓鱼与地址投毒<\/h3>\n<p>TRON 是 USDT 转账最活跃的网络之一，也是骗局最集中的网络之一（多家钱包安全月报）：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>骗局<\/th>\n<th>机制<\/th>\n<th>防御<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>授权钓鱼<\/td>\n<td>诱导用户对攻击者地址 <code>approve<\/code> 大额 USDT<\/td>\n<td>钱包清晰显示授权对象和金额；定期撤销授权<\/td>\n<\/tr>\n<tr>\n<td>地址投毒<\/td>\n<td>攻击者生成首尾字符与受害者常用地址相同的地址，发送 0 金额或小额转账，污染交易记录；受害者下次从记录中复制错误地址<\/td>\n<td>核对完整地址；使用地址簿；钱包隐藏零金额转账<\/td>\n<\/tr>\n<tr>\n<td>假 USDT<\/td>\n<td>部署名为 &quot;USDT&quot;、符号相同的假代币，发送给受害者<\/td>\n<td>以合约地址识别代币，不以名称识别<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h3>4.6 签名与链 ID<\/h3>\n<ul>\n<li>EIP-712 的域分隔符包含 <code>chainId<\/code>。在 TRON 上，<code>block.chainid<\/code> 返回 <code>728126428<\/code>（主网，开关开启时）。链下签名工具必须使用相同的值。<\/li>\n<li>TRON 账户没有 nonce，交易层靠 TAPOS 和 60 秒过期防重放。<strong>合约层的签名防重放仍然要自己维护 nonce<\/strong>（<a href=\"#c08\" data-nav=\"c08\">08 章<\/a>）。<\/li>\n<li>地址在 VM 内部是 20 字节，链边界加 <code>0x41<\/code> 前缀。签名消息中的地址编码要和合约中的 <code>abi.encode(address)<\/code> 一致。<\/li>\n<li>TRON 提供 <code>ValidateMultiSign<\/code> 预编译合约（地址 <code>0x0a<\/code>），可在合约中验证账户多签。<\/li>\n<\/ul>\n<hr>\n<h2>5. 迁移检查清单：以太坊 → TRON<\/h2>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> 用 TRON 适配的编译器构建；<code>evmVersion<\/code> 与当前网络开启的 TVM 功能一致（检查 <code>PUSH0<\/code>、<code>TSTORE<\/code>、<code>MCOPY<\/code> 等）。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 所有 USDT 推送转账改为余额差校验；拉取转账保留 <code>SafeERC20<\/code>。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 明确 USDT 手续费被开启时的行为（回滚还是按实收记账）。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 单笔交易计算量受控，不会超过 80 ms CPU 时间；大循环已分批。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 不依赖 <code>receive()<\/code> 记录 TRX 入账；不依赖 <code>address(this).balance<\/code> 等式。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 不依赖 <code>DIFFICULTY<\/code>、<code>GASLIMIT<\/code>、<code>tx.gasprice<\/code>、<code>block.basefee<\/code>。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 链 ID 运行时读取；链下签名工具使用 TRON 链 ID。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> <code>CREATE<\/code> / <code>CREATE2<\/code> 地址按 TRON 公式计算；不假设与以太坊同地址。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 特权地址的 TRON 账户权限配置已核查。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 在 Nile / Shasta 测试网上，用真实 USDT 合约跑完整的存取流程。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 集成方（交易所、网关）确认充值时检查执行结果和代币合约地址。<\/li>\n<\/ul>\n<p>去 <a href=\"#lab-chain-porting-lab\" data-nav=\"lab-chain-porting-lab\" class=\"lab-link\">chain-porting-lab.html<\/a> 选择 &quot;TRON&quot;，勾选你的代码假设，生成迁移风险清单。<\/p>\n<hr>\n<h2>6. 术语表<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>术语<\/th>\n<th>英文<\/th>\n<th>定义<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>TVM<\/td>\n<td>TRON Virtual Machine<\/td>\n<td>TRON 的合约虚拟机，兼容大部分 EVM 指令<\/td>\n<\/tr>\n<tr>\n<td>能量<\/td>\n<td>Energy<\/td>\n<td>TRON 合约执行消耗的资源，类似 gas<\/td>\n<\/tr>\n<tr>\n<td>带宽<\/td>\n<td>Bandwidth<\/td>\n<td>TRON 交易按字节消耗的资源<\/td>\n<\/tr>\n<tr>\n<td>sun<\/td>\n<td>sun<\/td>\n<td>TRX 的最小单位，1 TRX = 10^6 sun<\/td>\n<\/tr>\n<tr>\n<td>超级代表<\/td>\n<td>Super Representative (SR)<\/td>\n<td>由投票选出、负责出块的 27 个节点<\/td>\n<\/tr>\n<tr>\n<td>TAPOS<\/td>\n<td>Transaction as Proof of Stake<\/td>\n<td>交易引用近期区块以防重放的机制<\/td>\n<\/tr>\n<tr>\n<td>TRC-10<\/td>\n<td>TRC-10<\/td>\n<td>TRON 系统级代币标准，不依赖合约<\/td>\n<\/tr>\n<tr>\n<td>TRC-20<\/td>\n<td>TRC-20<\/td>\n<td>TRON 上与 ERC-20 兼容的合约代币标准<\/td>\n<\/tr>\n<tr>\n<td>地址投毒<\/td>\n<td>Address Poisoning<\/td>\n<td>用相似地址污染交易记录，诱导转错地址<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2>7. 思考题<\/h2>\n<ol>\n<li>一个以太坊上的金库合约部署到 TRON 后，存款正常，提款全部失败。请写出排查步骤，并给出修复方案。<\/li>\n<li>如果 Tether 在 TRON 上开启了 0.1% 的 USDT 转账手续费，4.1 节的 <code>TronTransferLib<\/code> 方案会出现什么问题？你会怎样调整？<\/li>\n<li>打开 <a href=\"#lab-signature-replay-lab\" data-nav=\"lab-signature-replay-lab\" class=\"lab-link\">signature-replay-lab.html<\/a>，选择目标链 TRON。为什么去掉 <code>chainId<\/code> 字段后，&quot;分叉链重放&quot;仍然可能成功？<\/li>\n<\/ol>\n<p>下一专题：<a href=\"#k03\" data-nav=\"k03\">C03 Mantle<\/a><\/p>\n"}, "k03": {"id": "k03", "file": "chains/C03-mantle.md", "title": "C03 Mantle：合约安全专题（以太坊 L2 视角）", "group": "chain", "html": "<h1>C03 Mantle：合约安全专题（以太坊 L2 视角）<\/h1>\n<blockquote class=\"\"><p>学习目标：读完本章，你能——<\/p>\n<ol>\n<li>说出 Mantle 作为以太坊 L2 的信任假设：排序器、证明系统、升级多签、提款路径。<\/li>\n<li>解释&quot;原生 gas 代币是 MNT、ETH 是 ERC-20&quot;对合约代码的 4 个影响。<\/li>\n<li>从 mETH 追回 cmETH 的案例中，总结&quot;延迟 + 暂停&quot;作为安全参数的设计方法。<\/li>\n<\/ol>\n<p>前置章节：<a href=\"#c07\" data-nav=\"c07\">07 预言机与闪电贷<\/a>、<a href=\"#c09\" data-nav=\"c09\">09 可升级合约与代理<\/a>、<a href=\"#c11\" data-nav=\"c11\">11 跨链桥安全<\/a><br>交互实验：<a href=\"#lab-chain-porting-lab\" data-nav=\"lab-chain-porting-lab\" class=\"lab-link\">chain-porting-lab.html<\/a><\/p>\n<\/blockquote>\n<hr>\n<h2>1. 一句话理解<\/h2>\n<p><strong>Mantle 是建在以太坊上的 L2。合约代码和以太坊几乎一样，但两件事不同：第一，&quot;原生币&quot;是 MNT 而不是 ETH；第二，你的资产安全不只取决于以太坊，还取决于 L2 的排序器、证明系统和升级多签。<\/strong><\/p>\n<p>L2（Layer 2）：在以太坊之外执行交易、把交易数据和状态证明提交回以太坊的扩容网络。<\/p>\n<blockquote class=\"analogy\"><p>🎯 打个比方：Mantle 像以太坊城旁边的一座<strong>卫星城<\/strong>。<\/p>\n<ul>\n<li>卫星城有自己的交通调度中心（排序器），调度很快，但只有一个调度员。<\/li>\n<li>卫星城每隔一段时间把账本送回以太坊城公证（状态根 + 证明）。<\/li>\n<li>卫星城的通用货币是 MNT。你从以太坊城带来的 ETH，在这里被换成一种&quot;ETH 兑换券&quot;（ERC-20 形式的 ETH）。<\/li>\n<li>卫星城的城市规划可以由 14 人委员会中的 6 人签字修改，而且<strong>立即生效<\/strong>（L2BEAT 截至 2026 年页面）。<\/li>\n<\/ul>\n<p>比喻的局限：卫星城出问题时，居民可以通过以太坊城的&quot;紧急通道&quot;把交易强制送进卫星城（强制包含），但可能要等 12 小时。<\/p>\n<\/blockquote>\n<hr>\n<h2>2. 链的安全模型<\/h2>\n<p>以下信息来自 L2BEAT 的 Mantle 项目页（截至 2026 年）。L2 架构变化快，部署前请以最新页面为准。<\/p>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart TB\n  subgraph L2[&quot;Mantle（L2）&quot;]\n    U[&quot;用户交易&quot;] --&gt; SEQ[&quot;中心化排序器&lt;br/&gt;（唯一能出块的运营者）&quot;]\n    SEQ --&gt; EX[&quot;执行：EVM（op-geth 分叉）&lt;br/&gt;原生 gas 代币 MNT&quot;]\n  end\n  subgraph L1[&quot;以太坊（L1）&quot;]\n    DA[&quot;交易数据：以太坊 blob&quot;]\n    OO[&quot;输出预言机&lt;br/&gt;（白名单提议者提交状态根）&quot;]\n    VER[&quot;SP1 验证器网关&lt;br/&gt;（OP Succinct 有效性证明）&quot;]\n    BR[&quot;桥 / 门户合约&lt;br/&gt;（持有 L1 上的跨链资产）&quot;]\n  end\n  EX --&gt; DA\n  EX --&gt; OO\n  OO --&gt; VER\n  BR --&gt; OO\n  SM[&quot;安全多签 6/14&lt;br/&gt;可无延迟升级桥、预言机、门户&quot;] -.-&gt; BR &amp; OO\n  EM[&quot;工程多签 3/7&lt;br/&gt;挑战者 + 守护者&lt;br/&gt;可暂停提款、切换乐观模式&quot;] -.-&gt; OO &amp; BR\n  U -. &quot;排序器失效时：&lt;br/&gt;经 L1 强制提交（最长 12 小时）&quot; .-&gt; BR<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul>\n<li><strong>证明系统<\/strong>：L2BEAT 将 Mantle 归类为 ZK Rollup，使用 OP Succinct（SP1）有效性证明。工程多签可以把它切换到&quot;乐观模式&quot;——此时不需要证明，安全依赖挑战者在终结期内挑战错误状态根。<\/li>\n<li><strong>数据可用性<\/strong>：L2BEAT 记录，2026 年 4 月 16 日的 Arsia 升级移除了 EigenDA 路径，交易数据只发布到以太坊 blob。<\/li>\n<li><strong>升级权限<\/strong>：安全多签（6/14）可以无延迟升级 L1 上持有资产的合约。L2BEAT 把&quot;无升级延迟、无退出窗口&quot;标为关键风险，并将 Mantle 评为 Stage 0。<\/li>\n<li><strong>排序与提款<\/strong>：排序器是单一运营者。排序器停止出块，或白名单提议者停止提交状态根，提款都会被冻结。<\/li>\n<li>局限：图中没有画 MNT 代币本身的权限。L2BEAT 记录，L1 上的 MNT 合约允许安全多签每年增发不超过总量 2% 的 MNT。<\/li>\n<\/ul>\n<h3>2.1 Mantle 的架构演进（公开资料）<\/h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>阶段<\/th>\n<th>执行<\/th>\n<th>数据可用性<\/th>\n<th>证明<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Mantle V1<\/td>\n<td>OVM<\/td>\n<td>Mantle DA<\/td>\n<td>乐观<\/td>\n<\/tr>\n<tr>\n<td>Mantle V2<\/td>\n<td>OP Stack Bedrock（op-geth 分叉）<\/td>\n<td>Mantle DA → EigenDA<\/td>\n<td>乐观（欺诈证明）<\/td>\n<\/tr>\n<tr>\n<td>2025 年起<\/td>\n<td>同上<\/td>\n<td>EigenDA → 2026 年 Arsia 升级后改为以太坊 blob<\/td>\n<td>OP Succinct 有效性证明（可切换乐观模式）<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<blockquote class=\"info\"><p>💡 注意：架构每变一次，信任假设就变一次。协议的风险披露文档要写明&quot;基于哪个时间点的 L2 架构&quot;。<\/p>\n<\/blockquote>\n<hr>\n<h2>3. 与以太坊的差异<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>差异<\/th>\n<th>以太坊<\/th>\n<th>Mantle<\/th>\n<th>会让什么代码出错<\/th>\n<th>对策<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>原生币<\/td>\n<td>ETH<\/td>\n<td><strong>MNT<\/strong><\/td>\n<td><code>msg.value<\/code>、<code>address(this).balance<\/code>、<code>payable<\/code> 函数的单位全部是 MNT。以 ETH 计价的逻辑会差一个汇率<\/td>\n<td>明确每个 <code>payable<\/code> 入口收的是什么；价格换算使用 MNT/USD 喂价<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>ETH 的形态<\/td>\n<td>原生币<\/td>\n<td>ERC-20 形式（OpenZeppelin 审计报告中称为 BVM_ETH）<\/td>\n<td>以为&quot;ETH 可以用 <code>call{value:}<\/code> 发送&quot;的代码；WETH 包装逻辑<\/td>\n<td>ETH 当作 ERC-20 处理；用 <code>SafeERC20<\/code><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>回调入口<\/td>\n<td>转 ETH 触发 <code>receive<\/code><\/td>\n<td>转 MNT 触发 <code>receive<\/code>；转 ETH（ERC-20）不触发<\/td>\n<td>重入分析和&quot;接收通知&quot;逻辑<\/td>\n<td>按实际资产重新做重入分析（<a href=\"#c03\" data-nav=\"c03\">03 章<\/a>）<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>交易费<\/td>\n<td>L1 gas<\/td>\n<td>L2 执行费（MNT）+ L1 数据费（以 ETH 计价，通过 <code>tokenRatio<\/code> 换算成 MNT）<\/td>\n<td>gas 估算：<code>tokenRatio<\/code> 变化时，同一交易需要的 gas 会变；OpenZeppelin 审计指出 L2 上可能出现 L1 上不会出现的 out-of-gas<\/td>\n<td>留出 gas 余量；关键操作不依赖精确 gas 预算<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>交易顺序<\/td>\n<td>公开内存池 + 构建者市场<\/td>\n<td>单一排序器<\/td>\n<td>MEV 和审查风险集中在运营者<\/td>\n<td>披露排序器信任假设<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>排序器宕机<\/td>\n<td>不适用<\/td>\n<td>价格停止更新、清算停止；经 L1 强制提交最长约 12 小时<\/td>\n<td>借贷、永续合约的清算和预言机逻辑<\/td>\n<td>读取排序器在线状态；恢复后宽限期（<a href=\"#c07\" data-nav=\"c07\">07 章<\/a> 5.1 节）<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>L1 → L2 消息<\/td>\n<td>不适用<\/td>\n<td>通过门户和跨域信使传递；OP Stack 系 L2 对来自 L1 合约的调用做地址别名（aliasing）<\/td>\n<td>在 L2 上用 <code>msg.sender == L1合约地址<\/code> 鉴权会失败<\/td>\n<td>通过跨域信使获取原始发送者，并校验信使地址<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>提款<\/td>\n<td>不适用<\/td>\n<td>需要状态根被提交和（在乐观模式下）终结；可被工程多签暂停<\/td>\n<td>依赖&quot;提款一定能及时完成&quot;的协议<\/td>\n<td>设计流动性缓冲；披露提款可被暂停<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<blockquote class=\"warn\"><p>⚠️ 警告：差异 1 和 2 是最常见的移植错误。一个以太坊上的&quot;用 ETH 支付手续费&quot;合约，部署到 Mantle 后，用户支付的是 MNT。如果合约把 <code>msg.value<\/code> 当作 ETH 数量去计算美元价值，价格会错一个 ETH/MNT 汇率倍数。<\/p>\n<\/blockquote>\n<hr>\n<h2>4. 案例深潜<\/h2>\n<h3>4.1 防御成功：mETH 协议追回 cmETH（2025 年 2 月）<\/h3>\n<p><strong>背景<\/strong>：mETH Protocol 是 Mantle 生态的流动性（再）质押协议。用户质押 ETH 获得 mETH，进一步获得重质押凭证 cmETH。cmETH 赎回有 8 小时延迟。<\/p>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">sequenceDiagram\n  autonumber\n  participant H as 攻击者（Bybit 被盗资金）\n  participant C as cmETH 合约\n  participant SEAL as 安全响应社区（SEAL）\n  participant T as mETH / Mantle 团队\n  H-&gt;&gt;C: 发起 cmETH 赎回\n  Note over C: 进入 8 小时提款延迟\n  SEAL-&gt;&gt;T: 外部安全人员发现并通知\n  T-&gt;&gt;C: 暂停合约\n  T-&gt;&gt;C: 将 15,000 cmETH 从攻击者地址转到恢复地址\n  Note over T: 追回约 4,300 万美元（The Block 报道）<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul>\n<li>三个条件缺一不可：协议有提款延迟、团队有暂停和资产恢复权限、外部安全社区能在数小时内联系到团队。<\/li>\n<li>同一起事件中，Bybit 被盗的大部分 ETH 无法追回。区别在于：原生 ETH 没有延迟，cmETH 有。<\/li>\n<li>这个案例也有另一面：<strong>团队能把攻击者地址上的代币转走<\/strong>，意味着团队也有能力转走任何用户的代币。这是一个需要向用户披露的中心化权限。<\/li>\n<\/ul>\n<blockquote class=\"info\"><p>💡 注意：延迟和暂停是&quot;可信中心化&quot;的工具。它们在本案例中保护了资金，也意味着用户必须信任持有这些权限的人。设计时要回答：谁持有权限？有没有时间锁？权限被滥用时用户能否察觉？<\/p>\n<\/blockquote>\n<p>公开报道还显示，事件发生后，市场担心风险传导，MNT 在数小时内下跌超过 10%（Yellow 报道）。<strong>生态代币的价格风险<\/strong>会影响以 MNT 作抵押品的借贷协议。<\/p>\n<h3>4.2 客户端层的漏洞：op-geth 审计（2024 年 4 月）<\/h3>\n<p>L2 的执行客户端本身就是&quot;合约&quot;的一部分——它决定了 EVM 规则怎样在这条链上运行。OpenZeppelin 对 Mantle op-geth 修改部分的审计，报告了 3 个严重问题（均已修复）：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>问题<\/th>\n<th>机制<\/th>\n<th>如果未修复<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>BVM_ETH 无限铸造<\/td>\n<td>ETH 转账缺少溢出检查，负的 <code>big.Int<\/code> 被当作正数写入<\/td>\n<td>只存入 100 ETH，可以获得 200 ETH<\/td>\n<\/tr>\n<tr>\n<td>交易成本计算遗漏 <code>Value<\/code><\/td>\n<td>复制粘贴错误使交易池接受付不起的交易<\/td>\n<td>交易池被垃圾交易填满（DoS）<\/td>\n<\/tr>\n<tr>\n<td>代付余额检查<\/td>\n<td>对多笔代付交易逐笔检查余额，而不是检查总额<\/td>\n<td>无法支付的交易填满交易池<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>教训<\/strong>：<\/p>\n<ol>\n<li>在 L2 上，合约的可信计算基础（TCB）包括 L2 客户端、证明系统和桥合约。合约审计覆盖不到这些。<\/li>\n<li>&quot;原生 gas 代币不是 ETH&quot;这个设计，迫使客户端增加了大量新代码（ETH 作为 ERC-20 的转账逻辑、<code>tokenRatio<\/code> 换算）。新代码 = 新攻击面。<\/li>\n<\/ol>\n<h3>4.3 信任假设也是&quot;案例&quot;：L2BEAT 风险清单<\/h3>\n<p>L2BEAT 页面列出的 Mantle 风险（截至 2026 年），可以直接转化为协议的风险披露：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>L2BEAT 风险<\/th>\n<th>对 Mantle 上协议的含义<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>无升级延迟时，恶意升级可盗取资金<\/td>\n<td>协议在 L1 桥上的资产，安全上限是 6/14 安全多签<\/td>\n<\/tr>\n<tr>\n<td>非乐观模式下，证明密码学被破解或实现错误可盗取资金<\/td>\n<td>证明系统是 TCB 的一部分<\/td>\n<\/tr>\n<tr>\n<td>乐观模式下，无人检查状态时可盗取资金<\/td>\n<td>模式切换会改变信任假设<\/td>\n<\/tr>\n<tr>\n<td>提议者可通过不安全的验证器路由 ID 绕过验证<\/td>\n<td>验证器网关配置是攻击面<\/td>\n<\/tr>\n<tr>\n<td>中心化验证者 / 排序器宕机时，资金冻结<\/td>\n<td>协议需要考虑长时间无法出块<\/td>\n<\/tr>\n<tr>\n<td>运营者可抢跑用户交易<\/td>\n<td>MEV 风险集中在运营者<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<blockquote class=\"info\"><p>💡 注意：L2BEAT 也提醒，Stage 评级不代表项目的整体安全性。把这些风险写进文档，是让用户在知情的前提下做选择。<\/p>\n<\/blockquote>\n<hr>\n<h2>5. 设计模式：把&quot;延迟 + 暂停&quot;做对<\/h2>\n<p>从 mETH 案例提炼出可复用的设计：<\/p>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">stateDiagram-v2\n  [*] --&gt; Requested: 用户发起赎回\n  Requested --&gt; Claimable: 延迟期满（示例 8 小时）\n  Requested --&gt; Frozen: 守护者暂停 / 标记可疑\n  Frozen --&gt; Requested: 复核通过，恢复\n  Frozen --&gt; Recovered: 治理 + 时间锁批准，资产转入恢复地址\n  Claimable --&gt; Claimed: 用户领取\n  Claimed --&gt; [*]\n  Recovered --&gt; [*]<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul>\n<li>延迟期内，资产仍在协议控制下。暂停只阻止状态推进，不转移资产。<\/li>\n<li>&quot;Recovered&quot;路径是最敏感的权限。它应该需要比&quot;暂停&quot;更高的门槛（更多签名、时间锁、公开公告）。<\/li>\n<li>局限：延迟会降低资本效率。业界常见的折中是：小额即时赎回 + 大额排队赎回，或按全局速率限制赎回。<\/li>\n<\/ul>\n<hr>\n<h2>6. 迁移检查清单：以太坊 → Mantle<\/h2>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> 所有 <code>payable<\/code> 函数、<code>msg.value<\/code>、<code>address(this).balance<\/code> 的单位已确认为 MNT。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> ETH 相关逻辑改为 ERC-20 处理；不使用 <code>call{value:}<\/code> 发送 ETH。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 重入分析已按&quot;MNT 触发回调、ETH 不触发&quot;重做。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 价格计算区分 ETH 与 MNT；MNT 价格来源可靠。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 预言机读取包含排序器在线状态检查（如果该 L2 上提供相应喂价）。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 清算、利息、时间锁逻辑能承受最长 12 小时级别的出块中断。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> L1 ↔ L2 消息通过官方跨域信使收发，并校验原始发送者。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> gas 估算有足够余量，能承受 <code>tokenRatio<\/code> 变化。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 风险披露写明：L2 升级权限、证明模式、排序器、提款可暂停。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 协议自身的暂停 / 恢复权限有分级、有时间锁、已披露。<\/li>\n<\/ul>\n<p>去 <a href=\"#lab-chain-porting-lab\" data-nav=\"lab-chain-porting-lab\" class=\"lab-link\">chain-porting-lab.html<\/a> 选择 &quot;Mantle&quot;，勾选你的代码假设，生成迁移风险清单。<\/p>\n<hr>\n<h2>7. 三条链对比小结<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>维度<\/th>\n<th>BNB Chain<\/th>\n<th>TRON<\/th>\n<th>Mantle<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>类型<\/td>\n<td>独立 L1，PoSA<\/td>\n<td>独立 L1，DPoS<\/td>\n<td>以太坊 L2<\/td>\n<\/tr>\n<tr>\n<td>虚拟机<\/td>\n<td>EVM<\/td>\n<td>TVM（EVM 变体）<\/td>\n<td>EVM（op-geth 分叉）<\/td>\n<\/tr>\n<tr>\n<td>原生币<\/td>\n<td>BNB<\/td>\n<td>TRX<\/td>\n<td>MNT（ETH 为 ERC-20）<\/td>\n<\/tr>\n<tr>\n<td>最大的移植陷阱<\/td>\n<td>代币精度、区块数计时、分叉改动<\/td>\n<td>USDT 返回值、资源模型、操作码开关<\/td>\n<td><code>msg.value<\/code> 单位、ETH 形态、L2 信任假设<\/td>\n<\/tr>\n<tr>\n<td>代表性事故 / 案例<\/td>\n<td>Token Hub、Uranium、PancakeBunny、Venus<\/td>\n<td>账户权限诈骗、USDT 兼容、假充值<\/td>\n<td>op-geth 审计、mETH 追回<\/td>\n<\/tr>\n<tr>\n<td>应急能力<\/td>\n<td>验证者可协调停链<\/td>\n<td>超级代表提案<\/td>\n<td>多签可暂停提款、无延迟升级<\/td>\n<\/tr>\n<tr>\n<td>本手册专题<\/td>\n<td><a href=\"#k01\" data-nav=\"k01\">C01<\/a><\/td>\n<td><a href=\"#k02\" data-nav=\"k02\">C02<\/a><\/td>\n<td>本章<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2>8. 术语表<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>术语<\/th>\n<th>英文<\/th>\n<th>定义<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>二层网络<\/td>\n<td>L2, Layer 2<\/td>\n<td>把交易数据和证明提交到 L1 的扩容网络<\/td>\n<\/tr>\n<tr>\n<td>排序器<\/td>\n<td>Sequencer<\/td>\n<td>L2 上负责排序和出块的节点<\/td>\n<\/tr>\n<tr>\n<td>强制包含<\/td>\n<td>Forced Inclusion<\/td>\n<td>用户绕过排序器、通过 L1 把交易送入 L2<\/td>\n<\/tr>\n<tr>\n<td>状态根<\/td>\n<td>State Root<\/td>\n<td>某一时刻 L2 全部状态的哈希承诺<\/td>\n<\/tr>\n<tr>\n<td>有效性证明<\/td>\n<td>Validity Proof<\/td>\n<td>证明状态转换正确的零知识证明<\/td>\n<\/tr>\n<tr>\n<td>数据可用性<\/td>\n<td>DA, Data Availability<\/td>\n<td>交易数据被公开发布、可被任何人下载<\/td>\n<\/tr>\n<tr>\n<td>地址别名<\/td>\n<td>Address Aliasing<\/td>\n<td>L1 合约调用 L2 时，L2 上看到的发送者地址被加上固定偏移<\/td>\n<\/tr>\n<tr>\n<td>可信计算基础<\/td>\n<td>TCB<\/td>\n<td>系统安全所依赖的全部组件<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2>9. 思考题<\/h2>\n<ol>\n<li>一个在以太坊上运行的 NFT 市场，按 <code>msg.value<\/code> 收取 0.01 ETH 的铸造费。原样部署到 Mantle 后，用户实际支付的是什么？价值是多少？<\/li>\n<li>mETH 团队能把攻击者地址上的 cmETH 转走。从普通用户的角度，你希望这个权限受到哪些限制？<\/li>\n<li>如果 Mantle 的工程多签把输出预言机切换到乐观模式，你的协议的信任假设发生了什么变化？你会在文档里怎样写？<\/li>\n<\/ol>\n<p>返回：<a href=\"#home\" data-nav=\"home\">README 学习目录<\/a><\/p>\n"}, "a01": {"id": "a01", "file": "assessment/A01-methodology.md", "title": "A01 安全评估方法论：从接单到签字", "group": "asm", "html": "<h1>A01 安全评估方法论：从接单到签字<\/h1>\n<blockquote class=\"\"><p>学习目标：读完本章，你能——<\/p>\n<ol>\n<li>按 7 个阶段组织一次完整的安全评估，并说出每个阶段的输入、输出和退出条件。<\/li>\n<li>区分三类评估对象（交易所自有合约与钱包、DeFi 协议、上币与合作项目）在深度、时长和交付物上的差异。<\/li>\n<li>估算一次评估需要的人力和时间，并识别&quot;范围不清&quot;的早期信号。<\/li>\n<\/ol>\n<p>前置章节：<a href=\"#c01\" data-nav=\"c01\">01 安全全景<\/a>、<a href=\"#c12\" data-nav=\"c12\">12 审计与开发流程<\/a><br>模板：<a href=\"#t01\" data-nav=\"t01\">T01 资料清单<\/a>、<a href=\"#t02\" data-nav=\"t02\">T02 威胁模型<\/a>、<a href=\"#t04\" data-nav=\"t04\">T04 上线门禁<\/a><\/p>\n<\/blockquote>\n<hr>\n<h2>1. 一句话理解<\/h2>\n<p><strong>安全评估不是&quot;找 bug&quot;，而是&quot;对一个具体的上线决策给出有依据的风险结论&quot;。找 bug 是手段，结论才是交付物。<\/strong><\/p>\n<blockquote class=\"analogy\"><p>🎯 打个比方：安全评估像<strong>建筑验收<\/strong>。<\/p>\n<ul>\n<li>验收员不重新设计大楼，也不检查每一块砖。<\/li>\n<li>他先拿到图纸和施工记录（资料收集），确定验收范围（主体结构、消防、电梯）。<\/li>\n<li>他知道哪些地方最容易出事（威胁模型），重点检查那些地方。<\/li>\n<li>他把问题分成&quot;必须整改才能入住&quot;和&quot;建议整改&quot;（风险评级）。<\/li>\n<li>最后他签字：可以交付，或附条件交付，或不能交付（门禁结论）。<\/li>\n<\/ul>\n<p>比喻的局限：大楼验收后很少改动。合约和系统上线后会升级、换参数、接入新资产，所以评估必须有&quot;变更触发重评&quot;的机制。<\/p>\n<\/blockquote>\n<hr>\n<h2>2. 七个阶段<\/h2>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart LR\n  S1[&quot;① 受理与定范围&quot;] --&gt; S2[&quot;② 资料收集&quot;]\n  S2 --&gt; S3[&quot;③ 威胁建模&quot;]\n  S3 --&gt; S4[&quot;④ 审查与测试&quot;]\n  S4 --&gt; S5[&quot;⑤ 发现定级与报告&quot;]\n  S5 --&gt; S6[&quot;⑥ 整改复核&quot;]\n  S6 --&gt; S7[&quot;⑦ 门禁结论与持续监控&quot;]\n  S7 -. &quot;升级 / 参数变更 / 新资产&quot; .-&gt; S1\n  S4 -. &quot;范围外高风险&quot; .-&gt; S1<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul>\n<li>每个阶段都有退出条件。不满足就不进入下一阶段，避免&quot;边做边改范围&quot;。<\/li>\n<li>④ 中发现范围外的高风险（例如依赖的外部协议有问题）时，回到 ① 调整范围，而不是悄悄扩大工作量或视而不见。<\/li>\n<li>⑦ 不是终点。任何会改变风险的变更都触发新一轮评估。<\/li>\n<\/ul>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>阶段<\/th>\n<th>输入<\/th>\n<th>输出<\/th>\n<th>退出条件<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>① 受理与定范围<\/td>\n<td>评估申请、上线计划<\/td>\n<td>范围说明书：评估对象、提交哈希、链、排除项、截止时间、交付物<\/td>\n<td>申请方书面确认范围<\/td>\n<\/tr>\n<tr>\n<td>② 资料收集<\/td>\n<td><a href=\"#t01\" data-nav=\"t01\">T01 资料清单<\/a><\/td>\n<td>架构图、规格、权限清单、部署脚本、依赖清单、既往审计报告<\/td>\n<td>必需资料齐全；代码冻结<\/td>\n<\/tr>\n<tr>\n<td>③ 威胁建模<\/td>\n<td>资料包<\/td>\n<td><a href=\"#t02\" data-nav=\"t02\">T02 威胁模型<\/a>：资产、入口、信任边界、不变量、特权清单<\/td>\n<td>评估组内部评审通过<\/td>\n<\/tr>\n<tr>\n<td>④ 审查与测试<\/td>\n<td>威胁模型<\/td>\n<td>审查记录、测试代码、工具扫描结果、发现草稿<\/td>\n<td>威胁模型中每个高风险项都有结论<\/td>\n<\/tr>\n<tr>\n<td>⑤ 定级与报告<\/td>\n<td>发现草稿<\/td>\n<td><a href=\"#t03\" data-nav=\"t03\">T03 发现报告<\/a><\/td>\n<td>每条发现有定级、证据、修复建议<\/td>\n<\/tr>\n<tr>\n<td>⑥ 整改复核<\/td>\n<td>修复提交<\/td>\n<td>复核记录：已修复 / 部分修复 / 接受风险<\/td>\n<td>严重和高危全部关闭或有签字的风险接受<\/td>\n<\/tr>\n<tr>\n<td>⑦ 门禁结论<\/td>\n<td>报告 + 复核记录<\/td>\n<td><a href=\"#t04\" data-nav=\"t04\">T04 上线门禁<\/a> 结论 + 监控需求<\/td>\n<td>门禁签字<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2>3. 三类评估对象<\/h2>\n<p>你要负责的三类对象，目标不同，深度和交付物也不同：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>维度<\/th>\n<th>A 交易所自有合约与钱包<\/th>\n<th>B DeFi 协议（自研或接入）<\/th>\n<th>C 上币与合作项目尽调<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>核心问题<\/td>\n<td>我们的资产会不会丢？<\/td>\n<td>这个协议会不会被掏空？我们接入后会不会被连累？<\/td>\n<td>这个项目会不会给用户和交易所带来不可接受的风险？<\/td>\n<\/tr>\n<tr>\n<td>你对代码的控制力<\/td>\n<td>完全可控<\/td>\n<td>自研可控；第三方不可控<\/td>\n<td>不可控<\/td>\n<\/tr>\n<tr>\n<td>评估深度<\/td>\n<td>最深：代码 + 运营 + 密钥 + 流程<\/td>\n<td>深：代码 + 经济模型 + 依赖<\/td>\n<td>中：合约权限 + 链上数据 + 团队运营安全问卷<\/td>\n<\/tr>\n<tr>\n<td>典型时长（示例）<\/td>\n<td>2–6 周<\/td>\n<td>1–4 周<\/td>\n<td>1–5 个工作日<\/td>\n<\/tr>\n<tr>\n<td>主要交付物<\/td>\n<td>完整报告 + 上线门禁 + 监控规则<\/td>\n<td>完整报告或接入风险评估<\/td>\n<td>尽调评分卡 + 风险结论 + 上线条件<\/td>\n<\/tr>\n<tr>\n<td>外部审计<\/td>\n<td>必须，作为补充<\/td>\n<td>自研必须；接入时审阅对方报告<\/td>\n<td>审阅项目方报告<\/td>\n<\/tr>\n<tr>\n<td>专章<\/td>\n<td><a href=\"#a03\" data-nav=\"a03\">A03<\/a><\/td>\n<td><a href=\"#a04\" data-nav=\"a04\">A04<\/a><\/td>\n<td><a href=\"#a05\" data-nav=\"a05\">A05<\/a><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<blockquote class=\"info\"><p>💡 注意：C 类尽调的结论是&quot;风险是否可接受&quot;，不是&quot;代码是否安全&quot;。你没有时间审完一个项目的全部代码，也没有权力要求对方修改。尽调要把有限的时间花在<strong>能直接造成用户损失的权限和机制<\/strong>上。<\/p>\n<\/blockquote>\n<hr>\n<h2>4. 定范围：最容易出错的一步<\/h2>\n<h3>4.1 范围说明书必须写清的 8 项<\/h3>\n<ol>\n<li>评估对象：仓库地址 + <strong>提交哈希<\/strong>（不是分支名）。<\/li>\n<li>部署目标：链、网络、合约地址（如果已部署）。<\/li>\n<li>包含的合约文件与排除的文件。<\/li>\n<li>外部依赖：哪些视为可信（例如 OpenZeppelin 库、Chainlink），哪些需要评估。<\/li>\n<li>链下组件：签名服务、后端、前端、密钥管理是否在范围内。<\/li>\n<li>已知问题与既往审计报告。<\/li>\n<li>交付物与截止时间。<\/li>\n<li>结论用途：内部上线决策、对外公告、监管报备。<\/li>\n<\/ol>\n<h3>4.2 &quot;范围不清&quot;的早期信号<\/h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>信号<\/th>\n<th>风险<\/th>\n<th>应对<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>申请方只给分支名，代码还在改<\/td>\n<td>评估的版本不是上线的版本<\/td>\n<td>要求冻结提交哈希；之后的改动走差异评估<\/td>\n<\/tr>\n<tr>\n<td>&quot;只看合约，不看部署脚本&quot;<\/td>\n<td>初始化参数、权限移交出错（Nomad 类问题）<\/td>\n<td>部署脚本和初始化参数默认纳入范围<\/td>\n<\/tr>\n<tr>\n<td>&quot;外部协议是成熟项目，不用看&quot;<\/td>\n<td>依赖方的风险直接传导<\/td>\n<td>至少评估集成点：价格、回调、暂停、升级<\/td>\n<\/tr>\n<tr>\n<td>没有规格文档<\/td>\n<td>无法判断&quot;这是 bug 还是设计&quot;<\/td>\n<td>先让申请方写出关键不变量，否则不开工<\/td>\n<\/tr>\n<tr>\n<td>上线日期已经对外公布<\/td>\n<td>时间压力导致降低标准<\/td>\n<td>把门禁条件提前写进范围说明书<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2>5. 审查与测试的工作分配<\/h2>\n<p>一个评估组（以 2 人为例）在 ④ 阶段的工作可以这样分配：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>工作<\/th>\n<th>方法<\/th>\n<th>工具<\/th>\n<th>产出<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>架构与权限审查<\/td>\n<td>读架构图、权限清单，逐个验证合约中的修饰器与角色授予<\/td>\n<td><code>cast<\/code>、区块浏览器、Slither 的 <code>vars-and-auth<\/code> 打印器<\/td>\n<td>特权清单与最大破坏力表<\/td>\n<\/tr>\n<tr>\n<td>手工代码审查<\/td>\n<td>按威胁模型逐个入口走读；两人交叉审查<\/td>\n<td>IDE、调用图<\/td>\n<td>发现草稿<\/td>\n<\/tr>\n<tr>\n<td>静态分析<\/td>\n<td>自动扫描，逐条给出结论<\/td>\n<td>Slither、Aderyn 等<\/td>\n<td>扫描结论表<\/td>\n<\/tr>\n<tr>\n<td>测试补强<\/td>\n<td>为关键不变量写模糊测试和不变量测试<\/td>\n<td>Foundry、Echidna、Medusa<\/td>\n<td>测试代码与结果<\/td>\n<\/tr>\n<tr>\n<td>部署与配置核查<\/td>\n<td>对照部署脚本和链上实际状态<\/td>\n<td>部署脚本、链上读取<\/td>\n<td>配置差异表<\/td>\n<\/tr>\n<tr>\n<td>链差异核查<\/td>\n<td>按目标链清单检查<\/td>\n<td><a href=\"#lab-chain-porting-lab\" data-nav=\"lab-chain-porting-lab\" class=\"lab-link\">链迁移检查器<\/a><\/td>\n<td>链风险清单<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<blockquote class=\"info\"><p>💡 注意：自评的最大风险是&quot;熟悉带来的盲区&quot;。评估人员不要评估自己写的代码；同一组内交叉审查；关键模块再请外部审计复核（<a href=\"#a07\" data-nav=\"a07\">A07<\/a>）。<\/p>\n<\/blockquote>\n<h3>5.1 工作量估算（示例）<\/h3>\n<p>业界常用&quot;代码行数（nSLOC，不含注释和空行）&quot;做粗估，再按复杂度调整：<\/p>\n<div class=\"lv-figcap\"><span>图 · 评估工作量估算流程<\/span><span class=\"new\">新增图解<\/span><\/div><div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart TB\n  A[\"统计 nSLOC&lt;br/&gt;不含注释和空行\"] --&gt; B{\"代码复杂度？\"}\n  B --&gt;|\"低\"| L[\"每人每天 400–600\"]\n  B --&gt;|\"中\"| M[\"每人每天 200–400\"]\n  B --&gt;|\"高\"| H[\"每人每天 100–200\"]\n  L --&gt; D[\"算出审查人天\"]\n  M --&gt; D\n  H --&gt; D\n  D --&gt; E[\"加 30% 用于报告与复核\"]\n  E --&gt; F{\"超过截止时间？\"}\n  F --&gt;|\"是\"| G[\"回到 ① 阶段&lt;br/&gt;缩小范围或延后上线\"]\n  F --&gt;|\"否\"| OK[\"按估算排期\"]<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul><li><strong>数据流：<\/strong>先用 nSLOC 粗估，再按复杂度选每日审查速度。<\/li><li><strong>关键：<\/strong>估算结果超期时，改范围或改上线日期，而不是压缩审查。<\/li><li><strong>局限：<\/strong>表中速度只是示例，集中流动性 AMM、跨链消息等高复杂度代码要按低速估。<\/li><\/ul>\n\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>复杂度<\/th>\n<th>每人每天可审 nSLOC（示例）<\/th>\n<th>例子<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>低<\/td>\n<td>400–600<\/td>\n<td>标准代币、简单金库<\/td>\n<\/tr>\n<tr>\n<td>中<\/td>\n<td>200–400<\/td>\n<td>借贷市场、质押奖励<\/td>\n<\/tr>\n<tr>\n<td>高<\/td>\n<td>100–200<\/td>\n<td>集中流动性 AMM、跨链消息、自定义数学库<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>估算后加 30% 用于报告与复核。如果估算结果超过截止时间，在 ① 阶段就缩小范围或延后上线，而不是压缩审查。<\/p>\n<hr>\n<h2>6. 评估结论的三种形态<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>结论<\/th>\n<th>含义<\/th>\n<th>条件<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>通过<\/td>\n<td>可以上线<\/td>\n<td>无未关闭的严重 / 高危；中危有修复计划<\/td>\n<\/tr>\n<tr>\n<td>附条件通过<\/td>\n<td>可以上线，但必须满足列明的条件<\/td>\n<td>例如：限额上线、只开放白名单资产、上线后 30 天内完成某项修复、部署指定监控<\/td>\n<\/tr>\n<tr>\n<td>不通过<\/td>\n<td>不能上线<\/td>\n<td>存在未关闭的严重 / 高危，且无可接受的缓解措施<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"lv-figcap\"><span>图 · 门禁结论怎么得出<\/span><span class=\"new\">新增图解<\/span><\/div><div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart LR\n  A[\"发现报告 + 复核记录\"] --&gt; P[\"通过&lt;br/&gt;可以上线\"]\n  A --&gt; C[\"附条件通过&lt;br/&gt;可以上线，但必须满足列明的条件\"]\n  A --&gt; N[\"不通过&lt;br/&gt;不能上线\"]\n  P --- P1[\"无未关闭的严重 / 高危&lt;br/&gt;中危有修复计划\"]\n  C --- C1[\"例：限额上线、只开放白名单资产&lt;br/&gt;30 天内完成某项修复、部署指定监控\"]\n  N --- N1[\"存在未关闭的严重 / 高危&lt;br/&gt;且无可接受的缓解措施\"]\n  P1 --&gt; W[\"结论写明：依据版本、&lt;br/&gt;未覆盖范围、剩余风险\"]\n  C1 --&gt; W\n  N1 --&gt; W<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul><li><strong>关键：<\/strong>未关闭的严重或高危，且没有可接受的缓解措施，就不能上线。<\/li><li><strong>局限：<\/strong>附条件通过只有在列明的条件全部满足时才成立。<\/li><li><strong>风险：<\/strong>不写未覆盖范围的结论，会让决策者误以为全部都查过了。<\/li><\/ul>\n\n<p>结论必须写明<strong>依据的版本<\/strong>、<strong>未覆盖的范围<\/strong>和<strong>剩余风险<\/strong>。门禁模板见 <a href=\"#t04\" data-nav=\"t04\">T04<\/a>。<\/p>\n<hr>\n<h2>7. 术语表<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>术语<\/th>\n<th>英文<\/th>\n<th>定义<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>范围说明书<\/td>\n<td>Scope Statement<\/td>\n<td>书面确认的评估对象、边界与交付物<\/td>\n<\/tr>\n<tr>\n<td>代码冻结<\/td>\n<td>Code Freeze<\/td>\n<td>评估期间不再修改被评估的提交<\/td>\n<\/tr>\n<tr>\n<td>nSLOC<\/td>\n<td>Normalized Source Lines of Code<\/td>\n<td>去除注释与空行后的源码行数<\/td>\n<\/tr>\n<tr>\n<td>门禁<\/td>\n<td>Go-live Gate<\/td>\n<td>上线前必须满足的安全条件与签字<\/td>\n<\/tr>\n<tr>\n<td>风险接受<\/td>\n<td>Risk Acceptance<\/td>\n<td>业务负责人书面承担某项未修复风险<\/td>\n<\/tr>\n<tr>\n<td>差异评估<\/td>\n<td>Diff Review<\/td>\n<td>只针对相对已评估版本的改动进行评估<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2>8. 思考题<\/h2>\n<ol>\n<li>产品方在评估进行到第二周时提交了一个&quot;小改动&quot;：手续费从 0.3% 调到 0.25%。按本章流程应该怎样处理？（提示：Uranium Finance）<\/li>\n<li>一个上币申请只给了代币合约地址，没有源码。你的尽调还能做什么？结论应该怎样措辞？<\/li>\n<li>为什么&quot;评估结论&quot;必须写明未覆盖的范围？举一个未覆盖范围出事、却被认为是&quot;评估失职&quot;的场景。<\/li>\n<\/ol>\n<p>下一章：<a href=\"#a02\" data-nav=\"a02\">A02 风险评级与报告<\/a><\/p>\n"}, "a02": {"id": "a02", "file": "assessment/A02-risk-rating-reporting.md", "title": "A02 风险评级与报告：把发现变成决策依据", "group": "asm", "html": "<h1>A02 风险评级与报告：把发现变成决策依据<\/h1>\n<blockquote class=\"\"><p>学习目标：读完本章，你能——<\/p>\n<ol>\n<li>用&quot;影响 × 可能性&quot;矩阵给发现定级，并对照 Immunefi 的分级口径。<\/li>\n<li>写出一条让开发者能复现、让管理者能决策的发现报告。<\/li>\n<li>区分&quot;漏洞&quot;与&quot;风险接受&quot;，并为后者建立签字机制。<\/li>\n<\/ol>\n<p>前置章节：<a href=\"#a01\" data-nav=\"a01\">A01 评估方法论<\/a>、<a href=\"#c12\" data-nav=\"c12\">12 审计与测试<\/a><br>交互实验：<a href=\"#lab-severity-calculator\" data-nav=\"lab-severity-calculator\" class=\"lab-link\">severity-calculator.html<\/a> ｜ 模板：<a href=\"#t03\" data-nav=\"t03\">T03 发现报告<\/a><\/p>\n<\/blockquote>\n<hr>\n<h2>1. 一句话理解<\/h2>\n<p><strong>定级不是给发现贴标签，而是回答一个问题：如果不修，最坏会发生什么，发生的门槛有多高。两个答案决定了它该排在修复队列的哪个位置。<\/strong><\/p>\n<blockquote class=\"analogy\"><p>🎯 打个比方：定级像<strong>医院分诊<\/strong>。<\/p>\n<ul>\n<li>分诊护士不治病，她决定谁先进抢救室。<\/li>\n<li>判断依据是两件事：病情多重（影响），以及恶化多快、多容易触发（可能性）。<\/li>\n<li>大出血（高影响）即使暂时稳定，也要优先；轻微擦伤（低影响）即使正在流血，也排后面。<\/li>\n<\/ul>\n<p>比喻的局限：病人的病情是客观的；漏洞的&quot;影响&quot;依赖攻击者能力假设。定级时必须写清假设，否则同一个发现在不同人手里评出不同等级。<\/p>\n<\/blockquote>\n<hr>\n<h2>2. 评级矩阵<\/h2>\n<h3>2.1 两个维度<\/h3>\n<p><strong>影响（Impact）<\/strong>：被成功利用后的后果。<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>影响<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>严重<\/td>\n<td>直接盗取用户或协议资金；资金被永久冻结；协议资不抵债；增发；治理被夺取<\/td>\n<\/tr>\n<tr>\n<td>高<\/td>\n<td>盗取未领取收益；临时冻结资金；部分用户受损<\/td>\n<\/tr>\n<tr>\n<td>中<\/td>\n<td>合约功能不可用（DoS）；偷 gas；需要特定条件才造成有限损失<\/td>\n<\/tr>\n<tr>\n<td>低<\/td>\n<td>不造成资金损失的异常；偏离规格但无价值损失<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>可能性（Likelihood）<\/strong>：被利用的门槛。<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>可能性<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>高<\/td>\n<td>任何人、一笔交易、无特殊前提即可触发<\/td>\n<\/tr>\n<tr>\n<td>中<\/td>\n<td>需要一定资本、特定市场条件、抢跑或多步骤<\/td>\n<\/tr>\n<tr>\n<td>低<\/td>\n<td>需要特权角色、极端条件、或已被其他机制部分缓解<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h3>2.2 矩阵<\/h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>影响：严重<\/th>\n<th>影响：高<\/th>\n<th>影响：中<\/th>\n<th>影响：低<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>可能性：高<\/strong><\/td>\n<td>严重<\/td>\n<td>高<\/td>\n<td>中<\/td>\n<td>低<\/td>\n<\/tr>\n<tr>\n<td><strong>可能性：中<\/strong><\/td>\n<td>高<\/td>\n<td>高<\/td>\n<td>中<\/td>\n<td>低<\/td>\n<\/tr>\n<tr>\n<td><strong>可能性：低<\/strong><\/td>\n<td>中<\/td>\n<td>中<\/td>\n<td>低<\/td>\n<td>信息<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"lv-figcap\"><span>图 · 从矩阵查表到最终定级<\/span><span class=\"new\">新增图解<\/span><\/div><div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart TB\n  I[\"影响&lt;br/&gt;被利用后的后果\"] --&gt; M[\"矩阵查表\"]\n  L[\"可能性&lt;br/&gt;被利用的门槛\"] --&gt; M\n  H[\"写清攻击者能力假设\"] --&gt; I\n  M --&gt; S[\"建议等级\"]\n  S --&gt; E1[\"例：影响严重 + 可能性低&lt;br/&gt;需要多签私钥泄露\"]\n  E1 --&gt; E2[\"矩阵给出：中危\"]\n  E2 --&gt; Q{\"该私钥管理是否薄弱？\"}\n  Q --&gt;|\"是\"| U[\"可能性不低&lt;br/&gt;按实际情况重新定级\"]\n  Q --&gt;|\"否\"| K[\"通常定为中危\"]<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul><li><strong>数据流：<\/strong>影响和可能性两个维度交叉，查出建议等级。<\/li><li><strong>关键：<\/strong>矩阵是起点不是终点，最终定级要结合运营安全的实际情况。<\/li><li><strong>出错点：<\/strong>不写攻击者能力假设，同一个发现会被不同人评出不同等级。<\/li><\/ul>\n\n<blockquote class=\"info\"><p>💡 注意：矩阵是起点不是终点。一个&quot;影响严重、可能性低&quot;的发现（例如需要多签私钥泄露）通常定为中危，但如果这个特权角色的私钥管理本身很薄弱，可能性就不低——定级要结合<a href=\"#a06\" data-nav=\"a06\">运营安全<\/a>的实际情况。<\/p>\n<\/blockquote>\n<p>去 <a href=\"#lab-severity-calculator\" data-nav=\"lab-severity-calculator\" class=\"lab-link\">severity-calculator.html<\/a> 选择影响和可能性，并对照 Immunefi 的示例，得到建议等级。<\/p>\n<hr>\n<h2>3. 对照外部标准：Immunefi<\/h2>\n<p>漏洞赏金平台 Immunefi 的《漏洞严重度分级系统》是业界常用的参照（截至 2026 年公开资料为 v2.3）。它按资产类型分别给出示例，摘录如下（以官方页面为准）：<\/p>\n<h3>3.1 智能合约<\/h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>等级<\/th>\n<th>代表影响<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>严重<\/td>\n<td>直接盗取用户资金（在途或静止）；永久冻结资金或 NFT；协议资不抵债；未授权增发；治理投票操纵改变结果<\/td>\n<\/tr>\n<tr>\n<td>高<\/td>\n<td>盗取未领取收益 / 版税；永久冻结未领取收益；临时冻结资金或 NFT<\/td>\n<\/tr>\n<tr>\n<td>中<\/td>\n<td>因缺少代币导致合约无法运作；区块填塞；无获利的 griefing；偷 gas；无上限 gas 消耗<\/td>\n<\/tr>\n<tr>\n<td>低<\/td>\n<td>合约未能兑现承诺的收益，但不损失价值<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h3>3.2 网站与应用（前端 / 后端）<\/h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>等级<\/th>\n<th>代表影响<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>严重<\/td>\n<td>执行任意系统命令；读取服务器敏感数据（含区块链私钥）；替换交易参数、合约地址或提交恶意交易；代替用户执行改状态操作；通过 NFT 元数据注入 XSS<\/td>\n<\/tr>\n<tr>\n<td>高<\/td>\n<td>无需 JS 的持久内容篡改；一键改他人敏感信息；泄露用户机密信息；无需已连接钱包的子域接管<\/td>\n<\/tr>\n<tr>\n<td>中<\/td>\n<td>一键改他人非敏感信息；反射型 HTML 注入；开放重定向<\/td>\n<\/tr>\n<tr>\n<td>低<\/td>\n<td>需大量交互才能改他人信息；接管失效的外链；临时锁定登录<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<blockquote class=\"warn\"><p>⚠️ 警告：前端和后端有独立的分级。交易所和协议的最大损失近年多来自&quot;网站与应用&quot;类（BadgerDAO 前端注入、Bybit/WazirX 签名界面）。评估范围必须覆盖链下，否则等于只验收了大楼的主体结构，没验收门锁。详见 <a href=\"#a06\" data-nav=\"a06\">A06<\/a>。<\/p>\n<\/blockquote>\n<h3>3.3 区块链 / L1 / L2<\/h3>\n<p>Immunefi 对链本身另有一套分级（网络停摆、非预期分叉、节点资源异常等）。评估 L2 上的协议时，这部分对应&quot;链的信任假设&quot;，见 <a href=\"#k03\" data-nav=\"k03\">C03 Mantle<\/a>。<\/p>\n<hr>\n<h2>4. 一条好的发现报告<\/h2>\n<p>每条发现按 <a href=\"#t03\" data-nav=\"t03\">T03 模板<\/a> 写，包含 8 个字段：<\/p>\n<div class=\"lv-figcap\"><span>图 · 发现报告字段与三条原则<\/span><span class=\"new\">新增图解<\/span><\/div><div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart TB\n  F[\"一条发现\"] --&gt; P1[\"可复现\"]\n  F --&gt; P2[\"可决策\"]\n  F --&gt; P3[\"可执行\"]\n  P1 --&gt; A1[\"位置：文件、行号、函数、提交哈希\"]\n  P1 --&gt; A2[\"复现：能运行的测试或交易\"]\n  P2 --&gt; B1[\"等级：标注影响与可能性\"]\n  P2 --&gt; B2[\"影响：具体数字或场景\"]\n  P3 --&gt; C1[\"修复建议：具体到代码层面\"]\n  A2 --&gt; R[\"严重和高危必须附证明\"]<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul><li><strong>关键：<\/strong>可复现、可决策、可执行，三条原则各对应报告里的几个字段。<\/li><li><strong>出错点：<\/strong>没有可运行的证明，严重发现也容易被以「理论上不可能」驳回。<\/li><li><strong>数据流：<\/strong>影响字段写给非技术决策者看，要用后果而不是术语。<\/li><\/ul>\n\n<ol>\n<li><strong>标题<\/strong>：一句话说清问题。例如&quot;<code>borrow<\/code> 在更新借款记录前转出 ETH，可被跨函数重入&quot;。<\/li>\n<li><strong>等级<\/strong>：严重 / 高 / 中 / 低 / 信息，并标注影响与可能性。<\/li>\n<li><strong>位置<\/strong>：文件、行号、函数、提交哈希。<\/li>\n<li><strong>描述<\/strong>：漏洞机制。为什么现有代码会出错。<\/li>\n<li><strong>影响<\/strong>：最坏后果，用具体数字或场景。标注攻击者能力假设。<\/li>\n<li><strong>复现<\/strong>：攻击路径或可运行的测试（见 <a href=\"#a08\" data-nav=\"a08\">A08<\/a>）。<\/li>\n<li><strong>修复建议<\/strong>：具体到代码层面，给出正确写法或库。<\/li>\n<li><strong>状态<\/strong>：待修复 / 已修复 / 部分修复 / 风险接受，附复核记录。<\/li>\n<\/ol>\n<h3>4.1 写报告的三条原则<\/h3>\n<ul>\n<li><strong>可复现<\/strong>：严重和高危发现必须附一个能运行的证明（测试或交易），否则容易被开发者以&quot;理论上不可能&quot;驳回。<\/li>\n<li><strong>可决策<\/strong>：影响要写给非技术的决策者看。&quot;可能损失池子约 99% 的储备&quot;比&quot;k 值检查失效&quot;更有用。<\/li>\n<li><strong>可执行<\/strong>：修复建议要具体。&quot;使用 CEI&quot;不如直接给出调整后的函数顺序。<\/li>\n<\/ul>\n<h3>4.2 反例与正例<\/h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>反例<\/th>\n<th>问题<\/th>\n<th>正例<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>&quot;存在重入风险&quot;<\/td>\n<td>没说哪个函数、什么后果<\/td>\n<td>&quot;<code>withdraw<\/code> 先 <code>call<\/code> 转账后清零，攻击者递归提取，可提走合约全部 ETH（PoC 见测试 <code>test_Reentrancy<\/code>）&quot;<\/td>\n<\/tr>\n<tr>\n<td>&quot;建议加强权限控制&quot;<\/td>\n<td>不可执行<\/td>\n<td>&quot;<code>setFeeTo<\/code> 缺少 <code>onlyOwner<\/code>，任何人可改手续费接收地址；加 <code>onlyRole(ADMIN)<\/code>&quot;<\/td>\n<\/tr>\n<tr>\n<td>&quot;精度可能有损失&quot;<\/td>\n<td>没定级、没场景<\/td>\n<td>&quot;中危：<code>a/b*c<\/code> 在 b&gt;a 时结果为 0，影响小额利息计算；改为 <code>a*c/b<\/code> 或 <code>mulDiv<\/code>&quot;<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2>5. 风险接受：不是所有发现都要修<\/h2>\n<p>有些发现不修也能上线，但必须走正式流程，而不是口头略过：<\/p>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart LR\n  F[&quot;发现&quot;] --&gt; D{&quot;能否在上线前修复?&quot;}\n  D -- 是 --&gt; FIX[&quot;修复 → 复核 → 关闭&quot;]\n  D -- 否 --&gt; R{&quot;剩余风险可接受?&quot;}\n  R -- 否 --&gt; BLOCK[&quot;阻断上线&quot;]\n  R -- 是 --&gt; ACC[&quot;风险接受：&lt;br/&gt;业务负责人签字&lt;br/&gt;+ 缓解措施 + 复查日期&quot;]\n  ACC --&gt; MON[&quot;纳入监控与下次评估&quot;]<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul>\n<li>&quot;接受风险&quot;必须由有权承担后果的业务负责人签字，不是评估人员单方面决定。<\/li>\n<li>接受时要记录缓解措施（例如限额、监控、保险）和复查日期。<\/li>\n<li>评估人员的职责是把风险说清楚并给出建议；是否接受是业务决策。两者分开，责任才清晰。<\/li>\n<\/ul>\n<blockquote class=\"info\"><p>💡 注意：评估报告要诚实，包括诚实地写出&quot;本次未覆盖的范围&quot;和&quot;接受的风险&quot;。一份把问题藏起来的报告，比没有报告更危险——它给了决策者虚假的安全感。<\/p>\n<\/blockquote>\n<hr>\n<h2>6. 报告的两个版本<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>版本<\/th>\n<th>读者<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>技术版<\/td>\n<td>开发、审计<\/td>\n<td>全部发现、代码位置、复现、修复建议<\/td>\n<\/tr>\n<tr>\n<td>摘要版<\/td>\n<td>管理、业务<\/td>\n<td>风险概览、门禁结论、剩余风险、上线条件<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>摘要版放在报告最前面（一页以内）。它回答决策者唯一关心的问题：能不能上，有什么条件。<\/p>\n<hr>\n<h2>7. 术语表<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>术语<\/th>\n<th>英文<\/th>\n<th>定义<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>影响<\/td>\n<td>Impact<\/td>\n<td>漏洞被利用后的后果严重程度<\/td>\n<\/tr>\n<tr>\n<td>可能性<\/td>\n<td>Likelihood<\/td>\n<td>漏洞被利用的门槛与难度<\/td>\n<\/tr>\n<tr>\n<td>复现<\/td>\n<td>Proof of Concept (PoC)<\/td>\n<td>证明漏洞真实可利用的最小示例<\/td>\n<\/tr>\n<tr>\n<td>风险接受<\/td>\n<td>Risk Acceptance<\/td>\n<td>业务负责人书面承担未修复风险<\/td>\n<\/tr>\n<tr>\n<td>缓解措施<\/td>\n<td>Mitigation<\/td>\n<td>降低风险但不消除漏洞的措施（限额、监控、保险）<\/td>\n<\/tr>\n<tr>\n<td>摘要版<\/td>\n<td>Executive Summary<\/td>\n<td>面向决策者的一页结论<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2>8. 思考题<\/h2>\n<ol>\n<li>一个发现：攻击者需要控制 3/5 多签中的 3 把私钥才能增发代币。影响是严重（增发），可能性看起来很低。你会定几级？还需要了解什么才能定？<\/li>\n<li>用矩阵给以下发现定级：任何人调用 <code>claim()<\/code> 都能领取不属于自己的空投（已部署，奖池 100 万美元）。<\/li>\n<li>为什么&quot;风险接受&quot;要由业务负责人签字，而不是评估负责人？如果两者是同一个人，有什么问题？<\/li>\n<\/ol>\n<p>下一章：<a href=\"#a03\" data-nav=\"a03\">A03 交易所自有合约与钱包评估<\/a><\/p>\n"}, "a03": {"id": "a03", "file": "assessment/A03-exchange-contracts-wallets.md", "title": "A03 交易所自有合约与钱包评估", "group": "asm", "html": "<h1>A03 交易所自有合约与钱包评估<\/h1>\n<blockquote class=\"\"><p>学习目标：读完本章，你能——<\/p>\n<ol>\n<li>列出交易所链上资产的攻击面：热/冷钱包、多签、充值与提币合约、归集、授权。<\/li>\n<li>评估一个多签托管方案的&quot;签名流程&quot;，而不只是&quot;阈值&quot;。<\/li>\n<li>把三起交易所级事故（Bybit、WazirX、Radiant）映射到可检查的评估项。<\/li>\n<\/ol>\n<p>前置章节：<a href=\"#c04\" data-nav=\"c04\">04 访问控制<\/a>、<a href=\"#c08\" data-nav=\"c08\">08 签名安全<\/a>、<a href=\"#c11\" data-nav=\"c11\">11 跨链桥<\/a>、<a href=\"#k00\" data-nav=\"k00\">C00 以太坊<\/a><br>配套：《CEX 交易所学习手册》04 章（钱包与托管）、13 章（事故复盘）<\/p>\n<\/blockquote>\n<hr>\n<h2>1. 一句话理解<\/h2>\n<p><strong>交易所的链上资产，99% 的时间安全地躺在冷钱包里；99% 的损失发生在&quot;签一笔交易&quot;的那几秒。评估的重心是签名流程，不是合约代码。<\/strong><\/p>\n<blockquote class=\"analogy\"><p>🎯 打个比方：交易所的金库像<strong>银行的运钞流程<\/strong>。<\/p>\n<ul>\n<li>金库的锁（多签阈值）很难撬开。<\/li>\n<li>但劫匪不撬锁。他们伪造一张调拨单，让押运员&quot;按正常流程&quot;把钱运出来（签名界面被篡改）。<\/li>\n<li>或者他们在押运员的电脑里装了木马，押运员以为在签 A，实际签了 B（终端被入侵）。<\/li>\n<\/ul>\n<p>比喻的局限：银行运钞单可以人工复核、可以打电话确认。链上交易一旦多签通过并广播，没有撤回。<\/p>\n<\/blockquote>\n<hr>\n<h2>2. 攻击面<\/h2>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart TB\n  subgraph OnChain[&quot;链上&quot;]\n    HW[&quot;热钱包&lt;br/&gt;日常提币&quot;]\n    CW[&quot;冷钱包 / 多签&lt;br/&gt;大额存储&quot;]\n    DEP[&quot;充值地址&lt;br/&gt;归集合约&quot;]\n    WD[&quot;提币合约 / 批量转账&quot;]\n    APV[&quot;对外部协议的授权&quot;]\n  end\n  subgraph OffChain[&quot;链下（最大损失来源）&quot;]\n    SIG[&quot;签名服务 / MPC / HSM&quot;]\n    UI[&quot;签名界面 / Safe 前端&quot;]\n    DEV[&quot;签名人终端&quot;]\n    DEPLOY[&quot;部署与升级流水线&quot;]\n  end\n  DEV --&gt; UI --&gt; SIG --&gt; CW\n  SIG --&gt; HW\n  HW --&gt; WD\n  DEP --&gt; HW\n  CW -. &quot;升级 / 换签名人&quot; .-&gt; DEPLOY\n  classDef hot fill:#fbe2e6,stroke:#d9364c;\n  class SIG,UI,DEV,DEPLOY hot;<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul>\n<li>红色节点全在链下。Bybit、WazirX、Radiant、DMM 四起合计损失超过 20 亿美元，根因都在这里。<\/li>\n<li>合约评估（热/冷钱包合约、归集、提币）是基础，但不是重点。重点是&quot;谁能让冷钱包动，怎么让它动&quot;。<\/li>\n<li>局限：本图省略了交易所的内部账本与风控。那部分见《CEX 交易所学习手册》。<\/li>\n<\/ul>\n<hr>\n<h2>3. 合约层评估项<\/h2>\n<h3>3.1 钱包与多签合约<\/h3>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> 多签合约是经过审计的标准实现（如 Safe），还是自研？自研必须单独深审。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 升级机制：多签实现能否被升级？谁能升级？有无时间锁？（Bybit：实现被 delegatecall 替换）<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 所有权转移：是否两步式？能否被单笔交易夺取？（Radiant：<code>transferOwnership<\/code> 无撤销机制）<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> <code>delegatecall<\/code>、<code>module<\/code>、<code>guard<\/code> 等扩展点是否受控？Safe 的 module 等于一把额外的钥匙。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 签名验证：是否正确处理 EIP-1271（合约签名）、零地址、签名可塑性？（<a href=\"#c08\" data-nav=\"c08\">08 章<\/a>）<\/li>\n<\/ul>\n<h3>3.2 充值、归集、提币<\/h3>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> 充值识别：以<strong>代币合约地址<\/strong>而非符号识别资产；校验交易执行结果（<a href=\"#c11\" data-nav=\"c11\">11 章<\/a> 第 5 节，TRON 假充值见 <a href=\"#k02\" data-nav=\"k02\">C02<\/a>）。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 入账幂等：以 (txHash, logIndex) 为键，重放不会重复入账。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 确认数 / 最终性：按链设置；考虑重组。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 提币合约：批量转账中单笔失败不影响全局（拉取或 try/catch）；黑名单代币不卡死队列。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 归集：小额归集的授权额度与频率；归集地址白名单。<\/li>\n<\/ul>\n<h3>3.3 对外部协议的授权<\/h3>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> 交易所做市、理财、质押时对外部协议的授权额度：是否无限授权？能否按需授权、用后撤销？<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 持有授权的内部合约是否允许任意调用目标？（<a href=\"#c06\" data-nav=\"c06\">06 章<\/a> 第 5 节）<\/li>\n<\/ul>\n<hr>\n<h2>4. 签名流程评估（重点）<\/h2>\n<p>多签的安全不等于&quot;M-of-N&quot;。要评估整条签名链路。<\/p>\n<h3>4.1 评估清单<\/h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>环节<\/th>\n<th>要问的问题<\/th>\n<th>反面案例<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>签名人独立性<\/td>\n<td>N 个签名人是否在不同的人、组织、地理位置、设备上？多少把钥匙实际由同一方控制？<\/td>\n<td>Ronin：9 选 5，其中 4 把同一机构 + 1 把未撤销授权<\/td>\n<\/tr>\n<tr>\n<td>终端安全<\/td>\n<td>签名人的电脑是否专机专用？能否收文件、装软件、上网？<\/td>\n<td>Radiant：开发者在 Telegram 收到伪装成前承包商的文件，终端被植入木马<\/td>\n<\/tr>\n<tr>\n<td>交易构造与展示<\/td>\n<td>签名人看到的内容和实际签署的数据是否一致？谁构造交易？<\/td>\n<td>Bybit、WazirX：界面显示正常，签名数据是恶意的<\/td>\n<\/tr>\n<tr>\n<td>独立解码<\/td>\n<td>是否用独立工具（不同于构造方）解码 calldata 并逐字段核对？<\/td>\n<td>盲签：硬件钱包不解析 Safe 交易，签名人无法看懂<\/td>\n<\/tr>\n<tr>\n<td>高危操作审批<\/td>\n<td>升级、换签名人、<code>delegatecall<\/code>、<code>transferOwnership<\/code> 是否需要额外的带外审批？<\/td>\n<td>Radiant：盲签了 <code>transferOwnership<\/code><\/td>\n<\/tr>\n<tr>\n<td>带外确认<\/td>\n<td>大额或高危交易是否通过独立渠道（电话、线下）二次确认交易哈希？<\/td>\n<td>多数被盗交易所缺这一步<\/td>\n<\/tr>\n<tr>\n<td>时间锁与限额<\/td>\n<td>大额转出是否有时间锁？单位时间提币是否有上限和告警？<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h3>4.2 签名流程的&quot;理想形态&quot;<\/h3>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">sequenceDiagram\n  autonumber\n  participant P as 发起人\n  participant B as 构造系统\n  participant D1 as 签名人 1\n  participant D2 as 签名人 2..M\n  participant X as 独立解码工具\n  participant OOB as 带外确认\n  P-&gt;&gt;B: 发起转账请求\n  B-&gt;&gt;D1: 交易数据 + 人类可读摘要\n  D1-&gt;&gt;X: 用独立工具解码 calldata\n  X--&gt;&gt;D1: 目标、金额、函数、是否 delegatecall\n  D1-&gt;&gt;OOB: 高危操作：带外确认交易哈希\n  OOB--&gt;&gt;D1: 确认一致\n  D1-&gt;&gt;D1: 硬件钱包逐字段核对后签名\n  Note over D2: 每个签名人独立重复以上\n  D2-&gt;&gt;B: 达到阈值后广播<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul>\n<li>关键在第 3–6 步：解码、带外确认、逐字段核对,由签名人独立完成,不依赖构造系统给出的摘要。<\/li>\n<li>这条流程防的是&quot;构造系统或界面被攻破&quot;。如果所有签名人都只看构造系统给的摘要,整个多签退化成单点。<\/li>\n<li>局限：流程再严,也挡不住签名人集体被钓鱼或胁迫。所以还要有时间锁和限额兜底。<\/li>\n<\/ul>\n<hr>\n<h2>5. 三起事故映射到评估项<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>事故<\/th>\n<th>根因环节<\/th>\n<th>本章对应评估项<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Bybit（2025-02，约 15 亿美元）<\/td>\n<td>签名界面（Safe 前端被篡改）→ delegatecall 替换实现<\/td>\n<td>4.1 交易展示、独立解码、高危操作审批；3.1 升级机制<\/td>\n<\/tr>\n<tr>\n<td>WazirX（2024-07，约 2.3 亿美元）<\/td>\n<td>签名界面与签名数据不一致 → 升级多签<\/td>\n<td>4.1 交易展示、独立解码、带外确认<\/td>\n<\/tr>\n<tr>\n<td>Radiant（2024-10，约 5,000 万美元）<\/td>\n<td>终端被木马入侵 → 盲签 <code>transferOwnership<\/code><\/td>\n<td>4.1 终端安全、独立解码；3.1 所有权转移无撤销<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>三起的共同点：<strong>合约本身没有新漏洞,失守的是&quot;人签了什么&quot;<\/strong>。评估一个托管方案时,把 60% 的精力放在第 4 节。<\/p>\n<blockquote class=\"warn\"><p>⚠️ 警告：这些攻击多数由有国家背景的团队（公开报道常指向朝鲜 Lazarus / TraderTraitor）长期策划。防御不能假设攻击者是机会主义者。假设对方会花数月渗透、会伪造完整的招聘流程、会同时攻破多个签名人的终端。<\/p>\n<\/blockquote>\n<hr>\n<h2>6. 评估交付物<\/h2>\n<p>交易所自有资产评估的交付物比普通审计多两项:<\/p>\n<ol>\n<li>合约审计报告（标准,见 <a href=\"#a02\" data-nav=\"a02\">A02<\/a>）。<\/li>\n<li><strong>签名流程评估<\/strong>：按第 4 节清单逐项打分,标出单点。<\/li>\n<li><strong>监控与应急需求<\/strong>：移交给 <a href=\"#a09\" data-nav=\"a09\">A09<\/a>,包括大额转出告警、权限变更告警、冷钱包异动告警。<\/li>\n<\/ol>\n<hr>\n<h2>7. 术语表<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>术语<\/th>\n<th>英文<\/th>\n<th>定义<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>盲签<\/td>\n<td>Blind Signing<\/td>\n<td>签名人无法看懂所签内容<\/td>\n<\/tr>\n<tr>\n<td>带外确认<\/td>\n<td>Out-of-band Verification<\/td>\n<td>通过独立渠道二次确认交易<\/td>\n<\/tr>\n<tr>\n<td>MPC<\/td>\n<td>Multi-Party Computation<\/td>\n<td>私钥分片、多方协同签名,不重组完整私钥<\/td>\n<\/tr>\n<tr>\n<td>HSM<\/td>\n<td>Hardware Security Module<\/td>\n<td>保管密钥并在内部完成签名的硬件<\/td>\n<\/tr>\n<tr>\n<td>专机<\/td>\n<td>Air-gapped / Dedicated Device<\/td>\n<td>隔离、专用于签名的设备<\/td>\n<\/tr>\n<tr>\n<td>module / guard<\/td>\n<td>Safe Module / Guard<\/td>\n<td>Safe 多签的扩展点,可绕过或附加签名逻辑<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2>8. 思考题<\/h2>\n<ol>\n<li>一个交易所的冷钱包是 Safe 4/7,7 个签名人都用硬件钱包。看起来很安全。请指出至少 3 个仍可能导致 Radiant 式失守的环节。<\/li>\n<li>&quot;独立解码 calldata&quot;具体怎么做?签名人应该核对哪些字段?哪个字段的出现应当立即触发高度警惕?<\/li>\n<li>为什么说&quot;签名流程评估&quot;比&quot;多签合约审计&quot;对交易所更重要?用本章的三起事故论证。<\/li>\n<\/ol>\n<p>下一章：<a href=\"#a04\" data-nav=\"a04\">A04 DeFi 协议评估<\/a><\/p>\n"}, "a04": {"id": "a04", "file": "assessment/A04-defi-protocol-review.md", "title": "A04 DeFi 协议评估：按协议类型下手", "group": "asm", "html": "<h1>A04 DeFi 协议评估：按协议类型下手<\/h1>\n<blockquote class=\"\"><p>学习目标：读完本章，你能——<\/p>\n<ol>\n<li>用一张&quot;通用 + 分类型&quot;的清单评估借贷、DEX/AMM、稳定币、金库、质押、跨链、永续、账户抽象八类协议。<\/li>\n<li>评估协议的经济安全和外部依赖,而不只是代码正确性。<\/li>\n<li>区分&quot;自研协议&quot;与&quot;接入第三方协议&quot;两种评估目标。<\/li>\n<\/ol>\n<p>前置章节：<a href=\"#c05\" data-nav=\"c05\">05 算术<\/a>、<a href=\"#c07\" data-nav=\"c07\">07 预言机<\/a>、<a href=\"#c10\" data-nav=\"c10\">10 经济安全<\/a>、<a href=\"#c11\" data-nav=\"c11\">11 跨链<\/a><br>交互实验：<a href=\"#lab-oracle-manipulation-lab\" data-nav=\"lab-oracle-manipulation-lab\" class=\"lab-link\">oracle-manipulation-lab.html<\/a>、<a href=\"#lab-vault-inflation-lab\" data-nav=\"lab-vault-inflation-lab\" class=\"lab-link\">vault-inflation-lab.html<\/a><\/p>\n<\/blockquote>\n<hr>\n<h2>1. 一句话理解<\/h2>\n<p><strong>DeFi 协议的评估分两层:代码会不会被攻破,规则会不会被套利。前者有清单可查,后者要把整个协议和它依赖的市场一起建模。<\/strong><\/p>\n<div class=\"lv-figcap\"><span>图 · DeFi 协议评估的两层<\/span><span class=\"new\">新增图解<\/span><\/div><div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart TB\n  P[\"DeFi 协议评估\"] --&gt; L1[\"第一层：代码会不会被攻破\"]\n  P --&gt; L2
