/* Layout: fixed chapter rail on the left (drawer on phones), one reading column, labs open full-height in place. */

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; height: var(--bar); display: flex; align-items: center; gap: 12px; padding-inline: 16px; background: var(--paper); border-bottom: 1px solid var(--rule); }

  radial-gradient(circle, var(--rule) 1px, transparent 1.2px) 0 0 / 22px 22px, var(--ground); }

<script>
const DATA = {"docs": {"home": {"id": "home", "file": "README.md", "title": "智能合约安全学习手册（以太坊 · BNB Chain · TRON · Mantle 扩展案例）", "group": "start", "html": "<h1>智能合约安全学习手册（以太坊 · BNB Chain · TRON · Mantle 扩展案例）<\/h1>\n<blockquote class=\"\"><p>目标：由浅入深，理解智能合约的<strong>漏洞机制<\/strong>、<strong>防御方法<\/strong>和<strong>工程流程<\/strong>；扩展案例以以太坊主网为参照，并延伸到 BNB Chain、TRON、Mantle 三条链。<br>形式：Markdown 章节（文字 + Mermaid 图）+ HTML 交互实验 + 可编译的漏洞 / 修复示例合约 + <a href=\"#home\" data-nav=\"home\">讲解视频 27 集<\/a>。<br>风格：80% 遵循 ASD-STE100 受控语言（短句、主动语态、一词一义），20% 用比喻和案例。见 <a href=\"#guide\" data-nav=\"guide\">WRITING-GUIDE.md<\/a>。<br>姊妹篇：<a href=\"https://claude.ai/artifact/HYgzfN2Zk8SRLbAskxh8nJ\" target=\"_blank\" rel=\"noopener\">《CEX 交易所学习手册》<\/a>——交易所的钱包、充值、多签都建立在本手册讲的合约安全之上。<br>主手册：<a href=\"https://claude.ai/artifact/7yNTv7XtKX2MYexmqpEogn\" target=\"_blank\" rel=\"noopener\">《Web3 合约与项目学习手册》<\/a>——合约原理、项目业务与商业逻辑。本手册是它的安全专题。<\/p>\n<\/blockquote>\n<blockquote class=\"info\"><p>💡 注意：本站只讲智能合约安全，进度和笔记独立保存。钱包、运营、链与基础设施等合约之外的内容，见《<a href=\"https://claude.ai/artifact/AuMf2iv5HSYVzvQiBEE6pA\" target=\"_blank\" rel=\"noopener\">Web3 安全学习手册<\/a>》。<\/p>\n<\/blockquote>\n<h2>1. 一张图看懂学习路径<\/h2>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart TD\n    subgraph L1[&quot;第一层 · 地图：合约为什么危险&quot;]\n        C01[&quot;01 安全全景与威胁建模&quot;]\n        C02[&quot;02 EVM 与 Solidity 基础&quot;]\n    end\n    subgraph L2[&quot;第二层 · 经典漏洞：代码层&quot;]\n        C03[&quot;03 重入&quot;]\n        C04[&quot;04 访问控制&quot;]\n        C05[&quot;05 算术与精度&quot;]\n        C06[&quot;06 外部调用与代币兼容&quot;]\n    end\n    subgraph L3[&quot;第三层 · DeFi 攻击：数据与顺序&quot;]\n        C07[&quot;07 预言机与闪电贷&quot;]\n        C08[&quot;08 MEV 与签名&quot;]\n    end\n    subgraph L4[&quot;第四层 · 系统：升级、经济与跨链&quot;]\n        C09[&quot;09 可升级合约与代理&quot;]\n        C10[&quot;10 DeFi 经济安全&quot;]\n        C11[&quot;11 跨链桥&quot;]\n    end\n    subgraph L5[&quot;第五层 · 工程：流程与复盘&quot;]\n        C12[&quot;12 审计、测试与开发流程&quot;]\n        C13[&quot;13 事故案例库&quot;]\n    end\n    subgraph L6[&quot;第六层 · 链专题：同一份代码，四种环境&quot;]\n        ETH[&quot;C00 以太坊&quot;]\n        BNB[&quot;C01 BNB Chain&quot;]\n        TRX[&quot;C02 TRON&quot;]\n        MNT[&quot;C03 Mantle&quot;]\n    end\n    L1 --&gt; L2 --&gt; L3 --&gt; L4 --&gt; L5 --&gt; L6<\/pre><\/div>\n<p>读图要点：<\/p>\n<ul>\n<li>第一层建立&quot;攻击者能控制什么&quot;的思维方式。后面每一章都在回答这个问题的一个分支。<\/li>\n<li>第二层是单个合约内部的漏洞。第三、四层是合约与外部世界（价格、顺序、升级、其他链）交互时的漏洞。<\/li>\n<li>第六层先在以太坊主网深潜 10 起合约事故，再把前面的知识放进三条真实的链：BNB Chain（EVM 兼容 L1）、TRON（TVM）、Mantle（以太坊 L2）。每个专题都有一份&quot;迁移检查清单&quot;。<\/li>\n<\/ul>\n<h2>2. 章节目录<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>章节<\/th>\n<th>你会学到<\/th>\n<th>交互实验<\/th>\n<th>示例合约<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>01<\/td>\n<td><a href=\"#c01\" data-nav=\"c01\">安全全景与威胁建模<\/a><\/td>\n<td>合约与 Web2/CEX 安全的区别；六大漏洞类别；威胁建模步骤<\/td>\n<td><a href=\"#lab-incident-explorer\" data-nav=\"lab-incident-explorer\" class=\"lab-link\">事故浏览器<\/a><\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>02<\/td>\n<td><a href=\"#c02\" data-nav=\"c02\">EVM 与 Solidity 基础<\/a><\/td>\n<td>调用上下文、三种调用、存储布局、8 个易错语言特性<\/td>\n<td><a href=\"#lab-storage-proxy-lab\" data-nav=\"lab-storage-proxy-lab\" class=\"lab-link\">存储与代理<\/a><\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>03<\/td>\n<td><a href=\"#c03\" data-nav=\"c03\">重入攻击<\/a><\/td>\n<td>单函数 / 跨函数 / 跨合约 / 只读重入；CEI 与重入锁<\/td>\n<td><a href=\"#lab-reentrancy-lab\" data-nav=\"lab-reentrancy-lab\" class=\"lab-link\">重入模拟器<\/a><\/td>\n<td><a href=\"#examples\" data-nav=\"examples\">01-Reentrancy.sol<\/a><\/td>\n<\/tr>\n<tr>\n<td>04<\/td>\n<td><a href=\"#c04\" data-nav=\"c04\">访问控制与权限<\/a><\/td>\n<td>6 种权限缺陷；多签 + 时间锁；TRON 账户权限<\/td>\n<td><a href=\"#lab-storage-proxy-lab\" data-nav=\"lab-storage-proxy-lab\" class=\"lab-link\">存储与代理<\/a><\/td>\n<td><a href=\"#examples\" data-nav=\"examples\">02-AccessControl.sol<\/a><\/td>\n<\/tr>\n<tr>\n<td>05<\/td>\n<td><a href=\"#c05\" data-nav=\"c05\">算术与精度<\/a><\/td>\n<td>溢出、舍入方向、金库通胀攻击、三链 USDT 精度、Uranium<\/td>\n<td><a href=\"#lab-vau ab-link\">链迁移检查<\/a><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>全部交互实验入口（9 个）：<a href=\"#labs\" data-nav=\"labs\" class=\"lab-link\">interactive/index.html<\/a>（浏览器直接打开，无需服务器）。<br>全部示例合约：<a href=\"#examples\" data-nav=\"examples\">examples/<\/a>（Solidity ^0.8.20，已通过编译）。<br>单文件阅读版：<a href=\"#home\" data-nav=\"home\">handbook.html<\/a>（全部章节 + 图表 + 实验，浏览器直接打开）。<br>讲解视频：<a href=\"#home\" data-nav=\"home\">video/<\/a>（评估篇 10 集 + 主线 13 集 + 链专题 4 集，选集播放器 <a href=\"#home\" data-nav=\"home\">video/index.html<\/a>，口播稿 <a href=\"#home\" data-nav=\"home\">video/scripts/<\/a>）。<\/p>\n<h3>评估篇（<a href=\"#a01\" data-nav=\"a01\">assessment/<\/a>）：把&quot;懂漏洞&quot;变成&quot;能做评估&quot;<\/h3>\n<p>三类评估对象：<strong>A 交易所自有合约与钱包<\/strong>、<strong>B DeFi 协议<\/strong>、<strong>C 上币与合作项目尽调<\/strong>。以自评为主，外部审计作补充。<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>章节<\/th>\n<th>你会学到<\/th>\n<th>工具 / 模板<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>A01<\/td>\n<td><a href=\"#a01\" data-nav=\"a01\">评估方法论<\/a><\/td>\n<td>7 阶段流程；三类对象的分流；深度与工时<\/td>\n<td><a href=\"#t01\" data-nav=\"t01\">T01 资料清单<\/a>、<a href=\"#t02\" data-nav=\"t02\">T02 威胁建模<\/a><\/td>\n<\/tr>\n<tr>\n<td>A02<\/td>\n<td><a href=\"#a02\" data-nav=\"a02\">风险评级与报告<\/a><\/td>\n<td>影响×可能性矩阵；Immunefi 口径；已接受风险<\/td>\n<td><a href=\"#lab-severity-calculator\" data-nav=\"lab-severity-calculator\" class=\"lab-link\">评级计算器<\/a>、<a href=\"#t03\" data-nav=\"t03\">T03 报告<\/a><\/td>\n<\/tr>\n<tr>\n<td>A03<\/td>\n<td><a href=\"#a03\" data-nav=\"a03\">交易所合约与钱包<\/a><\/td>\n<td>攻击面；签名流程评估；Bybit / WazirX / Radiant 映射<\/td>\n<td><a href=\"#t04\" data-nav=\"t04\">T04 门禁<\/a><\/td>\n<\/tr>\n<tr>\n<td>A04<\/td>\n<td><a href=\"#a04\" data-nav=\"a04\">DeFi 协议评估<\/a><\/td>\n<td>通用清单 + 八类协议清单；经济与依赖评估<\/td>\n<td><a href=\"#lab-oracle-manipulation-lab\" data-nav=\"lab-oracle-manipulation-lab\" class=\"lab-link\">预言机<\/a>、<a href=\"#lab-vault-inflation-lab\" data-nav=\"lab-vault-inflation-lab\" class=\"lab-link\">金库<\/a><\/td>\n<\/tr>\n<tr>\n<td>A05<\/td>\n<td><a href=\"#a05\" data-nav=\"a05\">上币与合作尽调<\/a><\/td>\n<td>八条红线；四维评分；链上取证<\/td>\n<td><a href=\"#lab-listing-scorecard\" data-nav=\"lab-listing-scorecard\" class=\"lab-link\">评分卡<\/a>、<a href=\"#t05\" data-nav=\"t05\">T05 问卷<\/a><\/td>\n<\/tr>\n<tr>\n<td>A06<\/td>\n<td><a href=\"#a06\" data-nav=\"a06\">运营与密钥安全<\/a><\/td>\n<td>链下四类根因；密钥方案对比；前端与供应链<\/td>\n<td><a href=\"#lab-incident-explorer\" data-nav=\"lab-incident-explorer\" class=\"lab-link\">事故浏览器<\/a><\/td>\n<\/tr>\n<tr>\n<td>A07<\/td>\n<td><a href=\"#a07\" data-nav=\"a07\">外部审计与赏金<\/a><\/td>\n<td>选审计、界定范围、读报告红旗、设计赏金<\/td>\n<td><a href=\"#t01\" data-nav=\"t01\">T01<\/a><\/td>\n<\/tr>\n<tr>\n<td>A08<\/td>\n<td><a href=\"#a08\" data-nav=\"a08\">事故分析与防御性验证<\/a><\/td>\n<td>五步读攻击交易；事故→不变量；验证修复<\/td>\n<td><a href=\"#lab-incident-explorer\" data-nav=\"lab-incident-explorer\" class=\"lab-link\">事故浏览器<\/a><\/td>\n<\/tr>\n<tr>\n<td>A09<\/td>\n<td><a href=\"#a09\" data-nav=\"a09\">应急响应<\/a><\/td>\n<td>监控与暂停；决策树；桌面推演；复盘<\/td>\n<td><a href=\"#t04\" data-nav=\"t04\">T04<\/a><\/td>\n<\/tr>\n<tr>\n<td>A10<\/td>\n<td><a href=\"#a10\" data-nav=\"a10\">实例：币安 Audit 页<\/a><\/td>\n<td>钱包 Audit 页的数据链路（已公开 vs 推断）；扫描能发现与发现不了什么；第 0 步分诊<\/td>\n<td><a href=\"#lab-listing-scorecard\" data-nav=\"lab-listing-scorecard\" class=\"lab-link\">评分卡<\/a><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h2>3. 三种学习路线<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>你的角色<\/th>\n<th>推荐路线<\/th>\n<th>重点<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>合约开发者<\/td>\n<td>01 → 02 → 03 → 04 → 05 → 06 → 09 → 12 → C00 → 目标链专题<\/td>\n<td>写出安全的代码；知道部署到哪条链要改什么<\/td>\n<\/tr>\n<tr>\n<td>审计 / 安全研究<\/td>\n<td>01 → 02 → 03–11 全部 → 12 → 13 → C00–C03<\/td>\n<td>漏洞模式识别；复盘能力<\/td>\n<\/tr>\n<tr>\n<td>交易所 / 钱包 / 产品<\/td>\n<td>01 → 06 → 08 → 11 → 13 → C02 → C03<\/td>\n<td>集成风险（假充值、代币兼容）、签名界面、L2 信任假设<\/td>\n<\/tr>\n<tr>\n<td>安全评估负责人<\/td>\n<td>01 → 03–11 通读 → A01 → A02 → 按对象选 A03 / A04 / A05 → A06 → A07 → A08 → A09 → A10<\/td>\n<td>方法论、评级、门禁、尽调、应急<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h2>4. 怎么用交互实验和示例合约<\/h2>\n<ol>\n<li>先读章节的&quot;一句话理解&quot;和第一张图。<\/li>\n<li>打开交互页，按&quot;怎么玩&quot;操作。记录你观察到的现象。<\/li>\n<li>打开对应示例合约，找到 <code>// ❌ 漏洞<\/code> 和 <code>// ✅ 修复<\/code> 两段代码，对照实验结果。<\/li>\n<li>回到章节末尾的&quot;思考题&quot;，用实验和代码回答。<\/li>\n<\/ol>\n<blockquote class=\"info\"><p>💡 注意：交互页里的储备、费率、延迟等参数是<strong>示例值<\/strong>，用于演示机制。链参数（出块时间、多签门槛等）会随升级变化，以官方文档和 L2BEAT 等独立来源的最新页面为准。<\/p>\n<\/blockquote>\n<blockquote class=\"warn\"><p>⚠️ 警告：本手册只用于学习防御。示例合约只演示原理，不包含针对任何在线合约的攻击脚本。不要在未授权的合约上做任何测试。<\/p>\n<\/blockquote>\n<h2>5. 三个层次的信息<\/h2>\n<p>本手册始终区分三类信息：<\/p>\n<ul>\n<li><strong>公开事实<\/strong>：项目方复盘、官方文档（BNB Chain、TRON 开发者文档）、审计报告（OpenZeppelin 等）、L2BEAT、主流媒体与安全公司分析。事故金额为事发时美元估值约数。<\/li>\n<li><strong>业界通用做法<\/strong>：没有单一权威来源、但被广泛采用的做法。<\/li>\n<li><strong>本手册示例<\/strong>：<code>examples/<\/code> 中的合约和 <code>interactive/<\/code> 中的模拟，数值均为示例。<\/li>\n<\/ul>\n"}, "guide": {"id": "guide", "file": "WRITING-GUIDE.md", "title": "写作规范（ASD-STE100 中文化，80% 遵循）", "group": "start", "html": "<h1>写作规范（ASD-STE100 中文化，80% 遵循）<\/h1>\n<p>本规范约束 <code>Contract/<\/code> 下的全部文档。它沿用《CEX 交易所学习手册》的规范，只替换了合约安全相关的部分。目标：读者一次读懂，不需要回读。<\/p>\n<h2>1. 为什么用 ASD-STE100<\/h2>\n<p>ASD-STE100（Simplified Technical English）是航空维修手册的受控语言标准。它的核心是：<strong>一个句子只说一件事，一个词只有一个意思<\/strong>。安全文档尤其需要这一点：一个含糊的词，可能就是一个漏洞。80% 的内容严格遵循规则；20% 留给比喻、故事和案例。<\/p>\n<h2>2. 规则（严格部分，约 80%）<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>编号<\/th>\n<th>规则<\/th>\n<th>正例<\/th>\n<th>反例<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>R1<\/td>\n<td>一句话只表达一个动作或一个事实<\/td>\n<td>合约先更新余额。然后合约转出 ETH。<\/td>\n<td>合约在更新余额并检查条件之后再把 ETH 转给调用者并触发事件。<\/td>\n<\/tr>\n<tr>\n<td>R2<\/td>\n<td>操作步骤句 ≤ 20 字；描述句 ≤ 30 字（中文字符，不含代码和英文术语）<\/td>\n<td>攻击者调用 <code>withdraw()<\/code>。<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>R3<\/td>\n<td>用主动语态，主语明确<\/td>\n<td>攻击合约在 <code>receive()<\/code> 中再次调用 <code>withdraw()<\/code>。<\/td>\n<td><code>withdraw()<\/code> 被重新进入了。<\/td>\n<\/tr>\n<tr>\n<td>R4<\/td>\n<td>步骤用编号列表，一步一个动作<\/td>\n<td>1. 借闪电贷。 2. 买入代币。<\/td>\n<td>借闪电贷并买入代币。<\/td>\n<\/tr>\n<tr>\n<td>R5<\/td>\n<td>一个术语只用一个词，全文一致<\/td>\n<td>始终写&quot;重入&quot;，不混用&quot;重进入/回调攻击&quot;<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>R6<\/td>\n<td>首次出现的术语给出英文和一句定义<\/td>\n<td>闪电贷（Flash Loan）：同一笔交易内借出并归还的无抵押贷款。<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>R7<\/td>\n<td>不用模糊词：大概、一些、相关、等等、可能会<\/td>\n<td>如果调用方不是 owner，函数回滚。<\/td>\n<td>权限不太对的话可能会失败。<\/td>\n<\/tr>\n<tr>\n<td>R8<\/td>\n<td>条件写在前，结果写在后<\/td>\n<td>如果预言机价格超过 1 小时未更新，协议暂停借款。<\/td>\n<td>协议会暂停借款，当价格太旧时。<\/td>\n<\/tr>\n<tr>\n<td>R9<\/td>\n<td>警告和注意使用固定标记<\/td>\n<td><code>&gt; ⚠️ 警告：<\/code> 会造成资金损失的事项；<code>&gt; 💡 注意：<\/code> 容易误解的事项<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>R10<\/td>\n<td>数字带单位；示例数值标注&quot;示例&quot;；事故金额标注&quot;约&quot;和&quot;事发时美元估值&quot;<\/td>\n<td>损失约 1.97 亿美元（事发时估值）<\/td>\n<td>损失巨大<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h2>3. 生动部分（约 20%）<\/h2>\n<ul>\n<li><strong>比喻<\/strong>：每章至少 1 个。格式：<code>&gt; 🎯 打个比方：……<\/code>，并写出比喻的局限。<\/li>\n<li><strong>案例<\/strong>：真实事故。注明年月、链、公开来源类型（项目方复盘、安全公司分析、媒体报道、L2BEAT 等）。<\/li>\n<li><strong>思考题<\/strong>：每章末尾 2–3 个问题，引导读者用交互页或示例合约验证。<\/li>\n<\/ul>\n<h2>4. 代码规则<\/h2>\n<ul>\n<li>漏洞代码一律标注 <code>// ❌ 漏洞<\/code> ，修复代码标注 <code>// ✅ 修复<\/code>。<\/li>\n<li>示例合约放在 <code>examples/<\/code>，使用 Solidity <code>^0.8.20<\/code>，必须能通过编译。<\/li>\n<li>示例只演示原理。示例不包含针对任何真实在线合约的攻击脚本。<\/li>\n<\/ul>\n<h2>5. 图表规则<\/h2>\n<ul>\n<li>关系复杂的内容（调用链、状态机、攻击路径、因果）<strong>必须<\/strong>用 Mermaid 图。<\/li>\n<li>每张图后写 2–4 行&quot;读图要点&quot;：数据从哪里来、到哪里去、哪里出错、局限是什么。<\/li>\n<li>调用链用 <code>sequenceDiagram<\/code>；状态机用 <code>stateDiagram-v2<\/code>；架构用 <code>flowchart<\/code>；攻击因果用 <code>flowchart LR<\/code>。<\/li>\n<li>参数会变化的机制（价格、份额、滑点、签名字段）<strong>必须<\/strong>链接 <code>interactive/<\/code> 下的实验页。<\/li>\n<\/ul>\n<h2>6. 事实规则<\/h2>\n<ul>\n<li>区分三层：<strong>公开事实<\/strong>（项目方复盘、官方文档、链上数据）/ <strong>业界通用做法<\/strong> / <strong>本手册示例<\/strong>。<\/li>\n<li>链参数（出块时间、阈值、多签门槛）会变化。写&quot;截至 2026 年公开资料&quot;，并给出处类型。<\/li>\n<li>不确定的归因（例如攻击者身份）写&quot;公开报道归因于……&quot;。<\/li>\n<\/ul>\n<h2>7. 主线章节模板<\/h2>\n<div class=\"code-wrap\"><pre><code class=\"language-markdown\"># NN 标题\n\n&gt; 学习目标：读完本章，你能……（3 条以内）\n&gt; 前置章节：……\n&gt; 交互实验：[xxx.html](interactive/xxx.html) ｜ 示例合约：[examples/xxx.sol](examples/xxx.sol)\n\n## 1. 一句话理解（+ 🎯 打个比方）\n## 2. 威胁模型：攻击者能控制什么\n## 3. 漏洞机制（图 + 代码）\n## 4. 防御方法（分层，从代码到流程）\n## 5. 真实案例（含 BNB Chain / TRON / Mantle 扩展案例）\n## 6. 审计检查点（可直接用于自查的清单）\n## 7. 用户侧防护（普通用户能做什么；03–11 章）\n## 8. 术语表\n## 9. 思考题\n<\/code><\/pre><\/div>\n<h2>8. 链专题模板（chains/C*.md）<\/h2>\n<div class=\"code-wrap\"><pre><code class=\"language-markdown\"># CNN 链名：合约安全专题\n\n&gt; 学习目标 / 前置章节 / 交互实验\n\n## 1. 一句话理解 + 🎯 打个比方\n## 2. 链的安全模型（共识、出块、信任假设；flowchart）\n## 3. 与以太坊的差异（表格：差异 → 合约风险 → 对策）\n## 4. 案例深潜（每个案例：背景 → 攻击路径图 → 根因代码 → 教训）\n## 5. 迁移检查清单（把以太坊合约部署到该链前要检查什么）\n## 6. 术语表 / 思考题\n<\/code><\/pre><\/div>\n"}, "c01": {"id": "c01", "file": "01-security-landscape.md", "title": "01 合约安全全景：为什么代码就是金库", "group": "g1", "html": "<h1>01 合约安全全景：为什么代码就是金库<\/h1>\n<blockquote class=\"\"><p>学习目标：读完本章，你能——<\/p>\n<ol>\n<li>说清智能合约安全和传统 Web2 安全的三个根本区别。<\/li>\n<li>画出一张合约攻击面地图，并把常见漏洞归入六大类。<\/li>\n<li>用&quot;攻击者能控制什么&quot;的方法，为任意合约建立威胁模型。<\/li>\n<\/ol>\n<p>前置章节：无（本章是系列入口）。建议先读过《CEX 交易所学习手册》01 章，理解&quot;托管&quot;的含义。<br>交互实验：<a href=\"#lab-incident-explorer\" data-nav=\"lab-incident-explorer\" class=\"lab-link\">incident-explorer.html<\/a><\/p>\n<\/blockquote>\n<hr>\n<h2>1. 一句话理解<\/h2>\n<p><strong>智能合约是一段公开的、不可撤回的、直接控制资金的代码。任何人都可以用任意参数、任意顺序调用它。<\/strong><\/p>\n<p>智能合约（Smart Contract）：部署在区块链上、按代码自动执行的程序。它可以持有资产，也可以转出资产。<\/p>\n<blockquote class=\"analogy\"><p>🎯 打个比方：智能合约像一台<strong>放在广场中央的自动售货机<\/strong>。<\/p>\n<ul>\n<li>机器里装着真金白银（合约余额）。<\/li>\n<li>机器的电路图贴在外壳上，任何人都能看（代码公开、字节码公开）。<\/li>\n<li>全世界的人都可以 7×24 小时来投币、按按钮、拍打机器（任何人可调用任何 public/external 函数）。<\/li>\n<li>机器一旦装好，就不能打开维修（不可变）。如果留了维修门（升级代理），维修门的钥匙本身就成了攻击目标。<\/li>\n<li>机器吐错了钱，没有客服可以追回（交易不可逆）。<\/li>\n<\/ul>\n<p>比喻的局限：真实的售货机一次只服务一个人。合约在一笔交易里可以被<strong>同一个人反复调用、嵌套调用<\/strong>，还可以和其他几十台&quot;售货机&quot;组合使用（可组合性）。这正是很多漏洞的来源。<\/p>\n<\/blockquote>\n<hr>\n<h2>2. 和 Web2 安全有什么不同<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>维度<\/th>\n<th>Web2 后端<\/th>\n<th>CEX（中心化交易所）<\/th>\n<th>智能合约<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>代码是否公开<\/td>\n<td>通常不公开<\/td>\n<td>不公开<\/td>\n<td>字节码一定公开，源码通常公开<\/td>\n<\/tr>\n<tr>\n<td>谁能调用<\/td>\n<td>经过鉴权的用户<\/td>\n<td>经过 KYC 的用户<\/td>\n<td><strong>任何地址、任何合约<\/strong><\/td>\n<\/tr>\n<tr>\n<td>出错后能否回滚<\/td>\n<td>可以改数据库<\/td>\n<td>可以改内部账本<\/td>\n<td>交易不可逆，只能靠升级或社会共识<\/td>\n<\/tr>\n<tr>\n<td>修复速度<\/td>\n<td>分钟级热修复<\/td>\n<td>分钟级<\/td>\n<td>需要升级权限；没有权限就不能修<\/td>\n<\/tr>\n<tr>\n<td>攻击成本<\/td>\n<td>需要绕过防火墙等<\/td>\n<td>需要盗号或攻破内部系统<\/td>\n<td>只需要一笔交易的 gas，闪电贷还能免费借到本金<\/td>\n<\/tr>\n<tr>\n<td>失败后果<\/td>\n<td>数据泄露<\/td>\n<td>交易所赔付（如 SAFU）<\/td>\n<td>资金直接被转走，通常无赔付<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>读表要点：<\/strong><\/p>\n<ul>\n<li>合约没有&quot;边界防火墙&quot;。public 函数就是对全世界开放的 API。<\/li>\n<li>合约的攻击者不需要本金。闪电贷（Flash Loan）可以在一笔交易内借出上亿美元（见 <a href=\"#c07\" data-nav=\"c07\">07 章<\/a>）。<\/li>\n<li>合约的修复能力和攻击面是一回事：能升级，就意味着升级密钥可能被盗（见 <a href=\"#c09\" data-nav=\"c09\">09 章<\/a>）。<\/li>\n<\/ul>\n<blockquote class=\"warn\"><p>⚠️ 警告：CEX 的用户资产最终也依赖合约安全。交易所的冷钱包可能是多签合约（例如 Safe）。2025 年 2 月 Bybit 被盗约 15 亿美元，攻击者篡改了 Safe{Wallet} 前端，让签名人签下了替换多签实现合约的交易（公开分析报告）。详见 <a href=\"#c13\" data-nav=\"c13\">13 章<\/a>。<\/p>\n<\/blockquote>\n<hr>\n<h2>3. 攻击面地图<\/h2>\n<h3>3.1 一笔交易会经过哪些环节<\/h3>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart LR\n  U[&quot;用户 / 攻击者 EOA&quot;] --&gt; W[&quot;钱包与前端&lt;br/&gt;签名界面&quot;]\n  W --&gt; M[&quot;内存池 Mempool&lt;br/&gt;公开排队&quot;]\n  M --&gt; B[&quot;区块构建者 / 排序器&quot;]\n  B --&gt; C[&quot;目标合约&lt;br/&gt;业务逻辑&quot;]\n  C --&gt; X[&quot;外部合约&lt;br/&gt;代币 / DEX / 预言机&quot;]\n  C --&gt; P[&quot;代理与实现&lt;br/&gt;升级权限&quot;]\n  X --&gt; C\n  C --&gt; BR[&quot;跨链桥 / 消息层&quot;]\n  BR --&gt; C2[&quot;另一条链上的合约&quot;]\n  classDef hot fill:#fbe2e6,stroke:#d9364c;\n  class W,M,X,P,BR hot;<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul>\n<li>红色节点是&quot;信任边界&quot;。数据和控制权在这里跨越，漏洞最集中。<\/li>\n<li>箭头 X → C 表示<strong>回调<\/strong>：外部合约可以在你的函数执行中途调回来。重入就发生在这里（<a href=\"#c03\" data-nav=\"c03\">03 章<\/a>）。<\/li>\n<li>内存池和区块构建者决定交易<strong>顺序<\/strong>。顺序可以被利用（<a href=\"#c08\" data-nav=\"c08\">08 章<\/a>）。<\/li>\n<li>局限：这张图没有画链本身的共识层。链被攻破（例如 51% 攻击或验证者私钥泄露）时，合约代码正确也没用（<a href=\"#c11\" data-nav=\"c11\">11 章<\/a>）。<\/li>\n<\/ul>\n<h3>3.2 漏洞六大类<\/h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>类别<\/th>\n<th>一句话<\/th>\n<th>典型漏洞<\/th>\n<th>章节<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>① 控制流<\/td>\n<td>外部调用让攻击者&quot;插队&quot;执行<\/td>\n<td>重入、只读重入、回调<\/td>\n<td><a href=\"#c03\" data-nav=\"c03\">03<\/a>、<a href=\"#c06\" data-nav=\"c06\">06<\/a><\/td>\n<\/tr>\n<tr>\n<td>② 权限<\/td>\n<td>不该调用的人调用了<\/td>\n<td>缺少修饰器、<code>tx.origin<\/code>、未初始化、私钥泄露<\/td>\n<td><a href=\"#c04\" data-nav=\"c04\">04<\/a>、<a href=\"#c09\" data-nav=\"c09\">09<\/a><\/td>\n<\/tr>\n<tr>\n<td>③ 数学<\/td>\n<td>数字算错了<\/td>\n<td>溢出、精度损失、舍入方向、金库通胀<\/td>\n<td><a href=\"#c05\" data-nav=\"c05\">05<\/a><\/td>\n<\/tr>\n<tr>\n<td>④ 数据可信度<\/td>\n<td>合约相信了可被操纵的数据<\/td>\n<td>现货价预言机、闪电贷、签名重放<\/td>\n<td><a href=\"#c07\" data-nav=\"c07\">07<\/a>、<a href=\"#c08\" data-nav=\"c08\">08<\/a><\/td>\n<\/tr>\n<tr>\n<td>⑤ 经济设计<\/td>\n<td>代码按规格执行，但规格本身可被套利<\/td>\n<td>治理攻击、清算漏洞、坏账<\/td>\n<td><a href=\"#c10\" data-nav=\"c10\">10<\/a><\/td>\n<\/tr>\n<tr>\n<td>⑥ 系统与运营<\/td>\n<td>代码之外的环节失守<\/td>\n<td>跨链验证、多签私钥、前端篡改、编译器 bug<\/td>\n<td><a href=\"#c11\" data-nav=\"c11\">11<\/a>、<a href=\"#c12\" data-nav=\"c12\">12<\/a><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<blockquote class=\"info\"><p>💡 注意：真实事故通常是<strong>多类叠加<\/strong>。例如 2023 年 Euler 事故 = 业务逻辑缺陷（⑤）+ 闪电贷放大（④）。审计时不能只按清单逐项打勾。<\/p>\n<\/blockquote>\n<hr>\n<h2>4. 威胁建模：攻击者能控制什么<\/h2>\n<p>威胁建模（Threat Modeling）：在写代码前，列出攻击者能控制的输入、能触发的路径、想得到的结果。<\/p>\n<h3>4.1 攻击者的能力清单<\/h3>\n<p>对任意一个合约，默认攻击者<strong>能<\/strong>做到以下事情：<\/p>\n<ol>\n<li>用任意参数调用任意 <code>public<\/code> / <code>external<\/code> 函数。<\/li>\n<li>部署自己的合约，让你的合约调用它（恶意代币、恶意回调）。<\/li>\n<li>在一笔交易内借到巨额资金（闪电贷）。<\/li>\n<li>看到内存池中的待确认交易，并在它前后插入自己的交易。<\/li>\n<li>直接向你的合约转入代币或 ETH，不经过你的函数（&quot;捐赠&quot;）。<\/li>\n<li>读取你合约的全部存储，包括 <code>private<\/code> 变量。<\/li>\n<li>在另一条链或另一个合约上重放你签过的消息。<\/li>\n<\/ol>\n<p>攻击者<strong>通常不能<\/strong>做到：<\/p>\n<ol>\n<li>伪造他人的 ECDSA 签名（除非私钥泄露或签名验证写错）。<\/li>\n<li>修改已经确认的区块（除非链的共识被攻破）。<\/li>\n<li>让 <code>msg.sender<\/code> 变成别人（除非你的代码用了 <code>tx.origin<\/code> 或错误的 meta-tx 逻辑）。<\/li>\n<\/ol>\n<h3>4.2 建模步骤<\/h3>\n<ol>\n<li>列出合约持有的资产。例如：用户存入的 USDT、协议手续费。<\/li>\n<li>列出每个改变资产的函数。标注谁可以调用。<\/li>\n<li>写出不变量（Invariant）：在任何操作之后都必须成立的式子。例如&quot;合约 USDT 余额 ≥ 所有用户存款之和&quot;。<\/li>\n<li>对每个函数问：攻击者控制哪些输入？函数里有哪些外部调用？外部调用之前状态是否已更新？<\/li>\n<li>对每个外部数据问：价格、余额、签名从哪里来？一笔交易内能否被操纵？<\/li>\n<li>对每个特权角色问：私钥在谁手里？被盗后最大损失是多少？有没有时间锁？<\/li>\n<\/ol>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart TD\n  A[&quot;资产清单&quot;] --&gt; B[&quot;入口函数清单&lt;br/&gt;谁能调用&quot;]\n  B --&gt; C[&quot;不变量&lt;br/&gt;必须恒成立的式子&quot;]\n  C --&gt; D{&quot;每个函数：&lt;br/&gt;能否打破不变量？&quot;}\n  D -- &quot;外部调用&quot; --&gt; E[&quot;控制流风险&lt;br/&gt;03 / 06 章&quot;]\n  D -- &quot;外部数据&quot; --&gt; F[&quot;数据可信度风险&lt;br/&gt;07 / 08 章&quot;]\n  D -- &quot;特权角色&quot; --&gt; G[&quot;权限风险&lt;br/&gt;04 / 09 章&quot;]\n  D -- &quot;数学运算&quot; --&gt; H[&quot;精度风险&lt;br/&gt;05 章&quot;]\n  E &amp; F &amp; G &amp; H --&gt; I[&quot;测试：模糊测试 + 不变量测试&lt;br/&gt;12 章&quot;]<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul>\n<li>不变量是整个安全工作的锚点。所有测试最终都在验证不变量。<\/li>\n<li>四个分支对应四类最常见的根因。每一类都有专门章节。<\/li>\n<li>局限：威胁建模依赖人的想象力。经济攻击（⑤类）常常超出单个合约的边界，需要把整个协议和外部市场一起建模。<\/li>\n<\/ul>\n<hr>\n<h2>5. 损失的规模与趋势<\/h2>\n<p>以下数字来自公开报道和安全公司年度统计，金额为事发时美元估值约数：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>年份<\/th>\n<th>代表事件<\/th>\n<th>约损失<\/th>\n<th>类别<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>2016<\/td>\n<td>The DAO（以太坊）<\/td>\n<td>约 6,000 万美元<\/td>\n<td>重入<\/td>\n<\/tr>\n<tr>\n<td>2017<\/td>\n<td>Parity 多签库被自毁<\/td>\n<td>约 51 万 ETH 被永久冻结<\/td>\n<td>初始化 / 权限<\/td>\n<\/tr>\n<tr>\n<td>2021<\/td>\n<td>Poly Network（多链）<\/td>\n<td>约 6.1 亿美元（后归还）<\/td>\n<td>跨链验证<\/td>\n<\/tr>\n<tr>\n<td>2022<\/td>\n<td>Ronin Bridge<\/td>\n<td>约 6.2 亿美元<\/td>\n<td>验证者私钥<\/td>\n<\/tr>\n<tr>\n<td>2022<\/td>\n<td>BNB Chain Token Hub<\/td>\n<td>增发 200 万 BNB（约 5.7 亿美元），约 1 亿多美元被转出<\/td>\n<td>跨链证明验证<\/td>\n<\/tr>\n<tr>\n<td>2023<\/td>\n<td>Euler Finance<\/td>\n<td>约 1.97 亿美元（大部分归还）<\/td>\n<td>业务逻辑<\/td>\n<\/tr>\n<tr>\n<td>2025<\/td>\n<td>Bybit（Safe 多签）<\/td>\n<td>约 15 亿美元<\/td>\n<td>前端与签名界面<\/td>\n<\/tr>\n<tr>\n<td>2025<\/td>\n<td>Balancer V2<\/td>\n<td>约 1.28 亿美元<\/td>\n<td>舍入误差<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>读表要点：<\/strong><\/p>\n<ul>\n<li>早期事故集中在<strong>代码漏洞<\/strong>（重入、溢出）。编译器和库成熟后，这类漏洞减少。<\/li>\n<li>近年最大损失转向<strong>跨链桥<\/strong>和<strong>运营安全<\/strong>（私钥、多签、前端）。代码审计覆盖不到这些环节。<\/li>\n<li>数学精度类漏洞没有消失。2025 年 Balancer 事故说明，成熟协议也会在舍入方向上出错。<\/li>\n<\/ul>\n<p>全部案例的筛选和对比，打开 <a href=\"#lab-incident-explorer\" data-nav=\"lab-incident-explorer\" class=\"lab-link\">incident-explorer.html<\/a>。<\/p>\n<hr>\n<h2>6. 以太坊与三条链的扩展视角<\/h2>\n<p>本手册的扩展案例以以太坊主网为参照，再延伸到三条链。它们代表四种不同的执行环境：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>链<\/th>\n<th>类型<\/th>\n<th>和以太坊的关系<\/th>\n<th>学习重点<\/th>\n<th>专题<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>以太坊主网<\/td>\n<td>L1，EVM 原件，PoS 共识<\/td>\n<td>参照环境<\/td>\n<td>绝大多数漏洞模式的首发地：重入、舍入、预言机、回调授权、升级与应急权限、签名界面<\/td>\n<td><a href=\"#k00\" data-nav=\"k00\">C00<\/a><\/td>\n<\/tr>\n<tr>\n<td>BNB Chain（BSC）<\/td>\n<td>独立 L1，EVM 兼容，PoSA 共识<\/td>\n<td>字节码兼容，参数不同<\/td>\n<td>分叉项目改参数出错、低流动性预言机、跨链桥<\/td>\n<td><a href=\"#k01\" data-nav=\"k01\">C01<\/a><\/td>\n<\/tr>\n<tr>\n<td>TRON<\/td>\n<td>独立 L1，TVM（EVM 的变体）<\/td>\n<td>Solidity 可编译，但部分操作码语义不同<\/td>\n<td>USDT 返回值、能量模型、账户权限、地址格式<\/td>\n<td><a href=\"#k02\" data-nav=\"k02\">C02<\/a><\/td>\n<\/tr>\n<tr>\n<td>Mantle<\/td>\n<td>以太坊 L2（OP Stack 系）<\/td>\n<td>继承以太坊安全，但原生 gas 代币是 MNT<\/td>\n<td><code>msg.value<\/code> 是 MNT、L2 信任假设、升级多签、提款延迟<\/td>\n<td><a href=\"#k03\" data-nav=\"k03\">C03<\/a><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<blockquote class=\"info\"><p>💡 注意：&quot;EVM 兼容&quot;不等于&quot;行为一致&quot;。把以太坊上审计过的合约原样部署到另一条链，审计结论不能直接复用。三个专题各有一份&quot;迁移检查清单&quot;。<\/p>\n<\/blockquote>\n<hr>\n<h2>7. 术语表<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>术语<\/th>\n<th>英文<\/th>\n<th>定义<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>智能合约<\/td>\n<td>Smart Contract<\/td>\n<td>部署在链上、自动执行、可持有资产的程序<\/td>\n<\/tr>\n<tr>\n<td>外部账户<\/td>\n<td>EOA, Externally Owned Account<\/td>\n<td>由私钥控制的账户，可以发起交易<\/td>\n<\/tr>\n<tr>\n<td>不变量<\/td>\n<td>Invariant<\/td>\n<td>任何操作后都必须成立的条件<\/td>\n<\/tr>\n<tr>\n<td>威胁模型<\/td>\n<td>Threat Model<\/td>\n<td>对攻击者能力、目标和攻击路径的结构化描述<\/td>\n<\/tr>\n<tr>\n<td>可组合性<\/td>\n<td>Composability<\/td>\n<td>合约可以自由调用其他合约，像积木一样拼装<\/td>\n<\/tr>\n<tr>\n<td>闪电贷<\/td>\n<td>Flash Loan<\/td>\n<td>同一笔交易内借出并归还的无抵押贷款<\/td>\n<\/tr>\n<tr>\n<td>内存池<\/td>\n<td>Mempool<\/td>\n<td>节点中等待打包的公开交易队列<\/td>\n<\/tr>\n<tr>\n<td>信任边界<\/td>\n<td>Trust Boundary<\/td>\n<td>数据或控制权从可信方进入不可信方的位置<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2>8. 思考题<\/h2>\n<ol>\n<li>一个合约把所有关键变量都声明为 <code>private<\/code>。这能防止攻击者读取这些值吗？为什么？<\/li>\n<li>为你熟悉的一个 DeFi 协议（例如借贷协议）写出 3 个不变量。<\/li>\n<li>打开 <a href=\"#lab-incident-explorer\" data-nav=\"lab-incident-explorer\" class=\"lab-link\">incident-explorer.html<\/a>，按类别统计损失。哪一类损失最大？它是&quot;代码漏洞&quot;还是&quot;代码之外&quot;的问题？<\/li>\n<\/ol>\n<p>下一章：<a href=\"#c02\" data-nav=\"c02\">02 EVM 与 Solidity 安全基础<\/a> —— 理解合约运行的机器，才能理解漏洞从哪里来。<\/p>\n"}, "c02": {"id": "c02", "file": "02-evm-solidity-basics.md", "title": "02 EVM 与 Solidity 安全基础：先看懂这台机器", "group": "g1", "html": "<h1>02 EVM 与 Solidity 安全基础：先看懂这台机器<\/h1>\n<blockquote class=\"\"><p>学习目标：读完本章，你能——<\/p>\n<ol>\n<li>区分 <code>msg.sender<\/code>、<code>tx.origin<\/code>、<code>address(this)<\/code>，并说清 <code>call<\/code>、<code>delegatecall<\/code>、<code>staticcall<\/code> 的差别。<\/li>\n<li>画出一个合约的存储槽布局，包括变量打包、映射和动态数组的位置。<\/li>\n<li>说出 Solidity 中最容易误解的 8 个语言特性及其安全影响。<\/li>\n<\/ol>\n<p>前置章节：<a href=\"#c01\" data-nav=\"c01\">01 合约安全全景<\/a><br>交互实验：<a href=\"#lab-storage-proxy-lab\" data-nav=\"lab-storage-proxy-lab\" class=\"lab-link\">storage-proxy-lab.html<\/a><\/p>\n<\/blockquote>\n<hr>\n<h2>1. 一句话理解<\/h2>\n<p><strong>EVM 是一台单线程的栈式计算机。每个合约有自己的代码和存储；合约之间靠&quot;消息调用&quot;通信；每次调用都可能把控制权交给别人。<\/strong><\/p>\n<p>以太坊虚拟机（EVM, Ethereum Virtual Machine）：执行合约字节码的虚拟机。BNB Chain 和 Mantle 直接使用 EVM；TRON 使用兼容 EVM 的 TVM（差异见 <a href=\"#k02\" data-nav=\"k02\">C02<\/a>）。<\/p>\n<blockquote class=\"analogy\"><p>🎯 打个比方：EVM 像一个<strong>只有一个窗口的政务大厅<\/strong>。<\/p>\n<ul>\n<li>每个合约是一个科室。科室有自己的档案柜（storage）和办事规程（code）。<\/li>\n<li>科室 A 要找科室 B 办事，就派人带着材料（calldata）去 B 的窗口（call）。B 处理完再回来。<\/li>\n<li><code>delegatecall<\/code> 是另一种方式：A 把 B 的<strong>规程手册借过来<\/strong>，在 <strong>A 自己的档案柜<\/strong>上按 B 的规程操作。如果 B 的手册写着&quot;把第 0 号抽屉清空&quot;，被清空的是 A 的第 0 号抽屉。<\/li>\n<\/ul>\n<p>比喻的局限：真实的大厅里，你离开窗口后就不能插队回来。EVM 里，科室 B 办事中途可以<strong>反过来再找 A<\/strong>，此时 A 的上一件事还没办完。这就是重入。<\/p>\n<\/blockquote>\n<hr>\n<h2>2. 账户、交易与调用上下文<\/h2>\n<h3>2.1 两类账户<\/h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>账户<\/th>\n<th>英文<\/th>\n<th>有无代码<\/th>\n<th>能否主动发起交易<\/th>\n<th>控制者<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>外部账户<\/td>\n<td>EOA<\/td>\n<td>无（EIP-7702 委托后可以有）<\/td>\n<td>能<\/td>\n<td>私钥<\/td>\n<\/tr>\n<tr>\n<td>合约账户<\/td>\n<td>Contract Account<\/td>\n<td>有<\/td>\n<td>不能，只能被调用<\/td>\n<td>代码<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<blockquote class=\"info\"><p>💡 注意：EIP-7702（以太坊 Pectra 升级，2025 年 5 月上线）允许 EOA 委托执行一段合约代码。因此 <code>extcodesize(addr) == 0<\/code> 和 <code>msg.sender == tx.origin<\/code> 都<strong>不能<\/strong>再作为&quot;调用者是普通用户&quot;的可靠判断。<\/p>\n<\/blockquote>\n<h3>2.2 调用上下文中的四个变量<\/h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>变量<\/th>\n<th>含义<\/th>\n<th>在 A → B → C 调用链中，C 看到的值<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>tx.origin<\/code><\/td>\n<td>发起整笔交易的 EOA<\/td>\n<td>用户 EOA<\/td>\n<\/tr>\n<tr>\n<td><code>msg.sender<\/code><\/td>\n<td>直接调用当前函数的地址<\/td>\n<td>B<\/td>\n<\/tr>\n<tr>\n<td><code>msg.value<\/code><\/td>\n<td>本次调用附带的原生币数量<\/td>\n<td>B 转给 C 的数量<\/td>\n<\/tr>\n<tr>\n<td><code>address(this)<\/code><\/td>\n<td>当前执行代码的合约地址<\/td>\n<td>C<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<blockquote class=\"warn\"><p>⚠️ 警告：不要用 <code>tx.origin<\/code> 做权限判断。如果 owner 被骗去调用一个恶意合约，恶意合约再调用你的合约，<code>tx.origin<\/code> 仍然是 owner。详见 <a href=\"#c04\" data-nav=\"c04\">04 章<\/a>。<\/p>\n<\/blockquote>\n<h3>2.3 三种调用方式<\/h3>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">sequenceDiagram\n  autonumber\n  participant U as 用户 EOA\n  participant A as 合约 A\n  participant B as 合约 B\n  U-&gt;&gt;A: 调用 A.foo()\n  Note over A: msg.sender = 用户\n  A-&gt;&gt;B: call B.bar()\n  Note over B: 使用 B 的存储&lt;br/&gt;msg.sender = A&lt;br/&gt;address(this) = B\n  B--&gt;&gt;A: 返回\n  A-&gt;&gt;B: delegatecall B.bar()\n  Note over A: 执行 B 的代码&lt;br/&gt;使用 A 的存储&lt;br/&gt;msg.sender = 用户&lt;br/&gt;address(this) = A\n  A-&gt;&gt;B: staticcall B.view()\n  Note over B: 只读：任何写存储&lt;br/&gt;或发事件都会回滚<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul>\n<li><code>call<\/code>：执行 B 的代码，修改 B 的存储。最常见。<\/li>\n<li><code>delegatecall<\/code>：执行 B 的代码，修改 <strong>A<\/strong> 的存储，<code>msg.sender<\/code> 和 <code>msg.value<\/code> 保持不变。代理合约（Proxy）和库合约依赖它。<\/li>\n<li><code>staticcall<\/code>：只读调用。<code>view<\/code> 函数被外部调用时使用。<\/li>\n<li>局限：低级 <code>call<\/code> 失败时<strong>不会自动回滚<\/strong>调用者，只返回 <code>false<\/code>。忘记检查返回值是 <a href=\"#c06\" data-nav=\"c06\">06 章<\/a> 的主题。<\/li>\n<\/ul>\n<p>去 <a href=\"#lab-storage-proxy-lab\" data-nav=\"lab-storage-proxy-lab\" class=\"lab-link\">storage-proxy-lab.html<\/a> 的&quot;call vs delegatecall&quot;小节，逐步观察四个变量的变化。<\/p>\n<hr>\n<h2>3. 存储布局：漏洞的藏身处<\/h2>\n<h3>3.1 槽位规则<\/h3>\n<p>存储（Storage）：每个合约持有的一个巨大键值表，键和值都是 32 字节。键叫&quot;槽位&quot;（slot）。<\/p>\n<div class=\"lv-figcap\"><span>图 · Layout 合约的槽位分配<\/span><span class=\"new\">新增图解<\/span><\/div><div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart TB\n  O[\"owner：20 字节\"] --&gt; S0[\"slot 0&lt;br/&gt;owner + paused\"]\n  P[\"paused：1 字节\"] --&gt; S0\n  F[\"fee：12 字节\"] --&gt;|\"20+1+12 = 33 &gt; 32&lt;br/&gt;放不下\"| S1[\"slot 1：fee\"]\n  T[\"total：uint256\"] --&gt; S2[\"slot 2：total\"]\n  B[\"bal：mapping\"] --&gt; S3[\"slot 3：本身为空\"]\n  S3 --&gt;|\"keccak256(abi.encode(k, p))\"| H[\"bal 元素在哈希位置\"]\n  C[\"constant / immutable\"] --&gt;|\"不占槽\"| N[\"写进代码\"]<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul><li><strong>数据流：<\/strong>状态变量按声明顺序从 slot 0 开始依次分配。<\/li><li><strong>关键：<\/strong>能否打包只看当前槽剩余空间放不放得下。<\/li><li><strong>局限：<\/strong>mapping 的槽位本身是空的，元素散落在哈希算出的位置。<\/li><li><strong>风险：<\/strong>变量顺序一变，后面所有槽位都会错位，这是升级漏洞的根源。<\/li><\/ul>\n\n<ol>\n<li>状态变量按声明顺序从 slot 0 开始分配。<\/li>\n<li>如果相邻变量合计不超过 32 字节，编译器把它们<strong>打包<\/strong>进同一个槽。<\/li>\n<li><code>mapping(k =&gt; v)<\/code> 本身占一个槽 p（内容为空）。元素 <code>m[k]<\/code> 位于 <code>keccak256(abi.encode(k, p))<\/code>。<\/li>\n<li>动态数组占一个槽 p，存长度。元素 <code>a[i]<\/code> 位于 <code>keccak256(p) + i<\/code>。<\/li>\n<li>常量（<code>constant<\/code>）和不可变量（<code>immutable<\/code>）不占存储槽。<\/li>\n<\/ol>\n<div class=\"code-wrap\"><pre><code class=\"language-solidity\">contract Layout {\n    address owner;        // slot 0：20 字节\n    bool    paused;       // slot 0：1 字节，与 owner 打包\n    uint96  fee;          // slot 1：12 字节，slot 0 已放不下（20+1+12 = 33 &gt; 32）\n    uint256 total;        // slot 2\n    mapping(address =&gt; uint256) bal; // slot 3（内容在哈希位置）\n}\n<\/code><\/pre><\/div>\n<blockquote class=\"info\"><p>💡 注意：<code>fee<\/code> 放不进 slot 0，所以它从 slot 1 开始，<code>total<\/code> 在 slot 2。打包规则按&quot;剩余空间能否放下&quot;判断。如果把 <code>fee<\/code> 改成 <code>uint88<\/code>（11 字节），三个变量正好 32 字节，全部挤进 slot 0。<\/p>\n<\/blockquote>\n<h3>3.2 存储布局为什么是安全问题<\/h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>场景<\/th>\n<th>风险<\/th>\n<th>章节<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>代理合约与实现合约的变量顺序不一致<\/td>\n<td>实现合约写 <code>owner<\/code>，实际改写了代理的 <code>implementation<\/code><\/td>\n<td><a href=\"#c09\" data-nav=\"c09\">09<\/a><\/td>\n<\/tr>\n<tr>\n<td>升级时在中间插入新变量<\/td>\n<td>后面的变量全部错位，余额被当成地址读取<\/td>\n<td><a href=\"#c09\" data-nav=\"c09\">09<\/a><\/td>\n<\/tr>\n<tr>\n<td><code>private<\/code> 变量存放密码或种子<\/td>\n<td>任何人用 <code>eth_getStorageAt<\/code> 都能读出<\/td>\n<td>本章 4 节<\/td>\n<\/tr>\n<tr>\n<td>用 <code>delegatecall<\/code> 调用不受信任的合约<\/td>\n<td>对方代码可以改写你的任何槽位，甚至自毁<\/td>\n<td><a href=\"#c04\" data-nav=\"c04\">04<\/a><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>EIP-1967 为代理定义了固定的&quot;随机&quot;槽位，避免和实现合约冲突。例如实现地址槽：<\/p>\n<div class=\"code-wrap\"><pre><code>bytes32(uint256(keccak256(&quot;eip1967.proxy.implementation&quot;)) - 1)\n= 0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc\n<\/code><\/pre><\/div>\n<hr>\n<h2>4. 最容易误解的 8 个语言特性<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>特性<\/th>\n<th>常见误解<\/th>\n<th>事实<\/th>\n<th>安全影响<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td><code>private<\/code><\/td>\n<td>别人看不到<\/td>\n<td>只限制其他合约<strong>调用<\/strong>，存储完全公开<\/td>\n<td>不能存秘密<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><code>receive<\/code> / <code>fallback<\/code><\/td>\n<td>转账只是改余额<\/td>\n<td>向合约转 ETH 会执行它的代码<\/td>\n<td>重入入口<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><code>selfdestruct<\/code><\/td>\n<td>可以删除合约<\/td>\n<td>EIP-6780（2024 年 Cancun）后，只有同一交易内创建的合约才会被删除；其他情况只转走余额<\/td>\n<td>强制转入 ETH 仍可发生<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>合约余额<\/td>\n<td>只能通过我的函数增加<\/td>\n<td>任何人可强制转入（<code>selfdestruct<\/code>、出块奖励地址、直接转代币）<\/td>\n<td>用 <code>address(this).balance<\/code> 记账会被&quot;捐赠&quot;操纵<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>检查型算术<\/td>\n<td>0.8 以后不会出错<\/td>\n<td>溢出会回滚，但 <code>unchecked {}<\/code> 块、类型转换（<code>uint8(x)<\/code>）、除法截断不会报错<\/td>\n<td><a href=\"#c05\" data-nav=\"c05\">05 章<\/a><\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td><code>block.timestamp<\/code><\/td>\n<td>精确时间<\/td>\n<td>出块者可在小范围内调整；L2 由排序器决定<\/td>\n<td>不能做随机数，不能做秒级判断<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td><code>block.number<\/code><\/td>\n<td>每块固定时间<\/td>\n<td>BSC 已从 3 秒缩短到 0.45 秒（2026 年 1 月 Fermi）；L2 的语义因链而异<\/td>\n<td>用区块数计算利息或锁定期会出错（<a href=\"#k01\" data-nav=\"k01\">C01<\/a>、<a href=\"#k03\" data-nav=\"k03\">C03<\/a>）<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>函数选择器<\/td>\n<td>函数名唯一<\/td>\n<td>选择器只有 4 字节，不同签名可能碰撞<\/td>\n<td>2021 年 Poly Network 事故的关键一步（<a href=\"#c11\" data-nav=\"c11\">11 章<\/a>）<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2>5. Gas、回滚与错误处理<\/h2>\n<ol>\n<li>每条指令消耗 gas。gas 用完，当前调用帧回滚。<\/li>\n<li><code>require(cond, &quot;msg&quot;)<\/code> 和自定义错误 <code>revert Err()<\/code> 回滚当前调用，并向上冒泡。<\/li>\n<li>低级 <code>call<\/code> 失败<strong>不冒泡<\/strong>，只返回 <code>(false, returndata)<\/code>。<\/li>\n<li><code>try/catch<\/code> 只能捕获外部调用的失败，不能捕获本合约内部的失败。<\/li>\n<li>外部调用最多转发 63/64 的剩余 gas（EIP-150）。被调用方耗尽 gas 时，调用方还有 1/64 可以收尾。<\/li>\n<\/ol>\n<div class=\"lv-figcap\"><span>图 · 不同失败方式如何传播<\/span><span class=\"new\">新增图解<\/span><\/div><div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart TB\n  E[\"调用中出错\"] --&gt; Q{\"哪种失败？\"}\n  Q --&gt;|\"require / revert\"| R1[\"回滚当前调用\"]\n  R1 --&gt; R1b[\"向上冒泡给调用方\"]\n  Q --&gt;|\"低级 call 失败\"| R2[\"不冒泡\"]\n  R2 --&gt; R2b[\"只返回 false 和 returndata\"]\n  R2b --&gt; K[\"调用方必须自己检查\"]\n  Q --&gt;|\"gas 用完\"| R3[\"当前调用帧回滚\"]\n  R3 --&gt; R3b[\"调用方还剩 1/64 gas 收尾\"]\n  Q --&gt;|\"想用 try/catch\"| T[\"只能捕获外部调用失败\"]<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul><li><strong>数据流：<\/strong>require 和自定义错误会一路向上冒泡，整条调用链一起回滚。<\/li><li><strong>出错点：<\/strong>低级 call 失败时外层照常往下执行，除非你检查返回值。<\/li><li><strong>局限：<\/strong>try/catch 抓不到本合约内部的失败。<\/li><li><strong>关键：<\/strong>EIP-150 只转发 63/64 的 gas，所以调用方总能留一点 gas 收尾。<\/li><\/ul>\n\n<blockquote class=\"warn\"><p>⚠️ 警告：<code>transfer()<\/code> 和 <code>send()<\/code> 只转发 2300 gas。它们曾被当作防重入手段。gas 价格调整（例如 EIP-1884、EIP-2929）后，这种写法会让接收方是合约钱包时转账失败。现在的推荐做法是：用 <code>call<\/code> 转账，并用 CEI 或重入锁防重入（<a href=\"#c03\" data-nav=\"c03\">03 章<\/a>）。<\/p>\n<\/blockquote>\n<hr>\n<h2>6. 编译器与版本<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>版本区间<\/th>\n<th>关键变化<\/th>\n<th>安全含义<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>&lt; 0.8.0<\/td>\n<td>算术默认不检查溢出<\/td>\n<td>必须使用 SafeMath<\/td>\n<\/tr>\n<tr>\n<td>≥ 0.8.0<\/td>\n<td>算术默认检查，溢出回滚<\/td>\n<td><code>unchecked<\/code> 块内仍会回绕<\/td>\n<\/tr>\n<tr>\n<td>≥ 0.8.24<\/td>\n<td>支持 <code>transient<\/code> 存储（EIP-1153 的 TSTORE/TLOAD）<\/td>\n<td>可以实现低成本重入锁；跨链部署要确认目标链支持（TRON 需相应硬分叉开关，见 <a href=\"#k02\" data-nav=\"k02\">C02<\/a>）<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<blockquote class=\"info\"><p>💡 注意：编译器本身也会有 bug。2023 年 7 月，Vyper 0.2.15、0.2.16、0.3.0 的 <code>@nonreentrant<\/code> 锁实现错误，导致多个 Curve 池被重入，损失约 7,000 万美元（项目方与安全公司公开复盘）。锁定编译器版本，并关注编译器的已知 bug 列表。<\/p>\n<\/blockquote>\n<hr>\n<h2>7. 术语表<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>术语<\/th>\n<th>英文<\/th>\n<th>定义<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>存储槽<\/td>\n<td>Storage Slot<\/td>\n<td>合约存储中 32 字节的键位<\/td>\n<\/tr>\n<tr>\n<td>调用数据<\/td>\n<td>Calldata<\/td>\n<td>调用合约时传入的只读输入字节<\/td>\n<\/tr>\n<tr>\n<td>函数选择器<\/td>\n<td>Function Selector<\/td>\n<td><code>keccak256(函数签名)<\/code> 的前 4 字节<\/td>\n<\/tr>\n<tr>\n<td>委托调用<\/td>\n<td>delegatecall<\/td>\n<td>用调用者的存储执行被调用者的代码<\/td>\n<\/tr>\n<tr>\n<td>静态调用<\/td>\n<td>staticcall<\/td>\n<td>禁止修改状态的调用<\/td>\n<\/tr>\n<tr>\n<td>回滚<\/td>\n<td>Revert<\/td>\n<td>撤销当前调用帧的全部状态修改<\/td>\n<\/tr>\n<tr>\n<td>瞬态存储<\/td>\n<td>Transient Storage<\/td>\n<td>只在当前交易内有效的存储，交易结束自动清零<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2>8. 思考题<\/h2>\n<ol>\n<li>合约 A 用 <code>delegatecall<\/code> 调用库合约 L。L 里有一句 <code>owner = msg.sender;<\/code>。执行后，哪个合约的哪个槽位被改了？<code>msg.sender<\/code> 是谁？<\/li>\n<li>一个合约用 <code>require(address(this).balance == totalDeposits)<\/code> 做安全检查。攻击者能让它永久失败吗？怎样做？<\/li>\n<li>打开 <a href=\"#lab-storage-proxy-lab\" data-nav=\"lab-storage-proxy-lab\" class=\"lab-link\">storage-proxy-lab.html<\/a>，选择&quot;在前面插入变量&quot;的升级方案。哪个变量被覆盖了？旧值被解释成了什么？<\/li>\n<\/ol>\n<p>下一章：<a href=\"#c03\" data-nav=\"c03\">03 重入攻击<\/a> —— 最古老、也最常复发的合约漏洞。<\/p>\n"}, "c03": {"id": "c03", "file": "03-reentrancy.md", "title": "03 重入攻击：在你记账之前再取一次钱", "group": "g2", "html": "<h1>03 重入攻击：在你记账之前再取一次钱<\/h1>\n<blockquote class=\"\"><p>学习目标：读完本章，你能——<\/p>\n<ol>\n<li>用调用栈图解释单函数重入、跨函数重入、跨合约重入和只读重入。<\/li>\n<li>写出符合 CEI 模式的提款函数，并说明重入锁的适用边界。<\/li>\n<li>在代码审查中找出所有&quot;把控制权交出去&quot;的位置。<\/li>\n<\/ol>\n<p>前置章节：<a href=\"#c02\" data-nav=\"c02\">02 EVM 与 Solidity 安全基础<\/a><br>交互实验：<a href=\"#lab-reentrancy-lab\" data-nav=\"lab-reentrancy-lab\" class=\"lab-link\">reentrancy-lab.html<\/a> ｜ 示例合约：<a href=\"#examples\" data-nav=\"examples\">examples/01-Reentrancy.sol<\/a><\/p>\n<\/blockquote>\n<hr>\n<h2>1. 一句话理解<\/h2>\n<p><strong>合约在更新自己的账本之前，把控制权交给了外部地址；外部地址趁账本还是旧的，再次调用合约。<\/strong><\/p>\n<p>重入（Reentrancy）：一个函数执行尚未结束时，被外部调用再次进入。<\/p>\n<blockquote class=\"analogy\"><p>🎯 打个比方：你去银行取 100 元。柜员先把现金递给你，然后才去改账本。<br>你接过现金的瞬间，你的同伴在旁边窗口说&quot;他要再取 100 元&quot;。柜员查账本——账本上余额还是 100——于是又给了一次。<br>只要柜员一直&quot;先给钱、后改账&quot;，你们就能一直取，直到金库空了。<\/p>\n<p>比喻的局限：现实中柜员是两个人，可以并行。EVM 是单线程的：重入不是&quot;并发&quot;，而是<strong>嵌套<\/strong>——第二次取款完整地发生在第一次取款的中间。<\/p>\n<\/blockquote>\n<hr>\n<h2>2. 威胁模型：攻击者控制了什么<\/h2>\n<p>重入的前提只有两个：<\/p>\n<ol>\n<li>合约在函数中途发起<strong>外部调用<\/strong>，被调用方受攻击者控制。<\/li>\n<li>外部调用发生时，合约的<strong>状态尚未更新<\/strong>到最终值。<\/li>\n<\/ol>\n<p>会把控制权交给外部的操作：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>操作<\/th>\n<th>为什么会交出控制权<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>addr.call{value: x}(&quot;&quot;)<\/code><\/td>\n<td>接收方是合约时，执行它的 <code>receive<\/code> / <code>fallback<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>IERC20(token).transfer(...)<\/code><\/td>\n<td>代币合约由攻击者部署时，代码任意<\/td>\n<\/tr>\n<tr>\n<td>ERC-777 <code>send<\/code> / <code>transfer<\/code><\/td>\n<td>触发接收方的 <code>tokensReceived<\/code> 钩子<\/td>\n<\/tr>\n<tr>\n<td>ERC-721 / ERC-1155 <code>safeTransferFrom<\/code>、<code>_safeMint<\/code><\/td>\n<td>触发接收方的 <code>onERC721Received<\/code> / <code>onERC1155Received<\/code><\/td>\n<\/tr>\n<tr>\n<td>闪电贷回调 <code>onFlashLoan<\/code><\/td>\n<td>设计上就是把控制权交给借款人<\/td>\n<\/tr>\n<tr>\n<td>调用任意用户提供的地址<\/td>\n<td>包括路由器、钩子、预言机<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<blockquote class=\"info\"><p>💡 注意：TRON 上用系统交易 <code>TransferContract<\/code> 转 TRX，<strong>不会<\/strong>执行接收合约的 fallback；用 <code>TriggerSmartContract<\/code> 附带 <code>callValue<\/code> 才会执行（TRON 官方开发文档）。Mantle 上 ETH 以 ERC-20 形式（BVM_ETH）存在，转 ETH 不触发 <code>receive<\/code>，但转原生币 MNT 会触发。同一份代码，在三条链上的回调入口不一样。<\/p>\n<\/blockquote>\n<hr>\n<h2>3. 漏洞机制<\/h2>\n<h3>3.1 单函数重入<\/h3>\n<div class=\"code-wrap\"><pre><code class=\"language-solidity\">// ❌ 漏洞：先转账，后记账\nfunction withdraw() external {\n    uint256 amt = balances[msg.sender];\n    require(amt &gt; 0, &quot;no balance&quot;);\n    (bool ok, ) = msg.sender.call{value: amt}(&quot;&quot;);   // ① 交出控制权\n    require(ok, &quot;send failed&quot;);\n    balances[msg.sender] = 0;                         // ② 太晚了\n}\n<\/code><\/pre><\/div>\n<p>攻击合约：<\/p>\n<div class=\"code-wrap\"><pre><code class=\"language-solidity\">contract Attacker {\n    IBank bank;\n    receive() external payable {\n        if (address(bank).balance &gt;= 1 ether) {\n            bank.withdraw();          // 在 ② 之前再次进入\n        }\n    }\n}\n<\/code><\/pre><\/div>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">sequenceDiagram\n  autonumber\n  participant A as Attacker\n  participant B as Bank\n  A-&gt;&gt;B: withdraw()（余额记录 1 ETH）\n  B-&gt;&gt;A: call{value: 1 ETH}\n  Note over A: receive() 被触发\n  A-&gt;&gt;B: withdraw()（余额记录仍是 1 ETH）\n  B-&gt;&gt;A: call{value: 1 ETH}\n  A-&gt;&gt;B: withdraw() ……\n  Note over B: 金库余额不足，递归停止\n  B--&gt;&gt;A: 最内层返回\n  Note over B: 各层依次执行 balances = 0<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul>\n<li>每一层 <code>withdraw<\/code> 都读到了旧余额 1 ETH。账本清零发生在<strong>所有层返回之后<\/strong>。<\/li>\n<li>递归深度受 gas 和调用深度（1024）限制。攻击者会一次取尽量大的金额，减少层数。<\/li>\n<li>局限：如果 Bank 先清零再转账（CEI），第二层读到 0，攻击直接失败。<\/li>\n<\/ul>\n<h3>3.2 跨函数重入<\/h3>\n<p>攻击者不回到 <code>withdraw<\/code>，而是进入<strong>另一个共享同一状态的函数<\/strong>：<\/p>\n<div class=\"code-wrap\"><pre><code class=\"language-solidity\">function transfer(address to, uint256 amt) external {   // 没有加锁\n    require(balances[msg.sender] &gt;= amt);\n    balances[msg.sender] -= amt;\n    balances[to] += amt;\n}\n<\/code><\/pre><\/div>\n<p>在 <code>receive()<\/code> 里，攻击者调用 <code>transfer(同伙, 1 ether)<\/code>。此时 <code>balances[攻击者]<\/code> 还没清零，余额被转给同伙。外层 <code>withdraw<\/code> 返回后才清零——但钱已经同时&quot;转走&quot;和&quot;提走&quot;了。<\/p>\n<blockquote class=\"warn\"><p>⚠️ 警告：只给 <code>withdraw<\/code> 加 <code>nonReentrant<\/code> 不够。所有读写同一状态的函数都要加同一把锁，或者全部遵循 CEI。<\/p>\n<\/blockquote>\n<h3>3.3 跨合约重入<\/h3>\n<p>协议由多个合约组成，它们共享状态（例如金库合约和份额代币合约）。合约 A 的锁挡不住对合约 B 的调用。B 在此刻读到的是 A 尚未更新的状态。<\/p>\n<h3>3.4 只读重入<\/h3>\n<p>只读重入（Read-only Reentrancy）：攻击者在回调中<strong>不修改<\/strong>目标合约，而是让<strong>第三方协议<\/strong>调用目标合约的 <code>view<\/code> 函数，读到中间状态。<\/p>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart LR\n  A[&quot;攻击者&quot;] --&gt;|&quot;1. 从池子移除流动性&quot;| P[&quot;AMM 池&lt;br/&gt;（先转出代币，后更新总量）&quot;]\n  P --&gt;|&quot;2. 回调攻击者&lt;br/&gt;此时储备已减、总量未减&quot;| A\n  A --&gt;|&quot;3. 调用借贷协议&quot;| L[&quot;借贷协议&quot;]\n  L --&gt;|&quot;4. 读取 pool.getVirtualPrice()&quot;| P\n  P --&gt;|&quot;5. 返回被扭曲的价格&quot;| L\n  L --&gt;|&quot;6. 按错误价格放贷/清算&quot;| A<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul>\n<li>池子自己的状态最终是对的。出错的是<strong>在中间时刻读数据的第三方<\/strong>。<\/li>\n<li>池子的 <code>view<\/code> 函数通常没有加锁，所以 <code>nonReentrant<\/code> 挡不住。<\/li>\n<li>防御方在第三方：读取外部价格前，检查对方的重入锁状态（部分池子提供此接口），或改用不受单笔交易影响的价格源（<a href=\"#c07\" data-nav=\"c07\">07 章<\/a>）。<\/li>\n<\/ul>\n<hr>\n<h2>4. 防御方法<\/h2>\n<h3>4.1 CEI 模式（首选）<\/h3>\n<p>CEI（Checks-Effects-Interactions）：函数按&quot;检查 → 修改状态 → 外部交互&quot;的顺序编写。<\/p>\n<div class=\"code-wrap\"><pre><code class=\"language-solidity\">// ✅ 修复：CEI\nfunction withdraw() external {\n    uint256 amt = balances[msg.sender];          // Checks\n    require(amt &gt; 0, &quot;no balance&quot;);\n    balances[msg.sender] = 0;                    // Effects\n    (bool ok, ) = msg.sender.call{value: amt}(&quot;&quot;); // Interactions\n    require(ok, &quot;send failed&quot;);\n}\n<\/code><\/pre><\/div>\n<h3>4.2 重入锁（第二道防线）<\/h3>\n<div class=\"code-wrap\"><pre><code class=\"language-solidity\">// ✅ 修复：OpenZeppelin ReentrancyGuard（或 0.8.24+ 的瞬态存储版本）\nfunction withdraw() external nonReentrant { ... }\n<\/code><\/pre><\/div>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>方案<\/th>\n<th>优点<\/th>\n<th>局限<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>CEI<\/td>\n<td>零开销，从根本上消除中间状态<\/td>\n<td>复杂函数里难以做到&quot;所有交互都在最后&quot;<\/td>\n<\/tr>\n<tr>\n<td><code>nonReentrant<\/code>（存储锁）<\/td>\n<td>简单，覆盖整个函数<\/td>\n<td>只保护加了锁的函数；不防只读重入；跨合约要共享锁<\/td>\n<\/tr>\n<tr>\n<td>瞬态存储锁（<code>transient<\/code>）<\/td>\n<td>gas 更低<\/td>\n<td>目标链必须支持 EIP-1153（部署前确认，见 <a href=\"#k02\" data-nav=\"k02\">C02<\/a>）<\/td>\n<\/tr>\n<tr>\n<td>拉取式支付（Pull Payment）<\/td>\n<td>用户自己来取，合约不主动推送<\/td>\n<td>体验差一步<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h3>4.3 纵深防御<\/h3>\n<ol>\n<li>把 CEI 当作默认写法。<\/li>\n<li>对所有修改共享状态的外部入口加同一把锁。<\/li>\n<li>不在 <code>view<\/code> 函数中暴露&quot;中间态&quot;可读的关键价格；如果必须暴露，提供锁状态查询。<\/li>\n<li>用不变量测试验证&quot;合约余额 ≥ Σ 用户余额&quot;在任何调用序列后都成立（<a href=\"#c12\" data-nav=\"c12\">12 章<\/a>）。<\/li>\n<\/ol>\n<hr>\n<h2>5. 真实案例<\/h2>\n<h3>5.1 The DAO（2016 年 6 月，以太坊）<\/h3>\n<ul>\n<li>攻击者利用 <code>splitDAO<\/code> 先转账、后更新余额的顺序，递归提取资金。<\/li>\n<li>约 360 万 ETH（事发时约 6,000 万美元）被转入子 DAO。<\/li>\n<li>以太坊社区通过硬分叉回滚，反对者继续维护原链，形成以太坊经典（ETC）。<\/li>\n<li>教训：重入在以太坊早期就被发现，但&quot;先给钱、后记账&quot;至今仍反复出现。<\/li>\n<\/ul>\n<h3>5.2 Curve / Vyper 编译器重入（2023 年 7 月，以太坊）<\/h3>\n<ul>\n<li>合约源码写了 <code>@nonreentrant<\/code>，但 Vyper 0.2.15、0.2.16、0.3.0 生成的锁不正确，不同函数使用了不同的锁槽。<\/li>\n<li>攻击者对使用原生 ETH 的池子发起跨函数重入，损失约 7,000 万美元（多方公开复盘）。<\/li>\n<li>教训：<strong>源码正确不等于字节码正确<\/strong>。审计范围要包括编译器版本，关键协议要做字节码层面的测试。<\/li>\n<\/ul>\n<h3>5.3 BNB Chain 扩展：分叉项目的&quot;回调入口&quot;<\/h3>\n<p>BNB Chain 上大量项目分叉自以太坊协议。常见模式是：原协议只接受白名单代币，分叉项目放开为&quot;任意代币可上架&quot;，但没有给存款函数加锁。攻击者上架一个自己部署的代币，在 <code>transferFrom<\/code> 里回调存款函数，同一笔资产被记账两次。详细机制和检查清单见 <a href=\"#k01\" data-nav=\"k01\">C01 BNB Chain 专题<\/a>。<\/p>\n<blockquote class=\"info\"><p>💡 注意：&quot;允许任意代币&quot;就等于&quot;允许任意回调&quot;。上架流程本身是安全边界。<\/p>\n<\/blockquote>\n<h3>5.4 以太坊扩展：Fei Rari 与 Penpie<\/h3>\n<ul>\n<li><strong>Fei Rari（2022 年 4 月，约 8,000 万美元）<\/strong>：分叉自 Compound 的借贷池在 <code>borrow<\/code> 中先用 <code>call<\/code> 发送 ETH，后写入借款记录。攻击者在回调里调用没有被锁覆盖的 <code>exitMarket()<\/code>，取回了全部抵押品。这是 3.2 节&quot;跨函数重入&quot;的真实版本。<\/li>\n<li><strong>Penpie（2024 年 9 月，约 2,700 万美元）<\/strong>：攻击者无许可创建 Pendle 市场，市场使用恶意代币；Penpie 的批量领取奖励函数没有重入锁，攻击者在回调中存入资产，把存款&quot;变成&quot;奖励。<\/li>\n<\/ul>\n<p>两起事故的根因代码和攻击路径图见 <a href=\"#k00\" data-nav=\"k00\">C00 以太坊专题<\/a> 4.1、4.2 节。<\/p>\n<hr>\n<h2>6. 审计检查点<\/h2>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> 列出所有外部调用（包括代币转账、NFT 安全转账、回调、低级 call）。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 每个外部调用之前，所有相关状态都已更新到最终值？<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 所有读写同一状态的入口，是否共享同一把锁？<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 是否有 <code>view<\/code> 函数在交互期间返回中间状态，并被其他协议用作价格？<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 协议是否支持 ERC-777 或带钩子的代币？如果不支持，是否显式拒绝？<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 编译器版本是否有已知的重入锁 bug？<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 部署链上，原生币转账是否触发 fallback？（TRON、Mantle 与以太坊不同）<\/li>\n<\/ul>\n<hr>\n<h2>7. 用户侧防护<\/h2>\n<p>普通用户看不到合约代码，但可以通过几个公开信号降低风险。<\/p>\n<ol>\n<li>存款前查看协议是否有公开审计报告，审计范围是否覆盖你要用的合约。<\/li>\n<li>新上线、TVL 快速增长、没有审计的金库，只放可以承受损失的金额。<\/li>\n<li>协议宣布暂停或发现漏洞时，先停止存入；按官方渠道的指引操作，不点社交媒体里的&quot;紧急提款&quot;链接。<\/li>\n<li>不要把资产集中在一个协议里；同一个团队的多个产品可能共用同一份有漏洞的代码。<\/li>\n<li>关注协议是否有漏洞赏金计划。没有赏金的项目，漏洞更可能被攻击者先发现。<\/li>\n<\/ol>\n<hr>\n<h2>8. 术语表<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>术语<\/th>\n<th>英文<\/th>\n<th>定义<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>重入<\/td>\n<td>Reentrancy<\/td>\n<td>函数执行尚未结束时被再次进入<\/td>\n<\/tr>\n<tr>\n<td>CEI 模式<\/td>\n<td>Checks-Effects-Interactions<\/td>\n<td>先检查、再改状态、最后外部交互<\/td>\n<\/tr>\n<tr>\n<td>重入锁<\/td>\n<td>Reentrancy Guard / Mutex<\/td>\n<td>函数执行期间拒绝再次进入的标志位<\/td>\n<\/tr>\n<tr>\n<td>只读重入<\/td>\n<td>Read-only Reentrancy<\/td>\n<td>第三方在中间时刻读取目标合约的 <code>view<\/code> 函数<\/td>\n<\/tr>\n<tr>\n<td>钩子<\/td>\n<td>Hook<\/td>\n<td>代币标准中，转账时自动调用接收方的函数<\/td>\n<\/tr>\n<tr>\n<td>拉取式支付<\/td>\n<td>Pull Payment<\/td>\n<td>合约只记账，由收款人主动提取<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2>9. 思考题<\/h2>\n<ol>\n<li>打开 <a href=\"#lab-reentrancy-lab\" data-nav=\"lab-reentrancy-lab\" class=\"lab-link\">reentrancy-lab.html<\/a>，选择&quot;nonReentrant 锁&quot;，再选择&quot;跨函数重入&quot;变体。攻击成功了吗？为什么？<\/li>\n<li>一个 NFT 合约在 <code>mint()<\/code> 中先调用 <code>_safeMint<\/code>，再执行 <code>totalMinted++<\/code>，并用 <code>totalMinted<\/code> 限制最大供应量。攻击者能多铸造吗？<\/li>\n<li>如果一个合约的所有外部函数都加了 <code>nonReentrant<\/code>，它还会受到只读重入的影响吗？受影响的是谁？<\/li>\n<\/ol>\n<p>下一章：<a href=\"#c04\" data-nav=\"c04\">04 访问控制与权限<\/a> —— 不该调用的人调用了。<\/p>\n"}, "c04": {"id": "c04", "file": "04-access-control.md", "title": "04 访问控制与权限：谁有权按这个按钮", "group": "g2", "html": "<h1>04 访问控制与权限：谁有权按这个按钮<\/h1>\n<blockquote class=\"\"><p>学习目标：读完本章，你能——<\/p>\n<ol>\n<li>列出 6 种常见的访问控制缺陷，并为每种写出修复代码。<\/li>\n<li>设计一套&quot;最小权限 + 多签 + 时间锁&quot;的特权角色方案。<\/li>\n<li>区分合约层权限和账户层权限（以 TRON 账户权限为例）。<\/li>\n<\/ol>\n<p>前置章节：<a href=\"#c02\" data-nav=\"c02\">02 EVM 与 Solidity 安全基础<\/a><br>交互实验：<a href=\"#lab-storage-proxy-lab\" data-nav=\"lab-storage-proxy-lab\" class=\"lab-link\">storage-proxy-lab.html<\/a> ｜ 示例合约：<a href=\"#examples\" data-nav=\"examples\">examples/02-AccessControl.sol<\/a><\/p>\n<\/blockquote>\n<hr>\n<h2>1. 一句话理解<\/h2>\n<p><strong>合约的每个状态修改函数都必须回答一个问题：谁可以调用我？如果答案是&quot;任何人&quot;，就必须证明任何人调用都安全。<\/strong><\/p>\n<p>访问控制（Access Control）：限制特定函数只能由特定地址或角色调用的机制。<\/p>\n<blockquote class=\"analogy\"><p>🎯 打个比方：合约像一栋写字楼。<\/p>\n<ul>\n<li><code>public<\/code> 函数是大堂的门：谁都能进。<\/li>\n<li><code>onlyOwner<\/code> 函数是机房的门：要刷卡。<\/li>\n<li><strong>漏洞 1<\/strong>：机房门忘了装刷卡器（缺少修饰器）。<\/li>\n<li><strong>漏洞 2<\/strong>：刷卡器只检查&quot;刷卡的人是不是从总裁办公室出来的&quot;，而不检查刷卡的人是谁（<code>tx.origin<\/code>）。<\/li>\n<li><strong>漏洞 3<\/strong>：大楼刚建好时，第一个走进物业办公室并宣布&quot;我是物业经理&quot;的人，就成了物业经理（未初始化）。<\/li>\n<li><strong>漏洞 4<\/strong>：总裁的门卡一直放在前台抽屉里（私钥管理）。<\/li>\n<\/ul>\n<p>比喻的局限：写字楼可以换锁。合约如果没有升级能力，&quot;锁&quot;一旦装错就永远是错的。<\/p>\n<\/blockquote>\n<hr>\n<h2>2. 威胁模型<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>攻击者身份<\/th>\n<th>能力<\/th>\n<th>典型攻击<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>任意外部地址<\/td>\n<td>调用所有 <code>public<\/code> / <code>external<\/code> 函数<\/td>\n<td>调用未保护的 <code>mint<\/code>、<code>setOwner<\/code>、<code>initialize<\/code><\/td>\n<\/tr>\n<tr>\n<td>恶意合约<\/td>\n<td>在 owner 交互时插入调用<\/td>\n<td>利用 <code>tx.origin<\/code> 冒充 owner<\/td>\n<\/tr>\n<tr>\n<td>被钓鱼的特权用户<\/td>\n<td>签下自己看不懂的交易<\/td>\n<td>前端篡改、盲签（Bybit 2025）<\/td>\n<\/tr>\n<tr>\n<td>获得私钥的攻击者<\/td>\n<td>完全等同于特权角色<\/td>\n<td>跨链桥验证者私钥泄露（Ronin 2022）<\/td>\n<\/tr>\n<tr>\n<td>内部人员<\/td>\n<td>合法持有特权<\/td>\n<td>跑路、恶意升级<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2>3. 六种常见缺陷<\/h2>\n<h3>3.1 缺少权限检查<\/h3>\n<div class=\"code-wrap\"><pre><code class=\"language-solidity\">// ❌ 漏洞：任何人都能增发\nfunction mint(address to, uint256 amt) external {\n    _mint(to, amt);\n}\n// ✅ 修复\nfunction mint(address to, uint256 amt) external onlyRole(MINTER_ROLE) {\n    _mint(to, amt);\n}\n<\/code><\/pre><\/div>\n<blockquote class=\"info\"><p>💡 注意：Solidity 0.5 之前，函数默认可见性是 <code>public<\/code>。旧合约忘写可见性，就等于把内部函数暴露给所有人。<\/p>\n<\/blockquote>\n<h3>3.2 用 <code>tx.origin<\/code> 做鉴权<\/h3>\n<div class=\"code-wrap\"><pre><code class=\"language-solidity\">// ❌ 漏洞\nrequire(tx.origin == owner);\n// ✅ 修复\nrequire(msg.sender == owner);\n<\/code><\/pre><\/div>\n<p>攻击路径：owner 调用攻击者的合约（例如领取空投）→ 攻击者合约调用你的合约 → <code>tx.origin<\/code> 仍是 owner → 检查通过。<\/p>\n<h3>3.3 未保护的初始化函数<\/h3>\n<p>可升级合约和克隆合约用 <code>initialize()<\/code> 代替构造函数。如果初始化函数没有被调用，或者可以被重复调用，任何人都能成为 owner。<\/p>\n<div class=\"code-wrap\"><pre><code class=\"language-solidity\">// ❌ 漏洞：任何人都可以调用，且可以重复调用\nfunction initialize(address _owner) external {\n    owner = _owner;\n}\n// ✅ 修复：OpenZeppelin Initializable\nfunction initialize(address _owner) external initializer {\n    owner = _owner;\n}\n// ✅ 同时在实现合约的构造函数中锁死实现合约本身\nconstructor() { _disableInitializers(); }\n<\/code><\/pre><\/div>\n<h3>3.4 任意外部调用 / 任意 delegatecall<\/h3>\n<div class=\"code-wrap\"><pre><code class=\"language-solidity\">// ❌ 漏洞：用户可以让合约以自己的身份调用任何地址\nfunction execute(address target, bytes calldata data) external {\n    target.call(data);\n}\n<\/code><\/pre><\/div>\n<p>如果这个合约持有代币授权（allowance），攻击者可以构造 <code>data = transferFrom(受害者, 攻击者, 金额)<\/code>。如果这里是 <code>delegatecall<\/code>，攻击者的代码会直接改写本合约存储。<\/p>\n<h3>3.5 单步所有权转移<\/h3>\n<div class=\"code-wrap\"><pre><code class=\"language-solidity\">// ❌ 风险：输错地址，权限永久丢失\nfunction transferOwnership(address newOwner) external onlyOwner { owner = newOwner; }\n// ✅ 修复：两步转移（Ownable2Step）——新 owner 必须主动 acceptOwnership()\n<\/code><\/pre><\/div>\n<h3>3.6 签名鉴权写错<\/h3>\n<p>用签名代替 <code>msg.sender<\/code> 鉴权时，<code>ecrecover<\/code> 对无效签名返回 <code>address(0)<\/code>。如果被比较的签名者变量未设置（默认 0），检查会通过。签名的完整陷阱见 <a href=\"#c08\" data-nav=\"c08\">08 章<\/a>。<\/p>\n<hr>\n<h2>4. 防御方法：特权角色设计<\/h2>\n<h3>4.1 最小权限<\/h3>\n<p>把一个 <code>owner<\/code> 拆成多个角色，每个角色只做一件事：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>角色<\/th>\n<th>能做什么<\/th>\n<th>建议持有者<\/th>\n<th>建议延迟<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>UPGRADER<\/code><\/td>\n<td>升级实现合约<\/td>\n<td>多签 + 时间锁<\/td>\n<td>48 小时以上（示例）<\/td>\n<\/tr>\n<tr>\n<td><code>PARAM_ADMIN<\/code><\/td>\n<td>调整费率、抵押率<\/td>\n<td>多签 + 时间锁<\/td>\n<td>24 小时（示例）<\/td>\n<\/tr>\n<tr>\n<td><code>PAUSER<\/code><\/td>\n<td>紧急暂停<\/td>\n<td>小型多签或监控机器人<\/td>\n<td>无延迟<\/td>\n<\/tr>\n<tr>\n<td><code>MINTER<\/code><\/td>\n<td>增发<\/td>\n<td>只授予特定合约<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<blockquote class=\"info\"><p>💡 注意：暂停权限要&quot;快&quot;，升级权限要&quot;慢&quot;。暂停只能止损，不能转走资金；升级可以做任何事。<\/p>\n<\/blockquote>\n<h3>4.2 多签 + 时间锁<\/h3>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart LR\n  P[&quot;提案者&lt;br/&gt;（多签 3/5）&quot;] --&gt;|&quot;schedule()&quot;| T[&quot;时间锁合约&lt;br/&gt;延迟 48h（示例）&quot;]\n  T --&gt;|&quot;延迟到期后 execute()&quot;| C[&quot;目标合约&quot;]\n  M[&quot;监控与社区&quot;] -.-&gt;|&quot;观察队列中的操作&quot;| T\n  G[&quot;守护者 Guardian&quot;] -.-&gt;|&quot;发现恶意操作时 cancel()&quot;| T\n  U[&quot;用户&quot;] -.-&gt;|&quot;不同意时，在延迟期内退出&quot;| C<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul>\n<li>时间锁给用户一个&quot;退出窗口&quot;。恶意升级被公开排队后，用户有时间撤资。<\/li>\n<li>守护者可以取消操作，但不能发起操作。权限是不对称的。<\/li>\n<li>局限：如果多签的签名人被同时钓鱼（例如前端被篡改），多签只能防&quot;单个私钥被盗&quot;，不能防&quot;所有人看到同一个假界面&quot;。<\/li>\n<\/ul>\n<h3>4.3 L2 视角：Mantle 的升级权限<\/h3>\n<p>L2 的桥合约持有用户全部跨链资产。谁能升级桥合约，谁就能决定这些资产的去向。根据 L2BEAT 截至 2026 年的页面：<\/p>\n<ul>\n<li>Mantle 的 <code>MantleSecurityMultisig<\/code>（6/14）可以<strong>无延迟<\/strong>升级 L1 上的桥和输出预言机合约。<\/li>\n<li>L2BEAT 把&quot;无升级延迟、无退出窗口&quot;标为关键风险。<\/li>\n<\/ul>\n<p>这不是代码漏洞，而是信任假设：用户相信这 14 个签名人中至少 9 个不会合谋或同时被攻破。细节见 <a href=\"#k03\" data-nav=\"k03\">C03 Mantle 专题<\/a>。<\/p>\n<hr>\n<h2>5. 账户层权限：TRON 的案例<\/h2>\n<p>以太坊的 EOA 只有一把私钥。TRON 账户原生支持<strong>多重权限<\/strong>（TRON 官方文档与安全公司公开资料）：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>权限<\/th>\n<th>作用<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Owner<\/td>\n<td>最高权限，可以修改其他权限，包括增删签名人<\/td>\n<\/tr>\n<tr>\n<td>Active<\/td>\n<td>日常操作：转账、质押、调用合约；可以有多个，每个可以限定允许的操作类型<\/td>\n<\/tr>\n<tr>\n<td>Witness<\/td>\n<td>超级代表（出块节点）相关操作<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>每个权限有一组地址、每个地址有权重、权限有阈值。权重之和达到阈值，操作才执行。<\/p>\n<p><strong>&quot;多签诈骗&quot;的攻击路径：<\/strong><\/p>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart LR\n  A[&quot;受害者在假钱包 / 钓鱼页&lt;br/&gt;泄露私钥&quot;] --&gt; B[&quot;攻击者修改账户权限&lt;br/&gt;把 Owner 和 Active 改成自己&quot;]\n  B --&gt; C[&quot;受害者仍能看到余额&lt;br/&gt;但无法转出&quot;]\n  C --&gt; D[&quot;新的 USDT 继续转入&lt;br/&gt;（转入不需要签名）&quot;]\n  D --&gt; E[&quot;攻击者择机转走全部资产&quot;]<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul>\n<li>攻击者不立即转走资产。账户看起来正常，受害者还会继续往里转钱。<\/li>\n<li>这类骗局常见于 OTC 交易：骗子提供一个&quot;有余额但转不出来&quot;的账户私钥，诱导对方支付&quot;手续费&quot;。<\/li>\n<li>防御：定期检查账户权限配置；只从官方渠道下载钱包；不要导入别人提供的私钥。<\/li>\n<li>对合约开发者的含义：TRON 上&quot;一个地址 = 一把私钥&quot;不成立。收到一个地址时，不能假设它由单一私钥控制。<\/li>\n<\/ul>\n<hr>\n<h2>6. 真实案例<\/h2>\n<h3>6.1 Parity 多签钱包（2017 年，以太坊）<\/h3>\n<ul>\n<li><strong>7 月<\/strong>：钱包合约把未匹配的调用 <code>delegatecall<\/code> 给库合约。库里的 <code>initWallet<\/code> 没有保护。攻击者通过钱包调用 <code>initWallet<\/code>，把自己设为 owner，转走约 153,037 ETH（约 3,000 万美元）。<\/li>\n<li><strong>11 月<\/strong>：修复后的新库合约本身<strong>没有初始化<\/strong>。一个用户调用库的 <code>initWallet<\/code> 成为库的 owner，然后调用 <code>kill<\/code> 自毁库合约。所有依赖它的钱包失去代码逻辑，约 51 万 ETH 被永久冻结。<\/li>\n<li>教训：实现合约（库）本身也需要初始化或在构造函数中锁死。<\/li>\n<\/ul>\n<h3>6.2 Ronin Bridge（2022 年 3 月）<\/h3>\n<ul>\n<li>跨链桥需要 9 个验证者中的 5 个签名。攻击者控制了其中 5 把私钥（公开报道称通过社会工程获得），伪造提款，损失约 6.2 亿美元。<\/li>\n<li>其中一把签名权来自一个早已不需要、但未撤销的授权。<\/li>\n<li>教训：特权清单要定期审计。阈值要和私钥的独立性匹配。<\/li>\n<\/ul>\n<h3>6.3 BNB Chain Token Hub（2022 年 10 月）<\/h3>\n<ul>\n<li>攻击者支付 100 BNB 注册为跨链中继者（Relayer），再利用证明验证缺陷伪造消息，凭空铸造 200 万 BNB。<\/li>\n<li>修复硬分叉（Moran）把中继者改为白名单。<\/li>\n<li>教训：注册中继者&quot;只要付押金就行&quot;是一个权限决策。详见 <a href=\"#k01\" data-nav=\"k01\">C01<\/a>。<\/li>\n<\/ul>\n<hr>\n<h2>7. 审计检查点<\/h2>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> 每个修改状态的外部函数，都有明确的权限检查或&quot;任何人可调用&quot;的安全论证。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 没有任何地方用 <code>tx.origin<\/code> 做鉴权。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 初始化函数有 <code>initializer<\/code> 修饰；实现合约构造函数调用了 <code>_disableInitializers()<\/code>。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 不存在用户可控的任意 <code>call<\/code> / <code>delegatecall<\/code> 目标。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 所有权转移是两步式。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 特权角色已拆分；升级和参数修改经过时间锁。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 特权私钥的持有者、存放方式、阈值已文档化，并有撤销流程。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 部署链的账户模型是否与以太坊一致？（TRON 账户可多权限）<\/li>\n<\/ul>\n<hr>\n<h2>8. 用户侧防护<\/h2>\n<p>普通用户看不到合约代码，但可以通过几个公开信号降低风险。<\/p>\n<ol>\n<li>存款前查看协议的管理员权限：谁能升级、谁能暂停、谁能动用资金。L2BEAT、DeFiSafety 等网站会列出这些信息。<\/li>\n<li>管理员是单个地址（EOA）而不是多签加时间锁，就是高风险信号。<\/li>\n<li>有时间锁的协议，在它公布升级后、生效前，你有时间撤出。关注协议的治理和升级公告。<\/li>\n<li>在 TRON 上，如果你的账户权限被修改（例如 owner 权限被加上陌生地址），立即用剩余权限转移资产，并检查是否签过权限修改交易。<\/li>\n<li>不给任何人你的私钥或助记词，也不签&quot;修改账户权限&quot;的交易。<\/li>\n<\/ol>\n<hr>\n<h2>9. 术语表<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>术语<\/th>\n<th>英文<\/th>\n<th>定义<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>访问控制<\/td>\n<td>Access Control<\/td>\n<td>限制谁能调用特定函数的机制<\/td>\n<\/tr>\n<tr>\n<td>修饰器<\/td>\n<td>Modifier<\/td>\n<td>Solidity 中在函数执行前后插入检查的语法<\/td>\n<\/tr>\n<tr>\n<td>初始化函数<\/td>\n<td>Initializer<\/td>\n<td>可升级合约中替代构造函数的一次性函数<\/td>\n<\/tr>\n<tr>\n<td>多签<\/td>\n<td>Multisig<\/td>\n<td>需要 M 个签名人中至少 N 个签名才能执行的账户<\/td>\n<\/tr>\n<tr>\n<td>时间锁<\/td>\n<td>Timelock<\/td>\n<td>操作公开排队一段时间后才能执行的合约<\/td>\n<\/tr>\n<tr>\n<td>守护者<\/td>\n<td>Guardian<\/td>\n<td>只能暂停或取消、不能发起操作的紧急角色<\/td>\n<\/tr>\n<tr>\n<td>账户权限<\/td>\n<td>Account Permission<\/td>\n<td>TRON 账户原生的多权限、多签名配置<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2>10. 思考题<\/h2>\n<ol>\n<li>一个协议的 <code>PAUSER<\/code> 角色可以暂停提款，但没有时间锁。这个设计合理吗？如果 <code>PAUSER<\/code> 私钥被盗，最坏情况是什么？<\/li>\n<li>Parity 第二次事故中，库合约被自毁。在 EIP-6780 之后，同样的操作还会冻结资金吗？<\/li>\n<li>你在 TRON 上收到一个地址，想把它设为合约的 <code>owner<\/code>。你需要额外确认什么？<\/li>\n<\/ol>\n<p>下一章：<a href=\"#c05\" data-nav=\"c05\">05 算术与精度<\/a> —— 数字算错了。<\/p>\n"}, "c05": {"id": "c05", "file": "05-arithmetic-precision.md", "title": "05 算术与精度：差一个 wei，丢一个金库", "group": "g2", "html": "<h1>05 算术与精度：差一个 wei，丢一个金库<\/h1>\n<blockquote class=\"\"><p>学习目标：读完本章，你能——<\/p>\n<ol>\n<li>识别溢出、截断、除法顺序、舍入方向、精度单位不一致五类数学缺陷。<\/li>\n<li>解释 ERC-4626 金库首存者通胀攻击，并说出两种防御方式。<\/li>\n<li>对任意&quot;份额 ↔ 资产&quot;换算，判断它该向上还是向下取整。<\/li>\n<\/ol>\n<p>前置章节：<a href=\"#c02\" data-nav=\"c02\">02 EVM 与 Solidity 安全基础<\/a><br>交互实验：<a href=\"#lab-vault-inflation-lab\" data-nav=\"lab-vault-inflation-lab\" class=\"lab-link\">vault-inflation-lab.html<\/a> ｜ 示例合约：<a href=\"#examples\" data-nav=\"examples\">examples/03-VaultInflation.sol<\/a><\/p>\n<\/blockquote>\n<hr>\n<h2>1. 一句话理解<\/h2>\n<p><strong>EVM 只有整数。每一次除法都会丢掉余数；丢掉的余数归谁，决定了谁能从协议里慢慢&quot;抠&quot;出钱。<\/strong><\/p>\n<blockquote class=\"analogy\"><p>🎯 打个比方：一家披萨店按&quot;块&quot;卖披萨，一张披萨切 8 块。<\/p>\n<ul>\n<li>你付 1/3 张的钱，店员必须决定给你 2 块还是 3 块（舍入方向）。<\/li>\n<li>如果店员总是往多了给，聪明的顾客就反复买 1/3 张，每次多拿一点。<\/li>\n<li>如果第一个顾客买下整张披萨只切成 1 块，然后往盒子里偷偷塞进 100 张披萨，下一个顾客付了 99 张的钱，却因为&quot;1 块披萨价值 101 张&quot;而一块也分不到（金库通胀攻击）。<\/li>\n<\/ul>\n<p>比喻的局限：披萨店会被投诉。合约里，每次多拿 1 wei 的操作可以在一笔交易里重复几千次。<\/p>\n<\/blockquote>\n<hr>\n<h2>2. 五类数学缺陷<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>缺陷<\/th>\n<th>例子<\/th>\n<th>后果<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>①<\/td>\n<td>溢出 / 下溢<\/td>\n<td>0.8 之前的 <code>a * b<\/code>；0.8 之后的 <code>unchecked { }<\/code><\/td>\n<td>余额回绕成极大值或 0<\/td>\n<\/tr>\n<tr>\n<td>②<\/td>\n<td>类型截断<\/td>\n<td><code>uint128(x)<\/code>、<code>int256<\/code> 转 <code>uint256<\/code><\/td>\n<td>静默丢掉高位<\/td>\n<\/tr>\n<tr>\n<td>③<\/td>\n<td>先除后乘<\/td>\n<td><code>a / b * c<\/code><\/td>\n<td>精度损失被放大 c 倍<\/td>\n<\/tr>\n<tr>\n<td>④<\/td>\n<td>舍入方向错误<\/td>\n<td>存款时份额向上取整<\/td>\n<td>每次操作都向用户泄漏 1 单位<\/td>\n<\/tr>\n<tr>\n<td>⑤<\/td>\n<td>单位不一致<\/td>\n<td>6 位精度的 USDT 当作 18 位计算<\/td>\n<td>价格偏差 10^12 倍<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h3>2.1 溢出：BEC batchOverflow（2018 年 4 月，以太坊）<\/h3>\n<div class=\"code-wrap\"><pre><code class=\"language-solidity\">// ❌ 漏洞（Solidity 0.4，无溢出检查）\nfunction batchTransfer(address[] _receivers, uint256 _value) public {\n    uint cnt = _receivers.length;\n    uint256 amount = uint256(cnt) * _value;     // 2 * 2^255 = 2^256 → 回绕为 0\n    require(_value &gt; 0 &amp;&amp; balances[msg.sender] &gt;= amount);   // 0 ≤ 任何余额，通过\n    balances[msg.sender] = balances[msg.sender].sub(amount);\n    for (uint i = 0; i &lt; cnt; i++) {\n        balances[_receivers[i]] = balances[_receivers[i]].add(_value);  // 每人收到 2^255\n    }\n}\n<\/code><\/pre><\/div>\n<p>攻击者用 2 个接收地址和 <code>_value = 2^255<\/code>，凭空铸出天量代币。多家交易所暂停 BEC 充提（公开报道）。<\/p>\n<blockquote class=\"info\"><p>💡 注意：Solidity 0.8 默认检查溢出。但 <code>unchecked<\/code> 块、内联汇编、类型转换仍会静默回绕。审计时要逐一检查这三处。<\/p>\n<\/blockquote>\n<h3>2.2 先除后乘<\/h3>\n<div class=\"code-wrap\"><pre><code class=\"language-solidity\">// ❌ 精度损失：利率 5%，本金 19\nuint256 interest = principal / 100 * rateBps / 100;  // 19/100 = 0 → 利息 0\n// ✅ 先乘后除\nuint256 interest = principal * rateBps / 10_000;     // 19*500/10000 = 0（仍为 0，但误差不再被放大）\n// ✅ 更好：使用 mulDiv（OpenZeppelin Math.mulDiv），中间结果 512 位，不溢出，可指定舍入方向\nuint256 interest = Math.mulDiv(principal, rateBps, 10_000, Math.Rounding.Floor);\n<\/code><\/pre><\/div>\n<h3>2.3 单位不一致：三条链上的 USDT<\/h3>\n<p>同一个&quot;USDT&quot;，在不同链上的精度不同（以链上合约的 <code>decimals()<\/code> 为准）：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>链<\/th>\n<th>代币<\/th>\n<th><code>decimals()<\/code><\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>以太坊<\/td>\n<td>Tether USD<\/td>\n<td>6<\/td>\n<\/tr>\n<tr>\n<td>BNB Chain<\/td>\n<td>Binance-Peg BSC-USD<\/td>\n<td>18<\/td>\n<\/tr>\n<tr>\n<td>TRON<\/td>\n<td>Tether USD (TRC-20)<\/td>\n<td>6<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<blockquote class=\"warn\"><p>⚠️ 警告：把以太坊上的价格计算代码原样部署到 BNB Chain，如果写死了 <code>1e6<\/code>，USDT 金额会被放大 10^12 倍。**永远从合约读取 <code>decimals()<\/code>，不要写死。**跨链桥两端精度不同时，要在桥合约里显式换算，并处理换算后的余数。<\/p>\n<\/blockquote>\n<hr>\n<h2>3. 舍入方向：永远对协议有利<\/h2>\n<p>规则只有一条：<strong>舍入的余数归协议，不归调用者。<\/strong><\/p>\n<div class=\"lv-figcap\"><span>图 · 四种换算的取整方向<\/span><span class=\"new\">新增图解<\/span><\/div><div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart TB\n  O[\"份额 ↔ 资产换算\"] --&gt; D1[\"deposit：给资产拿份额&lt;br/&gt;份额向下取整\"]\n  O --&gt; D2[\"mint：按份额算所需资产&lt;br/&gt;资产向上取整\"]\n  O --&gt; D3[\"withdraw：按资产算所需份额&lt;br/&gt;份额向上取整\"]\n  O --&gt; D4[\"redeem：给份额拿资产&lt;br/&gt;资产向下取整\"]\n  D1 --&gt; P[\"余数归协议\"]\n  D2 --&gt; P\n  D3 --&gt; P\n  D4 --&gt; P\n  X[\"方向写反\"] --&gt; Y[\"反复 mint 1 份额再 redeem\"]\n  Y --&gt; Z[\"每次净赚 1 单位误差\"]\n  Z --&gt; W[\"无手续费时循环上千次\"]<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul><li><strong>关键：<\/strong>用户拿走的少给，用户付出的多收：余数永远归协议。<\/li><li><strong>出错点：<\/strong>任何一处方向写反，就留下往返套利的入口。<\/li><li><strong>风险：<\/strong>单次只差 1 单位，但可以在一笔交易里重复几千次。<\/li><\/ul>\n\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>操作<\/th>\n<th>用户给出<\/th>\n<th>用户得到<\/th>\n<th>取整方向<\/th>\n<th>理由<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>deposit(assets)<\/code><\/td>\n<td>资产<\/td>\n<td>份额<\/td>\n<td>向下<\/td>\n<td>少给份额<\/td>\n<\/tr>\n<tr>\n<td><code>mint(shares)<\/code><\/td>\n<td>资产（计算所需）<\/td>\n<td>份额<\/td>\n<td>向上<\/td>\n<td>多收资产<\/td>\n<\/tr>\n<tr>\n<td><code>withdraw(assets)<\/code><\/td>\n<td>份额（计算所需）<\/td>\n<td>资产<\/td>\n<td>向上<\/td>\n<td>多扣份额<\/td>\n<\/tr>\n<tr>\n<td><code>redeem(shares)<\/code><\/td>\n<td>份额<\/td>\n<td>资产<\/td>\n<td>向下<\/td>\n<td>少给资产<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>如果方向反了，攻击者可以做&quot;往返套利&quot;：反复 <code>mint<\/code> 1 份额再 <code>redeem<\/code>，每次净赚 1 单位舍入误差。单次很小，但在没有手续费的场景下可以循环上千次。<\/p>\n<h3>3.1 案例：Balancer V2（2025 年 11 月，多链）<\/h3>\n<ul>\n<li>公开分析（Check Point Research、Verichains 等安全公司）指出：Composable Stable Pool 的 <code>batchSwap<\/code> 中存在舍入误差。<\/li>\n<li>攻击者在一笔批量交换中串联大量小额交换，让每一步的舍入都朝对自己有利的方向累积，操纵池子不变量和 BPT（池子份额）价格。<\/li>\n<li>损失约 1.28 亿美元（事发时估值），涉及多条链上的部署。<\/li>\n<li>教训：舍入误差在<strong>单步<\/strong>测试中可以忽略，在<strong>可批量、可循环<\/strong>的路径中会被放大。要对&quot;重复 N 次同一操作&quot;做模糊测试（<a href=\"#c12\" data-nav=\"c12\">12 章<\/a>）。<\/li>\n<\/ul>\n<h3>3.2 案例：KyberSwap Elastic（2023 年 11 月，以太坊等多链）<\/h3>\n<ul>\n<li>BlockSec 公开分析：<code>estimateIncrementalLiquidity<\/code> 中的 <code>deltaL<\/code> 用 <code>mulDivFloor<\/code> 向下取整，而代码注释表明应向上取整。<\/li>\n<li>偏差让池子在价格已越过某个 tick 时误判&quot;未跨越&quot;，同一段流动性在反向交换中被计算两次。<\/li>\n<li>损失超过 4,800 万美元。根因与教训见 <a href=\"#k00\" data-nav=\"k00\">C00 以太坊专题<\/a> 4.4 节。<\/li>\n<\/ul>\n<blockquote class=\"info\"><p>💡 注意：<strong>代码与注释不一致<\/strong>时，要把它当作漏洞线索，而不是文档瑕疵。<\/p>\n<\/blockquote>\n<hr>\n<h2>4. ERC-4626 金库通胀攻击<\/h2>\n<p>ERC-4626：代币化金库的标准接口。用户存入资产（assets），获得份额（shares）。<\/p>\n<div class=\"code-wrap\"><pre><code>shares = assets × totalSupply / totalAssets      （向下取整）\n<\/code><\/pre><\/div>\n<p><code>totalAssets<\/code> 通常是 <code>asset.balanceOf(address(this))<\/code>——任何人都可以通过直接转账来增加它。<\/p>\n<h3>4.1 攻击步骤<\/h3>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">sequenceDiagram\n  autonumber\n  participant A as 攻击者\n  participant V as 金库（空）\n  participant U as 受害者\n  A-&gt;&gt;V: deposit(1 wei)\n  Note over V: totalSupply = 1，totalAssets = 1\n  A-&gt;&gt;V: 直接 transfer 10,000 USDC（不走 deposit）\n  Note over V: totalSupply = 1，totalAssets = 10,000 USDC + 1\n  U-&gt;&gt;V: deposit(9,999 USDC)\n  Note over V: shares = 9,999e6 × 1 / (10,000e6 + 1) = 0（向下取整）\n  Note over U: 受害者得到 0 份额\n  A-&gt;&gt;V: redeem(1 share)\n  Note over A: 取回全部 ≈ 19,999 USDC<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul>\n<li>攻击者的 1 份额代表了金库全部资产。受害者的存款被&quot;捐赠&quot;给了这 1 份额。<\/li>\n<li>攻击者通常抢跑受害者的第一笔存款交易（<a href=\"#c08\" data-nav=\"c08\">08 章<\/a>）。<\/li>\n<li>攻击成本是捐赠额。只要受害者存款接近捐赠额，攻击就有利可图。<\/li>\n<li>局限：这个攻击只在金库<strong>几乎为空<\/strong>时有效。金库规模越大，攻击成本越高。<\/li>\n<\/ul>\n<h3>4.2 防御<\/h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>方案<\/th>\n<th>做法<\/th>\n<th>效果<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>虚拟份额与偏移（OpenZeppelin ≥ 4.9）<\/td>\n<td><code>shares = assets × (totalSupply + 10^offset) / (totalAssets + 1)<\/code><\/td>\n<td>攻击者需要捐赠 10^offset 倍的资金才能造成同样损失<\/td>\n<\/tr>\n<tr>\n<td>初始存款销毁<\/td>\n<td>部署时存入一笔资金，并把份额发给死地址<\/td>\n<td>金库永远不为空<\/td>\n<\/tr>\n<tr>\n<td>内部记账<\/td>\n<td>用状态变量记录 <code>totalAssets<\/code>，不读 <code>balanceOf<\/code><\/td>\n<td>捐赠不改变份额价格<\/td>\n<\/tr>\n<tr>\n<td>最小份额检查<\/td>\n<td><code>require(shares &gt; 0)<\/code>；用户侧设置 <code>minSharesOut<\/code><\/td>\n<td>受害者交易回滚，而不是得到 0<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>去 <a href=\"#lab-vault-inflation-lab\" data-nav=\"lab-vault-inflation-lab\" class=\"lab-link\">vault-inflation-lab.html<\/a>，拖动 <code>decimalsOffset<\/code> 滑块，观察攻击者利润从正变负。<\/p>\n<blockquote class=\"info\"><p>💡 注意：Uniswap V2 也用了类似思路：首次添加流动性时，永久锁定 <code>MINIMUM_LIQUIDITY = 1000<\/code> 份 LP 代币。<\/p>\n<\/blockquote>\n<hr>\n<h2>5. 扩展案例：BNB Chain 上的 Uranium Finance（2021 年 4 月）<\/h2>\n<p>Uranium Finance 分叉自 Uniswap V2。开发者把手续费从 0.3% 改成 0.16%（公开分析报告），在 <code>swap()<\/code> 的余额检查中修改了一处常数，但漏改了另一处：<\/p>\n<div class=\"lv-figcap\"><span>图 · Uranium 漏改常数的后果链<\/span><span class=\"new\">新增图解<\/span><\/div><div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart TB\n  A[\"分叉 Uniswap V2\"] --&gt; B[\"手续费 0.3% 改为 0.16%\"]\n  B --&gt; C[\"左侧调整项改成 10000\"]\n  B --&gt; D[\"右侧仍是 1000²\"]\n  C --&gt; E[\"左边被放大 100 倍\"]\n  D --&gt; E\n  E --&gt; F[\"x × y ≥ k&lt;br/&gt;退化成 x × y ≥ k / 100\"]\n  F --&gt; G[\"极少量代币换出约 99% 储备\"]\n  G --&gt; H[\"损失约 5,000 万美元\"]<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul><li><strong>出错点：<\/strong>只改了一处常数，另一处没同步，两边比较的尺度不一致。<\/li><li><strong>风险：<\/strong>不变量 k 被削弱 100 倍，池子储备几乎可以被免费换走。<\/li><li><strong>关键：<\/strong>修改过的分叉代码等于新代码，必须重新审计。<\/li><\/ul>\n\n<div class=\"code-wrap\"><pre><code class=\"language-solidity\">// Uniswap V2 原版：两处都是 1000\nuint balance0Adjusted = balance0.mul(1000).sub(amount0In.mul(3));\nrequire(balance0Adjusted.mul(balance1Adjusted) &gt;= uint(_reserve0).mul(_reserve1).mul(1000**2));\n\n// ❌ Uranium：调整项放大到 10000，右侧仍是 1000**2\nuint balance0Adjusted = balance0.mul(10000).sub(amount0In.mul(16));\nrequire(balance0Adjusted.mul(balance1Adjusted) &gt;= uint(_reserve0).mul(_reserve1).mul(1000**2));\n<\/code><\/pre><\/div>\n<p>左边被放大了 100 倍（10000² / 1000²），右边没有。不变量 <code>x × y ≥ k<\/code> 退化成 <code>x × y ≥ k / 100<\/code>。攻击者只投入极少量代币，就能换出池子约 99% 的储备。损失约 5,000 万美元（公开报道）。<\/p>\n<blockquote class=\"warn\"><p>⚠️ 警告：分叉项目的修改往往只有几行，审计却容易被跳过——&quot;这是 Uniswap 的代码，已经审计过了&quot;。**修改过的分叉代码等于新代码。**更多 BNB Chain 分叉项目案例见 <a href=\"#k01\" data-nav=\"k01\">C01<\/a>。<\/p>\n<\/blockquote>\n<hr>\n<h2>6. 审计检查点<\/h2>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> 所有 <code>unchecked<\/code> 块都有不会溢出的证明。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 所有向下类型转换都用了 <code>SafeCast<\/code>。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 乘除混合运算都是先乘后除，或使用 <code>mulDiv<\/code>。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 每个份额 ↔ 资产换算的舍入方向都对协议有利。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 金库首存者攻击已防御（虚拟份额、死份额或内部记账）。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 不写死代币精度；跨链换算处理了余数。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 分叉代码中修改过的常数，所有使用位置都已同步。<\/li>\n<li><input disabled=\"\" type=\"checkbox\"> 模糊测试覆盖&quot;同一操作重复 N 次&quot;的路径。<\/li>\n<\/ul>\n<hr>\n<h2>7. 用户侧防护<\/h2>\n<p>普通用户看不到合约代码，但可以通过几个公开信号降低风险。<\/p>\n<ol>\n<li>存入 ERC-4626 金库或新的收益产品时，避免成为第一个存款人；看金库是否已有一定规模的存款。<\/li>\n<li>存入后立即检查你拿到的份额是否与预期一致；份额为 0 或明显偏少，立刻停止。<\/li>\n<li>跨链转账时核对代币精度：同一个代币在不同链上的小数位可能不同（例如 BSC 上的 USDT 是 18 位）。<\/li>\n<li>收益率异常高、计算方式不透明的产品，先用小额试。<\/li>\n<li>不要依赖前端显示的数字做大额决策；必要时在区块浏览器核对合约返回值。<\/li>\n<\/ol>\n<hr>\n<h2>8. 术语表<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>术语<\/th>\n<th>英文<\/th>\n<th>定义<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>溢出<\/td>\n<td>Overflow<\/td>\n<td>运算结果超过类型上限后回绕<\/td>\n<\/tr>\n<tr>\n<td>截断<\/td>\n<td>Truncation<\/td>\n<td>类型转换时丢掉高位<\/td>\n<\/tr>\n<tr>\n<td>舍入方向<\/td>\n<td>Rounding Direction<\/td>\n<td>除法余数归属的选择（向上 / 向下）<\/td>\n<\/tr>\n<tr>\n<td>份额<\/td>\n<td>Shares<\/td>\n<td>代表对金库资产按比例所有权的代币<\/td>\n<\/tr>\n<tr>\n<td>通胀攻击<\/td>\n<td>Inflation Attack<\/td>\n<td>通过捐赠抬高份额价格，使后来者得到 0 份额<\/td>\n<\/tr>\n<tr>\n<td>虚拟份额<\/td>\n<td>Virtual Shares<\/td>\n<td>计算时额外加入的不存在的份额，用于抵抗通胀攻击<\/td>\n<\/tr>\n<tr>\n<td>精度<\/td>\n<td>Decimals<\/td>\n<td>代币最小单位与显示单位之间的 10 的幂次<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2>9. 思考题<\/h2>\n<ol>\n<li>打开 <a href=\"#lab-vault-inflation-lab\" data-nav=\"lab-vault-inflation-lab\" class=\"lab-link\">vault-inflation-lab.html<\/a>。偏移为 0 时，受害者存入 5,000 USDC，攻击者至少要捐赠多少才能让受害者得到 0 份额？偏移改为 3 呢？<\/li>\n<li>一个借贷协议计算利息时，对借款人的应还金额向下取整。攻击者可以怎样利用？<\/li>\n<li>你要把一个以太坊上的 USDT 收益协议部署到 BNB Chain。列出至少 2 处需要修改的数学相关代码。<\/li>\n<\/ol>\n<p>下一章：<a href=\"#c06\" data-nav=\"c06\">06 外部调用与代币兼容性<\/a> —— 你调用的那个合约，未必按你想的方式工作。<\/p>\n"}, "c06": {"id": "c06", "file": "06-external-calls-tokens.md", "title": "06 外部调用与代币兼容性：对方未必按标准出牌", "group": "g2", "html": "<h1>06 外部调用与代币兼容性：对方未必按标准出牌<\/h1>\n<blockquote class=\"\"><p>学习目标：读完本章，你能——<\/p>\n<ol>\n<li>说出低级调用的 4 个陷阱，包括&quot;调用无代码地址也返回成功&quot;。<\/li>\n<li>列出 8 类非标准代币行为，并给出兼容方案。<\/li>\n<li>识别由外部调用引起的拒绝服务（DoS）。<\/li>\n<\/ol>\n<p>前置章节：<a href=\"#c03\" data-nav=\"c03\">03 重入攻击<\/a><br>交互实验：<a href=\"#lab-chain-porting-lab\" data-nav=\"lab-chain-porting-lab\" class=\"lab-link\">chain-porting-lab.html<\/a> ｜ 示例合约：<a href=\"#examples\" data-nav=\"examples\">examples/05-SafeTokenOps.sol<\/a><\/p>\n<\/blockquote>\n<hr>\n<h2>1. 一句话理解<\/h2>\n<p><strong>每一个外部调用都是一次&quot;把命运交给别人&quot;。对方可能失败、可能撒谎、可能拖延、可能根本不存在。<\/strong><\/p>\n<blockquote class=\"analogy\"><p>🎯 打个比方：你让快递员把包裹送到某个地址，然后在登记簿上写&quot;已送达&quot;。<\/p>\n<ul>\n<li>快递员没回话（返回值没检查），你就当作送到了。<\/li>\n<li>地址是一块空地（目标地址没有代码），快递员说&quot;送到了&quot;——因为空地不会拒收。<\/li>\n<li>收件人收件时扣下 10% 当&quot;小费&quot;（转账收税代币），你的登记簿上却写着全额。<\/li>\n<li>收件人故意拒收（回滚），而你要把 100 个包裹按顺序送完，第 1 个被拒，后面 99 个都送不出去（DoS）。<\/li>\n<\/ul>\n<p>比喻的局限：快递员只会出一种错。外部合约可以<strong>同时<\/strong>撒谎、回调、耗尽 gas。<\/p>\n<\/blockquote>\n<hr>\n<h2>2. 低级调用的四个陷阱<\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>陷阱<\/th>\n<th>说明<\/th>\n<th>修复<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>①<\/td>\n<td>不检查返回值<\/td>\n<td><code>addr.call(...)<\/code> 失败只返回 <code>false<\/code><\/td>\n<td><code>(bool ok, ) = ...; require(ok);<\/code><\/td>\n<\/tr>\n<tr>\n<td>②<\/td>\n<td>目标地址没有代码<\/td>\n<td>对无代码地址 <code>call<\/code> 返回 <code>true<\/code>，返回数据为空<\/td>\n<td>调用前检查 <code>addr.code.length &gt; 0<\/code><\/td>\n<\/tr>\n<tr>\n<td>③<\/td>\n<td>返回数据炸弹<\/td>\n<td>对方返回超大数据，复制到内存耗尽 gas<\/td>\n<td>限制复制长度（如 ExcessivelySafeCall）<\/td>\n<\/tr>\n<tr>\n<td>④<\/td>\n<td>gas 不足型失败<\/td>\n<td>调用方故意给刚好不够的 gas，让内部调用失败而外层继续<\/td>\n<td>检查 <code>gasleft()<\/code>；关键调用失败时整体回滚<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h3>2.1 案例：Qubit Finance 跨链桥（2022 年 1 月，以太坊 → BNB Chain）<\/h3>\n<p>Qubit 的桥把以太坊上的存款映射为 BNB Chain 上的 qXETH，再用作借贷抵押品。SlowMist 公开分析的根因：<\/p>\n<ol>\n<li>桥为原生 ETH 配置的代币地址是 <code>address(0)<\/code>。ETH 存款本应走 <code>depositETH()<\/code>，它会检查 <code>msg.value<\/code>。<\/li>\n<li>攻击者调用普通的 <code>deposit()<\/code>，传入 ETH 对应的资源 ID。白名单检查通过。<\/li>\n<li><code>deposit()<\/code> 对 <code>tokenAddress = address(0)<\/code> 执行 <code>safeTransferFrom<\/code>。<\/li>\n<li><code>address(0)<\/code> 没有代码。低级调用返回成功、返回数据为空。旧版的安全转账库把&quot;空返回&quot;当作成功（为了兼容不返回值的 USDT）。<\/li>\n<li>桥记录了一笔&quot;ETH 存款&quot;。BNB Chain 一侧铸造了大量 qXETH。攻击者用它借空了借贷池，损失约 8,000 万美元。<\/li>\n<\/ol>\n<div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart LR\n  A[&quot;deposit(ETH 资源 ID)&quot;] --&gt; B{&quot;资源 ID 在白名单?&quot;}\n  B -- 是 --&gt; C[&quot;safeTransferFrom(address(0), ...)&quot;]\n  C --&gt; D{&quot;目标有代码?&quot;}\n  D -- &quot;没检查&quot; --&gt; E[&quot;空返回 = 成功&quot;]\n  E --&gt; F[&quot;记录存款 → BSC 铸造 qXETH&quot;]\n  F --&gt; G[&quot;抵押 qXETH 借空资金池&quot;]<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul>\n<li>每一步单独看都&quot;合理&quot;。漏洞来自组合：零地址 + 兼容性妥协 + 缺少原生币检查。<\/li>\n<li>OpenZeppelin 的 <code>SafeERC20<\/code> 现在会在返回数据为空时检查目标是否有代码。<\/li>\n<li>教训：白名单只告诉你&quot;这个 ID 被允许&quot;，不告诉你&quot;这个 ID 对应什么类型的资产&quot;。<\/li>\n<\/ul>\n<hr>\n<h2>3. 非标准代币：八种行为<\/h2>\n<p>ERC-20 标准只规定了接口，没有规定行为。真实世界的代币五花八门：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>行为<\/th>\n<th>代表<\/th>\n<th>风险<\/th>\n<th>兼容方案<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td><code>transfer<\/code> 不返回值<\/td>\n<td>以太坊 USDT、BNB<\/td>\n<td>按接口解码返回值时回滚<\/td>\n<td><code>SafeERC20<\/code><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><strong><code>transfer<\/code> 成功却返回 <code>false<\/code><\/strong><\/td>\n<td><strong>TRON 上的 USDT<\/strong><\/td>\n<td><code>SafeERC20<\/code> 判定失败，交易回滚<\/td>\n<td>用余额差判断（见 3.1）<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>转账收税（Fee-on-transfer）<\/td>\n<td>部分 BSC 社区代币<\/td>\n<td>记账金额 &gt; 实收金额，协议资不抵债<\/td>\n<td>记账用余额差 <code>after - before<\/code><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>余额自动变化（Rebasing）<\/td>\n<td>stETH、AMPL<\/td>\n<td>缓存的余额失效<\/td>\n<td>用份额记账（如 wstETH）<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>黑名单 / 冻结<\/td>\n<td>USDT、USDC<\/td>\n<td>某地址被冻结，整个批量操作失败<\/td>\n<td>拉取式支付；单笔失败不影响全局<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>可暂停<\/td>\n<td>多数中心化稳定币<\/td>\n<td>清算或提款暂停<\/td>\n<td>风险披露；设计降级路径<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>转账钩子<\/td>\n<td>ERC-777、ERC-1363<\/td>\n<td>重入<\/td>\n<td>CEI + 重入锁（<a href=\"#c03\" data-nav=\"c03\">03 章<\/a>）<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>可升级<\/td>\n<td>USDT、USDC 等<\/td>\n<td>代币行为未来可能改变<\/td>\n<td>监控升级事件<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h3>3.1 TRON USDT：成功却返回 false<\/h3>\n<p>OpenZeppelin 在 2026 年公开的一份 Across 协议 TRON 部署审计中写道：TRON 上部署的 USDT 合约，<code>transfer<\/code> 在<strong>转账成功时也返回 <code>false<\/code><\/strong>。后果是：<\/p>\n<div class=\"lv-figcap\"><span>图 · TRON USDT 推送：两种写法对比<\/span><span class=\"new\">新增图解<\/span><\/div><div class=\"mmd-wrap\"><pre class=\"mmd\">sequenceDiagram\n  autonumber\n  participant P as 协议合约\n  participant T as TRON USDT\n  participant R as 接收方\n  Note over P,R: 写法一 SafeERC20.safeTransfer\n  P-&gt;&gt;T: safeTransfer(to, amt)\n  T-&gt;&gt;R: 余额增加 amt\n  T--&gt;&gt;P: 返回 false\n  Note over P: 判定失败 整笔回滚\n  Note over P,R: 写法二 余额差判断\n  P-&gt;&gt;T: balanceOf(to) 记为 before\n  P-&gt;&gt;T: call transfer 忽略返回值\n  T-&gt;&gt;R: 余额增加 amt\n  T--&gt;&gt;P: 调用未回滚 ok 为 true\n  P-&gt;&gt;T: 再读 balanceOf(to)\n  Note over P: 差额等于 amt 才算成功<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul><li><strong>出错点：<\/strong>TRON USDT 转账成功也返回 false，SafeERC20 推送一律回滚。<\/li><li><strong>数据流：<\/strong>余额差写法不看返回值，只看接收方余额是否真的增加了 amt。<\/li><li><strong>局限：<\/strong>该审计认为 transferFrom 和 approve 正常，所以只有推送方向要单独处理。<\/li><li><strong>风险：<\/strong>Tether 保留了开启手续费的能力，一旦开启，等于 amt 的检查会失败。<\/li><\/ul>\n\n<ol>\n<li>使用 <code>SafeERC20.safeTransfer<\/code> 推送 USDT 的代码，在 TRON 上一律回滚。<\/li>\n<li>项目方为 TRON 单独实现了 <code>TronTransferLib<\/code>：转账后检查<strong>接收方余额是否增加了对应金额<\/strong>，不读取返回值。<\/li>\n<li>该审计认为 <code>transferFrom<\/code> 和 <code>approve<\/code> 在 TRON USDT 上行为正常，所以拉取方向保持不变。<\/li>\n<\/ol>\n<div class=\"code-wrap\"><pre><code class=\"language-solidity\">// ✅ 以余额差判断转账结果（适用于 TRON USDT 推送场景）\nfunction _pushUSDT(IERC20 token, address to, uint256 amt) internal {\n    uint256 before = token.balanceOf(to);\n    // 忽略返回值：TRON USDT 成功时也返回 false\n    (bool ok, ) = address(token).call(abi.encodeCall(IERC20.transfer, (to, amt)));\n    require(ok, &quot;call reverted&quot;);\n    require(token.balanceOf(to) - before == amt, &quot;transfer not credited&quot;);\n}\n<\/code><\/pre><\/div>\n<blockquote class=\"warn\"><p>⚠️ 警告：余额差方案假设代币<strong>没有转账税<\/strong>。Tether 在 TRON 上保留了开启转账手续费、黑名单和暂停的能力（同一审计报告）。如果手续费被开启，<code>== amt<\/code> 的检查会失败。设计时要明确选择：是&quot;失败即回滚&quot;，还是&quot;按实收金额记账&quot;。<\/p>\n<\/blockquote>\n<h3>3.2 收税代币的记账方式<\/h3>\n<div class=\"code-wrap\"><pre><code class=\"language-solidity\">// ❌ 按参数记账\ntoken.safeTransferFrom(msg.sender, address(this), amount);\ndeposits[msg.sender] += amount;\n// ✅ 按实收记账（注意：要配合重入锁，防止 transferFrom 中的回调扭曲余额差）\nuint256 before = token.balanceOf(address(this));\ntoken.safeTransferFrom(msg.sender, address(this), amount);\nuint256 received = token.balanceOf(address(this)) - before;\ndeposits[msg.sender] += received;\n<\/code><\/pre><\/div>\n<hr>\n<h2>4. 外部调用导致的拒绝服务<\/h2>\n<p>拒绝服务（DoS, Denial of Service）：攻击者让合约的某个功能永久或长期无法使用。<\/p>\n<div class=\"lv-figcap\"><span>图 · 推送式与拉取式支付<\/span><span class=\"new\">新增图解<\/span><\/div><div class=\"mmd-wrap\"><pre class=\"mmd\">flowchart TB\n  subgraph S1[\"推送式：合约逐个转账\"]\n    A1[\"循环给每个接收方转账\"] --&gt; A2[\"某个接收方回滚&lt;br/&gt;或地址被冻结\"]\n    A2 --&gt; A3[\"整笔交易回滚\"]\n    A3 --&gt; A4[\"所有人都收不到\"]\n  end\n  subgraph S2[\"拉取式：只记账\"]\n    B1[\"给每人记下应得金额\"] --&gt; B2[\"收款人自己来提取\"]\n    B2 --&gt; B3[\"一人失败只影响自己\"]\n  end<\/pre><\/div>\n<p><strong>读图要点：<\/strong><\/p>\n<ul><li><strong>出错点：<\/strong>推送支付中只要一个接收方拒收，整个批量操作就失败。<\/li><li><strong>风险：<\/strong>攻击者部署一个 receive() 总是回滚的合约，就能永久卡死拍卖退款。<\/li><li><strong>关键：<\/strong>拉取式支付把失败隔离在单个收款人身上。<\/li><li><strong>局限：<\/strong>无界循环即使无人捣乱，用户数增长后也会超过区块 gas 上限，要分页处理。<\/li><\/ul>\n\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>模式<\/th>\n<th>例子<\/th>\n<th>修复<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>推送支付中某个接收方回滚<\/td>\n<td>拍卖退款给上一个出价者，对方合约 <code>receive()<\/code> 总是回滚，新出价永远失败<\/td>\n<td>拉取式支付<\/td>\n<\/tr>\n<tr>\n<td>无界循环<\/td>\n<td>遍历所有用户发奖励，用
