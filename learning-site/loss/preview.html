<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Web3 资损 101 学习站</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: 取证档案式手册。左侧章节栏（手机为抽屉），中间单栏阅读；案件章 = 档案卡 + 可步进攻击链 + 时间线 + 阻塞点。 */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface2:#f5f7f9; --ink:#111823; --muted:#566170; --line:#d5dbe3;
  --accent:#2343c9; --accent-soft:#e3e8fb;
  --danger:#c2362d; --danger-soft:#fbe6e4;
  --ok:#1b7a52; --ok-soft:#dff2e9;
  --warn:#94600e; --warn-soft:#f8ecd6;
  --unk:#667080; --unk-soft:#eceef1;
  --f-display:"Noto Serif SC","Songti SC","STSong",serif;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --rail:292px; --bar:52px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1218; --surface:#151c25; --surface2:#1b2430; --ink:#e5eaf1; --muted:#9aa5b5; --line:#2b3644;
  --accent:#8fa2ff; --accent-soft:#1f2a52;
  --danger:#ff6e61; --danger-soft:#3d1c1a;
  --ok:#4cc58f; --ok-soft:#173a2b;
  --warn:#e4a94d; --warn-soft:#3b2c14;
  --unk:#a3abb8; --unk-soft:#262e39; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1218; --surface:#151c25; --surface2:#1b2430; --ink:#e5eaf1; --muted:#9aa5b5; --line:#2b3644;
  --accent:#8fa2ff; --accent-soft:#1f2a52;
  --danger:#ff6e61; --danger-soft:#3d1c1a;
  --ok:#4cc58f; --ok-soft:#173a2b;
  --warn:#e4a94d; --warn-soft:#3b2c14;
  --unk:#a3abb8; --unk-soft:#262e39; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.78;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
a{color:var(--accent);text-underline-offset:3px;text-decoration-thickness:1px}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:var(--bar);display:flex;align-items:center;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;text-decoration:none;color:var(--ink)}
.brand b{font-family:var(--f-display);font-weight:900;font-size:17px;white-space:nowrap}
.brand b em{font-style:normal;color:var(--danger)}
.brand .tick{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .spacer{flex:1}
.icon-btn{font-size:13.5px;border:1px solid var(--line);background:var(--surface);border-radius:6px;height:32px;padding-inline:10px;display:inline-flex;align-items:center;text-decoration:none;color:var(--ink);white-space:nowrap}
.icon-btn:hover{border-color:var(--ink)}
#menuBtn{display:none}

.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:calc(100% - var(--bar))}
.rail{position:sticky;top:calc(var(--bar) + env(safe-area-inset-top,0px));height:calc(100vh - var(--bar) - env(safe-area-inset-top,0px));overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);padding:14px 12px 48px}
.search{width:100%;font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.group{margin-top:16px}
.group h4{margin:0 0 3px;padding-inline:8px;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.navlink{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:4px;align-items:baseline;padding:3px 8px;border-radius:5px;color:var(--ink);text-decoration:none;font-size:13.5px;line-height:1.5}
.navlink .code{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.navlink .amt{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.navlink:hover{background:var(--surface2)}
.navlink[aria-current="page"]{background:var(--danger-soft)}
.navlink[aria-current="page"] .code{color:var(--danger);font-weight:600}
.navlink.soon{color:var(--muted);pointer-events:none}
.results{margin-top:8px}
.result{display:block;padding:6px 8px;border-radius:5px;text-decoration:none;color:var(--ink);font-size:13px;line-height:1.5}
.result:hover{background:var(--surface2)}
.result b{display:block;font-size:13.5px}
.result span{color:var(--muted)}
.result mark{background:var(--warn-soft);color:var(--ink)}

main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.doc{max-width:860px;margin:0 auto;padding-block:30px 90px}
.doc.wide{max-width:1180px}
.eyebrow{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.08em;display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:8px}
.eyebrow b{color:var(--danger);font-weight:600}
.doc h1,.doc h2,.doc h3{font-family:var(--f-display);text-wrap:balance;line-height:1.35;margin:0}
.doc h1{font-size:clamp(26px,4vw,36px);font-weight:900;margin-bottom:14px}
.doc h2{font-size:22px;font-weight:900;margin:44px 0 12px;padding-top:16px;border-top:1px solid var(--line)}
.doc h3{font-size:17px;font-weight:600;margin:26px 0 8px}
.doc p,.doc li{max-width:70ch}
.doc p{margin:10px 0}
.doc ul,.doc ol{padding-left:1.4em;margin:8px 0}
.doc li{margin:3px 0}
.doc code{font-family:var(--f-mono);font-size:.86em;background:var(--surface2);border:1px solid var(--line);padding:0 4px;border-radius:3px}
.thesis{font-size:clamp(16.5px,2vw,19px);line-height:1.7;max-width:46em}
mark.hl{background:linear-gradient(transparent 60%,var(--danger-soft) 60%);color:inherit;padding:0 1px}
.thesis em{font-style:normal;background:linear-gradient(transparent 62%,var(--danger-soft) 62%)}
.lede{color:var(--muted)}

.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:18px 0}
.fig{background:var(--surface);padding:12px 14px;display:grid;gap:2px;align-content:start}
.fig .n{font-family:var(--f-mono);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.3}
.fig .l{font-size:12px;color:var(--muted);line-height:1.5}
.fig.red .n{color:var(--danger)} .fig.green .n{color:var(--ok)} .fig.warn .n{color:var(--warn)}

.tag{display:inline-block;font-size:11px;font-weight:700;padding:0 6px;border-radius:3px;letter-spacing:.04em;white-space:nowrap;vertical-align:1px;line-height:1.7}
.t-fact,.t-P{background:var(--ok-soft);color:var(--ok)}
.t-infer,.t-I{background:var(--accent-soft);color:var(--accent)}
.t-hyp,.t-M{background:var(--warn-soft);color:var(--warn)}
.t-unk,.t-C{background:var(--unk-soft);color:var(--unk)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.why{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 10px;background:var(--surface);color:var(--muted)}
.chip.on{border-color:var(--danger);color:var(--danger);background:var(--danger-soft)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin:16px 0}
.pad{padding:16px}
.note{font-size:13px;color:var(--muted)}
.caveat{font-size:13px;color:var(--muted);border-left:3px solid var(--warn);padding-left:10px;margin:12px 0}
blockquote{margin:14px 0;padding:10px 14px;border-radius:6px;background:var(--surface2);border:1px solid var(--line)}
blockquote p{margin:4px 0}
blockquote.warn{background:var(--warn-soft);border-color:transparent}
blockquote.analogy{background:var(--accent-soft);border-color:transparent}
blockquote.danger{background:var(--danger-soft);border-color:transparent}
.readpts{font-size:14px;margin:6px 0 16px;padding:10px 14px;border-left:3px solid var(--accent);background:var(--surface)}
.readpts b{font-size:12.5px;letter-spacing:.06em;color:var(--accent)}
.readpts ul{margin:4px 0 0}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:14px 0}
table{border-collapse:collapse;width:100%;font-size:13.5px;line-height:1.6}
th,td{text-align:left;padding:8px 11px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;background:var(--surface2);white-space:nowrap}
td{font-variant-numeric:tabular-nums}
td.num{font-family:var(--f-mono);white-space:nowrap;text-align:right}
th.sortable{cursor:pointer;user-select:none}
th.sortable::after{content:" ↕";opacity:.45}
.prio{display:inline-block;font-family:var(--f-mono);font-size:11px;font-weight:600;padding:0 6px;border-radius:3px}
.p0{background:var(--danger-soft);color:var(--danger)} .p1{background:var(--warn-soft);color:var(--warn)} .p2{background:var(--accent-soft);color:var(--accent)}

.sec-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 14px;align-items:baseline;margin:46px 0 14px;padding-top:16px;border-top:1px solid var(--line)}
.sec-head h2{margin:0!important;padding:0!important;border:0!important}
.sec-no{font-family:var(--f-mono);font-size:13px;color:var(--danger);font-weight:600}
.sec-head p{grid-column:2;color:var(--muted);margin:2px 0 0;font-size:14.5px}
.case-hero{padding-bottom:18px}
.toc-in{position:fixed;top:calc(var(--bar) + env(safe-area-inset-top,0px) + 14px);right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));z-index:25;display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:13px}
.toc-tg{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--ink);box-shadow:0 2px 10px color-mix(in srgb,var(--ink) 10%,transparent)}
.toc-tg::after{content:"▾";font-size:10px;color:var(--muted)}
.toc-in.open .toc-tg::after{content:"▴"}
.toc-list{display:none;flex-direction:column;min-width:148px;max-height:calc(100vh - var(--bar) - 90px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 6px 24px color-mix(in srgb,var(--ink) 12%,transparent)}
.toc-in.open .toc-list,.toc-in.pin .toc-list{display:flex}
.toc-in.pin .toc-tg{display:none}
.toc-in.pin .toc-list{box-shadow:none;background:transparent;border:0;border-left:1px solid var(--line);border-radius:0;padding:2px 0 2px 2px}
.toc-list .lnk{text-align:left;background:none;border:0;border-radius:6px;padding:5px 10px;font-size:13px;color:var(--muted);white-space:nowrap}
.toc-list .lnk:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 5%,transparent)}
.toc-list .lnk.on{color:var(--accent);font-weight:600}
.toc-in.pin .toc-list .lnk.on{box-shadow:inset 2px 0 0 var(--accent);border-radius:0}
section{scroll-margin-top:110px}
.ctrls{display:grid;gap:2px}
ol.src{padding-left:22px;display:grid;gap:3px}
ol.src a{word-break:break-all}
.card.unk{border-style:dashed}
/* attack path */
.ap{display:grid;grid-template-columns:minmax(0,1fr) 330px}
@media (max-width:1100px){.ap{grid-template-columns:minmax(0,1fr)}}
.ap-svg{overflow-x:auto;border-right:1px solid var(--line);padding:6px}
@media (max-width:1100px){.ap-svg{border-right:0;border-bottom:1px solid var(--line)}}
.ap-svg svg{display:block;height:auto}
.ap-detail{padding:16px;display:grid;gap:10px;align-content:start;font-size:14px}
.ap-detail .when{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.ap-detail h3{margin:0!important;font-size:16px}
.ap-detail ul{margin:0;padding-left:18px}
.kv{display:grid;gap:2px}
.kv>b{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.kv-tags{letter-spacing:0;font-weight:400;display:inline-flex;gap:4px}
.term{text-decoration:underline dotted var(--muted);text-underline-offset:3px;text-decoration-thickness:1px}
.ti{border:0;background:none;padding:0 1px 0 2px;margin:0;font-size:.7em;line-height:1;vertical-align:super;color:var(--accent);cursor:help;font-family:var(--f-body)}
.ti:hover,.ti[aria-expanded="true"]{color:var(--danger)}
#tip{position:fixed;z-index:60;max-width:min(320px,calc(100vw - 24px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13.5px;line-height:1.6;box-shadow:0 8px 28px color-mix(in srgb,var(--ink) 16%,transparent)}
#tip b{font-size:13.5px}
#tip p{margin:4px 0 6px;color:var(--ink)}
#tip a{font-size:12.5px}
.blockbox{background:var(--ok-soft);border-radius:6px;padding:9px 11px;font-size:13.5px}
.blockbox b{color:var(--ok)}
.stepper{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-top:1px solid var(--line);align-items:center}
.stepper .s{border:1px solid var(--line);background:var(--surface2);border-radius:4px;padding:1px 9px;font-family:var(--f-mono);font-size:12.5px}
.stepper .s[aria-pressed="true"]{background:var(--danger);border-color:var(--danger);color:#fff}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:4px;padding:4px 13px;font-size:13.5px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.spacer{flex:1}
.col-band{fill:var(--surface2)}
.col-h{fill:var(--muted);font-size:11.5px;font-family:var(--f-body);letter-spacing:.04em}
.n-box{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.n-no{fill:var(--danger);font-size:11px;font-family:var(--f-mono);font-weight:600}
.n-title{fill:var(--ink);font-size:13px;font-weight:700;font-family:var(--f-body)}
.n-sub{fill:var(--muted);font-size:10.5px;font-family:var(--f-mono)}
.e-path{fill:none;stroke:var(--line);stroke-width:1.6}
.arrowhead{fill:var(--muted)}
g.node{cursor:pointer}
g.node.on .n-box{stroke:var(--danger);stroke-width:2.2;fill:var(--danger-soft)}
g.node.past .n-box{stroke:var(--danger);stroke-width:1.1}
g.edge.on .e-path{stroke:var(--danger);stroke-width:2.4}
g.edge.past .e-path{stroke:var(--danger);opacity:.45}
g.node.unk .n-box{stroke-dasharray:4 3}
@media (prefers-reduced-motion:no-preference){g.edge.on .e-path{stroke-dasharray:7 5;animation:flow 1s linear infinite}}
@keyframes flow{to{stroke-dashoffset:-24}}

/* timeline */
.tl{display:grid;margin:10px 0}
.tr{display:grid;grid-template-columns:118px 18px minmax(0,1fr);gap:0 12px}
.tr .d{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);text-align:right;padding-top:2px}
.tr .rl{position:relative}
.tr .rl::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--line)}
.tr .rl::after{content:"";position:absolute;left:3px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--ink)}
.tr.hot .rl::after{background:var(--danger);border-color:var(--danger)}
.tr.ok .rl::after{background:var(--ok);border-color:var(--ok)}
.tr .c{padding-bottom:14px;min-width:0}
.tr .c b{display:block}
.tr .c span{color:var(--muted);font-size:13.5px}
@media (max-width:560px){.tr{grid-template-columns:84px 16px minmax(0,1fr);gap:0 8px}}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin:12px 0}
.card{border:1px solid var(--line);border-radius:6px;padding:12px;background:var(--surface);display:grid;gap:5px;align-content:start;font-size:13.5px}
.card .pair{font-family:var(--f-mono);font-size:11.5px;color:var(--danger)}
.card b{font-size:14.5px}
.card p{margin:0;color:var(--muted)}
.card s{color:var(--muted)}
.card.myth p{color:var(--ink)}

.mmd-wrap{margin:16px 0 6px;padding:14px;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;position:relative}
.mmd-wrap pre.mmd{margin:0;font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:pre-wrap}
.mmd-wrap svg{display:block;margin:0 auto;max-width:100%;height:auto}
.mmd-wrap.ready{cursor:zoom-in}
.mmd-wrap .zoom-chip{position:absolute;top:8px;right:8px;font-size:11.5px;border-radius:999px;padding:1px 9px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);pointer-events:none}
.viewer{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;background:var(--bg)}
.viewer-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.viewer-bar .vt{flex:1 1 200px;font-family:var(--f-display);font-weight:600}
.viewer-port{flex:1;overflow:hidden;position:relative;cursor:grab;touch-action:none}
.viewer-stage{position:absolute;left:0;top:0;transform-origin:0 0}
.viewer-stage svg{display:block;max-width:none!important;background:var(--surface);border-radius:8px}

.lab-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:14px 0}
.lab-card{display:grid;gap:3px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-decoration:none;color:var(--ink);font-size:13.5px}
.lab-card:hover{border-color:var(--danger)}
.lab-card .from{font-family:var(--f-mono);font-size:11px;color:var(--danger)}
.lab-card b{font-size:14.5px}
.lab-card span{color:var(--muted)}
a.lab-link::after{content:" ▸";color:var(--danger);font-size:.85em}
.frame{width:100%;height:calc(100vh - var(--bar) - 140px);min-height:560px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}

/* lab widgets */
.lab{display:grid;grid-template-columns:300px minmax(0,1fr);border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:16px 0}
@media (max-width:820px){.lab{grid-template-columns:minmax(0,1fr)}}
.lab .ctl{padding:16px;border-right:1px solid var(--line);display:grid;gap:12px;align-content:start}
@media (max-width:820px){.lab .ctl{border-right:0;border-bottom:1px solid var(--line)}}
.lab .out{padding:16px;display:grid;gap:14px;align-content:start;min-width:0}
.rng{display:grid;gap:2px;font-size:13.5px}
.rng input[type=range]{width:100%;accent-color:var(--danger)}
.rng select{font:inherit;font-size:13.5px;padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink)}
.chk{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:2px 8px;padding:7px 9px;border:1px solid transparent;border-radius:6px;font-size:13.5px;align-items:start}
.chk:hover{background:var(--surface2)}
.chk input{margin-top:5px;accent-color:var(--ok)}

<script>
(function(){
const $=s=>document.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const NS="http://www.w3.org/2000/svg";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function el(tag,attrs,parent,text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;if(parent)parent.appendChild(e);return e;}
const TAG={fact:'<span class="tag t-fact">事实</span>',infer:'<span class="tag t-infer">推论</span>',hyp:'<span class="tag t-hyp">假设</span>',unk:'<span class="tag t-unk">未知</span>'};
const EV={P:'<span class="tag t-P" title="平台、监管、司法等原始披露">P</span>',I:'<span class="tag t-I" title="调查机构研究">I</span>',M:'<span class="tag t-M" title="媒体或二手转引">M</span>',C:'<span class="tag t-C" title="仅索引线索">C</span>'};
const evTags=s=>(s||"").split("+").map(x=>EV[x.trim()]||"").join(" ");
window.H.util={$,$$,el,esc,TAG,EV,evTags,NS};

/* ---------- money ---------- */
function money(m){ if(m==null||isNaN(m))return "—"; if(m>=100)return "$"+(m/100).toFixed(m>=1000?1:2).replace(/\.?0+$/,"")+" 亿"; return "$"+(m>=10?Math.round(m):m.toFixed(1))+"M";}
H.util.money=money;
function moneyCN(m){ if(m==null)return "未披露"; if(m>=100)return "约 "+(m/100).toFixed(2).replace(/\.?0+$/,"")+" 亿美元"; return "约 "+(m>=10?Math.round(m):m)+" 百万美元";}
H.util.moneyCN=moneyCN;

/* ---------- trust domains ---------- */
const DOMAINS=["攻击者","社工/人","终端","身份/会话","云/内部平台","供应商","前端/界面","签名/密钥","治理","合约","预言机/市场","跨链","链上","洗钱"];
H.util.DOMAINS=DOMAINS;
const LAYER_EXCL=new Set(["攻击者","洗钱"]);
function layersOf(c){return new Set(c.steps.map(s=>s.d).filter(d=>!LAYER_EXCL.has(d))).size;}
H.util.layersOf=layersOf;

/* ---------- registry ---------- */
const GROUPS=[
 {k:"start",t:"开始"},
 {k:"p0",t:"第 0 部分 · 总论"},
 {k:"p1",t:"第 1 部分 · 独立案件"},
 {k:"p2",t:"第 2 部分 · 手法归纳"},
 {k:"p3",t:"第 3 部分 · 防御与附录"},
 {k:"lab",t:"实验室"}
];
// cases -> docs
H.cases.sort((a,b)=>a.date.localeCompare(b.date));
H.cases.forEach((c,i)=>{c.code="C"+String(i+1).padStart(2,"0");c.layers=layersOf(c);
  H.docs.push({id:c.id,code:c.code,group:"p1",title:c.name,amt:money(c.loss),render:()=>renderCase(c),after:root=>afterCase(c,root)});});
(H.soon||[]).forEach(s=>H.docs.push({id:"soon-"+s[0],code:"··",group:"p1",title:s[0],amt:s[1],soon:true}));
const ORDER=["start","p0","p1","p2","p3","lab"];
H.docs.sort((a,b)=>ORDER.indexOf(a.group)-ORDER.indexOf(b.group)||(a.ord||0)-(b.ord||0));
const byId={};H.docs.forEach(d=>byId[d.id]=d);
H.byId=byId;
// labs index doc
byId.labs={id:"labs",code:"",group:"",title:"实验室",render:()=>{
  const ls=H.docs.filter(d=>d.group==="lab");
  return `<div class="eyebrow"><span>LAB INDEX</span></div><h1>实验室</h1><p class="lede">每个实验对应一类手法。拖动参数，观察结果变化。各章的“动手验证”链接到这里。</p>
  <div class="lab-cards">${ls.map(d=>`<a class="lab-card" href="#${d.id}"><span class="from">${d.code} · ${esc(d.tagline||"")}</span><b>${esc(d.title)}</b><span>${esc(d.desc||"")}</span></a>`).join("")}</div>`;}};

/* ---------- nav ---------- */
function buildNav(){
  $("#navGroups").innerHTML=GROUPS.map(g=>{const ds=H.docs.filter(d=>d.group===g.k);if(!ds.length)return "";
    return `<div class="group"><h4>${g.t}</h4>${ds.map(d=>d.soon?`<span class="navlink soon"><span class="code">··</span><span>${esc(d.title)}</span><span class="amt">第二批</span></span>`:`<a class="navlink" href="#${d.id}" data-id="${d.id}"><span class="code">${d.code}</span><span>${esc(d.title)}</span><span class="amt">${d.amt||""}</span></a>`).join("")}</div>`;}).join("");
}
buildNav();

/* ---------- case render ---------- */
function secHead(n,t,d){return `<div class="sec-head"><span class="sec-no">${n}</span><h2>${t}</h2>${d?`<p>${d}</p>`:""}</div>`;}
H.secHead=secHead;
function renderCase(c){
  const why=[`<span class="chip ${c.loss>=10?"on":""}">资损 ${c.loss>=10?"≥":"<"} $10M</span>`,`<span class="chip ${c.layers>3?"on":""}">攻击路径 ${c.layers} 层</span>`,`<span class="chip">${esc(c.type)}</span>`,`<span class="chip">${esc(c.chain)}</span>`].join("");
  let n=0;const N=()=>String(++n).padStart(2,"0");
  let h=`<header class="case-hero"><div class="eyebrow"><span>${c.code} · INCIDENT ${c.date}</span><span>${esc(c.type.toUpperCase())}</span><span>归因：<b>${esc(c.attr)}</b></span><span>证据 ${evTags(c.ev)}</span></div>
  <h1>${esc(c.name)}：${esc(c.sub)}</h1>
  <p class="thesis">${c.thesis}</p>
  <div class="why">${why}</div>
  <div class="figs">${c.figs.map(f=>`<div class="fig ${f[2]||""}"><span class="n">${/^\d+ 层$/.test(f[0])?c.layers+" 层":f[0]}</span><span class="l">${f[1]}</span></div>`).join("")}</div>
  <div class="legend"><span>${TAG.fact} 原始披露明确</span><span>${TAG.infer} 由结果和时间顺序推出</span><span>${TAG.hyp} 可行但无直接证据</span><span>${TAG.unk} 公开资料不足</span></div></header>
  <nav class="toc-in open" aria-label="本章目录"><button type="button" class="toc-tg" aria-expanded="true">本章目录</button><div class="toc-list"><button type="button" class="lnk" data-jump="s-path">攻击路径</button><button type="button" class="lnk" data-jump="s-time">时间线</button><button type="button" class="lnk" data-jump="s-ttp">手法</button><button type="button" class="lnk" data-jump="s-sim">阻塞点模拟</button>${c.mermaid?`<button type="button" class="lnk" data-jump="s-mech">机制图</button>`:""}<button type="button" class="lnk" data-jump="s-root">根因</button><button type="button" class="lnk" data-jump="s-fix">改进方向</button>${c.embed?`<button type="button" class="lnk" data-jump="s-embed">原版交互</button>`:""}<button type="button" class="lnk" data-jump="s-src">来源</button></div></nav>`;
  h+=`<section id="s-path">${secHead(N(),"攻击路径：从入口到资金离开",`每一列是一个信任域。红线是攻击者的移动顺序。点击节点或步骤号，查看该步的事实、手法和阻塞点。虚线框表示机制未公开。本案跨过 <b>${c.layers}</b> 个信任域。`)}
  <div class="panel"><div class="ap"><div class="ap-svg"><svg class="apmap" role="img" aria-label="${esc(c.name)} 攻击路径图"></svg></div><div class="ap-detail" aria-live="polite"></div></div>
  <div class="stepper"><button class="btn ghost" data-act="prev" type="button">上一步</button><span class="sbtns" style="display:flex;flex-wrap:wrap;gap:5px"></span><button class="btn" data-act="next" type="button">下一步</button><span class="spacer"></span><button class="btn ghost" data-act="play" type="button">自动播放</button></div></div></section>`;
  h+=`<section id="s-time">${secHead(N(),"时间线",c.timeDesc||"红点是资金离开的时刻。绿点是处置或追回。日期区分发生、发现与披露。")}<div class="panel pad"><div class="tl">${c.timeline.map(t=>`<div class="tr ${t[3]||""}"><div class="d">${t[0]}</div><div class="rl"></div><div class="c"><b>${t[1]}</b><span>${t[2]||""}</span></div></div>`).join("")}</div></div>${c.extra||""}</section>`;
  h+=`<section id="s-ttp">${secHead(N(),"手法拆解","每一步对应一个信任域。ATT&amp;CK 编号是本手册的映射，不是受害方结论。业务层和链上的步骤没有对应编号。")}
  <div class="tbl-wrap"><table><thead><tr><th>步骤</th><th>信任域</th><th>手法</th><th>ATT&amp;CK 参照</th><th>证据</th></tr></thead><tbody>${c.steps.map((s,i)=>`<tr><td><b>${"①②③④⑤⑥⑦⑧⑨⑩"[i]||i+1} ${esc(s.name)}</b></td><td>${esc(s.d)}</td><td>${s.how}</td><td class="mono" style="font-size:12px">${s.att||"—"}</td><td>${(s.ev||[]).map(t=>TAG[t]).join(" ")}</td></tr>`).join("")}</tbody></table></div></section>`;
  h+=`<section id="s-sim">${secHead(N(),"阻塞点模拟器：哪一道控制能断链","勾选防御控制，看攻击链在哪一步断开，以及剩余暴露金额。先只勾最后几步，再勾最前面几步，比较结果。")}<div class="bsim" data-case="${c.id}"></div></section>`;
  if(c.mermaid){h+=`<section id="s-mech">${secHead(N(),"机制图",c.mermaidIntro||"下图展示关键机制。点击图可以全屏放大。")}<div class="mmd-wrap" data-title="${esc(c.name)} 机制图"><pre class="mmd">${esc(c.mermaid)}</pre></div>${c.readpts?`<div class="readpts"><b>读图要点</b><ul>${c.readpts.map(x=>`<li>${x}</li>`).join("")}</ul></div>`:""}${c.analogy?`<blockquote class="analogy"><p>🎯 打个比方：${c.analogy}</p></blockquote>`:""}</section>`;}
  h+=`<section id="s-root">${secHead(N(),`根因：${c.roots.length} 段信任关系缺少独立约束`,"单个失误只是起点。下面每一段信任，都让攻击者跨到了下一个域。")}<div class="cards">${c.roots.map(r=>`<div class="card"><span class="pair">${r[0]}</span><b>${r[1]}</b><p>${r[2]}</p></div>`).join("")}</div>
  <h3>${c.myths.length} 个常见误读</h3><div class="cards">${c.myths.map(m=>`<div class="card myth"><s>“${m[0]}”</s><p>${m[1]}</p></div>`).join("")}</div></section>`;
  h+=`<section id="s-fix">${secHead(N(),"可借鉴的改进方向","按攻击链顺序排列。每项写明它切断哪一步。P0 立即做，P1 近期做，P2 持续做。")}<div class="tbl-wrap"><table><thead><tr><th>优先级</th><th>做什么</th><th>切断哪一步</th><th>怎样验证已做好</th></tr></thead><tbody>${c.fixes.map(f=>`<tr><td><span class="prio p${f[0]}">P${f[0]}</span></td><td>${f[1]}</td><td class="mono">${f[2]}</td><td>${f[3]}</td></tr>`).join("")}</tbody></table></div>
  ${c.signals?`<h3>检测信号：每一步可见的异常</h3><div class="tbl-wrap"><table><thead><tr><th>监测对象</th><th>本案中的异常信号</th><th>响应动作</th></tr></thead><tbody>${c.signals.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</tbody></table></div>`:""}
  <h3>动手验证</h3><div class="lab-cards">${(c.labs||[]).map(id=>{const d=byId[id];return d?`<a class="lab-card" href="#${d.id}"><span class="from">${d.code}</span><b>${esc(d.title)}</b><span>${esc(d.desc||"")}</span></a>`:""}).join("")}</div></section>`;
  if(c.embed)h+=`<section id="s-embed">${secHead(N(),"原版交互复盘","本案原有的全部交互保留在下方：9 步攻击路径、当晚时间轴、阻塞点模拟、Nonce 喷洒、MPC 策略层、损失按链分布。")}<p><a href="${c.embed}" target="_blank" rel="noopener">在新标签页打开原版复盘 ↗</a></p><iframe class="frame" src="${c.embed}" title="币安热钱包事件原版交互复盘" loading="lazy"></iframe></section>`;
  h+=`<section id="s-src">${secHead(N(),c.unknowns?"未知项、局限与来源":"局限与来源","")}
  ${c.unknowns?`<div class="cards">${c.unknowns.map((u,i)=>`<div class="card unk"><span class="pair" style="color:var(--unk)">Q${String(i+1).padStart(2,"0")} · 未知</span><b>${u}</b></div>`).join("")}</div>`:""}
  ${c.limits?`<p class="caveat">${c.limits}</p>`:""}
  <ol class="note src">${c.sources.map(s=>`<li>${s[1]?`<a href="${s[1]}" target="_blank" rel="noopener">${esc(s[0])}</a>`:esc(s[0])}</li>`).join("")}</ol></section>`;
  return h;
}
H.renderCase=renderCase;

/* ---------- blocker simulator (shared with L1) ---------- */
function blockSim(box,c){
  const steps=c.steps.map((s,i)=>({...s,i})).filter(s=>s.d!=="洗钱");
  const cut=c.cut!=null?c.cut:steps[steps.length-1].i;
  box.innerHTML=`<div class="lab"><div class="ctl"><div class="seg" role="group" aria-label="预设"><button type="button" data-p="none">事发时</button><button type="button" data-p="late">只加固末端</button><button type="button" data-p="early">只加固入口</button><button type="button" data-p="all">纵深防御</button></div>

}

/* ---------- 思考题: inline answer boxes ---------- */
function decorateQuestions(root, id) {

  let idx = 0;
  hs.forEach(h => {
    let ol = h.nextElementSibling; while (ol && !/^(OL|UL)$/.test(ol.tagName) && !/^H[1-3]$/.test(ol.tagName)) ol = ol.nextElementSibling;
    if (!ol || !/^(OL|UL)$/.test(ol.tagName)) return;
    $$(':scope > li', ol).forEach(li => {
      const k = idx++;
      if ($('.ll-ans', li)) return;
      const v = (N[id] && N[id].ans && N[id].ans[k]) || '';
      const d = document.createElement('details'); d.className = 'll-ans' + (v.trim() ? ' filled' : '');
      const ref = ((window.LL_ANSWERS || {})[id] || [])[k];
      const ck = N[id] && N[id].ck ? N[id].ck[k] : undefined;
      d.innerHTML = `<summary>✎ 写下我的答案${ref ? ' · 参考答案' : ''}</summary><textarea id="ll-ans-${esc(id)}-${k}" data-ll-ans="${k}" placeholder="用自己的话回答。自动保存。写完再对照参考答案。">${esc(v)}</textarea>`
        + (ref ? `<div class="ll-refbox" data-k="${k}"><button type="button" class="ll-btn" data-ll-ref="${k}">${v.trim() ? '对照参考答案' : '直接看参考答案'}</button><div class="ll-ref" hidden><div class="ll-ref-h">参考答案</div><div class="ll-ref-b">${ref}</div>

      if (ref && ck !== undefined) d.classList.add('checked', 'ck' + ck);

}

/* ---------- highlights ---------- */
const SKIP = 'script,style,svg,textarea,input,button,select,.ll-strip,.ll-card,.ll-ans,.lab,.lab-body,.mmd-body,.mmd-wrap,figure.mmd,.code-wrap,pre';

}
const strip = s => s.replace(/\s+/g, '');
function locate(root, quote) { // match ignoring whitespace; returns [{node,start,end}]

  const at = flat.indexOf(target); if (at < 0) return null;

}

    const m = document.createElement('mark'); m.className = 'll-hl' + (h.n ? ' has-n' : ''); m.dataset.h = h.id; m.title = h.n || '高亮';
    try { r.surroundContents(m); } catch (e) {}

}
function applyHighlights(root, id) {

  n.hl.forEach(h => { if (root.querySelector(`mark.ll-hl[data-h="${h.id}"]`)) return; const segs = locate(root, h.q); if (segs) wrap(segs, h); });
}
function unwrap(root, hid) { $$(`mark.ll-hl[data-h="${hid}"]`, root).forEach(m => { const p = m.parentNode; while (m.firstChild) p.insertBefore(m.firstChild, m); p.removeChild(m); p.normalize(); }); }

let selBox = null;
function hideSel() { if (selBox) { selBox.remove(); selBox = null; } }
function onSelect() {
  const root = rootEl(); const sel = window.getSelection();

  const r = sel.getRangeAt(0); const txt = sel.toString().trim();

  const anc = r.commonAncestorContainer.nodeType === 1 ? r.commonAncestorContainer : r.commonAncestorContainer.parentElement;
  if (anc && anc.closest(SKIP)) { hideSel(); return; }
  const rect = r.getBoundingClientRect();

  selBox.innerHTML = `<button type="button" data-ll-mk="0">高亮</button><button type="button" data-ll-mk="1">高亮并批注</button><button type="button" data-ll-mk="2">记到笔记</button>`;
  document.body.appendChild(selBox);

  const y = rect.bottom + 8 + 40 > window.innerHeight ? rect.top - 44 : rect.bottom + 8;
  selBox.style.left = x + 'px'; selBox.style.top = Math.max(8, y) + 'px';

}

  const n = note(id); n.title = titleOf(id);
  if (toNote) { n.text = (n.text.trim() ? n.text.replace(/\s+$/, '') + '\n\n' : '') + '> ' + q.replace(/\n+/g, ' ') + '\n'; n.up = Date.now(); touch(id); refreshCur(); toast('已记到本篇笔记'); return; }
  const h = { id: 'h' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), q, n: '', t: Date.now() };
  n.hl.push(h); n.up = Date.now(); touch(id);

function link(id, label) { return `<a href="#${esc(id)}" data-ll-nav>${esc(label || titleOf(id))}</a>`; }
const label = c => (c.code && !c.title.startsWith(c.code) ? c.code + ' ' : '') + c.title;
function homeHtml() {

  </div>
  <div class="ll-bar" role="img" aria-label="已掌握 ${st.m} 篇，已读 ${st.d} 篇，在读 ${st.r} 篇，共 ${st.total} 篇"><i class="m" style="width:${st.total ? st.m / st.total * 100 : 0}%"></i><i class="d" style="width:${st.total ? st.d / st.total * 100 : 0}%"></i><i class="r" style="width:${st.total ? st.r / st.total * 100 : 0}%"></i></div>
  <div class="ll-hint">绿色：已掌握 ${st.m} 篇 · 蓝色：已读 ${st.d} 篇 · 橙色：在读 ${st.r} 篇 · 笔记 ${nNotes} 篇 · 高亮 ${nHl} 处</div>

    ${next ? `<div class="ll-item"><span class="ll-meta">建议下一篇（按目录顺序，第一篇还没读完的）</span>${link(next.id, label(next))}</div>` : ''}

  </div></div>

}

/* ---------- section map + reading progress ---------- */
