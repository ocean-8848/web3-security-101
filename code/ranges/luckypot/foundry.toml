# Audit range target: local toy contracts only. No RPC endpoints, no forks.
[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.30"
evm_version = "prague"
remappings = ["forge-std/=lib/forge-std/src/"]

[fuzz]
runs = 256
seed = "0x7"

[invariant]
runs = 128
depth = 32
fail_on_revert = false
