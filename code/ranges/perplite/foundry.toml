[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
remappings = ["forge-std/=lib/forge-std/src/"]

[invariant]
runs = 128
depth = 60
fail_on_revert = false

