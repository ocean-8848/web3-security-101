[package]
name = "solana_vault_lab"
version = "0.1.0"
description = "Educational Solana/Anchor security lab: vulnerable vs safe patterns"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solana_vault_lab"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"

[profile.release]
overflow-checks = true
