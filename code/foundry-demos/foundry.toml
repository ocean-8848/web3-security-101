# 手册教学靶场：只跑本地玩具合约。没有分叉，也没有 RPC 配置。
[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.30"
evm_version = "prague" # EIP-7702 需要 prague
allow_paths = ["../snippets"]   # test/ 需要导入 ../snippets/ 下的 0N-*.sol
remappings = ["forge-std/=lib/forge-std/src/", "snippets/=../snippets/"]

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 32
fail_on_revert = false
