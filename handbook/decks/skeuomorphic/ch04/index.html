<!doctype html>
<html lang="zh-CN">
<head>

<title>重入攻击：在你记账之前再取一次钱</title>
<style>
:root {
  --ground: #f6f5f1; --paper: #fffefb; --ink: #1d1c19; --ink-2: #5d5a52; --rule: #e4e1d8; --tint: #efece4;
  --gold: #b38300; --gold-soft: #f8edcc; --accent: #1d93ba; --accent-soft: #e1f1f7;
  --f-display: "Noto Serif SC", "Songti SC", "STSong", serif;
  --f-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --ground: #131311; --paper: #1a1a17; --ink: #ebe9e2; --ink-2: #a5a298; --rule: #2f2e29; --tint: #23221e;
    --gold: #f0b90b; --gold-soft: #3a3010; --accent: #6cc7e0; --accent-soft: #15303a; color-scheme: dark; }
}
:root[data-theme="dark"] { --ground: #131311; --paper: #1a1a17; --ink: #ebe9e2; --ink-2: #a5a298; --rule: #2f2e29; --tint: #23221e;
  --gold: #f0b90b; --gold-soft: #3a3010; --accent: #6cc7e0; --accent-soft: #15303a; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 6px; }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--ground); }
.top { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--rule); background: var(--paper); min-width: 0; }
.top .t { flex: 1; min-width: 0; }
.top .eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; color: var(--gold); }
.top h1 { margin: 0; font-family: var(--f-display); font-size: 16px; font-weight: 800; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn { height: 34px; padding: 0 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); cursor: pointer; white-space: nowrap; font-size: 14px; }
.btn:hover { border-color: var(--gold); }
.btn[aria-pressed="true"] { background: var(--gold-soft); border-color: var(--gold); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn:disabled { opacity: .4; cursor: default; }

.body { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; }
.stagewrap { min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 14px; }
.screen { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 100%; overflow: hidden; border-radius: 12px; background: #efebe3;
  box-shadow: 0 1px 0 var(--rule), 0 8px 28px rgba(60, 50, 30, .14); cursor: pointer; touch-action: pan-y; user-select: none; }
.screen iframe { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; transform-origin: 0 0; visibility: hidden; pointer-events: none; }
.screen iframe.on { visibility: visible; }
.screen .still { position: absolute; inset: 0; background-repeat: no-repeat; background-color: #efebe3; }
.screen.live .still { visibility: hidden; }
.screen .wait { position: absolute; left: 12px; bottom: 12px; padding: 4px 12px; border-radius: 999px; color: #fff; font-size: 13px; background: rgba(28, 28, 28, .72); }
.btn.play { border-color: var(--accent); color: var(--accent); }
.screen .wait[hidden] { display: none; }

.side { min-height: 0; overflow-y: auto; border-left: 1px solid var(--rule); background: var(--paper); padding: 18px 20px 24px; }
.sec { font-size: 12px; color: var(--accent); font-weight: 600; letter-spacing: .04em; }
.side h2 { margin: 4px 0 12px; font-family: var(--f-display); font-size: 22px; font-weight: 800; line-height: 1.4; text-wrap: balance; }
.side ul { margin: 0; padding: 0; list-style: none; }
.side li { position: relative; padding: 6px 0 6px 18px; border-top: 1px solid var(--rule); }
.side li:first-child { border-top: 0; }
.side li::before { content: ""; position: absolute; left: 2px; top: 16px; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
.notes { margin-top: 18px; border: 1px solid var(--rule); border-radius: 8px; }
.notes > summary { cursor: pointer; padding: 8px 12px; font-size: 13px; font-weight: 600; color: var(--ink-2); list-style: none; }
.notes > summary::-webkit-details-marker { display: none; }
.notes > summary::before { content: "▸ "; }
.notes[open] > summary::before { content: "▾ "; }
.notes ol { margin: 0; padding: 4px 14px 10px 32px; font-size: 14px; color: var(--ink-2); }
.notes li { border: 0; padding: 2px 0; }
.notes li::before { display: none; }

.ctrl { display: flex; align-items: center; gap: 8px; padding: 8px 14px calc(8px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--rule); background: var(--paper); flex-wrap: wrap; }
.count { font-family: var(--f-mono); font-size: 13px; color: var(--ink-2); min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
.prog { flex: 1 1 240px; display: flex; gap: 3px; align-items: center; height: 30px; min-width: 160px; }
.prog .grp { display: flex; gap: 2px; flex: var(--n) 1 0; }
.prog .grp + .grp { margin-left: 6px; }
.prog button { flex: 1; height: 8px; padding: 0; border: 0; border-radius: 3px; background: var(--tint); cursor: pointer; }
.prog button.seen { background: var(--gold-soft); }
.prog button.cur { background: var(--gold); }
.prog button:hover { outline: 1px solid var(--gold); }
.speed { height: 34px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); padding: 0 6px; font-size: 13px; }

/* fullscreen: picture fills, text sits on the right */
.app:fullscreen .body { grid-template-columns: minmax(0, 1fr) 380px; }
.app:fullscreen .top { display: none; }

@media (max-width: 960px), (max-aspect-ratio: 4/3) {
  .body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .stagewrap { padding: 10px 10px 0; }
  .screen { max-height: none; }
  .side { border-left: 0; border-top: 0; background: var(--ground); padding: 12px 14px 20px; }
  .side h2 { font-size: 19px; margin-bottom: 8px; }
  .hide-narrow { display: none; }
  .app:fullscreen .body { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .top { padding: 6px 10px; }
  .top h1 { font-size: 14px; }
  .ctrl { gap: 6px; padding-inline: 10px; }
  .prog { order: -1; flex-basis: 100%; }
  .btn { padding: 0 10px; }
}
</style>
</head>

  <header class="top">

  </nav>
</div>

  var D = {"chapter": "s04", "title": "重入攻击：在你记账之前再取一次钱", "segs": 6, "slides": [{"seg": "1", "t0": 0.0, "t1": 17.55, "title": "The DAO：两行代码写反", "points": ["2016 年 6 月，被提走约 360 万 ETH", "按事发时价格约 6000 万美元", "合约没有被破解，只是两行代码的顺序写反了"], "notes": ["2016 年 6 月，以太坊上的 The DAO，被提走了约 360 万 ETH。", "按事发时的价格，约 6000 万美元。", "合约没有被破解。", "它只是把两行代码的顺序，写反了。"], "section": "顺序写反了", "k": 17.55}, {"seg": "1", "t0": 17.55, "t1": 30.01, "title": "先猜一道题", "points": ["银行合约金库有 10 个 ETH，你的余额是 1 个", "只调用一次取款函数，最多能取走多少？"], "notes": ["先猜一道题。", "一个银行合约，金库里有 10 个 ETH。你在里面的余额，是 1 个。", "你只调用一次取款函数，最多能取走多少？"], "section": "顺序写反了", "k": 30.01}, {"seg": "1", "t0": 30.01, "t1": 47.77, "title": "答案：全部 10 个", "points": ["前提：银行先转账、后清零，而你是一个合约", "每收到一笔钱，就在收款那一刻再调用一次取款", "账本清零要等所有嵌套调用都返回之后"], "notes": ["答案是，全部 10 个。", "前提有两个：银行先转账、后清零。而你，是一个合约。", "你每收到一笔钱，就在收款的那一刻，再调用一次取款。", "账本清零，要等到所有嵌套调用都返回之后。"], "section": "顺序写反了", "k": 43.81}, {"seg": "1", "t0": 47.77, "t1": 62.26, "title": "这就是重入", "points": ["最古老，也最常复发的合约漏洞", "本集：控制权在哪交出去、重入有哪几种、怎样把顺序写对"], "notes": ["这就是重入。最古老，也最常复发的合约漏洞。", "这一集讲三件事：控制权在哪里交出去，重入有哪几种，怎样把顺序写对。"], "section": "顺序写反了", "k": 62.26}, {"seg": "2", "t0": 0.0, "t1": 18.11, "title": "重入的定义", "points": ["合约更新账本之前，把控制权交给了外部地址", "外部地址趁账本还是旧的，再次调用合约", "严格说：函数还没执行完，就被外部调用再次进入"], "notes": ["先给一句话的定义。", "合约在更新自己的账本之前，把控制权交给了外部地址。", "外部地址趁账本还是旧的，再次调用合约。", "严格来说，重入是一个函数还没执行完，就被外部调用再次进入。"], "section": "交出控制权", "k": 1.55}, {"seg": "2", "t0": 18.11, "t1": 41.93, "title": "先给钱、后改账的柜员", "points": ["柜员先把 100 元现金递给你，然后才改账本", "接钱瞬间同伴说再取 100，账本上还是 100", "一直先给钱后改账，就能取到金库见底"], "notes": ["打个比方。你去银行取 100 元。", "柜员先把现金递给你，然后才去改账本。", "你接过现金的瞬间，同伴在旁边说：他要再取 100 元。", "柜员一查，账本上还是 100，于是又给了一次。", "只要柜员一直先给钱、后改账，你们就能一直取，直到金库见底。"], "section": "交出控制权", "k": 31.91}, {"seg": "2", "t0": 41.93, "t1": 55.39, "title": "不是并发，而是嵌套", "points": ["现实里柜员可以同时接待两个人", "EVM 是单线程的", "第二次取款整个发生在第一次取款的中间"], "notes": ["这个比方有一处不成立。现实里，柜员可以同时接待两个人。", "EVM 是单线程的。重入不是并发，而是嵌套。", "第二次取款，整个发生在第一次取款的中间。"], "section": "交出控制权", "k": 50.98}, {"seg": "2", "t0": 55.39, "t1": 71.17, "title": "重入的两个前提", "points": ["函数中途发起外部调用，被调用方受攻击者控制", "外部调用发生时，状态还没更新到最终值"], "notes": ["所以，重入的前提只有两个。", "第一，合约在函数中途发起外部调用，而被调用的一方，受攻击者控制。", "第二，外部调用发生的时候，合约的状态，还没有更新到最终值。"], "section": "交出控制权", "k": 70.94}, {"seg": "2", "t0": 71.17, "t1": 92.93, "title": "交出控制权的操作", "points": ["用 call 转 ETH，会执行接收合约的 receive 或 fallback", "调用攻击者部署的代币 transfer，代码可以是任意的", "ERC-777 代币转账会触发接收方的钩子"], "notes": ["哪些操作会交出控制权？一共有六类。", "用 call 转 ETH。接收方是合约时，会执行它的 receive，或者 fallback。", "调用代币的 transfer。代币如果是攻击者部署的，里面的代码可以是任意的。", "ERC-777 代币转账，会触发接收方的钩子。"], "section": "交出控制权", "k": 75.47}, {"seg": "2", "t0": 92.93, "t1": 108.79, "title": "回调与用户提供的地址", "points": ["NFT 安全转账和安全铸造会回调接收方", "闪电贷回调，设计上就交出控制权", "调用任何用户提供的地址：路由器、钩子、预言机"], "notes": ["NFT 的安全转账和安全铸造，会回调接收方。", "闪电贷的回调，设计上就是把控制权交给借款人。", "还有，调用任何用户提供的地址，包括路由器、钩子和预言机。"], "section": "交出控制权", "k": 101.98}, {"seg": "2", "t0": 108.79, "t1": 133.8, "title": "换一条链，入口不一样", "points": ["TRON：转 TRX 不执行 fallback，附带 callValue 才会", "Mantle：ETH 是 ERC-20，转它不触发 receive", "Mantle 上转原生币 MNT 才会触发"], "notes": ["再补一个细节。同一份代码，换一条链，回调入口就不一样。", "在 TRON 上，用系统交易转 TRX，不会执行接收合约的 fallback。", "附带 callValue 去调用合约，才会执行。", "在 Mantle 上，ETH 以 ERC-20 的形式存在，转它不触发 receive。转原生币 MNT，才会触发。"], "section": "交出控制权", "k": 114.09}, {"seg": "3", "t0": 0.0, "t1": 23.21, "title": "第一种：单函数重入", "points": ["漏洞版取款：读余额、转账、清零", "银行读到余额 1 个 ETH，用 call 转过去", "攻击合约的 receive 被触发，再调用一次取款"], "notes": ["接下来，按调用栈，一种一种看。", "第一种，单函数重入。", "漏洞版的取款函数，分三步：读余额，转账，清零。", "攻击者调用取款。银行读到余额 1 个 ETH，用 call 把钱转过去。", "攻击合约的 receive 被触发。银行还有钱，它就再调用一次取款。"], "section": "四种重入", "k": 4.3}, {"seg": "3", "t0": 23.21, "t1": 49.05, "title": "一层套一层，最后才清零", "points": ["第二层读到的余额还是 1 个，第一层还没清零", "递归到金库不够才停，再依次返回、依次清零", "gas 和调用深度 1024 限制递归，所以每次取尽量多"], "notes": ["第二层读到的余额，还是 1 个。因为第一层的清零，还没执行。", "一层套一层，直到金库余额不够，递归才停下来。", "然后各层依次返回，依次清零。这时钱已经没了。", "递归有上限。gas 和调用深度 1024，都会限制它。所以攻击者会每次取尽量大的金额，减少层数。"], "section": "四种重入", "k": 34.76}, {"seg": "3", "t0": 49.05, "t1": 57.81, "title": "第二种：跨函数重入", "points": ["攻击者不回到取款函数", "而是进入 t0": 0.0, "t1": 25.61, "title": "首选：CEI 模式", "points": ["检查、修改状态、外部交互，按这个顺序写", "只改一处：把清零挪到转账之前", "重入进来读到余额 0，require 直接回滚"], "notes": ["怎么防？首选，是 CEI 模式。", "CEI 是三个词：检查，修改状态，外部交互。函数按这个顺序写。", "取款函数只改一处：把清零，挪到转账之前。", "这样重入进来时，读到的余额是 0，require 直接回滚。", "交出控制权放在最后，此时账本已经一致。"], "section": "CEI与锁", "k": 25.61}, {"seg": "4", "t0": 25.61, "t1": 52.07, "title": "第二道防线：重入锁", "points": ["执行期间再进入任何加锁函数都会回滚", "只保护加锁函数，不防只读重入，跨合约要共享同一把锁", "0.8.24 起可用瞬态存储做锁，目标链须支持 EIP-1153"], "notes": ["第二道防线，是重入锁。", "执行期间，再次进入任何一个加锁的函数，都会回滚。", "但锁有边界。它只保护加了锁的函数，不防只读重入，跨合约还要共享同一把锁。", "0.8.24 起，可以用瞬态存储做锁，gas 更低。", "但目标链必须支持 EIP-1153，部署前要确认。"], "section": "CEI与锁", "k": 52.07}, {"seg": "4", "t0": 52.07, "t1": 68.57, "title": "拉取式支付与 CEI 局限", "points": ["合约只记账，由收款人自己来取", "代价是用户要多走一步", "复杂函数里很难做到所有交互都在最后"], "notes": ["还有一种思路，叫拉取式支付。合约只记账，由收款人自己来取。", "合约不主动推送，代价是用户要多走一步。", "CEI 也有局限。复杂函数里，很难做到所有交互都在最后。"], "section": "CEI与锁", "k": 62.87}, {"seg": "4", "t0": 68.57, "t1": 96.71, "title": "纵深防御四条", "points": ["CEI 当默认写法；修改共享状态的入口加同一把锁", "view 不给中间状态的关键价格，或提供锁状态查询", "不变量测试：合约余额不少于用户余额之和"], "notes": ["所以要做纵深防御，分四条。", "一，把 CEI 当作默认写法。", "二，所有修改共享状态的外部入口，加同一把锁。", "三，不在 view 函数里给出中间状态的关键价格。必须给出，就提供锁状态查询。", "四，用不变量测试守住一件事：任何调用序列之后，合约余额都不少于用户余额之和。"], "section": "CEI与锁", "k": 80.12}, {"seg": "4", "t0": 96.71, "t1": 108.75, "title": "修复要用代码验证", "points": ["同一个攻击测试，漏洞版要能提走资金", "修复版上要回滚", "只跑通修复版，无法证明测试覆盖了漏洞"], "notes": ["修复还要用代码验证。同一个攻击测试，在漏洞版上要能提走资金，在修复版上要回滚。", "只跑通修复版，无法证明测试真的覆盖了漏洞。"], "section": "CEI与锁", "k": 105.01}, {"seg": "4", "t0": 108.75, "t1": 123.17, "title": "锁写对了，也不一定生效", "points": ["2023 年 7 月，Curve 一些池子源码里写了重入锁", "Vyper 编译器三个版本生成的锁不正确", "不同函数用了不同的锁槽"], "notes": ["最后，锁写对了，也不一定生效。", "2023 年 7 月，Curve 的一些池子，源码里写了重入锁。", "但 Vyper 编译器的三个版本，生成的锁不正确，不同函数用了不同的锁槽。"], "section": "CEI与锁", "k": 123.17}, {"seg": "4", "t0": 123.17, "t1": 140.52, "title": "源码对不等于字节码对", "points": ["攻击者对原生 ETH 池子发起跨函数重入", "按多方公开复盘，损失约 7000 万美元", "审计范围要包括编译器版本"], "notes": ["攻击者对使用原生 ETH 的池子，发起跨函数重入。", "按多方公开复盘，损失约 7000 万美元。", "教训是，源码正确，不等于
