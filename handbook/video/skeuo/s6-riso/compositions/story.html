  <script>
    (function () {
      const A = "#1f3fb8", B = "#ff4f8b";
      // ---- halftone: dots on a rotated grid, radius from a density function (0..1)
      function halftone(el, w, h, step, angle, dens, fill) {
        const c = Math.cos(angle * Math.PI / 180), s = Math.sin(angle * Math.PI / 180);
        const R = Math.ceil(Math.hypot(w, h) / step) + 2;
        let out = "";
        for (let i = -R; i <= R; i++) for (let j = -R; j <= R; j++) {
          const u = i * step, v = j * step;
          const x = w / 2 + u * c - v * s, y = h / 2 + u * s + v * c;
          if (x < -step || y < -step || x > w + step || y > h + step) continue;
          const d = dens(x, y);
          if (d <= 0.04) continue;
          const r = Math.min(1, d) * step * 0.62;
          out += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + r.toFixed(2) + '"/>';
        }
        el.innerHTML = '<g fill="' + fill + '">' + out + '</g>';
      }
      // slab edges: dots shrink away from the solid
      halftone(document.getElementById("st-slabL"), 200, 1080, 16, 15, (x) => x / 200, A);
      halftone(document.getElementById("st-slabR"), 200, 1080, 16, 15, (x) => 1 - x / 200, A);
      // key silhouette, density darker toward the bow
      function inKey(x, y) {
        const bx = 230, by = 320;
        const d = Math.hypot(x - bx, y - by);
        if (d < 200 && d > 78) return true;
        if (x > 410 && x < 960 && y > 280 && y < 362) return true;
        if (x > 760 && x < 820 && y >= 362 && y < 470) return true;
        if (x > 860 && x < 920 && y >= 362 && y < 520) return true;
        if (x > 940 && x < 960 && y >= 362 && y < 420) return true;
        return false;
      }
      halftone(document.getElementById("s2-key"), 1000, 640, 14, 15,
        (x, y) => inKey(x, y) ? 1.05 - 0.55 * (x / 1000) : 0, A);
      // climax burst around the "1": radial falloff
      halftone(document.getElementById("s4-burst"), 1920, 1080, 22, 45,
        (x, y) => { const e = Math.hypot((x - 740) / 330, (y - 590) / 400); return e < 1 ? 0 : 0.8 - (e - 1) * 0.55; }, B);
      // document text lines (halftone grey = ink A dots)
      halftone(document.getElementById("s6-doclines"), 700, 760, 10, 15,
        (x, y) => (x > 110 && x < 600 && y > 600 && y < 700 && (Math.floor((y - 600) / 34) % 1 === 0) && ((y - 600) % 34) < 18) ? 0.6 : 0, A);

      const tl = gsap.timeline({ paused: true });
      const WIPE = "inset(0 100% 0 0)", FULL = "inset(0 0% 0 0)";
      // print a plate: clip-path brushes across from the left
      function print(sel, t, dur) {
        tl.fromTo(sel, { clipPath: WIPE }, { clipPath: FULL, duration: dur || 0.2, ease: "power2.out" }, t);
      }
      function printDown(sel, t, dur) {
        tl.fromTo(sel, { clipPath: "inset(0 0 100% 0)" }, { clipPath: "inset(0 0 0% 0)", duration: dur || 0.22, ease: "power2.out" }, t);
      }
      // stamp: lands from 1.35x in 0.12 s, no bounce
      function stamp(sel, t, from) {
        tl.fromTo(sel, { scale: from || 1.35, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.12, ease: "power4.in" }, t);
      }
      // the press slab: in 0.35 s, out 0.35 s, power3.inOut
      function slab(tIn) {
        tl.fromTo("#st-slab", { x: -2120 }, { x: 0, duration: 0.35, ease: "power3.inOut", immediateRender: false }, tIn);
        tl.fromTo("#st-slab", { x: 0 }, { x: 2120, duration: 0.35, ease: "power3.inOut", immediateRender: false }, tIn + 0.35);
      }
      tl.set("#st-slab", { x: -2120 }, 0);

      // ---------- S1 ----------
      print("#s1-bybit", 2.46, 0.2);
      print("#s1-wallet", 3.6, 0.22);
      print("#s1-rule", 3.85, 0.18);
      // 15亿: B plate first (pink, +3px off register), then A halftone underlay
      tl.fromTo("#s1-big", { clipPath: WIPE, x: 3, y: 3 }, { clipPath: FULL, duration: 0.1, ease: "none" }, 5.23);
      print("#s1-bigA", 5.33, 0.1);
      print("#s1-usd", 5.73, 0.2);
      print("#s1-fbi", 6.0, 0.2);
      slab(6.75);

      // ---------- S2 ----------
      tl.fromTo("#s2-key", { clipPath: WIPE }, { clipPath: FULL, duration: 0.25, ease: "power2.out" }, 7.53);
      print("#s2-pk", 7.6, 0.22);
      print("#s2-safe", 8.68, 0.22);
      print("#s2-signers", 9.55, 0.2);
      stamp("#s2-st1", 9.92);
      stamp("#s2-st2", 11.15);
      stamp("#s2-st3", 12.48);
      slab(13.45);

      // ---------- S3 ----------
      printDown("#s3-scr", 14.22, 0.25);
      print("#s3-head", 14.69, 0.2);
