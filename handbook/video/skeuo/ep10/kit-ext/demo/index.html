<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Noto Sans SC"; src: url("assets/fonts/NotoSansSC.woff2") format("woff2"); font-weight: 100 900; }
      :root { --ground: #efebe3; --ink: #1c1c1c; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { width: 100%; height: 100%; position: relative; }
      #bg { position: absolute; inset: 0; background: var(--ground); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <div id="bg"></div>
      <div id="showcase" data-composition-id="showcase" data-composition-src="compositions/showcase.html"
        data-start="0" data-duration="10" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 2"></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
