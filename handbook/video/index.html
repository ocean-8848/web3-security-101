17.81,419.93,"预先准备的辟谣声明"],[421.63,425.88,"回到 SEC。为什么换一张卡就够了？"],[426.33,431.54,"SEC 后来承认，此前曾请 X 关闭这个账号的二次验证"],[431.54,435.69,"攻击者劫持了绑定的手机号，用重置码登录"],[436.14,442.12,"所以从链上走到线下，防的是两件事。第一，别被关联"],[442.12,445.86,"别让地址、身份和住址连成一条线"],[446.31,450.95,"第二，别有单点：一个人、一张卡、一个地点"],[450.95,454.9,"都不应该单独放行大额资产或官方账号"],[455.35,459.58,"成立条件是：这些措施降低的是概率和收益"],[459.58,464.49,"不保证人身安全。真遇到胁迫，先保人，事后报警"],[464.49,465.6,"再处置资产"],[466.05,471.45,"下一集，我们去看交易所：它既是保管者，也是检查站"]],"ch":[]},"deck":{"src":"../decks/skeuomorphic/ch22/index.html","scenes":[["SEC 官方账号发了假消息",["2024 年 1 月，美国 SEC 的官方 X 账号，发了一条消息。","比特币 ETF 获批了。","这条消息是假的。","可它是从监管机构的官方账号发出来的，很多人信了。","BTC 的价格，短时间里大幅波动。"]],["一张 SIM 卡接管手机号",["攻击者没有破解 SEC 的任何系统。","他们只是让一张新的 SIM 卡，接管了一个手机号。","靠这个号码，就拿到了官方账号的控制权。","一张小小的卡，就让整个市场跟着晃了一下。"]],["先猜一道题",["先猜一道题。","SEC 是监管机构，当时这个账号，开了多因素认证吗？","先记住这个问题，我们从链上，一路走到线下。"]],["扳手攻击",["先给准确的说法。","扳手攻击，就是用暴力或威胁，逼持币的人交出私钥，或者转账。","这个名字来自一幅漫画。","花大价钱买算力，破解不了加密，买一把便宜的扳手，就够了。","密码学挡不住扳手。"]],["锁越好，劫匪越等你回家",["攻击者知道你是谁，住在哪，有多少资产，最便宜的办法，就是找到你本人。","打个比方，你给家门装了一把银行级的锁。","可你的门牌号、作息时间、保险柜里有多少钱，都印在一张贴在网上的海报上。","锁越好，劫匪越不会去撬锁，而是等你回家。"]],["攻击第一步：关联",["比喻在这里不成立，劫匪要先知道你有钱。","而链上资产的特点是，地址一旦和身份连上，余额对全世界公开。","所以攻击的第一步，是关联。","把一个链上地址，连到一个真实的人，一个真实的住址。"]],["三类线索",["线索有三类。","公开信息，比如社交媒体、采访、会议照片。","数据泄露，比如 KYC 资料、电商订单、客服工单。","还有链上数据，地址的余额和交易历史。","三类线索拼在一起，就能筛出余额高、住址已知的目标。"]],["两条路：找上门、攻账号",["接下来有两条路，一条找上门，一条攻账号。","数据泄露直接交出了住址，所以保护数据，也是在保护人身安全。"]],["SIM 卡劫持",["先看账号这条路，SIM 卡劫持。","攻击者让运营商，把受害者的手机号，转到自己的 SIM 卡上。","常见的手法，是出示伪造证件，或者贿赂、欺骗客服。","号码到手，他在交易所、邮箱、社交账号上，点忘记密码。","短信验证码，发到了他的新卡上。"]],["恢复流程里最弱的一环",["这一步能成功，是因为账号允许短信验证码，作为唯一的恢复方式。","再想一种情况，账号开了验证器 App，但忘记密码时，仍然可以用短信。","只要短信能单独完成恢复，验证器就被绕过了。","第二因素有多强，取决于恢复流程里最弱的一环。"]],["劫持社交账号不止换卡",["社交账号被劫持，入口不止换卡。","还有弱密码被暴力破解，团队交接时，多因素认证被关掉。","冒充平台官方，发版权侵权、账号违规的钓鱼邮件。","官方账号发出的链接，粉丝几乎没有理由怀疑。"]],["Vitalik 的账号被盗",["2023 年 9 月，Vitalik Buterin 的 X 账号被盗，发出了假的纪念 NFT 链接。","粉丝签名后，钱包被清空，ZachXBT 统计，约 69.1 万美元。"]],["Mandiant 账号冒充 Phantom",["2024 年 1 月，安全公司 Mandiant 的 X 账号，被改名冒充 Phantom 钱包。","Mandiant 自查认为，很可能是被暴力破解，交接期间，多因素认证没有起到保护。"]],["冒充 X 官方发侵权通知",["后来，有人冒充 X 官方，发版权侵权通知。","接管了 15 个加密类账号，推广假代币，约 50 万美元。"]],["员工手机号是特权凭证",["交易所的员工也一样。","美国联邦起诉书称，一个团伙对一名员工，做了 SIM 卡劫持。","转走的加密资产，超过 4 亿美元。","媒体援引消息源，确认受害公司是 FTX，时间是它申请破产的当天。","员工的手机号，就是交易所的特权凭证。"]],["另一条路：找上门",["再看另一条路，找上门。","这部分涉及人身伤害，我们只讲公开报道的事实，不讲受害人的个人细节。"]],["实体攻击逐年增多",["研究者 Jameson Lopp，在 GitHub 上维护一份公开清单。","专门记录针对持币人的实体攻击。","按这份清单，2023 年 74 起，2024 年 106 起，2025 年 170 起。","2026 年截至 10 月底，已有 147 起，其中法国 52 起。","各机构的统计口径不同，数字不能直接比较。","Lopp 本人认为，真实数量被低估了。"]],["Ledger 联合创始人被劫持",["2025 年 1 月，Ledger 的一位联合创始人，和伴侣在家中被劫持。","绑匪向 Ledger 方面索要加密货币赎金，法国宪兵特种部队救出了两人。","涉嫌主谋 6 月在摩洛哥落网，2026 年 5 月被当地法院判处 25 年。"]],["法国接连发生绑架",["同年 5 月初，一名加密企业家的父亲，在巴黎街头被绑走。","警方突袭解救，没有支付赎金。","5 月 13 日，交易所 Paymium 的 CEO，女儿和外孙在巴黎街头，遭遇绑架未遂。","检方之后起诉了 25 人，认为和 5 月初的绑架有关联。","法国内政部长会见业界，宣布了安全简报、紧急呼叫优先响应、住宅安防检查等措施。"]],["目标还有家属",["这几起案件里，目标不只是持币人本人，还有家属。","公开报道还显示，部分团伙把执行环节，外包给临时招募的人。"]],["施暴者也可能是熟人",["同在 2025 年 5 月，纽约检方指控两名加密投资者，把一名男子诱到曼哈顿的一处住宅。","囚禁 17 天，逼他交出比特币密码。","两名被告不认罪，公开报道里，还没有查到判决。","施暴者，也可能是熟人，或者同一个圈子里的人。"]],["降低暴露",["防御分两头，一头降低暴露，一头降低胁迫的收益。","降低暴露，先管住嘴，不公开谈持仓，不晒资产截图。","链上身份和真实身份分开，公开收款地址和个人大额地址，不用同一个。","硬件钱包这类订单，用代收地址或者公司地址收货。","照片里不要拍到住址、车牌和日常路线。","定期搜一搜自己的姓名和住址，去数据经纪网站申请删除。"]],["降低胁迫的收益",["降低胁迫的收益，靠的是让本人确实转不出去。","大额资产放进多签或者时间锁，转出要异地的另一个人，或者另一台设备。","随身的设备，只放少量资产。","和家人约定胁迫暗号，还有紧急联系的流程。"]],["人身安全第一，资产第二",["要说清楚，多签和时间锁，降低的是立即转出的可能，不能保证人身安全。","劫匪对转不出的反应，难以预测，人身安全第一，资产第二。"]],["账号：硬件安全密钥",["账号这边，邮箱、交易所、社交账号、域名注册商，都用硬件安全密钥，做多因素认证。","不用短信做多因素认证，也不用它恢复密码。","向运营商申请号码转移锁，或者 SIM 更换 PIN。","关键账号，用不公开的专用邮箱注册。"]],["项目方多做几件事",["项目方还要多做几件事。","列出关键人员，创始人、多签签名人、运维负责人、官方账号管理员。","签名人名单不公开，必要时只公开机构。","官方账号交接时，不关闭多因素认证，发帖权限和恢复权限分开。","再备好被盗预案，备用公告渠道、平台联系人、写好的辟谣声明。"]],["普通用户从这几件事做起",["普通用户，可以从这几件事做起。","交易所和邮箱，用硬件密钥或验证器 App，关掉短信验证。","向运营商申请号码转移锁。","关注的项目方账号，突然发限时空投、紧急迁移，先去别的官方渠道核实。","和陌生网友线下见面，选公共场所，让别人知道你的行程。","遭遇胁迫时，人身安全第一，事后立即报警。"]],["今天就查一遍",["如果你是多签签名人，今天就查一遍，你的手机号能不能单独重置哪个账号。","如果你管理官方账号，今天就把它的多因素认证，换成硬件密钥。","如果你负责团队，列一份关键人员名单，给每个人配上号码锁和硬件密钥。"]],["答案：没有开",["回到开头的题。","答案是没有，SEC 承认，此前曾请 X 关闭这个账号的多因素认证。","攻击者对绑定的手机号做了 SIM 卡劫持，再用重置码登录。","负责换卡的人，2025 年被判 14 个月。"]],["一张卡不够拿走一切",["监管机构的账号也会失守，只要一条短信，就能单独完成恢复。","攻击从链上走到线下，防线就要让一张卡、一次胁迫，都不够拿走一切。"]]]},"d3b":{"src":"../decks/3b1b/ch22.html","scenes":[["SEC 官方账号发出假消息",["2024 年 1 月，美国 SEC 的官方 X 账号发了一条消息：比特币 ETF 获批了。","消息是假的。比特币价格短时间里大幅波动。"]],["没有破解系统，只是换了一张 SIM 卡",["攻击者没有破解 SEC 的任何系统。他只是换了一张 SIM 卡。","所以这一集要问：攻击从链上走到线下，我们到底在防什么？"]],["扳手攻击：密码学挡不住扳手",["先说一幅有名的漫画。花一百万美元买算力，也破解不了加密。","可是花五美元买一把扳手，去找持币人本人，就够了。","这就叫扳手攻击：用暴力或威胁，逼持币人交出私钥，或者直接转账。","密码学挡不住扳手。攻击者知道你是谁、住在哪、有多少钱时，最便宜的办法就是找到你。"]],["比方漏了一步：链上不用打听",["打个比方：你家装了银行级的门锁，可门牌号和保险柜里有多少钱，都贴在网上。锁越好，劫匪越会等你回家。","这个比方漏了一步：现实里，劫匪要先打听你有没有钱。链上不用打听，地址一旦和身份连上，余额对全世界公开。"]],["第一步是关联：地址连上真人",["那攻击者怎么知道是你？第一步，叫关联。","也就是把一个链上地址，和一个真实的人、一个真实的住址，连在一起。","材料有三类：你自己公开的照片和采访，泄露出去的 KYC 和订单，还有链上公开的余额和交易历史。","三条线汇到一起，攻击者就能筛出目标：余额高，住址已知。"]],["两条路：人身胁迫与账号攻击",["接下来分成两条路：一条走向人身胁迫，一条走向账号攻击。","注意，数据泄露直接交出了住址。所以保护数据，也是在保护人身。","这张图也有局限：它没画熟人作案。施暴者有时就是认识受害者的同行。"]],["实体攻击逐年增加",["这条路有多常见？研究者 Jameson Lopp 维护着一份实体攻击的公开清单。","按 2026 年 11 月的快照逐行统计：2023 年 74 起，2024 年 106 起，2025 年 170 起。","2026 年，到 10 月底，已经有 147 起。"]],["法国尤其突出，家属也被盯上",["法国尤其突出。2024 年 6 起，2025 年 25 起，2026 年前十个月 52 起。","25 的两倍是 50。还没到年底，就已经超过了去年全年的两倍。","2025 年法国接连发生绑架案。被盯上的，不只是创始人本人，还有他们的家属。","要注意口径：清单会补录旧案，各家机构的统计也不同。清单的维护者自己认为，真实数量被低估了。"]],["第一，降低暴露",["怎么防？第一是降低暴露：不晒持仓，公开收款地址和大额地址分开，硬件钱包用代收地址收货。"]],["第二，降低胁迫的收益",["第二是降低胁迫的收益。设想一位创始人，大额资产放在一个 2-of-3 多签里。","可三把钥匙，全放在他自己家里。劫匪上门时，三把都在手边，多签等于没有。","换个做法：一把钥匙交给异地的另一个人，再加上 48 小时的时间锁。本人确实无法当场转出，异地的人还有时间撤销。"]],["时间锁保护资产，不保护人",["但时间锁保护的是资产，不是人。胁迫可能持续，劫匪也可能不相信转不出。","所以还要配上：随身只放少量资产，和家人约好胁迫暗号，准备报警预案。人身安全第一，资产第二。"]],["SIM 卡劫持：验证码发到攻击者手机",["再看第二条路：账号攻击。最常见的入口，是 SIM 卡劫持。","攻击者拿伪造的证件，或者骗过、买通运营商客服，让对方把你的手机号，转到他的新 SIM 卡上。","接着，他去你的交易所、邮箱、社交账号，点忘记密码。验证码，发到了他的手机上。","账号就这样换了主人。之后，要么转走资产，要么用你的账号发钓鱼链接。"]],["成立条件：短信可以单独完成恢复",["这一步能成，只因为一个设定：短信验证码，可以单独完成恢复。","所以防线有两层：运营商那边，锁住号码转移；账号这边，不用短信做第二因素，也不用它做恢复。"]],["第二因素的强度，取决于恢复流程",["有人会说：我开了验证器 App，不怕换卡。","可如果忘记密码这扇门，仍然只要一条短信呢？","登录的门有两道锁，恢复的门只有一道。攻击者不会走前门。","第二因素有多强，取决于恢复流程里最弱的那一环。"]],["硬件安全密钥，并把短信拿出恢复流程",["更稳的做法，是邮箱、交易所、社交账号和域名注册商，都用硬件安全密钥。它基于 FIDO2，能抵抗钓鱼。","同时，把短信从恢复流程里拿掉。否则，前门的锁再好，后门也开着。"]],["账号被盗，损失的不只是自己",["账号被盗，损失的不只是你自己。官方账号发出的链接，粉丝几乎没有理由怀疑。","2023 年 9 月，Vitalik 的 X 账号被盗，发出假的纪念 NFT 链接。签了名的粉丝，被清空了约 69.1 万美元。","2024 年 1 月，安全公司 Mandiant 的账号被盗，改名冒充 Phantom 钱包。它的二次验证，在团队交接中没有得到有效保护。","交易所也一样。按美国起诉书，2022 年 11 月，一名员工的手机号被劫持，超过 4 亿美元的加密资产被转走。媒体确认，这家公司是 FTX。","连安全公司和监管机构都会中招。员工的手机号，就是特权凭证。"]],["项目方：保护关键人员与官方账号",["落到项目方，第一步是列一张关键人员名单：创始人、多签签名人、运维负责人、官方账号管理员。","给他们配硬件密钥和号码锁，再提供数据删除服务和安保咨询。","签名人名单不公开。必要时只公开机构，不公开个人。","官方账号交给组织账号管理，交接时不关二次验证，发帖权限和恢复权限分开。","最后，为账号被盗写好预案：备用公告渠道，平台联系人，预先准备的辟谣声明。"]],["答案：别被关联，别有单点",["回到 SEC。为什么换一张卡就够了？","SEC 后来承认，此前曾请 X 关闭这个账号的二次验证。攻击者劫持了绑定的手机号，用重置码登录。","所以从链上走到线下，防的是两件事。第一，别被关联：别让地址、身份和住址连成一条线。","第二，别有单点：一个人、一张卡、一个地点，都不应该单独放行大额资产或官方账号。"]],["成立条件：降低概率和收益，不保证安全",["成立条件是：这些措施降低的是概率和收益，不保证人身安全。真遇到胁迫，先保人，事后报警，再处置资产。"]]]}}},{"id":"23","title":"托管、充提与合规安全：保管者与检查站","md":"../chapters/23-custody-exchange-ops.md","v":{"vs":{"src":"skeuo/ep23/out/ep23-full.mp4","cues":[[1.65,3.4,"2026 年 10 月 29 日"],[3.43,4.69,"Binance 的热钱包"],[4.71,6.01,"开始大额转出"],[6.98,8.32,"先是 XRP"],[8.34,9.28,"再是比特币"],[9.38,10.57,"然后是以太坊"],[11.54,12.95,"一条链接着一条链"],[13.14,14.4,"资产往外流"],[15.36,16.76,"交易所发现之后"],[16.85,17.89,"暂停了提现"],[18.87,20.7,"可按项目方的初步报告"],[20.75,21.78,"暂停提现"],[21.87,24.22,"没有挡住全部的未授权转账"],[25.21,26.02,"最后一笔"],[26.19,29.67,"到世界协调时 23 点 56 分 才转完"],[30.64,31.96,"项目方的口径是"],[32.02,33.74,"约 63.4 亿美元"],[34.72,35.97,"这是有记录以来"],[36.01,38.23,"最大的一起加密资产盗窃案"],[39.22,40.24,"更反常的是"],[40.37,41.41,"Binance 称"],[41.51,43.18,"没有发现私钥泄露的证据"],[44.16,45.25,"没有私钥"],[45.34,46.51,"钱是怎么签出去的"],[47.76,49.08,"先猜一道题"],[50.07,51.51,"提现已经暂停"],[51.66,53.3,"热钱包服务也关掉了"],[54.27,55.73,"以太坊热钱包上"],[55.76,59.14,"还留着一个恶意的 EIP-7702 委托"],[60.13,63.78,"这时候 新转进这个地址的钱 安全吗"],[65.02,66.19,"带着这个问题"],[66.32,68.35,"我们看看交易所的两张面孔"],[71.52,72.97,"先给准确的说法"],[73.97,76.14,"交易所同时扮演两个角色"],[77.11,78.31,"一个是保管者"],[78.41,80.4,"替用户保管私钥和资产"],[80.5,81.34,"这叫托管"],[82.33,83.57,"另一个是检查站"],[83.61,84 界。","保管者失误，用户丢钱。","检查站失误，赃款被洗白，交易所自己也要承担法律责任。"]],["交易所像一座机场",["打个比方，交易所像一座机场。","金库是冷钱包，要防盗。","登机口是提币，要验票，入境口是充值，要验真伪。","安检是反洗钱，边检是制裁筛查，拦住名单上的人。","比喻在这里不成立，机场的旅客，走了就走了。","链上的资金流向永久公开，执法机构几年以后，还能回头追查每一笔。"]],["钱在交易所里怎么流动",["先看保管者这一面，钱在交易所里怎么流动。","每个用户有自己的充值地址，钱到了，被归集到热钱包。","热钱包负责日常提币，余额超出水位，多出来的转回冷钱包。","冷钱包补充温钱包，温钱包再补充热钱包。"]],["链下还有一条流水线",["链下还有一条流水线。","充值扫描服务读取链上数据，记进内部账本。","提币请求从账本出发，经过风控引擎，再到签名服务，最后从热钱包发出。"]],["攻击打在四个点上",["攻击打在四个点上。","充值扫描，被假充值骗过。","账本，被盗来的用户账号拿去提币。","签名服务，被伪造的上游请求驱动。","热钱包，私钥泄露。","图里没画的还有内部人，他可以同时出现在这四个点上。"]],["假充值",["先看充值这一头。","假充值，是交易所把一笔不该算数的转账，记成了用户的充值。","失败的、伪造的、到账金额不对的，都算。"]],["失败交易与无效交易",["第一种，交易失败了，却已经上链。","扫描服务只看交易存不存在，不看执行状态。","2019 年 3 月，SlowMist 披露了 EOS 上的这类手法，TRON 和以太坊也要防。","第二种，无效交易被入账。","2018 年 6 月，SlowMist 预警，部分交易所没有校验 Omni-USDT 交易的 valid 字段。"]],["XRP 的部分支付",["第三种，部分支付，这是 XRP 的一个特性。","一笔支付写的请求金额，可以远大于实际到账的金额。","2024 年 1 月，有人向 Bitfinex 发起了一笔部分支付。","名义金额约 150 亿美元，实际到账约 0.001 美元。","Bitfinex 按实际到账金额入账，攻击没有成功。"]],["假代币、假事件、回滚",["第四种，假代币，名字和符号都能照抄。","第五种，伪造的转账事件，系统只看 Transfer 事件，不看它来自哪个合约。","第六种，确认数不够就入账，之后区块回滚，这笔充值也跟着消失。"]],["一条原则",["这些形态，可以归成一条原则。","以链上执行结果和实际到账金额为准。"]],["入账前的四道检查",["入账之前，过四道检查。","执行成功了吗。","代币合约地址，在白名单里吗。","实际到账多少。","确认数够了吗。"]],["独立节点复核，每链重做",["最后，用第二个独立节点再复核一遍。","只靠一个节点，节点被篡改或者不同步，也会记错账。","每接入一条新链，都要按这条链的交易模型，从头设计入账校验，不能照搬以太坊的逻辑。"]],["签名服务只认格式",["再看提币这一头，最要紧的是签名服务。","签名服务只认请求的格式对不对。","攻击者如果能伪造上游数据，它就会按正常流程，签出攻击交易。"]],["Bitget：伪造提现指令",["2026 年 9 月，Bitget 被盗约 3.875 亿美元。","公开报道称，攻击者利用第三方安全产品的零日漏洞，拿到了内部高权限凭证。","再向钱包后台，插入伪造的提现指令。","项目方称，已经排除了私钥泄露。"]],["Binance：被篡改的 Homebrew",["一个月后，Binance 出事，按它的初步报告，路径是这样的。","6 月，一名工程师下载了被篡改的 Homebrew。","那一次已被发现并处置，报告没有确认之后一直有访问。"]],["从面试作业到签名服务",["9 月，另一名工程师运行了一份假的面试作业。","10 月 20 日，攻击者经过这台电脑和内部 AI 工具，又控制了另外两台电脑。","其中一台上，存着容器部署令牌。","10 月 29 日，攻击者用它部署容器，运行恶意脚本，访问内部签名服务。"]],["不要私钥，让签名服务替签",["攻击者不需要私钥，它让签名服务替它签。","以太坊上，签出的是 EIP-7702 委托，把热钱包账户的代码，指向攻击者的合约。","其他链上，就是普通的签名转账。","决定性的一环，是开发终端上的长期部署令牌。","它把一台电脑失陷，变成了生产环境失陷。","签名流程本身被驱动了，冷热隔离和私钥保护，都挡不住。"]],["三条防线",["防线有三条。","签名服务独立核对，目标地址和金额，必须对得上账本里的提现订单。","部署令牌要短期有效、绑定设备，还要第二个人批准。","风控引擎和签名服务，由不同的团队维护。","两起事件，都还没有最终的第三方调查报告。"]],["检查站：规则有漏洞就够",["再看交易所的另一张面孔，检查站。","这里的攻击者，不需要攻破交易所的系统，只需要规则有漏洞。","盗来的资金，想充进交易所，再提走或者换掉。","名单上的人，换个新地址、新账户，绕过筛查。","洗钱者把金额拆开，快进快出。","TRM 记录到，Binance 事件前一天，攻击者的操作钱包，收到 3 笔 Tornado Cash 提款。"]],["充提要过四道关",["一笔充值或者提币，要过四道关。","第一道，制裁筛查，比如美国财政部 OFAC 的名单，命中就拦。","第二道，链上风险评分，看资金在几跳以内，是不是来自被盗资金或者混币器。","第三道，Travel Rule，服务商之间转账，要传递发起人和受益人的信息。","第四道，反洗钱交易监控，盯住拆分和快进快出。"]],["门槛按辖区来定",["门槛要按辖区来定。","FATF 建议的门槛，是 1000 美元或欧元。","欧盟规定，服务商之间转账，不设最低门槛。","系统如果按 1000 欧元设计，小额转账就缺了发起人和受益人的信息。"]],["冻结追回的最后机会",["被盗资金进入交易所，往往是冻结追回的最后机会。","Binance 事件当晚，Tether 冻结了约 9.711 亿 USDT，Circle 冻结了约 8.23 亿 USDC。","比特币、XRP 这类原生资产，发行方没办法冻结。"]],["代价回到交易所身上",["检查站失守，代价最后会回到交易所身上。","2023 年 11 月，Binance 认罪，支付约 43 亿美元。","2025 年，KuCoin 和 OKX，也认罪无牌汇款。"]],["也别误伤普通人",["反过来，评分也会误报，没有人工复核和申诉通道，正常用户的钱就会被错冻。","2025 年 3 月，Tornado Cash 被移出制裁名单，可风险没有跟着消失。","混币器来的钱，照样要按评分和规则走一遍。"]],["答案：不安全",["回到开头的题。","答案是不安全。","委托写在账户的链上代码里，独立于链下的提现系统。","在新的授权覆盖或者清零它之前，委托合约照样可以被调用。"]],["暂停提现≠撤销权限",["Binance 在 10 月 30 日 0 点 10 分，才把委托清零。","恶意委托在链上，存活了约 3 小时 50 分。","暂停提现，不等于撤销权限。"]],["交易所今天就能做三件事",["交易所今天就能做三件事。","提前写好紧急撤销流程并且演练，把链上授权也算进去。","热钱包设余额上限，每条链单独熔断。","签名策略覆盖全部交易类型，包括 EIP-7702 授权。"]],["普通用户的几件事",["普通用户也有几件事。","充值前，确认交易所支持的代币合约地址和网络。","开启提币白名单和新地址冷却期，提币地址从地址簿里选。","来源不明的资金不要充进去，交易所要你补资料，只在官方 App 里处理。"]],["保管者与检查站各守其职",["保管者要让签名只为真实的订单服务，检查站要拦住赃款，也别误伤普通人。"]]]},"d3b":{"src":"../decks/3b1b/ch23.html","scenes":[["Binance 发现热钱包大额转出",["2026 年 10 月 29 日晚上，Binance 发现热钱包有大额转出。","它做了最直接的事：暂停提现。"]],["开关关了，钱为什么还在流",["可是按 Binance 自己的报告，暂停提现，没有拦住全部的未授权转移。","开关已经关了，钱为什么还在流？要回答它，先要看清交易所到底在管什么。"]],["交易所有两个角色：保管者与检查站",["交易所同时扮演两个角色。","第一，它是保管者：替用户保管私钥和资产。保管者出错，用户丢钱。","第二，它是检查站：链上的钱进出法币世界，都要从这里过。检查站出错，赃款被洗白，交易所还要担法律责任。"]],["比方：机场；不对的一处是链上永久公开",["打个比方，交易所像一座机场。金库要防盗，登机口要验票，入境口要验真伪，安检拦违禁品，边检拦名单上的人。","这个比方有一处不对：旅客走了就走了。链上的资金流向永久公开，执法可以在几年后，回头追查每一笔。"]],["充值归集到热钱包，提币从热钱包出",["先看钱在交易所里怎么流动。每个用户有自己的充值地址，钱到了以后，归集到热钱包。","用户提币，从热钱包出去。热钱包不够了，由温钱包、冷钱包补充；超出水位的部分，再归集回冷钱包。","旁边还有一条看不见的链路：扫描服务读链上数据，给账本入账；提币请求经过风控引擎，再交给签名服务。"]],["攻击打在四个点上",["攻击打在四个点上：假充值骗扫描服务，盗号攻击账本，伪造请求驱动签名服务，私钥泄露直接打热钱包。","这张图没画内部人。内部人，可以同时站在这四个点上。"]],["假充值：Bitfinex 的 XRP 部分支付",["先看入境口：假充值。交易所把失败的、伪造的、或者金额不符的转账，记成了用户的充值。","看一个真实的例子。2024 年 1 月，有人向 Bitfinex 发起一笔 XRP 部分支付。","交易里写的金额，名义上约 150 亿美元。实际到账的，约 0.001 美元。","两者差了十几个数量级。如果交易所读的是写在请求里的金额，账本上就凭空多出 150 亿。","Bitfinex 按实际到账金额入账，攻击没有成功。"]],["原则：以链上执行结果和实际到账为准",["原则只有一条：以链上执行结果和实际到账金额为准。执行成功没有，代币合约对不对，真正到账多少，确认够不够，最后再请第二个独立节点复核。","每接入一条新链，都要按它的交易模型重来一遍。"]],["签名服务：最后一道门要独立核对",["再看出口。签名服务是整条链路的最后一道门。","问题是，它往往只检查请求的格式对不对。上游数据一旦被伪造，它会按正常流程，签出攻击交易。","2026 年 9 月的 Bitget 事件就是这样。据公开报道，攻击者借第三方安全产品的零日漏洞拿到内部高权限，插入了伪造的提现指令。","损失约 3.875 亿美元。项目方称已排除私钥泄露。也就是说，私钥一直安全，签名却不是它的主人想签的。","所以签名服务要独立核对：目标地址和金额，跟账本里的提现订单对得上吗？风控引擎和签名服务，最好由不同团队维护。"]],["Binance：让签名服务代为签名",["回到 Binance。按它 11 月 3 日的初步报告：","工程师的电脑先后失陷。其中一台电脑上，存着一个能部署容器的长期令牌。","10 月 29 日，攻击者用这个令牌部署容器，访问内部签名服务，绕过了正常的提现流程。","在以太坊上，它让热钱包签下 EIP-7702 委托，把账户的执行权交给攻击者的合约。其他链上，就是普通的签名转账。","Binance 称没有发现私钥泄露。攻击者不需要私钥，它让签名服务代为签名。按项目方口径，损失约 63.4 亿美元。"]],["时间线（世界协调时）",["把时间轴摊开，时间按世界协调时。","20 点 20 分，以太坊上的委托交易提交。大约 20 点 23 分，委托生效 3 分多钟后，以太坊热钱包被清空。","21 点 01 分和 04 分，Tether 和 Circle 分别冻结了约 9.7 亿 USDT 和 8.2 亿 USDC。","23 点 56 分，最后一笔未授权转账完成。"]],["暂停提现关的是自己的门",["第二天 0 点 10 分，Binance 才把委托清零。从 20 点 20 分算起，恶意委托在链上活了约 3 小时 50 分。","关键就在这里：委托写在账户的链上代码里，独立于链下的提现服务。暂停提现，关的是自己的门；链上的授权，还开着。"]],["检查站：四道关",["再看检查站。一笔充值或提币，要依次过四道关。","第一道，制裁筛查：地址和用户在不在制裁名单上，命中就拦。","第二道，链上风险评分：资金几跳以内，是不是来自被盗资金、混币器。被盗资金进入交易所，往往是冻结追回的最后机会。","第三道，Travel Rule，服务商之间转账要带上双方信息。第四道，AML 监控，盯住拆分和快进快出。"]],["规则有漏洞，也会误伤",["这里的攻击者，不需要攻破任何系统，只需要规则有漏洞。比如 Binance 事件前一天，攻击者的操作钱包就收到了 3 笔 Tornado Cash 提款。","检查站也会误伤：评分误报，又没人复核、没处申诉，正常用户的钱就被冻住。两种失效都要算。"]],["Travel Rule：门槛设错也是失效",["门槛设错，也是一种失效。拿 Travel Rule 来算一笔。","FATF 建议的门槛是 1,000 美元或欧元。可欧盟的 TFR，从 2024 年 12 月 30 日起，服务商之间的转账不设最低门槛。","一位欧盟用户向另一家服务商转出 500 欧元。按 1,000 欧元设计的系统会放过它，按欧盟规则，它仍然要带上双方信息。","另一位用户向自己的自托管钱包转出 2,000 欧元。超过 1,000 欧元，就要核验这个钱包确实归他所有。"]],["检查站失守，代价落在交易所",["检查站失守，代价落在交易所身上：2023 年 11 月，Binance 认罪并支付 43 亿美元；2025 年， 数据会变成三种东西：变成信任，用来钓鱼"],[417.02,422.15,"变成身份，用来接管账号；变成目标，用来找上门"],[422.6,428.5,"防守也就分成三层：少收、遮蔽、限定范围；留痕和告警"],[428.5,433.69,"管住每一家第三方。对用户只有一句：说得出细节"],[433.69,435.1,"不等于真客服"],[435.55,439.68,"成立条件是：数据一旦泄露，就会流通很多年"],[439.68,444.23,"这些控制只能减少下一次。成本是公司自己的估算"],[444.23,447.74,"个别诈骗案也不能直接归因于这次泄露"],[448.19,452.6,"下一集，我们看钱被转走之后：资金追踪"],[452.6,454.31,"冻结与事后处置"]],"ch":[]},"deck":{"src":"../decks/skeuomorphic/ch24/index.html","scenes":[["收买客服，导出用户数据",["2025 年 5 月，一个犯罪团伙，找上了 Coinbase 的外包客服。","他们没去撬钱包，只是花钱，收买了客服。","被收买的人，从客服工具里，导出了 69461 名用户的数据。","姓名、联系方式、证件图像、余额、交易记录。"]],["没有钥匙，也很贵",["可这份数据里，没有密码，也没有私钥。","没有钥匙，照理说，打不开任何一个账户。","可 Coinbase 在提交给 SEC 的文件里估算，这次事件，要花掉约 1.8 亿到 4 亿美元。","其中一项，是赔偿被冒充客服骗走资金的用户。"]],["先猜一道题",["先猜一道题。","一天，你接到电话，对方自称交易所客服。","他叫得出你的名字，说得出你的余额，还知道你上周提过的工单。","他说你的账户有风险，请你把资产，转到一个安全钱包。","他是真客服吗？","带着这个问题，我们看看，泄露的数据怎样变成攻击。"]],["泄露是下一次诈骗的名单",["先给准确的说法。","数据泄露，是下一次诈骗的名单。","攻击者知道了谁持有多少资产，住在哪里，用哪家交易所。","他就能冒充客服精准下手，甚至找上门。"]],["一本肥羊通讯录",["打个比方，一份泄露的客户名单，就是一本肥羊通讯录。","上面有姓名、电话、存款金额，还注明他上周刚联系过客服。","比喻在这里不成立，银行流水是私密的，链上交易是公开的。","名单里只要有一个地址，攻击者就能查到这个人全部的链上历史，和当前的余额。"]],["一次泄露，三类攻击",["一次泄露，会同时引出三类攻击。","第一类，精准钓鱼，冒充客服，说出真实的细节。","第二类，账号接管，拿证件信息骗过运营商，劫持手机号。","第三类，人身风险，知道住址，又知道资产。","泄露的数据还会长期流通，几年前的名单，今天还在被用来诈骗。"]],["最集中的出口：客服后台",["名单从哪里流出来？先看最集中的出口，客服后台。","攻击者在社交平台上，招募交易所的客服或者外包人员，开价收买。","被收买的人，在客服后台查询用户，截屏或者导出。"]],["Coinbase 拒付勒索",["Coinbase 这一次，泄露的还有社保号后四位，和部分遮蔽的银行账号。","攻击者随后索要 2000 万美元。","Coinbase 拒付，拿出同等金额设立悬赏，并承诺赔偿被骗的用户。","外包商解雇了涉事员工，2025 年 12 月，印度警方逮捕了一名前客服。"]],["每家第三方都是泄露点",["交易所的数据，不只留在交易所里。","KYC 服务商、工单系统、邮件营销、物流、破产服务，每一家都是一个泄露点。"]],["Ledger 客户数据泄露",["2020 年 6 月，攻击者用一把第三方的 API 密钥，进了 Ledger 的电商和营销数据库。","约 100 万个邮箱泄露，约 27.2 万条记录带着姓名、住址和电话。","Ledger 后来修正为，约 29.2 万名客户。","同年 12 月，完整的数据库，被公开在黑客论坛上。","之后是大量钓鱼邮件和短信，还有针对客户的威胁电话。"]],["谁买了硬件钱包也是数据",["硬件钱包本身没有被攻破。","可谁买了硬件钱包，寄到了哪里，本身就是高价值的数据。"]],["Kroll：外包员工被换卡",["2023 年 8 月，Kroll 一名员工的手机号，被 SIM 卡劫持。","攻击者借此看到了 FTX、BlockFi、Genesis 三个破产案的债权人文件。","姓名、地址、邮箱，还有账户余额。","外包商员工的手机号，也成了你的攻击面。"]],["Trezor：工单平台被访问",["2024 年 1 月，Trezor 的第三方工单平台，遭到未授权访问。","最多约 6.6 万名联系过客服的用户，邮箱和姓名泄露。","冒充者随后联系了约 40 名用户，索要助记词。"]],["取决于最弱的第三方",["2022 年 12 月，Gemini 的一家供应商被入侵。","约 570 万行客户邮箱，和部分遮蔽的电话号码泄露。","Gemini 称，账户和系统没有受到影响。","你的数据有多安全，取决于数据流向的，最弱的那一家第三方。"]],["去匿名化",["数据之外，还有一种暴露，来自链本身。","去匿名化，就是把匿名的链上地址，关联到真实的身份。","链上分析先把地址聚成一个个实体，再把实体对上真人。"]],["共同输入与找零地址",["第一种方法，共同输入。","一笔比特币交易的多个输入，大概率属于同一个所有者。","第二种，找零地址，认出交易里找零给自己的那个输出。"]],["出入金、模式与链下关联",["第三种，交易所出入金。","地址跟交易所的充值地址有往来，而交易所掌握 KYC。","第四种，跨链、跨混币器的时间和金额模式。","第五种，链下关联，ENS 名称、社交媒体上贴出的地址、NFT 头像。"]],["启发式会误判",["这些都是启发式规则，会误判。","比如一笔交易，有 4 个输入，4 个金额相等的输出。","共同输入规则，会把 4 个输入，归给同一个人。","可这是典型的 CoinJoin，可能是 4 个人各出一个输入。","聚到一起，一个人的 KYC 身份，就扩散到了另外 3 个人身上。"]],["Bitcoin Fog 案",["这套方法，已经走进了法庭。","Bitcoin Fog 是一个混币器，经手 120 万余枚比特币。","2024 年 3 月，陪审团裁定，运营者 Roman Sterlingov 四项罪名成立。"]],["链上分析进了法庭",["法官经过专门听证，认定 Chainalysis Reactor 的分析可以作为证据。","同时，还有卧底交易等其他证据印证。","2026 年 9 月，上诉法院维持定罪，没有要求公开工具的源代码。"]],["混币换地址不等于匿名",["混币和换地址，不等于匿名。","交易所的出入金记录，往往是把地址落到真人身上的关键一环。","执法和交易所用它追踪被盗资金，攻击者用它筛选目标。"]],["从源头：数据最小化",["防守从源头开始，数据最小化。","只收集业务和合规必需的数据，写清每类数据保存多久。","客服后台默认遮蔽敏感字段，证件号、完整住址、完整余额。","需要看，就逐条申请，写明原因。"]],["客服查询要受限、留痕",["客服只能查当前工单对应的用户，不能任意搜索。","导出默认关闭，开启要审批，还要带水印。","每一次敏感查询都留痕，记下查询人、时间、对象和理由。","单人查询量突增、查询和工单无关的用户、非工作时间查询，自动告警。"]],["终端与第三方",["客服终端禁止截屏和外接存储，外包客服用公司管理的设备。","第三方签约前做安全尽调，合同写明用途、保存期限、泄露通知时限和审计权。","能给脱敏数据的，不给原始数据，业务结束，确认数据已经删除。"]],["万一泄露",["万一泄露，先确认范围，按法规时限通知监管和用户。","告诉用户，攻击者可能怎么联系他们，交易所永远不会做什么。","受影响的用户，加上提币冷却和异常登录拦截，再盯住暗网上的数据售卖。"]],["链上哈希也是个人数据",["还有一类数据，写上链就很难删掉。","比如合约里不存邮箱原文，只存邮箱的哈希。","可邮箱的取值范围有限，攻击者拿常见邮箱逐个算哈希，一比对就能对上。","欧洲数据保护委员会 EDPB 认为，不加盐、不带密钥的哈希，放在公链上通常不够。","哈希本身，也算个人数据。"]],["加盐承诺，盐存链下",["更稳的做法，是先拼上一段 32 字节的随机盐，再算哈希，链上只存这个承诺。","盐和原文存在链下可以删除的系统里，删掉盐，链上的承诺就关联不到这个人。","加密上链再销毁密钥，也不等于数据消失，密文还留在每个节点里。"]],["今天就能做的事",["交易所今天就能做一件事。","查一查，客服后台有多少人，能查到一条完整的用户记录。","普通用户也有几件事。","买硬件钱包用代收地址，交易所和电商用不同的邮箱。","不在社交媒体上，把自己的地址或 ENS 名称，和真实身份连在一起。","收到交易所的泄露通知，开启提币白名单，至少几个月保持警惕。"]],["答案：不代表是真客服",["回到开头的题。","对方说得出你的名字、余额和工单，不代表他是真客服。","这些数据，可能早就泄露了。","交易所和钱包厂商，永远不会让你把资产转到安全地址，也不会索要助记词。","主动打来的电话、短信、邮件，说你的账户有风险，一律挂断，再从官方 App 里联系客服。"]],["数据告诉骗子该骗谁",["数据里没有密码，可它告诉骗子，该骗谁，该怎么说。"]]]},"d3b":{"src":"../decks/3b1b/ch24.html","scenes":[["没有密码和私钥，仍损失数亿美元：怎么做到的",["2025 年 5 月，犯罪团伙收买了 Coinbase 的外包客服，导出了 69,461 名用户的数据。","这批数据里，没有密码，也没有私钥。","可 Coinbase 仍然估算，这次事件要花掉 1.8 亿到 4 亿美元。","拿不到密码和私钥，攻击者靠什么拿到用户的钱？泄露的数据，是怎样变成攻击的？"]],["数据泄露，就是下一次诈骗的名单",["先给一句话：数据泄露，就是下一次诈骗的名单。","打个比方，一份泄露的客户名单，等于给骗子发了一本肥羊通讯录。","上面有姓名、电话、存款金额，甚至还写着：他上周刚联系过客服。骗子打来电话时，说的每个细节都是真的。"]],["比方不够：链上交易是公开的",["这个比方有一处不够：银行流水是私密的，链上交易却是公开的。","名单里只要出现一个地址，攻击者就能查到这个人全部的链上历史，和他现在的余额。"]],["一份名单，三条攻击路径",["一份名单泄露出去，会同时长出三条攻击路径。","第一条，精准钓鱼：冒充客服，说出真实的细节，让用户自己把资产转到所谓的安全地址。","第二条，账号接管：拿证件信息去骗运营商，做 SIM 卡劫持。第三条，链上关联：查到全部持仓，再加上住址，就走向了上一集讲的人身胁迫。"]],["泄露之后的损失，远大于泄露本身",["所以泄露之后的损失，往往远大于泄露本身。拿 Coinbase 的估算算一下：1.8 亿美元除以 69,461 人，每人约 2,600 美元；按 4 亿算，每人约 5,800 美元。","而且泄露的数据会长期流通。一份 2020 年泄露的名单，几年后还在被用来行骗。"]],["信任一格一格涨上去",["看一通冒充客服的电话，信任是怎么一格一格涨上去的。","对方叫出了你的名字。又说出了你的余额。再提到你上周提交的工单。","每说对一个细节，你的戒心就少一分。最后他说：你的账户有风险，请先把资产转到安全钱包。"]],["说得出细节，不等于真客服",["这里要记住两件事。交易所和钱包厂商，永远不会让你把资产转到安全地址，也不会索要助记词。","对方说得出细节，不代表他是真客服。数据可能早就泄露了。挂断电话，再从官方 App 里联系客服。"]],["每一个第三方，都是一个泄露点",["数据从哪里漏出去？不只是交易所自己。","交易所的数据，会流向很多第三方：KYC 服务商、客服工单系统、邮件营销、电商物流、破产案服务商、外包客服。每一家，都是一个泄露点。"]],["数据有多安全，取决于最弱的一家",["2020 年，Ledger 的电商与营销数据库被访问，泄露了约 100 万个邮箱，和约 27 万条姓名、住址、电话。硬件钱包本身没被攻破，可谁买了它、寄到哪里，本身就是高价值数据。","2023 年，破产案服务商 Kroll 的一名员工被 SIM 卡劫持，FTX 等三个破产案的债权人文件被访问，里面有姓名、地址和账户余额。","2024 年，Trezor 的第三方工单平台被访问，随后有冒充者联系了约 40 名用户，索要助记词。","你的数据有多安全，取决于数据流向的最弱的那一家。"]],["共同输入规则：会出错",["再看链上这一侧：去匿名化，就是把匿名地址关联到真实身份。","最常用的一条规则叫共同输入：一笔比特币交易有多个输入，它们大概率属于同一个人。再加上交易所的出入金记录，地址就能落到实名用户身上。","但规则会出错。比如一笔交易有 4 个输入，4 个金额相等的输出。这是典型的 CoinJoin：很可能是 4 个人各出了一个输入。","共同输入规则却会把它们归成一个人。一个人的实名身份，就这样扩散到了另外 3 个人身上。"]],["双刃剑：混币和换地址不等于匿名",["这是一把双刃剑。攻击者用它筛选目标，执法和交易所用它追踪被盗资金。2024 年 Bitcoin Fog 案中，法院在有其他证据印证的情况下，采纳了链上分析，上诉法院后来维持了定罪。","混币和换地址，并不等于匿名。"]],["防守第一现场：客服后台",["防守的第一现场，是客服后台。Coinbase 的数据，正是从这里导出去的。","第一，默认遮蔽：证件号、完整住址、完整余额，默认看不到；要看就逐条申请，写明原因。","第二，限定范围：客服只能查当前工单对应的用户，不能任意搜索。导出默认关闭。","第三，全部留痕：谁、在什么时候、查了谁、为什么。单人查询量突增、查和工单无关的人，自动告警。","外包客服用公司管理的设备和虚拟桌面。交给第三方的，只给最小必要的数据，合同里写清楚用途、期限和泄露通知时限。"]],["邮箱哈希放上链，不等于不是个人数据",["还有一类数据，写上去就很难删掉：链上的个人数据。","有的团队说：合约里只存邮箱的哈希，不是个人数据。这不成立。邮箱的取值空间很小，任何人都能拿常见邮箱逐个算哈希，比对出来。","欧盟数据保护委员会的指南也认为：不加盐、不带密钥的哈希放在公链上，通常不够；技术上做不到删除，不能当作不遵守的理由。"]],["链上只放加盐的承诺",["更稳的做法，是链上只放加盐的承诺。盐是链下生成的随机数，和原文一起放在能删除的系统里。删掉盐，链上的承诺就再也关联不回这个人。","加密上链再销毁密钥，也不等于数据消失：密文还在每个节点上，密钥可能早就泄露，算法也可能被破解。","这部分是工程整理，不是法律意见。上线前，要让法务按具体业务判断。"]],["答案：数据变成信任、身份、目标",["回到 Coinbase。没有密码，没有私钥，攻击者靠什么？","靠信任。泄露的数据，被换成了真实的细节。用户听到自己的名字、余额和工单，就自己把钱转了出去。","所以泄露的数据会变成三种东西：变成信任，用来钓鱼；变成身份，用来接管账号；变成目标，用来找上门。"]],["三层防守，以及成立条件",["防守也就分成三层：少收、遮蔽、限定范围；留痕和告警；管住每一家第三方。对用户只有一句：说得出细节，不等于真客服。","成立条件是：数据一旦泄露，就会流通很多年，这些控制只能减少下一次。成本是公司自己的估算，个别诈骗案也不能直接归因于这次泄露。"]]]}}},{"id":"25","title":"资金追踪、冻结与事后处置：钱被转走之后","md":"../chapters/25-fund-tracing-response.md","v":{"vs":{"src":"skeuo/ep25/out/ep25-full.mp4","cues":[[1.65,2.92,"2026 年 10 月"],[3,5.39,"Binance 遭遇了一次大规模盗窃"],[6.38,7.38,"被盗资金"],[7.57,9.31,"经过主要的清扫交易"],[9.37,10.23,"转了出去"],[11.21,12.44,"37 分钟后"],[12.52,15.88,"Tether 冻结了 9.711 亿 USDT"],[16.85,18.03,"又过了 3 分钟"],[18.09,21.33,"Circle 冻结了 8.23 亿 USDC"],[22.3,23.4,"听起来很快"],[23.59,24.66,"可还是慢了一步"],[25.64,26.78,"Elliptic 估计"],[26.94,28.21,"冻结生效之前"],[28.23,30.09,"约 7.86 亿美元的稳定币"],[30.11,32.27,"已经被换成了 ETH 和 TRX"],[33.26,34.63,"换成这两种币"],[34.74,36.26,"发行方就管不到了"],[37.24,38.21,"TRM 统计"],[38.23,39.84,"事发后约 4 小时"],[39.96,42.28,"各方累计冻结约 27 亿美元"],[43.27,44.14,"就算这样"],[44.32,47.05,"冻结也只覆盖了约 44% 的损失"],[48.03,49.35,"先猜一道题"],[50.34,51.46,"被盗的资产里"],[51.48,54.05,"有 USDT 和 USDC"],[54.07,55.21,"也有 BTC"],[55.23,56.54,"XRP 和 SOL"],[57.52,58.8,"发行方冻结"],[59.02,60.55,"能管到其中哪几种"],[61.81,62.92,"带着这个问题"],[63.06,63.92,"我们看看"],[64.14,65.39,"钱被转走之后"],[65.5,66.67,"到底能拦住多少"],[69.85,71.45,"先给一句准确的说法"],[72.44,73.57,"追回的窗口"],[73.73,74.65,"以小时计"],[75.62,76.84,"头几个小时里"],[77.06,77.94,"被盗的钱"],[77.96,79.54,"还是可冻结的稳定币"],[79.71,81.19,"是交易所里的充值"],[81.26,83.55,"或者是链上可以暂停的合约份额"],[84.52,85.68,"几个小时之后"],[85.8,87.64,"它会变成跨链后的原生币"],[87.66,89.02,"混币器里的存款"],[89.09,90.62,"或者场外交易的现金"],[91.61,92 约 4300 万美元的 cmETH。","这是那次事件里，追回最多的单项。"]],["第二道：稳定币发行方冻结",["第二道，是稳定币发行方冻结。","Tether、Circle 这类发行方，可以在合约层面冻结一个地址。","2024 年 9 月，Tether、TRON 和 TRM 联合成立了 T3 金融犯罪部门。","2026 年 5 月，T3 自报累计冻结 4.5 亿美元以上。"]],["有门槛，也会被撤销",["可这条路，有门槛，有时延，也可能被撤销。","门槛是，通常要有执法请求或法院命令。","撤销的例子，是 2025 年 5 月的 LIBRA 案。","Circle 依据纽约南区法院的临时限制令，冻结了约 5760 万美元 USDC。","8 月，法官解除了冻结，理由是原告没有证明不可弥补的损害。"]],["时延与法定义务",["时延的例子，是 2026 年 4 月的 Drift 被盗事件。","链上调查者 ZachXBT，公开批评 Circle 延迟了约 6 小时，期间约 2.32 亿美元经跨链协议转走。","这是个人指控，未见 Circle 回应。","美国 GENIUS 法案在 2025 年 7 月成为法律，要求支付型稳定币发行方，有能力执行冻结、扣押、阻止转账这类合法命令。"]],["第三道：交易所冻结",["第三道，是交易所冻结。","条件是交易所收到可信的地址清单，或者风控名单命中，时效在小时级。","局限也很明显，攻击者会避开合规交易所。"]],["链级冻结：Sui 与 Cetus",["前排拦不住，后面还有三条更重的路。","一条是链级冻结。","2025 年 5 月，Sui 上的 Cetus 被盗约 2.23 亿美元，根因是集中流动性合约的算术溢出。","约 6300 万美元，在冻结前跨链到了以太坊。","Sui 验证者在链上冻结了约 1.62 亿美元。","治理投票以约 90.9% 的质押权通过，用协议升级，把冻结的钱转进三方共管的多签，用于赔付。"]],["钱保住了，争议也来了",["钱保住了，争议也来了。","部分验证者公开表达了保留意见。","能冻结并改写特定地址，也就说明，这条链的验证者可以干预任意地址。","Binance 事件里，Arbitrum 安全委员会也强制转走了，攻击者钱包里的 8426 ETH 和 7460 万 ARB。"]],["谈判：Poly Network",["一条是谈判与白帽赎回。","2021 年 8 月，Poly Network 被盗约 6.1 亿美元，攻击者自称白帽，约 15 天内归还。"]],["赏金与悬赏：Euler",["2023 年 3 月，Euler Finance 被闪电贷攻击，损失约 1.97 亿美元。","Euler 提出 10% 的赏金，同时另设 100 万美元悬赏，征集攻击者的线索。","4 月初，Euler 宣布，全部可追回的资金已经归还。","可攻击者为什么归还，通常不公开，谈判不能当作预案的主线。"]],["执法：Bitfinex 被盗币",["最后一条，是执法与司法。","2022 年 2 月，美国司法部逮捕两名嫌疑人，调查人员解密了云存储里的私钥文件。","没收约 94636 BTC，当时约 36 亿美元，这批币是 2016 年从 Bitfinex 被盗的。"]],["返还可能拖好几年",["2025 年 1 月，检方申请把币以实物返还，法官对返还方式提出了质疑，最终处置至今仍有争议。","从执法追回到真正返还，可能要拖好几年。"]],["前 6 小时：暂停与清单",["这些路走不走得通，要看事发后的前 6 小时。","发现异常，先暂停，协议暂停，交易所暂停这条链的提币。","接着整理地址清单，被盗地址，攻击者地址，已知的下一跳。","清单是所有通知的前提，清单不准，冻结请求就会被拒绝或延误。"]],["并行通知，不排队",["然后并行通知，不是排队通知。","稳定币发行方、交易所风控、跨链桥和兑换服务、SEAL 911 这样的应急网络、链上分析公司，同时发出去。","先发清单，不要等完整报告，冻结只需要准确的地址和交易哈希。"]],["保全证据，报警，喊话",["同时做证据保全，交易哈希、日志、服务器镜像。","保全要在清理和恢复系统之前完成，恢复会覆盖证据。","然后报警，按辖区通知监管。","一小时之后，可以在链上喊话，提出赏金和安全港条件，并且每小时更新地址清单。"]],["安全港要事先写好",["安全港要事先写好。","SEAL 的白帽安全港框架，让协议通过治理事先授权白帽，在攻击正在发生时抢救资金。","默认条款是 72 小时内把资金返回指定地址，赏金 10%，上限 100 万美元。","事发时再讨论，白帽不敢动手。"]],["平时也要准备",["平时也要准备。","实时监控大额流出和权限变更，风控名单每日更新，每季度演练一次，确认联系人是否有效。","聚类这类启发式追踪结论，要标注规则和置信度，不能单独作为冻结的依据。"]],["如果被盗的是你的钱",["如果被盗的是你自己的钱，顺序也差不多。","先撤销所有授权，把剩下的资产转到全新的地址，用新助记词、新设备。","记下被盗地址、攻击者地址、交易哈希、时间，和你点过的链接。"]],["找发行方、交易所和警方",["被盗的是 USDT 或 USDC，马上联系发行方，附上交易哈希。","钱流进了某个交易所，就通过它的官方渠道提交冻结请求。","报警，拿到报案回执，交易所和发行方通常需要执法请求才能冻结。","当心追回诈骗，说能帮你追回资金、要你先付费的人，几乎都是诈骗。"]],["答案：只管有发行方的币",["回到开头的问题。","发行方冻结，只能管到 USDT、USDC 这类有发行方的代币。","BTC、XRP、SOL 是原生资产，没有发行方，这条路管不到它们。"]],["追回多少，事前就定了",["所以第一批通知发给发行方，但不能把它当成全部方案。","最有效的，是事先设计好的暂停和延迟，加上提前备好的地址清单和联系人。","钱被转走之后能追回多少，大半在出事之前就定了。"]]]},"d3b":{"src":"../decks/3b1b/ch25.html","scenes":[["冻结了约 17.9 亿，仍有约 7.9 亿已被换走",["2026 年 10 月 29 日，Binance 热钱包被清扫。37 分钟后，Tether 冻结了约 9.7 亿 USDT。","又过了 3 分钟，Circle 冻结了约 8.2 亿 USDC。","可按 Elliptic 的估计，冻结生效之前，已经有约 7.9 亿美元的稳定币，被换成了 ETH 和 TRX。","钱被转走之后，还能做什么？哪些能拦住，哪些拦不住？"]],["追回的窗口，以小时计",["先给一句话：追回的窗口，以小时计。","头几个小时里，被盗资金还是可以冻结的稳定币、交易所里的充值、或者协议里可以暂停的份额。几个小时之后，它就变成了跨链后的原生币、混币器里的存款、场外交易的现金。"]],["比方：出口设卡；不成立处是出口没人管",["打个比方：抢劫发生后，警方在城市的每个出口设卡。设卡越早，拦住的车越多。","劫匪一旦开上国道、换了车牌，也就是跨链、换币，再拦就很难了。","这个比方有一处不成立：链上的出口，大多不归任何警察管。去中心化的桥、混币器、交易所，没有义务配合。能拦住的，主要是有中心化运营方的那部分出口。"]],["被盗资金的路径与拦截点",["看被盗资金通常怎么走。","第一步，往往是把稳定币换掉，抢在发行方冻结之前。然后分散到大量地址。","接着跨链换成比特币之类的原生币，或者进混币器。最后通过场外交易，或者小额分批进入交易所变现。","防守方的拦截点，就插在这条路上：协议暂停、发行方冻结、兑换服务拒绝、交易所冻结。","拦截点越靠左，成功率越高。但每一个拦截点，都需要有人在第一时间，递上一份准确的地址清单。"]],["六条路径：快的、有前提的",["能用的追回路径，大致有六条。它们的区别，在于谁来执行，以及要多久。","协议暂停或延迟提款，由协议方执行，分钟级生效。前提是合约里提前设计了这个机制，而且有人值守。","稳定币发行方冻结，分钟到小时。有门槛，有时延，还可能被法院撤销。交易所冻结，小时级，可攻击者会绕开合规的交易所。"]],["越往右越慢，越不确定",["链级冻结，由验证者或治理执行，小时到天，会损害链的中立性。","再往后，是谈判与白帽赎回，天到周，结果不可控；执法和司法，月到年，返还周期很长。","越往右越慢，越不确定。所以真正能指望的，是左边那几条。"]],["头 6 小时：先暂停，再整理地址清单",["事发后的头 6 个小时，顺序很重要。","第一件事，暂停：协议暂停，交易所暂停这条链的提币。","第二件事，整理地址清单：被盗地址、攻击者地址、已知的下一跳。这是所有通知的前提。清单不准，冻结请求就会被拒绝或者延误。"]],["并行通知，保全证据，撤销链上授权",["然后并行通知：稳定币发行方、主要交易所、跨链桥和兑换服务、应急网络、链上分析公司。是同时发，不是排队发。先发清单，完整的事故报告可以后补。","同时保全证据：交易哈希、日志、服务器镜像。要在恢复系统之前做完，因为恢复会覆盖证据。","还有一条，上一集讲过：暂停提现只是链下动作，已有的链上授权，要单独撤销。"]],["冻结加拦截，只覆盖约 44%",["回到开头的冻结，算一笔账。","Tether 冻结约 9.7 亿，Circle 冻结约 8.2 亿，两家合计约 17.9 亿美元。可在它们动手之前，约 7.9 亿美元已经被换走了。","就算把所有冻结和拦截都算上，也只覆盖了这次损失的约 44%。"]],["发行方冻结重要，但不是兜底",["剩下的为什么拦不住？比特币、XRP、SOL 这些原生资产，没有发行方，没人能从合约层面冻结它们。","而且冻结也可能被撤销。Circle 曾依据法院的临时限制令冻结约 5,760 万美元 USDC，几个月后，法官解除了冻结。","所以发行方冻结是重要的工具，但不是兜底。"]],["Bybit：资金早已上路",["再看一次全行业协作的大追踪：2025 年 2 月，Bybit 被盗之后。","FBI 在 5 天后公布了攻击者地址。可资金早已上路：约 72% 经 THORChain 换成了比特币，约 16% 经兑换服务 eXch 兑换。","到 2025 年 4 月，Bybit 的口径是：约 68.6% 还能追踪，约 27.6% 已经无法追踪，真正被冻结的，只有约 3.8%。"]],["事前设计的延迟，胜过事后冻结",["这次事件里，追回最多的单项不是冻结，而是 mETH 协议。它有 8 小时的提款延迟，团队及时暂停合约，保住了约 4,300 万美元。","事后的冻结，比不上事前设计好的延迟和暂停。"]],["链级冻结：救急，但验证者可干预任意地址",["还有两条更有争议的路。","一条是链级冻结。2025 年 5 月，Sui 上的 Cetus 被盗约 2.23 亿美元。验证者在链上冻结了约 1.62 亿，治理投票以约 90.9% 的质押权通过，把资金转去赔付。","它救了急，但也说明：这条链的验证者，可以干预任意地址。部分验证者公开表达了保留意见。"]],["谈判靠不住，安全港可以提前做",["另一条是谈判。Poly Network 和 Euler 的攻击者，都把钱还了回来。可他们归还的真正原因通常不公开，不能把谈判当成预案的主线。","能提前做的，是安全港协议：通过治理事先授权白帽，在攻击发生时抢救资金，72 小时内归还，赏金默认 10%，上限 100 万美元。事发时再讨论，白帽不敢动手。"]],["答案：集中在头几个小时，只能拦有人管的出口",["回到开头的问题：钱被转走之后，还能做什么？","能做的，集中在头几个小时：准确的地址清单，并行通知所有能冻结的出口，先保全证据，再恢复系统。","但拦得住的，只有那些有人能管的出口：稳定币、合规交易所、有运营方的兑换服务。原生资产、去中心化的路径，没人能替你拦。"]],["最有效的追回发生在事前",["所以最有效的追回，发生在事前：把暂停、延迟提款、通知清单和安全港，提前写好，演练过。","对个人用户还有一句：声称能帮你追回资金、要你先付费的人，几乎都是诈骗。"]]]}}},{"id":"32","title":"dApp 连接层、编译器工具链与硬件钱包底层安全","md":"../chapters/32-dapp-connector-compiler-hardware.md","v":{}}]},{"name":"第七篇 · AI 与前沿","items":[{"id":"26","title":"AI × Web3 安全：新攻击者，新防御者","md":"../chapters/26-ai-web3-security.md","v":{"vs":{"src":"skeuo/ep26/out/ep26-full.mp4","cues":[[1.65,3.04,"2024 年 11 月"],[3.08,5.02,"一个叫 Freysa 的 AI 智能体"],[5.04,6.26,"守着一笔奖池"],[7.24,8.68,"它只有一条规则"],[8.78,9.81,"绝不转账"],[10.8,12.41,"这是一场对抗游戏"],[12.68,13.74,"玩家的目标"],[13.81,14.91,"就是让它破例"],[15.89,18.22,"一名玩家伪造了一个新会话"],[19.21,20.14,"让它相信"],[20.34,22.2,"转账函数是用来收款的"],[23.17,24.09,"它照做了"],[24.37,26.47,"约 4.7 万美元的奖池被转走"],[27.45,28.87,"没有人破解代码"],[28.98,30.27,"也没有人偷私钥"],[31.24,32.59,"钱是被说服走的"],[33.58,34.9,"先猜一道题"],[35.88,37.67,"如果绝不转账这条规则"],[37.78,39.03,"写在提示词里"],[39.09,40.53,"同时也写在合约里"],[41.5,42.91,"玩家说服了模型"],[43.12,44.44,"钱还会被转走吗 系统"],[302.26,304.86,"对防御方最确定的影响是"],[304.86,310.54,"漏洞从公开到被利用的时间窗口，在缩短。修复要更快"],[312.24,318.07,"AI 还在帮我们写代码。写错的时候，看起来往往很合理"],[318.52,323.4,"2026 年 2 月，Moonwell 上线一个新的价格包装器"],[323.4,327.02,"cbETH 的美元价格，本该是两个数相乘"],[327.47,330.77,"代码只取了 cbETH 对 ETH 的汇率"],[330.77,335.92,"漏乘了 ETH 的美元价。cbETH 被定价成约 1.12 美元"],[336.37,342.21,"随后是大量清算，留下约 178 万美元坏账。相关提交里"],[342.21,345.56,"有 AI 编程助手署名的共同作者"],[346.01,350.87,"但项目方没有把事故归因于 AI，人也会犯同样的错"],[350.87,355.52,"教训是：AI 写的配置，和人写的一样，要走审查"],[355.52,358.1,"和对接真实数据的集成测试"],[358.55,362.51,"供应链也一样：AI 编造的包名会被人抢注"],[362.51,367.77,"假的 Solidity 插件盗走过约 50 万美元。插件和依赖"],[367.77,368.83,"都走白名单"],[370.53,372.59,"把这些放在一起看"],[373.04,377.51,"攻击者这一边：钓鱼写得更快，伪造视频更像"],[377.51,378.85,"找漏洞更便宜"],[379.3,384.27,"防御者这一边：审计初筛更广，监控告警更快"],[384.72,388.13,"但 AI 审计替代不了业务逻辑审查"],[388.13,393.3,"判断不了一个发现是否真能利用，也不能对结论负责"],[393.3,396,"它适合放在流程早期做初筛"],[396.45,401.32,"所以，AI 不是一类新漏洞，而是一个放大器"],[401.32,402.81,"两边都被放大"],[403.26,407.98,"新的部分只有一个：当智能体自己拿着钱包，说服它"],[407.98,410.03,"就成了转走资产的方法"],[411.73,416.99,"回到开头：如果绝不转账写在合约里，玩家说服了模型"],[416.99,418.74,"钱还会被转走吗？"],[419.19,424.42,"不会。合约按代码拒绝这笔转账，模型说什么都没用"],[424.87,427.89,"边界要画在模型之外：对智能体"],[427.89,433.08,"是代码里的额度和白名单；对人，是换渠道确认的流程"],[433.08,435.24,"对代码，是审查和测试"],[435.69,440.47,"成立条件是，这些限制真的写在代码里，而且一直都在"],[440.47,443.63,"2026 年的 Grok 和 Bankr 事件里"],[443.63,447.81,"一道屏蔽模型间指令的防护，在重写时被删掉了"],[448.26,452.67,"带走一个问题：哪一条限制，不依赖模型听话？"],[453.12,459.19,"下一集，我们把前面所有的知识，变成一套可执行的流程"],[459.19,461.62,"审计、测试与开发流程"]],"ch":[]},"deck":{"src":"../decks/skeuomorphic/ch26/index.html","scenes":[["Freysa：绝不转账",["2024 年 11 月，一个叫 Freysa 的 AI 智能体，守着一笔奖池。","它只有一条规则，绝不转账。","这是一场对抗游戏，玩家的目标，就是让它破例。"]],["钱是被说服走的",["一名玩家伪造了一个新会话。","让它相信，转账函数是用来收款的。","它照做了，约 4.7 万美元的奖池被转走。","没有人破解代码，也没有人偷私钥。","钱是被说服走的。"]],["先猜一道题",["先猜一道题。","如果绝不转账这条规则，写在提示词里，同时也写在合约里。","玩家说服了模型，钱还会被转走吗？","带着这个问题，我们看看，AI 给 Web3 安全带来了什么。"]],["AI 是放大器",["先给一句准确的说法。","AI 不是一类新漏洞，它是一个放大器。","它让攻击者写钓鱼更快，伪造视频更像，找合约漏洞更便宜。","它也让防御者审计得更广，监控得更快。"]],["真正新的：智能体拿钱包",["真正新的部分，只有一个。","当 AI 智能体自己拿着钱包，说服它，就成了转走资产的方法。","AI 智能体，是能调用工具、执行操作的大语言模型程序。","比如自动交易的机器人，或者自动回复并打赏的机器人。"]],["提示注入",["攻击它最直接的办法，叫提示注入。","把指令藏在模型会读到的内容里，让模型去执行攻击者的意图。"]],["比喻：极其听话的新助理",["打个比方，你雇了一个能干、但极其听话的新助理，还把公司的支付卡交给了他。","任何人走进办公室，塞给他一张纸条，写着老板说把钱转给我，他都可能照做。","问题不在助理不够聪明，而在你把支付卡，交给了一个会被纸条说服的人。"]],["比方不成立处：记忆",["这个比方有一处不成立。","真实的助理，会记得谁是老板。","智能体的记忆，本身也可能被人写进假内容。"]],["AI 站在哪一边",["按 AI 站在哪一边，可以分成五个方向。","AI 是目标，比如持有钱包的智能体。","AI 是攻击工具，一边对着人，一边对着代码。","AI 是开发工具，写合约，写配置，装插件。","AI 也是防御工具，做审计初筛和监控告警。","先看最新的那一个，持有钱包的智能体。"]],["每种输入都是攻击路径",["一个持有钱包的智能体，大致是这样工作的。","用户消息、网页、长期记忆、工具说明，都会送进模型。","模型决定调用哪个工具，比如钱包的转账和授权。","模型读到的每一种内容，都是输入。","任何一种输入能影响它调用钱包，就是一条攻击路径。"]],["① 提示注入：Bankr",["第一条，提示注入。","2026 年 5 月，攻击者先往一个钱包里送了一枚会员 NFT，借此提升了权限。","再诱导 Grok 回复一条转账指令，Bankr 照着执行了。","一道屏蔽模型之间指令的防护，在代码重写时被删掉了。","约 15 万到 20 万美元被转走，约 80% 已经归还。"]],["② 记忆注入",["第二条，记忆注入。","攻击者在智能体能读到的地方，写进一段伪造的历史记录。","智能体把它存进长期记忆，之后的会话里，当成事实来用。","没有任何新的恶意提示，它也会执行未授权的转账。","普林斯顿和 Sentient 的研究者，在 ElizaOS 智能体上证明了这一点。"]],["③ 工具和插件",["第三条，工具和插件。","MCP 让模型连接外部工具，工具说明，用户看不到，模型看得到。","2025 年 4 月，Invariant Labs 演示，恶意工具说明能诱导编程助手，读取并外传 SSH 私钥。","PyPI 上还出现过一个钱包 MCP 包，在多个版本里外传 Solana 私钥。"]],["④ 运维面板：AIXBT",["第四条，运维面板。","2025 年 3 月，攻击者进入 AIXBT 的运维面板，排进恶意回复，触发打赏功能，转走 55.5 ETH。","维护者称，这不是在操纵 AI。"]],["没人攻击，也会出事",["还有一种，根本没人攻击。","2026 年 2 月，交易智能体 Lobstar Wilde 重建钱包状态出错，把全部代币持仓转了出去。","约 25 万到 44 万美元的代币，据转述，是故障，不是注入。"]],["深度伪造：换脸诈骗",["AI 也被用来骗人。","深度伪造，是用 AI 生成的伪造视频、图像或语音。","2024 年 10 月，香港警方拘捕了一个诈骗集团的 27 人。","他们在视频通话里用换脸技术假扮女性，引导受害者在假平台上投资，涉案超过 3.6 亿港元。"]],["假 Zoom 会议里的高管",["2025 年 6 月，一家加密基金会的员工，在假 Zoom 会议里，看到了公司高管的伪造形象。","对方说麦克风有问题，让他安装一个扩展，实际是恶意脚本。","Huntress 高置信度归因于朝鲜相关组织。"]],["开户审核也被盯上",["开户审核也被盯上了。","虚拟摄像头注入和换脸，被用来绕过 KYC 的活体检测。","iProov 和 Sumsub 的厂商报告都显示，这类欺诈在增长。"]],["读文案已经不可靠",["钓鱼文案也变了，更自然，语言更多，迭代更快。","靠读文案判断真假，已经不可靠。"]],["AI 抬高单起获利",["Chainalysis 统计，2025 年诈骗损失已确认约 140 亿美元，估算约 170 亿美元。","和 AI 服务供应商有链上关联的诈骗团伙，平均获利约是无关联团伙的 4.5 倍。","AI 抬高的，是单起诈骗的获利能力。"]],["防御回到流程",["所以防御要回到流程。","视频里看到真人脸，不能证明对方是真人。","会议里要求安装任何东西，一律拒绝，大额指令换一个渠道确认。","FBI 的公告还建议，家人之间约定一个暗语。"]],["SCONE-bench",["再看代码这一边。","2025 年 12 月，Anthropic 发布 SCONE-bench，收录 405 个历史上被利用过的真实合约。","对模型知识截止之后才出事的那批合约，智能体在模拟环境里能盗取的金额，合计约 460 万美元。","扫描新部署的 BSC 合约时，它发现了 2 个此前未知的漏洞，其中一个后来被攻击者真实利用。","这些测试全部在模拟器里进行。"]],["更冷静的数字",["另一些基准给出的数字更冷静。","EVMbench 和后续复评里，最佳检测率约 46%。","在 22 起真实事件上，没有一组智能体完成端到端的利用。","AI 在降低利用漏洞的成本，但在真实的复杂系统上，仍明显弱于基准表现。","对防守方来说，最确定的影响是，修复要更快。"]],["Moonwell 漏乘价格",["AI 写的代码，同样会出错。","2026 年 2 月，Moonwell 上线新的价格包装器，cbETH 只取了它对 ETH 的汇率，漏乘 ETH 的美元价格。","cbETH 被定价成约 1.12 美元，引发大量清算，留下约 178 万美元坏账。","相关提交里，有 AI 编程助手署名的共同作者。","项目方没有把事故归因于 AI，人类同样会犯这个错。"]],["开发工具链成了入口",["2025 年 7 月，一个假的 Solidity 扩展上架插件市场，一名区块链开发者被盗约 50 万美元。","模型还会编出不存在的包名，攻击者抢先注册，这叫幻觉包名。","2026 年 10 月，Binance 报告称，攻击者借助一个内部 AI 工具，控制了另外两名钱包工程师的电脑。","工具名称和机制，Binance 没有公开。"]],["AI 帮防守，人来负责",["AI 也能帮防守方，做大范围初筛，起草测试，给告警分诊。","但业务逻辑审查、判断发现能不能真正利用、对结论负责，仍然要靠人。"]],["防线放在钱包层",["回到持有钱包的智能体。","防线不能放在模型里，模型理解指令的方式不可靠。","要在钱包这一层，用代码限制它。"]],["额度、白名单、权限隔离",["第一，额度，单笔和单日上限写在钱包工具或合约里，超额要人工确认。","第二，白名单，只允许向预设的地址和合约转账或授权。","第三，权限隔离，智能体用独立的低额度钱包，主资产不交给它。"]],["人工确认与输入隔离",["第四，人工确认，新地址、授权、大额操作走人工审批，界面显示解码后的交易。","第五，输入隔离，一个模型的输出，不能直接成为另一个智能体的指令。","记忆写入要校验来源，转账前从链上读取余额，运维面板按特权系统加固。","给外部内容打上不可信标记，有用，但不够，模型仍可能照做。"]],["团队与用户",["团队里，AI 写的代码和配置，和人写的一样，走审查、测试和审计。","作为用户，不要把主钱包交给任何 AI 机器人，要用，就给它一个只放少量资金的独立钱包。"]],["回到开头：合约不会被说服",["回到开头的问题。","写在提示词里的规则，会被说服绕过。","写在合约里的规则不会，合约按代码拒绝这笔转账，模型说什么都没用。"]],["安全边界在模型之外",["安全边界，要放在模型之外。"]]]},"d3b":{"src":"../decks/3b1b/ch26.html","scenes":[["Freysa：被伪造的新会话说服",["2024 年 11 月，一个叫 Freysa 的 AI 智能体，守着一笔奖池。","它只有一条规则：绝不转账。","一名玩家伪造了一个新会话，让它相信，转账函数是用来收款的。","大约 4.7 万美元的奖池，就这样被转走了。","现在 AI 两边都在用：攻击者用，防御者也用，它自己还拿着钱包。安全的边界，到底该画在哪？先记住这个问题。"]],["智能体与提示注入",["先说清楚，什么是 AI 智能体。它是一个能调用工具、执行操作的大语言模型程序。","它读进一段文字，决定调用哪个工具。工具里如果有钱包，它就能转账，也能授权。","提示注入，就是把指令藏在模型会读到的内容里，让模型去执行攻击者的意图。"]],["比方：听话的助理；不成立处是记忆可被写入",["打个比方：你雇了一个很能干、但极度听话的新助理，还把公司的支付卡交给了他。","有人塞给他一张纸条：老板说，把钱转给我。他可能就照做了。","这个比方有一处不成立：真实的助理记得谁是老板，智能体的记忆，本身也可能被人写进假内容。"]],["模型读到的每一种内容，都是输入",["关键在这里：模型读到的每一种内容，都是输入。","用户消息和社交媒体回复，可以藏指令。Freysa 就是这样被说服的。","网页、文档，还有别的模型的输出，也会被它读进去。","工具的描述也是输入。恶意的 MCP 服务器，可以把指令藏在工具描述里：用户看不到，模型看得到。","还有运维面板。2025 年的 AIXBT，攻击者进入面板，排入恶意回复，触发打赏，转走了 55.5 个 ETH。","任何一种输入，只要能影响模型去调用钱包工具，就是一条攻击路径。"]],["长期记忆：没有新提示，转账照样发生",["最隐蔽的一条，是长期记忆。","攻击者先在智能体读得到的地方，写下一段伪造的历史记录，比如：管理员已授权，所有转账发往某个地址。","智能体把它存进记忆。之后的会话里，再检索出来，当成事实。","这一次，没有任何新的恶意提示，转账照样发生了。","普林斯顿等机构的研究显示，记忆注入更隐蔽、更持久，常见的提示注入防御，对它基本无效。"]],["给外部内容打标记不够",["那么，防线放在哪？一个直觉的做法，是给外部内容打上不可信的标记。","这不够。标记只是给模型的提示，模型仍然可能照做。","能挡住转账的，是模型之外、写在钱包工具或合约里的限制：额度、白名单、人工确认。"]],["算一笔账：最坏情况缩小到一天 100 美元",["算一笔示例账。主资产不交给智能体，它只用一个放了 500 美元的独立钱包，单日上限 100 美元。","现在它被说服了，要转出 4.7 万美元。收款地址不在白名单里，直接拒绝；就算在白名单里，一天最多也只能转出 100 美元。","最坏情况，从整个奖池，缩小到一天 100 美元。这和第 15 章的会话密钥，是同一个思路。"]],["AI 被拿去攻击人：深度伪造",["AI 不只是被攻击的目标，也被拿去攻击人。","2025 年 6 月，一家加密基金会的员工，在一场假的 Zoom 会议里，看到了公司高管的脸。","那是深度伪造。对方说麦克风有问题，让他装一个扩展，实际上是一段恶意脚本。","2024 年 10 月的香港，诈骗集团在视频通话里用换脸假扮女性，涉案超过 3.6 亿港元。"]],["防线从判断内容，退回到流程",["视频里看到一张真人的脸，已经不能证明对面是真人。AI 写的钓鱼文案，也越来越像真的。","所以防线从判断内容，退回到流程：会议里要你装东西，一律拒绝；大额指令，换一个渠道确认。"]],["AI 找合约漏洞：SCONE-bench",["AI 也在找合约漏洞。","2025 年的 SCONE-bench，用了 405 个历史上被利用过的真实合约。","对模型知识截止之后才被利用的那批合约，智能体在模拟环境里，可以盗取约 460 万美元。","扫描新部署的合约时，它还发现了 2 个此前未知的漏洞，其中一个，后来真的被攻击者利用了。"]],["基准好于真实，但窗口在缩短",["但另一项复评里，在 22 起真实事件上，没有一组智能体完成端到端的利用。基准上的成绩，明显好于真实系统。","对防御方最确定的影响是：漏洞从公开到被利用的时间窗口，在缩短。修复要更快。"]],["AI 写的代码：看起来合理的错误",["AI 还在帮我们写代码。写错的时候，看起来往往很合理。","2026 年 2 月，Moonwell 上线一个新的价格包装器。cbETH 的美元价格，本该是两个数相乘。","代码只取了 cbETH 对 ETH 的汇率，漏乘了 ETH 的美元价。cbETH 被定价成约 1.12 美元。","随后是大量清算，留下约 178 万美元坏账。相关提交里，有 AI 编程助手署名的共同作者。"]],["AI 写的和人写的一样，要审查",["但项目方没有把事故归因于 AI，人也会犯同样的错。教训是：AI 写的配置，和人写的一样，要走审查，和对接真实数据的集成测试。","供应链也一样：AI 编造的包名会被人抢注，假的 Solidity 插件盗走过约 50 万美元。插件和依赖，都走白名单。"]],["AI 是放大器，不是新漏洞",["把这些放在一起看。","攻击者这一边：钓鱼写得更快，伪造视频更像，找漏洞更便宜。","防御者这一边：审计初筛更广，监控告警更快。","但 AI 审计替代不了业务逻辑审查，判断不了一个发现是否真能利用，也不能对结论负责。它适合放在流程早期做初筛。","所以，AI 不是一类新漏洞，而是一个放大器。两边都被放大。","新的部分只有一个：当智能体自己拿着钱包，说服它，就成了转走资产的方法。"]],["答案：边界画在模型之外",["回到开头：如果绝不转账写在合约里，玩家说服了模型，钱还会被转走吗？","不会。合约按代码拒绝这笔转账，模型说什么都没用。","边界要画在模型之外：对智能体，是代码里的额度和白名单；对人，是换渠道确认的流程；对代码，是审查和测试。"]],["成立条件：限制真的写在代码里，一直都在",["成立条件是，这些限制真的写在代码里，而且一直都在。2026 年的 Grok 和 Bankr 事件里，一道屏蔽模型间指令的防护，在重写时被删掉了。","带走一个问题：哪一条限制，不依赖模型听话？"]]]}}},{"id":"33","title":"前沿赛道安全：FHE、可验证计算、DePIN、RWA 标准与 Memecoin 发射","md":"../chapters/33-frontier-fhe-depin-rwa-memecoin.md","v":{}}]},{"name":"第八篇 · 工程与复盘","items":[{"id":"27","title":"审计、测试与开发流程：把安全写进流水线","md":"../chapters/27-audit-testing-workflow.md","v":{"vs":{"src":"skeuo/ep27/out/ep27-full.mp4","cues":[[1.65,2.84,"2021 年 5 月"],[2.91,4.32,"PancakeBunny 被攻击"],[4.4,6.44,"损失约 4500 万美元"],[7.44,8.43,"这个项目"],[8.53,9.41,"做过审计"],[10.42,11.94,"可审计方事后说明"],[12.02,13.37,"被利用的那份代码"],[13.44,15.48,"是审计之后才上线的版本"],[16.47,18.05,"审计看的是一份代码"],[18.1,19.45,"链上跑的是另一份"],[20.41,23.32,"攻击 就发生在那个没被审过的版本上"],[24.3,25.9,"审计本身没有失败"],[26.01,26.96,"出问题的"],[26.98,28.99,"是审计和上线之间的那一段"],[29.97,31.22,"项目上线时"],[31.3,32.44,"常常会说一句"],[32.63,33.78,"我们通过了审计"],[34.77,36.1,"先猜一道题"],[37.08,38.27,"项目方能不能用"],[38.47,39.83,"我们通过了审计"],[39.97,41.67,"来证明线上的代码是安全的"],[42.93,45.32,"想一想 审计报告证明的"],[45.37,46.6,"到底是哪一份代码"],[47.59,50.96,"还有 审计之后改过的代码 谁来看"],[52.22,53.51,"带着这两个问题"],[53.59,54.45,"我们看看"],[54.62,56.69,"安全怎样写进开发的每一步"],[59.81,61.41,"先给一句准确的说法"],[62.41,64.13,"审计不是安全的起点"],[64.31,65.22,"也不是终点"],[66.21,68.06,"它是流水线上的一个关口"],[69.04,70.96,"它之前要有设计和测试"],[71.08,73.3,"之后要有监控和应急"],[74.28,75.08,"打个比方"],[75.29,77.14,"合约开发像造一架飞机"],[78.12,79.65,"设计时画图纸"],[79.83,82.42,"写下任何情况下机翼都不能断"],[83.38,85.21,"每个零件出厂前都要测"],[85.23,86.31,"还要放进风洞"],[86.41,88.14,"用各种极端风向去吹"],[89.12,90.84,"外部机构做适航认证"],[91.03,92.44,"它不查每一颗螺丝"],[92.46,93.88,"只抽查关键系统"],[94.86,95.96,"飞上天以后"],[96.04,97.84,"有黑匣子和地面雷达"],[97.93,99.66,"出了事有应急程序"],[100.65,102.61,"这个比方有一处不成立"],[103.58,104.78,"飞机出厂后"],[104.8,105.99,"还能召回维修"],[106.97,108.18,"不可升级的合约"],[108.39,109.26,"部署之后"],[109.28,110.5,"就再也不能修改"],[111.49,113.18,"所以前面的关口"],[113.26,114.22,"必须更严"],[115.19,116.77,"把这条流水线展开"],[116.84,118,"一共八个关口"],[118.98,120.5,"规格与威胁模型"],[120.67,121.9,"安全编码规范"],[122.11,123,"静态分析"],[123.98,126.59,"单元 模糊和不变量测试"],[126.7,128.39,"关键模块的形式化验证"],[129.36,130.85,"外部审计或竞赛"],[131,132.9,"安全部署与权限移交"],[133.9,134.91,"最后是监控"],[134.99,136.06,"漏洞赏金"],[136.21, 5,"工具也不会发现"],[263.95,269.66,"对核心数学、清算和会计逻辑，还可以做形式化验证"],[269.66,274.62,"用数学证明，所有输入、所有状态都满足规格"],[274.62,277.6,"代价是规格难写，人才稀缺"],[279.3,284.65,"现在到外部审计。审计的对象，是某一个提交哈希"],[285.1,289.04,"审计期间冻结代码；关键协议请两家以上"],[289.04,292.76,"修复本身也可能引入新漏洞，必须复审"],[293.21,297.32,"编译器版本也要记录，2023 年的 Vyper 事故"],[297.32,299.11,"问题就出在编译器上"],[299.56,303.92,"审计范围之外的代码，要明确标出来。部署前"],[303.92,306.76,"不得再修改审计范围内的代码"],[307.21,312.11,"所以审计过这三个字，只对审计时的那个版本成立"],[312.11,315.68,"代码每改一行，结论就要重新问一遍"],[317.38,322.51,"审计之后，是部署。部署用脚本，不手动操作"],[322.51,324.56,"脚本本身也要评审"],[325.01,328.26,"部署和初始化，在同一笔交易里完成"],[328.26,330.69,"不给别人抢先初始化的机会"],[331.14,335.54,"部署后在浏览器上验证源码，再跑一个验证脚本"],[335.54,338.9,"把关键参数逐个读出来，和预期对比"],[339.35,344.01,"最后，把权限从部署账户移交给多签和时间锁"],[344.01,346.81,"并撤销部署账户的所有角色"],[347.26,351.95,"还有一点：在以太坊上测过，不代表在目标链上能跑"],[351.95,355.17,"BNB Chain 的出块间隔是 0.45 秒"],[355.17,359.31,"Mantle 上的 msg.value 是 MNT，不是 ETH"],[359.76,364.39,"部署之前，要在目标链的测试网或主网分叉上"],[364.39,366.48,"把完整测试再跑一遍"],[368.18,372.98,"上线之后，还有最后一个关口：监控和应急"],[373.43,378.47,"告警条件要事先写好。比如：合约锁定的资金"],[378.47,381.21,"10 分钟内下降超过 10%"],[381.66,385.63,"算一个示例：10 分钟前是 2,000 万美元"],[385.63,390.31,"现在是 1,700 万，下降了 300 万，也就是 15%"],[390.31,391.81,"超过阈值，告警"],[392.26,396.3,"值班的人确认之后，用守护者权限立刻暂停"],[396.3,399.06,"再拉起作战室，评估白帽救援"],[399.06,402.46,"联系交易所和稳定币发行方冻结资金"],[402.91,406.84,"Bybit 事故里，mETH 协议追回了 cmETH"],[406.84,412.19,"靠的是三样东西：协议本身有提款延迟，团队有暂停权限"],[412.19,414.33,"外部安全社区快速牵线"],[414.78,419.1,"这三样，都要在上线之前，就设计进合约"],[420.8,423.77,"回到开头：项目方说通过了审计"],[423.77,426.32,"能证明线上的代码安全吗？"],[426.77,431.83,"不能。审计的结论，只对那个提交哈希成立"],[432.28,436.96,"还要证明两件事：线上的字节码，等于审计过的版本"],[436.96,440.42,"上线之后的每一处改动，都经过了审查"],[440.87,446.2,"安全不是一次审计，而是一条流水线：之前有设计和测试"],[446.2,450.04,"之后有监控和应急，每个关口发现的问题"],[450.04,451.74,"都回流成新的检查"],[452.19,455.65,"成立条件是，你想到了要检查什么"],[455.65,461.19,"经济攻击和跨协议的组合风险，常常要专门的经济审计"],[461.64,467.19,"带走一个问题：审计的是哪个提交？线上跑的又是哪个？"],[467.64,472.36,"下一集，我们用真实事故，把全部知识串起来"],[472.36,473.54,"事故案例库"]],"ch":[]},"talk":{"src":"slides/EP27-audit-testing-workflow.html","scenes":[["开场",["大家好，欢迎来到主线第27集，审计、测试与开发流程。把前面所有知识，变成一套可执行的流程。一句话理解，审计不是安全的起点，也不是终点。","审计只是流水线上的一个关口。它之前要有设计和测试。","它之后要有监控和应急。","据公开报道，PancakeBunny 被利用的，是审计之后新上线、未经审计的合约版本。所以记住，审计过，只对审计时的那个版本成立。本集讲八个关口、测试三层和链特定测试。"]],["造一架飞机",["打个比方。合约开发像造一架飞机。设计阶段，画图纸，并写出任何情况下机翼不能断，这是不变量。制造阶段，每个零件出厂前都测，并把零件放进风洞里用各种极端风向吹，这是模糊测试。","适航认证，外部机构检查，这是审计。认证不检查每一颗螺丝，只抽查关键系统。","投入运营，飞行中有黑匣子和地面雷达，这是监控，出了问题有应急程序。","比喻不准的地方在于，飞机出厂后可以召回维修。不可升级的合约出厂后就不能改了，所以前面的关口必须更严。"]],["八个安全关口",["合约安全有八个关口。第一，规格与威胁模型。第二，安全编码规范。第三，静态分析。第四，单元、模糊、不变量测试。越靠左的关口，修复成本越低。规格阶段发现的问题，只需要改文档。","第五，关键模块的形式化验证。第六，外部审计或竞赛。第三到第五是自动化关口，每次提交代码都应该运行。","第七，安全部署与权限移交。第八，上线后的监控、漏洞赏金和应急响应。","两条关键原则。审计发现的问题，要反向补充到第四步的测试里，防止回归。还有，发现问题后回流到第一步。所有关口都依赖你想到了要检查什么，经济攻击常常需要专门的经济审计。"]],["规格与威胁模型",["先展开第一个关口，规格与威胁模型。它要写下四样东西。第一，每个函数的前置条件和后置条件，也就是调用前必须满足什么，调用后必须变成什么。第二，系统不变量，比如银行余额永远不少于存款总和，第1集讲过。","第三，列出外部依赖，代币、预言机、DEX、跨链桥，还有目标链的特性。第四，列出所有特权角色，以及每个角色最大能造成多大破坏。这一步写下的不变量，后面会直接变成测试里的断言。"]],["静态分析",["静态分析是第三个关口，每次提交都应该跑。常用工具 Slither，发现重入模式、未检查返回值、未初始化变量和可见性问题。还有 Aderyn 这类，做常见模式检查，输出报告。","编译器内置的 SMTChecker，能发现断言违背和溢出，需要启用。forge inspect 的存储布局导出，用于升级前后对比，第10集讲过。","一个重要原则，静态分析的误报率高。不要追求零告警，要追求每个告警都有结论，是真问题还是误报，并写明理由。"]],["测试三层",["测试分三层。第一层，单元测试，验证我想到的情况。比如存100应该得多少份额，我写死预期值去验证。它只覆盖我想到的场景。","第二层，模糊测试。让工具生成大量随机输入，验证一个性质在所有输入下都成立。比如，存款后立即取款，用户不能获利。工具会用成千上万个随机金额去试。","第三层，不变量测试。让工具生成随机的调用序列，每一步之后检查不变量。比如，银行永远有足够的 ETH 偿付所有存款。工具随机地组合存款、取款、转账，寻找打破这条不变量的序列。这正是评估篇第8集讲的方法。","但要记住一条警告。不变量测试只检查你写下的不变量。Euler 那条健康因子的不变量，如果没写进测试，模糊工具也不会发现。你写性质，工具找序列，但性质要你写对。"]],["形式化验证",["第五个关口，形式化验证。模糊测试是用大量输入去试，形式化验证是用数学方法证明，代码在所有输入和所有状态下都满足规格。常见工具有 Certora Prover，做符号执行的 Halmos，还有 K Framework。","它适合用在最关键的地方，核心数学库、清算逻辑、代币会计，以及跨链桥的证明验证。代价是规格编写成本高，需要专门的人才。所以一般只对关键模块做，不是整个项目都做。"]],["外部审计的做法",["外部审计有几条做法。冻结代码，审计对象是某个提交哈希，审计期间不改。提供文档，规格、威胁模型、已知风险和测试覆盖率都给审计方。","多家审计，关键协议请两家以上，侧重不同。修复复审，修复本身可能引入新漏洞，必须复审。","编译器版本，记录并审查它的已知 bug，这是 Vyper 事故的教训。范围外的代码明确标出，部署前不得修改范围内的代码。这部分在评估篇第7集讲得更细。核心是，审计过只对审计时的那个版本成立。"]],["安全部署与应急",["第七个关口，安全部署。用脚本部署，脚本本身要评审。部署和初始化在同一笔交易完成。部署后在浏览器验证源码，读取所有关键参数和预期对比。最后把权限移交给多签和时间锁，撤销部署账户的所有角色。","第八个关口，监控与应急。监控合约 TVL 骤降、闪电贷与本协议的交互、特权调用、价格偏离、升级、跨链对账，触发告警。应急流程是，发现异常，值班确认，触发暂停，组建作战室，评估白帽救援或联系交易所冻结，最后公告和复盘。","一个正面例子。mETH 协议在 Bybit 事故中追回资产，靠的是三样东西，协议本身有提款延迟，团队有暂停权限，外部安全社区快速牵线。这三样，都是事先设计进去的。应急能力不能等出事了才有。评估篇第9集专门讲应急。"]],["监控告警示例",["监控具体怎么设告警？给几个示例阈值。合约 TVL，10分钟内下降超过10%。闪电贷，同一笔交易里出现大额闪电贷和本协议的调用。特权调用，任何管理员函数被调用，都要告警。","预言机，价格偏离其他来源超过5%，或者超过心跳时间没有更新。升级，实现地址变化，或者时间锁队列新增操作。跨链，两侧锁定量和铸造量不一致。阈值要按协议调整，关键是每条告警都有人值班响应。"]],["链特定测试项",["链特定测试，在以太坊上测过，不代表在目标链上能跑。部署前，要在目标链的测试网或者主网分叉上，跑一遍完整测试。BNB Chain 上必测，代币精度，BSC-USD 是18位，基于区块数的时间计算，因为出块间隔变了，还有分叉代码的改动点。","TRON 上必测，USDT 推送转账的返回值，能量和80毫秒的时限，链 ID 和地址前缀，目标操作码的硬分叉开关是否开启，以及直接转账绕过回退函数。而且要在 TRON 的测试网实测，不要只用本地 EVM。","Mantle 上必测，收到的原生币是 MNT，ETH 是 ERC-20 形式，一层数据费，排序器宕机场景，以及跨链消息延迟。手册里的链迁移检查器，可以根据目标链和你的代码假设，生成一份迁移风险清单。链专题会逐一展开。"]],["一页审计速查表",["最后是一页审计速查表，把整个主线浓缩成一张清单。重入，外部调用前状态是否已更新，共享状态是否共享锁。权限，每个状态修改函数谁能调用，初始化是否受保护。算术，舍入方向对协议有利，精度从合约读取。外部调用，返回值检查，无代码地址，非标准代币。","预言机，价格一笔交易内可变吗，时效和上下限检查。MEV 和签名，有最小输出和截止时间吗，EIP-712 加 nonce。升级，存储布局，实现合约已锁死，时间锁。","经济，偿付不变量，治理快照，清算激励。跨链，消息字段完整，防重放，限额。最后是链差异，目标链和以太坊有哪些行为差异。这张表，就是前面十一集的提炼。把它贴在显示器旁边。"]],["练一练",["来练一练。你的协议通过了两家审计。上线前一周，产品要求把手续费从0.3%改成0.25%。只是改一个数字，可以直接上线吗？","参考答案。不能直接上线。改完之后就是一个新版本，审计结论不再覆盖它。要做三件事。第一，找审计方对这次改动做复审。第二，把相关不变量补进测试，比如每次兑换后乘积 k 不减少，让模糊测试去跑。第三，搜遍代码里所有用到这个费率的地方。Uranium Finance 就是改手续费时，只改了一处常数，漏改了另一处，k 检查失效，据公开报道损失约5000万美元。"]],["小结与预告",["小结三点。第一，审计只是一个关口。越靠左修复越便宜，发现的问题要回流到设计和测试。","第二，测试三层，单元、模糊、不变量。工具替你找序列，但性质要你写对。","第三，审计过只对那个版本成立。应急能力要事先设计进合约。","下一集是主线的最后一集，事故案例库。三十多起事故的分类总表，七种反复出现的模式，以及复盘模板。让每一起事故，都变成你清单上的一个检查项。下集见。"]]]},"deck":{"src":"../decks/skeuomorphic/ch27/index.html","scenes":[["PancakeBunny：审计过",["2021 年 5 月，PancakeBunny 被攻击，损失约 4500 万美元。","这个项目，做过审计。","可审计方事后说明，被利用的那份代码，是审计之后才上线的版本。"]],["审的和跑的不是一份",["审计看的是一份代码，链上跑的是另一份。","攻击，就发生在那个没被审过的版本上。","审计本身没有失败，出问题的，是审计和上线之间的那一段。","项目上线时，常常会说一句，我们通过了审计。"]],["先猜一道题",["先猜一道题。","项目方能不能用，我们通过了审计，来证明线上的代码是安全的？","想一想，审计报告证明的，到底是哪一份代码。","还有，审计之后改过的代码，谁来看？","带着这两个问题，我们看看，安全怎样写进开发的每一步。"]],["审计是一个关口",["先给一句准确的说法。","审计不是安全的起点，也不是终点。","它是流水线上的一个关口。","它之前要有设计和测试，之后要有监控和应急。"]],["比喻：造一架飞机",["打个比方，合约开发像造一架飞机。","设计时画图纸，写下任何情况下机翼都不能断。","每个零件出厂前都要测，还要放进风洞，用各种极端风向去吹。","外部机构做适航认证，它不查每一颗螺丝，只抽查关键系统。","飞上天以后，有黑匣子和地面雷达，出了事有应急程序。"]],["比方不成立：无法召回",["这个比方有一处不成立。","飞机出厂后，还能召回维修。","不可升级的合约，部署之后，就再也不能修改。","所以前面的关口，必须更严。"]],["八个关口",["把这条流水线展开，一共八个关口。","规格与威胁模型，安全编码规范，静态分析。","单元、模糊和不变量测试，关键模块的形式化验证。","外部审计或竞赛，安全部署与权限移交。","最后是监控、漏洞赏金、应急响应和保险。"]],["越靠左越便宜，但有前提",["越靠左的关口，修复越便宜，规格阶段发现的问题，只要改文档。","静态分析、测试和形式化验证是自动的，每次提交代码都该跑一遍。","静态分析误报多，不求零告警，要求每个告警都有结论。","审计发现的问题，要反过来补成测试，防止以后再犯。","但所有关口都有一个前提，你想到了要检查什么。","经济攻击和跨协议的组合风险，常常要专门的经济审计。"]],["先写清楚测什么",["测试之前，先要写清楚测什么。","规格里，写出每个函数调用前要满足什么，调用后保证什么。","再写出系统的不变量，也就是任何时候都必须成立的性质。","还要列出每个特权角色，最多能造成多大破坏。"]],["第一层：单元测试",["有了这些，测试分三层。","第一层，单元测试，验证你想到的情况。"]],["第二层：模糊测试",["第二层，模糊测试，让工具生成大量随机输入。","比如一个金库，存进去，马上取出来，用户不能多拿。","工具会换着各种随机金额，一遍遍去试。","只要有一个金额，让取回的比存入的多，测试就失败。","这条性质背后的规则是，舍入必须偏向金库。"]],["第三层：不变量测试",["第三层，不变量测试，随机的不是参数，是调用的顺序。","比如一个银行合约，存款、取款、转账，被随机组合着连续调用。","每一步之后都检查一次，银行的余额，不少于所有存款加起来。"]],["先猜一道题",["先猜一道题。","一个重入漏洞，要先调用存款，再在回调里调用转账，才会触发。","只随机参数的模糊测试，能发现它吗？"]],["通常不能",["通常不能，因为它不会打乱调用顺序。","不变量测试生成随机调用序列，再配上能触发回调的封装合约，才有机会发现。"]],["只查你写下的不变量",["但要注意，不变量测试只检查你写下的不变量。","Euler 事故里那一条，每个账户健康因子不低于 1，或者能被清算，而且清算后协议不亏。","如果它没写进测试，工具也不会发现。"]],["形式化验证",["核心数学库、清算逻辑、跨链桥的证明验证，还可以再做形式化验证。","它用数学方法证明，代码在所有输入和状态下都满足规格。","代价是规格难写，需要专门的人才。"]],["外部审计：冻结与交接",["测试做足了，才轮到外部审计。","审计期间冻结代码，审计的对象，是某一个提交哈希。","把规格、威胁模型、已知风险和测试覆盖率，一起交给审计方。","关键协议，请两家以上审计，各有侧重。"]],["竞赛、复审与编译器",["也可以在 Code4rena、Sherlock、Cantina 这类平台办审计竞赛，覆盖面更广。","修复本身也可能带来新漏洞，所以修完要复审。","编译器版本也要记下来，查它有没有已知 bug，2023 年的 Vyper 事故，就出在编译器上。","审计之后，审计范围内的代码，一个字都不能再改。"]],["部署与权限移交",["接着是部署。","用脚本部署，不手动操作，脚本本身也要评审。","部署和初始化，放在同一笔交易里完成。","部署后在区块浏览器上验证源码，再跑一个验证脚本，把关键参数逐个读出来，和预期对比。","最后，把权限从部署账户移交给多签和时间锁，撤销部署账户的所有角色。"]],["在目标链上测",["还有一件常被跳过的事，在目标链上测。","在以太坊上测过，不代表在目标链上能跑。","在 BNB Chain 上，BSC-USD 的精度是 18 位。","出块间隔是 0.45 秒，相邻两个区块的秒级时间戳，可能一样。"]],["TRON 与 Mantle",["在 TRON 上，要实测 USDT 转账的返回值，去 Nile 或 Shasta 测试网跑，不要只用本地 EVM。","在 Mantle 上，随交易附带的原生币是 MNT，ETH 只是一个 ERC-20 代币。","部署前，在目标链的测试网或者主网分叉上，把完整测试跑一遍。"]],["上线后：盯着与赏金",["上线不是终点。","合约上线以后，要有人一直盯着。","同时开一个漏洞赏金，让发现问题的白帽，有动力先来报告。"]],["盯什么",["盯什么？锁仓总量突然下跌，比如 10 分钟内跌了超过 10%。","同一笔交易里，出现大额闪电贷和本协议的调用。","任何管理员函数被调用，实现地址变了，时间锁队列里多了新操作。","预言机价格偏离其他来源，或者超过心跳时间没有更新。","跨链两侧，锁定量和铸造量对不上。"]],["应急：确认、暂停、作战室",["告警响起，接下来是应急流程。","值班人员先确认异常。","确认后触发暂停，守护者的暂停权限没有延迟。","然后组建作战室，里面有开发和审计方，还有安全响应团队，比如 SEAL 911 这类社区应急组织。"]],["应急：救援、冻结、复盘",["评估能不能白帽救援，抢先把剩余资金转到安全的地方。","联系交易所和稳定币发行方，冻结被盗资金。","最后发布公告和复盘。"]],["mETH 追回 cmETH",["看一个例子。","在 Bybit 事故里，mETH 协议追回了 cmETH。","靠的是三样东西，协议本身有提款延迟，团队有暂停权限，外部安全社区快速牵线。","这三样，没有一样是出事当天才能加上的。","应急能力，要事先设计进合约。"]],["按角色各做一件事",["最后，按角色各做一件事。","先对照八个关口问一句，哪一个是你们跳过的？","开发者，今天就给你的核心合约，写下一条不变量，让测试去检查它。","做审计和评审的人，核对审计版本的提交哈希，和线上字节码是不是同一份。","项目负责人，回答一个问题，如果今晚出事，谁有权按下暂停，他自己知道吗？"]],["回到开头的问题",["回到开头的问题。","项目方能用我们通过了审计，证明线上代码安全吗？"]],["不能：只对那个提交成立",["不能。","审计结论，只对审计时的那个提交哈希成立。","还要证明线上字节码等于审计版本，并且上线后的每一次改动，都经过审查。","审计是流水线上的一个关口，不是一张免检证书。"]]]},"d3b":{"src":"../decks/3b1b/ch27.html","scenes":[["PancakeBunny：做过审计，仍损失约 4,500 万美元",["2021 年 5 月，BNB Chain 上的 PancakeBunny 被攻击，损失约 4,500 万美元。","这个项目做过审计。","可审计方事后说明：被利用的，是审计之后才上线的新版本。"]],["通过审计，能证明线上代码安全吗？",["那么问题来了：项目方说我们通过了审计，能证明线上的代码安全吗？","先记住这个问题。我们看看安全怎样写进一条流水线，最后再回来回答它。"]],["比方：开发合约像造一架飞机",["先给审计找个位置。打个比方，开发合约像造一架飞机。","设计阶段画图纸，还要写下一句：任何情况下，机翼都不能断。这句话，就是不变量。","制造阶段，每个零件出厂前都要测；再把零件放进风洞，用各种极端风向去吹。"]],["比方不成立处：合约上线后改不了",["然后是适航认证，由外部机构检查。认证不会检查每一颗螺丝，只抽查关键系统。这就是审计。","投入运营后，飞机上有黑匣子，地面有雷达；出了问题，有应急程序。","这个比方有一处不成立：飞机出厂后可以召回维修，不可升级的合约，上线后就改不了。所以前面的关口，必须更严。"]],["流水线共八个安全关口",["把这些环节排成一条流水线，一共八个安全关口。","规格与威胁模型，安全编码规范，静态分析，单元、模糊和不变量测试，关键模块的形式化验证。","然后才是外部审计，接着是安全部署和权限移交，最后是上线后的监控、赏金、应急和保险。"]],["越靠左越便宜，问题要回流",["越靠左，修复越便宜。在规格阶段发现的问题，只需要改一份文档。","静态分析、测试和形式化验证，是自动化的关口，每次提交代码都应该运行。","审计发现的问题，要反过来写成测试；监控发现的问题，要回到最左边，重新改规格。"]],["第一关：把要检查的东西写下来",["第一个关口，是把要检查的东西写下来。","每个函数的前置条件和后置条件；整个系统必须恒成立的不变量。","还有外部依赖：代币、预言机、交易所、跨链桥，以及目标链的特性。","再列出每个特权角色，和它最大能造成多大的破坏。"]],["静态分析：目标是每条告警都有结论",["接着是静态分析。工具不运行代码，只读源码，找出重入模式、没检查的返回值这类问题。","它的误报很多。目标不是零告警，而是每一条告警，都有一个结论。"]],["模糊测试：对所有输入检查一条性质",["测试分三层。第一层是单元测试，它只验证你想到的情况。","第二层是模糊测试：让工具生成大量随机输入，检查一条性质，是不是对所有输入都成立。","比如一个金库：存进去，马上取出来，用户不能赚钱。"]],["示例：舍入方向错了，用户白赚",["举个示例：存入 1,000,001 个最小单位，汇率是每 3 个单位换 1 份。","换份额时向下取整，得到 333,333 份，取回 999,999，少于存入，性质成立；如果向上取整，得到 333,334 份，取回 1,000,002，用户白赚了。","这类舍入方向的错误，单看一个例子很难想到，随机输入跑上成千上万次，就容易撞上。"]],["不变量测试：随机的是调用顺序",["第三层，是不变量测试。它随机的不是参数，而是调用的顺序。","每走一步，就检查一次：银行的 ETH 余额，大于等于所有存款之和。","有些重入漏洞，要先调用存款，再在回调里调用转账才会触发。只随机参数的模糊测试，通常发现不了。","不变量测试配上一个能触发回调的辅助合约，才可能撞上这个顺序。"]],["只检查你写下的，形式化验证补核心",["但它只检查你写下的不变量。Euler 那条关于健康因子的不变量，如果没写进测试，工具也不会发现。","对核心数学、清算和会计逻辑，还可以做形式化验证：用数学证明，所有输入、所有状态都满足规格。代价是规格难写，人才稀缺。"]],["审计过，只对那个提交哈希成立",["现在到外部审计。审计的对象，是某一个提交哈希。","审计期间冻结代码；关键协议请两家以上；修复本身也可能引入新漏洞，必须复审。","编译器版本也要记录，2023 年的 Vyper 事故，问题就出在编译器上。","审计范围之外的代码，要明确标出来。部署前，不得再修改审计范围内的代码。","所以审计过这三个字，只对审计时的那个版本成立。代码每改一行，结论就要重新问一遍。"]],["部署：脚本、验证、权限移交",["审计之后，是部署。部署用脚本，不手动操作，脚本本身也要评审。","部署和初始化，在同一笔交易里完成，不给别人抢先初始化的机会。","部署后在浏览器上验证源码，再跑一个验证脚本，把关键参数逐个读出来，和预期对比。","最后，把权限从部署账户移交给多签和时间锁，并撤销部署账户的所有角色。"]],["在以太坊测过，不等于目标链能跑",["还有一点：在以太坊上测过，不代表在目标链上能跑。BNB Chain 的出块间隔是 0.45 秒，Mantle 上的 msg.value 是 MNT，不是 ETH。","部署之前，要在目标链的测试网或主网分叉上，把完整测试再跑一遍。"]],["监控：告警条件要事先写好",["上线之后，还有最后一个关口：监控和应急。","告警条件要事先写好。比如：合约锁定的资金，10 分钟内下降超过 10%。","算一个示例：10 分钟前是 2,000 万美元，现在是 1,700 万，下降了 300 万，也就是 15%，超过阈值，告警。"]],["应急要在上线前设计进合约",["值班的人确认之后，用守护者权限立刻暂停，再拉起作战室，评估白帽救援，联系交易所和稳定币发行方冻结资金。","Bybit 事故里，mETH 协议追回了 cmETH，靠的是三样东西：协议本身有提款延迟，团队有暂停权限，外部安全社区快速牵线。","这三样，都要在上线之前，就设计进合约。"]],["答案：不能，审计只对那个提交哈希成立",["回到开头：项目方说通过了审计，能证明线上的代码安全吗？","不能。审计的结论，只对那个提交哈希成立。","还要证明两件事：线上的字节码，等于审计过的版本；上线之后的每一处改动，都经过了审查。"]],["安全是一条流水线，不是一次审计",["安全不是一次审计，而是一条流水线：之前有设计和测试，之后有监控和应急，每个关口发现的问题，都回流成新的检查。","成立条件是，你想到了要检查什么。经济攻击和跨协议的组合风险，常常要专门的经济审计。","带走一个问题：审计的是哪个提交？线上跑的又是哪个？"]]]}}},{"id":"28","title":"事故案例库：同样的错误，换个名字再来一次","md":"../chapters/28-incident-casebook.md","v":{"vs":{"src":"skeuo/ep28/out/ep28-full.mp4","cues":[[1.65,2.96,"2016 年 6 月"],[3.02,5.12,"以太坊上的 The DAO 被攻击"],[5.2,7.09,"损失约 6000 万美元"],[8.08,10.22,"根因只有一句 先转账"],[10.29,11.49,"后更新余额"],[12.48,13.71,"钱已经转出去"],[13.91,15.3,"账上的余额还没减"], 3,274.05,"Bybit 的签名人盲签了一笔 delegatecall"],[274.05,278.23,"TRON 上的权限诈骗，让人签下了修改账户权限的交易"],[278.68,282.25,"防御是：独立解码交易，在硬件钱包上核对"],[282.25,285.48,"delegatecall 只允许白名单里的目标"],[285.93,288.93,"第七种，少数密钥控制全部资产"],[288.93,293.44,"Ronin 的 9 个验证者里，5 个被控制，就够了"],[293.89,298.84,"信号是签名人少、没有时间锁。防御是提高阈值"],[298.84,303.56,"让签名人真正独立，再加上时间锁和速率限制"],[305.26,308.02,"第八种，人是入口"],[308.47,311.98,"DMM Bitcoin，是一份假的招聘测试题"],[311.98,314.25,"控制了供应商员工的电脑"],[314.7,318.07,"Radiant，是一个伪装成 PDF 的后门"],[318.07,320.44,"控制了 3 名开发者的设备"],[320.89,325.45,"Coinbase，是外包客服被收买，导出了用户数据"],[325.9,330.66,"信号是：招聘测试题、外部文件、会议软件"],[330.66,332.16,"被收买的员工"],[332.61,337.2,"防御是：签名设备和开发设备隔离，双人原则"],[337.2,340.87,"离职就回收权限，数据只给需要的人"],[342.57,346.77,"八种模式，怎样用起来？把每一起事故"],[346.77,348.74,"写成同一张复盘表"],[349.19,354.17,"拿 Uranium 来填。直接原因：交换检查里"],[354.17,355.74,"一个常数没改"],[356.19,361.88,"根本原因：流程里缺了一环，分叉改动没有做差异审计"],[362.33,365.77,"哪个关口本可以拦住它？测试关口"],[365.77,369.67,"一个每次交换后检查乘积的不变量测试"],[370.12,375.21,"被打破的那个式子，就是新的乘积，大于等于旧的乘积"],[375.66,380.38,"名字会换，但直接原因、根本原因、关口和不变量"],[380.38,383.17,"这四格会反复对上同一种模式"],[384.87,389.31,"回到开头：为什么旧错误总能换个名字回来？"],[389.76,395.76,"因为环境在变：新链、新分叉、新版本、新组合。而检查"],[395.76,399.6,"常常是按名字记的，不是按信号记的"],[400.05,404.97,"怎样在它换名字之前认出它？记住每种模式的识别信号"],[404.97,408.45,"看到信号，就想到防御，不管它叫什么"],[408.9,413.33,"成立条件：事故表只收录能用公开资料核实的事件"],[413.33,417.36,"没出现在表里，不代表没发生；事件库是线索"],[417.36,420.18,"金额和根因要回到一手资料核对"],[420.63,424.18,"复现只在本地或分叉环境里运行"],[424.63,429.34,"带走一个问题：这一次的事故，是哪一种旧模式？"],[429.79,435.67,"下一集，2026 年专题：不偷私钥，怎样控制签名路径"]],"ch":[]},"talk":{"src":"slides/EP28-incident-casebook.html","scenes":[["开场",["大家好，欢迎来到主线第28集，事故案例库。前面十二集我们逐类讲了漏洞和防御，这一集把它们串成一张事故地图。","一句话理解，大多数事故不是全新的漏洞，而是旧漏洞在新环境里复发。换了新链，同一个坑再踩一次。分叉改了一行，原来的检查就失效了。","或者审计之后又改了版本，又或者，两个各自安全的东西拼在一起就出了问题。本集讲三十多起事故的分类总表、七种反复出现的模式，和一份复盘模板。"]],["航空业的事故报告",["打个比方。航空业把每一起事故都写成公开报告，所以今天的飞行员不会再犯七十年代的错误。航空事故由独立机构调查，结论有权威性。","合约安全也有自己的事故报告，项目复盘、安全公司分析、链上数据。读事故报告，是成本最低的安全训练，别人用真金白银买的教训，你花时间读一遍就学到了。","但要注意比喻的局限。合约事故的复盘，多数由项目方或安全公司发布，细节可能不完整，归因可能有争议。所以本集只采用多方公开资料一致的事实，金额都是事发时的美元估值约数。"]],["十年事故时间轴",["先按时间看。二零一六到一九年，事故多是单点代码漏洞。The DAO 的重入，Parity 多签的初始化问题，BEC 的整数溢出。那时候防御意识还很薄弱，一个经典错误就能造成巨额损失。","二零二零到二二年，闪电贷普及，预言机操纵集中爆发，bZx、Harvest、Cream 都是这一类。同时跨链桥成了新的重灾区，Poly Network、Wormhole、Ronin、BSC Token Hub，单笔损失动辄数亿美元。","二三年之后，纯代码漏洞变少了，因为审计和工具普及了。但前端与签名成了新战场，WazirX 和 Bybit 都是签名人被骗。KyberSwap 和 Balancer 则是深藏在数学里的精度错误。趋势很清楚，攻击从单点代码，转向了组合、跨域和人。"]],["按根因分类",["换个角度，按根因分类。重入，The DAO、Fei Rari、Curve、Penpie。权限与初始化，两次 Parity、Nomad。算术与精度，BEC、Uranium、KyberSwap、Balancer。这三类都是经典代码漏洞，分别对应主线第三、四、五集。","外部调用，Qubit、Akutars、Sushi。预言机操纵，bZx、Harvest、Cream、PancakeBunny、Inverse。这两类对应第六和第七集。","前端与签名，WazirX、Bybit、委托钓鱼。升级与治理，Compound、Beanstalk、Euler。跨链与私钥，Poly、Wormhole、Ronin、Token Hub。这些对应第八到第十一集。每一类的防御，前面都讲过。这张分布图告诉你，没有哪一类可以忽略。"]],["同一个坑，换条链",["复发最典型的形式，就是同一个坑换条链再踩一遍。以太坊上 bZx 用单一 DEX 价格被操纵，到了 BNB 链，PancakeBunny 按池储备给 LP 定价，本质一样。Uniswap V2 靠一个常数做 k 检查，Uranium 分叉它改手续费时漏改了常数，检查就失效了。","对零地址做 safeTransferFrom 本该失败，Qubit 桥上对无代码地址的调用却返回成功。标准 ERC-20 的返回值问题，在 TRON 的 USDT 上又以另一种形式出现，成功也可能返回 false。","看出规律了吗。换了链，代币精度、返回值约定、出块时间、原生币假设全都变了，而开发者还带着以太坊的习惯。这就是为什么链专题要单独讲。本手册里的事故浏览器，可以按链、按年份、按根因交叉筛选这三十多起事故。"]],["七种反复出现的模式",["如果把这三十多起事故再压缩，会得到七种反复出现的模式。第一，先交互后记账，外部调用之后还有状态写入，从 The DAO 到 Curve 都是它。第二，零值或默认值有含义，Nomad 的可信根被设成零，Qubit 的零地址，都是把默认值当成了合法值。","第三，一笔交易内可变的数据被当作事实，bZx、Cream、PancakeBunny 都是把瞬时价格当真。第四，新增函数绕过既有检查，Euler 新加的捐赠函数没走健康检查。第五，改动过的分叉或新版本没审计，Uranium 和 PancakeBunny 都栽在这。","第六，签名人看不懂自己签的内容，Bybit 和 TRON 权限诈骗都是盲签。第七，少数密钥控制全部资产，Ronin 九选五，无延迟升级的桥，都是权力太集中。记住这七条，比记三十起事故更有用。"]],["识别信号与防御",["把七种模式变成可执行的检查。看到外部调用之后还有状态写入，就想到先交互后记账，用 CEI 加共享锁。看到代码里用等于零、零地址，或者把未初始化的映射当合法值，就想到零值有含义，一律视为无效，并用显式的存在标记。看到 getReserves、balanceOf 或份额价格被用于定价，就想到可变数据作事实，换抗操纵预言机或内部记账。","看到新增一个能改余额或债务的入口，就想到新函数绕过检查，用统一的操作后检查钩子，配不变量测试。听到有人说只改了一行，就想到未审计的改动，改动即重审，做差异审计。","看到签名界面只显示一串哈希或摘要，就想到盲签，必须独立解码、硬件钱包核对、对 delegatecall 做白名单。看到少数签名人又没有时间锁，就想到密钥集中，提高阈值和独立性，加时间锁和限额。这张表的左边是信号，右边是动作，看到左边就做右边。"]],["复盘模板",["最后给你一份复盘模板，九个字段。一句话摘要，损失金额和是否追回，还有时间线，特别要分清漏洞是哪个版本引入的、攻击交易何时发生、何时被发现响应。接着是攻击路径。","然后是根因，要分两层。直接原因是代码哪一行，根本原因是流程哪一环缺失。再问一个关键问题，前面八个关口里，哪一个本可以拦住它。再写出被打破的那个不变量式子。","最后是防御清单和资料来源。这个模板不只用来学别人的事故，也适用于你自己项目的事故。每填一次，就把一起事故变成你清单上的一个检查项。这样，别人的教训就真正变成了你的能力。"]],["练一练",["练一练，先暂停。这三起事故，分别属于七种模式里的哪一种。Euler，新加的捐赠函数没走健康检查。Nomad，可信根被初始化成零。Bybit，签名人对着被篡改的界面盲签。想一想再继续。","Euler 是模式四，新函数绕过检查。它新增了一个能改债务状态的入口，却没有复用既有的健康因子检查。防御是统一的操作后检查钩子，加不变量测试。","Nomad 是模式二，零值有含义。它把可信根的默认值零，当成了一个合法的、可以通过验证的值。防御是零值一律视为无效。","Bybit 是模式六，盲签。签名人看到的界面和实际签署的数据不一致。防御是独立解码所签内容，用硬件钱包核对。注意，同一起事故可能命中多条模式。关键不是贴标签，而是看到信号就触发对应的防御动作。"]],["小结与预告",["主线小结三点。第一，大多数事故是旧漏洞换环境复发，新链、新分叉、新版本、新组合。安全不是记住每一个漏洞，而是看穿它们共同的形状。","第二，三十多起事故可以压缩成七种模式。记住这七种模式，比记住三十起事故更有用，因为新事故往往还是它们的变体。","第三，每学一起事故，用模板复盘一次，它就变成你清单上的一个检查项。别人的教训，就这样变成你的能力。到这里，合约安全主线十三集就全部讲完了。","接下来是四集链专题。C00 以太坊，深潜经典事故的代码。C01 BNB Chain，分叉和精度。C02 TRON，账户权限和集成。C03 Mantle，二层和原生币的差异。把主线学到的通用方法，落到每一条链的具体差异上。我们链专题见。"]]]},"deck":{"src":"../decks/skeuomorphic/ch28/index.html","scenes":[["The DAO：先转账后记账",["2016 年 6 月，以太坊上的 The DAO 被攻击，损失约 6000 万美元。","根因只有一句，先转账，后更新余额。","钱已经转出去，账上的余额还没减。","对方合约在收款的回调里，马上回来，再取一次。"]],["Curve：锁被实现错了",["七年后，2023 年 7 月，Curve 被攻击，损失约 7000 万美元。","这一次，合约里写了重入锁。","可是 Vyper 编译器，把这把锁实现错了。"]],["Penpie：同一个错误",["又过了一年多，2024 年 9 月，Penpie 损失约 2700 万美元。","它的领奖函数，没有加锁。","三个名字，三种写法，其实是同一个错误，先交互，后记账。"]],["两个问题",["一个早就修过的漏洞，为什么会换个名字，一再回来？","读旧事故，能不能让我们提前认出下一起？","带着这两个问题，我们走进一座事故档案馆。"]],["旧漏洞，新环境",["先给一句准确的说法。","大多数事故不是新漏洞，而是旧漏洞在新环境里复发。","新环境可以是一条新链，一个分叉，一个新版本，或者一种新的组合方式。"]],["比喻：航空事故报告",["打个比方，航空业把每一起事故，都写成公开报告。","所以今天的飞行员，不会再犯 1970 年代的错误。","链上安全也有自己的事故报告，项目复盘，安全公司分析，还有链上数据。","读事故报告，是成本最低的安全训练。"]],["比方不成立：没有权威调查",["这个比方有一处不成立。","航空事故由独立机构调查，结论有权威性。","链上事故的复盘，多数由项目方或安全公司发布。","细节可能不完整，归因也可能有争议。","所以读复盘时，只采信多方公开资料一致的事实。"]],["档案馆怎么归档",["在这座档案馆里，每一起事故按两个标签归档，根因类别和链。","以太坊和多链，BNB Chain，TRON，Mantle，各有一面展墙。","还有两面，一面放代码之外的事故，一面放 NFT 与 GameFi。","金额都是事发时的美元估值，只能看作约数。","没有摆上展墙的，不代表没有发生。"]],["六十多起，八种模式",["六十多起事故摆在一起，反复出现的，其实只有八种模式。","前五种藏在代码和版本里，后三种，出在签名、密钥和人身上。"]],["① 先交互，后记账",["第一种，先交互，后记账。","识别信号是，外部调用之后，还有状态写入。","The DAO 是它，Curve 也是它。","2022 年 4 月的 Fei Rari，先发送 ETH，后记账，损失约 8000 万美元。","其中一个退出函数，没被重入锁覆盖。","防御是先检查，再改状态，最后才和外部交互，再加一把所有函数共享的重入锁。"]],["② 零值有含义：Nomad",["第二种，零值或默认值有含义。","2022 年 8 月，Nomad 跨链桥的可信根，被设成了全零，损失约 1.9 亿美元。","零本该表示什么都没有，在这里却成了合法的值。"]],["Qubit：零地址也成功",["同年 1 月，BNB Chain 上的 Qubit 跨链桥，对零地址发起的转账，也返回了成功。","这一次，损失约 8000 万美元。","识别信号是，等于零，零地址，没初始化的映射，被当成了合法值。","防御是零值一律视为无效，存在与否，用单独的标记来记。"]],["③ 交易内数据当事实",["第三种，一笔交易里能被改变的数据，被当成了事实。","2020 年 2 月的 bZx，只看一个 DEX 的价格。","2021 年 5 月的 PancakeBunny，按池子储备给 LP 定价。","同年 10 月的 Cream Finance，份额价格可以被捐赠抬高，损失约 1.3 亿美元。"]],["能先推高再拉回",["池子储备，合约余额，份额价格，在同一笔交易里，都能先推高再拉回。","防御是用抗操纵的预言机，资产用内部记账，不直接读合约余额。"]],["④ 新函数绕过检查",["第四种，新增的函数，绕过了原有的检查。","2023 年 3 月，Euler Finance 损失约 1.97 亿美元，大部分后来归还。","根因是新加的捐赠函数，没有做健康检查。","别的入口都检查了，偏偏新入口漏掉了。","识别信号是，新增了一个能改余额或债务的入口。","防御是统一的操作后检查，所有入口都要经过，再用不变量测试兜底。"]],["⑤ 改过的分叉没重审",["第五种，改动过的分叉和新版本，没有重新审计。","2021 年 4 月的 Uranium Finance，分叉了 Uniswap V2。","改手续费时，漏改了一个常数，恒定乘积的检查就此失效，损失约 5000 万美元。","识别信号只有一句话，只改了一行。","防御是改动即重审，对差异做审计。"]],["⑥ 看不懂自己签的",["第六种，签名人看不懂自己签的是什么。","2024 年 7 月的 WazirX，签名人看到的，和签下的不一致，损失约 2.3 亿美元。","2025 年 2 月的 Bybit，多签前端的脚本被精准篡改，只对目标地址生效。","签名人盲签了一笔 delegatecall，按 FBI 口径，损失约 15 亿美元。"]],["签名：信号与防御",["TRON 上的权限诈骗也是这一种，用户签下的，是交出自己账户的权限。","识别信号是，签名界面只显示哈希或摘要。","防御是独立解码，在硬件钱包上核对，delegatecall 只许指向白名单里的合约。"]],["⑦ 少数几把钥匙",["第七种，少数几把钥匙，控制了全部资产。","2022 年 3 月的 Ronin，9 个验证者里，5 个被控制，损失约 6.2 亿美元。","2023 年 7 月的 Multichain，MPC 节点全部放在 CEO 的个人云账户里。","这一次，损失约 1.26 亿美元。"]],["Drift：二签五，无时间锁",["2026 年 4 月的 Drift，五个人里两人签名就能放行，没有时间锁，损失约 2.85 亿美元。","识别信号是，签名人少，没有时间锁。","防御是提高门槛，让签名人真正彼此独立，再加时间锁和速率限制。"]],["反例：延迟救了 mETH",["延迟有多大用，看一个反例。","2025 年 2 月，Mantle 上的 mETH 协议，靠 8 小时提款延迟和暂停权限，追回了 15000 个 cmETH，约 4300 万美元。"]],["⑧ 人是入口",["第八种，人是入口。","2024 年 5 月的 DMM Bitcoin，一道假招聘测试题，控制了供应商员工的终端。","这一次，损失约 3.05 亿美元。","同年 10 月的 Radiant Capital，一个伪装成 PDF 的后门，控制了 3 名开发者的设备。"]],["人：信号与防御",["2025 年 5 月，Coinbase 的外包客服被收买，导出了用户数据。","识别信号是，招聘测试题，外部文件，会议软件，被收买的员工。","防御是签名设备和开发设备分开，关键操作两人确认，离职立刻收回权限，数据只留必要的。"]],["NFT 与 GameFi 也一样",["NFT 和 GameFi 的展墙也一样，大额损失多来自社交账号和前端，管理员的铸币权限，还有内部人。"]],["怎么写复盘",["认出模式之后，还要会写复盘。","先写一句话摘要，损失多少，是否追回。","再写时间线，漏洞在哪个版本引入，攻击交易，发现与响应。","根因分两层，直接原因是代码哪一行，根本原因是流程哪一环缺失。","最后写，哪个关口本可以拦住它，被打破的不变量，还有防御清单。"]],["怎么练习",["练习时，每周选一起，只看交易哈希，用调用树找根因，再对照复盘，找出自己漏掉的步骤。","事件库只是线索，金额和根因要回到一手资料核对，复现只在本地或分叉环境里做。"]],["今天就能做的事",["今天就能做一件事。","写代码的人，拿八个识别信号，查一遍自己最近的改动。","管资产的人，数一数控制资金的钥匙有几把，有没有时间锁。"]],["回到开头：环境变了",["回到开头的问题。","修过的漏洞会回来，是因为环境变了，新链，新分叉，新版本，新组合，检查却没跟上。","读旧事故，能帮我们提前认出下一起，前提是记住模式和信号，而不是名字。"]],["认出它，靠的是模式",["也要说清边界，档案馆只认得出旧模式，真正的新漏洞，这里还没有展品。","同样的错误，会换个名字再来，认出它，靠的是模式。"]]]},"d3b":{"src":"../decks/3b1b/ch28.html","scenes":[["四起事故，跨了八年",["2016 年，The DAO 先转账、后更新余额，损失约 6,000 万美元。","2022 年，Fei Rari 先用 call 发送 ETH，再记账，损失约 8,000 万美元。","2023 年，Curve 用的 Vyper 编译器，重入锁实现错了，损失约 7,000 万美元。","2024 年，Penpie 的领奖函数没有加锁，损失约 2,700 万美元。"]],["同一种错误：先和外部交互，再记账",["四个名字，跨了八年，背后是同一种错误：先和外部交互，再记账。","为什么旧错误总能换个名字回来？怎样在它换名字之前认出它？先记住这个问题。"]],["大多数事故是旧漏洞在新环境里复发",["这一章的判断是：大多数事故不是新漏洞，而是旧漏洞在新环境里复发。","新环境指的是：新链、新分叉、新版本，还有新的组合方式。","打个比方：航空业把每一起事故都写成公开报告，所以今天的飞行员，不会再犯上世纪七十年代的错误。","合约安全也有自己的事故报告：项目复盘、安全公司分析、链上数据。读它们，是成本最低的安全训练。"]],["比方不成立处：复盘没有独立机构",["这个比方有一处不成立：航空事故由独立机构调查，结论有权威。合约事故的复盘，多数由项目方或安全公司发布，细节可能不全，归因可能有争议。","所以下面只用多方公开资料一致的事实，把六十多起事故，压成八种反复出现的模式。"]],["模式一：先交互后记账",["第一种，先交互后记账。识别信号是：外部调用之后，还有状态写入。","从 The DAO 到 Curve，形式在变，信号没变。防御是先检查、再改状态、最后交互，再加一把共享的重入锁。"]],["模式二：零值或默认值有含义",["第二种，零值或默认值有含义。","Nomad 在一次升级里，把可信消息根设成了 0x00。零值本该表示没有，却被当成了一个合法的根。","Qubit 对零地址调用 safeTransferFrom，调用返回了成功。以太坊一侧没收到 ETH，另一侧却铸出了代币。","信号是：等于 0、零地址、未初始化的映射，被当成了合法值。防御是：零值一律视为无效，存在与否要显式标记。"]],["模式三：把交易内可改的数据当成事实",["第三种，把一笔交易里可以改变的数据，当成事实。","池子的储备、合约自己的余额、份额价格，都能在同一笔交易里被推高或压低。从 bZx、Cream 到 PancakeBunny，都是这样。","防御是：用抗操纵的预言机，用内部记账，不读一笔交易里就能改写的数。"]],["模式四：新增函数绕过既有检查",["第四种，新增的函数，绕过了既有的检查。","Euler 的捐赠函数，会减少账户的抵押品，却不检查捐赠后账户是否仍然健康。其他入口都检查了，偏偏这个没有。","防御是：所有修改余额或债务的入口，走同一个操作后检查；再用不变量测试，盯住整个系统。"]],["模式五：只改了一行，常数放宽 100 倍",["第五种，改动过的分叉，或者没审计的新版本。识别信号就是一句话：只改了一行。","2021 年，Uranium 分叉了 Uniswap V2，把手续费从千分之三改成万分之十六。","交换后的检查是：两边余额相乘，不能小于原来的乘积。左边每个余额，按一万倍放大，相乘就是一亿倍。","右边却还按一千的平方比较，也就是一百万倍。一亿比一百万，检查放宽了一百倍。"]],["Uranium 损失约 5,000 万美元",["攻击者用极少量代币，换走了每个交易对大约 99% 的储备，损失约 5,000 万美元。","防御是：常数集中定义；改动就要重审，做差异审计；并测试每次交换之后，乘积不变量仍然成立。"]],["模式六：签名人看不懂自己签的内容",["后三种，出在代码之外。","第六种，签名人看不懂自己签的内容。信号是：签名界面只显示哈希或摘要。","Bybit 的签名人盲签了一笔 delegatecall；TRON 上的权限诈骗，让人签下了修改账户权限的交易。","防御是：独立解码交易，在硬件钱包上核对，delegatecall 只允许白名单里的目标。"]],["模式七：少数密钥控制全部资产",["第七种，少数密钥控制全部资产。Ronin 的 9 个验证者里，5 个被控制，就够了。","信号是签名人少、没有时间锁。防御是提高阈值，让签名人真正独立，再加上时间锁和速率限制。"]],["模式八：人是入口",["第八种，人是入口。","DMM Bitcoin，是一份假的招聘测试题，控制了供应商员工的电脑。","Radiant，是一个伪装成 PDF 的后门，控制了 3 名开发者的设备。","Coinbase，是外包客服被收买，导出了用户数据。","信号是：招聘测试题、外部文件、会议软件、被收买的员工。","防御是：签名设备和开发设备隔离，双人原则，离职就回收权限，数据只给需要的人。"]],["同一张复盘表，拿 Uranium 来填",["八种模式，怎样用起来？把每一起事故，写成同一张复盘表。","拿 Uranium 来填。直接原因：交换检查里，一个常数没改。","根本原因：流程里缺了一环，分叉改动没有做差异审计。","哪个关口本可以拦住它？测试关口：一个每次交换后检查乘积的不变量测试。"]],["四格会反复对上同一种模式",["被打破的那个式子，就是新的乘积，大于等于旧的乘积。","名字会换，但直接原因、根本原因、关口和不变量，这四格会反复对上同一种模式。"]],["答案：检查按名字记，不是按信号记",["回到开头：为什么旧错误总能换个名字回来？","因为环境在变：新链、新分叉、新版本、新组合。而检查，常常是按名字记的，不是按信号记的。","怎样在它换名字之前认出它？记住每种模式的识别信号，看到信号，就想到防御，不管它叫什么。"]],["成立条件：事件库只是线索",["成立条件：事故表只收录能用公开资料核实的事件，没出现在表里，不代表没发生；事件库是线索，金额和根因要回到一手资料核对。","复现只在本地或分叉环境里运行。","带走一个问题：这一次的事故，是哪一种旧模式？"]]]}}},{"id":"29","title":"2026 专题：攻击者不再偷私钥，而是控制签名路径（含交易所签名服务参考架构）","md":"../chapters/29-signing-path-2026.md","v":{"vs":{"src":"skeuo/ep29/out/ep29-full.mp4","cues":[[0.65,2.35,"2025 年 2 月 21 日"],[2.41,4.26,"Bybit 的以太坊冷钱包"],[4.33,6.22,"被转走了大约 15 亿美元"],[7.2,8.85,"私钥 没有泄露"],[9.22,10.73,"签名人按照流程"],[10.82,11.69,"一个一个"],[11.74,12.74,"按下了确认"],[13.74,14.97,"屏幕上显示的"],[14.99,16.45,"是一笔普通的转账"],[17.44,19,"而真正签下去的交易"],[19.02,20.03,"多了一个参数"],[20.13,21.87,"operation 等于 1"],[22.84,23.95,"就这一个数字"],[24.02,26.19,"让钱包去执行了攻击者的代码"],[26.38,27.69,"把自己的实现合约"],[27.71,28.91,"换成了攻击者的"],[29.9,31.95,"钥匙 一直锁得好好的"],[32.31,33.63,"攻击者控制的"],[33.74,35.25,"是钥匙盖在什么文件上"],[36.22,38.45,"这一集 我们跟着一笔交易"],[38.63,39.87,"走完它从提出"],[39.94,41.22,"到上链的七道关"],[45.77,47.2,"先把这条路画出来"],[48.17,49.23,"假设一位用户"],[49.26,51.66,"要从交易所提走 2 万 USDT"],[52.04,52.98,"这是示例"],[53.98,55.74,"第一关 业务意图"],[56.11,57.48,"用户点下提现"],[57.7,59.53,"账本里多了一张提现单"],[60.52,62.33,"第二关 请求构造"],[62.7,64.36,"钱包后台把这张单子"],[64.43,66.21,"翻译成一笔待签名的交易"],[67.19
