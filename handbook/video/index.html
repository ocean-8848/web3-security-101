地址没有代码。","收件人收件时扣下10%当小费，你的登记簿上却写着全额。这是收税代币。","收件人故意拒收，而你要按顺序送完100个包裹，第1个被拒，后面99个都送不出去。这是拒绝服务。","比喻不准的地方在于，快递员一次只出一种错。外部合约可以同时撒谎、回调、耗尽 gas。"]],["低级调用的四个陷阱",["先看低级调用的四个陷阱。第一，不检查返回值。低级 call 失败时只返回 false，不会回滚，调用方必须自己检查。","第二，目标地址没有代码。对一个没有代码的地址做 call，会返回成功，返回数据为空。下面的 Qubit 案例就栽在这里。","第三，返回数据炸弹。对方故意返回超大的数据，你复制到内存时耗尽 gas。修复是限制复制的长度。","第四，gas 不足型失败。调用方故意给刚好不够的 gas，让内部调用失败，而外层继续执行。修复是检查剩余 gas，关键调用失败时整体回滚。"]],["案例：Qubit 跨链桥",["来看 Qubit 跨链桥，以下据 SlowMist 的公开分析。这个桥把以太坊上的存款，映射成 BNB Chain 上的代币，再用作借贷抵押品。桥为原生 ETH 配置的代币地址，是零地址。ETH 存款本该走专门的函数，它会检查附带的 ETH 数量。","攻击者调用的是普通的代币存款函数，传入 ETH 对应的资源编号。白名单检查通过，因为这个编号确实被允许。","普通存款函数对零地址执行安全转账。零地址没有代码，低级调用返回成功，返回数据为空。旧版的安全转账库，为了兼容不返回值的代币，把空返回当作成功。","桥记录了一笔 ETH 存款，BNB Chain 一侧铸造了大量映射代币。攻击者拿它做抵押，借空了借贷池，损失约8000万美元。","漏洞来自组合，零地址，兼容性妥协，加上缺少原生币检查。白名单只告诉你这个编号被允许，不告诉你它对应什么类型的资产。现在 OpenZeppelin 的安全转账库，会在返回数据为空时检查目标是否有代码。"]],["八种非标准代币（上）",["ERC-20 标准只规定了接口，没有规定行为。真实世界的代币五花八门。第一种，转账函数不返回值，比如以太坊上的 USDT。按标准接口去解码返回值，就会回滚。用 SafeERC20 可以兼容。","第二种，转账成功却返回 false，比如 TRON 上的 USDT。这时 SafeERC20 反而会判定失败。要改用余额差来判断，后面专门讲。","第三种，转账收税，部分 BSC 社区代币就是这样。你记账的金额，大于实际收到的金额。要按余额差记账。","第四种，余额自动变化，也叫变基代币，比如 stETH。你缓存的余额会失效。要用份额记账，比如它的包装版本 wstETH。"]],["八种非标准代币（下）",["第五种，黑名单和冻结，USDT 和 USDC 都有。批量操作里只要一个地址被冻结，整笔都会失败。要用拉取式支付，或者让单笔失败不影响全局。","第六种，可以暂停，多数中心化稳定币都有。暂停时，清算或者提款也会停。要做风险披露，并设计降级路径。","第七种，带转账钩子，比如 ERC-777，会导致重入。用 CEI 加重入锁。","第八种，可以升级，比如 USDT 和 USDC 本身都是可升级的。它的行为将来可能改变。要监控它的升级事件。"]],["TRON USDT：成功却返回 false",["详细看第二种。据 OpenZeppelin 2026年公开的一份审计报告，TRON 上部署的 USDT 合约，转账函数在成功时也返回 false。","后果是，用 SafeERC20 推送 USDT 的代码，在 TRON 上一律回滚。存款能进来，提款却全部失败。","被审计的项目为 TRON 单独实现了一个库。转账时不读返回值，只检查调用没有回滚，再检查接收方余额是否正好增加了对应金额。同一份审计认为，拉取方向的转账和授权在 TRON USDT 上行为正常，所以保持不变。","注意，余额差方案假设代币没有转账税。据同一份审计，Tether 在 TRON 上保留了开启转账手续费、黑名单和暂停的能力。如果手续费被开启，等于金额的检查就会失败。设计时要明确选择，是失败即回滚，还是按实收金额记账。"]],["收税代币的记账",["看收税代币怎样让协议资不抵债。示例代币有2%的转账税。用户 A 存入100枚，转账时被扣2枚，合约实际只收到98枚。可是账本按参数记了100。","五个用户各存入100枚。账本合计500，合约实际只有490。","大家依次取款。每人按账本取100枚，前四个人取走400。","轮到第五个人，合约里只剩90枚，他的100取不出来。如果取款时也收税，情况更糟。这就是按参数记账的后果，最后一个人承担了所有人的税。","修复是按实收金额记账。转账前读一次余额，转账后再读一次，差值才是实际收到的数量。注意要配合重入锁，防止转账里的回调扭曲余额差。不打算支持收税和变基代币的协议，要显式拒绝。"]],["外部调用导致的拒绝服务",["外部调用还会导致拒绝服务，让功能永久或长期无法使用。第一种模式，推送支付中有人回滚。比如拍卖时，新的出价要先把钱退给上一个出价者。如果上一个出价者是一个总是拒收的合约，新出价就永远失败，他永远是最高价。修复是拉取式支付。","第二种，无界循环。遍历所有用户发奖励，用户数增长后，gas 超过区块上限。修复是分页处理，或者用累计奖励因子，让每个用户自己领。第三种，黑名单地址卡住批量操作。修复是逐个处理，失败的记账待领取。","第四种，依赖强制的余额等式。第3集讲过，余额可以被强制转入，所以要用大于等于。第五种，TRON 上单笔执行超过80毫秒的 CPU 时间，会返回超时。在以太坊上 gas 足够的循环，在 TRON 上可能失败。"]],["案例：Akutars",["来看 Akutars，2022年4月，以下据公开复盘。这是一个 NFT 拍卖合约，结束后要按顺序给每个出价者推送退款。有人用一个拒收的合约参与出价，整个退款流程被卡住了。","更糟的是，项目方自己提款的函数，条件里比较了一个错误的变量，这个条件永远不会成立。","两个出口都被堵死，11539.5个 ETH 被永久锁在合约里。修复思路是，推送改成拉取，出口条件用不变量测试验证，确保资金在任何情况下都有路可走。"]],["授权的三种风险",["最后是授权相关的风险。第一，无限授权。用户给协议授权了最大额度。协议被攻破后，攻击者可以转走用户钱包里的全部该代币，哪怕用户根本没有存进协议。","第二，授权钓鱼。钓鱼网站诱导用户签署授权，或者链下签名授权。TRON 上的 USDT 授权钓鱼，和以太坊上的签名授权钓鱼，原理相同。","第三，任意调用加授权。路由合约持有用户的授权，又允许用户指定任意的调用目标。攻击者就让路由去调用代币的转账函数，从受害者转给自己。这是聚合器被盗最常见的根因之一。","案例是 Sushi 的路由合约，2023年4月，约330万美元。路由里的池子地址由用户填写，攻击者填入自己伪造的池子，在回调里把任意一个授权过的用户设为付款人。回调只检查了是不是刚才调用的地址，没检查是不是真实的池子。"]],["审计检查点",["审计检查点八个。第一，所有低级调用都检查了返回值。第二，调用目标可能是零地址或无代码地址时，显式检查。","第三，代币操作用 SafeERC20，部署到 TRON 时，USDT 的推送单独处理。第四，支持任意代币时，按实收金额记账，不支持的类型显式拒绝。","第五，批量转账和退款用拉取模式，或者单笔失败不影响整体。第六，没有随用户规模增长的无界循环。","第七，持有授权的合约，不允许任意的调用数据。第八，代币精度从合约读取。"]],["练一练",["来练一练。一个收益协议在以太坊上运行良好。部署到 TRON 后，存款正常，提款全部失败。最可能的原因是什么？提示一下，存款是拉，提款是推。","参考答案。提款用 SafeERC20 推送 USDT，而 TRON 上的 USDT 在成功时返回 false，所以一律回滚。存款用拉取方向的转账，行为正常。修复是推送改用余额差判断，并提前决定，如果代币开启收税，要怎样处理。"]],["小结与预告",["小结三点。第一，低级调用要查返回值，也要查目标有没有代码。零地址加兼容性妥协，就是 Qubit。","第二，代币只遵守接口，不遵守行为。按实收金额记账。TRON 上推送 USDT，用余额差判断。","第三，推送改成拉取，防止拒绝服务。持有授权的合约，绝不接受任意调用。","下一集讲预言机与闪电贷。合约相信了一个一笔交易就能改写的价格。现货价操纵，时间加权平均价，以及二层网络排序器停摆时，价格该怎么办。下集见。"]]]},"deck":{"src":"../decks/skeuomorphic/ch07/index.html","scenes":[["没收到 ETH，却铸出 qXETH",["2022 年 1 月，Qubit 跨链桥出了事。","以太坊这一侧，没有收到对应的 ETH。","BNB Chain 那一侧，却铸造出了代表 ETH 的 qXETH。","公开报道的损失，约 8000 万美元。","桥相信了一次外部调用的结果。"]],["先猜一道题",["先猜一道题。","合约用低级 call，去调用一个没有代码的地址。","call 返回 true，还是 false？"]],["答案：true，返回数据为空",["答案是 true，而且返回数据是空的。","EVM 不会因为目标没有代码，就让 call 失败。","如果代码把成功加空返回，当成转账成功，","它就会记下一笔，根本没有发生的转账。","记住一句话：每一个外部调用，都是把命运交给别人。","对方可能失败，可能撒谎，可能拖延，也可能根本不存在。"]],["陷阱一：不检查返回值",["低级调用，指 call，delegatecall 和 staticcall。","它们失败时，不会自动回滚，只返回一个 false。","打个比方。你让快递员送包裹，然后在登记簿上写：已送达。","陷阱一，不检查返回值。快递员没回话，你就当作送到了。","修复是接住返回的布尔值，不成功就回滚。"]],["陷阱二：目标没有代码",["陷阱二，目标没有代码。地址是一块荒地。","快递员说送到了，因为荒地不会拒收。","对无代码地址的 call，返回成功，返回数据是空的。","修复是调用之前，检查目标地址的代码长度大于 0。"]],["陷阱三：返回数据炸弹",["陷阱三，返回数据炸弹。对方返回超大的数据。","复制进内存，耗光 gas。修复是限制复制长度。"]],["陷阱四：gas 不足型失败",["陷阱四，gas 不足型失败。","调用方故意给刚好不够的 gas，","内部调用失败，外层却继续往下走。","修复是检查剩余 gas。关键调用失败时，整体回滚。","比喻在这里不成立：快递员一次只会出一种错。","外部合约可以同时撒谎，回调，耗尽 gas。"]],["Qubit：零地址与普通 deposit",["现在回到 Qubit。按 SlowMist 的公开分析，根因分五步。","第一步，桥给原生 ETH 配的代币地址，是零地址。","ETH 存款本该走 depositETH，它会核对随交易附带的 ETH。","第二步，攻击者调用普通的 deposit，传入 ETH 的资源 ID。","白名单检查通过。"]],["空返回被当作成功",["第三步，deposit 对零地址，执行 safeTransferFrom。","第四步，零地址没有代码。低级调用返回成功，返回数据是空的。","旧版的安全转账库，把空返回当作成功。","这是为了兼容不返回值的 USDT。"]],["漏洞来自组合",["第五步，桥记下一笔 ETH 存款。BNB Chain 一侧，铸出大量 qXETH。","攻击者拿它做抵押，借空了借贷池。","每一步单独看，都说得通。","漏洞来自组合：零地址，兼容性妥协，缺少原生币检查。"]],["白名单不等于资产",["白名单只告诉你，这个 ID 被允许。","没告诉你，它对应什么资产。","现在的 SafeERC20 遇到空返回，会检查目标有没有代码。"]],["风险来自代币本身",["第二类风险，来自代币本身。","ERC-20 只规定了接口，没有规定行为。","常见的非标准行为，有八种。"]],["非标准行为（一至四）",["一，transfer 不返回值，比如以太坊上的 USDT。用 SafeERC20 兼容。","二，transfer 成功了，却返回 false。这是 TRON 上的 USDT。","三，转账收税。到账的钱，比转出的少。","四，余额自动变化，比如 stETH。缓存的余额会失效，要用份额记账。"]],["非标准行为（五至八）",["五，黑名单和冻结。","六，可暂停。","七，转账钩子，比如 ERC-777，会带来重入。","八，可升级。行为以后可能改变。"]],["TRON USDT：成功也返回 false",["细看第二种。OpenZeppelin 在 2026 年，审计了 Across 协议的 TRON 部署。","TRON 上的 USDT，转账成功时，也返回 false。","于是，用 safeTransfer 推送 USDT 的代码，在 TRON 上一律回滚。","存款走拉取方向的 transferFrom，不受影响。","症状就是：存款正常，提款全部失败。"]],["只看余额涨了多少",["修复是不读返回值，只看接收方的余额涨了多少。","涨的正好等于金额，才算到账。","这个方案假设不收手续费。而 Tether 保留了开启它的能力。"]],["收税代币：账面多于实收",["再看第三种，收税代币。","协议按参数记账：用户说存 100，账上就记 100。","可代币扣了税，金库实际只收到 98。","账面比实收多出 2 枚。这个差额，由其他用户承担。","所有用户都这样存取，协议就会资不抵债。"]],["按实收记账，显式拒绝",["修复是按实收记账：转账前后，各读一次余额，只记增量。","这一步要配合重入锁，防止回调干扰前后两次读数。","没有一个库，能防住所有怪代币。","审计时，先问项目方：你们支持哪些代币？","不支持的类型，比如收税和变基，要显式拒绝。"]],["拒绝服务",["外部调用的第三种后果，是拒绝服务。","攻击者不偷钱，而是让合约的某个功能，长期用不了。"]],["再猜一道题",["再猜一道题。拍卖合约收到新出价时，把钱直接退给上一位出价者。","上一位出价者是一个合约，它的 receive 函数总是回滚。","新出价能成功吗？"]],["不能：改成拉取式支付",["不能。退款失败，让整笔新出价回滚。","它会一直占着最高出价者的位置。","换成快递：100 个包裹，要按顺序送完。","第 1 个被拒收，后面 99 个都送不出去。","修复是拉取式支付。合约只记账，收款人自己来取。","一个人拒收，只影响他自己。"]],["遍历与批量分发",["类似的毛病，还有几种。","遍历所有用户发奖励。用户一多，就超过区块 gas 上限。","改成分页，或者用累计奖励因子。","批量分发 USDT，其中一个地址被冻结，整批失败。","改成逐个捕获失败，记账，等对方来领。"]],["严格相等与 CPU 上限",["要求余额严格等于记录值。被人强制转入 1 wei，就再也对不上。","改用大于等于。","TRON 上，每次执行有 80 毫秒的 CPU 时间上限。","以太坊上够用的循环，在 TRON 上可能超时。"]],["Akutars：11539 ETH 锁死",["真实案例。2022 年 4 月，以太坊上的 Akutars NFT。","它的推送退款，可以被一个拒收合约卡死。","项目方提款的条件，又比较了错误的变量，永远不成立。","超过 11539 个 ETH，被永久锁定。","按 BlockSec 的分析，直接锁死资金的，是第二个缺陷。","但第一个，同样是一个现成的 DoS 入口。"]],["最后一道题：改授权",["最后一类风险，是授权。","approve 允许另一个地址，代你转出代币。","最后一道题。Alice 授权了 Bob 100 枚，现在想改成 50 枚。","Bob 能抢先打包自己的交易。他最多能拿走多少？"]],["答案：150 枚",["150 枚。他先花掉旧的 100 枚。","等新额度生效，再花 50 枚。","这叫 approve 竞态。"]],["竞态的缓解",["缓解办法之一：先设成 0，看旧额度有没有被花掉，再设新值。","之二：用 safeDecreaseAllowance 相对减少。额度已被抢先花掉，交易就回滚。","forceApprove 只解决兼容问题，不解决竞态。"]],["无限授权",["比竞态更大的风险，是无限授权。","协议一旦被攻破，攻击者能转走你钱包里全部的这种代币。","即使你从没把它存进协议。","钓鱼网站也盯着授权，诱导你签 approve，或者链下签名的 permit。"]],["任意调用 + 授权",["最危险的组合，是任意调用加授权。","路由合约持有用户的授权，","又允许用户指定任意目标，和任意 calldata。","攻击者就能让它，调用代币的 transferFrom，从受害者转给自己。"]],["Sushi RouteProcessor2",["2023 年 4 月，Sushi 的 RouteProcessor2。","路由里的池子地址，由用户填写。","攻击者填入自己的池子，在回调里，把任意授权过的用户设成付款人。","回调校验只问：是不是刚才调用的地址？","没有问：它是不是真实的池子？","按公开分析，约 330 万美元被盗。"]],["持授权就禁任意调用",["规则是：持有授权的合约，必须禁止任意调用目标和任意 calldata。"]],["今天就能做的事",["最后，每个人今天就能做一件事。","写合约的人，检查每一个低级 call 的返回值，并确认目标有代码。","接代币的人，按实收记账。部署到 TRON，单独处理 USDT 推送。","审计的人，找出每个推送资金的循环，问：有人拒收会怎样？"]],["普通用户",["普通用户，只授权需要的数额，用完就撤销。","收到陌生代币，不要去卖，也不要去领。","在 TRON 上转 USDT，确认状态是成功，不只是已广播。"]],["返回只是对方的说法",["回到开头。没有收到钱，桥为什么记下了一笔存款？","因为它把成功加空返回，当成了到账，又没有问对方存不存在。","外部调用的返回，只是对方的说法。","要证明钱到了，就看余额的变化。前提是，你清楚这个代币会不会收税。","对方未必按标准出牌，你的合约要自己核对。"]]]},"d3b":{"src":"../decks/3b1b/ch07.html","scenes":[["Qubit：没收到 ETH，却铸出代币",["2022 年 1 月，Qubit 跨链桥在以太坊一侧，没有收到对应的 ETH。","可是在 BNB Chain 一侧，桥却铸造出了代表 ETH 的 qXETH。"]],["桥相信了一次外部调用的结果",["攻击者拿它做抵押，借空了资金池。公开报道的损失，约 8,000 万美元。","桥相信了一次外部调用的结果。","问题来了：对方不按标准出牌时，你的代码会怎样？"]],["比方：快递员说已送达",["每一次外部调用，都是把命运交给别人。对方可能失败，可能撒谎，可能拖延，也可能根本不存在。","打个比方：你让快递员把包裹送到某个地址，然后在登记簿上写下：已送达。","快递员没回话，你就当作送到了。这是不检查返回值。","地址是一块空地，快递员说送到了，因为空地不会拒收。这是目标地址没有代码。","收件人扣下一成当小费，登记簿上却写着全额。这是转账收税的代币。"]],["比方不成立处：错误会叠加",["这个比方有一处不成立：快递员一次只出一种错。外部合约可以同时撒谎、回调、耗尽 gas。"]],["低级调用：失败不回滚，空地址算成功",["先看最底层的低级调用。它失败时不会自动回滚，只会返回一个 false。","第一个陷阱：不检查这个返回值。调用失败了，代码却照常往下走。","第二个陷阱更反直觉：调用一个没有代码的地址，EVM 不会报错，而是返回成功，返回数据为空。"]],["返回数据炸弹与 gas 不足",["第三个，返回数据炸弹：对方返回超大的数据，复制到内存时把 gas 耗光。","第四个，调用方故意只给刚好不够的 gas，让内部调用失败，外层却继续执行。","修法分别是：检查返回值；调用前确认地址上有代码；限制复制长度；关键调用失败时整体回滚。"]],["Qubit 路径：对零地址做安全转账",["现在回头看 Qubit。桥给原生 ETH 配置的代币地址，是零地址。","ETH 存款本该走专门的函数，它会检查随交易附带的 ETH。攻击者却调用了普通的存款函数，传入 ETH 的资源编号。白名单检查通过。","普通存款函数对零地址执行安全转账。零地址上没有代码，低级调用返回成功，返回数据为空。"]],["漏洞来自组合，不是单点",["旧版的安全转账库，为了兼容不返回值的 USDT，把空返回当作成功。","于是桥记下一笔 ETH 存款，BNB Chain 一侧铸出 qXETH，再被拿去借空资金池。","每一步单独看都说得通。漏洞来自组合：零地址，加兼容性妥协，加缺少原生币检查。白名单只说明这个编号被允许，不说明它对应什么资产。"]],["ERC-20 只规定接口，不规定行为",["再看代币本身。ERC-20 只规定了接口，没有规定行为。手册列出了八种常见的非标准行为。","最反常的一种：TRON 上的 USDT，转账成功时，也返回 false。","用 SafeERC20 推送 USDT 的代码，在 TRON 上一律回滚。在以太坊上跑得好好的提款，搬过去就全部失败。"]],["不读返回值，改看结果",["修法是不读返回值，改看结果：记下接收方转账前的余额，转账之后再读一次，增量等于金额，才算到账。","这个修法假设没有转账手续费。Tether 保留了开启手续费的能力。"]],["收税代币：账上多记，取钱的人取不出",["说到手续费，看收税代币。假设一个代币每次转账扣 2%，这是一个示例。","用户存入 100 枚。合约实际只收到 98 枚，账上却按参数记了 100 枚。","用户再取出 100 枚。合约付出去 100 枚，比收到的多了 2 枚。这 2 枚，来自其他用户。","一个人这样做，是少了 2 枚；所有人都这样做，最后取钱的人就取不出来了。协议资不抵债。"]],["按实收记账",["修法：按实收记账。转账前后各读一次余额，只记增量。再配上重入锁，防止转账回调扭曲这个差值。","余额会自动变化的变基代币也类似：缓存的余额会失效，要改用份额记账。"]],["拍卖合约：拒收退款，卡死所有人",["外部调用还能让合约卡死，这叫拒绝服务。","看一个拍卖合约：新的出价进来时，合约直接把钱退给上一位出价者。","如果上一位出价者是一个合约，它的接收函数总是回滚，退款就失败，整笔新出价也跟着回滚。","于是没有人能再出价，它永远保持最高出价者的位置。"]],["拉取式支付；Akutars 事故",["修法是拉取式支付：合约只记账，让收款人自己来提。批量转账也一样，单笔失败不能拖垮整体。","2022 年 4 月的 Akutars NFT，推送退款可被拒收合约卡死，提款条件又比较了错误的变量。11,539.5 枚 ETH 被永久锁定。"]],["授权改额度：被抢先花掉",["最后是授权。Alice 已经授权 Bob 花她 100 枚代币，现在她想改成 50 枚。","Bob 看到了这笔交易，抢先打包自己的交易，先花掉旧额度的 100 枚。","接着 Alice 的修改生效，额度变成 50。Bob 再花掉这 50 枚。一共拿走 150 枚。","缓解办法：先把额度改成 0，确认旧额度有没有被花掉；或者用相对减少额度的函数，被抢先花掉时直接回滚。"]],["路由合约：任意调用目标",["更大的风险在路由合约：它持有用户授权，又允许用户指定任意调用目标。攻击者就能让它替自己转走别人的代币。","2023 年 4 月的 Sushi RouteProcessor2，池子地址由用户填写，回调只检查是不是刚才调用的地址。损失约 330 万美元。"]],["答案：核对结果，不信调用的回答",["回到开头的问题：对方不按标准出牌时，你的代码会怎样？","在 Qubit，答案是：桥把一次空调用的成功，当成了一笔真实的存款。","所以，不要相信外部调用告诉你的结果，要去核对结果本身：地址上有没有代码，余额到底变了多少。"]],["失败要设计，代币要先问清",["失败也要设计好：单个对方回滚，不能卡住所有人；持有授权的合约，不能接受任意调用目标。","成立条件：先问清楚你支持哪些代币。没有一个库能防住所有怪代币。"]]]}}}]},{"name":"第三篇 · DeFi 与协议层","items":[{"id":"08","title":"预言机与闪电贷：一笔交易就能改写的价格","md":"../chapters/08-oracle-flashloan.md","v":{"vs":{"src":"skeuo/ep08/out/ep08-full.mp4","cues":[[1.65,3.34,"2026 年 2 月 15 日"],[3.4,5.76,"Base 链上的借贷协议 Moonwell"],[5.79,7.29,"执行了一份治理提案"],[8.28,9.33,"提案生效后"],[9.43,11.22,"cbETH 的美元价格"],[11.24,13.4,"只用了 cbETH 对 ETH 的汇率"],[14.4,15.46,"它把一个汇率"],[15.51,16.78,"当成了美元价格"],[17.76,20.52,"一枚约 2200 美元的 cbETH"],[20.54,21.57,"在合约眼里"],[21.59,23.37,"只值约 1.12 美元"],[24.37,26.06,"清算机器人立刻动手"],[26.08,28.87,"清算了约 1096 枚 cbETH"],[29.87,31.19,"按 The Block 的报道"],[31.36,33.66,"协议留下约 178 万美元坏账"],[34.65,35.97,"先猜一道题"],[36.96,38.39,"这个价格大于 0"],[38.59,39.9,"而且刚刚更新过"],[40.87,42.66,"只检查正值和时效"],[42.81,44.16,"能拦住它吗"],[45.43,46.22,"不能"],[46.57,47.74,"两项检查"],[47.91,48.73,"都会通过"],[49.73,50.83,"价格是新的"],[51.1,51.87,"也是错的"],[52.85,54.26,"合约读到的价格"],[54.28,55.25,"可能被推高"],[55.34,56.2,"可能停住"],[56.38,57.26,"也可能配错"],[58.23,60.19,"问题是 错的时候"],[60.27,61.9,"哪一行代码来拦住它"],[65.05,66.17,"先说两个词"],[67.14,70.13,"预言机 是把链外或别的合约里的数据"],[70.15,71.66,"交给合约使用的机制"],[72.64,73.64,"它交出的"],[73.73,74.89,"通常是价格"],[75.88,79.52,"闪电贷 是借款 使用 还款"],[79.67,81.78,"都在同一笔交易里完成的贷款"],[82.75,84.5,"交易结束时没有归还"],[84.66,85.89,"整笔交易回滚"],[85.94,87.22,"就像什么都没发生"],[88.2,90.25,"所以出借方没有风险"],[90.37,91.41,"也不需要抵押"],[92.41,93.36,"这意味着"],[93.48,94.8,"本金不再是门槛"],[95.8,97.51,"任何人都能在一笔交易里"],[97.64,99.75,"借到闪电贷池的全部流动性"],[100.74,101.7,"打个比方"],[102.06,103.05,"一家当铺"],[103.21,105.69,"按隔壁菜市场的最新成交价"],[105.72,106.85,"给黄金估价"],[107.85,109.09,"你从朋友 一起比"],[237.33,241.74,"现货价：一笔交易就能改，多个区块也能改"],[242.19,245.63,"时间加权平均价，挡得住单笔操纵"],[245.63,250.91,"能不能挡住多区块操纵，取决于窗口长度和池子深度"],[250.91,253.21,"窗口越长，价格越滞后"],[253.66,258.47,"2022 年 4 月的 Inverse Finance，没有用闪电贷"],[258.47,263.45,"攻击者投入自有资金，连续多个区块推高浅池里的价格"],[263.45,267.87,"还用垃圾交易压制套利，让 TWAP 输出虚高价格"],[267.87,269.91,"借走约 1,560 万美元"],[270.36,275.17,"链下聚合价格抗单笔、也抗多区块操纵，但会过时"],[275.17,278.23,"会触发上下限，节点也可能失效"],[278.68,283.65,"所以没有完美的预言机。工程上要回答两个问题"],[283.65,287.44,"价格错了会怎样？价格停了会怎样？"],[289.14,293.86,"读取链下预言机时，至少检查四件事：价格大于 0"],[293.86,298.13,"在心跳时间内更新过；落在合理的上下限之内"],[298.13,299.63,"精度从喂价读取"],[300.08,304.61,"为什么要查上下限？看 2022 年 5 月的 LUNA"],[304.61,309.65,"公开报道称，LUNA 的喂价设置了最低价 0.10 美元"],[310.1,315.21,"LUNA 跌到 0.01 美元时，喂价仍返回约 0.10 美元"],[315.21,317.88,"抵押品被高估了大约 10 倍"],[318.33,323.99,"BNB Chain 上的 Venus 仍按约 0.1 美元给 LUNA 估值"],[323.99,327.55,"有人低价买入、存进去借出其他资产"],[327.55,330.19,"协议损失约 1,100 万美元"],[330.64,336.2,"在 L2 上还要多查一件事：排序器在不在线。它宕机时"],[336.2,339.88,"喂价交易上不了链，价格停在宕机前"],[340.33,345.47,"恢复后，设一段宽限期，比如 1 小时，这是示例"],[345.47,348.32,"宽限期内暂停清算和新借款"],[350.02,354.65,"回到开头的问题：合约读到的价格，能信吗？"],[355.1,360.2,"一笔交易内就能改写的读数，不能信。现货价、储备"],[360.2,365.3,"余额，都是攻击者的输入参数，不能拿来做关键定价"],[365.75,368.91,"一笔交易改不了的价格，也要验证"],[368.91,372.28,"Moonwell 的价格大于 0，也刚更新"],[372.28,375.02,"正值和时效两项检查都会通过"],[375.47,378.62,"要拦住它，需要合理的价格上下限"],[378.62,382.81,"或者和第二个价格源比较。预言机配置的变更"],[382.81,387.63,"要像代码一样测试，上线前用真实喂价核对美元价格"],[388.08,391.51,"成立条件：先列出协议读的每一个价格"],[391.51,395.75,"标注它在一笔交易内能不能变，再回答错了怎样"],[395.75,396.56,"停了怎样"],[397.01,401.61,"下一集：交易顺序和签名，都可以被别人利用"]],"ch":[]},"talk":{"src":"slides/EP08-oracle-flashloan.html","scenes":[["开场",["大家好，欢迎来到主线第8集，预言机与闪电贷。一句话理解，如果合约用同一笔交易里可以被改变的数据来定价，就会被人先改变它，再按错误的价格和合约做交易。本集的重点是，怎样识别不可信的价格源，以及怎样安全地读取价格。","看三起事故，以下据公开报道。2021年，Cream Finance 约1.3亿美元，份额价格被捐赠抬高，而协议用它给抵押品估值。","2022年，BNB Chain 上的 Venus，约1100万美元，根因是预言机的下限熔断，价格停在了下限。","同年，Inverse Finance 约1560万美元，连时间加权平均价也没能挡住。三起事故的共同点是，协议相信了一个可被操纵的价格。"]],["按菜市场成交价估值的当铺",["打个比方。一家当铺按隔壁菜市场的最新成交价给黄金估价。问题在于，这个最新成交价，任何人只要花钱，就能在一瞬间推上去或压下来。你拿一克黄金去当铺，当铺按被推高的价格给你估值，借给你一大笔钱。这就是不可信的价格源。","可信的价格源不看最近一笔，而是看一整天的平均成交价，或者看多个独立市场的共识价。这样，一笔买卖改不动它。","比喻不准的地方在于，现实中操纵市场要几天，还会被监管。链上一次性的价格操纵，发生在同一笔交易里，没有人来得及反应。所以定价绝不能只看瞬时价。本集就讲，哪些价格是瞬时价，哪些抗操纵。"]],["哪些读数一笔交易内可变",["做威胁建模时，要对每个用于定价的读数，问一个问题，它在一笔交易内能被改变吗？AMM 池的储备比例，能。按储备直接算出的 LP 代币价格，能。","金库份额价格，如果总资产直接读余额，能，通过捐赠就能改。合约的代币余额，能。","时间加权平均价，当前区块的影响很小，但有资本的人在多个区块持续操纵，是可以的。链下聚合的价格，一笔交易内改不了，但它可能过时，也可能触及上下限。能改的，就是攻击者的输入参数。"]],["为什么现货价不可信",["为什么现货价不可信？看恒定乘积 AMM。两种代币数量相乘等于常数，现货价等于两种数量的比值。价格高低，完全由池子当前的储备比例决定。","比较两个池子。浅池只有10万 USDC 和10万 TOKEN。深池有1亿 USDC 和1亿 TOKEN。两个池子现在价格都是1美元。","要把价格推到2倍，需要投入多少钱？浅池大约只需要4万多美元，深池需要4000多万美元。差了1000倍。","所以结论是，池子越浅，把价格推到目标位置越便宜。长尾资产和低流动性代币，用现货价定价的风险最高。而闪电贷让这笔操纵资金几乎零成本借到，操纵后在同一笔交易里用完就还。这是对比，不是操作指南。"]],["三类价格源对比",["三类价格源对比。AMM 现货价，既不抗单笔操纵，也不抗多区块操纵，一笔交易就能改，最不可信。AMM 的时间加权平均价，抗单笔操纵，但能不能抗多区块操纵，取决于窗口长度和池子深度，而且窗口越长，价格越滞后。","链下聚合价格，比如 Chainlink 这类，一笔交易内改不了，抗操纵，但它的风险是价格过时、触及上下限熔断，或者喂价方失效。多源组合加偏离检查最稳，代价是实现复杂，而且要想好源之间分歧时怎么处理。","记住，没有完美的预言机。工程上要回答两个问题，价格错了会怎样，价格停了会怎样。这两个问题，决定了你的降级设计。"]],["安全读取链下预言机",["怎样安全读取链下预言机？四个检查。第一，检查价格是正值。无效时聚合器可能返回零或负数。","第二，检查时效。拿当前时间减去最后更新时间，不能超过按喂价心跳设置的最大延迟。否则你可能在用一个很久以前的价格。","第三，检查上下限。这一条最容易被忽略，下一页专门讲。","第四，精度从合约读取，不要写死。这四个检查，缺一个都可能出事。"]],["案例：下限熔断",["来看下限熔断，以下据公开报道。Chainlink 的 LUNA 喂价，设置了一个最低价，示例是0.1美元。正常时，这个下限不起作用。","2022年5月，LUNA 崩盘，真实价格跌到了远低于0.1美元，比如几分之一美分。但喂价被下限卡住，停在0.1美元附近。","BNB Chain 上的 Venus 协议，仍然按约0.1美元给 LUNA 抵押品估值。有人在市场上用极低的真实价格买入大量 LUNA，存入 Venus，按0.1美元的虚高估值借出其他资产。","协议损失约1100万美元。教训是，读取价格时检查是否触碰上下限，触碰时要暂停相关操作，并给抵押资产设供应上限和紧急下架流程。上下限是防极端波动的，一旦真的触碰，说明价格已经不可信了。"]],["L2 的额外检查：排序器状态",["在 Mantle 这样的二层网络上，交易由排序器打包。排序器一旦宕机，会发生两件事。第一，喂价交易上不了链，价格停留在宕机之前。","第二，排序器恢复后的第一批区块里，普通用户和清算机器人同时涌入，能通过一层网络强制提交交易的少数人占优。这时用停更的旧价格清算，会误伤用户。","业界通用做法是，额外读取一个排序器在线状态的喂价。Chainlink 在多条二层网络上提供这个喂价。排序器刚恢复时，设一段宽限期，示例一小时，这期间暂停清算或新借款。","据 L2BEAT 截至2026年的页面，Mantle 排序器宕机时，用户可以通过一层网络强制提交交易，延迟最长12小时。部署前要确认目标二层网络上有没有这个状态喂价。链专题 C03 会详细讲。"]],["份额价格也会被操纵",["不是只有 AMM 现货价危险。份额价格同样会被操纵。看 Cream，以下据公开复盘。一个金库的份额价格，等于总资产除以总份额。如果总资产直接读合约的代币余额，那么任何人直接向金库转账，就能抬高每份的价值。","Cream 用这个份额价格，给一种抵押品估值。攻击者向金库捐赠大量资产，份额价格被抬高。","然后用少量这种份额作抵押，按虚高的价格借出大量资金，损失约1.3亿美元。这和第6集讲的金库通胀，是同一个根源，总资产直接读余额。","还有 LP 代币的定价。LP 代币不能用储备乘以现货价再除以总供应来算，因为储备和现货价都可被操纵。要用公平储备法，用外部预言机价格和不变量反推出公平储备，再算 LP 价值。"]],["BNB Chain 上的价格操纵",["BNB Chain 早期生态扩张快，大量协议用 PancakeSwap 的池子价格，成了价格操纵的高发区。2021年 PancakeBunny 约4500万美元，按池储备计算 LP 价值，还据此铸造奖励。同年 Venus 的 XVS 事件，用低流动性的治理代币作抵押品，价格被快速拉升后回落，坏账超过9500万美元。","以太坊上的对照案例，Harvest 的份额价格依赖 Curve 池里稳定币的价格。最值得注意的是 Inverse Finance，攻击者没有用闪电贷，而是用自有资金在多个区块持续推高一个浅池，让时间加权平均价输出了虚高价格。这说明，TWAP 挡不住有资本的多区块操纵。窗口长度和池子深度，要一起评估。"]],["防御清单",["防御清单六条。第一，不用现货价、合约余额，或者可被捐赠改变的份额价格，作为关键定价依据。第二，如果必须用 AMM 价格，用足够长窗口的时间加权平均价，并且评估池子深度。","第三，读链下预言机时，检查正值、时效、上下限和精度，二层网络上还要检查排序器状态。第四，关键资产用多个价格源，偏离超过阈值就暂停。","第五，对低流动性的抵押品，设供应上限和更低的抵押率。第六，把一笔交易内借款又还款这种模式，纳入监控告警。这类模式本身就是闪电贷攻击的指纹。"]],["练一练",["来练一练。一个协议用30分钟的时间加权平均价。安全吗？攻击者能操纵它吗，代价是什么？","参考答案。如果池子够浅，能。攻击者在连续多个区块持续买入，就能把30分钟窗口的均价拉高。代价是多区块持仓的价格风险，以及套利者来回补。但 Inverse 的案例证明，在浅池里，这个代价可能很低。结论是，时间加权平均价要和池子深度一起评估，它不是万能的。"]],["小结与预告",["小结三点。第一，闪电贷让本金不再是攻击门槛。任何一笔交易内可变的读数，都不能用来定价。","第二，三类价格源各有短板。读链下预言机，检查正值、时效、上下限和精度。","第三，工程上要回答价格错了、价格停了会怎样。二层网络检查排序器，时间加权平均价要配合池子深度一起评估。","下一集讲 MEV 与签名安全。交易顺序和签名都可以被别人利用。三明治攻击，签名的五个要素，以及 ecrecover 返回零地址的陷阱。下集见。"]]]},"deck":{"src":"../decks/skeuomorphic/ch08/index.html","scenes":[["把汇率当成美元价格",["2026 年 2 月 15 日，Base 链上的借贷协议 Moonwell，执行了一份治理提案。","提案生效后，cbETH 的美元价格，只用了 cbETH 对 ETH 的汇率。","它把一个汇率，当成了美元价格。"]],["约 2200 美元只值约 1.12",["一枚约 2200 美元的 cbETH，在合约眼里，只值约 1.12 美元。","清算机器人立刻动手，清算了约 1096 枚 cbETH。","按 The Block 的报道，协议留下约 178 万美元坏账。"]],["先猜一道题",["先猜一道题。","这个价格大于 0，而且刚刚更新过。","只检查正值和时效，能拦住它吗？"]],["不能：价格新，但错",["不能。两项检查，都会通过。","价格是新的，也是错的。","合约读到的价格，可能被推高，可能停住，也可能配错。","问题是，错的时候，哪一行代码来拦住它。"]],["预言机",["先说两个词。","预言机，是把链外或别的合约里的数据，交给合约使用的机制。","它交出的，通常是价格。"]],["闪电贷：本金不再是门槛",["闪电贷，是借款、使用、还款，都在同一笔交易里完成的贷款。","交易结束时没有归还，整笔交易回滚，就像什么都没发生。","所以出借方没有风险，也不需要抵押。","这意味着，本金不再是门槛。","任何人都能在一笔交易里，借到闪电贷池的全部流动性。"]],["比方：按菜市场价估值的当铺",["打个比方。一家当铺，按隔壁菜市场的最新成交价，给黄金估价。","你从朋友那里，借来 1 亿。","在菜市场用离谱的高价，买下全部黄金。","再拿 1 克黄金去当铺。","当铺按刚才的成交价，估值 100 万，借给你 75 万。"]],["当铺只剩 1 克普通黄金",["你把黄金卖回菜市场，把 1 亿还给朋友。","你赚到 75 万，减去买卖的损耗。","当铺手里，只剩 1 克普通价格的黄金。","比喻在这里不成立：现实中，这几步要好几天。","链上，它们发生在同一个区块的同一笔交易里。没有人来得及反应。"]],["一笔交易里能改变什么",["那么，一笔交易里，攻击者能改变什么？","他能把任何 AMM 池子的现货价，推到想要的位置，只要付得起滑点。","他能直接往合约里转入资产，改变余额读数。","他能把这些操作，和对目标协议的调用，任意组合。"]],["可变读数 = 攻击者输入",["于是有一条规则：一笔交易内可变的读数，都是攻击者的输入参数。","池子的储备比例，可变。按储备算出的 LP 代币价格，可变。","合约的余额，可变。读余额算出的金库份额价格，可以被捐赠改变。","时间加权平均价，当前区块很难撼动。链下聚合的价格，一笔交易改不动。","但它们会过时，也会撞上上下限。"]],["用 AMM 现货价定价",["最常见的错误，是用 AMM 的现货价定价。","恒定乘积池里，两种资产的数量相乘，保持不变。","现货价，就是两边储备的比值。"]],["再猜一道题",["再猜一道题。这是示例，忽略手续费。","池子里有 1000 个 ETH，和 200 万 USDC。现货价是 2000。","有人用 400 万 USDC，买入 ETH。","现货价会变成多少？"]],["约 18000：一笔交换涨 9 倍",["大约 18000。USDC 储备变成 600 万，ETH 只剩约 333 个。","价格涨到原来的 9 倍。只用了一笔交换。","现在看一个借贷合约。","它读取池子的储备，用两边的比值当价格。","抵押品价值，等于数量乘这个价格。最多借出价值的百分之 75。这也是示例。"]],["一笔交易里的五个动作",["把这几步串起来，是一笔交易里的五个动作。","第一，借出闪电贷，在池子里买入代币，把现货价推高。","第二，存入少量代币，作为抵押。","第三，协议读取储备，按虚高的价格，借出大笔资金。","第四，卖回代币。","第五，归还闪电贷和手续费。"]],["协议留下坏账",["交易结束，抵押品的真实价值，远低于借款。协议留下坏账。","利润，是借出的金额，减去两次交换的滑点、手续费，和闪电贷费用。","池子越浅，推高价格越便宜。长尾资产和低流动性代币，风险最高。"]],["三起事件，同一根因",["这类事件，在公开报道里反复出现。","2020 年 2 月的 bZx，是最早被广泛报道的闪电贷价格操纵之一，两次合计约 95 万美元。","2021 年 5 月，BNB Chain 上的 PancakeBunny，按池子储备计算 LP 代币价值，损失约 4500 万美元。","2021 年 10 月，Cream Finance 用金库份额价格，给抵押品估值。","攻击者向金库捐赠，抬高份额价格。损失约 1.3 亿美元。","三起事件，根因一样：价格来自一笔交易就能改写的数据。"]],["第一类：TWAP",["换掉现货价，有三类选择。","第一类，AMM 的时间加权平均价，简称 TWAP。","它把一段时间里的价格，按时间加权求平均。","一笔交易推高的价格，在平均里只占一小段，几乎不起作用。"]],["TWAP 的代价",["代价是，窗口越长，价格越滞后。","而低流动性的池子，仍然可以被连续多个区块持续操纵。","在 PoS 下，同一个提议者连续出块时，这种操纵会更便宜。"]],["Inverse Finance：多区块操纵",["2022 年 4 月的 Inverse Finance，就是这样。","攻击者没有用闪电贷。他投入自有资金，持续推高浅池里的 INV 价格。","同时用垃圾交易抑制套利，让 TWAP 输出虚高的价格。","按公开报道，借走约 1560 万美元。","TWAP 挡得住一笔交易，挡不住有资本的多区块操纵。"]],["第二类：链下聚合预言机",["第二类，链下聚合预言机，比如 Chainlink。","价格在链下聚合，再写上链。一笔交易改不动它。","它按心跳和偏离阈值更新。","心跳，是价格不变时，也必须更新的最长间隔。","它的风险换了方向：价格可能过时，可能撞上上下限，节点和喂价方也可能失效。"]],["第三类：多源组合",["第三类，多源组合。几个价格源互相比较，偏离超过阈值就暂停。","它更稳，但实现复杂。几个源意见不一时听谁的，要提前想好。","顺带一句，LP 代币也不能按储备乘现货价来定价。","要用外部预言机的价格和不变量，反推出公平储备，再算 LP 的价值。"]],["没有完美的预言机",["没有完美的预言机。","工程上要回答两个问题。","价格错了，会怎样？价格停了，会怎样？"]],["读取时的四项检查",["选了链下预言机，读取时还要做四项检查。","一，价格大于 0。","二，时效：现在的时间减去更新时间，不超过这个喂价的心跳。","三，上下限：价格落在合理的区间里。","四，精度：从喂价读取小数位数，不要写死 8。"]],["LUNA 喂价停在下限",["为什么要查上下限？看一个案例。","2022 年 5 月，LUNA 崩盘。","公开报道称，Chainlink 的 LUNA 喂价，设了一个最低价：0.10 美元。","市场价跌到远低于 0.10 美元，喂价停在下限附近。"]],["抵押品被高估约 10 倍",["假设市场价是 0.01 美元。这是示例。","喂价仍然返回约 0.10 美元。抵押品被高估约 10 倍。","价格是正的，时间戳也可能是新的。前两项检查，全部通过。"]],["Venus 损失约 1100 万美元",["BNB Chain 上的 Venus，仍按约 0.1 美元给 LUNA 抵押品估值。","有人在市场上低价买入 LUNA，存进去，借出别的资产。","按公开报道，协议损失约 1100 万美元。"]],["读取陷阱：时间戳与心跳",["还有四个读取陷阱。","第一，不要用 latestAnswer 判断价格新不新鲜。","Chainlink 的 API 文档写明，它不含时间戳。改用 latestRoundData。","第二，每个喂价的心跳不同。不要给所有资产，用同一个延迟上限。"]],["降级路径与拉取式预言机",["第三，喂价失效时，要有降级路径。","用 try catch 包住读取，切到备用价格源，或者暂停。不要让清算全部回滚。","第四，拉取式预言机，由用户在交易里提交签名价格。","提交者可以挑一个对自己有利的更新。","按 Pyth 文档，合约要自己检查价格的时间戳和置信区间。"]],["L2：排序器宕机",["在 L2 上，要多查一项：排序器是否在线。","排序器宕机时，喂价交易上不了链，价格停在宕机前。","恢复后的第一批区块里，清算机器人和普通用户同时涌入。","能通过 L1 强制提交交易的少数人，占了先机。"]],["排序器状态 + 宽限期",["按 L2BEAT 截至 2026 年 11 月的页面，Mantle 排序器宕机时，从 L1 强制提交，最长要等 12 小时。","做法是读取 Chainlink 提供的排序器在线状态喂价。","恢复后设一段宽限期，比如 1 小时，这是示例。","宽限期内，暂停清算和新借款。"]],["写合约的人",["最后，每个人今天就能做一件事。","写合约的人，列出所有价格来源，标出哪些在一笔交易内可变。","用储备、余额、份额价格来定价的地方，全部换掉。"]],["审计与普通用户",["审计的人，逐个检查预言机读取：正值、时效、上下限、精度。L2 上，加上排序器状态。","再看低流动性抵押品，有没有供应上限，和更低的抵押率。","普通用户，先看协议用什么价格源。依赖单一 DEX 现货价的，风险更高。","用低流动性代币做抵押，保持更高的健康度。极端行情里，先降杠杆，不要等清算。"]],["先确认窗外是真的",["回到开头。一个大于 0、刚刚更新的价格，为什么还会错？","因为正值和时效，只证明价格存在，而且是新的。不证明它对。","要拦住它，需要合理的上下限，或者和第二个价格源比较。","预言机配置的变更，要和合约代码一样测试。上线前，用真实喂价核对美元价格。","价格是合约看世界的窗口。先确认，窗外是真的，再按它放贷。"]]]},"d3b":{"src":"../decks/3b1b/ch08.html","scenes":[["Moonwell：约 2,200 美元报成约 1.12",["2026 年 2 月 15 日，Moonwell 在 Base 上执行了一个治理提案。","之后，cbETH 的美元价格只用了 cbETH 对 ETH 的汇率。约 2,200 美元的 cbETH，被报成了约 1.12 美元。"]],["价格是新的，也是错的",["清算机器人清算了 1,096.317 枚 cbETH，协议留下约 178 万美元坏账。","这个价格大于 0，而且刚刚更新。它是新的，也是错的。","问题来了：合约读到的价格，能信吗？尤其是，一笔交易里就能改写的价格。"]],["预言机与闪电贷",["先认识两样东西。预言机：把链外或其他合约里的数据，通常是价格，提供给合约使用。","闪电贷：借款、使用、还款都在同一笔交易里完成。最后没还，整笔交易回滚。所以出借方没有风险，也不需要抵押。"]],["比方：当铺按菜市场成交价估值",["打个比方：一家当铺，按隔壁菜市场的最新成交价给黄金估价。","你从朋友那里借来一亿，在菜市场用离谱的高价买下全部黄金。","然后拿 1 克黄金去当铺，当铺按刚才的成交价估值 100 万，借给你 75 万。你把黄金卖回菜市场，还钱给朋友。"]],["比方不成立处：链上没人来得及反应",["比方不成立的地方是：现实中这些步骤要几天。链上，它们发生在同一笔交易里，没有人来得及反应。"]],["攻击者在一笔交易里能做什么",["所以，威胁模型要这样写。攻击者在一笔交易里，可以借到闪电贷池的全部流动性。","可以把任何 AMM 池子的现货价，推到任意位置，只要付得起滑点。也可以直接往合约里转资产，改变余额读数。","结论是：一笔交易内可变的读数，都是攻击者的输入参数。"]],["哪些读数可变，哪些不可变",["池子的储备比例、按储备算的 LP 价格、读余额的金库份额价格，都在这一边。","时间加权平均价，当前区块影响很小。链下聚合的价格，一笔交易改不了，但它可能过时，或者卡在上下限。"]],["恒定乘积池：现货价推高 9 倍",["看现货价有多容易推。恒定乘积池子里，x 乘 y 等于常数 k，现货价是两种储备之比。","举个示例：池子里有 1,000 ETH 和 200 万 USDC。现货价是每 ETH 2,000 USDC。","攻击者用 400 万 USDC 买入 ETH。USDC 储备变成 600 万。","k 不变，ETH 储备就是 20 亿除以 600 万，约 333.3 枚。","现货价变成 600 万除以 333.3，约 18,000 USDC，是原来的 9 倍。这里忽略了手续费。"]],["借贷协议按被推高的价格放贷",["把它放进借贷协议。协议直接用池子储备算价格，抵押率 75%，这是示例。","攻击合约先从闪电贷池借出一大笔 USDC，在池子里买入代币，把代币的现货价推高好几倍。","然后存入少量代币做抵押。借贷协议去读池子储备，读到的是被操纵的价格，于是按虚高的估值借出 USDC。"]],["还款后留下坏账；池子越浅越危险",["攻击者把代币卖回池子，归还闪电贷和手续费。抵押品的真实价值远低于借款，协议留下坏账。","利润等于借出的金额，减去两次交换的滑点和手续费，再减去闪电贷费用。池子越浅，推价越便宜，长尾资产风险最高。"]],["现货价、TWAP 与 Inverse 事件",["换成别的价格源呢？把三类放在一起比。","现货价：一笔交易就能改，多个区块也能改。","时间加权平均价，挡得住单笔操纵；能不能挡住多区块操纵，取决于窗口长度和池子深度。窗口越长，价格越滞后。","2022 年 4 月的 Inverse Finance，没有用闪电贷。攻击者投入自有资金，连续多个区块推高浅池里的价格，还用垃圾交易压制套利，让 TWAP 输出虚高价格，借走约 1,560 万美元。"]],["没有完美的预言机",["链下聚合价格抗单笔、也抗多区块操纵，但会过时，会触发上下限，节点也可能失效。","所以没有完美的预言机。工程上要回答两个问题：价格错了会怎样？价格停了会怎样？"]],["读取链下预言机的四项检查",["读取链下预言机时，至少检查四件事：价格大于 0；在心跳时间内更新过；落在合理的上下限之内；精度从喂价读取。"]],["LUNA：喂价的下限反而高估抵押品",["为什么要查上下限？看 2022 年 5 月的 LUNA。公开报道称，LUNA 的喂价设置了最低价 0.10 美元。","LUNA 跌到 0.01 美元时，喂价仍返回约 0.10 美元。抵押品被高估了大约 10 倍。","BNB Chain 上的 Venus 仍按约 0.1 美元给 LUNA 估值。有人低价买入、存进去借出其他资产，协议损失约 1,100 万美元。"]],["L2 上多查一件事：排序器在线吗",["在 L2 上还要多查一件事：排序器在不在线。它宕机时，喂价交易上不了链，价格停在宕机前。","恢复后，设一段宽限期，比如 1 小时，这是示例。宽限期内暂停清算和新借款。"]],["答案：一笔交易内可变的读数不能信",["回到开头的问题：合约读到的价格，能信吗？","一笔交易内就能改写的读数，不能信。现货价、储备、余额，都是攻击者的输入参数，不能拿来做关键定价。","一笔交易改不了的价格，也要验证。Moonwell 的价格大于 0，也刚更新，正值和时效两项检查都会通过。"]],["拦住它，以及成立条件",["要拦住它，需要合理的价格上下限，或者和第二个价格源比较。预言机配置的变更，要像代码一样测试，上线前用真实喂价核对美元价格。","成立条件：先列出协议读的每一个价格，标注它在一笔交易内能不能变，再回答错了怎样、停了怎样。"]]]}}},{"id":"09","title":"MEV 与签名安全：顺序可以被买，签名可以被重放","md" 5,267.44,"nonce 仍要自己维护"],[269.14,272.69,"验证签名时，还有三个经典陷阱"],[273.14,277.01,"第一，ecrecover 在签名无效时不会回滚"],[277.01,281.19,"而是返回零地址。如果管理员地址没有初始化"],[281.19,284.54,"默认也是零，任何垃圾签名都能通过"],[284.99,288.97,"第二，签名可塑性：同一条消息，r 和 s"],[288.97,292.12,"与 r 和 n 减 s，都是有效签名"],[292.12,296.51,"如果拿签名字节当已使用标记，攻击者翻转 s"],[296.51,298.26,"就得到一个新签名"],[298.71,302.37,"修法是用 nonce 或消息哈希做标记"],[302.37,304.83,"并使用拒绝高 s 值的库"],[305.28,310.55,"第三，encodePacked 碰撞：ab 加 c，和 a 加 bc"],[310.55,314.87,"拼出来一模一样。签名里有多个动态类型时"],[314.87,316.47,"用 abi.encode"],[318.17,321.26,"签名再安全，签名人也可能签错东西"],[321.26,323.32,"2025 年 2 月的 Bybit"],[323.32,326.08,"攻击者篡改了 Safe 钱包的前端"],[326.08,329.33,"只针对 Bybit 的冷钱包多签地址生效"],[329.78,333.51,"签名人看到的是一笔普通转账。实际签下的"],[333.51,336.4,"是 delegatecall 到攻击者合约"],[336.4,338.56,"把多签钱包的实现替换掉"],[339.01,344.68,"多签合约只校验签名是否对应交易摘要、数量是否够阈值"],[344.68,349.45,"签名真实有效，只是内容不是签名人以为的内容"],[349.9,355.05,"阈值满足后，攻击者转走约 40 万 ETH 及其他资产"],[355.05,356.89,"总计约 15 亿美元"],[357.34,359.52,"多签防的是单把私钥被盗"],[359.52,362.69,"防不了所有签名人看到同一个假界面"],[362.69,366.89,"delegatecall 是高危信号，正常转账不需要它"],[367.34,372.41,"防御：用硬件钱包逐字段核对，用独立工具解码交易数据"],[372.41,378.02,"对 delegatecall 和修改实现地址的操作设白名单或额外审批"],[379.72,384.42,"回到开头的问题：你最后会收到多少 USDC？"],[384.87,390.05,"大约 19,000，也就是你允许的最差价格。你设的滑点"],[390.05,392.22,"就是搜索者利润的上限"],[392.67,398.27,"顺序可以被买：交易在打包前是公开的，排序权属于别人"],[398.27,403.2,"所以滑点要合理，合约里的最少输出要由用户给出"],[403.65,408.55,"签名可以被重放：签名用过之后还在。它能用几次"],[408.55,412.12,"在哪条链、对哪个合约、到什么时候"],[412.12,414.12,"全看你签进去的字段"],[414.57,420.07,"成立条件：签名之前，看得懂你签的是什么。看不懂"],[420.07,422.7,"只显示哈希的盲签，不签"],[423.15,427.88,"下一集：留给自己的维修门，也是留给攻击者的门"]],"ch":[]},"talk":{"src":"slides/EP09-mev-signatures.html","scenes":[["开场",["大家好，欢迎来到主线第9集，MEV 与签名安全。一句话理解分两半。交易在被打包之前是公开的，打包的顺序由别人决定。签名在被使用之后仍然存在，能否再次使用，取决于你签了什么。","第一半是 MEV，最大可提取价值。区块生产者或者搜索者，通过调整、插入、排除交易，获得额外收益。","第二半是签名安全。链下签名用过之后不会消失，如果它绑定的字段不全，就能被重放。本集讲 MEV 的三种形态、防御，签名必须绑定的五个字段，以及签名界面的安全。"]],["拍卖会与支票",["打个比方。MEV 像拍卖会上，你举牌之前就大声说出了你的最高出价。旁边的人抢先用低一点的价格买下，再加价转卖给你。这是三明治。","签名重放，像你签了一张付100元的支票，却没写日期、没写收款银行、没写支票编号。拿到支票的人可以复印它，去每一家银行各兑一次。","比喻不准的地方在于，拍卖会上你能看到谁插了队。链上的三明治交易，和你的交易在同一个区块里，普通用户往往只看到成交价比预期差了一点。"]],["MEV 的三种形态",["MEV 有三种形态。抢跑，攻击者把自己的交易排在受害者前面，利用受害者交易里的信息，比如先到先得的奖励。受害者是原来的交易者。","三明治，攻击者在受害者前面买，后面卖，把受害者夹在中间，利用的是受害者设置的滑点容忍度。","尾随，攻击者把交易排在受害者后面，利用受害者交易制造出的价差或者清算机会。尾随通常没有直接的受害者，比如正常的套利和清算。重点看三明治。"]],["三明治攻击",["看三明治的机制。受害者向公开内存池提交一笔交易，用10个 ETH 换 USDC，设置最少得到19000 USDC，也就是允许5%的滑点。这笔交易在打包前是公开的。","搜索者发现了它，构造一个捆绑，顺序是，自己先买，受害者的交易夹在中间，自己最后卖。","第一步，搜索者买入，推高了价格。第二步，受害者以更差的价格成交，刚好满足最小输出19000。注意，受害者的交易没有失败，只是以允许范围内最差的价格成交了。","第三步，搜索者卖回，赚取差价。搜索者的最大利润，由受害者的最小输出决定。滑点设得越宽，被夹得越狠。如果受害者设的是19800，搜索者的操作空间就小得多。"]],["MEV 防御",["防御分四层。用户层，设置合理滑点，用私有交易通道，这样搜索者在打包前看不到交易。前端层，默认滑点要保守，按池子深度动态计算。","合约层，所有交换函数必须接受最小输出和截止时间两个参数。但注意一个关键点，不要在合约内部用现货价计算最小输出，那等于没有保护，因为现货价本身就能被操纵。协议设计层，可以用提交揭示，或者批量拍卖，同一批订单统一价格清算。","最常见的错误是，金库、自动复投合约、清算合约，在内部调用 DEX 时，把最小输出写成零。这等于告诉全世界，我接受任何价格，是三明治的活靶子。"]],["三条链的排序机制",["三条链的排序机制不同。BNB Chain 由验证者轮流出块，出块约0.75秒，有公开内存池和区块构建者市场。出块更快，抢跑窗口更短，但三明治依然存在。","TRON 由27个超级代表轮流出块。它的能量价格是固定的网络参数，没有优先费，所以不能靠出更高的 gas 价来插队。但出块者本身，仍然可以决定顺序。","Mantle 是单一的中心化排序器，按自己的规则排序。L2BEAT 列出的风险是，运营者可以抢跑用户交易来提取 MEV。所以，没有公开内存池，不等于没有 MEV，它只是把排序权从市场，集中到了一个运营者手里。用户依赖运营者的诚实。"]],["签名必须绑定的五个字段",["链下签名在 DeFi 里很常见，免 gas 授权、元交易、订单、跨链验证、空投凭证。一份安全的签名，必须绑定五个字段。第一，nonce，每用一次递增。缺了它，同一个签名可以在同一个合约反复提交。","第二，chainId，链的编号。缺了它，签名在分叉链或者多链部署上同样有效，可以跨链重放。","第三，验证合约地址。缺了它，同一份代码部署两次，签名在两个合约上都有效，可以跨合约重放。","第四，deadline，过期时间。缺了它，签名永久有效，用户即使改了主意，签名仍能被用。第五，函数意图。缺了它，为 A 函数签的数据，被拿去调用 B 函数。","EIP-712 标准，把链 ID 和合约地址合成一个域分隔符，把消息结构合成一个类型哈希，正确使用就能一次解决后面四个字段。加上 nonce，五个字段就齐了。"]],["签名的三个经典陷阱",["签名有三个经典陷阱。第一，ecrecover 返回零地址。签名无效时，它不回滚，而是返回零地址。如果你比较的 admin 变量从没初始化，默认也是零，那么任何无效签名都能通过。所以一定要加零地址检查。","第二，签名可塑性。对同一个消息，一个签名和它的翻转版本都有效。如果你用签名本身的字节做已使用标记，攻击者翻转一下，就得到一个查不到的新签名。修复是用 nonce 或消息哈希做标记，并使用拒绝高 s 值的库。","第三，编码碰撞。encodePacked 把 ab 和 c 拼起来，和把 a 和 bc 拼起来，结果相同。签多个动态类型时，用 abi.encode，不用 encodePacked。"]],["permit 的两面",["免 gas 授权 permit 很方便，但有两面。第一是抢跑型拒绝服务。用户提交一个组合交易，先授权再存款，签名在里面。攻击者从内存池复制这个签名，抢先单独调用授权函数。授权的 nonce 被用掉了，用户的交易因此回滚。修复是把授权包在 try catch 里，失败后检查授权额度是不是已经够了。","第二是钓鱼。permit 是链下签名，不花 gas，钱包界面常常只显示一段十六进制数据，用户看不懂。用户签下后，攻击者可以随时拿去执行。所以钱包解析签名内容、显示人类可读信息，很重要。"]],["TRON 上的签名差异",["部署到 TRON，签名有几个差异。第一，TRON 的链 ID 返回的是创世区块的后4字节，主网是一个很大的数。域分隔符仍然能区分链，但不要在代码里写死以太坊风格的小整数链 ID。","第二，TRON 账户没有 nonce，交易层用一种基于区块的机制防重放，默认60秒过期。但这是交易层的，合约层签名的防重放，仍然要你自己实现 nonce。","第三，地址在链边界带一个前缀字节，VM 内部是20字节。签名工具链和合约对地址的编码必须一致。第四，第5集讲过 TRON 账户多权限，一个地址可能需要多个签名人。合约里的 ecrecover 只能验证单个私钥签名，TRON 提供了一个预编译合约来验证账户多签。"]],["签名界面：Bybit",["签名本身再安全，签名人也可能签错东西。看 Bybit，以下据公开分析。攻击者篡改了多签前端的代码，只针对 Bybit 冷钱包的多签地址生效。","签名人看到的，是一笔正常的转账。但实际签名的交易，是一个委托调用，指向攻击者的合约，要把多签钱包的实现替换成恶意合约。","多签阈值满足后，钱包的实现被替换，攻击者转走约40万 ETH 及其他资产，总计约15亿美元。多签防的是单把私钥被盗，它防不了所有签名人看到同一个假界面。","防御是什么？用硬件钱包逐字段核对交易，用独立工具解码调用数据。看到委托调用，或者修改实现地址的操作，就是高危信号，要设白名单或额外审批。正常转账不需要委托调用。同类事故不罕见，2024年 WazirX 也是这样，约2.3亿美元。这部分在评估篇第3集深入讲过。"]],["审计检查点",["审计检查点八个。第一，交换函数有最小输出和截止时间，而且不是在合约内部用现货价算出来的。第二，签名验证用 EIP-712，包含五个字段。","第三，用 OpenZeppelin 的 ECDSA 库，拒绝零地址和高 s 值。第四，已使用标记基于 nonce 或消息哈希，不基于签名字节。","第五，permit 调用有抢跑容错。第六，动态类型的签名用 abi.encode。","第七，部署到 TRON 时，签名工具链和合约对链 ID、地址格式的处理一致。第八，特权操作的签名流程，有独立的交易解码与核对步骤。"]],["练一练",["来练一练。一个自动复投金库，每小时把奖励代币换成本金，最小输出用池子当前的现货价乘以99%计算。这个保护有效吗？","参考答案。无效。因为现货价本身可以被同一笔交易操纵。攻击者先推高或压低现货价，最小输出就跟着变成一个离谱但自洽的值，保护形同虚设。这正是第6集合约层那条警告。修复是，最小输出用外部的抗操纵价格计算，或者由发起方在链下传入。"]],["小结与预告",["小结三点。第一，交换函数必须有最小输出和截止时间，而且不能在合约内部用现货价计算。","第二，签名绑定五个字段，用 EIP-712 加 ECDSA，检查零地址和高 s 值。","第三，没有公开内存池不等于没有 MEV。签名界面被篡改，比私钥被盗更难防。","下一集讲可升级合约与代理，留给自己的维修门，也是留给攻击者的门。三种代理模式，存储冲突，初始化，以及 Nomad 那个一个零值引发的事故。下集见。"]]]},"deck":{"src":"../decks/skeuomorphic/ch09/index.html","scenes":[["滑点 5%：最少 19000",["你在一个去中心化交易所，用 10 个 ETH 换 USDC。","池子现价，1 个 ETH 换 2000 USDC。这是示例。","你把滑点设成 5%。","意思是，最少拿到 19000 USDC。少于这个数，交易就回滚。"]],["交易被夹在中间",["交易发出去，先进入公开的内存池，排队等着打包。","有人在打包之前，读到了它。","他把你的交易，夹在自己的两笔交易中间。"]],["先猜一道题",["先猜一道题。","你最少收到多少？他能让你收到更少吗？"]],["按最差价格成交",["你最少收到 19000。他不能让你更少。","低于这个数，你的交易回滚，他也赚不到钱。","所以，他会把价格推到刚好够 19000 的位置。","你的交易没有失败。它只是按你允许的最差价格，成交了。","滑点设 5%，就可能真的付 5%。"]],["顺序与签名",["交易在打包之前是公开的，顺序由别人决定。","签名在用过之后仍然存在。能不能再用，取决于你签了什么。"]],["MEV：排序权可以被购买",["先说一个词：MEV，最大可提取价值。","它指的是，区块生产者或者搜索者，通过安排交易顺序、插入或排除交易，拿到的额外收益。","搜索者，是专门寻找这类机会，把交易捆成一组提交的人或程序。","搜索者把捆绑包交给区块构建者，构建者再把整个区块，卖给提议者。","这叫提议者与构建者分离。结果是，排序权可以被购买。"]],["形态一：抢跑",["MEV 有三种形态。","第一种，抢跑：攻击者排在你前面。","比如一道谜题，第一个提交答案的人领奖。机器人复制你的答案，出更高的小费，先成交。"]],["形态二三：三明治与尾随",["第二种，三明治：攻击者先买，你再买，攻击者最后卖。","他利用的，是你设定的滑点容忍度。","第三种，尾随：攻击者排在你后面，吃掉你的交易留下的套利或清算机会。","尾随通常没有直接的受害者。"]],["三明治：捆成一包",["回到三明治，拆开看。","你的交易进入公开内存池。","搜索者发现它，捆成一包：自己买入，你的交易，自己卖出。","构建者按这个顺序打包。"]],["最小输出决定被夹多狠",["搜索者先买，把价格推高。","你按更坏的价格成交，刚好满足最小输出。","搜索者再卖回去，赚走中间的利润。","他最多能赚多少，由你的最小输出决定。滑点设得越宽，被夹得越狠。"]],["比方：喊出最高出价",["打个比方。你在拍卖会上举牌之前，大声说出了自己的最高出价。","旁边的人抢先用低一点的价格买下，再加价转卖给你。","比喻在这里不成立：拍卖会上，你能看到谁插了队。","链上的三明治，和你的交易在同一个区块里。普通用户往往只看到，成交价比预期低。"]],["用户、前端、合约三层",["怎么防？分四层。","用户这一层，把滑点设得合理。大额交易，走私有交易通道，比如 Flashbots Protect 一类的服务。","交易不进公开内存池，搜索者在打包之前，就看不到它。","前端这一层，默认滑点要保守，按池子的深度来计算。","合约这一层，所有交换函数，都要接受最小输出和截止时间两个参数。"]],["合约里的常见错误",["常见的错误，是在合约内部，用现货价算出最小输出。","那个现货价，在同一个区块里就能被推高。按它算出的保护，等于没有保护。","更糟的写法，是把最小输出直接写成 0。","这等于告诉所有人：我接受任何价格。金库、自动复投合约、清算合约，常犯这个错误。"]],["协议设计：提交揭示与批量拍卖",["协议设计这一层，有两种做法。","一是提交揭示：先提交答案的哈希，下一阶段再公开答案。","这个承诺，必须绑定发送者的地址。不然，机器人复制你的承诺，也能完成揭示。","二是批量拍卖：同一批订单，按统一价格清算。"]],["BNB Chain：三明治依然存在",["顺序由谁决定，每条链也不一样。","BNB Chain，验证者轮流出块。2026 年 1 月，出块间隔缩短到 0.45 秒。","抢跑的窗口更短，但它有公开内存池和构建者市场，三明治依然存在。"]],["TRON：不能出价插队",["TRON，27 个超级代表轮流出块。","按 TRON 官方文档，它没有优先费，不能靠出更高的价格插队。","但出块的人，仍然可以决定顺序。"]],["Mantle：排序权集中",["Mantle，只有一个中心化排序器。","L2BEAT 列出的风险是：运营者可以抢跑用户交易，提取 MEV。","没有公开内存池，不等于没有 MEV。","它只是把排序权，从市场集中到一个运营者手里。"]],["一份签名能用几次",["再看另一半：签名。","很多操作不在链上发起，而是在链下签名，再交给合约验证。","免 gas 授权 permit、元交易、订单簿挂单、跨链桥验证者签名、空投领取凭证，都是这样。","问题是，一份签名，能被用几次？"]],["比方：没写细节的支票",["打个比方。你签了一张支付 100 元的支票。","没写日期，没写收款银行，没写支票编号。","拿到它的人，可以复印很多份，去每一家银行各兑一次。","比喻在这里不完全成立：银行会自己记下兑过的支票。合约不会，除非代码让它记。"]],["五个字段：nonce 与链 ID",["一份安全的签名，要绑定五个字段。","第一，nonce，一次性编号。缺了它，同一份签名可以在同一个合约反复提交。","第二，链 ID。缺了它，签名在分叉链和多链部署上同样有效。"]],["合约地址、截止时间、意图",["第三，合约地址。缺了它，同一份代码部署两次，签名在两个合约都有效。","第四，截止时间。缺了它，签名永久有效。你改主意以后，它照样能被使用。","第五，函数意图，也就是类型哈希。缺了它，给 A 函数签的数据，会被拿去调用 B 函数。"]],["先猜一道题",["先猜一道题。","一张领取凭证，绑定了 nonce，没有绑定链 ID。","同一份合约，用相同的地址，部署在以太坊和 BNB Chain。","凭证在以太坊用过之后，还能在 BNB Chain 领取吗？"]],["能：用 EIP-712 解决",["能。两条链上的 nonce 各自计数，BNB Chain 上还是 0。","摘要里没有链 ID，两条链算出的摘要完全相同。","解决办法是 EIP-712。","它把名称、版本、链 ID、合约地址，合成一个域分隔符。","再把消息的结构，合成类型哈希。","用对 EIP-712，后四个字段一次解决。nonce 还要合约自己维护，每用一次，加一。"]],["陷阱一：ecrecover 返回零地址",["字段齐了，验签的代码，还有三个经典陷阱。","第一，ecrecover 遇到无效签名，不会报错，而是返回零地址。","如果管理员地址没有初始化，它默认就是零。任何一个无效签名，都能通过。"]],["陷阱二：签名可塑性",["第二，签名可塑性：同一条消息，存在两份都有效的签名。","如果合约拿签名本身，标记已使用，翻转签名里的一个数值，就成了一份新签名。","修复是，用 nonce 或消息哈希做标记，再用拒绝这种翻转的库，比如 OpenZeppelin 的 ECDSA。"]],["陷阱三：编码碰撞",["第三，编码碰撞。紧凑编码会把相邻的动态数据，直接拼在一起。","ab 加 c，和 a 加 bc，结果完全相同。签多个动态类型时，用标准编码。","还有一点。合约钱包没有私钥，要用 ERC-1271 的接口校验，不能只靠 ecrecover。"]],["permit：抢跑型拒绝服务",["再看 permit 的两面。","一面是抢跑型的拒绝服务。你提交的交易里，带着 permit 签名。","别人从内存池复制这份签名，抢先单独提交。你的交易因为 nonce 已用，回滚。","修复是，把 permit 包在 try catch 里。失败后，检查授权额度是否已经足够。"]],["签名人也可能签错",["另一面是钓鱼。permit 在链下签，不花 gas，钱包常常只显示一串十六进制。","签下之后，对方可以随时拿去执行。","签名再安全，签名人也可能签错东西。","2025 年 2 月，交易所 Bybit 的冷钱包多签被盗。","按 Sygnia、Verichains 等公开分析，攻击者篡改了 Safe Wallet 的前端，只对 Bybit 的多签地址生效。"]],["签名是真的，内容是假的",["签名人看到的，是一笔普通转账。","实际签下的，是一次 delegatecall，把钱包的实现，换成恶意合约。","多签合约只校验签名对不对、数量够不够。签名是真的，内容不是签名人以为的内容。","按事发时估值，损失约 15 亿美元。"]],["多签防不了同一个假界面",["多签防的是一把私钥被盗，防不了所有签名人，看到同一个假界面。","2024 年 7 月，印度交易所 WazirX 的多签冷钱包，也是这样。","界面上是日常交易，硬件钱包签下的，却是升级多签的恶意数据。按公开分析，损失约 2.3 亿美元。","防御有三条。用硬件钱包逐个字段核对。用独立工具解码交易数据。","对 delegatecall 和修改实现地址的操作，设白名单或额外审批。"]],["写合约与审计",["最后，每个人今天就能做一件事。","写合约的人，检查每个交换函数：最小输出和截止时间，是不是由调用者传进来。","所有签名，用 EIP-712，带上 nonce 和截止时间。","审计的人，拿同一份签名提交第二次。第二次也成功，就是漏洞。","修复要两个结果：修复前，重放成功；修复后，被拦下。"]],["普通用户",["普通用户，大额兑换设合理的滑点，不用自动的高滑点，可以走私有交易通道。","签名前看清链 ID、合约地址、数额和期限。钱包只显示哈希，或者提示盲签，就不签。"]],["滑点是公开的最差报价",["回到开头。滑点设 5%，为什么可能真的付 5%？","因为交易在打包之前是公开的，滑点就是你公开的最差报价。","这在交易走公开内存池时成立。走私有通道，搜索者在打包前看不到它。","顺序可以被买，签名可以被重放。","签之前看清内容，发之前想好，谁会先看到它。"]]]},"d3b":{"src":"../decks/3b1b/ch09.html","scenes":[["10 ETH 换 USDC，滑点设 5%",["你在 DEX 上，用 10 ETH 换 USDC。池子现价是 1 ETH 换 2,000 USDC，这是一个示例。","你把滑点设成 5%，所以最少要收到 19,000 USDC。","你的交易进入公开的内存池。在它被打包之前，一个搜索者读到了它。","问题来了：你最后会收到多少 USDC？"]],["这一集的两句话，和 MEV",["先说这一集的两句话。交易在被打包之前是公开的，打包顺序由别人决定。","签名在被使用之后仍然存在，它能不能再被用一次，取决于你签了什么。","MEV，最大可提取价值：区块生产者或搜索者，通过调整、插入、排除交易获得的额外收益。"]],["两个比方：抢先拍卖，与没写日期的支票",["打个比方：你在拍卖会上举牌之前，大声说出了自己的最高出价。旁边的人抢先低价买下，再加价转卖给你。","签名重放像一张支票：只写了支付 100 元，没写日期、收款银行和编号。拿到的人可以复印，去每家银行各兑一次。"]],["比方不成立处：你看不到谁插了队",["比方不成立的地方：拍卖会上你能看到谁插了队。链上的三明治和你的交易在同一个区块里，你往往只看到成交价比预期差。"]],["三明治：买入，你的交易，卖出",["看三明治怎么做。搜索者把三笔交易捆绑交给区块构建者：自己买，你的交易，自己卖。","第一步，搜索者先买入，把价格推高。","第二步，你的交易以更差的价格成交。刚好满足最少 19,000 USDC，所以它没有失败。","第三步，搜索者卖回，赚走差价。"]],["滑点就是搜索者的利润上限",["搜索者不能让你收到更少：低于 19,000，你的交易回滚，他也赚不到钱。所以他把价格推到刚好 19,000 的位置。","按现价，10 ETH 约值 2 万 USDC。你设的 5% 滑点，就是他最多能拿走的约 1,000 USDC 空间。这里忽略了手续费和价格冲击。"]],["三种形态，用户怎么防",["MEV 有三种形态：抢跑，排在你前面；三明治，夹住你；尾随，排在你后面，吃你制造的价差。","用户这边：设置合理的滑点，大额交易走私有通道，让搜索者在打包前看不到它。"]],["合约要接受最少输出和截止时间",["合约这边：所有交换函数都要接受最少输出和截止时间。不要在合约内部用现货价算最少输出，那等于没有保护。","合约里写最少输出等于 0，等于告诉全世界：我接受任何价格。金库、自动复投和清算合约常犯这个错。"]],["提交-揭示；私有内存池不等于没有 MEV",["先到先得的奖励，可以用提交-揭示：先交答案的哈希，下一阶段再公开。哈希里要绑定提交者地址，否则机器人复制哈希也能揭示。","还要注意：没有公开内存池，不等于没有 MEV。像 Mantle 这样的单一排序器，只是把排序权集中到了一个运营者手里。"]],["绑定五个字段：先看 nonce 和链 ID",["现在看签名。一份安全的签名消息，至少要绑定五个字段。","第一，nonce。没有它，同一份签名可以反复提交。","第二，链 ID。没有它，签名在分叉链或多链部署上同样有效。"]],["例子：没绑链 ID，凭证在两条链上都能领",["看一个例子：领取凭证绑定了 nonce，没绑定链 ID。同一份合约以相同地址部署在以太坊和 BNB Chain。","在以太坊用过之后，BNB Chain 上的 nonce 还是 0，两条链算出的摘要相同。这张凭证，在 BNB Chain 上还能再领一次。"]],["其余三个字段，与 EIP-712",["第三，验证合约的地址，防止跨合约重放。第四，截止时间，防止签名永久有效。第五，函数意图，防止为 A 函数签的数据被拿去调用 B。","EIP-712 的域分隔符和类型哈希，正确使用时可以一次解决后四个字段。nonce 仍要自己维护。"]],["陷阱一：ecrecover 失败返回零地址",["验证签名时，还有三个经典陷阱。","第一，ecrecover 在签名无效时不会回滚，而是返回零地址。如果管理员地址没有初始化，默认也是零，任何垃圾签名都能通过。"]],["陷阱二：签名可塑性",["第二，签名可塑性：同一条消息，r 和 s，与 r 和 n 减 s，都是有效签名。如果拿签名字节当已使用标记，攻击者翻转 s，就得到一个新签名。","修法是用 nonce 或消息哈希做标记，并使用拒绝高 s 值的库。"]],["陷阱三：encodePacked 碰撞",["第三，encodePacked 碰撞：ab 加 c，和 a 加 bc，拼出来一模一样。签名里有多个动态类型时，用 abi.encode。"]],["Bybit：签名真实有效，内容却是假的",["签名再安全，签名人也可能签错东西。2025 年 2 月的 Bybit，攻击者篡改了 Safe 钱包的前端，只针对 Bybit 的冷钱包多签地址生效。","签名人看到的是一笔普通转账。实际签下的，是 delegatecall 到攻击者合约，把多签钱包的实现替换掉。","多签合约只校验签名是否对应交易摘要、数量是否够阈值。签名真实有效，只是内容不是签名人以为的内容。","阈值满足后，攻击者转走约 40 万 ETH 及其他资产，总计约 15 亿美元。"]],["多签防不了假界面",["多签防的是单把私钥被盗，防不了所有签名人看到同一个假界面。delegatecall 是高危信号，正常转账不需要它。","防御：用硬件钱包逐字段核对，用独立工具解码交易数据，对 delegatecall 和修改实现地址的操作设白名单或额外审批。"]],["答案：约 19,000，你允许的最差价格",["回到开头的问题：你最后会收到多少 USDC？","大约 19,000，也就是你允许的最差价格。你设的滑点，就是搜索者利润的上限。","顺序可以被买：交易在打包前是公开的，排序权属于别人。所以滑点要合理，合约里的最少输出要由用户给出。"]],["签名可被重放；看不懂就不签",["签名可以被重放：签名用过之后还在。它能用几次、在哪条链、对哪个合约、到什么时候，全看你签进去的字段。","成立条件：签名之前，看得懂你签的是什么。看不懂、只显示哈希的盲签，不签。"]]]}}},{"id":"10","title":"可升级合约与代理：维修门的两面","md":"../chapters/10-upgradeable-proxy.md","v":{"vs":{"src":"skeuo/ep10/out/ep10-full.mp4","cues":[[1.65,3.23,"2022 年 8 月 1 日"],[3.3,6.21,"跨链桥 Nomad 被提走约 1.9 亿美元"],[6.23,7.6,"按事发时估值"],[8.59,10.83,"起因 是此前的一次升级"],[11.81,14.18,"这次升级调用了初始化函数"],[14.38,15.63,"把可信的消息根"],[15.65,16.81,"设成了全零"],[17.79,19.49,"桥合约收到一条消息"],[19.72,21.02,"先查它对应的根"],[21.04,22.65,"再看这个根是否可信"],[23.65,24.97,"先猜一道题"],[25.96,27.9,"一条从没被证明过的消息"],[28.06,29.27,"查到的根是什么"],[29.63,30.71,"它能通过吗"],[31.98,34.44,"它查到的是默认值 全零"],[35.41,37.8,"而全零 刚刚被这次升级"],[37.86,38.99,"标记成了可信"],[39.98,43.11,"所以 任何消息都被视为已经证明"],[44.11,45.67,"按 Immunefi 的复盘"],[45.69,46.92,"和 The Block 的报道"],[47.07,48.44,"第一笔提款成功后"],[48.48,50.46,"数百个地址复制了这笔交易"],[50.48,51.91,"只换掉收款地址"],[52.9,54.07,"升级的代码"],[54.17,55.01,"可以没有错"],[56,58.75,"错的 是升级时传进去的参数"],[59.74,61.08,"能升级的合约"],[61.15,62.26,"是怎么搭起来的"],[62.62,64.07,"谁能换掉它的代码"],[67.22,68.67,"先给准确的说法"],[69.67,70.98,"一个可升级合约"],[71.04,72.38,"其实是两个合约"],[73.37,74.14,"代理合约"],[74.24,75.63,"保存数据和资金"],[76.01,77.5,"用户的每次调用"],[77.61,78.74,"都先到它这里"],[79.73,80.89,"实现合约"],[80.97,82.04,"只提供代码"],[83.02,85.43,"代理用 delegatecall 把调用转给实现"],[85.63,86.91,"借用实现的代码"],[86.93,88.74,"读写的却是代理自己的存储"],[89.72,92.55,"升级 就是让代理指向一个新的实现"],[93.54,95.22,"数据和资金原地不动"],[95.41,96.39,"只换代码"],[97.39,99.44,"所以 谁能换实现"],[99.51,101.64,"谁就拥有代理里的全部资金"],[102.62,103.58,"打个比方"],[103.94,105.81,"代理是一台售货机的机身"],[105.91,107.15,"货和钱都在里面"],[108.15,110.21,"实现是维修门后面的机芯"],[110.33,111.78,"决定按下按钮以后"],[111.8,112.7,"机器怎么动"],[113.67,115.71,"升级 就是打开维修门"],[115.8,117,"换一块新机芯"],[117.97,119.37,"比喻在这里不成立  万美元"],[360.13,363.18,"协议没有能停止分发的紧急开关"],[363.18,366.59,"任何修复都要走约 7 天的治理流程"],[367.04,372.24,"时间锁挡住了恶意升级，也挡住了紧急修复。所以"],[372.24,375.08,"暂停权和升级权要分开设计"],[375.53,379.02,"还有更外面一层：部署在 L2 上的协议"],[379.02,383.6,"安全上限是 L2 自己的升级权限。按 L2BEAT 页面"],[383.6,386.07,"Mantle 的一个 6/14 多签"],[386.07,388.54,"可以无延迟升级 L1 上的桥"],[390.24,394.85,"回到开头的问题：维修门的钥匙，在谁手里？"],[395.3,399.65,"在升级权限的持有人手里：透明代理的管理员"],[399.65,404.02,"UUPS 的授权函数，信标的 owner。谁持有它"],[404.02,405.76,"谁就拥有全部资金"],[406.21,410.78,"但 Nomad 说明，钥匙每转一次，都可能开错门"],[410.78,414.95,"升级交易本身，包括初始化参数，也要审计"],[415.4,420.21,"所以安全的升级是一条流程：比对布局，分叉测试"],[420.21,424.36,"审计升级交易，经过多签和时间锁公开排队"],[424.36,427.64,"执行后立刻验证，并留好回滚方案"],[428.09,433.94,"成立条件：升级权限经过多签和时间锁，暂停权另外设计"],[433.94,437.69,"你还核对过，底下那条链，由谁升级"],[438.14,443.1,"下一集，代码按规格执行，规格本身却可以被套利"],[443.1,444.62,"DeFi 经济安全"]],"ch":[]},"talk":{"src":"slides/EP10-upgradeable-proxy.html","scenes":[["开场",["大家好，欢迎来到主线第10集，可升级合约与代理。留给自己的维修门，也是留给攻击者的门。一句话理解，代理合约保存数据和资金，实现合约提供代码。升级，就是换掉代理指向的实现。谁能换实现，谁就拥有全部资金。","看三个案例，以下据公开报道。2022年，Nomad 桥在升级时，把可信消息根设成了零，损失约1.9亿美元。","2021年，OpenZeppelin 公告它的 UUPS 实现有问题，未初始化的实现合约可被接管并自毁。","同年，Compound 的一个升级提案出错，部分用户超额领取奖励，而协议没有紧急开关，修复要等约7天。本集讲三种代理、三类漏洞和安全升级流程。"]],["保险柜与操作手册",["打个比方。代理合约是一个保险柜，实现合约是保险柜的操作手册。柜员每次都按手册操作柜子，这就是 delegatecall，用手册，改柜子。升级，就是换一本新手册。","如果新手册把第3格放现金，改成了第3格放钥匙，柜员会把现金当钥匙用。这是存储冲突。","如果新手册第一页写着，第一个读到这页的人是柜子主人，而没人先读过它，路人就能成为主人。这是未初始化。","比喻不准的地方在于，真实保险柜换手册需要时间。如果没有时间锁，链上换实现只需要一笔交易。"]],["三种代理模式",["代理有几种模式。透明代理，升级逻辑在代理里，管理员调用代理时不转发，避免和实现函数冲突。升级权限在代理的管理槽，风险是管理员私钥。","UUPS，升级函数在实现合约里。如果新实现忘了包含升级函数，合约就再也不能升级。还要防实现合约未初始化。信标代理，多个代理共享一个信标，一次升级影响所有代理，适合大量相同的合约。","还有钻石模式，把逻辑拆成多个切面。升级权限在切面管理函数，多个切面共享存储，冲突面最大。四种模式都依赖 delegatecall，都有存储冲突风险。"]],["存储冲突 A：撞槽",["第一类存储冲突，代理自己的变量和实现的变量撞在同一个槽。看一个朴素代理，它把实现地址放在第0个槽位。","实现合约里，owner 也在第0个槽位。因为 delegatecall 用的是代理的存储。","当实现合约执行设置 owner 的代码，改的是第0个槽，也就是代理的实现地址被改成了一个 owner 地址。","下一次调用，代理会把这个 owner 地址当作实现合约去 delegatecall，合约彻底坏掉。修复是用 EIP-1967 定义的固定伪随机槽位，存放实现地址，第3集讲过那个以3608开头的位置，几乎不可能和普通变量重合。"]],["存储冲突 B：布局错位",["第二类存储冲突，升级前后布局不一致。看一个例子，V2 想在最前面插入一个手续费变量。V1 的布局是，第0槽 owner，第1槽总存款，第2槽余额映射，第3槽初始化标志。","V2 在最前面插入了手续费，于是第0槽变成手续费，而它读到的，其实是旧的 owner 地址，被当成了一个巨大的整数。","第1槽本该是手续费后面的 owner，却读到了旧的总存款的低20字节，变成一个错误的地址。","第2槽读到映射的占位槽，恒为零。第3槽的映射基址变了，所有用户的余额全部消失。一个变量的插入，后面全部错位。","正确的做法是，只在末尾追加变量，不删除、不重排、不改类型，父合约预留空隙槽位，并用工具比对新旧布局。注意，插入一个布尔值，错位方式又完全不同，所以别靠肉眼数槽位。手册里的存储实验，可以看到哪个槽被错误解释。"]],["初始化缺失",["第二类漏洞是初始化缺失，四种情况。第一，部署代理后，没有在同一笔交易里初始化，攻击者抢跑调用初始化，成为 owner。修复是部署与初始化原子化。第二，初始化可以重复调用，任何人都能重置 owner，修复是加 initializer 修饰器。","第三，实现合约本身没初始化。攻击者成为实现合约的 owner，如果实现里有 delegatecall 或自毁逻辑，就能破坏所有指向它的代理。这正是 OpenZeppelin 那个公告，也和2017年 Parity 第二次事故是同一类问题。修复是在实现合约的构造函数里禁用初始化。","第四，V2 新增的初始化逻辑，如果还用普通的 initializer 修饰器，因为已经初始化过了，V2 的初始化永远不能执行。修复是用可重复初始化的版本，指定版本号。"]],["案例：Nomad 桥",["来看 Nomad，以下据公开复盘。Nomad 在一次升级中，调用初始化函数，把可信消息根设成了零。","而合约逻辑里，未经证明的消息，默认对应的根也是零。于是，任何消息的根都等于零，都被视为已证明。","第一个攻击者成功后，其他人只需要复制他的交易，替换收款地址，就能提款。数百个地址参与哄抢，损失约1.9亿美元。","三条教训。第一，升级时的初始化参数，和代码一样需要审计。第二，零值不能有业务含义，默认值和合法值必须可区分。第三，升级后要跑回归测试，覆盖未授权消息必须被拒绝这一条。"]],["对照：Compound 提案 62",["再看一个对照案例，Compound 提案62，2021年9月。升级后的奖励逻辑有误，部分用户可以超额领取奖励代币，最坏情况约28万枚，约8000万美元。","问题是，协议没有一个可以停止奖励分发的紧急开关。任何修复，都要走约7天的治理流程。在这7天里，错误的奖励还在继续发放。","和 Nomad 对比，一个是升级权太容易被利用，一个是没有紧急开关，修复太慢。教训是，时间锁挡住了恶意升级，但也挡住了紧急修复。所以，暂停权和升级权要分开设计，暂停要快，升级要慢，第5集讲过。"]],["谁能升级链本身",["可升级的不只是 DeFi 合约，链本身也可以。BNB Chain 的系统合约和共识规则，通过硬分叉升级，比如 Moran 硬分叉修复了 Token Hub。TRON 的网络参数和功能开关，由超级代表投票通过提案。","Mantle 的一层桥、输出预言机和门户合约，据 L2BEAT，安全多签6选14可以无延迟升级，工程多签3选7可以暂停提款。","这里有一条重要的警告。在二层网络上部署的协议，它的安全上限，就是二层网络本身的升级权限。如果二层的桥可以被无延迟升级，那么协议写得再安全，资产也可能在一层网络那一端被转走。评估时一定要披露这个信任假设。"]],["安全升级流程",["安全升级流程八步。第一，编写新实现，只追加变量。第二，用工具比对存储布局，输出差异报告。第三，在主网分叉环境执行升级，跑全部回归测试和不变量测试。","第四，审计新实现，以及升级交易本身，包括初始化参数。Nomad 就是升级交易的参数出了错。第五，通过时间锁排队，公开升级内容。","第六，延迟期内，监控和社区复核。第七，执行升级，立刻跑部署后验证脚本，读关键变量，做小额端到端操作。","第八，保留回滚方案。如果新实现有问题，能不能升级回旧实现，旧实现和新布局是否兼容。整个流程的核心是，升级交易本身，和代码一样需要审计。"]],["审计检查点",["审计检查点八个。第一，代理用 EIP-1967 槽位，没有自定义变量放在低位槽。第二，新旧实现的存储布局已经用工具比对过。","第三，实现合约的构造函数调用了禁用初始化。第四，代理的部署与初始化在同一笔交易完成。","第五，UUPS 的新实现包含升级函数，并且权限正确。第六，升级权限经过多签和时间锁。","第七，初始化参数中，没有零值具有业务含义的情况。第八，对部署所在二层网络的升级信任假设，做了披露。"]],["练一练",["来练一练。一个 UUPS 合约升级到 V2 后，V2 的授权升级函数被写成了空函数。会发生什么？","参考答案。授权升级函数，是 UUPS 检查升级权限的地方。写成空函数，等于没有任何权限检查，任何人都能升级这个合约，把实现换成恶意合约，接管全部资金。这比不能升级更危险。修复是，授权升级函数必须有权限修饰器，而且升级流程要验证新实现的这个函数。"]],["小结与预告",["小结三点。第一，谁能换实现谁就有全部资金。用 EIP-1967 槽位，只在末尾追加变量。","第二，实现合约要锁死初始化。零值不能有业务含义，这是 Nomad 的教训。","第三，升级交易本身要审计。暂停权和升级权分开设计。在二层网络上，链的升级权限是你的安全上限。","下一集讲 DeFi 经济安全，代码按规格执行，规格本身却可以被套利。偿付不变量，治理攻击，以及把延迟当作一个安全参数来设计。下集见。"]]]},"deck":{"src":"../decks/skeuomorphic/ch10/index.html","scenes":[["一次升级，约 1.9 亿美元",["2022 年 8 月 1 日，跨链桥 Nomad 被提走约 1.9 亿美元，按事发时估值。","起因，是此前的一次升级。","这次升级调用了初始化函数，把可信的消息根，设成了全零。","桥合约收到一条消息，先查它对应的根，再看这个根是否可信。"]],["先猜一道题",["先猜一道题。","一条从没被证明过的消息，查到的根是什么？它能通过吗？"]],["全零：任何消息都算已证明",["它查到的是默认值，全零。","而全零，刚刚被这次升级，标记成了可信。","所以，任何消息都被视为已经证明。","按 Immunefi 的复盘和 The Block 的报道，第一笔提款成功后，数百个地址复制了这笔交易，只换掉收款地址。"]],["代码没错，参数错了",["升级的代码，可以没有错。","错的，是升级时传进去的参数。","能升级的合约，是怎么搭起来的？谁能换掉它的代码？"]],["可升级合约 = 两个合约",["先给准确的说法。","一个可升级合约，其实是两个合约。","代理合约，保存数据和资金。用户的每次调用，都先到它这里。","实现合约，只提供代码。","代理用 delegatecall 把调用转给实现：借用实现的代码，读写的却是代理自己的存储。"]],["谁能换实现，谁就拥有资金",["升级，就是让代理指向一个新的实现。","数据和资金原地不动，只换代码。","所以，谁能换实现，谁就拥有代理里的全部资金。"]],["比方：售货机换机芯",["打个比方。代理是一台售货机的机身，货和钱都在里面。","实现是维修门后面的机芯，决定按下按钮以后，机器怎么动。","升级，就是打开维修门，换一块新机芯。","比喻在这里不成立：真实的机器换机芯要花时间。链上如果没有时间锁，换实现只要一笔交易。"]],["透明代理",["常见的代理有三种，区别在于，升级的开关放在哪里。","第一种，透明代理。升级函数在代理里，由管理员调用。","管理员调用代理时不转发，其他人的调用只转发，两边的函数就不会混淆。"]],["UUPS",["第二种，UUPS。代理只做转发，升级函数写在实现合约里。","风险是，新实现如果忘了带上升级函数，这个合约就再也不能升级。"]],["信标代理",["第三种，信标代理。很多代理共用一个信标，信标里存着实现的地址。","它适合大量相同的合约，比如每个用户一个金库。改一次信标，所有代理一起换。","三种模式都依赖 delegatecall，所以都有同一个风险：存储冲突。"]],["冲突一：代理与实现撞槽位",["代理的存储，是一排编了号的格子，叫槽位。","代码不认变量名，只认格子的编号。","第一种冲突：代理自己的变量，和实现的变量，撞进同一个格子。","一个朴素的代理，把实现地址放在 0 号槽位。","实现合约的第一个变量是管理员，也在 0 号槽位。"]],["修复：EIP-1967 固定槽位",["于是，写管理员，就是改写实现地址。","修复是 EIP-1967。它用一个哈希算出的固定槽位，存放实现地址和管理员地址。","这个位置远离普通变量。算法里还减去 1，让映射和数组的派生位置，碰不到它。"]],["先猜一道题",["第二种冲突：升级前后，变量的顺序变了。","先猜一道题。","旧版本里，0 号槽位是管理员，1 号是存款总额。","新版本在最前面，插入了一个手续费变量。升级以后读管理员，读到的是什么？"]],["答案：截断的存款总额",["读到的是旧的存款总额，截掉一部分，被解释成一个地址。","因为新代码把管理员挪到了 1 号，而 1 号里还是旧数据。","后面每一格都错开一位。映射的基址变了，所有余额看上去都消失了。"]],["存储布局四条规则",["规则有四条。","只在末尾追加变量。","不删除，不重新排序，不改类型。","父合约预留一段空槽位，或者用 ERC-7201 的命名空间存储。","用工具比对新旧布局，比如 OpenZeppelin 的升级插件，或者 forge inspect。不要靠肉眼核对。"]],["函数选择器撞车",["还有一种撞车，不在存储里，而在函数选择器上。","选择器是函数签名哈希的前 4 个字节。两个名字完全不同的函数，可能算出同一个选择器。","代理自己有这个函数时，调用会被代理截下，不会转给实现。","编译器只检查同一个合约内部的冲突。代理和实现之间，要在部署前用工具比对。","透明代理靠管理员不转发、其他人只转发，绕开了这个问题。"]],["初始化函数代替构造函数",["普通合约用构造函数设置主人。代理合约不行。","构造函数只在实现合约自己的存储里运行，写不进代理。","所以可升级合约用一个初始化函数代替，部署以后再调用一次。","这一次调用，就是风险所在。"]],["抢先初始化与重复初始化",["第一种情况：部署代理和初始化，分成了两笔交易。","中间有空隙，别人可以抢先初始化，成为主人。修复是在同一笔交易里完成。","第二种：初始化函数可以重复调用，任何人都能重置主人。修复是加上只能调用一次的修饰器。"]],["先猜一道题",["第三种：代理初始化了，实现合约本身没有。","代理的初始化，写在代理的存储里。实现合约自己的存储，还是空的。","先猜一道题。别人能直接调用实现合约的初始化函数吗？"]],["能：成为实现的主人",["能。他会成为实现合约的主人。","如果实现合约里有 delegatecall 或者自毁的路径，所有指向它的代理，都可能失效。","2021 年 9 月，OpenZeppelin 发布安全公告：它的 UUPS 实现，有几个版本存在这个问题，随后发布了修复版本。","修复是在实现合约的构造函数里，禁用初始化。这样谁都不能再初始化它。"]],["Nomad：默认值撞上合法值",["回到开头的 Nomad。它的问题，出在升级时的初始化参数。","合约用一张表，记录每个根什么时候被确认。升级把全零这个根，标记成了已确认。","而没被证明过的消息，查到的根，默认也是全零。","默认值和合法值，撞在了一起。"]],["Nomad 的三条教训",["教训有三条。初始化参数，和代码一样需要审计。","零值不能带有业务含义，默认值必须和合法值区分开。","升级以后要跑回归测试，覆盖这一条：未授权的消息必须被拒绝。"]],["升级权限按最高等级保护",["谁能换实现，谁就拥有全部资金。","所以升级权限，要按最高等级来保护。","透明代理的权限，在代理的管理员槽位。UUPS 在实现合约的授权函数里。信标在信标的拥有者手里。","无论在哪，都应该经过多签和时间锁。","时间锁让升级先排队、再公开，给社区留出复核的时间。"]],["Compound 第 62 号提案",["但时间锁有另一面。","2021 年 9 月，Compound 第 62 号提案升级了奖励逻辑，里面有错误，部分用户可以超额领取 COMP。","按 The Block 报道，最坏情况约 28 万枚，约 8000 万美元。"]],["暂停要快，升级要慢",["协议没有能停止分发的紧急开关。任何修复，都要走约 7 天的治理流程。","时间锁挡住了恶意升级，也挡住了紧急修复。","所以暂停权和升级权要分开设计：暂停可以快，升级必须慢。"]],["链本身也能被升级",["再往下一层，链本身也可能被升级。","比如 Mantle。按 L2BEAT 的页面，一个 14 人里 6 人签名的多签，无需延迟就能升级 L1 上的桥和门户合约。","部署在 L2 上的协议，安全上限就是这条 L2 的升级权限。","合约写得再好，资产也可能在 L1 那一端被转走。"]],["一次安全的升级",["一次安全的升级，按这个顺序走。","写新实现，只追加变量。用工具比对存储布局。","在主网分叉环境里执行升级，跑全部回归测试。","审计新实现，也审计升级交易本身，包括初始化参数。","通过时间锁排队，公开升级内容。执行以后，立刻跑部署后验证。","最后，留好回滚方案：新实现有问题时，能不能升级回旧实现？"]],["写合约与审计",["最后，每个人今天就能做一件事。","写合约的人，在实现合约的构造函数里禁用初始化，把部署和初始化放进同一笔交易。","审计的人，把新旧存储布局交给工具比对，再解码升级交易的初始化参数，看有没有零值。"]],["普通用户",["普通用户，存款前查一查：这个协议能不能升级，由谁升级，有没有时间锁。","能无延迟升级的协议，等于你把资金交给了升级权限的持有人。","同一个协议在不同的链上，升级权限要分别核对。"]],["谁能换规则，谁就拥有钱",["回到开头。升级的代码没有错，为什么钱还是被提走了？","因为升级换掉的不只是代码。初始化参数写进了存储，把全零变成了可信。","这在默认值和合法值无法区分时成立。零值没有业务含义，这一步就拦得住。","代理存着钱，实现给出规则。谁能换规则，谁就拥有这笔钱。"]]]},"d3b":{"src":"../decks/3b1b/ch10.html","scenes":[["Nomad：一次升级后约 1.9 亿美元被提走",["2022 年 8 月 1 日，Nomad 跨链桥被提走约 1.9 亿美元。","起因是此前的一次升级：它把可信根初始化成了全零。"]],["升级代码没错，错的是一个参数",["第一笔攻击成功后，其他地址直接复制这笔交易，只把收款地址换成自己的。","升级代码本身可以没有错，错的是升级时传入的一个参数。","可升级合约，相当于在金库上开了一扇维修门。问题是：维修门的钥匙，在谁手里？"]],["代理合约与实现合约",["先看这扇门是怎么装上的。可升级合约拆成两份：代理合约和实现合约。","代理合约保存数据和资金；实现合约只提供代码。","用户调用代理，代理用 delegatecall 把调用转给实现：用实现的代码，改代理的存储。","打个比方：代理是保险柜，实现是操作手册。柜员每次照着手册，操作的是柜子。"]],["升级就是换实现地址：谁能换，谁拥有资金",["升级，就是换一本手册，也就是改掉代理里记着的实现地址。","比方有一处不成立：真实的保险柜换手册要花时间；链上如果没有时间锁，换实现只要一笔交易。","所以，谁能换实现，谁就拥有柜子里的全部资金。"]],["透明代理与 UUPS：钥匙放的位置不同",["钥匙放在哪里，取决于代理模式。常见的有三种。","透明代理：升级函数在代理里，权限记在代理的管理员槽。管理员调用时，代理不转发。","UUPS：升级函数在实现合约里。新实现如果忘了带上升级函数，合约就再也不能升级。"]],["信标代理：一次升级影响全部实例",["信标代理：很多代理共用一个信标，信标记着实现地址。一次升级，影响全部实例。","三种模式都靠 delegatecall，所以都有同一个风险：存储冲突。"]],["存储冲突一：实现地址撞上 owner",["代理和实现共用同一块存储，按槽位编号读写。","朴素的代理，把实现地址放在 0 号槽。实现合约的 owner 也在 0 号槽。写 owner，就是改实现地址。","修复办法是 EIP-1967：把实现地址放进一个由哈希算出、再减一的固定槽位，普通变量和映射都碰不到它。"]],["存储冲突二：升级时插入变量",["另一种冲突，发生在升级前后。V1 的 0 号槽是 owner，1 号槽是总存款。","V2 在最前面插入一个手续费变量。变量名都往后挪了一格，旧数据却留在原地。","算一下。假设旧的总存款是 500 万，十六进制是 4C4B40。V2 读 owner，读到的就是一个以 4C4B40 结尾的地址。","规则：只在末尾追加变量，不删除、不重排、不改类型，并且用工具比对新旧布局。"]],["初始化缺失：抢先成为 owner",["第二类漏洞：初始化缺失。","可升级合约靠一个初始化函数设定主人。用比方说，手册第一页写着：第一个读到这页的人，就是柜子的主人。","如果部署代理之后，没有在同一笔交易里初始化，攻击者就能抢先调用，成为 owner。"]],["实现合约自己也要禁用初始化",["还有一处容易漏掉：代理初始化了，实现合约自己的存储，仍然没有初始化。","攻击者可以成为实现合约的 owner。如果实现里有 delegatecall 或者自毁路径，所有指向它的代理都会失效。","2021 年 9 月，OpenZeppelin 披露的 UUPS 问题，就是这一类，修复版本是 4.3.2。","修复：部署和初始化放进同一笔交易；实现合约在构造函数里，禁用初始化。"]],["选择器冲突：调用被代理截下",["第三类漏洞：选择器冲突。","每次调用的前 4 个字节是函数选择器，决定调用哪个函数。","两个名字毫不相干的函数，选择器可以完全相同。","如果代理自己的函数，和实现的函数撞了选择器，调用会被代理截下，不会转发。"]],["编译器不检查代理与实现之间",["编译器只检查同一个合约里的冲突，不检查代理和实现之间。","透明代理的办法是：管理员的调用一律不转发，其他人的调用一律转发。部署前，还要用工具比对两边的选择器。"]],["Nomad 路径：全零根被标成可信",["现在回到 Nomad，把路径画完整。","合约用一张表判断消息根是否可信。升级时，初始化把全零这个根，标成了可信。","而一条从来没被证明过的消息，查到的根是默认值，也是全零。","两条线在这里接上：任何伪造的消息，都被当作已经证明，可以放行提款。"]],["Nomad 的三条教训",["交易是公开的。数百个地址复制它，只换收款地址。","教训一：零值不能有业务含义，默认值和合法值必须分得开。教训二：升级时的初始化参数，和代码一样要审计。","教训三：升级后跑回归测试，覆盖一条：未经证明的消息，必须被拒绝。"]],["Compound 提案 62：时间锁挡住修复",["那么，给维修门加一道时间锁，是不是就够了？","时间锁让升级先排队、先公开。延迟期里，大家能看到要换成什么。","再看 2021 年 9 月的 Compound 提案 62：升级后的奖励逻辑有误，最坏情况下，约 28 万枚 COMP 可以被超额领取，约 8000 万美元。","协议没有能停止分发的紧急开关，任何修复都要走约 7 天的治理流程。"]],["暂停权与升级权分开；L2 的外层钥匙",["时间锁挡住了恶意升级，也挡住了紧急修复。所以，暂停权和升级权要分开设计。","还有更外面一层：部署在 L2 上的协议，安全上限是 L2 自己的升级权限。按 L2BEAT 页面，Mantle 的一个 6/14 多签，可以无延迟升级 L1 上的桥。"]],["答案：钥匙在升级权限持有人手里",["回到开头的问题：维修门的钥匙，在谁手里？","在升级权限的持有人手里：透明代理的管理员，UUPS 的授权函数，信标的 owner。谁持有它，谁就拥有全部资金。","但 Nomad 说明，钥匙每转一次，都可能开错门。升级交易本身，包括初始化参数，也要审计。"]],["安全的升级是一条流程",["所以安全的升级是一条流程：比对布局，分叉测试，审计升级交易，经过多签和时间锁公开排队，执行后立刻验证，并留好回滚方案。","成立条件：升级权限经过多签和时间锁，暂停权另外设计；你还核对过，底下那条链，由谁升级。"]]]}}},{"id":"11","title":"DeFi 经济安全：代码没错，规则错了","md":"../chapters/11-defi-economic-security.md","v":{"vs":{"src":"skeuo/ep11/out/ep11-full.mp4","cues":[[1.65,3.31,"2023 年 3 月 13 日"],[3.33,5.35,"借贷协议 Euler Finance"],[5.41,7.49,"损失约 1.97 亿美元"],[7.5,8.79,"按事发时估值"],[9.79,12.14,"入口 是一个捐赠函数"],[13.13,15.04,"它让用户把自己的存款"],[15.09,16.33,"捐给协议的储备"],[17.33,19.88,"捐出去 账户的抵押品就少了"],[20.86,21.9,"但这个函数"],[22.08,24.56,"不检查账户是否仍然健康"],[25.55,26.87,"先猜一道题"],[27.86,28.75,"举个例子"],[29.13,31.49,"一个账户有 100 美元抵押品"],[31.61,32.89,"借了 90 美元"],[33.88,35.69,"它捐出 30 美元抵押品"],[35.8,36.91,"没人检查"],[37,38.15,"也没人偿还"],[38.51,40.03,"协议的缺口是多少"],[41.3,42.93,"缺口是 20 美元"],[43.92,46.12,"账户只剩 70 美元抵押品"],[46.17,47.74,"却欠着 90 美元"],[48.72,50.29,"这 20 美元成了坏账"],[50.46,53.04,"最后由存款人或保险基金承担"],[54.03,55.51,"每个函数单独看"],[55.67,56.51,"都没有错"],[57.49,59.42,"攻击者也没有利用代码 bug"],[59.78,61.29,"他只是按规则操作"],[61.37,63.43,"换了一种设计者没想到的组合"],[64.4,65.44,"规则本身"],[65.62,67.03,"怎么会让协议亏钱"],[70.18,71.64,"先给准确的说法"],[72.63,75,"借贷协议靠一条不变量运转"],[75.18,76.58,"每个账户的抵押品"],[76.64,77.5,"打折以后"],[77.57,78.65,"要盖得住借款"],[79.64,80.74,"打折的比例"],[80.88,82.22,"叫清算阈值"],[83.2,85.72,"抵押品价值乘以清算阈值"],[85.74 "延迟把攻击者完成攻击的时间"],[320.17,325.32,"从一笔交易拉长到几个小时，让监控和人工有机会介入"],[325.32,327.68,"代价是，正常用户也要等"],[329.38,333.22,"还有一类规则，写在链外：稳定币"],[333.67,339.07,"稳定币的价值，不取决于合约代码，而取决于链下的储备"],[339.07,341.66,"赎回规则，和发行方的权限"],[342.11,346.93,"打个比方，它像一张银行开的提货单：仓库里的货不够"],[346.93,350.95,"印得再好也不值一美元。比方不成立的地方是"],[350.95,355.36,"作废提货单要走法律程序，冻结一个地址上的代币"],[355.36,356.97,"通常只要一笔交易"],[357.42,358.71,"2023 年 3 月"],[358.71,362.95,"Circle 约 33 亿美元储备存在倒闭的硅谷银行"],[362.95,367.84,"USDC 最低跌到约 0.87 美元，以它为主要抵押的 DAI"],[367.84,369.71,"也跌到约 0.90 美元"],[370.16,374.09,"铸币权也是规则。2026 年 5 月的 StablR"],[374.09,378.73,"铸币由一个 1/3 多签控制；攻击者拿下一个签名人"],[378.73,381.03,"就增发了约 1350 万美元"],[381.48,386.59,"DeFi 协议把稳定币当作抵押品，就继承了这些链下风险"],[388.29,393.09,"回到开头：代码没错、规则错了，怎么发现？"],[393.54,397.03,"第一步，先写不变量：每个账户健康"],[397.03,401.4,"整个协议的资产不少于债权。再用不变量测试"],[401.4,404.24,"让工具去找打破它的调用顺序"],[404.69,408.16,"第二步，把所有入口排成表，逐行核对"],[408.16,412.65,"减少抵押品或增加债务之后，有没有检查健康因子"],[412.65,415.37,"Euler 缺的，就是表里的一格"],[415.82,420.69,"第三步，给每个模块列风险参数：投票快照和时间锁"],[420.69,424.08,"奖励的数据来源，赎回延迟和暂停权"],[424.08,428.74,"低流动性抵押品的上限，稳定币的储备和铸币权限"],[429.19,432.84,"成立条件：不变量只覆盖你写下来的东西"],[432.84,436.69,"多种抵押品之间的相关性、治理本身被攻击"],[436.69,437.9,"都要单独评估"],[438.35,442.72,"下一集，损失最大的一类事故：跨链桥"]],"ch":[]},"talk":{"src":"slides/EP11-defi-economic-security.html","scenes":[["开场",["大家好，欢迎来到主线第11集，DeFi 经济安全。一句话理解，经济攻击不依赖代码 bug。攻击者严格按照协议规则操作，只是组合了设计者没想到的顺序、规模或时间。","看三起事故，以下据公开报道。2023年，Euler 约1.97亿美元，根因是一个函数漏了健康检查。","2022年，Beanstalk 约1.8亿美元，根因是投票权能借，提案又能当场执行。","2021年，Venus 的 XVS 事件，用自己的治理代币作抵押品，坏账超过9500万美元。这些都不是代码写错了，是规则本身可以被套利。"]],["超市的无理由退货",["打个比方。一家超市规定，任何商品7天无理由退货，退货时按当前标价退款。这条规则本身没有 bug，退货退款合情合理。","但如果有人能在退货前让标价翻倍，也就是操纵价格，或者在同一天买入、改价、退货，也就是闪电贷，超市就会亏钱。注意，他没有违反任何规则。","比喻不准的地方在于，超市可以修改规则并拒绝可疑退货。合约规则一旦部署，只能靠升级或者治理修改，而治理本身也可以被攻击。"]],["偿付能力不变量",["借贷协议有两条核心不变量。对每个账户，加权后的抵押品价值，要大于等于借款价值，否则这个账户可以被清算。这个比值就是健康因子，小于1时账户可被清算。","对整个协议，所有资产的总和，要大于等于所有存款人的债权，否则协议资不抵债。","坏账从哪里来？看这张图。抵押品价格快速下跌，或者预言机延迟熔断，都会让健康因子小于1。这时如果清算及时，协议安全。","但如果清算不及时，或者抵押品流动性不足，清算人无法以合理价格卖出，抵押品的真实价值就跌破了借款，产生坏账，由存款人或保险基金承担。注意，坏账不一定来自攻击，市场暴跌也会产生。"]],["反身性：自有代币作抵押品",["先看一类特别的风险，反身性。Venus 允许用户用自己的治理代币 XVS 作为抵押品。XVS 的价格在短时间内，从约76美元涨到约144美元。","抵押能力随之上升，有人借出了大量 BTC 和 ETH。","然后 XVS 价格回落。抵押品价值跌破借款，清算超过2亿美元，仍然留下超过9500万美元的坏账。项目方称价格可能被操纵。","这就是反身性，价格上涨让借款增加，借出后产生卖压，卖压又让价格下跌，形成循环。协议自己的治理代币作抵押品，是典型的反身性风险。低流动性抵押品，必须有供应上限和更低的抵押率。"]],["案例：Euler",["看 Euler，以下据公开复盘。Euler 有一个捐赠函数，允许用户把自己的存款捐给协议储备。但这个函数，没有检查捐赠之后账户的健康因子。","来看被打破的不变量。一个正常账户，抵押品减债务后是正的，健康。","当有人通过这个捐赠函数，捐出大量存款，账户的抵押品减少了，而债务不变。账户变得严重资不抵债，健康因子远小于1。","而 Euler 的清算折扣，随着资不抵债的程度增大。于是用另一个账户去清算这个账户，就能以极大的折扣拿走抵押品。攻击者获利约1.97亿美元，后来归还了大部分。","关键在于，每个函数单独审计都正确。漏洞在于，这个新增的捐赠函数，改变了账户状态，却没有走所有其他函数都会走的健康检查。记住，任何会减少抵押品或增加债务的路径，都必须在结束时检查健康因子。"]],["治理攻击：Beanstalk",["治理攻击，是攻击者获得足够的投票权，通过一个恶意提案，合法地转走协议资产。看 Beanstalk，以下据公开复盘。攻击者提前一天，提交了一个恶意提案，因为紧急执行有一天的最短等待期。","一天后，攻击者用闪电贷借入约10亿美元的资产，存入协议，瞬间获得了多数投票权。因为投票权是按当前存款计算的，没有历史快照。","在同一笔交易里，攻击者用紧急通道通过并执行了提案，把国库资产转出，然后归还闪电贷。获利约8000万美元，协议损失约1.8亿美元。","两个缺陷叠加，投票权按当前存款算，而且有可以同一笔交易执行的紧急提案通道。修复是，投票权用过去区块的快照，提案通过后必须经过时间锁才能执行。这样，借来的票就不算数，执行前也有反应时间。"]],["治理防御清单",["治理防御五条。闪电贷借票，防御是投票权快照取在提案创建之前的区块，借来的票不算数。低投票率下被少数人通过，防御是设法定人数要求。","恶意提案通过后立即执行，防御是执行时间锁，加上守护者否决。提案内容难以理解，防御是提案必须附带可读的调用数据解码，让投票者知道自己在投什么。","还有一点，治理代币如果大量集中在交易所，攻击者可能借到，要监控大额转入和委托变化。"]],["奖励分发的无风险套利",["奖励分发也容易被无风险套利。第一个缺陷，存入即领奖。奖励按存款时点的余额计算，攻击者就用闪电贷存入、领奖、取出，一笔交易薅走奖励。修复是奖励随时间累积，存入后设最短锁定期。","第二，奖励代币和质押代币相同。合约的余额同时包含奖励和质押，计算份额就出错。修复是质押量用内部变量记录，不读余额，这和第6集金库通胀是一个道理。","第三，奖励速率可被调用者影响，比如按本区块成交量或池子价格算。修复是参数由治理设定，不读一笔交易内可变的数据。第四，按 LP 价值铸币，就是 PancakeBunny，要用公平储备定价。"]],["延迟作为安全参数",["最后讲一个正面的设计，延迟作为安全参数。流动性质押里，用户质押 ETH，拿到可交易的凭证。凭证可以在 DEX 交易，好处是用户无需等待就能退出，风险是凭证可能脱锚。","而赎回有一个延迟队列。这对用户体验是负面的，要等待。但它给协议留出了反应时间。","2025年 Bybit 被盗后，攻击者把部分资产换成 Mantle 上的重质押凭证，尝试赎回。mETH 协议有8小时的提款延迟，让团队有时间暂停合约，追回了约4300万美元。","所以，延迟是一种安全参数，不只是体验问题。它把攻击者完成攻击的时间，从一笔交易，拉长到若干小时，让监控和人工响应有机会介入。代价是正常用户也要等待。"]],["审计检查点",["审计检查点七个。第一，写出协议级的偿付不变量，用不变量测试验证。第二，所有减少抵押品或增加债务的路径，最后都检查健康因子，这是 Euler 的教训。","第三，清算奖励在极端行情下仍有吸引力，清算折扣有上限。第四，低流动性抵押品有供应上限，协议自有代币作抵押品时有额外限制。","第五，投票权用历史快照，提案执行经过时间锁。第六，奖励计算不依赖一笔交易内可变的数据。","第七，提款和赎回是否需要延迟，延迟期内谁能暂停。"]],["练一练",["来练一练。Euler 的捐赠函数，如果在最后加一行，要求调用者的健康因子大于等于1，攻击还能成功吗？还需要检查什么？","参考答案。这一行确实能挡住这条路径，捐赠后账户资不抵债就回滚。但要系统地防，还得问两件事。第一，所有其他会减少抵押品或增加债务的入口，都检查了吗？第二，清算折扣有上限吗？修一个函数不够，要修的是这一类不变量，确保它在每个入口都成立。这就是经济安全和单点修补的区别。"]],["小结与预告",["小结三点。第一，经济攻击每一步都合法。先写出偿付不变量，再验证每个入口都守住它。","第二，投票权用历史快照，提案经时间锁执行。奖励计算不读一笔交易内可变的数据。","第三，延迟是一种安全参数。协议自己的代币作抵押品，有反身性风险。","下一集讲跨链桥安全，损失最大的一类事故。四种验证方式，四类根因，以及为什么交易所的充值提币，本质上也是一座桥。下集见。"]]]},"deck":{"src":"../decks/skeuomorphic/ch11/index.html","scenes":[["一个捐赠函数，约 1.97 亿美元",["2023 年 3 月 13 日，借贷协议 Euler Finance，损失约 1.97 亿美元，按事发时估值。"]],["入口：捐赠函数",["入口，是一个捐赠函数。","它让用户把自己的存款，捐给协议的储备。","捐出去，账户的抵押品就少了。","但这个函数，不检查账户是否仍然健康。"]],["先猜一道题",["先猜一道题。","举个例子。一个账户有 100 美元抵押品，借了 90 美元。","它捐出 30 美元抵押品，没人检查，也没人偿还。协议的缺口是多少？"]],["答案：缺口 20 美元",["缺口是 20 美元。","账户只剩 70 美元抵押品，却欠着 90 美元。","这 20 美元成了坏账，最后由存款人或保险基金承担。"]],["规则没错，组合错了",["每个函数单独看，都没有错。","攻击者也没有利用代码 bug。他只是按规则操作，换了一种设计者没想到的组合。","规则本身，怎么会让协议亏钱？"]],["偿付不变量与健康因子",["先给准确的说法。","借贷协议靠一条不变量运转：每个账户的抵押品，打折以后，要盖得住借款。","打折的比例，叫清算阈值。","抵押品价值乘以清算阈值，再除以借款，就是健康因子。","健康因子大于 1，账户安全。小于 1，任何人都可以清算它。"]],["清算",["清算，是第三方替账户偿还债务，再以折扣拿走抵押品。","折扣，是给清算人的报酬。"]],["回到 Euler：坏账变成利润",["回到 Euler。按 Omniscia 和 BlockSec 的复盘，捐赠以后，账户已经资不抵债。","而 Euler 的清算折扣，会随资不抵债的程度变大。","攻击者用另一个账户来清算它，以很大的折扣拿走抵押品。","缺口越大，折扣越大。坏账，变成了利润。"]],["协议级的不变量",["整个协议也有一条不变量：所有资产，要盖得住所有存款人的债权。","盖不住的部分，就是坏账。"]],["坏账不一定来自攻击",["坏账不一定来自攻击。","价格暴跌，预言机延迟，清算来不及，都会留下坏账。","清算人是逐利的。奖励覆盖不了 gas 和滑点，就没人清算。","抵押品流动性不足，清算人拿到手，也卖不出好价钱。"]],["Venus：自家代币做抵押",["再看一个例子。2021 年 5 月，BNB Chain 上的 Venus，允许用户拿自己的治理代币 XVS 做抵押。","按 The Block 报道，XVS 短时间里，从约 76 美元涨到约 144 美元。","抵押能力跟着上涨，有人借走了大量 BTC 和 ETH。","XVS 回落以后，清算金额约 2 亿美元以上，仍然留下约 9500 万美元以上的坏账。","项目方称，价格可能被操纵。"]],["反身性",["这叫反身性。价格上涨，借款增加，卖压增加，价格下跌，坏账出现。","所以，低流动性的抵押品，要有供应上限和更低的抵押率。"]],["治理攻击：Beanstalk",["规则被组合利用，不只发生在借贷里。","治理攻击，是攻击者拿到足够的投票权，通过恶意提案，合法地转走协议资产。","2022 年 4 月，以太坊上的 Beanstalk。","它的投票权，按当前的存款计算。","它另有一条紧急通道。","按 CertiK 的分析，提案满 1 天，拿到三分之二的票，就能立刻执行。"]],["先猜一道题",["先猜一道题。","闪电贷必须在同一笔交易里归还。用借来的代币，能通过提案吗？"]],["能：一笔交易里全部完成",["能。借款，存入，投票，执行，还款，全在同一笔交易里。","闪电贷的归还限制，一步也没有挡住。","攻击者提前一天，就提交了提案。","获利口径各方不同。CertiK 称约 7600 万美元，Beanstalk 称约 7700 万美元，PeckShield 估约 8000 万美元。"]],["修复：快照 + 时间锁",["修复有两步。","投票权用提案创建之前那个区块的快照。借来的代币，那时并不在你手里。","提案通过以后，先过时间锁，再执行。中间留出守护者否决的机会。","再加上法定人数，并锁定提案内容。内容一改，重新计时。"]],["奖励分发：同样的问题",["奖励分发，也有同样的问题。","如果奖励按存入那一刻的余额计算，就能用闪电贷存入，领奖，取出。","修复是让奖励随时间累积，存入以后有最短锁定期。"]],["借来的是规模，利用的是时间",["奖励的计算，不能读一笔交易里就能改变的数据，比如本区块的成交量，或者池子的价格。","这几件事有个共同点。攻击者借来的，是规模。利用的，是时间。"]],["发行方风险：不在合约里",["另有一类风险，根本不在合约里。","稳定币和代币化的现实资产，把链下资产带上了链。","它们值多少，不看合约代码，看链下的储备，赎回，和发行方的权限。"]],["比喻：银行开的提货单",["打个比方。稳定币像一张银行开的提货单。","提货单印得再精美，只要仓库里的货不够，仓库被封，或者银行能随时作废它，它就不值一美元。","比喻在这里不成立：作废提货单，要走法律程序。冻结或销毁一个地址上的代币，通常只要一笔交易。","DeFi 协议拿它做抵押品，就继承了这些链下风险。"]],["① 储备与托管",["风险分五类。第一类，储备与托管。","2023 年 3 月，按 Circle 的声明，约 33 亿美元储备存在倒闭的硅谷银行。","按 The Block 报道，USDC 最低跌到约 0.87 美元。以它为主要抵押的 DAI，也跌到约 0.90 美元。"]],["② 设计缺陷",["第二类，设计缺陷。2022 年 5 月，算法稳定币 Terra UST 挤兑，进入死亡螺旋，约 400 亿美元市值蒸发。"]],["③ 铸币权限",["第三类，铸币权限。","2026 年 3 月，Resolv 被凭空铸出约 8000 万枚 USR。","按 QuillAudits 和 CertiK 的分析，攻击者拿到了铸币密钥，合约也不核对铸币量和存入资产的比例。","2026 年 5 月的 StablR，三个签名人里任意一人，就能批准铸币。拿下一个人，就拿下了全部。"]],["④ 链下策略",["第四类，链下策略。2025 年 11 月，Stream Finance 的一名外部基金管理人，亏掉约 9300 万美元，提款随即冻结。"]],["⑤ 定价来源",["第五类，定价来源。2025 年 10 月 10 日，USDe 只在 Binance 现货，跌到约 0.65 美元。","链上和其他交易所，基本保持在约 0.90 美元以上。","Binance 用自家订单簿给抵押品估值，触发了用户清算，之后赔付约 2.83 亿美元。"]],["风险沿抵押关系往下传",["风险会沿着抵押关系往下传。储备一出问题，所有拿它做抵押品的协议，同时受影响。"]],["三样东西：顺序、规模、时间",["回头看这些事故，攻击者大多没有找到代码 bug。","他们改变的，是三样东西：顺序，规模，时间。","防御也按这三样来设计。"]],["顺序",["先说顺序。任何会减少抵押品，或者增加债务的路径，都必须在结束时检查健康因子。","新增一个函数，就要确认它走了这道检查。Euler 缺的，就是这一步。"]],["规模（一）：抵押与清算",["再说规模。低流动性抵押品要有供应上限，自家代币做抵押，要有额外限制。","清算奖励在极端行情下也要有吸引力，清算折扣要有上限。"]],["规模（二）：铸币与估值",["铸币要有单笔和每日的累计限额，多人审批，异常时熔断。","三个签名人里一人就够，等于只有一个签名人。","抵押品估值，不能只看一家交易所的订单簿。"]],["时间",["最后是时间。投票权用历史快照，提案执行要过时间锁。","提款和赎回，也可以设延迟。"]],["mETH 的 8 小时",["2025 年 2 月 Bybit 被盗以后，攻击者尝试赎回 cmETH。","按 The Block 报道，mETH 协议有 8 小时的提款延迟。","团队趁这段时间暂停了合约，追回 15000 枚 cmETH，约 4300 万美元。"]],["延迟是一种安全参数",["延迟把攻击者完成攻击的时间，从一笔交易拉长到几个小时，让监控和人工响应有机会介入。","代价是，正常用户也要等。","所以延迟是一种安全参数，不只是体验问题。"]],["今天就能做的事",["最后，每个人今天就能做一件事。","写协议的人，把偿付不变量写成一条公式，再用不变量测试去验证它。","审计的人，列出每一个改变抵押品和债务的入口，逐个核对有没有健康检查。","普通用户，收益来源说不清楚的产品，不要投入大额。","稳定币也不是无风险资产。先查它的储备，赎回规则，和发行方的冻结权限。"]],["回到开头",["回到开头。每个函数都没有错，协议为什么损失约 1.97 亿美元？","因为规则允许一条路径，减少抵押品，却不检查健康因子。","这个答案成立的前提是，清算折扣会随缺口变大，缺口才能变成利润。"]],["代码没错，规则错了",["代码没错，规则错了。规则的每一种组合，都要守住偿付不变量。"]]]},"d3b":{"src":"../decks/3b1b/ch11.html","scenes":[["Euler：一个捐赠函数，约 1.97 亿美元",["2023 年 3 月 13 日，借贷协议 Euler 损失约 1.97 亿美元。","入口是一个捐赠函数：把自己的存款，捐给协议储备。"]],["捐赠函数不检查账户是否健康",["它减少了账户的抵押品，却不检查账户是否还健康。","其他函数单独审计，都没有写错。","代码没错，规则错了。这种问题，怎么发现？"]],["经济攻击：不依赖代码 bug",["先说清楚什么是经济攻击：它不依赖代码 bug。","攻击者严格按照协议规则操作，只是组合了设计者没想到的顺序、规模或时间。"]],["比方：超市退货按当前标价",["打个比方：超市规定，7 天无理由退货，按当前标价退款。规则本身没有 bug。","但如果有人能在退货前让标价翻倍，超市就会亏钱；如果买入、改价、退货能在同一天做完，那就是闪电贷。","比方有一处不成立：超市可以改规则、拒绝可疑退货；合约规则一旦部署，只能靠升级或治理来改，而治理本身也可以被攻击。"]],["规则一：偿付能力",["要发现规则错，先写下规则必须守住什么。借贷协议守的是偿付能力。","对每个账户：抵押品价值乘以清算阈值，要大于等于借款价值。两边之比叫健康因子，小于 1 就可以被清算。","对整个协议：所有资产，要大于等于所有存款人的债权。"]],["示例：捐出抵押品，留下 20 美元缺口",["算一个示例。账户有 100 美元抵押品，欠 90 美元。","它捐出 30 美元抵押品，债务不变。剩下 70 美元抵押品，却欠 90 美元。","如果没人偿还，这 20 美元的缺口就是坏账，由存款人或保险基金承担。"]],["坏账不一定来自攻击",["坏账不一定来自攻击。","价格快速下跌、预言机延迟、抵押品卖不出去，都会让清算来不及。","清算人是逐利的。如果清算奖励覆盖不了 gas 和滑点，就没人清算。"]],["Venus：用自己的治理代币做抵押",["2021 年 5 月的 Venus 允许用自己的治理代币 XVS 作抵押。XVS 从约 76 美元涨到约 144 美元，有人借出了大量 BTC 和 ETH。","XVS 回落后，清算超过 2 亿美元，仍留下超过 9500 万美元坏账。","这叫反身性：价格上涨，借款增加；卖压增加，价格下跌，变成坏账。低流动性抵押品，要有供应上限和更低的抵押率。"]],["Euler 路径：捐出抵押品，再折价清算",["现在把 Euler 的路径画出来。","第一步，攻击者用闪电贷借入 DAI，存进 Euler，再用杠杆铸造放大头寸。","第二步，调用捐赠函数，捐出大量存款凭证。抵押品减少，债务不变，账户严重资不抵债。","第三步，用另一个账户清算它。Euler 的清算折扣随资不抵债的程度变大，清算人以极大的折扣拿走抵押品。","最后归还闪电贷，获利约 1.97 亿美元。后来，攻击者归还了大部分资金。"]],["入口表里缺的一格：捐赠函数没检查",["把会减少抵押品或增加债务的入口排成一张表：取款、借款、杠杆铸造，结束时都检查健康因子。唯独新加的捐赠函数，没有。","规则是：任何减少抵押品或增加债务的路径，都必须在结束时检查健康因子。"]],["Beanstalk：闪电贷买到投票权",["规则错，还可能错在治理上。治理攻击，是拿到足够的投票权，合法地通过恶意提案。","2022 年 4 月的 Beanstalk：攻击者提前一天提交提案，再用闪电贷借入约 10 亿美元资产，存入，拿到多数投票权。","紧急通道允许满 1 天、获得三分之二投票的提案，在同一笔交易里通过并执行。国库资产被转走，闪电贷当场还上。"]],["两个缺陷：按当前余额投票，通过后立刻执行",["协议损失约 1.8 亿美元；攻击者获利约 7600 万到 8000 万美元，各方口径不同。","缺陷有两个：投票权按当前余额计算；通过后可以立刻执行。修复：投票权用提案创建前的区块快照，执行前经过时间锁。"]],["奖励要随时间累积",["同样的思路，也适用于奖励分发。","如果奖励按存入那一刻的余额计算，闪电贷就能在一笔交易里存入、领奖、取出。修复是让奖励随时间累积，不读一笔交易内可变的数据。"]],["延迟是一种安全参数",["反过来，时间也能成为防线：延迟是一种安全参数。","2025 年 2 月 Bybit 被盗后，攻击者尝试赎回 cmETH。mETH 协议有 8 小时提款延迟，团队来得及暂停合约，追回 15000 枚 cmETH，约 4300 万美元。","延迟把攻击者完成攻击的时间，从一笔交易拉长到几个小时，让监控和人工有机会介入。代价是，正常用户也要等。"]],["稳定币的规则写在链外",["还有一类规则，写在链外：稳定币。","稳定币的价值，不取决于合约代码，而取决于链下的储备、赎回规则，和发行方的权限。","打个比方，它像一张银行开的提货单：仓库里的货不够，印得再好也不值一美元。比方不成立的地方是：作废提货单要走法律程序，冻结一个地址上的代币，通常只要一笔交易。"]],["储备与铸币权，都是规则",["2023 年 3 月，Circle 约 33 亿美元储备存在倒闭的硅谷银行。USDC 最低跌到约 0.87 美元，以它为主要抵押的 DAI，也跌到约 0.90 美元。","铸币权也是规则。2026 年 5 月的 StablR，铸币由一个 1/3 多签控制；攻击者拿下一个签名人，就增发了约 1350 万美元。","DeFi 协议把稳定币当作抵押品，就继承了这些链下风险。"]],["答案：先写不变量，再逐个入口核对",["回到开头：代码没错、规则错了，怎么发现？","第一步，先写不变量：每个账户健康，整个协议的资产不少于债权。再用不变量测试，让工具去找打破它的调用顺序。","第二步，把所有入口排成表，逐行核对：减少抵押品或增加债务之后，有没有检查健康因子。Euler 缺的，就是表里的一格。"]],["风险参数清单，与成立条件",["第三步，给每个模块列风险参数：投票快照和时间锁，奖励的数据来源，赎回延迟和暂停权，低流动性抵押品的上限，稳定币的储备和铸币权限。","成立条件：不变量只覆盖你写下来的东西；多种抵押品之间的相关性、治理本身被攻击，都要单独评估。"]]]}}},{"id":"12","title":"跨链桥安全：两条链之间的那条缝","md":"../chapters/12-cross-chain-bridges.md","v":{"vs":{"src":"skeuo/ep12/out/ep12-full.mp4","cues":[[1.65,3.42,"2022 年 3 月 23 日"],[3.52,6.87,"Ronin 跨链桥被提走约 17.36 万枚 ETH"],[7.05,9.76,"和约 2550 万枚 USDC"],[10.75,12.07,"只用了两笔交易"],[13.06,15.14,"这座桥有 9 个验证者"],[16.13,17.11,"一笔提款"],[17.31,18.71,"只要其中 5 个签名"],[18.87,19.79,"就会放行"],[20.77,23.16,"听上去 要攻破过半数的人"],[24.13,25.46,"先猜一道题"],[26.44,27.59,"9 个验证者里"],[27.7,30.67,"有 4 个由同一家公司 Sky Mavis 运营"],[31.65,32.67,"第 5 个签名"],[32.69,35.42,"可以通过 Axie DAO 的一项授权拿到"],[35.79,36.85,"这项授权"],[36.97,38.52,"本应早就撤销"],[39.5,41.73,"攻击者最少要攻破几个组织"],[43,44.05,"答案是两个"],[45.1,47.34,"门限写的是 9 个里要 5 个"],[47.48,49.38,"独立的防线却只有两道"],[50.36,53.05,"按 Ronin 复盘和 Elliptic 的分析"],[53.24,55.68,"攻击者控制了这 5 个验证者的签名"],[56.67,58,"公开报道的损失"],[58.08,59.45,"约 6.2 亿美元"],[60.44,64.02,"一座桥 凭什么相信另一条链上发生的事"],[67.18,68.64,"先给准确的说法"],[69.63,73.83,"跨链桥 是在两条链之间转移资产或消息的系统"],[74.8,75.93,"B 链上的合约"],[76.06,78.45,"要相信 A 链上发生了某件事"],[79.43,81.07,"可 B 链看不到 A 链"],[81.43,83.08,"它只能相信某种证明"],  生态"]],"ch":[]},"talk":{"src":"slides/EP12-cross-chain-bridges.html","scenes":[["开场",["大家好，欢迎来到主线第12集，跨链桥安全，损失最大的一类事故。一句话理解，跨链桥让 B 链上的合约相信，A 链上发生了某件事。B 链看不到 A 链，所以它只能相信某种证明。证明机制被骗，桥上的全部资产就被骗走。","看三起事故，以下据公开报道。2021年，Poly Network 约6.1亿美元，用一个选择器碰撞，换掉了验证者的公钥，后来攻击者归还了。","2022年，Ronin 约6.2亿美元，验证者私钥被拿到。","同年，Wormhole 约3.2亿美元，Solana 一侧没有校验传入的系统账户是否真实。跨链桥往往是整个系统里最大的一笔钱，所以是攻击者的首选目标。"]],["两座城市的银行",["打个比方。两座城市之间没有电话。A 城的银行收下你的金条，给你开一张提货单，你拿到 B 城银行兑换等值金券。B 城银行怎么知道提货单是真的？有四种办法。看5个公证人的签章，这是多签。自己派人常驻 A 城核对账本，这是轻客户端。","或者，先兑付，但留7天让任何人举报造假，这是乐观证明。还有，用一种数学方法，不看账本也能确认账本内容，这是零知识证明。","公证人的印章被偷，或者核对方法有漏洞，B 城银行就会兑出不存在的金子。而两座城的金库加起来，往往是整个系统里最大的一笔钱。这就是跨链桥。"]],["锁定-铸造的消息流",["看锁定铸造桥的基本流程。用户在 A 链存入100 USDT，被锁定。A 链的桥合约发出一个存款事件。","中继者观察 A 链，等待最终性，然后把消息和证明提交到 B 链的桥合约。这个证明，可能是签名、Merkle 证明或者零知识证明。","B 链的桥合约验证证明，并检查这个消息的序号没有被使用过。","验证通过，B 链铸造100个映射 USDT 给用户。关键在第5步，这是唯一的信任边界。B 链只能通过这一步的验证来判断真伪。它要同时检查三件事，证明有效，消息没被处理过，消息来自正确的源链和源合约。反向流程，销毁再解锁，有同样的风险，金额往往更大。"]],["四种验证方式",["四种验证方式，本质是你在信任谁。外部多签或 MPC，信任 M 选 N 个验证者，风险是私钥泄露、共谋或者阈值过低，例子是 Ronin。轻客户端或原生证明，信任源链的共识加上验证代码，风险是验证代码有漏洞，例子是 Token Hub。","乐观证明，信任至少有一个诚实的挑战者，风险是挑战期内无人监控，或者挑战者被审查。零知识证明，信任数学、实现和可信设置，风险是电路或验证器实现错误，或者验证器路由被替换。","注意，二层网络的原生桥，也是一种跨链桥。它的安全性，取决于证明系统和升级权限两者。据 L2BEAT，Mantle 用有效性证明，但输出预言机可由工程多签切换到乐观模式，桥合约可由安全多签无延迟升级。链专题 C03 会详细讲。"]],["四类根因",["跨链桥事故可以归入四类根因。第一类，私钥与运营。Ronin 就是，9个验证者里5个签名放行，攻击者控制了5把私钥，其中4把属于同一机构，1把来自本应撤销的授权。阈值的意义，取决于签名人的独立性。4把钥匙放在同一个地方，等于1把。","第二类，验证逻辑。Token Hub，攻击者没偷任何私钥，而是利用了证明验证代码的缺陷，伪造消息铸造了200万 BNB。还有 Wormhole，Solana 一侧没有校验传入的系统账户是否真实。","第三类，初始化。Nomad，升级时把可信根设成零，任何消息都被视为已证明，第10集讲过。第四类，存款伪造。Qubit，对零地址调用转账返回成功，桥记录了不存在的存款，第7集讲过。","特别看 Poly Network，它属于验证逻辑类，手法很典型。跨链管理合约允许消息调用任意目标函数。攻击者构造一个函数名，让它的4字节选择器，和替换验证者公钥的那个函数相同，于是通过跨链消息，把验证者公钥换成了自己的，然后签发任意提款。所以，跨链消息执行器绝不能调用持有特权的合约，目标地址和函数选择器都要白名单化。"]],["交易所充值也是一座桥",["这里插一个重要视角。交易所的充值系统，做的事情和跨链桥一样，相信链上发生了一笔转账，然后在内部账本上记账。所以它有同样的风险。伪造存款事件，对应假币合约发出同名的转账事件，防御是校验代币合约地址，不是名称。","消息未检查执行状态，对应交易执行失败却被误读为成功。比如 TRON 上能量不足导致交易回滚，但只看交易存在就入账，防御是先检查回执状态为成功。重放，对应同一笔交易重复入账，用交易哈希加日志序号做幂等键。","源链重组，对应入账后区块被回滚，要等足够确认数。收税变基代币，对应入账金额不等于实收，以余额变化为准。特别注意 TRON，失败的转账交易仍然会上链，还有交易哈希。只看交易存在就入账，就会产生假充值。这在评估篇第3集也讲过。"]],["防御清单",["防御清单六条。第一，验证者集合，阈值高于三分之二，签名人在组织、地域和基础设施上独立，定期审计签名权清单。第二，消息格式包含源链 ID、源合约、目标链 ID、目标合约和序号，目标侧逐项校验。","第三，消息执行，目标地址和函数白名单，不允许调用特权合约，这是 Poly 的教训。第四，限额，单笔和单位时间的提款上限，超过上限进入延迟队列。","第五，监控，两侧总供应量对账，锁定量要大于等于铸造量，异常时自动暂停。第六，升级，桥合约升级必须有时间锁，初始化参数必须审计，这是 Nomad 的教训。"]],["审计检查点",["审计检查点七个。第一，消息哈希包含源链、源合约、目标链、目标合约和序号。第二，已处理的消息有防重放标记。","第三，证明验证代码，比如 Merkle、签名、零知识验证器，有独立的审计和测试向量。第四，零值、空数组、未初始化的根，不会被当作有效证明，这是 Nomad。","第五，原生币和 ERC-20 走不同的路径，彼此不能混用，这是 Qubit。第六，有速率限制和全局供应量对账。第七，签名人清单、阈值、私钥存放方式已经披露。"]],["练一练",["来练一练。一个桥有7个验证者，阈值4。这7个里有3个由同一家云服务商托管。实际的安全阈值是多少？","参考答案。攻破那家云服务商，就一次拿到3把钥匙。还差1把，攻击者只需要再攻破1个独立的验证者，就凑够4个。所以名义阈值是4，实际阈值大约是2，一次云加一个人。结论是，阈值要和签名人的独立性匹配，这正是 Ronin 的教训。"]],["小结与预告",["小结三点。第一，桥只能相信证明。验证那一步，要查证明有效、未重放、来源正确。","第二，四类根因是私钥、验证逻辑、初始化、存款伪造。消息执行器绝不碰特权合约。","第三，阈值要配签名人的独立性。交易所的充值就是一座桥，要查地址、查回执、查幂等。","下一集讲审计、测试与开发流程，把前面所有知识变成一套可执行的流程。八个安全关口，模糊测试和不变量测试，以及一页速查表。下集见。"]]]},"deck":{"src":"../decks/skeuomorphic/ch12/index.html","scenes":[["Ronin：两笔交易被提空",["2022 年 3 月 23 日，Ronin 跨链桥被提走约 17.36 万枚 ETH，和约 2550 万枚 USDC。","只用了两笔交易。"]],["9 个验证者，5 签放行",["这座桥有 9 个验证者。","一笔提款，只要其中 5 个签名，就会放行。","听上去，要攻破过半数的人。"]],["先猜一道题",["先猜一道题。","9 个验证者里，有 4 个由同一家公司 Sky Mavis 运营。","第 5 个签名，可以通过 Axie DAO 的一项授权拿到。这项授权，本应早就撤销。","攻击者最少要攻破几个组织？"]],["答案：两个组织",["答案是两个。","门限写的是 9 个里要 5 个，独立的防线却只有两道。","按 Ronin 复盘和 Elliptic 的分析，攻击者控制了这 5 个验证者的签名。","公开报道的损失，约 6.2 亿美元。","一座桥，凭什么相信另一条链上发生的事？"]],["B 链只能相信证明",["先给准确的说法。","跨链桥，是在两条链之间转移资产或消息的系统。","B 链上的合约，要相信 A 链上发生了某件事。","可 B 链看不到 A 链。它只能相信某种证明。"]],["锁定和铸造：先锁定",["最常见的做法，叫锁定和铸造。","举个例子。用户在 A 链，把 100 USDT 存进桥合约，锁起来。","桥合约发出一条存款事件，写着用户、金额和一个序号。"]],["中继者送来消息和证明",["中继者观察 A 链，等这笔交易足够确定，不会再被回滚。","然后把消息和证明，一起送到 B 链。","证明可以是一组签名，一条 Merkle 证明，或者一份零知识证明。"]],["验证通过才铸造",["B 链的桥合约验证证明，再检查这个序号没有用过。","都通过了，才给用户铸造 100 枚映射 USDT。"]],["信任边界：验证三件事",["注意中间这一段。","从 A 链到 B 链，是信任边界。B 链判断真假，只能靠这一步验证。","验证要同时查三件事。","证明是有效的。消息没有被处理过。消息来自正确的源链和源合约。"]],["比喻：提货单和签章",["打个比方。","A 城的银行收下你的金条，开一张提货单。你拿着它，到 B 城银行兑换等值的金券。","B 城银行看不到 A 城的账本，只能看提货单上的签章。","印章被偷，或者核对方法有漏洞，B 城银行就会兑出不存在的金子。"]],["桥是攻击者的首选目标",["比喻不成立的地方是，两座银行的金库加起来，往往是整个系统里最大的一笔钱。","所以跨链桥，是攻击者的首选目标。","反过来走，销毁映射代币、解锁原来的资产，风险一样，金额往往更大。","那么，B 链到底该相信谁？"]],["第一种：外部多签或 MPC",["验证的方式，大致有四种。差别在于，你信任谁。","第一种，外部多签，或者 MPC。","一组验证者，凑够门限个签名，就放行。","你信任的是这些签名人。风险是私钥泄露，验证者共谋，或者门限太低。","Ronin 就是这一种。"]],["第二种：轻客户端",["第二种，轻客户端，也叫原生证明。","B 链上的合约，自己验证 A 链的区块头和证明。","你信任的是 A 链的共识，加上这段证明验证代码。","代码有漏洞，证明就能伪造。2022 年的 BNB Chain Token Hub，属于这一种。"]],["第三种：乐观证明",["第三种，乐观证明。","消息默认有效，但留出一段挑战期。这期间，任何人都可以提交欺诈证明推翻它。","你只需要一个诚实的挑战者。风险是挑战期里没人盯着，或者挑战者被审查。","多数乐观 Rollup 的原生桥，用的是这一种。"]],["第四种：零知识证明",["第四种，零知识证明。","用数学证明 A 链的状态变化是正确的，不用逐条核对账本。","你信任的是数学，加上证明系统的实现和可信设置。电路或验证器写错，一样会出事。"]],["再猜一道题",["再猜一道题。一座 ZK 桥，证明系统完全正确，但桥合约可以被一个多签无延迟升级。","用户只需要信任数学吗？"]],["答案：还要信任升级权",["不是。多签可以把桥合约换成新实现，绕过证明系统。","用户同时信任证明系统，和升级权限的持有人。"]],["L2 原生桥也是跨链桥",["按 L2BEAT 截至 2026 年的页面，Mantle 用的是 OP Succinct 有效性证明。","但它的输出预言机，可以由工程多签切换到乐观模式。桥合约可以由安全多签无延迟升级。","L2 的原生桥，也是一座跨链桥。它的安全，取决于证明系统和升级权限两样。"]],["第一类：私钥与运营",["跨链桥事故的根因，大致分四类。私钥，验证逻辑，初始化，存款伪造。","第一类，私钥与运营。","Ronin 那 5 把私钥里，4 把属于同一机构，1 把来自一项本应撤销的授权。","公开报道称，私钥是通过社会工程拿到的。","门限的意义，取决于签名人是否独立。4 把钥匙放在同一个地方，等于 1 把。"]],["第二类：验证逻辑被骗",["第二类，验证逻辑。","2022 年 10 月，BNB Chain 的 Token Hub，被一份伪造的 IAVL Merkle 证明骗过了校验。","凭空铸出 200 万枚 BNB，约 5.7 亿美元。其中约 1 亿美元以上，被转到其他链。","没有私钥被偷。被利用的，是证明验证代码。","BSC 验证者约 3 小时后暂停了全链，再用 Moran 硬分叉修复了校验。"]],["Wormhole：账户没核对",["2022 年 2 月的 Wormhole，Solana 一侧的合约，没有核对传进来的系统账户是不是真的。","伪造的账户绕过了守护者的签名验证，铸出约 12 万枚 wETH，约 3.2 亿美元。"]],["Poly：特权函数被调用",["2021 年 8 月的 Poly Network，跨链消息可以调用任意合约的函数。","其中包括一个替换验证者公钥的特权函数。公钥被换掉，伪造的提款就能签出来。","损失约 6.1 亿美元，后来攻击者归还了资产。","所以，跨链消息的执行器，不能调用持有特权的合约。目标地址和函数，都要列白名单。"]],["第三类：初始化",["第三类，初始化。2022 年 8 月，Nomad 升级时，把可信根设成了零值。","结果任何消息，都被当作已经证明过。"]],["第四类：存款伪造",["第四类，存款伪造。2022 年 1 月的 Qubit，对零地址调用转账函数，返回了成功，桥就记下了一笔不存在的 ETH 存款。"]],["合约正确，桥也会被掏空",["另有一种情况，合约代码完全正确。","2026 年 4 月 18 日，一条伪造的 LayerZero 消息，让 Ethereum 上的适配器放出约 11.65 万枚 rsETH，约 2.92 亿美元。","这条路径只有一个验证者。LayerZero 称，攻击者控制了它依赖的两个 RPC 节点，让验证者看到假数据。","桥只相信验证者，验证者只相信 RPC。没有第二个独立来源可以比对。"]],["责任之争与教训",["责任仍有争议。LayerZero 称问题限于 KelpDAO 的配置，KelpDAO 称单个验证者来自默认设置。","按 Chainalysis 的分析，KelpDAO 暂停合约，拦下了第二次约 4 万枚 rsETH 的伪造消息。","按 The Block 报道，LayerZero 后来道歉，承认不应允许它的验证者单独验证高价值交易。","合约没有错，桥一样会被掏空。验证者的数量和数据来源，都要有冗余。"]],["防御：验证者",["把这些根因倒过来，就是防御。","先看验证者。门限要高于三分之二。","签名人在组织、地域和基础设施上都要独立，并且定期核对签名权清单。"]],["防御：消息逐项核对",["再看消息。消息里要写明源链、源合约、目标链、目标合约和序号，目标侧逐项核对。","处理过的消息要打上标记，防止重放。"]],["防御：证明与执行",["证明验证代码要有独立审计和测试向量。零值、空数组、没初始化的根，都不能当作有效证明。","Merkle 树的叶子和中间节点，要用不同的哈希前缀。","执行消息时，目标地址和函数走白名单，不许碰特权合约。"]],["防御：限额、监控、升级",["然后是限额。单笔和单位时间的提款都有上限，超过就进延迟队列。","监控两侧的总量。A 链锁定的，要不少于 B 链铸造的。对不上，就自动暂停。","最后是升级。桥合约升级必须经过时间锁，初始化参数必须审计。"]],["交易所充值也是一座桥",["同样的问题，也出现在交易所的充值系统里。","交易所相信链上发生了一笔转账，然后在内部账本上记账。这也是一座桥。","假币合约会发出同名的转账事件。所以要核对代币合约地址，不看名称和符号。"]],["防假充值",["在 TRON 上，转账失败的交易，比如能量不足，仍然会上链，也有交易哈希。","只看交易存在就入账，就会出现假充值。要先确认回执状态是成功，再看事件。","同一笔交易，用交易哈希加日志序号做幂等键，防止重复入账。","入账前等够确认数，防止源链重组把这笔交易抹掉。"]],["今天能做的一件事",["每个人，今天能做一件事。","写桥的人，把源链、目标链、两侧合约和序号，全部写进消息哈希。","审计的人，列出签名人和运营商，算一算攻破几个独立组织，就能放行一条伪造消息。","普通用户，跨链前先看这座桥靠什么验证。L2BEAT 会列出风险。","只用官方入口。跨链后核对收到的代币合约地址，不要长期拿着映射代币。"]],["回到开头：两个",["回到开头的问题。9 个验证者，最少要攻破几个组织？","两个。门限是 9 个里要 5 个，可签名人并不独立。","这个答案成立的前提，是那项本应撤销的授权仍在生效。","跨链桥的安全，就看 B 链凭什么相信。证明机制被骗，桥上的钱就会被骗走。"]]]},"d3b":{"src":"../decks/3b1b/ch12.html","scenes":[["Ronin：两笔交易提走 17.36 万 ETH",["2022 年 3 月 23 日，攻击者用两笔交易，从 Ronin 跨链桥提走 173600 枚 ETH 和 2550 万 USDC。","这座桥有 9 个验证者，凑齐 5 个签名，就放行一笔提款。"]],["签名是真的，提款就放行了",["攻击者拿到了 5 把私钥。合约照规则验证签名，签名是真的，提款就放行了。按事发时估值，损失约 6.2 亿美元。","这引出一个根本问题：桥凭什么相信另一条链？"]],["锁定，然后铸造",["先看一座桥最简单的工作方式：锁定，然后铸造。","用户在 A 链把 100 USDT 存进桥合约，锁起来。合约发出一个存款事件。","中继者或验证者观察 A 链，等到交易不会被回滚，再把消息和一份证明，提交到 B 链。"]],["B 链看不到 A 链：这是信任边界",["B 链的桥合约验证证明，确认消息没处理过，再给用户铸出 100 枚映射 USDT。","关键在这里：B 链看不到 A 链。从 A 链到 B 链这一段，是信任边界。B 链只能靠验证这一步判断真假。"]],["验证要同时查三件事",["验证要同时查三件事：证明有效；消息没被处理过；消息来自正确的源链和源合约。"]],["比方：提货单，与公证人的签章",["打个比方：两座城市之间没有电话。A 城银行收下你的金条，开一张提货单，你拿到 B 城银行去兑换。","B 城银行怎么知道提货单是真的？有四种办法。","看几个公证人的签章：这是多签或 MPC，信任的是 M 个验证者。"]],["另外三种验证办法",["派人常驻 A 城核对账本：这是轻客户端，信任的是源链共识，和证明验证代码。","先兑付，但留一段时间让任何人举报造假：这是乐观证明，信任至少有一个诚实的挑战者在盯着。","用数学方法，不看账本也能确认账本内容：这是零知识证明，信任的是证明系统和它的实现。"]],["比方不成立处：金库最大，还有升级权限",["比方不成立的地方是：两城金库加起来，往往是整个系统里最大的一笔钱。而且桥合约如果能被多签无延迟升级，你还要信任升级权限的持有人。"]],["门限 5/9，但 4 把钥匙属于同一家",["回到 Ronin。门限写的是：9 个里要 5 个。","但 9 把钥匙里，有 4 把属于同一家机构，Sky Mavis。","第 5 个签名，可以通过 Axie DAO 的一个授权取得，而这个授权本应早已撤销。","算一下：攻破 Sky Mavis，拿到 4 个签名；再走 Axie DAO 那条授权，凑够 5 个。"]],["阈值取决于签名人的独立性",["门限写的是 5/9，真正独立的防线，只有 2 道。公开报道称，私钥是通过社会工程拿到的。","教训：阈值的意义，取决于签名人的独立性。4 把钥匙放在同一个地方，等于 1 把。"]],["BNB Chain Token Hub：伪造 Merkle 证明",["第二类根因：不偷钥匙，骗过验证逻辑。","2022 年 10 月的 BNB Chain Token Hub：攻击者付了 100 BNB 注册成中继者，提交伪造的 Merkle 证明，骗过了证明校验。","凭空铸出 200 万枚 BNB，约 5.7 亿美元，其中 1 亿多美元被转到其他链。约 3 小时后，BSC 验证者暂停了整条链。"]],["Wormhole 与 Poly Network：骗过验证逻辑",["2022 年 2 月的 Wormhole：Solana 一侧的合约，没有校验传进来的系统账户是不是真的。伪造账户绕过了守护者签名验证，铸出约 12 万枚 wETH，约 3.2 亿美元。","2021 年 8 月的 Poly Network：跨链消息可以调用任意合约的函数。攻击者让一次调用撞上了替换验证者公钥的函数选择器，把公钥换成了自己的。损失约 6.1 亿美元，后来归还。"]],["四类根因，与执行器白名单",["再加上上一集的 Nomad 初始化，和 Qubit 的存款伪造，跨链桥事故大致归成四类根因：私钥、验证逻辑、初始化、存款伪造。","其中一条规矩：跨链消息的执行器，不能调用持有特权的合约；目标地址和函数选择器都要白名单。"]],["KelpDAO：合约没错，验证者被骗",["最后看一个合约代码完全没错的例子。","2026 年 4 月 18 日，一条伪造的 LayerZero 跨链消息，让以太坊上的适配器放出 116500 枚 rsETH，约 2.92 亿美元。","这条路径只有一个验证者。LayerZero 称，攻击者控制了这个验证者依赖的两个 RPC 节点，替换了节点程序，让它看到假数据。"]],["没有第二个独立来源可以比对",["桥只相信验证者的结论，验证者只相信 RPC 返回的数据。这条链上，没有第二个独立来源可以比对。","KelpDAO 暂停合约，拦下了第二条约 4 万枚 rsETH 的伪造消息。责任仍有争议，2026 年 9 月已经进入诉讼。","教训：验证者的数量，和数据来源，都要有冗余。"]],["交易所充值也是一座桥",["交易所的充值系统，其实也是一座桥：它相信链上发生了一笔转账，然后在内部账本上记账。","所以风险一一对应。假币合约也能发出同名的转账事件：要校验代币合约地址，而不是名字。","交易执行失败，回执却被误读成功。比如 TRON 上能量不足而回滚的交易，照样上链、有哈希：要先检查执行结果。"]],["重复入账、回滚与收税代币",["同一笔交易被重复入账：用交易哈希加日志序号做幂等键。入账后区块被回滚：等足够的确认，或者最终性。","收税或变基代币，入账金额不等于实收：以余额变化为准。"]],["答案：只能相信一份证明，外加升级权限",["回到开头的问题：桥凭什么相信另一条链？","它看不到另一条链，只能相信一份证明：签名、轻客户端、挑战期，或者零知识证明。再加上，能升级桥合约的人。","所以评估一座桥，先数一数：要攻破几个独立的组织、几个独立的数据来源，才能放行一条伪造的消息。Ronin 是 2 个；KelpDAO 那条路径，只有 1 个验证者。"]],["防线，以及成立条件",["防线也从这里来：门限高于三分之二，签名人真正独立；消息带上源链、源合约、目标链、目标合约和 nonce；执行目标白名单。","再加上限额和延迟队列；两侧供应量对账，锁定量不少于铸造量，异常就自动暂停；升级走时间锁，初始化参数要审计。","成立条件：这些检查只守住桥这一层。源链被重组、RPC 被替换、升级权限被拿走，都要单独评估。"]]]}}}]},{"name":"第四篇 · 非 EVM 与新范式","items":[{"id":"13","title":"非 EVM 生态：换一种账户模型，换一组漏洞","md":"../chapters/13-non-evm-ecosystems.md","v":{"vs":{"src":"skeuo/ep13/out/ep13-full.mp4","cues":[[1.65,2.85,"2022 年 2 月"],[2.98,5.26,"Wormhole 跨链桥在 Solana 一侧"],[5.39,7.72,"被铸出约 12 万枚 wETH"],[8.71,10.13,"按事发时的价格"],[10.18,11.65,"约 3.2 亿美元"],[12.65,14.04,"攻击者往程序里"],[14.06,15.96,"传了一个伪造的系统账户"],[16.95,18.46,"程序读了这个账户"],[18.61,20.68,"没有核对它是不是真的"],[21.66,23.3,"守护者的签名验证"],[23.42,24.87,"就这样被绕开"],[25.84,27.16,"先猜一道题"],[28.14,29.2,"在以太坊上"],[29.39,30.89,"合约要读另一个合约"],[30.95,32.98,"地址写在代码或存储里"],[33.96,35.03,"在 Solana 上"],[35.08,36.29,"程序要读的账户"],[36.31,37.23,"由谁提供"],[38.51,39.95,"先记住这个问题"],[40.94,43.34,"按 Kudelski 和 Halborn 的分析"],[43.51,46.2,"问题出在一个已经弃用的读取函数"],[47.18,49.46,"它不检查传进来的系统账户"],[49.51,51.09,"是不是真的系统账户"],[52.08,53.23,"修复的办法"],[53.27,54.91,"是改用带校验的函数"],[55.28,57.51,"Jump Crypto 补足了全部 ETH"],[58.5,59.62,"同样的错误"],[59.75,60.61,"换一条链"],[60.72,61.84,"就换了一副样子"],[62.84,64.33,"每种链上的程序"],[64.55,65.68,"到底在相信什么"],[68.85,70.3,"先给准确的说法"],[71.3,72.42,"执行模型"],[72.47,74.05,"是一条链怎么存状态"],[74.28,75.42,"怎么调用程序"],[75.59,77.02,"怎么决定谁能改什么"],[77.98,79.11,"漏洞的本质"],[79.17,80.55,"在哪条链上都一样"],[81.53,83.8,"程序相信了一个不该相信的输入"],[84.78,86.71,"变的 是输入的样子"],[87.71,88.82,"在 EVM 上"],[88.98,90.59,"合约拥有自己的存储"],[90.61,91.92,"攻击者换不掉它"],[92.29,94.38,"输入是参数和外部调用"],[95.37,96.41,"在 Solana 上"],[96.43,98,"程序本身不存状态"],[98.38,100.58,"账户全部由调用者传进来"],[101.56,102.54,"在 Move 上"],[102.65,104.52,"状态是带类型的对象"],[104.9,105.97,"输入是对象"],[106.06,108.23,"风险常在数学库和权限"],[109.22,110.39,"在 Bitcoin 上"],[110.43,111.6,"链只记录交易"],[111.97,113.63,"铭文这类资产的余额"],[113.65,115.25,"由链下的索引器解释"],[116.24,117.43,"在 Cosmos 上"],[117.63,119.39,"各条应用链用 IBC"],[119.41,120.86,"验证对方链上的状态"],[121.86,122.81,"打个比方"],[123.95,125.2,"五个国家的海关"],[125.35,126.32,"都要防走私"],[127.29,128.48,"EVM 查行李"],[128.6,129.95,"Solana 查护照"],[130.01,132.33,"Move 给每件货物贴防伪芯片"],[133.32,135.4,"Bitcoin 只查集装箱的封条"],[135.42,136.55,"不管里面装什么"],[136.91,139.41,"Cosmos 和邻国互认海关章"],[140.4,142.05,"走
