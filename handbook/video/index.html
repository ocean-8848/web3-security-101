用节点本地时钟判断过期；不同节点算出不同结果"],[326.6,328.41,"任何人都能让链停机"],[328.86,332.15,"每个区块开头和结尾自动执行的钩子里"],[332.15,336.57,"一个 panic 或者无界循环，就能让整条链停止出块"],[337.02,340.31,"重入也不只属于 EVM：2024 年"],[340.31,344.43,"ibc-hooks 的超时回调被发现可以重入"],[346.13,351.29,"这些差异落到交易所接入新链时，就变成一张检查清单"],[351.74,356.85,"交易模型：失败的交易会不会上链，结果字段叫什么？"],[356.85,361.7,"资产识别：代币靠合约地址、mint 地址、对象类型"],[361.7,364.22,"还是 denom 来唯一标识？"],[364.67,369.84,"账户模型：充值地址要不要预先创建，要不要租金？"],[369.84,374.34,"最终性：多久不可回滚，历史上停过链没有？"],[374.79,378.33,"节点有没有两个独立来源；签名曲线"],[378.33,383.53,"现有的 HSM 或 MPC 支不支持；元协议用哪个索引器"],[383.53,386.41,"验证者能不能冻结地址或回滚"],[386.86,390.09,"还有链官方的 SDK。2024 年 12 月"],[390.09,395.21,"Solana 官方的 JavaScript SDK 被植入窃取私钥的版本"],[395.21,399.94,"约 5 小时后撤下。签名服务不该和业务代码共用依赖"],[400.39,404.04,"照搬以太坊的接入逻辑，是假充值"],[404.04,406.96,"错账和资金丢失的主要来源"],[408.66,413.87,"回到开头的问题：换一种账户模型，要换哪些检查？"],[414.32,419.68,"先问同一个问题：这条链上，谁决定输入可信？再找出"],[419.68,421.69,"这里的输入长什么样"],[422.14,426.52,"Solana 查每个账户的所有者、签名、类型和地址"],[426.52,429.89,"校验链锚定到可信根；Move 查数学库"],[429.89,434.7,"能力分配和升级权限；比特币生态查索引器和链下软件"],[434.7,437.28,"Cosmos 查证明验证和确定性"],[437.73,442.57,"成立条件：你的 EVM 清单里，有几项到这里完全失效"],[442.57,445.02,"要重写；语言和共识的保证"],[445.02,447.67,"只在验证器和实现正确时成立"],[448.12,453.06,"下一集，证明对了，电路错了：ZK 与证明系统"]],"ch":[]},"deck":{"src":"../decks/skeuomorphic/ch13/index.html","scenes":[["Wormhole：假系统账户",["2022 年 2 月，Wormhole 跨链桥在 Solana 一侧，被铸出约 12 万枚 wETH。","按事发时的价格，约 3.2 亿美元。","攻击者往程序里，传了一个伪造的系统账户。","程序读了这个账户，没有核对它是不是真的。","守护者的签名验证，就这样被绕开。"]],["先猜一道题",["先猜一道题。","在以太坊上，合约要读另一个合约，地址写在代码或存储里。","在 Solana 上，程序要读的账户，由谁提供？","先记住这个问题。"]],["根因：弃用的读取函数",["按 Kudelski 和 Halborn 的分析，问题出在一个已经弃用的读取函数。","它不检查传进来的系统账户，是不是真的系统账户。","修复的办法，是改用带校验的函数。Jump Crypto 补足了全部 ETH。"]],["换条链，错误换副样子",["同样的错误，换一条链，就换了一副样子。","每种链上的程序，到底在相信什么？"]],["相信了不该信的输入",["先给准确的说法。","执行模型，是一条链怎么存状态，怎么调用程序，怎么决定谁能改什么。","漏洞的本质，在哪条链上都一样。","程序相信了一个不该相信的输入。","变的，是输入的样子。"]],["EVM 与 Solana",["在 EVM 上，合约拥有自己的存储，攻击者换不掉它。输入是参数和外部调用。","在 Solana 上，程序本身不存状态。账户全部由调用者传进来。"]],["另外三种输入",["在 Move 上，状态是带类型的对象。输入是对象，风险常在数学库和权限。","在 Bitcoin 上，链只记录交易。铭文这类资产的余额，由链下的索引器解释。","在 Cosmos 上，各条应用链用 IBC，验证对方链上的状态。"]],["比喻：五个国家的海关",["打个比方。","五个国家的海关，都要防走私。","EVM 查行李，Solana 查护照，Move 给每件货物贴防伪芯片。","Bitcoin 只查集装箱的封条，不管里面装什么。Cosmos 和邻国互认海关章。","走私者在每个国家，都找最薄弱的那一环。"]],["同一笔资产过好几国",["比喻不成立的地方是，真实的跨生态集成里，同一笔资产会经过好几个国家。","每多一种模型，就多一组需要专门知识的检查项。","先看护照这一关，Solana。"]],["Solana：账户都是输入",["Solana 程序拿到的每一个账户，都是用户输入。","第一件要查的，是 owner。这个账户，是不是归本程序所有。","第二件，是签名。管理员操作，必须检查管理员账户签了名。"]],["类型、调用目标、系统账户",["第三件，是类型。两种账户结构相同，攻击者就能拿一种冒充另一种。要靠判别字段区分。","第四件，是跨程序调用的目标。program id 由调用者传进来，就必须核对。","第五件，是系统账户。要用带校验的读取方式。Wormhole 缺的就是这一件。"]],["Cashio：信任链没有终点",["更隐蔽的一种，是信任链没有终点。","2022 年 3 月的 Cashio，存抵押品时，只检查了各个账户互相一致。","铸币检查没有把 mint 字段，锚定到一个可信的根。","攻击者伪造了整条账户链，用没有价值的代币，铸出约 20 亿枚 CASH。","损失的估计，rekt.news 约 4800 万美元，CertiK 约 5280 万美元。"]],["一端要落在可信锚点",["账户之间再一致，也要有一端，落在硬编码的地址，或本程序的 PDA 上。","PDA 要用规范的 bump。跨程序调用之后，要再次加载账户，不用内存里的旧数据。","Anchor 框架的账户约束，能自动做完大部分检查。但约束是开发者写的，漏写一个，就等于没有。"]],["Drift：签名的有效期",["签名的有效期，也是一种输入。","2026 年 4 月，按 Chainalysis 的分析，Drift 损失约 2.85 亿美元。","它的安全委员会，五个人里两人签名就能放行。迁移到新配置后，时间锁为零。"]],["持久 nonce 让签名长效",["至少两名成员，签了自己没有完全理解的审批。","Solana 的签名，本来约 1 分钟就会过期。持久 nonce 让这些签名长期有效。","Chainalysis 也说明，这些描述来自 Drift 自己的调查，未经独立验证。","管理操作要加时间锁，执行前再确认一次。"]],["Move 类型系统的边界",["Move 的类型系统，保证代币对象不能被复制，也不能凭空丢掉。","但它不保证数学正确，不保证权限正确，也不保证升级正确。"]],["Cetus：数学库常量写错",["2025 年 5 月 22 日，Sui 上的 Cetus 被攻击。","按 Dedaub 和 Cyfrin 的分析，漏洞不在 Cetus 自己的业务代码，在它依赖的开源数学库。","加流动性时，要把一个数左移 64 位。数学库先判断，这一步会不会溢出。","判断用的比较常量写错了。本该拦住的值，被放了过去。"]],["先猜一道题",["在 Move 上，位移溢出，交易会中止吗？"]],["答案：直接截断",["不会。位移溢出直接截断，交易照常执行。","攻击者存入约 1 个代币，拿到巨量的流动性份额，提走池子资产，约 2.23 亿美元。","Sui 验证者冻结了约 1.62 亿美元，治理投票后，转入共管多签，用于赔付。","所以审计范围，必须覆盖数学依赖库。位移和乘法溢出，要有显式检查。"]],["验证器本身也会写错",["语言的保证，也依赖验证器本身没写错。","2023 年，Zellic 发现，Move 字节码验证器在处理超长函数时，漏掉了控制流边，两道安全检查被绕过。","这个漏洞已修复，没有损失。"]],["Nemo：部署了未审计代码",["协议层的风险，仍然在升级权限和部署流程。","2025 年 9 月，Sui 上的 Nemo，开发者在审计后，私自部署了未审计的代码。","一个内部的闪电贷函数被设成公开，升级权限只有单签。损失约 240 万到约 260 万美元。","升级权限要用多签，加时间锁。部署的版本，必须等于审计的版本。"]],["Bitcoin：链下来解释",["Bitcoin 这一关，链只记录，链下软件来解释。","铭文和 BRC-20 的余额，不由比特币共识决定，由链下索引器解释同一批交易。"]],["先猜一道题",["先猜一道题。同一个铭文代币，两家平台显示的余额不同。比特币共识能裁决谁对吗？"]],["答案：共识不能裁决",["不能。共识只验证交易本身，不解释铭文内容。","按 Cointelegraph 报道，2023 到 2024 年，各平台的索引器版本不一致。Magic Eden 暂停交易，UniSat 警告存在双花风险。"]],["闪电网络：替换循环攻击",["闪电网络的资金安全，依赖用户在截止时间前，把交易打包上链。","2023 年 10 月披露的替换循环攻击，利用 mempool 的替换规则，把受害者的超时交易反复挤出去。","四家主要实现在披露前已发布缓解，未见在野利用。"]],["Liquid：凭空铸出",["BTC 跨链桥多靠多签或联盟。","2026 年 9 月 6 日，Liquid 侧链上，被凭空铸出约 4000 枚 L-BTC，再通过正常提现换成真实 BTC，约 3.19 亿美元。","Blockstream 称签名密钥没有泄露。联盟按软件给出的链状态，正常签了名。","第三方重建的根因，是范围证明的验证缓存，可能把无效输出当作已验证。官方完整复盘尚未确认。","门限签名只保证多数人同意，不保证被同意的状态是对的。储备要由独立的对账程序实时核对。"]],["Cosmos：互认对方状态",["Cosmos 这一关，各条链用轻客户端和 Merkle 证明，互认对方的状态。","2022 年 10 月的 Dragonberry，ICS-23 接受了伪造的不存在证明，可以伪造 IBC 超时，掏空托管账户。这个漏洞协调修复，没有损失。"]],["状态机必须确定",["状态机也必须是确定性的。","2021 年 10 月的 Jackfruit，授权模块用节点本地时钟判断过期。不同节点算出不同结果，任何人都能让链停机。","BeginBlock 和 EndBlock 里的 panic 或无界循环，也会让整条链停止出块。"]],["交易所接入一条新链",["放到一个具体场景里。交易所要接入一条新链。","照搬以太坊的接入逻辑，是假充值、错账和资金丢失的主要来源。","接入的人，先问这几件事。","失败的交易会不会上链，实际到账金额怎么读。"]],["接入前问清这几件事",["代币由什么唯一标识，合约地址、mint 地址、对象类型，还是 denom。有没有同名假币。","多少个区块之后不可回滚，历史上有没有停链。","有没有两个独立运营的节点。现有的 HSM 和 MPC，支不支持这条链的签名算法。","资产是否依赖链下索引器，用哪个版本，多个索引器的结果是否一致。"]],["供应链与普通用户",["链官方的 SDK 也是供应链。签名服务不要和业务代码共用依赖。","普通用户，跨链前确认代币的唯一标识，不只看名称。在 Solana 上签名时，看到陌生程序，不签。"]],["回到开头：调用者提供",["回到开头的问题。Solana 程序要读的账户，由谁提供？","由调用者在交易里传进来。所以程序必须自己核对每个账户的 owner、类型和地址。","这个答案只对 Solana 成立。换一条链，输入换了样子。","要问的仍是同一个问题，谁决定这个输入可信。","换一种账户模型，就换一组漏洞。"]]]},"d3b":{"src":"../decks/3b1b/ch13.html","scenes":[["Wormhole：伪造系统账户，铸出 12 万 wETH",["2022 年 2 月，攻击者在 Solana 上，向 Wormhole 传入一个伪造的系统账户，铸出 12 万枚 wETH，约 3.2 亿美元。"]],["EVM：合约要找的合约，地址写在代码或存储里",["在 EVM 上，一个合约要找另一个合约，地址写在代码或存储里。"]],["Solana：账户全由调用者传进来",["在 Solana 上，程序要读的账户，全都由调用者在交易里传进来。","程序不校验，攻击者就能换成伪造的。Wormhole 缺的，就是对这个系统账户的校验。","换一种账户模型，要换哪些检查？"]],["不变的是本质，变的是输入长什么样",["先说不变的部分：漏洞的本质，是程序相信了一个不该相信的输入。","变的是输入长什么样。EVM 里是参数和外部调用；Solana 里是调用者传进来的账户；Move 里是对象和数学库；比特币生态里，是链下索引器的解释。"]],["比方：五国海关；比方不成立处",["打个比方：五个国家的海关都要防走私。A 国查行李，B 国查护照，C 国给每件货贴防伪芯片，D 国只查集装箱封条，E 国和邻国互认海关章。","走私者在每个国家，都找最薄弱的那一环。","比方不成立的地方是：真实的跨生态集成里，同一笔资产会经过好几个国家。每多一种模型，就多一组需要专门知识的检查。"]],["Solana：状态在账户里，逐个查",["先看 Solana。在 EVM 里，合约拥有自己的存储，攻击者换不掉它。","在 Solana 里，程序本身不存状态。状态放在一个个独立的账户里，由调用者整列传进来。","所以每个账户，程序都要逐个查：它归谁所有，它有没有签名，它是什么类型，地址对不对。"]],["跨程序调用目标也要校验",["跨程序调用的目标，也要校验，不能由调用者指定。系统账户，要用带校验的方式读取。","Anchor 框架的约束，能自动做大部分检查。但约束是开发者写的，漏写一个，就等于没有。"]],["Cashio：账户彼此一致，还不够",["账户之间互相一致，还不够。","2022 年 3 月的 Cashio：铸币时只检查各个账户彼此对得上，却没把这条账户链，锚定到一个可信的根。","攻击者伪造了整条账户链，用没有价值的代币，铸出约 20 亿枚 CASH，损失约 4800 万到 5280 万美元。"]],["校验链必须终止于可信的根",["这就像一串证件互相作证，却没有一本来自真正的签发机关。","规则是：账户校验链，必须终止于程序硬编码的地址，或者本程序派生的地址。"]],["Move：位移溢出时截断，不中止",["再看 Move。它的类型系统保证：代币对象不能被复制，也不能被凭空丢弃。","但它不保证数学正确、权限正确、升级正确。还有一个反直觉的地方：Move 的位移运算溢出时，直接截断，不会中止交易。","算一个示例。一个 8 位的数 192，左移 2 位，应该是 768；8 位放不下，截断后变成 0。没有报错，程序照常往下走。"]],["Cetus：数学库的一个常量写错",["2025 年 5 月 22 日，Sui 上的 Cetus 被攻击。它依赖的开源数学库里，一个溢出检查的比较常量写错了，本该拦住的值被放行。","攻击者存入约 1 个代币，拿到巨量流动性份额，提走约 2.23 亿美元。Sui 验证者冻结了约 1.62 亿美元。"]],["语言的保证，不等于协议安全",["教训：审计范围要覆盖数学依赖库。语言的保证，还依赖字节码验证器本身没错；协议的风险，仍然来自升级权限和部署流程。"]],["比特币：链只记录，链下软件解释",["比特币生态的特点是：链只记录，链下软件来解释。","铭文、BRC-20 这类资产的余额，不由比特币共识决定，而由链下索引器解释同一批交易。索引器版本不一致，同一个地址在不同平台上，余额就不同。","闪电网络的资金安全，依赖用户在截止时间前把交易打包上链。攻击者可以利用内存池的替换规则，把受害者的交易挤出去。"]],["Liquid：门限签名不保证状态是对的",["2026 年 9 月 6 日，Liquid 侧链上凭空铸出约 4000 枚 L-BTC，又通过联盟的正常提现流程，换成真实的 BTC，约 3.19 亿美元。","Blockstream 称签名密钥没有泄露，联盟按软件给出的链状态正常签名。攻击者后来归还了约 85%。","教训：门限签名只保证多数人同意，不保证被同意的状态是对的。储备要由独立的对账程序实时核对。"]],["Cosmos IBC：证明验证有缺陷，就是桥风险",["Cosmos 用 IBC 跨链：轻客户端加 Merkle 证明，验证对方链的状态。证明验证有缺陷，就是上一集的跨链桥风险。","2022 年的 Dragonberry 漏洞，可以伪造一份不存在证明，掏空托管账户。它被协调修复，没有造成损失。"]],["状态机必须确定性；钩子里的 panic",["状态机必须是确定性的。2021 年的 Jackfruit 漏洞，用节点本地时钟判断过期；不同节点算出不同结果，任何人都能让链停机。","每个区块开头和结尾自动执行的钩子里，一个 panic 或者无界循环，就能让整条链停止出块。","重入也不只属于 EVM：2024 年，ibc-hooks 的超时回调被发现可以重入。"]],["接入新链：交易、资产、账户、最终性",["这些差异落到交易所接入新链时，就变成一张检查清单。","交易模型：失败的交易会不会上链，结果字段叫什么？资产识别：代币靠合约地址、mint 地址、对象类型，还是 denom 来唯一标识？","账户模型：充值地址要不要预先创建，要不要租金？最终性：多久不可回滚，历史上停过链没有？"]],["节点、签名、SDK：照搬以太坊是风险来源",["节点有没有两个独立来源；签名曲线，现有的 HSM 或 MPC 支不支持；元协议用哪个索引器；验证者能不能冻结地址或回滚。","还有链官方的 SDK。2024 年 12 月，Solana 官方的 JavaScript SDK 被植入窃取私钥的版本，约 5 小时后撤下。签名服务不该和业务代码共用依赖。","照搬以太坊的接入逻辑，是假充值、错账和资金丢失的主要来源。"]],["答案：问谁决定输入可信",["回到开头的问题：换一种账户模型，要换哪些检查？","先问同一个问题：这条链上，谁决定输入可信？再找出，这里的输入长什么样。","Solana 查每个账户的所有者、签名、类型和地址，校验链锚定到可信根；Move 查数学库、能力分配和升级权限；比特币生态查索引器和链下软件；Cosmos 查证明验证和确定性。"]],["成立条件：清单有几项完全失效",["成立条件：你的 EVM 清单里，有几项到这里完全失效，要重写；语言和共识的保证，只在验证器和实现正确时成立。"]]]}}},{"id":"14","title":"ZK 与证明系统：证明对了，电路错了","md":"../chapters/14-zk-proof-systems.md","v":{"vs":{"src":"skeuo/ep14/out/ep14-full.mp4","cues":[[1.65,2.91,"2026 年 6 月"],[3,4.31,"一个已经弃用的合约"],[4.33,5.47,"Aztec Connect"],[5.52,7.47,"被取走约 228 万美元"],[8.47,10.24,"这是两名攻击者的合计"],[10.31,11.88,"按事发时的估值"],[12.86,13.88,"奇怪的是"],[14.17,15.26,"每一个证明"],[15.33,16.38,"都通过了验证"],[17.38,18.76,"密码学没有失效"],[19.76,22.25,"攻击者没有破解任何一道数学题"],[23.22,26.02,"证明是一张数学凭据 它说"],[26.08,27.41,"这一批交易算对了"],[28.38,29.8,"合约检查了凭据"],[30.03,31.68,"钱还是被取走"],[32.66,33.98,"先猜一道题"],[34.97,36.33,"证明全部有效"],[36.58,38.54,"结算却少处理了一部分交易"],[39.53,41.09,"只修验证器合约"],[41.29,42.55,"能堵住这个洞吗"],[43.8,45.24,"先记住这个问题"],[46.23,47.52,"一套证明系统"],[47.56,48.78,"有哪几个环节"],[48.94,50.28,"每个环节会怎么坏"],[53.41,54.87,"先给准确的说法"],[55.87,57,"零知识证明"],[57.03,59.86,"是让验证者相信一个计算结果正确"],[59.94,61.07,"不用自己重算"],[61.24,62.88,"也看不到计算的秘密输入"],[63.86,65.03,"要证明的计算"],[65.21,68.06,"先写成一组数学约束 叫电路"],[69.05,70.74,"满足全部约束的输入"],[70.79,71.77,"才算正确"],[72.75,74.11,"证明器在链下"],[74.31,75.87,"按电路生成证明"],[76.86,78.18,"验证器在链上"],[78.39,80.74,"检查证明是不是满足这个电路"],[81.73,82.55,"有些方案"],[82.69,84.92,"开工前要先做一次可信设置"],[84.95,86.52,"生成证明用的参数"],[87.52,91.3,"最后 业务合约按证明里的公开输入 去结算"],[92.28,96.65,"电路 设置 证明器 验证器 结算"],[96.8,98.41,"任何一环都可能出错"],[99.41,100.37,"打个比方"],[101.5,102.76,"考试的阅卷机"],[102.84,104.54,"只核对答题卡上的格子"],[104.56,106.04,"是不是按规则涂满"],[107.03,108.72,"如果出题人漏写了一条"],[108.79,110.59,"第 5 题只能涂一个格子"],[111.59,114.03,"考生把第 5 题的 4 个格子全涂上"],[114.13,115.78,"阅卷机照样判对"],[116.78,117.92,"阅卷机没坏"],[118.02,119.39,"是规则漏了一条"],[120.38,121.97,"比喻不成立的地方是"],[122.12,124.75,"真实的电路有成千上万条约束"],[125.74,126.69,"漏写一条"],[126.75,128.62,"从外面看不出任何异常"],[128.74,129.8,"只能靠审计"],[129.97,131.97,"形式化验证和测试去找"],[132.94,134.29,"所以记住一句话"],[135.28 ，是规则漏了一条。"]],["验证器不查电路对错",["比喻不成立的地方是，真实的电路有成千上万条约束。","漏写一条，从外面看不出任何异常，只能靠审计、形式化验证和测试去找。","所以记住一句话。","验证器只检查证明是否满足电路，不检查电路是否写对。","先看出题这一关，电路。"]],["约束不足",["电路最常见的漏洞，叫约束不足。","某个值被算出来了，却没有被约束。","在 Circom 语言里，有一种写法只赋值，不约束。另一种写法，赋值的同时加上约束。","只用了前一种写法的信号，恶意证明者可以填任何值。"]],["余额 20，提款 25",["看一个玩具例子。账户余额是 20，有人要提款 25。","电路要求，新余额拆成 5 个二进制位，每一位只能是 0 或 1。"]],["最高位填 30，检查被绕过",["只去掉最高位的这一条，恶意证明者就把最高位填成 30。","电路里的数，算到一个上限就绕回去。填 30 之后，等式照样成立。","余额检查被绕过，提款 25 通过了验证。"]],["过度约束",["反过来，约束写得太严，叫过度约束。","合法的输入也无法生成证明，结果是拒绝服务，资金可能被锁住。"]],["Tornado 的先例",["真实的例子在 2019 年。","按 Trail of Bits 的介绍，Tornado Cash 用的一个哈希实现里，有一个输出只被赋值，没有被约束。","攻击者本可以伪造 Merkle 根，取走别人的资金。","团队发现后，抢先利用这个漏洞，把资金转走保护起来，再修复。","没有资金被盗。"]],["防御约束漏洞三条",["同类问题很多。0xPARC 维护的公开漏洞清单里，收录了大量这样的例子。","防御有三条。","用静态分析工具，找出没有约束的信号。","关键电路，做形式化验证。","每条约束写正反两种测试，恶意的输入也要测。"]],["可信设置与有毒废料",["电路写对之后，仍有三个地方会坏。","第一个，是可信设置。","Groth16 这类方案，要先做一次设置，生成证明密钥和验证密钥。","设置过程会产生秘密，俗称有毒废料。谁留着它，谁就能伪造任意证明。","所以设置用多方仪式。每人贡献一部分，只要有一人诚实销毁自己那份，秘密就拼不回来。"]],["Zcash：多出的元素",["按 ECC 的公告，Zcash 早期方案的设置产物里，多出了一些证明者用不到的元素。","拿到它们，就能把一个证明，改造成另一个陈述的有效证明，凭空增发 ZEC。","团队在 2018 年内部发现，升级换掉参数，2019 年才公开。团队称没有发现被利用的证据。"]],["证明器与 zkVM",["第二个，是证明器和 zkVM 本身。","2025 年 1 月，Plonky2 的查找表用 0 填充，恶意证明者总能证明一个固定的等式。","2025 年 7 月，ZKsync 的一个承诺漏掉了部分内部状态，无效的输入能伪装成有效。","安全委员会紧急升级，暂停证明生产，没有损失。"]],["验证器：有限域会绕回",["第三个，是验证器。","证明里的数，都在一个有限域里，到了阶 r 就绕回 0。","就像钟面，13 点和 1 点，指在同一个位置。"]],["x 加 r，证明照样有效",["验证器不检查公开输入小于 r，攻击者把 x 换成 x 加 r，证明照样有效。","合约却把它当成一个新数。只能用一次的记录，就能再用一次。","比喻不成立的地方是，钟面只有 12 格，有限域的阶是一个极大的数。","snarkjs 生成的验证器，过去同时接受这两个值。","所以验证器要校验全部公开输入都在域内，并跟踪上游的安全公告。"]],["回到 Aztec",["回到开头的 Aztec Connect。","它已经弃用，管理员密钥已经放弃，合约里却仍然有钱。"]],["笔数字段没被证明绑定",["证明按 32 笔交易一组校验。","L1 上的结算，只处理到一个字段写的笔数。","这个字段，没有和证明绑定，由攻击者填写。","攻击者把它设成 1。伪造的存款不被记账，证明仍然有效。"]],["问题在证明与结算的绑定",["按 rekt.news、SlowMist 和 Halborn 的分析，第一名攻击者取走约 219 万美元，第二名又取走约 8.8 万美元。","安全研究者的结论是，问题在证明和结算之间的绑定。","所以结算要用证明里的全部公开输入。数量、索引、长度，也必须被证明覆盖。","已经弃用的合约，要么彻底停用，要么继续放在监控和赏金范围里。"]],["放大到整条 L2",["同样的问题，放大到整条 L2。","欺诈证明的 Rollup，假设挑战期里至少有一个诚实的挑战者，提款要等几天。","有效性证明的 Rollup，假设证明系统可靠、电路正确，提款通常几小时。","两种证明系统，都能被运营方切换或暂停，链也能回滚。"]],["切回许可、回滚与分级",["2024 年 8 月，OP Mainnet 的故障证明在审计中发现漏洞，守护者把它切回许可模式。","2025 年 9 月，Starknet 的证明层发现状态不一致，拒绝出证明，链回滚约 1.5 小时。","L2BEAT 的 Stages 框架，按去掉运营方之后剩下多少保障，给 L2 分级。","Stage 越低，安全越依赖运营方和多签。"]],["开发者今天能做的",["具体到每个角色，今天就能做的一件事。","写电路的人，给每条约束，写一个恶意输入的测试。","写结算合约的人，列出证明里的每个公开输入，看有没有字段只被读取，没有被证明。"]],["运营方与普通用户",["运营 L2 或桥的人，验证器和电路的升级要走时间锁，紧急权限要公开。","普通用户，在 L2 上放大额资产前，先在 L2BEAT 上查它的 Stage。协议宣布弃用，及时取回资产。","使用隐私或 ZK 协议前，确认它有公开的电路审计和赏金计划。"]],["回到开头：不能",["回到开头的问题。只修验证器合约，能堵住这个洞吗？","不能。验证器确认的，是证明对这些公开输入成立。","漏洞在业务合约。结算几笔交易的边界，没有和证明绑定。","这个答案的前提，是电路、设置和验证器都没有出错。任何一环出错，有效的证明也会说谎。","证明对了，不等于电路对了，也不等于钱算对了。"]]]},"d3b":{"src":"../decks/3b1b/ch14.html","scenes":[["Aztec Connect：每个证明都通过验证",["2026 年 6 月，两名攻击者从已经弃用的 Aztec Connect 合约里，取走了大约 228 万美元。","奇怪的是，他们提交的每一个证明，都通过了验证。"]],["密码学没有失效：钱是怎么丢的",["密码学没有失效。","问题来了：证明全都是对的，钱是怎么丢的？","要回答它，先要看清一个证明系统，到底检查了什么。"]],["零知识证明的三个部分",["零知识证明，让证明者说服验证者：某个计算的结果是对的。","验证者不用重算一遍，也看不到计算里的秘密输入。","它由三个部分组成。第一个是电路：把要证明的计算，写成一组数学约束。","第二个是证明器，在链下运行，生成一个证明。","第三个是链上的验证器合约。它只检查一件事：这个证明，是否满足这个电路。"]],["验证器不检查：电路本身写对了没有",["注意它不检查的事：这个电路本身，写对了没有。"]],["阅卷机比方：规则少一条，就是约束不足",["打个比方。阅卷机只核对答题卡上的格子，是不是按规则涂的。","假如出题人漏写了一条规则：第 5 题只能涂一个格子。","考生把第 5 题的四个格子全涂上，阅卷机照样判对。","阅卷机没坏，是规则少了一条。这就叫约束不足。"]],["Circom 里只差一个符号；比方不成立处",["在 Circom 里，它常常只差一个符号：单箭头只赋值，不约束；双箭头才同时赋值和约束。","比方不成立的地方在于：真实电路有成千上万条约束，漏掉一条，从外面看不出任何异常。"]],["玩具电路：守恒与范围两条约束",["我们算一个玩具电路。余额是 20，所有运算都对 97 取模。这些数字只是示例。","第一条约束，守恒：新余额，等于 20 减去提款额。","第二条约束，范围：新余额拆成 5 个二进制位，每一位只能是 0 或 1。"]],["提 25：诚实的证明者生成不了证明",["现在有人想提 25。20 减 25，对 97 取模，得到 92。","5 个二进制位最多表示 31，凑不出 92，诚实的证明者生成不了证明。"]],["少一条约束，超额提款通过",["可是，如果最高位少了那条“只能是 0 或 1”的约束呢？","其他位全取 0，最高位取 30。16 乘 30 等于 480，480 对 97 取模，正好是 92。剩下的每条约束都成立，超额提款通过。"]],["整条链路有四处失败点",["电路只是一个失败点。把整条链路画出来，一共有四处。","电路约束不足：错误的结论，也能被证明。","可信设置的秘密没有销毁：持有它的人，能伪造任意证明。","验证器没有检查输入范围：一个证明，可以被改造后再用一次。","业务合约没有用上证明里的全部公开输入。","四处里，只有一处在验证器的代码里。另外三处，验证器根本看不到。"]],["有限域里，x 和 x 加 r 是同一个数",["先看验证器这一处。证明里的数字，都活在一个有限域里，数到 r 就绕回 0。","所以 x 和 x 加 r，在域里是同一个数。同一个证明，对两者都成立。","可合约记录“这个凭证用过了”，是按整数记的。","它把 x 加 r 当成一个新值，本该只能用一次的凭证，又能再用一次。"]],["snarkjs 验证器：一行检查修复",["snarkjs 生成的 Solidity 验证器，就曾同时接受这两个值。修复是一行检查：每个公开输入，都必须小于 r。"]],["可信设置：有毒废料要被销毁",["再看可信设置。Groth16 这类方案，要先举行一次仪式，生成证明用的参数。","仪式会产生一份秘密，俗称有毒废料。谁留着它，谁就能伪造任意证明。","所以多方仪式只要求一件事：至少有一名参与者，诚实地销毁了自己那一份。"]],["Zcash：仪式记录里留了多余元素",["Zcash 早期的方案还有另一种问题：仪式记录里，留下了证明者用不到的多余元素。","拿到它们，就能凭空增发 ZEC。团队 2018 年内部发现，当年修复，2019 年公开，称没有发现被利用的证据。","教训是：设置的全部产物，也要审计。"]],["numRealTxs 没有和证明绑定",["现在回到 Aztec Connect。它的证明，按 32 笔交易一组来校验。","可 L1 上的结算，只处理到一个叫 numRealTxs 的数字为止。","这个数字由提交方控制，却没有和证明绑定。","它被设得很小时，证明里其余的交易，就绕过了记账。证明本身，仍然有效。"]],["弃用的合约，仍是攻击面",["第一名攻击者取走约 219 万美元，第二名又取走约 8.8 万，合计约 228 万。","合约已经弃用，管理员密钥也已放弃，可钱还在里面。弃用的合约，仍是攻击面。"]],["L2 的信任假设：两种 Rollup",["把这个问题放大到 L2，就是整条链的信任假设。","乐观 Rollup 靠欺诈证明：假设挑战期内，至少有一个诚实的挑战者。提款通常要等几天。","ZK Rollup 靠有效性证明：假设证明系统可靠、电路正确。提款通常几个小时。"]],["运营方可以切换、暂停，甚至回滚",["两者还有一个共同点：运营方可以切换、暂停证明系统，链甚至可以回滚。","2024 年，OP Mainnet 的故障证明被切回许可模式。2025 年 9 月，Starknet 回滚了大约 1.5 小时。","L2BEAT 的 Stages 量的正是这一点：去掉运营方，还剩多少保障。"]],["答案：失守的是证明和结算之间的绑定",["回到开头的问题：证明全都是对的，钱是怎么丢的？","验证器只回答一件事：这个证明，对这些公开输入成立。","电路写没写对，业务合约有没有用上这些输入，它都不管。","Aztec Connect 的密码学没有失效，失守的是证明和结算之间的绑定。"]],["审计 ZK 系统要多问四句",["所以审计一个 ZK 系统，要多问四句：每个信号都有约束吗？公开输入都在域内吗？数量、索引、长度，被证明覆盖了吗？弃用的合约，还有人看着吗？"]]]}}},{"id":"15","title":"账户抽象与新钱包范式：账户变成了合约","md":"../chapters/15-account-abstraction-wallets.md","v":{"vs":{"src":"skeuo/ep15/out/ep15-full.mp4","cues":[[1.65,3.01,"2026 年 10 月"],[3.15,5.14,"一个以太坊热钱包出了事"],[6.14,9.25,"攻击者控制了 Binance 的内部签名服务"],[10.22,11.45,"他通过这个服务"],[11.47,14.96,"给热钱包设置了一份 EIP-7702 委托"],[15.96,16.9,"委托的目标"],[16.92,18.41,"是攻击者自己的合约"],[19.4,22.37,"随后 Binance 关闭了提现服务"],[23.36,24.69,"先猜一道题"],[25.67,26.66,"服务关了"],[26.85,28.61,"这份委托会自动失效吗"],[29.87,31.31,"先记住这个问题"],[32.3,33.52,"在旧的模型里"],[33.64,34.93,"签名的意思是"],[35,35.95,"转这笔钱"],[36.93,39.28,"现在 签名的意思变成"],[39.38,41.28,"允许这段代码替我做事"],[42.26,43.68,"签名的含义变大"],[43.78,45.11,"签错一次的后果"],[45.15,46.2,"也跟着变大"],[49.38,50.84,"先给准确的说法"],[51.83,52.95,"账户抽象"],[52.99,54.88,"是让合约代码来决定"],[55. ],[297.25,301.2,"Permit2 是 Uniswap 部署的统一授权合约"],[301.2,304.46,"只要你曾经把某个代币无限授权给它"],[304.46,308.13,"之后签一个链下签名，就能转走这个代币"],[308.58,310.01,"2024 年 10 月"],[310.01,314.4,"一名 PEPE 持有者签了一个 Permit2 钓鱼签名"],[314.4,319.18,"损失约 140 万美元。Permit2 合约本身没有被攻破"],[319.63,322.1,"所以钱包应该把这种签名"],[322.1,326.81,"当成和授权交易同一级别的操作，来解析和告警"],[328.51,333.53,"回到开头的问题：账户变成合约之后，花钱的是谁？"],[333.98,338.39,"是签名授权的那段代码。谁能让你签下授权"],[338.39,340.94,"谁就决定了那是什么代码"],[341.39,346.25,"Binance 的委托写在链上。停掉链下的提现服务"],[346.25,347.39,"撤销不了它"],[347.84,352.5,"所以托管方的签名策略要能识别 7702 授权"],[352.5,356.19,"不需要 7702 的热钱包，一律拒签"],[356.64,359.68,"监控要覆盖自有地址的代码变化"],[359.68,364.13,"一出现 0xef0100 开头的委托代码，立即告警"],[364.58,368.9,"Passkey 也一样：它保护的是登录，不是签名的内容"],[369.35,374.28,"下一集，链本身出了问题。攻击者控制的是共识时"],[374.28,375.63,"会发生什么？"]],"ch":[]},"deck":{"src":"../decks/skeuomorphic/ch15/index.html","scenes":[["热钱包被设了委托",["2026 年 10 月，一个以太坊热钱包出了事。","攻击者控制了 Binance 的内部签名服务。","他通过这个服务，给热钱包设置了一份 EIP-7702 委托。","委托的目标，是攻击者自己的合约。","随后，Binance 关闭了提现服务。"]],["先猜一道题",["先猜一道题。","服务关了，这份委托会自动失效吗？","先记住这个问题。"]],["签名的含义变大了",["在旧的模型里，签名的意思是，转这笔钱。","现在，签名的意思变成，允许这段代码替我做事。","签名的含义变大，签错一次的后果，也跟着变大。"]],["账户抽象",["先给准确的说法。","账户抽象，是让合约代码来决定，账户怎么验证、怎么执行。","协议不再写死，一把私钥签一笔交易。"]],["比喻：授权书",["打个比方。","以前去银行，每笔转账都要本人签字。","现在你可以签一份授权书，允许助理每天替你付 100 元以内的账单。","授权书让生活方便很多。","可如果签的是，允许持有人处理我全部财产，后果比签错一笔转账严重得多。"]],["链上委托立刻生效",["比喻不成立的地方是，纸质授权书要公证，也能去银行撤销。","链上的委托签名立刻生效，有时在多条链上同时生效。"]],["ERC-4337 的角色",["新流程里有哪些角色？先看 ERC-4337。","用户不直接发交易，而是提交一个用户操作，UserOperation。","Bundler 是打包者，把很多个用户操作，打包成一笔链上交易。","EntryPoint 是统一的入口合约，它先验证，再执行。"]],["验证与执行拆成两步",["第一步，问智能账户，签名对不对。","第二步，问 Paymaster，愿不愿意替用户付 Gas。","两步都通过，才执行用户要做的调用，最后结算 Gas。","验证和执行，被拆成了两步。","每一步的边界，都可能出错。"]],["边界一：用户签名",["第一个边界，是用户的签名。","用户签的，是用户操作的哈希。","哈希怎么编码，决定了哪些字段受签名保护。"]],["Alchemy 打包漏洞",["2023 年 3 月，Alchemy 披露过一个打包漏洞。","EntryPoint 的打包函数，直接读取动态字段的偏移量，没有检查。","结果，同一个用户操作，能算出不同的哈希。","不同的用户操作，也能算出同一个哈希。","示例 Paymaster 的签名，签完以后，内容仍能被改。","EntryPoint 已经修复，没有已知损失。"]],["边界二：Paymaster",["第二个边界，是 Paymaster 自己的签名。","这是另一套签名，也要覆盖链 ID、nonce 和有效期。","少了任何一项，就可能被重放或抢跑。"]],["边界三：账户验证逻辑",["第三个边界，是账户自己的验证逻辑。","验证只检查签名。","验证写错了，执行的就是攻击者的调用。"]],["删除 owner 可跨链重放",["2024 年 3 月，Code4rena 审计了 Coinbase Smart Wallet。","删除 owner 的操作，可以跨链重放。","各条链上，同一个位置的 owner 可能不同。","重放过去，可能删错人，甚至把账户永久锁死。","修复后，改成传入 owner 地址，再核对。"]],["Biconomy 与教训",["Biconomy 的审计里，智能账户的实现合约可以被销毁。","它的会话密钥模块，只限制单笔额度，不限制累计。","所以，哈希和签名要覆盖规范的编码和链 ID。","多链账户的管理操作，要防重放。"]],["EIP-7702：地址变指针",["再看 EIP-7702，它在 2025 年 5 月，随 Pectra 升级上线。","普通地址可以签一份授权，里面写三样东西。","链 ID、委托合约的地址、nonce。","签完，这个地址的代码，变成一个指针，指向那个合约。","从此，这个地址执行的，是那个合约的代码。","这就是委托，它是写在地址上的链上状态。"]],["风险：恶意合约与链 ID 0",["风险有三层。","第一层，委托给恶意合约，它的代码可以转走全部资产。","第二层，链 ID 填 0，授权在所有支持它的 EVM 链上都有效。","前提只是，那条链上这个地址的 nonce 对得上。","链 ID 是 0 的授权，钱包应该默认拒绝。"]],["合法合约，恶意批量",["第三层最常见，委托合约是合法的，用户却签了一个批量执行。","批量里的内容，是转走资产。","2025 年 5 月，一名用户这样损失了约 14.6 万美元。","2025 年 8 月，ScamSniffer 记录到两起同类钓鱼，约 100 万和 154 万美元。"]],["批量要逐项解码",["Wintermute 的统计显示，绝大部分委托，指向同一类复制来的扫币合约。","它们专门扫走，私钥已经泄露的地址收到的 ETH。","主要风险，不在恶意合约，而在对合法合约发出的恶意批量。","钱包必须把批量里的每一步，逐项解码给用户看。"]],["开发者的坑：初始化与存储",["开发者也有三个坑。","委托时不运行初始化代码，攻击者可以抢先初始化。","所以初始化数据，要由这个地址的私钥签名。","换委托合约时，旧存储仍在，新合约会读到错的数据。","要用命名空间存储，把两份数据隔开。"]],["老检查失效，默认拒绝",["交易发起者等于调用者，这个老检查，不再能证明对方是普通地址。","EIP-7702 原文写明，应用不应该请求用户签署委托授权。","网站请你升级成智能账户，默认拒绝。"]],["Passkey 的边界",["账户变成合约，登录和授权的方式也变了。","Passkey 用设备的安全芯片保存私钥，用指纹或面容解锁。","它能挡住钓鱼网站偷密码，挡不住恶意前端和恶意浏览器扩展。","你解锁以后，它们照样能请你签攻击者构造的操作。"]],["社交恢复",["社交恢复，由几位守护人一起恢复账户。","守护人不独立，或者账号被盗，恢复就成了入口。"]],["会话密钥要限范围",["Session Key 是会话密钥，主密钥授权的一把临时密钥。","它的范围要限定四件事：哪个合约、哪个函数、累计额度、有效期。"]],["Cardex：共用会话密钥",["2025 年 2 月，链游 Cardex 让所有用户，共用同一把会话密钥。","这把密钥的私钥，就写在前端代码里。","约 9000 个钱包受影响，损失约 40 万美元。","权限只限于游戏合约，用户的代币和 NFT 没有受影响。","范围限制起了作用。"]],["意图与 Solver",["意图，是用户只说目标，由 Solver 去找成交路径。","比如，用 1 ETH 换至少 3000 USDC。","用户的风险，是条件写得太宽，最低成交量太低，期限拖得太久。","协议的风险，在 Solver 和结算合约之间的信任。"]],["CoW：新 Solver",["2023 年 2 月，CoW Swap 新加入了一个 Solver。","它把结算合约里的 DAI，无限授权给一个有漏洞的合约。","结算合约里约一周的手续费被取走，约 16.6 万美元。","CoW DAO 罚没了这个 Solver 的保证金来赔偿。"]],["1inch：弃用的结算合约",["2025 年 3 月，一些第三方 Resolver，仍在用 1inch 已经弃用的 Fusion v1 结算合约。","它们只凭调用者是结算合约，就信任转发来的数据。","攻击者借此伪造订单，约 500 万美元，大部分经谈判退回。"]],["Permit2：授权加签名",["Permit2 是 Uniswap 部署的统一授权合约。","只要你把某个代币无限授权给它，之后一个链下签名，就能转走这个代币。","2024 年 10 月，一名 PEPE 持有者签了 Permit2 钓鱼签名，损失约 140 万美元。","没有发现 Permit2 合约本身被攻破，风险来自无限授权加上链下签名。"]],["开发者各做一件事",["按角色，各做一件事。","写智能账户的，签名覆盖链 ID 和入口合约地址，管理操作防跨链重放。","做钱包的，只委托给自己审计过的实现，批量逐项解码。","写合约的，别再用交易发起者，判断对方是普通地址。"]],["托管方与普通用户",["托管方，不需要委托的热钱包，一律拒签这类授权，自有地址的代码一变，立刻告警。","普通用户，网站请你升级成智能账户，拒绝，看不懂批量里的任何一步，不签。","用完的会话密钥和 Permit2 旧授权，记得撤销。"]],["回到开头：不会自动失效",["回到开头的问题，服务关了，委托不会自动失效。","委托是写在地址上的链上状态，要靠一笔新的授权清零。","那次事件里，约 3 小时 50 分后，委托才被清零。","停掉链下服务，无法撤销链上的委托。","账户变成了合约，签名就是在授权代码，签之前，先看清它允许什么。"]]]},"d3b":{"src":"../decks/3b1b/ch15.html","scenes":[["Binance 热钱包被设置了 7702 委托",["2026 年 10 月，攻击者通过 Binance 的内部签名服务，给一个以太坊热钱包设置了一项 EIP-7702 委托。","委托的目标，是攻击者的合约。","Binance 关闭了提现服务。可委托还在。"]],["委托写在地址上，是链上状态",["它是写在地址上的链上状态。大约 3 小时 50 分之后，它才被一笔新的授权清零。","问题来了：账户变成合约之后，花钱的到底是谁？"]],["签名的意思，从转钱变成允许这段代码",["先看签名的意思，变了什么。","在旧模型里，一把私钥签一笔交易。签名的意思是：转这笔钱。","账户抽象，把账户的验证和执行逻辑，交给合约代码来决定。","于是签名的意思变成了：允许这段代码，替我做事。","签名的含义变大了，签错一次的后果，也跟着变大。"]],["比方：从每笔签字，到一份授权书",["打个比方。以前去银行，每笔转账都要本人签字。","现在你可以签一份授权书：允许助理每天替你付 100 元以内的账单。","这很方便。可如果你签的是“允许持有人处理我的全部财产”，后果比签错一笔转账严重得多。"]],["比方不成立处：链上委托立刻生效",["比方不成立的地方在于：纸质授权书要公证，还能去银行撤销。","链上的委托签名立刻生效，有时还在多条链上同时生效。"]],["ERC-4337：经 EntryPoint 执行",["第一种做法是 ERC-4337。用户不直接发交易，而是签一个 UserOperation，交给 Bundler 打包。","Bundler 把它交给统一的入口合约，EntryPoint。","EntryPoint 先让智能账户检查签名，再问 Paymaster 愿不愿意替用户付 Gas，最后才执行。","用户的签名，覆盖的是 UserOperation 的哈希。哈希怎么编码，决定了哪些字段受保护。"]],["哈希编码，决定哪些字段受保护",["2023 年披露过一个打包漏洞：同一个 UserOperation，能算出不同的哈希。EntryPoint 已经修复，没有已知损失。","Bundler、Paymaster、账户实现，每一个都是一条新的信任边界。"]],["EIP-7702：地址的代码变成委托",["第二种做法是 EIP-7702，2025 年 5 月随 Pectra 升级上线。","普通地址签一个授权元组：链 ID、合约地址、nonce。签完，这个地址的代码，就变成指向那个合约的委托。","链 ID 写 0 时，这份授权在所有支持 7702 的 EVM 链上都有效，只要 nonce 对得上。所以钱包默认拒绝它。"]],["旧假设被打破；委托请求默认拒绝",["旧代码的假设也被打破了：tx.origin 等于 msg.sender，不再能证明调用者是普通地址。","EIP-7702 原文写明：应用不应该请求用户签署委托。网站弹出的委托请求，默认拒绝。"]],["多数时候，委托合约本身是合法的",["7702 上线之后，大额损失来自哪里？","多数时候，委托合约本身是合法的。用户签下的，是一个批量执行。","钱包原始显示只有一行：批量执行。逐项解码之后才看见，其中一步是把代币转给别人。"]],["风险在对合法委托的恶意批量调用",["2025 年 5 月，一名用户这样损失了约 14.6 万美元。8 月，又记录到约 100 万和 154 万美元的两起。","所以主要风险不在恶意的委托合约，而在对合法委托发出的恶意批量调用。钱包必须逐项解码。"]],["Session Key：限定范围的临时密钥",["再看 Session Key：主密钥授权的一把临时密钥，只能在限定范围里签名。","范围有四个维度：哪个合约，哪个函数，累计额度，有效期。","注意额度要算累计。假设只限制每笔 0.1 ETH，签 10 笔就是 1 ETH，签 100 笔就是 10 ETH。这些数字是示例。"]],["Cardex：共用密钥写在前端，范围限制仍起作用",["2025 年 2 月，链游 Cardex 让所有用户共用一把 session 密钥，私钥还写在前端代码里。","大约 9,000 个钱包受影响，损失约 40 万美元。","但用户的 ERC-20 和 NFT 没事，因为这把密钥的权限只限于游戏合约。范围限制起了作用。"]],["意图：最小成交量太低，期限太长，都是风险",["签名含义变大的，还有意图和 Permit2。","意图是说：我要用 1 ETH 换至少 3,000 USDC，路径由 Solver 去找。最小成交量太低、期限太长，都是风险。"]],["Permit2：一个链下签名就能转走代币",["Permit2 是 Uniswap 部署的统一授权合约。只要你曾经把某个代币无限授权给它，之后签一个链下签名，就能转走这个代币。","2024 年 10 月，一名 PEPE 持有者签了一个 Permit2 钓鱼签名，损失约 140 万美元。Permit2 合约本身没有被攻破。","所以钱包应该把这种签名，当成和授权交易同一级别的操作，来解析和告警。"]],["答案：花钱的是签名授权的那段代码",["回到开头的问题：账户变成合约之后，花钱的是谁？","是签名授权的那段代码。谁能让你签下授权，谁就决定了那是什么代码。","Binance 的委托写在链上。停掉链下的提现服务，撤销不了它。"]],["防线：识别 7702 授权，监控代码变化",["所以托管方的签名策略要能识别 7702 授权，不需要 7702 的热钱包，一律拒签。","监控要覆盖自有地址的代码变化：一出现 0xef0100 开头的委托代码，立即告警。","Passkey 也一样：它保护的是登录，不是签名的内容。"]]]}}}]},{"name":"第五篇 · 链与基础设施","items":[{"id":"16","title":"共识层与链级安全：当链本身出问题，先问攻击者控制了什么","md":"../chapters/16-consensus-chain-security.md","v":{"vs":{"src":"skeuo/ep16/out/ep16-full.mp4","cues":[[1.65,3.37,"2025 年 12 月 4 日"],[3.44,6.27,"以太坊主网刚完成 Fusaka 升级"],[7.27,8.75,"上线约 5 小时后"],[8.92,11.87,"Prysm 客户端的一个 bug 在主网触发"],[12.86,14.31,"全网投票参与率"],[14.42,16.07,"跌到约 75%"],[17.07,19.92,"18.5% 的 slot 没有出块"],[20.89,23.41,"验证者少拿约 382 ETH 奖励"],[24.4,25.72,"链一直在出块"],[25.87,28.16,"参与率也仍然高于三分之二"],[29.15,30.48,"先猜一道题"],[31.46,32.64,"如果同样的 bug"],[32.66,35.18,"出在占比超过三分之一的客户端上"],[36.17,38.15,"只按 N 个区块入账的交易所"],[38.24,39.11,"会看到什么"],[40.39,41.83,"先记住这个问题"],[42.82,44.35,"链本身出问题时"],[44.48,46.1,"第一步不是看区块数"],[47.09,48.02,"而是先问"],[48.2,49.67,"攻击者或者故障"],[49.75,50.63,"控制了什么"],[53.78,55.24,"先给准确的说法"],[56.23,58.37,"共识 是网络里的节点"],[58.46,59.89,"就哪条链是正确的"],[59.91,61.25,"达成一致的机制"],[62.24,65.6,"重组 是节点放弃已经接受的几个 终确定的批次"],[408.3,414.28,"先问攻击者控制了什么：身份、算力、时机、权益、动机"],[414.28,419.31,"还是让链停下的份额。控制的不同，防线就不同"],[419.76,423.25,"成立的前提是：这些规则会随算力"],[423.25,426.05,"币价和客户端份额一起复核"],[426.5,432.38,"下一集，我们从链走到节点。你读到的链，是谁告诉你的？"]],"ch":[]},"deck":{"src":"../decks/skeuomorphic/ch16/index.html","scenes":[["Fusaka 后的 bug",["2025 年 12 月 4 日，以太坊主网刚完成 Fusaka 升级。","上线约 5 小时后，Prysm 客户端的一个 bug 在主网触发。"]],["参与率跌了，链仍出块",["全网投票参与率，跌到约 75%。","18.5% 的 slot 没有出块。","验证者少拿约 382 ETH 奖励。","链一直在出块，参与率也仍然高于三分之二。"]],["先猜一道题",["先猜一道题。","如果同样的 bug，出在占比超过三分之一的客户端上。","只按 N 个区块入账的交易所，会看到什么？","先记住这个问题。"]],["先问控制了什么",["链本身出问题时，第一步不是看区块数。","而是先问，攻击者或者故障，控制了什么。"]],["共识与重组",["先给准确的说法。","共识，是网络里的节点，就哪条链是正确的，达成一致的机制。","重组，是节点放弃已经接受的几个区块，改为接受另一条链。","已经确认的交易，会在重组里消失。","所以交易所说的已确认，只是对这条链安全假设的一个赌注。"]],["比喻：公证处与双花",["打个比方。","一个城市的公证处，靠多数公证员签字，确认房产交易。","如果有人临时雇来半数以上的公证员。","他可以让一份盖过章的合同作废，再把同一套房卖给另一个人。","这就是双花，同一笔资产被花两次。"]],["算力可以按小时租",["比喻不成立的地方是，现实里雇公证员要花很多年。","在小算力的 PoW 链上，算力可以按小时租。"]],["别全叫 51% 攻击",["很多人把所有共识攻击，都叫 51% 攻击。","这会选错防线。","更好的问法是，攻击者控制了什么。","身份和连接、算力、单个区块的时机。","权益或旧私钥、别人的动机，以及让链停下的份额。","控制的资源不同，防线就不同。"]],["51% 攻击四步",["先看算力。","51% 攻击分四步。","攻击者在交易所充值一大笔币，同时私下挖一条不包含这笔充值的链。","交易所等够确认数入账，他把币卖掉，提走别的资产。","然后他公开私下那条更长的链，网络发生重组。","充值交易消失，币回到他手里，交易所账上多出一笔不存在的充值。"]],["再猜一道题",["再猜一道题。","攻击者有 60% 算力，确认数从 6 提高到 600，成功概率降多少？"]],["答案：不降",["答案是不降。","算力超过一半，攻击者最终一定能追上。","加确认数，只增加他租算力的时间和成本。","所以小算力链的确认数，是一个经济问题。","租算力的成本，必须高于能双花的金额。"]],["ETC 被反复双花",["2019 年 1 月，Ethereum Classic 被深度重组和双花，约 110 万美元。","Coinbase 发现后，暂停了 ETC 的收付。","2020 年 8 月，它一个月内被攻击三次，第一次双花约 560 万美元。","之后，Coinbase 把 ETC 的充值确认时间，提高到约两周。"]],["自私挖矿：Monero",["多数算力，也不一定要持续拥有。","自私挖矿，是把挖到的块先扣住，再择机一次性释放。","2025 年 9 月，Monero 出现史上最深的 18 块重组。","矿池 Qubic 公开说用了自私挖矿。","研究者认为，它的日均算力没有达到 51%。"]],["交易所的防线",["交易所要按租算力的成本和充值金额，定确认数，设单笔和单日上限。","重组深度超过阈值，自动暂停这条链的充提。"]],["PoS 的最终确定",["再看以太坊这样的 PoS 链。","它要求三分之二的质押投票，才能让一个检查点最终确定。","最终确定以后，区块不能回滚，除非三分之一的质押被罚没。"]],["客户端多样性",["bug 让大量验证者掉线，链继续出块，但检查点不再最终确定。","某个客户端占比超过三分之一，它的 bug 就能让最终性停下。","超过三分之二，它的 bug 可能把错误的链最终确定。","所以客户端多样性，也是共识安全的一部分。"]],["2023 年最终性中断",["2023 年 5 月，Prysm 和 Teku 处理旧投票时负载过高。","主网先后约 25 分钟和约 1 小时，没有最终确定。","Lighthouse 没受影响，这次没有资金损失。"]],["质押份额的四条线",["按攻击者的质押份额看，有四条线。","约 33%，能阻止最终性，代价是不活跃惩罚，逐步削减他的质押。","约 34%，在能控制消息时序时，造成双重最终性，会被最大比例罚没。","约 51%，能主导分叉选择，审查交易，做短程重组。","约 66%，能在没有诚实方配合时，最终确定自己的链，只能靠社会层恢复。"]],["旧私钥攻击",["另一种攻击，用的是旧私钥。","已经退出的验证者，取回了质押，不会再被罚没。","攻击者买下他们的旧私钥，从很久以前分叉，改写一段历史。","一直在线的节点不会接受，它不回滚已经最终确定的区块。"]],["弱主观性",["刚安装的新节点，要从一个可信的近期检查点开始同步。","这叫弱主观性，检查点的来源，就是新节点的信任入口。","所以检查点要取自至少两个独立来源，再做比对。"]],["活性与安全性",["链也可能整条停下。","活性，是链能继续处理新交易。","安全性，是已经确认的结果不被推翻。"]],["Solana 全网停摆",["2021 年 9 月，一次代币发行引来机器人交易洪泛。","Solana 验证者内存溢出，全网停止出块约 17 小时。"]],["BSC 停链与冻结",["2022 年 10 月，BSC 上的跨链桥被伪造证明攻击。","BNB Chain 要求验证者暂停出块，新版本冻结了攻击者地址。","验证者少的链，可以在几小时内协调停链、冻结，甚至回滚。","这能救急，也说明这条链的不可篡改，是有前提的。"]],["排序器的 unsafe 头",["L2 的排序器，通常由一个运营方负责出块。","它刚出的 unsafe 头，只是排序器的承诺，可以被回滚。","2025 年 9 月，Starknet 升级后停链，并两次回滚。","第二次回滚掉约 20 分钟的交易。"]],["unsafe 头入账的代价",["如果交易所按 unsafe 头入账，用户随即提走，块又被回滚。","这笔损失，由交易所承担。","所以大额要等 L1 上最终确定的批次。","排序器宕机时，用户可以通过 L1 合约，强制提交交易。"]],["别人的动机：Steem",["最后一种资源，是别人的动机。","2020 年 3 月的 Steem 事件，报道称 Huobi、Binance 和 Poloniex，用托管的客户 STEEM 投票。","帮助 Justin Sun 控制了见证人席位，Huobi 承认动用了客户资金。","交易所的托管资产，本身就是共识权力。","客户资产默认不参与投票，例外要有书面授权。"]],["交易所按链定入账条件",["按角色，各做一件事。","交易所，每条链单独定入账条件。","以太坊看 finalized 标签，PoW 小链按租算力的成本定确认数。","区分两种状态，继续出块但不最终确定，和完全停止。","最终性延迟或出块间隔超过阈值，自动暂停充提，恢复后逐笔对账。"]],["节点运营者与用户",["运营节点的，至少运行两种客户端，交叉核对。","普通用户，交易所显示等待确认时，耐心等。","链停摆时，不要反复提交交易，恢复后先查状态。"]],["回到开头：继续入账",["回到开头的问题。","同样的 bug 出在超过三分之一的客户端上，检查点不再最终确定。","链照样出块，N 个区块的条件照样满足，系统继续入账。","只有看 finalized 标签、监控最终性延迟的系统，才会停下。","已确认只是一个赌注，先问攻击者控制了什么，再定防线。"]]]},"d3b":{"src":"../decks/3b1b/ch16.html","scenes":[["Fusaka 后 5 小时：Prysm bug 触发",["2025 年 12 月 4 日，以太坊 Fusaka 升级上线大约 5 小时后，Prysm 客户端的一个 bug 在主网触发。","全网投票参与率跌到大约 75%。18.5% 的 slot 没有出块，验证者少拿了约 382 ETH 奖励。","75% 仍然高于三分之二，检查点还能最终确定。"]],["如果 bug 出在份额超三分之一的客户端",["可如果同样的 bug，出在份额超过三分之一的客户端上呢？链会继续出块，却不再最终确定。","只按“N 个区块”入账的交易所，会照样入账。","问题来了：链本身出问题时，攻击者控制的是什么？"]],["合约的安全上限，是链的安全",["先说前提：合约的安全上限，是链的安全。","链可以被重组：节点放弃已经接受的几个区块，改接另一条链。已确认的交易，会消失。","链可以停摆，提币和清算都会停下。","验证者少的链，还能协调冻结，甚至回滚。","所以交易所说的“已确认”，只是对这条链安全假设的一个赌注。"]],["不要都叫 51%：问攻击者控制了什么资源",["很多人把所有共识攻击，都叫 51% 攻击。这会选错防线。","更好的问法是：攻击者控制了什么资源？","身份与连接，算力，单个区块的时机，权益或旧私钥，别人的动机，还有足够让链停下的份额。"]],["比方：物业排查闯入；真实攻击常组合",["打个比方：小区物业排查一次闯入，先问对方拿到了什么。伪造的门禁卡，多数业主的投票，还是旧业主没交回的钥匙。拿到的不同，要换的锁也不同。","比方不成立的地方是：真实攻击常常组合多种资源。2016 年攻击 Krypton 的团伙，就同时用了多数算力和 DDoS。"]],["过半算力：确认数从 6 加到 600，仍是 100%",["先看算力。在 PoW 链上，攻击者租来过半算力，私下挖一条不含自己那笔充值的链。","交易所确认后入账，他提走别的资产，再放出更长的私链。重组之后，那笔充值消失了。","这时加确认数有用吗？算力一旦过半，确认数从 6 加到 600，成功概率仍是 100%。确认数只增加他租算力的时间和钱。"]],["小链的确认数，是一道经济题",["所以小链的确认数，是一道经济题。算一个例子：租过半算力每小时 2 万美元，15 秒一个块。","等 5,760 个区块，就是 24 小时，租金约 48 万美元。如果单笔能充 100 万美元，攻击照样划算。","这时该降的是单笔上限，而不只是加确认。2020 年 8 月，Ethereum Classic 一次重组约 3,693 个块，双花约 560 万美元。"]],["自私挖矿：不到半数算力也能重组",["不到半数的算力，也能造成重组。","自私挖矿：把挖到的块先扣着，择机一起放出，让诚实矿工的工作作废。","按 Eyal 和 Sirer 的分析，平局时没有诚实矿工跟随攻击者，门槛是三分之一算力；有一半跟随，门槛降到四分之一。"]],["Monero 18 块重组与 Vector76",["2025 年 9 月，Monero 出现史上最深的 18 块重组。矿池 Qubic 公开宣称用了自私挖矿，研究者认为它的日均算力没有到 51%。","算力再少，还有 Vector76 这类攻击：把一个区块只发给受害节点，让它看到一个假的确认。","所以 PoW 链不按 0 确认或 1 确认入账，确认数还要大于历史最大重组深度。"]],["权益证明：份额越高，能做的越多",["换到权益证明。以太坊要三分之二的质押投票，才能让一个检查点最终确定。","攻击者有约 33%，能阻止最终性，但不活跃惩罚会逐步削减他的质押。","约 34%，再控制消息时序，能造成双重最终性，代价是被最大比例罚没。","约 51%，能主导分叉选择：审查、短程重组。约 66%，能最终确定自己的链，只能靠社会层恢复。"]],["旧私钥：新节点靠检查点",["还有一种资源是旧私钥：已经退出的验证者取回了质押，不再怕罚没。持续在线的节点不会回滚已最终确定的区块，刚安装的节点却要靠检查点。","所以新节点的检查点，要取自至少两个独立来源。"]],["P 加 ε 攻击：控制别人的动机",["攻击者也可以什么都不持有，只控制别人的动机。","P 加 ε 攻击：只要你投的选项最终落败，攻击者就多付你一点。投它成了每个人的优势策略。它真的赢了，攻击者一分不用付。"]],["Steem：交易所托管资产就是共识权力",["2020 年 3 月的 Steem 事件，机制相近。报道称，几家交易所用托管的客户 STEEM 投票，帮 Justin Sun 控制了见证人席位。","Huobi 承认动用了客户资金，Binance 撤回了投票。","交易所的托管资产，本身就是共识权力。默认不参与投票，例外要有书面授权。"]],["让链停下：洪泛、同版本客户端",["最后一种资源，是足够让链停下的份额，或者一个能让多数节点崩溃的 bug。","2021 年 9 月，Solana 被机器人交易洪泛，停止出块约 17 小时。2024 年 2 月又停了约 5 小时，当时超过 95% 的质押运行同一版本客户端。","2022 年 10 月，BNB Chain 要求验证者暂停出块，并冻结了攻击者地址。"]],["客户端多样性；停摆与不最终确定要区分",["这就是客户端多样性的意义：一个客户端超过三分之一，它的 bug 能让终局性停止；超过三分之二，可能把错误的链最终确定。","交易所要区分两种状态：链还在出块但不最终确定，和链完全停止。两种状态，充提动作不同。"]],["答案：每条链要有自己的入账条件",["回到开头。Fusaka 之后那次故障，影响的是投票参与率。","它停在 75%，高于三分之二。如果跌破三分之二，“N 个区块”照样满足，只有看 finalized 标签的系统才会停下。","所以每条链要有自己的入账条件：以太坊看 finalized 标签，PoW 小链按租算力成本算，PoSA 等快速最终性投票，L2 的大额等 L1 上最终确定的批次。"]],["先问控制了什么；规则要持续复核",["先问攻击者控制了什么：身份、算力、时机、权益、动机，还是让链停下的份额。控制的不同，防线就不同。","成立的前提是：这些规则会随算力、币价和客户端份额一起复核。"]]]}}},{"id":"17","title":"节点、RPC 与验证者基础设施：你读到的是谁的链，谁在签名出块","md":"../chapters/17-node-rpc-infrastructure.md","v":{"vs":{"src":"skeuo/ep17/out/ep17-full.mp4","cues":[[1.65,2.83,"2026 年 4 月"],[2.93,4.4,"LayerZero 给 KelpDAO"],[4.42,6.12,"确认跨链消息的验证者"],[6.14,7.26,"放行了一条消息"],[8.25,9.35,"这条消息"],[9.45,11.34,"在源链上根本不存在"],[12.31,13.35,"验证者读链"],[13.38,15.51,"靠的是两个 RPC 节点"],[16.49,18.41,"攻击者控制了这两个节点"],[18.43,19.82,"替换了节点程序"],[20.82,22.02,"被替换的节点"],[22.18,24.31,"只对验证者返回伪造数据"],[25.31,26.93,"对别的 IP 来的查询"],[26.95,28.36,"它返回真实数据"],[29.34,31.16,"攻击者再用 DDoS"],[31.27,33.66,"打掉没被攻破的外部 RPC"],[34.65,36,"系统自动切换"],[36.12,37.81,"切到了被污染的节点上"],[38.78,40.24,"LayerZero 的声明写"],[40.28,42.18,"损失约 2.9 亿美元"],[43.18,44.5,"先猜一道题"],[45.49,47.74,"监控系统也查询了这两个节点"],[47.89,49.16,"结果一切正常"],[50.15,51.7,"它能发现这次攻击吗"],[52.95,54.4,"先记住这个问题"],[57.55,59,"先给准确的说法"],[60,60.99,"你的系统"],[61.08,62.6,"从来没有直接读过链"],[63.58,64.93,"它读的是某个节点"],[64.98,66.65,"某个 RPC 服务"],[66.71,67.61,"某个索引器"],[67.63,68.48,"告诉它的链"],[69.46,71.95,"数据从 P2P 网络进入节点"],[72.12,73.29,"经过 RPC"],[73.31,74.95,"再到索引器和你的系统"],[75.92,78.37,"每一层 都可能给出错误的数据"],[79.36,81.3,"第一层是节点客户端"],[82.29,83.6,"2020 年 11 月"],[83.7,85.88,"Infura 的节点运行旧版 Geth"],[86.86,89.26,"它遇到一个上游已经修复的共识 bug"],[89.32,91.13,"停在一条少数派分叉上"],[92.12,94.02,"依赖它的 MetaMask 等服务"],[94.04,94.94,"受到影响"],[95.94,96.77,"Binance"],[96.82,98.11,"Bithumb 等交易所"],[98.15,100.62,"暂停了 ETH 和 ERC-20 提币"],[101.6,103.77,"第二层是 RPC 服务"],[103.83,105.5,"它会宕机 限流"],[105.53,106.77,"返回过期数据"],[107.75,109.24,"第三层是索引器"],[109.29,110.31,"它会延迟"],[110.34,111.28,"也会解释错"],[112.24,114,"第四层是网络路由"],[114.98,116.23,"BGP 劫持"],[116.25,117.9,"是用错误的路由宣告"],[117.98,120.21,"把别人的流量引到自己的服务器"],[121.2,122.14,"2018 年"],[122.18,122.96,"MyEtherWallet"],[122.98, "2021 年 2 月，一家质押服务商重启出错"],[285.77,287.57,"75 个验证者被罚没"],[287.57,291.39,"2023 年 10 月 Lido 一家运营商 20 个"],[291.39,295.4,"2025 年 9 月 SSV 网络上一个集群 39 个"],[295.85,300.35,"打个比方：一枚公章同一时刻只能放在一个抽屉里"],[300.35,305.05,"比方不成立的地方是：公章被滥用，会有人追查原因"],[305.05,308.12,"协议不问原因，检测到双签就罚没"],[308.57,313.37,"所以迁移前要导出防罚没数据，确认旧实例已停止"],[313.37,317.51,"再等至少 2 个 epoch。故障切换不自动化"],[317.51,320.13,"分身检测只是最后一道防线"],[321.83,326.14,"最后是 MEV 的中间人。构建者组装完整区块"],[326.14,327.85,"交给 relay 托管"],[328.3,333.56,"relay 只给提议者区块头。提议者看不到内容，先签名"],[333.56,336.13,"再由 relay 发布完整区块"],[336.58,337.75,"2023 年 4 月"],[337.75,341.04,"一个恶意提议者先签了一个无效的区块头"],[341.04,343.39,"就从 relay 拿到了完整内容"],[343.39,347.57,"拆开三明治机器人的交易包，获利约 2,000 万美元"],[348.02,351.53,"修复之后，relay 改为先广播区块"],[351.53,353.59,"再把区块交给提议者"],[354.04,356.12,"而这些中间人高度集中"],[356.12,359.23,"2026 年 11 月的一个单日快照里"],[359.23,362.29,"前两大构建者占了约 74% 的区块"],[362.74,366,"协议内的提议者与构建者分离，ePBS"],[366,368.84,"计划随 Glamsterdam 升级上线"],[368.84,371.96,"截至 2026 年 11 月没有主网日期"],[373.66,378.24,"回到开头的问题：你读到的，是谁的链？"],[378.69,381.05,"是告诉你的那个节点的链"],[381.05,384.58,"LayerZero 的监控看到的是真实数据"],[384.58,387.41,"因为节点按来源 IP 区别对待"],[387.86,391.45,"要发现它，要把验证者实际收到的结果"],[391.45,393.98,"和不同运营方的数据源比对"],[394.43,398.8,"所以：数据源按运营方计数；超时不降级"],[398.8,402.93,"结果冲突就暂停。验证者：同一把密钥"],[402.93,408.22,"任何时刻只在一处签名。relay：白名单写进策略"],[408.22,409.19,"定期复核"],[409.64,414.37,"下一集，我们看钥匙本身：一个 4-of-6 的多签"],[414.37,416.14,"为什么没有拦住？"]],"ch":[]},"deck":{"src":"../decks/skeuomorphic/ch17/index.html","scenes":[["一条不存在的跨链消息",["2026 年 4 月，LayerZero 给 KelpDAO 确认跨链消息的验证者，放行了一条消息。","这条消息，在源链上根本不存在。"]],["被替换的 RPC 节点",["验证者读链，靠的是两个 RPC 节点。","攻击者控制了这两个节点，替换了节点程序。","被替换的节点，只对验证者返回伪造数据。","对别的 IP 来的查询，它返回真实数据。"]],["DDoS 逼出自动切换",["攻击者再用 DDoS，打掉没被攻破的外部 RPC。","系统自动切换，切到了被污染的节点上。","LayerZero 的声明写，损失约 2.9 亿美元。"]],["先猜一道题",["先猜一道题。","监控系统也查询了这两个节点，结果一切正常。","它能发现这次攻击吗？","先记住这个问题。"]],["你从来没有直接读过链",["先给准确的说法。","你的系统，从来没有直接读过链。","它读的是某个节点、某个 RPC 服务、某个索引器，告诉它的链。","数据从 P2P 网络进入节点，经过 RPC，再到索引器和你的系统。","每一层，都可能给出错误的数据。"]],["第一层：节点客户端",["第一层是节点客户端。","2020 年 11 月，Infura 的节点运行旧版 Geth。","它遇到一个上游已经修复的共识 bug，停在一条少数派分叉上。","依赖它的 MetaMask 等服务，受到影响。","Binance、Bithumb 等交易所，暂停了 ETH 和 ERC-20 提币。"]],["第二、三层：RPC 与索引器",["第二层是 RPC 服务，它会宕机、限流、返回过期数据。","第三层是索引器，它会延迟，也会解释错。"]],["第四层：网络路由",["第四层是网络路由。","BGP 劫持，是用错误的路由宣告，把别人的流量引到自己的服务器。","2018 年，MyEtherWallet 的 DNS 被这样指向钓鱼站，损失约 15 万美元。","2022 年，KLAYswap 的 SDK 下载域名被劫持，下发恶意脚本，损失约 190 万美元。","同年，Celer cBridge 提供合约地址的子域被劫持，损失约 24 万美元。"]],["比喻：隔着窗看车流",["打个比方。","你隔着一扇窗看车流，决定什么时候过马路。","这扇窗可能是一块屏幕，屏幕可能延迟，也可能有人在播录像。"]],["很多系统只有一扇窗",["比喻不成立的地方是，真实的马路，你可以换一扇窗再看一眼。","很多系统只接了一个 RPC，从来没有第二扇窗。"]],["日蚀攻击",["前面是你问节点，节点答错。","另一种情况，是节点自己看到的网络，被人操纵。","节点之间直接交换区块和交易，这叫 P2P 网络。","日蚀攻击，是攻击者占满受害节点的全部对等连接。","节点只看到攻击者给的区块和交易。"]],["关键一步在节点重启",["最关键的一步，在节点重启。","重启时，节点会从地址表里挑选对等节点。","地址表如果已经被攻击者填满，它连上的就全是攻击者。"]],["两台主机就够",["2018 年的一篇论文显示，两台主机、各一个 IP，就能日蚀一个以太坊节点。","Geth 1.8.0 随后限制了同一网段的节点数。","比特币加了锚点连接，重启时优先恢复上次的出站连接。"]],["被日蚀的节点看起来正常",["被日蚀的节点，同步状态看起来正常。","它有连接，也有新块，只是落后，或者在错误的分支上。","对等节点数只说明有连接，不说明连接来自独立的运营方。"]],["DoS 是数据污染的前置",["节点崩溃，也可能是攻击的第一步。","切换逻辑如果把流量转到不可信的备用节点，DoS 就成了数据污染的前置步骤。","开头的事件正是这样。"]],["暴露的 JSON-RPC",["另一类事故，来自节点自己的配置。","2018 年，一个团伙扫描暴露 JSON-RPC 的以太坊节点，盗走约 3.8 万个 ETH。","Geth 默认只监听本机，接口是运营者自己打开的。"]],["接口只对内开放",["RPC 接口只绑内网或本机，对外必须经过认证网关。","给执行客户端下指令的 Engine API，只对共识客户端开放，并用 JWT 认证。"]],["罚没与双签",["验证者这一端，风险出在签名上。","罚没，是 PoS 验证者违反协议，被扣除部分质押并强制退出。","最常见的原因是双签。","同一把密钥，对同一个位置，签了两个不同的消息。"]],["凌晨的故障切换",["凌晨，运维看到主机 A 失去响应，就在备用机 B 上启动同一把密钥。","其实 A 没有停，两台机器对同一个 slot 各签一票。","网络检测到双签，验证者被罚没。"]],["罚没多发生在切换迁移时",["公开的罚没事件，几乎都发生在故障切换或迁移时。","2021 年 2 月，一家质押服务商重启出错，75 个验证者被罚没，约 18 ETH。","2023 年 10 月和 2025 年 9 月，Lido 和 SSV 网络上，也各有一批验证者被罚没。"]],["防线在流程",["防线在流程，迁移前导出防罚没数据，确认旧实例已经停止。","再等待至少 2 个 epoch，并开启分身检测，作为最后一道防线。"]],["看不见就签名",["签名的另一个风险，是看不见就签。","在 MEV-Boost 里，relay 托管构建者组装的完整区块，只给提议者区块头。","提议者签名区块头，相信 relay 会发布完整区块并付款。"]],["签一个无效区块头",["2023 年 4 月，一个恶意提议者，签了一个无效的区块头。","旧代码照样返回区块体，他拆开三明治机器人的交易包，获利约 2000 万美元。","修复后，relay 先广播区块，再把区块交给提议者。"]],["relay 是可信中间人",["relay 是可信中间人，验证者要评估自己用的 relay 和它的运营方。","这个市场也很集中，2026 年 11 月的一个单日快照里，前两大构建者约占 74% 的区块。"]],["按来源区别对待",["回到开头的节点。","它的关键，是按来源区别对待。","你从别的 IP 去查，它就给你真数据。","所以防线不是多看几次同一个节点，而是比对不同运营方的数据源。"]],["第一条：多源校验",["第一条，多源校验。","充值扫描和跨链放行，至少用两个独立来源，比如自建节点加一家第三方 RPC。","独立要按运营方算，同一家服务商的两个节点，只算一个。"]],["第二条：不降级",["第二条，不降级。","节点超时后，法定数不自动下降。","达不到法定数就暂停，人工确认。","开头的事件里，干净的 RPC 被打掉，系统自动切到剩下的节点，这就是降级。"]],["第三条：冲突就暂停",["第三条，结果冲突就暂停入账，不挑一个先用。"]],["第四条：节点本身也要比对",["第四条，节点本身也要比对。","链头要和不同网络、不同运营方的来源持续比对，对等连接也要来自不同网络。","自建节点可以选少数派客户端，或者两种客户端互相比对，硬分叉前完成升级。"]],["有效范围与局限",["这几条，对被替换的节点、被日蚀的节点、停在错误分叉上的节点，都有效。","局限是，如果所有来源都接在同一个上游，数量再多也没用。"]],["按角色各做一件事",["按角色，各做一件事。","交易所和跨链桥，列出每个资金决策读取的数据源，去掉重复的运营方，看剩下几个。"]],["运维、验证者、用户",["节点运维，确认 RPC 和 Engine API 没有暴露在公网。","验证者团队，把故障切换改成人工确认，原实例停止之后，才启动备用。","普通用户，余额显示异常时，换一个 RPC 或区块浏览器交叉确认。","自定义 RPC，只添加官方文档列出的地址。"]],["答案：监控发现不了",["回到开头的问题。","监控查询的是同一个节点，看到的是真实数据，它无法发现这次攻击。","要发现它，需要拿验证者实际收到的结果，和不同运营方的数据源比对。"]],["先问几家独立的节点",["这只在来源真正独立时成立。","你读到的链，只是某个节点告诉你的链，先问几家独立的节点，再签名，再入账。"]]]},"d3b":{"src":"../decks/3b1b/ch17.html","scenes":[["LayerZero：只对验证者说谎的节点",["2026 年 4 月，攻击者替换了 LayerZero 验证者使用的两个 RPC 节点的程序。","这两个节点只对验证者返回伪造的数据，对其他 IP，返回真实数据。","攻击者再用 DDoS 打掉干净的 RPC，系统自动切换到了被污染的节点。损失约 2.9 亿美元。"]],["监控也查了节点，看到一切正常",["监控系统也查询了这两个节点，看到的一切正常。","问题来了：你的系统读到的，到底是谁的链？"]],["你的系统从来没有直接读过链",["先说一个事实：你的系统，从来没有直接读过“链”。","它读的是某个节点、某个 RPC 服务、某个索引器告诉它的链。"]],["比方：隔着一扇窗看车流",["打个比方：你隔着一扇窗看街上的车流，决定什么时候过马路。","可窗户也许是一块屏幕。屏幕可能延迟了 10 秒，也可能有人在播放录像。","比方不成立的地方在于：真实的马路，你可以换一扇窗再看一眼。很多系统只接了一个 RPC，从来没有第二扇窗。"]],["数据要经过几层：节点与 RPC 都会出错",["数据从链走到你的系统，要经过几层：P2P 网络、节点、RPC 服务、索引器，还有路上的 DNS 和路由。","节点这一层：2020 年 11 月，Infura 的节点运行旧版 Geth，停在了一条少数派分叉上。Binance、Bithumb 等交易所暂停了 ETH 提币。","RPC 这一层：单一服务商宕机或限流，你的充值扫描就跟着停，或者读到过期数据。"]],["路由层：BGP 劫持把流量引走",["路由这一层：攻击者劫持 BGP 路由，把流量引到自己的服务器。MyEtherWallet、KLAYswap、Celer 都吃过这个亏。","每一层，都可能给出错误的数据。交易所的充值扫描，却常常只连一个 RPC。"]],["多源校验：三个源，至少两个一致",["防线是多源校验。我们算一个例子：接三个数据源，至少两个一致才入账。这些数字是示例。","平时，两个干净的源对一个被污染的源，二比一，干净的结果胜出。"]],["超时自动降级，伪造数据直接通过",["现在攻击者用 DDoS 打掉两个干净的源，只剩被污染的那个还在回答。","如果系统在节点超时后自动降级，把门槛从二降到一，伪造的数据就直接通过了。这正是开场那条路径。"]],["规则：门槛不降；独立性按运营方算",["所以规则是：门槛不自动下降；凑不够就暂停，人工确认。","还有一点：数据源的独立性按运营方算。三个地址背后如果是同一个上游，它们只算一个源。"]],["日蚀攻击：蒙住节点的眼睛",["攻击也可以不碰 RPC，直接蒙住节点的眼睛。这叫日蚀攻击。","攻击者占满受害节点的全部对等连接。节点一重启，就只连到攻击者，只看到攻击者给的区块。","它的同步状态看起来正常，只是落后了，或者在一条错误的分支上。"]],["所需资源很少，50 个对等连接证明不了什么",["研究者在比特币上测试，400 台主机就足以日蚀一个真实节点。在 2018 年的以太坊上，两台主机、各一个 IP 就够了，Geth 1.8 之后才加了限制。","所以 50 个对等连接，也证明不了什么。要把节点的链头，和不同网络、不同运营方的数据源比对。"]],["节点层事故多是配置和补丁问题",["节点层的事故，大多数不是密码学失败，而是配置和补丁。","2018 年，一个团伙扫描开放 8545 端口的以太坊节点，累计盗走 38,642 ETH，超过 2,000 万美元。Geth 默认只监听本地，是运营者自己打开了接口。"]],["加固：内网绑定、认证网关、不放私钥",["所以 RPC 只绑定内网；对外必须经过认证网关。Engine API 只对共识客户端开放，并用 JWT 认证。","RPC 节点上，不放提币私钥，也不放验证者私钥。"]],["罚没：同一把密钥，对同一位置签两个结果",["再看出块的一侧：验证者。它最大的风险，来自自己的运维。","罚没的规则是：同一把密钥，对同一个位置签两个不同的结果，就扣除部分质押并强制退出。","典型的场景是：主机 A 看起来宕机了，运维在备用机 B 上启动同一把密钥。可 A 其实还在运行。两台机器各签一票，双签成立。"]],["罚没的真实案例",["2021 年 2 月，一家质押服务商重启出错，75 个验证者被罚没。2023 年 10 月 Lido 一家运营商 20 个，2025 年 9 月 SSV 网络上一个集群 39 个。"]],["比方不成立；迁移要等两个 epoch",["打个比方：一枚公章同一时刻只能放在一个抽屉里。比方不成立的地方是：公章被滥用，会有人追查原因；协议不问原因，检测到双签就罚没。","所以迁移前要导出防罚没数据，确认旧实例已停止，再等至少 2 个 epoch。故障切换不自动化，分身检测只是最后一道防线。"]],["relay：提议者先签名，才看到区块",["最后是 MEV 的中间人。构建者组装完整区块，交给 relay 托管。","relay 只给提议者区块头。提议者看不到内容，先签名，再由 relay 发布完整区块。","2023 年 4 月，一个恶意提议者先签了一个无效的区块头，就从 relay 拿到了完整内容，拆开三明治机器人的交易包，获利约 2,000 万美元。","修复之后，relay 改为先广播区块，再把区块交给提议者。"]],["中间人高度集中，ePBS 尚无日期",["而这些中间人高度集中：2026 年 11 月的一个单日快照里，前两大构建者占了约 74% 的区块。","协议内的提议者与构建者分离，ePBS，计划随 Glamsterdam 升级上线，截至 2026 年 11 月没有主网日期。"]],["答案：是告诉你的那个节点的链",["回到开头的问题：你读到的，是谁的链？","是告诉你的那个节点的链。LayerZero 的监控看到的是真实数据，因为节点按来源 IP 区别对待。","要发现它，要把验证者实际收到的结果，和不同运营方的数据源比对。"]],["三条防线：数据源、密钥、relay",["所以：数据源按运营方计数；超时不降级；结果冲突就暂停。验证者：同一把密钥，任何时刻只在一处签名。relay：白名单写进策略，定期复核。"]]]}}},{"id":"30","title":"企业级与许可链安全：威胁模型、Fabric、Corda、Besu 与联盟治理","md":"../chapters/30-enterprise-blockchain-security.md","v":{"vs":{"src":"skeuo/ep30/out/ep30-full.mp4","cues":[[1.65,2.97,"一个联盟链网络"],[3.08,5.54,"所有节点都由成员机构运营"],[6.52,7.66,"每个参与者"],[7.68,9.37,"都持有一张有效的证书"],[10.37,11.84,"没有匿名的陌生人"],[11.93,13.73,"也没有人能靠算力闯进来"],[14.72,16.25,"可就在这样的网络里"],[16.38,17.5,"账本分叉了"],[18.49,19.87,"Hyperledger Fabric"],[ 位置。Corda 不广播交易"],[326.44,329.78,"靠公证人防止同一个状态被用两次"],[330.23,336,"单节点公证人作恶，能拒绝服务，也能为同一状态签两次"],[336,340.38,"造成双花。修复是改成集群，并分开运营方"],[340.83,344.23,"Besu 靠验证者投票。2026 年 9 月"],[344.23,348.88,"Besu 公布了一个 QBFT 漏洞：一名拜占庭验证者"],[348.88,351.2,"就能注入未经授权的提款"],[351.65,357.07,"诚实的验证者照常执行、最终确定，原生币凭空增加"],[357.07,362.14,"按 3f+1，4 个验证者明明能容忍 1 个恶意节点"],[362.59,366.05,"可容错数只在协议按规范实现时成立"],[366.05,370.81,"诚实节点的验证规则少了一项，一名验证者就够了"],[370.81,374.49,"合同能事后追责，但挡不住状态被写错"],[374.94,379.48,"还有维护状态：GoQuorum 和 Tessera 已经归档"],[379.48,383.84,"没有上游安全修复。许可链也要审计客户端实现"],[383.84,386.12,"盘点软件还有没有人维护"],[387.82,393.29,"回到开头：每个参与者都有有效证书，账本为什么还分叉？"],[393.74,398.21,"因为证书只回答谁能进来。哈希编码有歧义"],[398.21,401.27,"同一个哈希就能对应两种解析"],[401.27,406.03,"这个漏洞在 2.2.14 和 2.5.5 修复，教训是"],[406.03,408.38,"哈希编码必须没有歧义"],[408.83,412.86,"许可链把谁能参与，从密码学和经济问题"],[412.86,415.1,"变成了身份和治理问题"],[415.55,419.93,"这是主线的最后一集。还记得第一集的问题吗？"],[419.93,421.81,"攻击者能控制什么？"],[422.26,426.14,"在公链上，是任意调用、闪电贷和交易顺序"],[426.14,430.85,"在签名路径上，是钥匙盖在什么文件上；在许可链上"],[430.85,434.52,"是一张证书、一把管理员密钥、几家成员"],[434.52,436.16,"和没人审过的实现"],[436.61,440.11,"问题不变，答案随系统变。前提是"],[440.11,445.95,"你把每一个能被控制的环节，都画进地图里。听到上链了"],[445.95,450.86,"不可篡改，先问：谁能写，谁能看，谁能改规则"]],"ch":[]},"deck":{"src":"../decks/skeuomorphic/ch30/index.html","scenes":[["只有熟人的网络",["一个联盟链网络，所有节点都由成员机构运营。","每个参与者，都持有一张有效的证书。","没有匿名的陌生人，也没有人能靠算力闯进来。"]],["账本却分叉了",["可就在这样的网络里，账本分叉了。","Hyperledger Fabric 公布过这样一个漏洞。","攻击者能把一个区块里的交易，重新组合。","区块哈希没有变。"]],["同一区块，不同交易",["可是不同的节点，从同一个区块里，解析出了不同的交易。","收到不同版本的节点，各自写入世界状态，两份账本从此对不上。","修复的方向是，让哈希的编码没有歧义，同一串字节，只能读出同一组交易。"]],["门禁只挡外人",["这里没有人偷到私钥，也没有人攻破共识。","门禁再严，挡住的也只是外人。"]],["风险到底在哪里？",["那么，一个只让熟人进门的区块链，风险到底在哪里？","谁能写，谁能看，谁能改规则？","我们从一栋刷卡进门的写字楼说起。"]],["许可链与联盟链",["先给一句准确的说法。","许可链，只让获得授权的参与者，读写或出块。","由多家组织共同治理的许可链，叫联盟链。","它把谁能参与，从密码学和经济的问题，变成了身份和治理的问题。"]],["不再需要多数算力",["攻击者不再需要多数算力。","一张有效证书，一把管理员密钥，或者几家成员共谋，就够了。"]],["比喻：刷卡的写字楼",["打个比方，公链像公共广场，谁都能进，靠规则和押金维持秩序。","许可链像一栋写字楼，进门要刷工牌。","陌生人大多进不来，可发工牌的前台，拿着万能钥匙的物业，成了最值得攻击的人。"]],["比方不成立：合法改写",["这个比方有一处不成立。","写字楼失窃，可以调监控，可以报警。","联盟链里，多数成员可以合法地重写业务状态。","账本本身，看不出这是作恶。"]],["按控制的资源排入口",["按攻击者控制的资源，排一排入口。","一张普通成员证书，能读通道数据，发送畸形请求。","组织管理员的证书，能改本组织的配置，批准链码。","根 CA 的私钥，能签发任意身份。","足够多的背书组织，能写入符合策略的任意状态。"]],["持牌机构不是安全假设",["所以不要把成员都是持牌机构，当成安全假设。","Ronin 桥有 9 个验证者，5 个签名就能放行，攻击者控制了验证者，提走了资金。","许可的集合小，攻破的门槛也低。"]],["Fabric 的三道关",["先看 Hyperledger Fabric。","它的一笔交易，要过三道关，执行，排序，验证。","第一关，几家组织的背书节点，模拟执行链码，签下读写集。","第二关，排序服务只决定顺序，不判断业务对不对。","第三关，记账节点不重新执行，只核对背书策略和读集的版本。","被拒绝的交易仍然留在区块里，只是标成无效。"]],["背书策略",["背书策略规定，一笔交易需要哪些组织签名。","默认要求通道成员的多数。","要是写成任一组织都行，就等于让一家成员单独决定写入。"]],["排序服务按威胁选",["排序服务也要按威胁来选。","Raft 是崩溃容错，5 个节点能容忍 2 个宕机，却不防恶意节点。","一家运营方的排序节点被攻破，它伪造不了背书，却能决定顺序，延迟或丢弃交易。","成员之间互不信任，就选 BFT，并把节点分给不同的运营方。"]],["私有数据：低熵要加盐",["再看隐私。","私有数据集合，只把原文发给部分组织，账本上只留哈希。","假设集合里存着客户等级，一共只有三档。","圈外的组织，算出三个哈希一比，就知道了。","所以低熵的数据要加随机盐，输入走 transient 字段，不放进普通参数。"]],["链码必须确定",["链码本身也必须确定。","读本地时间或随机数，各个节点算出的结果不同，交易就过不了背书。"]],["① 根 CA",["许可链最大的风险，常常在流程里。","第一处，根 CA。","根私钥放在在线服务器上，一旦被攻破，攻击者就能签发任意身份。","控制是根 CA 离线，私钥放进 HSM，日常签发交给中间 CA。","节点和管理员的私钥，也放进 HSM 或 KMS。","身份 CA 和 TLS CA，也要分开。"]],["② 管理员集中",["第二处，管理员集中。","一家技术服务商，替好几家组织拿着管理员证书。","它一出事，好几家就同时失守。","控制是各家自持密钥，服务商只拿受限的运维权限。"]],["③ 配置更新与成员退出",["第三处，配置更新和成员退出。","改通道策略或成员名单，要多家组织签名，变更留痕。","成员退出时，要吊销证书，修改策略，再评估它手里已经拿到的数据。","Fabric 文档提醒，成员身份不会自动过期，只能吊销。","所以吊销流程，要提前演练。"]],["④ 成员共谋",["第四处，成员共谋。","达到背书门槛的几家成员，可以写入虚假的业务状态。","对策是外部锚定，定期把账本摘要写到公链，或者交给第三方保存。","它能证明历史没被改写，却不能证明数据本身是真的。"]],["同一个云账户也是单点",["最后，所有节点放在同一个云账户里，也是单点，要分账户，分地域，分运营方。"]],["Corda：靠公证人防双花",["换两种框架，单点换了位置。","Corda 不广播交易，数据只发给需要知道的参与方。","防止同一个状态被花两次，靠的是公证人。"]],["单一公证人的风险",["非验证型公证人只看输入引用，看不到完整交易，隐私更好。","可如果整个网络只有一个公证人，运营方作恶，就能给同一个状态签两次，造成双花。","防御是改成集群，分给不同的运营方。"]],["先校验，再使用",["节点之间协商时，对方发来的数据，要先校验，再使用。","合约代码作为附件随交易分发，always-accept 这种约束只用于测试，生产环境不能用。"]],["Besu：凭空多出原生币",["再看 Besu。","2026 年 9 月，Besu 公布了一项 QBFT 漏洞。","启用 Shanghai 及之后的分叉，一名拜占庭验证者，能注入未经授权的提款。","诚实的验证者照常执行，照常确定，原生币凭空多了出来。"]],["一名验证者就够了",["4 个验证者，按规范只容忍 1 个作恶。","可这一次，诚实节点的验证规则本身缺了一项，一名验证者就够了。","合同能让你事后追责，却拦不住状态被写错。"]],["P2P 也是攻击面",["同一时期的另一项公告里，能连上足够多验证者端口的节点，用大体积提案，就能阻止网络最终确定。","所以 P2P 监听也是攻击面，要在网络层限制谁能连到验证者。","Besu 的本地准入规则只管本节点，每个成员都要配置，并且核对一致。"]],["没人维护的软件",["还有一种风险，没有漏洞也会发生。","GoQuorum 的仓库已经归档，Tessera 已经弃用。","还在用它们的网络，从此没有上游的安全修复。","依赖这些功能的网络，只能自己维护，或者尽快迁移。"]],["今天就能做的事",["最后，今天就能做的事。","运营联盟链的人，写下每项安全假设依赖哪几家组织，不要只写成员可信。","写链码的人，查一遍本地时间和随机数，再给低熵的私有数据加盐。","选框架的人，先核对它还有没有人维护。"]],["作为用户，先问三个问题",["作为用户，听到上链了，不可篡改，先问三个问题。","谁能写，谁能看，谁能改规则。","你的个人数据写进联盟链之前，问清怎么删除，怎么更正。","业务伙伴的联盟链，不等于公开可查，请对方拿出公链锚定或审计报告。"]],["回到开头：风险在门里",["回到开头的问题。","只让熟人进门的区块链，风险在门里面。","在发证书的人，拿管理员密钥的人，达到门槛的几家成员，还有没人维护的软件上。"]],["信任交给了具体的人",["门禁只回答了谁能进来，安全还取决于进来的人能做什么，规则本身有没有写对。","这个答案成立的前提，是把每一个单点写下来，分给不同的组织，并且定期演练。","许可链没有消灭信任，只是把信任交给了具体的机构和人。","这个系列就到这里。"]]]},"d3b":{"src":"../decks/3b1b/ch30.html","scenes":[["CVE-2023-46132：区块哈希不变，交易却不同",["Hyperledger Fabric 公布过一个漏洞，编号 CVE-2023-46132。","攻击者能把一个区块里的交易重新组合：区块哈希不变，节点解析出来的交易却不同。"]],["每个参与者都有证书，账本还是分叉",["收到不同版本的节点，世界状态就分了岔。","网络里每个参与者都持有有效证书，账本还是分叉了。门禁这么严，许可链的威胁模型，到底哪里不一样？"]],["许可链像写字楼：进门要刷工牌",["先说定义。许可链，是只有获得授权的参与者，才能读、写或出块的区块链。由多家组织共同治理的，叫联盟链。","打个比方：公链像公共广场，谁都能进，靠规则和押金维持秩序。","许可链像一栋写字楼，进门要刷工牌。大多数陌生人，进不来。"]],["比方不成立处：作恶可以合法",["可这样一来，发工牌的前台、拿着万能钥匙的物业，就成了最值得攻击的人。","比方也有不成立的地方：写字楼失窃，可以调监控、报警；联盟链的多数成员，却可以合法地重写业务状态，账本本身看不出这是作恶。"]],["公链与许可链的威胁模型",["把公链和许可链的威胁模型并排放。","准入：公链开放，许可链要证书或白名单。主要攻击者：从匿名外部人，变成成员、内部人，和被攻破的成员。","共识的安全来源：公链靠算力或质押的经济成本；许可链靠身份、法律合同和容错假设。","单点也换了：根 CA、排序服务、管理员密钥、网络运营方。"]],["门槛变低：一张证书、一把密钥",["所以攻击者不再需要多数算力，只要一张有效证书、一把管理员密钥，或者几家成员的共谋。","别把成员都是持牌机构当成安全假设。Ronin 桥有 9 个验证者，5 个签名就能放行。集合越小，攻破的门槛越低。"]],["Fabric：执行、排序、验证",["看最常见的许可链 Fabric。它的流程是执行、排序、验证。","客户端把提案发给几家组织的背书节点。背书节点模拟执行链码，生成读写集，签上名，交回客户端。","客户端把交易交给排序服务。排序服务只决定顺序，不判断业务对不对。","记账节点检查背书策略和读集版本，通过了才写入世界状态；没通过的交易仍留在区块里，只是标成无效。"]],["同样的输入，必须产生同样的字节",["注意，链码只在背书时执行一次。如果它读了本地时间，每个背书节点算出的结果就不同，读写集对不上，交易拿不到有效背书。","修复是用提案里的交易时间戳：所有节点读到同一个值。同样的输入，必须产生同样的字节。"]],["背书策略决定谁能写入",["背书策略决定，一笔交易要哪些组织签名。默认要求通道成员的多数。","如果写成 Org1 或 Org2 任一签名，任何一家成员就能单独决定写入。"]],["Raft 防崩溃，不防作恶；BFT 才防",["再看排序。Raft 是崩溃容错：要多数在线。5 个节点，多数是 3 个，所以能容忍 2 个宕机。","但 Raft 不防恶意节点。被攻破的排序节点伪造不了背书，却能决定顺序，延迟或丢弃交易。","成员之间互不信任时，用 BFT：它能容忍少于三分之一的节点作恶，比如 4 个节点里有 1 个。节点还要分给不同的运营方。"]],["私有数据集合：账本上只有哈希",["许可链也承诺隐私。Fabric 的私有数据集合，只把原文分发给部分组织。","比如集合里只有 Org1 和 Org2，存着客户等级：A、B 或 C。其他通道成员的账本上，只有这个值的哈希。","Org3 能知道某个客户的等级吗？能。等级只有 3 种取值。"]],["低熵数据的哈希，可以被穷举",["它把 A、B、C 各算一次哈希，和账本上的比对，最多 3 次就找到答案。","集合权限只限制原文的分发，不隐藏低熵数据的哈希。修复是加入随机盐，并且把输入放进 transient 字段，不走普通参数。"]],["根 CA 决定信任边界",["许可链最大的风险，常常在流程。","根 CA 决定信任边界。根私钥泄露，攻击者能签发这个组织的任意身份。所以根 CA 要离线，放进 HSM，日常签发交给中间 CA。","Fabric 的成员身份不会自动过期，只能吊销。所以吊销和撤换，要提前演练。"]],["服务商单点与成员共谋",["另一个单点，是一家技术服务商同时握着几家组织的管理员证书。每家组织应当自持密钥。","还有成员共谋：达到背书阈值的成员，可以写入虚假的业务状态。外部锚定能证明历史没被改写，但证明不了数据本身是真的。"]],["Corda：公证人是单点",["其他平台，单点换了位置。Corda 不广播交易，靠公证人防止同一个状态被用两次。","单节点公证人作恶，能拒绝服务，也能为同一状态签两次，造成双花。修复是改成集群，并分开运营方。"]],["Besu：可容错数只在按规范实现时成立",["Besu 靠验证者投票。2026 年 9 月，Besu 公布了一个 QBFT 漏洞：一名拜占庭验证者，就能注入未经授权的提款。","诚实的验证者照常执行、最终确定，原生币凭空增加。按 3f+1，4 个验证者明明能容忍 1 个恶意节点。","可容错数只在协议按规范实现时成立。诚实节点的验证规则少了一项，一名验证者就够了。合同能事后追责，但挡不住状态被写错。","还有维护状态：GoQuorum 和 Tessera 已经归档，没有上游安全修复。许可链也要审计客户端实现，盘点软件还有没有人维护。"]],["答案：证书只回答谁能进来",["回到开头：每个参与者都有有效证书，账本为什么还分叉？","因为证书只回答谁能进来。哈希编码有歧义，同一个哈希就能对应两种解析。这个漏洞在 2.2.14 和 2.5.5 修复，教训是，哈希编码必须没有歧义。","许可链把谁能参与，从密码学和经济问题，变成了身份和治理问题。"]],["主线收束：攻击者能控制什么",["这是主线的最后一集。还记得第一集的问题吗？攻击者能控制什么？","在公链上，是任意调用、闪电贷和交易顺序；在签名路径上，是钥匙盖在什么文件上；在许可链上，是一张证书、一把管理员密钥、几家成员，和没人审过的实现。","问题不变，答案随系统变。前提是，你把每一个能被控制的环节，都画进地图里。听到上链了、不可篡改，先问：谁能写，谁能看，谁能改规则。"]]]}}},{"id":"31","title":"模块化栈、数据可用性、现代 MEV 与去中心化中间件","md":"../chapters/31-modular-da-mev-middleware.md","v":{}}]},{"name":"第六篇 · 钱包、用户与运营","items":[{"id":"18","title":"钱包与密钥管理：钥匙放在哪里","md":"../chapters/18-wallet-key-management.md","v":{"vs":{"src":"skeuo/ep18/out/ep18-full.mp4","cues":[[1.65,2.85,"2024 年 7 月"],[2.87,5.16,"交易所 WazirX 的多签冷钱包"],[5.24,7.08,"损失约 2.3 亿美元"],[8.06,9.94,"冷钱包放的是大部分资产"],[10.14,12.09,"多签就是为了不让一把钥匙说了算"],[13.08,14.76,"这个钱包有六把钥匙"],[14.9,16.69,"转账要其中四把签名"],[17.67,19.14,"公开材料没有说"],[19.23,20.9,"任何一把私钥被导出"],[21.87,23.3,"签名人按流程"],[23.39,24.67,"一个一个签了名"],[25.64,27.28,"攻击者没有偷走钥匙"],[27.38,29.57,"却让这些钥匙替他签了字"],[30.54,32.43,"钥匙都在 钱没了"],[33.4,34.74,"多数大额事故"],[34.81, ，私钥是保险柜的钥匙。","多签像一个柜子三把锁，要两把一起开。","可如果锁的主人看同一块屏幕，三把锁就退化成一把。"]],["强度取决于最弱环节",["比喻不成立的地方是，真实的钥匙被复制，会留下痕迹。","私钥被复制，不留任何痕迹，直到资产被转走，你才知道。","所以方案的强度，取决于最容易被攻破的那个环节。","一台设备，一行日志，一个签名人的眼睛。"]],["密钥的一生",["一把密钥，要经过生成、存储、使用、备份、轮换和销毁。","每一步，都出过真实事故。"]],["生成：靶号地址生成器",["先看生成。","Profanity 是一个靶号地址生成器。","它的随机种子只有 32 位，约 43 亿种，私钥可以被 GPU 反推。","2022 年 9 月，1inch 公开了这个问题。","Wintermute 把这样一个地址，用作金库的管理员。"]],["转走余额，不等于消除风险",["披露后，它转走了地址里的 ETH，却没有撤销管理员权限。","约 5 天后，金库被盗约 1.6 亿美元。","转走余额，不等于消除风险，权限也要撤销。","资金地址要在可信硬件里生成，不用靶号工具。"]],["存储：日志里的助记词",["再看存储。","2022 年 8 月，Slope 钱包把助记词以明文发到自己的日志服务器。","Solana 官方通报，约 9231 个钱包受影响，损失约 410 万美元。","日志、崩溃上报、遥测，都是密钥的泄露通道。","客户端要在采集这一端，就把密钥材料屏蔽掉。"]],["发布链路也是一把钥匙",["钱包的发布链路，也是一把钥匙。","2025 年 12 月，Trust Wallet 的浏览器扩展，有一个恶意版本出现在 Chrome 商店。","它导出扩展里所有钱包的助记词，约 850 万美元被盗。","项目方称，攻击者用泄露的 GitHub secrets，拿到商店的 API Key。","发布凭证和 CI 密钥，本身就是资金级的资产。"]],["备份与分片",["最后看备份和分片。","2023 年 7 月，Multichain 的 MPC 地址出现异常转出，约 1.26 亿美元。","项目方声明，全部 MPC 节点服务器，都在 CEO 的个人云账户上。","CEO 被警方带走后，团队无法登录。","外部攻击或内部转移，外界有争议，没有官方定性。"]],["分片要真正独立",["MPC 的前提是分片独立，分片都在一个人手里，门限只是名义上的。","分片要放在不同组织、不同地域、不同云账户。"]],["看到的和签下的不一样",["回到开头的冷钱包。","六把钥匙里，WazirX 持五把，Liminal 持一把。","签名人在 Liminal 界面上看到的交易，和实际签下的不一样。","实际签下的，是一次合约升级，钱包控制权被转走。","接手的是一个恶意合约，它提前 8 天就部署好。"]],["双方各执一词",["WazirX 称，问题出在 Liminal 界面显示的数据。","Liminal 称，自己的基础设施没有被攻破，是受害方的 3 台机器被注入恶意载荷。","这一争议，没有见到最终的独立报告。"]],["多签只认哈希",["多签只保证，足够多的人同意某个哈希。","它不管这个哈希，代表的是哪一笔交易。","签名人看到的和实际签的不一样，每把钥匙都会正常工作。"]],["防线在签名人这一侧",["防线在签名人自己这一侧。","每个签名人，在自己的设备上，用另一套代码，独立算一遍交易哈希。","再在硬件钱包屏幕上，核对收款地址、金额、数据和操作类型。","设备把交易解析成人能读懂的字段再签，这叫清晰签名。"]],["看清操作类型",["例行转账，操作类型应该是 CALL。","如果是 DELEGATECALL，就是让多签合约执行外部代码，不签。","大额交易，再用电话或当面，确认发起人身份。"]],["共用就是单点",["签名人不能共用一台电脑、一个浏览器、一个前端，共用就是单点。","局限是，如果所有人用同一个解码工具，这个工具就是新的单点。"]],["热、温、冷三层钱包",["交易所每天都要给用户提币，不能每一笔都等人工签名。","常见做法，是分成热、温、冷三层钱包。","冷钱包放大部分资产，用多签或 MPC，每个签名人用硬件钱包。"]],["热钱包设水位",["温钱包负责中转，靠审批加时间窗口。","热钱包自动给用户提币，用 HSM 或 MPC。","热钱包只放一小部分，按每天的提币需求设水位。","热钱包失守，损失有上限。","冷到温，温到热，每一跳都要限额和审批。"]],["再猜一道题",["再猜一道题。","HSM 的私钥不能导出。","攻击者控制了能给 HSM 发指令的服务器，HSM 会拒绝吗？"]],["不会：安全在 HSM 之前",["不会。","HSM 只保证私钥不出设备，它按收到的指令签名。","所以热钱包的安全，在签名请求进入 HSM 之前。","那里要有一个独立的风控引擎，检查白名单、限额、速率和异常。","检查要按待签的原始字节判断，不看界面怎么写。"]],["大额转出的审批顺序",["一笔大额转出，审批也要按顺序走。","发起人提交交易，写明用途。","系统自动检查白名单、限额，以及操作类型是不是 CALL。","签名人各自解码核对，大额再用电话或当面确认。","执行之后，监控系统把链上结果和审批记录比对。"]],["项目方、开发者、运维",["按角色，各做一件事。","项目方和交易所，列出每个签名人的设备和云账户，看有没有两个人共用。","钱包开发者，确认日志和崩溃上报屏蔽密钥材料，发布凭证开启多因素认证。","运维负责人，人员离职或漏洞披露后，轮换密钥，并撤销链上权限。","备份要和主密钥分开放，每年至少演练一次恢复，恢复要多人参与。"]],["普通用户",["普通用户，大额放硬件钱包，小额放另一个钱包，两个钱包用不同的助记词。","助记词只写在纸或金属板上，不拍照，不存云笔记。","任何客服、网站、表单让你输入助记词，都是诈骗。","硬件钱包屏幕只显示哈希，或者无法解析，就不签。"]],["答案：能转走",["回到开头的问题。","六把私钥都没泄露，攻击者也能转走资金。","只要签名人看到的和实际签下的不一样，每把钥匙都会照常签名。","能挡住它的，是每个签名人在自己的设备上独立解码，核对屏幕上的字段。"]],["签下的是什么同样重要",["这只在签名人真正独立时成立。","钥匙放在哪里很重要，签下的是什么，同样重要。"]]]},"d3b":{"src":"../decks/3b1b/ch18.html","scenes":[["WazirX：Safe 多签，六把钥匙凑够四个签名",["2024 年 7 月，WazirX 的冷钱包，损失了约 2.3 亿美元。","这是一个 Safe 多签：六把私钥，要凑够四个签名，才能动钱。"]],["钥匙都在，钱却没了",["公开材料没有说任何一把私钥被导出。签名人，也是按流程签的名。","钥匙都在，钱却没了。多签，为什么没有拦住？","先把这个问题钉在这里。我们从一把私钥讲起。"]],["私钥：256 位随机数，链上只认签名",["私钥是一个 256 位的随机数，用来给交易签名。","链上不认人，只认签名。谁能让这把私钥签一笔交易，谁就拥有这笔资产。","我们平时抄下来的助记词，是 12 或 24 个单词。它是种子，能推导出一组私钥。"]],["比方：可无限复制的钥匙",["打个比方，私钥像保险柜的钥匙，而且可以无限复制。","比方不成立的地方是：真钥匙被复制，会留下痕迹；私钥被复制，什么痕迹都没有。你只会在资产被转走时才知道。"]],["软件钱包与硬件钱包",["那么，钥匙放在哪里？常见的有五种方案。","助记词软件钱包：私钥就在手机、电脑或浏览器扩展里。设备被攻破，钱就没了。","硬件钱包：私钥在独立芯片里，不离开设备，只往外盖章。但盖章之前，你要看清盖的是什么。"]],["多签、MPC、HSM",["多签：几把独立的私钥，加一份链上合约，签名凑够数量才执行。","MPC 门限签名：私钥被切成几片，各自计算，再合成一个签名，完整私钥从不出现。","HSM 硬件安全模块：私钥锁在专用硬件里，不能导出。它只按指令盖章，不判断指令对不对。"]],["哪种最安全：看攻击者能控制什么",["哪种最安全？还是那个问题：攻击者能控制什么？","他可能控制生成私钥的随机数，存放私钥的设备，日志和云备份，还有钱包软件的发布渠道。","他也可能控制签名人看到的界面，签名人本人，或者调用签名服务的权限。"]],["强度取决于最容易被攻破的那一环",["所以，密钥方案的强度，取决于最容易被攻破的那一环：一台设备，一行日志，一个签名人的眼睛。","多数大额事故，不是私钥被数学破解，而是在某一步被拿到，或者签名人被骗着签了攻击者的交易。"]],["生成：Profanity 种子只有 32 位",["把私钥的一生摊开：生成、存储、使用、备份、轮换。每一步，都出过真实事故。","先看生成。靶号地址生成器 Profanity，随机种子只有 32 位。","2 的 32 次方，大约 43 亿种。种子只有这么多，私钥就能被 GPU 反推出来。","Wintermute 用这样的地址当金库管理员。漏洞披露后，它转走了地址里的 ETH，却没有撤销管理员权限。约 5 天后，金库被盗约 1.6 亿美元。"]],["存储：明文日志和恶意版本",["再看存储。Slope 钱包把助记词以明文发到了日志服务器。约 9,231 个钱包受影响，损失约 410 万美元。","存储这一步，还可能被恶意版本攻破。Trust Wallet 浏览器扩展的一个恶意版本上架商店，导出助记词，约 850 万美元被盗。"]],["多签的前提：几方真的互相独立",["多签和 MPC，靠的是几方都同意。这有一个前提：这几方真的互相独立。","看一个示例：3-of-5 多签，五个签名人，五台硬件钱包。","可是他们坐在同一个办公室，用同一个浏览器插件，打开同一个多签前端。","这个前端一旦被篡改，五个人看到的，是同一个假画面。五把锁，退化成了一把。"]],["MPC 也一样：分片在同一个人手里",["MPC 也一样。Multichain 的全部 MPC 节点服务器，都跑在 CEO 的个人云账户上。CEO 被警方带走后，团队无法登录。","随后约 1.26 亿美元异常转出，定性至今有争议。但教训很清楚：分片在同一个人手里，门限只是名义上的。"]],["多签只保证足够多的人同意了某个哈希",["现在，放大签名的那一刻。发起人提交一笔：冷钱包向热钱包转 1,000 ETH。","多签前端把这笔交易算成一个哈希，送到签名人的硬件钱包。","关键在这里：多签只保证，足够多的人同意了某个哈希。哈希背后是什么，它不管。"]],["防线：独立工具重算哈希",["如果前端被篡改，屏幕上写着转账，哈希背后，可能已经换成了另一笔交易。","防线是：签名人把目标地址、金额、数据和操作类型，输入另一套独立工具，重新算一遍哈希。两边一致，再签。"]],["盯住操作类型，别共用解码工具",["还要盯住操作类型：0 是普通调用；1 是 DELEGATECALL，让多签去执行外部代码。例行转账，不该出现 1。","这条防线也有局限：如果所有签名人共用同一个解码工具，它就成了新的单点。"]],["冷、温、热三层：热钱包损失有上限",["交易所的钱，通常分三层：冷钱包放大部分资产，温钱包中转，热钱包自动处理用户提币。","从冷到温，从温到热，每一跳都有限额和审批。热钱包只放一小部分，失守了，损失有上限。"]],["HSM 不会拒绝，防线在它之前",["热钱包常用 HSM。私钥不可导出，听起来很安全。","可如果攻击者控制了调用 HSM 的服务器呢？HSM 不会拒绝，它照样盖章。","所以真正的防线在 HSM 之前：一个风控引擎，按待签的原始字节，检查白名单、限额和速率。"]],["WazirX：看到的和实际签下的不一致",["回到 WazirX。六把钥匙里，WazirX 持五把，托管方 Liminal 持一把；执行要三个 WazirX 签名，加上 Liminal 的签名。","签名人在 Liminal 界面上看到的交易，和实际签下的不一致。实际签下的，是一次合约升级。","钱包被切换到一份提前 8 天部署的恶意合约。控制权转走，多签和白名单都被绕过。","问题出在哪一侧的机器上，双方说法不同，至今没有最终的独立报告。"]],["多签数签名，不检查签的是什么",["但答案已经清楚：多签数的是签名够不够，不检查签的是什么。够数的签名，同意的是同一份被替换的内容。","成立条件是：每个签名人在自己的设备上独立解码，在硬件屏幕上核对目标、操作类型和数据。钥匙安全，不等于签名安全。"]]]}}},{"id":"19","title":"用户侧诈骗：不偷钥匙，骗你签名","md":"../chapters/19-user-scams.md","v":{"vs":{"src":"skeuo/ep19/out/ep19-full.mp4","cues":[[1.65,3.14,"2025 年 12 月"],[3.3,6.13,"一名用户要转出一大笔 USDT"],[7.12,8.09,"他很谨慎"],[8.12,9.85,"先转 50 USDT"],[9.91,11.33,"测试收款地址"],[12.31,13.28,"测试到账"],[13.49,14.34,"地址没错"],[15.34,16.26,"几分钟后"],[16.48,17.66,"他的交易记录里"],[17.68,20.32,"多出一笔 0.005 USDT 的转账"],[21.32,22.6,"约 26 分钟后"],[22.75,24.48,"他从记录里复制地址"],[24.5,26.09,"转出约 5000 万美元"],[27.08,29.42,"这一笔 到了攻击者的地址"],[30.4,31.56,"私钥没被偷"],[31.58,32.96,"钱包也没被攻破"],[33.96,36.33,"每一步 都是他自己点的确认"],[37.32,38.87,"这类骗局不偷钥匙"],[39.03,40.3,"它骗你自己动手"],[41 "]],["Drainer 即服务",["这些钓鱼网站，很多出自同一类工具。","它叫 Drainer 即服务。","开发者维护钓鱼套件、合约和后台，把它当作产品出租。"]],["引流与自动分账",["分发者负责引流，搭仿冒网站，买广告，盗社交账号。","链接投到被盗的 X 和 Discord 账号、搜索广告、假空投和私信里。","受害者一签名，转走的资产自动分账。","公开分析显示，开发者抽成约 20%，分发者拿约 80%。","各家套件的比例不同，也会变。"]],["先要最值钱的授权",["套件会先读你钱包里的余额，按价值排序，先请求最值钱的那个授权。","所以同一个钓鱼站，对不同的人，弹出的签名请求不一样。"]],["宣布关停，仍在运行",["Inferno Drainer 在 2023 年 11 月宣布关停，此前约 7000 万美元。","2025 年 5 月，Check Point 发现它仍在运行，半年内盗走约 900 万美元以上。","这次它在 Discord 冒充 Collab.Land 引流，受害者有 3 万多名。"]],["关停不等于消失",["Pink Drainer 在 2024 年 5 月宣布退休，约 2.1 万名受害者，约 8500 万美元。","Angel Drainer 到 2024 年 2 月，约 2500 万美元，同年 7 月停止服务。","关停不等于消失，套件代码和分发网络，会换个名字回来。"]],["钓鱼损失的变化",["整体看，2024 年的钓鱼损失约 4.94 亿美元。","其中百万美元以上的大案里，permit 类占损失的 56.7%。","2025 年降到约 8385 万美元，下降约 83%。","报告说，攻击转向小额和高频。","这个统计只算 EVM 链上的 Drainer 钓鱼，不含私钥泄露和交易所被盗。"]],["地址投毒",["回到开头那笔转账。","这叫地址投毒。","攻击者监控链上的转账，看到你的测试转账。","他生成一个首尾和收款地址相同、中间不同的地址。","首尾加起来 8 个十六进制字符，平均只要试约 43 亿次。"]],["往你的记录里塞一笔",["然后，他往你的记录里塞一笔 0 额或者粉尘转账。","这一步不需要你的任何授权。","转 0 个代币，或者用他自己部署的同名假代币，都能在你的记录里留下一条。","钱包只显示地址的前后几位，两个地址看起来一样。"]],["测试防不住投毒",["所以测试转账防不住投毒，投毒常在测试之后几分钟内出现。","2024 年 5 月，另一名受害者复制投毒地址，转出 1155 枚 WBTC，约 6800 万美元。","经过链上喊话谈判，攻击者在约一周内退回绝大部分资金。"]],["骗你买错",["骗你转错是一种，骗你买错是另一种。","卷款，是团队撤走流动性，或者把手里的币集中卖掉。","貔貅盘，是合约只允许买，不允许卖，或者卖出税 100%。","隐藏增发，是 owner 能无限铸币。"]],["SQUID 与 LIBRA",["2021 年 11 月的 SQUID 代币，限制持币者卖出，开发者撤走流动性，约 338 万美元。","2025 年 2 月的 LIBRA 代币，阿根廷总统发推推广后暴涨，随后崩盘。","Nansen 统计，亏损的钱包合计亏约 2.51 亿美元，案件结果尚无定论。"]],["涨幅不是安全信号",["CertiK 追踪到一个地址，在 2023 年 8 到 10 月部署 979 个貔貅盘代币，约每 30 分钟一个。","名人推广和涨幅，都不是安全信号。"]],["每个动作都能拦截",["这些骗局有一个共同点。","攻击者控制不了你的私钥，也控制不了链上合约的逻辑。","每一步都要你的一个动作，点击、签名、复制、粘贴。","每一个动作，都是一个可以拦截的点。"]],["钱包：把签名解码",["钱包这一层，先把签名请求解码成看得懂的字段。","授权给谁，额度多少，期限到哪天，委托哪个合约。","无法解码，就明确显示无法解析。"]],["高危签名默认强警告",["无限授权、批量授权、7702 委托，默认强警告。","7702 委托，只允许指向钱包自己审计过的实现合约，拒绝网站发起的委托请求。"]],["模拟、拦截、精确额度",["交易模拟，在签名之前，显示签完以后余额怎么变。","新注册的域名、仿冒的域名，直接拦下。","DApp 只请求精确额度的授权，用完就停。"]],["交易所：白名单与比对",["交易所这一层，提币地址用白名单，新地址有冷却期。","新地址和历史地址首尾相同、中间不同，就强提示。","交易记录默认折叠零额转账和陌生代币。","充值只认白名单里的代币合约，假 USDT 不入账。"]],["上币检查与风控名单",["上币前，检查卖出限制、持仓集中度和增发权限。","已知的 Drainer 收款地址和投毒地址，进风控名单。","提币页和空投活动页，提示官方从不要求签名领取。"]],["签名前看三样",["如果你是普通用户，先记住几条。","官方从不要求你签名领取空投，或者签名验证钱包。","签名前看三样，授权给谁，授权多少，到什么时候。","看不懂就不签，不花 Gas，不等于没有风险。"]],["分开钱包，定期撤销",["大额资产和日常交互，用不同的钱包。","每个月撤销不用的授权，买新币前，先确认它能卖出去。","已经签下钓鱼签名，就立刻撤销授权，把剩余资产转到新地址。"]],["钱包产品与交易所",["如果你做钱包产品，今天就查一件事，签名请求能不能解码成可读字段。","如果你在交易所，查一查提币时有没有比对首尾相同的历史地址。"]],["答案：并不安全",["回到开头的问题。","测试转账已经到账，从记录里复制地址，并不安全。","测试只证明那一刻的地址是对的，证明不了你之后复制的是同一个。","地址要从地址簿，或者收款方的安全渠道取，再核对完整地址，不只看首尾。","私钥完好无损，资产也可能没了，每次确认之前，先看清你在签什么。"]]]},"d3b":{"src":"../decks/3b1b/ch19.html","scenes":[["先转 50 USDT 测试，再转出约 5,000 万美元",["2025 年 12 月，一名用户要转一大笔 USDT。他很谨慎，先转了 50 USDT 测试。","测试到账了。他从交易记录里复制同一个地址，转出约 5,000 万美元。","这一笔，进了攻击者的地址。"]],["私钥没泄露，钱包没被入侵",["他的私钥没有泄露，钱包也没有被入侵。问题来了：不偷钥匙，怎么骗走钱？","先钉住这个问题。答案，藏在用户自己的一个动作里。"]],["攻击不碰私钥：让你自己动手",["上一集讲私钥放在哪里。这一集的攻击，根本不碰私钥。","它只做两件事之一：让你自己签下一个授权，或者让你自己把钱转到错误的地址。","私钥完好无损，签名也是真的，资产已经没了。"]],["比方：快递签收单的背面",["打个比方：骗子不撬门锁，而是递来一张快递签收单。背面印着：本人同意把房屋钥匙交给持单人。","比方不成立的地方是：纸可以翻到背面看；钱包里的签名请求，常常只是一串十六进制，背面要靠解码工具才看得懂。"]],["approve、permit、setApprovalForAll",["最常被滥用的签名，有五类。","approve：允许某个地址，转走你最多若干个某种代币。签完，对方随时可以调用 transferFrom。","permit：效果和 approve 一样，但它是链下签名，由别人提交上链。","setApprovalForAll：一次授权，对方能转走你在这个系列里的全部 NFT。"]],["Permit2、EIP-7702：共同点是别人也能动钱",["Permit2 批量授权，一次覆盖多种代币。EIP-7702 委托，干脆让你的地址去执行别人的合约代码。","五类签名的共同点是：签完以后，能动这笔钱的，不只是你了。"]],["链下签名最隐蔽：没有 Gas，没有记录",["其中最隐蔽的，是链下签名。不花 Gas，钱包里也没有交易记录。","用户以为只是登录，实际签下的，是一张攻击者可以拿去兑现的支票。"]],["permit 和 owner 变更造成的大额损失",["2024 年 9 月，一名受害者签了一个 permit。攻击者凭它，转走 12,083 枚 spWETH，约 3,243 万美元。","一个月前，另一名受害者签名，把 Maker 金库代理合约的 owner 改成了攻击者。约 20 分钟后，对方铸出 5,547 万枚 DAI。","据 ScamSniffer 统计，2024 年百万美元以上的钓鱼大案里，permit 类占了损失的 56.7%。"]],["Drainer 即服务：开发者出租，分发者投放",["这些钓鱼站背后，常常是一门生意：Drainer 即服务。","开发者维护钓鱼套件和后台，把它出租给分发者。分发者建仿冒站、买广告、盗社交账号，把链接投出去。","受害者一连上钱包，套件先扫余额，按价值排序，优先请求最值钱的授权。所以同一个钓鱼站，对不同的人，弹出的请求不一样。"]],["自动分账，关停了也会回来",["转走的钱，自动分账。按示例算：骗到 100 万美元，开发者抽约 20%，也就是 20 万；分发者拿 80 万。","这门生意关停了，也会回来。Inferno 在 2023 年 11 月宣布关停；2025 年，Check Point 发现它仍在运行，半年里从 3 万多名受害者手里，盗走 900 万美元以上。"]],["地址投毒：生成首尾相同的地址",["回到开头那笔转账。它的手法，叫地址投毒。","用户先转 50 USDT 测试。攻击者监控到这笔转账，生成一个首尾和真地址相同的地址。","这很便宜。比如要匹配首尾共 8 个十六进制字符，平均只要试 16 的 8 次方，约 43 亿次。"]],["粉尘转账之后，复制到了假地址",["然后，攻击者往用户的记录里，打一笔 0.005 USDT 的粉尘转账。记录里，出现了两个看起来一样的地址。","约 26 分钟后，用户从记录里复制地址，转出 49,999,950 USDT。他复制到的，是投毒地址。","所以测试转账防不了投毒。投毒，常常就发生在测试之后几分钟。"]],["代币本身就是陷阱",["还有一类骗局，不需要你签危险的授权：代币本身，就是陷阱。","卷款：团队撤走流动性，价格归零。貔貅盘：合约只允许买，不允许卖。","还有隐藏增发：owner 可以无限铸造。以及内部人抛售：上线前分给少数地址，上线后立刻卖出。"]],["涨幅和名人推广都不是安全信号",["2021 年的 SQUID 代币，合约限制持币者卖出。开发者撤走流动性后，价格几分钟内归零，约 338 万美元。","CertiK 还追踪到一个地址，三个月里部署了 979 个貔貅盘，约每 30 分钟一个。所以涨幅和名人推广都不是安全信号：先看能不能卖，谁持有，谁能增发。"]],["每个动作都是一个可以拦截的点",["把这些手法放在一起，有一个共同点。","攻击者控制不了你的私钥，也改不了链上合约的逻辑。","所以每一步，都需要你亲手做一个动作：点击，签名，复制，粘贴。","每一个动作，都是一个可以拦截的点。"]],["钱包解码模拟，交易所白名单",["钱包可以把签名解码成可读的字段：授权给谁、多少、到什么时候；签之前，先模拟出余额会怎么变。","交易所可以给提币地址设白名单和冷却期，比对首尾相同、中间不同的地址，并默认折叠零额转账。"]],["答案：让你自己动手",["回到开头的问题：不偷钥匙，怎么骗走钱？","答案是：让你自己动手。要么你自己签下授权，要么你自己把钱转到错误的地址。","那位用户的私钥一直安全。失守的，是复制地址的那一下。"]],["习惯与成立条件：看懂才签",["能拦住它的，是一个习惯：从地址簿取地址，核对完整地址，不从交易记录里复制。","成立条件是：你签下的、转出的，是你真正看懂的内容。看不懂的签名，就不签。"]]]}}},{"id":"20","title":"前端、DNS 与供应链：合约没变，页面变了","md":"../chapters/20-frontend-dns-supply-chain.md","v":{"vs":{"src":"skeuo/ep20/out/ep20-full.mp4","cues":[[1.65,2.82,"2022 年 8 月"],[2.84,4.91,"一名用户打开 Curve 的官网"],[5.9,7.05,"他输入的域名"],[7.2,8.49,"一个字母都没错"],[9.46,10.39,"地址栏旁边"],[10.52,12.78,"HTTPS 的锁标志也在"],[12.8,14.46,"浏览器没有任何警告"],[15.46,16.89,"页面请他授权"],[17.07,18.02,"他签了名"],[18.99,20,"签完之后"],[20.1,21.34,"他的代币被转走"],[22.31,25.85,"这一次 用户合计损失约 57 万美元"],[26.85,28.95,"Curve 的合约没有任何变化"],[29.14,30.82,"审计过的代码也没出错"],[30.89,32.81,"链上的一切都和昨天一样"],[33.81,34.78,"变的是页面"],[35.9,39.28,"那天 这个域名被解析到一个克隆的前端"],[39.38,40.73,"攻击者没碰合约"],[40.94,42.06,"他换掉的是页面"],[43.06,44.38,"先猜一道题"],[45.37,46.41,"域名是对的"],[46.48,47.86,"锁标志也在"],[48.07,48.98,"这能证明"],[49.15,50.87,"你看到的页面是真的吗"],[52.13,53.58,"先记住这个问题"],[56.75,58.2,"先给准确的说法"],[59.2,60.5,"用户不读合约"],[60.53,61.7,"用户读页面"],[62.68,63.79,"页面告诉你"],[63.9,64.96,"这笔交易是什么"],[65.93,67.98,"钱包再把页面构造好的交易"],[68.12,69.09,"交给你签名"],[7 ,[383.98,386.86,"是一条长长供应链的最后一站"],[387.31,391.88,"域名、依赖、构建、托管、CDN、第三方脚本"],[391.88,397.46,"任何一环被攻破，页面就变了；合约审计一环都看不到"],[397.91,403.27,"成立条件是：签名前，在页面之外核对你签的是什么"],[403.27,406.07,"域名正确，不等于页面可信"],[406.52,410.2,"下一集：攻击者为什么先攻破人"]],"ch":[]},"deck":{"src":"../decks/skeuomorphic/ch20/index.html","scenes":[["域名没错，锁也在",["2022 年 8 月，一名用户打开 Curve 的官网。","他输入的域名，一个字母都没错。","地址栏旁边，HTTPS 的锁标志也在，浏览器没有任何警告。"]],["签了名，代币被转走",["页面请他授权，他签了名。","签完之后，他的代币被转走。","这一次，用户合计损失约 57 万美元。"]],["合约没变，页面变了",["Curve 的合约没有任何变化，审计过的代码也没出错，链上的一切都和昨天一样。","变的是页面。","那天，这个域名被解析到一个克隆的前端，攻击者没碰合约，他换掉的是页面。"]],["先猜一道题",["先猜一道题。","域名是对的，锁标志也在，这能证明，你看到的页面是真的吗？","先记住这个问题。"]],["用户不读合约，读页面",["先给准确的说法。","用户不读合约，用户读页面。","页面告诉你，这笔交易是什么。","钱包再把页面构造好的交易，交给你签名。","攻击者改掉页面，你就会对着一个审计过的合约，签下攻击交易。","前端，就是浏览器里的网页，和它加载的全部脚本。"]],["比喻：换掉柜台贴纸",["打个比方，银行柜台的玻璃上，贴着收款账号。","金库、账本、保安都没问题，但有人夜里换了这张贴纸。","第二天，客户都把钱汇进新账号。"]],["千里之外换贴纸",["比喻在这里不成立，换贴纸要进银行大厅。","改前端可以在千里之外完成，而且能只对某一个客户显示假贴纸。"]],["前端的供应链",["页面从源码到你的浏览器，要经过一整串环节。","开发者的电脑、代码仓库、依赖包、构建、托管、CDN，最后是域名。","这一整串，叫供应链。","任何一环被攻破，结果都一样，你的浏览器运行着攻击者的代码。","合约审计，覆盖不到其中任何一环。"]],["最外一环：域名",["先看链路最外面的一环，域名。","浏览器先问 DNS，这个域名指向哪台服务器。","攻击者控制域名注册商的账号，或者攻破注册商本身。","再把解析记录，指向自己的服务器。","你访问正确的域名，打开的却是克隆页面。"]],["锁标志证明不了真页面",["回到开头的题，不能证明。","控制了解析的人，可以用常见的域名验证方式，申请到有效证书。","锁标志只说明，浏览器连上了域名此刻指向的服务器。","地址栏这一层的检查，在这里全部失效。"]],["注册商本身就是风险",["2025 年 5 月，攻击者进入同一家注册商的系统。","又一次把 Curve 的域名委派，改到自己的服务器。","Curve 把用户引导到新域名，并公开批评注册商响应迟缓。","同一家注册商出两次事，说明换个强密码不够，注册商本身就是风险。"]],["迁移期间的域名劫持",["2024 年 7 月，Google Domains 的域名业务，迁到 Squarespace。","之后，Compound 等多个 DeFi 项目的域名被劫持，指向盗币页面。","研究者认为，这和迁移期间多因素认证失效有关，官方没有公布根因。","Celer 靠域名监控，拦下了劫持尝试。"]],["域名这一环的防线",["所以域名这一环，要开注册商锁和注册局锁。","注册商账号用硬件密钥登录，只给少数人权限。","开启 DNSSEC，监控解析记录、委派和证书的变化。","换服务商的当天，重新核查账号和多因素认证。","再提前公布一个备用域名。"]],["依赖包投毒",["往里一环，是依赖包。","一个前端会引用很多别人写的代码包，大多来自 npm 仓库。","攻击者先钓鱼包的维护者，拿到账号或者会话。","再发布一个带恶意代码的新版本。","如果 DApp 不锁版本，下次构建就会拉进这个新版本。","恶意代码挂到钱包接口上，替换收款地址，或者弹出授权。"]],["漏回收的 npm 权限",["2023 年 12 月，Ledger 的一名前员工被钓鱼。","Ledger 回收了他的其他权限，唯独漏了 npm。","攻击者用他的会话，先后发布 3 个恶意版本的 Connect Kit。","很多 DApp 直接从 CDN 加载最新版，恶意代码直接进了它们的页面。"]],["缓存拖长了危害",["Ledger 约 40 分钟内发布了修复版本。","但 CDN 的缓存，让恶意文件约 5 小时后才完全清除，损失约 60 万美元。"]],["一个包能进多少页面",["2025 年 9 月，chalk 和 debug 等 18 个包被投毒，周下载量合计超过 20 亿。","已确认的加密损失很小，但一个包能进入的页面，多到无法统计。"]],["再往里：CDN",["再往里，是 CDN。","CDN 把文件缓存到各地的边缘节点，就近发给用户。","边缘节点上也能运行脚本，改写发出去的页面。"]],["BadgerDAO：边缘脚本",["2021 年，攻击者利用 Cloudflare 注册流程的一个漏洞。","拿到 BadgerDAO 账号下，一把未经授权的 API Key。","从 11 月起，他通过边缘脚本，定期往页面里注入代码，只对部分用户弹出授权。","12 月 2 日，攻击者用这些授权，转走约 1 亿 2000 万美元。"]],["依赖与 CDN 的防线",["这两环的防线，先锁定全部依赖版本，不从 CDN 加载最新版的库。","外部脚本加上子资源完整性校验，哈希不对就不执行。","发布凭证用短期的，有人离职，当天回收所有发布渠道。","CDN 的密钥最小权限，定期轮换，一有变更就告警。"]],["只对一个目标生效",["最难发现的篡改，只对一个目标生效。","2025 年 2 月，Bybit 的冷钱包多签被盗，损失约 15 亿美元。","FBI 公告把它归因于朝鲜。"]],["从开发者电脑到 S3",["Safe 的初步报告称，2 月 4 日，一名开发者的电脑失陷。","起因是运行了一个受污染的 Docker 项目。","攻击者没能注册自己的验证设备，就劫持了活跃的 AWS 会话令牌。","然后，篡改了 S3 上 Safe 网页前端的脚本。"]],["只认 Bybit 的多签地址",["脚本先判断，发起交易的是不是 Bybit 的多签地址。","不是，就一切正常。","是，界面照样显示一笔正常转账，实际构造的是一次 DELEGATECALL。"]],["多签实现被替换",["签名人在硬件钱包上签名，只看到一串哈希。","签名凑够门槛，交易执行，多签的实现合约被替换。","约 40 万枚 ETH 类资产被转走，约 2 分钟后，脚本被换回干净版本。"]],["事后看一切正常",["外部研究者打开页面，看到的一切正常。","Verichains 称，恶意代码只在特定条件下激活。","Sygnia 认为，Safe 的云存储账号或密钥很可能泄露。","在 Bybit 自己的系统里，没有发现入侵证据，Safe 称合约不受影响。"]],["前端是多签的单点",["关键在这里。","所有签名人都用同一个网页前端，前端就是这个多签的单点。","增加签名人，无法解决这个问题。"]],["防线在签名这一步",["防线在签名这一步，签名人用独立工具，重新计算交易哈希，在硬件钱包上核对。","例行转账只允许普通调用，委托调用进单独的审批流程。"]],["发布方反复比对哈希",["发布方用独立系统，比对线上文件和构建产物的哈希。","但比对只覆盖那一刻、那个位置，要在多个位置反复比对，并保留每个版本的哈希和访问日志。"]],["普通用户先记住几条",["如果你是普通用户，先记住几条。","收藏官方网址，从收藏夹进入，不点搜索广告和私信链接。","即使域名正确，签名前也要解码，看清你在签什么。","项目方公告前端异常，立刻停止交互，撤销近期的授权。","熟悉的网站突然要你重新授权、迁移资产、验证钱包，先停下来核实。"]],["前端负责人与签名人",["如果你负责前端，今天就问一个问题。","今晚有人替换了一个脚本文件，谁会在多久之后发现？","如果你是多签签名人，确认自己有一条不经过这个前端的核对路径。"]],["答案：不能证明",["回到开头的问题。","域名是对的，锁也在，不能证明页面是真的。","它只说明你连上了域名此刻指向的服务器，而那台服务器，可能已经换了主人。"]],["审计管不住页面",["审计管得住合约，管不住页面，签名之前，独立核对你在签什么。"]]]},"d3b":{"src":"../decks/3b1b/ch20.html","scenes":[["curve.fi：域名对、有小锁、合约没变",["2022 年 8 月，Curve 的用户照常打开 curve.fi。","地址栏里的域名，一个字母都没错。旁边还有 HTTPS 的小锁。","合约也没有任何变化。可是用户签完名，损失了约 57 万美元。"]],["答案在合约前面那一页",["域名是对的，锁也在，合约没变。钱是怎么没的？","先钉住这个问题。答案不在合约里，在合约前面那一页。"]],["用户不读合约，用户读页面",["用户不读合约，用户读页面。","页面告诉你，这笔交易是什么；钱包再把页面构造好的交易，交给你签名。","所以攻击者只要改掉页面，就能让你对着一个审计过的合约，签下一笔攻击交易。"]],["比方：换掉柜台玻璃上的收款账号",["打个比方：银行的金库、账本、保安都没问题，但有人夜里换掉了柜台玻璃上贴的收款账号。","比方不成立的地方有两处：改前端，不用走进大厅，千里之外就能完成；而且可以只给某一个客户看假贴纸，其他人看到的都是真的。"]],["页面走过一整条供应链",["页面是怎么到你浏览器里的？它走过一整条供应链。","开发者的电脑写代码，提交到仓库。构建时，再拉进几百个 npm 依赖包。","构建产物放到托管服务上，经过 CDN 分发。域名和 DNS，决定你连到哪台服务器。","页面里还会加载第三方脚本：统计、客服、钱包连接库。最后，才弹出钱包的签名请求。"]],["每个方框都是信任环节，审计一个都覆盖不到",["这里的每一个方框，都是一个信任环节。任何一个被攻破，结果都一样：你的浏览器里，运行着攻击者的代码。","而合约审计，覆盖不到这张图里的任何一个方框。"]],["域名被劫持：地址栏和小锁都失效",["先看最外面一环：域名。","攻击者拿下域名注册商的账号，或者攻破注册商本身，把 DNS 记录指向自己的服务器。","你输入正确的域名，到达的是一个克隆页面。地址栏的检查，在这一步全部失效。","那把锁呢？控制了 DNS 的攻击者，可以通过常见的域名验证，申请到有效证书。锁只说明：你连上了这个域名当前解析到的服务器。"]],["同一注册商出两次事：强密码不够",["Curve 的事还没完。2025 年 5 月，攻击者进入同一家注册商的系统，又一次改了 curve.fi 的 DNS 委派。","同一家注册商出两次事，说明换个强密码不够。要上注册商锁和注册局锁，用硬件密钥登录，并监控 DNS 的每一次变化。"]],["依赖包：Ledger Connect Kit 被投毒",["再往里一环：依赖包。","2023 年 12 月，Ledger 一名前员工被钓鱼。Ledger 回收了他的其他权限，却漏了 npm。","攻击者用他的账号，发布了 3 个内嵌 Drainer 的 Connect Kit 版本。很多 DApp 从 CDN 加载的是最新版，恶意代码直接进了它们的页面。"]],["修好之后，仍暴露约 260 分钟",["看一下时间：Ledger 约 40 分钟就发布了修复版本，可 CDN 缓存让恶意文件约 5 小时后才完全清除。5 小时是 300 分钟，修好之后，还暴露了约 260 分钟。损失约 60 万美元。","防线是：锁定依赖版本，校验完整性哈希，不从 CDN 动态加载最新版。不然，别人的事故就会变成你的事故。"]],["CDN 的边缘脚本可以半路改写网页",["再看 CDN。它不只是分发文件，边缘脚本还能在半路改写网页。","2021 年，攻击者利用 Cloudflare 注册流程的一个漏洞，拿到了 BadgerDAO 账号下一把未经授权的 API Key。","从 11 月起，攻击者通过边缘脚本周期性地注入代码，只对部分用户弹出授权请求。"]],["CDN 账号就是前端的信任根",["12 月 2 日，攻击者用积累下来的授权，转走约 1.2 亿美元。","教训是：CDN 和边缘计算账号，就是前端的信任根。它的 API Key，要有清单、有告警、能审计。"]],["Bybit：只对一个目标改前端",["最难发现的，是只针对一个目标的篡改。","2025 年 2 月，Safe 的一名开发者运行了伪装成开源项目的恶意 Docker。攻击者偷到 AWS 会话令牌，改掉了存放在 S3 上的 Safe 前端脚本。","这段脚本先判断：打开页面的，是不是 Bybit 的冷钱包？不是，一切照常。是，界面显示正常转账，实际构造的却是一笔 DELEGATECALL。","签名人在硬件钱包上，只看到哈希或者没解析的数据。阈值达成，多签的实现合约被替换，约 15 亿美元被转走。"]],["前端可以对每个人说不同的话",["约 2 分钟后，脚本被换回干净版本。外部研究者从自己的浏览器打开页面，什么也看不到。","这就是关键：前端可以对每个人说不同的话。所有签名人用同一个网页，网页就是这个多签的单点；加签名人，解决不了。"]],["发布方：独立比对，多位置反复比对",["既然页面会说谎，防线就要建在页面之外。","发布方：发布后，用一个独立系统比对线上文件和构建产物的哈希，不一致就告警。","但比对只覆盖那一刻、那个位置。边缘脚本可以只改写部分用户的响应，所以要在多个位置反复比对，并监控 CDN 配置。"]],["内容安全策略，与签名人的独立核对",["再加上内容安全策略，限制页面能加载哪些脚本；保留每个版本的哈希和访问日志，供事后取证。","签名人：不只看前端。用独立工具重新算交易哈希，在硬件钱包上核对；例行转账的操作类型，必须是普通调用。"]],["答案：页面是供应链的最后一站",["回到 Curve：域名对、锁也在、合约没变，钱是怎么没的？","因为用户信的是页面。而页面，是一条长长供应链的最后一站。","域名、依赖、构建、托管、CDN、第三方脚本，任何一环被攻破，页面就变了；合约审计一环都看不到。"]],["成立条件：在页面之外核对你签的是什么",["成立条件是：签名前，在页面之外核对你签的是什么。域名正确，不等于页面可信。"]]]}}},{"id":"21","title":"社工与内部人：攻击者先攻破人","md":"../chapters/21-social-engineering-insiders.md","v":{"vs":{"src":"skeuo/ep21/out/ep21-full.mp4","cues":[[1.65,2.98,"2026 年 9 月"],[3.11,5.94,"一名 Binance 工程师接到面试邀约"],[6.93,8.96,"邀约来自正规的招聘平台"],[9.16,10.74,"他也参加了视频面试"],[10.77,12.35,"看上去一切正常"],[13.34,14.63,"面试结束前"],[14.7,16.12,"对方给了他一份作业"],[17.12,18.33,"一个代码仓库"],[18.52,19.96,"要他下载下来完成"],[20.96,23.25,"他把仓库下载到了工作电脑上"],[24.23,25.58,"他没有输入密码"],[25.69,27.46,"也没有点任何钓鱼链接"],[28.46,29.41,"到了 10 月"],[29.63,31.8,"攻击者从工程师的电脑出发"],[31.91,33.58,"控制了更多同事的电脑"],[34.58,36.98,"最后 他们找到了部署令牌"],[37.97,39.11,"这次事件里"],[39.22,41.99,"受影响的资产约 63.4 亿美元"],[42.99,44.31,"先猜一道题"],[45.3,46.24,"没有密码"],[46.26,47.2,"没有链接"],[47.43,48.59,"这份作业"],[48.6,50.25,"是靠什么进入他电脑的"],[51.51,52.95,"先记住这个问题"],[56.12,57.57,"先给准确的说法"],[58.57,59.59,"社会工程"],[59.61,61.63,"就是靠欺骗或利用信任"],[61.72,62.93,"让人自己动手"],[62.97,64.52,"做攻击者需要的事"],[65.51,66.53,"内部人风险"],[66.58,68.14,"是有合法权限的人"],[68.23,70.27,"有意或无意地造成损失"],[71.27,72.44,"最贵的漏洞"],[72.53,73.88,"常常不在合约里"],[74.12,75.51,"而在员工的电脑上"],[76.48,78.41,"攻击者不去破解多签合约"],[78.55,79.78,"他让一个签名人"],[79.8,81.77,"在自己电脑上打开一个文件"],[82.75,85.44,"之后 这台电脑上显示的一切"],[85.54,86.65,"都可能是假的"],[87.63,88.53,"打个比方"],[88.63,89.93,"金库有三道门"],[90.06,91.55,"三个人各管一把钥匙"],[92.53,93.73,"窃贼不撬门"],[93.8,95.03,"他给三个掌钥人"],[95.07,96.79,"各寄了一封老同事的来信"],[97.79,99,"信纸上涂了药"],[99.13,100.16,"读过信的人"],[100.26,102.97,"第二天会记错自己开的是哪道门"],[103.94,105.31,"比喻在这里不成立"],[105.47,106.66,"真实的攻击者"],[106.73,108.31,"不需要同时骗三个人"],[109.29,111.83,"签名人的电脑都运行同一个前端"],[111.93,113.2,"攻破其中几台"],[113.37,114.78,"再配合篡改前端"],[114.8,116.13,"就可能凑够门槛"],[117.12,118.56,"攻击者能控制的"],[118.63,120.07,"通常是这五样东西"],[1 切正常。"]],["一份代码作业",["面试结束前，对方给了他一份作业。","一个代码仓库，要他下载下来完成。","他把仓库下载到了工作电脑上。","他没有输入密码，也没有点任何钓鱼链接。"]],["从一台电脑到部署令牌",["到了 10 月，攻击者从工程师的电脑出发，控制了更多同事的电脑。","最后，他们找到了部署令牌。","这次事件里，受影响的资产约 63.4 亿美元。"]],["先猜一道题",["先猜一道题。","没有密码，没有链接，这份作业，是靠什么进入他电脑的？","先记住这个问题。"]],["社会工程与内部人风险",["先给准确的说法。","社会工程，就是靠欺骗或利用信任，让人自己动手，做攻击者需要的事。","内部人风险，是有合法权限的人，有意或无意地造成损失。"]],["最贵的漏洞在员工电脑上",["最贵的漏洞，常常不在合约里，而在员工的电脑上。","攻击者不去破解多签合约，他让一个签名人，在自己电脑上打开一个文件。","之后，这台电脑上显示的一切，都可能是假的。"]],["比喻：三个掌钥人",["打个比方，金库有三道门，三个人各管一把钥匙。","窃贼不撬门，他给三个掌钥人，各寄了一封老同事的来信。","信纸上涂了药，读过信的人，第二天会记错自己开的是哪道门。"]],["不必同时骗三个人",["比喻在这里不成立，真实的攻击者，不需要同时骗三个人。","签名人的电脑都运行同一个前端，攻破其中几台，再配合篡改前端，就可能凑够门槛。"]],["身份、任务、会议",["攻击者能控制的，通常是这五样东西。","一个假身份，冒充招聘者、前同事、合作方或者记者。","一个任务，比如测试题、代码作业、一份复盘 PDF。","一个会议，比如假会议软件，或者远程控制请求。"]],["一笔钱，一个身份",["一笔钱，用来收买客服或外包人员。","还有一个被雇用的身份，冒名应聘远程岗位。","公开通报显示，朝鲜相关组织在这类攻击中最活跃。","但手法本身被各类犯罪团伙复用，防御不该只盯着一个组织。"]],["假招聘与假面试",["先看最常见的一种，假招聘和假面试。","假招聘者在 LinkedIn 或 Telegram 上找到你，说有个高薪岗位，先做个测试。","然后发来一个 GitHub 项目，或者一个 Python 脚本。","关键在下一步，员工在工作电脑上，运行了外部代码。","后门回连，偷走浏览器的会话 cookie、SSH 密钥和钱包。"]],["偷的是会话，不是密码",["注意，偷的是会话 cookie，不是密码。","会话 cookie 是登录之后的凭证，拿到它，就能绕过多因素认证。","就算账号用了硬件密钥，通常也挡不住，硬件密钥只保护登录这一步。"]],["供应商员工也是攻击面",["2024 年 3 月，钱包软件供应商 Ginco 的一名员工，就这样运行了一个测试脚本。","5 月，攻击者用偷来的会话，进入 Ginco 的系统，篡改了 DMM Bitcoin 的一笔交易。","被盗的 BTC 约 3.05 亿美元。","FBI 和日本警察厅等机构，联合归因于朝鲜的 TraderTraitor。","供应商的员工，也是你的攻击面。"]],["规模化的假面试",["这类假面试已经成了规模化的活动。","多国机构联合告警，从 2025 年 12 月到 2026 年 7 月，至少 3 万台设备被感染。","而且不一定要你手动运行，打开项目时，配置文件就可能自动执行代码。"]],["伪装成复盘 PDF",["文件也能做同样的事。","2024 年，Radiant Capital 的开发者，在 Telegram 上收到一个 zip，发件人冒充前承包商。","里面是伪装成复盘 PDF 的 macOS 后门，3 名开发者的设备被感染。"]],["模拟结果也是假的",["恶意软件改写了多签前端的显示。","签名人用了硬件钱包，也做了交易模拟，但界面上的模拟结果，也是假的。","多签所有权被转走，损失约 5000 万美元。"]],["第二种：一个会议",["第二种手法，是一个会议。","攻击者冒充媒体或投资机构，邀请你参加访谈或路演。","然后要你下载一个专用会议软件，或者在会议里申请远程控制。"]],["名叫 Zoom 的参会者",["2025 年 4 月，Trail of Bits 公开了一种做法。","攻击者在 Zoom 通话里，把自己的显示名改成 Zoom。","弹窗写着 Zoom 请求控制你的屏幕，看起来像系统提示。","但这里的 Zoom，只是一个参会者的名字。","点了同意，对方就能控制电脑，打开钱包或密码管理器。"]],["假职位与假会议软件",["同年 2 月，还有人发布假的 Web3 职位。","引导求职者安装 GrassCall 会议软件，里面是窃密木马。"]],["第三种：冒名受雇",["第三种手法，是把人直接送进公司。","攻击者用盗用或伪造的身份，应聘远程开发岗位。","美国检方在 2025 年 6 月，起诉了 4 名朝鲜人。","他们冒名受雇于区块链公司，其中一人修改了雇主两个智能合约的源码。","把约 74 万美元转到自己的地址，全案约 91.5 万美元。"]],["第四种：一笔钱",["最后一种，是一笔钱。","2025 年 5 月，攻击者用现金，收买了 Coinbase 的海外外包客服。","导出约 7 万名用户的数据，再冒充 Coinbase 行骗。","Coinbase 估算，成本约 1.8 亿到 4 亿美元。"]],["被利用的员工",["同年 7 月，CoinDCX 的一名员工被兼职工作吸引，在公司电脑上装了恶意软件。","运营钱包被盗走约 4400 万美元，当地警方称，这名员工并不知情，只是被利用了。"]],["第一条：设备分离",["防御不能指望员工永远不被骗，要让一个人被骗，也不够造成损失。","第一条，设备分离。","签名专用设备，只用来签名和独立解码，不收邮件，不上 Telegram，不打开外部文件。","日常办公电脑，用来沟通和写文档，不存生产凭证和私钥。","开发电脑要运行外部项目，就放进隔离的虚拟机，或者一次性环境。"]],["第二条：流程控制",["第二条，流程控制。","资金操作、合约发布、权限变更，至少两人独立确认，这叫双人原则。","大额交易和权限变更，用预先登记的电话或当面确认，这叫带外确认。","要点是，不用发起请求的那个渠道。"]],["职责分离与短期会话",["发起人、审批人、执行人、审计人，不能是同一个人，这叫职责分离。","关键系统用硬件密钥，会话短期有效，异地登录要告警。"]],["第三条：管好人员进出",["第三条，管好人员的进出。","招聘时，视频面试本人出镜，核验证件和履历，远程岗位核验设备所在地。","离职当天，回收全部权限。","不只是代码仓库和云，还有 npm、域名注册商、官方社交账号、多签签名人身份。","漏掉一个边缘权限，前员工的账号，就是一扇没锁的门。"]],["第四条：内部人早期信号",["第四条，留意内部人风险的早期信号。","访问和岗位无关的数据，短时间大量导出，借口紧急，要求绕过审批。","还有坚持独自处理某类操作，拒绝休假或轮岗。","最后，要有匿名报告渠道，员工报告可疑接触，不受惩罚。"]],["普通用户也会遇到",["普通用户也会遇到同样的手法。","招聘者让你下载项目、运行脚本、安装会议软件，先停下来。","不在存放钱包的电脑上，运行陌生项目，打开陌生文件。","会议里，拒绝任何远程控制请求。","客服主动联系你，说账户有风险，要你转移资产，一律挂断，再从官方 App 里联系客服。"]],["今天就能做的事",["如果你是签名人，今天就把聊天软件，从签名设备上删掉。","如果你是开发者，陌生项目一律先在隔离环境里打开。","如果你负责团队，查一遍离职清单，看它有没有覆盖边缘权限。"]],["答案：一个安装脚本",["回到开头的题。","作业仓库靠的是安装脚本，安装步骤运行了混淆的命令，把合法的 pyenv 组件换成了恶意版本。","当时的终端防护没有发现，在工作电脑上运行外部代码，这一步就够了。"]],["清理完成，威胁未结束",["而在 6 月，另一名工程师下载过被篡改的 Homebrew，Binance 当时就发现并清理了这台设备。","但报告称，攻击者由此了解了工程师的角色和同事。","一次清理完成，不代表威胁结束。"]],["被攻破一人，也转不走钱",["攻击者先攻破人，防线就要设计成，一个人被攻破，也转不走钱。"]]]},"d3b":{"src":"../decks/3b1b/ch21.html","scenes":[["一次面试，一份作业仓库",["2026 年 9 月，一名 Binance 工程师接到面试邀约，参加了视频面试。","面试结束前，对方请他把一份作业仓库，下载到工作电脑上。","他没有输入密码，也没有点钓鱼链接。一个月后，受影响的资产约 63.4 亿美元。"]],["为什么先攻破人",["攻击者明明可以去研究合约、研究多签，为什么先攻破人？","先钉住这个问题。我们从一台员工电脑讲起。"]],["最贵的漏洞在员工的电脑上",["最贵的漏洞，常常在员工的电脑上。","攻击者不去破解多签合约，而是让一个签名人，在自己的电脑上打开一个文件。","从那以后，这台电脑上显示的一切，都可能是假的。"]],["比方：给三个掌钥人各寄一封信",["打个比方：金库有三道门，三个人各管一把钥匙。窃贼不撬门，而是给三个掌钥人各寄一封老同事的来信，读信的人第二天会记错自己开的是哪道门。","比方不成立的地方是：真实的攻击者不需要骗全部三个人。只要签名人都用同一个前端，攻破其中几台电脑，再配合前端篡改，就可能凑够阈值。"]],["攻击者控制的：假身份和任务",["还是那个问题：攻击者能控制什么？","一个假身份：招聘者、前同事、合作方、媒体记者。","一个任务：测试题、代码作业、复盘文件、合同。还有一场会议，一笔用来收买的钱。"]],["被雇用的身份；手法会被各类团伙复用",["甚至是一个被雇用的身份：用盗来的身份，应聘你的远程岗位。","公开通报显示，朝鲜相关组织在这类攻击里最活跃。但手法会被各类团伙复用，所以防御不该只盯着一个组织。"]],["假招聘：在工作电脑上运行外部代码",["看最常见的一条路：假招聘。","招聘者发来一个高薪岗位，再发来一个项目或脚本，说先做个测试。员工在工作电脑上运行了它。","关键就是这一步：在工作电脑上，运行了外部代码。有些项目甚至在打开时就会自动执行。","后门偷走的，常常不是密码，而是已经登录的会话。硬件密钥保护的是登录那一步，挡不住登录之后的会话。"]],["DMM Bitcoin：潜伏后篡改一笔交易",["然后，攻击者可能潜伏几周到几个月，等一笔大额交易。","2024 年，DMM Bitcoin 的钱包供应商，一名员工在 3 月运行了一个测试脚本。5 月，攻击者用偷来的会话篡改了一笔交易，盗走 4,502.9 枚 BTC，约 3.05 亿美元。"]],["签名人的电脑被攻破：Radiant Capital",["如果被攻破的，正好是签名人的电脑呢？","2024 年 9 月，攻击者冒充 Radiant Capital 的前承包商，在 Telegram 发来一个压缩包，里面是伪装成 PDF 的后门程序。","3 名开发者的设备被感染。恶意软件改写了多签前端的显示。"]],["模拟结果也是假的；用专用干净设备",["签名人用了硬件钱包，也做了交易模拟。可是电脑被控制了，屏幕上的模拟结果也是假的。10 月，多签所有权被转移，约 5,000 万美元。","防线是：签名用一台专用的干净设备，独立解码；这台设备不收文件、不装聊天软件。"]],["假会议与冒名受雇",["社工不只有招聘这一种入口。","假会议：冒充媒体邀请访谈，在通话里把自己的显示名改成 Zoom，再申请远程控制。弹窗写着 Zoom 请求控制，其实只是某个参会者。","冒名受雇：美国检方 2025 年起诉 4 名朝鲜人。他们用盗用的身份受雇，其中一人改了雇主两个合约的源码，把约 74 万美元转给自己。"]],["被收买的客服与活动规模",["被收买的客服：2025 年 5 月，攻击者用现金收买 Coinbase 的海外外包客服，导出约 7 万名用户的数据，再冒充 Coinbase 行骗。","看一组规模：多国机构告警的假面试活动，8 个月里至少感染 3 万台设备。3 万除以 8，平均每个月约 3,750 台，每天一百多台。"]],["6 月与 9 月：两次接触",["现在回到 Binance，把时间线拉长。","6 月，另一名工程师下载了被篡改的 Homebrew。Binance 发现并处置了这台设备，但攻击者已经了解了他的角色和同事。","9 月，就是开头的面试。作业仓库在安装时，把合法的 pyenv 组件换成了恶意版本，当时的终端防护没有发现。"]],["人连着权限：一台电脑走到签名服务",["10 月，攻击者横向控制了更多工程师的电脑，找到了部署令牌。","关键洞见在这里：攻击者先攻破人，因为人连着权限。一台电脑，一个会话，就能一路走到签名服务。而且一次处置完成，不代表威胁结束。"]],["分设备，定流程",["防御的思路是：让攻破一个人、一台电脑，不够用。","先分设备：签名专用设备只做签名和独立解码；办公电脑不放生产凭证；陌生项目只在隔离环境里运行。","再定流程：资金操作、合约发布、权限变更，至少两人独立确认；大额请求用预先登记的电话或当面确认，不用发起请求的同一个渠道。"]],["分权、短会话、当天回收权限",["发起、审批、执行、审计，分给不同的人。会话要短，异地登录要告警。","人离开时，当天回收全部权限，连 npm、域名注册商、官方社交账号、多签签名人身份这些边缘权限也不能漏。"]],["答案：人连着权限，也可以被接触到",["回到开头：攻击者为什么先攻破人？","因为人连着签名、部署和审批的权限，而且人可以被一份工作、一场会议、一笔钱接触到。","一个人在工作电脑上运行一个文件，这台电脑显示的一切就不再可信，合约审计也看不到这一步。"]],["成立条件：流程允许单人单机完成关键操作",["成立条件是：你的流程允许一个人、一台电脑单独完成关键操作。把
