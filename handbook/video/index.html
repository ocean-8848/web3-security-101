权签名请求，也要拒绝"],[313.87,318.33,"第二类防御：关键输入，要有多个独立来源"],[318.78,323.97,"KelpDAO 的验证者只有一组数据源。据 LayerZero 说"],[323.97,327.1,"恶意 RPC 只对验证者返回假数据"],[327.1,330.86,"还对其他节点发起 DDoS，逼它切换过去"],[331.31,336.96,"所以规则是：至少两个独立运营方的数据源。两边不一致"],[336.96,339.9,"就拒绝签名，而不是故障转移"],[340.35,342.75,"部署也一样。Binance 称"],[342.75,347.37,"攻击者在一名工程师的电脑上发现了容器部署令牌"],[347.37,348.84,"用它部署了容器"],[349.29,353.16,"防御是：令牌只放在 CI 里，按分钟过期"],[353.16,357.19,"生产部署要第二个人批准，看的是镜像摘要"],[357.19,360.17,"开发网络到签名网络，没有路由"],[361.87,366.67,"第三类防御，最容易漏掉：响应要覆盖链上状态"],[367.12,372.47,"Binance 的以太坊热钱包被设置了 EIP-7702 委托"],[372.47,376.67,"从此，这个地址执行的是委托合约的代码"],[377.12,381.65,"暂停提现、关闭热钱包服务，都没有让委托失效"],[381.65,384.76,"按公开时间，它从 20 点 20 分"],[384.76,386.89,"活到次日 0 点 10 分"],[387.34,391.96,"算一下：到午夜是 3 小时 40 分，再加 10 分钟"],[391.96,393.82,"一共 3 小时 50 分"],[394.27,399.22,"所以监控要盯链上：每个区块查一次自有地址的代码"],[399.22,403.2,"一旦以 0xef0100 开头，立刻告警、熔断"],[403.65,407.45,"撤销，是提交一个委托给零地址的新授权"],[407.45,411.29,"授权的 nonce 要等于账户当前的 nonce"],[411.29,416.42,"账户自己发送时要加一，比如交易用 41，授权就填 42"],[416.87,419.31,"查到代码为空，才算完成"],[419.31,422.91,"MPC 钱包没有一把能立刻撤销的私钥"],[422.91,427.79,"所以撤销路径要独立、预先批准，每季度演练一次"],[429.49,433.81,"回到开头的问题：钥匙还在，钱怎么没的？"],[434.26,439.31,"私钥保护回答的是：谁拿着钥匙。签名路径回答的是"],[439.31,443.93,"谁决定钥匙盖在什么文件上。攻击者控制了后者"],[444.38,449.78,"防御也就三句话：每一层重新检查，关键输入多个来源"],[449.78,451.13,"响应覆盖链上"],[451.58,454.84,"前提要说清楚：私钥保护仍然必要"],[454.84,459.84,"这套架构也挡不住所有内部人作恶，它把一个人作恶"],[459.84,461.58,"变成需要多人共谋"],[462.03,466.37,"而且这几起事件，多数还只有项目方的初步说法"],[466.37,467.82,"细节可能还会变"],[468.27,472.8,"下一集，离开公链，看企业级与许可链的安全"]],"ch":[]},"deck":{"src":"../decks/skeuomorphic/ch29/index.html","scenes":[["Bybit：私钥没有泄露",["2025年2月21日，Bybit 的以太坊冷钱包，被转走了大约15亿美元。","私钥，没有泄露。签名人按照流程，一个一个，按下了确认。","屏幕上显示的，是一笔普通的转账。"]],["多了一个参数",["而真正签下去的交易，多了一个参数：operation，等于 1。","就这一个数字，让钱包去执行了攻击者的代码，把自己的实现合约，换成了攻击者的。"]],["攻击者不再偷私钥",["钥匙，一直锁得好好的。攻击者控制的，是钥匙盖在什么文件上。","这一集，我们跟着一笔交易，走完它从提出、到上链的七道关。"]],["意图与构造",["先把这条路画出来。","假设一位用户，要从交易所提走 2 万 USDT。这是示例。","第一关，业务意图。用户点下提现，账本里多了一张提现单。","第二关，请求构造。钱包后台把这张单子，翻译成一笔待签名的交易。"]],["审批与显示",["第三关，风控与审批。规则检查金额和地址，大额还要有人批准。","第四关，显示与解码。审批的人看不懂原始字节，他看到的，是翻译出来的文字。"]],["签名、广播、上链",["第五关，签名。可能是 MPC 节点，可能是硬件加密机，也可能是多签的签名人。","第六关，广播。签好的交易，发到链上。","第七关，链上状态。余额变了。有时候，账户的代码和权限，也会跟着变。"]],["支线与箭头",["还有一条支线。有些系统要先读链上数据，再决定签不签。这些数据，来自 RPC 节点。","注意每一个箭头。下游都默认，上游已经检查过了。"]],["这条路叫签名路径",["从意图到链上，这整条链路，叫做签名路径。","私钥，只待在第五关。攻击者要的，只是让第五关，签出他想要的东西。"]],["第二关：Bitget",["2024 年以来的六起大额事件，我们一个一个，放到这条路上。","先看第二关。2026 年 9 月，Bitget 被转走约 3.9 亿美元。","项目方说，一款第三方安全产品的零日漏洞，泄露了内部凭证。","攻击者用定制工具，伪造了提现指令。","项目方说，私钥和冷钱包没有受影响。那款产品的名字，至今没有公开。"]],["第四关：WazirX",["再看第四关。2024 年 7 月，WazirX 损失约 2.3 亿美元。","WazirX 说，托管方 Liminal 界面上显示的，和实际签的不一样。","Liminal 说，自己没有被攻破。双方说法冲突，还没有最终的独立报告。"]],["第四关：Bybit 前端被改",["同样断在第四关的，是开头讲的 Bybit。","Safe 说，一名开发者的电脑先被攻破，攻击者劫持了他的 AWS 会话令牌，","改掉了托管在 S3 上的前端代码。","篡改的代码，只对 Bybit 的冷钱包生效。交易完成大约 2 分钟后，代码又被换了回来。","签名人看到的屏幕，来自同一个被篡改的前端。他们没有第二个地方可以核对。"]],["第五关：Drift",["第五关，签名人自己。2026 年 4 月，Solana 上的 Drift，损失约 2.85 亿美元。","第三方分析说，安全委员会五个人里两人签名就能生效，迁移后没有时间锁。","成员预先签了，自己没完全看懂的交易。","Solana 的持久 nonce，让这些签名不会自然过期。攻击者可以等，等到时机合适再提交。"]],["支线数据源：KelpDAO",["再看那条支线，数据源。同在 2026 年 4 月，KelpDAO 损失约 2.92 亿美元。","这座跨链桥只用了一个验证者。","LayerZero 说，攻击者替换了它依赖的两个 RPC 节点，再用 DDoS 打掉其他节点，逼它切换过去。","恶意节点只对这个验证者撒谎。验证者本身没被攻破，它诚实地，对假数据签了名。","责任怎么划分，双方有争议，已经进入诉讼。"]],["Binance：最大的一起",["最后一起，也是最大的一起。","2026 年 10 月 29 日，Binance 多条链的热钱包，被转走约 63.4 亿美元。这是项目方的口径。","按项目方的初步报告，攻击者先用一份假的面试作业，控制了一名工程师的电脑。","另一名工程师的电脑上，放着容器部署的令牌。","攻击者用它部署了自己的容器，接触到了内部签名服务。"]],["第五关：让签名服务代签",["这是第五关。攻击者没有偷钥匙，他让签名服务替他签。","签出来的，是 50 笔操纵 nonce、设置 EIP-7702 委托的交易。","以太坊热钱包的地址，从此会执行攻击者指定的代码。"]],["第七关：委托还在链上",["然后是第七关。Binance 暂停了提现，关掉了热钱包服务。","但委托是链上状态，不受这些开关控制。","按公开的时间，这个委托在链上存活了大约 3 小时 50 分钟。","告警时间、内部 AI 工具怎么被利用，报告里还没有说清。完整报告还在等。"]],["六个位置，一个结果",["六起事件，打在六个不同的位置。结果却一样：签名系统正常运行，签出了攻击者想要的东西。","把它们叠在一起，能看到三个共同点。"]],["三个共同点",["第一，校验放错了位置。下游只检查请求的格式，不检查请求背后，有没有真实的业务。","第二，关键输入只有一个来源。一块屏幕，一组 RPC，一个发布包，一条审批路径。","第三，响应只管链下。关掉服务，也无法改变已经写在链上的状态。"]],["谁决定盖在什么文件上",["回到开头那句话。私钥保护，回答的是谁拿着钥匙。","签名路径，回答的是谁决定，钥匙盖在什么文件上。"]],["三条防御",["所以防御也是三条。第一，每一层都重新检查，不继承上一层的结论。","第二，关键输入要有多个独立来源，对不上就拒签，不自动切换。","第三，响应要覆盖链上状态。暂停提现，不等于撤销权限。"]],["一套示例架构",["下面是一套示例架构。它综合了公开事件的教训，不是哪家交易所公布的方案。","账本，意图签发，策略引擎，审批，签名集群，广播，链上，再加一套独立监控。","开发电脑到签名集群，这条线是禁止的。网络上根本不该有这条路由。"]],["① 账本绑定签名",["我们挑四个重点。第一，账本绑定签名。","签名服务只为账本里存在、状态正确、金额一致的提现单签名。同一张单，只能签一次。","目标和金额，要从原始交易里解析出来，不读上游写的描述。伪造的提现指令，在这里对不上账。"]],["② 策略读原始字节",["第二，策略读的是原始待签字节，而且默认拒绝。没有明确规则的交易类型，一律不签。","比如 Safe 多签，operation 只允许等于 0。","要用 1，只能指向官方的批量调用合约，链上还有 Guard 合约再拦一次。","Bybit 那笔 operation 等于 1 的交易，在这里会被拒绝。","再比如热钱包，EIP-7702 授权一律拒签。策略如果覆盖了这一条，Binance 那批委托就签不出来。"]],["③ 分链熔断",["第三，分链熔断。某条链流出异常，就停这条链的广播。","发现账本里没有对应订单的流出，所有链一起停。熔断的开关，不能依赖已经被攻击的系统。"]],["④ 紧急撤销",["第四，紧急撤销。7702 委托，要用一笔新的授权，把委托地址设成零地址，才能清掉。","MPC 钱包没有一把单独的私钥能立刻做这件事。所以要有一条独立的撤销路径，预先批准，每季度演练，记下用时。","最后查一下账户代码，结果为空，才算完成。"]],["架构的局限",["也要说清局限。架构挡不住所有内部人作恶。它做的，是把一个人作恶，变成需要多人共谋。"]],["今天就能做（一）",["最后，按角色，每个人今天就能做一件事。","签名工程师，列出所有能到达签名节点的调用路径，找出没经过策略引擎的那一条。","多签签名人，换一台设备，独立重新计算下一笔交易的哈希，别和前端用同一个来源。"]],["今天就能做（二）",["运维，扫描开发电脑上的生产令牌，看看一台失陷的电脑，能部署到哪里。","安全工程师，在测试网发一笔 7702 授权请求，看策略拒没拒，告警响没响。","事故指挥官，主持一次撤销演练。暂停提现之后，你怎么确认链上授权已经清掉？"]],["钥匙还在，钱为什么没了",["回到开头的问题。钥匙还在，钱为什么没了？","因为攻击者控制的不是钥匙，是钥匙要盖的那份文件。"]],["每一关都重新检查",["守住签名路径，靠的不是哪一关特别强，而是每一关都重新检查。","六起事件，一条路径，每一关都要重新检查。"]]]},"d3b":{"src":"../decks/3b1b/ch29.html","scenes":[["Binance 热钱包被转走约 63.4 亿美元",["2026 年 10 月 29 日，Binance 多条链上的热钱包，被转走约 63.4 亿美元。这是项目方的口径。","Binance 说，没有发现私钥泄露的证据。"]],["钥匙还在，钱却没了",["攻击者进入了内部签名服务，让它代为签名。","钥匙还在，钱却没了。不偷私钥，攻击者是怎样拿到签名的？先把这个问题钉在这里。"]],["MPC 只保证没有人拿到完整私钥",["先看这个热钱包怎样签名。它用 MPC：私钥被拆成几个分片，分别放在不同的节点上。","签名时，每个节点用自己的分片计算，合起来得到一个有效签名。完整的私钥，从头到尾不出现。","所以 MPC 只保证一件事：没有人拿到完整私钥。","它不判断这笔交易该不该签。请求只要送得进来，又通过了校验，节点就会正常签名。"]],["比方：伪造的审批单，用印员照章盖印",["打个比方：公章锁在保险柜里。攻击者没有偷公章，而是伪造了一张审批单，放进用印员的待办箱。用印员按流程盖了章。","这个比方有一处不成立：伪造的合同，法院可以撤销；链上交易一旦确认，多数情况下撤不回来。"]],["签名路径：谁决定钥匙盖在什么文件上",["所以要换一个问题：不是谁拿着钥匙，而是谁决定钥匙盖在什么文件上。","这条决定的链路，叫签名路径。它从业务意图开始，比如一张提现单。","接着是请求构造、风控审批、显示和解码，然后才是签名、广播，最后变成链上状态。","签名这一步，还会读外部的数据源，比如 RPC 节点。","每一个箭头，都是一次信任传递：下游相信，上游已经检查过了。"]],["请求构造与显示：被打断的两段",["把近两年的大事件放上去，看它们各自打断了哪一段。","Bitget：攻击者伪造了提现指令，打在请求构造。","Bybit 和 WazirX：签名人看到的，和实际签下的不一样，打在显示。WazirX 双方的说法还有冲突。"]],["位置不同，结果一样",["Drift：签名人被诱导提前签好交易，持久 nonce 让这些签名不会过期。","KelpDAO：验证者依赖的 RPC 节点被换掉，它诚实地对假数据签了名。Binance：绕过流程直达签名服务，还在链上留下了委托。","位置各不相同，结果却一样：签名系统照常运行，签出了攻击者想要的东西。这张图把每起事件简化成一个断点，真实路径更长。"]],["六起事件的三个共同点",["六起事件，有三个共同点。","第一，校验放错了位置。下游只检查请求的格式，不检查它背后有没有真实的业务。","第二，关键输入只有一个来源：一块屏幕，一组 RPC，一个发布包，一条审批路径。","第三，响应只针对链下。关掉服务，改变不了已经上链的状态。","三个共同点，对应三类防御。下面是本手册给的一套示例架构，不是 Binance 公布的方案。"]],["账本绑定签名：解析原始字节",["第一类防御：每一层都重新检查，不继承上一层的结论。","看账本绑定签名。请求里写着：转给地址 A，10 个币。这是上游写的描述，策略不读它。","策略直接解析即将被签名的原始字节，取出真实的目标和金额，再去账本里找这张单子。","账本说：这张单已批准、还没签过，目标 A，金额 10。原始字节却是：目标 X，金额 500。不一致，拒签。"]],["一张单只能签一次，账本权限要分开",["一致了才签，签完把单号标成已签。同一张单，只能签一次。","前提是：攻击者不能同时写账本和请求。所以写账本的权限，要和调用签名的权限分开。"]],["策略默认拒绝，每类交易有规则",["可是签名服务能签的，远不止提现。","所以策略默认拒绝：没有明确规则的交易类型，一律不签。","普通转账，和账本绑定。EIP-7702 授权会把账户代码换成委托，热钱包一律拒签。","Safe 多签里 operation 等于 1，可以改写实现合约，只允许指向 MultiSendCallOnly。Solana 持久 nonce 让签名不会过期，热钱包拒绝。"]],["规则要覆盖每一条路",["规则如果只写在提现接口上，就只保护了一条路。攻击者换一条路走，规则就不存在。","7702 还有一个缺口：授权本身是一个单独的签名，别的地址可以替你提交。所以以 0x05 开头的授权签名请求，也要拒绝。"]],["关键输入要有多个独立来源",["第二类防御：关键输入，要有多个独立来源。","KelpDAO 的验证者只有一组数据源。据 LayerZero 说，恶意 RPC 只对验证者返回假数据，还对其他节点发起 DDoS，逼它切换过去。","所以规则是：至少两个独立运营方的数据源。两边不一致，就拒绝签名，而不是故障转移。"]],["部署路径也要多人把关",["部署也一样。Binance 称，攻击者在一名工程师的电脑上发现了容器部署令牌，用它部署了容器。","防御是：令牌只放在 CI 里，按分钟过期；生产部署要第二个人批准，看的是镜像摘要；开发网络到签名网络，没有路由。"]],["暂停提现，撤不掉链上委托",["第三类防御，最容易漏掉：响应要覆盖链上状态。","Binance 的以太坊热钱包被设置了 EIP-7702 委托。从此，这个地址执行的是委托合约的代码。","暂停提现、关闭热钱包服务，都没有让委托失效。按公开时间，它从 20 点 20 分，活到次日 0 点 10 分。","算一下：到午夜是 3 小时 40 分，再加 10 分钟，一共 3 小时 50 分。"]],["响应要覆盖链上：监控并撤销",["所以监控要盯链上：每个区块查一次自有地址的代码，一旦以 0xef0100 开头，立刻告警、熔断。","撤销，是提交一个委托给零地址的新授权。授权的 nonce 要等于账户当前的 nonce；账户自己发送时要加一，比如交易用 41，授权就填 42。","查到代码为空，才算完成。MPC 钱包没有一把能立刻撤销的私钥，所以撤销路径要独立、预先批准，每季度演练一次。"]],["答案：攻击者控制的是签名路径",["回到开头的问题：钥匙还在，钱怎么没的？","私钥保护回答的是：谁拿着钥匙。签名路径回答的是：谁决定钥匙盖在什么文件上。攻击者控制了后者。","防御也就三句话：每一层重新检查，关键输入多个来源，响应覆盖链上。"]],["成立条件：前提要说清楚",["前提要说清楚：私钥保护仍然必要。这套架构也挡不住所有内部人作恶，它把一个人作恶，变成需要多人共谋。","而且这几起事件，多数还只有项目方的初步说法，细节可能还会变。"]]]}}}]},{"name":"评估篇 · 交易所 / DeFi / 上币尽调","items":[{"id":"A01","title":"安全评估方法论：从接单到签字","md":"../assessment/A01-methodology.md","v":{"talk":{"src":"slides/A01-methodology.html","scenes":[["开场",["大家好，欢迎来到合约安全评估篇第1集。先问一个问题。一份审计报告写着没有严重问题，你敢签字上线吗？","看三个案例，以下据公开报道。2021年，Uranium Finance 改了一个常数，交换后的校验弱了100倍，损失约5000万美元。","2022年，Nomad 跨链桥在一次升级里把一个初始化值设错，损失约1.9亿美元。","2024年，Radiant 的合约本身没有新漏洞，是签名人的电脑被入侵，签下了恶意交易，损失约5000万美元。这三起事故，问题都不只在代码里。所以本集的主题是，评估不是找 bug，而是给一个上线决策签字。"]],["评估篇路线图",["先看评估篇的路线。一共10集。前两集讲通用的方法，就是怎么组织一次评估，怎么给发现定级。","中间三集，分别对应你要负责的三类对象。交易所自己的合约和钱包，DeFi 协议，还有上币和合作项目的尽调。","接着两集讲代码之外的部分，运营和密钥安全，以及怎样管理外部审计和漏洞赏金。","最后三集讲实战，怎样读懂一起事故，出事后怎样应急，还有一个实例分析。整个系列的立场是，评估主要自己做，外部审计作为补充。","本集的路线是这样的。先看七个阶段，再看三类对象的差别，然后讲最容易出错的定范围，接着是分工和工作量估算，最后是三种结论。"]],["像建筑验收一样评估",["打个比方，安全评估像建筑验收。验收员不会重新设计大楼。他先拿到图纸和施工记录，再确定这次验什么，比如结构、消防、电梯。","他也不会检查每一块砖。他知道哪些地方最容易出事，重点看那里。对应到评估，就是威胁建模。","发现的问题，他分成两类。必须整改才能入住的，和建议整改的。这就是风险评级。","最后他签字。可以交付，附条件交付，或者不能交付。这就是评估的门禁结论。","比喻不准的地方在于，大楼验收后很少改动。合约上线后会升级，会改参数，会接入新资产。所以评估必须有一条规则，任何改变风险的变更，都触发重新评估。"]],["七个阶段",["来看完整的流程，一共七个阶段。第一步是受理和定范围。申请方提出评估，我们写出范围说明书，双方书面确认。","第二步是资料收集，按资料清单要架构图、规格、权限清单和部署脚本。资料齐了，代码冻结，才进入下一步。","第三步是威胁建模。列出资产、入口、信任边界和关键不变量。第四步是审查与测试，这是工作量最大的一步。","第五步，给每条发现定级，写成报告。第六步，项目方修复，我们复核。严重和高危必须全部关闭，或者有业务负责人签字接受风险。","第七步，给出门禁结论，同时提出上线后的监控需求。","注意两条回头的虚线。审查中发现范围外的高风险，比如依赖的外部协议有问题，要回到第一步调整范围，而不是悄悄扩大工作量，或者视而不见。","另一条是上线之后。升级、参数变更、接入新资产，都会触发新一轮评估。所以第七步不是终点。"]],["阶段的输入、输出与退出条件",["把每个阶段的产出列成表。第一阶段产出范围说明书，退出条件是申请方书面确认。口头说好不算数。","第二阶段的退出条件有两个。必需资料齐全，而且代码冻结。代码还在改，评估的就不是上线的版本。","第三阶段的退出条件是组内评审通过。威胁模型画错了，后面的审查就会查错地方。","第四阶段的退出条件很具体。威胁模型里每一个高风险项，都要有明确结论，有问题，或者没问题，并写明理由。","第五和第六阶段，每条发现都要有定级、证据和修复建议。严重和高危，要么修复，要么有人签字接受。","最后是门禁签字。下面我们看，同样是这七步，三类对象做起来差别有多大。"]],["三类评估对象",["你要负责三类对象。先看核心问题。A 类是交易所自己的合约和钱包，问题是我们的资产会不会丢。B 类是 DeFi 协议，问题是会不会被掏空，接入后会不会被连累。C 类是上币和合作项目，问题是风险能不能接受。","三者最大的区别是控制力。自己的合约完全可控，有问题就改。上币项目完全不可控，你没有权力让对方改代码。","控制力决定深度。A 类最深，要看代码、运营、密钥和流程。B 类看代码、经济模型和外部依赖。C 类看权限、链上数据，再加一份运营安全问卷。","时长也差很多。示例里，A 类两到六周，B 类一到四周，C 类只有一到五个工作日。","交付物也不同。A 类是完整报告，加门禁，加监控规则。C 类是一张评分卡，一个结论，和一组上线条件。"]],["尽调的结论是风险可否接受",["C 类尽调有个常见误区。有人想在五天内审完对方全部代码，还要求对方改完再上线，最后在结论里写代码安全。这三件事都做不到。","正确的目标是，把有限的时间花在能直接造成用户损失的权限和机制上。比如谁能增发，谁能暂停，谁能升级，谁能拉黑名单，锁仓是不是真的。结论写的是风险能不能接受。","如果对方只给了合约地址，没有源码呢？仍然有事可做。可以查部署者的历史，权限地址是个人钱包还是多签，持仓是否集中，代币能不能卖出。但结论里必须写明，未经源码审查。"]],["范围说明书的八项",["七个阶段里，最容易出错的是第一步，定范围。范围说明书要写清八项。第一项是评估对象。注意，要写提交哈希，不能只写分支名。分支上的代码随时会变。第二项是部署到哪条链、哪个网络。","第三项，包含和排除哪些文件。第四项，外部依赖里，哪些视为可信，比如成熟的标准库，哪些需要评估。","第五项，链下组件在不在范围内，比如签名服务、后端、前端和密钥管理。开场讲的 Radiant，问题就出在签名环节。第六项，已知问题和以前的审计报告。","第七项，交付物和截止时间。第八项，结论用于什么，是内部上线决策，还是对外公告，或者监管报备。用途不同，措辞和证据要求就不同。"]],["范围不清的早期信号",["范围不清有五个早期信号。第一，申请方只给分支名，代码还在改。应对是冻结一个提交哈希，之后的改动单独做差异评估。","第二，对方说只看合约，不看部署脚本。可是初始化参数和权限移交，恰恰是部署脚本做的。Nomad 的问题就出在初始化值上。所以部署脚本默认纳入范围。","第三，对方说外部协议很成熟，不用看。成熟不等于和你的集成方式没问题。至少要评估集成点，比如价格、回调、暂停和升级。","第四，没有规格文档。那就无法判断一个行为是 bug 还是设计。应对是先让对方写出关键不变量，否则不开工。","第五，上线日期已经对外公布。时间压力会让人降低标准。应对是把门禁条件提前写进范围说明书，谁也不能临时放宽。"]],["案例：改了一个常数",["来看一个真实案例，以下据公开复盘，数字为示例。Uranium 是一个分叉自 Uniswap V2 的交易所。V2 每次交换后要检查一个不变量，两种代币余额的乘积不能变小。","Uranium 想把手续费精度从千分之一改成万分之一，于是把调整余额时乘的数，从1000改成了10000。","但是校验那一行，右边仍然乘以1000的平方。左边放大了10000的平方，右边只放大了1000的平方，差了100倍。","算一下。假设池子里两种代币各100个，乘积是10000。正确的校验要求交换后乘积仍然不小于10000。","错误的校验只要求乘积不小于100。这意味着两边余额可以同时降到10个左右，池子里九成的资金都能被取走。","这次改动只有一个常数。教训是，任何改动，哪怕一行，都要走差异评估，而且要回到不变量去验证。"]],["审查与测试的分工",["第四阶段的工作，以两个人的评估组为例，可以分成六项。第一项是架构与权限审查。逐个核对每个函数的修饰器和角色授予，产出一张特权清单。每个特权角色，写出它最坏能造成什么破坏。","第二项是手工代码审查。按威胁模型，一个入口一个入口地走读，两个人交叉审。","第三项是静态分析。工具会报很多条，每一条都要给出结论，是真问题还是误报，不能直接贴进报告。","第四项是测试补强。为关键不变量写模糊测试，让工具用大量随机输入去寻找违反条件的情况。","第五项是部署与配置核查。对照部署脚本，读取链上实际状态，看参数、权限和实现地址对不对得上。","第六项是链差异核查。同一份代码部署到 BNB Chain、TRON 或 Mantle，行为可能不同。按目标链的清单逐项检查。"]],["工作量估算",["评估要多长时间？业界常用有效代码行来粗估。有效代码行，就是去掉注释和空行之后的源码行数。再按复杂度给一个速度。示例里，低复杂度每人每天四百到六百行，中等两百到四百行，高复杂度一百到两百行。","来算一个示例。一个质押奖励合约，有效代码3600行，属于中等复杂度，按每人每天300行算。","3600除以300，是12个人天。评估组有两个人，就是6天。","再加三成用于写报告和复核。6天乘以1.3，约等于7.8天，取8个工作日。","如果上线日期只留了5天怎么办？不要压缩审查。在第一阶段就缩小范围，或者推迟上线。压缩审查等于降低标准，而且没有人知道降低了多少。"]],["三种结论与自评盲区",["最后是结论。只有三种。第一种是通过，没有未关闭的严重和高危，中危有修复计划。","第二种是附条件通过。可以上线，但必须满足列明的条件。比如限额上线，只开放白名单资产，30天内完成某项修复，或者部署指定的监控。","第三种是不通过。存在未关闭的严重或高危，又没有可以接受的缓解措施。","不管哪种结论，都要写明三件事。依据的是哪个版本，哪些范围没有覆盖，还剩哪些风险。没写未覆盖范围，那里出了事，就会被认为是评估失职。","还有一点。自己做评估，最大的风险是熟悉带来的盲区。所以评估人员不评自己写的代码，组内交叉审查，关键模块再请外部审计复核。"]],["小结与预告",["小结三点。第一，评估的交付物是一个签了字的结论，找 bug 只是手段。","第二，七个阶段各有退出条件。范围里写死提交哈希，任何改动，哪怕一个常数，都走差异评估。","第三，三类对象的控制力不同，深度和交付物也不同。无论哪种结论，都要写明版本、未覆盖的范围和剩余风险。","下一集讲风险评级与报告。怎样用影响和可能性给发现定级，怎样对照外部的严重度口径，以及风险接受由谁签字。下集见。"]]]}}},{"id":"A02","title":"风险评级与报告：把发现变成决策依据","md":"../assessment/A02-risk-rating-reporting.md","v":{"talk":{"src":"slides/A02-risk-rating-reporting.html","scenes":[["开场",["大家好，欢迎来到评估篇第2集，风险评级与报告。先看一个真实工作中常见的场景。","有一条发现。攻击者需要控制5把多签私钥里的3把，才能无限增发代币。","评估人甲说，这是低危。拿到三把私钥，几乎不可能。","评估人乙说，这是严重。增发等于把所有持有人的价值清零。两个人都有道理，问题出在哪？出在他们各自只看了一个维度。本集就讲怎样用两个维度定级，怎样写报告，以及不修的风险由谁签字。"]],["定级像医院分诊",["打个比方，定级像医院分诊。分诊护士不治病，她只决定谁先进抢救室。定级也一样，它不修漏洞，只决定修复的顺序和上线的门槛。","分诊看两件事。病情多重，这是影响。恶化多快、多容易触发，这是可能性。","大出血的病人，即使暂时稳定，也要优先。轻微擦伤，即使正在流血，也排在后面。","比喻不准的地方在于，病情是客观的。漏洞的影响，却依赖你假设攻击者有什么能力，有多少钱，能不能抢跑。所以定级时必须把假设写清楚，否则同一个发现，在不同人手里会评出不同等级。"]],["维度一：影响",["先看第一个维度，影响。影响回答的问题是，如果被成功利用，最坏会怎样。严重级包括，直接盗取用户或协议的资金，资金被永久冻结，协议资不抵债，未授权增发，以及治理被夺取。","高级包括，盗取用户还没领取的收益，临时冻结资金，或者部分用户受损。","中级通常是功能不可用，偷 gas，或者在特定条件下造成有限损失。低级是不造成资金损失的异常，比如偏离规格，但没有价值损失。"]],["维度二：可能性",["第二个维度是可能性，就是被利用的门槛。高可能性是指，任何人，用一笔交易，不需要特殊前提就能触发。比如一个公开函数缺少权限检查。","中等可能性需要一些条件，比如一定的资本，特定的市场条件，抢跑，或者多个步骤。","低可能性需要特权角色，或者极端条件，或者已经被其他机制部分缓解了。比如开场那个例子，需要多签私钥。","这里有个容易低估的地方。闪电贷让攻击者在一笔交易内借到巨额资金，用完马上还。所以需要大量资本这个门槛，往往比看起来低得多。"]],["评级矩阵与两个例子",["把两个维度交叉，就得到这张矩阵。横轴是影响，纵轴是可能性。右上角，影响严重、可能性高，是严重级。左下角，影响低、可能性低，只是信息项。","来定第一个例子。一个已经部署的空投合约，任何人调用领取函数，都能领走不属于自己的份额。奖池里有100万美元。","影响是什么？直接盗取资金，最多100万美元，属于严重。可能性呢？任何人，一笔交易，没有前提，属于高。矩阵给出严重级，立即处理。","第二个例子，就是开场那条。增发的影响是严重。需要5把里的3把私钥，可能性按表应该是低。矩阵给出中危。","但矩阵只是起点。假如我们发现，这5把私钥里有3把，由同一个团队保管在同一类电脑上，那么拿到三把并不比拿到一把难多少。","这时可能性要上调一档到中，等级就变成高危。所以开场的甲和乙都不全对。定级要结合运营安全的实际情况，并且在报告里写清这个判断依据。"]],["定级的四个常见错误",["定级有四种常见错误。第一种，按修复难度定级。有人说，这个改一行就好，算低危吧。不对。等级只看后果和门槛，不看修起来难不难。一行就能修的严重漏洞，仍然是严重。","第二种，因为已知而降级。以前的审计说过，项目方也知道。可是已知不等于已经缓解。只要还能被利用，等级就不变，最多走风险接受流程。","第三种，假设攻击者很穷。比如说，要操纵这个价格，需要一亿美元资金，所以可能性低。但闪电贷可以在一笔交易里借到这些钱，门槛几乎为零。","第四种，只看链上。合约没问题，就认为整体安全。可是签名界面和前端同样有严重级。下面我们就看外部口径怎么分。"]],["对照外部口径：智能合约",["内部定级最好和外部口径对齐。业界常用的参照，是漏洞赏金平台 Immunefi 的严重度分级，公开资料目前是2点3版。它按资产类型分别给出示例。先看智能合约。","严重级包括直接盗取用户资金，永久冻结资金，协议资不抵债，未授权增发，以及治理投票被操纵。高级包括盗取或永久冻结还没领取的收益，以及临时冻结资金。中级和低级，主要是不造成直接价值损失的问题。","为什么要对齐？因为你上线后会运行漏洞赏金计划。内部定级和赏金计划用同一把尺子，白帽提交报告时，双方才不会为等级争论。"]],["对照外部口径：网站与应用",["同一套分级里，网站与应用是独立的一类。严重级里有一条特别值得注意，替换交易参数或者合约地址。还有读取服务器上的私钥，以及代替用户执行改状态的操作。","为什么强调这一类？因为近年交易所和协议最大的损失，很多来自这里。比如前端被注入恶意脚本，签名界面被篡改。如果评估范围只覆盖合约，不覆盖链下，就等于只验收了大楼的主体结构，没验收门锁。这部分在第6集详细讲。"]],["一条发现的八个字段",["定好级，要写成报告。每条发现有八个字段。第一是标题，一句话说清问题。第二是等级，同时标出影响和可能性各是多少。","第三是位置，文件、行号、函数，还有提交哈希。第四是描述，解释为什么现有代码会出错。","第五是影响，用具体数字或场景，并写明攻击者能力假设。第六是证据。严重和高危，要附一个能运行的证明，比如一条回归测试，或者链上读数。否则容易被开发者一句理论上不可能驳回。","第七是修复建议，要具体到代码层面。第八是状态，待修复、已修复、部分修复，或者风险接受，并附上复核记录。"]],["三条原则与反例",["写报告有三条原则。第一是可复现。存在重入风险，这句话等于没说。正例是，指出哪个函数，先转账后清零，外部合约可以在回调里再次进入，后果是取走全部 ETH，并附一条回归测试。","第二是可决策。影响要写给不懂技术的决策者看。k 值检查失效，管理层看不懂。换成池子约九成储备可以被取走，示例里100万美元的池子，损失约90万美元，决策者马上就明白了。","第三是可执行。建议加强权限控制，开发者不知道改哪里。正例是，指出哪个函数缺少权限修饰器，后果是什么，再直接给出应该加的那一行。"]],["风险接受",["有些发现不修也能上线，但必须走正式流程，不能口头略过。第一个问题是，能在上线前修复吗？能，就修复，复核，关闭。","修不了，就问第二个问题，剩余风险可以接受吗？不可接受，阻断上线。","可以接受，就进入风险接受。注意三件事。第一，签字的是业务负责人，也就是有权承担后果的人，不是评估人员。","第二，要记录缓解措施，比如限额、监控或保险。第三，要写复查日期，到期重新评估，并纳入监控。","为什么评估人员不能自己签？评估人员的职责是把风险说清楚，并给出建议。接不接受，是业务决策。两者分开，责任才清楚。如果同一个人既评估又接受，就没有任何制衡。"]],["报告的两个版本",["最后是报告的结构。一份报告有两类读者，所以分两个版本。摘要版放在最前面，一页以内，给管理层和业务看。它只回答一个问题，能不能上，有什么条件。","技术版给开发和审计看，包括全部发现、代码位置、证据、修复建议，以及复核记录。","两个版本都要诚实，特别是诚实写出本次没覆盖的范围，和已经接受的风险。一份把问题藏起来的报告，比没有报告更危险，因为它给了决策者虚假的安全感。"]],["工具：评级计算器",["手册里配了一个评级计算器。选择影响，再选择可能性，矩阵上会标出对应的格子。","它还有两个调整开关。特权角色的运营安全薄弱，可能性上调一档。已经有有效的独立缓解，比如限额和时间锁，下调一档。正好对应刚才第二个例子。","最后可以导出一条发现条目，直接粘进报告。","注意，计算器给的是建议值。最终定级由评估人结合上下文判断，并在报告里写明理由。"]],["练一练",["来练一练，可以先暂停视频，自己定级。第一题。一个借贷协议，用一个浅池子的现货价格给抵押品估值。这个池子的深度大约50万美元。","第二题。合约的管理员可以把手续费设到百分之百。管理员是5选3的多签，改费率要经过48小时时间锁。","第三题。合约修改关键参数时不发出事件，所以监控系统无法发现参数被改了。","来看参考答案。第一题，闪电贷可以轻松推动50万美元深度的池子，抵押品价值被虚高，可以超额借出。影响严重，可能性高，是严重级。第二题，影响是高，但多签加时间锁让可能性低，定中危，并写清楚依赖多签和时间锁这个假设。第三题本身是低危，但要写进上线的监控需求里。"]],["小结与预告",["小结三点。第一，定级等于影响乘以可能性。矩阵是起点，要结合运营安全的实际情况调整，并且写清假设。","第二，好的发现可复现、可决策、可执行。口径对齐外部分级，而且别忘了，链下也有严重级。","第三，不修的风险由业务负责人签字，并且带上缓解措施和复查日期。","下一集，我们进入第一类评估对象，交易所自己的合约和钱包。会讲攻击面，讲比多签阈值更重要的签名流程，再把 Bybit、WazirX 和 Radiant 三起事故映射到评估项上。下集见。"]]]}}},{"id":"A03","title":"交易所自有合约与钱包评估","md":"../assessment/A03-exchange-contracts-wallets.md","v":{"talk":{"src":"slides/A03-exchange-contracts-wallets.html","scenes":[["开场",["大家好，欢迎来到评估篇第3集。这一集讲第一类评估对象，交易所自己的合约和钱包。先记住一句话。交易所的链上资产，绝大部分时间安全地躺在冷钱包里。损失却发生在签一笔交易的那几秒。","看三起事故，以下据公开报道。2025年2月，Bybit 冷钱包被盗，约14.6亿美元。签名人看到的界面被篡改了。","2024年7月，印度交易所 WazirX 被盗约2.3亿美元。签名人看到的内容，和实际签的数据不一致。","2024年10月，借贷协议 Radiant 被盗约5000万美元。签名人的电脑被植入木马。三起事故，合约本身都没有新漏洞。所以本集的重心不是合约代码，而是签名流程。"]],["像银行运钞",["打个比方，交易所的金库像银行的运钞流程。金库的锁很难撬开，对应多签的阈值。","但劫匪不撬锁。他们伪造一张调拨单，让押运员按正常流程把钱运出来。对应到链上，就是签名界面被篡改。","或者，他们在押运员的电脑里装了木马。押运员以为在签 A，实际签了 B。这就是终端被入侵。","比喻不准的地方在于，银行的运钞单可以打电话复核，出了事还有机会追回。链上交易一旦达到签名阈值并广播，就没有撤回。"]],["攻击面全景",["先画出攻击面。链上有五块。热钱包负责日常提币。冷钱包或者多签，负责大额存储。还有充值地址和归集合约，提币和批量转账合约，以及交易所对外部协议的授权。","链下有四块。签名服务，可能是多签、MPC 或者硬件安全模块。签名界面，比如多签的网页前端。签名人的电脑。还有部署和升级的流水线。","看箭头。签名人在电脑上，通过签名界面，驱动签名服务，最终让冷钱包动起来。冷钱包的升级和换签名人，也要经过部署流水线。","红色的四块全在链下。开场那三起事故，加上另一起 DMM，合计损失超过20亿美元，根因都在这里。所以评估的重点，是谁能让冷钱包动，怎么让它动。"]],["合约层：钱包与多签",["合约层先看钱包和多签合约，有五个检查点。第一，用的是经过审计的标准实现，比如 Safe，还是自研的。自研必须单独深审。","第二，实现能不能被替换。谁能升级，有没有时间锁。Bybit 就是这样，一笔 delegatecall 交易把钱包的实现换掉了。","第三，所有权转移。是不是两步式，能不能被一笔交易直接夺走。Radiant 的签名人，就是盲签了一笔所有权转移。","第四，扩展点。Safe 的 module 可以绕过签名阈值直接执行交易，等于一把额外的钥匙。guard 也会改变签名逻辑。要列出所有已启用的扩展点，逐个评估。","第五，签名验证是否正确处理了合约签名、零地址，以及签名可塑性。这些在第8章讲过。"]],["合约层：充值、归集、提币",["再看充值。充值入账有一条铁律，幂等。同一笔转账，只能记一次账。来看一个示例。","一笔批量转账交易里，有两条转账日志。第3条给用户转500 USDT，第7条转300 USDT。如果只按交易哈希去重，第7条会被当成重复，漏记了300。","正确的键是交易哈希加日志序号。两条都入账，同一条日志重放时被忽略。","反过来，如果用自增序号之类不稳定的键，链重组后同一事件被重新推送，就会重复入账500。","还有两点。识别资产要用代币合约地址，不能用符号，因为任何人都能部署一个叫 USDT 的代币。还要校验交易执行结果。TRON 上就出现过执行失败的交易被当成充值的假充值。确认数要按链设置，考虑重组。"]],["合约层：对外部协议的授权",["交易所做市、理财或质押时，会给外部协议授权，让对方能从我们的地址划走代币。这里的风险是授权额度。","来算一个示例。做市地址里有5000万 USDT，给一个外部协议设置了无限授权。某天这个协议被攻破，攻击者能划走的上限，就是这个地址的全部余额，5000万。","改成按需授权。每次只授权本次操作需要的数额，比如100万，用完撤销。同样的事故，敞口降到100万以内。","还要看一点。持有授权的内部合约，是否允许调用任意目标和任意数据？如果允许，攻击者可以借它的手，调用代币的转账函数，把授权给它的钱转走。这在第6章讲过。"]],["签名流程评估清单",["评估一个多签托管方案，要看整条签名链路。第一个环节是签名人独立性。N 个签名人，是不是不同的人、不同的组织、不同的地点和设备？实际上有几方在控制？","第二是终端安全，签名用的电脑是不是专机专用，能不能收文件、装软件、上网。第三是交易的构造和展示，签名人看到的，和实际签的，是不是一回事。","第四是独立解码。签名人是否用一个不同于构造方的工具，自己解码交易数据并逐字段核对。如果硬件钱包无法解析交易内容，签名人就是在盲签。","第五，升级、换签名人、delegatecall 这些高危操作，有没有额外的审批。第六是带外确认，大额交易是否通过电话或线下，二次核对交易哈希。","第七是时间锁和限额，作为最后的兜底。下面先用一个数字例子，看看签名人独立性为什么排第一。"]],["案例：九选五，实际一方",["来看 Ronin 跨链桥，以下据公开报道。2022年3月，Ronin 桥被盗约6.2亿美元。它的验证人是9选5，需要5个签名才能放行提款。看起来，攻击者要攻破5个独立的验证人。","但这9把钥匙里，有4把由同一家公司运营。攻破这家公司的系统，就同时拿到了4把。","还差1把。此前为了分担负载，一个合作的组织曾授权这家公司代为签名，这个授权后来没有撤销。于是第5个签名也能从同一家公司的系统里拿到。","算一下。名义上要攻破5方，实际上只要攻破1方。阈值是5，独立方的数量是1。评估多签时，要问的不是有几把钥匙，而是实际有几个独立的控制方。"]],["签名流程的理想形态",["签名流程的理想形态是这样的。发起人提出转账请求，构造系统生成交易数据和一份人类可读的摘要，发给签名人。","关键在接下来几步。签名人不看构造系统给的摘要，而是用一个独立的工具，自己解码交易数据。目标地址、金额、调用的函数，以及是不是 delegatecall。","如果是高危操作，再通过带外渠道，比如电话，和发起人核对交易哈希。","最后在硬件钱包上，逐字段核对，再签名。每个签名人独立重复这些步骤，达到阈值后广播。","这条流程防的是构造系统或界面被攻破。如果所有签名人都只看同一个摘要，那么不管阈值多高，整个多签都退化成一个单点。"]],["独立解码：看哪些字段",["独立解码具体看什么？以 Safe 多签的交易为例。先看三个基本字段。to 是目标地址，value 是转出多少原生币，data 是调用哪个函数、带什么参数。","最关键的是 operation 这个字段。0 是普通调用，代码在目标合约里执行。1 是委托调用，也就是 delegatecall。目标合约的代码会在钱包自己的存储里执行，可以改写实现地址、签名人和阈值。日常转账几乎用不到委托调用，看到1，立刻停下。","还要看 nonce，确认这是第几笔交易，防止有人插队，或者让你签一笔预先准备好的交易。","据公开报道，Bybit 那笔交易，界面上显示的是一笔正常的转账。实际的 operation 是1，钱包的实现被替换成攻击者的合约，随后资金被转走。"]],["三起事故映射到评估项",["把三起事故映射到评估项上。Bybit 的根因是签名界面被篡改，导致一笔 delegatecall 替换了钱包实现。对应的评估项，是交易展示、独立解码、高危操作审批，以及钱包的升级机制。","WazirX 的根因是界面和签名数据不一致，多签被升级。对应交易展示、独立解码和带外确认。Radiant 的根因是终端被入侵，签名人盲签了所有权转移。对应终端安全、独立解码，以及所有权转移是否两步式。","三起的共同点是，合约本身没有新漏洞，失守的是人签了什么。所以评估一个托管方案，建议把大约六成的精力放在签名流程上。"]],["兜底：时间锁与限额",["流程再严，也挡不住签名人集体被钓鱼，或者被胁迫。所以还要有兜底，就是时间锁和限额。来看一个示例。","没有限额时，冷钱包里有3亿美元。一旦签名被骗，一笔交易就能全部转走。","加上限额。示例里，冷钱包每24小时最多转出2000万，超过的部分进入48小时时间锁。同样被骗，第一天最多损失2000万。","时间锁里的大额转出，会触发告警。只要在48小时内发现并取消，剩下的2亿8000万都保得住。限额的意义，不是防住攻击，而是把最坏结果从全部，变成一个能承受的数字。"]],["评估交付物",["最后是交付物。交易所自有资产的评估，比普通审计多两项。第一项是标准的合约审计报告，覆盖钱包、多签、充值归集和提币合约，按第2集的方法定级。","第二项是签名流程评估。按刚才的七个环节逐项打分，标出所有单点。","第三项是监控和应急需求，包括大额转出、权限变更和冷钱包异动的告警，移交给应急响应，在第9集讲。","还要记住一点。据公开报道，这类攻击多由有国家背景的团队长期策划。防御不能假设对方是机会主义者。要假设对方会花几个月渗透，会伪造完整的招聘流程，会同时攻破多个签名人的电脑。"]],["小结与预告",["小结三点。第一，交易所资产评估的重心是签名流程，不是多签阈值。","第二，评估多签时，问实际有几个独立的控制方。签名人要独立解码，看到 operation 等于1，立刻停下。","第三，合约层做到入账幂等、按需授权，再用限额和时间锁兜底。","下一集讲第二类对象，DeFi 协议。先是一张通用清单，再分八类协议逐个讲，最后区分自研协议和接入第三方，两种评估目标。下集见。"]]]}}},{"id":"A04","title":"DeFi 协议评估：按协议类型下手","md":"../assessment/A04-defi-protocol-review.md","v":{"talk":{"src":"slides/A04-defi-protocol-review.html","scenes":[["开场",["大家好，欢迎来到评估篇第4集。这一集讲第二类对象，DeFi 协议。DeFi 协议的评估分两层。第一层，代码会不会被攻破。第二层，规则会不会被套利。","看三个例子，以下据公开报道。2023年，借贷协议 Euler 损失约1.97亿美元。根因是一个函数在减少抵押品后，漏了健康检查。","2022年，稳定币协议 Beanstalk 损失约1.8亿美元。攻击者用闪电贷借来大量代币，换成投票权，在同一笔交易里通过并执行了恶意提案。每一步都符合规则。","2023年，KyberSwap 损失约4800万美元，根因是集中流动性计算里一处舍入的偏差。第一类问题有清单可查。第二类问题，要把整个协议和它依赖的市场一起建模。"]],["像检查一座水坝",["打个比方，评估 DeFi 协议像检查一座水坝。首先看坝体有没有裂缝，对应代码漏洞，比如重入、权限和溢出。","然后看设计。上游水位暴涨时，泄洪能力够不够。上游另一座坝垮了，会不会连锁。这对应经济安全和外部依赖。","坝体完好、设计也对，还要看谁能开闸，开闸要几个人同意。这是权限和治理。","比喻不准的地方在于，水坝的上游是固定的。DeFi 协议的上游，比如预言机、被依赖的协议和抵押资产，都会变。评估要假设它们将来会恶化。"]],["通用清单：九类问题",["先看通用清单，所有协议都查，一共九类，每类对应手册里的一章。前三类是重入、权限和算术。比如外部调用之前，状态更新了没有。每个修改状态的函数，谁能调用。舍入方向是不是对协议有利。","中间三类是外部调用、预言机、MEV 和签名。返回值有没有检查，能不能处理非标准代币。价格能不能在一笔交易内被推动。交换有没有设置最小成交量和截止时间。","后三类是升级、经济和链差异。存储布局对不对，有没有时间锁。偿付能力的不变量成不成立。部署到目标链后，行为和以太坊是否一样。这张清单是底线。在它之上，每类协议还有自己的高发点。"]],["借贷协议",["先看借贷协议。前两项，抵押品估值用什么价格，低流动性的资产有没有供应上限。极端行情下，清算是不是仍然有利可图，坏账由谁承担。","第三项最关键。所有减少抵押品、或者增加债务的路径，最后都要检查健康因子。注意是所有路径，不是主要路径。用数字看一下。","示例账户存了100个单位的抵押品，抵押率是80%，借了75。健康因子等于100乘以0.8，再除以75，约等于1.07，大于1，安全。","现在有一个新函数，比如把抵押品捐给储备金，它减少了30个抵押品，却没有检查健康因子。抵押品剩70，乘以0.8是56，除以75，健康因子只有0.75，账户已经资不抵债，坏账留给了协议。据公开复盘，Euler 的问题就出在这样一个新增的函数上。","第四项，协议是不是分叉自 Compound 或 Aave 这类项目，改了哪些地方。改动的地方，往往就是新漏洞的地方。"]],["DEX 与 AMM",["再看 DEX 和 AMM，也就是自动做市商。第一项，每次交换后，恒定乘积或者对应的不变量是否成立。第1集讲的 Uranium，就是这个校验弱了100倍。","第二项，集中流动性的价格区间边界，以及手续费再投资的计算，舍入方向对不对。据公开复盘，KyberSwap 的问题就出在边界处一个很小的舍入偏差，被反复放大。","第三项，交换回调。池子在交换中会回调调用方，让它付款。回调函数必须确认，调用它的就是按工厂地址计算出来的真实池子。据公开报道，Sushi 的一个路由合约没有这样做，攻击者伪造了一个池子来回调，划走了用户授权给路由的代币。","第四项，不能把池子储备直接当价格用，储备一笔交易就能推动。还要看收税代币、变基代币会不会破坏池子的记账。"]],["金库：首存者通胀",["金库协议有一个经典问题，首存者通胀。份额等于存入的资产，乘以总份额，再除以总资产，结果向下取整。来看一个示例。","第一个存款人只存了1个最小单位，拿到1份。然后他不通过存款，而是直接向金库转入10000 USDC。总资产变成约10000，总份额还是1。","第二个用户存入19999 USDC。他的份额等于19999乘以1，再除以约10000，约等于1.9999，向下取整，只拿到1份。","现在金库有约30000 USDC，2份。每份价值约15000。第二个用户存了19999，只值15000，约5000被第一个人拿走。","评估要查三件事。有没有虚拟份额或者首存锁定。总资产是不是直接读余额，能被捐赠操纵。策略合约能不能被替换。手册里的金库实验可以拖动数字，亲手看到这个过程。"]],["稳定币、质押与跨链桥",["接下来三类放在一起看。稳定币，看锚定机制，极端脱锚时的清算和赎回路径，抵押品价格的熔断上下限，以及谁能铸造。特别注意，抵押品如果和稳定币本身相关，价格下跌会互相强化，形成死亡螺旋。","质押和再质押，看凭证会不会脱锚，赎回有没有延迟队列，延迟期内谁能暂停。质押、再质押、再拿去抵押，层层叠加时，一层出事会传导到每一层。还要看罚没的损失怎样传导给凭证持有人。","跨链桥，看消息格式是否包含源链、源合约、目标和序号，并逐项校验。验证方式是多签还是证明，多签是否独立。未证明的消息，绝不能被当作已证明。最后还要有限额和两侧供应量的对账。"]],["永续与账户抽象",["永续合约和衍生品，看标记价格和资金费率能不能被操纵，指数价格的来源是否抗操纵，保险基金耗尽时，自动减仓机制是否合理。部署在二层网络上，还要问，排序器宕机时，价格停更，清算怎么办。","账户抽象是近两年的新领域。ERC-4337 要看代付手续费的合约能不能被耗尽，用户操作的签名验证是否正确。EIP-7702 让普通地址也能带上代码。所以，旧代码里用交易发起人等于调用者，或者代码长度为零来判断对方是人的写法，已经不再可靠。"]],["经济安全评估",["代码清单查不出经济攻击，要单独做。第一，写出协议级的不变量，比如总负债不超过总资产，并用不变量测试去验证。第二，把外部市场纳入模型。假设某个预言机、某个被依赖的协议、某个抵押资产出现极端情况，协议会怎样。","第三，闪电贷视角。攻击者在一笔交易内可以借到几乎无限的本金，只要在交易结束前还上。所以任何按当前余额或当前价格计算的量，都是攻击者可以控制的输入。","第四，治理视角。来看 Beanstalk，以下据公开复盘。攻击者用闪电贷借入巨额资金，换成治理代币，一下拿到了多数投票权。","它在同一笔交易里，投票通过并执行了一个恶意提案，把协议资金转走，然后归还闪电贷。投票权能被临时借来，提案又能当场执行，两个设计叠加，就成了漏洞。修复是投票权按历史快照计算，提案执行前要有延迟。","第五，参数边界。抵押率、费率、清算折扣和供应上限，在边界值和极端值下是否仍然安全。经济评估要问的不是这一步对不对，而是把这些步骤按攻击者喜欢的顺序和规模组合起来，会怎样。"]],["外部依赖表",["协议依赖的东西出了问题，协议会跟着出问题。所以要列一张依赖表。第一类是预言机，失效表现为价格错误或者停更。评估时效检查、上下限、备用数据源，以及二层网络的排序器状态。","第二类是被集成的协议，对方可能被攻破或暂停。评估每一个集成点，回调、价格、暂停和升级。第三类是代币本身，它可能被暂停、拉黑、升级或者脱锚。","第四类是库和编译器。2023年，Vyper 编译器某些版本的重入锁失效，导致多个池子被攻击。所以版本要锁定，并持续关注已知问题。第五类是基础设施，节点、索引服务和自动执行任务的服务，都要有降级路径。"]],["自研协议 vs 接入第三方",["最后，DeFi 评估有两种目标。评估自研协议，我们能改代码，所以要全量评估，代码、经济和依赖都看，上线前把问题修掉，交付完整报告和门禁。","评估接入第三方协议，比如把交易所的理财资金放进一个外部收益协议，情况完全不同。我们不能改它的代码，继承了它的全部风险，却没有修复能力。评估重点是集成点和对方的信任假设，关键问题是，对方被攻破、暂停或者跑路时，我们的资金和用户受什么影响，怎么退出。","所以接入评估的结论，一定带着限额和退出预案。举个示例，单个协议的敞口不超过2000万美元，同时不超过对方锁仓总额的5%。对方暂停，或者锁仓总额单日下降30%，就触发退出。不要依赖它看起来很大、很成熟。"]],["练一练",["来练一练。一个借贷协议新增了一键循环杠杆功能。用户存入抵押品，借出资产，自动换成抵押品再存进去，重复多次，全部在一笔交易里完成。你会重点检查什么？","参考三个方向。第一，健康检查，循环中途有没有不检查的状态，最后一次检查能不能覆盖全部变化。第二，价格，自动兑换用的价格和抵押估值用的价格，能不能被同一笔交易推动。第三，清算，高杠杆仓位集中起来，极端行情下清算能不能及时，是否仍然有利可图。为什么循环杠杆是高风险功能？因为它把借贷、兑换和价格三个高发点，压进了同一笔交易。"]],["小结与预告",["小结三点。第一，通用清单是底线，分类型清单抓住每一类协议的命门。","第二，经济安全要单独评估，用闪电贷视角、治理视角，再检查参数边界。","第三，接入第三方协议，等于继承它的全部风险却无法修复，所以结论一定带着限额和退出预案。","下一集讲第三类对象，上币和合作项目的尽调。八条红线，任一命中就一票否决。四个维度的评分。以及时间只有几天时，先查什么。下集见。"]]]}}},{"id":"A05","title":"上币与合作项目尽调","md":"../assessment/A05-listing-due-diligence.md","v":{"talk":{"src":"slides/A05-listing-due-diligence.html","scenes":[["开场",["大家好，欢迎来到评估篇第5集，上币与合作项目尽调。设想一个场景。业务方转来一个上币申请，给你五个工作日，要一个结论，能不能上。","你面对两个限制。审不完，对方代码可能几万行，时间只有几天。改不了，你没有权力让项目方修改代码。","还有一点和审计完全不同。你要假设，项目方本人就可能是攻击者。所以尽调的任务不是证明代码安全，而是用有限的时间判断，上了这个币，用户和交易所会不会遭受不可接受的损失。"]],["像租客背景调查",["打个比方，尽调像房东查租客。房东不会把租客的人生查个底朝天，他没那个时间，也没那个权力。他只查几件决定性的事。能不能按时付租，对应经济模型。有没有前科，对应链上的劣迹。","这房子他会不会转手就卖了，对应代币能不能增发、所有权能不能转移。钥匙还在谁手里，对应权限和锁仓。","任何一条踩红线，直接拒绝，不需要查完其余。","比喻不准的地方在于，租客一般不会主动伤害你。上币尽调却要假设，项目方可能就是攻击者本人。"]],["四个维度，红线优先",["尽调有四个维度。第一是合约权限，谁能动代币和资金。第二是链上数据，部署时间、持仓、流动性和历史。","第三是团队与运营，身份、安全实践和审计。第四是经济模型，代币分配、释放和用途。四个维度的证据来源不同。权限和经济看代码和文档，链上数据看区块浏览器，团队运营靠问卷和公开信息。","注意顺序。红线检查在打分之前。任何一个维度踩了红线，直接否决，不进入评分。","没有红线，才用评分卡打分，得出风险结论。还有一点，尽调结论有时效。代币可以升级、可以增发时，今天的结论明天可能失效，这本身就是一个高风险项。"]],["八条红线（上）",["来看八条红线，任一命中就否决或暂缓。第一条，代币可以无限增发，而且没有时间锁。项目方可以随时稀释，等于随时跑路。读一下增发函数的权限，看 owner 和 minter 是谁。","第二条，貔貅盘，就是能买不能卖。怎么查？在分叉环境里模拟一次买入，再模拟卖出。同时检查转账税、黑名单和暂停开关。","第三条，owner 可以暂停或冻结任意地址的转账。这包括交易所的热钱包。用户充进来的币，可能某天就提不出去了。","第四条，隐藏的所有权转移或者升级后门。检查代理合约、delegatecall、未初始化的合约和自毁函数。合约的行为可以被悄悄改变，就是红线。"]],["八条红线（下）",["第五条，代理合约可以升级，而且升级权是一个单签的个人地址，没有延迟。这把私钥一旦被盗，或者项目方作恶，就能全盘失控。","第六条，锁仓或流动性锁是假的。要核验锁仓合约的地址、金额和解锁时间，以及流动性代币是不是真的被锁住。","第七条，合约地址和官网、审计报告里的不一致，这是常见的调包手法。第八条，链上部署的字节码和已验证的源码不一致，部署的根本不是审计的那份代码。","注意，红线检查要在对方给出的部署地址上做，不能在 GitHub 仓库上做。用户交互的是部署在链上的合约，不是仓库里的代码。"]],["案例：能买不能卖",["来看一个真实案例，以下据公开报道。2021年秋天，一个借热门剧集名字的代币 SQUID 上线。几天内，价格从不到1美分，涨到2800多美元。","价格为什么能一直涨？因为合约限制了卖出，普通持有人只能买，不能卖。没有卖盘，价格自然只涨不跌。","11月1日，开发者把流动性池里的资金全部取走，价格在几分钟内跌到接近零。据报道，开发者卷走约338万美元。","这正是第二条红线。用一次模拟就能发现。在分叉环境里买入一小笔，再尝试卖出。卖出失败，或者卖出税高得离谱，尽调到此结束，结论是否决。"]],["四维评分与权重",["红线全部通过，再用评分卡打分。示例权重是这样的。合约权限占30%，看增发、暂停、升级权限由谁持有，是个人地址、多签、时间锁，还是已经放弃。","链上数据占25%，看部署时长、持仓集中度、流动性深度和锁定，以及历史异常交易。","团队与运营占25%，看身份公开程度、私钥和多签实践、审计情况和漏洞赏金。经济模型占20%，看代币分配、解锁曲线，以及收益来源是否可持续。","注意，权重是示例。交易所应该按自己的风险偏好和上币层级来设定，然后固定下来。评分卡的价值在于一致性，不同项目用同一把尺子，而不在于绝对数值。"]],["打分锚点",["打分不能凭感觉，每个分数都要对应一个具体情形，这叫锚点。以合约权限里的升级权限为例。4分，合约不可升级，或者升级权已经放弃。","3分，多签加上48小时以上的时间锁。2分，多签但没有时间锁，或者时间锁较短。","1分，单签多方，或者时间锁少于24小时。0分，单签的个人地址，可以没有延迟地升级。这其实已经命中第五条红线了。","有了锚点，两个不同的评估人给同一个项目打分，结果会基本一致。这就是评分卡要的一致性。"]],["算一个综合分",["算一个示例。合约权限有两项，升级权2分，增发和暂停权3分，合计5分，满分8分，得分率62.5%，乘以权重30，得18.75分。","链上数据三项，部署时长1分，持仓集中度2分，流动性2分，合计5分，满分12分，得分率约41.7%，乘以25，约10.4分。","团队运营三项，合计6分，得分率50%，加权12.5分。经济模型两项，合计5分，得分率62.5%，加权12.5分。","四项加起来，约54.2分。示例规则是75分以上可以上线，55到75附条件，55以下暂缓。54分，结论是暂缓，列出需要补充的材料和整改项。","再强调一次。如果这个项目命中任何一条红线，哪怕综合分是90分，结论也是否决。红线优先于分数。"]],["链上数据怎么查",["尽调中最省时间、也最难造假的证据，来自链上。第一，部署信息。看创建交易、创建者和时间。刚部署几天的项目，风险高。第二，源码验证状态，再比对一下字节码。","第三，持仓集中度，看前10和前50个地址的占比。高度集中，意味着砸盘风险。第四，流动性，看池子深度，以及流动性代币在谁手里，有没有锁。浅池子很容易被操纵价格。","第五，权限地址。读出 owner、admin 和 minter，看它们是个人地址还是多签。第六，历史行为，看关联地址的历史，有没有跑路史，有没有和已知黑客地址交互过。","第七，锁仓的真实性，核验锁仓合约、金额和解锁时间。另外，对方提供的审计报告也要独立核验。审计方可不可信，审的是不是这个版本，报告里有哪些已确认但没修的风险。"]],["团队运营问卷",["团队与运营这一维，主要靠问卷。问五类问题。私钥和多签怎么管理，签名人有几个，是否独立，用不用硬件钱包。部署和升级的流水线，谁能改，持续集成的密钥怎么管。","前端托管、域名解析和依赖库怎么保护。团队对假招聘、假承包商这类社会工程，有没有防范。","还有应急能力，有没有暂停开关，有没有预案。","问卷答案很难完全核实。但答不上来，或者没有任何措施，本身就是风险信号。还要注意，合作越深，比如共同部署、共享金库、提供流动性，对方运营上的薄弱，就越会传导给交易所。"]],["尽调交付物",["尽调的交付物短小、可执行。第一是一页结论，上、附条件上、暂缓或者否决，加一句话理由。第二是评分卡，四维得分和红线检查结果。","第三是上线条件，只在附条件时需要。举个示例，先进观察区，设单用户单日充值上限，监控 owner 和实现地址的变更，要求项目方30天内补交审计报告。","第四是证据附录，包括链上地址、权限读数、持仓截图和问卷答案。证据要带时间，因为链上状态会变。"]],["练一练",["来练一练。一个项目综合评分88分。经济模型漂亮，团队公开，有两家审计，持仓也分散。唯独代理合约的升级权，在一个单签的个人地址上，没有时间锁。结论是什么？","结论是否决，或者暂缓到对方整改。因为第五条红线命中了。为什么一条红线能推翻88分？因为其余的分数，全都建立在合约不会被改这个前提上。而这个前提，由一把私钥决定。升级一次，审计、经济模型、持仓分布，全部可以作废。"]],["小结与预告",["小结三点。第一，尽调的结论是风险能不能接受，不是代码是否安全。","第二，红线优先于分数，所有检查都在部署地址上做。","第三，评分卡靠锚点保证一致性。附条件上线，就写清限额和监控。手册里的上币评分卡工具，可以直接用来练习。","下一集讲代码之外的战场，运营与密钥安全。四类链下根因，三种密钥方案各自没解决什么，再把六起事故映射到评估项上。下集见。"]]]}}},{"id":"A06","title":"运营与密钥安全：代码之外的战场","md":"../assessment/A06-operational-key-security.md","v":{"talk":{"src":"slides/A06-operational-key-security.html","scenes":[["开场",["大家好，欢迎来到评估篇第6集，运营与密钥安全。合约审计覆盖的是，代码会不会出错。但近年最大的损失，几乎都不在代码里。","以下据公开报道。2025年，Bybit 损失约14.6亿美元，签名流程被攻破。","2024年，日本交易所 DMM Bitcoin 损失约3.05亿美元。入口是一次假招聘，员工的电脑被控制了。","2021年，DeFi 协议 BadgerDAO 损失约1.2亿美元，前端网页被注入了恶意脚本。评估不覆盖链下，等于只锁了保险柜，没锁保险柜所在的房间。"]],["保险柜与整栋楼",["打个比方。合约是保险柜，用最好的钢材做的，也审计过了。运营安全是保险柜所在的整栋楼。保安被收买，对应私钥和签名出问题。门禁系统被改，对应前端被注入。","送货通道被人掉包，对应依赖库和供应链被投毒。保洁被冒充，对应社会工程。这些情况发生时，保险柜再硬也没用。","比喻不准的地方在于，楼里出了事，还有保险公司理赔，有警察追回。链上资产一旦被转走，多数情况下追不回来。"]],["四类链下根因",["链下根因可以分四类。第一类是私钥与签名，包括多签签名流程被攻破，以及签名终端和基础设施被入侵。","第二类是前端与供应链。前端被注入恶意脚本，依赖库被投毒，还有域名被劫持。","第三类是部署与运维，部署和升级的流水线被污染，持续集成的密钥泄露。第四类是社会工程，假招聘、假承包商、钓鱼邮件。","四类常常组合出现。社会工程是入口，导致私钥、终端或者流水线被攻破。公开报道多指向有国家背景的长期团队。所以评估要按对方会渗透几个月来设防。"]],["四种密钥方案",["先看私钥与签名。常见的密钥方案有四种。单签的个人地址只有一把私钥，简单，但是单点，绝不能用于金库。","多签合约是链上的 M 选 N，成熟透明。要评估签名流程、module 这样的扩展点，以及合约能否被升级。","MPC 是多方计算，私钥被拆成分片，多方协同签名，完整私钥从不出现。链上看起来是一个普通的单签地址。要评估分片放在哪里，实现方是否可信，以及审批流程。","HSM 是硬件安全模块，私钥在硬件内保管并签名，不出硬件。要评估的是，谁能让它签名，访问控制和物理安全怎样。"]],["MPC 与 HSM 没解决什么",["MPC 和 HSM 解决的是，私钥不以完整形态落地。它们没有解决两个问题，谁来授权签名，签的到底是什么。","来看一个示例。一个 MPC 方案，3个分片，任意2片就能签名。分片 A 和 B 放在两台服务器上，分片 C 在一名员工的手机里。看起来，攻击者要攻破两个地方。","但 A 和 B 两台服务器，都听同一个审批服务的指令。审批服务说签，它们就签。","攻击者只要攻破这个审批服务，就同时驱动了 A 和 B，满足了2片的门槛。名义上是3选2，实际上是一个单点。","Bybit、WazirX、Radiant 的问题，都不是私钥被直接偷走，而是合法的签名人被骗着授权了恶意交易。所以上一集的签名流程评估，对任何密钥方案都适用。"]],["私钥与签名评估清单",["私钥与签名的评估清单有六个问题。签名人是否独立，实际有几方在控制。签名终端是不是专机专用，能不能收文件、装软件、上网。","签名人看到的和签的是否一致，有没有用独立工具核对。升级、换签名人、委托调用这些高危操作，有没有额外审批和带外确认。","大额转出有没有时间锁，单位时间的提币有没有上限和告警。最后一项常被忽略，密钥和权限的轮换与撤销。员工离职或换岗后，权限有没有及时撤销。后面会看到，一个没撤销的账号，就足以引发一次供应链攻击。"]],["前端与供应链评估",["合约再安全，用户也是通过前端交互的。前端被攻破，用户就会直接把授权给攻击者。评估清单的前两项，前端托管，谁能修改线上代码，CDN 和托管平台的访问控制怎样。依赖锁定，npm 库有没有锁定到具体版本，是不是从第三方 CDN 动态加载最新版。","第三项，子资源完整性。页面引用外部脚本时，写上这个脚本内容的哈希值。浏览器下载后先算哈希。","如果有人在 CDN 上把脚本换掉了，哪怕只改了一个字符，哈希就对不上，浏览器拒绝执行。这样，托管方被入侵，也注入不了恶意代码。","第四项，域名和监控。域名注册商账户要有强保护，DNS 记录的变更要审批。还要监控异常授权，比如大量用户突然授权给同一个陌生地址。"]],["案例：两种供应链攻击",["来看两种供应链攻击，以下据公开报道。先看 BadgerDAO，2021年12月。攻击者获取了前端托管服务账户的 API 密钥。","他们用这个密钥向前端注入了恶意脚本。用户打开网站，正常操作时，会被诱导给攻击者的地址一个无限授权。","大约500个钱包中招，损失约1.2亿美元。对应的评估项，是前端托管的访问控制，钱包授权时的清晰展示，以及授权激增的告警。","再看 Ledger Connect Kit，2023年12月。这是一个很多 DeFi 网站都在用的钱包连接库。一名前员工的 npm 账户被钓鱼。问题是，他离职后，这个账户的发布权限并没有撤销。","攻击者用它发布了1.1.5到1.1.7三个恶意版本。凡是动态加载最新版的网站，都把盗币脚本带给了自己的用户。","直接损失约60万美元，不算大，但波及面极广。对应的评估项，依赖锁定版本，离职权限撤销，以及子资源完整性校验。"]],["部署与运维",["第三类根因是部署与运维。第一，部署要用经过评审的脚本，部署和初始化要在同一笔交易里完成，不给别人抢先初始化的机会。","第二，部署后验证。在浏览器上验证源码，逐项读取关键参数核对，确认权限已经移交给多签。","第三，持续集成的密钥。部署私钥和 API 密钥绝不能进代码库，要用密钥管理服务，并且给最小权限。","第四，升级要经过时间锁，公开，部署后跑验证脚本，并保留回滚方案。第五，任何链上变更都要有审批、有记录、可以追溯。"]],["社会工程",["第四类根因是社会工程。技术防御再强，人仍是最软的一环。先看 DMM Bitcoin，以下据公开报道。攻击者冒充招聘者，在职业社交平台上接触了 DMM 的钱包服务商的一名员工。","对方被诱导运行了一段所谓入职测试的代码。他的电脑因此被控制，攻击者进而操纵了交易请求，损失约3.05亿美元。","再看 Radiant。攻击者冒充一名前承包商，在即时通讯软件里发来一份看似正常的报告文件。文件里带着木马，开发者的电脑中招。","这份文件还被转发给了同事，扩散到多个签名人。注意这个细节。攻击者不需要逐个攻破签名人，只要让他们彼此信任地转发一份文件。"]],["社会工程评估与权重",["社会工程的评估要点有四个。团队，尤其是开发和签名人员，有没有反社会工程的培训。有没有硬性规定，签名和部署用的电脑上，不打开任何外部文件、链接，不运行外部代码。","招聘、承包和合作流程，有没有身份核验。高危操作是否要求多人和带外确认。目标是，单个人被攻破，不足以造成损失。","运营安全在三类对象里的权重不同。交易所自有合约和钱包最高，签名流程和密钥管理是第一重点。自研协议要看部署、升级权限、前端和监控。上币尽调通过问卷了解，深度合作时要提高权重。很多项超出了合约评估的传统边界，但报告要明确列出需要安全团队跟进的项，而不是写一句不在范围内就略过。"]],["练一练",["来练一练。你的前端从第三方 CDN 加载一个钱包连接库。请列出至少三个降低供应链风险的措施。可以先暂停想一想。","参考答案。第一，锁定版本，不加载最新版，把库随自己的构建一起发布。第二，加上子资源完整性校验，脚本被篡改就不执行。","第三，自托管，把库放进自己的域名和构建流程，减少对第三方的依赖。第四，前端完整性监控，加上授权激增的告警。Ledger 那次事件里，恶意代码正是通过动态加载最新版传播的。前三条做到任何一条，都能挡住这类攻击的大部分路径。"]],["小结与预告",["小结三点。第一，最大的损失在链下，四类根因是私钥签名、前端供应链、部署运维和社会工程。","第二，MPC 和 HSM 让私钥不落地，但没有解决谁来授权、签的是什么。签名流程评估对任何方案都适用。","第三，锁定依赖、子资源完整性校验、离职即撤权。目标是让一个人被攻破，不足以造成损失。","下一集讲外部审计与漏洞赏金。五种外部检查方式怎么选，读审计报告的六个步骤，以及怎样设计一个赏金计划。下集见。"]]]}}},{"id":"A07","title":"外部审计与漏洞赏金管理","md":"../assessment/A07-external-audit-bounty.md","v":{"talk":{"src":"slides/A07-external-audit-bounty.html","scenes":[["开场",["大家好，欢迎来到评估篇第7集，外部审计与漏洞赏金。先看一个画面。项目方发来一份审计报告，封面写着，未发现严重问题。这一页，能当作上线依据吗？","答案是，还不能。你至少要问，审的是哪个提交，上线的是不是同一个，哪些文件没审，报告里的已确认风险写了什么。本集讲怎样选审计、界定范围、读报告，以及怎样设计漏洞赏金。整个立场是，外部审计是自评的补充，不是替代。"]],["像请第二位医生会诊",["打个比方，外部审计像请第二位医生会诊。你是主治医生，最了解病人，也对结果负责。","请会诊，是因为第二双眼睛能发现你的盲区，而不是因为你不想看了。","会诊医生只看你给的检查结果，和约定时间内的情况。他看不到的，责任还在你。","比喻不准的地方在于，医生有行医资质的门槛。审计公司水平参差不齐，范围和深度差异很大，报告质量要你自己判断。"]],["五种外部检查",["外部检查有五种方式。单家审计适合常规上线，一个固定团队在固定时间里深度审查，局限是覆盖面受这个团队的经验限制。多家审计适合核心协议和大额资金，不同团队侧重不同，代价是成本高。","审计竞赛是大量审计者并行审查，按发现付费，覆盖面广。但深度不均，你还要花时间消化大量提交。形式化验证用数学证明覆盖所有输入，适合核心数学、清算和桥的验证逻辑。","注意形式化验证的局限，它只证明你写下的性质。性质写漏了，证明再严谨也没用。最后是漏洞赏金，上线后持续运行，用真实攻击者的视角补充一次性审计，但它是被动的。"]],["一个核心协议的典型组合",["一个核心协议的典型组合是这样的。第一步永远是自评，按前几集的方法，示例里两到三周。","然后是外部审计，一家或者两家，示例里各两到三周。两家可以并行，也可以串行，串行的好处是第二家能看到第一家修复后的代码。","对核心数学模块，比如清算和份额计算，再加上形式化验证。","修复之后要复审。上线后，漏洞赏金长期运行。注意，自评一定在审计之前。不要让审计方从零开始，花一半时间去理解你本该写清楚的东西。"]],["界定审计范围",["你交给审计方的材料，决定了审计的质量。六项要写清。提交哈希，不是分支名，审计期间代码冻结。范围内和范围外的文件，以及哪些外部依赖视为可信。","规格文档和关键不变量，让审计方知道代码应该是什么样。你的威胁模型和自评发现，也一并给出。不要让审计方从零开始，也不要隐瞒已知问题，否则你花钱请人重复你的工作。","链下组件，比如前端、签名和部署，默认应该在范围内。部署脚本和初始化参数也必须在范围内，Nomad 那类问题就出在这里。"]],["审计之后的改动",["审计结束到上线之间，代码常常还会改。来看一个示例。审计的是提交 a1b2，准备上线的是提交 e9f0。","两个提交之间有三处改动。一处改了常数，一处调整了函数顺序，还新增了一个管理函数。项目方说，都是小改动。","这时审计报告的结论，对 e9f0 已经不完全适用了。正确的做法是差异审计，只审这三处改动，以及它们影响的路径。工作量不大，但不能省。","第1集讲的 Uranium，就是改了一个常数。任何在审计之后、上线之前的改动，哪怕只有一行，都要走差异审计。上线前，再比对一次链上字节码和审计版本。"]],["读一份审计报告",["拿到一份报告，按六个步骤读。第一步，范围与版本。审的是哪个提交，和上线的是不是同一个，哪些文件没审。","第二步，方法与工时。人工审查加了哪些工具，投入多少人天。用第1集的速度估一下，工时太短的报告，覆盖必然有限。","第三步，每条发现的等级、是否已修复、有没有复审记录。","第四步，已确认风险。这是最容易被忽略、却最重要的部分，下一页单独讲。","第五步，假设与免责。报告假设了什么，比如假设预言机可信，假设 owner 不作恶。这些假设，就是你的剩余风险。第六步，范围外提示。报告里写着未审计的部分，就是你的盲区。"]],["已确认风险",["已确认风险，是审计方指出了、项目方选择不修的问题。看三个示例。第一，owner 可以随时暂停所有转账，项目方回复设计如此。你要判断的是，owner 是谁，交易所的热钱包会不会被冻结。","第二，价格来自单一现货池，项目方回复后续版本改进。你要判断，上线时这个池子有多深，闪电贷能不能推动它。","第三，升级没有时间锁，项目方回复由多签控制。你要判断，这个多签有几方是独立的，签名流程怎样。","为什么这部分比已修复的发现更需要你亲自判断？因为审计方的职责到指出为止。接不接受这个风险，是你的决定，要按第2集的风险接受流程独立判断。"]],["报告的红旗",["审计报告有五个红旗。第一，审计版本和上线版本不同，结论可能不适用。第二，整份报告只有一句无严重问题，缺少过程，你无法判断它覆盖了什么。","第三，工时极短而范围极大，比如两个人审三天，范围是两万行代码，基本是走过场。第四，所有发现都写着已修复，但没有复审记录，修复本身可能引入新问题。","第五，不列假设，不列范围外。剩余风险完全不明。做上币尽调时要特别注意，通过审计是一个常被滥用的营销说法。要核验报告本身，而不是听信已审计三个字。"]],["漏洞赏金计划的要素",["漏洞赏金是上线后的持续防线。一个赏金计划有七个要素。第一是范围，哪些合约、前端和基础设施在范围内，链上地址要写明确。第二是严重度分级，和内部定级用同一个口径。","第三是奖金分级，严重级通常按可能损失的一定比例计算，再设一个上限。第四是排除项，比如已知问题、测试网，以及需要不现实前提的攻击。","第五是提交和响应流程。白帽发现严重漏洞时，每一小时都可能有攻击者在找同一个洞，所以响应时限要写死。第六是安全港，给善意研究者法律豁免，鼓励他们上报而不是利用。第七是付款前的合规检查。"]],["奖金怎么定",["严重漏洞的奖金应该设多高？来算一个示例。协议锁仓1亿美元，一个严重漏洞最多能盗走其中2000万。","示例规则是，严重级奖金为可能损失的10%，上限200万美元。2000万的10%是200万，正好在上限内。","和攻击者比一比。攻击者利用这个漏洞，名义收益2000万。但他要洗钱，要承担被追踪、被冻结和法律的风险，实际能落袋的远少于此。白帽上报，拿到200万，合法、安全。","奖金太低，比如只给5万，有能力的研究者不会花时间看你的协议，发现了也可能被诱惑。奖金太高，预算失控，还会吸引大量低质量提交。原则是，让上报明显比利用更划算。","最后提醒，漏洞赏金不能替代审计和自评。它是被动的，依赖运气和奖金的吸引力，是最后一道网，不是第一道防线。"]],["内外协作的职责边界",["最后把内外协作串起来。内部评估是主责，负责界定范围、冻结版本，再交给外部审计或竞赛，做独立检查。","报告回来，由你批判性地阅读，判断剩余风险，然后做门禁结论。外部审计是输入，不是决策。","上线之后，漏洞赏金持续运行。新的发现回流到内部评估，触发修复，必要时重新评估。","这条链有一个前提，内部有能力读懂和判断审计报告。能力不足时，外包安全就变成了外包责任的错觉。这正是整个评估篇想帮你避免的。"]],["练一练",["来练一练。你收到一份审计报告，结论是未发现严重问题。在把它作为上线依据之前，你要核对哪五件事？可以先暂停想一想。","参考答案。第一，版本，审计的提交、上线的提交和链上字节码三者一致。第二，范围，哪些文件没审，链下组件和部署脚本在不在范围内。","第三，工时，投入的人天和代码量是否匹配。第四，已确认风险，逐条独立判断，必要时走风险接受流程。","第五，假设。报告里的每一条假设，都是你的剩余风险，要写进门禁结论。做到这五件事，那一页封面才真正有意义。"]],["小结与预告",["小结三点。第一，外部审计是补充。范围里写死提交哈希，审计之后的任何改动走差异审计。","第二，读报告重点看已确认风险、假设和范围外，并且独立判断。","第三，漏洞赏金要让上报明显比利用更划算。它是最后一道网。","下一集讲事故分析与防御性验证。怎样用五个步骤读懂一笔攻击交易，怎样把事故翻译成不变量，以及怎样证明一个修复真的有效。下集见。"]]]}}},{"id":"A08","title":"事故分析与防御性验证","md":"../assessment/A08-reproduce-attacks.md","v":{"talk":{"src":"slides/A08-reproduce-attacks.html","scenes":[["开场",["大家好，欢迎来到评估篇第8集，事故分析与防御性验证。先说结论。评估人员不需要会发起攻击，需要会读懂攻击，以及证明防御。","读懂一起事故，等于免费上了一堂课。它最终要变成你评估清单上的一个新检查项。","证明一个修复有效，等于给上线门禁加了一条硬证据。","先说清本集的边界。我们只分析已经公开的事故，只验证防御。不在任何未授权的合约和主网上做尝试。评估工作需要的是证明问题存在并且修好了，通常不需要一个可运行的攻击程序。"]],["像消防员复盘火灾",["打个比方，这像消防员复盘火灾。他们不会为了学习去放火，而是到现场看起火点、蔓延路径，哪道防火门没关。","复盘之后做两件事。把起火点写进检查表，以后专门查同类隐患。再做演练，验证新措施有效。","比喻不准的地方在于，火灾现场会被破坏，链上现场却永久公开，可以逐笔回放。所以复盘比消防更精确，也更容易事后诸葛亮。你要问的不是当时为什么没想到，而是事前有什么信号。"]],["读一笔攻击交易：五步法",["拿到一个攻击交易的哈希，按五步读。第一步，定位。交易在哪个区块，发起人是谁，受害的是哪个合约。","第二步，看资金流。谁付出了，谁收到了，多少。发起地址的资金来源，常常是混币器或者刚创建的新地址。前两步只需要区块浏览器。","第三步，看调用树。哪个函数被调用，顺序和深度是什么。这一步需要交易追踪工具，或者浏览器自带的内部交易视图。看调用树，比看反编译代码快得多。","第四步是核心，找出不该发生的那一步。用一句话写出，协议原本假设了什么，这个假设在哪里不成立。","第五步，翻译成检查项。我的评估，怎样能提前发现它。没有这一步，复盘只是看热闹。"]],["示例：读一棵调用树",["来看一棵简化的调用树，结构来自一起公开复盘过的借贷事故。最外层是攻击合约的入口，它先借了一笔闪电贷。","接下来是一串对借贷协议的正常调用。存入、借出，每一步单独看都合法，余额和事件也都符合预期。","然后出现了这一步，调用捐赠函数，把一部分抵押品捐给储备金。注意它后面没有任何健康因子的检查。账户从这里开始资不抵债。","这就是不该发生的一步。写成一句话，协议假设所有减少抵押品的路径都会检查健康，而这个新函数打破了它。之后的清算和归还闪电贷，只是把这个缺口兑现成利润。"]],["一张复盘表",["每起事故用同一张表记录。表头固定，才能把不同事故横向比较。以刚才那起为例。事故是 Euler Finance，2023年3月，损失约1.97亿美元。漏洞类别是缺少健康检查。","被打破的假设，任何减少抵押品的路径最后都检查健康因子。事前信号，这是一个新增的函数。","对应的检查项，是第4集借贷清单的第三项。对应的不变量，任何操作之后，账户健康因子不小于1。","事前信号这一栏最难填，也最有价值。很多事故的信号其实早就公开了，比如未审计的新代码，单签权限，过短的时间锁，被忽视的审计发现。修复一栏反而最简单。"]],["从事故到不变量",["不变量，是任何操作序列之后都必须成立的条件。几乎每一起事故，都能翻译成一条被打破的不变量。重入，打破的是外部调用返回时，账本余额和实际余额一致。金库通胀，打破的是每份价值不会因一笔捐赠而大幅跳变。","借贷坏账，健康因子不低于清算线。预言机操纵，同一区块内价格偏离参考价不超过某个阈值。","跨链桥伪造，目标链铸造的总量，不超过源链锁定的总量。这条特别好，它和代码怎么写无关，只和账能不能对上有关。","权限类，只有授权的角色能修改权限和升级实现。AMM，每次交换后恒定乘积不减。第1集的 Uranium，正是这一条。"]],["写不变量的三条规则",["写不变量有三条规则。第一，先用业务语言写一句话，再翻译成代码断言。如果你写不出这一句话，说明你还没理解这个协议。","第二，不变量要覆盖所有入口函数，而不是只覆盖你担心的那一个。Euler 的问题，恰恰出在另一个函数上。","第三，好的不变量不依赖实现细节。它描述的是什么必须永远为真，而不是这一行代码应该怎么写。这样，代码重构了，不变量依然有效。"]],["让模糊测试器去找序列",["写好不变量之后，交给模糊测试器。它会随机地组合调用各个入口函数，随机的参数，随机的顺序。","每一次调用之后，它都检查一遍你写的不变量。成千上万条序列跑下去，大部分都是绿的。","某一条序列里，不变量突然不成立了。工具会把这条序列保存下来，并且自动缩短，找出最短的那几步。这几步，就是一条需要你分析的发现。","注意分工。你的工作是把性质写对，而不是手工构造攻击步骤。这正是防御性验证和写攻击程序的区别。"]],["验证修复的六步",["项目方说已修复，你需要证据。最小流程有六步。第一，读修复补丁，只看相对审计版本的差异。补丁是否只改了必要的部分，有没有顺手改了别的。第二，跑原有测试，确认没有回归。","第三，补一条针对这个发现的回归测试，用断言表达这个性质现在成立。这条测试应该在修复前失败，修复后通过。下一页专门讲为什么。","第四，让不变量和模糊测试跑足够久，覆盖修复周围的路径。第五，对已经部署的合约，在主网分叉环境里读取权限、参数和实现地址，确认和预期一致。","第六，复审结论入档，写进报告的修复状态一栏，并标明是用什么方式验证的。"]],["修复前失败，修复后通过",["为什么强调修复前失败、修复后通过？看两条测试。","测试 A，在修复后的代码上跑，通过了。项目方说，你看，测试是绿的。","但把测试 A 拿到修复前的代码上跑，它也通过了。这说明什么？说明它根本没有触及那个问题。它是绿的，和修复无关。","测试 B，在修复前的代码上失败，在修复后的代码上通过。只有这样，才能证明测试确实捕捉到了这个问题，而修复确实解决了它。","最后提醒一个局限。测试只能证明你想到的性质成立。它不能证明不存在其他问题。所以复审不是测试全绿就结束。"]],["报告里怎么写已验证",["报告里写已修复时，要写清验证到什么程度。最弱的是已读代码，人工看过，认为修好了，用于低风险发现。","中高风险至少要已回归测试，有一条修复前失败、修复后通过的测试。高危和严重的发现，要已不变量验证，对应的性质被持续的测试覆盖。","上线门禁，还要已分叉验证，在分叉环境里确认已部署合约的配置和行为。","最后一种是未验证，只有项目方一句口头声明。它必须在报告里明确标注，并且在门禁里视为没有关闭。"]],["合法的练习路径",["想提高读代码、识别漏洞的熟练度，用专门设计的靶场。入门可以用 Ethernaut，一系列带漏洞的小关卡。进阶可以用 Damn Vulnerable DeFi，覆盖借贷、治理和闪电贷场景。还可以读审计竞赛的公开报告，学别人怎样描述问题、怎样定级。","已修复事故的官方事后报告，是最好的教材。手册里的七个交互实验，也都在浏览器里模拟，不涉及真实合约。","练习有三条规则。只在靶场、本地环境或测试网里练。不对未授权的主网合约做任何测试，即使你认为是善意的，也可能触犯法律。发现真实漏洞，通过项目的赏金计划或安全联系渠道报告，不要自行利用。"]],["练一练：事前信号",["最后练一练事前信号。规则是不看结果，只看事前能看到的信息。第一个，Nomad 桥，2022年。一次升级里，把某个初始化值设成了零值。你的评估结论应该是，初始化参数要评审，特别是零值会不会被当作已经证明。","第二个，Ronin，9选5，多把钥匙由同一机构控制，一份临时授权没有撤销。结论是签名人独立性不足。","第三个，Bybit，Safe 多签，签名人依赖网页界面来展示交易内容。结论是签名流程缺少独立解码和带外确认。用手册的事故浏览器按类别筛选，对比同类事故的事前信号，比记住单个案例更有用。"]],["小结与预告",["小结三点。第一，用五步读懂一笔攻击交易，核心是找出被打破的假设，并写回你的检查项。","第二，把事故翻译成不变量。你负责把性质写对，工具负责寻找违反它的序列。","第三，修复的证据是修复前失败、修复后通过的测试。未验证的修复，在门禁里视为没有关闭。","下一集是评估篇的应急响应。评估之后真出事了怎么办。上线前要备好的暂停能力和限额，事故中的决策树，以及平时的桌面推演。下集见。"]]]}}},{"id":"A09","title":"应急响应：评估之后，出事了怎么办","md":"../assessment/A09-incident-response.md","v":{"talk":{"src":"slides/A09-incident-response.html","scenes":[["开场",["大家好，欢迎来到评估篇第9集，应急响应。前面八集都在防止事故。这一集假设，防线已经被突破了。先记住一句话，事故中最稀缺的，是时间。","算一个示例。一个合约被攻击，攻击者每分钟能转走50万美元。如果你在5分钟内发现并暂停，损失是250万。","如果60分钟后才发现，损失是3000万，差了12倍。而能在几分钟内暂停合约、联系对的人、做出决定，这些能力必须平时准备好。事故中，来不及临时发明。"]],["像大楼的消防预案",["打个比方，应急响应像大楼的消防预案。火灾时没人有空翻手册。所以要提前划好疏散路线，对应预案和决策树。要装好喷淋，对应链上的自动限额和自动暂停。","还要平时做演习，真起火时，大家的动作才是肌肉记忆。对应的是桌面推演。","比喻不准的地方在于，火灾蔓延有物理速度。链上攻击可能在一个区块，也就是几秒内完成。所以链上的喷淋，也就是限额和自动暂停，比人工拉警报更关键。"]],["上线前必须就绪",["上线之前，有七项必须就绪，它们都写进上线门禁。第一，暂停能力。有紧急暂停开关，而且和升级权限分离，下一页专门讲为什么。第二，暂停权限的持有人，少数可信角色，24小时都能响应。","第三，链上限额，单笔和单位时间的提取、铸造上限。第四，监控和告警，每一条告警都有负责人和响应时限。","第五，联系人清单。内部值班、外部审计方、安全公司，还有交易所、稳定币发行方、跨链桥和预言机的运营方。出事时没有时间去找邮箱。","第六，预案手册，写清角色、权限、决策树和沟通模板。第七，紧急密钥的保管和启用流程。不要在事故中，才发现关键的密钥找不到。"]],["暂停与升级为什么要分离",["为什么暂停和升级要分离？因为它们一个要快，一个要慢。暂停的目的是止血，而且可逆。示例配置是一个小多签，比如4个值班人里任意2个，没有延迟。恢复则需要更高的门槛。","升级的目的是改变合约逻辑，影响巨大，不可轻易撤回。示例配置是大多签加上48小时时间锁，公开可见，让用户有时间退出。","如果两者混在一起，要么暂停也要等48小时，事故中完全来不及；要么升级也能秒级完成，攻击者拿到这个权限就能改写一切。两头都不安全。"]],["监控什么",["监控什么？七类信号。大额转出，单笔或单位时间超过阈值，对应资金被盗。权限变更，owner、管理员、签名人或者实现地址发生变化，对应夺权和后门。","升级和初始化事件，任何一次都要告警。价格异常，和参考价偏离，或者突然喷价，对应操纵。","供应异常，代币增发，或者跨链桥两侧的供应量对不上，对应伪造铸造。授权激增，大量用户突然授权给同一个陌生地址，往往意味着前端被劫持了。","最后是冷钱包异动。冷钱包平时几乎不动，任何一笔交易都应该告警。还要记住，告警发到没人看的频道，等于没有告警。每条告警都要有负责人和响应时限。"]],["响应决策树",["告警来了，按决策树走。第一个问题，是真实事件吗？目标是5到15分钟内判断。是误报，记录下来并调整阈值。","是真实事件，或者无法排除，就问第二个问题，能暂停吗？能，立刻暂停合约，先止血。暂停几乎总是对的第一步，它的代价是业务中断，通常远小于继续失血。","不能暂停，就降低暴露。比如撤出流动性、撤销授权，或者让交易所下架充提。","然后评估范围和损失，再问，资金还在被转走吗？如果是，马上联系交易所、稳定币发行方和桥，请求冻结和监控。被盗资金要变现，通常要经过它们。","之后是沟通与调查，再决定是否与攻击者谈判，最后修复、复审、恢复，以及事后复盘。注意，确认真实这一步不要拖太久。宁可暂停后发现是误报，也不要观望到资金流出。"]],["限额把损失封顶",["把开场的数字画出来。横轴是时间，纵轴是累计损失。攻击者每分钟转走50万，没有任何限额。","5分钟发现并暂停，损失250万。60分钟才暂停，损失3000万。","现在加上一条链上限额，示例里每小时最多转出500万。同样是60分钟才发现，损失也不会超过500万。","这就是喷淋的意义。人工响应决定你能多快止血，限额决定最坏的情况是多少。两者都要有。"]],["暂停之后与对攻击者沟通",["暂停不是终点。有三个问题要在预案里预先回答。暂停期间，用户能不能提款？如果同时冻结提款，可能引发恐慌。谁有权恢复，条件是什么，恢复前要完成哪些验证？是否需要补偿，或者分期恢复？积压的请求一次放开，可能冲垮流动性。","还有一个问题，要不要和攻击者沟通。部分事故中，项目方会在链上给攻击者留言，提出白帽协议。通常是归还大部分资金，保留一笔赏金，并承诺不追究。这是常见做法，但是否这样做、怎样措辞，是法务和管理层的决定。要提前沟通好，不能由技术人员临时拍板。","另外，如果对方是有组织的国家级团队，谈判的成功率很低，重点要转向链上追踪和联合冻结。所有沟通都要留痕。"]],["对外沟通",["技术之外还有沟通。对内部值班和管理层，立即同步事实、已采取的措施和下一步。对用户，确认后尽快发布，说清已知情况、风险提示和建议操作，比如撤销对某个合约的授权，并承诺下一次更新的时间。","对合作方和相关协议，尽早说清影响范围，以及需要它们做什么。监管和执法由法务主导。公众层面的完整复盘，等事态稳定后再发。","沟通有四条原则。只陈述已确认的事实。不确定的，明说正在调查。没有证据时，不指责具体对象。固定更新的节奏，比如每两小时一次，并且做到。"]],["桌面推演",["预案要靠演练才能保持可用。性价比最高的是桌面推演，不动真实系统，大家围着桌子演一次事故，60到90分钟。第一步，选一个场景。比如，监控发现冷钱包向陌生地址发起一笔大额转账，签名人说自己没有操作。","第二步，主持人逐步释放信息，每10分钟一条新情况。资金还在转吗？前端被改了吗？有人说自己可能被钓鱼了。","第三步，参与者按预案行动，并说出理由。谁拉暂停，联系谁，对用户怎么说。","第四步，记录卡点。谁不知道联系人在哪，谁没有权限，预案哪里没写。第五步，复盘后更新预案，每一项指定负责人和期限。","右边是一个题库，可以轮流演。冷钱包异常转出，代币被升级后增发砸盘，接入的第三方协议被攻破，前端被劫持，预言机喂价异常，关键开发者的电脑被入侵。"]],["事后复盘",["事故处理完，要写复盘。目的是学习，不是追责。一份合格的复盘有七个部分。摘要，发生了什么，影响多大。时间线，精确到分钟，包括检测、决策和行动。","根因，分技术根因和流程根因。流程根因回答的是，为什么没有被提前发现。然后是影响，资金、用户和业务。","做得好的和做得不好的。改进项，每一项都有负责人和截止日期。","最后一部分最重要，回流到评估体系。这起事故暴露了哪个缺失的检查项？更新评估清单和资料清单。无论是自家的事故还是行业的事故，每一起都应该至少产生一个新的检查项或者不变量。否则，复盘只是一份文档。"]],["练一练",["来练一练。凌晨3点，监控发出冷钱包异动告警。值班人员打电话给签名人，一个都联系不上。你的预案里缺了什么？可以先暂停想一想。","参考答案。每个签名人要有备份联系人和轮值表。暂停权限不应该依赖冷钱包的签名人。冷钱包的大额转出要有时间锁，给人留出反应时间。还有，桌面推演里，可能从来没演过夜间加联系不上这种情况。下一次推演，就演它。"]],["小结与预告",["小结三点。第一，应急能力要在上线前备好。暂停和升级权限分离，链上限额，以及有人响应的告警。","第二，先止血，后调查。宁可误停，也不要观望。是否和攻击者谈判，由法务和管理层决定。","第三，用桌面推演保持预案可用。每一次复盘，都要回流成新的检查项。","下一集是评估篇的最后一集，一个实例分析。钱包里代币页面上的 Audit 信息是怎么来的，能发现什么、发现不了什么，以及怎样把它用作尽调的第0步。下集见。"]]]}}},{"id":"A10","title":"实例分析：币安钱包 / Alpha 代币的 Audit 页是怎么来的","md":"../assessment/A10-case-binance-alpha-audit.md","v":{"talk":{"src":"slides/A10-case-binance-alpha-audit.html","scenes":[["开场",["大家好，欢迎来到评估篇第10集，也是评估篇的最后一集，一个实例分析。打开钱包，点开一个代币，有一个 Audit 标签。上面写着风险等级低，一排绿勾。全部绿勾，就能上币吗？","要回答这个问题，先要知道这些信息从哪里来，它能发现什么，发现不了什么。本集用币安钱包的 Audit 页做实例。先说明，下面标已公开的，来自公开文档和公告；标推断的，是我们根据这些材料的推断。相关产品会更新，请以最新的公开资料为准。"]],["像机场安检门",["先打个比方。Audit 页像机场的安检门。它能快速发现金属物品，对应貔貅盘、过高的税率、可以增发这类典型特征。","它查不出藏在行李里的新型危险品，对应业务逻辑漏洞，以及规则还没收录的后门写法。","过了安检门，不等于这个乘客可信。没过，就大概率值得多看一眼。","比喻不准的地方在于，安检是即时的。代币合约在你检查之后，项目方还能升级、改税率、限制流动性。今天通过，不等于明天通过。"]],["页面上有什么",["先看页面上有什么。币安在公开的技能库里，有一份查询代币审计的接口文档，给出了字段结构，可以分五层。第一层，是否有结果。两个字段，有没有审计数据，这个代币支不支持审计。两者都为真，结果才有效。","第二层，总体等级，低、中、高三档，对应0到5的数值。第三层，附加信息，买入税、卖出税，以及合约源码是否已验证。","第四层，风险分为三类，合约风险、交易风险和骗局风险。第五层，每一条细则有是否命中，以及严重程度，分为风险和警告两种。"]],["怎么读等级与税率",["等级怎么读？文档给出的指引是这样的。0到1是低，谨慎推进，自己做研究。2到3是中，要仔细看每一个命中项。4是高，避免交易。5也是高，直接阻止交易。","税率也有口径。卖出税或买入税高于10%属于严重，5%到10%是警告，低于5%可以接受。","来看一个虚构的示例代币。买入税3%，在可接受范围。卖出税12%，超过10%，属于严重。","算一下影响。用户买入1000美元，扣3%，到手970美元的代币。如果价格不变就卖出，再扣12%，只剩约853美元，一买一卖损失了接近15%。卖出税远高于买入税，往往是貔貅盘的前兆。","文档里还有一句很重要的话。低等级不等于安全，结果只是某个时刻的快照。"]],["信息从哪里来",["信息从哪里来？起点是链上和公开的数据，合约的字节码和已验证的源码，交易和持仓的历史，以及部署者的历史地址。","这些数据进入一个自动化的扫描引擎。它用一组风险规则去检查，有些检查还会模拟交易，比如模拟一次买入再卖出。","扫描结果通过钱包的安全接口返回，最后显示在 Audit 标签页上，变成绿勾、红标和说明文字。","扫描能力从哪里来？已公开的是，2025年7月，CertiK 发布公告，说币安钱包集成了它的 Skynet 代币扫描，在代币页新增了 Audit 标签。","需要注意的是，币安的接口文档没有写明数据供应商。所以，所有链、所有代币，包括 Alpha 代币的结果，是不是都由这一家产生，有没有同时使用别的数据源，都属于推断，不能当作已确认的事实引用。"]],["公告里说了什么",["公告里说了什么？它说这个扫描持续检查数十个关键风险向量，并举了三类例子。第一类是恶意代码，比如能增发供应、修改余额、提高交易税的函数。","第二类是中心化风险，也就是隐藏的权限，可以冻结资金，或者改变代币的机制。","第三类是高风险钱包，部署者曾经关联过高风险或者欺诈性的发币。","展示方式是，没有命中的风险显示绿勾，可能有问题的显示红标，每一条都附有说明。注意，公告没有列出完整的检查项清单。接口文档也只点名了一项，貔貅风险，也就是能买不能卖。"]],["扫描不是审计",["这里要特别注意一个用词。页面上叫 Audit，但它是自动扫描，不是审计报告。自动扫描是广度覆盖，每个代币都能跑，规则驱动，秒级出结果，是一个时间点的快照。","人工审计报告是深度覆盖，针对一个项目的一个版本，人工审查业务逻辑，有范围、方法、发现和假设，读法在第7集讲过。两者的深度、范围和责任完全不同。","所以，Audit 页是给用户的保护提示，不代表交易所对这个代币做了人工审计背书。另外，Alpha 是早期项目的发现和交易入口，它和主站上币的审核流程也不一样。"]],["对照八条红线",["把扫描能力对照第5集的八条红线。前三条，可无限增发、貔貅盘、owner 可冻结任意地址，扫描通常能发现。但增发有没有真实有效的时间锁，还要人工看。","后门和升级后门，只能部分发现。代理合约的实现可以以后再替换，扫描只能看到当前版本。升级权的持有方，扫描能读出地址类型，却看不出一个多签其实由一个人控制。","锁仓和流动性锁是否真实，扫描能力较弱，要人工核验锁仓合约和解锁条件。合约地址和官网是否一致，扫描不能发现，必须人工比对官方渠道。","最后，源码已验证，只说明有一份验证过的源码，不等于它和审计报告里的版本一致。八条里，扫描能可靠覆盖的大约三条。"]],["任何扫描都有的盲区",["任何自动扫描，都有四个结构性盲区，这不是哪一家产品的问题。第一是快照。比如上午10点检查，等级低，税率为零。下午2点，项目方升级合约，把卖出税改成99%。上午的绿勾已经失效。","第二是规则覆盖。扫描只能发现已知的模式。新的后门写法，复杂的业务逻辑漏洞，以及第10章讲的经济攻击，都不在其内。","第三是缺少上下文。扫描看不到项目方的私钥怎么管理、签名流程怎样，而第6集讲过，这是损失最大的来源。","第四是没有结果的情形。显示不支持审计，或者没有数据时，没有任何结论。千万不能把它当作没有风险。"]],["第 0 步分诊",["那么评估人员该怎么用它？把它当作尽调的第0步分诊，放在流程的最前面。拿到上币申请，先看扫描结果。","命中严重项，可以快速按红线处理。但要独立复现，比如读源码，在分叉环境里模拟买卖，因为扫描也会误报。","没有命中，只说明通过了最低门槛，仍然要走完第5集的全流程，权限、链上数据、运营和经济四个维度。","显示不支持或者无数据，就当作未评估，必须人工评估。三条路最后都汇到评分卡，结论由你签字。把扫描结果直接当上币依据，等于把交易所的责任外包给一个你无法控制、也没看过规则的黑盒。"]],["独立验证清单",["对扫描给出的每一类结论，都用自己的方法再确认一遍。第一，在区块浏览器确认源码已验证，并比对部署的字节码。第二，读出 owner、admin 和 minter，看是个人地址还是多签，阈值和时间锁是多少。","第三，查看代理的实现槽，确认能不能升级，谁能升级。第四，在分叉环境里小额模拟买入再卖出，核对实际税率和扫描结果是否一致。","第五，查部署者地址的历史，是否部署过已被标记的合约。第六，查持仓前10和前50的集中度，以及流动性的锁定。","第七，存证要带时间。扫描是快照，所以把扫描结果、查询时间和链上读数，一起放进证据附录。"]],["练一练",["最后练一练。一个代币的 Audit 页显示等级低，全部绿勾。但它是一个可升级的代理合约，管理员是一个单签的个人地址。按第5集，你的结论是什么？Audit 页为什么没有拦住它？","结论是否决，或者暂缓到对方整改，因为命中了第五条红线。Audit 页没拦住，是因为扫描看的是当前的实现，而升级权决定的，是下一个实现。绿勾说的是现在，红线说的是以后。"]],["评估篇小结",["本集三件事。第一，看到任何风险信息，先问它从哪里来，区分已公开和推断。回答不了数据来源、规则和更新频率，就只能当作提示。","第二，扫描不等于审计。自动结论要带检查时间，无结果要归入未评估。","第三，扫描是尽调的第0步分诊。外部扫描是输入，结论由你按评分卡得出，并且签字。","评估篇十集到这里讲完了。它讲的是怎样做评估。接下来的主线13集，讲每一类漏洞的机制和防御，链专题4集，讲以太坊、BNB Chain、TRON 和 Mantle 的差异。配合手册里的交互实验和评估模板一起使用。我们主线见。"]]]}}},{"id":"A11","title":"区块链系统安全测试","md":"../assessment/A11-blockchain-system-testing.md","v":{}}]},{"name":"链专题 · ETH / BNB / TRON / Mantle","items":[{"id":"C00","title":"以太坊：参照环境、协议升级与案例深潜","md":"../chains/C00-ethereum.md","v":{"talk":{"src":"slides/C00-ethereum.html","scenes":[["开场",["大家好，欢迎来到链专题第一集，以太坊。主线讲通用的漏洞和防御，链专题把这些方法落到每条链的具体差异上。第一站当然是以太坊。","一句话理解，以太坊是所有 EVM 链的原件。绝大多数合约漏洞模式，最早在以太坊主网上出现，这里的复盘也最全，公开报告、审计、链上数据都有。","这些漏洞被复盘、被修复，教训沉淀成最佳实践。而其他链上的事故，多数是这些模式换了参数后复发。所以读懂以太坊的病历，你在任何 EVM 链上都能更快认出症状。本集深潜十起主网事故。"]],["百年病历的大医院",["打个比方。以太坊像一座有百年病历档案的大医院。这里的病例最多、记录最全，而且全部公开。","别的医院，BNB Chain、Mantle 这些 EVM 链，用的是同一套医学教材，所以病人得的病大同小异，症状能互相印证。","读懂这里的病历，你在任何一家医院都能更快认出症状。这就是为什么我们先深潜以太坊。","比喻的局限在于，病历只记录被发现的病。很多以太坊漏洞在被利用之前，已经存在了数月甚至数年，期间没有人察觉。没出事不等于安全。"]],["参照环境：协议升级",["先看以太坊作为参照环境的几个关键升级。EIP-150，外部调用最多转发 63/64 的剩余 gas，所以调用方总能保留一点 gas 收尾。EIP-2929 提高了 SLOAD 等操作的 gas，这导致依赖 2300 gas 的 transfer 可能失败，这是第六集讲过的坑。","EIP-1153 引入瞬态存储，可以做低成本的重入锁，但也带来新的交易内状态语义。EIP-6780 改了自毁，SELFDESTRUCT 只在同一交易内创建的合约上删除代码，Parity 式的自毁库合约不再能删码，但强制转入 ETH 仍然可行。","最重要的是 EIP-7702，EOA 可以签名委托一段合约代码。这意味着 tx.origin 等于 msg.sender 不再代表调用者是普通钱包。记住这几个升级，它们动的是合约安全的地基，后面的案例会反复用到。"]],["十起案例总览",["本集深潜十起事故。它们大多不是主线里的代表案例，但模式完全一致。重入这一类，Fei Rari 是跨函数重入，锁没覆盖全部函数。Penpie 是无许可注册加领奖函数无锁。外部调用这一类，Akutars 是逻辑错误加推送退款 DoS。","算术，KyberSwap 是舍入方向和注释相反。预言机，Harvest 是份额价格在单笔交易内被操纵，Inverse 则是浅池 TWAP 被多区块持续操纵，这两个要对比着看。权限，Sushi 的路由器回调校验只认上次调用的地址。","升级，Compound 提案 62 是升级引入 bug 又没有紧急开关。签名，WazirX 是签名界面和实际交易不一致，EIP-7702 钓鱼是诱导签署委托代码。下面挑几个讲透。注意，这些代码片段都是根据公开复盘整理的简化示意，用于说明根因，不是原始合约的逐行复制。"]],["Fei Rari：跨函数重入",["第一个案例，Fei Rari。它是基于 Compound 分叉的借贷池。看这段简化示意，borrow 函数先调用 doTransferOut 把 ETH 转给借款人，这一步对 ETH 市场是一个 call，交出了控制权。然后才更新借款记录，太晚了。","被打破的不变量是，外部调用返回之前，账本应该已经反映了这笔借款。但攻击者在收到 ETH 的回调里，去退出抵押市场，此时 Comptroller 读到的借款记录还是零，于是允许退出并取回全部抵押品。","根本原因很有意思。Compound 原版用 transfer 发 ETH，只转发 2300 gas，恰好挡住了回调重入。而被攻击的 Fuse 版本改用了低级 call，把足够的 gas 和控制权交给了接收方，状态更新顺序却没同步调整。而且据公开分析，那把重入锁没有覆盖 exitMarket 函数。这正是第三集跨函数重入的真实版本。","修复就是，修改转账方式必须同时改成先记账后交互，并且让所有读写借贷状态的入口共用一把锁。教训是，改转账方式就是改重入面。损失约八千万美元。"]],["Akutars：一个变量名锁死资金",["第二个案例，Akutars，一个荷兰式拍卖的 NFT 项目。它有两个缺陷。先看提款函数，claimProjectFunds 要求 refundProgress 大于等于 totalBids 才能提款。但 totalBids 是 NFT 数量之和，而 refundProgress 最多等于出价的笔数，出价笔数小于 NFT 总数。","还有第一个缺陷，退款用的是推送方式，任何一个出价者的合约拒收 ETH，整笔退款就回滚，所有人都退不了款，这是一个 DoS 入口。","直接锁死资金的是第二个缺陷。那个比较条件永远不成立，项目方永远提不出钱。一万一千多个 ETH，当时超过三千四百万美元，被永久锁在合约里。合约不可升级，无法修复。","修复有两条。退款改成拉取式。更重要的是，资金出口的条件必须有端到端测试，写一个退款完成后项目方能提取的测试，它会立刻失败，上线前就能发现。教训是，不可升级合约没有维修门，就只能一次做对。"]],["Harvest vs Inverse",["第三组案例，Harvest 和 Inverse，都是价格操纵，但要对比着看。Harvest 是单笔交易操纵。它的金库份额价格，等于持仓估值除以份额总数，而持仓估值依赖 Curve 池内的稳定币价格。攻击者用闪电贷在一笔交易里压低 USDC 价格，以偏低的份额价格存入，价格恢复后再高价赎回。损失约三千三百八十万美元。","Inverse 不一样，它是多区块操纵，而且项目方强调是资本密集型、非闪电贷。攻击者投入大量自有资金在流动性很浅的 INV 池里推高价格，同时发大量垃圾交易压制套利机器人把价格拉回，于是 TWAP 窗口内的价格被持续抬高了好几个区块。然后以 INV 高价抵押借走约一千五百六十万美元。","关键区别就在这里。很多人以为用了 TWAP 就安全，但 TWAP 只能挡住单笔交易的闪电贷操纵，挡不住有资本、能持续数个区块的操纵，尤其是浅池。所以低流动性的治理代币，不能作为高抵押率的抵押品。这和 BNB 链上的 Venus XVS 是同一个教训。"]],["Sushi RP2：回调校验",["第四个案例，Sushi 的路由合约 RouteProcessor2，上线仅四天。用户要先给它授权，它才能代用户交换代币。看代码，交换函数里的池子地址来自用户输入的路由，没有校验是不是真实池子。攻击者填入自己部署的假池子，假池子立即回调。","回调函数里确实有校验，要求 msg.sender 等于 lastCalledPool。但这只证明了回调来自我刚才调用的地址，而那个地址正是攻击者自己的假池子。校验通过后，它解码出的 from 可以是任意一个授权过的用户，于是把别人的代币转给了自己。","被打破的不变量是，只有真实的 Uniswap 池才能触发回调。正确做法是用工厂地址和代币对，计算出合法的池子地址再比较，这是 Uniswap V3 的 CallbackValidation 思路。核心教训，持有用户授权的合约，等于持有用户钱包的钥匙，它的任何用户可控地址都必须视为攻击入口。约三百三十万美元被盗，风险波及十四条链。用户侧，只授权需要的额度，不用的及时撤销。"]],["Compound 62：升级无刹车",["第五个案例，Compound 提案 62。治理提案升级了 COMP 奖励分发逻辑，但奖励索引的计算有误。","升级生效后，部分用户可以领取远超应得的 COMP，可领取量约十六万八千 COMP，创始人估计最坏情况约二十八万 COMP，相当于八千万美元。","问题是，协议没有任何管理员开关或社区工具可以停止 COMP 分发。任何修复都必须走治理流程，到生产环境需要约七天。在这七天窗口期里，被错误发放的 COMP 只能被动等待。","教训很深刻。时间锁本来是保护用户免受恶意升级的，但当升级本身有 bug 时，同一把时间锁也阻止了快速修复。所以要把权限分成两类，一类是可以快速执行、只能停的守护者权限，一类是必须经过时间锁、可以改的升级权限。而且升级前应该在主网分叉环境里跑奖励分发的不变量测试，每个用户累计领取不超过按份额应得的，上线前就能发现。"]],["签名界面与委托",["第六组，签名界面事故。WazirX 是印度交易所，用的是四选六多签加一个托管服务商。签名人以为在签一笔日常交易，界面显示的也是正常内容，但发送到硬件钱包签名的数据是恶意的，这笔交易把多签升级成了攻击者控制的版本，约两亿三千万美元被盗。","七个月后，Bybit 几乎是同一种攻击。Safe 钱包的前端被篡改，签名人盲签了一笔 delegatecall，替换了多签的实现合约，损失高达十五亿美元。同一种攻击，七个月内两次命中大型交易所。防御就是第八集讲的，独立解码 calldata，硬件钱包逐字段核对，对升级和 delegatecall 类操作设置额外审批。","最后提醒一个新风险。EIP-7702 之后，任何用是不是 EOA 来防重入、防闪电贷或限制调用者的代码，都需要重新审视。因为委托后的 EOA 带有代码、会回调，收到 ETH 时也会执行逻辑。链上统计显示，超过百分之八十的 7702 委托指向复制粘贴的清扫合约，根本问题还是私钥泄露，但 7702 让清扫更便宜、更自动化。"]],["主网开发检查清单",["把这十起事故浓缩成一页检查清单。重入分析要覆盖所有回调来源，原生 ETH、代币钩子、闪电贷回调、用户指定的池子和路由，还有 EIP-7702 委托的 EOA。不要用 tx.origin 等于 msg.sender 或者 code.length 等于零来判断调用者是普通用户。用瞬态存储锁时确认编译器版本，并对锁做跨函数测试。","价格来源要区分单笔交易可操纵和多区块可操纵，浅池资产不作高抵押率抵押品。回调校验基于计算出的合法地址，不基于上一次调用的地址。资金出口，提款、项目方领取、退款，都要有端到端测试，不可升级合约尤其如此。","守护者暂停权和升级权要分离，奖励和铸币类功能要有独立的紧急开关。所有交换有 minOut 和 deadline，关键交易考虑私有通道。多签操作有独立的 calldata 解码与核对流程。这九条，就是这十起事故换来的。"]],["小结与预告",["小结三点。第一，以太坊是原件。读懂主网的病历，你到任何一条 EVM 链都能更快认出症状。","第二，协议升级会移动安全假设。EIP-7702 之后，用是不是 EOA 来做判断不再可靠，老代码要重新审视。","第三，改转账方式就是改重入面。更重要的是养成同一模式不同外衣的视角，把每一起新事故快速对应到已知模式上。","下一集是 C01，BNB Chain。我们会看到以太坊的坑如何在 BNB 链上重演。Uranium 分叉 Uniswap 时改了一行导致 k 检查失效，BSC-USD 是 18 位精度而不是 6 位，还有 Venus 用治理代币作抵押的经济风险。下集见。"]]]}}},{"id":"C01","title":"BNB Chain：合约安全专题","md":"../chains/C01-bnb-chain.md","v":{"talk":{"src":"slides/C01-bnb-chain.html","scenes":[["开场",["大家好，链专题第二集，BNB Chain。BSC 的字节码和以太坊兼容，以太坊的合约可以直接搬过来编译。但一句话理解，字节码兼容不代表参数一样。","它的出块更快，从十二秒级降到零点七五秒。代币精度不同，BSC-USD 是十八位，不是以太坊 USDT 的六位。","它的验证者更少，所以能协调暂停整条链，但这个权力也更集中。而且分叉项目特别多，照抄名协议改几处细节就上线。漏洞往往就藏在我以为一样的地方。"]],["同一套图纸的新城",["打个比方。BSC 像一座按照以太坊同一套图纸建造的新城。街道布局一样，也就是 EVM 字节码兼容，所以以太坊的车，也就是合约，可以直接开进来。","但红绿灯的节奏快了十六倍，出块从十二秒级到零点七五秒。按每个路口等多久计时的司机，会算错时间。","同名的商店卖的东西规格不同，BSC-USD 是十八位精度，以太坊 USDT 是六位。","城里还有很多山寨店，照抄名店的装修，却改了几处细节，这就是分叉项目。","比喻的局限在于，城市可以慢慢改规则，但 BSC 的参数通过硬分叉一次性改变，所有依赖旧参数的合约同时受影响。"]],["区块数计时的陷阱",["先看最隐蔽的一个差异，区块数计时。BSC 的出块间隔一直在变。早期约三秒，2025 年 4 月 Lorentz 硬分叉降到一点五秒，6 月 Maxwell 硬分叉降到零点七五秒，快速最终性约一点八七五秒。Maxwell 公告明确提醒开发者，必须更新基于时间的逻辑。","为什么重要。很多 BSC 农场合约分叉自 SushiSwap 的 MasterChef，按每区块奖励发放代币。设计时假设三秒一个块，每天约二十八点八万枚。出块间隔降到零点七五秒后，同样的参数每天发放约一百一十五万枚，排放速度变成四倍。","后果很严重。如果奖励来自固定预算的国库，国库会提前耗尽。如果奖励是增发，通胀率翻四倍。借贷协议里的每区块利率也一样。这不是攻击，但造成的经济损失可能和攻击一样大。对策是，用时间戳计时，或者把每区块参数做成可治理调整的。"]],["与以太坊的六项差异",["把差异列成一张表。出块间隔零点七五秒而且历史多变，区块数计时会翻倍，对策是用时间戳。稳定币精度，BSC-USD 是十八位，写死 1e6 会偏差一万亿倍，对策是读取 decimals。资产性质，BSC 上有大量 Binance-Peg 映射资产，它们可能被冻结或脱锚，要做风险披露，不能把映射资产等同于原生资产。","验证者规模小，链可被协调暂停，也有审查风险，重大资产的最终性要单独评估。生态里分叉协议多，分叉时改动的代码往往没审计，必须做差异审计。","最后一条容易被忽略。BSC 的 gas 成本低，攻击者的试错成本也低，粉尘攻击和垃圾代币很多。所以在 BSC 上，绝对不能依赖攻击成本高来做防御。这六项，就是移植到 BSC 时最该检查的地方。"]],["Uranium：分叉改常数",["第一个案例，Uranium Finance。它分叉自 Uniswap V2，计划把手续费从千分之三改成千分之一点六。看这段简化代码，余额调整项被放大到一万倍，但右侧的 k 值仍然按一千的平方来比较。","被打破的不变量是，每次 swap 之后仍应满足 x 乘 y 大于等于 k。现在左侧放大了一百倍，右侧没放大，这个检查几乎永远通过。攻击者在每个交易对里投入极少量代币，调用 swap 就能取走约百分之九十九的储备。","根本原因是，改手续费时那个常数散落在代码的多处，开发者只改了一半。右侧其实应该是一万的平方。","修复有两条。常数必须集中定义成一个 FEE_DENOMINATOR，不能散落。分叉代码的每一处改动都要做差异审计，并用不变量测试验证 x 乘 y 大于等于 k 在每次 swap 后都成立。损失约五千万美元。这是第五集常数散落的典型。"]],["PancakeBunny：LP 定价被操纵",["第二个案例，PancakeBunny。它的奖励铸造器按池子储备给 LP 和收益估值。看这段简化逻辑，LP 的价值直接由池子里 WBNB 和 USDT 的储备算出来，而储备可以在同一笔交易里被巨额兑换扭曲。然后据此铸造 BUNNY 奖励。","被打破的不变量是，铸造奖励的输入，必须是攻击者无法在同一交易内改写的量。但这里 LP 估值直接取自被扭曲的池子储备。","攻击者先扭曲储备，领取被高估的奖励，铸出大量 BUNNY 再抛售。BUNNY 价格从约一百四十六美元跌到约六美元。而且审计方事后表示，被利用的是其审计之后上线的新版本，这呼应了主线反复强调的，审计过只对那个版本成立。","修复的核心是，奖励铸造是无中生有的操作，它的输入必须完全抗操纵，要用抗操纵预言机或内部记账，绝不能用瞬时储备。损失约四千五百万美元。这是第七集预言机操纵在 BNB 链上的翻版。"]],["Venus：抵押品风险",["第三个案例，Venus，同一个协议两次栽在抵押品上。第一次是二零二一年五月的 XVS 事件。抵押品是协议自己的治理代币 XVS，价格短时间内从约七十六美元涨到约一百四十四美元，用户趁机借出大量 BTC 和 ETH，价格回落后清算不及，清算超过两亿美元，留下坏账超过九千五百万美元。","第二次是二零二二年五月的 LUNA 事件。抵押品是正在崩盘的 LUNA。喂价触及下限后停在约零点一美元，但市场价远低于此，于是有人在市场上低价买入 LUNA，再按零点一美元的喂价抵押借款，损失约一千一百万美元。","两条教训。低流动性或自有代币作抵押，要设供应上限。还有，喂价要检查上下限，当熔断触底时，要能快速暂停这个市场，而不是继续用触底的价格放贷。这正是第十集经济安全和第七集预言机下限的结合。以太坊上的 Inverse，是同一类问题。"]],["跨链：系统层传导到应用层",["第四组，跨链案例，看它们如何从系统层传导到应用层。先看 Qubit 桥，被利用的漏洞在以太坊一侧的存款合约，对零地址做 safeTransferFrom 返回了成功，但资金损失却发生在 BSC 一侧的借贷池，凭空铸造的代币被用作抵押。如果你只审计 BSC 侧的代码，根本看不到这个漏洞。","再看 BSC Token Hub，被攻击的不是某个 DeFi 协议，而是链的系统合约，也就是跨链桥本身。它的 IAVL 证明校验有缺陷，伪造的证明被接受，攻击者凭空铸造了两百万 BNB，存入 BSC 上的借贷协议作抵押，借出其他资产跨链转走。约三小时后验证者协调暂停了 BSC。","共同的教训是，系统层的漏洞会传导到应用层。借贷协议的代码完全正确，却接收了凭空铸造的抵押品。所以跨链风险评估必须覆盖两侧，不能只看自己这一侧。这次事故通过 Moran 硬分叉修复。注册即可成为中继者，和证明校验缺陷，这两类教训适用于所有跨链桥。"]],["分叉项目的权限风险",["最后讲分叉项目的权限风险。BSC 上大量农场和 DEX 分叉自 SushiSwap 和 PancakeSwap，常常照抄了高危权限。比如 MasterChef 早期版本的 setMigrator，owner 可以把所有用户的 LP 迁移到任意合约，审计时要问它是否删除、是否经过时间锁。还有 owner 直接调用的 mint，可以无限增发，要问增发权是否只授予农场合约。","setRewardPerBlock 可以把参数瞬间改到极端值，要问有没有上限和时间锁。可升级加单签 owner，可以随时替换实现，要问升级权限归属。","还有一类特别坑，代币合约带黑名单或交易税开关，owner 可以阻止卖出，这就是貔貅盘，只能买不能卖。BSC 上 gas 便宜，这类垃圾代币和貔貅盘特别多。协议如果允许任意代币上架或作抵押，就要把这类代币当作攻击工具来建模。记住一句话，分叉即重审。"]],["小结与预告",["小结三点。第一，字节码兼容不等于参数一样。区块数计时和代币精度，是最隐蔽的两个坑，编译能过，运行会出经济问题。","第二，分叉即重审。改动点要做差异审计，常数集中定义，高危的 owner 权限要置于时间锁之后。","第三，系统层的漏洞会传导到应用层。即使你的协议代码完全正确，也可能接收到凭空铸造的抵押品，所以跨链风险评估必须覆盖两侧。","下一集是 C02，TRON。TRON 能跑 Solidity，但差异更大。USDT 转账成功也返回 false，会让资金只进不出。资源模型是能量加八十毫秒时限，失败的交易也会上链。还有账户权限可以被修改，一个地址不等于一把私钥。下集见。"]]]}}},{"id":"C02","title":"TRON：合约安全专题","md":"../chains/C02-tron.md","v":{"talk":{"src":"slides/C02-tron.html","scenes":[["开场",["大家好，链专题第三集，TRON。一句话理解，TRON 能跑 Solidity，但 TVM 不是 EVM。TVM 是 TRON 的合约虚拟机，兼容大部分 EVM 指令，但有很多自己的规则。","它的资源模型是能量加带宽，不是 gas。地址以 T 开头，链上带 0x41 前缀，链 ID 也完全不同。","最坑的是，最常见的代币 USDT 有个怪习惯，转账成功也返回 false。还有账户权限可以被修改，一个地址不等于一把私钥。把以太坊合约原样搬过来，编译能过，运行会错。本集讲八项差异和账户层的骗局。"]],["改装过的同型号汽车",["打个比方。TVM 像一台改装过的同型号汽车。方向盘、油门、刹车的位置一样，大部分操作码兼容，你上车就能开。","但它不烧汽油，烧能量。而且油箱有两个，一个是质押 TRX 获得的能量，一个是直接燃烧 TRX。","仪表盘有几块表永远显示零，比如 DIFFICULTY 和 GASLIMIT 都返回零，用它们做随机数或参数就会出错。","而路上最常见的乘客 USDT，有个怪习惯，下车时明明到了，却说没到，也就是 transfer 返回 false。","比喻的局限是，改装车的差异写在说明书里，但 TRON 的部分差异由硬分叉开关控制，会随网络提案变化，部署前一定要查当前状态。"]],["TVM vs EVM 八项差异",["先看 TVM 和 EVM 的八项差异，这来自 TRON 官方文档。计费用能量，没有优先费，所以依赖 tx.gasprice 或 basefee 的逻辑都会出错。执行有八十毫秒的 CPU 时限，超时返回 OUT_OF_TIME，以太坊上 gas 足够的大循环在这会超时，要分批处理。链 ID 是七亿多，写死链 ID 的代码和链下签名工具都要用这个值。","地址计算也不同，CREATE2 用 0x41 前缀，CREATE 用内部计数器而不是 nonce，所以预计算地址和跨链同地址部署的假设都不成立。最关键的，原生币转账，TransferContract 这种系统转账不执行合约代码，所以依赖 receive 记账或拒收的逻辑会失效。","还有，DIFFICULTY 和 GASLIMIT 返回零，不能用它们做随机数。最后，PUSH0、TSTORE 这些新操作码由网络参数开关控制，未开启时返回非法操作，而新版编译器默认会生成 PUSH0，所以必须用 TRON 适配的编译器，并设置和网络一致的 evmVersion。这八项，每一项都对应一类会出错的代码。"]],["USDT：成功却返回 false",["第一个案例，USDT 成功却返回 false。这来自 OpenZeppelin 二零二六年对 Across 协议 TRON 部署的审计报告。看这条流程，一个以太坊上审计过的金库，原样部署到 TRON。提款时用 SafeERC20 的 safeTransfer 推送 USDT，而 TRON 上的 USDT 转账成功时也返回 false，于是 SafeERC20 判定失败，整笔回滚。","后果不是被盗，而是被锁。存款走的是 transferFrom，方向正常，但提款走 safeTransfer 全部回滚，用户资金只进不出。如果合约不可升级，资金可能永久无法取出。","修复方案叫 TronTransferLib，核心是，调用 transfer 之后，检查接收方的余额是否增加了对应的金额，而不是看返回值。transferFrom 和 approve 行为标准，拉取方向不需要改。","但有两个前提要注意。这个修复假设 USDT 没有开启转账手续费，而 Tether 在 TRON 上保留了开启手续费、黑名单和暂停的能力。另外，单元测试用模拟的 USDT 根本测不出这个问题，必须在 TRON 测试网上用真实的 USDT 合约测试。"]],["失败但上链 → 假充值",["第二个案例，失败但上链导致的假充值。这是 TRON 一个很重要的特性，交易执行失败时，交易仍然上链，有交易哈希，扣除已消耗的资源。","常见的失败原因有三种。OUT_OF_ENERGY，能量和 fee_limit 不足以支付执行。OUT_OF_TIME，超过八十毫秒 CPU 时间。还有 REVERT，合约的 require 失败，比如余额不足，或者地址被 Tether 冻结。这三种情况，转账都没有真正发生，但资源已经扣了，交易也上链了。","这就带来假充值风险。交易所、支付网关、跨链桥在 TRON 上确认充值时，必须检查回执的执行结果为成功，并且检查 Transfer 事件来自正确的代币合约地址。如果只检查交易存在，或者只检查交易里有转账调用，就会把一笔失败的交易记为到账。公开报道中，确实有用户遇到失败回滚的 USDT 转账，被交易所错误标记为成功的情况。这是第十一集到账确认的现实版本。"]],["TRX 转账绕过合约代码",["第三个案例，TRX 系统转账绕过合约代码。看这段代码，它用 receive 函数累加 totalReceived，然后在 check 里要求合约余额等于 totalReceived。在以太坊上，这个假设大致成立，因为转 ETH 给合约会触发 receive。","但在 TRON 上，被打破的不变量是，合约余额等于记账值。任何人用 TransferContract，也就是普通的 TRX 转账，向这个合约转一个 sun，receive 不会执行，但余额增加了，于是 check 从此永远失败。如果某个关键函数依赖这个等式，就构成了 DoS。","修复是，不依赖 receive 记账，用内部变量记账，并且接受余额可以在合约不知情的情况下增加这个事实。这和以太坊上强制转入 ETH，其实是同一类问题。第二集和第六集都讲过，合约余额是可以被外部强行改变的，不能作为账本的事实来源。"]],["账户层的三类骗局",["第四组是账户层的骗局。TRON 收集到的案例，集中在账户层和集成层，而不是单个协议的合约漏洞。最典型的是权限篡改，也叫多签诈骗。攻击者拿到私钥后，不立即转走资产，而是把账户的 Owner 和 Active 权限改成自己控制的地址。受害者还能看到余额，但转账需要攻击者签名，新转入的 USDT 不需要签名就到账，攻击者等余额变大后一次转走。防御是，钱包和交易所要在 UI 里显示账户权限配置，权限变化时告警。","第二种是授权钓鱼，诱导用户对攻击者地址 approve 大额 USDT，防御是钱包清晰显示授权对象和金额，定期撤销授权。第三种是地址投毒，攻击者生成首尾字符和你常用地址相同的地址，发送零金额转账污染你的交易记录，你下次从记录里复制就复制错了，防御是核对完整地址，用地址簿，钱包隐藏零金额转账。","第四种是假 USDT，部署一个名字和符号都相同的假代币发给你，防御是以合约地址识别代币，不以名称识别。核心启示是，在 TRON 上收到一个地址作为合约特权角色时，一定要确认它的账户权限配置，因为一个地址不等于一把私钥。"]],["签名与链 ID",["最后讲签名与链 ID，有四个容易踩的坑。第一，EIP-712 的域分隔符包含 chainId，在 TRON 上 block.chainid 返回七亿多，链下签名工具必须用相同的值，否则签名验证会失败。第二，TRON 账户没有 nonce，交易层靠 TAPOS 和六十秒过期防重放，但合约层的签名防重放仍然要你自己维护 nonce。","第三，地址在虚拟机内部是二十字节，到链边界才加 0x41 前缀，所以签名消息里的地址编码，要和合约里 abi.encode 处理 address 的方式一致。第四，TRON 提供了 ValidateMultiSign 预编译合约，地址是 0x0a，可以在合约里验证账户多签。","这四点都是第八集签名安全在 TRON 上的具体落地。总的来说，TRON 的签名问题，根子还是链 ID 和地址编码的差异。把这些对齐了，第八集讲的最小输出、截止时间、nonce 防重放这些通用原则，在 TRON 上一样适用。"]],["小结与预告",["小结三点。第一，TRON 的 USDT 成功也返回 false，推送转账要改成余额差校验，而且必须用真实的 USDT 在测试网测，模拟代币测不出来。","第二，TRON 的交易失败也会上链，确认充值时要看执行结果和代币合约地址，防止假充值。","第三，账户权限可以被修改，一个地址不等于一把私钥，把一个地址设为特权角色前，先核查它的权限配置。","下一集是 C03，Mantle，这是一条以太坊的二层网络，视角又不一样。它的原生币是 MNT 不是 ETH，msg.value 收到的是 MNT。而 ETH 在上面是 ERC-20 的形式，不能用 call value 发送。而且作为 L2，你的资产安全还取决于排序器、证明系统和升级多签，这是全新的信任假设。下集见。"]]]}}},{"id":"C03","title":"Mantle：合约安全专题（以太坊 L2 视角）","md":"../chains/C03-mantle.md","v":{"talk":{"src":"slides/C03-mantle.html","scenes":[["开场",["大家好，链专题最后一集，Mantle。它是建在以太坊上的二层网络。一句话理解，Mantle 的合约代码和以太坊几乎一样，但有两件事不同。","第一，原生币是 MNT 不是 ETH，msg.value 收到的是 MNT。而且你从以太坊带来的 ETH，在上面是 ERC-20 的形式，不能用 call value 发送。","第二，你的资产安全不只取决于以太坊，还取决于 L2 的排序器、证明系统和升级多签。提款甚至可以被暂停，所以依赖提款一定能及时完成的协议会出错。这两件事，是 L2 和 L1 最根本的区别。"]],["以太坊旁的卫星城",["打个比方。Mantle 像以太坊城旁边的一座卫星城。卫星城有自己的交通调度中心，也就是排序器，调度很快，但只有一个调度员。","卫星城每隔一段时间，把账本送回以太坊城公证，提交状态根和证明。","卫星城的通用货币是 MNT。你从以太坊城带来的 ETH，在这里被换成一种 ETH 兑换券，也就是 ERC-20 形式的 ETH。","卫星城的城市规划，可以由十四人委员会中的六人签字修改，而且立即生效，没有延迟。这是一个很重要的信任假设。","比喻的局限是，卫星城出问题时，居民可以通过以太坊的紧急通道，把交易强制送进卫星城，这叫强制包含，但可能要等十二小时。下面具体看差异。"]],["链的安全模型",["先看 Mantle 的安全模型，资料来自 L2BEAT。L2 这一侧，用户交易先经过一个中心化排序器，它是唯一能出块的运营者，然后在 op-geth 分叉的 EVM 上执行，原生 gas 代币是 MNT。","以太坊这一侧有几个关键合约。交易数据发布到以太坊的 blob。输出预言机由白名单提议者提交状态根。SP1 验证器网关做有效性证明。还有桥和门户合约，持有 L1 上的跨链资产。L2BEAT 把 Mantle 归类为 ZK Rollup，用 OP Succinct 证明，但工程多签可以把它切换到乐观模式。","最关键的是升级权限。一个六选十四的安全多签，可以无延迟升级这些持有资产的 L1 合约。L2BEAT 把无升级延迟、无退出窗口标为关键风险，并将 Mantle 评为 Stage 0。还有一个三选七的工程多签，可以暂停提款、切换乐观模式。所以你在 Mantle 上的资产安全上限，其实就是这几个组件和这两个多签。"]],["与以太坊的八项差异",["把差异列成表。原生币是 MNT，所以 msg.value、balance、payable 函数的单位全是 MNT。ETH 是 ERC-20 形式，审计报告里叫 BVM_ETH，所以以为能用 call value 发 ETH、或者做 WETH 包装的代码都会出错。回调入口也变了，转 MNT 触发 receive，转 ETH 不触发，所以重入分析要按实际资产重做。交易费分两部分，L2 执行费加 L1 数据费，用 tokenRatio 换算，所以 L2 上可能出现 L1 上不会有的 out-of-gas。","交易顺序由单一排序器决定，MEV 和审查风险集中在运营者。排序器宕机时，价格停止更新、清算停止，要经 L1 强制提交最长十二小时，所以借贷和永续合约的清算和预言机逻辑必须考虑这种情况。","还有两项容易漏。L1 到 L2 的消息，OP Stack 会对 L1 发送者做地址别名，所以在 L2 上用 msg.sender 等于 L1 合约地址来鉴权会失败，要通过跨域信使获取原始发送者。最后，提款需要状态根被提交和终结，而且可被工程多签暂停，所以依赖提款一定能及时完成的协议会出错。前两项，原生币和 ETH 形态，是最常见的移植错。"]],["mETH 追回：防御成功",["第一个案例，是个正面例子，mETH 协议追回 cmETH。mETH 是 Mantle 生态的流动性再质押协议，cmETH 的赎回有八小时延迟。攻击者用 Bybit 被盗的资金发起 cmETH 赎回，第一个条件起作用了，提款有八小时延迟，攻击者的赎回被卡在延迟里。","第二个条件，团队有暂停和资产恢复权限，于是暂停合约，把一万五千个 cmETH 从攻击者地址转到恢复地址。","第三个条件，外部安全社区 SEAL 在数小时内发现并联系到了团队。这三个条件缺一不可，最终追回约四千三百万美元。","一个鲜明的对照是，同一起事件中，Bybit 被盗的大部分原生 ETH 无法追回。区别就在于，原生 ETH 没有延迟，而 cmETH 有。延迟把攻击从一瞬间，拉长成了一个可以响应的窗口。","但这个案例也有另一面。团队能把攻击者地址上的代币转走，这意味着团队也有能力转走任何一个用户的代币。这是一个中心化权限，必须向用户披露。延迟和暂停是可信中心化的工具，它保护了资金，也要求用户信任持有权限的人。设计时要回答，谁持有权限，有没有时间锁，被滥用时用户能否察觉。"]],["客户端层的漏洞",["第二个案例，客户端层的漏洞。这提醒我们，L2 的执行客户端本身，就是合约的一部分，它决定了 EVM 规则怎样在这条链上运行。OpenZeppelin 二零二四年四月对 Mantle op-geth 修改部分的审计，报告了三个严重问题，都已修复。","第一个最吓人，BVM_ETH 无限铸造。ETH 转账缺少溢出检查，一个负的大整数被当成正数写入，结果只存入一百个 ETH，可以获得两百个。第二个，交易成本计算遗漏了 Value 字段，一个复制粘贴错误使交易池接受付不起的交易，可以被垃圾交易填满造成 DoS。第三个，代付余额检查，对多笔代付交易逐笔检查余额，而不是检查总额，也能填满交易池。","教训很深。在 L2 上，合约的可信计算基础，也就是 TCB，包括 L2 客户端、证明系统和桥合约，而你的合约审计根本覆盖不到这些。而且原生币不是 ETH 这个设计，迫使客户端增加了大量新代码，比如 ETH 作为 ERC-20 的转账逻辑和 tokenRatio 换算，新代码就是新攻击面。所以在 L2 上开发，要把这些底层组件也纳入风险评估。"]],["延迟+暂停设计模式",["从 mETH 案例，可以提炼一个可复用的设计模式，把延迟加暂停做对。用户发起赎回后，进入请求状态。正常情况下，延迟期满就变成可领取，用户领取后结束。","关键在于，延迟期内如果守护者暂停或标记可疑，就进入冻结状态。复核通过可以恢复成请求，继续走正常流程。只有在治理加时间锁批准后，资产才转入恢复地址。注意，延迟期内资产仍在协议控制下，暂停只是阻止状态推进，并不转移资产。","有两条原则。恢复这条路径是最敏感的权限，它应该需要比暂停更高的门槛，更多签名、时间锁、公开公告。还有，延迟会降低资本效率，业界常见的折中是，小额即时赎回加大额排队赎回，或者按全局速率限制赎回。这个模式，其实就是第十集讲的把延迟当成安全参数来设计。"]],["三条链对比",["把三条链放在一起对比。类型上，BNB Chain 是独立 L1，用 PoSA 共识。TRON 也是独立 L1，用 DPoS。Mantle 是以太坊的 L2。虚拟机上，BNB 是标准 EVM，TRON 是 EVM 变体 TVM，Mantle 是 op-geth 分叉的 EVM。","原生币，BNB、TRX、MNT，其中 Mantle 上 ETH 是 ERC-20。最大的移植陷阱各不相同，BNB 是代币精度、区块数计时和分叉改动，TRON 是 USDT 返回值、资源模型和操作码开关，Mantle 是 msg.value 单位、ETH 形态和 L2 信任假设。","应急能力也不同，BNB 的验证者可以协调停链，TRON 靠超级代表提案，Mantle 的多签可以暂停提款。这张表告诉你一件事，通用的漏洞模式是相同的，但每条链的参数和信任假设不同，所以每迁移到一条新链，都要按它的差异重新做一遍检查。手册里的链迁移检查器，可以根据目标链和你的代码假设，生成一份迁移风险清单。"]],["全系列完结",["到这里，整个合约安全学习手册的视频就全部讲完了。回顾一下三个部分。评估篇 A01 到 A10，讲怎么看一个项目、给风险定级、写评估报告，这是上手就能用的方法。","主线 13 集，讲十二类漏洞的机制和防御，从重入、权限、算术，到预言机、签名、升级、跨链，最后用一张事故地图把它们串起来。","链专题 C00 到 C03，把这些通用方法，落到以太坊、BNB Chain、TRON、Mantle 每条链的具体差异上。","最后送大家三句话。第一，看穿共同的形状，绝大多数新事故，都是旧模式换了外衣。第二，写对不变量，工具能替你找出打破不变量的序列，但那条性质要你自己写对。第三，每迁移到一条新链都要重测，因为参数变了，安全假设就变了。希望这套手册，能帮你把安全，真正写进每一行代码和每一次迁移。谢谢观看，我们有缘再见。"]]]}}},{"id":"C04","title":"Solana：合约与账户安全专题","md":"../chains/C04-solana.md","v":{}},{"id":"C05","title":"Move（Sui / Aptos）：对象与资源安全专题","md":"../chains/C05-move-sui-aptos.md","v":{}},{"id":"C06","title":"TON 与 Telegram Mini App：异步消息与生态安全专题","md":"../chains/C06-ton-tma.md","v":{}},{"id":"C07","title":"Bitcoin：UTXO、元协议与二层安全专题","md":"../chains/C07-bitcoin.md","v":{}},{"id":"C08","title":"主流 Rollup 差异：OP Stack、Arbitrum 与非等效 zkEVM 安全专题","md":"../chains/C08-rollups-op-arb-zkevm.md","v":{}}]}];
const VIEWS = [
  ['vs', '视频', '拟物化'], ['v3', '视频', '3b1b'], ['vt', '视频', '讲解页'],
  ['talk', '幻灯', '讲解页'], ['deck', '幻灯', '拟物化'], ['d3b', '幻灯', '3b1b'],
];
const isVideo = k => k[0] === 'v';
const ALL = GROUPS.flatMap(g => g.items);
const $ = id => document.getElementById(id);
const v = $('v'), f = $('f'), script = $('script');
const store = { get(k) { try { return localStorage.getItem('w3sec-player-' + k); } catch (e) { return null; } }, set(k, x) { try { localStorage.setItem('w3sec-player-' + k, x); } catch (e) {} } };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const fmt = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

let cur = null, view = null, step = [0, 0], autoTimer = 0;

// ---------- 目录 ----------
function renderList() {
  const q = $('q').value.trim().toLowerCase(), only = $('only').checked;
  $('list').innerHTML = GROUPS.map((g, gi) => {
    const items = g.items.filter(e => (!q || (e.id + ' ' + e.title).toLowerCase().includes(q)) && (!only || VIEWS.some(([k]) => isVideo(k) && e.v[k])));
    if (!items.length) return '';
    const nv = g.items.filter(e => VIEWS.some(([k]) => isVideo(k) && e.v[k])).length;
    return `<details class="g" open><summary><span>${esc(g.name)}</span><small>${nv ? '▶ ' + nv + ' / ' : ''}${g.items.length}</small></summary>` +
      items.map(e => {
        const nV = VIEWS.filter(([k]) => isVideo(k) && e.v[k]).length, nS = VIEWS.filter(([k]) => !isVideo(k) && e.v[k]).length;
        const k = [nV ? '▶' + nV : '', nS ? '▤' + nS : ''].filter(Boolean).join(' ');
        return `<button class="it${nV + nS ? '' : ' none'}" data-id="${e.id}"${cur && cur.id === e.id ? ' aria-current="true"' : ''} title="${esc(e.title)}"><b>${e.id}</b><span class="t">${esc(e.title)}</span><span class="k">${k}</span></button>`;
      }).join('') + '</details>';
  }).join('') || '<p class="mut" style="padding:8px">没有匹配的章节。</p>';
}
$('list').addEventListener('click', e => { const b = e.target.closest('.it'); if (b) open(b.dataset.id); });
$('q').addEventListener('input', renderList);
$('only').addEventListener('change', () => { store.set('only', $('only').checked ? '1' : ''); renderList(); });

// ---------- 打开一章 ----------
function open(id, want) {
  const e = ALL.find(x => x.id === id) || ALL[0];
  cur = e;
  $('title').innerHTML = `<small>${e.id}</small>${esc(e.title)}`;
  $('md').href = e.md;
  document.title = e.id + ' ' + e.title + ' · Web3 安全视频';
  store.set('id', e.id);
  const pref = [want, store.get('view'), ...VIEWS.map(x => x[0])];
  renderList();
  const cb = $('list').querySelector('[aria-current]'); if (cb) cb.scrollIntoView({ block: 'nearest' });
  show(pref.find(k => k && e.v[k]) || null, false);
}

function renderViews() {
  const groups = {};
  VIEWS.forEach(([k, grp, label], i) => (groups[grp] = groups[grp] || []).push(
    `<button data-k="${k}" aria-pressed="${k === view}" ${cur.v[k] ? '' : 'disabled title="这一章没有这种版本"'}>${label}<span class="mut" style="margin-left:4px">${i + 1}</span></button>`));
  $('views').innerHTML = Object.entries(groups).map(([g, bs]) => `<div class="seg" role="group" aria-label="${g}"><span>${g}</span>${bs.join('')}</div>`).join('');
}
$('views').addEventListener('click', e => { const b = e.target.closest('button[data-k]'); if (b && !b.disabled) { store.set('view', b.dataset.k); show(b.dataset.k, true); } });

function show(k, keepTime) {
  stopAuto();
  const t = keepTime && view && isVideo(view) && k && isVideo(k) ? v.currentTime : 0;
  view = k; renderViews();
  const d = k && cur.v[k];
  v.hidden = f.hidden = true; $('empty').hidden = !!d;
  v.pause();
  $('rate').hidden = !(k && isVideo(k));
  $('auto').hidden = k !== 'talk';
  location.hash = cur.id + (k ? '/' + k : '');
  if (!d) { v.removeAttribute('src'); f.removeAttribute('src'); script.innerHTML = '<p class="note">这一章暂时没有视频或幻灯片。</p>'; return; }
  if (isVideo(k)) {
    f.removeAttribute('src');
    v.hidden = false; v.src = d.src; v.playbackRate = +$('rate').value;
    if (t) v.addEventListener('loadedmetadata', () => { v.currentTime = Math.min(t, v.duration - 1); }, { once: true });
  } else {
    v.removeAttribute('src'); v.load();
    f.hidden = false; step = [0, 0]; f.src = d.src;
  }
  renderScript();
}

// ---------- 讲稿 ----------
function renderScript() {
  const d = cur.v[view];
  script.classList.toggle('click', view !== 'deck' && view !== 'd3b');
  if (isVideo(view)) {
    if (!d.cues.length) { script.innerHTML = '<p class="note">这个视频没有字幕文件。</p>'; return; }
    const ch = d.ch || []; let ci = 0, html = '';
    d.cues.forEach(([a, b, txt], i) => {
      while (ci < ch.length && ch[ci][0] <= a + .01) { html += `<h4><i>${fmt(ch[ci][0])}</i>${esc(ch[ci][1])}</h4>`; ci++; }
      html += `<p data-i="${i}" data-t="${a}"><i>${fmt(a)}</i>${esc(txt)}</p>`;
    });
    script.innerHTML = html;
  } else if (view === 'talk') {
    script.innerHTML = d.scenes.map(([t, lines], si) => `<h4><i>${si + 1}</i>${esc(t)}</h4>` + lines.map((l, st) => `<p data-si="${si}" data-st="${st}">${esc(l)}</p>`).join('')).join('');
    markStep();
  } else {
    script.innerHTML = '<p class="note">在画面里用 ← / → 或画面下方按钮翻页，画面右侧也有本页讲稿。</p>' +
      d.scenes.map(([t, lines], i) => `<h4><i>${i + 1}</i>${esc(t)}</h4>` + lines.map(l => `<p>${esc(l)}</p>`).join('')).join('');
  }
}
script.addEventListener('click', e => {
  const p = e.target.closest('p'); if (!p) return;
  if (p.dataset.t !== undefined) { v.currentTime = +p.dataset.t; v.play().catch(() => {}); }
  else if (p.dataset.si !== undefined) send({ deckCmd: 'go', si: +p.dataset.si, st: +p.dataset.st });
});
function highlight(p) {
  script.querySelectorAll('p.now').forEach(x => x !== p && x.classList.remove('now'));
  if (p && !p.classList.contains('now')) {
    p.classList.add('now');
    const r = p.getBoundingClientRect(), s = script.getBoundingClientRect();
    if (r.top < s.top || r.bottom > s.bottom) script.scrollTop += r.top - s.top - s.height / 3;
  }
}
v.addEventListener('timeupdate', () => {
  if (!isVideo(view)) return;
  const cues = cur.v[view].cues, t = v.currentTime; let i = -1;
  for (let j = 0; j < cues.length && cues[j][0] <= t; j++) i = j;
  highlight(i >= 0 ? script.querySelector(`p[data-i="${i}"]`) : null);
});
v.addEventListener('ended', () => { const i = ALL.indexOf(cur); if (i < ALL.length - 1 && ALL[i + 1].v[view]) open(ALL[i + 1].id, view); });

// ---------- 讲解页幻灯：与 iframe 内的 player.js 通信 ----------
const send = m => { if (f.contentWindow) f.contentWindow.postMessage(m, '*'); };
function markStep() { highlight(script.querySelector(`p[data-si="${step[0]}"][data-st="${step[1]}"]`)); }
addEventListener('message', e => {
  if (e.source !== f.contentWindow || !e.data || !e.data.deckStep) return;
  step = e.data.deckStep;
  if (view === 'talk') { markStep(); if (autoTimer) scheduleAuto(); }
});
// 自动翻页：按讲稿字数估算口播时长（约 290 字 / 分钟，与渲染脚本一致）
function lineAt() { const s = cur.v.talk.scenes[step[0]]; return s ? s[1][step[1]] || '' : ''; }
function isLast() { const sc = cur.v.talk.scenes; return step[0] === sc.length - 1 && step[1] === sc[sc.length - 1][1].length - 1; }
function scheduleAuto() {
  clearTimeout(autoTimer);
  autoTimer = setTimeout(() => { if (isLast()) stopAuto(); else send({ deckCmd: 'next' }); }, Math.max(2, lineAt().length / 290 * 60 + .8) * 1000);
}
function stopAuto() { clearTimeout(autoTimer); autoTimer = 0; $('auto').setAttribute('aria-pressed', 'false'); $('auto').textContent = '⏵ 自动翻页'; }
$('auto').addEventListener('click', () => {
  if (autoTimer || view !== 'talk') return stopAuto();
  $('auto').setAttribute('aria-pressed', 'true'); $('auto').textContent = '⏸ 停止翻页'; scheduleAuto();
});

// ---------- 控件与快捷键 ----------
function go(d) { const i = ALL.indexOf(cur) + d; if (i >= 0 && i < ALL.length) open(ALL[i].id, view); }
$('prev').onclick = () => go(-1);
$('next').onclick = () => go(1);
$('rate').onchange = () => { v.playbackRate = +$('rate').value; };
$('fs').onclick = () => { const el = $('stage'); (document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen()).catch(() => {}); };
$('bs').onclick = () => { script.hidden = !script.hidden; $('bs').setAttribute('aria-pressed', String(!script.hidden)); };
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  const k = e.key;
  if (k === 'n' || k === 'N') go(1);
  else if (k === 'p' || k === 'P') go(-1);
  else if (k === 's' || k === 'S') $('bs').click();
  else if (k === 'f' || k === 'F') $('fs').click();
  else if (/^[1-6]$/.test(k)) { const x = VIEWS[+k - 1][0]; if (cur.v[x]) { store.set('view', x); show(x, true); } }
  else if (view && isVideo(view)) {
    if (k === ' ' && e.target !== v) { e.preventDefault(); v.paused ? v.play() : v.pause(); }
    else if (k === 'ArrowRight' && e.target !== v) { e.preventDefault(); v.currentTime += 5; }
    else if (k === 'ArrowLeft' && e.target !== v) { e.preventDefault(); v.currentTime -= 5; }
  } else if (view === 'talk') {
    if (k === 'ArrowRight' || k === ' ') { e.preventDefault(); send({ deckCmd: 'next' }); }
    else if (k === 'ArrowLeft') { e.preventDefault(); send({ deckCmd: 'prev' }); }
  }
});

// ---------- 启动 ----------
$('only').checked = !!store.get('only');
const fromHash = () => decodeURIComponent(location.hash.slice(1)).split('/');
const [hid, hview] = fromHash();
open(ALL.some(e => e.id === hid) ? hid : (store.get('id') || ALL[0].id), hview);
// 地址栏改了 #章/方式（或浏览器前进后退）时跟着切换；自己写入的 hash 不会触发重开
addEventListener('hashchange', () => {
  const [id, k] = fromHash();
  if (!ALL.some(e => e.id === id)) return;
  if (id !== cur.id) open(id, k);
  else if (k && k !== view && cur.v[k]) show(k, true);
});
</script>
</body>
</html>
