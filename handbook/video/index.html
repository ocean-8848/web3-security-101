328.76,"到了 2025、2026 年，最大的几起损失，出在签名界面"],[328.76,330.65,"社工和签名服务上"],[331.1,335.83,"Bybit 约 15 亿美元。2026 年 Binance 热钱包"],[335.83,340.34,"按项目方口径约 63 亿美元，是史上最大的一起"],[340.79,345.47,"但代码漏洞并没有消失。2025 年的 Balancer"],[345.47,347.73,"就在舍入方向上出了错"],[349.43,352.31,"回到开头的问题：Bybit 事故里"],[352.31,354.73,"多签合约的代码有漏洞吗？"],[355.18,358.43,"公开分析没有指向合约代码的漏洞"],[358.43,361.9,"合约忠实地执行了签名人签下的交易"],[362.35,366.21,"失守的是前端和签名界面。被篡改的前端"],[366.21,370.71,"让一笔替换多签实现的交易，看起来像日常操作"],[371.16,374.88,"所以，Web3 安全不只是合约代码"],[374.88,380.44,"它覆盖资产的整个生命周期：链和基础设施，钱包"],[380.44,381.45,"人和流程"],[381.9,387.35,"带走一个问题就够了：攻击者能控制什么？它对代码成立"],[387.35,392.14,"对代码之外也成立。前提是，你把代码之外的环节"],[392.14,393.45,"也画进地图里"],[393.9,398.02,"下一集，我们从私钥从哪里来，讲起"]],"ch":[]},"talk":{"src":"slides/EP01-security-landscape.html","scenes":[["开场",["大家好，欢迎来到合约安全主线第1集。这一集是整个系列的地图。先记住一句话。智能合约是一段公开的、不可撤回的、直接控制资金的代码。任何人都可以用任意参数、任意顺序调用它。","看三起事故，以下据公开报道，金额为当时的估值。2016年，以太坊上的 The DAO 被盗约6000万美元，根因是重入，一个纯粹的代码漏洞。","2022年，Ronin 跨链桥被盗约6.2亿美元，根因是验证者私钥被拿到。","2025年，Bybit 被盗约14.6亿美元，根因是签名界面被篡改。从代码漏洞，到私钥，到签名界面，损失越来越大，也越来越不在代码里。这一集，我们把整张地图画出来。"]],["主线路线图",["主线一共13集，分五层。第一层是地图，就是本集的安全全景，和下一集的 EVM 与 Solidity 基础。","第二层是经典漏洞，重入、权限、算术精度和外部调用，每类一集。","第三层是 DeFi 攻击，预言机与闪电贷，MEV 与签名。","第四层是系统级问题，可升级合约与代理，DeFi 经济安全，跨链桥。","第五层是工程与复盘，审计测试流程，以及事故案例库。另外还有链专题4集，讲以太坊、BNB Chain、TRON 和 Mantle 的差异。","本集的路线是，一个比喻，三个区别，一张攻击面地图，六大类漏洞，攻击者能做什么，怎样做威胁建模，最后看损失趋势和四条链。"]],["广场中央的售货机",["打个比方。智能合约像一台放在广场中央的自动售货机。机器里装着真金白银，就是合约的余额。机器的电路图贴在外壳上，谁都能看，因为合约代码是公开的。","全世界的人都可以全天候来投币、按按钮、拍打机器，因为任何人都可以调用公开函数。","机器一旦装好，就不能打开维修，合约默认不可变。如果留了一扇维修门，也就是升级功能，那么维修门的钥匙本身就成了攻击目标。","机器吐错了钱，没有客服可以追回，因为交易不可逆。","比喻不准的地方在于，真实的售货机一次只服务一个人。合约在一笔交易里，可以被同一个人反复调用、嵌套调用，还可以和其他几十台售货机组合使用。这种可组合性，正是很多漏洞的来源。"]],["和 Web2、CEX 有什么不同",["和 Web2 后端、中心化交易所相比，合约有几个根本不同。第一，代码公开。合约的字节码一定公开，源码通常也公开。攻击者和你看的是同一份代码。","第二，谁都能调。Web2 的接口要先鉴权，交易所要先做身份认证。合约的公开函数，就是对全世界开放的接口，任何地址、任何合约都能调用。没有边界防火墙。","第三，不能回滚。Web2 出错可以改数据库，交易所可以改内部账本。合约交易不可逆，修复只能靠升级，没有升级权限就修不了。","第四，攻击成本极低。攻击者只需要一笔交易的 gas 费。失败的后果也不同，资金被直接转走，通常没有赔付。下面算一算，为什么连本金都不需要。"]],["攻击者为什么不需要本金",["闪电贷，是在同一笔交易内借出、并且必须归还的无抵押贷款。交易结束时没还上，整笔交易回滚，就像什么都没发生过。","来算一个示例。攻击者借1亿美元的稳定币，示例手续费是万分之五，就是5万美元。","他用这1亿去推动一个价格，或者撑大一个余额，在同一笔交易里，从某个协议里取出比应得更多的钱，然后归还1亿，加5万手续费。","如果失败呢？交易回滚，他只损失 gas 费。成功了，赚走差价。所以，凡是按当前余额或当前价格计算的量，在攻击者眼里都是可控的输入。这在第8集详细讲。"]],["攻击面地图",["一笔交易从发出到执行，会经过这些环节。用户或攻击者的账户，先经过钱包和前端的签名界面，然后进入内存池公开排队，再由区块构建者或者排序器决定顺序，最后到达目标合约。","目标合约会调用外部合约，比如代币、DEX 和预言机。注意这条回来的箭头，外部合约可以在你的函数执行中途调回来。重入就发生在这里。","目标合约可能是一个代理，背后有升级权限。它还可能通过跨链桥，把消息发到另一条链上的合约。","红色的节点是信任边界，数据和控制权在这里跨越，漏洞最集中。签名界面、内存池、外部合约、升级权限和跨链桥。还要注意，这张图没画链本身的共识层。链被攻破时，合约代码再正确也没用。"]],["漏洞六大类",["漏洞可以分六大类。第一类，控制流，外部调用让攻击者插队执行，比如重入和回调。第二类，权限，不该调用的人调用了，比如缺少修饰器、用了交易发起人做鉴权，或者合约没初始化。","第三类，数学，数字算错了，比如溢出、精度损失、舍入方向和金库通胀。第四类，数据可信度，合约相信了可以被操纵的数据，比如现货价格、闪电贷撑大的余额、被重放的签名。","第五类，经济设计，代码完全按规格执行，但规格本身可以被套利，比如治理攻击和清算漏洞。第六类，系统与运营，代码之外的环节失守，比如跨链验证、多签私钥、前端篡改，甚至编译器的 bug。真实事故通常是多类叠加，所以审计不能只按清单逐项打勾。"]],["攻击者能做什么",["威胁建模的起点，是攻击者能做什么。对任意一个合约，默认攻击者能做到七件事。第一，用任意参数调用任意公开函数。第二，部署自己的合约，让你的合约去调用它，比如恶意代币和恶意回调。","第三，在一笔交易内借到巨额资金。第四，看到内存池里待确认的交易，在它前后插入自己的交易。","第五，不经过你的函数，直接向你的合约转入代币。很多合约把余额当作账本，这一条就会打破它。第六，读取你合约的全部存储，包括声明为 private 的变量。第七，在另一条链或另一个合约上，重放你签过的消息。","攻击者通常不能做到的有三件。伪造别人的签名，除非私钥泄露或者签名验证写错了。修改已经确认的区块，除非链的共识被攻破。让消息发送者变成别人，除非你的代码用了交易发起人来鉴权。"]],["private 不等于保密",["来看第六件事的一个示例。一个合约声明了一个私有变量，值是42，放在存储的第0个槽位。","private 这个关键字，只是不让其他合约通过函数读取它，并不是加密。","任何人都可以调用节点的一个标准接口，读取这个合约第0个槽位的原始数据。返回的值，末尾是十六进制的2a，也就是42。","所以，永远不要把密码、随机数种子或者私钥放在合约存储里，哪怕声明为 private。链上没有秘密。"]],["威胁建模六步",["知道了攻击者的能力，就可以做威胁建模，一共六步。第一，列出合约持有的资产，比如用户存入的 USDT 和协议手续费。第二，列出每个改变资产的函数，标注谁可以调用。","第三步最关键，写出不变量，也就是任何操作之后都必须成立的式子。比如，合约的 USDT 余额，不小于所有用户存款之和。示例里三个用户分别存了100、250和50，合计400，合约余额也是400，成立。","假如某个提款函数有 bug，让一个用户多提了50。账本上存款之和还是400，合约余额却只剩350。不变量被打破，问题就暴露了。不变量是整个安全工作的锚点，所有测试最终都在验证它。","后三步，对每个函数问三个问题。外部调用之前，状态更新了吗？价格、余额、签名这些外部数据，一笔交易内能被操纵吗？每个特权角色的私钥在谁手里，被盗后最大损失是多少？"]],["损失的规模与趋势",["看损失的趋势，以下据公开报道和安全公司统计。早期事故集中在代码漏洞。2016年 The DAO 是重入。2017年 Parity 多签库被自毁，约51万个 ETH 被永久冻结，根因是初始化和权限。","2021到2022年，最大的事故转向跨链桥。Poly Network 约6.1亿美元，后来归还了。Ronin 约6.2亿美元。BNB Chain 的 Token Hub 被凭空增发了200万个 BNB。","2023年，Euler 约1.97亿美元，是业务逻辑问题。2025年，Bybit 约14.6亿美元，问题在签名界面，代码审计覆盖不到。","同在2025年，成熟协议 Balancer 因为舍入问题损失约1.28亿美元。所以数学精度类漏洞并没有消失。编译器和库成熟后，简单的代码漏洞少了，但最大的损失转向了跨链桥和运营安全。"]],["以太坊与三条链",["本系列的扩展案例以以太坊为参照，再延伸到三条链。以太坊是一层网络，EVM 的原件，绝大多数漏洞模式都在这里首发。","BNB Chain 是独立的一层网络，EVM 兼容，字节码兼容，但出块时间等参数不同。重点是分叉项目改参数出错，以及低流动性的预言机。","TRON 用的是 TVM，Solidity 可以编译，但部分操作的语义不同。重点是 USDT 的返回值、能量模型和账户权限。","Mantle 是以太坊的二层网络，原生 gas 代币是 MNT，所以合约里收到的原生币是 MNT，不是 ETH。把以太坊上审计过的合约原样部署到另一条链，审计结论不能直接复用。"]],["练一练",["来练一练。为你熟悉的借贷协议写出三个不变量。先暂停想一想。","参考答案。第一，偿付，协议持有的资产加上未偿还的借款，不小于用户存款总额。第二，健康，任何一次操作之后，每个账户的健康因子都不小于1，否则交易回滚。第三，守恒，份额总量等于每个用户的份额之和，不会凭空增加或减少。后面每一集讲的漏洞，几乎都是在打破这样的某一条式子。"]],["小结与预告",["小结三点。第一，合约是公开的、不可撤回的、直接控制资金的代码，任何人都可以用任意参数调用。","第二，从攻击者能控制什么出发做威胁建模。链上没有秘密，闪电贷让本金不再是门槛。","第三，不变量是整个安全工作的锚点。最大的损失，正在从代码漏洞转向跨链桥和运营安全。","下一集讲 EVM 与 Solidity 的安全基础。三种调用方式，存储布局，以及八个语言层面的易错特性。理解合约运行的机器，才能理解漏洞从哪里来。下集见。"]]]},"deck":{"src":"../decks/skeuomorphic/ch01/index.html","scenes":[["Bybit 损失约 15 亿",["2025 年 2 月，Bybit 的多签签名人，签了一笔看起来很正常的交易。","可他们用的 Safe 钱包网页前端，已经被人篡改了。","签下去的这笔交易，替换了多签的实现合约。","约 15 亿美元，就这样被转走。"]],["先猜一道题",["先请你猜一猜。Safe 多签合约的代码，有没有被利用的漏洞？","如果没有，钱又是从哪里漏出去的？"]],["本集要回答三个问题",["这一集是整个系列的入口。我们要回答三个问题。","合约安全和传统安全，到底哪里不一样？","攻击会从哪些地方进来？","怎么站在攻击者的角度，给一个系统建模？","开头那个问题的答案，留到最后揭晓。"]],["智能合约是什么",["先给一个准确的定义。","智能合约，是部署在区块链上、按代码自动执行的程序。它可以持有资产，也可以转出资产。","压成一句话就是：一段公开的、不可撤回的、直接控制资金的代码。","任何人，都可以用任意参数、任意顺序调用它。"]],["广场中央的自动售货机",["打个比方。它像一台放在广场中央的自动售货机。","机器里装着真金白银，这就是合约余额。","电路图贴在外壳上，谁都能看。合约的字节码一定公开，源码通常也公开。","全世界的人，可以全天候来投币、按按钮、拍打机器。"]],["装好就不能打开维修",["机器装好以后，就不能打开维修。","如果留了维修门，也就是升级代理，这把钥匙本身就成了攻击目标。","机器吐错了钱，没有客服能帮你追回。交易是不可逆的。"]],["比方不成立的地方",["但这个比方有个地方不成立。真实的售货机，一次只服务一个人。","合约在一笔交易里，可以被同一个人反复调用、嵌套调用。","它还能和几十台别的售货机，拼在一起用。这叫可组合性。很多漏洞，正是从这里来的。"]],["区别一：谁能调用",["拿它和 Web2 后端、中心化交易所比一比，最关键的区别有三个。","第一，谁能调用。Web2 要先鉴权，交易所要先过 KYC。","合约面前，任何地址、任何合约都能来。public 函数，就是对全世界开放的 API。"]],["区别二：出错能否回滚",["第二，出错能不能回滚。Web2 可以改数据库，交易所可以改内部账本。","合约的交易不可逆，只能靠升级，或者社会共识。没有升级权限，就修不了。"]],["区别三：攻击成本",["第三，攻击成本。在别处，要绕过防火墙，或者攻破内部系统。","在合约这里，只需要一笔交易的 gas。闪电贷还能在一笔交易里，借到上亿美元的本金。","能升级，是修复能力，也是攻击面。升级密钥，可能被盗。","交易所也躲不开合约安全。它的冷钱包，可能就是一个多签合约，比如开头的 Safe。"]],["跟着一笔交易走",["知道了合约是什么，我们跟着一笔交易，看攻击从哪里进来。","用户或者攻击者的账户，先经过钱包和前端的签名界面。","交易进入内存池，在那里公开排队。","区块构建者或者排序器，决定它和别的交易谁先谁后。","然后它到达目标合约，执行业务逻辑。"]],["外部合约、升级与跨链",["目标合约会去调用外部合约，比如代币、DEX、预言机。它背后还连着代理和实现，也就是升级权限。","有的交易，还要经过跨链桥，去到另一条链上的合约。"]],["五个信任边界",["这条路上，有五个地方最危险：签名界面、内存池、外部合约、升级权限、跨链桥。","它们叫信任边界。数据和控制权在这里跨过去，漏洞也最集中。"]],["回调、顺序与图的局限",["注意一个往回走的箭头。外部合约可以在你的函数执行到一半时，调回你的合约。重入就发生在这里。","内存池和构建者决定交易的顺序。顺序本身，也可以被利用。","这张图也有局限。它没画链本身的共识和节点。","链被攻破，或者节点数据有误，合约写得再对也没用。"]],["六大类：控制流与权限",["沿着这张图，可以把漏洞归成六大类。","第一类，控制流。外部调用让攻击者插队执行，比如重入。","第二类，权限。不该调用的人调用了，比如缺少修饰器、合约未初始化、私钥泄露。"]],["数学与数据可信度",["第三类，数学。数字算错了，比如溢出、精度损失、舍入方向。","第四类，数据可信度。合约相信了可以被操纵的数据，比如现货价格预言机、签名重放。"]],["经济设计与系统运营",["第五类，经济设计。代码按规格执行，但规格本身可以被套利。","第六类，系统与运营。代码之外的环节失守，比如跨链验证、多签私钥、前端篡改、社会工程。"]],["真实事故往往几类叠加",["真实事故往往是几类叠加。2023 年的 Euler，就是业务逻辑缺陷，加上闪电贷放大。","第六类，又可以拆成两块。一块是链本身，和你读链的方式。另一块是人、设备和流程。","社工常常是入口，私钥或者前端是落点。AI 不是独立的攻击面，而是攻防两边的放大器。"]],["早期：代码漏洞为主",["六大类里，钱到底丢在哪儿？我们看损失的变化。","先说口径。下面的数字来自公开报道和安全公司的年度统计，按事发时的美元估值，都是约数。","2016 年，The DAO 因为重入，损失约 6000 万美元。","那几年多是重入、溢出这类代码漏洞。编译器和库成熟以后，这类漏洞少了。"]],["大额损失转向运营",["2022 年，Ronin 跨链桥损失约 6.2 亿美元，原因是验证者私钥。","2024 年，DMM Bitcoin 损失约 3.05 亿美元。入口是假招聘，落点是供应商的终端。","2025 年，就是开头的 Bybit，约 15 亿美元，出在前端和签名界面。"]],["Binance 热钱包事件",["2026 年 10 月，Binance 热钱包损失约 63.4 亿美元。这是项目方的口径。","按这个口径，它超过此前任何单起事故的 4 倍。"]],["趋势与仍在的数学漏洞",["趋势很清楚。最大的损失，从代码漏洞，转向了跨链桥和运营安全。","私钥、多签、前端、社工、内部人。代码审计，覆盖不到这些环节。","但数学类漏洞并没有消失。2025 年的 Balancer V2，在舍入方向上出了错。","项目方口径约 9480 万美元，早期报道约 1.28 亿。成熟的协议，也会在这里出错。"]],["威胁建模",["入口这么多，怎么系统地去想？办法是威胁建模。","威胁建模，就是在写代码之前，列出攻击者能控制的输入、能触发的路径、想得到的结果。","核心只有一个问题：攻击者能控制什么？"]],["默认攻击者能做到",["对任何合约，都先默认攻击者能做到这些事。","用任意参数，调用任意一个公开函数。","部署自己的合约，让你的合约去调用它，比如恶意代币、恶意回调。","在一笔交易里，借到巨额资金。"]],["攻击者还能做到",["看到内存池里还没确认的交易，在它前后插入自己的交易。","不经过你的函数，直接往你的合约里转入代币。","读取你合约的全部存储，包括标成 private 的变量。","在另一条链或另一个合约上，重放你签过的消息。"]],["先猜：private 变量",["举个例子。管理员密码存在 private 变量里，攻击者读得到吗？"]],["答案：读得到",["读得到。private 只限制别的合约来调用这个变量，不隐藏链上数据。"]],["攻击者通常做不到",["反过来，攻击者通常做不到三件事。","伪造别人的签名，除非私钥泄露，或者验签写错了。","修改已经确认的区块，除非链的共识被攻破。","让合约以为调用者是别人，除非你的代码用错了身份判断的方式。"]],["建模六步：资产与不变量",["有了这张能力清单，建模分六步。","第一，列出合约持有的资产，比如用户存进来的 USDT、协议手续费。","第二，列出每个会改变资产的函数，标上谁能调用。","第三，写出不变量，也就是任何操作之后，都必须成立的式子。","比如，合约里的 USDT 余额，不少于所有用户存款之和。"]],["建模六步：逐项追问",["第四，对每个函数问：攻击者控制哪些输入？有哪些外部调用？调用之前，状态更新了没有？","第五，对每个外部数据问：价格、余额、签名从哪里来？一笔交易里能不能被操纵？","第六，对每个特权角色问：私钥在谁手里？被盗了最多损失多少？有没有时间锁？"]],["不变量是安全工作的锚点",["不变量是整个安全工作的锚点。所有测试，最后都在验证它。","这个方法也有局限。威胁建模靠人的想象力。","经济攻击常常超出单个合约，要把整个协议和外部市场放在一起建模。"]],["每个角色今天做一件事",["最后，按角色，每个人今天都能做一件事。","写合约的人，给你的合约写下一条不变量，再找出每一个可能打破它的函数。","做审计的人，别只照清单打勾。问一问，这个问题是不是几类叠加。","管钱包和运营的人，问自己：最大的一笔资产，私钥在谁手里？被盗了最多损失多少？","普通用户，记住开头那一幕。签名时看到的屏幕，也可能被篡改。"]],["答案：不是合约代码漏洞",["回到开头的问题。Safe 合约的代码，有没有被利用的漏洞？","公开分析没有指向合约代码的漏洞。合约忠实地，执行了签名人签下的交易。","它属于第六类，系统与运营。失守的，是前端和签名界面。"]],["代码写对了，钱照样可能丢",["这个答案依据的，是公开分析。它说明一件事：代码写对了，钱照样可能丢。","这也是为什么，这个系列不只讲合约代码。"]]]},"d3b":{"src":"../decks/3b1b/ch01.html","scenes":[["Bybit：一笔日常交易，约 15 亿美元被转走",["2025 年 2 月，Bybit 的多签签名人，签了一笔看起来很日常的交易。","几分钟后，大约 15 亿美元被转走。"]],["问题：多签合约的代码有漏洞吗？",["问题来了：这份多签合约的代码，有漏洞吗？","先记住这个问题。我们从头搭一张地图，最后再回来回答它。"]],["智能合约的四个特点",["先看智能合约本身。它是部署在区块链上、按代码自动执行的程序。","它有四个特点：代码公开，资金就在里面，任何人都能调用，交易不能撤回。"]],["比方：广场中央的自动售货机",["打个比方，它像放在广场中央的一台自动售货机。","电路图贴在外壳上，人人都能看。全世界的人，随时可以来投币、按按钮。","机器吐错了钱，没有客服帮你追回。"]],["比方不成立处：合约可以被嵌套调用",["但这个比方有一处不成立：售货机一次只服务一个人。","合约在一笔交易里，可以被反复调用、嵌套调用，还能和几十个别的合约拼在一起用。很多漏洞，就藏在这里。"]],["和 Web2 不同：谁能调用，能否回滚",["这和传统的 Web2 后端有什么不同？看三件事。","第一，谁能调用。Web2 的接口先鉴权；合约的公开函数，对全世界开放。","第二，出错能不能回滚。Web2 可以改数据库；链上的交易，不可逆。"]],["攻击成本：一笔手续费，不需要本金",["第三，攻击成本。攻击合约，只要付一笔交易的手续费。","闪电贷还能在同一笔交易里，免费借到上亿美元的本金，用完当场还上。","所以，合约没有防火墙，攻击者也不需要本金。"]],["一笔交易：钱包、内存池、区块构建者",["那么，一笔交易从发出到执行，会经过哪些环节？","用户在钱包和前端里签名。交易进入公开排队的内存池。","区块构建者决定顺序。打包之后，交易才到达目标合约。"]],["五处信任边界，漏洞最集中",["目标合约还会调用外部合约，比如代币、交易所、预言机；也可能经过代理合约，或者跨链桥，去到另一条链。","这里面有五处信任边界：数据和控制权在这里换手。漏洞最集中的地方，就在这里。","注意这条往回走的箭头：外部合约可以在你的函数执行到一半时调回来。重入攻击，就发生在这里。"]],["漏洞六类之一到三：控制流、权限、数学",["把历史上的漏洞归归类，大致是六类。","控制流：外部调用让攻击者插队执行。权限：不该调用的人，调用了。数学：数字算错了。"]],["之四到六：数据、经济设计、系统与运营",["数据可信度：合约相信了可以被操纵的数据，比如现货价格。经济设计：代码按规格执行，但规格本身能被套利。","最后一类，系统与运营：代码之外的环节失守，比如私钥、多签、前端和社工。","真实事故往往是几类叠加。比如 2023 年的 Euler，是业务逻辑缺陷，加上闪电贷放大。所以审计不能只照着清单打勾。"]],["攻击者能控制什么",["怎样系统地找漏洞？换个角度，只问一句：攻击者能控制什么？","默认攻击者能做到这些：用任意参数，调用任意公开函数；部署自己的合约，让你的合约去调用它。","用闪电贷借到巨款；看到内存池里的交易，在它前后插队。","不经过你的函数，直接往合约里转钱；读取合约的全部存储；在别的链上，重放你签过的消息。"]],["private 不隐藏数据；签名伪造不了",["这里有个常见误解：私有变量，攻击者也能读到。private 只限制别的合约调用它，不会隐藏链上数据。","攻击者通常做不到的是：伪造别人的签名、改写已确认的区块、冒充别人的地址。前提是私钥没有泄露，代码也没有写错。"]],["威胁建模：资产、函数、不变量",["有了这张能力清单，就可以做威胁建模。","先列出合约持有的资产，再列出每个改变资产的函数，标出谁能调用。","然后是最关键的一步：写出不变量，也就是任何操作之后，都必须成立的式子。","比如：合约的 USDT 余额，必须大于等于所有用户存款之和。"]],["不变量是安全工作的锚点",["接着对每个函数追问：外部调用、外部数据、特权角色、数学运算，哪一个能打破这个式子？","最后，用模糊测试和不变量测试去验证它。不变量，是整个安全工作的锚点。"]],["损失从代码漏洞，转向跨链桥和私钥",["现在看看，损失往哪里走。","早期的大事故，集中在代码漏洞。2016 年的 The DAO，是重入，损失约 6000 万美元。","后来，最大的损失转向跨链桥和私钥。2022 年的 Ronin 跨链桥，约 6.2 亿美元，原因是验证者私钥失守。"]],["2025、2026：签名界面、社工、签名服务",["到了 2025、2026 年，最大的几起损失，出在签名界面、社工和签名服务上。","Bybit 约 15 亿美元。2026 年 Binance 热钱包，按项目方口径约 63 亿美元，是史上最大的一起。","但代码漏洞并没有消失。2025 年的 Balancer，就在舍入方向上出了错。"]],["答案：合约没漏洞，失守的是前端和签名界面",["回到开头的问题：Bybit 事故里，多签合约的代码有漏洞吗？","公开分析没有指向合约代码的漏洞。合约忠实地执行了签名人签下的交易。","失守的是前端和签名界面。被篡改的前端，让一笔替换多签实现的交易，看起来像日常操作。"]],["覆盖整个生命周期：把代码之外也画进地图",["所以，Web3 安全不只是合约代码。它覆盖资产的整个生命周期：链和基础设施，钱包、人和流程。","带走一个问题就够了：攻击者能控制什么？它对代码成立，对代码之外也成立。前提是，你把代码之外的环节，也画进地图里。"]]]}}},{"id":"02","title":"密码学基础与实现风险：私钥的随机性从哪里来","md":"../chapters/02-cryptography-randomness.md","v":{"vs":{"src":"skeuo/ep02/out/ep02-full.mp4","cues":[[1.65,2.94,"2022 年 9 月"],[2.98,4.52,"Wintermute 的金库被盗"],[4.54,5.84,"约 1.6 亿美元"],[6.84,8.13,"这个金库的地址"],[8.14,11.05,"是用一个叫 Profanity 的靶号工具生成的"],[12.02,13.06,"靶号地址"],[13.08,16.13,"就是首尾字符符合指定模式的地址"],[16.51,18.58,"比如开头是一串 0"],[19.56,22,"私钥有 256 位 按理说"],[22.08,23.16,"没人猜得出来"],[24.15,25.75,"可这个工具的随机数"],[25.89,27.5,"只用了一个 32 位的种子"],[28.5,29.74,"32 位种子"],[29.82,31.48,"只有约 43 亿种可能"],[32.46,33.66,"做个示例计算"],[34.03,35.91,"如果每秒试 10 亿个种子"],[35.94,36.97,"全部试完"],[36.98,38.42,"最多约 4.3 秒"],[39.4,42.13,"真实攻击还要从种子算出地址"],[42.15,43.04,"会慢一些"],[43.4,44.62,"但一张 GPU" 7.66,381.36,"现在是最关键的一点：生成缺陷修复以后"],[381.36,383.01,"问题就结束了吗？"],[383.46,388.41,"没有。修代码，修不好已经生成出来的弱私钥"],[388.86,391.46,"Trust Wallet 扩展受影响的"],[391.46,395.98,"是 2022 年 11 月 14 日到 23 日之间新建的钱包"],[395.98,400.76,"漏洞修好了，这些钱包的私钥，还是只来自 32 位种子"],[400.76,404.36,"部分弱钱包后来被盗，损失约 17 万美元"],[404.81,406.17,"所以修复之后"],[406.17,410.93,"必须强制用户把资产迁移到新钱包生成的新地址"],[411.38,415.36,"防御也是沿着这条链路摆的：生成用 CSPRNG"],[415.36,417.77,"金库地址不用靶号工具生成"],[417.77,420.24,"签名用标准的确定性 nonce"],[420.24,423.38,"再监控自家地址有没有重复的 r 值"],[425.08,429.47,"回到开头的问题：私钥的随机性，从哪里来？"],[429.92,434.46,"从生成它的那一刻来。Wintermute 的签名算法没有错"],[434.46,437.7,"错在生成地址的工具，只有 32 位种子"],[438.15,442.34,"密码学算法几乎从不被破解。被攻破的是实现"],[442.34,447.22,"随机数不够随机，nonce 能被算出来，证明被省掉了"],[447.67,452.72,"所以，私钥的安全上限，由它的生成和使用过程决定"],[452.72,456.02,"前提是两处随机性都对；就算都对"],[456.02,460.63,"用户自己签下攻击者的交易，签名算法也拦不住"],[461.08,464.21,"下一集，我们打开以太坊这台机器"],[464.21,466.98,"看 EVM 与 Solidity 的基础"]],"ch":[]},"deck":{"src":"../decks/skeuomorphic/ch02/index.html","scenes":[["Wintermute 被盗",["2022 年 9 月，Wintermute 的金库被盗，约 1.6 亿美元。","这个金库的地址，是用一个叫 Profanity 的靶号工具生成的。","靶号地址，就是首尾字符符合指定模式的地址。比如开头是一串 0。"]],["256 位私钥，32 位种子",["私钥有 256 位，按理说，没人猜得出来。","可这个工具的随机数，只用了一个 32 位的种子。","32 位种子，只有约 43 亿种可能。","做个示例计算。如果每秒试 10 亿个种子，全部试完，最多约 4.3 秒。","真实攻击还要从种子算出地址，会慢一些。但一张 GPU，几分钟就够。"]],["先猜一道题",["那么问题来了。一把 256 位的私钥，为什么只值 32 位？","这一集，我们讲私钥从哪里来，又是怎么被算出来的。"]],["被攻破的是实现",["这一集的核心，是一句话。密码学算法几乎从不被破解，被攻破的，是实现。","随机数不够随机，nonce 能被算出，门限签名的库省掉一步证明。","私钥的安全上限，由它的生成和使用过程决定。"]],["熵：随机性的度量",["先给准确的定义。熵，是随机性的度量，单位是位。","256 位熵，攻击者要试大约 2 的 256 次方次。只有 32 位熵，约 43 亿次就够了。"]],["用生日设密码的保险柜",["打个比方。保险柜的密码有 77 位数字，理论上没人猜得出。","但如果设密码的人，总用自己的生日加一串固定数字，小偷只要试几万个生日。","这个比方有一处不成立。小偷试生日，必须站在保险柜前面。","链上的公钥和地址全部公开。攻击者可以离线、并行、无限次地试，不会触发任何告警。"]],["签名算法保护什么",["再看几种原语，各自保护什么，不保护什么。","ECDSA 和 EdDSA 用来签名。它们保证，没有私钥的人无法伪造签名。","但它们不管私钥和 nonce 的质量，也不管用户看没看懂签的内容。"]],["哈希、助记词与派生",["哈希保证数据没被改动，但不保证数据本身是对的。","助记词让人能抄写和恢复钱包，但不管生成它时熵够不够。","分层派生，从一个种子派生出一组地址。一份备份恢复全部，一个种子泄露，也全部泄露。"]],["从随机数到签名",["整条链路是这样的。随机数源，到助记词，到种子，再派生出私钥和地址。","签名时，私钥、消息，再加一个 nonce，一起算出签名。"]],["两处需要随机性",["这条链路上，有两处需要随机性。生成私钥时的熵，签名时的 nonce。任何一处出错，私钥都能被算出来。","图上没画的，是签名的内容。算法完全正确，用户也可能签下攻击者的交易。所以签之前，要看清签的是什么。"]],["熵不足的四步攻击",["先看第一处，熵不足。攻击路径有四步。","第一，生成器用了状态很小的伪随机数生成器，比如只用 32 位种子初始化的 mt19937。","第二，种子只有约 43 亿种，私钥也就只有约 43 亿种。","第三，攻击者在 GPU 上枚举全部种子，算出对应的地址。","第四，和链上有余额的地址比对。命中，就转走资产。","看起来随机，不等于安全。私钥必须来自 CSPRNG，也就是密码学安全随机数生成器，满 256 位熵。"]],["案例一：Profanity",["三个案例，走的都是这条路。","第一个是 Profanity。1.60 及以前的版本只用 32 位种子。","2022 年 9 月 15 日，1inch 公开披露。5 天后，Wintermute 被盗。同期还有多个受害者。"]],["案例二：Trust 钱包",["第二个，Trust Wallet 浏览器扩展。Wallet Core 的 WASM 版本生成助记词，用的是 mt19937，熵从 256 位降到 32 位。","受影响的，是 2022 年 11 月 14 日到 23 日新建的扩展钱包。Ledger 的安全团队报告后，几天内就修复了。","但部分弱钱包后来还是被盗，损失约 17 万美元，Trust Wallet 承诺补偿。"]],["案例三：Milk Sad",["第三个，Libbitcoin Explorer 的 Milk Sad 漏洞。它生成种子的命令，用的是一个 32 位的时间值。","2023 年 7 月 12 日发生集中盗取，损失至少约 90 万美元。","厂商认为，文档早有警告。"]],["熵不足的三条教训",["教训有三条。在 WASM 或 JS 里替换随机源，要单独审计。","文档里的警告挡不住误用，生成密钥的接口必须默认安全。","最容易漏掉的一条是，修好代码，修不好已经生成的弱私钥。用户必须迁移到新地址。"]],["先猜：k 重复用两次",["第二处随机性，在签名里。","ECDSA 每次签名，都需要一个一次性的数，叫 k，也就是 nonce。","k 出错有三种情况。第一种，两次签名用了同一个 k。","攻击者还需要别的东西吗？"]],["答案：不需要",["不需要。两个签名和两个消息哈希都是公开的，直接解方程，就得到私钥。","打个比方。nonce 像一块每次都换的遮布，盖在私钥上面。","同一块布用了两次，两次结果一对比，布就被消掉，私钥就显出来了。"]],["k 有偏置或可被算出",["比方的局限是，真实过程是解方程。而且下面两种情况，一次对比无法解决。","第二种，k 有偏置，比如高几位总是 0。收集足够多签名，用格方法就能恢复私钥。","第三种最糟。k 可以由公开数据算出，那么单个签名就能反推私钥。"]],["标准解法：确定性派生",["标准早有解法，叫 RFC 6979。它用私钥和消息，确定性地派生 k，可以消除前两种风险。","EdDSA 标准也要求，nonce 由私钥的秘密部分派生。风险来自偏离标准的实现。"]],["重复与偏置的真实案例",["三个案例。2013 年 8 月，Android 的随机数缺陷，让不同签名用了相同的 nonce，多款比特币钱包受影响。","2019 年，一项研究用格方法，恢复出数百个比特币私钥，和数十个以太坊私钥。"]],["SecondFi 事件",["2026 年 6 月，Cardano 钱包 SecondFi 的 Android 版，用公开交易数据派生 nonce，漏掉了秘密部分。","nonce 人人可算，单个签名就能反推私钥。","374 个钱包被盗，约 1600 万 ADA，约 240 万美元。这是官方口径，SlowMist 的估计更高。","硬件钱包签名走另一条路径，不受影响。"]],["nonce 的教训",["教训是，nonce 必须确定性派生，并包含私钥的秘密材料。封装层要做已知答案测试，不能只信任底层库。"]],["门限签名：TSS / MPC",["第三类风险，在门限签名里，也叫 TSS 或 MPC。","准确地说，它是多方各持一份密钥分片，合作产生签名。安全性依赖协议里的每一步零知识证明。","打个比方。几个人各拿一块拼图，合作盖章。每一步都要出示证明，证明自己守规矩，但不亮出自己那块。"]],["风险在省掉一步证明",["比方不准的地方是，分片不是拼图，风险也不在有人偷拼图。","而在省掉一步证明后，恶意参与方能在多次签名中，逐步提取别人的分片。"]],["BitForge",["2023 年 8 月，Fireblocks 披露 BitForge。GG18 和 GG20 的实现缺少参数证明，恶意参与方可以提取完整私钥。","Lindell17 的实现偏离论文，约 200 次签名请求就能提取私钥。影响 15 家以上钱包服务商。"]],["TSSHOCK 与教训",["Verichains 的 TSSHOCK 披露了三类攻击。比如证明的重复次数从 128 降到 1，可以直接猜中。","受影响的有 BNB 的 tss-lib、Multichain、THORChain、Axelar 等多个开源库。两项披露都没有报告实际资金损失。","教训是，MPC 库不能按论文简化。选供应商时，要问它是否修复了这两类漏洞，并要审计报告。"]],["后量子威胁",["最后看后量子。足够大的量子计算机，可以从公钥算出 ECDSA 和 EdDSA 私钥。哈希函数受影响较小。","比特币 P2PKH 这类地址，公钥在第一次签名后才暴露。所以从未签过名的地址更安全。"]],["迁移周期以年计",["截至 2026 年 11 月，NIST 已发布后量子标准。比特币的 BIP-360 仍是草案。","以太坊基金会的目标，是约 2029 年完成核心基础设施。这是规划，不是承诺。","迁移周期以年计。现在能做的，是盘点资产，避免地址重复使用，跟踪各链的迁移计划。"]],["防御：生成层与签名层",["防御按层来。","生成层，用 CSPRNG 或硬件随机源，满 256 位熵。不在 WASM 和浏览器 JS 里自己替换随机源。","签名层，用标准 EdDSA 或 RFC 6979。再用已知答案测试和差分测试，验证封装层。"]],["监控、工具与迁移",["监控层，扫描自家地址的签名，检测重复的 r 值。","靶号工具，不用来生成管理员或金库地址。MPC 库，逐项审计证明，及时升级。","生成缺陷修复后，强制用户迁移到新地址。"]],["每个角色今天做一件事",["按角色，今天就能做一件事。","钱包开发者，搜一遍密钥生成代码，确认没有时间戳种子、Math.random 和 mt19937。","审计和安全团队，查一遍金库和管理员地址，是不是靶号工具生成的。","普通用户，只用主流钱包生成助记词。厂商一公告随机数缺陷，立刻把资产转到新钱包生成的新地址。"]],["私钥只有种子那么强",["回到开头的问题。一把 256 位的私钥，为什么只值 32 位？","因为私钥的强度，取决于生成它的熵。熵只有 32 位，位数再多，也只有 32 位。","256 位的强度要成立，有三个条件。熵满 256 位，nonce 不可预测，实现不偏离标准。"]]]},"d3b":{"src":"../decks/3b1b/ch02.html","scenes":[["一个靶号地址，丢了约 1.6 亿美元",["2022 年 9 月，Wintermute 的金库被盗，损失约 1.6 亿美元。","金库的地址，是用一个叫 Profanity 的靶号工具生成的。靶号地址，就是开头或结尾长成指定样子的地址，比如一串零开头。"]],["算法没被破解，私钥却被算了出来",["就在 5 天前，1inch 公开披露：这个工具的随机数，只用了一个 32 位的种子。","签名算法没有被破解，私钥却被算了出来。问题来了：私钥的随机性，从哪里来？","先记住这个问题，最后再回来回答它。"]],["种子一旦泄露，所有地址一起泄露",["先看一把私钥，从生成到使用的整条链路。","起点是随机数源，它提供熵。熵变成助记词，助记词再变成种子。","从种子往下，分层派生出一把把私钥。每把私钥，对应一个公钥和一个地址。","这一段是确定性的。种子安全，所有地址都安全；种子泄露，所有地址一起泄露。"]],["整条链路，有两处需要随机性",["私钥拿去签名时，还要再加一个一次性的随机数，叫 nonce。","所以整条链路，有两处需要随机性：生成私钥时的熵，和签名时的 nonce。任何一处出错，私钥都能被算出来。"]],["256 位私钥：约 10⁷⁷ 种可能",["先看第一处：熵。它衡量随机性，单位是位。","一把以太坊私钥有 256 位。如果这 256 位全部随机，可能的私钥大约有 10 的 77 次方个。"]],["32 位种子：几分钟就能试完",["但 Profanity 的私钥，是从一个 32 位的种子算出来的。种子只有约 43 亿种，算出来的私钥，也就只有约 43 亿种。","算一笔账。假设攻击者每秒能试 10 亿个种子，这是个示例速度。","43 亿除以 10 亿，大约 4.3 秒，全部种子就试完了。","真实攻击还要从种子算出地址，会慢一些，但一张 GPU 几分钟就够。私钥写得再长，强度也超不过生成它的熵。"]],["77 位的密码，用生日来设",["打个比方。一个保险柜，密码有 77 位数字，理论上没人猜得出。","但设密码的人，总是用自己的生日，加上一串固定数字。","小偷不用试 77 位数字，只要试几万个生日。"]],["链上更糟：离线、并行、无限次地试",["这个比方有一处不成立：小偷试生日，要站在保险柜前，试多了会被发现。","链上的公钥和地址全部公开。攻击者可以离线、并行、无限次地试，不会触发任何告警。"]],["熵不足不是孤例",["Profanity 不是孤例。","2022 年 11 月，Trust Wallet 浏览器扩展的 WASM 版本，用一个只有 32 位种子的伪随机数生成器，生成助记词。熵从 256 位，降到了 32 位。","2023 年，Libbitcoin Explorer 的一个命令，用 32 位的时间值做种子。7 月 12 日，一批钱包被集中盗取，损失至少约 90 万美元。"]],["穷举种子，和有余额的地址比对",["这几起事故，攻击方式都一样：把全部种子对应的地址算出来，和链上有余额的地址比对，命中就转走。"]],["私钥必须来自 CSPRNG，满 256 位熵",["伪随机数生成器的输出看起来随机，不等于安全。私钥必须来自操作系统或硬件提供的密码学安全随机数生成器，也就是 CSPRNG，而且要满 256 位熵。"]],["同一个 k 用两次，解方程就得到私钥",["第二处是 nonce。ECDSA 每签一次名，都要一个一次性的随机数，记作 k。","如果两次签名用了同一个 k，两个签名和两条消息都是公开的，解一个方程，就能得到私钥。2013 年的安卓随机数缺陷，就是这样。"]],["r 值重复，是 k 被用了两次的痕迹",["这两个签名里的 r 值完全一样。r 值重复，就是 k 被用了两次留下的痕迹。"]],["k 有偏置或能被算出，也会泄露私钥",["如果 k 有偏置，比如高几位总是 0，攻击者收集足够多的签名，也能用格方法恢复私钥。2019 年，研究者这样恢复出数百个比特币私钥。","最糟的是 k 能由公开数据算出来。那样的话，一个签名就够了。","2026 年 6 月，Cardano 上的 SecondFi 钱包，安卓版用公开交易数据派生 nonce，漏掉了秘密部分。374 个钱包被盗，约 1,600 万 ADA。"]],["解法：RFC 6979 确定性 nonce",["解法是确定性 nonce：RFC 6979 用私钥和消息派生 k。算法本身没问题，风险来自偏离标准的实现。"]],["门限签名：每一步证明都不能省",["如果把私钥拆开，交给几方各持一片呢？这就是门限签名，也叫 MPC。","它的安全性，依赖协议里的每一步零知识证明。每一步，都在证明对方没有作弊。","有的实现为了性能，省掉或者弱化了某个证明。比如把证明的重复次数，从 128 次降到 1 次，作弊的一方就能猜中。"]],["恶意参与方一点点提取别人的分片",["恶意参与方就能在多次签名中，一点点提取别人的密钥分片。2023 年 8 月披露的 BitForge 和 TSSHOCK，影响了多家钱包服务商和多个开源库。","这两项披露都没有报告实际的资金损失。教训是：门限签名库，不能按论文随意简化。"]],["量子计算：从公开的公钥算出私钥",["再看一个远一点的风险：量子计算。足够大的量子计算机，可以从公钥直接算出 ECDSA 和 EdDSA 的私钥。","公钥在地址第一次签名之后才公开。从没签过名的地址，比已经签过名的地址更安全。"]],["后量子迁移：整条链升级，以年计",["换签名方案，要整条链一起升级，周期以年计。NIST 在 2024 年 8 月发布了后量子标准，比特币和以太坊的迁移还在规划中。"]],["现在能做的：盘点、标记、不重用",["现在能做的，是盘点资产，标出哪些地址的公钥已经暴露，并且不重复使用地址。"]],["修好代码，修不好已经生成的弱私钥",["现在是最关键的一点：生成缺陷修复以后，问题就结束了吗？","没有。修代码，修不好已经生成出来的弱私钥。","Trust Wallet 扩展受影响的，是 2022 年 11 月 14 日到 23 日之间新建的钱包。漏洞修好了，这些钱包的私钥，还是只来自 32 位种子。部分弱钱包后来被盗，损失约 17 万美元。"]],["修复之后：强制迁移到新地址",["所以修复之后，必须强制用户把资产迁移到新钱包生成的新地址。"]],["防御沿链路摆：生成、地址、签名、监控",["防御也是沿着这条链路摆的：生成用 CSPRNG，金库地址不用靶号工具生成，签名用标准的确定性 nonce，再监控自家地址有没有重复的 r 值。"]],["答案：从生成它的那一刻来",["回到开头的问题：私钥的随机性，从哪里来？","从生成它的那一刻来。Wintermute 的签名算法没有错，错在生成地址的工具，只有 32 位种子。","密码学算法几乎从不被破解。被攻破的是实现：随机数不够随机，nonce 能被算出来，证明被省掉了。"]],["两处随机性都对，也挡不住误签",["所以，私钥的安全上限，由它的生成和使用过程决定。前提是两处随机性都对；就算都对，用户自己签下攻击者的交易，签名算法也拦不住。"]]]}}},{"id":"03","title":"EVM 与 Solidity 安全基础：先看懂这台机器","md":"../chapters/03-evm-solidity-basics.md","v":{"vs":{"src":"skeuo/ep03/out/ep03-full.mp4","cues":[[1.65,3.04,"先看一个示例场景"],[4.03,5.14,"管理员的钱包"],[5.16,6.58,"打开了一个钓鱼页面"],[7.56,9.27,"他以为自己在领空投"],[9.36,11.19,"实际调用了攻击者的合约"],[12.2,13.34,"攻击者的合约"],[13.39,15.13,"紧接着去调用你的金库"],[16.11,18.1,"金库的权限检查只有一句"],[18.3,19.47,"交易的发起人"],[19.49,20.65,"必须是管理员"],[21.64,22.68,"这次调用"],[22.87,23.82,"能通过吗"],[25.06,25.76,"能"],[27.16,29.99,"这句检查读的是 tx.origin"],[30.01,32.5,"也就是发起整笔交易的那个外部账户"],[33.5,35.86,"在这里 就是被骗的管理员"],[36.23,37.96,"中间经过多少个合约"],[38.06,38.94,"它都不变"],[39.91,41.38,"攻击者没有偷私钥"],[41.74,43.34,"他借用了管理员的身份"],[44.33,45.4,"要看懂这一步"],[45.42,47.85,"先要看懂这台机器 EVM"],[48.84,50.29,"这一集讲三件事"],[50.34,51.35,"谁在调用"],[51.44,52.7,"数据存在哪"],[52.9,54.34,"语言里有哪些坑"],[57.48,60.12,"EVM 是一台单线程的栈式计算机"],[60.49,61.46,"每个合约"],[61.49,63.09,"有自己的代码和存储"],[64.08,65.03,"合约之间"],[65.11,66.58,"靠消息调用来通信"],[66.95,68.01,"每一次调用"],[68.07,70.17,"都可能把控制权交给别人"],[71.17,72.84,"链上有两类账户"],[73.84,75.54,"外部账户叫 EOA"],[75.56,76.71,"由私钥控制"],[76.73,78,"能主动发起交易"],[78.98,80.74,"合约账户由代码控制"],[80.89,82.12,"不能主动发起"],[82.19,83.15,"只能被调用"],[84.12,85.61,"但这条界线在变"],[85.97,87.27,"2025 年 5 月"],[87.39,91.33,"以太坊 Pectra 升级上线了 EIP-7702"],[91.48,94.22,"EOA 可以委托执行一段合约代码"],[95.21,97.56,"所以 查对方有没有代码"],[97.61,99.81,"已经不能判断它是不是普通用户"],[100.18,103.79,"比较 msg.sender 和 tx.origin"],[103.84,104.59,"也不行"],[105.58,107.39,"再看调用上下文"],[107.77,109.63,"假设用户调用合约 A"],[109.76,110.65,"A 调用 B"],[110.71,111.72,"B 再调用 C"],[112.71,113.94,"站在 C 的位置"],[114.01,115.1,"看四个变量"],[116.08,117.59,"tx.origin"],[117.61,119.38,"是发起整笔交易的用户"],[120.38,121.89,"msg.sender"],[121.92,123.51,"是直接调用 C 的那一个"],[123.54,124.56,"也就是 B"],[125.52,126.94,"msg.value"],[127.02,128.78,"是这次调用附带的原生币"],[128.8,130.57,"也就是 15,"每个合约是一个科室，有自己的档案柜，也就是存储"],[83.15,86.19,"还有自己的办事规程，也就是代码"],[86.64,90.86,"科室 A 要找科室 B 办事，就派人带着材料"],[90.86,94.11,"去 B 的窗口。B 办完，再回到 A"],[94.56,99.95,"这个比方有一处不成立：真实的大厅里，你离开窗口后"],[99.95,101.3,"不能插队回来"],[101.75,106.12,"EVM 里，B 办事办到一半，可以反过来再找 A"],[106.12,110.33,"这时 A 的上一件事，还没办完。这就是重入"],[110.33,111.61,"下一集的主题"],[113.31,117.85,"现在沿着一条调用链走一遍：用户调用合约 A"],[117.85,120.2,"A 调用 B，B 再调用 C"],[120.65,124.59,"每一站，都有四个变量。tx.origin"],[124.59,127.56,"是发起整笔交易的外部账户"],[128.01,133.38,"msg.sender，是直接调用当前函数的地址。msg.value"],[133.38,137.59,"是这次调用附带的原生币。address(this)"],[137.59,139.79,"是当前执行代码的合约"],[140.24,146.87,"走到 A：tx.origin 是用户，msg.sender 也是用户"],[147.32,154.33,"走到 B：msg.sender 变成了 A，tx.origin 还是用户"],[154.78,158.44,"走到 C：msg.sender 变成了 B"],[158.44,164.5,"tx.origin 仍然是用户。msg.sender 每一站都在变"],[164.5,167.45,"tx.origin 从头到尾不变"],[169.15,172.46,"合约调用合约，有三种方式"],[172.91,177.74,"第一种是 call：执行 B 的代码，改 B 的存储"],[177.74,178.43,"最常见"],[178.88,182.94,"第二种是 delegatecall：执行 B 的代码"],[182.94,185.24,"改的却是 A 自己的存储"],[185.24,189.15,"msg.sender 和 msg.value 也保持不变"],[189.6,193.56,"用大厅的比方：A 把 B 的规程手册借过来"],[193.56,198.56,"在自己的档案柜上照着做。手册写着清空第 0 号抽屉"],[198.56,201.58,"被清空的，是 A 的第 0 号抽屉"],[202.03,207.9,"第三种是 staticcall，只读调用。任何写存储的操作"],[207.9,208.87,"都会回滚"],[209.32,212.33,"还有一个细节：低级 call 失败时"],[212.33,216.13,"不会自动让调用者回滚，只返回一个 false"],[216.13,218.49,"忘记检查它，是常见的错误"],[220.19,225.85,"再看存储。它是一张巨大的表，每一格叫一个槽位"],[225.85,226.79,"32 字节"],[227.24,233.1,"状态变量按声明顺序，从 0 号槽开始排。相邻的小变量"],[233.1,235.71,"能放下就打包进同一个槽"],[236.16,240.25,"算一下这个例子。owner 是地址，20 字节"],[240.25,244.05,"放进 0 号槽。paused 是布尔，1 字节"],[244.05,246.84,"20 加 1 等于 21，还放得下"],[247.29,252.57,"fee 是 uint96，12 字节。21 加 12 等于 33"],[252.57,256.89,"超过 32，放不下，只好从 1 号槽开始"],[256.89,259.12,"total 排到 2 号槽"],[259.57,264.27,"mapping 自己占 3 号槽，里面是空的。它的元素"],[264.27,267.25,"放在由键和槽号算出的哈希位置"],[267.7,273.19,"现在把 fee 改成 uint88，11 字节。20 加 1 加 11"],[273.19,276.67,"正好 32。三个变量全挤进 0 号槽"],[276.67,279.15,"total 跟着挪到 1 号槽"],[280.85,284.35,"槽位挪一格，为什么是安全问题？"],[284.8,288.64,"代理合约用 delegatecall，把实现合约的代码"],[288.64,292.63,"跑在代理自己的存储上。两边的变量顺序必须一致"],[293.08,296.92,"如果不一致，实现合约以为自己在写 owner"],[296.92,301.29,"实际改写的，可能是代理里存放实现地址的那个槽"],[301.74,306.6,"升级时在中间插入一个新变量，后面的变量全部错位"],[306.6,309.13,"余额可能被当成地址读出来"],[309.58,313.81,"另外，存储是公开的。标成 private 的变量"],[313.81,317.83,"任何人都能从链上读出，不能存密码或种子"],[319.53,323.11,"最后，几个最容易误解的语言特性"],[323.56,326.55,"向合约转 ETH，不只是改一个余额"],[326.55,330.58,"它会执行对方的 receive 或 fallback 函数"],[330.58,332.15,"这正是重入的入口"],[332.6,336.63,"合约的余额，也不是只能通过你的函数增加"],[336.63,338.55,"别人可以强制转进来"],[338.55,343.78,"用 address(this).balance 记账，会被这种捐赠操纵"],[344.23,347,"block.timestamp 不是精确时间"],[347,350.74,"出块者能在小范围内调整，不能拿来做随机数"],[351.19,353.56,"函数选择器只有 4 个字节"],[353.56,356.21,"不同的函数签名可能撞在一起"],[356.21,361.19,"2021 年 Poly Network 的事故，关键一步就和它有关"],[362.89,368.19,"回到开头的问题：一次调用里，谁是 msg.sender？"],[368.64,372.49,"是直接调用你的那个地址。在这个场景里"],[372.49,376.56,"金库看到的 msg.sender，是攻击者的合约"],[377.01,382.74,"而 tx.origin，是被骗的管理员。中间经过多少个合约"],[382.74,387.13,"它都不变。所以，tx.origin 等于 owner"],[387.13,388.77,"这次调用能通过"],[389.22,393.89,"所以，权限检查要看 msg.sender，不看 tx.origin"],[393.89,398.54,"前提是，你清楚每一跳是 call 还是 delegatecall"],[398.54,402.66,"delegatecall 会把 msg.sender 原样带过去"],[403.11,406.07,"还要记住：EIP-7702 之后"],[406.07,409.42,"msg.sender 等于 tx.origin"],[409.42,412.64,"也不能证明调用者是普通用户"],[413.09,418.73,"下一集，我们看 B 中途回头找 A 的那一刻：重入攻击"]],"ch":[]},"talk":{"src":"slides/EP03-evm-solidity-basics.html","scenes":[["开场",["大家好，欢迎来到主线第3集，EVM 与 Solidity 安全基础。理解合约运行的这台机器，才能理解漏洞从哪里来。","先用一句话描述它。EVM 是一台单线程的栈式计算机。每个合约有自己的代码和自己的存储。","合约之间靠消息调用通信。每次你调用别人，都可能把控制权交给对方，而对方可以在你的事情办完之前，反过来调用你。本集讲四件事，调用上下文，三种调用，存储布局，以及八个最容易误解的语言特性。"]],["像一个政务大厅",["打个比方，EVM 像一个只有一个窗口的政务大厅。每个合约是一个科室，有自己的档案柜，也就是存储，和自己的办事规程，也就是代码。","科室 A 要找科室 B 办事，就派人带着材料去 B 的窗口，这是 call。B 在自己的档案柜上办完，再回来。","delegatecall 是另一种方式。A 把 B 的规程手册借过来，在 A 自己的档案柜上，按 B 的规程操作。如果 B 的手册写着把第0号抽屉清空，被清空的是 A 的第0号抽屉。","比喻不准的地方在于，真实的大厅里，你离开窗口后就不能插队回来。EVM 里，科室 B 办事办到一半，可以反过来再找 A，而 A 的上一件事还没办完。这就是下一集要讲的重入。"]],["两类账户",["以太坊上有两类账户。外部账户由私钥控制，没有代码，能主动发起交易。合约账户有代码，由代码控制，不能主动发起交易，只能被调用。","这里有一个新变化。2025年5月，以太坊的 Pectra 升级引入了 EIP-7702，允许外部账户委托执行一段合约代码。所以，过去常用的两种判断，地址没有代码，或者消息发送者等于交易发起人，都不能再证明调用者是一个普通用户。"]],["调用上下文的四个变量",["调用上下文里有四个变量。看一条调用链，用户发起交易调用合约 A，A 调用 B，B 再调用 C。我们站在 C 的位置看。","第一个，交易发起人，tx.origin，是发起整笔交易的外部账户，也就是用户。不管调用链多长，它都不变。","第二个，消息发送者，msg.sender，是直接调用当前函数的地址。对 C 来说，是 B。","第三个，msg.value，本次调用附带的原生币数量，是 B 转给 C 的数量。第四个，address(this)，当前执行代码的合约地址，就是 C 自己。"]],["不要用 tx.origin 做权限判断",["为什么不能用交易发起人做权限判断？看一个机制示意。一个钱包合约这样写，要求交易发起人等于 owner，才能转出资金。","某天，owner 被诱导去调用一个看起来无害的合约，比如领取一个空投。","这个合约在内部转身调用了钱包的转账函数。此时，钱包看到的交易发起人，仍然是 owner，检查通过，资金被转走。","如果钱包检查的是消息发送者，看到的就是那个恶意合约，检查失败。所以权限判断用 msg.sender，不用 tx.origin。第5集还会详细讲。"]],["三种调用方式",["合约之间有三种调用方式。第一种是 call，最常见。执行 B 的代码，修改 B 的存储。B 看到的消息发送者是 A，当前地址是 B。","第二种是 delegatecall。执行 B 的代码，但修改的是 A 的存储。而且消息发送者和附带的币都保持不变，B 的代码看到的消息发送者，仍然是用户，当前地址是 A。代理合约和库合约都依赖它。","第三种是 staticcall，只读调用。任何写存储或者发事件的操作都会回滚。外部调用 view 函数时，用的就是它。","还有一点很重要。低级 call 失败时，不会自动回滚调用方，只返回一个 false。忘了检查这个返回值，是第7集的主题。手册里的存储与代理实验，可以一步步观察这四个变量的变化。"]],["delegatecall 改了谁",["来做一道题。合约 A 用 delegatecall 调用库合约 L 的初始化函数。L 里只有一句，owner 等于消息发送者。owner 在 L 的布局里是第0个槽位。执行之后，哪个合约的哪个槽位被改了？消息发送者是谁？可以先暂停想一想。","答案是，被改的是 A 的第0个槽位，不是 L 的。因为 delegatecall 用的是调用方 A 的存储。","消息发送者是谁？是调用 A 的那个人，因为 delegatecall 保持消息发送者不变。","如果 A 的第0个槽位原本放的不是 owner，而是别的东西，比如实现地址，那它就被一个人的地址覆盖了。这正是代理合约存储冲突的原理。如果 L 的初始化函数谁都能调，那么谁调用，谁就成了 A 的 owner。"]],["存储槽的五条规则",["存储是每个合约持有的一个巨大键值表，键和值都是32字节，键叫槽位。规则有五条。第一，状态变量按声明顺序，从第0个槽位开始分配。第二，相邻变量合计不超过32字节，编译器会把它们打包进同一个槽。","第三，映射本身占一个槽位 p，里面是空的。元素放在 k 和 p 一起做哈希得到的位置。第四，动态数组占一个槽位 p，存的是长度，元素从 p 的哈希值开始依次往后放。","第五，常量和不可变量不占存储槽，它们直接写在代码里。下面用一个例子看打包。"]],["打包示例",["看一个例子。第一个变量是地址 owner，20字节，放进第0个槽位。第二个是布尔值 paused，1字节，和 owner 一起，第0个槽位用了21字节。","第三个是 fee，类型是96位整数，12字节。21加12是33，超过了32，放不下。所以 fee 从第1个槽位开始。后面的 total 在第2个槽位，映射 bal 占第3个槽位。","如果把 fee 改成88位整数，11字节，20加1加11正好32，三个变量全部挤进第0个槽位。total 变成第1个，映射变成第2个。","看出问题了吗？只改了一个类型，后面所有变量的位置都变了。如果这是一个已经上线的可升级合约，新代码会按新位置去读旧数据，余额可能被当成地址。这就是第10集存储冲突的根源。"]],["存储布局为什么是安全问题",["存储布局为什么是安全问题？四个场景。代理和实现的变量顺序不一致，实现合约以为自己在写 owner，实际改写了代理的实现地址。升级时在中间插入新变量，后面的变量全部错位。","用 private 变量存放密码或种子，上一集讲过，任何人都能直接读出。用 delegatecall 调用不受信任的合约，对方的代码可以改写你的任何槽位。","怎样避免代理和实现冲突？EIP-1967 为代理定义了固定的槽位，用一个字符串的哈希减一得到。这个位置几乎不可能和普通变量重合。看到这串以3608开头的数字，就知道这是一个标准代理的实现地址槽。"]],["八个易误解的特性（上）",["接下来是 Solidity 最容易误解的八个特性。第一，private。误解是别人看不到。事实是它只限制其他合约调用，存储完全公开，所以不能存秘密。","第二，接收函数和回退函数。误解是转账只是改一下余额。事实是向合约转原生币，会执行对方的代码。这就是重入的入口。","第三，自毁。误解是可以删除合约。2024年 Cancun 升级以后，只有在同一笔交易里创建的合约才会被真正删除，其他情况只是把余额转走。","第四，合约余额。误解是余额只能通过我的函数增加。事实是任何人都可以强制转入。所以用合约余额来记账，会被捐赠操纵。思考题来了，一个合约要求余额必须等于存款总额，攻击者只要强制转入1个最小单位，这个检查就永久失败了。"]],["八个易误解的特性（下）",["第五，检查型算术。误解是0.8版本以后算术不会出错。事实是溢出会回滚，但 unchecked 块、类型转换和除法截断都不会报错。第六，区块时间戳。误解是精确时间。事实是出块者可以小幅调整，二层网络上由排序器决定，不能做随机数，也不能做秒级判断。","第七，区块号。误解是每个区块的时间固定。算一个示例。一个合约要锁仓7天，按3秒一个块计算，写死了201600个块。","后来出块间隔缩短到0.75秒，这正是 BNB Chain 发生过的变化。同样是201600个块，现在只要42个小时，也就是1.75天，锁仓期缩短了四分之三。","第八，函数选择器。误解是函数名唯一。事实是选择器只有4个字节，不同的函数签名可能算出同一个选择器。2021年 Poly Network 事故的关键一步，就利用了这一点，第12集会讲。"]],["Gas、回滚与错误处理",["再看错误处理。require 和自定义错误会回滚当前调用，并且向上冒泡，调用方也跟着回滚。gas 用完，当前调用帧回滚。","有两种情况不会冒泡。低级 call 失败时只返回 false，调用方继续执行。try catch 只能捕获外部调用的失败，不能捕获本合约内部的失败。","还有一条63分之64规则。外部调用最多转发剩余 gas 的63分之64，被调用方耗尽 gas 时，调用方还剩64分之1可以收尾。","最后，transfer 和 send 只转发2300 gas，曾经被当作防重入的手段。后来 gas 价格调整，接收方是合约钱包时，这种转账会直接失败。现在的推荐做法是用 call 转账，再用检查生效交互的顺序或重入锁来防重入。"]],["编译器与版本",["最后是编译器。0.8.0之前的版本，算术默认不检查溢出，必须用 SafeMath 库。0.8.0以后默认检查，但 unchecked 块里仍然会回绕。","0.8.24以后支持瞬态存储，只在当前交易内有效，交易结束自动清零，可以实现低成本的重入锁。但部署到其他链时，要确认目标链支持这个操作。","编译器本身也会有 bug。据公开复盘，2023年7月，另一种合约语言 Vyper 的三个版本，重入锁的实现有错误，导致多个 Curve 池被重入，损失约7000万美元。所以编译器版本要锁定，并关注它的已知 bug 列表。"]],["小结与预告",["小结三点。第一，权限判断用消息发送者。delegatecall 执行的是别人的代码，改的是自己的存储。","第二，存储按槽位分配和打包。改一个类型，或者插入一个变量，后面的变量会全部错位。","第三，记住几个反直觉的事实。private 不保密，余额可以被强制转入，区块时间会变，低级 call 失败不会冒泡。","下一集讲最古老、也最常复发的合约漏洞，重入攻击。四种重入的形态，检查生效交互的顺序，以及重入锁该怎样用。下集见。"]]]},"deck":{"src":"../decks/skeuomorphic/ch03/index.html","scenes":[["管理员打开了钓鱼页面",["先看一个示例场景。","管理员的钱包，打开了一个钓鱼页面。","他以为自己在领空投，实际调用了攻击者的合约。","攻击者的合约，紧接着去调用你的金库。","金库的权限检查只有一句：交易的发起人，必须是管理员。"]],["先猜一道题",["这次调用，能通过吗？"]],["答案：能",["能。","这句检查读的是 tx.origin，也就是发起整笔交易的那个外部账户。","在这里，就是被骗的管理员。中间经过多少个合约，它都不变。","攻击者没有偷私钥。他借用了管理员的身份。"]],["先看懂这台机器",["要看懂这一步，先要看懂这台机器，EVM。","这一集讲三件事：谁在调用，数据存在哪，语言里有哪些坑。"]],["EVM：单线程栈式计算机",["EVM 是一台单线程的栈式计算机。每个合约，有自己的代码和存储。","合约之间，靠消息调用来通信。每一次调用，都可能把控制权交给别人。"]],["两类账户",["链上有两类账户。","外部账户叫 EOA，由私钥控制，能主动发起交易。","合约账户由代码控制，不能主动发起，只能被调用。"]],["EIP-7702 模糊了界线",["但这条界线在变。2025 年 5 月，以太坊 Pectra 升级上线了 EIP-7702，EOA 可以委托执行一段合约代码。","所以，查对方有没有代码，已经不能判断它是不是普通用户。比较 msg.sender 和 tx.origin，也不行。"]],["调用上下文",["再看调用上下文。假设用户调用合约 A，A 调用 B，B 再调用 C。","站在 C 的位置，看四个变量。"]],["站在 C 看四个变量",["tx.origin，是发起整笔交易的用户。","msg.sender，是直接调用 C 的那一个，也就是 B。","msg.value，是这次调用附带的原生币，也就是 B 转给 C 的数量。","address(this)，是当前执行代码的合约，也就是 C 自己。","开头那个金库，该看的是 msg.sender，不是 tx.origin。"]],["三种调用：前两种",["合约之间怎么调用？有三种方式。","第一种 call，最常见。执行 B 的代码，改的是 B 的存储。","第二种 delegatecall。执行的还是 B 的代码，改的却是 A 的存储。","而且 msg.sender 和 msg.value 保持不变。代理合约和库合约，都依赖它。"]],["一个窗口的政务大厅",["打个比方。EVM 像一个只有一个窗口的政务大厅，每个合约是一个科室。","call，是派人带着材料，去 B 的窗口办事。","delegatecall，是把 B 的规程手册借过来，在 A 自己的档案柜上照着办。","如果手册写着，清空 0 号抽屉，被清空的是 A 的抽屉。"]],["比方不成立：可以插队",["这个比方有一处不成立。真实的大厅里，你离开窗口，就不能插队回来。","EVM 里，B 办到一半，可以反过来再找 A。这时 A 的上一件事，还没办完。这就是重入。"]],["只读调用与低级调用",["第三种 staticcall，是只读调用。任何写存储或发事件的操作，都会回滚。","还有一个坑。低级 call 失败时，不会自动让调用者回滚，只返回 false。"]],["存储：一排抽屉柜",["接下来，看数据存在哪里。","每个合约都有一张巨大的键值表，叫存储。键和值都是 32 字节，键叫做槽位。","可以把它想成一排抽屉柜。每个抽屉 32 字节，从 0 号开始编号。"]],["按顺序放，能打包就打包",["规则一，状态变量按声明顺序，从 0 号槽开始放。","规则二，相邻的变量加起来不超过 32 字节，编译器就把它们打包进同一个槽。"]],["打包示例：放不下就顺延",["看一个例子。owner 是地址，占 20 字节，放进 0 号槽。","paused 是布尔值，占 1 字节，也挤进 0 号槽。","fee 是 96 位整数，占 12 字节。20 加 1 加 12 是 33，放不下了。","所以 fee 去了 1 号槽，total 顺延到 2 号槽。"]],["改一个类型，全部错位",["如果把 fee 改成 88 位，也就是 11 字节，三个变量正好 32 字节，全部挤进 0 号槽。","total 就从 2 号槽，挪到了 1 号槽。代理升级时，这种挪动会让后面的变量全部错位。"]],["mapping、数组与常量",["规则三，mapping 自己占一个槽，这个槽是空的。元素放在键和槽号一起哈希出来的位置。","规则四，动态数组的槽里存长度。元素从槽号的哈希开始，依次往后排。","规则五，常量和不可变量，不占存储槽。"]],["存储错位：代理与升级",["为什么这是安全问题？看四个场景。","第一，代理合约和实现合约的变量顺序不一致。实现合约以为在写 owner，实际改写了代理的实现地址。","第二，升级时在中间插入新变量。后面的变量全部错位，余额可能被当成地址来读。"]],["读存储与改写槽位",["第三，用 private 变量存密码或种子。任何人通过 RPC 读一下存储，就能看到。","第四，用 delegatecall 去调用不受信任的合约。对方的代码可以改写你的任何槽位，甚至让合约自毁。","所以 EIP-1967 给代理定了固定的槽位。用哈希算出一个看起来随机的位置，避免和实现合约冲突。"]],["一、private 不是秘密",["下面是最容易误解的 8 个语言特性。每个都看三件事：误解，事实，影响。","一，private。误解是别人看不到。","事实是，它只限制其他合约来调用，存储完全公开。所以不能存秘密。"]],["二、转账会执行代码",["二，receive 和 fallback。误解是，转账只是改个余额。","事实是，向合约转 ETH，会执行它的代码。这就是重入的入口。"]],["三、自毁删不掉合约",["三，selfdestruct。误解是它能删掉合约。","2024 年 Cancun 升级引入了 EIP-6780。之后，只有同一笔交易里创建的合约，才会被删除。其他情况，只转走余额。"]],["四、余额可被强制转入",["四，合约余额。误解是，只能通过我的函数增加。","事实是，任何人都能强制转入。比如 selfdestruct，比如出块奖励地址。","所以，拿合约自己的余额来记账，会被一笔捐赠打乱。"]],["五、六：算术与时间戳",["五，检查型算术。0.8 版以后，溢出会回滚。","但 unchecked 块，类型转换，除法截断，都不会报错。","六，block.timestamp。它不是精确时间。","出块者可以在小范围内改动它，L2 上由排序器决定。不能拿它做随机数，也不能做秒级判断。"]],["七、出块时间不固定",["七，block.number。误解是，每个块的时间固定。","BSC 在 2026 年 1 月的 Fermi 升级后，出块时间从 3 秒缩到了 0.45 秒。L2 上的含义，因链而异。","用区块数来算利息或锁定期，就会出错。"]],["八、函数选择器会撞",["八，函数选择器。误解是，函数名就是唯一的身份。","事实是，选择器只取哈希的前 4 字节，不同的函数签名，可能撞在一起。","2021 年 8 月的 Poly Network 事故，关键一步就在这里，损失约 6.1 亿美元。","按公开复盘，一个构造出来的函数名，撞上了替换验证者公钥的那个函数。"]],["引用还是副本",["审计时还要盯住一对词：storage 和 memory。","storage 是引用，改了会写回。memory 是副本，改了不写回。","写错一个词，余额或标志位没更新，资金就可能被反复领取。"]],["gas 与回滚规则",["最后一块基础，是 gas 和回滚。","每条指令都消耗 gas。gas 用完，当前调用帧回滚。","require 和自定义错误，会回滚当前调用，并向上冒泡。","低级 call 失败却不冒泡，只返回 false 和返回数据。","try catch 只能接住外部调用的失败，接不住本合约内部的失败。"]],["转发 gas 的规则",["外部调用，最多转发剩余 gas 的 64 分之 63。被调用方耗尽 gas，调用方还剩 64 分之 1 来收尾。","这里有一个过时的习惯。transfer 和 send 只转发 2300 gas，曾经被当成防重入的手段。","后来 gas 价格改过几次。接收方是合约钱包时，这种转账会直接失败。","现在推荐的做法，是用 call 转账，再用 CEI 或重入锁来防重入。"]],["规则和编译器都在变",["gas 规则还在变。Fusaka 和尚未上线的 Glamsterdam，都会打破固定 gas 够用的假设。","编译器也在变。0.8 以前，算术默认不检查溢出，必须用 SafeMath。","0.8.24 起，支持瞬态存储，可以做低成本的重入锁。跨链部署前，要确认目标链支持。"]],["每次调用都可能交出控制权",["把这一集放在一起看，就是一句话：每一次调用，都可能把控制权交给别人。","交给了谁，用的是谁的存储，失败时谁回滚，都要自己看清楚。"]],["每个角色今天做一件事",["最后，每个人今天就能做一件事。","写合约的人，搜一遍代码里的 tx.origin，确认没有一处拿它做权限判断。","审计的人，找出每一处 delegatecall，问一句：目标地址由谁决定？","做升级的人，不看工具，写出合约前三个存储槽的内容，再和工具对一遍。"]],["金库问错了问题",["回到开头的问题。管理员没丢私钥，金库为什么认了攻击者？","因为金库问错了问题。它问的是，这笔交易是谁发起的。它该问的是，谁在直接调用我。","这个答案的前提，是权限只认直接调用者。至于对方是人还是合约，EIP-7702 之后，已经没法靠简单比较来判断。"]]]},"d3b":{"src":"../decks/3b1b/ch03.html","scenes":[["示例场景：管理员被钓鱼",["先看一个示例场景，它不是某一起真实事故。","金库的管理员，访问了一个钓鱼页面，调用了攻击者的合约。","攻击者的合约，随后调用了你的金库。"]],["问题：tx.origin 等于 owner，能通过吗",["金库的取款函数写着：要求 tx.origin 等于 owner。这次调用，能通过吗？","要回答它，先要搞清楚一件事：一次调用里，谁是 msg.sender？"]],["EVM：单线程的栈式计算机",["以太坊虚拟机，EVM，是一台单线程的栈式计算机。","每个合约都有自己的代码，和自己的存储。"]],["两类账户，调用会交出控制权",["链上有两类账户。外部账户由私钥控制，能主动发起交易；合约账户由代码控制，只能被调用。","合约之间靠消息调用通信。每一次调用，都可能把控制权交给别人。","还有一个新变化：2025 年 5 月上线的 EIP-7702，允许外部账户委托执行一段合约代码。所以，看一个地址有没有代码，已经判断不了它是不是普通用户。"]],["比方：只有一个窗口的政务大厅",["打个比方。EVM 像一个只有一个窗口的政务大厅。","每个合约是一个科室，有自己的档案柜，也就是存储；还有自己的办事规程，也就是代码。","科室 A 要找科室 B 办事，就派人带着材料，去 B 的窗口。B 办完，再回到 A。"]],["比方不成立处：B 办到一半可以回头找 A",["这个比方有一处不成立：真实的大厅里，你离开窗口后，不能插队回来。","EVM 里，B 办事办到一半，可以反过来再找 A。这时 A 的上一件事，还没办完。这就是重入，下一集的主题。"]],["msg.sender 每站都变，tx.origin 不变",["现在沿着一条调用链走一遍：用户调用合约 A，A 调用 B，B 再调用 C。","每一站，都有四个变量。tx.origin，是发起整笔交易的外部账户。","msg.sender，是直接调用当前函数的地址。msg.value，是这次调用附带的原生币。address(this)，是当前执行代码的合约。","走到 A：tx.origin 是用户，msg.sender 也是用户。","走到 B：msg.sender 变成了 A，tx.origin 还是用户。","走到 C：msg.sender 变成了 B，tx.origin 仍然是用户。msg.sender 每一站都在变，tx.origin 从头到尾不变。"]],["call：执行 B 的代码，改 B 的存储",["合约调用合约，有三种方式。","第一种是 call：执行 B 的代码，改 B 的存储。最常见。"]],["delegatecall：借 B 的代码，改 A 的存储",["第二种是 delegatecall：执行 B 的代码，改的却是 A 自己的存储。msg.sender 和 msg.value 也保持不变。","用大厅的比方：A 把 B 的规程手册借过来，在自己的档案柜上照着做。手册写着清空第 0 号抽屉，被清空的，是 A 的第 0 号抽屉。"]],["staticcall 只读；低级 call 失败不回滚",["第三种是 staticcall，只读调用。任何写存储的操作，都会回滚。","还有一个细节：低级 call 失败时，不会自动让调用者回滚，只返回一个 false。忘记检查它，是常见的错误。"]],["存储槽位：每格 32 字节，按声明顺序打包",["再看存储。它是一张巨大的表，每一格叫一个槽位，32 字节。","状态变量按声明顺序，从 0 号槽开始排。相邻的小变量，能放下就打包进同一个槽。","算一下这个例子。owner 是地址，20 字节，放进 0 号槽。paused 是布尔，1 字节，20 加 1 等于 21，还放得下。","fee 是 uint96，12 字节。21 加 12 等于 33，超过 32，放不下，只好从 1 号槽开始。total 排到 2 号槽。"]],["改一个类型，后面的变量全挪位",["mapping 自己占 3 号槽，里面是空的。它的元素，放在由键和槽号算出的哈希位置。","现在把 fee 改成 uint88，11 字节。20 加 1 加 11，正好 32。三个变量全挤进 0 号槽，total 跟着挪到 1 号槽。"]],["代理用 delegatecall：变量顺序必须一致",["槽位挪一格，为什么是安全问题？","代理合约用 delegatecall，把实现合约的代码，跑在代理自己的存储上。两边的变量顺序必须一致。","如果不一致，实现合约以为自己在写 owner，实际改写的，可能是代理里存放实现地址的那个槽。"]],["升级插入变量会错位；private 不是秘密",["升级时在中间插入一个新变量，后面的变量全部错位，余额可能被当成地址读出来。","另外，存储是公开的。标成 private 的变量，任何人都能从链上读出，不能存密码或种子。"]],["转 ETH 会执行代码；余额能被强制转入",["最后，几个最容易误解的语言特性。","向合约转 ETH，不只是改一个余额。它会执行对方的 receive 或 fallback 函数，这正是重入的入口。","合约的余额，也不是只能通过你的函数增加。别人可以强制转进来。用 address(this).balance 记账，会被这种捐赠操纵。"]],["时间戳不精确；选择器只有 4 字节",["block.timestamp 不是精确时间，出块者能在小范围内调整，不能拿来做随机数。","函数选择器只有 4 个字节，不同的函数签名可能撞在一起。2021 年 Poly Network 的事故，关键一步就和它有关。"]],["答案：msg.sender 是攻击者的合约，能通过",["回到开头的问题：一次调用里，谁是 msg.sender？","是直接调用你的那个地址。在这个场景里，金库看到的 msg.sender，是攻击者的合约。","而 tx.origin，是被骗的管理员。中间经过多少个合约，它都不变。所以，tx.origin 等于 owner，这次调用能通过。"]],["权限看 msg.sender，并看清每一跳",["所以，权限检查要看 msg.sender，不看 tx.origin。前提是，你清楚每一跳是 call 还是 delegatecall；delegatecall 会把 msg.sender 原样带过去。","还要记住：EIP-7702 之后，msg.sender 等于 tx.origin，也不能证明调用者是普通用户。"]]]}}}]},{"name":"第二篇 · 合约代码层","items":[{"id":"04","title":"重入攻击：在你记账之前再取一次钱","md":"../chapters/04-reentrancy.md","v":{"vs":{"src":"skeuo/ep04/out/ep04-full.mp4","cues":[[1.65,2.9,"2016 年 6 月"],[2.92,4.25,"以太坊上的 The DAO"],[4.28,6.2,"被提走了约 360 万 ETH"],[7.17,8.64,"按事发时的价格"],[8.73,10.1,"约 6000 万美元"],[11.09,12.44,"合约没有被破解"],[13.42,16.58,"它只是把两行代码的顺序 写反了"],[17.55,18.88,"先猜一道题"],[19.86,20.95,"一个银行合约"],[20.97,22.51,"金库里有 10 个 ETH"],[22.87,25.03,"你在里面的余额 是 1 个"],[26.01,27.84,"你只调用一次取款函数"],[28.03,29.31,"最多能取走多少"],[30.59,32.4,"答案是 全部 10 个"],[33.38,34.46,"前提有两个"],[34.63,36.77,"银行先转账 后清零"],[37.13,38.92,"而你 是一个合约"],[39.91,41.24,"你每收到一笔钱"],[41.29,42.63,"就在收款的那一刻"],[42.77,43.97,"再调用一次取款"],[44.95,46.06,"账本清零"],[46.2,48.93,"要等到所有嵌套调用都返回之后"],[49.92,50.94,"这就是重入"],[51.31,54.01,"最古老 也最常复发的合约漏洞"],[54.99,56.44,"这一集讲三件事"],[56.67,58.4,"控制权在哪里交出去"],[58.49,59.73,"重入有哪几种"],[59.75,61.04,"怎样把顺序写对"],[64.22,65.72,"先给一句话的定义"],[66.72,68.86,"合约在更新自己的账本之前"],[68.89,70.99,"把控制权交给了外部地址"],[71.97,74.34,"外部地址趁账本还是旧的"],[74.36,75.59,"再次调用合约"],[76.56,77.6,"严格来说"],[77.72,79.94,"重入是一个函数还没执行完"],[80.08,82.01,"就被外部调用再次进入"],[83,83.95,"打个比方"],[84.32,86,"你去银行取 100 元"],[86.99,88.69,"柜员先把现金递给你"],[88.91,90.23,"然后才去改账本"],[91.22,92.73,"你接过现金的瞬间"],[92.86,94.04,"同伴在旁边 议。借贷协议去读这个价格"],[260.45,262.25,"按错误的价格放贷"],[262.7,268.24,"2023 年 2 月，dForce 就是这样，损失约 360 万美元"],[268.24,270.23,"池子自己最后是对的"],[270.23,273.77,"出错的是在中间时刻读数据的第三方"],[275.47,280.42,"怎么修？首选是 CEI：检查，修改状态"],[280.42,282.43,"最后才外部交互"],[282.88,287.87,"回到那个取款函数，只要把清零和转账两行换个位置"],[288.32,292.25,"第二层取款读到的余额是 0，检查不通过"],[292.25,293.55,"整笔攻击回滚"],[294,296.91,"第二道防线是重入锁：执行期间"],[296.91,300.44,"再次进入任何加了锁的函数，都会回滚"],[300.44,305.23,"但它只保护加了锁的函数，挡不住只读重入；跨合约"],[305.23,306.89,"还要共享同一把锁"],[307.34,310.48,"锁本身也可能出错。2023 年 7 月"],[310.48,314.21,"Vyper 编译器的三个版本生成了错误的锁"],[314.21,318.94,"Curve 的几个池子损失约 7,000 万美元。源码正确"],[318.94,320.57,"不等于字节码正确"],[321.02,324.67,"最后，用不变量测试去验证：合约余额"],[324.67,329.39,"在任何调用顺序之后，都不少于所有用户余额之和"],[331.09,335.72,"回到开头的问题：为什么要先记账，再转钱？"],[336.17,339.74,"因为转钱的那一刻，控制权就交出去了"],[339.74,342.89,"对方可以带着旧账本，再进来一次"],[343.34,348.62,"先记账，是让控制权离开时，账本已经是最终的样子"],[349.07,353.66,"前提是，所有读写同一份状态的入口，都遵守这个顺序"],[353.66,357.29,"或者共享同一把锁；第三方读你的数据之前"],[357.29,359.01,"也要确认你不在中途"],[359.46,364.58,"审计时，先找出每一个把控制权交出去的位置，再问"],[364.58,367.47,"那一刻，哪些状态还没更新？"],[367.92,373.64,"下一集：访问控制与权限。不该调用的人，调用了"]],"ch":[]},"talk":{"src":"slides/EP04-reentrancy.html","scenes":[["开场",["大家好，欢迎来到主线第4集，重入攻击。一句话理解，合约在更新自己的账本之前，把控制权交给了外部地址。外部地址趁账本还是旧的，再次调用合约。","看三起事故，以下据公开报道。2016年，The DAO 被重入，约6000万美元。以太坊社区为此做了硬分叉，反对者继续维护原链，就是今天的以太坊经典。","六年后的2022年，借贷协议 Fei Rari 被跨函数重入，约8000万美元。","2023年，Curve 的几个池子被重入，约7000万美元。源码里写了重入锁，但编译器生成的锁是错的。重入在以太坊早期就被发现了，可至今仍在复发。"]],["银行柜员先给钱后改账",["打个比方。你去银行取100元，柜员先把现金递给你，然后才去改账本。","你接过现金的瞬间，同伴在旁边说，他要再取100元。柜员查账本，余额还是100，于是又给了一次。","只要柜员一直先给钱、后改账，你们就能一直取，直到金库空了。","比喻不准的地方在于，现实中是两个人并行办理。EVM 是单线程的，重入不是并发，而是嵌套，第二次取款完整地发生在第一次取款的中间。"]],["两个前提，六类入口",["重入只需要两个前提。第一，合约在函数中途发起外部调用，被调用方受攻击者控制。第二，外部调用发生时，合约的状态还没有更新到最终值。哪些操作会交出控制权？最常见的是向一个地址转原生币，接收方如果是合约，就会执行它的接收函数。","调用代币的转账函数。如果代币合约是攻击者部署的，里面的代码可以是任何东西。ERC-777 代币转账时，会触发接收方的钩子函数。","NFT 的安全转账和安全铸造，会回调接收方。闪电贷回调，设计上就是把控制权交给借款人。最后，任何调用用户提供的地址的操作，比如路由器、钩子和预言机。审计时第一件事，就是把这六类位置全部列出来。"]],["单函数重入",["先看最基本的单函数重入。这个提款函数，先读出余额，检查大于零，然后转账，最后才把余额清零。示例里，银行合约有10个 ETH，攻击者的余额记录是1个。","攻击者调用提款。第一层读到余额1，转出1个 ETH。转账触发了攻击者合约的接收函数，控制权交了出去。","在接收函数里，攻击者再次调用提款。第二层读到的余额，还是1，因为清零那一行还没执行。于是又转出1个。如此反复，每一层都读到旧余额。","一直到第10层，银行余额耗尽，递归停止。然后各层依次返回，执行清零。可是钱已经全部转走了。存了1个，取走10个。"]],["修复：CEI 顺序",["修复方法首选 CEI，就是检查、生效、交互三个单词的首字母。先做所有检查，读余额，确认大于零。","然后修改状态，把余额清零。","最后才做外部交互，转账。","同样的攻击再来一次。第一层清零后转账，攻击者在回调里再次调用提款。第二层读到的余额是零，检查失败，整个调用回滚。攻击直接失败，而且不需要任何额外的开销。"]],["跨函数重入",["只给提款函数加锁，够不够？看跨函数重入。合约里还有一个内部转账函数，没有加锁，和提款函数共享同一个余额表。","攻击者余额1个 ETH，调用提款。转账触发回调，此时余额记录还是1。","在回调里，攻击者不再调用提款，而是调用内部转账，把这1个 ETH 的余额，转给自己的同伙。转账函数检查余额是1，通过。","回调结束，提款函数继续执行，把攻击者的余额清零。结果是，1个 ETH 被提走了，同时同伙的账上又多了1个。存了1个，拿走2个。","所以，所有读写同一状态的函数，要么都加同一把锁，要么都遵循 CEI。据公开复盘，Fei Rari 就是这样，借款函数先发送 ETH 后记账，攻击者在回调里调用了一个没有被锁覆盖的退出市场函数，取回了全部抵押品。"]],["跨合约重入与只读重入",["还有两种重入，普通的锁挡不住。第一种是跨合约重入。协议由多个合约组成，比如金库合约和份额代币合约，它们共享状态。合约 A 的锁，挡不住对合约 B 的调用。B 在此刻读到的，是 A 尚未更新的状态。","第二种是只读重入。攻击者在回调里不修改目标合约，而是让第三方协议去读目标合约的一个只读函数。看这张图。攻击者从一个 AMM 池子移除流动性。池子先转出代币，后更新总量。","在转出代币时，池子回调攻击者。此刻储备已经减少，总量还没减少，池子报出的价格是扭曲的。","攻击者在回调里调用一个借贷协议。借贷协议读取池子的价格函数，拿到扭曲的价格，按错误的价格放贷或清算。","池子自己的状态最终是对的，出错的是在中间时刻读数据的第三方。池子的只读函数通常没有加锁，所以挡不住。防御方在第三方，读取外部价格前，检查对方的重入锁状态，或者改用不受单笔交易影响的价格源。"]],["四种防御方案",["四种防御方案对比一下。CEI 零开销，从根本上消除了中间状态，局限是复杂函数里，很难把所有交互都放在最后。重入锁简单，覆盖整个函数。但它只保护加了锁的函数，不防只读重入，跨合约时要共享同一把锁。","瞬态存储锁更省 gas，但目标链必须支持对应的操作，部署前要确认。拉取式支付，是合约只记账，由用户自己来取，代价是体验多一步。","实践中用纵深防御。把 CEI 当默认写法，所有修改共享状态的入口共用一把锁，不让只读函数暴露中间状态，再用不变量测试验证，合约余额在任何调用序列后都不小于用户余额之和。"]],["源码正确不等于字节码正确",["来看开场提到的 Curve 事故，以下据公开复盘。合约用 Vyper 语言写的，每个函数都标了重入锁。读源码的审计，看不出任何问题。","但 Vyper 的0.2.15、0.2.16和0.3.0三个版本，生成锁的代码有错，不同的函数用了不同的锁槽位。也就是说，每个函数有自己的锁，彼此不互斥，跨函数重入照样发生。","使用原生 ETH 的几个池子受到影响，损失约7000万美元。教训是，源码正确不等于字节码正确。审计范围要包括编译器版本，关键协议要做字节码层面的测试。"]],["允许任意代币 = 允许任意回调",["再看一个反复出现的模式。BNB Chain 上很多项目分叉自以太坊协议。原协议只接受白名单代币，分叉项目放开成任意代币都能上架，却没给存款函数加锁。攻击者上架一个自己部署的代币，在它的转账函数里回调存款，同一笔资产被记账两次。","以太坊上的 Penpie，2024年9月，据公开复盘损失约2700万美元。攻击者无需许可就能创建一个市场，使用自己的恶意代币。Penpie 的批量领取奖励函数没有重入锁，攻击者在回调里存入资产，把存款变成了奖励。","所以，允许任意代币，就等于允许任意回调。上架流程本身是安全边界。协议如果不支持带钩子的代币，就要显式拒绝。"]],["三条链的回调入口不一样",["同一份代码，在不同的链上，回调入口不一样。以太坊上，向合约转 ETH，一定会触发它的接收函数。","TRON 上，用系统交易直接转 TRX，不会执行接收合约的回退函数。但通过合约调用附带转账，就会执行。","Mantle 上，ETH 是以 ERC-20 代币的形式存在的，转 ETH 不触发接收函数。转原生币 MNT，才会触发。所以把以太坊上的重入分析搬到别的链，要重新列一遍回调入口。"]],["审计检查点",["最后是审计检查点，一共七个。第一，列出所有外部调用，包括代币转账、NFT 安全转账、回调和低级调用。第二，每个外部调用之前，相关状态是否都已经更新到最终值。","第三，所有读写同一状态的入口，是否共享同一把锁。第四，有没有只读函数在交互期间返回中间状态，并被其他协议当作价格使用。","第五，协议支不支持带钩子的代币，不支持的话是否显式拒绝。第六，编译器版本有没有已知的重入锁 bug。","第七，在部署的链上，原生币转账会不会触发回退函数。"]],["练一练",["来练一练。一个 NFT 合约的铸造函数，先检查已铸数量小于上限，然后调用安全铸造，最后把已铸数量加一。攻击者能多铸造吗？","能。安全铸造会回调接收方合约。在回调里再次调用铸造函数，此时已铸数量还没加一，上限检查读到的是旧值。修复方法是先把数量加一，再做安全铸造，或者加一把锁。看到了吗？没有转一分钱的 ETH，重入照样发生，因为回调本身就是交出控制权。"]],["小结与预告",["小结三点。第一，重入就是交出控制权时，状态还没更新。审计的第一步，是列出所有交出控制权的位置。","第二，CEI 是首选。锁要覆盖所有共享状态的入口。只读重入，要在读数据的一方防。","第三，源码正确不等于字节码正确。允许任意代币，就等于允许任意回调。手册里的重入实验，可以一步步看调用栈怎样展开。","下一集讲访问控制与权限，不该调用的人调用了。六种权限缺陷，多签和时间锁怎样分层，以及 TRON 上链级的账户权限诈骗。下集见。"]]]},"deck":{"src":"../decks/skeuomorphic/ch04/index.html","scenes":[["The DAO：两行代码写反",["2016 年 6 月，以太坊上的 The DAO，被提走了约 360 万 ETH。","按事发时的价格，约 6000 万美元。","合约没有被破解。","它只是把两行代码的顺序，写反了。"]],["先猜一道题",["先猜一道题。","一个银行合约，金库里有 10 个 ETH。你在里面的余额，是 1 个。","你只调用一次取款函数，最多能取走多少？"]],["答案：全部 10 个",["答案是，全部 10 个。","前提有两个：银行先转账、后清零。而你，是一个合约。","你每收到一笔钱，就在收款的那一刻，再调用一次取款。","账本清零，要等到所有嵌套调用都返回之后。"]],["这就是重入",["这就是重入。最古老，也最常复发的合约漏洞。","这一集讲三件事：控制权在哪里交出去，重入有哪几种，怎样把顺序写对。"]],["重入的定义",["先给一句话的定义。","合约在更新自己的账本之前，把控制权交给了外部地址。","外部地址趁账本还是旧的，再次调用合约。","严格来说，重入是一个函数还没执行完，就被外部调用再次进入。"]],["先给钱、后改账的柜员",["打个比方。你去银行取 100 元。","柜员先把现金递给你，然后才去改账本。","你接过现金的瞬间，同伴在旁边说：他要再取 100 元。","柜员一查，账本上还是 100，于是又给了一次。","只要柜员一直先给钱、后改账，你们就能一直取，直到金库见底。"]],["不是并发，而是嵌套",["这个比方有一处不成立。现实里，柜员可以同时接待两个人。","EVM 是单线程的。重入不是并发，而是嵌套。","第二次取款，整个发生在第一次取款的中间。"]],["重入的两个前提",["所以，重入的前提只有两个。","第一，合约在函数中途发起外部调用，而被调用的一方，受攻击者控制。","第二，外部调用发生的时候，合约的状态，还没有更新到最终值。"]],["交出控制权的操作",["哪些操作会交出控制权？一共有六类。","用 call 转 ETH。接收方是合约时，会执行它的 receive，或者 fallback。","调用代币的 transfer。代币如果是攻击者部署的，里面的代码可以是任意的。","ERC-777 代币转账，会触发接收方的钩子。"]],["回调与用户提供的地址",["NFT 的安全转账和安全铸造，会回调接收方。","闪电贷的回调，设计上就是把控制权交给借款人。","还有，调用任何用户提供的地址，包括路由器、钩子和预言机。"]],["换一条链，入口不一样",["再补一个细节。同一份代码，换一条链，回调入口就不一样。","在 TRON 上，用系统交易转 TRX，不会执行接收合约的 fallback。","附带 callValue 去调用合约，才会执行。","在 Mantle 上，ETH 以 ERC-20 的形式存在，转它不触发 receive。转原生币 MNT，才会触发。"]],["第一种：单函数重入",["接下来，按调用栈，一种一种看。","第一种，单函数重入。","漏洞版的取款函数，分三步：读余额，转账，清零。","攻击者调用取款。银行读到余额 1 个 ETH，用 call 把钱转过去。","攻击合约的 receive 被触发。银行还有钱，它就再调用一次取款。"]],["一层套一层，最后才清零",["第二层读到的余额，还是 1 个。因为第一层的清零，还没执行。","一层套一层，直到金库余额不够，递归才停下来。","然后各层依次返回，依次清零。这时钱已经没了。","递归有上限。gas 和调用深度 1024，都会限制它。所以攻击者会每次取尽量大的金额，减少层数。"]],["第二种：跨函数重入",["第二种，跨函数重入。","攻击者不回到取款函数，而是进入另一个共享同一份余额的函数，比如转账。"]],["先猜：锁住取款够不够",["取款加了重入锁，转账没加。攻击者还能利用回调吗？"]],["答案：能",["能。锁只拦截进入被锁函数的调用。","在回调里，攻击者把还没清零的余额，转给同伙。外层返回之后，才清零。","同一笔钱，既被提走了，又被转走了。"]],["Fei Rari 案例",["2022 年 4 月的 Fei Rari，就是它的真实版本，损失约 8000 万美元。","借款函数先用 call 发送 ETH，后写借款记录。","攻击者在回调里，调用了没有被锁覆盖的退出市场函数，取回了全部抵押品。"]],["第三种：跨合约重入",["第三种，跨合约重入。","协议由多个合约组成，比如金库合约和份额代币合约，它们共享状态。","合约 A 的锁，挡不住对合约 B 的调用。B 此刻读到的，是 A 还没更新的状态。"]],["第四种：只读重入",["第四种，只读重入，最隐蔽。","攻击者在回调里不修改目标合约，而是让第三方协议去读它。","比如一个 AMM 池，移除流动性时，先转出代币，后更新总量。","在回调的那一刻，储备已经减少，总量还没减少。"]],["读到中间状态的第三方",["这时借贷协议来读池子的价格函数，读到一个被扭曲的价格，再按它放贷或清算。","池子自己的状态，最终是对的。出错的，是在中间时刻读数据的第三方。","池子的 view 函数通常不加锁，所以重入锁挡不住。"]],["dForce 约 360 万",["2023 年 2 月的 dForce，就是这样，损失约 360 万美元。","它用 Curve 池在回调期间返回的虚拟价格，给抵押品定价。"]],["首选：CEI 模式",["怎么防？首选，是 CEI 模式。","CEI 是三个词：检查，修改状态，外部交互。函数按这个顺序写。","取款函数只改一处：把清零，挪到转账之前。","这样重入进来时，读到的余额是 0，require 直接回滚。","交出控制权放在最后，此时账本已经一致。"]],["第二道防线：重入锁",["第二道防线，是重入锁。","执行期间，再次进入任何一个加锁的函数，都会回滚。","但锁有边界。它只保护加了锁的函数，不防只读重入，跨合约还要共享同一把锁。","0.8.24 起，可以用瞬态存储做锁，gas 更低。","但目标链必须支持 EIP-1153，部署前要确认。"]],["拉取式支付与 CEI 局限",["还有一种思路，叫拉取式支付。合约只记账，由收款人自己来取。","合约不主动推送，代价是用户要多走一步。","CEI 也有局限。复杂函数里，很难做到所有交互都在最后。"]],["纵深防御四条",["所以要做纵深防御，分四条。","一，把 CEI 当作默认写法。","二，所有修改共享状态的外部入口，加同一把锁。","三，不在 view 函数里给出中间状态的关键价格。必须给出，就提供锁状态查询。","四，用不变量测试守住一件事：任何调用序列之后，合约余额都不少于用户余额之和。"]],["修复要用代码验证",["修复还要用代码验证。同一个攻击测试，在漏洞版上要能提走资金，在修复版上要回滚。","只跑通修复版，无法证明测试真的覆盖了漏洞。"]],["锁写对了，也不一定生效",["最后，锁写对了，也不一定生效。","2023 年 7 月，Curve 的一些池子，源码里写了重入锁。","但 Vyper 编译器的三个版本，生成的锁不正确，不同函数用了不同的锁槽。"]],["源码对不等于字节码对",["攻击者对使用原生 ETH 的池子，发起跨函数重入。","按多方公开复盘，损失约 7000 万美元。","教训是，源码正确，不等于字节码正确。审计范围要包括编译器版本。"]],["ERC-777 钩子入口",["重入的入口，不只是转 ETH。","2020 年 4 月的 imBTC，是一种 ERC-777 代币。转账时，会回调持有人注册的钩子。","借贷协议 Lendf.Me 的存款函数，返回时用旧值写回余额，抵押记录因此虚高。","攻击者借走约 2500 万美元的资产，按事发时估值。据 The Block 报道，资金后来已归还。"]],["上架流程就是安全边界",["在 BNB Chain 上，很多项目分叉自以太坊协议。","原协议只接受白名单代币。分叉项目放开成任意代币都能上架，却没给存款函数加锁。","攻击者上架一个自己部署的代币，在转账函数里回调存款，同一笔资产被记了两次。","允许任意代币，就等于允许任意回调。上架流程本身，就是安全边界。"]],["Penpie 案例",["2024 年 9 月的 Penpie 也类似，损失约 2700 万美元。","攻击者无许可创建市场，市场用了恶意代币。","批量领取奖励的函数没有锁，攻击者在回调里存入资产，把存款变成了奖励。"]],["审计：列出所有外部调用",["所以审计的第一步，是列出所有外部调用。代币转账、NFT 安全转账、回调、低级 call，一个都不漏。","然后对每一处问两句。","调用之前，相关状态都更新到最终值了吗？","读写同一状态的入口，共用同一把锁吗？"]],["每个角色今天做一件事",["最后，每个人今天就能做一件事。","写合约的人，找到第一个把控制权交出去的位置，问一句：那一刻，哪些状态还没更新？","审计的人，查一下编译器版本有没有已知的锁 bug，再查部署链上转原生币，会不会触发 fallback。","普通用户，存款前看协议有没有审计报告，范围是否覆盖你要用的合约。","没有审计的新金库，只放能承受损失的金额。"]],["把顺序写对，读到的就是 0",["回到开头的问题。只调用一次取款，为什么能取走全部 10 个 ETH？","因为银行先给钱、后记账。每一层嵌套调用，读到的都是同一个旧余额。","这个答案的前提，是收款方能执行代码，而状态在交出控制权之前还没更新。","把顺序写对，第二层读到的就是 0。"]]]},"d3b":{"src":"../decks/3b1b/ch04.html","scenes":[["The DAO：约 360 万 ETH 被提走",["2016 年 6 月，攻击者从 The DAO 提走了约 360 万 ETH，按当时估值约 6,000 万美元。","合约没有被破解。它只是把两行代码的顺序，写反了。"]],["哪两行？先转钱，后清零",["一行是把钱转出去，一行是把账本上的余额清零。","问题来了：为什么要先记账，再转钱？"]],["最简单的例子：银行合约取款",["看一个最简单的例子。银行合约里有 10 个 ETH，账本上记着你的余额：1 个 ETH。","取款函数分三步：读出你的余额，把钱转给你，再把余额清零。"]],["你是合约：收钱时再取一次",["但你不是一个普通账户，你是一个合约。收到 ETH 时，你的 receive 函数会自动执行。","你在 receive 里，再调用一次取款。这时账本还没清零，读到的还是 1 个 ETH。"]],["每层都读到 1：10 个 ETH 被取空",["于是银行又转给你 1 个。每一层都读到 1，转出 1。","银行从 10 降到 9、8、7，一直到 0。你只存了 1 个 ETH，却一次取走了全部 10 个。"]],["比方：柜员先给钱，后改账",["打个比方。你去银行取 100 元，柜员先把现金递给你，然后才去改账本。","你接过现金的瞬间，同伴在旁边的窗口说：他要再取 100 元。","柜员查账本，余额还是 100，于是又给了一次。只要一直先给钱、后改账，你们就能一直取。"]],["比方不成立处：是嵌套，不是并发",["这个比方有一处不成立：现实里的两个柜员，是同时在办事。","EVM 是单线程的。重入不是并发，而是嵌套：第二次取款，完整地发生在第一次取款的中间。"]],["调用栈：清零那一行总是最后执行",["把调用栈画出来，就看得清楚。","第一层取款，转账，控制权交给攻击者；攻击者调用第二层取款，又转账，再交出去。","每一层，都停在转账那一行，清零那一行还没执行。","等银行的钱不够了，最内层先返回，各层再依次执行清零。","清零确实发生了，只是发生在所有转账之后。递归的深度，受 gas 和 1024 层调用深度限制，攻击者会一次取尽量大的金额。"]],["重入的两个前提",["所以，重入的前提只有两个。","第一，合约在函数中途发起外部调用，被调用的一方受攻击者控制。第二，那一刻，合约的状态还没有更新到最终值。"]],["交出控制权的不只是转 ETH",["会把控制权交出去的，不只是转 ETH。","转一个攻击者部署的代币，它的代码可以任意；ERC-777 的转账钩子，NFT 的安全转账，都会回调接收方。","闪电贷的回调，本来就是把控制权交给借款人。调用任何用户提供的地址，都是一样。"]],["跨函数重入：锁只挡了一个函数",["攻击者回来时，不一定回到同一个函数。","取款函数加了重入锁，转账函数没加。攻击者在回调里调用转账，把还没清零的余额，转给同伙。","等外层取款返回、余额清零时，这笔钱已经既被提走，又被转走了。这叫跨函数重入。"]],["Fei Rari 约 8,000 万美元；跨合约重入",["2022 年 4 月，Fei Rari 的借贷池就是这样：先发 ETH，后写借款记录。攻击者在回调里调用了没被锁覆盖的退出函数，损失约 8,000 万美元。","如果共享状态分散在几个合约里，合约 A 的锁，也挡不住对合约 B 的调用。这是跨合约重入。"]],["只读重入：在错误的时刻读数据",["还有一种更隐蔽的：只读重入。攻击者不修改目标合约，只让别人在错误的时刻去读它。","一个交易池在移除流动性时，先转出代币，后更新总量。转出的那一刻，它回调攻击者。","这时储备已经减少，总量还没减少，池子报出的价格是歪的。"]],["dForce 约 360 万美元：第三方读错了",["攻击者趁机调用借贷协议。借贷协议去读这个价格，按错误的价格放贷。","2023 年 2 月，dForce 就是这样，损失约 360 万美元。池子自己最后是对的，出错的是在中间时刻读数据的第三方。"]],["首选 CEI：检查 → 改状态 → 外部交互",["怎么修？首选是 CEI：检查，修改状态，最后才外部交互。","回到那个取款函数，只要把清零和转账两行换个位置。","第二层取款读到的余额是 0，检查不通过，整笔攻击回滚。"]],["重入锁：有用，但有边界",["第二道防线是重入锁：执行期间，再次进入任何加了锁的函数，都会回滚。但它只保护加了锁的函数，挡不住只读重入；跨合约，还要共享同一把锁。","锁本身也可能出错。2023 年 7 月，Vyper 编译器的三个版本生成了错误的锁，Curve 的几个池子损失约 7,000 万美元。源码正确，不等于字节码正确。"]],["用不变量测试来验证",["最后，用不变量测试去验证：合约余额，在任何调用顺序之后，都不少于所有用户余额之和。"]],["答案：让控制权离开时，账本已是最终样子",["回到开头的问题：为什么要先记账，再转钱？","因为转钱的那一刻，控制权就交出去了。对方可以带着旧账本，再进来一次。","先记账，是让控制权离开时，账本已经是最终的样子。"]],["成立条件，以及审计时怎么问",["前提是，所有读写同一份状态的入口，都遵守这个顺序，或者共享同一把锁；第三方读你的数据之前，也要确认你不在中途。","审计时，先找出每一个把控制权交出去的位置，再问：那一刻，哪些状态还没更新？"]]]}}},{"id":"05","title":"访问控制与权限：谁有权按这个按钮","md":"../chapters/05-access-control.md","v":{"vs":{"src":"skeuo/ep05/out/ep05-full.mp4","cues":[[1.65,3.12,"2017 年 11 月"],[3.22,5.38,"以太坊上发生了一件怪事"],[6.36,7.28,"有个用户"],[7.37,9.79,"调用了一个库合约的初始化函数"],[10.78,14.22,"这个库 是 Parity 多签钱包共用的代码"],[15.22,16.15,"部署之后"],[16.23,17.84,"从来没有人初始化过它"],[18.82,21.02,"于是 他成了这个库的 owner"],[22,23.87,"接着 他调用了 kill"],[23.9,25.26,"把库合约销毁了"],[26.25,27.61,"依赖这个库的钱包"],[27.74,29.36,"一下子失去了代码逻辑"],[30.36,31.75,"约 51 万 ETH"],[31.77,32.8,"就此冻结"],[33.79,35.46,"他没有破解任何密码"],[35.56,37.07,"也没有偷任何私钥"],[38.07,39.42,"他只是调用了一个"],[39.45,41.19,"没有权限检查的函数"],[42.18,43.82,"这一集讲访问控制"],[44.82,46.04,"每个按钮背后"],[46.09,47.27,"都有同一个问题"],[47.47,48.62,"谁有权按它"],[5  函数是机房的门，要刷卡。漏洞一，机房门忘了装刷卡器，就是缺少权限检查。","漏洞二，刷卡器只检查刷卡的人是不是从总裁办公室出来的，不检查刷卡的到底是谁。这就是用 tx.origin 鉴权。","漏洞三，大楼刚建好时，第一个走进物业办公室、宣布我是经理的人，就成了经理。这是未初始化。","漏洞四，总裁的门卡一直放在前台抽屉里，这是私钥管理。","比喻不准的地方在于，写字楼的锁可以换。合约如果没有升级能力，锁一旦装错，就永远是错的。"]],["五种攻击者身份",["权限问题的攻击者有五种身份。第一种，任意外部地址，可以调用所有公开函数。典型攻击是调用没有保护的增发、改 owner 或初始化函数。","第二种，恶意合约，在 owner 和它交互时插入调用，利用 tx.origin 冒充 owner。第三种，被钓鱼的特权用户，签下了自己看不懂的交易。","第四种，拿到私钥的攻击者，完全等同于特权角色。第五种，内部人员，合法持有特权，却跑路或者恶意升级。后三种，代码写得再对也防不住，要靠权限设计。"]],["缺陷一、二：缺检查与 tx.origin",["第一种缺陷，缺少权限检查。这个增发函数是外部可调用的，没有任何修饰器，任何人都能增发。","修复很简单，加上角色检查，只有拥有增发角色的地址才能调用。","注意一个历史问题。Solidity 0.5之前，函数默认可见性是 public。旧合约如果忘了写可见性，就等于把内部函数暴露给了所有人。审计老代码时要特别留意。","第二种缺陷，用 tx.origin 鉴权，第3集讲过机制。修复是改用 msg.sender。"]],["缺陷三：未保护的初始化",["第三种缺陷，未保护的初始化函数。可升级合约和克隆合约，用初始化函数代替构造函数。如果它谁都能调用，或者可以重复调用，任何人都能把自己设为 owner。","修复有两处。第一，初始化函数加上 initializer 修饰器，保证只能执行一次。第二，在实现合约的构造函数里，调用禁用初始化，把实现合约本身锁死。","为什么实现合约本身也要锁？因为实现合约也是一个独立部署的合约，任何人都可以直接调用它。下面这起事故，就是两处都没锁好。"]],["案例：Parity 的两次事故",["来看 Parity 多签钱包，以下据公开复盘。每个钱包是一个很薄的合约，遇到不认识的调用，就用 delegatecall 转给一个共享的库合约。","2017年7月。库里的钱包初始化函数没有保护。攻击者通过钱包调用了它，delegatecall 改写的是钱包自己的存储，攻击者成了钱包的 owner，转走约15.3万个 ETH。","修复后，部署了一个新的库合约。但这个库合约本身没有初始化。","2017年11月，一个用户直接调用了这个库的初始化函数，成了库的 owner，然后调用了库的自毁函数。","库合约消失了。所有依赖它的钱包失去了代码逻辑，资金还在，却再也调不动，约51万个 ETH 被永久冻结。教训是，实现合约本身也必须初始化，或者在构造函数里锁死。"]],["缺陷四至六",["第四种缺陷，任意外部调用。一个执行函数，让用户指定目标地址和调用数据。如果这个合约持有别人给它的代币授权，攻击者就把调用数据构造成，从受害者转账给攻击者。如果这里用的是 delegatecall，攻击者的代码会直接改写本合约的存储。","第五种，单步所有权转移。owner 一步把权限转给新地址，输错一个字符，权限就永久丢失。修复是两步式，新 owner 必须主动调用接受函数。","第六种，签名鉴权写错。用签名代替消息发送者来鉴权时，ecrecover 对无效签名会返回零地址。如果被比较的签名者变量从没设置过，它默认也是零，检查就通过了。第9集会详细讲签名。"]],["最小权限：拆分角色",["防御的核心是最小权限，把一个万能的 owner，拆成多个角色，每个角色只做一件事。升级角色负责升级实现合约，由多签加时间锁持有，示例延迟48小时以上。","参数管理员负责调整费率和抵押率，同样是多签加时间锁，示例延迟24小时。","暂停角色负责紧急暂停，由小型多签或者监控机器人持有，没有延迟。增发角色只授予特定的合约，不给任何人。","为什么暂停要快、升级要慢？暂停只能止损，不能转走资金。升级可以做任何事。所以权力越大，延迟越长。"]],["多签 + 时间锁",["多签加时间锁是这样工作的。提案者是一个5选3的多签，它不能直接修改目标合约，只能把操作提交到时间锁合约排队。","示例延迟48小时。这48小时里，排队的操作是公开的，监控和社区都能看到。","如果发现是恶意操作，守护者可以取消。注意权限是不对称的，守护者只能取消，不能发起。","用户如果不同意，可以在这48小时里撤出资金。延迟到期后，操作才被执行。","这套设计的局限是，如果多签的签名人被同时钓鱼，比如所有人都看到了同一个被篡改的界面，多签就防不住。它只能防单个私钥被盗。时间锁的价值，正在于给发现留出时间。"]],["L2 视角：谁能升级桥",["二层网络的桥合约，持有用户全部的跨链资产。谁能升级桥合约，谁就能决定这些资产的去向。看 Mantle，以下据 L2BEAT 截至2026年的公开页面。","Mantle 有一个安全多签，14个签名人，阈值是6。它可以没有延迟地升级一层网络上的桥和输出预言机合约。","算一下信任假设。6个签名就能升级，那么只要有6个人合谋或者同时被攻破，资产就不安全。反过来说，用户相信的是，14个人里至少有9个不会这样。","L2BEAT 把没有升级延迟、没有退出窗口，标为关键风险。这不是代码漏洞，而是信任假设。评估时，要把它写进剩余风险。链专题 C03 会详细讲。"]],["账户层权限：TRON",["前面讲的都是合约层的权限。还有一种账户层的权限，以 TRON 为例。以太坊的外部账户只有一把私钥。TRON 账户原生支持多重权限，有 Owner、Active 和 Witness 三类。Owner 是最高权限，可以修改其他权限。Active 负责日常操作。","每个权限有一组地址，每个地址有权重，权限有阈值，权重之和达到阈值，操作才执行。","这带来一种诈骗。受害者在假钱包或钓鱼页泄露了私钥。攻击者不急着转钱，而是把账户的 Owner 和 Active 权限都改成自己的地址。","受害者仍然能看到余额，但已经转不出去了。转入不需要签名，所以新的 USDT 还在不断转进来。攻击者择机一次全部转走。","这类骗局常见于场外交易。骗子提供一个有余额却转不出来的账户私钥，诱导对方支付手续费。对开发者的含义是，在 TRON 上收到一个地址，不能假设它由单一私钥控制。"]],["案例：押金就是权限",["最后看 BNB Chain 的 Token Hub，以下据公开复盘。跨链消息要由中继者提交。当时，注册中继者只需要支付100个 BNB 的押金。","攻击者付了押金，成为中继者，再利用证明验证的一个缺陷，伪造了跨链消息。","凭空铸造了200万个 BNB，按当时价格约5.7亿美元。其中一亿多美元被转出链外，其余被冻结。","之后的修复硬分叉，把中继者改成了白名单。教训是，只要付押金就能注册，这本身就是一个权限决策。100个 BNB 的门槛，和它能控制的资产规模相比，太低了。"]],["审计检查点",["审计检查点有八个。第一，每个修改状态的函数，都有明确的权限检查，或者有一份任何人调用都安全的论证。第二，没有任何地方用交易发起人鉴权。","第三，初始化函数有 initializer 修饰，实现合约的构造函数锁死了初始化。第四，不存在用户可以控制的任意调用或委托调用目标。","第五，所有权转移是两步式。第六，特权角色已经拆分，升级和参数修改经过时间锁。","第七，特权私钥由谁持有、怎样存放、阈值多少，都已文档化，并有撤销流程。Ronin 就缺了撤销这一步。第八，部署链的账户模型和以太坊是否一致，比如 TRON 的多权限账户。"]],["练一练",["来练一练。一个协议的暂停角色可以暂停提款，没有时间锁。这个设计合理吗？如果暂停角色的私钥被盗，最坏情况是什么？","参考答案。没有延迟是合理的，因为暂停只能止损，不能转走资金。最坏情况是，攻击者长期冻结提款，造成恐慌，甚至以此勒索。缓解办法是，让暂停有自动到期时间，恢复由更高门槛的多签执行，并且暂停私钥可以被快速撤换。"]],["小结与预告",["小结三点。第一，每个函数都要回答谁可以调用我，六种缺陷逐一排查。","第二，实现合约本身也要锁死初始化，所有权转移用两步式。","第三，用最小权限、多签和时间锁设计特权角色。撤销流程和账户模型，同样是权限的一部分。","下一集讲算术与精度，数字算错了。舍入方向，金库通胀攻击，以及同一个 USDT 在三条链上不同的小数位。下集见。"]]]},"deck":{"src":"../decks/skeuomorphic/ch05/index.html","scenes":[["有人成了库合约的 owner",["2017 年 11 月，以太坊上发生了一件怪事。","有个用户，调用了一个库合约的初始化函数。","这个库，是 Parity 多签钱包共用的代码。","部署之后，从来没有人初始化过它。","于是，他成了这个库的 owner。"]],["约 51 万 ETH 被冻结",["接着，他调用了 kill，把库合约销毁了。","依赖这个库的钱包，一下子失去了代码逻辑。","约 51 万 ETH，就此冻结。","他没有破解任何密码，也没有偷任何私钥。","他只是调用了一个，没有权限检查的函数。"]],["谁有权按这个按钮",["这一集讲访问控制。","每个按钮背后，都有同一个问题：谁有权按它？"]],["谁可以调用我",["合约里每一个修改状态的函数，都要回答一个问题：谁可以调用我？","如果答案是任何人，就必须证明，任何人调用都安全。"]],["合约像一栋写字楼",["打个比方。合约像一栋写字楼。","public 函数是大堂的门，谁都能进。","onlyOwner 函数是机房的门，要刷卡。","这个比方有一处不成立。写字楼可以换锁。","合约如果不能升级，锁一旦装错，就永远是错的。"]],["谁会来试这些门",["谁会来试这些门？大致有五类。","任意外部地址，恶意合约，被钓鱼的特权用户，拿到私钥的攻击者。","还有内部人员，他们本来就合法持有权限。"]],["一、缺少权限检查",["下面看六种常见缺陷。先看前三种。","第一种，缺少权限检查。","一个增发函数，对外公开，却没有修饰器。任何地址，都能给自己印币。","修复是加上 onlyRole，只认持有 MINTER 角色的地址。","老合约还有一个坑。Solidity 0.5 之前，函数默认是 public。","忘写可见性，内部函数就暴露给了所有人。"]],["二、用发起人鉴权",["第二种，用 tx.origin 做鉴权。","tx.origin，是最初签名的那个外部账户。","管理员去领空投，调用了攻击者的合约。攻击者的合约，再来调用你的。","这时 tx.origin 仍然是管理员。检查通过了。","修复是改看 msg.sender，也就是直接调用者。中间的合约，冒充不了它。"]],["三、未保护的初始化",["第三种，未保护的初始化函数。","可升级合约和克隆合约，用 initialize 代替构造函数。","如果它没人调用，或者能被重复调用，谁先调用，谁就是 owner。"]],["初始化的两步修复",["修复有两步。第一步，加上 initializer 修饰器，只允许执行一次。","第二步，在实现合约的构造函数里，调用 disableInitializers，把实现合约本身锁死。","开头的 Parity 库合约，缺的正是这一步。"]],["Parity 第一次",["其实，Parity 在同一年出过两次事。","2017 年 7 月那次，钱包合约把不认识的调用，用 delegatecall 转给了库合约。","库里的 initWallet 没有保护。攻击者通过钱包调用它，把自己设成了 owner。","约 15.3 万 ETH 被转走，约合 3000 万美元。"]],["Parity 第二次",["11 月那次不同。被接管的是库合约自己，然后它被销毁了。","两次的教训相同：实现合约本身，也要初始化或者锁死。"]],["四、任意外部调用",["这就引出第四种缺陷：任意外部调用，和任意 delegatecall。","一个合约公开了 execute 函数。目标地址和调用数据，全由调用者决定。","假设这个合约，持有受害者对某个代币的授权。"]],["借合约之手转走代币",["攻击者不需要受害者的私钥。","他让这个合约去调用代币的 transferFrom，把受害者的币转给自己。","代币合约看到的调用方，是被授权的合约。额度检查，通过。"]],["权限不是被偷，是被借走",["如果这里用的是 delegatecall，攻击者的代码，会直接改写这个合约的存储。","权限没有被偷，是被借走了。"]],["五、单步所有权转移",["第五种，单步所有权转移。","owner 填入新地址，一步就生效。地址输错，权限就永久丢失。","修复是两步转移。新 owner 必须自己调用 acceptOwnership，证明这个地址真的能用。"]],["六、签名鉴权写错",["第六种，签名鉴权写错。","用签名代替 msg.sender 时，ecrecover 遇到无效签名，会返回零地址。","如果被比较的签名人变量没有设置，它的默认值也是零。两边相等，检查就通过了。","所以比对前，先排除零地址。"]],["三个容易漏掉的判断",["最后，还有三个容易漏掉的判断。","一，代码长度是零，不能证明对方是外部账户。构造函数里发起调用的合约，代码长度也是零。","二，renounceOwnership 之后，owner 权限无法恢复。先确认没有函数还依赖它。","三，Solidity 0.4 时期，构造函数和合约同名。合约一改名，旧构造函数就成了公共函数。"]],["账户本身也有权限",["前面讲的，都是合约层的权限。账户本身，也有权限。","以太坊的外部账户，只有一把私钥。","TRON 不一样。按 TRON 官方文档和安全公司的公开资料，它的账户原生支持多重权限。"]],["三种权限与阈值",["Owner 权限最高，能修改其他权限，包括增删签名人。","Active 管日常操作，比如转账、质押、调用合约。它可以有多个，每个可以限定操作类型。","Witness 只管超级代表，也就是出块节点的相关操作。","每个权限有一组地址，每个地址有权重。","权重加起来达到阈值，操作才执行。"]],["多签诈骗三步",["这套设计，被骗子用来做多签诈骗。","第一步，受害者在假钱包或钓鱼页上，泄露了私钥。","第二步，攻击者修改账户权限，把 Owner 和 Active 都改成自己。","第三步，受害者还能看到余额，但已经转不出来。"]],["看得见、转不走的账户",["转入不需要签名。新的 USDT，还会继续转进来。","攻击者不急。账户看起来正常，他择机再全部转走。","这种骗局，也常见于场外交易。","骗子给你一个有余额、却转不出来的账户私钥，诱导你付手续费。"]],["一个地址不等于一把私钥",["对合约开发者，这里有一个含义。","在 TRON 上，一个地址等于一把私钥，这个假设不成立。","收到一个地址，不能假设它由单一私钥控制。设成 owner 之前，先查它的权限配置。"]],["最小权限：拆分角色",["知道了门怎么坏，再看钥匙怎么分。","第一个原则，最小权限。把一个 owner 拆成几个角色，每个角色只做一件事。","升级者，负责升级实现合约。建议多签加时间锁，延迟 48 小时以上。","参数管理员，修改费率和抵押率。建议多签加时间锁，延迟 24 小时。","这两个数字只是示例，不是标准。"]],["暂停者与增发者",["暂停者，负责紧急暂停。小型多签或监控机器人就够了，不加延迟。","增发者，只授予特定的合约。"]],["先猜一道题",["为什么暂停要快，升级要慢？"]],["暂停止损，升级万能",["暂停只能止损，转不走资金。升级可以做任何事。"]],["多签加时间锁",["第二个原则，多签加时间锁。","提案者是一个多签，比如五个人里三人签名，才能把操作交给时间锁。","时间锁让操作公开排队，比如 48 小时。到期之后，才能执行。","排队期间，大家都看得到。用户不同意，可以在延迟期内撤出。","守护者发现恶意操作，可以取消，但不能发起。权限是不对称的。"]],["多签的局限",["这套设计也有局限。","多签防的是单个私钥被盗。如果所有签名人看到的，是同一个被篡改的界面，多签就挡不住。","阈值还要和私钥的独立性相匹配。"]],["Ronin：9 选 5",["2022 年 3 月的 Ronin 跨链桥，9 个验证者里，5 个签名就能放行。","攻击者控制了 5 把私钥。按公开复盘，其中 4 把属于同一家机构。","还有一把，来自一个早就不需要、却一直没撤销的授权。损失约 6.2 亿美元。"]],["付押金当中继者",["同年 10 月，BNB Chain 的 Token Hub 出事。","攻击者付了 100 BNB，注册成跨链中继者，再利用证明验证的缺陷，凭空铸造了 200 万 BNB。","Moran 硬分叉把中继者改成了白名单。","只要付押金就能当中继者，这本身就是一个权限决策。"]],["谁能升级 L2 的桥",["最后看 L2。谁能升级桥合约，谁就决定用户跨链资产的去向。","根据 L2BEAT 截至 2026 年 11 月的页面，Mantle 的安全多签，14 人里 6 人签名，就能无延迟升级 L1 上的桥。","这是信任假设，不是代码漏洞。但存钱之前，你应该知道它。"]],["每个角色今天做一件事",["最后，每个人今天就能做一件事。","写合约的人，列出每个修改状态的外部函数，逐个写下：谁能调用，凭什么安全。","审计的人，搜一遍 initialize 和 delegatecall。确认实现合约已锁死，目标地址不由用户决定。","管私钥的人，列出所有特权私钥：谁持有，放在哪，阈值多少，上次撤销是什么时候。","普通用户，存款前看一眼协议的管理员权限。管理员是单个地址，就是高风险信号。","在 TRON 上，不导入别人给的私钥，也不签修改账户权限的交易。"]],["一个没人回答过的按钮",["回到开头的问题。那个用户没破解任何东西，为什么能冻结约 51 万 ETH？","因为库合约上有一个按钮，从来没有人回答过：谁有权按它？","修复是部署时就在构造函数里锁死初始化。","但这个答案的前提是，合约里别的按钮，也都回答过同一个问题。少一个，就还是一扇没装锁的门。"]]]},"d3b":{"src":"../decks/3b1b/ch05.html","scenes":[["Parity：库被销毁，约 51 万 ETH 冻结",["2017 年 11 月，一名用户初始化了 Parity 多签钱包共用的一个库合约。","然后，他调用了库里的 kill 函数，把这个库销毁了。","依赖这个库的钱包，一下子失去了代码逻辑。大约 51 万个 ETH，被冻结了。"]],["没破解任何密码，只调用了没检查权限的函数",["他没有破解任何密码。他只是调用了一个没有权限检查的函数。","问题来了：谁有权按这个按钮？"]],["规则：每个改状态的函数都要回答谁能调用",["先说规则。合约里每一个会修改状态的函数，都必须回答一个问题：谁可以调用我？","如果答案是任何人，就必须证明：任何人调用，都是安全的。"]],["比方：写字楼的大堂门与机房门",["打个比方，合约像一栋写字楼。公开函数是大堂的门，谁都能进；只有管理员能调的函数，是机房的门，要刷卡。","常见的漏洞，就是这几种：机房门忘了装刷卡器；刷卡器查错了人；楼刚建好时，谁先走进物业办公室，谁就成了物业经理；还有，总裁的门卡放在前台抽屉里。"]],["比方不成立处：合约不能升级就换不了锁",["这个比方有一处不成立：写字楼可以换锁。合约如果不能升级，锁装错了，就永远是错的。"]],["第一种：根本没有检查",["第一种，最直接：根本没有检查。","一个增发函数，对外公开，没有任何修饰器。任何地址都能调用它，给自己印钱。","修复是加上角色检查：只有持有增发角色的地址，才能通过。"]],["第二种：检查查错了人，该查 msg.sender",["第二种，检查查错了人。上一集讲过：tx.origin 是发起整笔交易的账户。","管理员被骗去调用攻击者的合约，攻击者的合约再来调用你，tx.origin 仍然是管理员。所以要检查 msg.sender，也就是直接调用你的那一方。"]],["第三种：没有人初始化，第一个调用者成 owner",["第三种，就是开头的 Parity：没有人初始化。","可升级合约和库合约，常用一个初始化函数代替构造函数。部署之后，如果没人调用它，第一个调用的人，就成了 owner。"]],["Parity 两次：约 15.3 万 ETH，再到库被 kill",["2017 年 7 月，Parity 的钱包把不认识的调用，转交给库合约执行。库里的初始化函数没有保护，攻击者借此把自己设成 owner，转走约 15.3 万个 ETH。","修复后的新库，自己却没有初始化。11 月，有人调用它的初始化函数，成了库的 owner，再调用 kill，库就没了。"]],["修复：初始化只能执行一次，并锁死实现合约",["修复方法有两步：初始化函数只能执行一次；实现合约在构造函数里，直接锁死自己的初始化。"]],["第四种：合约替用户去调用任意地址",["第四种更隐蔽：合约替用户去调用任意地址。","这个函数接收一个目标地址和一段数据，然后以合约自己的身份去调用。目标和数据，全由调用者决定。","假设受害者曾经授权这个合约，可以动用他的代币。"]],["让合约调 transferFrom，额度检查照样通过",["攻击者就让合约去调用代币的 transferFrom，从受害者转给自己。代币合约看到的调用方，是被授权的合约，额度检查照样通过。","如果这里用的是 delegatecall，攻击者的代码还能直接改写这个合约的存储。"]],["最小权限：暂停要快，升级要慢",["检查写对了，还要问：这把钥匙，交给谁？","第一个原则是最小权限：把一个全能的 owner，拆成几个角色，每个角色只做一件事。","升级合约的角色，交给多签加时间锁，比如延迟 48 小时；调参数的角色，比如延迟 24 小时；这两个数字都是示例。","暂停的角色要快，可以没有延迟；增发的角色，只授予特定的合约。","暂停要快，升级要慢。因为暂停只能止损，不能转走资金；升级，却可以做任何事。"]],["多签加时间锁：提案排队，期间可取消、可退出",["看看多签加时间锁怎么配合。以 5 个签名人里要 3 个同意为例。","提案先进入时间锁排队，示例延迟 48 小时。到期之后，才能执行。","这 48 小时里，监控和社区都能看到队列。守护者发现恶意操作，可以取消，但不能发起。不同意的用户，可以先退出。"]],["阈值要匹配私钥独立性：Ronin 的教训",["但阈值要和私钥的独立性匹配。2022 年 3 月的 Ronin 跨链桥，9 个验证者里 5 个签名就能放行。","攻击者控制了 5 把私钥，其中一把，来自一个早就不需要、却一直没有撤销的授权。","多签也有局限：它能防单把私钥被盗，防不了所有签名人看到同一个被篡改的界面。"]],["答案：必须写在代码里，Parity 没回答",["回到开头的问题：谁有权按这个按钮？","答案必须写在代码里。每一个修改状态的函数，都要明确它的调用者；如果是任何人，就要证明任何人都安全。","Parity 的库合约，没有回答这个问题。于是第一个来的人，替它回答了。"]],["代码只管到按钮，还要管钥匙，并看账户模型",["但代码只管到按钮。按钮背后的钥匙，在谁手里，有几把，能不能撤销，同样是访问控制。","前提是，你清楚部署链的账户模型。比如在 TRON 上，一个地址，不一定只由一把私钥控制。"]]]}}},{"id":"06","title":"算术与精度：差一个 wei，丢一个金库","md":"../chapters/06-arithmetic-precision.md","v":{"vs":{"src":"skeuo/ep06/out/ep06-full.mp4","cues":[[1.65,3.01,"2025 年 11 月"],[3.11,4.76,"Balancer V2 的稳定池"],[4.78,5.92,"被人取走了资金"],[6.91,8.19,"官方复盘估算"],[8.37,11.48,"用户资金被盗约 9480 万美元"],[12.48,15.29,"根因 被定位在一处取整错误"],[16.28,18.04,"单次交换的误差很小"],[19.02,20.96,"攻击者把大量小额交换"],[21.02,22.55,"串进一笔批量交换"],[23.56,24.81,"每一步的误差"],[24.88,26.76,"都朝对自己有利的方向累积"],[27.76,29.08,"先猜一道题"],[29.45,32.75,"金库里 每份额值 1.5 个最小资产单位"],[33.74,34.98,"铸造 1 份额时"],[35.12,37.22,"合约把应收的 1.5 向下取整"],[37.31,38.35,"只收 1 个单位"],[39.34,40.46,"重复 1000 次"],[40.63,41.97,"调用者多拿了多少"],[43.24,44.57,"大约 500 个单位"],[44.94,46.11,"这些差额"],[46.17,47.35,"来自其他持有人"],[48.34,49.85,"EVM 只有整数"],[50.23,51.37,"每一次除法"],[51.55,52.63,"都会丢掉余数"],[53.62,55.1,"丢掉的余数归谁"],[55.26,57.31,"决定了谁能从协议里"],[57.37,58.63,"慢慢抠出钱"],[59.62,61.13,"这一集讲三件事"],[61.15,62.34,"数学缺陷"],[62.43,63.51,"舍入方向"],[63.53,64.53,"金库通胀"],[67.72,69.29,"合约里的数学缺陷"],[69.35,70.48,"可以分成五类"],[71.46,72.95,"溢出 截断"],[73.13,74.34,"先除后乘"],[74.41,75.47,"舍入方向"],[75.56,76.63,"单位不一致"],[77.61,79.07,"第一类 溢出"],[79.43,80.75,"整数有上限"],[80.83,81.85,"超过上限"],[81.93,83.12,"结果会回绕"],[84.12,85.41,"2018 年 4 月"],[85.57,87.19,"以太坊上的 BEC 代币"],[87.21,88.69,"栽在批量转账上"],[89.67,92.19,"合约用 0.4 版的 Solidity 写成"],[92.25,93.38,"没有溢出检查"],[94.38,95.85,"函数先算总额"],[95.97,97.01,"接收人数"],[97.03,98.34,"乘以每人的金额"],[99.32,101.38,"攻击者填了 2 个接收地址"],[101.57,103.63,"每人 2 的 255 次方"],[104.61,106.68,"2 乘以 2 的 255 次方"],[106.78,108.49,"是 2 的 256 次方"],[109.46,112.14,"它刚好超出 256 位整数的上限"],[112.22,113.6,"回绕成了 0"],[114.58,116.23,"余额检查比较的是 0"],[116.35,117.3,"直接通过"],[117.68,120.05,"发送者被扣掉的 也是 0"],[121.03,122.09,"两个接收者"],[122.14,124.63,"却各自收到 2 的 255 次方"],[125.6,126.85,"代币凭空出现"],[127.23,128.4,"按公开报道"],[128.56,130.96,"多家交易所暂停了 BEC 充提"],[131.94,133.24,"到了 0.8 版以后"],[1 enZeppelin 4.9 起提供"],[309.64,314.23,"计算份额时，总份额额外加上 10 的 offset 次方"],[314.23,315.26,"总资产加 1"],[315.71,320.18,"同样的攻击，把 offset 设成 3，按公式算一遍"],[320.18,323.92,"受害者这次拿到 1,999 份额，而不是 0"],[324.37,328.6,"攻击者赎回，只能拿到大约 5,001 USDC"],[328.6,333.08,"净亏约 5,000。受害者只少了大约 2 USDC"],[333.53,338.48,"另外三种做法：部署时先存一笔，把份额发给死地址"],[338.48,343.21,"让金库永远不空；用状态变量自己记账，不读余额"],[343.21,344.86,"份额为 0 就回滚"],[345.31,348.24,"作为用户，可以设置最少份额"],[348.24,350.95,"也尽量不要做第一个存款人"],[352.65,356.31,"最后一个例子，错的不是取整，而是常数"],[356.31,361.13,"2021 年 4 月，BNB Chain 上的 Uranium Finance"],[361.13,362.97,"分叉自 Uniswap V2"],[363.42,368.32,"原版的余额检查，两边量纲一致：左边按 1000 放大"],[368.32,370.28,"右边乘 1000 的平方"],[370.73,374.82,"Uranium 把手续费从 0.3% 改成 0.16%"],[374.82,380.07,"左边改成按 10000 放大，右边却还是 1000 的平方"],[380.52,385,"左边多放大了 100 倍。不变量 x 乘 y 大于等于 k"],[385,388.03,"退化成了大于等于 k 的一百分之一"],[388.48,393.69,"攻击者只投入极少量代币，就换出了池子约 99% 的储备"],[393.69,398.92,"损失约 5,000 万美元。修改过的分叉代码，等于新代码"],[400.62,405.23,"回到开头的问题：差一个 wei，为什么能丢一个金库？"],[405.68,407.2,"Balancer 的复盘"],[407.2,411.81,"把根因定位在稳定池 exact-out 交换路径的取整错误"],[411.81,415.83,"攻击者在一笔批量交换里，串联了大量小额交换"],[416.28,420.36,"每一步的舍入，都朝对攻击者有利的方向累积"],[420.36,423.62,"最后操纵了池子的不变量和份额价格"],[424.07,428.27,"所以答案是两件事叠加：余数的方向错了"],[428.27,434.09,"而这条路径可以批量、可以循环。单步测试看不见的误差"],[434.09,435.26,"被重复放大"],[435.71,440.73,"成立条件：每一处除法，都写明余数归谁，而且归协议"],[440.73,445.04,"再用模糊测试，覆盖同一操作重复 N 次的路径"],[445.49,446.33,"注意口径"],[446.33,450.84,"约 9,480 万美元只覆盖 Balancer 部署的池子"],[450.84,454.49,"早期分析给出的数字是约 1.28 亿美元"],[454.94,459.94,"下一集：你调用的那个合约，未必按你想的方式工作"]],"ch":[]},"talk":{"src":"slides/EP06-arithmetic-precision.html","scenes":[["开场",["大家好，欢迎来到主线第6集，算术与精度。一句话理解，EVM 只有整数，每一次除法都会丢掉余数。丢掉的余数归谁，决定了谁能从协议里慢慢抠出钱。","看三起事故，以下据公开报道。2018年，BEC 代币的一次乘法溢出，结果回绕成零，攻击者凭空增发了天量代币。","2023年，KyberSwap 损失超过4800万美元。一处本该向上取整的地方，写成了向下取整。","2025年，成熟协议 Balancer 损失约1.28亿美元。单步可以忽略的舍入误差，在批量交换里被放大了。"]],["披萨店切披萨",["打个比方。一家披萨店按块卖，一张披萨切8块。你付了三分之一张的钱，8乘以三分之一是2.67块。店员必须决定，给你2块还是3块。这就是舍入方向。","如果店员总是往多了给，聪明的顾客就会反复买三分之一张，每次多拿一点。这就是往返套利。","更狠的是，第一个顾客买下整张披萨，只让切成1块，然后往盒子里偷偷塞进100张披萨。下一个顾客付了99张的钱，因为1块的价值是101张，他一块也分不到。这就是后面要讲的金库通胀攻击。","比喻不准的地方在于，披萨店会被投诉。合约里，每次多拿一个最小单位的操作，可以在一笔交易里重复几千次。"]],["五类数学缺陷",["数学缺陷可以分五类。第一，溢出和下溢，比如0.8版本之前的乘法，或者0.8之后写在 unchecked 块里的运算，结果会回绕成极大值或零。第二，类型截断，比如把一个大整数转成128位，高位被静默丢掉。","第三，先除后乘，精度损失会被放大。第四，舍入方向错误，比如存款时份额向上取整，每次操作都向用户泄漏一个单位。","第五，单位不一致，比如把6位精度的 USDT 当成18位来算，偏差是10的12次方倍。下面一类一类用数字看。"]],["溢出：BEC",["先看溢出。2018年的 BEC 代币有一个批量转账函数。它先算出总金额，等于接收人数乘以每人金额，检查发送者余额够不够，扣掉总金额，再给每个接收人加上金额。","攻击者传入2个接收地址，每人金额是2的255次方。2乘以2的255次方，等于2的256次方。256位整数的上限是2的256次方减1，所以结果回绕成了零。","零小于等于任何余额，检查通过。发送者被扣掉零。","然后循环给两个接收人，每人加上2的255次方。凭空铸出了天量代币，多家交易所因此暂停了充提。0.8以后默认检查溢出，但 unchecked 块、内联汇编和类型转换仍会静默回绕，审计时要逐一检查这三处。"]],["先除后乘",["第二个例子，先除后乘。本金1950，年利率5%，用基点表示是500。错误的写法是，本金先除以100，再乘以500，再除以100。","一步步算。1950除以100，整数除法得19，余数50被丢掉了。19乘以500除以100，得95。","正确的写法是先乘后除，1950乘以500，再除以10000，得97.5，向下取整是97。差了2。看起来不多，但这个误差被乘数放大了，而且每笔都发生。","更好的做法是用 mulDiv 函数。它的中间结果有512位，不会溢出，还可以显式指定舍入方向。"]],["单位不一致：三条链上的 USDT",["第五类，单位不一致。同一个 USDT，在不同链上精度不同。以太坊和 TRON 上是6位小数，BNB Chain 上的 BSC-USD 是18位。","算一下会发生什么。用户在 BNB Chain 上存入100个 USDT，链上记录的数字是100乘以10的18次方。","如果代码是从以太坊搬过来的，写死了按6位精度换算，它会把这个数理解成100乘以10的12次方个 USDT，也就是一百万亿。放大了10的12次方倍。","所以，永远从合约读取精度，不要写死。跨链桥两端精度不同时，要在桥合约里显式换算，并且处理换算后的余数。"]],["舍入方向：永远对协议有利",["舍入方向的规则只有一条，余数归协议，不归调用者。看金库的四个操作。存款，用户给资产、得份额，份额向下取整，少给份额。铸造指定份额，算用户要付多少资产，向上取整，多收资产。","提取指定资产，算要扣多少份额，向上取整，多扣份额。赎回份额，算给多少资产，向下取整，少给资产。记住一个口诀，给用户的向下，收用户的向上。","方向反了会怎样？攻击者可以做往返套利，反复铸造1份再赎回，每次净赚一个单位的舍入误差。单次很小，但没有手续费时，一笔交易里可以循环上千次。"]],["单步可忽略，批量被放大",["舍入误差为什么能造成上亿美元的损失？因为它可以被批量放大。看 Balancer V2，以下据多家安全公司的公开分析。2025年11月，一种稳定池的批量交换函数存在舍入误差。","攻击者在一笔批量交换里，串联了大量小额交换，让每一步的舍入都朝对自己有利的方向累积。单步只差一点点，几千步累积下来，池子的不变量和份额价格就被操纵了。损失约1.28亿美元，涉及多条链上的部署。","再看 KyberSwap，2023年11月，以下据 BlockSec 的公开分析。一处流动性计算用了向下取整，而代码注释写着应该向上取整。这个偏差让池子在价格已经越过某个刻度时，误判为没有越过，同一段流动性被计算了两次。损失超过4800万美元。","两条教训。第一，舍入误差在单步测试里可以忽略，在可批量、可循环的路径里会被放大，所以要对重复 N 次同一操作做模糊测试。第二，代码和注释不一致时，要把它当作漏洞线索，而不是文档瑕疵。"]],["金库首存者通胀攻击",["现在看金库通胀攻击。金库标准 ERC-4626，份额等于存入的资产乘以总份额，再除以总资产，向下取整。问题在于，总资产通常直接读合约的代币余额，而任何人都可以直接转账增加它。","金库刚部署，是空的。攻击者先存入1个最小单位，拿到1份。","然后不走存款函数，直接向金库转入10000 USDC。总份额还是1，总资产变成约10000。","受害者存入9999 USDC。份额等于9999乘以1，再除以约10000，结果小于1，向下取整得零。受害者拿到零份。","攻击者赎回他的1份，取回金库全部资产，约19999 USDC。受害者的存款，被捐赠给了这1份。攻击者通常会抢跑受害者的第一笔存款交易。这个攻击只在金库几乎为空时有效。"]],["四种防御",["防御有四种。第一种是虚拟份额和偏移，OpenZeppelin 4.9以后的金库默认支持。计算份额时，总份额额外加上10的偏移次方个虚拟份额，总资产加1。","效果是什么？偏移为3时，攻击者要造成同样的损失，需要捐赠大约1000倍的资金。原来捐1万就够，现在要捐1000万，攻击变得不划算。手册里的金库实验，可以拖动偏移滑块，看着攻击者的利润从正变负。","第二种，部署时先存入一笔资金，把份额发给一个死地址，让金库永远不为空。第三种，内部记账，用状态变量记录总资产，不读余额，捐赠就不会改变份额价格。","第四种，最小份额检查。份额为零就回滚，用户侧再设一个最小份额参数，受害者的交易会失败，而不是拿到零份。Uniswap V2 用的也是类似思路，首次添加流动性时，永久锁定1000份 LP 代币。"]],["修改过的分叉代码等于新代码",["再回顾一下第1集讲过的 Uranium，这次看代码。Uniswap V2 原版里，调整余额乘以1000，校验右边乘以1000的平方，两处一致。Uranium 把手续费改了，调整项放大到10000，校验右边却仍是1000的平方。","左边放大了100倍，右边没有。不变量 x 乘 y 不小于 k，退化成了不小于 k 的百分之一。损失约5000万美元。分叉项目的修改往往只有几行，审计却最容易被跳过。记住，修改过的分叉代码，等于新代码。"]],["审计检查点",["审计检查点八个。第一，每个 unchecked 块都有不会溢出的证明。第二，所有向下的类型转换都用了安全转换库。","第三，乘除混合运算都先乘后除，或者用 mulDiv。第四，每个份额和资产的换算，舍入方向都对协议有利。","第五，金库首存者攻击已经防御。第六，不写死代币精度，跨链换算处理了余数。","第七，分叉代码里修改过的常数，所有使用位置都已同步。第八，模糊测试覆盖了同一操作重复 N 次的路径。"]],["练一练",["来练一练。一个借贷协议计算利息时，对借款人的应还金额向下取整。攻击者可以怎样利用？提示一下，把一笔大借款拆成很多笔小借款。","参考答案。攻击者把借款拆成许多极小的头寸，让每一笔的利息都向下取整为零，相当于长期零利息借款。修复是对借款人的应还金额向上取整，收用户的向上，并且设一个最小借款额。"]],["小结与预告",["小结三点。第一，先乘后除，用 mulDiv。unchecked 块、内联汇编和类型转换，逐一检查。","第二，舍入方向的口诀，给用户的向下，收用户的向上。对重复 N 次的路径做模糊测试。","第三，精度从合约读取，不要写死。金库要防首存者通胀攻击。","下一集讲外部调用与代币兼容性。你调用的那个合约，未必按你想的方式工作。返回值陷阱，八类非标准代币，以及 TRON 上的 USDT 为什么会返回 false。下集见。"]]]},"deck":{"src":"../decks/skeuomorphic/ch06/index.html","scenes":[["一处取整，约 9480 万美元",["2025 年 11 月，Balancer V2 的稳定池，被人取走了资金。","官方复盘估算，用户资金被盗约 9480 万美元。","根因，被定位在一处取整错误。","单次交换的误差很小。","攻击者把大量小额交换，串进一笔批量交换。","每一步的误差，都朝对自己有利的方向累积。"]],["先猜一道题",["先猜一道题。金库里，每份额值 1.5 个最小资产单位。","铸造 1 份额时，合约把应收的 1.5 向下取整，只收 1 个单位。","重复 1000 次，调用者多拿了多少？"]],["答案：约 500 个单位",["大约 500 个单位。这些差额，来自其他持有人。","EVM 只有整数。每一次除法，都会丢掉余数。","丢掉的余数归谁，决定了谁能从协议里，慢慢抠出钱。"]],["这一集讲三件事",["这一集讲三件事：数学缺陷，舍入方向，金库通胀。"]],["五类数学缺陷",["合约里的数学缺陷，可以分成五类。","溢出，截断，先除后乘，舍入方向，单位不一致。"]],["溢出：BEC 代币",["第一类，溢出。整数有上限，超过上限，结果会回绕。","2018 年 4 月，以太坊上的 BEC 代币，栽在批量转账上。","合约用 0.4 版的 Solidity 写成，没有溢出检查。"]],["总额回绕成 0",["函数先算总额：接收人数，乘以每人的金额。","攻击者填了 2 个接收地址，每人 2 的 255 次方。","2 乘以 2 的 255 次方，是 2 的 256 次方。","它刚好超出 256 位整数的上限，回绕成了 0。"]],["代币凭空出现",["余额检查比较的是 0，直接通过。发送者被扣掉的，也是 0。","两个接收者，却各自收到 2 的 255 次方。","代币凭空出现。按公开报道，多家交易所暂停了 BEC 充提。"]],["0.8 版后仍会静默出错",["到了 0.8 版以后，算术默认检查溢出。","但有三处，仍会静默回绕：unchecked 块，内联汇编，类型转换。","移位运算也不检查溢出。","第二类，截断。大类型转成小类型，高位被丢掉，不报错。"]],["先乘后除，用 mulDiv",["第三类，先除后乘。看一组小数字：7 乘 3，除以 5。","先除，7 除以 5 等于 1，余数丢掉。再乘 3，结果是 3。","先乘，7 乘 3 等于 21，再除以 5，结果是 4。","先除的结果少了 1。丢掉的误差，被后面的乘法放大了。","所以要先乘后除。更好的做法，是用 mulDiv。","它的中间结果有 512 位，不会溢出，并且能指定舍入方向。"]],["单位不一致",["第四类舍入方向，下一段讲。先看第五类，单位不一致。","同样叫 USDT，以太坊上是 6 位小数，TRON 上也是 6 位。","BNB Chain 上的 BSC-USD，却是 18 位。","把以太坊的代码原样搬过去，又写死了 6 位精度。","USDT 金额，就会被放大 10 的 12 次方倍。"]],["永远从合约读 decimals",["规则只有一句：永远从合约读取 decimals，不要写死。","跨链桥两端精度不同时，要显式换算，并处理换算后的余数。"]],["余数归协议，不归调用者",["整数除法会丢掉余数。问题是，余数归谁。","规则只有一条：余数归协议，不归调用者。"]],["四个函数，四个舍入方向",["拿 ERC-4626 金库来看，四个函数，四个方向。","deposit，用户给资产，拿份额。份额向下取整，少给。","mint，用户指定份额，算要付多少资产。资产向上取整，多收。","withdraw，用户指定资产，算要扣多少份额。份额向上取整，多扣。","redeem，用户交出份额，拿资产。资产向下取整，少给。","记成一句话：给出去的，向下；收进来的，向上。"]],["方向反了：往返套利",["方向反了会怎样？攻击者可以做往返套利。","反复 mint 1 份额，再 redeem，每次净赚 1 个单位的舍入误差。","单次很小。但在没有手续费的场景下，可以循环上千次。"]],["比方：按块卖的披萨",["打个比方。披萨店按块卖，一张披萨切 8 块。","你付三分之一张的钱，店员要决定，给你 2 块还是 3 块。","如果店员总往多了给，聪明的顾客，就反复买三分之一张。","比方在这里不成立：披萨店会被投诉。","合约里，多拿 1 wei 的操作，可以在一笔交易里重复几千次。"]],["回到 Balancer",["回到 Balancer。按公开分析，问题出在稳定池的批量交换里。","攻击者串联大量小额交换，让每一步的舍入，都朝自己累积。","池子的不变量和份额价格，因此被操纵。","官方估算的约 9480 万美元，按事发时估值，只算 Balancer 部署的池子。","早期第三方分析的数字是约 1.28 亿美元。引用时要写明口径。"]],["KyberSwap：方向写反",["再往前，2023 年 11 月，KyberSwap Elastic 也栽在方向上。","一个本该向上取整的值，被写成了向下取整。","池子误判价格没有跨过 tick，同一段流动性，被计算了两次。","官方复盘称，受影响资产约 5620 万美元。"]],["重复 N 次做模糊测试",["教训是：单步测试里，误差可以忽略。","在能批量，能循环的路径里，它会被放大。","所以，要对同一操作重复 N 次，做模糊测试。"]],["总资产读的是余额",["方向都写对了，金库就安全了吗？不一定。","ERC-4626 的份额公式是：存入资产，乘以总份额，除以总资产。","结果向下取整。这一步方向没错。","麻烦在总资产。它通常直接读金库的代币余额。","而余额，任何人都能通过直接转账来增加。"]],["攻击：存 1 wei，再捐赠",["看攻击怎么走。金库是空的。","第一步，攻击者存入 1 wei，拿到 1 份额。","第二步，攻击者不走存款函数，直接往金库转入 1 万 USDC。","现在总份额只有 1，总资产是 1 万 USDC，再加 1 个最小单位。"]],["受害者拿到 0 份额",["第三步，受害者存入 9999 USDC。","他的份额，是 9999 USDC 乘以 1，除以略多于 1 万 USDC。","结果小于 1，向下取整，是 0。","受害者的资产进了金库，却一份也没拿到。"]],["赎回 1 份额，拿走全部",["第四步，攻击者赎回那 1 份额，取回约 19999 USDC。","这 1 份额，代表了金库的全部资产。受害者的存款，等于捐给了它。"]],["成本与成立条件",["攻击者通常会抢跑受害者的第一笔存款交易。","攻击成本，就是捐赠额。受害者的存款接近捐赠额，攻击就有利可图。","成立条件也要说清：金库必须几乎是空的。","金库规模越大，攻击成本越高。"]],["披萨版通胀攻击",["换成披萨店：第一个顾客买下整张披萨，只切成 1 块。","然后往盒子里偷偷塞进 100 张披萨。","下一个顾客付了 99 张的钱，因为 1 块披萨值 101 张，他一块也分不到。"]],["防御一：虚拟份额加偏移",["怎么防？有四种做法。","第一，虚拟份额加偏移。OpenZeppelin 从 4.9 版起提供。","计算份额时，总份额加上 10 的偏移次方，总资产加上 1。","攻击者想造成同样的损失，需要捐赠 10 的偏移次方倍的资金。"]],["防御二：初始存款销毁",["第二，初始存款销毁。部署时先存入一笔，把份额发给死地址。","这样金库永远不会是空的。","Uniswap V2 也是这个思路：首次添加流动性时，永久锁定 1000 份 LP 代币。"]],["防御三四：内部记账与最小份额",["第三，内部记账。用状态变量记录总资产，不读余额。","捐赠多少，都无法改变份额价格。","第四，最小份额检查。份额是 0 就回滚，用户也可以设最少到账份额。","这样受害者的交易会回滚，而不是换回 0 份额。"]],["修好了，怎么证明",["修好了，怎么证明？要两个结果。","漏洞版上，受害者损失资产。修复版上，攻击无利可图。"]],["Uranium：常数漏改一处",["最后一个案例，是另一种失误。","2021 年 4 月，BNB Chain 上的 Uranium Finance，分叉自 Uniswap V2。","按公开分析，开发者把手续费从百分之 0.3，改成了百分之 0.16。","余额检查左边的放大系数，从 1000 改成了 1 万。","右边那一处，仍是 1000 的平方，漏改了。"]],["不变量退化成百分之一",["左边被放大了 100 倍，右边没有。","不变量 x 乘 y 不小于 k，退化成了不小于 k 的百分之一。","攻击者只投入极少量代币，就换出了池子约百分之 99 的储备。","按公开报道，损失约 5000 万美元。"]],["改过的分叉 = 新代码",["教训是：修改过的分叉代码，等于新代码。","改过的常数，每一个使用位置，都要同步。"]],["今天就能做的事",["最后，每个人今天就能做一件事。","写合约的人，找出每一处除法，写下余数归谁。","审计的人，逐个检查 unchecked 块，类型转换，内联汇编和移位。","做测试的人，把同一操作重复 1000 次，看误差流向谁。"]],["普通用户",["普通用户，别当新金库的第一个存款人。","存入后马上核对份额。是 0 或明显偏少，立刻停下。","跨链转账时，核对同一代币在两条链上的精度。"]],["余数给错了人",["回到开头的问题。只错一点点的取整，怎么变成约 9480 万美元的损失？","因为余数给错了人，而且这一步，能在一笔交易里重复很多次。","反过来，只要余数始终归协议，重复多少次，也抠不出钱。"]]]},"d3b":{"src":"../decks/3b1b/ch06.html","scenes":[["Balancer：约 9,480 万美元，一处取整错误",["2025 年 11 月，Balancer V2 的稳定池被攻击者取走了资金。","官方复盘估算，用户资金被盗约 9,480 万美元。","根因是一处取整错误。单次交换的误差，小到几乎可以忽略。"]],["问题：差一个 wei，为什么能丢一个金库",["攻击者把这些误差，放进一笔批量交换里，一点一点累积起来。","问题来了：差一个 wei，为什么能丢一个金库？"]],["EVM 只有整数：除法丢掉余数",["先从最底层说起：EVM 里只有整数，没有小数。","7 除以 2，结果是 3。余下的 1，直接丢掉。","每一次除法都会丢掉余数。真正的问题是：丢掉的余数，归谁？"]],["比方：披萨店总往多了给",["打个比方：一张披萨切 8 块，你付了三分之一张的钱。店员只能给你 2 块，或者 3 块。","如果店员总是往多了给，聪明的顾客就反复买三分之一张，每次多拿一点。","这个比方有一处不成立：披萨店会被投诉。合约里，多拿 1 wei 的操作，一笔交易就能重复几千次。"]],["溢出：超过上限就回绕",["先看最直接的一类数学缺陷：溢出。uint256 有上限，超过上限就回绕，像里程表转满一圈回到零。","2018 年 4 月的 BEC 代币，批量转账时先算总额：接收人数，乘以每人金额。"]],["BEC：2 的 256 次方回绕成 0",["传入 2 个接收人，每人 2 的 255 次方。乘出来是 2 的 256 次方，回绕成 0。","余额检查只看总额，0 当然通过。发送者被扣了 0，两个接收人却各收到 2 的 255 次方个代币。"]],["Solidity 0.8 默认检查，仍有静默回绕",["Solidity 0.8 起默认检查溢出。但 unchecked 块、内联汇编、类型转换，仍会静默回绕。","截断也是一样：把大数转成 uint128，高位被悄悄丢掉。审计时，要把这些地方一个一个找出来。"]],["先除后乘会放大误差：先乘后除",["还有一类错误不会回绕，而是把误差放大。第一种：先除后乘。","举个示例：7 乘以 3，再除以 5。精确结果是 4.2。","先除：7 除以 5 得 1，再乘 3，得 3。先乘：21 除以 5，得 4。","先除时丢掉的那一点，被后面的乘法放大了。所以要先乘后除，或者用 mulDiv，它还能指定舍入方向。"]],["单位误差：精度要从合约读取",["第二种放大来自单位。同一个 USDT，以太坊上是 6 位小数，BNB Chain 上是 18 位。","把写死 6 位精度的代码原样搬过去，金额就差了 10 的 12 次方倍。精度要从合约读取，不要写死。"]],["规则：舍入的余数归协议",["回到余数归谁。规则只有一条：舍入的余数归协议，不归调用者。","拿金库来说：用户存入资产，拿到份额。按资产存，就少给份额；按份额取，就少给资产。都向下取整。","反过来，用户指定要铸多少份额，就向上取整，多收资产；指定要取多少资产，就向上取整，多扣份额。"]],["方向写反：每次白得，重复放大",["算一笔示例：每份额值 1.5 个单位。铸 1 份额时，收款错误地向下取整，只收 1 个单位。","每次白得 0.5 个单位。重复 1,000 次，大约就是 500 个单位，差额来自其他持有人。","2023 年 11 月的 KyberSwap Elastic，就是把应该向上取整的地方，写成了向下取整。官方复盘称，受影响资产约 5,620 万美元。"]],["首存者通胀：先存 1 wei，再直接捐赠",["方向对了，就够了吗？看一个更狠的例子：ERC-4626 金库的首存者通胀攻击。","份额等于：存入的资产，乘以总份额，除以总资产，向下取整。而总资产，通常直接读金库的代币余额。","金库是空的。攻击者先存入 1 wei，拿到 1 份额。","然后不走存款函数，直接往金库转入 10,000 USDC。总份额还是 1，总资产变成一万 USDC 多 1 wei。"]],["受害者拿到 0 份额，攻击者赎回全部",["受害者存入 9,999 USDC。9,999 乘以 1，除以一万多一点，小于 1。向下取整，0 份额。","攻击者赎回这 1 份额，取回全部，大约 19,999 USDC。","前提是金库几乎为空。攻击成本就是捐赠额，受害者的存款接近捐赠额时，才有利可图。"]],["虚拟份额加偏移：攻击变成亏损",["怎么防？第一种做法：虚拟份额加偏移，OpenZeppelin 4.9 起提供。","计算份额时，总份额额外加上 10 的 offset 次方，总资产加 1。","同样的攻击，把 offset 设成 3，按公式算一遍：受害者这次拿到 1,999 份额，而不是 0。","攻击者赎回，只能拿到大约 5,001 USDC，净亏约 5,000。受害者只少了大约 2 USDC。"]],["另外三种做法，以及用户自保",["另外三种做法：部署时先存一笔，把份额发给死地址，让金库永远不空；用状态变量自己记账，不读余额；份额为 0 就回滚。","作为用户，可以设置最少份额，也尽量不要做第一个存款人。"]],["Uranium：改了手续费，常数没跟着改",["最后一个例子，错的不是取整，而是常数。2021 年 4 月，BNB Chain 上的 Uranium Finance，分叉自 Uniswap V2。","原版的余额检查，两边量纲一致：左边按 1000 放大，右边乘 1000 的平方。","Uranium 把手续费从 0.3% 改成 0.16%。左边改成按 10000 放大，右边却还是 1000 的平方。"]],["不变量退化成 k 的一百分之一，约 5,000 万美元",["左边多放大了 100 倍。不变量 x 乘 y 大于等于 k，退化成了大于等于 k 的一百分之一。","攻击者只投入极少量代币，就换出了池子约 99% 的储备，损失约 5,000 万美元。修改过的分叉代码，等于新代码。"]],["答案：余数方向错，加上可批量循环",["回到开头的问题：差一个 wei，为什么能丢一个金库？","Balancer 的复盘，把根因定位在稳定池 exact-out 交换路径的取整错误。攻击者在一笔批量交换里，串联了大量小额交换。","每一步的舍入，都朝对攻击者有利的方向累积，最后操纵了池子的不变量和份额价格。","所以答案是两件事叠加：余数的方向错了，而这条路径可以批量、可以循环。单步测试看不见的误差，被重复放大。"]],["成立条件：写明余数归协议，并测重复路径",["成立条件：每一处除法，都写明余数归谁，而且归协议；再用模糊测试，覆盖同一操作重复 N 次的路径。","注意口径：约 9,480 万美元只覆盖 Balancer 部署的池子；早期分析给出的数字是约 1.28 亿美元。"]]]}}},{"id":"07","title":"外部调用与代币兼容性：对方未必按标准出牌","md":"../chapters/07-external-calls-tokens.md","v":{"vs":{"src":"skeuo/ep07/out/ep07-full.mp4","cues":[[1.65,2.87,"2022 年 1 月"],[2.94,4.82,"Qubit 跨链桥出了事"],[5.8,6.96,"以太坊这一侧"],[7.01,8.44,"没有收到对应的 ETH"],[9.41,10.8,"BNB Chain 那一侧"],[10.82,13.67,"却铸造出了代表 ETH 的 qXETH"],[14.64,15.98,"公开报道的损失"],[16.05,17.35,"约 8000 万美元"],[18.34,20.88,"桥相信了一次外部调用的结果"],[21.88,23.2,"先猜一道题"],[24.18,25.52,"合约用低级 call"],[25.54,27.19,"去调用一个没有代码的地址"],[28.17,29.75,"call 返回 true"],[29.85,30.82,"还是 false"],[32.06,33.15,"答案是 true"],[33.28,34.9,"而且返回数据是空的"],[35.88,37.87,"EVM 不会因为目标没有代码"],[37.89,38.93,"就让 call 失败"],[39.91,42.34,"如果代码把成功加空返回"],[42.48,43.82,"当成转账成功"],[44.81,46.16,"它就会记下一笔"],[46.29,47.87,"根本没有发生的转账"],[48.87,49.92,"记住一句话"],[50.12,51.42,"每一个外部调用"],[51.57,53.03,"都是把命运交给别人"],[54.01,55.2,"对方可能失败"],[55.26,56.2,"可能撒谎"],[56.39,57.4,"可能拖延"],[57.45,58.73,"也可能根本不存在"],[61.88,62.72,"低级调用"],[62.74,63.54,"指 call"],[63.59,64.47,"delegatecall"],[64.49,65.49,"和 staticcall"],[66.49,67.6,"它们失败时"],[67.67,68.81,"不会自动回滚"],[68.83,70.07,"只返回一个 false"],[71.06,72.01,"打个比方"],[72.38,73.96,"你让快递员送包裹"],[74.13,76.58,"然后在登记簿上写 已送达"],[77.56,79.94,"陷阱一 不检查返回值"],[80.3,81.48,"快递员没回话"],[81.66,82.83,"你就当作送到了"],[83.81,85.87,"修复是接住返回的布尔值"],[85.89,87.07,"不成功就回滚"],[88.06,90.17,"陷阱二 目标没有代码"],[90.55,91.97,"地址是一块荒地"],[92.96,94.3,"快递员说送到了"],[94.37,95.73,"因为荒地不会拒收"],[96.71,98.24,"对无代码地址的 call"],[98.27,99.24,"返回成功"],[99.26,100.57,"返回数据是空的"],[101.54,103.22,"修复是调用之前"],[103.43,106.44,"检
