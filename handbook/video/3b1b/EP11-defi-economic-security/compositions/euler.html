      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);

      const DRAW = (s, t, d = 0.6) => tl.fromTo(s, { strokeDashoffset: 1, opacity: 0 }, { strokeDashoffset: 0, opacity: 1, duration: d, ease: "power2.inOut" }, t);

      const st = gsap.utils.toArray("#root .e-st");
      const STEP = (i, t) => { tl.to(st, { fill: "#6b6f7a", duration: 0.2 }, t); tl.to(st[i], { fill: "#FF9F43", duration: 0.2 }, t); };

      // L0
      IN("#e-title", at(0, 0.05), 0.5);
      st.forEach((s, i) => IN(s, at(0, 0.3) + i * 0.1, 0.4));
      IN("#e-a", at(0, 0.5), 0.5);
      // L1 闪电贷 + 杠杆
      STEP(0, at(1, 0));
      IN("#e-pool", at(1, 0.05), 0.5);
      DRAW("#e-in", at(1, 0.2), 0.5);
      IN(["#e-ac", "#e-ad"], at(1, 0.25), 0.1);
      BAR("#e-ac", 590, 150, at(1, 0.3));
      IN("#e-lev", at(1, 0.5), 0.4);
      BAR("#e-ac", 340, 400, at(1, 0.6), 1.0);
      BAR("#e-ad", 410, 330, at(1, 0.6), 1.0);
      // L2 捐赠：抵押品减少，债务不变
      STEP(1, at(2, 0));
      OUT("#e-lev", at(2, 0), 0.2);
      IN("#e-don", at(2, 0.1), 0.4);
      tl.set("#e-chunk", { opacity: 1 }, at(2, 0.2));
      tl.set("#e-ac", { attr: { y: 590, height: 150 } }, at(2, 0.2));
      tl.to("#e-chunk", { y: -200, opacity: 0, duration: 0.9, ease: "power2.in" }, at(2, 0.22));
      IN("#e-gap", at(2, 0.55), 0.4);
      IN("#e-insol", at(2, 0.6), 0.4);

      OUT("#e-don", at(3, 0), 0.2);

      BAR("#e-ac", 740, 0, at(3, 0.45), 0.6);
      IN("#e-bc", at(3, 0.5), 0.6, { scaleY: 0, svgOrigin: "1530 740" }, { scaleY: 1 });
      IN("#e-disc", at(3, 0.35), 0.4);
      // L4 归还闪电贷，获利
      STEP(3, at(4, 0));
      OUT("#e-disc", at(4, 0), 0.3);
      DRAW("#e-repay", at(4, 0.05), 0.9);
      IN("#e-profit", at(4, 0.35), 0.5);
      // L5 入口 × 健康检查
      OUT(["#e-pool", "#e-a", "#e-ac", "#e-ad", "#e-in", "#e-gap", "#e-insol", "#e-b", "#e-liq", "#e-bc", "#e-disc", "#e-repay", "#e-profit", "#e-steps", "#e-title"], at(5, 0), 0.4);
      IN("#e-tab", at(5, 0.08), 0.5);
      const rows = gsap.utils.toArray("#root .e-row");
      [0.18, 0.28, 0.4, 0.75].forEach((f, i) => IN(rows[i], at(5, f), 0.4, { x: -20 }, { x: 0 }));
      // L6 规则
      IN("#e-rule", at(6, 0.05), 0.5, { filter: "blur(6px)" }, { filter: "blur(0px)" });
      IN("#e-rule2", at(6, 0.4), 0.5, { filter: "blur(6px)" }, { filter: "blur(0px)" });

      tl.to("#e-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["euler"] = tl;
