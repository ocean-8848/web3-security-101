  <script>
    (function () {
      const C = /*CUES*/{"d": 22.78, "L": [[0.6, 6.48], [6.93, 10.82], [11.27, 15.71], [16.16, 21.68]]}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);

      // L0 签名
      IN("#h-date", at(0, 0), 0.5);
      IN("#h-card", at(0, 0.08), 0.8, { y: 20 }, { y: 0 });
      ["#h-s1", "#h-s2", "#h-s3"].forEach((s, i) =>
        tl.fromTo(s, { fill: "#2a2f3a" }, { fill: "#e8e6df", duration: 0.25, ease: "power2.out" }, at(0, 0.35 + i * 0.12)));
      DRAW("#h-sig", at(0, 0.72), 1.0);
      IN("#h-vault", at(0, 0.3), 0.8, { y: 20 }, { y: 0 });
      DRAW("#h-link", at(0, 0.92), 0.5);

      // L1 资金流出：金币飞向右侧边缘并变红
      const coins = gsap.utils.toArray("#root .h-coin");
      coins.forEach((c, i) => {
        tl.to(c, { x: 520 + (i % 5) * 30, y: (i % 3 - 1) * 60, fill: "#FC6255", opacity: 0, duration: 0.9, ease: "power3.in" }, at(1, 0.05) + i * 0.08);
      });
      IN("#h-amount", at(1, 0.15), 0.5);
      const n = { v: 0 }, num = document.querySelector("#h-num");
      tl.fromTo(n, { v: 0 }, { v: 15, duration: 1.8, ease: "power2.out", onUpdate: () => { num.textContent = Math.round(n.v); } }, at(1, 0.15));

      // L2 问题：其余变暗
      tl.to(["#h-card", "#h-date", "#h-link", "#h-amount"], { opacity: 0.22, duration: 0.5 }, at(2, 0));
      IN("#h-q", at(2, 0.3), 0.6, { filter: "blur(8px)" }, { filter: "blur(0px)" });
      tl.fromTo("#h-vault rect", { strokeWidth: 4 }, { stroke: "#58C4DD", strokeWidth: 6, duration: 0.5 }, at(2, 0.3));

      // L3 钉住问题，场景退出
      tl.to("#h-all", { opacity: 0, filter: "blur(6px)", duration: 0.6, ease: "power2.in" }, at(3, 0.25));
      IN("#h-pin", at(3, 0.32), 0.6, { scale: 1.6, svgOrigin: "360 112" }, { scale: 1 });
      IN("#h-seed", at(3, 0.5), 0.5, { scale: 0, svgOrigin: "960 540" }, { scale: 1, ease: "back.out(1.6)" });
      IN("#h-seedt", at(3, 0.55), 0.5);
      tl.to("#h-seedt", { opacity: 0, duration: 0.3 }, C.d - 0.7);
      tl.to("#h-seed", { scale: 3, opacity: 0, svgOrigin: "960 540", duration: 0.4, ease: "power3.in" }, C.d - 0.45);
      tl.to("#h-pin", { opacity: 0, duration: 0.35, ease: "power2.in" }, C.d - 0.45);
      window.__timelines["hook"] = tl;
    })();
