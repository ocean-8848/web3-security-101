          <g class="d-c h"><rect x="840" y="267" width="270" height="56" rx="28" fill="#161a22" stroke="#6b6f7a" stroke-width="2" /><text x="975" y="305">搜索广告</text></g>

        <!-- 关停又回来 -->

          <g id="d-e2" class="h"><circle cx="1400" cy="900" r="14" fill="#FC6255" /><text x="1400" y="960" font-size="30" fill="#FC6255" text-anchor="middle" font-weight="700">2025 仍在运行</text><text x="1400" y="1005" font-size="28" fill="#e8e6df" text-anchor="middle">半年 · 3 万多名受害者 · 900 万美元以上</text></g>

  <script>
    (function () {
      const C = /*CUES*/{"d": 55.48, "L": [[0.6, 5.33], [5.78, 15.91], [16.36, 28.6], [29.05, 39.85], [40.3, 54.38]]}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.35) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      const DRAWA = (s, t, d = 0.5) => tl.fromTo(s, { strokeDashoffset: 1, opacity: 0 }, { strokeDashoffset: 0, opacity: 1, duration: d, ease: "power2.inOut" }, t);

      // 受害者的资产：四条（示意），先乱序，后按价值排序
      const NS = "http://www.w3.org/2000/svg", bh = document.querySelector("#d-bars");
      const V = [{ n: "代币 C", w: 120 }, { n: "NFT", w: 260 }, { n: "代币 A", w: 180 }, { n: "代币 B", w: 60 }];
      const sorted = [1, 2, 0, 3];
      const B = V.map((v, i) => {
        const g = document.createElementNS(NS, "g"); g.setAttribute("opacity", "0");
        g.innerHTML = `<rect x="1480" y="${280 + i * 70}" width="${v.w}" height="50" rx="6" fill="#F0B90B" /><text x="${1490 + v.w}" y="${316 + i * 70}" font-size="28" fill="#e8e6df">${v.n}</text>`;
        bh.appendChild(g); return g;
      });

      // L0
      IN("#d-title", at(0, 0.1), 0.5, { filter: "blur(6px)" }, { filter: "blur(0px)" });
      // L1 开发者 → 分发者 → 渠道
      IN("#d-dev", at(1, 0.0), 0.5);
      DRAWA("#d-a1", at(1, 0.25), 0.4); IN("#d-rent", at(1, 0.25), 0.4);
      IN("#d-aff", at(1, 0.3), 0.5);
      DRAWA("#d-a2", at(1, 0.55), 0.4);
      gsap.utils.toArray("#root .d-c").forEach((c, i) => IN(c, at(1, 0.55) + i * 0.15 * (L[1][1] - L[1][0]), 0.4, { x: -20 }, { x: 0 }));
      // L2 受害者连上钱包：扫余额、排序、请求最值钱的授权
      DRAWA("#d-a3", at(2, 0.0), 0.4);
      IN("#d-vic", at(2, 0.05), 0.4);
      IN("#d-scan", at(2, 0.15), 0.5);
      B.forEach((g, i) => IN(g, at(2, 0.2) + i * 0.1, 0.3));
      B.forEach((g, i) => tl.to(g, { y: (sorted.indexOf(i) - i) * 70, duration: 0.6, ease: "power2.inOut" }, at(2, 0.4)));
      IN("#d-top", at(2, 0.55), 0.4);
      IN("#d-ask", at(2, 0.58), 0.4);
      IN("#d-diff", at(2, 0.8), 0.4);
      // L3 分账：示例 100 万
      IN("#d-sum", at(3, 0.05), 0.5);
      IN("#d-sb", at(3, 0.15), 0.1);
      tl.fromTo("#d-sb", { attr: { width: 0 } }, { attr: { width: 1000 }, duration: 0.8, ease: "power2.out" }, at(3, 0.15));
      IN("#d-s1", at(3, 0.4), 0.4);
      IN(["#d-s1t", "#d-s1l"], at(3, 0.5), 0.4);
      IN(["#d-s2t", "#d-s2l"], at(3, 0.75), 0.4);
      IN("#d-sn", at(3, 0.85), 0.4);
      // L4 关停又回来
      IN("#d-axis", at(4, 0.0), 0.4);
      IN("#d-e1", at(4, 0.08), 0.5);
      DRAW("#d-back", at(4, 0.3), 0.8);
      IN("#d-e2", at(4, 0.4), 0.5);
      tl.fromTo("#d-e2 text:nth-of-type(2)", { opacity: 0 }, { opacity: 1, duration: 0.4 }, at(4, 0.62));
      tl.to("#d-e2 circle", { attr: { r: 22 }, duration: 0.3, yoyo: true, repeat: 3 }, at(4, 0.85));

      tl.to("#d-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["drainer"] = tl;
    })();
  </script>
