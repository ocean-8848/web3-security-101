  <script>
    (function () {

      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.35) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);

      const NS = "http://www.w3.org/2000/svg", th = document.querySelector("#s-ticks"), T = [];
      for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
        const t = document.createElementNS(NS, "text");
        t.setAttribute("x", String(1110 + c * 190)); t.setAttribute("y", String(518 + r * 90)); t.setAttribute("opacity", "0");
        t.textContent = "✓"; th.appendChild(t); T.push({ t, r, c });
      }

      // L0 EVM
      IN("#s-evm", at(0, 0.15), 0.7, { y: 20 }, { y: 0 });
      // L1 Solana：程序无状态，账户由调用者传入
      tl.to("#s-evm", { opacity: 0.35, duration: 0.4 }, at(1, 0.05));
      IN("#s-prog", at(1, 0.08), 0.6);
      IN("#s-caller", at(1, 0.45), 0.4);
      gsap.utils.toArray("#root .s-acc").forEach((g, i) => IN(g, at(1, 0.55) + i * 0.15, 0.4, { y: 80 }, { y: 0 }));
      // L2 四项检查，逐列打勾
      OUT("#s-evm", at(2, 0), 0.35);
      const cols = gsap.utils.toArray("#root .s-col");
      [0.12, 0.35, 0.58, 0.8].forEach((f, c) => {
        IN(cols[c], at(2, f), 0.3);
        T.filter((o) => o.c === c && !(o.r === 3 && c === 3)).forEach((o, k) => IN(o.t, at(2, f) + 0.1 + k * 0.06, 0.2));
      });
      // L3 CPI 目标 + 系统账户
      gsap.utils.toArray("#root .s-m").forEach((t, i) => IN(t, at(3, [0.05, 0.55][i]), 0.4));
      // L4 Anchor + 漏写一个
      IN("#s-anchor", at(4, 0.05), 0.5);
      IN("#s-miss", at(4, 0.6), 0.4, { scale: 1.3, svgOrigin: "1680 775" }, { scale: 1 });

      tl.to("#s-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["solana"] = tl;
    })();
