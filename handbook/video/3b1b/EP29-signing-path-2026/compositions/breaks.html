      const X = (i) => 70 + i * 260, nodes = [];
      N.forEach(([a, b], i) => {
        const g = document.createElementNS(NS, "g");
        const col = i === 4 ? "#B48EF0" : "#e8e6df";
        g.innerHTML = `<rect x="${X(i)}" y="450" width="220" height="130" rx="16" fill="#161a22" stroke="${col}" stroke-opacity="${i === 4 ? 1 : 0.6}" stroke-width="3" />` +

        document.querySelector("#b-nodes").appendChild(g); nodes.push(g);
        if (i < 6) {
          const p = document.createElementNS(NS, "path");
          p.setAttribute("d", `M${X(i) + 222} 515 L ${X(i) + 256} 515`); p.setAttribute("marker-end", "url(#b-ah)");

      tl.to("#b-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
