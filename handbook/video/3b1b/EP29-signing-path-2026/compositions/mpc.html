  <script>
    (function () {
      const C = /*CUES*/{"d": 53.44, "L": [[0.6, 8.98], [9.43, 18.23], [18.68, 23.7], [24.15, 31.88], [32.33, 43.39], [43.84, 52.34]]}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.35) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.6) => tl.fromTo(s, { strokeDashoffset: 1, opacity: 0 }, { strokeDashoffset: 0, opacity: 1, duration: d, ease: "power2.inOut" }, t);

      // L0 私钥拆成三片，进入三个节点
      IN("#m-title", at(0, 0), 0.5);
      IN("#m-key", at(0, 0.1), 0.6, { scale: 0.6, svgOrigin: "960 300" }, { scale: 1 });
      IN("#m-keyt", at(0, 0.15), 0.5);
      gsap.utils.toArray("#root .m-node").forEach((g, i) => IN(g, at(0, 0.45) + i * 0.15, 0.5, { y: 20 }, { y: 0 }));
      OUT(["#m-key", "#m-keyt"], at(0, 0.62), 0.3);
      [["#m-sh1", -300], ["#m-sh2", 0], ["#m-sh3", 300]].forEach(([s, dx], i) => {
        IN(s, at(0, 0.62), 0.2);
        tl.to(s, { x: dx, y: 270, duration: 0.8, ease: "power3.inOut" }, at(0, 0.66) + i * 0.08);
      });
      IN("#m-shardt", at(0, 0.85), 0.4);

      // L1 各自计算，合成签名；私钥不出现
      OUT("#m-shardt", at(1, 0.25), 0.3);
      DRAW("#m-c1", at(1, 0.08), 0.7); DRAW("#m-c2", at(1, 0.12), 0.6); DRAW("#m-c3", at(1, 0.16), 0.7);
      IN("#m-sig", at(1, 0.3), 0.5, { scale: 0.8, svgOrigin: "960 845" }, { scale: 1, ease: "back.out(2)" });
      IN("#m-sigt", at(1, 0.38), 0.4);
      IN("#m-nokey", at(1, 0.65), 0.5);

      // L2 MPC 保证了什么
      IN("#m-guar", at(2, 0.1), 0.6, { filter: "blur(6px)" }, { filter: "blur(0px)" });

      // L3 它不判断该不该签：请求过了校验就签
      OUT("#m-guar", at(3, 0), 0.3);
      IN("#m-ask", at(3, 0.05), 0.5);
      IN("#m-req", at(3, 0.3), 0.5, { x: -40 }, { x: 0 });
      DRAW("#m-reqa", at(3, 0.5), 0.5);
      IN("#m-pass", at(3, 0.55), 0.3);
      tl.fromTo("#root .m-node rect", { strokeWidth: 3 }, { strokeWidth: 7, duration: 0.25, yoyo: true, repeat: 1 }, at(3, 0.72));
      tl.fromTo("#m-sig rect", { strokeWidth: 3 }, { stroke: "#FC6255", strokeWidth: 6, duration: 0.3 }, at(3, 0.82));

      // L4 比方：公章
      tl.to("#m-tech", { opacity: 0, filter: "blur(6px)", duration: 0.5, ease: "power2.in" }, at(4, 0));
      IN("#m-safe", at(4, 0.08), 0.6, { y: 20 }, { y: 0 });
      IN("#m-inbox", at(4, 0.4), 0.5);
      IN("#m-sheet", at(4, 0.45), 0.7, { y: -160 }, { y: 0, ease: "power2.out" });
      IN("#m-fake", at(4, 0.5), 0.4);
      DRAW("#m-flowa", at(4, 0.72), 0.6);
      IN("#m-flow", at(4, 0.75), 0.4);
      IN("#m-stamp", at(4, 0.88), 0.35, { scale: 1.8, svgOrigin: "1460 590" }, { scale: 1, ease: "power4.in" });

      // L5 比方的局限
      IN("#m-limit", at(5, 0.05), 0.6);
      IN("#m-limx", at(5, 0.4), 0.1);
      tl.fromTo("#m-limx", { attr: { x2: 790 } }, { attr: { x2: 1130 }, duration: 0.4, ease: "power2.out" }, at(5, 0.4));
      tl.to("#m-sheet", { opacity: 0.4, duration: 0.4 }, at(5, 0.45));
      IN("#m-lim2", at(5, 0.6), 0.5, { y: 10 }, { y: 0 });
      tl.fromTo("#m-stamp circle", { strokeWidth: 6 }, { strokeWidth: 10, duration: 0.3, yoyo: true, repeat: 1 }, at(5, 0.85));

      tl.to("#m-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["mpc"] = tl;
    })();
