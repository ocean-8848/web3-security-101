  <script>
    (function () {
      const C = /*CUES*/{"d": 51.46, "L": [[0.6, 4.27], [4.72, 12.88], [13.33, 18.95], [19.4, 25.81], [26.26, 31.75], [32.2, 42.93], [43.38, 50.36]]}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.35) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.6) => tl.fromTo(s, { strokeDashoffset: 1, opacity: 0 }, { strokeDashoffset: 0, opacity: 1, duration: d, ease: "power2.inOut" }, t);
      const NS = "http://www.w3.org/2000/svg";

      // 流出的金币与复制的交易（位置固定）
      const coins = [], ch = document.querySelector("#n-coins");
      for (let i = 0; i < 8; i++) {
        const c = document.createElementNS(NS, "circle");
        c.setAttribute("cx", 1430 + i * 40); c.setAttribute("cy", "720"); c.setAttribute("r", "14"); c.setAttribute("opacity", "0");
        ch.appendChild(c); coins.push(c);
      }
      const pills = [], ph = document.querySelector("#n-copies");
      for (let i = 0; i < 16; i++) {
        const r = document.createElementNS(NS, "rect");
        r.setAttribute("x", 140 + (i % 8) * 140); r.setAttribute("y", 790 + Math.floor(i / 8) * 46);
        r.setAttribute("width", "110"); r.setAttribute("height", "32"); r.setAttribute("rx", "8");
        r.setAttribute("fill", "#FC6255"); r.setAttribute("opacity", "0");
        ph.appendChild(r); pills.push(r);
      }

      IN("#n-title", at(0, 0.05), 0.5);
      // L1 上路
      IN("#n-a", at(1, 0.05), 0.5, { x: -20 }, { x: 0 });
      DRAW("#n-ab", at(1, 0.45), 0.4);
      IN("#n-b", at(1, 0.5), 0.5);
      // L2 下路
      IN("#n-c", at(2, 0.05), 0.5, { x: -20 }, { x: 0 });
      DRAW("#n-cd", at(2, 0.4), 0.4);
      IN("#n-d", at(2, 0.45), 0.5);
      // L3 汇合
      DRAW("#n-be", at(3, 0.05), 0.5);
      DRAW("#n-de", at(3, 0.05), 0.5);
      IN("#n-e", at(3, 0.2), 0.5, { scale: 0.9, svgOrigin: "1570 490" }, { scale: 1 });
      DRAW("#n-ef", at(3, 0.55), 0.4);
      IN("#n-f", at(3, 0.6), 0.5);
      coins.forEach((c, i) => {
        tl.fromTo(c, { opacity: 0, y: 0 }, { opacity: 1, duration: 0.15 }, at(3, 0.72) + i * 0.1);
        tl.to(c, { y: 200, fill: "#FC6255", opacity: 0, duration: 0.7, ease: "power2.in" }, at(3, 0.72) + i * 0.1 + 0.15);
      });
      // L4 复制交易
      pills.forEach((p, i) => IN(p, at(4, 0.05) + i * 0.12, 0.25, { x: -30 }, { x: 0 }));
      IN("#n-copyt", at(4, 0.3), 0.5);
      // L5 教训一、二
      OUT(["#n-copies", "#n-copyt"], at(5, 0), 0.35);
      tl.to(["#n-a", "#n-c", "#n-e", "#n-f", "#n-ab", "#n-cd", "#n-be", "#n-de", "#n-ef", "#n-title"], { opacity: 0.35, duration: 0.4 }, at(5, 0.02));
      gsap.utils.toArray("#root .n-ring").forEach((r, i) => IN(r, at(5, 0.05) + i * 0.15, 0.4, { scale: 1.4, transformOrigin: "50% 50%" }, { scale: 1, ease: "back.out(2)" }));
      IN("#n-l1", at(5, 0.1), 0.5);
      IN("#n-l2", at(5, 0.6), 0.5);
      tl.to("#n-a", { opacity: 1, duration: 0.3 }, at(5, 0.6));
      // L6 回归测试
      tl.to(["#n-a"], { opacity: 0.35, duration: 0.3 }, at(6, 0));
      tl.to(["#n-c", "#n-de"], { opacity: 1, duration: 0.3 }, at(6, 0.05));
      IN("#n-block", at(6, 0.2), 0.4, { scale: 1.3, svgOrigin: "1265 660" }, { scale: 1 });
      IN("#n-l3", at(6, 0.3), 0.5);

      tl.to("#n-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["nomad"] = tl;
    })();
  </script>
