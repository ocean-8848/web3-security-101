<template>
  <style>

    #root { position: absolute; inset: 0; background: #0f1117; overflow: hidden; }

    #root text { font-family: "NotoSC", sans-serif; }
    #root .h { opacity: 0; }
    #root .dr { stroke-dasharray: 1; stroke-dashoffset: 1; }
  </style>
  <div id="root" data-composition-id="aviation" data-duration="56.58" data-width="1920" data-height="1080">
    <svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
      <g id="a-all">
        <!-- 旧漏洞 + 新环境 -->
        <g id="a-p1">
          <text id="a-t" class="h" x="960" y="170" font-size="48" fill="#e8e6df" text-anchor="middle" font-weight="700">大多数事故 = <tspan fill="#FC6255">旧漏洞</tspan> + <tspan fill="#58C4DD">新环境</tspan></text>
          <circle id="a-bug" class="h" cx="960" cy="330" r="30" fill="#FC6255" />
          <g font-size="34" text-anchor="middle">
            <g class="a-env h"><rect x="160" y="520" width="340" height="180" rx="18" fill="#121a22" stroke="#58C4DD" stroke-width="3" /><text x="330" y="625" fill="#58C4DD">新链</text></g>
            <g class="a-env h"><rect x="580" y="520" width="340" height="180" rx="18" fill="#121a22" stroke="#58C4DD" stroke-width="3" /><text x="750" y="625" fill="#58C4DD">新分叉</text></g>
            <g class="a-env h"><rect x="1000" y="520" width="340" height="180" rx="18" fill="#121a22" stroke="#58C4DD" stroke-width="3" /><text x="1170" y="625" fill="#58C4DD">新版本</text></g>
            <g class="a-env h"><rect x="1420" y="520" width="340" height="180" rx="18" fill="#121a22" stroke="#58C4DD" stroke-width="3" /><text x="1590" y="625" fill="#58C4DD">新组合</text></g>
          </g>
          <g id="a-bugs" fill="#FC6255" class="h">
            <circle cx="330" cy="670" r="14" /><circle cx="750" cy="670" r="14" /><circle cx="1170" cy="670" r="14" /><circle cx="1590" cy="670" r="14" />

        <!-- 航空事故报告 -->
        <g id="a-p2">

            <rect x="260" y="260" width="300" height="380" rx="10" fill="#161a22" stroke="#e8e6df" stroke-opacity=".6" stroke-width="3" />
            <rect x="240" y="280" width="300" height="380" rx="10" fill="#161a22" stroke="#e8e6df" stroke-opacity=".6" stroke-width="3" />
            <rect x="220" y="300" width="300" height="380" rx="10" fill="#161a22" stroke="#e8e6df" stroke-width="3" />
            <text x="370" y="360" font-size="30" fill="#e8e6df" text-anchor="middle" font-weight="700">事故报告</text>
            <g stroke="#6b6f7a" stroke-width="7" stroke-linecap="round"><line x1="260" y1="410" x2="480" y2="410" /><line x1="260" y1="450" x2="440" y2="450" /><line x1="260" y1="490" x2="470" y2="490" /><line x1="260" y1="530" x2="400" y2="530" /></g>
            <text x="370" y="740" font-size="30" fill="#8a8f99" text-anchor="middle">航空业：每一起都公开</text>
          </g>
          <path id="a-arrow" class="dr h" pathLength="1" d="M600 470 L 860 470" fill="none" stroke="#8a8f99" stroke-width="4" />
          <g id="a-pilot" class="h">
            <text x="1040" y="455" font-size="34" fill="#e8e6df" text-anchor="middle">今天的飞行员</text>
            <text x="1040" y="510" font-size="30" fill="#83C167" text-anchor="middle">不再犯七十年代的错误</text>
          </g>

            <rect x="1300" y="300" width="500" height="380" rx="14" fill="#121a22" stroke="#58C4DD" stroke-width="3" />
            <text x="1550" y="360" font-size="32" fill="#58C4DD" text-anchor="middle" font-weight="700">合约的「事故报告」</text>
            <text class="a-src h" x="1550" y="440" font-size="30" fill="#e8e6df" text-anchor="middle">项目复盘</text>
            <text class="a-src h" x="1550" y="500" font-size="30" fill="#e8e6df" text-anchor="middle">安全公司分析</text>
            <text class="a-src h" x="1550" y="560" font-size="30" fill="#e8e6df" text-anchor="middle">链上数据</text>
            <text x="1550" y="740" font-size="30" fill="#83C167" text-anchor="middle">成本最低的安全训练</text>
          </g>
          <!-- 比方不成立 -->
          <g id="a-lim" class="h">
            <text x="370" y="860" font-size="30" fill="#8a8f99" text-anchor="middle">航空：独立机构调查，结论权威</text>
            <text x="1550" y="860" font-size="30" fill="#FF9F43" text-anchor="middle">合约：多由项目方或安全公司发布</text>

        <!-- 六十多起 → 八种模式 -->
        <g id="a-dots"></g>
        <g id="a-labs" font-size="40" text-anchor="middle" font-weight="700"></g>
        <text id="a-only" class="h" x="960" y="1010" font-size="28" fill="#6b6f7a" text-anchor="middle">只用多方公开资料一致的事实 · 点的数量为示意</text>
      </g>
    </svg>
  </div>
  <script>
    (function () {
      const C = /*CUES*/{"d": 56.58, "L": [[0.6, 7.51], [7.96, 14.42], [14.87, 23.82], [24.27, 33.89], [34.34, 47.3], [47.75, 55.48]]}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.35) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.6) => tl.fromTo(s, { strokeDashoffset: 1, opacity: 0 }, { strokeDashoffset: 0, opacity: 1, duration: d, ease: "power2.inOut" }, t);
      const NS = "http://www.w3.org/2000/svg";

      // 64 个事故点，先散开，再聚成 8 簇（固定种子）
      let seed = 5; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      const COLS = ["#58C4DD", "#58C4DD", "#58C4DD", "#58C4DD", "#58C4DD", "#B48EF0", "#B48EF0", "#B48EF0"];
      const CX = (k) => 300 + (k % 4) * 440, CY = (k) => (k < 4 ? 380 : 760);
      const dh = document.querySelector("#a-dots"), D = [];
      for (let i = 0; i < 64; i++) {
        const k = i % 8, c = document.createElementNS(NS, "circle");
        const x0 = 140 + rnd() * 1640, y0 = 160 + rnd() * 780;
        const a = rnd() * Math.PI * 2, r = 30 + rnd() * 60;
        c.setAttribute("cx", x0.toFixed(1)); c.setAttribute("cy", y0.toFixed(1)); c.setAttribute("r", 11); c.setAttribute("fill", "#8a8f99"); c.setAttribute("opacity", "0");
        dh.appendChild(c); D.push({ c, k, dx: CX(k) + Math.cos(a) * r - x0, dy: CY(k) + Math.sin(a) * r * 0.6 - y0 });
      }
      const lh = document.querySelector("#a-labs"), LB = [];
      ["①", "②", "③", "④", "⑤", "⑥", "⑦", "⑧"].forEach((n, k) => {
        const t = document.createElementNS(NS, "text"); t.setAttribute("x", CX(k)); t.setAttribute("y", CY(k) - 110); t.setAttribute("fill", COLS[k]); t.setAttribute("opacity", "0"); t.textContent = n; lh.appendChild(t); LB.push(t);
      });

      // L0 旧漏洞 + 新环境
      IN("#a-t", at(0, 0.05), 0.6, { filter: "blur(6px)" }, { filter: "blur(0px)" });
      IN("#a-bug", at(0, 0.4), 0.4, { scale: 0, svgOrigin: "960 330" }, { scale: 1, ease: "back.out(2)" });
      // L1 四种新环境，旧漏洞落进每一个
      gsap.utils.toArray("#root .a-env").forEach((g, i) => IN(g, at(1, 0.1 + i * 0.15), 0.4, { y: 20 }, { y: 0 }));
      tl.to("#a-bug", { scale: 0.5, opacity: 0, svgOrigin: "960 330", duration: 0.5 }, at(1, 0.75));
      IN("#a-bugs", at(1, 0.75), 0.5, { y: -200 }, { y: 0, ease: "bounce.out", duration: 0.8 });

      // L2 航空事故报告
      tl.to("#a-p1", { opacity: 0, filter: "blur(6px)", duration: 0.4 }, at(2, 0.0));
      IN("#a-rep", at(2, 0.1), 0.6, { y: 20 }, { y: 0 });
      DRAW("#a-arrow", at(2, 0.55), 0.5);
      IN("#a-pilot", at(2, 0.65), 0.5);
      // L3 合约的事故报告
      tl.to("#a-pilot", { opacity: 0, duration: 0.3 }, at(3, 0.0));
      IN("#a-web3", at(3, 0.05), 0.5);
      gsap.utils.toArray("#root .a-src").forEach((t, i) => IN(t, at(3, 0.2 + i * 0.15), 0.4));
      // L4 比方不成立
      IN("#a-lim", at(4, 0.1), 0.6);
      tl.to("#a-web3 rect", { stroke: "#FF9F43", duration: 0.4 }, at(4, 0.45));
      // L5 六十多起 → 八种模式
      tl.to("#a-p2", { opacity: 0, filter: "blur(6px)", duration: 0.4 }, at(5, 0.0));
      D.forEach((o, i) => tl.to(o.c, { opacity: 0.85, duration: 0.2 }, at(5, 0.05) + i * 0.02));
      D.forEach((o) => tl.to(o.c, { x: o.dx, y: o.dy, fill: COLS[o.k], duration: 1.2, ease: "power3.inOut" }, at(5, 0.45)));
      LB.forEach((t, k) => tl.to(t, { opacity: 1, duration: 0.3 }, at(5, 0.6) + k * 0.08));
      IN("#a-only", at(5, 0.7), 0.4);

      tl.to("#a-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["aviation"] = tl;
    })();
  </script>
</template>
