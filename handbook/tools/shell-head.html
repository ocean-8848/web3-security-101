<title>Web3 安全学习手册</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: fixed chapter rail on the left (drawer on phones), one reading column, labs open full-height in place. */
:root {
  --ground: #f6f5f1;
  --paper: #fffefb;
  --ink: #1d1c19;
  --ink-2: #5d5a52;
  --rule: #e4e1d8;
  --tint: #efece4;
  --gold: #b38300;
  --gold-soft: #f8edcc;
  --buy: #0e8f63; --buy-soft: #dcf2e7;
  --sell: #c93246; --sell-soft: #fae1e5;
  --info: #2f66c9; --info-soft: #e3ebf9;
  --warn: #b65f00; --warn-soft: #fbead0;
  --f-display: "Noto Serif SC", "Songti SC", "STSong", serif;
  --f-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --rail: 288px;
  --bar: 52px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #131311; --paper: #1a1a17; --ink: #ebe9e2; --ink-2: #a5a298; --rule: #2f2e29; --tint: #23221e;
    --gold: #f0b90b; --gold-soft: #3a3010;
    --buy: #2ebd85; --buy-soft: #12352a; --sell: #f6465d; --sell-soft: #3d1a20;
    --info: #7ba5f5; --info-soft: #1a2640; --warn: #f0a340; --warn-soft: #3b2a12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #131311; --paper: #1a1a17; --ink: #ebe9e2; --ink-2: #a5a298; --rule: #2f2e29; --tint: #23221e;
  --gold: #f0b90b; --gold-soft: #3a3010;
  --buy: #2ebd85; --buy-soft: #12352a; --sell: #f6465d; --sell-soft: #3d1a20;
  --info: #7ba5f5; --info-soft: #1a2640; --warn: #f0a340; --warn-soft: #3b2a12;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.8; -webkit-font-smoothing: antialiased; }
a { color: var(--info); text-decoration-thickness: 1px; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 4px; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; height: var(--bar); display: flex; align-items: center; gap: 12px; padding-inline: 16px; background: var(--paper); border-bottom: 1px solid var(--rule); }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; text-decoration: none; color: var(--ink); }
.brand b { font-family: var(--f-display); font-weight: 800; font-size: 17px; letter-spacing: .02em; white-space: nowrap; }
.brand .tick { font-family: var(--f-mono); font-size: 11px; color: var(--gold); letter-spacing: .08em; white-space: nowrap; }
.bar .spacer { flex: 1; }
.icon-btn { font: inherit; font-size: 14px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); border-radius: 8px; height: 34px; padding-inline: 10px; cursor: pointer; }
.icon-btn:hover { border-color: var(--gold); }
#menuBtn { display: none; }

/* shell */
.shell { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: calc(100% - var(--bar)); }
.rail { position: sticky; top: calc(var(--bar) + env(safe-area-inset-top, 0px)); height: calc(100vh - var(--bar)); overflow-y: auto; border-right: 1px solid var(--rule); background: var(--paper); padding: 14px 12px 40px; }
.search { width: 100%; font: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--ground); color: var(--ink); }
.group { margin-top: 18px; }
.group h4 { margin: 0 0 4px; padding-inline: 8px; font-size: 11px; font-weight: 600; letter-spacing: .1em; color: var(--ink-2); text-transform: uppercase; }
details.group > summary { list-style: none; cursor: pointer; border-radius: 6px; user-select: none; }
details.group > summary::-webkit-details-marker { display: none; }
details.group > summary:hover { background: var(--tint); }
details.group > summary:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
details.group > summary h4 { display: flex; align-items: center; gap: 6px; margin: 0; padding-block: 4px; }
details.group > summary h4::before { content: ""; flex: none; width: 0; height: 0; border-left: 5px solid currentColor; border-top: 4px solid transparent; border-bottom: 4px solid transparent; transition: transform .15s; }
details.group[open] > summary h4::before { transform: rotate(90deg); }
details.group[open] > summary { margin-bottom: 4px; }
details.part { margin-top: 22px; }
details.part > summary h3 { display: flex; align-items: center; gap: 6px; margin: 0; padding: 6px 8px; font-size: 13px; font-weight: 700; letter-spacing: .04em; color: var(--ink); }
details.part > summary h3::before { content: ""; flex: none; width: 0; height: 0; border-left: 6px solid currentColor; border-top: 5px solid transparent; border-bottom: 5px solid transparent; transition: transform .15s; }
details.part[open] > summary h3::before { transform: rotate(90deg); }
details.part > .part-body { margin-left: 8px; padding-left: 6px; border-left: 1px solid var(--rule); }
details.part > .part-body > .group:first-child, details.part > .part-body > .part-lead { margin-top: 6px; }
.group .gcount { margin-left: auto; font-family: var(--f-mono); font-weight: 400; letter-spacing: 0; color: var(--ink-2); opacity: .7; }
.navlink { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 6px; align-items: baseline; padding: 4px 8px; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 14px; line-height: 1.5; }
.navlink .code { font-family: var(--f-mono); font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.navlink:hover { background: var(--tint); }
.navlink[aria-current="page"] { background: var(--gold-soft); }
.navlink[aria-current="page"] .code { color: var(--gold); font-weight: 600; }

/* reading column */
main { min-width: 0; padding-inline: 16px; }
.doc { max-width: 780px; margin: 0 auto; padding-block: 32px 80px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; color: var(--gold); letter-spacing: .08em; margin-bottom: 6px; }
.doc h2, .doc h3 { scroll-margin-top: calc(var(--bar) + 16px); }
/* 本页目录：宽屏固定在正文右侧；窄屏收进右下角按钮 */
.toc { font-size: 13px; line-height: 1.45; }
.toc-h { font-size: 11px; font-weight: 600; letter-spacing: .1em; color: var(--ink-2); padding: 0 10px 6px; }
.toc-list a { display: block; padding: 4px 10px; border-left: 2px solid var(--rule); color: var(--ink-2); text-decoration: none; }
.toc-list a.l3 { padding-left: 22px; font-size: 12.5px; }
.toc-list a:hover { color: var(--ink); background: var(--tint); }
.toc-list a.on { color: var(--gold); border-left-color: var(--gold); font-weight: 600; }
.toc-fab { position: fixed; right: 16px; bottom: 20px; z-index: 28; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); font: inherit; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.12); cursor: pointer; }
@media (min-width: 1320px) {
  main.has-toc { display: grid; grid-template-columns: minmax(0, 1fr) 236px; column-gap: 24px; }
  main.has-toc .toc { position: sticky; top: calc(var(--bar) + 32px); align-self: start; max-height: calc(100vh - var(--bar) - 56px); overflow-y: auto; padding-block: 32px 16px; }
  .toc-fab { display: none; }
}
@media (max-width: 1319.98px) {
  .toc { position: fixed; right: 16px; bottom: 68px; z-index: 29; width: min(320px, calc(100vw - 32px)); max-height: min(60vh, 520px); overflow-y: auto; padding: 12px 6px; background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
  .toc:not(.open) { display: none; }
}
.doc h1, .doc h2, .doc h3 { font-family: var(--f-display); text-wrap: balance; line-height: 1.35; }
.doc h1 { font-size: 32px; font-weight: 800; margin: 0 0 18px; letter-spacing: .01em; }
.doc h2 { font-size: 23px; font-weight: 800; margin: 48px 0 12px; padding-top: 18px; border-top: 1px solid var(--rule); }
.doc h3 { font-size: 18px; font-weight: 600; margin: 30px 0 8px; }
.doc h4 { font-size: 16px; margin: 22px 0 6px; }
.doc p, .doc li { max-width: 68ch; }
.doc ul, .doc ol { padding-left: 1.4em; }
.doc li { margin: 2px 0; }
.doc strong { font-weight: 650; }
.doc hr { border: 0; border-top: 1px solid var(--rule); margin: 32px 0; }
.doc code { font-family: var(--f-mono); font-size: .86em; background: var(--tint); padding: 1px 5px; border-radius: 4px; }
.code-wrap { overflow-x: auto; background: var(--tint); border-radius: 8px; margin: 14px 0; }
.code-wrap pre { margin: 0; padding: 12px 14px; font-size: 13px; line-height: 1.6; }
.code-wrap code { background: none; padding: 0; }
.table-wrap { overflow-x: auto; margin: 16px 0; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); }
.doc table { border-collapse: collapse; width: 100%; font-size: 14px; line-height: 1.6; }
.doc th, .doc td { padding: 8px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--rule); }
.doc tr:last-child td { border-bottom: 0; }
.doc th { background: var(--tint); font-weight: 600; white-space: nowrap; }
.doc td { font-variant-numeric: tabular-nums; }

blockquote { margin: 16px 0; padding: 10px 16px; border-radius: 8px; background: var(--tint); color: var(--ink); }
blockquote p { margin: 6px 0; }
blockquote.warn { background: var(--warn-soft); }
blockquote.info { background: var(--info-soft); }
blockquote.analogy { background: var(--gold-soft); }
blockquote.deep { background: transparent; border: 1px dashed var(--rule); }

.repo-path { font-family: var(--f-mono); font-size: .86em; color: var(--ink-2); border-bottom: 1px dotted var(--ink-2); cursor: help; }
a.lab-link::after { content: " ▸"; font-size: .8em; color: var(--gold); }

.mmd-wrap { margin: 18px 0; padding: 16px; overflow-x: auto; background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; }
.mmd-wrap pre.mmd { margin: 0; font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); white-space: pre-wrap; }
.mmd-wrap svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
.mmd-wrap.wide svg { max-width: none; }
.mmd-wrap.ready { position: relative; cursor: zoom-in; transition: border-color .15s; }
.mmd-wrap.ready:hover, .mmd-wrap.ready:focus-visible { border-color: var(--gold); }
.mmd-wrap .zoom-chip { position: absolute; top: 8px; right: 8px; padding: 3px 10px; font-size: 12px; line-height: 1.6; border-radius: 999px; background: var(--gold-soft); color: var(--ink); border: 1px solid var(--rule); opacity: .85; pointer-events: none; }
.mmd-wrap.ready:hover .zoom-chip { opacity: 1; border-color: var(--gold); }

/* diagram viewer: full-screen, pan + zoom */
.viewer { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; background: var(--ground); }
.viewer[hidden] { display: none; }
.viewer-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; background: var(--paper); border-bottom: 1px solid var(--rule); }
.viewer-bar .vt { flex: 1 1 200px; min-width: 0; font-family: var(--f-display); font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.viewer-bar .zoomv { font-family: var(--f-mono); font-size: 13px; min-width: 52px; text-align: center; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.viewer-bar .vbtn { font: inherit; font-size: 14px; min-width: 36px; height: 34px; padding-inline: 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); color: var(--ink); cursor: pointer; }
.viewer-bar .vbtn:hover { border-color: var(--gold); }
.viewer-bar .vclose { background: var(--tint); }
.viewer-hint { width: 100%; font-size: 12px; color: var(--ink-2); }
.viewer-port { position: relative; flex: 1; overflow: hidden; cursor: grab; touch-action: none; background:
  radial-gradient(circle, var(--rule) 1px, transparent 1.2px) 0 0 / 22px 22px, var(--ground); }
.viewer-port.dragging { cursor: grabbing; }
.viewer-stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.viewer-stage svg { display: block; max-width: none !important; background: var(--paper); border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
@media (max-width: 600px) { .viewer-hint { display: none; } .viewer-bar .vt { flex-basis: 100%; } }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 56px; }
.pager a { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 10px; text-decoration: none; color: var(--ink); background: var(--paper); min-width: 0; }
.pager a:hover { border-color: var(--gold); }
.pager .k { font-size: 12px; color: var(--ink-2); }
.pager .t { font-weight: 600; font-size: 14px; }
.pager .next { text-align: right; grid-column: 2; }

/* labs */
.labs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 20px; }
.lab-card { display: flex; flex-direction: column; gap: 4px; padding: 14px; border: 1px solid var(--rule); border-radius: 10px; background: var(--paper); text-decoration: none; color: var(--ink); }
.lab-card:hover { border-color: var(--gold); }
.lab-card .from { font-family: var(--f-mono); font-size: 11px; color: var(--gold); }
.lab-card .t { font-weight: 600; }
.labview { display: flex; flex-direction: column; height: calc(100vh - var(--bar)); }
.labhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; padding: 10px 0; }
.labhead h1 { font-family: var(--f-display); font-size: 20px; margin: 0; }
.labhead .muted { font-size: 13px; color: var(--ink-2); }
/* slides player: full screen, opened from the top bar */
.slides { position: fixed; inset: 0; z-index: 90; display: flex; flex-direction: column; background: var(--ground); }
.slides[hidden] { display: none; }
.slides-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: calc(8px + env(safe-area-inset-top, 0px)) 16px 8px; background: var(--paper); border-bottom: 1px solid var(--rule); }
.slides-bar .st { flex: 1 1 220px; min-width: 0; font-family: var(--f-display); font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slides-bar select { font: inherit; font-size: 13.5px; height: 34px; max-width: 220px; padding: 0 8px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); color: var(--ink); }
.slides-tabs { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; overflow: hidden; }
.slides-tabs button { font: inherit; font-size: 13.5px; padding: 5px 14px; border: 0; background: var(--paper); color: var(--ink-2); cursor: pointer; }
.slides-tabs button[aria-selected="true"] { background: var(--ink); color: var(--paper); }
.slides-tabs button[hidden] { display: none; }
.slides-hint { width: 100%; font-size: 12px; color: var(--ink-2); line-height: 1.5; }
.slides-port { flex: 1; min-height: 0; padding: 10px; }
.slides-port iframe { display: block; width: 100%; height: 100%; border: 1px solid var(--rule); border-radius: 10px; background: var(--ground); }
.slides-port iframe[hidden] { display: none; }
body.slides-open { overflow: hidden; }
@media (max-width: 600px) { .slides-hint { display: none; } .slides-bar { gap: 6px; padding-inline: 8px; } .slides-bar .st { flex-basis: 100%; font-size: 14px; } .slides-bar select { flex: 1 1 0; min-width: 0; max-width: none; } .slides-port { padding: 4px; } }
.labframe { flex: 1; width: 100%; border: 1px solid var(--rule); border-radius: 10px 10px 0 0; background: var(--ground); }

.results { margin-top: 10px; }
.result { display: block; padding: 8px; border-radius: 6px; text-decoration: none; color: var(--ink); font-size: 13px; line-height: 1.5; }
.result:hover { background: var(--tint); }
.result b { display: block; font-size: 14px; }
.result span { color: var(--ink-2); }
.result mark { background: var(--gold-soft); color: var(--ink); }

@media (max-width: 900px) {
  #menuBtn { display: inline-block; }
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; z-index: 25; top: calc(var(--bar) + env(safe-area-inset-top, 0px)); left: 0; width: min(88vw, 320px); transform: translateX(-102%); transition: transform .2s ease; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
  body.menu-open .rail { transform: none; }
  .doc h1 { font-size: 26px; }
  .doc h2 { font-size: 20px; }
  .brand .tick { display: none; }
}
@media (prefers-reduced-motion: reduce) { .rail { transition: none; } }

/* learning loop components */
blockquote.reflect { background: var(--info-soft); border-left: 3px solid var(--info); }
blockquote.labcall { background: var(--gold-soft); border-left: 3px solid var(--gold); }
details.predict, .doc details { margin: 14px 0; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); }
.doc details > summary { cursor: pointer; padding: 10px 14px; font-weight: 600; }
.doc details[open] > summary { border-bottom: 1px solid var(--rule); }
.doc details > :not(summary) { margin-inline: 14px; }
.doc details > :last-child { margin-bottom: 12px; }
.loop-card { margin-top: 40px; padding: 14px 16px; border: 1px solid var(--gold); border-radius: 10px; background: var(--paper); }
.loop-card h3 { margin: 0 0 8px; font-size: 16px; }
.loop-card dl { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 4px 10px; margin: 8px 0 0; font-size: 14px; line-height: 1.6; }
.loop-card dt { color: var(--ink-2); }
.loop-card dd { margin: 0; }
.loop-card a { margin-right: 10px; display: inline-block; }

/* interactive checklists */
.doc li.ck-item { list-style: none; margin-left: -1.3em; padding: 3px 6px; border-radius: 6px; cursor: pointer; }
.doc li.ck-item:hover { background: var(--tint); }
.doc li.ck-item > input[type=checkbox] { width: 17px; height: 17px; margin: 0 8px 0 0; vertical-align: -3px; accent-color: var(--gold); cursor: pointer; }
.doc li.ck-item.checked { color: var(--ink-2); }
.doc li.ck-item.checked > input + * , .doc li.ck-item.checked { text-decoration-color: var(--ink-2); }
.ck-prog { display: flex; align-items: center; gap: 10px; margin: 10px 0 4px; font-size: 13px; color: var(--ink-2); }
.ck-prog i { flex: 1; max-width: 220px; height: 6px; border-radius: 3px; background: var(--tint); position: relative; overflow: hidden; }
.ck-prog i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--p); background: var(--gold); }
.ck-prog .ck-reset { font: inherit; font-size: 12px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink-2); border-radius: 6px; padding: 1px 8px; cursor: pointer; }
ul.ck-done + *, ol.ck-done { }

/* code: syntax highlight + copy */
.code-wrap { position: relative; }
.code-wrap .copy-btn { position: absolute; top: 6px; right: 6px; font: inherit; font-size: 12px; line-height: 1.5; padding: 2px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); color: var(--ink-2); cursor: pointer; opacity: .85; }
.code-wrap .copy-btn:hover, .code-wrap .copy-btn:focus-visible { opacity: 1; border-color: var(--gold); color: var(--ink); }
.code-wrap .copy-btn.done { color: var(--buy); border-color: var(--buy); }
.code-wrap .lang-tag { position: absolute; top: 8px; right: 68px; font-family: var(--f-mono); font-size: 11px; color: var(--ink-2); pointer-events: none; }
.code-wrap pre { padding-top: 30px; }
.hljs-keyword, .hljs-built_in, .hljs-selector-tag { color: #8a3ffc; }
.hljs-type, .hljs-class .hljs-title, .hljs-title.class_ { color: #0f6e8c; }
.hljs-title.function_, .hljs-title { color: #2f66c9; }
.hljs-string, .hljs-regexp { color: #0e7a4f; }
.hljs-number, .hljs-literal { color: #b65f00; }
.hljs-comment, .hljs-quote { color: #7d7a70; font-style: italic; }
.hljs-meta, .hljs-attr, .hljs-variable, .hljs-template-variable, .hljs-params { color: #a8326e; }
