<style>
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 4px; }

  .q:last-of-type { border-bottom: 0; }
  .q b { display: block; margin-bottom: 8px; line-height: 1.6; }
  .opts label { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: var(--text); margin: 6px 0; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }
  .opts label input { margin-top: 4px; flex: none; }
  .opts label.right { border-color: var(--buy); background: var(--buy-soft); }
  .opts label.wrong { border-color: var(--sell); background: var(--sell-soft); }
  .exp { display: none; font-size: 13px; line-height: 1.7; margin-top: 8px; padding: 8px 10px; background: var(--surface-2); border-radius: 8px; }
  .done .exp { display: block; }
  .score { font-size: 22px; font-weight: 650; font-family: var(--mono); }
  .tab-pass::after { content: " ✓"; color: var(--buy); }
</style>
</head>

    <p class="small muted" id="desc"></p>
  </div>

  <div class="card" id="quiz"></div>
  <div class="btn-row" style="margin-top:12px">

  </div>
  <div class="card" id="result" style="display:none;margin-top:12px" aria-live="polite"></div>

  function tabs() {
    $('tabs').innerHTML = STAGES.map((s, i) => '<button data-i="' + i + '" class="' + (i === cur ? 'primary ' : '') + (results[i] && results[i].best >= PASS ? 'tab-pass' : '') + '">' + esc(s.name) + '</button>').join('');
    $('desc').textContent = STAGES[cur].desc;
  }
  function render() {
    submitted = false;
    const s = STAGES[cur];
    $('title').textContent = s.name + '（共 ' + s.qs.length + ' 题，通过线 ' + Math.ceil(s.qs.length * PASS) + ' 题）';
    $('quiz').innerHTML = s.qs.map((q, i) => '<div class="q" id="q' + i + '"><b>' + (i + 1) + '. ' + esc(q[0]) + '</b><div class="opts">' + shuffle(q[1].map((o, j) => [o, j])).map(([o, j]) => '<label id="o' + i + '_' + j + '"><input type="radio" name="r' + i + '" value="' + j + '"><span>' + esc(o) + '</span></label>').join('') + '</div><div class="exp">' + esc(q[3]) + ' 相关章节：<a href="../bootcamp/' + B[q[4]][0] + '">' + esc(B[q[4]][1]) + '</a></div></div>').join('');
    $('result').style.display = 'none';
    $('submit').disabled = false;
    tabs();
  }
  function grade() {
    const s = STAGES[cur];
    let ok = 0, miss = 0;
    s.qs.forEach((q, i) => { const c = document.querySelector('input[name=r' + i + ']:checked'); if (!c) miss++; });
    if (miss) { $('result').style.display = 'block'; $('result').textContent = '还有 ' + miss + ' 题未作答。'; return; }
    s.qs.forEach((q, i) => {
      const c = +document.querySelector('input[name=r' + i + ']:checked').value;
      if (c === q[2]) ok++;
      $('o' + i + '_' + q[2]).classList.add('right');
      if (c !== q[2]) $('o' + i + '_' + c).classList.add('wrong');
      $('q' + i).classList.add('done');
      document.querySelectorAll('input[name=r' + i + ']').forEach(x => { x.disabled = true; });
    });
    submitted = true;
    $('submit').disabled = true;
    const pct = ok / s.qs.length, pass = pct >= PASS;
    const prev = results[cur] || { best: 0 };
    results[cur] = { last: pct, best: Math.max(prev.best, pct), date: new Date().toLocaleDateString('sv') };
    save(results);
    $('result').style.display = 'block';
    $('result').innerHTML = '<div class="score">' + ok + ' / ' + s.qs.length + '（' + Math.round(pct * 100) + '%）</div><p><span class="pill ' + (pass ? 'buy' : 'sell') + '">' + (pass ? '通过' : '未通过') + '</span> ' + (pass ? '概念过关。别忘了完成阶段交付物。' : '展开每题解析，回到相关章节后再试。') + '</p>';
    scores(); tabs();
  }
  function scores() {
    $('scores').innerHTML = STAGES.map((s, i) => { const r = results[i]; return '<tr><td>' + esc(s.name) + '</td><td class="num">' + (r ? Math.round(r.last * 100) + '%' : '—') + '</td><td class="num">' + (r ? Math.round(r.best * 100) + '%' : '—') + '</td><td>' + (r ? r.date : '—') + '</td><td>' + (r ? (r.best >= PASS ? '<span class="pill buy">已通过</span>' : '<span class="pill sell">未通过</span>') : '<span class="pill info">未作答</span>') + '</td></tr>'; }).join('');
  }
  $('tabs').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (!b) return; cur = +b.dataset.i; try { localStorage.setItem(KEY + '-cur', String(cur)); } catch (er) {} render(); window.scrollTo(0, 0); });
  $('submit').onclick = grade;
  $('retry').onclick = render;
  $('clear').onclick = () => { results = {}; save(results); scores(); tabs(); };
  document.addEventListener('click', e => { const a = e.target.closest && e.target.closest('a[href]'); if (a && /\.md(#|$)/.test(a.getAttribute('href'))) { e.preventDefault(); window.parent.postMessage({ cexNavMd: a.getAttribute('href') }, '*'); } });
  render(); scores();
})();
</script>
</body>
</html>
