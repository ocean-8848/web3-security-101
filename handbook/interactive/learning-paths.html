  const set = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  let cur = get('w3s-path', 'zero'); if (!PATHS[cur]) cur = 'zero';
  const done = get('w3s-path-done', {});
  function quiz() {
    $('quiz').innerHTML = '<h3>入门诊断</h3>' + Q.map((q, i) => '<div class="q"><b>' + (i + 1) + '. ' + q[0] + '</b><div class="opts">' + q[1].map((o, j) => '<label><input type="radio" name="q' + i + '" value="' + j + '"> <span>' + o[0] + '</span></label>').join('') + '</div></div>').join('') + '<button class="btn" id="go">生成路径</button><p class="small" id="res"></p>';
    $('go').onclick = () => {
      const a = Q.map((q, i) => { const c = document.querySelector('input[name=q' + i + ']:checked'); return c ? q[1][+c.value][1] : null; });
      if (a.some(x => x === null)) { $('res').textContent = '请先回答全部问题。'; return; }
      cur = a[0]; set('w3s-path', cur); render();
      const sc = a[1] + a[2] + a[3];
      const skip = sc >= 5 ? '你的基础较好。可以跳过路径前段的基础章节，从第一个你答不上"先猜再看"的章节开始。' : sc >= 3 ? '按路径顺序学习。遇到熟悉的章节，先做"先猜再看"，答对可以略读。' : '从路径第一章开始。每章做完实验再进入下一章。';
      $('res').textContent = '推荐路径：' + META[cur][0] + '。' + skip;
    };
  }
  function render() {
    $('tabs').innerHTML = Object.keys(PATHS).map(k => '<button class="btn' + (k === cur ? ' primary' : '') + '" data-k="' + k + '">' + META[k][0] + '</button>').join('');
    $('desc').textContent = META[cur][1];
    const L = PATHS[cur], n = L.filter(s => done[s[0]]).length;
    $('fill').style.width = (n / L.length * 100) + '%'; $('prog').textContent = '已完成 ' + n + ' / ' + L.length;
    $('steps').innerHTML = L.map(s => '<li class="' + (done[s[0]] ? 'done' : '') + '"><input type="checkbox" aria-label="标记完成" data-c="' + s[0] + '"' + (done[s[0]] ? ' checked' : '') + '><code>' + s[0] + '</code><a href="../' + s[2] + '">' + s[1] + '</a></li>').join('');
  }
  $('tabs').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) { cur = b.dataset.k; set('w3s-path', cur); render(); } });
  $('steps').addEventListener('change', e => { const c = e.target.dataset.c; if (c) { done[c] = e.target.checked; set('w3s-path-done', done); render(); } });
  document.addEventListener('click', e => { const a = e.target.closest && e.target.closest('a[href]'); if (a && /\.md(#|$)/.test(a.getAttribute('href'))) { e.preventDefault(); window.parent.postMessage({ cexNavMd: a.getAttribute('href') }, '*'); } });
  quiz(); render();
})();
</script>
</body>
</html>
