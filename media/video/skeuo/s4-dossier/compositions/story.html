    (function () {
      const tl = gsap.timeline({ paused: true });
      const q = (s) => document.querySelector(s);

      // ---------- typewriter: split each .tw into per-char spans (deterministic) ----------
      document.querySelectorAll("#st-scene .tw").forEach((el) => {
        const text = el.textContent;
        el.textContent = "";
        for (const c of text) {
          const s = document.createElement("span");
          s.className = "ch";
          s.textContent = c;
          el.appendChild(s);
        }
      });
      const CH = 0.04;
      function type(sel, t) {
        const chars = document.querySelectorAll(sel + " .ch");
        tl.fromTo(chars, { opacity: 0 }, { opacity: 1, duration: 0.001, stagger: CH, ease: "none", immediateRender: false }, t);
        return t + chars.length * CH;
      }
      function draw(sel, t, d) {
        const p = document.querySelectorAll(sel + " path[pathLength]");
        tl.fromTo(p, { opacity: 0 }, { opacity: 1, duration: 0.001, immediateRender: false }, t);
        tl.fromTo(p, { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d || 0.45, ease: "power1.inOut" }, t);

      function write(sel, t, d) {

      // ---------- camera: pure function of time ----------
      const E = gsap.parseEase("power2.inOut");
      const START = { cx: 900, cy: 725, s: 1.0 };
      const MOVES = [
        [3.7, 5.0, { cx: 900, cy: 700, s: 1.12 }, 0],
        [6.6, 7.6, { cx: 2280, cy: 710, s: 0.97 }, 0.06],
        [13.3, 14.4, { cx: 2140, cy: 1800, s: 1.0 }, 0.06],
        [17.2, 18.3, { cx: 3110, cy: 1830, s: 0.95 }, 0.04],
        [20.4, 21.7, { cx: 3150, cy: 1900, s: 1.55 }, 0],
        [22.9, 24.1, { cx: 4270, cy: 1830, s: 0.95 }, 0.12],
        [30.2, 31.4, { cx: 4080, cy: 2920, s: 1.05 }, 0.1],
        [33.6, 34.8, { cx: 4630, cy: 2920, s: 0.92 }, 0],
        [36.7, 38.1, { cx: 900, cy: 1200, s: 0.72 }, 0.4],
        [38.6, 39.7, { cx: 900, cy: 1570, s: 1.0 }, 0],
        [42.9, 44.0, { cx: 900, cy: 1290, s: 0.95 }, 0],
      ];
      function camAt(t) {
        let a = START;
        for (const [t0, t1, b, bump] of MOVES) {
          if (t <= t0) return a;
          if (t < t1) {
            const e = E((t - t0) / (t1 - t0));
            const s = Math.exp(Math.log(a.s) + (Math.log(b.s) - Math.log(a.s)) * e) * (1 - bump * Math.sin(Math.PI * e));
            return { cx: a.cx + (b.cx - a.cx) * e, cy: a.cy + (b.cy - a.cy) * e, s };
          }
          a = b;
        }
        return a;
      }
      function applyCam(t) {
        const c = camAt(t);
        gsap.set("#cam", { x: 960 - c.cx * c.s, y: 470 - c.cy * c.s, scale: c.s, transformOrigin: "0 0" });
      }
      applyCam(0);
      const clock = { t: 0 };
      tl.fromTo(clock, { t: 0 }, { t: 47.16, duration: 47.16, ease: "none", onUpdate: () => applyCam(clock.t) }, 0);

      write("#pr-note2", 22.42, 0.4);

      // ---------- l5 chain result ----------

      tl.fromTo("#ch-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.inOut" }, 27.77);
      write("#ch-new", 28.63, 0.6);

      // ---------- l6 key vs document ----------
      type("#ky-st", 32.53);
      type("#dc-op", 33.95);
      draw("#ln-red", 35.43, 0.55);
      tl.fromTo("#ln-head", { opacity: 0 }, { opacity: 1, duration: 0.001, immediateRender: false }, 35.98);
      write("#dc-note", 35.7, 0.55);

      // ---------- l7 flow sheet ----------
      tl.fromTo("#fl", { y: 0 }, { y: 730, duration: 1.0, ease: "power2.inOut" }, 38.1);
      type("#fl-title", 39.58);
      for (let i = 1; i <= 7; i++) {
        const t = 41.13 + (i - 1) * 0.14;
        tl.fromTo("#fs" + i, { opacity: 0 }, { opacity: 1, duration: 0.001, immediateRender: false }, t);
        if (i > 1) tl.fromTo("#fa" + i, { opacity: 0 }, { opacity: 1, duration: 0.001, immediateRender: false }, t - 0.05);
      }

      tl.fromTo("#fl-title", { opacity: 1 }, { opacity: 0, duration: 0.001, immediateRender: false }, 43.5);
      type("#lb-t", 43.7);
      type("#lb-s", 44.1);

      window.__timelines["story"] = tl;
    })();
