  <script>
    (function () {
      const C = /*CUES*/{"d": 41.2, "L": [[0.6, 2.66], [3.11, 8.92], [9.37, 14.34], [14.79, 26.07], [26.52, 32.88], [33.33, 40.1]]}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);

      // L0 AI 在中间

      IN("#m-mid", at(0, 0.3), 0.5);
      IN("#m-lt", at(0, 0.5), 0.4);
      IN("#m-rt", at(0, 0.6), 0.4);

      // L1 攻击者一边被放大：条从中线向左拉长
      const ls = gsap.utils.toArray("#root .m-l"), lw = gsap.utils.toArray("#root .m-lw");
      ls.forEach((g, i) => {
        const t = at(1, 0.15 + i * 0.25);
        tl.fromTo(g, { opacity: 0 }, { opacity: 1, duration: 0.3 }, t);
        tl.fromTo(g.querySelector(".m-bar"), { attr: { x: 820, width: 80 } }, { attr: { x: 300, width: 600 }, duration: 0.8, ease: "expo.out" }, t + 0.2);
        IN(lw[i], t + 0.5, 0.3);
      });
      IN("#m-note", at(1, 0.4), 0.4);

      // L2 防御者一边
      const rs = gsap.utils.toArray("#root .m-r"), rw = gsap.utils.toArray("#root .m-rw");
      rs.forEach((g, i) => {
        const t = at(2, 0.1 + i * 0.35);
        tl.fromTo(g, { opacity: 0 }, { opacity: 1, duration: 0.3 }, t);
        tl.fromTo(g.querySelector(".m-bar2"), { attr: { width: 80 } }, { attr: { width: 600 }, duration: 0.8, ease: "expo.out" }, t + 0.2);
        IN(rw[i], t + 0.5, 0.3);
      });

      // L3 替代不了 + 早期初筛
      IN("#m-no", at(3, 0.0), 0.4);
      gsap.utils.toArray("#root .m-ni").forEach((t, i) => tl.to(t, { opacity: 1, duration: 0.4 }, at(3, 0.08 + i * 0.2)));
      IN("#m-pipe", at(3, 0.72), 0.6, { y: 20 }, { y: 0 });

      // L4 放大器
      tl.to("#m-sides", { opacity: 0.1, filter: "blur(4px)", duration: 0.5 }, at(4, 0.0));
      IN("#m-end", at(4, 0.1), 0.7, { filter: "blur(10px)" }, { filter: "blur(0px)" });

      // L5 新的只有一件事
      tl.to("#m-end", { y: -100, duration: 0.6, ease: "power2.inOut" }, at(5, 0.0));
      IN("#m-new", at(5, 0.2), 0.6, { y: 20 }, { y: 0 });

      tl.to("#m-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["amplify"] = tl;
    })();
