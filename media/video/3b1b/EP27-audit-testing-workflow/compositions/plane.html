  <script>
    (function () {
      const C = /*CUES*/{"d": 52.65, "L": [[0.6, 6.55], [7.0, 15.62], [16.07, 23.15], [23.6, 33.05], [33.5, 40.13], [40.58, 51.55]]}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.35) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const NS = "http://www.w3.org/2000/svg";

      // 风洞的风线（确定性位置）
      const wind = document.querySelector("#p-wind"), ws = [];
      for (let i = 0; i < 6; i++) {
        const l = document.createElementNS(NS, "line");
        const y = 380 + i * 40, a = (i % 3 - 1) * 30;
        l.setAttribute("x1", 540); l.setAttribute("y1", y - a); l.setAttribute("x2", 600); l.setAttribute("y2", y);
        l.setAttribute("opacity", "0"); wind.appendChild(l); ws.push(l);
      }

      // L0 比方
      IN("#p-t0", at(0, 0.3), 0.6, { filter: "blur(6px)" }, { filter: "blur(0px)" });

      // L1 设计 + 不变量
      IN("#p-h1", at(1, 0.0), 0.4);
      IN("#p-s1", at(1, 0.08), 0.6, { y: 20 }, { y: 0 });
      IN("#p-inv", at(1, 0.5), 0.5);

      // L2 制造 + 风洞
      IN("#p-h2", at(2, 0.0), 0.4);
      IN("#p-s2", at(2, 0.08), 0.6, { y: 20 }, { y: 0 });
      IN("#p-tunnel", at(2, 0.5), 0.4);
      ws.forEach((l, i) => {
        tl.fromTo(l, { opacity: 0, x: -40 }, { opacity: 0.9, x: 40, duration: 0.5, ease: "none" }, at(2, 0.55) + i * 0.1);
        tl.to(l, { opacity: 0, duration: 0.3 }, at(2, 0.55) + i * 0.1 + 0.5);
        tl.fromTo(l, { opacity: 0, x: -40 }, { opacity: 0.9, x: 40, duration: 0.5, ease: "none" }, at(2, 0.55) + 1.2 + i * 0.1);
        tl.to(l, { opacity: 0, duration: 0.3 }, at(2, 0.55) + 1.7 + i * 0.1);
      });

      // L3 认证 = 审计（抽查）
      IN("#p-h3", at(3, 0.0), 0.4);
      IN("#p-s3", at(3, 0.08), 0.6, { y: 20 }, { y: 0 });
      IN("#p-s3t", at(3, 0.3), 0.4);
      IN("#p-check", at(3, 0.5), 0.4, { scale: 1.4, svgOrigin: "1170 440" }, { scale: 1 });
      IN("#p-s3t2", at(3, 0.78), 0.4);

      // L4 运营
      IN("#p-h4", at(4, 0.0), 0.4);
      IN("#p-s4", at(4, 0.08), 0.6, { y: 20 }, { y: 0 });
      tl.fromTo("#p-sweep", { rotation: 0, svgOrigin: "1620 470" }, { rotation: 360, svgOrigin: "1620 470", duration: 3, ease: "none" }, at(4, 0.15));

      // L5 比方不成立处
      tl.to(["#p-s1", "#p-s2", "#p-s3", "#p-s4", "#p-check", "#p-inv", "#p-tunnel", "#p-s3t", "#p-s3t2", "#p-t0"], { opacity: 0.3, duration: 0.5 }, at(5, 0.0));
      gsap.utils.toArray("#root .p-li").forEach((t, i) => IN(t, at(5, [0.1, 0.35, 0.72][i]), 0.5, { y: 20 }, { y: 0 }));

      tl.to("#p-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["plane"] = tl;
    })();
