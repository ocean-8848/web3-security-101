<template>
  <style>
    @font-face { font-family: "NotoSC"; src: url("assets/fonts/noto-sc.woff2") format("woff2"); font-weight: 100 900; }
    #root { position: absolute; inset: 0; background: #0f1117; overflow: hidden; }
    #root svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    #root text { font-family: "NotoSC", sans-serif; }
    #root .mono { font-family: "JetBrains Mono", monospace; }
    #root .h { opacity: 0; }
    #root .dr { stroke-dasharray: 1; stroke-dashoffset: 1; }
  </style>
  <div id="root" data-composition-id="space" data-duration="49.57" data-width="1920" data-height="1080">
    <svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
      <defs><marker id="s-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#FF9F43" /></marker></defs>
      <g id="s-all">
        <text id="s-title" class="h" x="120" y="130" font-size="48" fill="#FF9F43" font-weight="800">① 熵 <tspan fill="#8a8f99" font-weight="400" font-size="36">· 随机性的度量，单位是「位」</tspan></text>

        <!-- 私钥 256 位（紫 = 私钥） -->
        <g id="s-grid"></g>
        <text id="s-glab" class="h" x="520" y="1000" font-size="32" fill="#B48EF0" text-anchor="middle" font-weight="700">私钥：256 位</text>
        <text id="s-glab2" class="h" x="520" y="1000" font-size="32" fill="#8a8f99" text-anchor="middle">256 位，全部由种子决定</text>

        <!-- 32 位种子（橙） -->
        <g id="s-seed"></g>
        <text id="s-slab" class="h" x="200" y="185" font-size="30" fill="#FF9F43" font-weight="700">种子：32 位</text>
        <path id="s-arrow" class="dr h" pathLength="1" d="M860 225 C 930 225, 930 300, 860 320" stroke="#FF9F43" stroke-width="4" fill="none" marker-end="url(#s-ah)" />
        <text id="s-gen" class="h" x="950" y="285" font-size="28" fill="#FF9F43">生成器</text>

        <!-- 右侧：数一数 -->
        <g id="s-n256" class="h">
          <text x="1080" y="360" font-size="30" fill="#8a8f99">256 位全随机：可能的私钥</text>
          <text x="1080" y="440" font-size="60" fill="#B48EF0" font-weight="800">2<tspan dy="-26" font-size="36">256</tspan><tspan dy="26"> ≈ 10</tspan><tspan dy="-26" font-size="36">77</tspan><tspan dy="26" font-size="40" fill="#8a8f99"> 个</tspan></text>
        </g>
        <g id="s-n32" class="h">
          <text x="1080" y="530" font-size="30" fill="#8a8f99">32 位种子：可能的私钥</text>
          <text x="1080" y="610" font-size="60" fill="#FF9F43" font-weight="800">2<tspan dy="-26" font-size="36">32</tspan><tspan dy="26"> ≈ 43 亿</tspan><tspan font-size="40" fill="#8a8f99"> 个</tspan></text>
        </g>
        <text id="s-rate" class="h" x="1080" y="700" font-size="32" fill="#8a8f99">示例速度：每秒试 10 亿个种子</text>
        <text id="s-div" class="h" x="1080" y="790" font-size="52" fill="#e8e6df" font-weight="700">43 亿 ÷ 10 亿 ≈ <tspan fill="#FC6255">4.3 秒</tspan></text>
        <rect id="s-barbg" class="h" x="1080" y="830" width="700" height="34" rx="8" fill="#1c2029" />
        <rect id="s-bar" x="1080" y="830" width="0" height="34" rx="8" fill="#FC6255" />
        <text id="s-ctr" class="h" x="1080" y="910" font-size="30" fill="#8a8f99">已试 <tspan class="mono" id="s-cnum">0</tspan> 个 · <tspan id="s-tnum">0.0</tspan> 秒</text>
        <text id="s-gpu" class="h" x="1080" y="910" font-size="30" fill="#8a8f99">还要从种子算出地址：一张 GPU，几分钟</text>
        <text id="s-rule" class="h" x="1080" y="1000" font-size="40" fill="#83C167" font-weight="700">私钥强度 ≤ 生成它的熵</text>
      </g>
    </svg>
  </div>
  <script>
    (function () {
      const C = /*CUES*/{"d": 49.57, "L": [[0.6, 5.95], [6.4, 15.43], [15.88, 25.84], [26.29, 32.26], [32.71, 37.97], [38.42, 48.47]]}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.35) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAWA = (s, t, d = 0.6) => tl.fromTo(s, { strokeDashoffset: 1, opacity: 0 }, { strokeDashoffset: 0, opacity: 1, duration: d, ease: "power2.inOut" }, t);
      const NS = "http://www.w3.org/2000/svg";
      let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

      // 256 个比特格子
      const grid = document.querySelector("#s-grid"), cells = [];
      for (let i = 0; i < 256; i++) {
        const r = document.createElementNS(NS, "rect");
        r.setAttribute("x", 200 + (i % 16) * 40); r.setAttribute("y", 300 + Math.floor(i / 16) * 40);
        r.setAttribute("width", 34); r.setAttribute("height", 34); r.setAttribute("rx", 5);
        r.setAttribute("fill", rnd() > 0.5 ? "#B48EF0" : "#2a2440"); r.setAttribute("opacity", "0");
        grid.appendChild(r); cells.push(r);
      }
      // 32 个种子格子
      const sh = document.querySelector("#s-seed"), sc = [];
      for (let i = 0; i < 32; i++) {
        const r = document.createElementNS(NS, "rect");
        r.setAttribute("x", 200 + i * 20); r.setAttribute("y", 205); r.setAttribute("width", 17); r.setAttribute("height", 34); r.setAttribute("rx", 3);
        r.setAttribute("fill", rnd() > 0.5 ? "#FF9F43" : "#3a2a14"); r.setAttribute("opacity", "0");
        sh.appendChild(r); sc.push(r);
      }

      // L0 熵
      IN("#s-title", at(0, 0.05), 0.6, { filter: "blur(6px)" }, { filter: "blur(0px)" });
      // L1 256 位私钥：格子逐行出现，比特翻动
      cells.forEach((c, i) => IN(c, at(1, 0.02) + Math.floor(i / 16) * 0.06 + (i % 16) * 0.01, 0.3));
      [0.45, 0.6, 0.75].forEach((f) => {
        cells.forEach((c, i) => { if (rnd() > 0.7) tl.to(c, { fill: rnd() > 0.5 ? "#B48EF0" : "#2a2440", duration: 0.12 }, at(1, f) + (i % 16) * 0.005); });
      });
      IN("#s-glab", at(1, 0.15), 0.4);
      IN("#s-n256", at(1, 0.55), 0.6);

      // L2 32 位种子 → 生成器 → 256 位全由种子决定
      sc.forEach((c, i) => IN(c, at(2, 0.02) + i * 0.02, 0.25));
      IN("#s-slab", at(2, 0.02), 0.4);
      DRAWA("#s-arrow", at(2, 0.2), 0.6);
      IN("#s-gen", at(2, 0.25), 0.4);
      cells.forEach((c, i) => tl.to(c, { fill: c.getAttribute("fill") === "#B48EF0" ? "#6b6f7a" : "#23262e", duration: 0.25 }, at(2, 0.3) + (i % 16) * 0.02 + Math.floor(i / 16) * 0.02));
      OUT("#s-glab", at(2, 0.3), 0.3);
      IN("#s-glab2", at(2, 0.4), 0.4);
      tl.to("#s-n256", { opacity: 0.35, duration: 0.4 }, at(2, 0.55));
      IN("#s-n32", at(2, 0.6), 0.6, { y: 20 }, { y: 0 });

      // L3 示例速度
      IN("#s-rate", at(3, 0.2), 0.5);
      // L4 一步步算：43 亿 ÷ 10 亿 ≈ 4.3 秒
      IN("#s-div", at(4, 0.0), 0.5);
      IN("#s-barbg", at(4, 0.05), 0.3);
      IN("#s-ctr", at(4, 0.05), 0.3);
      const t0 = at(4, 0.1), cn = document.querySelector("#s-cnum"), tn = document.querySelector("#s-tnum"), o = { v: 0 };
      tl.fromTo("#s-bar", { attr: { width: 0 } }, { attr: { width: 700 }, duration: 3.2, ease: "none" }, t0);
      tl.fromTo(o, { v: 0 }, { v: 1, duration: 3.2, ease: "none", onUpdate: () => { cn.textContent = Math.round(o.v * 4294967296).toLocaleString("en-US"); tn.textContent = (o.v * 4.3).toFixed(1); } }, t0);
      // L5 GPU 几分钟；强度 ≤ 熵
      OUT("#s-ctr", at(5, 0.0), 0.3);
      IN("#s-gpu", at(5, 0.05), 0.4);
      IN("#s-rule", at(5, 0.55), 0.6, { filter: "blur(6px)" }, { filter: "blur(0px)" });
      tl.to(cells, { opacity: 0.5, duration: 0.4 }, at(5, 0.55));

      tl.to("#s-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["space"] = tl;
    })();
  </script>
</template>
