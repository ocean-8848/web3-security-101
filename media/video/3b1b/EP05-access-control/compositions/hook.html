  <script>

      const C = /*CUES*/{"d": 30.88, "L": [[0.6, 6.7], [7.15, 12.04], [12.49, 19.26], [19.71, 25.49], [25.94, 29.78]]}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.35) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAWA = (s, t, d = 0.6) => tl.fromTo(s, { strokeDashoffset: 1, opacity: 0 }, { strokeDashoffset: 0, opacity: 1, duration: d, ease: "power2.inOut" }, t);
      const NS = "http://www.w3.org/2000/svg";
      const wl = document.querySelector("#h-wl"), W = [];
      for (let i = 0; i < 6; i++) {
        const x = 360 + i * 240;
        const g = document.createElementNS(NS, "g"); g.setAttribute("opacity", "0");

        wl.appendChild(g); W.push(g);
      }

      // L0 初始化库合约
      IN("#h-date", at(0, 0.0), 0.5);
      IN("#h-lib", at(0, 0.1), 0.6, { y: 20 }, { y: 0 });
      W.forEach((g, i) => IN(g, at(0, 0.25) + i * 0.08, 0.4));
      IN("#h-user", at(0, 0.4), 0.5);
      DRAWA("#h-a1", at(0, 0.6), 0.5);
      IN("#h-a1t", at(0, 0.62), 0.3);
      IN("#h-own", at(0, 0.82), 0.4, { scale: 1.3, svgOrigin: "960 218" }, { scale: 1 });
      // L1 kill
      DRAWA("#h-a2", at(1, 0.1), 0.5);
      IN("#h-a2t", at(1, 0.12), 0.3);
      tl.to("#h-libr", { stroke: "#FC6255", duration: 0.3 }, at(1, 0.5));
      IN("#h-x", at(1, 0.55), 0.3, { scale: 1.4, svgOrigin: "960 385" }, { scale: 1 });
      tl.to("#h-lib", { opacity: 0.3, duration: 0.5 }, at(1, 0.7));
      // L2 钱包失去逻辑，资金冻结

        tl.to(g.querySelector(".h-ln"), { stroke: "#FC6255", strokeDasharray: "8 8", duration: 0.3 }, at(2, 0.05) + i * 0.08);
        tl.to(g.querySelector(".h-wr"), { stroke: "#6b6f7a", fill: "#16181d", duration: 0.4 }, at(2, 0.2) + i * 0.08);
      });
      IN("#h-amt", at(2, 0.5), 0.5, { scale: 1.2, svgOrigin: "960 905" }, { scale: 1 });
      // L3 没有破解密码，只是没有权限检查
      IN("#h-nocr", at(3, 0.05), 0.4);
      IN("#h-nock", at(3, 0.45), 0.5, { x: 20 }, { x: 0 });
      // L4 问题
      tl.to(["#h-date", "#h-user", "#h-a1", "#h-a1t", "#h-a2", "#h-a2t", "#h-own", "#h-wl", "#h-amt", "#h-nocr"], { opacity: 0.2, duration: 0.4 }, at(4, 0.0));
      IN("#h-q", at(4, 0.05), 0.6, { filter: "blur(8px)" }, { filter: "blur(0px)" });
      tl.to("#h-all", { opacity: 0, filter: "blur(6px)", duration: 0.6, ease: "power2.in" }, at(4, 0.45));
      IN("#h-pin", at(4, 0.5), 0.6, { scale: 1.5, svgOrigin: "330 112" }, { scale: 1 });
      OUT("#h-pin", C.d - 0.4, 0.3);
      window.__timelines["hook"] = tl;
