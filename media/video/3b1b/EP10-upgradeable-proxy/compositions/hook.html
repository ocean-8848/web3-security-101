<template>

  </style>
  <div id="root" data-composition-id="hook" data-duration="35.18" data-width="1920" data-height="1080">
    <svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
      <defs><marker id="h-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8a8f99" /></marker></defs>
      <g id="h-all">

        <!-- 桥合约（资金 = 金） -->
        <g id="h-vault" class="h">
          <rect x="1100" y="300" width="600" height="420" rx="22" fill="#1a1708" stroke="#F0B90B" stroke-width="4" />
          <text x="1400" y="370" font-size="38" fill="#F0B90B" text-anchor="middle" font-weight="700">桥合约里的资金</text>
          <g fill="#F0B90B">
            <circle class="h-coin" cx="1250" cy="470" r="24" /><circle class="h-coin" cx="1325" cy="470" r="24" /><circle class="h-coin" cx="1400" cy="470" r="24" /><circle class="h-coin" cx="1475" cy="470" r="24" /><circle class="h-coin" cx="1550" cy="470" r="24" />
            <circle class="h-coin" cx="1250" cy="545" r="24" /><circle class="h-coin" cx="1325" cy="545" r="24" /><circle class="h-coin" cx="1400" cy="545" r="24" /><circle class="h-coin" cx="1475" cy="545" r="24" /><circle class="h-coin" cx="1550" cy="545" r="24" />
            <circle class="h-coin" cx="1250" cy="620" r="24" /><circle class="h-coin" cx="1325" cy="620" r="24" /><circle class="h-coin" cx="1400" cy="620" r="24" /><circle class="h-coin" cx="1475" cy="620" r="24" /><circle class="h-coin" cx="1550" cy="620" r="24" />
          </g>
        </g>
        <text id="h-amount" class="h" x="1400" y="830" font-size="88" fill="#F0B90B" text-anchor="middle" font-weight="800">≈ <tspan id="h-num">0.0</tspan> 亿美元</text>

        <!-- 一次升级（代码 = 蓝） -->
        <g id="h-up" class="h">
          <rect x="200" y="300" width="580" height="420" rx="22" fill="#121a22" stroke="#58C4DD" stroke-width="4" />
          <text x="490" y="370" font-size="38" fill="#58C4DD" text-anchor="middle" font-weight="700">此前的一次升级</text>
          <text class="mono" x="260" y="480" font-size="36" fill="#e8e6df">initialize(</text>
          <text class="mono" x="300" y="545" font-size="36" fill="#e8e6df">root = <tspan id="h-zero" fill="#FF9F43">0x00</tspan></text>
          <text class="mono" x="260" y="610" font-size="36" fill="#e8e6df">)</text>
        </g>
        <text id="h-upt" class="h" x="490" y="790" font-size="34" fill="#FF9F43" text-anchor="middle">可信根 = 全零</text>
        <path id="h-arrow" class="dr h" pathLength="1" d="M790 510 L 1088 510" stroke="#8a8f99" stroke-width="4" fill="none" marker-end="url(#h-ah)" />

        <!-- 被复制的交易 -->
        <g id="h-copies"></g>
        <text id="h-copyt" class="h" x="1400" y="960" font-size="34" fill="#FC6255" text-anchor="middle">复制同一笔交易 · 只换收款地址（地址为示意）</text>

        <!-- 判断：代码 vs 参数 -->
        <text id="h-codeok" class="h" x="490" y="270" font-size="34" fill="#83C167" text-anchor="middle" font-weight="700">升级代码：可以没有错</text>
        <ellipse id="h-ring" class="h" cx="494" cy="533" rx="58" ry="34" fill="none" stroke="#FC6255" stroke-width="5" />
        <text id="h-parambad" class="h" x="490" y="880" font-size="40" fill="#FC6255" text-anchor="middle" font-weight="700">错的是一个参数</text>
      </g>

      <!-- 金库上的维修门 -->
      <g id="h-door">
        <rect id="h-big" class="h" x="660" y="300" width="600" height="440" rx="26" fill="#1a1708" stroke="#F0B90B" stroke-width="5" />
        <g id="h-gate" class="h">
          <rect x="1100" y="470" width="110" height="200" rx="8" fill="#121a22" stroke="#58C4DD" stroke-width="4" />
          <circle cx="1180" cy="575" r="11" fill="#FF9F43" />
          <text x="1155" y="720" font-size="30" fill="#58C4DD" text-anchor="middle">维修门</text>

        <text id="h-q" class="h" x="960" y="900" font-size="64" fill="#e8e6df" text-anchor="middle" font-weight="700">维修门的<tspan fill="#FF9F43">钥匙</tspan>，在谁手里？</text>
      </g>
      <g id="h-pin" class="h">
        <rect x="80" y="70" width="600" height="84" rx="14" fill="none" stroke="#FF9F43" stroke-width="3" stroke-dasharray="10 8" />
        <text x="380" y="125" font-size="34" fill="#e8e6df" text-anchor="middle">维修门的<tspan fill="#FF9F43">钥匙</tspan>在谁手里？</text>
      </g>
    </svg>
  </div>
  <script>
    (function () {
      const C = /*CUES*/{"d": 35.18, "L": [[0.6, 6.0], [6.45, 12.04], [12.49, 19.62], [20.07, 25.28], [25.73, 34.08]]}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.35) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.6) => tl.fromTo(s, { strokeDashoffset: 1, opacity: 0 }, { strokeDashoffset: 0, opacity: 1, duration: d, ease: "power2.inOut" }, t);

      // 被复制的交易卡片（收款地址各不相同，示意）
      const NS = "http://www.w3.org/2000/svg", host = document.querySelector("#h-copies"), cards = [];
      const rc = ["0x…a1", "0x…7c", "0x…e4", "0x…19", "0x…b8", "0x…3f", "0x…d2", "0x…60"];
      rc.forEach((r, i) => {
        const g = document.createElementNS(NS, "g");
        g.setAttribute("opacity", "0");
        const x = 1090 + (i % 4) * 160, y = 760 + Math.floor(i / 4) * 80;
        g.innerHTML = `<rect x="${x}" y="${y}" width="150" height="60" rx="10" fill="#1f1214" stroke="#FC6255" stroke-width="3" />` +
          `<text class="mono" x="${x + 75}" y="${y + 41}" font-size="28" fill="#FC6255" text-anchor="middle">${r}</text>`;
        host.appendChild(g); cards.push(g);
      });

      // L0 资金被提走
      IN("#h-date", at(0, 0), 0.5);
      IN("#h-vault", at(0, 0.05), 0.8, { y: 20 }, { y: 0 });
      IN("#h-amount", at(0, 0.45), 0.5);
      const n = { v: 0 }, num = document.querySelector("#h-num");
      tl.fromTo(n, { v: 0 }, { v: 1.9, duration: 1.6, ease: "power2.out", onUpdate: () => { num.textContent = n.v.toFixed(1); } }, at(0, 0.45));
      gsap.utils.toArray("#root .h-coin").forEach((c, i) =>
        tl.to(c, { x: 360 + (i % 5) * 20, y: (i % 3 - 1) * 50, fill: "#FC6255", opacity: 0, duration: 0.8, ease: "power3.in" }, at(0, 0.5) + i * 0.07));

      // L1 一次升级，可信根 = 全零
      IN("#h-up", at(1, 0.0), 0.7, { y: 20 }, { y: 0 });
      DRAW("#h-arrow", at(1, 0.35), 0.6);
      tl.fromTo("#h-zero", { fill: "#e8e6df" }, { fill: "#FF9F43", duration: 0.4 }, at(1, 0.7));
      IN("#h-upt", at(1, 0.75), 0.5);

      // L2 交易被复制
      OUT("#h-amount", at(2, 0.0), 0.3);
      cards.forEach((g, i) => IN(g, at(2, 0.08) + i * 0.32, 0.3, { x: -40 }, { x: 0 }));
      IN("#h-copyt", at(2, 0.5), 0.5);

      // L3 代码可以没错，错的是参数
      tl.to(["#h-vault", "#h-copies", "#h-copyt", "#h-date", "#h-arrow", "#h-upt"], { opacity: 0.2, duration: 0.5 }, at(3, 0));
      IN("#h-codeok", at(3, 0.1), 0.5);
      IN("#h-ring", at(3, 0.55), 0.4, { scale: 1.4, svgOrigin: "494 533" }, { scale: 1, ease: "back.out(2)" });
      IN("#h-parambad", at(3, 0.6), 0.5);

      // L4 维修门与问题
      tl.to("#h-all", { opacity: 0, filter: "blur(6px)", duration: 0.5, ease: "power2.in" }, at(4, 0));
      IN("#h-big", at(4, 0.08), 0.7, { scale: 0.9, svgOrigin: "960 520" }, { scale: 1 });
      IN("#h-gate", at(4, 0.22), 0.5, { x: 40 }, { x: 0 });
      IN("#h-q", at(4, 0.4), 0.6, { filter: "blur(8px)" }, { filter: "blur(0px)" });
      tl.to("#h-door", { opacity: 0, filter: "blur(6px)", duration: 0.5, ease: "power2.in" }, at(4, 0.8));
      IN("#h-pin", at(4, 0.8) + 0.15, 0.5, { scale: 1.5, svgOrigin: "380 112" }, { scale: 1 });
      OUT("#h-pin", C.d - 0.45, 0.35);
      window.__timelines["hook"] = tl;
    })();
  </script>
