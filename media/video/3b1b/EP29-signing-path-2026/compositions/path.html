<template>
  <style>
    @font-face { font-family: "NotoSC"; src: url("assets/fonts/noto-sc.woff2") format("woff2"); font-weight: 100 900; }
    #root { position: absolute; inset: 0; background: #0f1117; overflow: hidden; }
    #root svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    #root text { font-family: "NotoSC", sans-serif; }
    #root .h { opacity: 0; }
    #root .dr { stroke-dasharray: 1; stroke-dashoffset: 1; }
  </style>
  <div id="root" data-composition-id="path" data-duration="36.5" data-width="1920" data-height="1080">
    <svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="p-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8a8f99" /></marker>
      </defs>
      <g id="p-all">
        <!-- 换一个问题 -->
        <g id="p-q1" class="h">
          <text x="960" y="250" font-size="44" fill="#6b6f7a" text-anchor="middle">谁拿着<tspan fill="#B48EF0">钥匙</tspan>？</text>
          <line id="p-q1x" x1="820" y1="235" x2="1100" y2="235" stroke="#6b6f7a" stroke-width="4" />
        </g>
        <text id="p-q2" class="h" x="960" y="340" font-size="56" fill="#FF9F43" text-anchor="middle" font-weight="700">谁决定钥匙盖在什么文件上？</text>
        <text id="p-title" class="h" x="960" y="200" font-size="56" fill="#e8e6df" text-anchor="middle" font-weight="800">签名路径</text>

        <g id="p-arrows" fill="none" stroke="#8a8f99" stroke-width="3"></g>
        <g id="p-nodes"></g>
        <circle id="p-tx" class="h" cx="180" cy="420" r="14" fill="#F0B90B" />

        <!-- 数据源 RPC -->
        <g id="p-rpc" class="h">
          <rect x="1110" y="770" width="220" height="100" rx="16" fill="#161a22" stroke="#e8e6df" stroke-opacity=".6" stroke-width="3" />
          <text x="1220" y="815" font-size="30" fill="#e8e6df" text-anchor="middle">数据源</text>
          <text x="1220" y="852" font-size="28" fill="#8a8f99" text-anchor="middle">RPC 节点</text>
        </g>
        <path id="p-rpca" class="dr h" pathLength="1" d="M1220 765 L 1220 582" stroke="#8a8f99" stroke-width="3" fill="none" marker-end="url(#p-ah)" />

        <text id="p-trust" class="h" x="960" y="980" font-size="40" fill="#FF9F43" text-anchor="middle" font-weight="700">每个箭头：下游相信上游已经检查过</text>
      </g>
    </svg>
  </div>
  <script>
    (function () {
      const C = /*CUES*/{"d": 36.5, "L": [[0.6, 6.86], [7.31, 14.03], [14.48, 22.96], [23.41, 28.52], [28.97, 35.4]]}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.35) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.5) => tl.fromTo(s, { strokeDashoffset: 1, opacity: 0 }, { strokeDashoffset: 0, opacity: 1, duration: d, ease: "power2.inOut" }, t);

      // 七个环节（与 breaks 场景同一布局）
      const NS = "http://www.w3.org/2000/svg";
      const N = [["① 业务意图", "提现单"], ["② 请求构造", "账本/后台"], ["③ 风控审批", ""], ["④ 显示解码", ""], ["⑤ 签名", "MPC/HSM/多签"], ["⑥ 广播", ""], ["⑦ 链上状态", "余额/代码/权限"]];
      const X = (i) => 70 + i * 260, nodes = [], arrows = [];
      N.forEach(([a, b], i) => {
        const g = document.createElementNS(NS, "g"); g.setAttribute("opacity", "0");
        const col = i === 4 ? "#B48EF0" : "#e8e6df";
        g.innerHTML = `<rect x="${X(i)}" y="450" width="220" height="130" rx="16" fill="#161a22" stroke="${col}" stroke-opacity="${i === 4 ? 1 : 0.6}" stroke-width="3" />` +
          `<text x="${X(i) + 110}" y="${b ? 505 : 525}" font-size="30" fill="${col}" text-anchor="middle" font-weight="700">${a}</text>` +
          (b ? `<text x="${X(i) + 110}" y="548" font-size="28" fill="#8a8f99" text-anchor="middle">${b}</text>` : "");
        document.querySelector("#p-nodes").appendChild(g); nodes.push(g);
        if (i < 6) {
          const p = document.createElementNS(NS, "path");
          p.setAttribute("d", `M${X(i) + 222} 515 L ${X(i) + 256} 515`); p.setAttribute("pathLength", "1");
          p.setAttribute("class", "dr h"); p.setAttribute("marker-end", "url(#p-ah)");
          document.querySelector("#p-arrows").appendChild(p); arrows.push(p);
        }
      });
      const NODE = (g, t) => IN(g, t, 0.45, { scale: 0.85, transformOrigin: "50% 50%" }, { scale: 1, ease: "expo.out" });
      const MOVE = (i, t, d = 0.45) => tl.to("#p-tx", { attr: { cx: X(i) + 110 }, duration: d, ease: "power2.inOut" }, t);

      // L0 换一个问题
      IN("#p-q1", at(0, 0.05), 0.5);
      tl.fromTo("#p-q1x", { attr: { x2: 820 } }, { attr: { x2: 1100 }, duration: 0.4 }, at(0, 0.35));
      IN("#p-q2", at(0, 0.45), 0.6, { filter: "blur(8px)" }, { filter: "blur(0px)" });

      // L1 签名路径：从业务意图开始
      OUT(["#p-q1", "#p-q2"], at(1, 0), 0.4);
      IN("#p-title", at(1, 0.1), 0.6, { filter: "blur(8px)" }, { filter: "blur(0px)" });
      NODE(nodes[0], at(1, 0.55));
      IN("#p-tx", at(1, 0.75), 0.3, { scale: 0, svgOrigin: "180 420" }, { scale: 1 });

      // L2 其余六个环节，金点一路走过去
      const T = [0.0, 0.14, 0.28, 0.45, 0.62, 0.76];
      T.forEach((f, i) => { DRAW(arrows[i], at(2, f), 0.3); NODE(nodes[i + 1], at(2, f) + 0.15); MOVE(i + 1, at(2, f) + 0.25); });

      // L3 数据源
      NODE("#p-rpc", at(3, 0.25));
      DRAW("#p-rpca", at(3, 0.45), 0.5);

      // L4 每个箭头都是一次信任传递
      OUT("#p-tx", at(4, 0), 0.3);
      arrows.forEach((a, i) => tl.to(a, { stroke: "#FF9F43", strokeWidth: 4, duration: 0.25 }, at(4, 0.05) + i * 0.18));
      tl.to("#p-rpca", { stroke: "#FF9F43", strokeWidth: 4, duration: 0.25 }, at(4, 0.05) + 6 * 0.18);
      IN("#p-trust", at(4, 0.3), 0.6);

      tl.to(["#p-title", "#p-trust"], { opacity: 0, duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to(arrows.concat(["#p-rpca"]), { stroke: "#8a8f99", strokeWidth: 3, duration: 0.4 }, C.d - 0.5);
      window.__timelines["path"] = tl;
    })();
  </script>
</template>
