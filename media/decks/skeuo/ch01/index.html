。顺序本身，也可以被利用。", "这张图也有局限。它没画链本身的共识和节点。", "链被攻破，或者节点数据有误，合约写得再对也没用。"], "section": "攻击面地图", "k": 79.77}, {"seg": "3", "t0": 79.77, "t1": 98.67, "title": "六大类：控制流与权限", "points": ["控制流：外部调用让攻击者插队执行，比如重入", "权限：缺少修饰器、合约未初始化、私钥泄露"], "notes": ["沿着这张图，可以把漏洞归成六大类。", "第一类，控制流。外部调用让攻击者插队执行，比如重入。", "第二类，权限。不该调用的人调用了，比如缺少修饰器、合约未初始化、私钥泄露。"], "section": "攻击面地图", "k": 98.67}, {"seg": "3", "t0": 98.67, "t1": 112.95, "title": "数学与数据可信度", "points": ["数学：溢出、精度损失、舍入方向", "数据可信度：现货价格预言机、签名重放"], "notes": ["第三类，数学。数字算错了，比如溢出、精度损失、舍入方向。", "第四类，数据可信度。合约相信了可以被操纵的数据，比如现货价格预言机、签名重放。"], "section": "攻击面地图", "k": 112.95}, {"seg": "3", "t0": 112.95, "t1": 128.51, "title": "经济设计与系统运营", "points": ["经济设计：代码按规格执行，但规格本身可被套利", "系统与运营：跨链验证、多签私钥、前端篡改、社会工程"], "notes": ["第五类，经济设计。代码按规格执行，但规格本身可以被套利。", "第六类，系统与运营。代码之外的环节失守，比如跨链验证、多签私钥、前端篡改、社会工程。"], "section": "攻击面地图", "k": 128.51}, {"seg": "3", "t0": 128.51, "t1": 157.62, "title": "真实事故往往几类叠加", "points": ["2023 年 Euler：业务逻辑缺陷加闪电贷放大", "第六类拆两块：链与读链方式；人、设备和流程", "社工常是入口；AI 是攻防两边的放大器"], "notes": ["真实事故往往是几类叠加。2023 年的 Euler，就是业务逻辑缺陷，加上闪电贷放大。", "第六类，又可以拆成两块。一块是链本身，和你读链的方式。另一块是人、设备和流程。", "社工常常是入口，私钥或者前端是落点。AI 不是独立的攻击面，而是攻防两边的放大器。"], "section": "攻击面地图", "k": 137.56}, {"seg": "4", "t0": 0.0, "t1": 25.79, "title": "早期：代码漏洞为主", "points": ["数字来自公开报道和安全公司年度统计，事发时美元估值，均为约数", "2016 年 The DAO 因重入损失约 6000 万美元", "编译器和库成熟后，重入、溢出这类漏洞少了"], "notes": ["六大类里，钱到底丢在哪儿？我们看损失的变化。", "先说口径。下面的数字来自公开报道和安全公司的年度统计，按事发时的美元估值，都是约数。", "2016 年，The DAO 因为重入，损失约 6000 万美元。", "那几年多是重入、溢出这类代码漏洞。编译器和库成熟以后，这类漏洞少了。"], "section": "损失往哪走", "k": 11.3}, {"seg": "4", "t0": 25.79, "t1": 48.69, "title": "大额损失转向运营", "points": ["2022 年 Ronin 跨链桥约 6.2 亿美元：验证者私钥", "2024 年 DMM Bitcoin 约 3.05 亿美元：假招聘入口", "2025 年 Bybit 约 15 亿美元：前端和签名界面"], "notes": ["2022 年，Ronin 跨链桥损失约 6.2 亿美元，原因是验证者私钥。", "2024 年，DMM Bitcoin 损失约 3.05 亿美元。入口是假招聘，落点是供应商的终端。", "2025 年，就是开头的 Bybit，约 15 亿美元，出在前端和签名界面。"], "section": "损失往哪走", "k": 42.09}, {"seg": "4", "t0": 48.69, "t1": 60.33, "title": "Binance 热钱包事件", "points": ["2026 年 10 月，项目方口径约 63.4 亿美元", "按这个口径，超过此前任何单起事故的 4 倍"], "notes": ["2026 年 10 月，Binance 热钱包损失约 63.4 亿美元。这是项目方的口径。", "按这个口径，它超过此前任何单起事故的 4 倍。"], "section": "损失往哪走", "k": 54.99}, {"seg": "4", "t0": 60.33, "t1": 90.46, "title": "趋势与仍在的数学漏洞", "points": ["最大损失从代码漏洞转向跨链桥和运营安全", "私钥、多签、前端、社工、内部人：审计覆盖不到", "Balancer V2 舍入方向出错，约 9480 万美元（项目方）"], "notes": ["趋势很清楚。最大的损失，从代码漏洞，转向了跨链桥和运营安全。", "私钥、多签、前端、社工、内部人。代码审计，覆盖不到这些环节。", "但数学类漏洞并没有消失。2025 年的 Balancer V2，在舍入方向上出了错。", "项目方口径约 9480 万美元，早期报道约 1.28 亿。成熟的协议，也会在这里出错。"], "section": "损失往哪走", "k": 66.88}, {"seg": "5", "t0": 0.0, "t1": 18.97, "title": "威胁建模", "points": ["写代码之前，列出攻击者能控制的输入、路径和想要的结果", "核心问题：攻击者能控制什么？"], "notes": ["入口这么多，怎么系统地去想？办法是威胁建模。", "威胁建模，就是在写代码之前，列出攻击者能控制的输入、能触发的路径、想得到的结果。", "核心只有一个问题：攻击者能控制什么？"], "section": "攻击者能做什么", "k": 0.8}, {"seg": "5", "t0": 18.97, "t1": 36.49, "title": "默认攻击者能做到", "points": ["用任意参数调用任意公开函数", "部署自己的合约，让你的合约调用它（恶意代币、回调）", "在一笔交易里借到巨额资金"], "notes": ["对任何合约，都先默认攻击者能做到这些事。", "用任意参数，调用任意一个公开函数。", "部署自己的合约，让你的合约去调用它，比如恶意代币、恶意回调。", "在一笔交易里，借到巨额资金。"], "section": "攻击者能做什么", "k": 36.49}, {"seg": "5", "t0": 36.49, "t1": 54.89, "title": "攻击者还能做到", "points": ["在内存池未确认交易前后插入自己的交易", "绕过函数直接转入代币；读取包括 private 在内的全部存储", "在另一条链或合约上重放你签过的消息"], "notes": ["看到内存池里还没确认的交易，在它前后插入自己的交易。", "不经过你的函数，直接往你的合约里转入代币。", "读取你合约的全部存储，包括标成 private 的变量。", "在另一条链或另一个合约上，重放你签过的消息。"], "section": "攻击者能做什么", "k": 54.89}, {"seg": "5", "t0": 54.89, "t1": 60.35, "title": "先猜：private 变量", "points": ["管理员密码存在 private 变量里", "攻击者读得到吗？"], "notes": ["举个例子。管理员密码存在 private 变量里，攻击者读得到吗？"], "section": "攻击者能做什么", "k": 60.35}, {"seg": "5", "t0": 60.35, "t1": 67.05, "title": "答案：读得到", "points": ["private 只限制别的合约调用这个变量", "不隐藏链上数据"], "notes": ["读得到。private 只限制别的合约来调用这个变量，不隐藏链上数据。"], "section": "攻击者能做什么", "k": 67.05}, {"seg": "5", "t0": 67.05, "t1": 84.73, "title": "攻击者通常做不到", "points": ["伪造别人的签名，除非私钥泄露或验签写错", "修改已确认的区块，除非链的共识被攻破", "冒充调用者，除非代码用错了身份判断方式"], "notes": ["反过来，攻击者通常做不到三件事。", "伪造别人的签名，除非私钥泄露，或者验签写错了。", "修改已经确认的区块，除非链的共识被攻破。", "让合约以为调用者是别人，除非你的代码用错了身份判断的方式。"], "section":
