<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MEV 与签名安全：顺序可以被买，签名可以被重放</title>
<style>
:root {
  --ground: #f6f5f1; --paper: #fffefb; --ink: #1d1c19; --ink-2: #5d5a52; --rule: #e4e1d8; --tint: #efece4;
  --gold: #b38300; --gold-soft: #f8edcc; --accent: #1d93ba; --accent-soft: #e1f1f7;
  --f-display: "Noto Serif SC", "Songti SC", "STSong", serif;
  --f-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --ground: #131311; --paper: #1a1a17; --ink: #ebe9e2; --ink-2: #a5a298; --rule: #2f2e29; --tint: #23221e;
    --gold: #f0b90b; --gold-soft: #3a3010; --accent: #6cc7e0; --accent-soft: #15303a; color-scheme: dark; }
}
:root[data-theme="dark"] { --ground: #131311; --paper: #1a1a17; --ink: #ebe9e2; --ink-2: #a5a298; --rule: #2f2e29; --tint: #23221e;
  --gold: #f0b90b; --gold-soft: #3a3010; --accent: #6cc7e0; --accent-soft: #15303a; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 6px; }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--ground); }
.top { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--rule); background: var(--paper); min-width: 0; }
.top .t { flex: 1; min-width: 0; }
.top .eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; color: var(--gold); }
.top h1 { margin: 0; font-family: var(--f-display); font-size: 16px; font-weight: 800; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn { height: 34px; padding: 0 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); cursor: pointer; white-space: nowrap; font-size: 14px; }
.btn:hover { border-color: var(--gold); }
.btn[aria-pressed="true"] { background: var(--gold-soft); border-color: var(--gold); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn:disabled { opacity: .4; cursor: default; }

.body { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; }
.stagewrap { min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 14px; }
.screen { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 100%; overflow: hidden; border-radius: 12px; background: #efebe3;
  box-shadow: 0 1px 0 var(--rule), 0 8px 28px rgba(60, 50, 30, .14); cursor: pointer; touch-action: pan-y; user-select: none; }
.screen iframe { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; transform-origin: 0 0; visibility: hidden; pointer-events: none; }
.screen iframe.on { visibility: visible; }
.screen .still { position: absolute; inset: 0; background-repeat: no-repeat; background-color: #efebe3; }
.screen.live .still { visibility: hidden; }
.screen .wait { position: absolute; left: 12px; bottom: 12px; padding: 4px 12px; border-radius: 999px; color: #fff; font-size: 13px; background: rgba(28, 28, 28, .72); }
.btn.play { border-color: var(--accent); color: var(--accent); }
.screen .wait[hidden] { display: none; }

.side { min-height: 0; overflow-y: auto; border-left: 1px solid var(--rule); background: var(--paper); padding: 18px 20px 24px; }
.sec { font-size: 12px; color: var(--accent); font-weight: 600; letter-spacing: .04em; }
.side h2 { margin: 4px 0 12px; font-family: var(--f-display); font-size: 22px; font-weight: 800; line-height: 1.4; text-wrap: balance; }
.side ul { margin: 0; padding: 0; list-style: none; }
.side li { position: relative; padding: 6px 0 6px 18px; border-top: 1px solid var(--rule); }
.side li:first-child { border-top: 0; }
.side li::before { content: ""; position: absolute; left: 2px; top: 16px; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
.notes { margin-top: 18px; border: 1px solid var(--rule); border-radius: 8px; }
.notes > summary { cursor: pointer; padding: 8px 12px; font-size: 13px; font-weight: 600; color: var(--ink-2); list-style: none; }
.notes > summary::-webkit-details-marker { display: none; }
.notes > summary::before { content: "▸ "; }
.notes[open] > summary::before { content: "▾ "; }
.notes ol { margin: 0; padding: 4px 14px 10px 32px; font-size: 14px; color: var(--ink-2); }
.notes li { border: 0; padding: 2px 0; }
.notes li::before { display: none; }

.ctrl { display: flex; align-items: center; gap: 8px; padding: 8px 14px calc(8px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--rule); background: var(--paper); flex-wrap: wrap; }
.count { font-family: var(--f-mono); font-size: 13px; color: var(--ink-2); min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
.prog { flex: 1 1 240px; display: flex; gap: 3px; align-items: center; height: 30px; min-width: 160px; }
.prog .grp { display: flex; gap: 2px; flex: var(--n) 1 0; }
.prog .grp + .grp { margin-left: 6px; }
.prog button { flex: 1; height: 8px; padding: 0; border: 0; border-radius: 3px; background: var(--tint); cursor: pointer; }
.prog button.seen { background: var(--gold-soft); }
.prog button.cur { background: var(--gold); }
.prog button:hover { outline: 1px solid var(--gold); }
.speed { height: 34px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); padding: 0 6px; font-size: 13px; }

/* fullscreen: picture fills, text sits on the right */
.app:fullscreen .body { grid-template-columns: minmax(0, 1fr) 380px; }
.app:fullscreen .top { display: none; }

@media (max-width: 960px), (max-aspect-ratio: 4/3) {
  .body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .stagewrap { padding: 10px 10px 0; }
  .screen { max-height: none; }
  .side { border-left: 0; border-top: 0; background: var(--ground); padding: 12px 14px 20px; }
  .side h2 { font-size: 19px; margin-bottom: 8px; }
  .hide-narrow { display: none; }
  .app:fullscreen .body { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .top { padding: 6px 10px; }
  .top h1 { font-size: 14px; }
  .ctrl { gap: 6px; padding-inline: 10px; }
  .prog { order: -1; flex-basis: 100%; }
  .btn { padding: 0 10px; }
}
</style>
</head>

<div class="app" id="app">
  <header class="top">
    <div class="t"><div class="eyebrow" id="eyebrow">拟物化知识讲解</div><h1 id="title"></h1></div>

  </nav>
</div>

  var D = {"chapter": "s09", "title": "MEV 与签名安全：顺序可以被买，签名可以被重放", "segs": 6, "slides": [{"seg": "1", "t0": 0.0, "t1": 20.19, "title": "滑点 5%：最少 19000", "points": ["用 10 个 ETH 换 USDC，现价 1 ETH = 2000 USDC（示例）", "滑点设成 5%，最少拿到 19000 USDC", "少于这个数，交易就回滚"], "notes": ["你在一个去中心化交易所，用 10 个 ETH 换 USDC。", "池子现价，1 个 ETH 换 2000 USDC。这是示例。", "你把滑点设成 5%。", "意思是，最少拿到 19000 USDC。少于这个数，交易就回滚。"], "section": "宽松的滑点", "k": 16.3}, {"seg": "1", "t0": 20.19, "t1": 31.33, "title": "交易被夹在中间", "points": ["交易先进入公开的内存池排队", "有人在打包之前读到了它", "把你的交易夹在自己的两笔交易中间"], "notes": ["交易发出去，先进入公开的内存池，排队等着打包。", "有人在打包之前，读到了它。", "他把你的交易，夹在自己的两笔交易中间。"], "section": "宽松的滑点", "k": 20.99}, {"seg": "1", "t0": 31.33, "t1": 36.45, "title": "先猜一道题", "points": ["你最少收到多少？", "他能让你收到更少吗？"], "notes": ["先猜一道题。", "你最少收到多少？他能让你收到更少吗？"], "section": "宽松的滑点", "k": 36.45}, {"seg": "1", "t0": 36.45, "t1": 58.59, "title": "按最差价格成交", "points": ["最少 19000，他不能让你更少，否则回滚、他也赚不到", "他把价格推到刚好够 19000 的位置", "滑点设 5%，就可能真的付 5%"], "notes": ["你最少收到 19000。他不能让你更少。", "低于这个数，你的交易回滚，他也赚不到钱。", "所以，他会把价格推到刚好够 19000 的位置。", "你的交易没有失败。它只是按你允许的最差价格，成交了。", "滑点设 5%，就可能真的付 5%。"], "section": "宽松的滑点", "k": 49.75}, {"seg": "1", "t0": 58.59, "t1": 69.48, "title": "顺序与签名", "points": ["交易在打包前是公开的，顺序由别人决定", "签名用过之后仍然存在，能否再用取决于你签了什么"], "notes": ["交易在打包之前是公开的，顺序由别人决定。", "签名在用过之后仍然存在。能不能再用，取决于你签了什么。"], "section": "宽松的滑点", "k": 67.39}, {"seg": "2", "t0": 0.0, "t1": 33.21, "title": "MEV：排序权可以被购买", "points": ["最大可提取价值：靠安排、插入或排除交易拿到的额外收益", "搜索者捆绑交易交给构建者，构建者把区块卖给提议者", "这叫提议者与构建者分离"], "notes": ["先说一个词：MEV，最大可提取价值。", "它指的是，区块生产者或者搜索者，通过安排交易顺序、插入或排除交易，拿到的额外收益。", "搜索者，是专门寻找这类机会，把交易捆成一组提交的人或程序。", "搜索者把捆绑包交给区块构建者，构建者再把整个区块，卖给提议者。", "这叫提议者与构建者分离。结果是，排序权可以被购买。"], "section": "被买走的顺序", "k": 31.8}, {"seg": "2", "t0": 33.21, "t1": 47.23, "title": "形态一：抢跑", "points": ["攻击者排在你前面", "机器人复制你的谜题答案，出更高小费先成交"], "notes": ["MEV 有三种形态。", "第一种，抢跑：攻击者排在你前面。", "比如一道谜题，第一个提交答案的人领奖。机器人复制你的答案，出更高的小费，先成交。"], "section": "被买走的顺序", "k": 47.23}, {"seg": "2", "t0": 47.23, "t1": 66.59, "title": "形态二三：三明治与尾随", "points": ["三明治：攻击者先买、你再买、攻击者最后卖，利用你的滑点容忍度", "尾随：排在你后面，吃掉留下的套利或清算机会", "尾随通常没有直接的受害者"], "notes": ["第二种，三明治：攻击者先买，你再买，攻击者最后卖。", "他利用的，是你设定的滑点容忍度。", "第三种，尾随：攻击者排在你后面，吃掉你的交易留下的套利或清算机会。", "尾随通常没有直接的受害者。"], "section": "被买走的顺序", "k": 66.59}, {"seg": "2", "t0": 66.59, "t1": 78.35, "title": "三明治：捆成一包", "points": ["你的交易进入公开内存池", "搜索者捆成一包：自己买入、你的交易、自己卖出", "构建者按这个顺序打包"], "notes": ["回到三明治，拆开看。", "你的交易进入公开内存池。", "搜索者发现它，捆成一包：自己买入，你的交易，自己卖出。", "构建者按这个顺序打包。"], "section": "被买走的顺序", "k": 78.35}, {"seg": "2", "t0": 78.35, "t1": 95.31, "title": "最小输出决定被夹多狠", "points": ["搜索者先买推高价格，你刚好按最小输出成交", "搜索者再卖回去，赚走中间的利润", "滑点设得越宽，被夹得越狠"], "notes": ["搜索者先买，把价格推高。", "你按更坏的价格成交，刚好满足最小输出。", "搜索者再卖回去，赚走中间的利润。", "他最多能赚多少，由你的最小输出决定。滑点设得越宽，被夹得越狠。"], "section": "被买走的顺序", "k": 85.4}, {"seg": "2", "t0": 95.31, "t1": 119.36, "title": "比方：喊出最高出价", "points": ["举牌前大声说出自己的最高出价", "旁人抢先低价买下，再加价转卖给你", "不成立处：链上你看不到谁插了队，只看到成交价偏低"], "notes": ["打个比方。你在拍卖会上举牌之前，大声说出了自己的最高出价。", "旁边的人抢先用低一点的价格买下，再加价转卖给你。", "比喻在这里不成立：拍卖会上，你能看到谁插了队。", "链上的三明治，和你的交易在同一个区块里。普通用户往往只看到，成交价比预期低。"], "section": "被买走的顺序", "k": 119.36}, {"seg": "3", "t0": 0.0, "t1": 29.13, "title": "用户、前端、合约三层", "points": ["用户：滑点合理，大额走私有交易通道（如 Flashbots Protect）", "前端：默认滑点保守，按池子深度计算", "合约：交换函数都接受最小输出和截止时间"], "notes": ["怎么防？分四层。", "用户这一层，把滑点设得合理。大额交易，走私有交易通道，比如 Flashbots Protect 一类的服务。", "交易不进公开内存池，搜索者在打包之前，就看不到它。", "前端这一层，默认滑点要保守，按池子的深度来计算。", "合约这一层，所有交换函数，都要接受最小输出和截止时间两个参数。"], "section": "防夹与排序", "k": 29.13}, {"seg": "3", "t0": 29.13, "t1": 53.45, "title": "合约里的常见错误", "points": ["在合约内部用现货价算最小输出，同一区块就能被推高", "把最小输出写成 0，等于接受任何价格", "金库、自动复投、清算合约常犯这个错误"], "notes": ["常见的错误，是在合约内部，用现货价算出最小输出。", "那个现货价，在同一个区块里就能被推高。按它算出的保护，等于没有保护。", "更糟的写法，是把最小输出直接写成 0。", "这等于告诉所有人：我接受任何价格。金库、自动复投合约、清算合约，常犯这个错误。"], "section": "防夹与排序", "k": 53.45}, {"seg": "3", "t0": 53.45, "t1": 72.97, "title": "协议设计：提交揭示与批量拍卖", "points": ["提交揭示：先交答案哈希，下一阶段再公开", "承诺必须绑定发送者地址，否则机器人复制即可揭示", "批量拍卖：同一批订单按统一价格清算"], "notes": ["协议设计这一层，有两种做法。", "一是提交揭示：先提交答案的哈希，下一阶段再公开答案。", "这个承诺，必须绑定发送者的地址。不然，机器人复制你的承诺，也能完成揭示。", "二是批量拍卖：同一批订单，按统一价格清算。"], "section": "防夹与排序", "k": 66.75}, {"seg": "3", "t0": 72.97, "t1": 91.39, "title": "BNB Chain：三明治依然存在", "points": ["验证者轮流出块，2026 年 1 月出块间隔缩短到 0.45 秒", "抢跑窗口更短", "仍有公开内存池和构建者市场"], "notes": ["顺序由谁决定，每条链也不一样。", "BNB Chain，验证者轮流出块。2026 年 1 月，出块间隔缩短到 0.45 秒。", "抢跑的窗口更短，但它有公开内存池和构建者市场，三明治依然存在。"], "section": "防夹与排序", "k": 91.39}, {"seg": "3", "t0": 91.39, "t1": 103.41, "title": "TRON：不能出价插队", "points": ["27 个超级代表轮流出块", "按官方文档，没有优先费", "但出块的人仍然可以决定顺序"], "notes": ["TRON，27 个超级代表轮流出块。", "按 TRON 官方文档，它没有优先费，不能靠出更高的价格插队。", "但出块的人，仍然可以决定顺序。"], "section": "防夹与排序", "k": 100.94}, {"seg": "3", "t0": 103.41, "t1": 121.14, "title": "Mantle：排序权集中", "points": ["只有一个中心化排序器", "L2BEAT：运营者可以抢跑用户交易，提取 MEV", "没有公开内存池，不等于没有 MEV"], "notes": ["Mantle，只有一个中心化排序器。", "L2BEAT 列出的风险是：运营者可以抢跑用户交易，提取 MEV。", "没有公开内存池，不等于没有 MEV。", "它只是把排序权，从市场集中到一个运营者手里。"], "section": "防夹与排序", "k": 121.14}, {"seg": "4", "t0": 0.0, "t1": 21.03, "title": "一份签名能用几次", "points": ["很多操作在链下签名，再交给合约验证", "permit、元交易、订单簿挂单、桥验证者签名、空投凭证"], "notes": ["再看另一半：签名。", "很多操作不在链上发起，而是在链下签名，再交给合约验证。", "免 gas 授权 permit、元交易、订单簿挂单、跨链桥验证者签名、空投领取凭证，都是这样。", "问题是，一份签名，能被用几次？"], "section": "签名五字段", "k": 17.8}, {"seg": "4", "t0": 21.03, "t1": 42.07, "title": "比方：没写细节的支票", "points": ["没写日期、收款银行、支票编号", "拿到的人可以复印很多份，去每家银行各兑一次", "不完全成立处：银行会记下兑过的支票，合约不会，除非代码让它记"], "notes": ["打个比方。你签了一张支付 100 元的支票。", "没写日期，没写收款银行，没写支票编号。", "拿到它的人，可以复印很多份，去每一家银行各兑一次。", "比喻在这里不完全成立：银行会自己记下兑过的支票。合约不会，除非代码让它记。"], "section": "签名五字段", "k": 42.07}, {"seg": "4", "t0": 42.07, "t1": 57.93, "title": "五个字段：nonce 与链 ID", "points": ["缺 nonce：同一份签名可在同一合约反复提交", "缺链 ID：签名在分叉链和多链部署上同样有效"], "notes": ["一份安全的签名，要绑定五个字段。", "第一，nonce，一次性编号。缺了它，同一份签名可以在同一个合约反复提交。", "第二，链 ID。缺了它，签名在分叉链和多链部署上同样有效。"], "section": "签名五字段", "k": 55.37}, {"seg": "4", "t0": 57.93, "t1": 81.87, "title": "合约地址、截止时间、意图", "points": ["缺合约地址：同一代码部署两次，两个合约都有效", "缺截止时间：签名永久有效", "缺类型哈希：给 A 函数签的数据被拿去调用 B 函数"], "notes": ["第三，合约地址。缺了它，同一份代码部署两次，签名在两个合约都有效。", "第四，截止时间。缺了它，签名永久有效。你改主意以后，它照样能被使用。", "第五，函数意图，也就是类型哈希。缺了它，给 A 函数签的数据，会被拿去调用 B 函数。"], "section": "签名五字段", "k": 81.87}, {"seg": "4", "t0": 81.87, "t1": 97.59, "title": "先猜一道题", "points": ["领取凭证绑定了 nonce，没绑定链 ID", "同一合约同一地址，部署在以太坊和 BNB Chain", "以太坊用过之后，还能在 BNB Chain 领取吗？"], "notes": ["先猜一道题。", "一张领取凭证，绑定了 nonce，没有绑定链 ID。", "同一份合约，用相同的地址，部署在以太坊和 BNB Chain。", "凭证在以太坊用过之后，还能在 BNB Chain 领取吗？"], "section": "签名五字段", "k": 97.59}, {"seg": "4", "t0": 97.59, "t1": 128.32, "title": "能：用 EIP-712 解决", "points": ["两条链 nonce 各自计数，摘要也完全相同", "EIP-712：名称、版本、链 ID、合约地址合成域分隔符，结构合成类型哈希", "后四个字段一次解决；nonce 合约自己维护，每用一次加一"], "notes": ["能。两条链上的 nonce 各自计数，BNB Chain 上还是 0。", "摘要里没有链 ID，两条链算出的摘要完全相同。", "解决办法是 EIP-712。", "它把名称、版本、链 ID、合约地址，合成一个域分隔符。", "再把消息的结构，合成类型哈希。", "用对 EIP-712，后四个字段一次解决。nonce 还要合约自己维护，每用一次，加一。"], "section": "签名五字段", "k": 119.64}, {"seg": "5", "t0": 0.0, "t1": 17.97, "title": "陷阱一：ecrecover 返回零地址", "points": ["无效签名不报错，返回零地址", "管理员地址没初始化默认是零，任何无效签名都能通过"], "notes": ["字段齐了，验签的代码，还有三个经典陷阱。", "第一，ecrecover 遇到无效签名，不会报错，而是返回零地址。", "如果管理员地址没有初始化，它默认就是零。任何一个无效签名，都能通过。"], "section": "签名的陷阱", "k": 5.8}, {"seg": "5", "t0": 17.97, "t1": 38.79, "title": "陷阱二：签名可塑性", "points": ["同一条消息存在两份都有效的签名", "拿签名本身标记已使用，翻转一个数值就成新签名", "用 nonce 或消息哈希做标记，用 OpenZeppelin ECDSA 一类库"], "notes": ["第二，签名可塑性：同一条消息，存在两份都有效的签名。", "如果合约拿签名本身，标记已使用，翻转签名里的一个数值，就成了一份新签名。", "修复是，用 nonce 或消息哈希做标记，再用拒绝这种翻转的库，比如 OpenZeppelin 的 ECDSA。"], "section": "签名的陷阱", "k": 38.79}, {"seg": "5", "t0": 38.79, "t1": 61.61, "title": "陷阱三：编码碰撞", "points": ["紧凑编码：ab 加 c 和 a 加 bc 结果相同", "签多个动态类型时，用标准编码", "合约钱包没有私钥，要用 ERC-1271 校验"], "notes": ["第三，编码碰撞。紧凑编码会把相邻的动态数据，直接拼在一起。", "ab 加 c，和 a 加 bc，结果完全相同。签多个动态类型时，用标准编码。", "还有一点。合约钱包没有私钥，要用 ERC-1271 的接口校验，不能只靠 ecrecover。"], "section": "签名的陷阱", "k": 61.61}, {"seg": "5", "t0": 61.61, "t1": 82.73, "title": "permit：抢跑型拒绝服务", "points": ["别人从内存池复制你交易里的 permit 签名，抢先单独提交", "你的交易因 nonce 已用而回滚", "修复：try catch 包住 permit，失败后检查授权额度是否已足够"], "notes": ["再看 permit 的两面。", "一面是抢跑型的拒绝服务。你提交的交易里，带着 permit 签名。", "别人从内存池复制这份签名，抢先单独提交。你的交易因为 nonce 已用，回滚。", "修复是，把 permit 包在 tr   var S = D.slides, N = S.length, KEY = 'deck-' + D.chapter;
